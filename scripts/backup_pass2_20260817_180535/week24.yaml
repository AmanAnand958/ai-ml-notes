    time: 45 mins
    prompt_html: |-
      <p><strong>
              Generate a synthetic dataset where a feature's mean shifts by 2 standard deviations. Use Evidently to detect it.
             </strong></p>
    done_when: 'Your Task 1: Simulate Drift implementation runs without errors. All assertions in the solution pass. You can
