  flashcards:
  - front: 'Core concept: What is the significance of Airflow DAG in ML Workflow Orchestration with Apache Airflow?'
    back: Directed Acyclic Graph. Defines tasks and their dependencies in a pipeline. No cycles allowed.
  - front: Airflow Operator?
    back: A template for a task. PythonOperator runs Python, BashOperator runs shell, and there are 100+ community operators
      (S3, Slack, etc).
  - front: Managed Airflow?
    back: Amazon MWAA, Google Cloud Composer, Astronomer. Use these in production instead of self-hosted Airflow.
  - front: How is ML Workflow Orchestration with Apache Airflow tested and validated in industrial ML pipelines (Day 174)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.allclose at 1e-5), and unit
      tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling ML Workflow Orchestration with Apache Airflow in
      distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Heavy Computation in Airflow Top-Level Code'
    description: Never execute `pd.read_csv()` or training loops in the top-level Python script of an Airflow DAG file. The
      Airflow Scheduler parses files every 30 seconds; heavy top-level code will freeze the scheduler.
