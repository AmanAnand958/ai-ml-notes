  quizzes:
  - question: What is the difference between Data Drift (Covariate Shift) and Concept Drift in production ML systems?
    options:
    - letter: A
      text: Data Drift changes the input feature distribution P(X); Concept Drift changes the statistical relationship between
        fe...
      is_correct: true
      id: a
    - letter: B
      text: Data Drift occurs only in computer vision; Concept Drift occurs in NLP
      is_correct: false
      id: b
    - letter: C
      text: Data Drift is caused by network latency; Concept Drift is caused by GPU memory bugs
      is_correct: false
      id: c
    - letter: D
      text: There is no mathematical difference
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Data drift is a change in inputs P(X), while concept drift is a shift in the underlying mapping
      P(Y|X).
    wrong_fb: ❌ Incorrect. Covariate shift is P(X) distribution change; Concept drift is P(Y|X) relationship change.
    correct: a
  - question: Which statistical test is best suited for detecting data drift on continuous numeric features with non-normal
      distributions?
    options:
    - letter: A
      text: Chi-Square Test
      is_correct: false
      id: a
    - letter: B
      text: Kolmogorov-Smirnov (KS) Test or Population Stability Index (PSI)
      is_correct: true
      id: b
    - letter: C
      text: Exact String Equality
      is_correct: false
      id: c
    - letter: D
      text: MD5 Checksum
      is_correct: false
      id: d
    correct_fb: ✅ Correct! The two-sample KS test compares cumulative distribution functions without assuming normality.
    wrong_fb: ❌ Incorrect. The KS test and PSI quantify empirical continuous distribution divergence.
    correct: b
