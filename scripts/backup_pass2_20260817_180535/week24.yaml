    qid: q171_3
    options:
    - letter: A
      text: A centralized model repository that versions models and tracks transitions across stages (e.g. Development ➔ Staging
        ...
      is_correct: true
      id: a
    - letter: B
      text: A marketplace where users buy and sell models for money.
      is_correct: false
      id: b
    - letter: C
      text: A tool that deletes old models automatically.
      is_correct: false
      id: c
    - letter: D
      text: A Python package for training linear regressions.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! The Model Registry provides collaborative model governance, versioning, automated promotion gates,
      and lineage tracking.
    wrong_fb: ❌ Incorrect. The Model Registry formalizes model governance by tracking version stages and release approvals.
    correct: a
  - num_str: QUESTION 4 OF 4
    question: Why should large model weights never be logged directly to the tracking server's SQL database?
    qid: q171_4
    options:
    - letter: A
      text: It causes severe database bloat, connection timeouts, and locking contention; large files must be stored in object
        st...
      is_correct: true
      id: a
    - letter: B
      text: Because SQL databases only support English text.
      is_correct: false
      id: b
    - letter: C
      text: Because model weights lose precision in SQL.
      is_correct: false
      id: c
    - letter: D
      text: Because SQL databases delete large files automatically.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Relational databases are optimized for structured tabular metadata, not multi-gigabyte binary model
      checkpoint transfers.
    wrong_fb: ❌ Incorrect. Storing tensor checkpoints in SQL degrades query performance; object stores are designed for high-throughput
      binary storage.
    correct: a
