  flashcards:
  - front: 'Core concept: What is the significance of MLOps Loop in Capstone: End-to-End Enterprise MLOps Pipeline?'
    back: Data → Train → Evaluate → Deploy → Monitor → Drift → Retrain. This cycle never ends in production.
  - front: Continuous Training (CT)?
    back: Automatically retraining models when drift is detected or on a schedule, without manual intervention.
  - front: 'Core concept: What is the significance of Model Card in Capstone: End-to-End Enterprise MLOps Pipeline?'
    back: 'Documentation for a deployed model: training data, metrics, intended use, limitations. Required for responsible
      AI.'
  - front: 'How is Capstone: End-to-End Enterprise MLOps Pipeline tested and validated in industrial ML pipelines (Day 177)?'
    back: Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.allclose at 1e-5), and unit
      tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Capstone: End-to-End Enterprise MLOps Pipeline
      in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
