  flashcards:
  - front: 'Core concept: What is the significance of Model Routing in Cloud Cost
      Optimization for LLMs?'
    back: Dynamically selecting a cheap model for simple queries and an expensive
      model only for complex ones.
  - front: Context Window Bloat?
    back: Passing far more retrieved chunks than needed, wasting input tokens and
      money with minimal quality gain.
  - front: 'Core concept: What is the significance of tiktoken in Cloud Cost Optimization
      for LLMs?'
    back: OpenAI's official tokenizer library. Use it to estimate token counts before
      sending API calls.
  - front: How is Cloud Cost Optimization for LLMs tested and validated in industrial
      ML pipelines (Day 168)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical
      tolerances (np.allclose at 1e-5), and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Cloud Cost
      Optimization for LLMs in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation,
      resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
