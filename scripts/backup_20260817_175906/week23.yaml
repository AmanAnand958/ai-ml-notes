    </p>\n<div class=\"math-block\">\n<span class=\"desc\">Core Mathematical Formulation\
    \ for Azure OpenAI Service:</span>\n<span class=\"formula\">\n$$\\mathcal{L}_{\\\
    text{system}} = \\alpha \\cdot \\mathcal{L}_{\\text{primary}}(x, \\theta) + \\\
    beta \\cdot \\Omega(\\theta) + \\frac{\\gamma}{K} \\sum_{k=1}^K \\text{LatencyPenalty}(k)$$\n\
    </span>\n<span class=\"desc\">Where $\\alpha, \\beta, \\gamma$ are multi-objective\
    \ weighting coefficients balancing model precision, regularization stability,\
    \ and hardware execution constraints.</span>\n</div>\n\n<h3 class=\"sh3\">2. Architecture\
    \ & Design Trade-off Matrix</h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
