      \ max_instances: int = <span class=\"num\">10</span>) -&gt; int:\n    scaling_ratio\
      \ = current_invocations_per_instance / <span class=\"fn\">max</span>(<span class=\"\
      num\">1.0</span>, target_invocations)\n    target = <span class=\"fn\">int</span>(np.<span\
      \ class=\"fn\">ceil</span>(current_instances * scaling_ratio))\n<span class=\"\
      kw\">return</span> <span class=\"fn\">max</span>(min_instances, <span class=\"\
      fn\">min</span>(max_instances, target))\n\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">\"Scaled Instances (High Traffic 150 inv/inst):\"</span>, <span\
