    done_when: When secrets retrieval passes unit tests and rotation triggers seamlessly
      via simulated Secrets Manager rotation step.
    git_cmd: 'git add secrets_manager/ rotate_lambda.py &amp;&amp; git commit -m "feat(day):
      day169: kms secret rotation setup"'
    sol_id: sol-w23d169t1
    solution_title: rotate_lambda.py
    solution_code: |-
      # AWS Secrets Manager Automated Rotation Lambda
      import boto3
      import json

      def rotate_secret(secret_id, step):
          """Rotates API key credentials securely in KMS"""
          client = boto3.client("secretsmanager")
          if step == "createSecret":
              new_key = "sec_" + boto3.client("kms").generate_random(NumberOfBytes=32)["Plaintext"].hex()
              client.put_secret_value(SecretId=secret_id, SecretString=json.dumps({"API_KEY": new_key}))
          return True
    solution_lang: python
    time_minutes: 30
