    question: How does Hypothetical Document Embeddings (HyDE) work in query transformation?
    qid: q141_1
    options:
    - letter: A
      text: An LLM generates a hypothetical answer to the user's query, and the embedding
        of that hypothetical text is used to se...
      is_correct: true
      id: a
    - letter: B
      text: The user is required to write a 500-word answer before searching.
      is_correct: false
      id: b
    - letter: C
      text: The database randomly deletes 50% of the documents.
      is_correct: false
      id: c
    - letter: D
      text: It translates the query into binary machine code.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! HyDE leverages the fact that a generated hypothetical document
      (even with hallucinations) shares more vector space similarity with the real
      answer documents than a short, vague user query does.
    wrong_fb: ❌ Incorrect. HyDE (Gao et al.) generates a hypothetical answer via LLM,
      then embeds that synthetic document to retrieve real passages with matching
      conceptual structures.
    correct: a
