    - letter: B
      text: For simple single-fact lookups (e.g. 'What is the capital of France?').
      is_correct: false
      id: b
    - letter: C
      text: When the vector database is completely empty.
      is_correct: false
      id: c
    - letter: D
      text: When running on low-battery mobile devices.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Sub-query decomposition splits compound questions into
      independent sub-tasks ('What was Apple 2023 revenue?' and 'What was Microsoft
      2023 revenue?'), retrieving precise context for each.
    wrong_fb: ❌ Incorrect. Sub-query decomposition is designed for complex comparative
