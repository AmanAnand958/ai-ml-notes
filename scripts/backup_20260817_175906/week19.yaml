      >compute_idf</span>(<span class=\"kw\">self</span>, word: str) - float:\n  \
      \      df = <span class=\"kw\">self</span>.doc_freqs.<span class=\"fn\">get</span>(word,\
      \ <span class=\"num\">0</span>)\n<span class=\"kw\">return</span> math.<span\
      \ class=\"fn\">log</span>(<span class=\"num\">1.0</span> + (<span class=\"kw\"\
      >self</span>.N - df + <span class=\"num\">0.5</span>) / (df + <span class=\"\
      num\">0.5</span>))\n\n<span class=\"kw\">def</span> <span class=\"fn\">score</span>(<span\
      \ class=\"kw\">self</span>, query: str) - List[Dict]:\n        q_words = query.<span\
      \ class=\"fn\">lower</span>().<span class=\"fn\">split</span>()\n        scores\
      \ = []\n        <span class=\"kw\">for</span> idx, doc <span class=\"kw\">in</span>\
