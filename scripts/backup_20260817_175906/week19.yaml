  flashcards:
  - front: Bi-Encoder vs Cross-Encoder?
    back: 'Bi: Separate embeddings (fast). Cross: Joint processing (accurate). This
      establishes the core invariant in Cross-Encoders & Re-ranking, ensuring memory
      efficiency, numerical stability, and robust scaling.'
  - front: When to use Reranking?
    back: After initial retrieval (Top-K) to reorder the candidate list. This establishes
      the core invariant in Cross-Encoders & Re-ranking, ensuring memory efficiency,
      numerical stability, and robust scaling.
  - front: Why are Cross-Encoders slow?
    back: They process query+doc together in full attention, so complexity is O(N)
      per query, not pre-computable.
  - front: How is Cross-Encoders & Re-ranking tested and validated in industrial ML
      pipelines (Day 137)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical
      tolerances (np.allclose at 1e-5), and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Cross-Encoders
      & Re-ranking in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation,
      resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
