      \ * (jaccard - <span class=\"num\">0.2</span>)))\n<span class=\"kw\">return</span>\
      \ <span class=\"fn\">round</span>(<span class=\"fn\">float</span>(prob), <span\
      \ class=\"num\">4</span>)\n\n<span class=\"fn\">print</span>(<span class=\"\
      str\">\"Cross-Encoder Relevance Score:\", cross_encoder_scoring(\"What is LoRA?\"\
