      \ [SEP]</span>\n    tokens_q = <span class=\"fn\">set</span>(query.<span class=\"\
      fn\">lower</span>().<span class=\"fn\">split</span>())\n    tokens_p = <span\
      \ class=\"fn\">set</span>(passage.<span class=\"fn\">lower</span>().<span class=\"\
      fn\">split</span>())\n    jaccard = <span class=\"fn\">len</span>(tokens_q.<span\
      \ class=\"fn\">intersection</span>(tokens_p)) / <span class=\"fn\">max</span>(<span\
      \ class=\"num\">1</span>, <span class=\"fn\">len</span>(tokens_q.<span class=\"\
      fn\">union</span>(tokens_p)))\n    <span class=\"cm\"># Calibrated probability\
