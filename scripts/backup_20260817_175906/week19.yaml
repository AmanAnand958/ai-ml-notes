  predict:
    question: What is the top-ranked document ID returned by this Reciprocal Rank
      Fusion calculation with k=60?
    answer: doc_B
    explanation: doc_B has dense rank 1 (1/61=0.01639) + sparse rank 1 (1/61=0.01639)
      = 0.03278 total RRF score, exceeding all other candidates.
    code: |-
      def rrf(d_ranks, s_ranks, k=60):
          scores = {}
          for r, d in enumerate(d_ranks, 1): scores[d] = scores.get(d, 0) + 1.0/(k+r)
          for r, d in enumerate(s_ranks, 1): scores[d] = scores.get(d, 0) + 1.0/(k+r)
          return sorted(scores.items(), key=lambda x: x[1], reverse=True)[0][0]

      dense = ['doc_B', 'doc_A', 'doc_C']
      sparse = ['doc_B', 'doc_C', 'doc_A']
      print(rrf(dense, sparse))
