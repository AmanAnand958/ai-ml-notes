  - title: Production Benchmark — Vector Memory & Coreference
    solution_code: "# Day 147: Vector Memory & Coreference Resolution for Agents\nimport numpy as np\nfrom typing import List,\
      \ Dict, Optional, Tuple\nimport hashlib, re\n\nclass ConversationMemory:\n    \"\"\"Vector-based conversational memory\
      \ with coreference resolution.\"\"\"\n\n    def __init__(self, dim: int = 64, max_turns: int = 20):\n        self.dim\
      \ = dim\n        self.turns: List[Dict] = []\n        self.embeddings: List[np.ndarray] = []\n        self.max_turns\
      \ = max_turns\n\n    def _embed(self, text: str) -> np.ndarray:\n        \"\"\"Deterministic mock embedding.\"\"\"\n\
      \        h = int(hashlib.md5(text.encode()).hexdigest(), 16) % (2**31)\n        np.random.seed(h)\n        v = np.random.randn(self.dim)\n\
      \        return v / (np.linalg.norm(v) + 1e-9)\n\n    def add_turn(self, role: str, content: str):\n        self.turns.append({'role':\
      \ role, 'content': content})\n        self.embeddings.append(self._embed(content))\n        if len(self.turns) > self.max_turns:\n\
      \            self.turns.pop(0)\n            self.embeddings.pop(0)\n\n    def retrieve_relevant(self, query: str, top_k:\
      \ int = 3) -> List[Dict]:\n        if not self.embeddings:\n            return []\n        q_vec = self._embed(query)\n\
      \        sims = [np.dot(q_vec, e) for e in self.embeddings]\n        top_idx = np.argsort(sims)[::-1][:top_k]\n    \
      \    return [{'turn': self.turns[i], 'score': float(sims[i])} for i in top_idx]\n\n    def resolve_coreference(self,\
      \ current_text: str) -> str:\n        \"\"\"Simple pronoun resolution using last entity mention.\"\"\"\n        pronouns\
      \ = re.compile(r'\b(it|this|that|they|them|their)\b', re.IGNORECASE)\n        if not pronouns.search(current_text):\n\
      \            return current_text\n\n        # Find last entity (NOUN or proper noun heuristic)\n        entity = None\n\
      \        for turn in reversed(self.turns):\n            nouns = re.findall(r'\b[A-Z][a-z]+\b|\b(transformer|model|system|agent)\b\
      ',\n                               turn['content'], re.IGNORECASE)\n            if nouns:\n                entity =\
      \ next((n for n in nouns if n), None)\n                break\n\n        if entity:\n            resolved = pronouns.sub(entity,\
      \ current_text)\n            return resolved\n        return current_text\n\n# Test conversational memory\nmemory =\
