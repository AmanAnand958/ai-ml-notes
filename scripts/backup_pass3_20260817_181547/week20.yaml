  - front: interrupt_before?
    back: Pauses the LangGraph execution right before a specified node runs. This establishes the core invariant in Human-in-the-loop
      (HITL), ensuring memory efficiency, numerical stability, and robust scaling.
  - front: 'Core concept: What is the significance of update_state in Human-in-the-loop (HITL)?'
    back: Allows a human to modify the graph's state manually while it is paused.
  - front: interrupt_after?
    back: Pauses the graph AFTER a node runs, useful for reviewing outputs before they feed to the next step.
  - front: How is Human-in-the-loop (HITL) tested and validated in industrial ML pipelines (Day 148)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.allclose at 1e-5), and unit
      tests checking for data leakage.
