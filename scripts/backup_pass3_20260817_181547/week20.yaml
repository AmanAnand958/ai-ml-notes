  quizzes:
  - question: In the ReAct (Reasoning + Acting) loop, why must the model generate a 'Thought' before taking an 'Action'?
    options:
    - letter: A
      text: To log reasoning traces for debugging
      is_correct: false
      id: a
    - letter: B
      text: To decompose the problem, track state, and choose the correct tool and arguments
      is_correct: true
      id: b
    - letter: C
      text: To reduce token costs by skipping tool invocations
      is_correct: false
      id: c
    - letter: D
      text: To enforce strict JSON schema outputs without Pydantic
      is_correct: false
      id: d
    correct_fb: ✅ Correct! The Thought step lets the LLM reason about observations and synthesize next actions.
    wrong_fb: ❌ Incorrect. Thought tokens enable dynamic problem decomposition and grounded tool selection.
    correct: b
  - question: What safety mechanism is mandatory to prevent an autonomous ReAct agent from entering an infinite loop?
    options:
    - letter: A
      text: A hard recursion limit / max_iterations threshold and tool timeout safeguards
      is_correct: true
      id: a
    - letter: B
      text: Lowering model temperature to exactly 0.0
      is_correct: false
      id: b
    - letter: C
      text: Disabling the Thought step
      is_correct: false
      id: c
    - letter: D
      text: Using only single-turn tool calls
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Max iterations and execution timeouts prevent runaway execution and unbounded API costs.
    wrong_fb: ❌ Incorrect. Autonomous loops must have deterministic iteration and time boundaries.
    correct: a
  flashcards:
  - front: 'Core concept: What is the significance of ReAct Loop in ReAct & Plan-and-Solve?'
    back: Thought - Action (Tool) - Observation - Repeat until Answer. This establishes the core invariant in ReAct & Plan-and-Solve,
      ensuring memory efficiency, numerical stability, and robust scaling.
  - front: 'Core concept: What is the significance of Plan-and-Solve in ReAct & Plan-and-Solve?'
    back: Creates a full step-by-step plan first, then executes it sequentially. This establishes the core invariant in ReAct
      & Plan-and-Solve, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: ReAct Observation?
    back: The output of an Action (tool call) returned back to the agent to inform its next Thought.
  - front: How is ReAct & Plan-and-Solve tested and validated in industrial ML pipelines (Day 143)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.allclose at 1e-5), and unit
      tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling ReAct & Plan-and-Solve in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
