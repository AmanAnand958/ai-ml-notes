  quizzes:
  - num_str: QUESTION 1 OF 4
    question: In enterprise recommendation system design (e.g. YouTube/Netflix), why is a Two-Stage (Candidate Generation
      + Ranking) architecture used?
    qid: quiz-section-188-1
    options:
    - letter: A
      text: Because single-stage models are not supported on Linux operating systems.
      is_correct: false
      id: a
    - letter: B
      text: Candidate generation efficiently filters millions of items to ~1,000 using fast ANN search, allowing heavy ranking
        mo...
      is_correct: true
      id: b
    - letter: C
      text: Because neural networks cannot process more than 100 items at a time.
      is_correct: false
      id: c
    - letter: D
      text: To duplicate database queries across multiple availability zones.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Fast vector retrieval narrows 10M+ items to 1000, which are then precision-ranked with deep feature
      cross models.
    wrong_fb: ❌ Incorrect. Scoring 10M items with a deep neural network would exceed real-time 50ms latency budgets.
    correct: b
  - num_str: QUESTION 2 OF 4
    question: In large-scale recommender system design, what is the 'Two-Tower' (User Tower + Item Tower) DSSM architecture?
    qid: quiz-section-188-2
    options:
    - letter: A
      text: Separate neural networks compute user embeddings and item embeddings independently, enabling real-time dot-product
        / ...
      is_correct: true
      id: a
    - letter: B
      text: A backup server architecture with two physical data center towers.
      is_correct: false
      id: b
    - letter: C
      text: A dual-GPU setup where one GPU trains and the second GPU validates.
      is_correct: false
      id: c
    - letter: D
      text: An ensemble of two random forest classifiers.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! User and Item towers map features into a shared embedding space for O(1) ANN vector search.
    wrong_fb: ❌ Incorrect. Two-tower models isolate query features and candidate features into decoupled embedding spaces.
    correct: a
  - num_str: QUESTION 3 OF 4
    question: Why can item embeddings in a Two-Tower model be pre-computed offline, while user embeddings must often be computed
      online?
    qid: quiz-section-188-3
    options:
    - letter: A
      text: Item catalog attributes update infrequently and can be indexed in Vector DBs, whereas user state depends on immediate...
      is_correct: true
      id: a
    - letter: B
      text: Item vectors are always smaller in dimension than user vectors.
      is_correct: false
      id: b
    - letter: C
      text: Item vectors use floating-point numbers while user vectors use strings.
      is_correct: false
      id: c
    - letter: D
      text: Offline computation is only allowed on candidate models.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Static item embeddings are indexed offline, while dynamic user embeddings are computed at query
      time.
    wrong_fb: ❌ Incorrect. Items change slowly so their embeddings can be indexed in Milvus/Faiss offline, but user session
      intent is real-time.
    correct: a
  - num_str: QUESTION 4 OF 4
    question: What loss function is standard for training Two-Tower retrieval models with in-batch negatives?
    qid: quiz-section-188-4
    options:
    - letter: A
      text: Sampled Softmax or InfoNCE / Cross-Entropy Loss where other items in the mini-batch serve as negative candidates.
      is_correct: true
      id: a
    - letter: B
      text: Mean Squared Error (MSE) on user ID strings.
      is_correct: false
      id: b
    - letter: C
      text: L1 Absolute Error on catalog timestamps.
      is_correct: false
      id: c
    - letter: D
      text: Categorical Hinge Loss with zero temperature.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! In-batch negative InfoNCE loss treats batch items as negatives, scaling training efficiency without
      explicit negative sampling.
    wrong_fb: ❌ Incorrect. Sampled Softmax / InfoNCE with in-batch negatives is standard for dual-encoder retrieval systems.
    correct: a
  flashcards:
  - front: Candidate Generation?
    back: 'Stage 1: A fast, lightweight method (like Vector Search) to narrow millions of items down to ~1000 relevant candidates.'
  - front: 'Core concept: What is the significance of Ranking in ML System Design — Recommendation System?'
    back: 'Stage 2: A heavier model (XGBoost) that scores the 1000 candidates precisely to select the final Top 10.'
  - front: Two-Tower Model?
    back: Neural net architecture where User and Item features are processed independently into embeddings. Fast retrieval
      via dot product.
  - front: How is ML System Design — Recommendation System tested and validated in industrial ML pipelines (Day 188)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.allclose at 1e-5), and unit
      tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling ML System Design — Recommendation System in distributed
      systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Stale Embedding Cold-Start Problem'
    description: New items or newly registered users have zero interaction history in Two-Tower models. Always implement a
      real-time feature fallback path utilizing content-based metadata and exploration bandits (Thompson Sampling).
