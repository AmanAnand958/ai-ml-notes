      # Solution for Task: RAG Signature
      from typing import List

      class DSPyRAGModule:
          def __init__(self):
              print("Initialized DSPy Declarative RAG Module.")

          def forward(self, question: str, context: List[str]) -> str:
              prompt_instruction = f"Context: {context}\nQuestion: {question}\nAnswer:"
              return f"DSPy Optimized Answer for '{question}'"

      module = DSPyRAGModule()
      output = module.forward("What is DSPy?", ["DSPy compiles declarative prompt instructions."])
      print("DSPy Response:", output)
      assert output is not None, "output should not be None"
