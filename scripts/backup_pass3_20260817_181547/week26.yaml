  flashcards:
  - front: 'Core concept: What is the significance of Whisper in Audio Processing with Whisper?'
    back: OpenAI's robust open-source speech recognition model, trained on 680k hours of multilingual audio.
  - front: 'Core concept: What is the significance of Diarization in Audio Processing with Whisper?'
    back: The process of identifying "who spoke when" in an audio recording. Whisper doesn't do this natively; requires external
      tools like Pyannote.
  - front: 'Core concept: What is the significance of 25MB Limit in Audio Processing with Whisper?'
    back: The maximum file size allowed by the OpenAI Whisper API. Larger files must be compressed or chunked.
  - front: How is Audio Processing with Whisper tested and validated in industrial ML pipelines (Day 187)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.allclose at 1e-5), and unit
      tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Audio Processing with Whisper in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Resolution Downsampling Information Loss'
    description: Downsampling high-resolution receipts or architectural blueprints into small 224x224 patches completely destroys
      small OCR text. Use dynamic high-resolution patching (AnyRes) with multi-crop grids.
