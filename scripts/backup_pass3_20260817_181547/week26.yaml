  predict:
    question: Why can't we use the heavy Ranking model directly on all 10 million items?
    answer: '2-Stage RecSys Latency: 48.0ms for 10,000,000 candidates'
    explanation: Running heavy ranking transformers on 10 million items for every query is computationally impossible in real-time.
      We use Two-Tower models for fast top-100 candidate retrieval, and heavy ranking only on those 100 items.
    code: |-
      # Verification Script for Day 188
      def recsys_two_stage_latency(n_candidates=10000000, two_tower_top_k=100):
          two_tower_ms = 8.0 # ANN vector lookup
          ranking_model_ms = two_tower_top_k * 0.4 # 40ms on 100 candidates
          total_ms = two_tower_ms + ranking_model_ms
          print(f"2-Stage RecSys Latency: {total_ms:.1f}ms for {n_candidates:,} candidates")
          return total_ms < 50.0

      if __name__ == "__main__":
          assert recsys_two_stage_latency() is True
