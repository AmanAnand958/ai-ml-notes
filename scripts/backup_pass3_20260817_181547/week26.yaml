  flashcards:
  - front: ColPali Multimodal Document Retrieval?
    back: Embeds whole PDF pages as patch tokens using PaliGemma and computes late-interaction MaxSim scores directly without
      relying on error-prone OCR pipelines.
  - front: 'Core concept: What is the significance of Multimodal RAG in Multimodal RAG?'
    back: Extending RAG to retrieve and reason over non-text data (images, audio, video) alongside text.
  - front: 'Core concept: What is the significance of ColPali in Multimodal RAG?'
    back: An advanced vision retrieval model that embeds document pages directly as images without needing OCR or text extraction.
  - front: How is Multimodal RAG tested and validated in industrial ML pipelines (Day 186)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.allclose at 1e-5), and unit
      tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Multimodal RAG in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Resolution Downsampling Information Loss'
    description: Downsampling high-resolution receipts or architectural blueprints into small 224x224 patches completely destroys
      small OCR text. Use dynamic high-resolution patching (AnyRes) with multi-crop grids.
