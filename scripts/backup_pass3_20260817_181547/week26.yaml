  flashcards:
  - front: Vision-Language Model Cross-Attention Projector?
    back: Projects visual tokens from a Vision Transformer (ViT) into the text LLM input embedding space via a 2-layer MLP
      or Q-Former.
  - front: 'Detail: Low vs High'
    back: 'Low: scales image down to 512x512, costs flat 85 tokens. High: crops image into 512x512 tiles, costs 170 tokens
      per tile.'
  - front: 'Core concept: What is the significance of Visual Tokens in Vision-Language Models (VLMs)?'
    back: The embedding representations of image patches that are concatenated with text tokens in a VLM's input sequence.
  - front: How is Vision-Language Models (VLMs) tested and validated in industrial ML pipelines (Day 185)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.allclose at 1e-5), and unit
      tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Vision-Language Models (VLMs) in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Resolution Downsampling Information Loss'
    description: Downsampling high-resolution receipts or architectural blueprints into small 224x224 patches completely destroys
      small OCR text. Use dynamic high-resolution patching (AnyRes) with multi-crop grids.
