      </div>
      <pre><span class="kw">import</span> numpy <span class="kw">as</span> np

      <span class="kw">class</span> <span class="cls">LLaVAProjectionLayer</span>:
          <span class="kw">def</span> <span class="fn">__init__</span>(<span class="kw">self</span>, visual_dim: int = <span class="num">1024</span>, text_dim: int = <span class="num">4096</span>):
              <span class="kw">self</span>.W_proj = np.random.<span class="fn">randn</span>(visual_dim, text_dim) * <span class="num">0.02</span>
              <span class="kw">self</span>.bias = np.<span class="fn">zeros</span>(text_dim)

          <span class="kw">def</span> <span class="fn">forward</span>(<span class="kw">self</span>, visual_tokens: np.ndarray) -&gt; np.ndarray:
              <span class="cm"># visual_tokens: (batch, num_patches=576, visual_dim=1024)</span>
              <span class="kw">return</span> np.<span class="fn">matmul</span>(visual_tokens, <span class="kw">self</span>.W_proj) + <span class="kw">self</span>.bias

      proj = <span class="fn">LLaVAProjectionLayer</span>()
      dummy_patches = np.random.<span class="fn">randn</span>(<span class="num">1</span>, <span class="num">576</span>, <span class="num">1024</span>)
      projected_text_tokens = proj.<span class="fn">forward</span>(dummy_patches)
      <span class="fn">print</span>(<span class="str">f"Projected Visual Tokens Shape: {projected_text_tokens.shape} (Ready for LLM Decoder Transformer)"</span>)</pre>
      </div>
