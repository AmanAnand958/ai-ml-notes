  gotcha:
    title: '⚠️ Gotcha: Weak Metric Function in DSPy Optimizers'
    description: DSPy optimizers are only as good as your evaluation metric function. If your metric only checks exact string
      matching, DSPy will overfit to literal training strings. Use fuzzy semantic embedding scoring or LLM-as-a-judge metrics.
  takeaways:
    hinglish_line: |-
      <strong>
              Ek line mein:
             </strong>
             "Prompt engineering is dead. Prompt programming is the future. Define the goal, let the compiler find the prompt!"
    bullets:
    - DSPy makes LLM pipelines model-agnostic. Switch models, just re-compile.
    - It treats prompts like weights in a neural network.
    - Highly recommended for complex pipelines (e.g. multi-hop RAG).
