  flashcards:
  - front: 'Core concept: What is the significance of Sharding in ML System Design — Semantic Search?'
    back: Distributing data across multiple physical machines to scale horizontally when data exceeds one machine's RAM.
  - front: Scalar Quantization (SQ)?
    back: Converting 32-bit floats to 8-bit integers (int8). Provides 4x memory reduction with negligible accuracy loss.
  - front: 'Core concept: What is the significance of Scatter-Gather in ML System Design — Semantic Search?'
    back: 'Search pattern for sharded DBs: send query to all shards concurrently, collect local Top-K results, merge and sort
      globally.'
  - front: How is ML System Design — Semantic Search tested and validated in industrial ML pipelines (Day 190)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.allclose at 1e-5), and unit
      tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling ML System Design — Semantic Search in distributed
      systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
