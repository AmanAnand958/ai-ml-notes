  predict:
    question: If you use int8 quantization instead of float32, how much RAM does a 1536-d vector take?
    answer: |-
      1536-d Vector in int8: 1536 bytes (1.50 KB)
      1536-d Vector in float32: 6144 bytes (6.00 KB)
    explanation: 1,536 bytes (1.5 KB) in INT8 (1 byte per dimension), compared to 6,144 bytes (6 KB) in FLOAT32 (4 bytes per
      dimension) — a 75% RAM savings.
    code: |-
      # Verification Script for Day 190
      def compute_vector_memory(dim=1536, dtype="int8"):
          bytes_per_dim = 1 if dtype == "int8" else 4
          total_bytes = dim * bytes_per_dim
          print(f"{dim}-d Vector in {dtype}: {total_bytes} bytes ({total_bytes/1024:.2f} KB)")
          return total_bytes

      if __name__ == "__main__":
          assert compute_vector_memory(1536, "int8") == 1536
          assert compute_vector_memory(1536, "float32") == 6144
