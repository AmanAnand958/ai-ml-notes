      <span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span\
      \ class=\"kw\">class</span> <span class=\"cls\">PagedBlockManager</span>:\n\
      \    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span\
      \ class=\"kw\">self</span>, block_size: int = <span class=\"num\">16</span>,\
      \ num_blocks: int = <span class=\"num\">100</span>):\n        <span class=\"\
      kw\">self</span>.block_size = block_size\n        <span class=\"kw\">self</span>.free_blocks\
      \ = <span class=\"fn\">list</span>(<span class=\"fn\">range</span>(num_blocks))\n\
      \        <span class=\"kw\">self</span>.block_tables = {}\n        <span class=\"\
      kw\">self</span>.ref_counts = {i: <span class=\"num\">0</span> <span class=\"\
      kw\">for</span> i <span class=\"kw\">in</span> <span class=\"fn\">range</span>(num_blocks)}\n\
      \n<span class=\"kw\">def</span> <span class=\"fn\">allocate</span>(<span class=\"\
      kw\">self</span>, req_id: str, num_tokens: int):\n        num_blocks_needed\
      \ = (num_tokens + <span class=\"kw\">self</span>.block_size - <span class=\"\
      num\">1</span>) // <span class=\"kw\">self</span>.block_size\n        allocated\
      \ = []\n        <span class=\"kw\">for</span> _ <span class=\"kw\">in</span>\
      \ <span class=\"fn\">range</span>(num_blocks_needed):\n            blk = <span\
      \ class=\"kw\">self</span>.free_blocks.<span class=\"fn\">pop</span>(<span class=\"\
      num\">0</span>)\n            <span class=\"kw\">self</span>.ref_counts[blk]\
      \ += <span class=\"num\">1</span>\n            allocated.<span class=\"fn\"\
      >append</span>(blk)\n        <span class=\"kw\">self</span>.block_tables[req_id]\
      \ = allocated\n<span class=\"kw\">return</span> allocated\n\nmgr = <span class=\"\
      fn\">PagedBlockManager</span>(block_size=<span class=\"num\">16</span>, num_blocks=<span\
      \ class=\"num\">50</span>)\nb = mgr.<span class=\"fn\">allocate</span>(<span\
      \ class=\"str\">\"req_101\"</span>, <span class=\"num\">38</span>)\n<span class=\"\
      fn\">print</span>(<span class=\"str\">f\"Allocated {len(b)} blocks for 38 tokens\
