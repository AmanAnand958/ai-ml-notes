      is_correct: false
      id: b
    - letter: C
      text: Hard drive read/write speed.
      is_correct: false
      id: c
    - letter: D
      text: Number of open browser tabs.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Scaling based on queue depth and KV-cache saturation directly addresses pending request backlogs
      before latency SLA violations occur.
    wrong_fb: ❌ Incorrect. CPU usage is misleading for GPU inference; queue length (`num_requests_waiting`) and KV-cache allocation
