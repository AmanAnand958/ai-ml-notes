    prompt_html: |-
      <p><strong>Scenario:</strong> Fine-tune a frontier 70B parameter base model on a specialized domain dataset (legal contracts) using a single 48GB GPU workstation without out-of-memory crashes.</p>
      <p><strong>Requirements:</strong></p>
      <ul>
        <li>Implement a custom <strong>LoRA (Low-Rank Adaptation) Linear Layer</strong> in PyTorch: $\mathbf{W} = \mathbf{W}_0 + \frac{\alpha}{r} (\mathbf{B} \cdot \mathbf{A})$ with rank $r=16$ and scaling $\alpha=32$.</li>
        <li>Implement <strong>NormalFloat4 (NF4) Quantile Quantization</strong> for the frozen base weights $\mathbf{W}_0$.</li>
        <li>Execute a forward and backward pass, verifying that only matrices $\mathbf{A}$ and $\mathbf{B}$ receive gradient updates while base weights remain strictly frozen.</li>
      </ul>
    done_when: 'Your Task 1: Merging LoRA Weights implementation runs without errors. All assertions in the solution pass.
      You can explain the core algorithm and its time complexity.'
    git_cmd: 'git add . && git commit -m "feat(day153): task-1-merging-lora-weights"'
    sol_id: sol-w21d153t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: |
      """
      Production Implementation: Task 1: Merging LoRA Weights
      Module: Day 153 — QLoRA & PEFT
      """

      # Day 153 Task 1: Merging LoRA Weights into Base Model
      import numpy as np

      def merge_lora(W0: np.ndarray, A: np.ndarray, B: np.ndarray, alpha: float, r: int) -> np.ndarray:
          """W_merged = W0 + (alpha / r) * (B @ A)"""
          scaling = alpha / r
          delta_w = scaling * (B @ A)
          return W0 + delta_w

      d_out, d_in, r = 512, 256, 8
      alpha = 16.0
      W0 = np.random.randn(d_out, d_in) * 0.02
      A = np.random.randn(r, d_in) * 0.01
      B = np.random.randn(d_out, r) * 0.01

      W_merged = merge_lora(W0, A, B, alpha, r)
      print("Merged Weight Matrix Shape:", W_merged.shape)
      assert W_merged.shape == (512, 256)
      assert not np.allclose(W_merged, W0), "Merged weights must reflect LoRA delta"
