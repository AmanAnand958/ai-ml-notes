  - num_str: QUESTION 1 OF 4
    question: How does Direct Preference Optimization (DPO) eliminate the need for
      a separate reward model during LLM alignment?
    qid: q154_1
    options:
    - letter: A
      text: A fast small draft model generates $K$ candidate tokens speculatively,
        and the large target model verifies all $K$ to...
      is_correct: true
      id: a
    - letter: B
