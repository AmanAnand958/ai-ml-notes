      is_correct: false
      id: d
    correct_fb: ✅ Correct! Reusing KV-cache for common prompt prefixes slashes TTFT by up to 90% and frees GPU compute for
      active generation.
    wrong_fb: ❌ Incorrect. Prefix caching stores and reuses precomputed KV-tensors for common prompt prefixes, skipping redundant
