    sol_id: sol-w21d156t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "<span class=\"kw\">import</span> subprocess\n<span class=\"kw\">import</span> json\n<span class=\"kw\">import</span> requests\n<span class=\"kw\">from</span> pathlib <span class=\"kw\">import</span> Path\n\n<span class=\"cm\"># ── Step 1: Merge QLoRA adapter into base model ──────────────────</span>\n<span class=\"kw\">from</span> peft <span class=\"kw\">import</span> AutoPeftModelForCausalLM\n<span class=\"kw\">from</span> transformers <span class=\"kw\">import</span> AutoTokenizer\n<span class=\"kw\">import</span> torch\n\n<span class=\"kw\">def</span> <span class=\"fn\">merge_qlora_adapter</span>(\n    base_model_id: str,\n    adapter_path: str,\n    output_dir: str\n) -&gt; str:\n    <span class=\"str\">\"\"\"Merge QLoRA adapter weights into base model and save.\"\"\"</span>\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Loading adapter from {adapter_path}...\"</span>)\n    model = AutoPeftModelForCausalLM.<span class=\"fn\">from_pretrained</span>(\n\
      \        adapter_path,\n        device_map=<span class=\"str\">\"auto\"</span>,\n        torch_dtype=torch.bfloat16,\n    )\n    merged = model.<span class=\"fn\">merge_and_unload</span>()  <span class=\"cm\"># fuse LoRA weights into base</span>\n    tokenizer = AutoTokenizer.<span class=\"fn\">from_pretrained</span>(base_model_id)\n    merged.<span class=\"fn\">save_pretrained</span>(output_dir)\n    tokenizer.<span class=\"fn\">save_pretrained</span>(output_dir)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"✅ Merged model saved to {output_dir}\"</span>)\n    <span class=\"kw\">return</span> output_dir\n\n<span class=\"cm\"># ── Step 2: Launch vLLM server ────────────────────────────────────</span>\n<span class=\"kw\">def</span> <span class=\"fn\">launch_vllm_server</span>(model_path: str, port: int = <span class=\"num\">8000</span>) -&gt; <span class=\"kw\">None</span>:\n    <span class=\"str\">\"\"\"Start vLLM OpenAI-compatible server as subprocess.\"\"\"</span>\n\
      \    cmd = [\n        <span class=\"str\">\"python\", \"-m\", \"vllm.entrypoints.openai.api_server\"</span>,\n        <span class=\"str\">\"--model\"</span>, model_path,\n        <span class=\"str\">\"--port\"</span>, <span class=\"fn\">str</span>(port),\n        <span class=\"str\">\"--dtype\", \"bfloat16\"</span>,\n        <span class=\"str\">\"--max-model-len\", \"4096\"</span>,\n        <span class=\"str\">\"--gpu-memory-utilization\", \"0.90\"</span>,\n    ]\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Starting vLLM server on port {port}...\"</span>)\n    subprocess.<span class=\"fn\">Popen</span>(cmd)  <span class=\"cm\"># non-blocking; server runs in background</span>\n\n<span class=\"cm\"># ── Step 3: Query the deployed model ─────────────────────────────</span>\n<span class=\"kw\">def</span> <span class=\"fn\">query_vllm</span>(prompt: str, port: int = <span class=\"num\">8000</span>) -&gt; str:\n    <span class=\"str\">\"\"\"Send an inference request to vLLM\
      \ OpenAI-compatible endpoint.\"\"\"</span>\n    response = requests.<span class=\"fn\">post</span>(\n        <span class=\"str\">f\"http://localhost:{port}/v1/chat/completions\"</span>,\n        json={\n            <span class=\"str\">\"model\": \"merged-qlora-model\"</span>,\n            <span class=\"str\">\"messages\": [{\"role\": \"user\", \"content\"</span>: prompt}],\n            <span class=\"str\">\"max_tokens\"</span>: <span class=\"num\">512</span>,\n            <span class=\"str\">\"temperature\"</span>: <span class=\"num\">0.1</span>,\n        },\n        timeout=<span class=\"num\">60</span>\n    )\n    <span class=\"kw\">return</span> response.<span class=\"fn\">json</span>()[<span class=\"str\">\"choices\"][0][\"message\"][\"content\"</span>]\n\n<span class=\"cm\"># ── Main: Full pipeline ───────────────────────────────────────────</span>\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n    merged_path = <span class=\"fn\">merge_qlora_adapter</span>(\n\
      \        base_model_id=<span class=\"str\">\"mistralai/Mistral-7B-v0.1\"</span>,\n        adapter_path=<span class=\"str\">\"./qlora-adapter\"</span>,\n        output_dir=<span class=\"str\">\"./merged-mistral-7b\"</span>,\n    )\n    <span class=\"fn\">launch_vllm_server</span>(merged_path, port=<span class=\"num\">8000</span>)\n    \n    <span class=\"kw\">import</span> time; time.<span class=\"fn\">sleep</span>(<span class=\"num\">30</span>)  <span class=\"cm\"># wait for server startup</span>\n    answer = <span class=\"fn\">query_vllm</span>(<span class=\"str\">\"Explain LoRA in one sentence.\"</span>)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Model response: {answer}\"</span>)"
