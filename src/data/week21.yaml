    <div class="toolkit-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:1.5rem; margin:1.5rem 0;">
      <div class="toolkit-card" style="background:var(--bg2); border:1px solid var(--border); padding:1.25rem; border-radius:8px;">
