      \ W_splits]\n    <span class=\"cm\"># All-Gather along column dimension</span>\n\
      <span class=\"kw\">return</span> np.<span class=\"fn\">concatenate</span>(gpu_outputs,\
      \ axis=<span class=\"num\">1</span>)\n\nX = np.random.<span class=\"fn\">randn</span>(<span\
      \ class=\"num\">4</span>, <span class=\"num\">8</span>)\nW = np.random.<span\
      \ class=\"fn\">randn</span>(<span class=\"num\">8</span>, <span class=\"num\"\
      >16</span>)\nY_tp = <span class=\"fn\">column_parallel_linear</span>(X, W, num_gpus=<span\
      \ class=\"num\">2</span>)\nY_exact = np.<span class=\"fn\">matmul</span>(X,\
