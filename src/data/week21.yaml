  quizzes:
  - question: In LoRA (Low-Rank Adaptation), how is the weight update matrix ΔW represented
      for a base weight matrix W ∈ ℝ^(d×k)?
    options:
    - letter: A
      text: As a full d×k dense matrix
      is_correct: false
    - letter: B
