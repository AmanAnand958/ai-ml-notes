  theory_html: ''
  predict:
    question: Why do we use MinHash instead of calculating Cosine Similarity for every pair?
    answer: MinHash speedup
    explanation: MinHash / LSH provides O(N) near-duplicate document clustering compared to O(N^2) exhaustive pairwise comparisons, making deduplication across millions of documents computationally tractable.
    code: "<span class=\"cm\"># Verification Script for Day 155</span>\n<span class=\"kw\">def</span> <span class=\"fn\">minhash_dedup_efficiency</span>(n_docs=<span class=\"num\">500000</span>):\n    pairwise_ops = (n_docs * (n_docs - <span class=\"num\">1</span>)) // <span class=\"num\">2</span>\n    lsh_ops = n_docs * <span class=\"num\">128</span> <span class=\"cm\"># 128 hash permutations</span>\n    speedup = pairwise_ops / lsh_ops\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Dedup {n_docs:,} Docs - Pairwise: {pairwise_ops:,} ops | MinHash: {lsh_ops:,} ops ({speedup:,.0f}x faster)\"</span>)\n<span class=\"kw\">return</span> speedup  <span class=\"num\">1000</span>\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n    <span class=\"kw\">assert</span> <span class=\"fn\">minhash_dedup_efficiency</span>(<span class=\"num\">500000</span>) <span class=\"kw\">is</span> <span class=\"kw\">True</span>"
  tasks:
  - title: 'Task 1: Magpie Approach'
    badge: MEDIUM
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p>\n        Write a system prompt to generate high-quality instruction data (like Magpie/Evol-Instruct).\n        <strong>\n         Bonus Task: Quality Filter · MEDIUM · MED · ⏱ 45 mins\n        </strong>\n        Write a script that uses an LLM to score each generated instruction 1-5 for complexity and filter out scores below 3.\n       </p>"
