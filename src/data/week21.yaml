  hinglish: PPO (RLHF) bohot unstable hota hai kyunki alag se Reward Model aur Value Network train karna padta hai. DPO (Direct
    Preference Optimization) mathematical substitution se reward model ko direct policy loss mein convert kar deta hai, jisse
    training simple cross-entropy ban jati hai!
  analogy: RLHF with PPO is like hiring a judge (Reward Model), a coach (Critic), and an athlete (Policy) all practicing simultaneously.
    DPO is giving the athlete a direct video comparison of good vs bad performances to learn from directly.
  theory_html: "<h3 class=\"sh3\">1. Preference Alignment: DPO vs. ORPO vs. GRPO</h3>\n<p>\nPost-training alignment teaches\
    \ models to follow human preferences (helpfulness and harmlessness). While traditional RLHF requires training a separate\
    \ Reward Model and running complex PPO loops, modern alignment uses direct loss formulations:\n</p>\n<div class=\"mermaid\"\
    >\ngraph TD\n  Align[\"Alignment Methodologies\"] --> RLHF[\"1. RLHF (PPO)\n(Requires Actor + Critic + Reward + Ref Model\
    \ = 4 models in VRAM)\"]\n  Align --> DPO[\"2. DPO (Direct Preference Optimization)\n(Closed-form optimization over pairwise\
    \ preferences [y_w > y_l])\"]\n  Align --> ORPO[\"3. ORPO (Odds Ratio Preference Optimization)\n(Monolithic SFT + Odds\
    \ Ratio penalty, no ref model needed)\"]\n  Align --> GRPO[\"4. GRPO (Group Relative Policy Optimization)\n(Group-normalized\
    \ reward sampling, DeepSeek-R1 reasoning alignment)\"]\n</div>\n<div class=\"diagram-cap\">Evolution of Preference Alignment\
    \ from RLHF to Direct Closed-Form and Group-Relative Optimization.</div>\n\n<h3 class=\"sh3\">2. The DPO Objective</h3>\n\
    <div class=\"math-block\">\n$$\\mathcal{L}_{\text{DPO}}(\\pi_\theta; \\pi_{\text{ref}}) = -\\mathbb{E}_{(x, y_w, y_l)}\
    \ \\left[ \\log \\sigma \\left( \beta \\log \frac{\\pi_\theta(y_w|x)}{\\pi_{\text{ref}}(y_w|x)} - \beta \\log \frac{\\\
    pi_\theta(y_l|x)}{\\pi_{\text{ref}}(y_l|x)} \right) \right]$$\n</div>"
