      from peft import AutoPeftModelForCausalLM\nfrom transformers import AutoTokenizer\n\
      import torch\n\ndef merge_qlora_adapter(\n    base_model_id: str,\n    adapter_path:\
      \ str,\n    output_dir: str\n) -> str:\n    \"\"\"Merge QLoRA adapter weights\
