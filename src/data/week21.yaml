    - letter: D
      text: It uses speculative stock market algorithms.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Speculative decoding leverages the fact that target verification
      is compute-bound and can evaluate $K$ draft tokens in parallel in one forward
      pass.
    wrong_fb: ❌ Incorrect. Speculative decoding uses a small draft model to propose
      tokens that the large model validates in parallel, guaranteeing identical mathematical
      output distributions.
    correct: a
