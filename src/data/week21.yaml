    time: 45 mins
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Simulate RowParallelLinear and ColumnParallelLinear splits across 2 virtual GPUs.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\">column_parallel_linear</span>(X: np.ndarray, W: np.ndarray, num_gpus: int = <span class=\"num\">2</span>):\n    <span class=\"cm\"># Split W along columns</span>\n    W_splits = np.<span class=\"fn\">split</span>(W, num_gpus, axis=<span class=\"num\">1</span>)\n    <span class=\"cm\"># Forward on each GPU</span>\n    gpu_outputs = [np.<span class=\"\
      fn\">matmul</span>(X, w_part) <span class=\"kw\">for</span> w_part <span class=\"kw\">in</span> W_splits]\n    <span class=\"cm\"># All-Gather along column dimension</span>\n<span class=\"kw\">return</span> np.<span class=\"fn\">concatenate</span>(gpu_outputs, axis=<span class=\"num\">1</span>)\n\nX = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">4</span>, <span class=\"num\">8</span>)\nW = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">8</span>, <span class=\"num\">16</span>)\nY_tp = <span class=\"fn\">column_parallel_linear</span>(X, W, num_gpus=<span class=\"num\">2</span>)\nY_exact = np.<span class=\"fn\">matmul</span>(X, W)\n<span class=\"fn\">print</span>(<span class=\"str\">\"TP Output Matches Exact Matmul:\"</span>, np.<span class=\"fn\">allclose</span>(Y_tp, Y_exact))</pre>\n</div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono);\
