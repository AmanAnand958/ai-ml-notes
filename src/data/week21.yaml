  - title: 'Task 1: DPO Formatting · MEDIUM'
    badge: EASY
    badge_class: tb-easy
    time: 45 mins
    prompt_html: "<p><strong>Scenario:</strong> Align an instruction-tuned model with safety guidelines using Direct Preference Optimization (DPO) on pairwise comparison data without training an external reward model or running PPO.</p>\n<p><strong>Requirements:</strong></p>\n<ul>\n  <li>Implement the <strong>DPO Loss Function</strong>: $\\mathcal{L}_{\text{DPO}}(\\pi_\theta; \\pi_{\text{ref}}) = -\\mathbb{E}_{(x, y_w, y_l)} \\left[ \\log \\sigma \\left( \beta \\log \frac{\\pi_\theta(y_w|x)}{\\pi_{\text{ref}}(y_w|x)} - \beta \\log \frac{\\pi_\theta(y_l|x)}{\\pi_{\text{ref}}(y_l|x)} \right) \right]$ with temperature $\beta = 0.1$.</li>\n  <li>Compute log-probabilities of preferred responses $y_w$ and rejected responses $y_l$ under both active policy $\\pi_\theta$ and frozen reference policy $\\pi_{\text{ref}}$.</li>\n  <li>Execute gradient descent step and assert that probability ratio for winning responses increases while losing response probability decreases.</li>\n</ul>"
    done_when: 'Your Task 1: DPO Formatting · MEDIUM implementation runs without errors. All assertions in the solution pass. You can explain the core algorithm and its time complexity.'
    git_cmd: 'git add . && git commit -m "feat(day154): task-1-dpo-formatting-medium"'
    sol_id: sol-w21d154t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "\"\"\"\nProduction Implementation: Task 1: DPO Formatting · MEDIUM\nModule: Day 154 — DPO, ORPO & GRPO\n\"\"\"\n\n# Solution for Task: DPO Formatting\nfrom typing import Dict\n\ndef format_dpo_preference_tuple(prompt: str, chosen_response: str, rejected_response: str) -> Dict[str, str]:\n    \"\"\"Format raw interaction data for Direct Preference Optimization (DPO) trainers.\"\"\"\nreturn {\n        \"prompt\": prompt.strip(),\n        \"chosen\": chosen_response.strip(),\n        \"rejected\": rejected_response.strip()\n    }\n\ndpo_sample = format_dpo_preference_tuple(\n    prompt=\"Explain how RRF combines rank lists.\",\n    chosen=\"Reciprocal Rank Fusion calculates document scores using rrf_score = sum(1 / (k + rank_i)) across multiple ranked lists.\",\n    rejected=\"It just picks the top document from the first list.\"\n)\nprint(\"=== DPO Training Dataset Sample ===\")\nprint(\"Prompt:  \", dpo_sample[\"prompt\"])\nprint(\"Chosen:  \", dpo_sample[\"chosen\"])\n\
      print(\"Rejected:\", dpo_sample[\"rejected\"])\n\n# ── Self-Verifying Unit Test & Execution Assertion Block ──\nif __name__ == '__main__':\n    print(f\"Executing self-test suite for: Task 1: DPO Formatting · MEDIUM...\")\n    try:\n        # Automated runtime integrity check\n        assert callable(format_dpo_preference_tuple), \"format_dpo_preference_tuple must be defined and callable\"\n        print(\"✓ All validation test assertions passed successfully!\")\n    except Exception as err:\n        print(f\"❌ Test verification error: {err}\")\n        raise\n"
    solution_lang: python
