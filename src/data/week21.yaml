      <button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\"\
      \ onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"cm\"># Step 1:\
      \ Algorithmic Implementation &amp; Core Transformations</span>\n<span class=\"kw\">import</span> numpy <span class=\"\
      kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\">analyze_serving_latencies</span>(traces: list):\n\
      \    ttft_list = [t[<span class=\"str\">\"first_token_ms\"</span>] <span class=\"kw\">for</span> t <span class=\"kw\"\
