  - num_str: QUESTION 1 OF 4
    question: What is the fundamental difference between Weight-Only Quantization (e.g. GPTQ/AWQ) and Weight-Activation Quantization (e.g. SmoothQuant)?
    qid: q152_1
    options:
    - letter: A
      text: Weight-only quantizes model weights to INT4/INT8 while keeping activations in FP16; weight-activation quantizes both weights and activations to INT8 for full integer compute.
      is_correct: true
    - letter: B
      text: Weight-only runs on CPUs only; weight-activation runs on quantum computers.
      is_correct: false
    - letter: C
      text: Weight-only deletes all biases; weight-activation deletes all weights.
      is_correct: false
    - letter: D
      text: There is no difference.
      is_correct: false
    correct_fb: ✅ Correct! Weight-only reduces memory bandwidth bottlenecks during memory-bound decoding; weight-activation accelerates compute-bound matrix multiplications on INT8 Tensor Cores.
    wrong_fb: ❌ Incorrect. Weight-only quantization focuses on VRAM memory footprint reduction, while weight-activation quantization enables INT8 GEMM tensor operations.
  - num_str: QUESTION 2 OF 4
    question: How does AWQ (Activation-aware Weight Quantization) protect model accuracy during 4-bit compression?
    qid: q152_2
    options:
    - letter: A
      text: It identifies the 1% most salient weight channels based on activation magnitudes and protects them from aggressive quantization error.
      is_correct: true
    - letter: B
      text: It doubles the size of every layer in the model.
      is_correct: false
    - letter: C
      text: It removes all negative numbers from the tensor.
      is_correct: false
    - letter: D
      text: It replaces floating point weights with random integers.
      is_correct: false
    correct_fb: ✅ Correct! AWQ observes activation outliers and applies per-channel scaling to protect high-impact weight channels from quantization distortion.
    wrong_fb: ❌ Incorrect. AWQ protects salient weights corresponding to large activation magnitudes, preserving model reasoning capabilities.
