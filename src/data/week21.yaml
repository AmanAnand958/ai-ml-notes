  theory_html: "<h3 class=\"sh3\">1. The Computational Cost of Full Fine-Tuning</h3>\n<p>\nFull fine-tuning of a 70-billion\
    \ parameter foundation model requires updating all parameters $\\mathbf{W} \\in \\mathbb{R}^{d \times k}$. In standard\
    \ AdamW optimization:\n</p>\n<ul>\n  <li><strong>Model Weights (FP16):</strong> $70\text{B} \times 2\text{B} = 140\text{GB}$.</li>\n\
    \  <li><strong>Gradients (FP16):</strong> $70\text{B} \times 2\text{B} = 140\text{GB}$.</li>\n  <li><strong>Optimizer\
    \ States (FP32 First & Second Moments):</strong> $70\text{B} \times 8\text{B} = 560\text{GB}$.</li>\n  <li><strong>Total\
    \ Minimum VRAM:</strong> $\\mathbf{840\text{GB}}$ across at least 11x NVIDIA A100 (80GB) GPUs.</li>\n</ul>\n\n<div style=\"\
    margin: 1.5rem 0; text-align: center;\">\n<svg aria-label=\"LoRA Low-Rank Decomposition Architecture\" height=\"250\"\
    \ viewBox=\"0 0 680 250\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width: 100%; height: auto; font-family:\
    \ var(--font-mono, monospace);\">\n  <rect x=\"10\" y=\"10\" width=\"660\" height=\"230\" rx=\"10\" fill=\"#0f172a\" stroke=\"\
    #334155\" stroke-width=\"2\"/>\n  <text x=\"25\" y=\"35\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\">LoRA:\
    \ Low-Rank Adapter Decomposition (W = W_0 + (α/r)·B·A)</text>\n\n  <rect x=\"30\" y=\"90\" width=\"70\" height=\"55\"\
    \ rx=\"6\" fill=\"#1e293b\" stroke=\"#94a3b8\"/>\n  <text x=\"45\" y=\"122\" fill=\"#f8fafc\" font-size=\"12\" font-weight=\"\
    bold\">x ∈ R^d</text>\n\n  <path d=\"M 100 117 L 160 80\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <rect x=\"160\" y=\"\
    50\" width=\"220\" height=\"60\" rx=\"6\" fill=\"#1e293b\" stroke=\"#64748b\" stroke-width=\"2\"/>\n  <text x=\"175\"\
    \ y=\"75\" fill=\"#94a3b8\" font-size=\"11\" font-weight=\"bold\">Frozen Base Weights W_0</text>\n  <text x=\"195\" y=\"\
    95\" fill=\"#ef4444\" font-size=\"10\">d × k (Zero Gradient Updates)</text>\n\n  <path d=\"M 100 117 L 160 160\" stroke=\"\
    #38bdf8\" stroke-width=\"2\"/>\n  <rect x=\"160\" y=\"140\" width=\"130\" height=\"45\" rx=\"6\" fill=\"#0284c7\" stroke=\"\
    #38bdf8\"/>\n  <text x=\"175\" y=\"162\" fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\">LoRA Matrix A</text>\n\
    \  <text x=\"185\" y=\"177\" fill=\"#e0f2fe\" font-size=\"9\">r × k (Gaussian Init)</text>\n\n  <path d=\"M 290 162 L\
    \ 320 162\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n  <circle cx=\"330\" cy=\"162\" r=\"8\" fill=\"#38bdf8\"/>\n  <text\
    \ x=\"323\" y=\"190\" fill=\"#7dd3fc\" font-size=\"9\">rank r=16</text>\n\n  <path d=\"M 340 162 L 370 162\" stroke=\"\
    #38bdf8\" stroke-width=\"2\"/>\n  <rect x=\"370\" y=\"140\" width=\"130\" height=\"45\" rx=\"6\" fill=\"#0284c7\" stroke=\"\
    #38bdf8\"/>\n  <text x=\"385\" y=\"162\" fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\">LoRA Matrix B</text>\n\
    \  <text x=\"395\" y=\"177\" fill=\"#e0f2fe\" font-size=\"9\">d × r (Zero Init)</text>\n\n  <path d=\"M 380 80 L 540 110\"\
    \ stroke=\"#64748b\" stroke-width=\"2\"/>\n  <path d=\"M 500 162 L 540 125\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n\
    \  \n  <circle cx=\"550\" cy=\"117\" r=\"14\" fill=\"#22c55e\"/>\n  <text x=\"544\" y=\"122\" fill=\"#ffffff\" font-size=\"\
    16\" font-weight=\"bold\">+</text>\n\n  <path d=\"M 564 117 L 610 117\" stroke=\"#22c55e\" stroke-width=\"2\"/>\n  <rect\
    \ x=\"610\" y=\"90\" width=\"50\" height=\"55\" rx=\"6\" fill=\"#1e293b\" stroke=\"#22c55e\"/>\n  <text x=\"625\" y=\"\
    122\" fill=\"#22c55e\" font-size=\"13\" font-weight=\"bold\">h</text>\n</svg>\n<div class=\"diagram-cap\">Figure 153.1:\
    \ LoRA Parameter Decomposition: Freezing massive base weights and training low-rank bottleneck projections.</div>\n</div>\n\
    \n<h3 class=\"sh3\">2. LoRA Mathematical Formulation</h3>\n<p>\nHu et al. (2021) hypothesized that the weight updates\
    \ $\\Delta \\mathbf{W}$ during adaptation have a low <strong>intrinsic rank</strong> $r \\ll \\min(d, k)$. The weight\
    \ matrix forward pass is modified as:\n</p>\n<div class=\"math-block\">\n$$\\mathbf{h} = \\mathbf{W}_0 \\mathbf{x} + \\\
    Delta \\mathbf{W} \\mathbf{x} = \\mathbf{W}_0 \\mathbf{x} + \frac{\alpha}{r} (\\mathbf{B} \\cdot \\mathbf{A}) \\mathbf{x}$$\n\
    </div>\n<p>\nWhere:\n</p>\n<ul>\n  <li>$\\mathbf{W}_0 \\in \\mathbb{R}^{d \times k}$ is frozen (zero gradients, zero optimizer\
    \ states).</li>\n  <li>$\\mathbf{A} \\in \\mathbb{R}^{r \times k}$ is initialized with Gaussian noise $\\mathcal{N}(0,\
    \ \\sigma^2)$.</li>\n  <li>$\\mathbf{B} \\in \\mathbb{R}^{d \times r}$ is initialized to zero, ensuring $\\Delta \\mathbf{W}\
    \ = 0$ at the start of training.</li>\n  <li>$\alpha$ is a constant scaling hyperparameter (typically $\alpha = 2r$).</li>\n\
    </ul>\n\n<h3 class=\"sh3\">3. QLoRA: NormalFloat4 (NF4) & Double Quantization</h3>\n<p>\nDettmers et al. (2023) introduced\
    \ <strong>QLoRA</strong>, reducing the memory footprint to a single 48GB GPU by combining:\n</p>\n<ol>\n  <li><strong>NF4\
    \ Quantization:</strong> An information-theoretically optimal quantile quantization data type for normally distributed\
    \ neural weights.</li>\n  <li><strong>Double Quantization (DQ):</strong> Quantizes the quantization constants themselves,\
    \ saving an additional 0.37 bits per parameter.</li>\n  <li><strong>Paged Optimizers:</strong> Automatically pages AdamW\
    \ optimizer states from GPU VRAM to host CPU RAM during memory spikes.</li>\n</ol>\n\n<h3 class=\"sh3\">4. Production\
    \ PyTorch Custom LoRA Linear Layer</h3>\n<div class=\"cb\">\n  <div class=\"cb-head\"><span class=\"cb-lang\">python</span><div\
    \ class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n  <pre><code><span\
    \ class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n<span class=\"\
    kw\">import</span> math\n\n<span class=\"kw\">class</span> <span class=\"fn\">LoRALinear</span>(nn.Module):\n    <span\
    \ class=\"kw\">def</span> <span class=\"fn\">__init__</span>(self, in_features: int, out_features: int, rank: int = <span\
    \ class=\"num\">16</span>, alpha: float = <span class=\"num\">32.0</span>):\n        super().__init__()\n        self.in_features\
    \ = in_features\n        self.out_features = out_features\n        self.rank = rank\n        self.scaling = alpha / rank\n\
    \n        <span class=\"cm\"># 1. Base Weight (Frozen)</span>\n        self.weight = nn.Parameter(torch.randn(out_features,\
    \ in_features), requires_grad=<span class=\"kw\">False</span>)\n        \n        <span class=\"cm\"># 2. Trainable Low-Rank\
    \ Adapters</span>\n        self.lora_A = nn.Parameter(torch.zeros(rank, in_features))\n        self.lora_B = nn.Parameter(torch.zeros(out_features,\
    \ rank))\n        \n        <span class=\"cm\"># 3. Initialization</span>\n        nn.init.kaiming_uniform_(self.lora_A,\
    \ a=math.sqrt(<span class=\"num\">5</span>))\n        nn.init.zeros_(self.lora_B)\n\n    <span class=\"kw\">def</span>\
    \ <span class=\"fn\">forward</span>(self, x: torch.Tensor) -> torch.Tensor:\n        base_out = nn.functional.linear(x,\
    \ self.weight)\n        lora_out = (x @ self.lora_A.T @ self.lora_B.T) * self.scaling\n        <span class=\"kw\">return</span>\
    \ base_out + lora_out\n\n    <span class=\"kw\">def</span> <span class=\"fn\">merge_weights</span>(self):\n        <span\
    \ class=\"str\">\"\"\"Permanently fold adapter into base weight for zero-latency inference.\"\"\"</span>\n        self.weight.data\
    \ += (self.lora_B @ self.lora_A) * self.scaling</code></pre>\n</div>"
