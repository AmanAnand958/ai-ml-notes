      total_ms\"] - t[\"first_token_ms\"]) / max(1, t[\"output_tokens\"</span>] - <span class=\"num\">1</span>) <span class=\"kw\">for</span> t <span class=\"kw\">in</span> traces]\n    \n<span class=\"kw\">return</span> {\n        <span class=\"str\">\"p50_ttft_ms\"</span>: <span class=\"fn\">round</span>(<span class=\"fn\">float</span>(np.<span class=\"fn\">percentile</span>(ttft_list, <span class=\"num\">50</span>)), <span class=\"num\">2</span>),\n        <span class=\"str\">\"p95_ttft_ms\"</span>: <span class=\"fn\">round</span>(<span class=\"fn\">float</span>(np.<span class=\"fn\">percentile</span>(ttft_list, <span class=\"num\">95</span>)), <span class=\"num\">2</span>),\n        <span class=\"str\">\"p50_tpot_ms\"</span>: <span class=\"fn\">round</span>(<span class=\"fn\">float</span>(np.<span class=\"fn\">percentile</span>(tpot_list, <span class=\"num\">50</span>)), <span class=\"num\">2</span>),\n        <span class=\"str\">\"p95_tpot_ms\"</span>: <span class=\"fn\">round</span>(<span\
      \ class=\"fn\">float</span>(np.<span class=\"fn\">percentile</span>(tpot_list, <span class=\"num\">95</span>)), <span class=\"num\">2</span>)\n    }\n\ntraces = [\n    {<span class=\"str\">\"first_token_ms\": 120, \"total_ms\": 800, \"output_tokens\"</span>: <span class=\"num\">30</span>},\n    {<span class=\"str\">\"first_token_ms\": 145, \"total_ms\": 950, \"output_tokens\"</span>: <span class=\"num\">35</span>},\n    {<span class=\"str\">\"first_token_ms\": 210, \"total_ms\": 1200, \"output_tokens\"</span>: <span class=\"num\">40</span>}\n]\n<span class=\"fn\">print</span>(<span class=\"str\">\"Serving Benchmarks:\"</span>, <span class=\"fn\">analyze_serving_latencies</span>(traces))</pre>\n</div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono); font-size:12px;\">\n<strong>\n         Expected Verification Output:\n        </strong>\n<br/>\n\n         Serving Benchmarks:\
