  analogy: 'PagedAttention is like operating system virtual memory paging: instead of requiring a massive contiguous parking
    lot for a 50-car freight train, it breaks the train into separate cars and parks them in whatever open parking spots are
    available across the city.'
  theory_html: "<h3 class=\"sh3\">1. GPU VRAM Memory Anatomy in Production LLM Serving</h3>\n<p>\nServing large language models\
    \ in production requires managing three distinct memory components in GPU High-Bandwidth Memory (HBM):\n</p>\n<ol>\n \
    \ <li><strong>Model Weights ($M_{\text{weights}}$):</strong> Fixed static memory ($P \times \text{BytesPerParam}$). For\
    \ example, Llama-3-70B in 16-bit precision requires $70 \times 2 = 140\text{GB}$ VRAM across GPUs.</li>\n  <li><strong>Activation\
    \ Tensors:</strong> Ephemeral intermediate tensor activations during forward passes ($O(B \times S \times d)$).</li>\n\
    \  <li><strong>Key-Value (KV) Cache ($M_{\text{KV}}$):</strong> Dynamically grows linearly with concurrent batch size\
    \ ($B$) and generation sequence length ($S$). For standard multi-head attention:\n    <div class=\"math-block\">\n   \
    \ $$M_{\text{KV}} = 2 \times n_{\text{layers}} \times n_{\text{heads}} \times d_{\text{head}} \times \text{BytesPerElem}\
    \ \times B \times S$$\n    </div>\n  </li>\n</ol>\n<p>\nIn legacy serving frameworks (e.g. Hugging Face TGI 1.0), KV cache\
    \ memory was pre-allocated contiguously for the maximum possible context length (e.g. $S = 4096$). Because actual user\
    \ requests vary widely (most queries are &lt;500 tokens), <strong>60% to 80% of GPU VRAM was permanently wasted</strong>\
    \ on unused pre-allocated slots, causing severe memory fragmentation and limiting concurrent throughput.\n</p>\n\n<div\
    \ style=\"margin: 1.5rem 0; text-align: center;\">\n<svg aria-label=\"PagedAttention Virtual Block Table Mapping\" height=\"\
    260\" viewBox=\"0 0 720 260\" width=\"720\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width: 100%; height: auto;\
    \ font-family: var(--font-mono, monospace);\">\n  <defs>\n    <linearGradient id=\"paged-bg-21\" x1=\"0%\" y1=\"0%\" x2=\"\
    100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#09090b\"/>\n      <stop offset=\"100%\" stop-color=\"#18181b\"\
    />\n    </linearGradient>\n  </defs>\n\n  <rect x=\"10\" y=\"10\" width=\"700\" height=\"240\" rx=\"10\" fill=\"url(#paged-bg-21)\"\
    \ stroke=\"#27272a\" stroke-width=\"2\"/>\n  <text x=\"25\" y=\"35\" fill=\"#22c55e\" font-size=\"13\" font-weight=\"\
    bold\">PagedAttention: Virtual Memory Block Mapping (Zero Fragmentation)</text>\n\n  <!-- Logical Sequence Blocks -->\n\
    \  <rect x=\"30\" y=\"60\" width=\"180\" height=\"170\" rx=\"8\" fill=\"#18181b\" stroke=\"#3f3f46\"/>\n  <text x=\"45\"\
    \ y=\"85\" fill=\"#a1a1aa\" font-size=\"11\" font-weight=\"bold\">Logical Sequence</text>\n  \n  <rect x=\"40\" y=\"95\"\
    \ width=\"160\" height=\"35\" rx=\"4\" fill=\"#27272a\" stroke=\"#60a5fa\"/>\n  <text x=\"50\" y=\"117\" fill=\"#60a5fa\"\
    \ font-size=\"10.5\">Block 0 (Tokens 0-15)</text>\n\n  <rect x=\"40\" y=\"135\" width=\"160\" height=\"35\" rx=\"4\" fill=\"\
    #27272a\" stroke=\"#f472b6\"/>\n  <text x=\"50\" y=\"157\" fill=\"#f472b6\" font-size=\"10.5\">Block 1 (Tokens 16-31)</text>\n\
    \n  <rect x=\"40\" y=\"175\" width=\"160\" height=\"35\" rx=\"4\" fill=\"#27272a\" stroke=\"#facc15\"/>\n  <text x=\"\
    50\" y=\"197\" fill=\"#facc15\" font-size=\"10.5\">Block 2 (Tokens 32-47)</text>\n\n  <!-- Page Table (Mapping Directory)\
    \ -->\n  <rect x=\"250\" y=\"60\" width=\"180\" height=\"170\" rx=\"8\" fill=\"#18181b\" stroke=\"#22c55e\" stroke-width=\"\
    1.5\"/>\n  <text x=\"270\" y=\"85\" fill=\"#4ade80\" font-size=\"11\" font-weight=\"bold\">Block Table (Directory)</text>\n\
    \  <text x=\"265\" y=\"115\" fill=\"#f8fafc\" font-size=\"10.5\">Logical 0 → Physical 7</text>\n  <text x=\"265\" y=\"\
    155\" fill=\"#f8fafc\" font-size=\"10.5\">Logical 1 → Physical 23</text>\n  <text x=\"265\" y=\"195\" fill=\"#f8fafc\"\
    \ font-size=\"10.5\">Logical 2 → Physical 12</text>\n\n  <!-- Arrows from logical to table -->\n  <path d=\"M 200 112\
    \ L 250 112\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <path d=\"M 200 152 L 250 152\" stroke=\"#f472b6\" stroke-width=\"\
    2\"/>\n  <path d=\"M 200 192 L 250 192\" stroke=\"#facc15\" stroke-width=\"2\"/>\n\n  <!-- Physical Non-Contiguous GPU\
    \ Memory -->\n  <rect x=\"470\" y=\"60\" width=\"220\" height=\"170\" rx=\"8\" fill=\"#18181b\" stroke=\"#3f3f46\"/>\n\
    \  <text x=\"490\" y=\"85\" fill=\"#a1a1aa\" font-size=\"11\" font-weight=\"bold\">Physical GPU VRAM Pages</text>\n\n\
    \  <rect x=\"480\" y=\"95\" width=\"200\" height=\"30\" rx=\"4\" fill=\"#1e293b\" stroke=\"#60a5fa\"/>\n  <text x=\"490\"\
    \ y=\"115\" fill=\"#60a5fa\" font-size=\"10\">Phys Block 7: Tokens 0-15</text>\n\n  <rect x=\"480\" y=\"130\" width=\"\
    200\" height=\"30\" rx=\"4\" fill=\"#1e293b\" stroke=\"#3f3f46\"/>\n  <text x=\"490\" y=\"150\" fill=\"#71717a\" font-size=\"\
    9.5\">Phys Block 8..22: Other Requests</text>\n\n  <rect x=\"480\" y=\"165\" width=\"200\" height=\"30\" rx=\"4\" fill=\"\
    #1e293b\" stroke=\"#f472b6\"/>\n  <text x=\"490\" y=\"185\" fill=\"#f472b6\" font-size=\"10\">Phys Block 23: Tokens 16-31</text>\n\
    </svg>\n<div class=\"diagram-cap\">Figure 150.1: PagedAttention Virtual Memory Block Mapping: Physical non-contiguous\
    \ memory allocation eliminating GPU KV cache fragmentation.</div>\n</div>\n\n<h3 class=\"sh3\">2. PagedAttention Mathematical\
    \ Architecture</h3>\n<p>\nDeveloped by Kwon et al. (UC Berkeley / vLLM), <strong>PagedAttention</strong> partitions the\
    \ KV cache of each sequence into fixed-size physical blocks (e.g. 16 or 32 tokens per block). The attention computation\
    \ over partitioned non-contiguous memory pages is evaluated as:\n</p>\n<div class=\"math-block\">\n$$\\mathbf{A}_i = \f\
    rac{\\mathbf{q}_i \\mathbf{K}_j^T}{\\sqrt{d_k}} = \frac{1}{\\sqrt{d_k}} \\sum_{t=1}^{N} \\mathbf{q}_i \\mathbf{k}_t^T$$\n\
    $$\\mathbf{o}_i = \\sum_{j=1}^{\\lceil N / B \rceil} \\sum_{t \\in \text{Block}_j} \text{Softmax}(\\mathbf{A}_{i, t})\
    \ \\mathbf{v}_t$$\n</div>\n<p>\nBecause blocks are allocated dynamically on demand, memory waste is bounded to at most\
    \ one partial block per sequence (&lt;4% total VRAM waste), increasing concurrent serving capacity by <strong>2x to 4x</strong>\
    \ on identical GPU hardware.\n</p>\n\n<h3 class=\"sh3\">3. Production Python Implementation: Block Table Memory Manager</h3>\n\
    <div class=\"cb\">\n  <div class=\"cb-head\"><span class=\"cb-lang\">python</span><div class=\"cb-btns\"><button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n  <pre><code><span class=\"kw\">from</span> typing <span\
    \ class=\"kw\">import</span> List, Dict, Optional\n<span class=\"kw\">import</span> math\n\n<span class=\"kw\">class</span>\
    \ <span class=\"fn\">BlockMemoryManager</span>:\n    <span class=\"str\">\"\"\"\n    Simulates vLLM PagedAttention Block\
    \ Allocator and Virtual Page Directory.\n    \"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(self,\
    \ total_gpu_blocks: int = <span class=\"num\">1024</span>, block_size: int = <span class=\"num\">16</span>):\n       \
    \ self.total_blocks = total_gpu_blocks\n        self.block_size = block_size\n        self.free_blocks: List[int] = list(range(total_gpu_blocks))\n\
    \        self.block_tables: Dict[str, List[int]] = {}\n\n    <span class=\"kw\">def</span> <span class=\"fn\">allocate_sequence</span>(self,\
    \ seq_id: str, prompt_len: int) -> List[int]:\n        num_blocks_needed = math.ceil(prompt_len / self.block_size)\n \
    \       <span class=\"kw\">if</span> len(self.free_blocks) < num_blocks_needed:\n            <span class=\"kw\">raise</span>\
    \ MemoryError(<span class=\"str\">\"Out of GPU Memory: Cannot allocate KV blocks.\"</span>)\n        \n        allocated\
    \ = [self.free_blocks.pop(<span class=\"num\">0</span>) <span class=\"kw\">for</span> _ <span class=\"kw\">in</span> range(num_blocks_needed)]\n\
    \        self.block_tables[seq_id] = allocated\n        <span class=\"kw\">return</span> allocated\n\n    <span class=\"\
    kw\">def</span> <span class=\"fn\">append_token</span>(self, seq_id: str, current_len: int) -> Optional[int]:\n      \
    \  <span class=\"cm\"># If token spills over into a new block, allocate dynamic page</span>\n        <span class=\"kw\"\
    >if</span> current_len % self.block_size == <span class=\"num\">0</span>:\n            <span class=\"kw\">if</span> <span\
    \ class=\"kw\">not</span> self.free_blocks:\n                <span class=\"kw\">raise</span> MemoryError(<span class=\"\
    str\">\"GPU VRAM exhausted during token generation.\"</span>)\n            new_block = self.free_blocks.pop(<span class=\"\
    num\">0</span>)\n            self.block_tables[seq_id].append(new_block)\n            <span class=\"kw\">return</span>\
    \ new_block\n        <span class=\"kw\">return</span> <span class=\"kw\">None</span>\n\n    <span class=\"kw\">def</span>\
    \ <span class=\"fn\">free_sequence</span>(self, seq_id: str):\n        <span class=\"kw\">if</span> seq_id <span class=\"\
    kw\">in</span> self.block_tables:\n            blocks = self.block_tables.pop(seq_id)\n            self.free_blocks.extend(blocks)</code></pre>\n\
    </div>\n\n<h3 class=\"sh3\">4. Continuous Batching (Iteration-Level Scheduling)</h3>\n<p>\nTraditional static batching\
    \ groups $B$ requests together until all sequences finish generating. Because text lengths vary widely, short requests\
    \ are trapped waiting for the longest request in the batch to complete (the <em>head-of-line blocking problem</em>).\n\
    </p>\n<p>\n<strong>Continuous Batching (Orca / vLLM)</strong> schedules requests at the iteration level: at every forward\
    \ pass step, finished requests are evicted immediately, free blocks are recycled, and newly arrived queries from the queue\
    \ are admitted without waiting for the batch boundary.\n</p>\n\n<h3 class=\"sh3\">5. Serving Benchmark Comparison: Throughput\
    \ vs Latency</h3>\n<table style=\"width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px;\">\n  <thead>\n\
    \    <tr style=\"border-bottom:2px solid var(--border); text-align:left;\">\n      <th style=\"padding:8px;\">Serving\
    \ Engine</th>\n      <th style=\"padding:8px;\">Throughput (Tokens/s)</th>\n      <th style=\"padding:8px;\">Memory Fragmentation</th>\n\
    \      <th style=\"padding:8px;\">Copy-on-Write Sharing</th>\n      <th style=\"padding:8px;\">p95 TTFT</th>\n    </tr>\n\
    \  </thead>\n  <tbody>\n    <tr style=\"border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"><strong>Hugging\
    \ Face TGI 1.0</strong></td>\n      <td style=\"padding:8px;\">180 tok/s</td>\n      <td style=\"padding:8px;\">68%</td>\n\
    \      <td style=\"padding:8px;\">No</td>\n      <td style=\"padding:8px;\">140ms</td>\n    </tr>\n    <tr style=\"border-bottom:1px\
    \ solid var(--border);\">\n      <td style=\"padding:8px;\"><strong>vLLM (PagedAttention)</strong></td>\n      <td style=\"\
    padding:8px;\"><strong>720 tok/s (4x)</strong></td>\n      <td style=\"padding:8px;\"><strong>&lt;4%</strong></td>\n \
    \     <td style=\"padding:8px;\"><strong>Yes (Fork/Beam Search)</strong></td>\n      <td style=\"padding:8px;\"><strong>38ms</strong></td>\n\
    \    </tr>\n    <tr style=\"border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"><strong>TensorRT-LLM\
    \ (NVIDIA)</strong></td>\n      <td style=\"padding:8px;\"><strong>810 tok/s</strong></td>\n      <td style=\"padding:8px;\"\
    >&lt;5%</td>\n      <td style=\"padding:8px;\">Yes</td>\n      <td style=\"padding:8px;\">32ms</td>\n    </tr>\n  </tbody>\n\
    </table>"
  predict:
    question: What integer gigabytes of VRAM are required for the KV cache of a batch size 16 request on LLaMA-3-8B (32 layers,
      32 heads, dim 128, seq_len 4096, FP16)?
    answer: '8'
    explanation: 2 * 2 bytes * 32 layers * 32 heads * 128 head_dim * 16 batch * 4096 tokens = 8,589,934,592 bytes = 8.0 GB
      VRAM.
    code: |-
      dtype = 2 # FP16 bytes
      layers = 32
      heads = 32
      head_dim = 128
      batch = 16
      seq_len = 4096
      vram_bytes = 2 * dtype * layers * heads * head_dim * batch * seq_len
      vram_gb = vram_bytes / (1024 ** 3)
      print(int(vram_gb))
