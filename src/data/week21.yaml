    correct: a
  - num_str: QUESTION 3 OF 4
    question: How does Odds Ratio Preference Optimization (ORPO) simplify the alignment
      pipeline compared to standard DPO?
    qid: q154_3
    options:
    - letter: A
      text: It adds multiple extra MLP heads to the target model's final hidden state
