    solution_code: ''
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: How does Direct Preference Optimization (DPO) simplify alignment compared to RLHF with PPO?
    qid: q153_1
    options:
    - letter: A
      text: It mathematically derives the policy loss directly from preference pairs $(y_w, y_l)$, eliminating the need to train a separate reward model or use complex reinforcement learning.
      is_correct: true
    - letter: B
      text: It eliminates the need for any human preference data.
      is_correct: false
    - letter: C
      text: It trains models in zero seconds.
      is_correct: false
    - letter: D
      text: It only works on image generation models.
      is_correct: false
    correct_fb: ✅ Correct! Rafailov et al. proved that language models implicitly define their own reward function, allowing direct cross-entropy optimization on preference pairs.
    wrong_fb: ❌ Incorrect. DPO bypasses reward modeling and PPO actor-critic loops by optimizing an exact closed-form objective directly on chosen/rejected pairs.
  - num_str: QUESTION 2 OF 4
    question: In the DPO loss function, what role does the reference model $\pi_{\text{ref}}$ play?
    qid: q153_2
    options:
    - letter: A
      text: It acts as an anchor (via implicit KL divergence regularization) to prevent the policy model from drifting too far from the base instruction model.
      is_correct: true
    - letter: B
      text: It generates random text to test server latency.
      is_correct: false
    - letter: C
      text: It encrypts user prompts.
      is_correct: false
    - letter: D
      text: It calculates token billing costs.
      is_correct: false
    correct_fb: ✅ Correct! The reference model log-probabilities penalize policy drift, preventing reward hacking and catastrophic forgetting during preference tuning.
    wrong_fb: ❌ Incorrect. The frozen reference model provides KL regularization to prevent policy collapse during alignment.
  - num_str: QUESTION 3 OF 4
    question: What hyperparameter in DPO controls the strength of the KL divergence penalty against the reference model?
    qid: q153_3
    options:
    - letter: A
      text: "Beta ($\beta$), where higher values enforce stricter adherence to the reference model."
      is_correct: true
    - letter: B
      text: Epsilon ($\epsilon$).
      is_correct: false
    - letter: C
      text: Gamma ($\gamma$).
      is_correct: false
    - letter: D
      text: Learning rate warmup steps.
      is_correct: false
    correct_fb: "✅ Correct! Beta ($\beta \\in [0.1, 0.5]$) controls the implicit reward scaling and temperature penalty against the reference policy."
    wrong_fb: "❌ Incorrect. Beta ($\beta$) regulates how tightly the policy is constrained to the reference model during DPO training."
  - num_str: QUESTION 4 OF 4
    question: What is Kahneman-Tversky Optimization (KTO) and how does it differ from DPO in data collection?
    qid: q153_4
    options:
    - letter: A
      text: KTO trains on unpaired binary feedback (individual thumbs-up / thumbs-down examples) rather than strict pairwise comparisons $(y_w  y_l)$.
      is_correct: true
    - letter: B
      text: KTO requires 100x more data than DPO.
      is_correct: false
    - letter: C
      text: KTO only works on classification models.
      is_correct: false
    - letter: D
      text: KTO eliminates the transformer architecture.
      is_correct: false
    correct_fb: ✅ Correct! KTO directly maximizes the utility of individual positive and negative examples based on prospect theory, easing real-world data collection.
    wrong_fb: ❌ Incorrect. KTO operates on binary signals (good/bad) rather than pairwise preferences, making enterprise data curation significantly easier.
  flashcards:
  - front: LoRA
    back: Low-Rank Adaptation. Freezes base weights, trains tiny A and B matrices.
  - front: QLoRA
