      """
      Production Implementation: Task 2: Implement Synthetic Data & Deduplication
      Module: Day 155 — Synthetic Data & Deduplication
      """

      # Day 155 Task 2: Synthetic Data & Deduplication Pipeline
      import hashlib

      def deduplicate_samples(texts: list) -> list:
          seen = set()
          unique = []
          for t in texts:
              h = hashlib.md5(t.strip().lower().encode()).hexdigest()
              if h not in seen:
                  seen.add(h)
                  unique.append(t)
          return unique

      corpus = ["Fine-tuning dataset prompt", "fine-tuning dataset prompt ", "Unique question"]
      deduped = deduplicate_samples(corpus)
      print(f"Original: {len(corpus)} -> Deduped: {len(deduped)}")
