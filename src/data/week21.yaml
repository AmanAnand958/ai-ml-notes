  quizzes:
  - num_str: QUESTION 1 OF 4
    question: In LoRA (Low-Rank Adaptation), how is the weight update matrix Delta W represented?
    qid: q151_1
    options:
    - letter: A
      text: "As the product of two low-rank decomposed matrices B and A ($\\Delta W = B \\cdot A$), where $B \\in \\mathbb{R}^{d \t\\times r}$ and $A \\in \\mathbb{R}^{r \t\\times k}$ with rank $r \\ll d$."
      is_correct: true
    - letter: B
      text: As a single random integer scalar.
      is_correct: false
    - letter: C
      text: As an encrypted string hash.
      is_correct: false
    - letter: D
      text: As an uncompressed full-rank copy of the base model.
      is_correct: false
    correct_fb: ✅ Correct! Decomposing the parameter update into low-rank matrices reduces trainable parameters by up to 99% while freezing base weights $W_0$.
    wrong_fb: ❌ Incorrect. LoRA models weight updates as low-rank matrices $B \cdot A$, drastically slashing memory requirements.
  - num_str: QUESTION 2 OF 4
    question: What is QLoRA and how does it achieve 4-bit fine-tuning without significant quality loss?
    qid: q151_2
    options:
    - letter: A
      text: It quantizes frozen base weights to 4-bit NormalFloat (NF4), adds double quantization, and uses paged optimizers during LoRA backpropagation.
      is_correct: true
    - letter: B
      text: It deletes all attention layers from the neural network.
      is_correct: false
    - letter: C
      text: It trains models exclusively on 8-bit CPUs.
      is_correct: false
    - letter: D
      text: It uses synthetic text generated by small models.
      is_correct: false
    correct_fb: ✅ Correct! QLoRA (Dettmers et al.) uses NF4 precision for frozen base weights and computes full 16-bit gradients across low-rank adapter matrices.
    wrong_fb: ❌ Incorrect. QLoRA combines 4-bit NormalFloat base weight quantization with 16-bit LoRA adapter training.
  - num_str: QUESTION 3 OF 4
    question: When merging LoRA adapter weights back into the base model for zero-latency inference, what mathematical operation is performed?
    qid: q151_3
    options:
    - letter: A
      text: "$W_{\\text{final}} = W_0 + \frac{\alpha}{r} (B \\cdot A)$, permanently baking adapter weights into base linear layers."
      is_correct: true
    - letter: B
      text: Dividing the base weights by the adapter rank $r$.
      is_correct: false
    - letter: C
      text: Concatenating the matrices side-by-side into a 2D array.
      is_correct: false
    - letter: D
      text: Subtracting the vocabulary matrix from base weights.
      is_correct: false
    correct_fb: "✅ Correct! Merging scales the adapter product by $\alpha / r$ and adds it directly to the base weights, eliminating inference latency overhead."
    wrong_fb: ❌ Incorrect. Merging adds the scaled low-rank update matrix directly into the base weights.
  - num_str: QUESTION 4 OF 4
    question: What is the purpose of the LoRA scaling hyperparameter alpha?
    qid: q151_4
    options:
    - letter: A
      text: It scales the magnitude of adapter updates relative to base model weights, stabilizing training dynamics when experimenting with rank $r$.
      is_correct: true
    - letter: B
      text: It sets the model's maximum output token limit.
      is_correct: false
    - letter: C
      text: It controls the GPU fan speed.
      is_correct: false
    - letter: D
      text: It determines the learning rate decay schedule.
      is_correct: false
    correct_fb: "✅ Correct! The scaling factor $\alpha / r$ acts as a constant multiplier on adapter gradients, maintaining consistent update magnitude when tuning $r$."
    wrong_fb: ❌ Incorrect. Alpha scales the contribution of low-rank adapter updates relative to the frozen base model.
