      \        curr.kv_cache_id = kv_id\n\n<span class=\"kw\">def</span> <span class=\"\
      fn\">match_prefix</span>(<span class=\"kw\">self</span>, tokens: tuple):\n \
      \       curr = <span class=\"kw\">self</span>.root\n        matched_len = <span\
      \ class=\"num\">0</span>\n        last_kv = <span class=\"kw\">None</span>\n\
      <span class=\"kw\">for</span> token <span class=\"kw\">in</span> tokens:\n \
      \           <span class=\"kw\">if</span> token <span class=\"kw\">in</span>\
      \ curr.children:\n                curr = curr.children[token]\n            \
      \    matched_len += <span class=\"num\">1</span>\n<span class=\"kw\">if</span>\
      \ curr.kv_cache_id:\n                    last_kv = curr.kv_cache_id\n      \
      \      <span class=\"kw\">else</span>:\n<span class=\"kw\">break</span>\n<span\
      \ class=\"kw\">return</span> matched_len, last_kv\n\ntree = <span class=\"fn\"\
      >RadixPrefixTree</span>()\ntree.<span class=\"fn\">insert</span>((<span class=\"\
      num\">1</span>, <span class=\"num\">2</span>, <span class=\"num\">3</span>,\
      \ <span class=\"num\">4</span>), <span class=\"str\">\"kv_sys_prompt_v1\"</span>)\n\
      matched_tokens, kv_ref = tree.<span class=\"fn\">match_prefix</span>((<span\
