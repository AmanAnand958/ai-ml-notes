  hinglish: Fine-tuning ke baad LoRA adapter ko base model ke sath merge karna padta hai taaki runtime forward pass mein zero latency overhead rahe. Fir AWQ 4-bit quantize karke vLLM container mein deploy kiya jata hai.
  analogy: 'Deploying a custom model is like tuning a race car: after fine-tuning the engine on the dyno, you permanently weld the custom turbocharger into the engine block (weight merge), calibrate the fuel injection (quantization), and put it on the race track (vLLM).'
  theory_html: "<h3 class=\"sh3\">Mathematical Formulation &amp; Performance Bounds</h3><div class=\"math-block\">\n$$ W_{Q} = \\text{dequantize}(W_{4bit}) + A B \\quad \\text{where } A \\in \\mathbb{R}^{d \\times r}, B \\in \\mathbb{R}^{r \\times k} $$\n<p class=\"math-caption\">QLoRA forward pass combining 4-bit base weights and low-rank adapters.</p>\n</div><p>\nThis optimization metric balances raw computational throughput against per-token GPU memory consumption and cluster financial cost.\n</p><div class=\"diagram-container\" style=\"background:var(--bg3); padding:1rem; border-radius:8px; margin:1rem 0; border:1px solid var(--border);\">\n<p><strong>System Execution Flowchart: Capstone: Deploying a Custom Fine-Tuned Model</strong></p>\n<div class=\"mermaid\">\ngraph LR\n    Input[\"1. Client Ingress Request\"] --&gt; Validate[\"2. Schema Validation &amp; Guardrails\"]\n    Validate --&gt; Pipeline[\"3. Core Computational Engine\"]\n    Pipeline --&gt; Cache[\"4. High-Speed Cache &amp;\
    \ Telemetry\"]\n    Cache --&gt; Egress[\"5. Verified Output Response\"]\n</div>\n</div><h3 class=\"sh3\">Production Engineering Walkthrough: Capstone: Deploying a Custom Fine-Tuned Model</h3><p>\nThe following production implementation demonstrates the core architecture, defensive error handling, and telemetry integration required for **Capstone: Deploying a Custom Fine-Tuned Model** in enterprise production systems:\n</p><div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — production_day_156_implementation.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre>\n# Production implementation with validated runtime dependencies\n# Day 156 — Production QLoRA Full Pipeline: Data Prep → Train → Merge → Serve\nimport time, logging, os\nfrom typing import Dict, Any, Optional, List\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"\
    QLoRACapstone\")\n\nclass QLoRAProductionPipeline:\n    \"\"\"\n    End-to-end production fine-tuning pipeline:\n    1. Data preparation (prompt formatting + tokenisation)\n    2. QLoRA training (4-bit + LoRA)\n    3. Adapter merging into base model\n    4. vLLM serving validation\n    \"\"\"\n\n    def __init__(self, base_model: str = \"meta-llama/Meta-Llama-3-8B-Instruct\",\n                 output_dir: str = \"./qlora_output\"):\n        self.base_model = base_model\n        self.output_dir = output_dir\n        os.makedirs(output_dir, exist_ok=True)\n\n    def prepare_dataset(self, raw_data: List[Dict[str, str]],\n                         prompt_template: str = \"&lt;|user|&gt;\n{instruction}\n&lt;|assistant|&gt;\n{response}\") -&gt; List[Dict]:\n        \"\"\"Format raw instruction-response pairs into prompt strings.\"\"\"\n        formatted = []\n        for item in raw_data:\n            text = prompt_template.format(**item)\n            tokens = len(text.split())  # approximate\n\
    \            if tokens &gt; 2048:\n                logger.warning(f\"Skipping over-length sample: {tokens} tokens\")\n                continue\n            formatted.append({\"text\": text, \"token_count\": tokens})\n        logger.info(f\"Dataset: {len(raw_data)} → {len(formatted)} samples after filtering\")\n        return formatted\n\n    def train(self, dataset: List[Dict], lora_r: int = 16, epochs: int = 3,\n               batch_size: int = 2, grad_accum: int = 8) -&gt; str:\n        from transformers import TrainingArguments\n        from peft import LoraConfig\n        args = TrainingArguments(\n            output_dir=self.output_dir,\n            num_train_epochs=epochs,\n            per_device_train_batch_size=batch_size,\n            gradient_accumulation_steps=grad_accum,\n            learning_rate=2e-4,\n            bf16=True, gradient_checkpointing=True,\n            logging_steps=10, save_strategy=\"epoch\",\n            optim=\"paged_adamw_32bit\",\n        )\n       \
    \ lora_cfg = LoraConfig(r=lora_r, lora_alpha=lora_r*2, target_modules=[\"q_proj\",\"v_proj\",\"k_proj\",\"o_proj\"])\n        logger.info(f\"Training config: r={lora_r}, epochs={epochs}, effective_batch={batch_size*grad_accum}\")\n        # (Actual training here with Trainer + 4-bit model)\n        return f\"{self.output_dir}/final_model\"\n\n    def merge_and_push(self, adapter_path: str, push_to_hub: Optional[str] = None) -&gt; str:\n        from peft import PeftModel\n        from transformers import AutoModelForCausalLM, AutoTokenizer\n        import torch\n        logger.info(\"Loading base model in fp16 for merge...\")\n        base = AutoModelForCausalLM.from_pretrained(self.base_model, torch_dtype=torch.float16, device_map=\"cpu\")\n        merged = PeftModel.from_pretrained(base, adapter_path)\n        merged = merged.merge_and_unload()\n        merged_path = f\"{self.output_dir}/merged\"\n        merged.save_pretrained(merged_path)\n        AutoTokenizer.from_pretrained(self.base_model).save_pretrained(merged_path)\n\
    \        if push_to_hub:\n            merged.push_to_hub(push_to_hub)\n        logger.info(f\"Merged model saved to {merged_path}\")\n        return merged_path\n\n    def validate_with_vllm(self, model_path: str, test_prompts: List[str]) -&gt; List[str]:\n        from vllm import LLM, SamplingParams\n        llm = LLM(model=model_path, dtype=\"float16\")\n        params = SamplingParams(max_tokens=200, temperature=0.1)\n        outputs = llm.generate(test_prompts, params)\n        results = [o.outputs[0].text for o in outputs]\n        logger.info(f\"vLLM validation: {len(results)} prompts passed\")\n        return results\n\nif __name__ == \"__main__\":\n    print(\"QLoRAProductionPipeline: Full fine-tuning flow\")\n    print(\"Phases: prepare_dataset → train → merge_and_push → validate_with_vllm\")\n    print(\"Key: gradient_checkpointing=True enables batch_size &gt; 1 on 24GB GPU with 8B model\")\n    # Simulate data prep\n    data = [{\"instruction\": f\"Explain {topic}\", \"response\"\
    : f\"Here is an explanation of {topic}...\"}\n            for topic in [\"HNSW\", \"BM25\", \"QLoRA\", \"FlashAttention\"]]\n    pipeline = QLoRAProductionPipeline()\n    formatted = pipeline.prepare_dataset(data)\n    print(f\"Formatted {len(formatted)}/{len(data)} samples\")\n    assert len(formatted) == len(data)\n    print(\"QLoRAProductionPipeline: OK\")\n</pre>\n</div>\n"
