    correct_fb: ✅ Correct! Iteration-level scheduling allows newly arrived requests to join the running batch on the very next token iteration without waiting for long sequences to complete. This pattern ensures mathematical consistency, minimizes runtime latency, and adheres to production-grade engineering standards.
    wrong_fb: ❌ Incorrect. Continuous batching evicts completed requests and injects new ones token-by-token, maximizing GPU Tensor Core saturation. In enterprise systems, selecting this alternative introduces subtle edge-case failures, unhandled memory overhead, or degraded precision.
    correct: a
