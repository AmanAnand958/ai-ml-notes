  quizzes:
  - num_str: QUESTION 1 OF 4
    question: What is the fundamental difference between Weight-Only Quantization
      (e.g. GPTQ/AWQ) and Weight-Activation Quantization (e.g. SmoothQuant)?
    qid: q152_1
    options:
    - letter: A
      text: Weight-only quantizes model weights to INT4/INT8 while keeping activations
        in FP16; weight-activation quantizes both weights and activations to INT8
        for full integer compute.
      is_correct: true
    - letter: B
      text: Weight-only runs on CPUs only; weight-activation runs on quantum computers.
      is_correct: false
    - letter: C
      text: Weight-only deletes all biases; weight-activation deletes all weights.
      is_correct: false
    - letter: D
      text: There is no difference.
      is_correct: false
    correct_fb: ✅ Correct! Weight-only reduces memory bandwidth bottlenecks during
      memory-bound decoding; weight-activation accelerates compute-bound matrix multiplications
      on INT8 Tensor Cores.
    wrong_fb: ❌ Incorrect. Weight-only quantization focuses on VRAM memory footprint
      reduction, while weight-activation quantization enables INT8 GEMM tensor operations.
  - num_str: QUESTION 2 OF 4
    question: How does AWQ (Activation-aware Weight Quantization) protect model accuracy
      during 4-bit compression?
    qid: q152_2
    options:
    - letter: A
      text: It identifies the 1% most salient weight channels based on activation
        magnitudes and protects them from aggressive quantization error.
      is_correct: true
    - letter: B
      text: It doubles the size of every layer in the model.
      is_correct: false
    - letter: C
      text: It removes all negative numbers from the tensor.
      is_correct: false
    - letter: D
      text: It replaces floating point weights with random integers.
      is_correct: false
    correct_fb: ✅ Correct! AWQ observes activation outliers and applies per-channel
      scaling to protect high-impact weight channels from quantization distortion.
    wrong_fb: ❌ Incorrect. AWQ protects salient weights corresponding to large activation
      magnitudes, preserving model reasoning capabilities.
  - num_str: QUESTION 3 OF 4
    question: What file format is standard for local CPU/GPU LLM inference using llama.cpp?
    qid: q152_3
    options:
    - letter: A
      text: GGUF (GPT-Generated Unified Format), which bundles metadata, tokenizer
        specs, and quantized tensors into a single binary file.
      is_correct: true
    - letter: B
      text: CSV spreadsheet files.
      is_correct: false
    - letter: C
      text: Plain text JSON files.
      is_correct: false
    - letter: D
      text: ZIP archives containing pickle files.
      is_correct: false
    correct_fb: ✅ Correct! GGUF is the high-performance unified binary format designed
      for efficient mmap loading and cross-platform execution in llama.cpp.
    wrong_fb: ❌ Incorrect. GGUF is the industry standard format for quantized single-file
      model distribution in llama.cpp.
  - num_str: QUESTION 4 OF 4
    question: What is the primary degradation symptom when an LLM is over-quantized
      (e.g. 2-bit quantization)?
    qid: q152_4
    options:
    - letter: A
      text: Severe perplexity spikes, repetitive text loops, and loss of complex multi-step
        reasoning capabilities.
      is_correct: true
    - letter: B
      text: The model generates text 100x faster.
      is_correct: false
    - letter: C
      text: The model switches its language to Latin.
      is_correct: false
    - letter: D
      text: The file size on disk expands.
      is_correct: false
    correct_fb: ✅ Correct! Extreme quantization below 3.5 bits per weight introduces
      severe rounding error, causing catastrophic perplexity and reasoning degradation.
    wrong_fb: ❌ Incorrect. Over-quantizing severely damages weight representations,
      leading to high perplexity and nonsensical generations.
  flashcards:
  - front: AWQ vs GPTQ Quantization?
    back: AWQ protects salient 1% activation weights while quantizing the rest; GPTQ
      uses second-order Hessian information to optimize weight rounding.
  - front: llama.cpp
    back: A C/C++ port of LLMs highly optimized for CPU inference and Apple Metal.
  - front: Q4_K_M
    back: 'A GGUF quantization variant: 4-bit weights with a mixed k-quants strategy
      for best quality/speed.'
  gotcha:
    title: '⚠️ Gotcha: Day 152 Pitfall Warning'
    description: "<p style=\"margin-top:0.4rem; margin-bottom:0;\">\n       Applying\
      \ standard INT4 quantization without outlier preservation (e.g., AWQ / GPTQ)\
      \ degrades perplexity significantly on attention projection layers.\n      </p>"
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       \"Quantization\
      \ lets you run state-of-the-art models on consumer hardware with minimal accuracy\
      \ loss.\""
    bullets:
    - The Bloke (HuggingFace) provides pre-quantized versions of almost all models.
    - 4-bit quantization reduces memory by roughly 75%.
