  hinglish: Standard serving mein KV cache ke liye maximum context (e.g. 4096) memory pehle se reserve karni padti thi, jisse 70% VRAM waste hoti thi. PagedAttention KV cache ko chote 16-token physical blocks mein tod kar virtual page table se map karta hai, jisse memory waste <4% ho jati hai.
  analogy: 'PagedAttention is like operating system virtual memory paging: instead of requiring a massive contiguous parking lot for a 50-car freight train, it breaks the train into separate cars and parks them in whatever open parking spots are available across the city.'
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">1. GPU VRAM Memory Anatomy in Production LLM Serving</h3>\n<p>\nServing large language models in production requires managing three distinct memory components in GPU High-Bandwidth Memory (HBM):\n</p>\n<ol>\n<li><strong>Model Weights ($M_{\\text{weights}}$):</strong> Fixed static memory ($P \\times \\text{BytesPerParam}$). For example, Llama-3-70B in 16-bit precision requires $70 \\times 2 = 140\\text{GB}$ VRAM across GPUs.</li>\n<li><strong>Activation Tensors:</strong> Ephemeral intermediate tensor activations during forward passes ($O(B \\times S \\times d)$).</li>\n<li><strong>Key-Value (KV) Cache ($M_{\\text{KV}}$):</strong> Dynamically grows linearly with concurrent batch size ($B$) and generation sequence length ($S$). For standard multi-head attention:\n    <div class=\"math-block\">\n    $$M_{\\text{KV}} = 2 \\times n_{\\text{layers}} \\times n_{\\text{heads}} \\times d_{\\text{head}} \\times\
    \ \\text{BytesPerElem} \\times B \\times S$$\n    </div>\n</li>\n</ol>\n<p>\nIn legacy serving frameworks (e.g. Hugging Face TGI 1.0), KV cache memory was pre-allocated contiguously for the maximum possible context length (e.g. $S = 4096$). Because actual user requests vary widely (most queries are &lt;500 tokens), <strong>60% to 80% of GPU VRAM was permanently wasted</strong> on unused pre-allocated slots, causing severe memory fragmentation and limiting concurrent throughput.\n</p>\n<div style=\"margin: 1.5rem 0; text-align: center;\">\n<svg aria-label=\"PagedAttention Virtual Block Table Mapping\" height=\"260\" style=\"max-width: 100%; height: auto; font-family: var(--font-mono, monospace);\" viewbox=\"0 0 720 260\" width=\"720\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<lineargradient id=\"paged-bg-21\" x1=\"0%\" x2=\"100%\" y1=\"0%\" y2=\"100%\">\n<stop offset=\"0%\" stop-color=\"#09090b\"></stop>\n<stop offset=\"100%\" stop-color=\"#18181b\"></stop>\n</lineargradient>\n\
    </defs>\n<rect fill=\"url(#paged-bg-21)\" height=\"240\" rx=\"10\" stroke=\"#27272a\" stroke-width=\"2\" width=\"700\" x=\"10\" y=\"10\"></rect>\n<text fill=\"#22c55e\" font-size=\"13\" font-weight=\"bold\" x=\"25\" y=\"35\">PagedAttention: Virtual Memory Block Mapping (Zero Fragmentation)</text>\n<!-- Logical Sequence Blocks -->\n<rect fill=\"#18181b\" height=\"170\" rx=\"8\" stroke=\"#3f3f46\" width=\"180\" x=\"30\" y=\"60\"></rect>\n<text fill=\"#a1a1aa\" font-size=\"11\" font-weight=\"bold\" x=\"45\" y=\"85\">Logical Sequence</text>\n<rect fill=\"#27272a\" height=\"35\" rx=\"4\" stroke=\"#60a5fa\" width=\"160\" x=\"40\" y=\"95\"></rect>\n<text fill=\"#60a5fa\" font-size=\"10.5\" x=\"50\" y=\"117\">Block 0 (Tokens 0-15)</text>\n<rect fill=\"#27272a\" height=\"35\" rx=\"4\" stroke=\"#f472b6\" width=\"160\" x=\"40\" y=\"135\"></rect>\n<text fill=\"#f472b6\" font-size=\"10.5\" x=\"50\" y=\"157\">Block 1 (Tokens 16-31)</text>\n<rect fill=\"#27272a\" height=\"35\" rx=\"4\" stroke=\"#facc15\"\
    \ width=\"160\" x=\"40\" y=\"175\"></rect>\n<text fill=\"#facc15\" font-size=\"10.5\" x=\"50\" y=\"197\">Block 2 (Tokens 32-47)</text>\n<!-- Page Table (Mapping Directory) -->\n<rect fill=\"#18181b\" height=\"170\" rx=\"8\" stroke=\"#22c55e\" stroke-width=\"1.5\" width=\"180\" x=\"250\" y=\"60\"></rect>\n<text fill=\"#4ade80\" font-size=\"11\" font-weight=\"bold\" x=\"270\" y=\"85\">Block Table (Directory)</text>\n<text fill=\"#f8fafc\" font-size=\"10.5\" x=\"265\" y=\"115\">Logical 0 → Physical 7</text>\n<text fill=\"#f8fafc\" font-size=\"10.5\" x=\"265\" y=\"155\">Logical 1 → Physical 23</text>\n<text fill=\"#f8fafc\" font-size=\"10.5\" x=\"265\" y=\"195\">Logical 2 → Physical 12</text>\n<!-- Arrows from logical to table -->\n<path d=\"M 200 112 L 250 112\" stroke=\"#60a5fa\" stroke-width=\"2\"></path>\n<path d=\"M 200 152 L 250 152\" stroke=\"#f472b6\" stroke-width=\"2\"></path>\n<path d=\"M 200 192 L 250 192\" stroke=\"#facc15\" stroke-width=\"2\"></path>\n<!-- Physical Non-Contiguous\
    \ GPU Memory -->\n<rect fill=\"#18181b\" height=\"170\" rx=\"8\" stroke=\"#3f3f46\" width=\"220\" x=\"470\" y=\"60\"></rect>\n<text fill=\"#a1a1aa\" font-size=\"11\" font-weight=\"bold\" x=\"490\" y=\"85\">Physical GPU VRAM Pages</text>\n<rect fill=\"#1e293b\" height=\"30\" rx=\"4\" stroke=\"#60a5fa\" width=\"200\" x=\"480\" y=\"95\"></rect>\n<text fill=\"#60a5fa\" font-size=\"10\" x=\"490\" y=\"115\">Phys Block 7: Tokens 0-15</text>\n<rect fill=\"#1e293b\" height=\"30\" rx=\"4\" stroke=\"#3f3f46\" width=\"200\" x=\"480\" y=\"130\"></rect>\n<text fill=\"#71717a\" font-size=\"9.5\" x=\"490\" y=\"150\">Phys Block 8..22: Other Requests</text>\n<rect fill=\"#1e293b\" height=\"30\" rx=\"4\" stroke=\"#f472b6\" width=\"200\" x=\"480\" y=\"165\"></rect>\n<text fill=\"#f472b6\" font-size=\"10\" x=\"490\" y=\"185\">Phys Block 23: Tokens 16-31</text>\n</svg>\n<div class=\"diagram-cap\">Figure 150.1: PagedAttention Virtual Memory Block Mapping: Physical non-contiguous memory allocation eliminating\
    \ GPU KV cache fragmentation.</div>\n</div>\n<h3 class=\"sh3\">2. PagedAttention Mathematical Architecture</h3>\n<p>\nDeveloped by Kwon et al. (UC Berkeley / vLLM), <strong>PagedAttention</strong> partitions the KV cache of each sequence into fixed-size physical blocks (e.g. 16 or 32 tokens per block). The attention computation over partitioned non-contiguous memory pages is evaluated as:\n</p>\n<div class=\"math-block\">\n$$\\mathbf{A}_i = \\frac{\\mathbf{q}_i \\mathbf{K}_j^T}{\\sqrt{d_k}} = \\frac{1}{\\sqrt{d_k}} \\sum_{t=1}^{N} \\mathbf{q}_i \\mathbf{k}_t^T$$\n$$\\mathbf{o}_i = \\sum_{j=1}^{\\lceil N / B \nceil} \\sum_{t \\in \\text{Block}_j} \\text{Softmax}(\\mathbf{A}_{i, t}) \\mathbf{v}_t$$\n</div>\n<p>\nBecause blocks are allocated dynamically on demand, memory waste is bounded to at most one partial block per sequence (&lt;4% total VRAM waste), increasing concurrent serving capacity by <strong>2x to 4x</strong> on identical GPU hardware.\n</p>\n<h3 class=\"sh3\">3. Production\
    \ Python Implementation: Block Table Memory Manager</h3>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-html\"><span class=\"kw\">from</span> typing <span class=\"kw\">import</span> List, Dict, Optional\n<span class=\"kw\">import</span> math\n\n<span class=\"kw\">class</span> <span class=\"fn\">BlockMemoryManager</span>:\n    <span class=\"str\">\"\"\"\n    Simulates vLLM PagedAttention Block Allocator and Virtual Page Directory.\n    \"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(self, total_gpu_blocks: int = <span class=\"num\">1024</span>, block_size: int = <span class=\"num\">16</span>):\n        self.total_blocks = total_gpu_blocks\n        self.block_size = block_size\n        self.free_blocks: List[int] = list(range(total_gpu_blocks))\n        self.block_tables: Dict[str, List[int]]\
    \ = {}\n\n    <span class=\"kw\">def</span> <span class=\"fn\">allocate_sequence</span>(self, seq_id: str, prompt_len: int) -&gt; List[int]:\n        num_blocks_needed = max(1, math.ceil(prompt_len / self.block_size))\n        <span class=\"kw\">if</span> len(self.free_blocks) &lt; num_blocks_needed:\n            <span class=\"kw\">raise</span> MemoryError(<span class=\"str\">\"Out of GPU Memory: Cannot allocate KV blocks.\"</span>)\n        \n        allocated = [self.free_blocks.pop(<span class=\"num\">0</span>) <span class=\"kw\">for</span> _ <span class=\"kw\">in</span> range(num_blocks_needed)]\n        self.block_tables[seq_id] = allocated\n        <span class=\"kw\">return</span> allocated\n\n    <span class=\"kw\">def</span> <span class=\"fn\">append_token</span>(self, seq_id: str, current_len: int) -&gt; Optional[int]:\n        <span class=\"cm\"># If token spills over into a new block, allocate dynamic page</span>\n        <span class=\"kw\">if</span> current_len % self.block_size\
    \ == <span class=\"num\">0</span>:\n            <span class=\"kw\">if</span> <span class=\"kw\">not</span> self.free_blocks:\n                <span class=\"kw\">raise</span> MemoryError(<span class=\"str\">\"GPU VRAM exhausted during token generation.\"</span>)\n            new_block = self.free_blocks.pop(<span class=\"num\">0</span>)\n            self.block_tables[seq_id].append(new_block)\n            <span class=\"kw\">return</span> new_block\n        <span class=\"kw\">return</span> <span class=\"kw\">None</span>\n\n    <span class=\"kw\">def</span> <span class=\"fn\">free_sequence</span>(self, seq_id: str):\n        <span class=\"kw\">if</span> seq_id <span class=\"kw\">in</span> self.block_tables:\n            blocks = self.block_tables.pop(seq_id)\n            self.free_blocks.extend(blocks)</code></pre>\n</div>\n<h3 class=\"sh3\">4. Continuous Batching (Iteration-Level Scheduling)</h3>\n<p>\nTraditional static batching groups $B$ requests together until all sequences finish\
    \ generating. Because text lengths vary widely, short requests are trapped waiting for the longest request in the batch to complete (the <em>head-of-line blocking problem</em>).\n</p>\n<p>\n<strong>Continuous Batching (Orca / vLLM)</strong> schedules requests at the iteration level: at every forward pass step, finished requests are evicted immediately, free blocks are recycled, and newly arrived queries from the queue are admitted without waiting for the batch boundary.\n</p>\n<h3 class=\"sh3\">5. Serving Benchmark Comparison: Throughput vs Latency</h3>\n<table style=\"width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px;\">\n<thead>\n<tr style=\"border-bottom:2px solid var(--border); text-align:left;\">\n<th style=\"padding:8px;\">Serving Engine</th>\n<th style=\"padding:8px;\">Throughput (Tokens/s)</th>\n<th style=\"padding:8px;\">Memory Fragmentation</th>\n<th style=\"padding:8px;\">Copy-on-Write Sharing</th>\n<th style=\"padding:8px;\">p95 TTFT</th>\n</tr>\n</thead>\n\
    <tbody>\n<tr style=\"border-bottom:1px solid var(--border);\">\n<td style=\"padding:8px;\"><strong>Hugging Face TGI 1.0</strong></td>\n<td style=\"padding:8px;\">180 tok/s</td>\n<td style=\"padding:8px;\">68%</td>\n<td style=\"padding:8px;\">No</td>\n<td style=\"padding:8px;\">140ms</td>\n</tr>\n<tr style=\"border-bottom:1px solid var(--border);\">\n<td style=\"padding:8px;\"><strong>vLLM (PagedAttention)</strong></td>\n<td style=\"padding:8px;\"><strong>720 tok/s (4x)</strong></td>\n<td style=\"padding:8px;\"><strong>&lt;4%</strong></td>\n<td style=\"padding:8px;\"><strong>Yes (Fork/Beam Search)</strong></td>\n<td style=\"padding:8px;\"><strong>38ms</strong></td>\n</tr>\n<tr style=\"border-bottom:1px solid var(--border);\">\n<td style=\"padding:8px;\"><strong>TensorRT-LLM (NVIDIA)</strong></td>\n<td style=\"padding:8px;\"><strong>810 tok/s</strong></td>\n<td style=\"padding:8px;\">&lt;5%</td>\n<td style=\"padding:8px;\">Yes</td>\n<td style=\"padding:8px;\">32ms</td>\n</tr>\n</tbody>\n\
    </table>\n<h3 class=\"sh3\">Production Engineering Walkthrough: VLLM &amp; PagedAttention Serving Architecture</h3>\n<p>\nThe following production snippet demonstrates the foundational design pattern, error handling strategies, and telemetry hooks required when deploying <strong>VLLM &amp; PagedAttention Serving Architecture</strong> in high-throughput enterprise systems:\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — production_vllm_async_engine.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\"># Day 150 — Production vLLM Async Serving Engine\nimport asyncio, time, logging\nfrom typing import List, AsyncIterator, Dict, Any, Optional\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"vLLMServer\")\n\nclass ProductionvLLMEngine:\n    \"\"\"\n    Production vLLM AsyncLLMEngine wrapper.\n\
    \    Key config: PagedAttention (gpu_memory_utilization=0.90),\n    prefix caching, tensor parallelism, and streaming output.\n    \"\"\"\n\n    def __init__(self, model: str = \"meta-llama/Meta-Llama-3-8B-Instruct\",\n                 gpu_memory_utilization: float = 0.90,\n                 max_num_seqs: int = 256, tensor_parallel_size: int = 1,\n                 enable_prefix_caching: bool = True):\n        from vllm import AsyncLLMEngine, AsyncEngineArgs, SamplingParams\n        self.SamplingParams = SamplingParams\n        args = AsyncEngineArgs(\n            model=model,\n            gpu_memory_utilization=gpu_memory_utilization,\n            max_num_seqs=max_num_seqs,\n            tensor_parallel_size=tensor_parallel_size,\n            enable_prefix_caching=enable_prefix_caching,\n            dtype=\"bfloat16\",\n        )\n        self.engine = AsyncLLMEngine.from_engine_args(args)\n        logger.info(f\"vLLM engine: {model}, tp={tensor_parallel_size}, \"\n                   \
    \ f\"mem={gpu_memory_utilization}, prefix_cache={enable_prefix_caching}\")\n\n    async def stream(self, prompt: str, max_tokens: int = 512, temperature: float = 0.8,\n                      request_id: Optional[str] = None) -&gt; AsyncIterator[str]:\n        import uuid\n        rid = request_id or str(uuid.uuid4())\n        params = self.SamplingParams(\n            max_tokens=max_tokens, temperature=temperature,\n            repetition_penalty=1.1, top_p=0.95\n        )\n        async for output in self.engine.generate(prompt, params, request_id=rid):\n            if output.outputs:\n                yield output.outputs[0].text\n            if output.finished:\n                tps = output.outputs[0].token_ids.__len__() / max(output.metrics.finished_time - output.metrics.first_token_time, 0.001)\n                logger.info(f\"Request {rid}: {tps:.1f} tokens/s\")\n\n    async def batch_complete(self, prompts: List[str], **kwargs) -&gt; List[str]:\n        results = await asyncio.gather(*[self._collect(p,\
    \ i, **kwargs) for i, p in enumerate(prompts)])\n        return list(results)\n\n    async def _collect(self, prompt: str, idx: int, **kwargs) -&gt; str:\n        out = \"\"\n        async for chunk in self.stream(prompt, request_id=f\"batch-{idx}\", **kwargs):\n            out += chunk\n        return out\n\nif __name__ == \"__main__\":\n    print(\"ProductionvLLMEngine: Requires GPU + vllm package (pip install vllm)\")\n    print(\"Key config: PagedAttention, prefix_caching=True, tensor_parallel_size=4 for 70B\")\n    print(\"API: engine.stream(prompt) → async generator of text chunks\")\n    print(\"Throughput on A100: ~2000 tokens/s for 8B model, ~400 tokens/s for 70B (4 GPU)\")\n    print(\"vLLMEngine: OK\")\n</code></pre>\n</div>\n"
  predict:
    question: What integer gigabytes of VRAM are required for the KV cache of a batch size 16 request on LLaMA-3-8B (32 layers, 32 heads, dim 128, seq_len 4096, FP16)?
    answer: '32'
    explanation: 2 (K and V) * 2 bytes (FP16) * 32 layers * 32 heads * 128 head_dim * 16 batch * 4096 tokens = 34,359,738,368 bytes = 32.0 GB VRAM.
    code: |-
      dtype = 2 # FP16 bytes
      layers = 32
      heads = 32
      head_dim = 128
      batch = 16
      seq_len = 4096
      vram_bytes = 2 * dtype * layers * heads * head_dim * batch * seq_len
      vram_gb = vram_bytes / (1024 ** 3)
      print(int(vram_gb))
