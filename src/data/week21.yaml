  flashcards:
  - front: Speculative Decoding?
    back: Drafting K tokens with a small model, verifying in 1 parallel pass with
      a large model. Lossless speedup!
  - front: Tiling (FlashAttention)?
    back: Computing attention block-by-block in fast SRAM instead of writing the full
      N x N matrix to slow HBM.
  - front: Draft Model (Speculative)?
    back: A smaller, fast model that proposes K tokens speculatively for the large
      model to verify in one pass.
  - front: How is FlashAttention & Speculative Decoding tested and validated in industrial
      ML pipelines (Day 151)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical
      tolerances (np.allclose at 1e-5), and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling FlashAttention
      & Speculative Decoding in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation,
      resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
