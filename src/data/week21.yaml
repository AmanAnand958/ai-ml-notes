      \        f\"http://localhost:{port}/v1/chat/completions\",\n        json={\n\
      \            \"model\": \"merged-qlora-model\",\n            \"messages\": [{\"\
      role\": \"user\", \"content\": prompt}],\n            \"max_tokens\": 512,\n\
      \            \"temperature\": 0.1,\n        },\n        timeout=60\n    )\n\
