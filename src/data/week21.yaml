  quizzes:
  - num_str: QUESTION 1 OF 4
    question: Why is applying the model's exact Chat Template (via tokenizer.apply_chat_template) critical during inference?
    qid: q155_1
    options:
    - letter: A
      text: Different models use distinct control tokens (e.g. ChatML `&lt;|im_start|`, LLaMA `&lt;|start_header_id|`); mismatched templates degrade instruction adherence and trigger hallucinations.
      is_correct: true
    - letter: B
      text: Without it, the Python script cannot import JSON.
      is_correct: false
    - letter: C
      text: Chat templates reduce the physical file size of the weights.
      is_correct: false
    - letter: D
      text: It is only needed for displaying emojis.
      is_correct: false
    correct_fb: ✅ Correct! Foundation models are fine-tuned on precise special token delimiters; failing to match the exact template causes severe prompt misinterpretation.
    wrong_fb: ❌ Incorrect. Special token delimiters define role boundaries (system, user, assistant); missing or incorrect delimiters break conversation context.
  - num_str: QUESTION 2 OF 4
    question: What is the function of the `add_generation_prompt=True` parameter in Jinja chat templates?
    qid: q155_2
    options:
    - letter: A
      text: It appends the trailing assistant role header (e.g. `&lt;|im_start|assistant\n`), prompting the model to start generating the response immediately.
      is_correct: true
    - letter: B
      text: It generates random few-shot examples.
      is_correct: false
    - letter: C
      text: It enables grammar spellchecking.
      is_correct: false
    - letter: D
      text: It increases the maximum token limit by 1000.
      is_correct: false
    correct_fb: ✅ Correct! Appending the assistant prefix signals to the autoregressive model that it is the assistant's turn to generate text.
    wrong_fb: ❌ Incorrect. `add_generation_prompt=True` injects the opening assistant token delimiter to prime the autoregressive generation loop.
  - num_str: QUESTION 3 OF 4
    question: How do Guided Decoding engines (e.g. Outlines, XGrammar) enforce JSON schemas during autoregressive generation?
    qid: q155_3
    options:
    - letter: A
      text: By compiling schemas into Regular Expressions / Pushdown Automata and masking logits at every token step to only allow valid syntactic transitions.
      is_correct: true
    - letter: B
      text: By asking an external LLM to review each token.
      is_correct: false
    - letter: C
      text: By deleting invalid tokens after the response finishes.
      is_correct: false
    - letter: D
      text: By running a Python regex search on the prompt.
      is_correct: false
    correct_fb: ✅ Correct! Constrained decoding builds dynamic logit masks directly on the vocabulary index, ensuring 100% syntactically valid grammar with zero validation retries.
    wrong_fb: ❌ Incorrect. Logit masking restricts sampling exclusively to valid continuation tokens allowed by the formal schema grammar.
  - num_str: QUESTION 4 OF 4
    question: What is the latency impact of grammar-constrained decoding (e.g., Outlines / XGrammar) during serving?
    qid: q155_4
    options:
    - letter: A
      text: Near-zero inference latency overhead (&lt;2ms per token) after compiling the schema FSM during initialization.
      is_correct: true
    - letter: B
      text: It slows down inference by 500x.
      is_correct: false
    - letter: C
      text: It requires double the number of GPUs.
      is_correct: false
    - letter: D
      text: It causes massive 10-second pauses between words.
      is_correct: false
    correct_fb: ✅ Correct! Pre-compiling the grammar Finite State Machine (FSM) allows instant bitwise logit index masking on GPUs during sampling.
    wrong_fb: ❌ Incorrect. Modern constrained decoding libraries pre-compile transition graphs, adding negligible overhead to generation latency.
