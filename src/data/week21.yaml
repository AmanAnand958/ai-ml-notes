    wrong_fb: Incorrect. Duplicate training samples induce severe overfitting and degrade conversational diversity.
  - num_str: '4'
    qid: w21d155_q4
    question: How does MinHash with Locality-Sensitive Hashing (LSH) achieve scalable deduplication across millions of text
      documents?
    options:
    - letter: A
      text: By performing $O(N^2)$ pairwise string edit distance comparisons
      is_correct: false
    - letter: B
      text: By approximating Jaccard similarity between document n-gram sets in near $O(N)$ linear time
      is_correct: true
    - letter: C
      text: By training a deep neural network on document embeddings
      is_correct: false
    - letter: D
      text: By sorting documents by character length
      is_correct: false
    correct_fb: Correct! MinHash + LSH maps similar documents into the same hash buckets in sub-quadratic time without pairwise
      comparisons.
    wrong_fb: Incorrect. MinHash estimates Jaccard similarity via hash collisions in linear time.
  flashcards:
  - front: 'Core concept: What is the significance of MinHash in Synthetic Data & Deduplication?'
    back: A probabilistic data structure used to quickly estimate the Jaccard similarity between two sets.
  - front: 'Core concept: What is the significance of Synthetic Data in Synthetic Data & Deduplication?'
    back: Data generated by a larger, smarter LLM (Teacher) to train a smaller LLM (Student).
  - front: 'Core concept: What is the significance of Evol-Instruct in Synthetic Data & Deduplication?'
    back: A method to create complex training data by prompting GPT-4 to evolve simple instructions (make harder, add constraints).
  - front: How is Synthetic Data & Deduplication tested and validated in industrial ML pipelines (Day 155)?
