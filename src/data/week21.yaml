  analogy: LoRA is like adding post-it notes with custom instructions into a giant textbook instead of rewriting the entire book.
  theory_html: ''
  predict:
    question: After training, how do we get the final deployable model?
    answer: merge_and_unload
    explanation: Merge the trained LoRA adapter weights into the base model weights using model.merge_and_unload(), then export to GGUF, AWQ, or standard Hugging Face format.
    code: "<span class=\"cm\"># Verification Script for Day 153</span>\n<span class=\"kw\">def</span> <span class=\"fn\">calculate_lora_trainable_params</span>(base_params_m=<span class=\"num\">7000</span>, lora_r=<span class=\"num\">16</span>, d_model=<span class=\"num\">4096</span>, n_layers=<span class=\"num\">32</span>):\n    <span class=\"cm\"># LoRA adds 2 * r * d_model parameters per adapted linear layer</span>\n    lora_params = n_layers * (<span class=\"num\">2</span> * lora_r * d_model * <span class=\"num\">4</span>)\n    lora_params_m = lora_params / <span class=\"num\">1e6</span>\n    pct_trainable = (lora_params_m / base_params_m) * <span class=\"num\">100</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Base: {base_params_m}M | LoRA Trainable: {lora_params_m:.2f}M ({pct_trainable:.3f}%)\"</span>)\n<span class=\"kw\">return</span> pct_trainable\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n    <span class=\"kw\">assert</span>\
      \ <span class=\"fn\">calculate_lora_trainable_params</span>() <span class=\"kw\">is</span> <span class=\"kw\">True</span>"
