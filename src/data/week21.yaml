      user perceived responsiveness before streaming begins.
    correct: a
  - num_str: QUESTION 2 OF 4
    question: What does ITL (Inter-Token Latency) or TPOT (Time Per Output Token)
      quantify in streaming applications?
    qid: q156_2
    options:
    - letter: A
      text: The time elapsed between generating consecutive output tokens during the
        autoregressive decoding phase.
      is_correct: true
      id: a
    - letter: B
      text: The time taken to boot up the cloud server.
      is_correct: false
      id: b
    - letter: C
      text: The duration of network packet transmission over Wi-Fi.
      is_correct: false
      id: c
    - letter: D
      text: The time required to parse JSON outputs.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! ITL measures the speed of autoregressive decoding (tokens
      per second per stream), determining how smooth the streaming output feels to
      human readers.
    wrong_fb: ❌ Incorrect. ITL / TPOT measures the per-token decoding latency during
      generation.
    correct: a
  - num_str: QUESTION 3 OF 4
    question: Why does Prefix Caching (Prompt Caching) drastically improve throughput
      in multi-turn chatbot systems?
    qid: q156_3
    options:
    - letter: A
      text: It reuses the precomputed KV-cache for shared system prompts and conversation
        history across turns, avoiding redundan...
      is_correct: true
      id: a
    - letter: B
      text: It deletes the user's past messages to save disk space.
      is_correct: false
      id: b
    - letter: C
      text: It converts conversation text into compressed MP3 audio.
      is_correct: false
      id: c
    - letter: D
      text: It disables attention mechanisms entirely.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Reusing KV-cache for common prompt prefixes slashes TTFT
      by up to 90% and frees GPU compute for active generation.
    wrong_fb: ❌ Incorrect. Prefix caching stores and reuses precomputed KV-tensors
      for common prompt prefixes, skipping redundant prefill passes.
    correct: a
  - num_str: QUESTION 4 OF 4
    question: When designing an autoscaling policy for high-concurrency LLM inference
      clusters, what metric is most effective?
    qid: q156_4
    options:
    - letter: A
      text: vLLM waiting queue length (`num_requests_waiting`) and GPU KV-cache usage
        percentage.
      is_correct: true
      id: a
    - letter: B
      text: CPU core utilization only.
      is_correct: false
      id: b
    - letter: C
      text: Hard drive read/write speed.
      is_correct: false
      id: c
    - letter: D
      text: Number of open browser tabs.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Scaling based on queue depth and KV-cache saturation directly
      addresses pending request backlogs before latency SLA violations occur.
    wrong_fb: ❌ Incorrect. CPU usage is misleading for GPU inference; queue length
      (`num_requests_waiting`) and KV-cache allocation provide direct load signals.
    correct: a
  flashcards:
  - front: 'Core concept: What is the significance of ChatML in Capstone: Deploying
      a Custom Fine-Tuned Model?'
    back: A standard chat template structure ensuring the model knows exactly when
      a system, user, or assistant is speaking.
  - front: Multi-LoRA Serving?
    back: Serving a single base model in VRAM but applying different LoRA adapters
      on a per-request basis.
  - front: 'Core concept: What is the significance of Chat Template in Capstone: Deploying
      a Custom Fine-Tuned Model?'
    back: A Jinja2 template (tokenizer.chat_template) that formats messages into the
      exact string the model was trained on.
  - front: 'How is Capstone: Deploying a Custom Fine-Tuned Model tested and validated
      in industrial ML pipelines (Day 156)?'
    back: Automated pytest suites assert strict tensor shape invariants, numerical
      tolerances (np.allclose at 1e-5), and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Capstone:
      Deploying a Custom Fine-Tuned Model in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation,
      resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
