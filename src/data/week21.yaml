    sol_id: sol-w21d156t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "import subprocess\nimport json\nimport requests\nfrom pathlib import Path\n\n# ── Step 1: Merge QLoRA\
      \ adapter into base model ──────────────────\nfrom peft import AutoPeftModelForCausalLM\nfrom transformers import AutoTokenizer\n\
      import torch\n\ndef merge_qlora_adapter(\n    base_model_id: str,\n    adapter_path: str,\n    output_dir: str\n) ->\
      \ str:\n    \"\"\"Merge QLoRA adapter weights into base model and save.\"\"\"\n    print(f\"Loading adapter from {adapter_path}...\"\
      )\n    model = AutoPeftModelForCausalLM.from_pretrained(\n        adapter_path,\n        device_map=\"auto\",\n    \
      \    torch_dtype=torch.bfloat16,\n    )\n    merged = model.merge_and_unload()  # fuse LoRA weights into base\n    tokenizer\
      \ = AutoTokenizer.from_pretrained(base_model_id)\n    merged.save_pretrained(output_dir)\n    tokenizer.save_pretrained(output_dir)\n\
      \    print(f\"✅ Merged model saved to {output_dir}\")\n    return output_dir\n\n# ── Step 2: Launch vLLM server ────────────────────────────────────\n\
      def launch_vllm_server(model_path: str, port: int = 8000) -> None:\n    \"\"\"Start vLLM OpenAI-compatible server as\
      \ subprocess.\"\"\"\n    cmd = [\n        \"python\", \"-m\", \"vllm.entrypoints.openai.api_server\",\n        \"--model\"\
      , model_path,\n        \"--port\", str(port),\n        \"--dtype\", \"bfloat16\",\n        \"--max-model-len\", \"4096\"\
      ,\n        \"--gpu-memory-utilization\", \"0.90\",\n    ]\n    print(f\"Starting vLLM server on port {port}...\")\n\
      \    subprocess.Popen(cmd)  # non-blocking; server runs in background\n\n# ── Step 3: Query the deployed model ─────────────────────────────\n\
      def query_vllm(prompt: str, port: int = 8000) -> str:\n    \"\"\"Send an inference request to vLLM OpenAI-compatible\
      \ endpoint.\"\"\"\n    response = requests.post(\n        f\"http://localhost:{port}/v1/chat/completions\",\n      \
      \  json={\n            \"model\": \"merged-qlora-model\",\n            \"messages\": [{\"role\": \"user\", \"content\"\
      : prompt}],\n            \"max_tokens\": 512,\n            \"temperature\": 0.1,\n        },\n        timeout=60\n \
      \   )\n    return response.json()[\"choices\"][0][\"message\"][\"content\"]\n\n# ── Main: Full pipeline ───────────────────────────────────────────\n\
      if __name__ == \"__main__\":\n    merged_path = merge_qlora_adapter(\n        base_model_id=\"mistralai/Mistral-7B-v0.1\"\
      ,\n        adapter_path=\"./qlora-adapter\",\n        output_dir=\"./merged-mistral-7b\",\n    )\n    launch_vllm_server(merged_path,\
      \ port=8000)\n    \n    import time; time.sleep(30)  # wait for server startup\n    answer = query_vllm(\"Explain LoRA\
      \ in one sentence.\")\n    print(f\"Model response: {answer}\")"
    solution_lang: python
