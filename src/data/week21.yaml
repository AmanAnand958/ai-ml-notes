    git_cmd: 'git add . &amp;&amp; git commit -m "day155: complete hands-on task implementation"'
    sol_id: sol-w21d155t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "<span class=\"cm\"># Solution for Task: Magpie Approach</span>\n<span class=\"kw\">from</span> typing <span class=\"kw\">import</span> Dict\n\n<span class=\"kw\">class</span> <span class=\"cls\">MagpieSyntheticGenerator</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, template: str = <span class=\"str\">\"\\n\"</span>):\n        <span class=\"kw\">self</span>.template = template\n\n<span class=\"kw\">def</span> <span class=\"fn\">generate_instruction_pair</span>(<span class=\"kw\">self</span>) -&gt; Dict[str, str]:\n        synthetic_instruction = <span class=\"str\">\"Design a Kubernetes HorizontalPodAutoscaler for a vLLM deployment.\"</span>\n        synthetic_response = <span class=\"str\">\"Here is the HPA manifest with target CPU utilization set to 75%...\"</span>\n<span class=\"kw\">return</span> {<span class=\"str\">\"instruction\": synthetic_instruction, \"response\"</span>: synthetic_response}\n\ngen\
      \ = <span class=\"fn\">MagpieSyntheticGenerator</span>()\npair = gen.<span class=\"fn\">generate_instruction_pair</span>()\n<span class=\"fn\">print</span>(<span class=\"str\">\"=== Magpie Synthetic Instruction Pair ===\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Generated Instruction:\", pair[\"instruction\"</span>])\n<span class=\"fn\">print</span>(<span class=\"str\">\"Generated Response:   \", pair[\"response\"][:50] + \"...\"</span>)"
