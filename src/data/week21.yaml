    solution_code: "<span class=\"cm\"># Solution for Task: BitsAndBytes in Transformers</span>\n<span class=\"kw\">import</span> torch\n\n<span class=\"kw\">def</span> <span class=\"fn\">configure_bitsandbytes_nf4</span>():\n    <span class=\"str\">\"\"\"Configure 4-bit NormalFloat (NF4) quantization spec with double quantization.\"\"\"</span>\n    bnb_config = {\n        <span class=\"str\">\"load_in_4bit\"</span>: <span class=\"kw\">True</span>,\n        <span class=\"str\">\"bnb_4bit_quant_type\": \"nf4\"</span>,\n        <span class=\"str\">\"bnb_4bit_compute_dtype\"</span>: torch.float16,\n        <span class=\"str\">\"bnb_4bit_use_double_quant\"</span>: <span class=\"kw\">True</span>\n    }\n    <span class=\"fn\">print</span>(<span class=\"str\">\"=== BitsAndBytes 4-bit Quantization Configured ===\"</span>)\n    <span class=\"kw\">for</span> key, val <span class=\"kw\">in</span> bnb_config.<span class=\"fn\">items</span>():\n        <span class=\"fn\">print</span>(<span class=\"\
      str\">f\"  {key:30s}: {val}\"</span>)\n<span class=\"kw\">return</span> bnb_config\n\nconfig = <span class=\"fn\">configure_bitsandbytes_nf4</span>()"
