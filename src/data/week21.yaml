  theory_html: "<h3 class=\"sh3\">1. Parameter-Efficient Fine-Tuning (PEFT) & LoRA</h3>\n<p>\nFull parameter fine-tuning of\
    \ a 70B model requires updating and storing 140GB+ of optimizer states and gradients across multiple GPUs. <strong>Low-Rank\
    \ Adaptation (LoRA)</strong> freezes the pretrained weight matrix $W_0 \\in \\mathbb{R}^{d \times k}$ and decomposes the\
    \ update into two low-rank matrices $A \\in \\mathbb{R}^{r \times k}$ and $B \\in \\mathbb{R}^{d \times r}$ with rank\
    \ $r \\ll \\min(d, k)$:\n</p>\n<div class=\"math-block\">\n$$W = W_0 + \\Delta W = W_0 + \frac{\alpha}{r} (B \\cdot A)$$\n\
    </div>\n<p>\nWhere $A \\sim \\mathcal{N}(0, \\sigma^2)$ and $B = 0$ at initialization, ensuring $\\Delta W = 0$ before\
    \ training begins.\n</p>\n<div class=\"mermaid\">\ngraph LR\n  x[\"Input Vector x\"] --> W0[\"Frozen Pretrained Weights\
    \ W_0\n(d x k)\"]\n  x --> A[\"LoRA Down-projection A\n(r x k)\"]\n  A --> B[\"LoRA Up-projection B\n(d x r)\"]\n  W0\
    \ --> Add[\"(+)\"]\n  B -->|Scaled by alpha/r| Add\n  Add --> Out[\"Output Vector h\"]\n</div>\n<div class=\"diagram-cap\"\
    >LoRA Low-Rank Decomposition with Frozen Base Weights.</div>"
  predict:
