    prompt_html: "<p><strong>Scenario:</strong> Compress a 70-billion parameter FP16 language model (140GB VRAM) to run on two 24GB consumer GPUs (RTX 4090) or a single 48GB GPU with &lt;1% perplexity degradation.</p>\n<p><strong>Requirements:</strong></p>\n<ul>\n  <li>Implement <strong>Symmetric Uniform INT8 and INT4 Quantization</strong> with dynamic scale $\text{Scale} = \frac{\\max(|X|)}{2^{b-1}-1}$ and zero-point offset calculation.</li>\n  <li>Implement an <strong>Activation-Aware Weight Protection (AWQ)</strong> heuristic: identify the top 1% salient weight channels based on average input activation magnitude and preserve them in FP16 while quantizing the remaining 99% to INT4.</li>\n  <li>Compute and print Mean Squared Error (MSE) and memory compression ratio.</li>\n</ul>"
