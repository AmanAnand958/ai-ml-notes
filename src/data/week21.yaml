    code: "<span class=\"cm\"># Verification Script for Day 152</span>\n<span class=\"kw\">def</span> <span class=\"fn\">estimate_quantized_vram</span>(params_billions=<span class=\"num\">7.0</span>, bit_width=<span class=\"num\">4</span>):\n    bytes_per_param = bit_width / <span class=\"num\">8.0</span>\n    weight_gb = (params_billions * <span class=\"num\">1e9</span> * bytes_per_param) / (<span class=\"num\">1024</span>**<span class=\"num\">3</span>)\n    total_with_overhead = weight_gb * <span class=\"num\">1.15</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"{params_billions}B Model in INT{bit_width}: Weights={weight_gb:.2f}GB | Total with overhead ~ {total_with_overhead:.2f}GB\"</span>)\n<span class=\"kw\">return</span> <span class=\"fn\">round</span>(total_with_overhead, <span class=\"num\">1</span>)\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n    vram = <span class=\"fn\">estimate_quantized_vram</span>(<span class=\"num\"\
      >7.0</span>, <span class=\"num\">4</span>)\n    <span class=\"kw\">assert</span> <span class=\"num\">3.0</span> &lt;= vram &lt;= <span class=\"num\">4.5</span>"
  tasks:
