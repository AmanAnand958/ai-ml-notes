    code: "<span class=\"cm\"># Verification Script for Day 154</span>\n<span class=\"kw\">def</span> <span class=\"fn\">compare_alignment_vram</span>(base_model_gb=<span class=\"num\">14.0</span>):\n    dpo_vram = base_model_gb * <span class=\"num\">2</span> + <span class=\"num\">6.0</span> <span class=\"cm\"># Base + Reference model + gradients</span>\n    orpo_vram = base_model_gb + <span class=\"num\">6.0</span> <span class=\"cm\"># Single model only + gradients</span>\n    savings = dpo_vram - orpo_vram\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"VRAM Comparison - DPO: {dpo_vram:.1f}GB | ORPO: {orpo_vram:.1f}GB (Saved: {savings:.1f}GB)\"</span>)\n<span class=\"kw\">return</span> savings\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n    <span class=\"kw\">assert</span> <span class=\"fn\">compare_alignment_vram</span>(<span class=\"num\">14.0</span>) == <span class=\"num\">14.0</span>"
  tasks:
  - title: 'Task 1: DPO Formatting · MEDIUM'
