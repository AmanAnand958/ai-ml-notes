      n...&lt;|im_end|\n       \n       ) during fine tuning?"
    answer: Role separation
    explanation: ChatML explicitly separates user, assistant, and system roles with
      unambiguous special tokens (&lt;|im_start| / &lt;|im_end|), preventing prompt
      injection from user inputs crossing role boundaries.
    code: "<span class=\"cm\"># Verification Script for Day 156</span>\n<span class=\"\
