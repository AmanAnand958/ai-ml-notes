    badge_class: tb-med
    time: ''
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Demonstrate FlashAttention's online softmax normalization over tiled matrix blocks without intermediate HBM writes.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core Transformations</span>\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\">online_softmax_tile</span>(blocks: list):\n    m_prev = -np.inf\n    l_prev = <span class=\"num\">0.0</span>\n    out = np.<span class=\"fn\">zeros_like</span>(blocks[<span class=\"num\">0</span>])\n    \n    <span class=\"kw\"\
      >for</span> block <span class=\"kw\">in</span> blocks:\n        m_curr = np.<span class=\"fn\">maximum</span>(m_prev, np.<span class=\"fn\">max</span>(block))\n        p = np.<span class=\"fn\">exp</span>(block - m_curr)\n        l_curr = np.<span class=\"fn\">exp</span>(m_prev - m_curr) * l_prev + np.<span class=\"fn\">sum</span>(p)\n        \n        out = (np.<span class=\"fn\">exp</span>(m_prev - m_curr) * out + p) / l_curr\n        m_prev = m_curr\n        l_prev = l_curr\n<span class=\"kw\">return</span> out\n\nt1 = np.<span class=\"fn\">array</span>([<span class=\"num\">1.0</span>, <span class=\"num\">2.0</span>])\nt2 = np.<span class=\"fn\">array</span>([<span class=\"num\">3.0</span>, <span class=\"num\">4.0</span>])\nres = <span class=\"fn\">online_softmax_tile</span>([t1, t2])\n<span class=\"fn\">print</span>(<span class=\"str\">\"Online Softmax Result:\"</span>, np.<span class=\"fn\">round</span>(res, <span class=\"num\">4</span>))</pre>\n</div>\n<div style=\"margin-top:1rem;\
      \ padding:10px; background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono); font-size:12px;\">\n<strong>\n         Expected Verification Output:\n        </strong>\n<br/>\n\n         Online Softmax Result: [0.2689 0.7311]\n        \n</div>"
    done_when: ''
    git_cmd: ''
