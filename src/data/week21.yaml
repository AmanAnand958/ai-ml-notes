  predict:
    question: "What happens if\n       \n        gpu-memory-utilization\n       \n       is set to 1.0?"
    answer: CUDA OOM
    explanation: vLLM will allocate 100% of GPU memory to model weights and KV cache, leaving zero memory for PyTorch activation overhead or CUDA kernels, causing an immediate CUDA OOM crash.
    code: "<span class=\"cm\"># Verification Script for Day 150</span>\n<span class=\"kw\">def</span> <span class=\"fn\">vllm_memory_allocation</span>(total_vram_gb=<span class=\"num\">24.0</span>, model_weights_gb=<span class=\"num\">14.0</span>, util_factor=<span class=\"num\">0.90</span>):\n    allocated = total_vram_gb * util_factor\n    kv_cache_gb = allocated - model_weights_gb\n    headroom_gb = total_vram_gb - allocated\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"vLLM Memory: Total={total_vram_gb}GB, Weights={model_weights_gb}GB, KV Cache={kv_cache_gb:.1f}GB, Headroom={headroom_gb:.1f}GB\"</span>)\n<span class=\"kw\">return</span> headroom_gb &gt;= <span class=\"num\">1.0</span>\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n    <span class=\"kw\">assert</span> <span class=\"fn\">vllm_memory_allocation</span>(<span class=\"num\">24.0</span>, <span class=\"num\">14.0</span>, <span class=\"num\">0.90</span>) <span class=\"kw\">is</span>\
      \ <span class=\"kw\">True</span>"
