    code: "<span class=\"cm\"># Verification Script for Day 156</span>\n<span class=\"kw\">def</span> <span class=\"fn\">format_chatml</span>(system_msg: str, user_msg: str, assistant_msg: str):\n    prompt = <span class=\"str\">f\"system\\\\n{system_msg}\\\\nuser\\\\n{user_msg}\\\\nassistant\\\\n{assistant_msg}\"</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"ChatML Encoded Prompt ({len(prompt)} chars):\\\\n{prompt}\"</span>)\n<span class=\"kw\">return</span> <span class=\"str\">\"\" in prompt and \"\"</span> <span class=\"kw\">in</span> prompt\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n    <span class=\"kw\">assert</span> <span class=\"fn\">format_chatml</span>(<span class=\"str\">\"You are helpful\", \"Hi\", \"Hello!\"</span>) <span class=\"kw\">is</span> <span class=\"kw\">True</span>"
