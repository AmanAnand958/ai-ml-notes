    correct_fb: ✅ Correct! Medusa uses tree-based attention and lightweight prediction
      heads atop the base model, eliminating the memory and serving overhead of a
      separate draft model.
    wrong_fb: ❌ Incorrect. Medusa uses specialized multi-token prediction heads trained
