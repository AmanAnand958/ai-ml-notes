      >3</span>, <span class=\"num\">4</span>, <span class=\"num\">99</span>, <span\
      \ class=\"num\">100</span>))\n<span class=\"fn\">print</span>(<span class=\"\
      str\">f\"Matched {matched_tokens} prefix tokens! Reusing cached KV: {kv_ref}\"\
      </span>)</pre>\n</div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05);\
