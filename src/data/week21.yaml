  flashcards:
  - front: QLoRA NormalFloat4 (NF4) Quantization?
    back: Information-theoretically optimal quantile quantization for normally distributed
      weights, with double quantization to reduce memory footprint.
  - front: 'Core concept: What is the significance of QLoRA in QLoRA & PEFT?'
    back: Quantized LoRA. Base model is in 4-bit, adapters are in 16-bit. Drastically
      reduces training VRAM.
  - front: 'Core concept: What is the significance of r (LoRA Rank) in QLoRA & PEFT?'
    back: The inner dimension of LoRA matrices. Higher r = more trainable params,
      more expressiveness, higher RAM usage.
