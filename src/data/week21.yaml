      </div>\n<pre><span class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core\
      \ Transformations</span>\n<span class=\"kw\">import</span> numpy <span class=\"\
      kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\">online_softmax_tile</span>(blocks:\
      \ list):\n    m_prev = -np.inf\n    l_prev = <span class=\"num\">0.0</span>\n\
      \    out = np.<span class=\"fn\">zeros_like</span>(blocks[<span class=\"num\"\
      >0</span>])\n    \n    <span class=\"kw\">for</span> block <span class=\"kw\"\
      >in</span> blocks:\n        m_curr = np.<span class=\"fn\">maximum</span>(m_prev,\
      \ np.<span class=\"fn\">max</span>(block))\n        p = np.<span class=\"fn\"\
