  - title: Task 3
    badge: ''
    badge_class: tb-med
    time: ''
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Calculate exact memory requirements across precision types (FP16, INT8, INT4) and batch sizes.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\">def</span> <span class=\"fn\">compute_kv_cache_gb</span>(n_layers: int, d_model: int, seq_len: int, batch_size: int, precision_bits: int = <span class=\"num\">16</span>) -&gt; float:\n    bytes_per_elem = precision_bits / <span class=\"num\">8</span>\n<span class=\"cm\"># 2 for Key and Value matrices</span>\n    total_bytes = <span class=\"num\">2</span> * n_layers * d_model * seq_len * batch_size * bytes_per_elem\n<span class=\"kw\">return</span>\
      \ <span class=\"fn\">round</span>(total_bytes / (<span class=\"num\">1024</span> ** <span class=\"num\">3</span>), <span class=\"num\">2</span>)\n\n<span class=\"fn\">print</span>(<span class=\"str\">\"Llama-3-8B KV Cache (FP16, batch=64, ctx=4096):\", compute_kv_cache_gb(32, 4096, 4096, 64, 16), \"GB\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Llama-3-8B KV Cache (INT4, batch=64, ctx=4096):\", compute_kv_cache_gb(32, 4096, 4096, 64, 4), \"GB\"</span>)</pre>\n</div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono); font-size:12px;\">\n<strong>\n         Expected Verification Output:\n        </strong>\n<br/>\n\n         Llama-3-8B KV Cache (FP16, batch=64, ctx=4096): 64.0 GB \\nLlama-3-8B KV Cache (INT4, batch=64, ctx=4096): 16.0 GB\n        \n</div>"
    done_when: ''
    git_cmd: ''
    sol_id: ''
    solution_title: ''
    solution_code: ''
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: What core problem does vLLM PagedAttention solve in LLM serving?
    qid: q150_1
    options:
    - letter: A
      text: It eliminates GPU memory fragmentation by dividing the Key-Value (KV) cache into non-contiguous virtual pages, boosting throughput 2-4x.
      is_correct: true
    - letter: B
      text: It converts Python code into CUDA kernels automatically.
      is_correct: false
    - letter: C
      text: It eliminates the need for GPUs during inference.
      is_correct: false
    - letter: D
      text: It shrinks foundation model weights by 99%.
      is_correct: false
    correct_fb: ✅ Correct! PagedAttention manages KV-cache like virtual memory pages in operating systems, eliminating up to 96% of wasted VRAM.
    wrong_fb: ❌ Incorrect. PagedAttention solves internal and external memory fragmentation in the KV-cache, enabling massive continuous batching.
  - num_str: QUESTION 2 OF 4
    question: How does Continuous (Iteration-Level) Batching differ from traditional Static Batching?
    qid: q150_2
    options:
    - letter: A
      text: Continuous batching schedules new requests immediately at the token iteration level rather than waiting for an entire batch to finish generating.
      is_correct: true
    - letter: B
      text: Continuous batching only allows 1 user request at a time.
      is_correct: false
    - letter: C
      text: Continuous batching requires stopping the server every 10 seconds.
      is_correct: false
    - letter: D
      text: Static batching is 10x faster than continuous batching.
      is_correct: false
    correct_fb: ✅ Correct! Iteration-level scheduling allows newly arrived requests to join the running batch on the very next token iteration without waiting for long sequences to complete.
    wrong_fb: ❌ Incorrect. Continuous batching evicts completed requests and injects new ones token-by-token, maximizing GPU Tensor Core saturation.
  - num_str: QUESTION 3 OF 4
    question: What is the consequence of setting vLLM max_model_len higher than necessary?
    qid: q150_3
    options:
    - letter: A
      text: It reserves larger pre-allocated KV-cache slots per sequence, reducing the total number of concurrent requests the GPU can serve simultaneously.
      is_correct: true
    - letter: B
      text: It causes the server to download additional weights from HuggingFace.
      is_correct: false
    - letter: C
      text: It changes the model's tokenizer vocab size.
      is_correct: false
    - letter: D
      text: It permanently damages GPU memory chips.
      is_correct: false
    correct_fb: ✅ Correct! Higher max context limits require larger memory allocations per request, reducing overall batch concurrency.
    wrong_fb: ❌ Incorrect. Setting excessive context lengths limits the maximum number of concurrent active sequences vLLM can fit into remaining VRAM.
  - num_str: QUESTION 4 OF 4
    question: In vLLM multi-GPU serving, what parallelism strategy is typically used across GPUs on a single node?
    qid: q150_4
    options:
    - letter: A
      text: Tensor Parallelism (TP) using NCCL All-Reduce to split matrix multiplications across GPU Tensor Cores.
      is_correct: true
    - letter: B
      text: Data Parallelism with CPU offloading.
      is_correct: false
    - letter: C
      text: Pipeline Parallelism with 10-second delays.
      is_correct: false
    - letter: D
      text: Zero parallelism, running identical copies.
      is_correct: false
    correct_fb: ✅ Correct! Tensor Parallelism splits attention heads and MLP projection matrices across local NVLink-connected GPUs with minimal communication latency.
    wrong_fb: ❌ Incorrect. Single-node multi-GPU LLM inference uses Tensor Parallelism (TP) for real-time latency optimization.
  flashcards:
  - front: vLLM
    back: An open-source library for fast LLM inference and serving.
  - front: PagedAttention
    back: Divides KV cache into blocks (pages) to eliminate memory fragmentation.
  - front: Continuous Batching
    back: vLLM's ability to add new requests to an in-progress batch without waiting for all sequences to finish.
  gotcha:
    title: '⚠️ Gotcha: Day 150 Pitfall Warning'
    description: "<p style=\"margin-top:0.4rem; margin-bottom:0;\">\n       PagedAttention with small block sizes (e.g. block_size &lt; 16) increases virtual memory lookup overhead; standard block size 16 or 32 yields optimal GPU cache locality.\n      </p>"
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       \"Never use `transformers` pipelines in production APIs. Always use vLLM or TGI.\""
    bullets:
    - KV Cache grows linearly with sequence length.
    - vLLM enables massive concurrent batching.
