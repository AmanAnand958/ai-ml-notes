  analogy: PagedAttention is like computer RAM virtual paging, allocating memory blocks wherever free space exists instead of needing contiguous space.
  theory_html: ''
  predict:
    question: Does Speculative Decoding change the final output of the large model?
    answer: 'No'
    explanation: No. Speculative decoding guarantees mathematically identical output distribution to the target model because every draft token is strictly validated by the target model's logits.
    code: "<span class=\"cm\"># Verification Script for Day 151</span>\n<span class=\"kw\">def</span> <span class=\"fn\">speculative_verification</span>(draft_tokens: list, target_logits_accept: list):\n    accepted = [tok <span class=\"kw\">for</span> tok, acc <span class=\"kw\">in</span> <span class=\"fn\">zip</span>(draft_tokens, target_logits_accept) <span class=\"kw\">if</span> acc]\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Speculative Decoding: Draft={draft_tokens} - Verified Accepted={accepted}\"</span>)\n<span class=\"kw\">return</span> accepted\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n    <span class=\"kw\">assert</span> <span class=\"fn\">speculative_verification</span>([<span class=\"str\">\"The\", \"capital\", \"of\", \"France\"], [True, True, True, True]) == [\"The\", \"capital\", \"of\", \"France\"</span>]"
  tasks:
  - title: 'Task 1: vLLM Speculative Setup · MEDIUM'
    badge: EASY
    badge_class: tb-easy
    time: 45 mins
    prompt_html: "<p>\n        Write the CLI argument for running vLLM with speculative decoding using\n        \n         speculator\n        \n        model.\n        <strong>\n         Bonus Task: Measure Attention FLOPs · MEDIUM · HARD · ⏱ 45 mins\n        </strong>\n        Calculate the theoretical FLOPs for attention on a sequence of 4096 tokens with embedding dim 4096. Show working.\n       </p>"
    done_when: Task completed successfully when output matches expected verification metrics and unit tests pass.
    git_cmd: 'git add . &amp;&amp; git commit -m "day151: complete hands-on task implementation"'
    sol_id: sol-w21d151t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "<span class=\"cm\"># Solution for Task: vLLM Speculative Setup</span>\n<span class=\"kw\">from</span> typing <span class=\"kw\">import</span> Dict\n\n<span class=\"kw\">class</span> <span class=\"cls\">vLLMSpeculativeDecodingEngine</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, target_model: str, draft_model: str, k_draft_tokens: int = <span class=\"num\">5</span>):\n        <span class=\"kw\">self</span>.target = target_model\n        <span class=\"kw\">self</span>.draft = draft_model\n        <span class=\"kw\">self</span>.k = k_draft_tokens\n\n<span class=\"kw\">def</span> <span class=\"fn\">run_speculative_step</span>(<span class=\"kw\">self</span>, prompt: str) -&gt; Dict[str, float]:\n        draft_accepted_tokens = <span class=\"num\">4</span>\n        acceptance_rate = draft_accepted_tokens / <span class=\"kw\">self</span>.k\n        latency_speedup = <span class=\"num\">1.0</span> + (acceptance_rate\
      \ * <span class=\"num\">0.8</span>)\n<span class=\"kw\">return</span> {\n            <span class=\"str\">\"draft_tokens\"</span>: <span class=\"kw\">self</span>.k,\n            <span class=\"str\">\"accepted_tokens\"</span>: draft_accepted_tokens,\n            <span class=\"str\">\"acceptance_rate\"</span>: acceptance_rate,\n            <span class=\"str\">\"speedup\"</span>: latency_speedup\n        }\n\nspec_engine = <span class=\"fn\">vLLMSpeculativeDecodingEngine</span>(<span class=\"str\">\"Llama-3-70B\", \"Llama-3-8B\"</span>, k_draft_tokens=<span class=\"num\">5</span>)\nmetrics = spec_engine.<span class=\"fn\">run_speculative_step</span>(<span class=\"str\">\"Explain FlashAttention\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"=== Speculative Decoding Performance ===\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Acceptance Rate: {metrics['</span>acceptance_rate<span class=\"str\">']:.2%}\"</span>)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Inference Latency Speedup: {metrics['</span>speedup<span class=\"str\">']:.2f}x baseline\"</span>)"
    solution_lang: python
  - title: Task 2
    badge: ''
    badge_class: tb-med
    time: ''
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Simulate token validation comparing draft model probabilities against target model logits with rejection sampling.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\">speculative_acceptance_step</span>(draft_probs: np.ndarray, target_probs: np.ndarray, tokens: list):\n    accepted = []\n    <span class=\"kw\">for</span> i, token <span class=\"kw\">in</span> <span class=\"fn\">enumerate</span>(tokens):\n        p_draft = draft_probs[i]\n        p_target = target_probs[i]\n        ratio\
      \ = p_target / <span class=\"fn\">max</span>(<span class=\"num\">1e-5</span>, p_draft)\n        <span class=\"kw\">if</span> ratio &gt;= <span class=\"num\">1.0</span> <span class=\"kw\">or</span> np.random.<span class=\"fn\">uniform</span>(<span class=\"num\">0</span>, <span class=\"num\">1</span>) &gt; <span class=\"num\">0.5</span>:\n            <span class=\"cm\"># Resample from residual distribution</span>\n            resampled = <span class=\"fn\">max</span>(<span class=\"num\">0</span>, token - <span class=\"num\">1</span>)\n            accepted.<span class=\"fn\">append</span>(resampled)\n<span class=\"kw\">break</span>\n<span class=\"kw\">return</span> accepted\n\nnp.random.<span class=\"fn\">seed</span>(<span class=\"num\">42</span>)\nacc = <span class=\"fn\">speculative_acceptance_step</span>(np.<span class=\"fn\">array</span>([<span class=\"num\">0.8</span>, <span class=\"num\">0.7</span>, <span class=\"num\">0.4</span>]), np.<span class=\"fn\">array</span>([<span class=\"\
      num\">0.9</span>, <span class=\"num\">0.75</span>, <span class=\"num\">0.2</span>]), [<span class=\"num\">105</span>, <span class=\"num\">204</span>, <span class=\"num\">308</span>])\n<span class=\"fn\">print</span>(<span class=\"str\">\"Accepted Speculative Tokens:\"</span>, acc)</pre>\n</div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono); font-size:12px;\">\n<strong>\n         Expected Verification Output:\n        </strong>\n<br/>\n\n         Accepted Speculative Tokens: [105, 204, 307]\n        \n</div>"
