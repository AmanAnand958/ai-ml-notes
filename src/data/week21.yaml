    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Compute theoretical wall-clock speedup based on acceptance rate and model size ratio.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\">def</span> <span class=\"fn\">compute_speculative_speedup</span>(alpha: float, gamma: int, c: float) -&gt; float:\n    expected_accepted = (<span class=\"num\">1.0</span> - alpha ** (gamma + <span class=\"num\">1</span>)) / (<span class=\"num\">1.0</span> - alpha)\n    cost = gamma * c + <span class=\"num\">1.0</span>\n<span class=\"kw\">return</span> <span class=\"fn\">round</span>(expected_accepted / cost, <span class=\"num\">2</span>)\n\n<span class=\"\
      fn\">print</span>(<span class=\"str\">\"Speculative Speedup (alpha=0.85, gamma=4, cost_ratio=0.04):\", compute_speculative_speedup(0.85, 4, 0.04), \"x\"</span>)</pre>\n</div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono); font-size:12px;\">\n<strong>\n         Expected Verification Output:\n        </strong>\n<br/>\n\n         Speculative Speedup (alpha=0.85, gamma=4, cost_ratio=0.04): 2.92 x\n        \n</div>"
