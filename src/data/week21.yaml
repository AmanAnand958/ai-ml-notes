      \        device_map=\"auto\",\n        torch_dtype=torch.bfloat16,\n    )\n\
      \    merged = model.merge_and_unload()  # fuse LoRA weights into base\n    tokenizer\
      \ = AutoTokenizer.from_pretrained(base_model_id)\n    merged.save_pretrained(output_dir)\n\
      \    tokenizer.save_pretrained(output_dir)\n    print(f\"✅ Merged model saved\
      \ to {output_dir}\")\n    return output_dir\n\n# ── Step 2: Launch vLLM server\
      \ ────────────────────────────────────\ndef launch_vllm_server(model_path: str,\
      \ port: int = 8000) -> None:\n    \"\"\"Start vLLM OpenAI-compatible server\
      \ as subprocess.\"\"\"\n    cmd = [\n        \"python\", \"-m\", \"vllm.entrypoints.openai.api_server\"\
      ,\n        \"--model\", model_path,\n        \"--port\", str(port),\n      \
      \  \"--dtype\", \"bfloat16\",\n        \"--max-model-len\", \"4096\",\n    \
      \    \"--gpu-memory-utilization\", \"0.90\",\n    ]\n    print(f\"Starting vLLM\
      \ server on port {port}...\")\n    subprocess.Popen(cmd)  # non-blocking; server\
      \ runs in background\n\n# ── Step 3: Query the deployed model ─────────────────────────────\n\
      def query_vllm(prompt: str, port: int = 8000) -> str:\n    \"\"\"Send an inference\
