    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Identify the top 1% salient weight channels based on activation magnitudes for INT4 preservation.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\">find_awq_salient_channels</span>(weights: np.ndarray, activations: np.ndarray, top_k_percent: float = <span class=\"num\">0.05</span>):\n    <span class=\"cm\"># Activation magnitude per channel</span>\n    act_scale = np.<span class=\"fn\">mean</span>(np.<span class=\"fn\">abs</span>(activations), axis=<span class=\"num\">0</span>)\n\
      \    num_salient = <span class=\"fn\">max</span>(<span class=\"num\">1</span>, <span class=\"fn\">int</span>(<span class=\"fn\">len</span>(act_scale) * top_k_percent))\n    salient_indices = np.<span class=\"fn\">argsort</span>(act_scale)[-num_salient:]\n    \n    <span class=\"cm\"># Scale salient channels</span>\n    scaled_weights = weights.<span class=\"fn\">copy</span>()\n    scaled_weights[:, salient_indices] *= <span class=\"num\">2.0</span>\n<span class=\"kw\">return</span> salient_indices, scaled_weights\n\nW = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">64</span>, <span class=\"num\">64</span>)\nX = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">100</span>, <span class=\"num\">64</span>)\ns_idx, W_scaled = <span class=\"fn\">find_awq_salient_channels</span>(W, X, top_k_percent=<span class=\"num\">0.10</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Identified {len(s_idx)} Salient Channels for FP16 Preservation: {s_idx[:3]}...\"\
      </span>)</pre>\n</div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono); font-size:12px;\">\n<strong>\n         Expected Verification Output:\n        </strong>\n<br/>\n\n         Identified 6 Salient Channels for FP16 Preservation: [...]\n        \n</div>"
    done_when: 'When code executes without errors, passes all unit assertions, and prints verified output metrics for Task 2: Implement Quantization.'
