  quizzes:
  - num_str: QUESTION 1 OF 4
    question: How does Direct Preference Optimization (DPO) eliminate the need for
      a separate reward model during LLM alignment?
    qid: q154_1
    options:
    - letter: A
      text: A fast small draft model generates $K$ candidate tokens speculatively,
        and the large target model verifies all $K$ tokens in a single parallel forward
        pass.
      is_correct: true
    - letter: B
      text: It skips 50% of the layers in the neural network.
      is_correct: false
    - letter: C
      text: It rounds all floating point numbers to integers.
      is_correct: false
    - letter: D
      text: It uses speculative stock market algorithms.
      is_correct: false
    correct_fb: ✅ Correct! Speculative decoding leverages the fact that target verification
      is compute-bound and can evaluate $K$ draft tokens in parallel in one forward
      pass.
    wrong_fb: ❌ Incorrect. Speculative decoding uses a small draft model to propose
      tokens that the large model validates in parallel, guaranteeing identical mathematical
      output distributions.
  - num_str: QUESTION 2 OF 4
    question: What role does the reference model (pi_ref) play in the DPO loss formulation?
    qid: q154_2
    options:
    - letter: A
      text: "The acceptance rate $\alpha$ of draft tokens by the target model and\
        \ the latency ratio between draft and target forward passes."
      is_correct: true
    - letter: B
      text: The size of the hard drive on the server.
      is_correct: false
    - letter: C
      text: The screen resolution of the user's monitor.
      is_correct: false
    - letter: D
      text: The temperature of the server room.
      is_correct: false
    correct_fb: "✅ Correct! High draft acceptance rates ($\alpha  0.7$) combined with\
      \ a draft model that is 10x-20x faster than the target yield 2x-3x end-to-end\
      \ wall-clock speedups."
    wrong_fb: ❌ Incorrect. Speedup depends strictly on draft model latency and the
      target model's acceptance probability per token.
  - num_str: QUESTION 3 OF 4
    question: How does Odds Ratio Preference Optimization (ORPO) simplify the alignment
      pipeline compared to standard DPO?
    qid: q154_3
    options:
    - letter: A
      text: It adds multiple extra MLP heads to the target model's final hidden state
        to predict multiple future tokens simultaneously in a single forward pass.
      is_correct: true
    - letter: B
      text: It connects 10 separate GPUs in a ring topology.
      is_correct: false
    - letter: C
      text: It converts text into Greek mythology stories.
      is_correct: false
    - letter: D
      text: It trains 5 separate foundation models concurrently.
      is_correct: false
    correct_fb: ✅ Correct! Medusa uses tree-based attention and lightweight prediction
      heads atop the base model, eliminating the memory and serving overhead of a
      separate draft model.
    wrong_fb: ❌ Incorrect. Medusa uses specialized multi-token prediction heads trained
      directly on top of the target model's frozen backbone.
  - num_str: QUESTION 4 OF 4
    question: What is the primary risk of setting the DPO beta (KL penalty coefficient)
      too low during fine-tuning?
    qid: q154_4
    options:
    - letter: A
      text: The first 2 accepted tokens and 1 target correction token are emitted,
        and the remaining 2 draft tokens are discarded.
      is_correct: true
    - letter: B
      text: The server crashes and restarts.
      is_correct: false
    - letter: C
      text: The entire conversation history is erased.
      is_correct: false
    - letter: D
      text: The generation terminates immediately.
      is_correct: false
    correct_fb: ✅ Correct! Speculative decoding accepts prefix tokens up to the first
      rejection point, emits the target model's ground-truth correction, and resumes.
    wrong_fb: ❌ Incorrect. Generation accepts all tokens prior to the mismatch plus
      the target's corrected token, discarding only downstream speculative tokens.
