  quizzes:
  - question: How does FlashAttention-2 achieve a 2-4x speedup over standard multi-head
      attention?
    options:
    - letter: A
      text: By quantizing attention weights to 1-bit
      is_correct: false
    - letter: B
      text: By tiling computation to minimize slow GPU High Bandwidth Memory (HBM)
        reads/writes and keeping intermediate matrices in fast SRAM
      is_correct: true
    - letter: C
      text: By skipping attention over half the tokens randomly
      is_correct: false
    - letter: D
      text: By calculating attention on CPU instead of GPU
      is_correct: false
    correct_fb: ✅ Correct! FlashAttention is an IO-aware algorithm that tiles softmax
      and matmuls inside fast on-chip SRAM.
    wrong_fb: ❌ Incorrect. FlashAttention optimizes GPU memory hierarchy access (SRAM
      vs HBM).
  - question: What is Speculative Decoding in LLM acceleration?
    options:
    - letter: A
      text: Guessing model weights before training
      is_correct: false
    - letter: B
      text: Using a fast draft model to generate candidate tokens in parallel, verified
        in a single forward pass by the target LLM
      is_correct: true
    - letter: C
      text: Pruning 50% of the transformer layers
      is_correct: false
    - letter: D
      text: Distilling the model into an SVM
      is_correct: false
    correct_fb: ✅ Correct! Speculative decoding uses a small draft model to propose
      tokens that the large model verifies in parallel.
    wrong_fb: ❌ Incorrect. Speculative decoding uses draft models + parallel verification.
  flashcards:
  - front: Speculative Decoding
    back: Drafting K tokens with a small model, verifying in 1 parallel pass with
      a large model. Lossless speedup!
  - front: Tiling (FlashAttention)
    back: Computing attention block-by-block in fast SRAM instead of writing the full
      N x N matrix to slow HBM.
  - front: Draft Model (Speculative)
    back: A smaller, fast model that proposes K tokens speculatively for the large
      model to verify in one pass.
