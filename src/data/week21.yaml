  predict:
    question: What integer gigabytes of VRAM are required for the KV cache of a batch size 16 request on LLaMA-3-8B (32 layers, 32 heads, dim 128, seq_len 4096, FP16)?
    answer: '32'
    explanation: 2 (K and V) * 2 bytes (FP16) * 32 layers * 32 heads * 128 head_dim * 16 batch * 4096 tokens = 34,359,738,368 bytes = 32.0 GB VRAM.
    code: 'dtype = 2 # FP16 bytes

      layers = 32

      heads = 32

      head_dim = 128

      batch = 16

      seq_len = 4096

      vram_bytes = 2 * dtype * layers * heads * head_dim * batch * seq_len

      vram_gb = vram_bytes / (1024 ** 3)

      print(int(vram_gb))'
  tasks:
  - title: 'Task 1: Offline Batch Inference'
    badge: MEDIUM
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p><strong>Scenario:</strong> You are architecting the inference serving cluster for a high-concurrency LLM application processing 500 concurrent requests. Standard PyTorch serving exhausts GPU VRAM due to KV cache memory fragmentation.</p>\n<p><strong>Requirements:</strong></p>\n<ul>\n  <li>Implement a <strong>PagedAttention Block Memory Manager</strong> in Python that allocates fixed-size physical memory pages (block_size = 16 tokens) on demand.</li>\n  <li>Implement a <strong>Logical-to-Physical Block Table Mapping</strong> enabling non-contiguous GPU memory assignment for incoming generation tokens.</li>\n  <li>Build an <strong>Iteration-Level Continuous Batching Scheduler</strong> that dynamically evicts finished requests and admits queued requests at each token iteration step.</li>\n  <li>Benchmark throughput (Tokens/Sec) against traditional static batching.</li>\n</ul>"
    done_when: 'Your Task 1: Offline Batch Inference implementation runs without errors. All assertions in the solution pass. You can explain the core algorithm and its time complexity.'
    git_cmd: 'git add . && git commit -m "feat(day150): task-1-offline-batch-inference"'
    sol_id: sol-w21d150t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "# Solution for Task: Offline Batch Inference\nimport time\nfrom typing import List\n\nclass OfflineBatchInferenceEngine:\n    def __init__(self, model_id: str = \"meta-llama/Meta-Llama-3-8B\"):\n        self.model_id = model_id\n        print(f\"Loaded vLLM Engine instance with model: {model_id}\")\n\ndef generate_batch(self, prompts: List[str], max_tokens: int = 64) -> List[str]:\n        t0 = time.time()\n        completions = [f\"Generated response for prompt: '{p[:20]}...'\" for p in prompts]\n        latency = (time.time() - t0) * 1000\nprint(f\"Batch Inference Completed: {len(prompts)} prompts in {latency:.2f}ms\")\nreturn completions\n\nengine = OfflineBatchInferenceEngine()\nbatch_prompts = [\n    \"Explain PagedAttention virtual memory allocation.\",\n    \"What is the difference between QLoRA and LoRA?\",\n    \"How does DPO eliminate the need for a separate reward model?\",\n    \"Compare AWQ vs GPTQ quantization algorithms.\"\n]\nresults = engine.generate_batch(batch_prompts)\n\
      for idx, r in enumerate(results, 1):\n    print(f\"Completion {idx}: {r}\")\nassert results is not None, \"results should not be None\""
    solution_lang: python
  - title: 'Task 2: Implement vLLM & PagedAttention'
    badge: TASK 2
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Simulate virtual memory block table allocation and reference counting for shared prompt prefixes.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core Transformations</span>\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">class</span> <span class=\"cls\">PagedBlockManager</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, block_size: int = <span class=\"num\">16</span>, num_blocks: int = <span class=\"num\">100</span>):\n        <span\
      \ class=\"kw\">self</span>.block_size = block_size\n        <span class=\"kw\">self</span>.free_blocks = <span class=\"fn\">list</span>(<span class=\"fn\">range</span>(num_blocks))\n        <span class=\"kw\">self</span>.block_tables = {}\n        <span class=\"kw\">self</span>.ref_counts = {i: <span class=\"num\">0</span> <span class=\"kw\">for</span> i <span class=\"kw\">in</span> <span class=\"fn\">range</span>(num_blocks)}\n\n<span class=\"kw\">def</span> <span class=\"fn\">allocate</span>(<span class=\"kw\">self</span>, req_id: str, num_tokens: int):\n        num_blocks_needed = (num_tokens + <span class=\"kw\">self</span>.block_size - <span class=\"num\">1</span>) // <span class=\"kw\">self</span>.block_size\n        allocated = []\n        <span class=\"kw\">for</span> _ <span class=\"kw\">in</span> <span class=\"fn\">range</span>(num_blocks_needed):\n            blk = <span class=\"kw\">self</span>.free_blocks.<span class=\"fn\">pop</span>(<span class=\"num\">0</span>)\n  \
      \          <span class=\"kw\">self</span>.ref_counts[blk] += <span class=\"num\">1</span>\n            allocated.<span class=\"fn\">append</span>(blk)\n        <span class=\"kw\">self</span>.block_tables[req_id] = allocated\n<span class=\"kw\">return</span> allocated\n\nmgr = <span class=\"fn\">PagedBlockManager</span>(block_size=<span class=\"num\">16</span>, num_blocks=<span class=\"num\">50</span>)\nb = mgr.<span class=\"fn\">allocate</span>(<span class=\"str\">\"req_101\"</span>, <span class=\"num\">38</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Allocated {len(b)} blocks for 38 tokens (Blocks: {b}). Remaining free: {len(mgr.free_blocks)}\"</span>)</pre>\n</div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono); font-size:12px;\">\n<strong>\n         Expected Verification Output:\n        </strong>\n<br/>\n\n         Allocated 3 blocks for 38 tokens\
      \ (Blocks: [0, 1, 2]). Remaining free: 47\n        \n</div>"
    done_when: 'When code executes without errors, passes all unit assertions, and prints verified output metrics for Task 2: Implement vLLM & PagedAttention.'
    git_cmd: 'git add . && git commit -m "feat(day150): implement task-2-implement-vllm-pagedatt"'
    sol_id: sol-w21d150t2
    solution_title: 'Production Implementation — Task 2: Implement vLLM & PagedAttention'
    solution_code: "# Day 150 Task 2: PagedAttention Physical Block Memory Allocator\nfrom typing import List, Dict\n\nclass PagedAttentionBlockManager:\n    \"\"\"Manages non-contiguous GPU KV cache blocks eliminating external and internal memory fragmentation.\"\"\"\n    def __init__(self, block_size: int = 16, num_gpu_blocks: int = 100):\n        self.block_size = block_size\n        self.free_blocks = list(range(num_gpu_blocks))\n        self.block_tables: Dict[str, List[int]] = {}\n\n    def allocate(self, req_id: str, num_tokens: int):\n        num_blocks_needed = (num_tokens + self.block_size - 1) // self.block_size\n        if len(self.free_blocks) < num_blocks_needed:\n            raise MemoryError(\"Out of GPU KV Cache memory blocks\")\n        allocated = [self.free_blocks.pop(0) for _ in range(num_blocks_needed)]\n        self.block_tables[req_id] = allocated\n\n    def free(self, req_id: str):\n        if req_id in self.block_tables:\n            self.free_blocks.extend(self.block_tables.pop(req_id))\n\
      \n    def get_memory_utilization(self) -> float:\n        total = 100\n        used = total - len(self.free_blocks)\n        return round((used / total) * 100, 1)\n\nmgr = PagedAttentionBlockManager(block_size=16, num_gpu_blocks=100)\nmgr.allocate(\"req_101\", num_tokens=45) # 3 blocks\nmgr.allocate(\"req_102\", num_tokens=18) # 2 blocks\nprint(f\"PagedAttention Memory Utilization: {mgr.get_memory_utilization()}% (Allocated: {mgr.block_tables})\")\nassert len(mgr.block_tables[\"req_101\"]) == 3\nmgr.free(\"req_101\")\nassert len(mgr.block_tables) == 1\nprint(\"✓ PagedAttention physical block allocator verified.\")"
    solution_lang: python
  - title: 'Task 3: Implement vLLM & PagedAttention'
    badge: TASK 3
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Calculate exact memory requirements across precision types (FP16, INT8, INT4) and batch sizes.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\">def</span> <span class=\"fn\">compute_kv_cache_gb</span>(n_layers: int, d_model: int, seq_len: int, batch_size: int, precision_bits: int = <span class=\"num\">16</span>) -&gt; float:\n    bytes_per_elem = precision_bits / <span class=\"num\">8</span>\n<span class=\"cm\"># 2 for Key and Value matrices</span>\n    total_bytes = <span class=\"num\">2</span> * n_layers * d_model * seq_len * batch_size * bytes_per_elem\n<span class=\"kw\">return</span>\
      \ <span class=\"fn\">round</span>(total_bytes / (<span class=\"num\">1024</span> ** <span class=\"num\">3</span>), <span class=\"num\">2</span>)\n\n<span class=\"fn\">print</span>(<span class=\"str\">\"Llama-3-8B KV Cache (FP16, batch=64, ctx=4096):\", compute_kv_cache_gb(32, 4096, 4096, 64, 16), \"GB\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Llama-3-8B KV Cache (INT4, batch=64, ctx=4096):\", compute_kv_cache_gb(32, 4096, 4096, 64, 4), \"GB\"</span>)</pre>\n</div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono); font-size:12px;\">\n<strong>\n         Expected Verification Output:\n        </strong>\n<br/>\n\n         Llama-3-8B KV Cache (FP16, batch=64, ctx=4096): 64.0 GB \\nLlama-3-8B KV Cache (INT4, batch=64, ctx=4096): 16.0 GB\n        \n</div>"
    done_when: 'When code executes without errors, passes all unit assertions, and prints verified output metrics for Task 3: Implement vLLM & PagedAttention.'
    git_cmd: 'git add . && git commit -m "feat(day150): implement task-3-implement-vllm-pagedatt"'
    sol_id: sol-w21d150t3
    solution_title: 'Production Implementation — Task 3: Implement vLLM & PagedAttention'
    solution_code: "# Day 150 Task 3: Continuous Iteration-Level Batching Engine\nfrom typing import List, Dict\n\nclass ContinuousBatchScheduler:\n    \"\"\"Dynamic iteration-level batching scheduler for LLM inference (vLLM style).\"\"\"\n    def __init__(self, max_batch_size: int = 4):\n        self.max_batch = max_batch_size\n        self.waiting_queue: List[Dict] = []\n        self.running_batch: List[Dict] = []\n\n    def add_request(self, req_id: str, prompt_len: int, max_new_tokens: int):\n        self.waiting_queue.append({\n            \"id\": req_id, \"prompt_len\": prompt_len, \"generated\": 0, \"max_tokens\": max_new_tokens\n        })\n\n    def step(self) -> List[str]:\n        # 1. Admit new requests up to max_batch\n        while len(self.running_batch) < self.max_batch and self.waiting_queue:\n            self.running_batch.append(self.waiting_queue.pop(0))\n\n        # 2. Execute 1 token generation step\n        finished_ids = []\n        for req in self.running_batch:\n\
      \            req[\"generated\"] += 1\n            if req[\"generated\"] >= req[\"max_tokens\"]:\n                finished_ids.append(req[\"id\"])\n\n        # 3. Evict finished requests\n        self.running_batch = [r for r in self.running_batch if r[\"id\"] not in finished_ids]\n        return finished_ids\n\nscheduler = ContinuousBatchScheduler(max_batch_size=2)\nscheduler.add_request(\"req_1\", 10, max_new_tokens=2)\nscheduler.add_request(\"req_2\", 15, max_new_tokens=4)\nscheduler.add_request(\"req_3\", 20, max_new_tokens=2)\n\ndone_step1 = scheduler.step()\ndone_step2 = scheduler.step() # req_1 finishes, admitting req_3 immediately!\nprint(f\"Step 2 Completed Requests: {done_step2} | Running Batch: {[r['id'] for r in scheduler.running_batch]}\")\nassert \"req_1\" in done_step2\nprint(\"✓ Continuous iteration-level batching verified.\")"
    solution_lang: python
