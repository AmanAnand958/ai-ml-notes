  flashcards:
  - front: What is Direct Preference Optimization (DPO)?
    back: • DPO implicitly optimizes the policy model on human preference pairs (chosen vs rejected) using a closed-form substitution
      of the reward function, eliminating the need for a separate reward model.
  - front: How does ORPO (Odds Ratio Preference Optimization) differ from DPO?
    back: • ORPO unifies supervised fine-tuning (SFT) and preference alignment into a single loss function by penalizing the
      odds ratio of rejected tokens during cross-entropy training.
  - front: What is GRPO (Group Relative Policy Optimization) in DeepSeek-Math/R1?
    back: • GRPO eliminates the critic network in PPO by sampling a group of outputs for each query and normalizing advantages
      relative to the group mean and standard deviation.
  - front: Why does DPO prevent policy collapse compared to standard RLHF?
    back: • The KL divergence penalty against the reference model $\pi_{\text{ref}}$ is mathematically built into the objective,
      keeping generation grounded in the base model distribution.
  - front: 'Senior Interview Question: When should you prefer DPO over PPO in enterprise alignment?'
    back: • Choose DPO for stable, offline preference optimization with 50% lower VRAM overhead. Choose PPO/GRPO when an online
      environment or dynamic verifiable reward function (e.g. code/math unit tests) is available.
