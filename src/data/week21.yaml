    qid: q154_4
    options:
    - letter: A
      text: The first 2 accepted tokens and 1 target correction token are emitted,
        and the remaining 2 draft tokens are discarded.
      is_correct: true
      id: a
    - letter: B
      text: The server crashes and restarts.
      is_correct: false
      id: b
    - letter: C
      text: The entire conversation history is erased.
      is_correct: false
      id: c
    - letter: D
      text: The generation terminates immediately.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Speculative decoding accepts prefix tokens up to the first
      rejection point, emits the target model's ground-truth correction, and resumes.
    wrong_fb: ❌ Incorrect. Generation accepts all tokens prior to the mismatch plus
