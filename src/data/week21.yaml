      is_correct: false
    - letter: C
      text: Plain text JSON files.
      is_correct: false
    - letter: D
      text: ZIP archives containing pickle files.
      is_correct: false
    correct_fb: ✅ Correct! GGUF is the high-performance unified binary format designed for efficient mmap loading and cross-platform execution in llama.cpp.
    wrong_fb: ❌ Incorrect. GGUF is the industry standard format for quantized single-file model distribution in llama.cpp.
  - num_str: QUESTION 4 OF 4
    question: What is the primary degradation symptom when an LLM is over-quantized (e.g. 2-bit quantization)?
    qid: q152_4
    options:
    - letter: A
      text: Severe perplexity spikes, repetitive text loops, and loss of complex multi-step reasoning capabilities.
      is_correct: true
    - letter: B
      text: The model generates text 100x faster.
      is_correct: false
    - letter: C
      text: The model switches its language to Latin.
      is_correct: false
    - letter: D
      text: The file size on disk expands.
      is_correct: false
    correct_fb: ✅ Correct! Extreme quantization below 3.5 bits per weight introduces severe rounding error, causing catastrophic perplexity and reasoning degradation.
    wrong_fb: ❌ Incorrect. Over-quantizing severely damages weight representations, leading to high perplexity and nonsensical generations.
  flashcards:
