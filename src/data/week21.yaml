  analogy: Standard attention is like walking to the distant library warehouse every time you read one sentence. FlashAttention
    loads an entire chapter into your personal desk (SRAM), reads it all at once, and writes back the final summary.
  theory_html: "<h3 class=\"sh3\">1. FlashAttention: IO-Aware Exact Attention</h3>\n<p>\nStandard attention computes $QK^T$,\
    \ writes the full $N \times N$ matrix to slow GPU High-Bandwidth Memory (HBM), computes Softmax, writes to HBM, and multiplies\
    \ by $V$. <strong>FlashAttention</strong> tiles the computation into fast on-chip SRAM blocks, computing online softmax\
    \ without ever materializing the $O(N^2)$ attention matrix in HBM.\n</p>\n<div class=\"mermaid\">\ngraph LR\n  subgraph\
    \ Standard Attention (Memory Bottleneck)\n    Q1[\"Q, K, V in HBM\"] -->|Read| S1[\"Compute S = QK^T\"]\n    S1 -->|Write\
    \ O(N^2) to HBM| HBM1[\"Slow HBM Matrix\"]\n    HBM1 -->|Read| S2[\"Softmax(S)\"]\n    S2 -->|Write O(N^2) to HBM| HBM2[\"\
    Slow HBM Matrix\"]\n    HBM2 -->|Read| S3[\"P * V -> Out\"]\n  end\n  subgraph FlashAttention (IO-Aware Tiling)\n    Q2[\"\
    Load Blocks Q_i, K_j into Fast SRAM\"] --> Tile[\"Tile Computation + Online Softmax in SRAM\"]\n    Tile -->|Write Final\
    \ O(N) only| Out[\"Output in HBM (2x-4x Speedup, O(N) Memory)\"]\n  end\n</div>\n<div class=\"diagram-cap\">FlashAttention\
