    Hashing (LSH) millions of text pairs ke Jaccard similarity ko sub-second time mein approximate karke duplicates delete
    karta hai.
  analogy: 'MinHash LSH deduplication is like generating a unique 10-note musical signature for every song in a catalog of
    100 million tracks: if two songs share the same 10-note signature, they are virtually identical covers.'
  theory_html: |-
    <h3 class="sh3">1. Synthetic Data Pipelines: Evol-Instruct & UltraFeedback</h3>
    <p>
    Frontier fine-tuning datasets are increasingly generated by frontier teacher models (GPT-4o, Claude-3.5-Sonnet) using automated evolutionary prompting:
    </p>
    <ul>
      <li><strong>In-Depth Evolution:</strong> Adds concrete multi-step reasoning constraints, edge-case handling, and domain-specific edge cases.</li>
      <li><strong>In-Breadth Evolution:</strong> Generates completely novel instruction domains that expand topic coverage.</li>
    </ul>

    <h3 class="sh3">2. MinHash Locality-Sensitive Hashing (LSH) Deduplication</h3>
    <p>
    Synthetic datasets frequently suffer from repetitive generation clusters. MinHash LSH deduplicates millions of document pairs in sub-linear time:
    </p>
    <div class="math-block">
    $$\Pr[h(A) = h(B)] = J(A, B) = \frac{|A \cap B|}{|A \cup B|}$$
    </div>
    <p>
    By shingling text into 5-grams and generating 128 hash signatures, MinHash identifies duplicate pairs with Jaccard similarity $\ge 0.80$, filtering out synthetic redundancy before training.
    </p>
  predict:
    question: Why do we use MinHash instead of calculating Cosine Similarity for every pair?
    answer: 'MinHash LSH Speedup over Pairwise: 1,250x faster'
    explanation: MinHash / LSH provides O(N) near-duplicate document clustering compared to O(N^2) exhaustive pairwise comparisons,
      making deduplication across millions of documents computationally tractable.
    code: |-
      # Verification Script for Day 155
      def minhash_dedup_efficiency(n_docs=500000):
          pairwise_ops = (n_docs * (n_docs - 1)) // 2
          lsh_ops = n_docs * 200  # O(N) indexing with 200 hash permutations
          speedup = pairwise_ops / lsh_ops
          print(f"MinHash LSH Speedup over Pairwise: {speedup:,.0f}x faster")
          return speedup

      if __name__ == "__main__":
          assert minhash_dedup_efficiency(500000) > 1000
