    <div class="task-header" style="background:rgba(229,107,140,.05);border-left:3px solid var(--pink)">
    <span class="task-badge tb-hard">
            Scenario Q6
           </span>
    <span class="task-title">
            Batch Normalization vs. Group Normalization
           </span>
    </div>
    <div class="task-body" style="display:block">
    <p>
    <strong>
             Question:
            </strong>
            What are the limitations of Batch Normalization when training under extremely small batch sizes (e.g., batch size = 2 for high-resolution segmentation)? How does Group Normalization (GN) solve this?
           </p>
    <p>
    <strong>
             Answer:
            </strong>
            Batch Normalization calculates running mean and variance statistics across the batch dimension. If batch size is tiny, these statistical estimates are highly inaccurate and noisy. This results in unstable gradient directions, destroying performance.
            <br/>
    <strong>Group Normalization (GN)</strong> divides the channels of a single input tensor into $G$ groups, and calculates mean and variance statistics *within* each channel group across the spatial dimensions. Because GN's calculations are independent of batch size, its accuracy is completely unaffected by tiny batch sizes, making it the industry standard for high-resolution medical imaging and large 3D object detection.
           </p>
