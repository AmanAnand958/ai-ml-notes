    </div></div>
    </div><div class="task-block">
    <div class="task-header" style="background:rgba(247,169,75,.05);border-left:3px solid var(--orange)">
    <span class="task-badge tb-hard">
            Scenario Q2
           </span>
    <span class="task-title">
            FLOPs &amp; Parameter Math: Depthwise Separable Convolutions
           </span>
    </div>
    <div class="task-body" style="display:block">
    <p>
    <strong>
             Question:
            </strong>
            Derive the exact parameter count and computational complexity (FLOPs) comparison between a standard 2D convolution and a Depthwise Separable Convolution (as used in MobileNets) for an input of shape $H \\times W \\times C$ and $N$ filters of size $K \\times K$.
           </p>
    <p>
    <strong>
             Answer:
            </strong>
    <br/>
            1. <strong>Standard Convolution:</strong>
    <br/>
            - <strong>Parameters:</strong> $K^2 \\times C \\times N$ (plus $N$ biases).
            <br/>
            - <strong>Complexity (FLOPs):</strong> $H \\times W \\times K^2 \\times C \\times N$.
            <br/>
            2. <strong>Depthwise Separable Convolution:</strong> Consists of a Depthwise Conv (one $K \\times K$ filter per input channel) followed by a Pointwise Conv ($1 \\times 1$ conv to mix channels):
            <br/>
            - <strong>Parameters:</strong> $(K^2 \\times C) + (1 \\times 1 \\times C \\times N) = C(K^2 + N)$.
            <br/>
            - <strong>Complexity (FLOPs):</strong> $(H \\times W \\times K^2 \\times C) + (H \\times W \\times C \\times N) = H \\times W \\times C(K^2 + N)$.
            <br/>
            3. <strong>Relative Ratio:</strong>
    <br/>
            $$\\text{Ratio} = \\frac{C(K^2 + N)}{K^2 \cdot C \cdot N} = \\frac{1}{N} + \\frac{1}{K^2}$$
            <br/>
            For a typical layer with $K=3$ and $N=256$, the Depthwise Separable Convolution uses <strong>approx. 11%</strong> of the parameters and FLOPs of a standard convolution, making it incredibly fast on mobile CPUs!
           </p>
