  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<div class=\"diagram-container\" style=\"background:var(--bg3);\
    \ padding:1rem; border-radius:8px; margin:1rem 0; border:1px solid var(--border);\">\n<p><strong>U-Net Segmentation Encoder-Decoder\
    \ Architecture with Skip Concatenations:</strong></p>\n<div class=\"mermaid\">\ngraph LR\n    subgraph Encoder[\"Contracting\
    \ Path (Encoder)\"]\n        E1[\"Input Image (572x572)\"] --&gt; E2[\"Conv 3x3 + MaxPool\"]\n        E2 --&gt; E3[\"\
    Conv 3x3 + MaxPool\"]\n        E3 --&gt; E4[\"Bottleneck Latent Features\"]\n    end\n    subgraph Decoder[\"Expanding\
    \ Path (Decoder)\"]\n        E4 --&gt; D1[\"Up-Conv 2x2\"]\n        D1 --&gt; D2[\"Up-Conv 2x2\"]\n        D2 --&gt; D3[\"\
    Final Conv 1x1 -&gt; Segmentation Mask\"]\n    end\n    E1 -.-&gt;|High-Res Skip Connection| D3\n    E2 -.-&gt;|Spatial\
    \ Skip Connection| D2\n    E3 -.-&gt;|Feature Skip Connection| D1\n</div>\n</div>\n<h3 class=\"sh3\">\n       1. Semantic\
    \ vs. Instance Segmentation\n      </h3>\n<p>\n       Image segmentation partitions an image into pixel-level groupings:\n\
    \      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         Semantic Segmentation:\n        </strong>\n        Classifies\
    \ *every pixel* in the image into a specific class category.\n      If three distinct people are standing side-by-side,\n\
    \      semantic segmentation colors all their pixels with the exact same \"human\" label,\n      treating them as a single\
    \ homogeneous region.\n        <br/>\n<em>\n         Core Architecture:\n        </em>\n        U-Net (Ronneberger et\
    \ al., 2015).\n       </li>\n<li>\n<strong>\n         Instance Segmentation:\n        </strong>\n        Simultaneously\
    \ localizes, classifies, and segmentally maps *individual objects* separately.\n      In our three-person example, instance\
    \ segmentation identifies \"Person A\", \"Person B\",\n      and \"Person C\" separately, coloring each with a unique\
    \ label index.\n        <br/>\n<em>\n         Core Architecture:\n        </em>\n        Mask R-CNN (He et al., 2017).\n\
    \       </li>\n</ul>\n<h3 class=\"sh3\">\n       2. Spatial Expansion Mathematics: Transpose Convolution\n      </h3>\n\
    <p>\n       To produce pixel-level maps matching the input resolution,\n    segmentation networks must upsample spatial\
    \ grids.\n    Standard upsampling (bilinear) has no weights.\n    <strong>Transpose Convolution</strong> (sometimes called\
    \ deconvolution) is a learnable upsampling layer.\n       <br/>\n       Given an input size $I$, stride $S$, padding $P$,\
    \ kernel size $K$, and output padding $OP$,\n    the spatial dimension of the output $O \\times O$ is determined by the\
    \ following formal mathematical formula:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$O\
    \ = (I - 1) \\times S - 2P + K + OP$$\n       </span>\n</div>\n<p>\n       Let's trace a physical example:\n       <br/>\n\
    \       If $I = 7$, $S = 2$, $P = 1$ (Same Padding), $K = 4$, and $OP = 0$:\n       <br/>\n       $O = (7 - 1) \\times\
    \ 2 - 2(1) + 4 + 0 = 6 \\times 2 - 2 + 4 = 12 - 2 + 4 = 14$.\n       <br/>\n       The spatial size successfully doubled\
    \ from $7 \\times 7$ to $14 \\times 14$!\n      </p>\n<p>\n<em>\n        Engineering Gotcha:\n       </em>\n       Transpose\
    \ convolutions often suffer from <strong>checkerboard artifacts</strong>\n    (uneven overlapping patterns caused by strides\
    \ and kernels not dividing perfectly).\n    To prevent this, industry production pipelines often replace Transpose Conv\n\
    \    with a simple bilinear upsampling followed by a standard Conv2D layer.\n      </p>\n<h3 class=\"sh3\">\n       3.\
    \ Dice Loss Function for Extreme Imbalance\n      </h3>\n<p>\n       In medical imaging, a target tumor might occupy only\
    \ $0.5\\%$ of the pixels in an MRI slice.\n    If we use standard Binary Cross-Entropy (BCE) loss,\n    the network can\
    \ achieve $99.5\\%$ accuracy by simply predicting \"background\" for every pixel.\n       <br/>\n       The <strong>Dice\
    \ Loss Function</strong> solves this.\n    Derived from the F1-score (Sørensen-Dice coefficient),\n    it measures overlap\
    \ directly and is completely independent of background pixel dominance:\n      </p>\n<div class=\"math-block\">\n<span\
    \ class=\"formula\">\n        $$\\text{Dice Loss} = 1 - \\frac{2 \\sum_{i} p_i g_i}{\\sum_{i} p_i^2 + \\sum_{i} g_i^2}$$\n\
    \       </span>\n<span class=\"desc\">\n        Where p_i is the predicted probability for pixel i, and g_i is the ground\
    \ truth label (0 or 1).\n       </span>\n</div>\n<p>\n       If the predicted and ground truth masks do not overlap, Dice\
    \ Loss is 1.\n    If they align perfectly, Dice Loss is 0.\n    Background pixels have no weight in the numerator, eliminating\
    \ background dominance bias!\n      </p>\n<h3 class=\"sh3\">\n       4. Custom modular U-Net Architecture in Keras\n \
    \     </h3>\n<p>\n       Let's write a complete, production-grade U-Net architecture in Keras.\n    The model consists\
    \ of a contracting path (encoder) that extracts features while downsampling spatial grids,\n    and an expanding path\
    \ (decoder) that restores spatial resolution.\n    Skip connections concatenate high-resolution features from the encoder\
    \ directly to the decoder to preserve crisp edge details.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n         python — unet_keras.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"\
    ><span class=\"kw\">import</span> tensorflow <span class=\"kw\">as</span> tf\n<span class=\"kw\">from</span> tensorflow.keras\
    \ <span class=\"kw\">import</span> layers, models\n\n<span class=\"kw\">def</span> <span class=\"fn\">conv_block</span>(input_tensor,\
    \ num_filters):\n    x = layers.<span class=\"fn\">Conv2D</span>(num_filters, (<span class=\"num\">3</span>, <span class=\"\
    num\">3</span>), padding=<span class=\"str\">'same'</span>)(input_tensor)\n    x = layers.<span class=\"fn\">BatchNormalization</span>()(x)\n\
    \    x = layers.<span class=\"fn\">Activation</span>(<span class=\"str\">'relu'</span>)(x)\n    \n    x = layers.<span\
    \ class=\"fn\">Conv2D</span>(num_filters, (<span class=\"num\">3</span>, <span class=\"num\">3</span>), padding=<span\
    \ class=\"str\">'same'</span>)(x)\n    x = layers.<span class=\"fn\">BatchNormalization</span>()(x)\n    x = layers.<span\
    \ class=\"fn\">Activation</span>(<span class=\"str\">'relu'</span>)(x)\n    <span class=\"kw\">return</span> x\n\n<span\
    \ class=\"kw\">def</span> <span class=\"fn\">encoder_block</span>(input_tensor, num_filters):\n    x = <span class=\"\
    fn\">conv_block</span>(input_tensor, num_filters)\n    p = layers.<span class=\"fn\">MaxPooling2D</span>((<span class=\"\
    num\">2</span>, <span class=\"num\">2</span>))(x)\n    <span class=\"kw\">return</span> x, p\n\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">decoder_block</span>(input_tensor, skip_features, num_filters):\n    <span class=\"cm\"># 1. Upsample\
    \ using Transpose Convolution</span>\n    x = layers.<span class=\"fn\">Conv2DTranspose</span>(\n<span class=\"cm\">#\
    \ num_filters,</span>\n<span class=\"cm\"># (2, 2),</span>\n        strides=<span class=\"num\">2</span>,\n        padding=<span\
    \ class=\"str\">'same'</span>\n<span class=\"cm\"># )(input_tensor)</span>\n    \n    <span class=\"cm\"># 2. Concatenate\
    \ high-resolution encoder features (Skip Connection)</span>\n    x = layers.<span class=\"fn\">concatenate</span>([x,\
    \ skip_features])\n    \n    <span class=\"cm\"># 3. Dual Conv2D refinement</span>\n    x = <span class=\"fn\">conv_block</span>(x,\
    \ num_filters)\n    <span class=\"kw\">return</span> x\n\n<span class=\"kw\">def</span> <span class=\"fn\">build_unet</span>(input_shape=(<span\
    \ class=\"num\">128</span>, <span class=\"num\">128</span>, <span class=\"num\">3</span>), num_classes=<span class=\"\
    num\">1</span>):\n    inputs = layers.<span class=\"fn\">Input</span>(shape=input_shape)\n    \n    <span class=\"cm\"\
    ># Contracting encoder path</span>\n    s1, p1 = <span class=\"fn\">encoder_block</span>(inputs, <span class=\"num\">64</span>)\n\
    \    s2, p2 = <span class=\"fn\">encoder_block</span>(p1, <span class=\"num\">128</span>)\n    s3, p3 = <span class=\"\
    fn\">encoder_block</span>(p2, <span class=\"num\">256</span>)\n    \n    <span class=\"cm\"># Bottleneck bridge</span>\n\
    \    b = <span class=\"fn\">conv_block</span>(p3, <span class=\"num\">512</span>)\n    \n    <span class=\"cm\"># Expanding\
    \ decoder path (incorporating skip features)</span>\n    d1 = <span class=\"fn\">decoder_block</span>(b, s3, <span class=\"\
    num\">256</span>)\n    d2 = <span class=\"fn\">decoder_block</span>(d1, s2, <span class=\"num\">128</span>)\n    d3 =\
    \ <span class=\"fn\">decoder_block</span>(d2, s1, <span class=\"num\">64</span>)\n    \n    <span class=\"cm\"># Segmented\
    \ pixel classification head</span>\n    <span class=\"kw\">if</span> num_classes == <span class=\"num\">1</span>:\n  \
    \      outputs = layers.<span class=\"fn\">Conv2D</span>(<span class=\"num\">1</span>, (<span class=\"num\">1</span>,\
    \ <span class=\"num\">1</span>), activation=<span class=\"str\">'sigmoid'</span>)(d3)\n<span class=\"cm\"># else:</span>\n\
    \        outputs = layers.<span class=\"fn\">Conv2D</span>(num_classes, (<span class=\"num\">1</span>, <span class=\"\
    num\">1</span>), activation=<span class=\"str\">'softmax'</span>)(d3)\n        \n    <span class=\"kw\">return</span>\
    \ models.<span class=\"fn\">Model</span>(inputs, outputs)\n\nmodel = <span class=\"fn\">build_unet</span>()\nmodel.<span\
    \ class=\"fn\">summary</span>()</code></pre>\n</div>\n"
