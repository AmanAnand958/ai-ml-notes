            </strong>
            U-Net contracting encoder aur expanding decoder blocks ke combination se segmentation maps ko pixel-level scale par recover karta hai.
  analogy: U-Net bilkul ek pull (bridge) ki tarah hai. Encoder path downsample karte-karte spatial details ko mita deta hai
    par gehra concept (semantic features) samajhta hai. Decoder upsample karke resolution wapas lata hai. Lekin edge boundaries
