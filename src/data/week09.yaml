    prompt_html: "<p><strong>\n        Write an executable Python script in NumPy:\n        <br/>\n        1. Implement the\n\
      \        \n         nms\n        \n        and\n        \n         iou\n        \n        calculations completely from\
      \ scratch.\n        <br/>\n        2. Generate 10 random bounding boxes with confidence scores.\n        <br/>\n   \
      \     3. Run NMS at an IoU threshold of 0.45 and display the remaining boxes.\n        <br/>\n        4. Plot the input\
      \ and output boxes on a matplotlib coordinate canvas and save the image to disk.\n       </strong></p>\n\n\n<div class=\"\
      cb\" style=\"margin-top: 1rem;\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">python</span>\n<div class=\"cb-btns\"\
      >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
      >Run</button>\n<button class=\"run-btn\" onclick=\"openInColab(this)\">⚡ Run on Colab</button>\n</div>\n</div>\n<pre><span\
      \ class=\"cm\"># Solution for Task: Bounding Box Intersection over Union (IoU)</span>\n<span class=\"kw\">import</span>\
      \ numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\">compute_iou</span>(box1:\
      \ list, box2: list) -&gt; float:\n    <span class=\"cm\"># box format: [x1, y1, x2, y2]</span>\n    xA = <span class=\"\
      fn\">max</span>(box1[<span class=\"num\">0</span>], box2[<span class=\"num\">0</span>])\n    yA = <span class=\"fn\"\
      >max</span>(box1[<span class=\"num\">1</span>], box2[<span class=\"num\">1</span>])\n    xB = <span class=\"fn\">min</span>(box1[<span\
      \ class=\"num\">2</span>], box2[<span class=\"num\">2</span>])\n    yB = <span class=\"fn\">min</span>(box1[<span class=\"\
      num\">3</span>], box2[<span class=\"num\">3</span>])\n    \n    inter_area = <span class=\"fn\">max</span>(<span class=\"\
      num\">0</span>, xB - xA) * <span class=\"fn\">max</span>(<span class=\"num\">0</span>, yB - yA)\n    box1_area = (box1[<span\
      \ class=\"num\">2</span>] - box1[<span class=\"num\">0</span>]) * (box1[<span class=\"num\">3</span>] - box1[<span class=\"\
      num\">1</span>])\n    box2_area = (box2[<span class=\"num\">2</span>] - box2[<span class=\"num\">0</span>]) * (box2[<span\
      \ class=\"num\">3</span>] - box2[<span class=\"num\">1</span>])\n    \n    union_area = <span class=\"fn\">float</span>(box1_area\
      \ + box2_area - inter_area)\n    <span class=\"kw\">return</span> inter_area / union_area <span class=\"kw\">if</span>\
      \ union_area &gt; <span class=\"num\">0</span> <span class=\"kw\">else</span> <span class=\"num\">0.0</span>\n\nboxA\
      \ = [<span class=\"num\">50</span>, <span class=\"num\">50</span>, <span class=\"num\">150</span>, <span class=\"num\"\
      >150</span>]\nboxB = [<span class=\"num\">100</span>, <span class=\"num\">100</span>, <span class=\"num\">200</span>,\
      \ <span class=\"num\">200</span>]\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Calculated IoU: {compute_iou(boxA,\
      \ boxB):.4f}\"</span>)</pre>\n</div>"
