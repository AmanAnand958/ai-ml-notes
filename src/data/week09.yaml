- id: 60
  day_num: 60
  title: Downsampling & Pooling Layers
  subtitle: Convolutions excel at extracting local features, but they preserve the exact spatial coordinates of those features.
    If an object shifts by a few pixels, its activation coordinates change completely. Today, we masterPooling Layers— the
    mathematical tools for downsampling, feature selection, and introducingtranslation invariance. We will dissect Max, Average,
    Fractional, and L2 Pooling, derive their backward gradients, and build pooling layers from scratch in NumPy.
  time_estimate: 4 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Demonstrate how Max Pooling and Average Pooling introduce translation invariance and spatial downsampling.
  - Derive the backpropagation gradient updates for both Max Pooling and Average Pooling.
  - 'Apply: Distinguish between advanced pooling methods, including Fractional Max Pooling and L2 Pooling.'
  - Implement a fully functional 2D Pooling layer with strides and padding using raw NumPy.
  checklist:
  - id: chk_60_1
