    <div class="task-header" style="background:rgba(229,107,140,.05);border-left:3px solid var(--pink)">
    <span class="task-badge tb-hard">
            Scenario Q3
           </span>
    <span class="task-title">
            When Global Average Pooling (GAP) Fails
           </span>
    </div>
    <div class="task-body" style="display:block">
    <p>
    <strong>
             Question:
            </strong>
            While Global Average Pooling is excellent for generic classification regularizations, under what specific Computer Vision tasks does it perform worse than a flattened dense head? Explain the physical reason.
           </p>
    <p>
    <strong>
             Answer:
            </strong>
            GAP collapses the entire spatial dimension of a channel ($H \\times W$) into a single average value ($1 \\times 1$). This <strong>erases all spatial coordinate information</strong>.
            <br/>
            Therefore, GAP performs poorly in:
            <br/>
            1. <strong>Object Detection / Localization:</strong> Where you must regress exact coordinate boundaries (bounding boxes).
            <br/>
            2. <strong>Image Segmentation / Keypoint Detection:</strong> Where pixel-level coordinates are the target.
            <br/>
            3. <strong>Fine-Grained Classification with Positional Cues:</strong> Where the relationship between specific quadrants matters (e.g. left vs right eye structure).
            <br/>
            For these spatial-dependent applications, maintaining spatial grids via flattening, pooling, or transposed convolutions is mandatory.
           </p>
