    <div class="task-header" style="background:rgba(79,209,165,.05);border-left:3px solid var(--green)">
    <span class="task-badge tb-hard">
            Scenario Q4
           </span>
    <span class="task-title">
            Receptive Field Bottleneck &amp; Vision Transformers (ViTs)
           </span>
    </div>
    <div class="task-body" style="display:block">
    <p>
    <strong>
             Question:
            </strong>
            What is the "receptive field bottleneck" in deep CNNs? How do modern Vision Transformers (ViTs) resolve this bottleneck, and what are the trade-offs involved?
           </p>
    <p>
    <strong>
             Answer:
            </strong>
    <br/>
            1. <strong>The Bottleneck:</strong> In CNNs, the receptive field grows linearly with depth. In early layers, neurons only see tiny, highly localized patches. If the network needs to capture global context (e.g. relation between objects on opposite sides of an image), it must go extremely deep, losing spatial resolution and suffering from gradient dilution.
            <br/>
            2. <strong>ViTs Resolution:</strong> Vision Transformers divide the image into patches (e.g. 16x16) and treat them as sequence tokens. By applying <strong>Self-Attention</strong> across all tokens, every pixel patch can communicate with *every other pixel patch* immediately in the very first layer. Receptive field size is effectively infinite from layer 1!
            <br/>
            3. <strong>Trade-offs:</strong> ViTs lack the "inductive bias" of CNNs (translation invariance and local connectivity). Therefore, ViTs require massive datasets (e.g. JFT-300M) or heavy data augmentation to converge, and have quadratic computational complexity with respect to image resolution.
           </p>
