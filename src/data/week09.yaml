    - The multi-part YOLO Loss Function balances coordinate regression, object confidence, and class probabilities in a single
      scalar objective.
    - Square roots are applied to width/height coordinates to maximize gradient sensitivity for smaller bounding boxes.
    - Non-Maximum Suppression (NMS) cleans up overlapping boxes by retaining the peak confidence scores and pruning neighbors
      with high IoU.
