  analogy: ResNet ka skip connection bilkul azaad highway ki tarah hai. Agar main city ki road (convolution layer) par bheed
    (gradient vanishing) hai, toh gaadiyan direct bypass bypass-way (shortcut) se exit nikal leti hain bina kisi delay ke!
