  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h2 class=\"sh2\">\n       \U0001F52C Capstone Architecture\n\
    \      </h2>\n<p>\n       Our production pipeline consists of three distinct modules:\n      </p>\n<ul class=\"prose-list\"\
    >\n<li>\n<strong>\n         Data ingestion module:\n        </strong>\n        Loads images, applies preprocessing (resizing\
