    bullets:
    - Pooling downsamples spatial grids, saving computations and memory while expanding the receptive fields of subsequent
      layers.
    - Max Pooling selects maximum features (acting like a logical OR gate), whereas Average Pooling acts as a spatial smoothing
      filter.
