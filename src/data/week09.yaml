  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">\n       1. Sequential vs. Functional\
    \ APIs in Keras\n      </h3>\n<p>\n       For simple linear stacks of layers, the\n       \n        Sequential\n     \
    \  \n       API is clean and readable.\n    However, for real-world production networks (like ResNet, Inception, or multi-input\
    \ models),\n    layers are not arranged in a simple line.\n    They branch, merge, skip, and share weights.\n       <br/>\n\
    \       The\n       <strong>\n        Functional API\n       </strong>\n       treats layers as mathematical functions\n\
    \    that take tensors as inputs and return tensors as outputs.\n    This provides absolute flexibility for complex architectures:\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — functional_example.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n \
    \        </button>\n</div>\n</div>\n<pre><code class=\"language-python\">inputs = layers.<span class=\"fn\">Input</span>(shape=(<span\
    \ class=\"num\">64</span>, <span class=\"num\">64</span>, <span class=\"num\">3</span>))\nx = layers.<span class=\"fn\"\
    >Conv2D</span>(<span class=\"num\">32</span>, (<span class=\"num\">3</span>, <span class=\"num\">3</span>), activation=<span\
    \ class=\"str\">'relu'</span>)(inputs)\nx = layers.<span class=\"fn\">MaxPooling2D</span>((<span class=\"num\">2</span>,\
    \ <span class=\"num\">2</span>))(x)\noutputs = layers.<span class=\"fn\">Dense</span>(<span class=\"num\">10</span>, activation=<span\
    \ class=\"str\">'softmax'</span>)(layers.<span class=\"fn\">Flatten</span>()(x))\nmodel = models.<span class=\"fn\">Model</span>(inputs=inputs,\
    \ outputs=outputs)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       2. Global Average Pooling (GAP) vs. Flattening\n \
    \     </h3>\n<p>\n       When transitioning from 2D spatial feature maps to 1D vectors for classification,\n    we have\
    \ two primary architectural choices:\n      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         Flattening:\n  \
    \      </strong>\n        Unrolls all pixels of all channels into a massive 1D vector.\n        <br/>\n<em>\n        \
    \ Drawback:\n        </em>\n        If the final conv layer outputs shape $(7, 7, 512)$,\n      flattening yields $7 \\\
    times 7 \\times 512 = 25,088$ units.\n      Connecting this to a dense layer of $1,024$ units creates over <strong>25\
    \ million parameters</strong>\n      in a single layer, leading to massive overfitting and heavy memory consumption!\n\
    \       </li>\n<li>\n<strong>\n         Global Average Pooling (GAP):\n        </strong>\n        Computes the spatial\
    \ average of each feature map channel individually:\n       </li>\n</ul>\n<div class=\"math-block\">\n<span class=\"formula\"\
    >\n        $$\\text{GAP}(F_c) = \\frac{1}{H \\times W} \\sum_{i=1}^H \\sum_{j=1}^W F_c(i, j)$$\n       </span>\n<span\
    \ class=\"desc\">\n        Where F_c is the 2D feature map for channel c, and H, W are its spatial dimensions.\n     \
    \  </span>\n</div>\n<p>\n       For a tensor of shape $(7, 7, 512)$, GAP collapses the spatial dimensions, yielding a\
    \ vector of shape $(512,)$.\n    The parameter count to the next layer drops by <strong>98%</strong>,\n    acting as a\
    \ powerful regularizer and eliminating spatial position memorization!\n      </p>\n<h3 class=\"sh3\">\n       3. Production\
    \ CNN Implementation &amp; Latency Profiler\n      </h3>\n<p>\n       Here is an end-to-end, runnable script that builds\
    \ a custom classification network,\n    compiles it, and profiles its execution speed (latency) layer-by-layer.\n    \
    \  </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — cnn_and_profiler.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n \
    \        </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> tensorflow <span\
    \ class=\"kw\">as</span> tf\n<span class=\"kw\">from</span> tensorflow.keras <span class=\"kw\">import</span> layers,\
    \ models\n<span class=\"kw\">import</span> time\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    \n<span class=\"cm\"># 1. Construct modular custom CNN</span>\n<span class=\"kw\">def</span> <span class=\"fn\">build_custom_cnn</span>(input_shape=(<span\
    \ class=\"num\">32</span>, <span class=\"num\">32</span>, <span class=\"num\">3</span>), num_classes=<span class=\"num\"\
    >10</span>):\n    inputs = layers.<span class=\"fn\">Input</span>(shape=input_shape)\n    \n    <span class=\"cm\"># First\
    \ Conv Block</span>\n    x = layers.<span class=\"fn\">Conv2D</span>(\n<span class=\"cm\"># 32,</span>\n<span class=\"\
    cm\"># (3, 3),</span>\n        padding=<span class=\"str\">'same'</span>\n<span class=\"cm\"># )(inputs)</span>\n    x\
    \ = layers.<span class=\"fn\">BatchNormalization</span>()(x)\n    x = layers.<span class=\"fn\">Activation</span>(<span\
    \ class=\"str\">'relu'</span>)(x)\n    x = layers.<span class=\"fn\">MaxPooling2D</span>((<span class=\"num\">2</span>,\
    \ <span class=\"num\">2</span>))(x)\n    \n    <span class=\"cm\"># Second Conv Block</span>\n    x = layers.<span class=\"\
    fn\">Conv2D</span>(\n<span class=\"cm\"># 64,</span>\n<span class=\"cm\"># (3, 3),</span>\n        padding=<span class=\"\
    str\">'same'</span>\n<span class=\"cm\"># )(x)</span>\n    x = layers.<span class=\"fn\">BatchNormalization</span>()(x)\n\
    \    x = layers.<span class=\"fn\">Activation</span>(<span class=\"str\">'relu'</span>)(x)\n    x = layers.<span class=\"\
    fn\">MaxPooling2D</span>((<span class=\"num\">2</span>, <span class=\"num\">2</span>))(x)\n    \n    <span class=\"cm\"\
    ># Global Average Pooling Head</span>\n    x = layers.<span class=\"fn\">GlobalAveragePooling2D</span>()(x)\n    x = layers.<span\
    \ class=\"fn\">Dropout</span>(<span class=\"num\">0.3</span>)(x)\n    outputs = layers.<span class=\"fn\">Dense</span>(num_classes,\
    \ activation=<span class=\"str\">'softmax'</span>)(x)\n    \n    <span class=\"kw\">return</span> models.<span class=\"\
    fn\">Model</span>(inputs, outputs)\n\nmodel = <span class=\"fn\">build_custom_cnn</span>()\nmodel.<span class=\"fn\">compile</span>(\n\
    \    optimizer=<span class=\"str\">'adam'</span>,\n    loss=<span class=\"str\">'sparse_categorical_crossentropy'</span>,\n\
    \    metrics=[<span class=\"str\">'accuracy'</span>]\n<span class=\"cm\"># )</span>\n\n<span class=\"cm\"># 2. Performance\
    \ &amp; Latency Diagnostic Profiler</span>\n<span class=\"kw\">def</span> <span class=\"fn\">profile_model_latency</span>(model,\
    \ num_runs=<span class=\"num\">100</span>):\n    <span class=\"fn\">print</span>(<span class=\"str\">\"\\n=== Model Architecture\
    \ Diagnostics ===\"</span>)\n    model.<span class=\"fn\">summary</span>()\n    \n    <span class=\"cm\"># Generate fake\
    \ input batch</span>\n    dummy_input = np.random.<span class=\"fn\">rand</span>(<span class=\"num\">1</span>, *model.input_shape[<span\
    \ class=\"num\">1</span>:]).<span class=\"fn\">astype</span>(np.float32)\n    \n    <span class=\"cm\"># Warm up GPU/CPU\
    \ cache</span>\n    <span class=\"kw\">for</span> _ <span class=\"kw\">in</span> <span class=\"fn\">range</span>(<span\
    \ class=\"num\">10</span>):\n        _ = model.<span class=\"fn\">predict</span>(dummy_input, verbose=<span class=\"num\"\
    >0</span>)\n        \n    <span class=\"cm\"># Start exact timing</span>\n    start_time = time.<span class=\"fn\">perf_counter</span>()\n\
    \    <span class=\"kw\">for</span> _ <span class=\"kw\">in</span> <span class=\"fn\">range</span>(num_runs):\n       \
    \ _ = model.<span class=\"fn\">predict</span>(dummy_input, verbose=<span class=\"num\">0</span>)\n    end_time = time.<span\
    \ class=\"fn\">perf_counter</span>()\n    \n    avg_latency = ((end_time - start_time) / num_runs) * <span class=\"num\"\
    >1000</span>\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"\\nAverage Forward Pass Latency: {avg_latency:.3f}\
    \ ms\"</span>)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Estimated throughput: {1000 / avg_latency:.1f}\
    \ frames/sec\"</span>)\n\n<span class=\"fn\">profile_model_latency</span>(model)</code></pre>\n</div>\n<div class=\"diagram-container\"\
    \ style=\"background:var(--bg3); padding:1.2rem; border-radius:8px; margin:1.5rem auto; border:1px solid var(--border);\
