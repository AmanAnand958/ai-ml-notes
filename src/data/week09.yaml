    >\n       End-to-end Capstone System Architecture Flow.\n      </div>\n<h3 class=\"sh3\">\n       1. Production Training\
    \ Script\n      </h3>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — pipeline_train.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n \
    \        </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> tensorflow <span\
    \ class=\"kw\">as</span> tf\n<span class=\"kw\">from</span> tensorflow.keras <span class=\"kw\">import</span> layers,\
    \ models, callbacks\n\n<span class=\"cm\"># 1. Dataset generation (Using CIFAR-10 as target)</span>\n(x_train, y_train),\
    \ (x_test, y_test) = tf.keras.datasets.cifar10.<span class=\"fn\">load_data</span>()\n\ntrain_ds = tf.data.Dataset.<span\
    \ class=\"fn\">from_tensor_slices</span>((x_train, y_train))\nval_ds = tf.data.Dataset.<span class=\"fn\">from_tensor_slices</span>((x_test,\
