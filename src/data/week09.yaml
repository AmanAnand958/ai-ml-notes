  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">\n       1. The Parameter Explosion\
    \ Problem\n      </h3>\n<p>\n       Consider a modest $256 \\times 256$ RGB color image. This represents $256 \\times\
    \ 256 \\times 3 = 196,608$ input pixels. If we connect this directly to a fully-connected (dense) layer with just $1,024$\
    \ hidden neurons, we instantly create:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$196,608\
    \ \\times 1,024 = 201,326,592 \\text{ weight variables!}$$\n       </span>\n</div>\n<p>\n       Over 200 million weights\
    \ in a single layer! This triggers massive overfitting, high memory bottlenecks, and demands astronomical amounts of training\
    \ data.\n       <br/>\n       Furthermore, flattening the image into a 1D vector completely discards the spatial coordinates—the\
    \ network doesn't know if pixel A was above, below, or next to pixel B. CNNs solve this using two key principles: <strong>Local\
    \ Connectivity</strong> (neurons only look at a small window) and <strong>Weight Sharing</strong> (the same filter slides\
    \ across the entire image).\n      </p>\n<h3 class=\"sh3\">\n       2. Spatial Dimension Output Mathematics\n      </h3>\n\
    <p>\n       When convolving an input image of shape $I \\times I$ with a kernel of size $K \\times K$, using padding $P$\
    \ and stride $S$, the spatial dimension of the output $O \\times O$ is determined by the following formal mathematical\
    \ formula:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$O = \\left\\lfloor \\frac{I -\
    \ K + 2P}{S} \\right\\rfloor + 1$$\n       </span>\n<span class=\"desc\">\n        $Where \\lfloor \\cdot \\rfloor represents\
    \ the floor function (ignoring fractional remaining pixels).$\n       </span>\n</div>\n<p>\n       Let's trace the physical\
    \ impact of padding types:\n      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         Valid Padding (P = 0):\n \
    \       </strong>\n        No padding is applied. The filter only operates inside the image boundaries. The output size\
    \ is strictly smaller: $O = I - K + 1$ (for $S=1$).\n       </li>\n<li>\n<strong>\n         Same Padding:\n        </strong>\n\
    \        Padding is dynamically added so that the output spatial size matches the input spatial size ($O = I$ for $S=1$).\
    \ The required padding size $P$ is calculated as:\n       </li>\n</ul>\n<div class=\"math-block\">\n<span class=\"formula\"\
    >\n        $$P = \\frac{K - 1}{2}$$\n       </span>\n<span class=\"desc\">\n        Assuming an odd kernel size. For a\
    \ 3x3 kernel, P = 1; for a 5x5 kernel, P = 2.\n       </span>\n</div>\n<h3 class=\"sh3\">\n       3. Convolution Shape\
    \ Tracing Reference\n      </h3>\n<figure class=\"svg-diagram\">\n<svg aria-label=\"CNN architecture pipeline from input\
    \ image through convolution, pooling, to classification\" height=\"200\" role=\"img\" style=\"max-width: 100%; height:\
    \ auto;\" viewbox=\"0 0 700 200\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<lineargradient id=\"cn-bg\"\
    \ x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n<stop offset=\"0%\" stop-color=\"#1a1e2e\">\n</stop>\n<stop offset=\"100%\" stop-color=\"\
    var(--bg)\">\n</stop>\n</lineargradient>\n</defs>\n<rect fill=\"url(#cn-bg)\" height=\"200\" rx=\"12\" width=\"700\">\n\
    </rect>\n<text fill=\"#e6edf3\" font-family=\"DM Sans,sans-serif\" font-size=\"14\" font-weight=\"700\" text-anchor=\"\
    middle\" x=\"350\" y=\"22\">\n         Convolutional Neural Network Pipeline\n        </text>\n<!-- Input image -->\n\
    <rect fill=\"#1c2333\" height=\"60\" rx=\"4\" stroke=\"var(--blue, #82aaff)\" stroke-width=\"1.5\" width=\"60\" x=\"20\"\
    \ y=\"55\">\n</rect>\n<text fill=\"var(--blue, #82aaff)\" font-family=\"DM Sans,sans-serif\" font-size=\"8\" text-anchor=\"\
    middle\" x=\"50\" y=\"82\">\n         Input\n        </text>\n<text fill=\"var(--text2)\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"7\" text-anchor=\"middle\" x=\"50\" y=\"93\">\n         224×224×3\n        </text>\n<!-- Arrow -->\n<line\
    \ marker-end=\"url(#arrowhead)\" stroke=\"#6b7590\" stroke-width=\"1.5\" x1=\"82\" x2=\"105\" y1=\"85\" y2=\"85\">\n</line>\n\
    <!-- Conv1 -->\n<rect fill=\"#1c2333\" height=\"80\" rx=\"4\" stroke=\"#f0c846\" stroke-width=\"1.5\" width=\"55\" x=\"\
    108\" y=\"45\">\n</rect>\n<text fill=\"#f0c846\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" font-weight=\"600\"\
    \ text-anchor=\"middle\" x=\"135\" y=\"75\">\n         Conv2D\n        </text>\n<text fill=\"var(--text2)\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"6\" text-anchor=\"middle\" x=\"135\" y=\"87\">\n         3×3, 64\n        </text>\n<text\
    \ fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"6\" text-anchor=\"middle\" x=\"135\" y=\"97\">\n   \
    \      + ReLU\n        </text>\n<!-- Arrow -->\n<line stroke=\"#6b7590\" stroke-width=\"1.5\" x1=\"165\" x2=\"185\" y1=\"\
    85\" y2=\"85\">\n</line>\n<!-- Pool1 -->\n<rect fill=\"#1c2333\" height=\"60\" rx=\"4\" stroke=\"#d2a8ff\" stroke-width=\"\
    1.5\" width=\"45\" x=\"188\" y=\"55\">\n</rect>\n<text fill=\"#d2a8ff\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    7\" font-weight=\"600\" text-anchor=\"middle\" x=\"210\" y=\"80\">\n         MaxPool\n        </text>\n<text fill=\"var(--text2)\"\
    \ font-family=\"DM Sans,sans-serif\" font-size=\"6\" text-anchor=\"middle\" x=\"210\" y=\"92\">\n         2×2\n      \
    \  </text>\n<!-- Arrow -->\n<line stroke=\"#6b7590\" stroke-width=\"1.5\" x1=\"235\" x2=\"255\" y1=\"85\" y2=\"85\">\n\
    </line>\n<!-- Conv2 -->\n<rect fill=\"#1c2333\" height=\"70\" rx=\"4\" stroke=\"#f0c846\" stroke-width=\"1.5\" width=\"\
    55\" x=\"258\" y=\"50\">\n</rect>\n<text fill=\"#f0c846\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" font-weight=\"\
    600\" text-anchor=\"middle\" x=\"285\" y=\"77\">\n         Conv2D\n        </text>\n<text fill=\"var(--text2)\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"6\" text-anchor=\"middle\" x=\"285\" y=\"89\">\n         3×3, 128\n        </text>\n\
    <text fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"6\" text-anchor=\"middle\" x=\"285\" y=\"99\">\n\
    \         + ReLU\n        </text>\n<!-- Arrow -->\n<line stroke=\"#6b7590\" stroke-width=\"1.5\" x1=\"315\" x2=\"335\"\
    \ y1=\"85\" y2=\"85\">\n</line>\n<!-- Pool2 -->\n<rect fill=\"#1c2333\" height=\"54\" rx=\"4\" stroke=\"#d2a8ff\" stroke-width=\"\
    1.5\" width=\"45\" x=\"338\" y=\"58\">\n</rect>\n<text fill=\"#d2a8ff\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    7\" font-weight=\"600\" text-anchor=\"middle\" x=\"360\" y=\"80\">\n         MaxPool\n        </text>\n<text fill=\"var(--text2)\"\
    \ font-family=\"DM Sans,sans-serif\" font-size=\"6\" text-anchor=\"middle\" x=\"360\" y=\"92\">\n         2×2\n      \
    \  </text>\n<!-- Arrow -->\n<line stroke=\"#6b7590\" stroke-width=\"1.5\" x1=\"385\" x2=\"405\" y1=\"85\" y2=\"85\">\n\
    </line>\n<!-- Conv3 -->\n<rect fill=\"#1c2333\" height=\"60\" rx=\"4\" stroke=\"#f0c846\" stroke-width=\"1.5\" width=\"\
    55\" x=\"408\" y=\"55\">\n</rect>\n<text fill=\"#f0c846\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" font-weight=\"\
    600\" text-anchor=\"middle\" x=\"435\" y=\"78\">\n         Conv2D\n        </text>\n<text fill=\"var(--text2)\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"6\" text-anchor=\"middle\" x=\"435\" y=\"90\">\n         3×3, 256\n        </text>\n\
    <text fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"6\" text-anchor=\"middle\" x=\"435\" y=\"100\">\n\
    \         + ReLU\n        </text>\n<!-- Arrow -->\n<line stroke=\"#6b7590\" stroke-width=\"1.5\" x1=\"465\" x2=\"485\"\
    \ y1=\"85\" y2=\"85\">\n</line>\n<!-- Flatten -->\n<rect fill=\"#1c2333\" height=\"50\" rx=\"4\" stroke=\"#f97583\" stroke-width=\"\
    1.5\" width=\"40\" x=\"488\" y=\"60\">\n</rect>\n<text fill=\"#f97583\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    6\" font-weight=\"600\" text-anchor=\"middle\" x=\"508\" y=\"82\">\n         Flatten\n        </text>\n<text fill=\"var(--text2)\"\
    \ font-family=\"DM Sans,sans-serif\" font-size=\"5\" text-anchor=\"middle\" x=\"508\" y=\"92\">\n         → 1D\n     \
    \   </text>\n<!-- Arrow -->\n<line stroke=\"#6b7590\" stroke-width=\"1.5\" x1=\"530\" x2=\"548\" y1=\"85\" y2=\"85\">\n\
    </line>\n<!-- FC -->\n<rect fill=\"#1c2333\" height=\"50\" rx=\"4\" stroke=\"#7ee787\" stroke-width=\"1.5\" width=\"50\"\
    \ x=\"550\" y=\"60\">\n</rect>\n<text fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" font-weight=\"\
    600\" text-anchor=\"middle\" x=\"575\" y=\"80\">\n         FC 512\n        </text>\n<text fill=\"var(--text2)\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"6\" text-anchor=\"middle\" x=\"575\" y=\"92\">\n         + Dropout\n        </text>\n\
    <!-- Arrow -->\n<line stroke=\"#6b7590\" stroke-width=\"1.5\" x1=\"602\" x2=\"618\" y1=\"85\" y2=\"85\">\n</line>\n<!--\
    \ Output -->\n<rect fill=\"#0d4429\" height=\"40\" rx=\"4\" stroke=\"#7ee787\" stroke-width=\"2\" width=\"60\" x=\"620\"\
    \ y=\"65\">\n</rect>\n<text fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" font-weight=\"600\" text-anchor=\"\
    middle\" x=\"650\" y=\"82\">\n         Softmax\n        </text>\n<text fill=\"var(--text2)\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"6\" text-anchor=\"middle\" x=\"650\" y=\"93\">\n         10 classes\n        </text>\n<!-- Size annotations\
    \ -->\n<text fill=\"#6b7590\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" text-anchor=\"middle\" x=\"50\" y=\"\
    135\">\n         224²\n        </text>\n<text fill=\"#6b7590\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" text-anchor=\"\
    middle\" x=\"210\" y=\"135\">\n         112²\n        </text>\n<text fill=\"#6b7590\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"7\" text-anchor=\"middle\" x=\"360\" y=\"130\">\n         56²\n        </text>\n<text fill=\"#6b7590\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"7\" text-anchor=\"middle\" x=\"435\" y=\"133\">\n         28²\n        </text>\n<!--\
    \ Legend bar -->\n<text fill=\"#f0c846\" font-family=\"DM Sans,sans-serif\" font-size=\"8\" x=\"120\" y=\"165\">\n   \
    \      ■ Conv+ReLU: extract features\n        </text>\n<text fill=\"#d2a8ff\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    8\" x=\"320\" y=\"165\">\n         ■ MaxPool: downsample spatial dims\n        </text>\n<text fill=\"#7ee787\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"8\" x=\"520\" y=\"165\">\n         ■ FC: classify from features\n        </text>\n<text\
    \ fill=\"#f0c846\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" text-anchor=\"middle\" x=\"350\" y=\"185\">\n  \
    \       Pattern: [Conv → ReLU → Pool] × N → Flatten → FC → Softmax\n        </text>\n</svg>\n<figcaption>\n        A CNN\
    \ extracts spatial features through alternating convolution and pooling layers, then flattens and classifies with fully-connected\
    \ layers.\n       </figcaption>\n</figure>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width:\
    \ 100%;\"><table class=\"concept-table\">\n<thead>\n<tr>\n<th>\n          Input Dimension\n         </th>\n<th>\n    \
    \      Kernel Size\n         </th>\n<th>\n          Padding Size\n         </th>\n<th>\n          Stride Size\n      \
    \   </th>\n<th>\n          Output Dimension Calculation\n         </th>\n<th>\n          Final Output Size\n         </th>\n\
    </tr>\n</thead>\n<tbody>\n<tr>\n<td>\n          $32 \\times 32$\n         </td>\n<td>\n          $3 \\times 3$\n     \
    \    </td>\n<td>\n          $0$ (Valid)\n         </td>\n<td>\n          $1$\n         </td>\n<td>\n          $\\frac{32\
    \ - 3 + 0}{1} + 1 = 30$\n         </td>\n<td>\n<strong>\n           $30 \\times 30$\n          </strong>\n</td>\n</tr>\n\
    <tr>\n<td>\n          $32 \\times 32$\n         </td>\n<td>\n          $3 \\times 3$\n         </td>\n<td>\n         \
    \ $1$ (Same)\n         </td>\n<td>\n          $1$\n         </td>\n<td>\n          $\\frac{32 - 3 + 2}{1} + 1 = 32$\n\
    \         </td>\n<td>\n<strong>\n           $32 \\times 32$\n          </strong>\n</td>\n</tr>\n<tr>\n<td>\n         \
    \ $224 \\times 224$\n         </td>\n<td>\n          $7 \\times 7$\n         </td>\n<td>\n          $3$ (Same)\n     \
    \    </td>\n<td>\n          $2$\n         </td>\n<td>\n          $\\lfloor \\frac{224 - 7 + 6}{2} \\rfloor + 1 = \\lfloor\
    \ 111.5 \\rfloor + 1 = 112$\n         </td>\n<td>\n<strong>\n           $112 \\times 112$\n          </strong>\n</td>\n\
    </tr>\n<tr>\n<td>\n          $28 \\times 28$\n         </td>\n<td>\n          $5 \\times 5$\n         </td>\n<td>\n  \
    \        $0$ (Valid)\n         </td>\n<td>\n          $2$\n         </td>\n<td>\n          $\\lfloor \\frac{28 - 5 + 0}{2}\
    \ \\rfloor + 1 = \\lfloor 11.5 \\rfloor + 1 = 12$\n         </td>\n<td>\n<strong>\n           $12 \\times 12$\n      \
    \    </strong>\n</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"sh3\">\n       4. Multi-Channel 2D Convolution from\
    \ Scratch\n      </h3>\n<p>\n       Here is an end-to-end implementation of a 2D Convolution layer in NumPy. This function\
    \ supports inputs with multiple channels (e.g. RGB color channels) and multiple filters, stride parameters, and zero padding.\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — conv2d_scratch.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n \
    \        </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> numpy <span class=\"\
    kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\">conv2d_forward</span>(X, W, b, stride=<span class=\"\
    num\">1</span>, padding=<span class=\"num\">0</span>):\n    <span class=\"cm\"># X shape: (H, W, C_in) - Height, Width,\
    \ Input Channels</span>\n    <span class=\"cm\"># W shape: (K, K, C_in, C_out) - Kernel Size, Input Channels, Output Channels</span>\n\
    \    <span class=\"cm\"># b shape: (C_out,) - Bias for each output channel</span>\n    \n    H, W, C_in = X.shape\n  \
    \  K, _, _, C_out = W.shape\n    \n    <span class=\"cm\"># 1. Apply Zero Padding to spatial dimensions</span>\n    <span\
    \ class=\"kw\">if</span> padding &gt; <span class=\"num\">0</span>:\n        X_padded = np.<span class=\"fn\">pad</span>(X,\
    \ ((padding, padding), (padding, padding), (<span class=\"num\">0</span>, <span class=\"num\">0</span>)), mode=<span class=\"\
    str\">'constant'</span>)\n<span class=\"cm\"># else:</span>\n        X_padded = X\n        \n    H_pad, W_pad, _ = X_padded.shape\n\
    \    \n    <span class=\"cm\"># 2. Calculate output spatial dimensions</span>\n    out_H = <span class=\"fn\">int</span>((H_pad\
    \ - K) / stride) + <span class=\"num\">1</span>\n    out_W = <span class=\"fn\">int</span>((W_pad - K) / stride) + <span\
    \ class=\"num\">1</span>\n    \n    out = np.<span class=\"fn\">zeros</span>((out_H, out_W, C_out))\n    \n    <span class=\"\
    cm\"># 3. Slide the convolution window</span>\n    <span class=\"kw\">for</span> cout <span class=\"kw\">in</span> <span\
    \ class=\"fn\">range</span>(C_out):\n        <span class=\"kw\">for</span> i <span class=\"kw\">in</span> <span class=\"\
    fn\">range</span>(out_H):\n            <span class=\"kw\">for</span> j <span class=\"kw\">in</span> <span class=\"fn\"\
    >range</span>(out_W):\n                h_start = i * stride\n                h_end = h_start + K\n                w_start\
    \ = j * stride\n                w_end = w_start + K\n                \n                <span class=\"cm\"># Extract the\
    \ local patch across all input channels</span>\n                patch = X_padded[h_start:h_end, w_start:w_end, :]\n  \
    \              \n                <span class=\"cm\"># Multiply patch by filter weights and sum completely</span>\n   \
    \             out[i, j, cout] = np.<span class=\"fn\">sum</span>(patch * W[:, :, :, cout]) + b[cout]\n               \
    \ \n    <span class=\"kw\">return</span> out\n\n<span class=\"cm\"># Test Convolution with simple test data</span>\ntest_img\
    \ = np.<span class=\"fn\">ones</span>((<span class=\"num\">5</span>, <span class=\"num\">5</span>, <span class=\"num\"\
    >3</span>)) <span class=\"cm\"># 5x5 image with 3 channels (RGB)</span>\ntest_filter = np.<span class=\"fn\">ones</span>((<span\
    \ class=\"num\">3</span>, <span class=\"num\">3</span>, <span class=\"num\">3</span>, <span class=\"num\">2</span>)) <span\
    \ class=\"cm\"># two 3x3 filters</span>\ntest_bias = np.<span class=\"fn\">array</span>([<span class=\"num\">0.5</span>,\
    \ -<span class=\"num\">0.5</span>])\n\nconv_out = <span class=\"fn\">conv2d_forward</span>(test_img, test_filter, test_bias,\
    \ stride=<span class=\"num\">1</span>, padding=<span class=\"num\">1</span>)\n<span class=\"fn\">print</span>(<span class=\"\
    str\">\"Output Shape:\"</span>, conv_out.shape) <span class=\"cm\"># Expected: (5, 5, 2) due to padding=1</span></code></pre>\n\
    </div>\n"
  predict:
    question: What is the spatial output dimension (height) of a 32x32 image after 3x3 valid convolution?
    answer: '30'
    explanation: Output size = (W - K + 2P)/S + 1 = (32 - 3 + 0)/1 + 1 = 30.
    code: |-
      W, K, P, S = 32, 3, 0, 1
      out_dim = (W - K + 2*P) // S + 1
      print(out_dim)
