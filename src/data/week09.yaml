  tasks:
  - title: Implement Max Pooling Backprop in NumPy
    badge: MEDIUM
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p><strong>\n        Write an executable Python script using NumPy:\n        <br/>\n        1. Implement\
      \ the backward pass of a 2D Max Pooling layer (stride=2, pool_size=2).\n        <br/>\n        2. Store the \"max argmax\
      \ mask\" during the forward pass (coordinates of the maximum values).\n        <br/>\n        3. Compute and display\
      \ the input gradients $\\frac{\\partial L}{\\partial X}$ given an incoming output gradient matrix of size $2 \\times\
      \ 2$.\n       </strong></p>\n\n\n<div class=\"cb\" style=\"margin-top: 1rem;\">\n<div class=\"cb-head\">\n<span class=\"\
      cb-lang\">python</span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button>\n\
      <button class=\"run-btn\" onclick=\"runCode(this)\">Run</button>\n<button class=\"run-btn\" onclick=\"openInColab(this)\"\
      >⚡ Run on Colab</button>\n</div>\n</div>\n<pre><span class=\"cm\"># Solution for Task: Max Pooling Forward and Mask\
      \ Generator</span>\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span>\
      \ <span class=\"fn\">max_pool2d_forward</span>(image: np.ndarray, pool_size: int = <span class=\"num\">2</span>, stride:\
      \ int = <span class=\"num\">2</span>):\n    H, W = image.shape\n    out_H = (H - pool_size) // stride + <span class=\"\
      num\">1</span>\n    out_W = (W - pool_size) // stride + <span class=\"num\">1</span>\n    \n    output = np.<span class=\"\
      fn\">zeros</span>((out_H, out_W))\n    <span class=\"kw\">for</span> i <span class=\"kw\">in</span> <span class=\"fn\"\
      >range</span>(out_H):\n        <span class=\"kw\">for</span> j <span class=\"kw\">in</span> <span class=\"fn\">range</span>(out_W):\n\
      \            patch = image[i*stride : i*stride + pool_size, j*stride : j*stride + pool_size]\n            output[i,\
      \ j] = np.<span class=\"fn\">max</span>(patch)\n            \n    <span class=\"kw\">return</span> output\n\nimg = np.<span\
      \ class=\"fn\">array</span>([[<span class=\"num\">1</span>, <span class=\"num\">3</span>, <span class=\"num\">2</span>,\
      \ <span class=\"num\">4</span>], [<span class=\"num\">5</span>, <span class=\"num\">6</span>, <span class=\"num\">7</span>,\
      \ <span class=\"num\">8</span>], [<span class=\"num\">9</span>, <span class=\"num\">0</span>, <span class=\"num\">1</span>,\
      \ <span class=\"num\">2</span>], [<span class=\"num\">3</span>, <span class=\"num\">4</span>, <span class=\"num\">5</span>,\
      \ <span class=\"num\">6</span>]])\n<span class=\"fn\">print</span>(<span class=\"str\">\"Pooled 2x2 Feature Map:\\n\"\
      </span>, <span class=\"fn\">max_pool2d_forward</span>(img, pool_size=<span class=\"num\">2</span>, stride=<span class=\"\
      num\">2</span>))</pre>\n</div>"
    done_when: Your script runs end-to-end, performs both forward and backward pass calculations correctly, and outputs a
      spatial gradient matrix showing non-zero values strictly at the coordinate indices that held max values during the forward
