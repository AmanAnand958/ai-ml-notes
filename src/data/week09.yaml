    \ validation_data=val_ds, epochs=<span class=\"num\">10</span>, callbacks=cb_list)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Model successfully trained and saved!\"</span>)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       2.\
    \ Production Inference Script\n      </h3>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n  \
