  content_html: |-
    <h2 class="sh2">🛠 Tasks</h2><div id="tasks-section-toolkit"><div class="task-block">
    <div class="task-header" style="background:rgba(79,209,165,.05);border-left:3px solid var(--green)">
    <span class="task-badge tb-hard">
            Scenario Q1
           </span>
    <span class="task-title">
            He Normal vs. Glorot Initialization Mechanics
           </span>
    </div>
    <div class="task-body" style="display:block">
    <p>
    <strong>
             Question:
            </strong>
            Why do standard Deep Learning networks use He (Kaiming) initialization for ReLU layers and Glorot (Xavier) initialization for Tanh layers? What happens mathematically if you swap them?
           </p>
    <p>
    <strong>
             Answer:
            </strong>
    <br/>
            1. <strong>Glorot (Xavier) Initialization:</strong> Designed under the assumption of linear activation functions. It scales weights to maintain variance across layers: $Var(W) = \\frac{2}{n_{in} + n_{out}}$. For a Tanh activation (which is symmetric and active around zero), this prevents activations from saturating or collapsing.
            <br/>
            2. <strong>He (Kaiming) Initialization:</strong> ReLU activations clip all negative values to zero, effectively silencing half of the neurons at any step. This halves the variance of outputs. To compensate and keep variance constant, He initialization doubles the variance of the initial weights: $Var(W) = \\frac{2}{n_{in}}$.
            <br/>
            3. <strong>Swapping:</strong> If you use Glorot on ReLU layers, the variance of activations will shrink by half at each layer, leading to vanishing activations in deep networks. If you use He on Tanh layers, variance grows, causing gradients to saturate (explode) at extreme values.
           </p>
