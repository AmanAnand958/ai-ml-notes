    \ninputs = layers.<span class=\"fn\">Input</span>(shape=(<span class=\"num\">96</span>, <span class=\"num\">96</span>,\
    \ <span class=\"num\">3</span>))\nx = <span class=\"fn\">base_model</span>(inputs, training=<span class=\"kw\">False</span>)\n\
