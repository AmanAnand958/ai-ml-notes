      \   <span class=\"fn\">print</span>(<span class=\"str\">f\"Task verification output: {result}\"</span>)\n    <span class=\"\
      kw\">return</span> result\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n   \
      \ <span class=\"fn\">execute_pipeline</span>()</pre>\n</div>"
    done_when: Your analysis clearly proves that the Flatten version consumes over 15x more parameters in the dense head compared
      to the GAP version, proving the high-efficiency regularizing power of GAP.
    git_cmd: 'git add . && git commit -m "feat(day61): implement profile-memory-vs-computationa"'
    sol_id: sol-w9d61t2
    solution_title: Profile Memory vs. Computational Latency Implementation
    solution_code: |
      # Day 91 Task 2: Profile Memory vs Computational Complexity
      import numpy as np

      def compute_conv_flops(h_in: int, w_in: int, c_in: int, c_out: int, k: int = 3) -> dict:
          """Computes parameters and multiply-accumulate FLOPs for Conv2D layer."""
          params = (k * k * c_in + 1) * c_out
          h_out, w_out = h_in, w_in  # same padding
          flops = h_out * w_out * (k * k * c_in) * c_out * 2  # MACs
          return {"params": params, "flops": flops, "mflops": round(flops / 1e6, 2)}

      layer1 = compute_conv_flops(224, 224, 3, 64)
      layer2 = compute_conv_flops(112, 112, 64, 128)

      print("Layer 1 (224x224x3 -> 64):", layer1)
      print("Layer 2 (112x112x64 -> 128):", layer2)
      assert layer1["params"] < layer2["params"], "Deeper conv layer has more parameters"
      assert layer1["flops"] > 0
      print("✓ CNN memory & FLOPs profiling verified.")
    solution_lang: python
  quizzes:
  - qid: q61_1
    num_str: Question 1
    question: What is the main advantage of the Functional API over the Sequential API in Keras?
    options:
    - Sequential API models train faster on CPUs.
    - The Functional API allows designing non-linear network topologies, including skip connections, branching, and multi-i...
    - It automatically compiles the model without needing loss functions.
    - It deletes low-performing weights automatically.
    answer_idx: 1
    explanation: The Functional API treats layers as functional mapping tensors, making it highly robust for complex topologies
      like residual jumps (skip connections) or shared multi-branch feature extractions.
  - qid: q61_2
    num_str: Question 2
    question: Why does Global Average Pooling (GAP) act as a powerful regularizer?
    options:
    - By taking the average of each channel across spatial dimensions, it completely removes dense connections, shrinking
      p...
    - It converts float values to integers.
    - It forces the learning rate to decay.
    - It only operates on high-frequency noise.
    answer_idx: 0
    explanation: Flattening keeps every single spatial grid pixel, leading to giant weights and localized memorization. GAP
      computes channel-wise global averages, destroying spatial coordinate dependency and forcing the network to look for
      global semantic constructs.
  - qid: q61_3
    num_str: Question 3
    question: "Why is the\n         \n          warm up\n         \n         step necessary when profiling a deep CNN model's\
      \ latency?"
    options:
    - To heat up the computer's CPU fan.
    - To ensure that libraries are fully loaded, GPU memory allocations are finalized, and device kernels are fully compile...
    - To delete cached weights.
    - To force the model to overfit.
    answer_idx: 1
    explanation: The first few predictions take significantly longer because TensorFlow must compile CUDA kernels and allocate
      GPU memory structures. Warming up runs these initialization steps first, so we only record the stable, steady-state
      latency of our network.
  flashcards:
  - front: Batch Normalization in CNNs?
    back: Normalizes activations per mini-batch across $(N, H, W)$ dimensions for each channel, stabilizing internal covariate
      shift and allowing higher learning rates.
  - front: Spatial Dropout?
    back: Drops entire 2D feature maps rather than individual pixels, preventing neighboring pixels from co-adapting.
  - front: Data Augmentation Techniques?
    back: Random horizontal flips, affine rotations, color jitter, CutMix, and Mixup to artificially expand training distribution.
  - front: Vanishing Gradients in Deep CNNs?
    back: Repeated backpropagation through stacked conv layers shrinks gradients to near-zero before reaching initial layers,
      solved by ResNet skip connections.
