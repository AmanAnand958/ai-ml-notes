    cm\"># Resize CIFAR images to 96x96 (MobileNet minimum required size)</span>\n    image = tf.image.<span class=\"fn\"\
    >resize</span>(image, (<span class=\"num\">96</span>, <span class=\"num\">96</span>))\n    image = tf.keras.applications.mobilenet_v2.<span\
    \ class=\"fn\">preprocess_input</span>(image)\n    <span class=\"kw\">return</span> image, label\n\nAUTOTUNE = tf.data.AUTOTUNE\n\
    train_ds = train_ds.<span class=\"fn\">map</span>(process_data, num_parallel_calls=AUTOTUNE).<span class=\"fn\">cache</span>().<span\
    \ class=\"fn\">shuffle</span>(<span class=\"num\">1000</span>).<span class=\"fn\">batch</span>(<span class=\"num\">64</span>).<span\
    \ class=\"fn\">prefetch</span>(AUTOTUNE)\nval_ds = val_ds.<span class=\"fn\">map</span>(process_data, num_parallel_calls=AUTOTUNE).<span\
    \ class=\"fn\">cache</span>().<span class=\"fn\">batch</span>(<span class=\"num\">64</span>).<span class=\"fn\">prefetch</span>(AUTOTUNE)\n\
    \n<span class=\"cm\"># 2. Build model architecture</span>\nbase_model = tf.keras.applications.<span class=\"fn\">MobileNetV2</span>(input_shape=(<span\
    \ class=\"num\">96</span>, <span class=\"num\">96</span>, <span class=\"num\">3</span>), include_top=<span class=\"kw\"\
