      <strong>
               Ek line mein:
              </strong>
              YOLO object detection network image ko grid cells mein divide karke ek single forward pass mein multiple boxes aur labels predict karta hai.
    bullets:
    - Two-Stage detectors propose region candidates first and then classify; One-Stage detectors predict all coordinates instantly
