  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<div class=\"diagram-container\" style=\"background:var(--bg3);\
    \ padding:1rem; border-radius:8px; margin:1rem 0; border:1px solid var(--border);\">\n<p><strong>ResNet Residual Block\
    \ Identity Skip Connection:</strong></p>\n<div class=\"mermaid\">\ngraph TD\n    X[\"Input x\"] --&gt; Weight1[\"Weight\
    \ Layer (Conv 3x3 + BN)\"]\n    X --&gt; Identity[\"Identity Shortcut: Identity(x)\"]\n    Weight1 --&gt; ReLU1[\"ReLU\
    \ Activation\"]\n    ReLU1 --&gt; Weight2[\"Weight Layer (Conv 3x3 + BN)\"]\n    Weight2 --&gt; Add[\"Element-wise Addition\
    \ (+)\"]\n    Identity --&gt; Add\n    Add --&gt; Out[\"Output: H(x) = F(x) + x -&gt; ReLU(H(x))\"]\n</div>\n</div>\n\
    <h3 class=\"sh3\">\n       1. The Degradation Problem &amp; The Residual Breakthrough\n      </h3>\n<p>\n       In standard\
    \ feedforward networks, as layers are stacked, the model must learn a mapping $H(x)$ directly.\n    However, empirical\
    \ studies showed that adding more layers led to <strong>higher training error</strong>\n    — a phenomenon called the\
    \ <strong>degradation problem</strong>.\n    This is not overfitting (since training error increases, not just validation\
    \ error)\n    but rather an optimization failure: deep networks struggle to learn identity mappings.\n      </p>\n<p>\n\
    \       ResNet (He et al., 2015) reformulates the goal: instead of trying to fit $H(x)$, we force the layers to fit a\
    \ residual mapping:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$F(x) = H(x) - x \\implies\
    \ H(x) = F(x) + x$$\n       </span>\n</div>\n<p>\n       This is implemented via <strong>Residual Shortcuts</strong> (or\
    \ skip connections).\n    If the layers can be pushed toward zero weights ($F(x) \\approx 0$),\n    the block defaults\
    \ to a perfect identity mapping $H(x) = x$, preserving information across dozens of layers.\n       <br/>\n       Mathematically,\
    \ during backpropagation, the skip connection provides an uninterrupted highway\n    for gradients to flow backward without\
    \ being shrunk by matrix multiplications:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$\\\
    frac{\\partial H}{\\partial x} = \\frac{\\partial F(x)}{\\partial x} + 1$$\n       </span>\n</div>\n<p>\n       Even if\
    \ the gradient of the residual block $\\frac{\\partial F(x)}{\\partial x}$ vanishes,\n    the additive term $+1$ ensures\
    \ that error signals propagate completely back to early layers,\n    eliminating vanishing gradients!\n      </p>\n<h3\
    \ class=\"sh3\">\n       2. Identity vs. Projection Shortcuts\n      </h3>\n<p>\n       When the output shape of $F(x)$\
    \ matches the shape of the input $x$,\n    we apply an <strong>Identity Shortcut</strong> (simple addition).\n    But\
    \ when the block contains a stride greater than 1 or changes the number of channels,\n    the spatial dimensions drop\
    \ and channels grow.\n    In this case, we cannot add them directly.\n    We must apply a <strong>Projection Shortcut</strong>\
    \ using a $1 \\times 1$ convolution to match the shapes:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\"\
    >\n        $$H(x) = F(x) + W_s(x)$$\n       </span>\n<span class=\"desc\">\n        Where W_s is a 1x1 convolution with\
    \ stride matching the block's spatial downsampling.\n       </span>\n</div>\n<h3 class=\"sh3\">\n       3. MobileNet &amp;\
    \ Depthwise Separable Convolutions\n      </h3>\n<p>\n       To run computer vision models on mobile devices or edge hardware,\
    \ standard convolutions are too heavy.\n    MobileNet uses <strong>Depthwise Separable Convolutions</strong>, which break\
    \ a standard convolution into two stages:\n      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         Depthwise Convolution:\n\
    \        </strong>\n        A single $K \\times K$ filter is applied to *each channel* individually.\n      No cross-channel\
    \ mixing occurs.\n       </li>\n<li>\n<strong>\n         Pointwise Convolution:\n        </strong>\n        A $1 \\times\
    \ 1$ convolution mixes the outputs of the depthwise step across the channel dimension.\n       </li>\n</ul>\n<p>\n   \
    \    This separation reduces computational parameters and floating-point calculations\n    by approximately 8 to 9 times\
    \ with almost zero drop in final classification accuracy!\n      </p>\n<h3 class=\"sh3\">\n       4. Custom Architecture\
    \ Implementations\n      </h3>\n<p>\n       Let's implement a custom ResNet Identity Block, a Squeeze-and-Excitation (SE)\
    \ dynamic channel gating block,\n    and a MobileNet Inverted Residual block in Keras:\n      </p>\n<div class=\"cb\"\
    >\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — custom_resnet_se.py\n        </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><code class=\"language-html\"><span class=\"kw\">import</span> tensorflow <span class=\"kw\">as</span> tf\n<span\
    \ class=\"kw\">from</span> tensorflow.keras <span class=\"kw\">import</span> layers, models\n\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">resnet_identity_block</span>(input_tensor, filters, kernel_size=<span class=\"num\">3</span>):\n\
    \    <span class=\"cm\"># Save the input for the skip connection</span>\n    shortcut = input_tensor\n    \n    <span\
    \ class=\"cm\"># First convolution layer in the block</span>\n    x = layers.<span class=\"fn\">Conv2D</span>(filters,\
    \ kernel_size, padding=<span class=\"str\">'same'</span>)(input_tensor)\n    x = layers.<span class=\"fn\">BatchNormalization</span>()(x)\n\
    \    x = layers.<span class=\"fn\">Activation</span>(<span class=\"str\">'relu'</span>)(x)\n    \n    <span class=\"cm\"\
    ># Second convolution layer</span>\n    x = layers.<span class=\"fn\">Conv2D</span>(filters, kernel_size, padding=<span\
    \ class=\"str\">'same'</span>)(x)\n    x = layers.<span class=\"fn\">BatchNormalization</span>()(x)\n    \n    <span class=\"\
    cm\"># Skip connection addition</span>\n    x = layers.<span class=\"fn\">add</span>([x, shortcut])\n    x = layers.<span\
    \ class=\"fn\">Activation</span>(<span class=\"str\">'relu'</span>)(x)\n    <span class=\"kw\">return</span> x\n\n<span\
    \ class=\"kw\">def</span> <span class=\"fn\">squeeze_excitation_block</span>(input_tensor, ratio=<span class=\"num\">16</span>):\n\
    \    <span class=\"cm\"># Squeeze-and-Excitation dynamically recalibrates channel relationships</span>\n    channels =\
    \ input_tensor.shape[-<span class=\"num\">1</span>]\n    \n    <span class=\"cm\"># Squeeze: Spatial global average pooling</span>\n\
    \    squeeze = layers.<span class=\"fn\">GlobalAveragePooling2D</span>()(input_tensor)\n    \n    <span class=\"cm\">#\
    \ Excitation: Two fully-connected layers forming a bottleneck</span>\n    excitation = layers.<span class=\"fn\">Dense</span>(channels\
    \ // ratio, activation=<span class=\"str\">'relu'</span>)(squeeze)\n    excitation = layers.<span class=\"fn\">Dense</span>(channels,\
    \ activation=<span class=\"str\">'sigmoid'</span>)(excitation)\n    excitation = layers.<span class=\"fn\">Reshape</span>((<span\
    \ class=\"num\">1</span>, <span class=\"num\">1</span>, channels))(excitation)\n    \n    <span class=\"cm\"># Scale the\
    \ original input by the channel activation scores</span>\n    <span class=\"kw\">return</span> layers.<span class=\"fn\"\
    >Multiply</span>()([input_tensor, excitation])\n\n<span class=\"kw\">def</span> <span class=\"fn\">inverted_residual_block</span>(input_tensor,\
    \ expansion=<span class=\"num\">6</span>, stride=<span class=\"num\">1</span>, filters=<span class=\"num\">64</span>):\n\
    \    <span class=\"cm\"># Inverted Residual Blocks (MobileNetV2) expand channels first, then project</span>\n    in_channels\
    \ = input_tensor.shape[-<span class=\"num\">1</span>]\n    hidden_dim = <span class=\"fn\">int</span>(in_channels * expansion)\n\
    \    \n    <span class=\"cm\"># 1. Expansion: 1x1 conv to project to higher-dimensional space</span>\n    x = layers.<span\
    \ class=\"fn\">Conv2D</span>(\n<span class=\"cm\"># hidden_dim,</span>\n<span class=\"cm\"># (1, 1),</span>\n        padding=<span\
    \ class=\"str\">'same'</span>,\n        use_bias=<span class=\"kw\">False</span>\n<span class=\"cm\"># )(input_tensor)</span>\n\
    \    x = layers.<span class=\"fn\">BatchNormalization</span>()(x)\n    x = layers.<span class=\"fn\">Activation</span>(tf.nn.relu6)(x)\n\
    \    \n    <span class=\"cm\"># 2. Depthwise: 3x3 depthwise convolution</span>\n    x = layers.<span class=\"fn\">DepthwiseConv2D</span>(\n\
    <span class=\"cm\"># (3, 3),</span>\n        strides=stride,\n        padding=<span class=\"str\">'same'</span>,\n   \
    \     use_bias=<span class=\"kw\">False</span>\n<span class=\"cm\"># )(x)</span>\n    x = layers.<span class=\"fn\">BatchNormalization</span>()(x)\n\
    \    x = layers.<span class=\"fn\">Activation</span>(tf.nn.relu6)(x)\n    \n    <span class=\"cm\"># 3. Projection: Linear\
    \ 1x1 conv to compress channels back</span>\n    x = layers.<span class=\"fn\">Conv2D</span>(\n<span class=\"cm\"># filters,</span>\n\
    <span class=\"cm\"># (1, 1),</span>\n        padding=<span class=\"str\">'same'</span>,\n        use_bias=<span class=\"\
    kw\">False</span>\n<span class=\"cm\"># )(x)</span>\n    x = layers.<span class=\"fn\">BatchNormalization</span>()(x)\
    \ <span class=\"cm\"># No activation (Linear Bottleneck)</span>\n    \n    <span class=\"cm\"># 4. Residual Connection</span>\n\
    \    <span class=\"kw\">if</span> stride == <span class=\"num\">1</span> <span class=\"kw\">and</span> in_channels ==\
    \ filters:\n        x = layers.<span class=\"fn\">add</span>([input_tensor, x])\n    <span class=\"kw\">return</span>\
    \ x</code></pre>\n</div>\n"
