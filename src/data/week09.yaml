    prompt_html: "<p><strong>\n        Write an executable Python script using NumPy:\n        <br/>\n        1. Implement\
      \ the\n        \n         conv2d_forward\n        \n        function from scratch.\n        <br/>\n        2. Load an\
      \ actual grayscale image using PIL or OpenCV, convert it to a NumPy array, and apply a 3x3 Sobel Filter (edge detector)\
      \ to extract horizontal and vertical edges.\n        <br/>\n        3. Save the resulting edge-detected feature maps\
      \ to disk as images.\n       </strong></p>\n\n\n<div class=\"cb\" style=\"margin-top: 1rem;\">\n<div class=\"cb-head\"\
      >\n<span class=\"cb-lang\">python</span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
      >copy</button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">Run</button>\n<button class=\"run-btn\" onclick=\"\
      openInColab(this)\">⚡ Run on Colab</button>\n</div>\n</div>\n<pre><span class=\"cm\"># Solution for Task: 2D Convolution\
      \ Forward Layer in NumPy</span>\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"\
      kw\">def</span> <span class=\"fn\">conv2d_forward</span>(image: np.ndarray, kernel: np.ndarray, stride: int = <span\
      \ class=\"num\">1</span>, padding: int = <span class=\"num\">0</span>) -&gt; np.ndarray:\n    <span class=\"kw\">if</span>\
      \ padding &gt; <span class=\"num\">0</span>:\n        image = np.<span class=\"fn\">pad</span>(image, ((padding, padding),\
      \ (padding, padding)), mode=<span class=\"str\">'constant'</span>)\n        \n    H, W = image.shape\n    kH, kW = kernel.shape\n\
      \    out_H = (H - kH) // stride + <span class=\"num\">1</span>\n    out_W = (W - kW) // stride + <span class=\"num\"\
      >1</span>\n    \n    output = np.<span class=\"fn\">zeros</span>((out_H, out_W))\n    <span class=\"kw\">for</span>\
      \ i <span class=\"kw\">in</span> <span class=\"fn\">range</span>(<span class=\"num\">0</span>, out_H):\n        <span\
