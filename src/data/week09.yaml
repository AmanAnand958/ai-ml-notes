  day_num: 59
  title: Day 59 — Introduction to Convolutional Neural Networks (CNNs)
  subtitle: Traditional fully-connected neural networks scale terribly when applied to high-resolution images. Today, we masterConvolutional
    Neural Networks (CNNs)— the foundational architectures of modern computer vision. We will mathematically derive spatial
    dimension outputs, explore receptive fields, and build a multi-channel 2D Convolution layer completely from scratch in
    NumPy, without any high-level framework helper functions.
  time_estimate: 5 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Demonstrate why Fully Connected Layers fail on high-resolution image data (parameter explosion, lack of spatial awareness).
  - Derive the spatial output dimensions of any 2D Convolutional layer given kernel, stride, and padding configurations.
  - Implement a fully functional 2D Convolution layer with padding and strides using raw NumPy.
  - Execute exact visual convolution calculations by hand.
