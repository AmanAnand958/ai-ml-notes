    options:
    - It automatically scales down the learning rate when validation loss stops improving, helping the optimizer settle int...
    - It deletes redundant weights during training.
    - It forces the model to stop training immediately.
    - It increases dropout to 50%.
    answer_idx: 0
    explanation: When validation loss plateaus, the learning rate might be too large, causing the model to bounce around the
      local minimum. Reducing the learning rate allows the optimizer to take smaller, finer steps, settling into the bottom
      of the loss basin.
  flashcards:
  - front: 'Transfer Learning: Feature Extraction vs Fine-Tuning?'
    back: 'Feature Extraction: freezes backbone weights and trains only the new classification head. Fine-Tuning: unfreezes
      top backbone layers with a very small learning rate ($10^{-5}$).'
  - front: Learning Rate Warmup & Cosine Decay?
    back: Gradually increases LR during initial epochs to prevent early gradient divergence, followed by smooth cosine decay
      to zero.
  - front: Model Quantization (INT8)?
    back: Converts FP32 weights and activations to INT8 using scale factor $S$ and zero-point $Z$, reducing model size by
      $4\\times$ with negligible accuracy drop.
  - front: ONNX Runtime Optimization?
    back: Open Neural Network Exchange provides cross-platform hardware acceleration with graph fusion and constant folding.
