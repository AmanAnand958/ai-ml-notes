      \ = np.<span class=\"fn\">sum</span>(region * kernel)\n            \n    <span class=\"kw\">return</span> output\n\n\
      <span class=\"cm\"># Verification</span>\nimg = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">8</span>,\
