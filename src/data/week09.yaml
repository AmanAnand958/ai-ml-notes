  - qid: q64_1
    num_str: Question 1
    question: Why are U-Net skip connections placed between identical spatial levels of the encoder and decoder paths?
    options:
    - To skip the activation functions to speed up model execution.
    - To directly propagate high-resolution spatial details (edges, boundaries) from the contracting path to the expanding
      ...
    - To bypass GPU RAM memory allocation limits.
    - To enforce L1 regularization on the weights.
    answer_idx: 1
    explanation: The encoder's max pooling layers discard structural edge coordinates to extract abstract concepts. By concatenating
      encoder features directly back to the decoder, we merge high-level semantic labels with sharp spatial boundaries.
  - qid: q64_2
    num_str: Question 2
    question: Under what conditions does Dice Loss significantly outperform Binary Cross-Entropy loss in semantic segmentation?
    options:
    - Under extreme class imbalance, where target pixels represent only a tiny fraction (e.g. &lt;5%) of the image grid.
    - Only when training on high-performance TPU clusters.
    - When classifying multiple overlapping object categories.
    - When training on small datasets without data augmentation.
    answer_idx: 0
    explanation: BCE calculates loss by averaging pixel-level errors across the entire grid. If 99.5% of pixels are background,
      the network ignores the target object. Dice Loss measures overlap directly, ignoring correct background pixels.
  - qid: q64_3
    num_str: Question 3
    question: What is the core cause of checkerboard artifacts in Transpose Convolution layers, and how is it resolved in
      production?
    options:
    - They are caused by kernel sizes and strides that do not divide evenly, resolved by replacing Transpose Conv with bili...
    - They are caused by high learning rates, resolved by applying weight decay.
    - They are caused by using Sigmoid activations instead of Tanh.
    - They are caused by lack of Batch Normalization layers.
    answer_idx: 0
    explanation: When kernel size is not divisible by stride, spatial areas of the output grid receive uneven overlaps of
      filter activations, producing a grid pattern. Resolving this with bilinear upsampling + Conv2D is standard practice.
  flashcards:
  - front: Semantic vs Instance vs Panoptic Segmentation?
    back: 'Semantic: classifies every pixel into a class (all cars same color). Instance: separates individual object instances.
      Panoptic: combines semantic + instance.'
  - front: U-Net Architecture?
    back: Encoder-decoder network with symmetric skip connections that concatenate high-resolution shallow encoder features
      directly with upsampled decoder features.
  - front: Transposed Convolution vs Bilinear Upsampling?
    back: Transposed Conv has learnable parameters but can cause checkerboard artifacts; Bilinear + $1\\times 1$ Conv is artifact-free
      and parameter efficient.
  - front: Dice Loss / F1 Loss for Segmentation?
    back: $\\text{Dice} = \\\\\frac{2 |A \\cap B|}{|A| + |B|}$, robust to severe class imbalance between foreground objects
      and background pixels.
  gotcha:
    title: '⚠️ Gotcha: Tensor Shape Permutations in PyTorch vs OpenCV'
    description: OpenCV uses `(H, W, C)` in BGR format, whereas PyTorch CNNs expect `(B, C, H, W)` in RGB normalized float.
  takeaways:
    hinglish_line: |-
      <strong>
               Ek line mein:
              </strong>
              U-Net contracting encoder aur expanding decoder blocks ke combination se segmentation maps ko pixel-level scale par recover karta hai.
    bullets:
    - Semantic segmentation maps pixels to classes; Instance segmentation isolates individual object instances separately.
    - Transpose Convolutions are learnable upsamplers, but they can trigger checkerboard artifacts due to uneven overlaps.
    - Dice Loss measures structural overlap directly, resolving extreme class imbalance issues where BCE fails.
    - U-Net skip connections link equivalent spatial levels, preserving fine edge boundaries in decoder upsampling.
