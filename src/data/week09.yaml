  quizzes:
  - qid: q62_1
    num_str: Question 1
    question: What is the core mathematical reason why skip connections prevent vanishing gradients during backward passes?
    options:
    - They multiply the gradients by a scaling factor greater than one.
    - The skip connection adds a constant term "+1" to the gradient derivative, allowing gradients to propagate backward wi...
    - They force all activations to be positive.
    - They replace backpropagation with forward-mode automatic differentiation.
    answer_idx: 1
    explanation: In backpropagation, the derivative of $H(x) = F(x) + x$ with respect to $x$ is $\\frac{\partial F(x)}{\partial
      x} + 1$. This constant addition of $1$ acts as a gradient highway, ensuring that even if the weight layers completely
      vanish, the gradient can still flow back safely.
  - qid: q62_2
    num_str: Question 2
    question: Under what physical conditions must you use a Projection Shortcut instead of an Identity Shortcut in a ResNet
      block?
    options:
    - When training on small datasets.
    - When the spatial dimensions (height/width) decrease or the number of channels increases, requiring a 1x1 Conv to matc...
    - Only when training on GPUs without tensor cores.
    - When applying Batch Normalization.
    answer_idx: 1
    explanation: Matrix addition requires both operands to have identical shapes. If a residual block downsamples spatial
      grids or expands channels, the skip connection input must be projected using a 1x1 Conv with matching stride and filter
      counts to enable the addition.
  - qid: q62_3
    num_str: Question 3
    question: Why does MobileNetV2 use a linear bottleneck (no activation) in the final projection 1x1 convolution of its
      Inverted Residual block?
    options:
    - Because applying a non-linear activation (like ReLU) on low-dimensional bottleneck layers destroys valuable manifold
      ...
    - To speed up GPU execution times.
    - Because linear layers are mathematically required for skip additions.
    - To enforce weight decay.
    answer_idx: 0
    explanation: If you project features back to a low-dimensional space (a bottleneck) and then apply a ReLU, you instantly
      clip all negative values to zero. In low dimensions, this causes significant "information destruction". Keeping the
      projection linear preserves the complete manifold!
  flashcards:
  - front: ResNet Residual Connection?
    back: Computes $\\mathcal{F}(x) + x$ (identity shortcut), enabling gradients to flow unimpeded directly through the addition
      operator during backpropagation ($\\\\\\frac{\\partial L}{\\partial x} = \\\\\frac{\\partial L}{\\partial y}(1 + \\\\\frac{\\partial
      \\mathcal{F}}{\\partial x})$).
  - front: Depthwise Separable Convolution?
    back: Splits standard convolution into Depthwise ($K \\times K \\times 1$) per channel followed by Pointwise ($1 \\times
      1 \\times C$), reducing compute by $\\approx \\\\\frac{1}{N} + \\\\\frac{1}{K^2}$ (used in MobileNet).
  - front: Bottleneck Architecture in ResNet-50?
    back: $1\\times 1$ conv (reduces channels from 256 to 64) $\\to 3\\times 3$ conv $\\to 1\\times 1$ conv (expands channels
      back to 256).
  - front: Inverted Residuals with Linear Bottlenecks?
    back: 'MobileNetV2: Expands channels in intermediate layer, applies depthwise conv with ReLU6, and projects back without
      non-linearity to preserve manifold structure.'
  gotcha:
    title: '⚠️ Gotcha: Tensor Shape Permutations in PyTorch vs OpenCV'
    description: OpenCV uses `(H, W, C)` in BGR format, whereas PyTorch CNNs expect `(B, C, H, W)` in RGB normalized float.
  takeaways:
    hinglish_line: |-
      <strong>
               Ek line mein:
              </strong>
              ResNets layers input ko shortcut connection se output mein add karte hain taaki deep networks mein gradient vanish na ho.
    bullets:
    - The Degradation Problem occurs when deep networks fail to learn identity mappings, which is solved by ResNet skip connections.
    - Skip connections act as gradient highways during backpropagation by adding a constant term "+1" to the derivative.
    - Identity shortcuts are used for matching shapes; Projection shortcuts project inputs using a 1x1 Conv when shapes differ.
    - Depthwise Separable Convolutions separate filtering and mixing, cutting computational complexity by ~8x.
