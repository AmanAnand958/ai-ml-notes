  analogy: Jaise agar aapko pure UP ke aaloo ka average vajan nikalna hai. Ek tarika hai ki aap har ek aaloo ko ek-ek karke
    tolein (flatten - very heavy and slow). Dusra tarika hai ki aap har ziley (channel) ke saare aaloo ka average vajan lein
    aur bas un 75 values ko tolein (Global Average Pooling - fast, efficient, low parameter). GAP model ki performance ko
