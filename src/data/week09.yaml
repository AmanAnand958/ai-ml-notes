  quizzes:
  - qid: q63_1
    num_str: Question 1
    question: Why does the YOLO loss function use square roots on width and height parameters ($\sqrt{w}$, $\sqrt{h}$) instead
      of raw width and height?
    options:
    - To ensure that the outputs are always positive numbers.
    - To ensure that small bounding boxes are heavily penalized for minor coordinate shifts compared to large boxes, balanc...
    - To speed up forward pass calculations.
    - To enforce L2 regularization on fully connected filters.
    answer_idx: 1
    explanation: In object detection, a 2-pixel shift in a tiny bounding box (e.g. 10x10) is a massive failure, whereas a
      2-pixel shift in a huge box (e.g. 200x200) is negligible. Taking the square root mathematically ensures that smaller
      values have much steeper gradients, balancing sensitivity.
  - qid: q63_2
    num_str: Question 2
    question: What is the physical function of the $\lambda_{\\text{noobj}}$ parameter in the YOLO loss function?
    options:
    - To delete overlapping prediction boxes automatically.
    - To down-weight confidence gradient signals from the vast majority of grid cells that only contain background, prevent...
    - To increase learning rates for classification parameters.
    - To force all background grid outputs to exactly 0.5.
    answer_idx: 1
    explanation: In most images, objects occupy a fraction of the grid. If we treat objects and background equally, the network
      will learn to always output "background" confidence 0. Downsampling background gradients using $\lambda_{\\text{noobj}}
      = 0.5$ solves this.
  - qid: q63_3
    num_str: Question 3
    question: Why do Two-Stage detectors (like Faster R-CNN) achieve higher localization accuracy than early One-Stage detectors,
      but run slower?
    options:
    - Because they split the tasks, using a Region Proposal Stage to crop and isolate object candidates first, allowing cla...
    - Because they use larger kernel sizes in convolutions.
    - Because they are trained on multiple GPUs simultaneously.
    - Because they do not utilize pooling layers.
    answer_idx: 0
    explanation: Isolating candidates first (Stage 1) means classification heads only inspect highly localized crops, minimizing
      coordinate confusion. However, running a classification head on 100+ separate proposals per image is highly slow compared
      to YOLO's single unified grid sweep.
  flashcards:
  - front: YOLO One-Stage vs Two-Stage Detectors?
    back: Two-stage (Faster R-CNN) generates region proposals (RPN) then classifies; One-stage (YOLO/SSD) predicts bounding
      boxes and class logits directly in a single dense forward pass.
  - front: IoU (Intersection over Union)?
    back: $$\\text{IoU} = \\frac{\\text{Area of Overlap}}{\\text{Area of Union}}$$. An IoU $\\ge 0.5$ typically defines a
      true positive detection.
  - front: Non-Maximum Suppression (NMS)?
    back: Iteratively selects highest confidence bounding box and suppresses all overlapping neighbor boxes with $\\text{IoU}
      > \\text{threshold}$.
  - front: mAP (Mean Average Precision)?
    back: Mean of Average Precision (area under Precision-Recall curve) across all object classes and IoU thresholds (e.g.
      mAP@50 or mAP@50:95).
  gotcha:
    title: '⚠️ Gotcha: Not Freezing Pretrained Layers'
    description: 'When using transfer learning, always freeze the base model layers first (<code>for param in model.parameters():
      param.requires_grad = False</code>). Only then replace and train the classification head. Training all layers from scratch
      with a small dataset will destroy the pretrained features and cause severe overfitting.'
