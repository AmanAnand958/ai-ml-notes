  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<div class=\"diagram-container\" style=\"background:var(--bg3);\
    \ padding:1rem; border-radius:8px; margin:1rem 0; border:1px solid var(--border);\">\n<p><strong>YOLO Single-Stage Grid\
    \ Detection &amp; NMS Pipeline:</strong></p>\n<div class=\"mermaid\">\ngraph LR\n    Img[\"Input Image (416x416x3)\"]\
    \ --&gt; CNN[\"Backbone (CSPDarkNet)\"]\n    CNN --&gt; Grid[\"Grid Split (S x S)\"]\n    Grid --&gt; BBox[\"B Bounding\
    \ Boxes (x, y, w, h, conf) + C Class Probs per cell\"]\n    BBox --&gt; IOU[\"IoU Filtering (Threshold &gt; 0.5)\"]\n\
    \    IOU --&gt; NMS[\"Non-Maximum Suppression (NMS)\"]\n    NMS --&gt; Detections[\"Final Bounding Box Detections\"]\n\
    </div>\n</div>\n<h3 class=\"sh3\">\n       1. One-Stage vs. Two-Stage Detectors\n      </h3>\n<p>\n       Object detection\
    \ requires finding *where* an object is (bounding box coordinates) and *what* it is (class probabilities).\n       <br/>\n\
    \       Two main families of detectors solve this:\n      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         Two-Stage\
    \ Detectors (R-CNN family):\n        </strong>\n<br/>\n        - *Stage 1 (Region Proposal):* A search network (like Selective\
    \ Search or a Region Proposal Network in Faster R-CNN)\n      proposes candidate regions that likely contain objects.\n\
    \        <br/>\n        - *Stage 2 (Classification &amp; Regression):* A CNN classifies each proposed region individually\n\
    \      and refines its bounding box coordinates.\n        <br/>\n<em>\n         Pros/Cons:\n        </em>\n        High\
    \ accuracy, but computationally slow and heavy (unsuitable for real-time edge processing).\n       </li>\n<li>\n<strong>\n\
    \         One-Stage Detectors (YOLO, SSD):\n        </strong>\n<br/>\n        Divides the input image into an $S \\times\
    \ S$ grid.\n      If an object's center falls into a grid cell, that cell is responsible for predicting the object.\n\
    \      In a single forward pass, the model predicts bounding boxes and class probabilities directly.\n        <br/>\n\
    <em>\n         Pros/Cons:\n        </em>\n        Extremely fast (capable of running at 60+ FPS on edge GPUs),\n     \
    \ but traditionally struggled with small, highly clustered objects.\n       </li>\n</ul>\n<h3 class=\"sh3\">\n       2.\
    \ Intersection over Union (IoU) Math\n      </h3>\n<p>\n       To evaluate how accurately our predicted bounding box aligns\
    \ with the true ground truth box,\n    we calculate the <strong>Intersection over Union (IoU)</strong> metric:\n     \
    \ </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$$\\text{IoU} = \\frac{\\text{Area of Overlap}}{\\\
    text{Area of Union}} = \\frac{\\text{Area}(A \\cap B)}{\\text{Area}(A \\cup B)}$$$\n       </span>\n</div>\n<p>\n    \
    \   Where bounding boxes are defined by coordinate corners $[x_1, y_1, x_2, y_2]$.\n    The intersection coordinates are:\n\
    \      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$x_1^{int} = \\max(x_1^A, x_1^B), \\quad y_1^{int}\
    \ = \\max(y_1^A, y_1^B)$$\n       </span>\n<span class=\"formula\">\n        $$x_2^{int} = \\min(x_2^A, x_2^B), \\quad\
    \ y_2^{int} = \\min(y_2^A, y_2^B)$$\n       </span>\n</div>\n<p>\n       If $x_2^{int} &lt; x_1^{int}$ or $y_2^{int} &lt;\
    \ y_1^{int}$, the boxes do not overlap, and the IoU is 0.\n    Otherwise, the overlap area is $(x_2^{int} - x_1^{int})\
    \ \\times (y_2^{int} - y_1^{int})$,\n    and the union is $\\text{Area}(A) + \\text{Area}(B) - \\text{Area of Overlap}$.\n\
    \    An IoU $\\ge 0.5$ is typically considered a correct detection.\n      </p>\n<h3 class=\"sh3\">\n       3. The Complete\
    \ Multi-Part YOLO Loss Function\n      </h3>\n<p>\n       YOLO treats object detection as a single, end-to-end regression\
    \ problem.\n    The network is trained using a massive multi-part loss function that balances coordinates, object confidence,\
    \ and class probabilities:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$\\mathcal{L}_{\\\
    text{YOLO}} = \\lambda_{\\text{coord}} \\sum_{i=0}^{S^2} \\sum_{j=0}^B \\mathbb{I}_{ij}^{\\text{obj}} \\left[ (x_i - \\\
    hat{x}_i)^2 + (y_i - \\hat{y}_i)^2 \\right]$$\n       </span>\n<span class=\"formula\">\n        $${} + \\lambda_{\\text{coord}}\
    \ \\sum_{i=0}^{S^2} \\sum_{j=0}^B \\mathbb{I}_{ij}^{\\text{obj}} \\left[ (\\sqrt{w_i} - \\sqrt{\\hat{w}_i})^2 + (\\sqrt{h_i}\
    \ - \\sqrt{\\hat{h}_i})^2 \\right]$$\n       </span>\n<span class=\"formula\">\n        $${} + \\sum_{i=0}^{S^2} \\sum_{j=0}^B\
    \ \\mathbb{I}_{ij}^{\\text{obj}} (C_{ij} - \\hat{C}_{ij})^2$$\n       </span>\n<span class=\"formula\">\n        $${}\
    \ + \\lambda_{\\text{noobj}} \\sum_{i=0}^{S^2} \\sum_{j=0}^B \\mathbb{I}_{ij}^{\\text{noobj}} (C_{ij} - \\hat{C}_{ij})^2$$\n\
    \       </span>\n<span class=\"formula\">\n        $${} + \\sum_{i=0}^{S^2} \\mathbb{I}_{i}^{\\text{obj}} \\sum_{c \\\
    in \\text{classes}} (p_i(c) - \\hat{p}_i(c))^2$$\n       </span>\n</div>\n<p>\n       Let's unpack the terms of this equation:\n\
    \      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         $\\lambda_{\\text{coord}}$ (Coordinate Loss Weight):\n\
    \        </strong>\n        Typically set to $5.0$. Forces the optimizer to prioritize exact bounding box center and scale\
    \ coordinates.\n       </li>\n<li>\n<strong>\n         $\\lambda_{\\text{noobj}}$ (No-Object Loss Weight):\n        </strong>\n\
    \        Typically set to $0.5$. Since most grid cells in an image contain background,\n      their confidence gradients\
    \ would dominate training. This term prevents background gradients from overwhelming object signals.\n       </li>\n<li>\n\
    <strong>\n         $\\mathbb{I}_{ij}^{\\text{obj}}$ (Indicator function):\n        </strong>\n        Equals 1 if the\
    \ $j$-th bounding box in grid cell $i$ is \"responsible\" for that object, and 0 otherwise.\n       </li>\n<li>\n<strong>\n\
    \         Square Root on Width/Height ($\\sqrt{w}$, $\\sqrt{h}$):\n        </strong>\n        Small bounding boxes are\
    \ highly sensitive to small coordinate errors, whereas large boxes are robust.\n      Taking the square root ensures that\
    \ small coordinate shifts in small boxes trigger a much higher loss penalty than shifts in large boxes.\n       </li>\n\
    </ul>\n<h3 class=\"sh3\">\n       4. Non-Maximum Suppression (NMS) from Scratch\n      </h3>\n<p>\n       During inference,\
    \ an object detector might predict multiple highly overlapping bounding boxes for the same object\n    (e.g. 5 different\
    \ boxes around a single car).\n    Non-Maximum Suppression (NMS) cleans this up by selecting the single highest-confidence\
    \ box\n    and discarding all neighboring boxes that have an IoU overlap higher than a specific threshold.\n       <br/>\n\
    \       Let's build a highly optimized, production-ready NMS algorithm in NumPy:\n      </p>\n<div class=\"cb\">\n<div\
    \ class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — nms_numpy.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code\
    \ class=\"language-html\"><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\"\
    >def</span> <span class=\"fn\">nms</span>(boxes, scores, iou_threshold=<span class=\"num\">0.5</span>):\n    <span class=\"\
    cm\"># boxes shape: (N, 4) where each row is [x1, y1, x2, y2]</span>\n    <span class=\"cm\"># scores shape: (N,) representing\
    \ confidence scores</span>\n    \n    x1 = boxes[:, <span class=\"num\">0</span>]\n    y1 = boxes[:, <span class=\"num\"\
    >1</span>]\n    x2 = boxes[:, <span class=\"num\">2</span>]\n    y2 = boxes[:, <span class=\"num\">3</span>]\n    \n \
    \   <span class=\"cm\"># Calculate the area of all boxes</span>\n    areas = (x2 - x1) * (y2 - y1)\n    \n    <span class=\"\
    cm\"># Sort box indices by confidence score descending</span>\n    order = scores.<span class=\"fn\">argsort</span>()[::-<span\
    \ class=\"num\">1</span>]\n    \n    keep = []\n    <span class=\"kw\">while</span> order.size &gt; <span class=\"num\"\
    >0</span>:\n        <span class=\"cm\"># 1. Keep the highest-confidence box</span>\n        best_idx = order[<span class=\"\
    num\">0</span>]\n<span class=\"cm\"># keep.append(best_idx)</span>\n        \n        <span class=\"kw\">if</span> order.size\
    \ == <span class=\"num\">1</span>:\n<span class=\"cm\"># break</span>\n            \n        <span class=\"cm\"># 2. Find\
    \ intersection boundaries with remaining boxes</span>\n        xx1 = np.<span class=\"fn\">maximum</span>(x1[best_idx],\
    \ x1[order[<span class=\"num\">1</span>:]])\n        yy1 = np.<span class=\"fn\">maximum</span>(y1[best_idx], y1[order[<span\
    \ class=\"num\">1</span>:]])\n        xx2 = np.<span class=\"fn\">minimum</span>(x2[best_idx], x2[order[<span class=\"\
    num\">1</span>:]])\n        yy2 = np.<span class=\"fn\">minimum</span>(y2[best_idx], y2[order[<span class=\"num\">1</span>:]])\n\
    \        \n        <span class=\"cm\"># 3. Calculate intersection dimensions</span>\n        w = np.<span class=\"fn\"\
    >maximum</span>(<span class=\"num\">0.0</span>, xx2 - xx1)\n        h = np.<span class=\"fn\">maximum</span>(<span class=\"\
    num\">0.0</span>, yy2 - yy1)\n        intersection = w * h\n        \n        <span class=\"cm\"># 4. Calculate IoU</span>\n\
    \        union = areas[best_idx] + areas[order[<span class=\"num\">1</span>:]] - intersection\n        iou = intersection\
    \ / union\n        \n        <span class=\"cm\"># 5. Only retain boxes with IoU less than the threshold</span>\n     \
    \   inds = np.<span class=\"fn\">where</span>(iou &lt;= iou_threshold)[<span class=\"num\">0</span>]\n        \n     \
    \   <span class=\"cm\"># Update order index list (offset by 1 due to slice order[1:])</span>\n        order = order[inds\
    \ + <span class=\"num\">1</span>]\n        \n    <span class=\"kw\">return</span> keep\n\n<span class=\"cm\"># Test NMS\
    \ with overlapping boxes</span>\ntest_boxes = np.<span class=\"fn\">array</span>([\n<span class=\"cm\"># [10, 10, 50,\
    \ 50],  # Box A</span>\n<span class=\"cm\"># [12, 12, 48, 48],  # Box B (Heavy overlap with A)</span>\n<span class=\"\
    cm\"># [100, 100, 140, 140] # Box C (Completely separate)</span>\n<span class=\"cm\"># ]).astype(np.float32)</span>\n\n\
    test_scores = np.<span class=\"fn\">array</span>([<span class=\"num\">0.9</span>, <span class=\"num\">0.75</span>, <span\
    \ class=\"num\">0.8</span>])\n\nindices_to_keep = <span class=\"fn\">nms</span>(test_boxes, test_scores, iou_threshold=<span\
    \ class=\"num\">0.5</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Indices kept by NMS:\"</span>, indices_to_keep)\
    \ <span class=\"cm\"># Expected: [0, 2] (Box B discarded)</span></code></pre>\n</div>"
  predict:
    question: What is the spatial output dimension (height) of a 32x32 image after 3x3 valid convolution?
    answer: '30'
    explanation: Output size = (W - K + 2P)/S + 1 = (32 - 3 + 0)/1 + 1 = 30.
    code: |-
      W, K, P, S = 32, 3, 0, 1
      out_dim = (W - K + 2*P) // S + 1
      print(out_dim)
