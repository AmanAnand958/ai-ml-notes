    \        with AUTOTUNE prefetching and cache management.\n       </li>\n<li>\n<strong>\n         Model architecture module:\n\
    \        </strong>\n        Builds a regularized classifier using a pre-trained\n        \n         MobileNetV2\n    \
    \    \n        core, utilizing transfer learning.\n       </li>\n<li>\n<strong>\n         Inference pipeline module:\n\
