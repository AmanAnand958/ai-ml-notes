    \ class=\"fn\">get</span>(image_url)\n    img = Image.<span class=\"fn\">open</span>(<span class=\"fn\">BytesIO</span>(response.content))\n\
    \    \n    <span class=\"cm\"># Preprocess image</span>\n    img_resized = img.<span class=\"fn\">resize</span>((<span\
    \ class=\"num\">96</span>, <span class=\"num\">96</span>))\n    img_array = np.<span class=\"fn\">array</span>(img_resized).<span\
    \ class=\"fn\">astype</span>(np.float32)\n    img_preprocessed = tf.keras.applications.mobilenet_v2.<span class=\"fn\"\
