    \ tensorflow <span class=\"kw\">as</span> tf\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">import</span> requests\n<span class=\"kw\">from</span> PIL <span class=\"kw\">import</span> Image\n\
