    num_str: Question 1
    question: "What is the exact purpose of the\n         \n          ModelCheckpoint(save_best_only=True)\n         \n  \
      \       callback?"
    options:
    - It compresses the model architecture into a ZIP file.
    - It monitors the validation loss and saves the model's weight variables only when validation performance improves, ens...
    - It pauses training to ask the user if they want to save weights.
    - It deletes old log files to save space.
    answer_idx: 1
    explanation: In deep training, validation loss fluctuates. If you train for 50 epochs, the final model might be highly
      overfit. Using ModelCheckpoint with `save_best_only=True` guarantees that the final saved model corresponds to the exact
      epoch that achieved the lowest validation loss.
  - qid: q65_2
    num_str: Question 2
    question: Why must you resize CIFAR-10 images from 32x32 to 96x96 before feeding them into the pre-trained MobileNetV2
      network?
    options:
    - Because smaller images trigger memory leaks on the GPU.
    - Because pre-trained architectures (like MobileNet) have a minimum spatial requirement (e.g. 96x96) so that the spatia...
    - To increase the number of filters in the base layer.
    - Smaller images are not supported by the Python PIL library.
    answer_idx: 1
    explanation: Deep networks downsample spatial grids multiple times (usually 5 downsamplings of factor 2). If you input
      a 32x32 image, 5 downsamplings reduce the spatial shape to 1x1 before the final layers, meaning subsequent spatial convolutions
      would have dimensions of 0 or negative.
  - qid: q65_3
