  quizzes:
  - qid: q60_1
    num_str: Question 1
    question: How does the backward pass gradient flow differ between Max Pooling and Average Pooling layers?
    options:
    - Max Pooling gradients are multiplied by the weights of the layer, while Average Pooling gradients are added.
    - Max Pooling routes the incoming gradient entirely to the coordinate of the maximum value of the forward pass, while
      A...
    - Max Pooling cancels out gradients, while Average Pooling doubles them.
    - There is no difference; pooling layers have zero gradient contribution.
    answer_idx: 1
    explanation: Since Max Pooling only extracts the maximum value, only that coordinate had any effect on the loss, receiving
      100% of the gradient. In Average Pooling, all elements contributed equally to the average, so each receives an equal
      share (1/N) of the gradient.
  - qid: q60_2
    num_str: Question 2
    question: What is the exact physical impact of Max Pooling on a deep CNN?
    options:
    - It increases spatial resolution and decreases translation invariance.
    - It downsamples the spatial resolution, introducing translation invariance, and doubling the receptive field size of
      s...
    - It changes RGB color channels to grayscale.
    - It deletes low-frequency convolutional weights.
    answer_idx: 1
    explanation: Pooling downsamples spatial dimensions (cutting parameters/computation), summaries local regions to create
      translation invariance, and expands the spatial reach (receptive field) of subsequent convolutions.
  - qid: q60_3
    num_str: Question 3
    question: What is the advantage of L2 Pooling over standard Average Pooling?
    options:
    - It measures the energy or magnitude of activations, preventing negative and positive activations from canceling each
      ...
    - It runs faster on basic edge hardware.
    - It completely replaces Batch Normalization.
    - It is only compatible with linear activation functions.
    answer_idx: 0
    explanation: Taking the L2 norm (square root of the sum of squares) measures physical signal intensity. Unlike average
      pooling, where positive and negative activations cancel out, L2 pooling preserves overall activation magnitude, making
      it highly descriptive for complex texture fields.
  flashcards:
  - front: Max Pooling vs Average Pooling?
    back: Max Pooling extracts dominant features (edges/textures) and introduces translation invariance; Average Pooling smooths
      features and is common in Global Average Pooling (GAP).
  - front: Output Shape Formula for Conv2D?
    back: $O = \\lfloor \\\\\frac{W - K + 2P}{S} \\rfloor + 1$, where $W$=input size, $K$=kernel size, $P$=padding, $S$=stride.
  - front: 1x1 Convolution (Pointwise)?
    back: Changes channel dimensions (dimensionality reduction/expansion) with non-linear activation without altering spatial
      height/width.
  - front: Global Average Pooling (GAP)?
    back: Averages entire $H \\times W$ feature maps into a single scalar per channel, replacing dense fully connected layers
      and drastically reducing overfitting.
