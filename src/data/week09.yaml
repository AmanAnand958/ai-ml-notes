    <div class="task-header" style="background:rgba(247,169,75,.05);border-left:3px solid var(--orange)">
    <span class="task-badge tb-hard">
            Scenario Q5
           </span>
    <span class="task-title">
            Translation Invariance vs. Equivariance
           </span>
    </div>
    <div class="task-body" style="display:block">
    <p>
    <strong>
             Question:
            </strong>
            Define the difference between Translation Invariance and Translation Equivariance in CNNs. Which layers introduce each property?
           </p>
    <p>
    <strong>
             Answer:
            </strong>
    <br/>
            1. <strong>Translation Equivariance:</strong> If you shift the input image, the output of the layer shifts by the same amount: $f(Shift(x)) = Shift(f(x))$. <strong>Convolutional layers</strong> are equivariant. If an edge detector slides over an image, moving the edge 2 pixels to the right shifts the high activation coordinate in the feature map 2 pixels to the right.
            <br/>
            2. <strong>Translation Invariance:</strong> If you shift the input image, the output remains completely unchanged: $f(Shift(x)) = f(x)$. <strong>Pooling layers (especially Global Average Pooling)</strong> and final classification heads introduce invariance. By pooling activations (taking the max or mean over a window), the network doesn't care *where* the activation occurred, only *that* it occurred somewhere in the image.
           </p>
