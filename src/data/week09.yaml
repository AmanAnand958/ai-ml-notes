    num_str: Question 1
    question: What is the mathematical output size of a 2D convolution for a 128x128 input image, convolved with a 5x5 kernel,
      using stride=2 and padding=2?
    options:
    - 64x64
    - '64x64 (Exact calculation: floor((128 - 5 + 4)/2) + 1 = 64)'
    - 62x62
    - 128x128
    answer_idx: 1
    explanation: 'Applying the formula: floor((128 - 5 + 4)/2) + 1 = floor(127/2) + 1 = 63 + 1 = 64.'
  - qid: q59_2
    num_str: Question 2
    question: Why do standard fully-connected networks fail when scaling up to high-resolution images?
    options:
    - They suffer from a massive explosion of weights and parameters, leading to extreme overfitting, while also discarding...
    - They are only compatible with black-and-white images.
    - They cannot be optimized using stochastic gradient descent.
    - They generate random outputs when resolution exceeds 100 pixels.
    answer_idx: 0
    explanation: Connecting every pixel of a high-resolution image to subsequent layers creates millions of weights, causing
      immediate overfitting and massive GPU RAM bottlenecks. CNNs resolve this by sharing weights across local sliding patches.
  - qid: q59_3
    num_str: Question 3
    question: What does a 3x3 Sobel Filter physically detect when convolved across an image?
    options:
    - Average color gradients of background shadows.
    - Localized pixel intensity gradients, highlighting sharp vertical or horizontal boundaries (edges).
    - High-frequency random noise to blur the image.
    - The exact coordinates of complex objects like cars or dogs.
    answer_idx: 1
    explanation: Sobel filters calculate spatial derivatives of image brightness. By looking at local contrast transitions,
      they highlight vertical or horizontal edges, which represent the initial features extracted by the early layers of CNNs.
  flashcards:
  - front: Convolution Operation?
    back: 'Element-wise multiplication of a kernel with an input receptive field, followed by summation: $(I * K)(i,j) = \\\\\sum_m
      \\\\\sum_n I(i-m, j-n)K(m,n)$.'
  - front: Parameter Sharing in CNNs?
    back: The same kernel weights are applied across all spatial locations, reducing parameter count from $O(N^2)$ in MLPs
      to $O(K^2)$ and providing translation equivariance.
  - front: Receptive Field?
    back: The region of the input image that directly contributes to the activation of a specific neuron in deeper layers.
  - front: Feature Map Depth?
    back: Equals the number of distinct convolution filters applied in that layer (each learning a different spatial feature).
