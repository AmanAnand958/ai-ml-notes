  - title: Implement LoRA Layer from Scratch
    badge: 🔴 HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p><strong>\n           Do not use the PEFT library. Implement a PyTorch\n           \n            LoRALinear\n\
      \           \n           module that wraps an existing\n           \n            nn.Linear\n           \n          \
      \ layer. It should freeze the original weights and initialize matrix A (Kaiming Normal) and matrix B (Zeros). Write\
      \ a test asserting that only A and B receive gradients during a backward pass.\n          </strong></p>"
    done_when: "Your module successfully performs a forward pass matching\n           \n            Wx + BAx\n           \n\
      \           and gradients are isolated."
    git_cmd: 'git add implement_lora_layer_from_scratch.py &amp;&amp; git commit -m "feat(day): day98: implement-lora-layer-from-scratch"'
    sol_id: sol-w14d98t3
    solution_title: ✅ Custom PyTorch LoRA Layer Implementation
    solution_code: |-
      import numpy as np
      import torch
      np.random.seed(42)
      torch.manual_seed(42)
      # Step 1: Algorithmic Implementation & Core Transformations
      import torch
      import torch.nn as nn
      import math

      class LoRALinear(nn.Module):
          def __init__(self, linear_layer, r=8, alpha=16):
              super().__init__()
              self.linear = linear_layer
              self.r = r
              self.alpha = alpha
              self.scaling = alpha / r

              for param in self.linear.parameters():
                  param.requires_grad = False

              in_features = self.linear.in_features
              out_features = self.linear.out_features

              self.lora_A = nn.Parameter(torch.zeros(in_features, r))
              self.lora_B = nn.Parameter(torch.zeros(r, out_features))

              nn.init.kaiming_uniform_(self.lora_A, a=math.sqrt(5))
              nn.init.zeros_(self.lora_B)

          def forward(self, x):
              base_out = self.linear(x)
              adapter_out = (x @ self.lora_A @ self.lora_B) * self.scaling
              return base_out + adapter_out

      fc = nn.Linear(10, 5)
      lora_fc = LoRALinear(fc, r=4)

      x = torch.randn(1, 10)
      y = lora_fc(x)
      loss = y.sum()
      loss.backward()

      print("lora_A gradient computed:", lora_fc.lora_A.grad is not None)
      print("lora_B gradient computed:", lora_fc.lora_B.grad is not None)
      print("Base weight gradient computed:", lora_fc.linear.weight.grad is not None)
      assert loss is not None, "loss should not be None"
    solution_lang: python
