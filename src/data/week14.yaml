days:
- id: '94'
  day_num: 94
  title: The Mathematics of Scaled Dot-Product Attention
  subtitle: Understanding the fundamental limits of recurrent models and deriving the mathematical foundation of Self-Attention, Queries, Keys, Values, and the necessity of temperature scaling ($1/\sqrt{d_k}$). We will deeply analyze the bottleneck problem in Seq2Seq models and how parallel attention mechanisms bypass it entirely.
  time_estimate: '6 hours (Note: High-volume day. Take 2 days to fully digest if needed) (Note: High-volume day. Take 2 days to fully digest if needed) (Note: High-volume day. Take 2 days to fully digest if needed)'
  difficulty: +150 XP
  badges:
  - label: 📈 Advanced
    variant: b
  - label: Linear Algebra
    variant: t
  xp: 150
  objectives:
  - Mathematically define the Seq2Seq Information Bottleneck.
  - Derive the Attention matrix computations using linear projections.
  - Analyze the gradient saturation problem in unscaled dot products.
  - Implement a computationally optimal causal masked self-attention block.
  - Understand time complexity differences between RNNs and Transformers.
  checklist: []
  concept_flow:
  - Self-Attention
  - Positional Embeddings
  - Transformer Block
  - BERT Encoder
  - GPT Decoder
  - Model Pre-training
  hinglish: Attention is O(n²) in sequence length — 1000 token sequence mein 1M attention computations! Flash Attention, Longformer jaisi techniques is quadratic cost ko address karte hain!
  analogy: Imagine you are in a library searching for 'Indian spices'. The query (Q) is your search term. The database cards (K) are the index descriptions of all the books in the library. The value (V) is the actual content pages of the books. Self-attention does a dot-product search of Q against all Ks, finds the best matches, and pulls a weighted combination of their Vs.
  theory_html: "<h3 class=\"sh3\">\n       1. Information Bottleneck in RNNs\n      </h3>\n<p>\n       In standard sequence-to-sequence models (e.g., LSTMs), an entire input sequence of length\n       <em>\n        T\n       </em>\n       is encoded into a fixed-dimensional context vector\n       <em>\n        $h_T$ ∈ ℝ^d\n       </em>\n       . For large\n       <em>\n        T\n       </em>\n       (e.g., 500 words), compressing a distribution of variable length into a static bounded space leads to high information loss. The Jacobian matrix of hidden states across time steps reveals exponentially decaying singular values, proving that long-term dependencies vanish.\n      </p>\n\n<h3 class=\"sh3\">\n       2. $Q$, $K$, $V$ Projections\n      </h3>\n<p>\n       Attention resolves this by allowing the decoder to access a soft-addressed memory of all encoder states. We project the input embeddings\n       <em>\n        $X$ ∈ ℝ^(T × $d_{\\text{model}}$)\n       </em>\n       into three distinct\
    \ sub-spaces using learned weight matrices:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $Q$ = $XW_Q$  (where $W_Q$ ∈ ℝ^($d_{\\text{model}}$ × $d_k$))\n       </span>\n<span class=\"formula\">\n        $K$ = $XW_K$  (where $W_K$ ∈ ℝ^($d_{\\text{model}}$ × $d_k$))\n       </span>\n<span class=\"formula\">\n        $V$ = $XW_V$  (where $W_V$ ∈ ℝ^($d_{\\text{model}}$ × $d_v$))\n       </span>\n<span class=\"desc\">\n        $Q$ represents what we are searching for, $K$ acts as the database index, and $V$ is the actual feature content.\n       </span>\n</div>\n<h3 class=\"sh3\">\n       3. Deriving Scaled Dot-Product Attention\n      </h3>\n<p>\n       The unscaled attention scores are given by\n       <em>\n        S = $QK$^T\n       </em>\n       . If components of $Q$ and $K$ are independent random variables with mean 0 and variance 1, the dot product will have mean 0 and variance\n       <em>\n        $d_k$\n       </em>\n       . For a large\n       <em>\n\
    \        $d_k$\n       </em>\n       (e.g., 64), the variance is 64.\n      </p>\n<p>\n       Passing a vector with high variance into the Softmax function pushes the values to the tails of the exponential curve, where the derivative of softmax approaches zero. This causes\n       <strong>\n        gradient saturation\n       </strong>\n       and halts learning. To solve this, we scale by the standard deviation\n       <em>\n        √$d_k$\n       </em>\n       .\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$\\text{Attention}(Q, K, V) = \\text{Softmax}\\left( \\frac{QK^T}{\\sqrt{d_k}} \\right) V$$\n       </span>\n</div>\n<div class=\"mermaid\">\ngraph TD\n  Q[\"Query Q\"] --&gt; M1[\"MatMul\"]\n  K[\"Key K\"] --&gt; T[\"Transpose K^T\"]\n  T --&gt; M1\n  M1 --&gt; S[\"Scale by 1/sqrt - d_k\"]\n  S --&gt; Mask[\"Mask optional\"]\n  Mask --&gt; Softmax[\"Softmax\"]\n  Softmax --&gt; M2[\"MatMul\"]\n  V[\"Value V\"] --&gt; M2\n  M2 --&gt; Out[\"Output Vector\"\
    ]\n</div>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<thead>\n<tr>\n<th>\n          Operation\n         </th>\n<th>\n          Complexity per Layer\n         </th>\n<th>\n          Sequential Operations\n         </th>\n<th>\n          Maximum Path Length\n         </th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<strong>\n           Recurrent (LSTM)\n          </strong>\n</td>\n<td>\n          $O(n \\cdot d^2)$\n         </td>\n<td>\n          O(n)\n         </td>\n<td>\n          O(n)\n         </td>\n</tr>\n<tr>\n<td>\n<strong>\n           Self-Attention\n          </strong>\n</td>\n<td>\n          O(n^2 * d)\n         </td>\n<td>\n          $O(1)$\n         </td>\n<td>\n          $O(1)$\n         </td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — causal_attention.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn.functional <span class=\"kw\">as</span> F\n<span class=\"kw\">import</span> math\n\n<span class=\"kw\">def</span> <span class=\"fn\">causal_self_attention</span>(q, k, v, mask=<span class=\"kw\">True</span>):\n    <span class=\"cm\"># q, k, v shapes: [batch_size, seq_len, d_k]</span>\n    d_k = q.<span class=\"fn\">size</span>(-<span class=\"num\">1</span>)\n    seq_len = q.<span class=\"fn\">size</span>(-<span class=\"num\">2</span>)\n\n    <span class=\"cm\"># 1. Dot product: (Q @ K.T) / sqrt(d_k)</span>\n    scores = torch.<span class=\"fn\">matmul</span>(q, k.<span class=\"fn\">transpose</span>(-<span class=\"num\">2</span>, -<span class=\"num\">1</span>)) / math.<span class=\"fn\">sqrt</span>(d_k)\n\
    \n    <span class=\"cm\"># 2. Causal Masking (autoregressive property)</span>\n    <span class=\"kw\">if</span> mask:\n        <span class=\"cm\"># lower triangular matrix of ones</span>\n        causal_mask = torch.<span class=\"fn\">tril</span>(torch.<span class=\"fn\">ones</span>(seq_len, seq_len, device=q.device))\n        <span class=\"cm\"># replace 0s with -infinity</span>\n        scores = scores.<span class=\"fn\">masked_fill</span>(causal_mask == <span class=\"num\">0</span>, <span class=\"fn\">float</span>(<span class=\"str\">'-inf'</span>))\n\n    <span class=\"cm\"># 3. Softmax along the last dimension (keys)</span>\n    attn_weights = F.<span class=\"fn\">softmax</span>(scores, dim=-<span class=\"num\">1</span>)\n\n    <span class=\"cm\"># 4. Multiply with values</span>\n    output = torch.<span class=\"fn\">matmul</span>(attn_weights, v)\n    <span class=\"kw\">return</span> output, attn_weights\n</pre>\n</div>"
