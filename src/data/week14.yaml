- id: '97'
  day_num: 97
  title: Hugging Face Ecosystem & Advanced Tokenizers
  subtitle: "Mastering BPE, WordPiece, and the Hugging Face\n       \n        transformers\n       \n       API for distributed training and inference. We will build incredibly fast tokenization pipelines in Rust and PyTorch."
  time_estimate: 5 hours
