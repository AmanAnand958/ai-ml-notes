  hinglish: 'Speculative decoding: small ''draft'' model se candidate tokens generate karo, large model se verify karo. 2-3x speedup ho sakta hai quality maintain karte hue!'
  analogy: Imagine writing a recipe step-by-step. Sinusoidal encoding is like writing the step number at the top of the card. RoPE (Rotary Position Embeddings) is like drawing a clock hand on the card that rotates a specific angle for each step. When you compare two cards, you just check the relative angle difference between the clock hands to know how far apart the steps are, regardless of their card numbers.
  theory_html: "<h3 class=\"sh3\">\n       1. The Transformer Architecture\n      </h3>\n<figure class=\"svg-diagram\">\n<svg aria-label=\"Transformer architecture showing encoder and decoder with multi-head attention\" height=\"420\" role=\"img\" viewbox=\"0 0 700 420\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<lineargradient id=\"tr-bg_s2_s\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n<stop offset=\"0%\" stop-color=\"#1a1e2e\">\n</stop>\n<stop offset=\"100%\" stop-color=\"var(--bg)\">\n</stop>\n</lineargradient>\n</defs>\n<rect fill=\"url(#tr-bg)\" height=\"420\" rx=\"12\" width=\"700\">\n</rect>\n<text fill=\"#e6edf3\" font-family=\"DM Sans,sans-serif\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" x=\"350\" y=\"22\">\n         The Transformer Architecture\n        </text>\n<!-- ENCODER STACK (left) -->\n<rect fill=\"none\" height=\"340\" rx=\"10\" stroke=\"var(--blue, #82aaff)\" stroke-dasharray=\"6,3\" stroke-width=\"1.5\" width=\"260\" x=\"40\" y=\"45\"\
    >\n</rect>\n<text fill=\"var(--blue, #82aaff)\" font-family=\"DM Sans,sans-serif\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" x=\"170\" y=\"65\">\n         ENCODER (×N)\n        </text>\n<!-- Input Embedding -->\n<rect fill=\"#1c2333\" height=\"28\" rx=\"5\" stroke=\"#d2a8ff\" stroke-width=\"1.5\" width=\"180\" x=\"80\" y=\"340\">\n</rect>\n<text fill=\"#d2a8ff\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" text-anchor=\"middle\" x=\"170\" y=\"358\">\n         Input Embedding + Pos Encoding\n        </text>\n<line stroke=\"#6b7590\" stroke-width=\"1.2\" x1=\"170\" x2=\"170\" y1=\"340\" y2=\"320\">\n</line>\n<!-- Multi-Head Self-Attention -->\n<rect fill=\"#1c2333\" height=\"38\" rx=\"6\" stroke=\"#f0c846\" stroke-width=\"2\" width=\"180\" x=\"80\" y=\"280\">\n</rect>\n<text fill=\"#f0c846\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" font-weight=\"600\" text-anchor=\"middle\" x=\"170\" y=\"298\">\n         Multi-Head Self-Attention\n        </text>\n<text\
    \ fill=\"var(--text2)\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" text-anchor=\"middle\" x=\"170\" y=\"312\">\n         Q, K, V from same input\n        </text>\n<line stroke=\"#6b7590\" stroke-width=\"1.2\" x1=\"170\" x2=\"170\" y1=\"280\" y2=\"260\">\n</line>\n<!-- Add &amp; Norm 1 -->\n<rect fill=\"rgba(126,231,135,0.15)\" height=\"15\" rx=\"3\" width=\"120\" x=\"110\" y=\"245\">\n</rect>\n<text fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" text-anchor=\"middle\" x=\"170\" y=\"255\">\n         Add &amp; LayerNorm\n        </text>\n<line stroke=\"#6b7590\" stroke-width=\"1.2\" x1=\"170\" x2=\"170\" y1=\"245\" y2=\"225\">\n</line>\n<!-- Feed-Forward -->\n<rect fill=\"#1c2333\" height=\"38\" rx=\"6\" stroke=\"var(--blue, #82aaff)\" stroke-width=\"1.5\" width=\"180\" x=\"80\" y=\"185\">\n</rect>\n<text fill=\"var(--blue, #82aaff)\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" font-weight=\"600\" text-anchor=\"middle\" x=\"170\" y=\"203\">\n       \
    \  Feed-Forward Network\n        </text>\n<text fill=\"var(--text2)\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" text-anchor=\"middle\" x=\"170\" y=\"217\">\n         FFN(x) = ReLU(xW₁+b₁)W₂+b₂\n        </text>\n<line stroke=\"#6b7590\" stroke-width=\"1.2\" x1=\"170\" x2=\"170\" y1=\"185\" y2=\"165\">\n</line>\n<!-- Add &amp; Norm 2 -->\n<rect fill=\"rgba(126,231,135,0.15)\" height=\"15\" rx=\"3\" width=\"120\" x=\"110\" y=\"150\">\n</rect>\n<text fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" text-anchor=\"middle\" x=\"170\" y=\"160\">\n         Add &amp; LayerNorm\n        </text>\n<!-- Residual connection arrows -->\n<path d=\"M75,310 L60,310 L60,253 L108,253\" fill=\"none\" stroke=\"#7ee787\" stroke-dasharray=\"3,3\" stroke-width=\"1\">\n</path>\n<path d=\"M75,210 L60,210 L60,158 L108,158\" fill=\"none\" stroke=\"#7ee787\" stroke-dasharray=\"3,3\" stroke-width=\"1\">\n</path>\n<!-- DECODER STACK (right) -->\n<rect fill=\"none\" height=\"340\" rx=\"10\"\
    \ stroke=\"#f97583\" stroke-dasharray=\"6,3\" stroke-width=\"1.5\" width=\"280\" x=\"380\" y=\"45\">\n</rect>\n<text fill=\"#f97583\" font-family=\"DM Sans,sans-serif\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" x=\"520\" y=\"65\">\n         DECODER (×N)\n        </text>\n<!-- Output Embedding -->\n<rect fill=\"#1c2333\" height=\"28\" rx=\"5\" stroke=\"#d2a8ff\" stroke-width=\"1.5\" width=\"200\" x=\"420\" y=\"340\">\n</rect>\n<text fill=\"#d2a8ff\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" text-anchor=\"middle\" x=\"520\" y=\"358\">\n         Output Embedding + Pos Encoding\n        </text>\n<line stroke=\"#6b7590\" stroke-width=\"1.2\" x1=\"520\" x2=\"520\" y1=\"340\" y2=\"318\">\n</line>\n<!-- Masked Self-Attention -->\n<rect fill=\"#1c2333\" height=\"36\" rx=\"6\" stroke=\"#f97583\" stroke-width=\"2\" width=\"200\" x=\"420\" y=\"280\">\n</rect>\n<text fill=\"#f97583\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" font-weight=\"600\" text-anchor=\"middle\"\
    \ x=\"520\" y=\"298\">\n         Masked Self-Attention\n        </text>\n<text fill=\"var(--text2)\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" text-anchor=\"middle\" x=\"520\" y=\"310\">\n         Prevents seeing future tokens\n        </text>\n<line stroke=\"#6b7590\" stroke-width=\"1.2\" x1=\"520\" x2=\"520\" y1=\"280\" y2=\"262\">\n</line>\n<!-- Add &amp; Norm -->\n<rect fill=\"rgba(126,231,135,0.15)\" height=\"14\" rx=\"3\" width=\"120\" x=\"460\" y=\"248\">\n</rect>\n<text fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" text-anchor=\"middle\" x=\"520\" y=\"258\">\n         Add &amp; LayerNorm\n        </text>\n<line stroke=\"#6b7590\" stroke-width=\"1.2\" x1=\"520\" x2=\"520\" y1=\"248\" y2=\"228\">\n</line>\n<!-- Cross-Attention -->\n<rect fill=\"#1c2333\" height=\"36\" rx=\"6\" stroke=\"#f0c846\" stroke-width=\"2\" width=\"200\" x=\"420\" y=\"190\">\n</rect>\n<text fill=\"#f0c846\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" font-weight=\"600\"\
    \ text-anchor=\"middle\" x=\"520\" y=\"208\">\n         Cross-Attention\n        </text>\n<text fill=\"var(--text2)\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" text-anchor=\"middle\" x=\"520\" y=\"220\">\n         K,V from encoder; Q from decoder\n        </text>\n<!-- Arrow from encoder to cross-attention -->\n<path d=\"M300,155 L340,155 L340,208 L418,208\" fill=\"none\" marker-end=\"url(#arrowhead)\" stroke=\"#f0c846\" stroke-width=\"1.5\">\n</path>\n<text fill=\"#f0c846\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" x=\"345\" y=\"175\">\n         K, V\n        </text>\n<line stroke=\"#6b7590\" stroke-width=\"1.2\" x1=\"520\" x2=\"520\" y1=\"190\" y2=\"172\">\n</line>\n<!-- Add &amp; Norm -->\n<rect fill=\"rgba(126,231,135,0.15)\" height=\"14\" rx=\"3\" width=\"120\" x=\"460\" y=\"158\">\n</rect>\n<text fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" text-anchor=\"middle\" x=\"520\" y=\"168\">\n         Add &amp; LayerNorm\n        </text>\n<line\
    \ stroke=\"#6b7590\" stroke-width=\"1.2\" x1=\"520\" x2=\"520\" y1=\"158\" y2=\"138\">\n</line>\n<!-- Feed-Forward -->\n<rect fill=\"#1c2333\" height=\"36\" rx=\"6\" stroke=\"var(--blue, #82aaff)\" stroke-width=\"1.5\" width=\"200\" x=\"420\" y=\"100\">\n</rect>\n<text fill=\"var(--blue, #82aaff)\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" font-weight=\"600\" text-anchor=\"middle\" x=\"520\" y=\"118\">\n         Feed-Forward Network\n        </text>\n<line stroke=\"#6b7590\" stroke-width=\"1.2\" x1=\"520\" x2=\"520\" y1=\"100\" y2=\"82\">\n</line>\n<!-- Add &amp; Norm -->\n<rect fill=\"rgba(126,231,135,0.15)\" height=\"14\" rx=\"3\" width=\"120\" x=\"460\" y=\"72\">\n</rect>\n<text fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"7\" text-anchor=\"middle\" x=\"520\" y=\"82\">\n         Add &amp; LayerNorm\n        </text>\n<!-- Output -->\n<text fill=\"#f0c846\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" font-weight=\"600\" text-anchor=\"middle\" x=\"\
    350\" y=\"405\">\n         Input: \"The cat sat\" → Encoder → Decoder → \"Le chat assis\" (autoregressive, one token at a time)\n        </text>\n</svg>\n<figcaption>\n        The Transformer uses self-attention instead of recurrence. The encoder processes the full input; the decoder generates output tokens autoregressively with masked attention and cross-attention to the encoder.\n       </figcaption>\n</figure>\n<div class=\"mermaid\">\ngraph TD\nsubgraph \"Encoder\"\n  E1[\"Input Embeddings\"] --&gt; E2[\"Add Positional Encoding\"]\n  E2 --&gt; E3[\"Multi-Head Self Attention\"]\n  E3 --&gt; E4[\"Add and Norm\"]\n  E4 --&gt; E5[\"Feed Forward Network\"]\n  E5 --&gt; E6[\"Add and Norm\"]\nend\nsubgraph \"Decoder\"\n  D1[\"Target Embeddings\"] --&gt; D2[\"Add Positional Encoding\"]\n  D2 --&gt; D3[\"Masked Multi-Head Attention\"]\n  D3 --&gt; D4[\"Add and Norm\"]\n  E6 --&gt; D5[\"Cross-Attention\"]\n  D4 --&gt; D5\n  D5 --&gt; D6[\"Add and Norm\"]\n  D6 --&gt; D7[\"Feed Forward Network\"\
    ]\n  D7 --&gt; D8[\"Add and Norm\"]\nend\n</div>\n<h3 class=\"sh3\">\n       2. Multi-Head Attention\n      </h3>\n<p>\n       Instead of calculating a single attention distribution, Multi-Head Attention splits the embeddings into\n       <em>\n        h\n       </em>\n       heads, computes attention independently in parallel, and concatenates the results. This allows the model to simultaneously attend to different representation subspaces (e.g., one head for syntax, one head for subject-verb relationships).\n      </p>\n<h3 class=\"sh3\">\n       3. Rotary Positional Embeddings (RoPE)\n      </h3>\n<p>\n       The original Transformer used Absolute Positional Encodings (adding sine/cosine waves to token vectors). Modern LLMs (like LLaMA and Mistral) use\n       <strong>\n        RoPE\n       </strong>\n       , which encodes relative position by rotating the query and key representations in a 2D plane by an angle proportional to their absolute position.\n      </p>\n<div class=\"math-block\"\
    >\n<span class=\"formula\">\n        $$RoPE(x_m) = x_m * cos(mθ) + [-x_m(2), x_m(1)] * sin(mθ)$$\n       </span>\n<span class=\"desc\">\n        Where m is the absolute position. The inner product between two rotated vectors naturally decays relative to their distance (m - n), giving strong relative position bias.\n       </span>\n</div>\n<h3 class=\"sh3\">\n       4. Pre-LN vs Post-LN\n      </h3>\n<p>\n       Original Transformers used Post-LayerNorm (LayerNorm after residual connections). This led to severe gradient vanishing during early training, requiring a long learning rate warmup. Modern architectures (GPT-2, LLaMA) use Pre-LayerNorm (LayerNorm inside the residual block), allowing for stable training without warmup.\n      </p>\n<h3 class=\"sh3\">\n       5. Autoregressive Generation &amp; KV Caching\n      </h3>\n<p>\n       During inference, decoder models generate tokens one by one. Recomputing attention for all past tokens at every step is computationally expensive\n   \
    \    <em>\n        $O(N^2)$\n       </em>\n       .\n       <strong>\n        KV Caching\n       </strong>\n       solves this by storing the previously computed Key and Value vectors for past tokens in memory. At step\n       <em>\n        t\n       </em>\n       , we only compute the Query, Key, and Value for the new token, and append its $K$ and $V$ to the cache, reducing time complexity per step to\n       <em>\n        $O(N)$\n       </em>\n       .\n      </p>"
