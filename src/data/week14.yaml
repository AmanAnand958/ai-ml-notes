    prompt_html: "<p>\n           Write a python script that takes an array of Cross Entropy Losses (e.g.,\n           \n            [0.1, 0.5, 2.3, 5.0]\n           \n           ) and calculates the corresponding Perplexity for each. Print the results.\n          </p>"
