    solution_code: |-
      # Step 1: Model Training & Evaluation Workflow
      import faiss
      from sentence_transformers import SentenceTransformer
      import numpy as np

      model = SentenceTransformer("all-MiniLM-L6-v2")
      sentences = [
          "Machine learning is a subset of artificial intelligence.",
          "Dense embeddings capture semantic text meaning.",
          "RAG pipelines retrieve relevant document chunks.",
          "Transformers rely on parallel self-attention.",
          "FAISS indexes vectors for fast search."
      ]
      embeddings = model.encode(sentences).astype('float32')

      index = faiss.IndexFlatL2(384)
      index.add(embeddings)
      print("Total vectors indexed:", index.ntotal)

      query = "How do we fetch context for LLMs?"
      query_vector = model.encode([query]).astype('float32')

      distances, indices = index.search(query_vector, k=2)
      print("\nQuery:", query)
      for idx, dist in zip(indices[0], distances[0]):
          print(f"Match: '{sentences[idx]}' (L2 Distance: {dist:.4f})")
      assert query_vector is not None, "query_vector should not be None"
    solution_lang: python
