    bullets:
    - "<strong>\n           RAG\n          </strong>\n          retrieves relevant documents from a vector database and injects them into the LLM prompt — grounding responses in factual knowledge."
    - "<strong>\n           FAISS\n          </strong>\n          is the standard vector store — it indexes embeddings for fast approximate nearest neighbour search (ANN)."
    - "<strong>\n           Chunking strategy\n          </strong>\n          matters: too small loses context, too large dilutes relevance. Overlap chunks by 10-20% for continuity."
    - "<strong>\n           RAG evaluation:\n          </strong>\n          measure retrieval recall (did we find the right doc?) and generation quality (was the answer correct based on context?)."
