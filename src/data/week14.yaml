  tasks:
  - title: Basic Softmax Calculation
    badge: 🟢 EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p><strong>\n           Using NumPy, write a function that takes a 1D array of scores\n           \n   \
      \         [10, 20, 30]\n           \n           , applies softmax, and prints the probabilities. Then try it with\n\
      \           \n            [100, 200, 300]\n           \n           to observe numerical instability (overflow) and fix\
      \ it by subtracting the maximum value before exponentiation.\n          </strong></p>"
