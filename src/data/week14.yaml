  flashcards:
  - front: What is the Scaled Dot-Product Attention formula?
    back: Attention(Q,K,V) = softmax(Q K^T / sqrt(d_k)) V. The scaling factor sqrt(d_k) prevents dot products from growing
      large and pushing softmax into vanishing gradients.
  - front: Why does Transformer self-attention have O(N^2) complexity?
    back: Every token in a sequence of length N computes an attention score with every other token, resulting in an N x N
      attention matrix.
  - front: 'Core concept: What is the significance of WSGI vs ASGI? in The Mathematics of Scaled Dot-Product Attention?'
    back: 'WSGI: Web Server Gateway Interface (synchronous). ASGI: Asynchronous Server Gateway Interface (async, supports
