  takeaways:
    hinglish_line: "<strong>\n          Ek line mein:\n         </strong>\n         Scaled Dot-Product Attention har word ko Query, Key, aur Value matrices mein project karke unke contextual correlations calculate karta hai."
    bullets:
    - RNNs suffer from an information bottleneck; Attention solves this with an $O(1)$ path length between any two tokens.
    - Scaling by √$d_k$ is mathematically required to prevent dot products from exploding in variance and causing vanishing gradients.
    - Causal masking is achieved by replacing future token scores with -infinity before the softmax operation.
