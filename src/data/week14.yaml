    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day94: complete day 94 tasks and coding exercises"'
    sol_id: sol-w14d94t1
    solution_title: ✅ NumPy Stable Softmax Implementation
    solution_code: |-
      import numpy as np

      def softmax_naive(x):
          exps = np.exp(x)
          return exps / np.sum(exps)

      def softmax_stable(x):
          # Subtract the max value to prevent overflow (e^300 = inf)
          shifted_x = x - np.max(x)
          exps = np.exp(shifted_x)
          return exps / np.sum(exps)

      x1 = np.array([10.0, 20.0, 30.0])
      print("Naive:", softmax_naive(x1))
      print("Stable:", softmax_stable(x1))

      x2 = np.array([100.0, 200.0, 300.0])
      # print(softmax_naive(x2)) # Prints [nan, nan, nan] because of inf / inf
      print("Stable large:", softmax_stable(x2))
      assert x2 is not None, "x2 should not be None"
    solution_lang: python
  - title: $QKV$ Projections
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p><strong>\n           Create a PyTorch script with a dummy sequence\n           \n            X\n    \
      \       \n           of shape\n           \n            (batch=2, seq_len=5, d_model=16)\n           \n           .\
      \ Initialize three linear layers for $Q$, $K$, and $V$. Pass\n           \n            X\n           \n           through\
      \ them, calculate the scaled dot-product attention without a mask, and verify the output shape is exactly the same as\n\
      \           \n            X\n           \n           .\n          </strong></p>"
    done_when: "When output shape is verified as\n           \n            (2, 5, 16)\n           \n           ."
    git_cmd: 'git add q_k_v_projections.py &amp;&amp; git commit -m "feat(day): day94: q-k-v-projections"'
    sol_id: sol-w14d94t2
    solution_title: ✅ PyTorch QKV Projections &amp; Attention Flow
    solution_code: |-
      # Step 1: Model Training & Evaluation Workflow
      import torch
      import torch.nn as nn
      import math

      torch.manual_seed(42)
      B, T, d_model = 2, 5, 16
      d_k = 16

      X = torch.randn(B, T, d_model)

      W_q = nn.Linear(d_model, d_k, bias=False)
      W_k = nn.Linear(d_model, d_k, bias=False)
      W_v = nn.Linear(d_model, d_model, bias=False)

      Q = W_q(X) # (B, T, d_k)
      K = W_k(X) # (B, T, d_k)
      V = W_v(X) # (B, T, d_model)

      scores = torch.matmul(Q, K.transpose(-2, -1)) / math.sqrt(d_k) # (B, T, T)
      attn_weights = torch.softmax(scores, dim=-1)                  # (B, T, T)
      output = torch.matmul(attn_weights, V)                         # (B, T, d_model)

      print("Input shape:", X.shape)
      print("Output shape:", output.shape)
      assert output.shape == X.shape
    solution_lang: python
  - title: Implement FlashAttention Concept (Tiling)
    badge: 🔴 HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p><strong>\n           Standard attention has\n           \n            O(N^2)\n           \n         \
      \  memory complexity. FlashAttention avoids this by block-tiling the computation. Write a naive PyTorch implementation\
      \ of block-wise attention (without fused CUDA kernels). Loop over chunks of queries (size\n           \n           \
      \ B_q\n           \n           ) and chunks of keys/values (size\n           \n            B_k\n           \n      \
      \     ) to compute the softmax incrementally using the online softmax trick, never instantiating the full\n        \
      \   \n            N x N\n           \n           matrix.\n          </strong></p>"
    done_when: Your chunked attention output matches the standard PyTorch attention output to within 1e-5 tolerance.
    git_cmd: 'git add implement_flashattention_concept_tiling.py &amp;&amp; git commit -m "feat(day): day94: implement-flashattention-concept-tiling"'
    sol_id: sol-w14d94t3
    solution_title: ✅ Naive Tiled FlashAttention Implementation
    solution_code: |-
      import numpy as np
      import torch
      np.random.seed(42)
      torch.manual_seed(42)
      # Step 1: Algorithmic Implementation & Core Transformations
      import torch
      import math

      def flash_attention_naive(Q, K, V, B_q=2, B_k=2):
          T, d = Q.shape
          O = torch.zeros(T, d)
          L = torch.zeros(T, 1)
          M = torch.fill(torch.zeros(T, 1), float('-inf'))

          for i in range(0, T, B_q):
              q_block = Q[i:i+B_q]

              for j in range(0, T, B_k):
                  k_block = K[j:j+B_k]
                  v_block = V[j:j+B_k]

                  S = torch.matmul(q_block, k_block.t()) / math.sqrt(d)
                  m_block = torch.max(S, dim=-1, keepdim=True)[0]

                  new_M = torch.max(M[i:i+B_q], m_block)
                  exp_old = torch.exp(M[i:i+B_q] - new_M)
                  exp_new = torch.exp(S - new_M)

                  new_L = exp_old * L[i:i+B_q] + torch.sum(exp_new, dim=-1, keepdim=True)
                  O[i:i+B_q] = (O[i:i+B_q] * exp_old * L[i:i+B_q] + torch.matmul(exp_new, v_block)) / new_L

                  L[i:i+B_q] = new_L
                  M[i:i+B_q] = new_M

          return O

      Q = torch.randn(6, 8)
      K = torch.randn(6, 8)
      V = torch.randn(6, 8)

      standard_attn = torch.softmax(torch.matmul(Q, K.t()) / math.sqrt(8), dim=-1) @ V
      tiled_attn = flash_attention_naive(Q, K, V)

      print("Max Difference:", torch.max(torch.abs(standard_attn - tiled_attn)).item())
      assert tiled_attn is not None, "tiled_attn should not be None"
    solution_lang: python
