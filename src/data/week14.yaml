  takeaways:
    hinglish_line: "<strong>\n          Ek line mein:\n         </strong>\n         RoPE (Rotary Embeddings) positional info ko features vector space mein rotate karke store karta hai, jisse model tokens ke beech ki relative doori ko behtar samajhta hai."
    bullets:
