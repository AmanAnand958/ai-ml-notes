  flashcards:
  - front: What is the purpose of Pre-LayerNorm (Pre-LN) in modern Transformers?
    back: Normalizing layer inputs before multi-head attention and MLP blocks stabilizes gradient flow, enabling training very deep networks without warmup instability.
  - front: Why do models like LLaMA and Gemma use RMSNorm instead of standard LayerNorm?
    back: RMSNorm eliminates mean centering and only normalizes by Root Mean Square, saving compute while maintaining identical training stability.
