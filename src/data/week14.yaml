  tasks:
  - title: Multi-Head Split
    badge: 🟢 EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n           In PyTorch, create a tensor\n           \n            x\n           \n           of shape\n           \n            (batch=2, seq_len=10, d_model=512)\n           \n           . Write code to reshape and transpose this tensor so that it is split into\n           \n            h=8\n           \n           heads. The final shape should be\n           \n            (batch, num_heads, seq_len, head_dim)\n           \n           .\n          </p>"
    done_when: "Your tensor successfully reshapes to\n           \n            (2, 8, 10, 64)\n           \n           ."
    git_cmd: 'git add . &amp;&amp; git commit -m "day95: complete day 95 tasks and coding exercises"'
    sol_id: sol-d95t1
    solution_title: ✅ Multi-Head Reshaping &amp; Transposition
    solution_code: '<span class="cm"># Step 1: Model Training &amp; Evaluation Workflow</span>

      <span class="kw">import</span> torch


      B, T, d_model = <span class="num">2</span>, <span class="num">10</span>, <span class="num">512</span>

      h = <span class="num">8</span>

      head_dim = d_model // h


      x = torch.<span class="fn">randn</span>(B, T, d_model)

      x_split = x.<span class="fn">view</span>(B, T, h, head_dim)

      x_final = x_split.<span class="fn">transpose</span>(<span class="num">1</span>, <span class="num">2</span>)


      <span class="fn">print</span>(<span class="str">"Original shape:"</span>, x.shape)

      <span class="fn">print</span>(<span class="str">"Reshaped shape:"</span>, x_split.shape)

      <span class="fn">print</span>(<span class="str">"Final shape:   "</span>, x_final.shape)

      <span class="kw">assert</span> x_final.shape == (B, h, T, head_dim)'
    solution_lang: python — multi_head_split.py
  - title: KV Cache Implementation
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n           Write a simplified\n           \n            DecoderBlock\n           \n           class. Add an argument\n           \n            past_key_values=None\n           \n           . Inside the forward pass, if\n           \n            past_key_values\n           \n           is provided, concatenate the current step's $K$ and $V$ with the past $K$ and $V$ along the sequence length dimension, and return the new cache for the next step.\n          </p>"
    done_when: Your model successfully generates sequence step-by-step using cached values, avoiding recomputation.
    git_cmd: 'git add kv_cache_implementation.py &amp;&amp; git commit -m "day95: kv-cache-implementation"'
    sol_id: sol-d95t2
    solution_title: ✅ Simplified Decoder Causal Attention with KV Caching
    solution_code: "<span class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core Transformations</span>\n<span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n<span class=\"kw\">import</span> math\n\n<span class=\"kw\">class</span> <span class=\"cls\">CausalSelfAttentionWithCache</span>(nn.Module):\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, d_model, n_heads):\n        <span class=\"fn\">super</span>().<span class=\"fn\">__init__</span>()\n        <span class=\"kw\">self</span>.d_model = d_model\n        <span class=\"kw\">self</span>.n_heads = n_heads\n        <span class=\"kw\">self</span>.head_dim = d_model // n_heads\n\n        <span class=\"kw\">self</span>.q_proj = nn.<span class=\"fn\">Linear</span>(d_model, d_model, bias=<span class=\"kw\">False</span>)\n        <span class=\"kw\">self</span>.k_proj = nn.<span class=\"fn\">Linear</span>(d_model, d_model, bias=<span\
      \ class=\"kw\">False</span>)\n        <span class=\"kw\">self</span>.v_proj = nn.<span class=\"fn\">Linear</span>(d_model, d_model, bias=<span class=\"kw\">False</span>)\n        <span class=\"kw\">self</span>.out_proj = nn.<span class=\"fn\">Linear</span>(d_model, d_model, bias=<span class=\"kw\">False</span>)\n\n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\">self</span>, x, past_key_values=<span class=\"kw\">None</span>):\n        B, T, C = x.shape\n        q = <span class=\"kw\">self</span>.<span class=\"fn\">q_proj</span>(x).<span class=\"fn\">view</span>(B, T, <span class=\"kw\">self</span>.n_heads, <span class=\"kw\">self</span>.head_dim).<span class=\"fn\">transpose</span>(<span class=\"num\">1</span>, <span class=\"num\">2</span>)\n        k = <span class=\"kw\">self</span>.<span class=\"fn\">k_proj</span>(x).<span class=\"fn\">view</span>(B, T, <span class=\"kw\">self</span>.n_heads, <span class=\"kw\">self</span>.head_dim).<span class=\"\
      fn\">transpose</span>(<span class=\"num\">1</span>, <span class=\"num\">2</span>)\n        v = <span class=\"kw\">self</span>.<span class=\"fn\">v_proj</span>(x).<span class=\"fn\">view</span>(B, T, <span class=\"kw\">self</span>.n_heads, <span class=\"kw\">self</span>.head_dim).<span class=\"fn\">transpose</span>(<span class=\"num\">1</span>, <span class=\"num\">2</span>)\n\n        <span class=\"kw\">if</span> past_key_values <span class=\"kw\">is</span> <span class=\"kw\">not</span> <span class=\"kw\">None</span>:\n            past_k, past_v = past_key_values\n            k = torch.<span class=\"fn\">cat</span>([past_k, k], dim=-<span class=\"num\">2</span>)\n            v = torch.<span class=\"fn\">cat</span>([past_v, v], dim=-<span class=\"num\">2</span>)\n\n        new_past_key_values = (k, v)\n        total_T = k.<span class=\"fn\">size</span>(-<span class=\"num\">2</span>)\n\n        scores = torch.<span class=\"fn\">matmul</span>(q, k.<span class=\"fn\">transpose</span>(-<span\
      \ class=\"num\">2</span>, -<span class=\"num\">1</span>)) / math.<span class=\"fn\">sqrt</span>(<span class=\"kw\">self</span>.head_dim)\n        causal_mask = torch.<span class=\"fn\">tril</span>(torch.<span class=\"fn\">ones</span>(T, total_T, device=x.device))\n        scores = scores.<span class=\"fn\">masked_fill</span>(causal_mask == <span class=\"num\">0</span>, <span class=\"fn\">float</span>(<span class=\"str\">'-inf'</span>))\n\n        attn = torch.<span class=\"fn\">softmax</span>(scores, dim=-<span class=\"num\">1</span>)\n        out = torch.<span class=\"fn\">matmul</span>(attn, v).<span class=\"fn\">transpose</span>(<span class=\"num\">1</span>, <span class=\"num\">2</span>).<span class=\"fn\">contiguous</span>().<span class=\"fn\">view</span>(B, T, C)\n        <span class=\"kw\">return</span> <span class=\"kw\">self</span>.<span class=\"fn\">out_proj</span>(out), new_past_key_values"
    solution_lang: python — kv_cache_attn.py
  - title: Implement RoPE from Scratch
    badge: 🔴 HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n           Implement the\n           \n            apply_rotary_emb(q, k, freqs_cis)\n           \n           function in PyTorch as described in the RoPE paper. You will need to reshape vectors into complex numbers (\n           \n            torch.view_as_complex\n           \n           ), multiply by complex exponentials of frequencies, and cast back to real tensors (\n           \n            torch.view_as_real\n           \n           ).\n          </p>"
    done_when: You successfully rotate the embeddings and verify that the dot product decays predictably as distance increases.
    git_cmd: 'git add implement_rope_from_scratch.py &amp;&amp; git commit -m "day95: implement-rope-from-scratch"'
    sol_id: sol-d95t3
    solution_title: ✅ Rotary Positional Embeddings (RoPE) Implementation
    solution_code: "<span class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core Transformations</span>\n<span class=\"kw\">import</span> torch\n\n<span class=\"kw\">def</span> <span class=\"fn\">precompute_freqs_cis</span>(dim, end, theta=<span class=\"num\">10000.0</span>):\n    freqs = <span class=\"num\">1.0</span> / (theta ** (torch.<span class=\"fn\">arange</span>(<span class=\"num\">0</span>, dim, <span class=\"num\">2</span>)[: (dim // <span class=\"num\">2</span>)].<span class=\"fn\">float</span>() / dim))\n    t = torch.<span class=\"fn\">arange</span>(end, device=freqs.device)\n    freqs = torch.<span class=\"fn\">outer</span>(t, freqs).<span class=\"fn\">float</span>()\n    freqs_cis = torch.<span class=\"fn\">polar</span>(torch.<span class=\"fn\">ones_like</span>(freqs), freqs)\n    <span class=\"kw\">return</span> freqs_cis\n\n<span class=\"kw\">def</span> <span class=\"fn\">apply_rotary_emb</span>(xq, xk, freqs_cis):\n    xq_ = torch.<span class=\"fn\">view_as_complex</span>(xq.<span\
      \ class=\"fn\">float</span>().<span class=\"fn\">reshape</span>(*xq.shape[:-<span class=\"num\">1</span>], -<span class=\"num\">1</span>, <span class=\"num\">2</span>))\n    xk_ = torch.<span class=\"fn\">view_as_complex</span>(xk.<span class=\"fn\">float</span>().<span class=\"fn\">reshape</span>(*xk.shape[:-<span class=\"num\">1</span>], -<span class=\"num\">1</span>, <span class=\"num\">2</span>))\n    freqs_cis = freqs_cis.<span class=\"fn\">view</span>(<span class=\"num\">1</span>, xq_.<span class=\"fn\">size</span>(<span class=\"num\">1</span>), <span class=\"num\">1</span>, xq_.<span class=\"fn\">size</span>(<span class=\"num\">3</span>))\n    xq_out = torch.<span class=\"fn\">view_as_real</span>(xq_ * freqs_cis).<span class=\"fn\">flatten</span>(<span class=\"num\">3</span>)\n    xk_out = torch.<span class=\"fn\">view_as_real</span>(xk_ * freqs_cis).<span class=\"fn\">flatten</span>(<span class=\"num\">3</span>)\n    <span class=\"kw\">return</span> xq_out.<span class=\"fn\"\
      >type_as</span>(xq), xk_out.<span class=\"fn\">type_as</span>(xk)"
    solution_lang: python — rope.py
