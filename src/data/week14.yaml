- id: 98
  day_num: 98
  title: Parameter-Efficient Fine-Tuning (PEFT) & LoRA
  subtitle: Fine-tuning 7B+ parameter models is impossible on consumer GPUs. Today we study LoRA (Low-Rank Adaptation) and
    how to freeze base models while injecting trainable low-rank matrices. We also explore QLoRA for 4-bit quantization.
  time_estimate: 4 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - 'Apply: Mathematically understand the Intrinsic Rank Hypothesis.'
  - Formulate the Low-Rank Adaptation (LoRA) update equations.
  - Implement a custom LoRA layer natively in PyTorch.
  - "Apply: Utilize the Hugging Face\n        \n         peft\n        \n        library for rapid LLM adaptation."
  checklist:
  - id: chk_98_1
    text: Derive and analyze mathematical and architectural principles for Parameter-Efficient Fine-Tuning (PEFT) & LoRA
  - id: chk_98_2
    text: Build and benchmark production coding pipelines for Parameter-Efficient Fine-Tuning (PEFT) & LoRA
  - id: chk_98_3
    text: Execute and validate test verification suite for Initialize PEFT config
  - id: chk_98_4
    text: Evaluate conceptual mastery via interactive flashcards and quiz challenges
  concept_flow:
  - The Mathematics of Scaled Dot-Product Attention
  - Transformer Architecture & Modern Positional Encodings (RoPE)
  - 'Day 96 — BERT: Bidirectional Encoder Representations from Transformers'
  - Hugging Face Ecosystem & Advanced Tokenizers
  - Parameter-Efficient Fine-Tuning (PEFT) & LoRA
  - 'Capstone Part 1: Advanced Information Retrieval (RAG)'
  - 'Capstone Part 2: Deployment & Model Serving'
  hinglish: 'BART denoising autoencoder hai: corrupted text ko original mein reconstruct karo. Summarization aur translation
    ke liye state-of-the-art results deta hai pre-training ke baad!'
  analogy: Decoder-only models (like GPT-2) are like playing word association games where you are only allowed to look at
    the words already spoken. You must write the next word using a causal mask that hides all future cards in the deck, forcing
    the model to generate one step at a time. (This mirrors how Parameter fundamentally operates.)
  theory_html: |
    <h3 class="sh3">
           1. The Need for PEFT
          </h3>
    <p>
           Full fine-tuning requires updating and storing optimizer states for every parameter. For a 7B model, Adam optimizer states take 14GB of VRAM on top of the model weights. Parameter-Efficient Fine-Tuning (PEFT) methods reduce trainable parameters by &gt;99% while maintaining 90-100% of performance.
          </p>
    <h3 class="sh3">
           2. LoRA (Low-Rank Adaptation)
          </h3>
    <p>
           LoRA hypothesizes that the change in weights (ΔW) during fine-tuning has a low "intrinsic rank". Instead of updating the massive weight matrix
           <em>
            $W$ ∈ ℝ^(d × k)
           </em>
           directly, we freeze
           <em>
            $W$
           </em>
           and inject trainable rank decomposition matrices
           <em>
            A ∈ ℝ^(d × r)
           </em>
           and
           <em>
            B ∈ ℝ^(r × k)
           </em>
           , where
           <em>
            r ≪ min(d, k)
           </em>
           .
          </p>
    <div class="math-block">
    <span class="formula">
            $$h = Wx + ΔWx = Wx + B(Ax)$$
           </span>
    <span class="desc">
            During inference, B and A can be multiplied together and explicitly added to $W$, resulting in zero added latency.
           </span>
    </div>
    <div class="mermaid">
    graph LR
      X["Input vector x"] --> W["Frozen Base Weight W_0\nshape: d x k"]
      X --> A["Trainable Matrix A\nshape: d x r\nRandom Gaussian Init"]
      A --> B["Trainable Matrix B\nshape: r x k\nZero Init"]
      W --> Add["Summation Node +"]
      B --> Scale["Scale by alpha/r"]
      Scale --> Add
      Add --> Out["Output vector h"]
    </div>

    <h3 class="sh3">
           3. QLoRA (Quantized LoRA)
          </h3>
    <p>
           By loading the base model in 4-bit NormalFloat (NF4) quantization and utilizing Double Quantization and Paged Optimizers, QLoRA allows fine-tuning a 65B parameter model on a single 48GB GPU without performance degradation.
          </p>
