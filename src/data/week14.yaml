  tasks:
  - title: Use HF Tokenizer API
    badge: 🟢 EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n           Using\n           \n            transformers.AutoTokenizer\n           \n           , load the\n           \n            bert-base-uncased\n           \n           tokenizer. Encode the sentence \"I love machine learning!\" and print the resulting\n           \n            input_ids\n           \n           and\n           \n            attention_mask\n           \n           .\n          </p>"
    done_when: You successfully print the dictionary of tensor arrays.
    git_cmd: 'git add . &amp;&amp; git commit -m "day97: complete day 97 tasks and coding exercises"'
    sol_id: sol-d97t1
    solution_title: ✅ Hugging Face AutoTokenizer Encoding
    solution_code: '<span class="kw">from</span> transformers <span class="kw">import</span> AutoTokenizer


      tokenizer = AutoTokenizer.<span class="fn">from_pretrained</span>(<span class="str">"bert-base-uncased"</span>)

