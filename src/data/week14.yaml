    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n           Add 5 new domain-specific tokens (e.g., \"[GENOMICS]\", \"[CRISPR]\") to an existing tokenizer's vocabulary. Resize a pre-trained model's embedding layer to accommodate the new vocabulary size without crashing.\n          </p>"
    done_when: Your model successfully processes the new tokens without index out of bounds errors.
    git_cmd: 'git add handle_oov_with_special_tokens.py &amp;&amp; git commit -m "day97: handle-oov-with-special-tokens"'
    sol_id: sol-d97t2
    solution_title: ✅ Adding OOV Tokens &amp; Resizing Embedding Layers
    solution_code: '<span class="cm"># Step 1: Model Training &amp; Evaluation Workflow</span>

      <span class="kw">from</span> transformers <span class="kw">import</span> AutoTokenizer, AutoModelForCausalLM

      <span class="kw">import</span> torch


      tokenizer = AutoTokenizer.<span class="fn">from_pretrained</span>(<span class="str">"gpt2"</span>)

      model = AutoModelForCausalLM.<span class="fn">from_pretrained</span>(<span class="str">"gpt2"</span>)


      new_tokens = [<span class="str">"[GENOMICS]", "[CRISPR]", "[SEQUENCING]", "[PROTEOMICS]", "[CELLULAR]"</span>]

      num_added = tokenizer.<span class="fn">add_tokens</span>(new_tokens)

      <span class="fn">print</span>(<span class="str">f"Added {num_added} new tokens."</span>)


      model.<span class="fn">resize_token_embeddings</span>(<span class="fn">len</span>(tokenizer))

      <span class="fn">print</span>(<span class="str">"New vocabulary size:"</span>, <span class="fn">len</span>(tokenizer))


      inputs = <span class="fn">tokenizer</span>(<span class="str">"Testing [CRISPR] engineering.", return_tensors="pt"</span>)

      outputs = <span class="fn">model</span>(**inputs)

      <span class="fn">print</span>(<span class="str">"Logits shape:"</span>, outputs.logits.shape)'
    solution_lang: python — add_tokens.py
  - title: Train a Custom BPE Tokenizer
    badge: 🔴 HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n           Using the\n           \n            tokenizers\n           \n           library (not\n           \n            transformers\n           \n           ), build and train a BPE tokenizer from scratch on a downloaded Wikipedia text corpus. Define the normalizer (NFKC), pre-tokenizer (ByteLevel), and train it with a vocab size of 10,000. Save it and load it back using\n           \n            PreTrainedTokenizerFast\n           \n           .\n          </p>"
    done_when: Your custom tokenizer correctly chunks large texts into subwords based on your specific corpus.
    git_cmd: 'git add train_a_custom_bpe_tokenizer.py &amp;&amp; git commit -m "day97: train-a-custom-bpe-tokenizer"'
    sol_id: sol-d97t3
    solution_title: ✅ Custom BPE Tokenizer Pipeline from Scratch
    solution_code: "<span class=\"cm\"># Step 1: Model Training &amp; Evaluation Workflow</span>\n<span class=\"kw\">from</span> tokenizers <span class=\"kw\">import</span> Tokenizer, normalizers, pre_tokenizers\n<span class=\"kw\">from</span> tokenizers.models <span class=\"kw\">import</span> BPE\n<span class=\"kw\">from</span> tokenizers.trainers <span class=\"kw\">import</span> BpeTrainer\n<span class=\"kw\">from</span> transformers <span class=\"kw\">import</span> PreTrainedTokenizerFast\n\n<span class=\"kw\">with</span> <span class=\"fn\">open</span>(<span class=\"str\">\"corpus.txt\", \"w\"</span>) <span class=\"kw\">as</span> f:\n    f.<span class=\"fn\">write</span>(<span class=\"str\">\"Machine learning is a subset of artificial intelligence.\\n\"</span>)\n    f.<span class=\"fn\">write</span>(<span class=\"str\">\"Deep learning models are based on neural networks.\\n\"</span>)\n    f.<span class=\"fn\">write</span>(<span class=\"str\">\"Hugging Face is a library for natural language\
      \ processing.\\n\"</span>)\n\ntokenizer = <span class=\"fn\">Tokenizer</span>(<span class=\"fn\">BPE</span>(unk_token=<span class=\"str\">\"[UNK]\"</span>))\ntokenizer.normalizer = normalizers.<span class=\"fn\">Sequence</span>([normalizers.<span class=\"fn\">NFKC</span>(), normalizers.<span class=\"fn\">Lowercase</span>()])\ntokenizer.pre_tokenizer = pre_tokenizers.<span class=\"fn\">ByteLevel</span>(add_prefix_space=<span class=\"kw\">True</span>)\n\ntrainer = <span class=\"fn\">BpeTrainer</span>(vocab_size=<span class=\"num\">10000</span>, special_tokens=[<span class=\"str\">\"[UNK]\", \"[CLS]\", \"[SEP]\", \"[PAD]\", \"[MASK]\"</span>])\ntokenizer.<span class=\"fn\">train</span>([<span class=\"str\">\"corpus.txt\"</span>], trainer)\ntokenizer.<span class=\"fn\">save</span>(<span class=\"str\">\"custom_bpe.json\"</span>)\n\nfast_tokenizer = <span class=\"fn\">PreTrainedTokenizerFast</span>(tokenizer_file=<span class=\"str\">\"custom_bpe.json\", unk_token=\"[UNK]\"</span>)\n<span\
      \ class=\"fn\">print</span>(<span class=\"str\">\"Encoding test:\", fast_tokenizer.encode(\"natural language processing\"</span>))"
    solution_lang: python — train_bpe.py
  quizzes:
  - num_str: Q1 OF 5
    question: Which tokenization algorithm merges pairs based on the highest frequency of occurrence?
    qid: q97_1
    options:
    - letter: A
      text: Byte Pair Encoding (BPE)
      is_correct: true
    - letter: B
      text: WordPiece
      is_correct: false
    - letter: C
      text: Unigram / SentencePiece
      is_correct: false
    - letter: D
      text: WhiteSpace Tokenization
      is_correct: false
    correct_fb: ✅ Correct! BPE greedily merges the most frequent pairs.
    wrong_fb: ❌ Incorrect. WordPiece uses likelihood. What uses pure frequency?
  - num_str: Q2 OF 5
    question: Why does SentencePiece (Unigram) start with a huge vocabulary and prune it, rather than building it up from characters?
    qid: q97_2
    options:
    - letter: A
      text: It is faster to compute.
      is_correct: false
    - letter: B
      text: It allows a probabilistic approach, keeping tokens that maximize the overall likelihood of the corpus.
      is_correct: true
    - letter: C
      text: It uses less memory.
      is_correct: false
    - letter: D
      text: It requires no training data.
      is_correct: false
    correct_fb: ✅ Correct! Unigram calculates how much the total corpus probability would drop if a token was removed, pruning the least impactful ones.
    wrong_fb: ❌ Incorrect. Unigram is a probabilistic model.
  - num_str: Q3 OF 5
    question: What is the role of the 'Normalizer' in the Hugging Face tokenizer pipeline?
    qid: q97_3
    options:
    - letter: A
      text: It injects [CLS] and [SEP] tokens.
      is_correct: false
    - letter: B
      text: It converts token IDs back to strings.
      is_correct: false
    - letter: C
      text: It cleans the text (e.g., lowercasing, unicode normalization) before any splitting occurs.
      is_correct: true
    - letter: D
      text: It applies LayerNorm to the embeddings.
      is_correct: false
    correct_fb: ✅ Correct! Normalization is the very first step to ensure standard text encoding.
    wrong_fb: ❌ Incorrect. LayerNorm is for the neural network. Tokenizers just process text.
  - num_str: Q4 OF 5
    question: Why are Hugging Face fast tokenizers written in Rust?
    qid: q97_4
    options:
    - letter: A
      text: Rust is the only language that supports regex.
      is_correct: false
    - letter: B
      text: It natively compiles to CUDA.
      is_correct: false
    - letter: C
      text: It provides memory safety and aggressive multi-threading, massively speeding up processing of huge datasets.
      is_correct: true
    - letter: D
      text: It prevents out of vocabulary errors.
      is_correct: false
    correct_fb: ✅ Correct! Rust's fearless concurrency allows HF tokenizers to chew through GBs of text in seconds.
    wrong_fb: ❌ Incorrect. It's about performance and safety.
  - num_str: Q5 OF 5
    question: What does a 'Pre-tokenizer' typically do?
    qid: q97_5
    options:
    - letter: A
      text: Splits text by whitespaces and punctuation to ensure subwords don't cross word boundaries.
      is_correct: true
    - letter: B
      text: Adds the [MASK] token.
      is_correct: false
    - letter: C
      text: Predicts the next word.
      is_correct: false
    - letter: D
      text: Drops stopwords from the sentence.
      is_correct: false
    correct_fb: ✅ Correct! We don't want a subword to span across a space and part of the next word. Pre-tokenization prevents this.
    wrong_fb: ❌ Incorrect. Pre-tokenizer dictates the boundaries before the BPE/WordPiece algorithm runs.
  flashcards:
  - front: How does Byte Pair Encoding (BPE) tokenize out-of-vocabulary words?
