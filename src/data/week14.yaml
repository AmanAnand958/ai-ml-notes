    - "<strong>\n           Attention mask\n          </strong>\n          tells the model which tokens are real (1) vs padding (0). Without it, the model attends to meaningless padding tokens."
    - "<strong>\n           Hugging Face tokenizers\n          </strong>\n          are fast (Rust-backed) and handle alignment between input strings and token IDs for tasks like NER and QA."
