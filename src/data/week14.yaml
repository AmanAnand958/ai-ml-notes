    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p><strong>\n           Implement the\n           \n            apply_rotary_emb(q, k, freqs_cis)\n    \
      \       \n           function in PyTorch as described in the RoPE paper. You will need to reshape vectors into complex\
      \ numbers (\n           \n            torch.view_as_complex\n           \n           ), multiply by complex exponentials\
      \ of frequencies, and cast back to real tensors (\n           \n            torch.view_as_real\n           \n      \
      \     ).\n          </strong></p>"
    done_when: When you successfully rotate the embeddings and verify that the dot product decays predictably as distance
