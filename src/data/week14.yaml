  - title: Train a Custom BPE Tokenizer
    badge: 🔴 HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p><strong>\n           Using the\n           \n            tokenizers\n           \n           library\
      \ (not\n           \n            transformers\n           \n           ), build and train a BPE tokenizer from scratch\
      \ on a downloaded Wikipedia text corpus. Define the normalizer (NFKC), pre-tokenizer (ByteLevel), and train it with\
      \ a vocab size of 10,000. Save it and load it back using\n           \n            PreTrainedTokenizerFast\n       \
      \    \n           .\n          </strong></p>"
    done_when: Your custom tokenizer correctly chunks large texts into subwords based on your specific corpus.
    git_cmd: 'git add train_a_custom_bpe_tokenizer.py &amp;&amp; git commit -m "feat(day): day97: train-a-custom-bpe-tokenizer"'
    sol_id: sol-w14d97t3
    solution_title: ✅ Custom BPE Tokenizer Pipeline from Scratch
    solution_code: |-
      # Step 1: Model Training & Evaluation Workflow
      from tokenizers import Tokenizer, normalizers, pre_tokenizers
      from tokenizers.models import BPE
      from tokenizers.trainers import BpeTrainer
      from transformers import PreTrainedTokenizerFast

      with open("corpus.txt", "w") as f:
          f.write("Machine learning is a subset of artificial intelligence.\n")
          f.write("Deep learning models are based on neural networks.\n")
          f.write("Hugging Face is a library for natural language processing.\n")

      tokenizer = Tokenizer(BPE(unk_token="[UNK]"))
      tokenizer.normalizer = normalizers.Sequence([normalizers.NFKC(), normalizers.Lowercase()])
      tokenizer.pre_tokenizer = pre_tokenizers.ByteLevel(add_prefix_space=True)

      trainer = BpeTrainer(vocab_size=10000, special_tokens=["[UNK]", "[CLS]", "[SEP]", "[PAD]", "[MASK]"])
      tokenizer.train(["corpus.txt"], trainer)
      tokenizer.save("custom_bpe.json")

      fast_tokenizer = PreTrainedTokenizerFast(tokenizer_file="custom_bpe.json", unk_token="[UNK]")
      print("Encoding test:", fast_tokenizer.encode("natural language processing"))
      assert fast_tokenizer is not None, "fast_tokenizer should not be None"
    solution_lang: python
