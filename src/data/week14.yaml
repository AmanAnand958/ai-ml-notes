  - num_str: Q2 OF 5
    question: Why is Pre-LayerNorm preferred in modern LLMs over Post-LayerNorm?
    qid: q95_2
    options:
    - letter: A
      text: It prevents gradient vanishing and allows for stable training without long learning rate warmups.
      is_correct: true
    - letter: B
      text: It uses less VRAM.
      is_correct: false
    - letter: C
      text: It increases the context window size.
      is_correct: false
    - letter: D
      text: It makes the model exactly translation-invariant.
      is_correct: false
    correct_fb: ✅ Correct! Post-LN suffers from vanishing gradients near the output layer, requiring careful warmup schedules. Pre-LN keeps the residual stream clean.
    wrong_fb: ❌ Incorrect. Pre-LN affects gradient flow, not memory or context window size.
  - num_str: Q3 OF 5
    question: How does KV Caching improve autoregressive generation speed?
    qid: q95_3
    options:
    - letter: A
      text: It quantizes weights to 4-bit.
      is_correct: false
    - letter: B
      text: It predicts multiple tokens at once.
      is_correct: false
    - letter: C
      text: It saves previously computed Keys and Values so they don't have to be recalculated at every token step.
      is_correct: true
    - letter: D
      text: It caches the final softmax probabilities.
      is_correct: false
    correct_fb: ✅ Correct! By caching $K$ and $V$, we avoid $O(N^2)$ recalculation at every step, dropping the cost to $O(N)$ per step.
    wrong_fb: ❌ Incorrect. KV caching is about avoiding redundant matrix multiplications for past sequence tokens.
  - num_str: Q4 OF 5
    question: What does Rotary Positional Embedding (RoPE) actually do to the feature vectors?
    qid: q95_4
    options:
    - letter: A
      text: Adds a scalar index to every dimension.
      is_correct: false
    - letter: B
      text: Rotates the vectors in a 2D plane by an angle that corresponds to their absolute position.
      is_correct: true
    - letter: C
      text: Multiplies the vector by a learned diagonal matrix.
      is_correct: false
    - letter: D
      text: Concatenates position indices to the embedding.
      is_correct: false
    correct_fb: ✅ Correct! RoPE applies a rotation matrix. The dot product between two rotated vectors depends only on their relative angle (distance).
    wrong_fb: ❌ Incorrect. Think about the word "Rotary".
  - num_str: Q5 OF 5
    question: In a standard Encoder-Decoder Transformer (like T5 or standard translation model), what does Cross-Attention do?
    qid: q95_5
    options:
    - letter: A
      text: It allows the encoder to look at the decoder's future tokens.
      is_correct: false
    - letter: B
      text: It uses the Decoder's hidden states as Queries, and the Encoder's output states as Keys and Values.
      is_correct: true
    - letter: C
      text: It averages the weights of all heads together.
      is_correct: false
    - letter: D
      text: It computes attention across different batches.
      is_correct: false
    correct_fb: ✅ Correct! The decoder queries the encoder's output to "translate" or map the source context to the target context.
    wrong_fb: ❌ Incorrect. Cross-attention connects the Decoder and the Encoder.
  flashcards:
  - front: What is the difference between MHA, MQA, and GQA?
    back: Multi-Head Attention (MHA) has distinct KV heads per Q head; Multi-Query Attention (MQA) shares 1 KV head across all Q heads; Grouped-Query Attention (GQA) groups Q heads to share KV heads, balancing quality and memory bandwidth.
  - front: Why does GQA drastically reduce KV Cache memory in production LLMs?
    back: By sharing key-value projections across groups of query heads (e.g. 8 KV heads for 32 Q heads), KV cache VRAM is cut by 4x to 8x.
  - front: WSGI vs ASGI?
    back: 'WSGI: Web Server Gateway Interface (synchronous). ASGI: Asynchronous Server Gateway Interface (async, supports WebSockets).'
  - front: Docker Image?
    back: Read-only blueprint template with instructions to build a container environment (defined in a Dockerfile).
  - front: Pydantic Validation?
    back: Python library for data parsing and validation using type hints, raising clear runtime errors for invalid input schemas.
