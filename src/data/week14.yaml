  flashcards:
  - front: How does Low-Rank Adaptation (LoRA) parameterize weight updates?
    back: delta_W = (alpha / r) * (B @ A), where A in R^(r x d_in) and B in R^(d_out x r) with rank r << d. This reduces trainable
      parameters by over 99%.
  - front: Can LoRA adapters be merged into base model weights for zero-latency serving?
    back: Yes, W_final = W_base + (alpha / r) * (B @ A) allows serving the adapted model with identical latency to the base
      model.
  - front: 'Core concept: What is the significance of WSGI vs ASGI? in Capstone Part 1: Advanced Information Retrieval (RAG)?'
    back: 'WSGI: Web Server Gateway Interface (synchronous). ASGI: Asynchronous Server Gateway Interface (async, supports
      WebSockets).'
