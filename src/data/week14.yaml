  - front: How does Rotary Position Embedding (RoPE) encode token positions?
    back: RoPE rotates query and key vectors in complex 2D subspaces proportional to their position index, preserving relative distance without adding absolute embedding vectors.
  - front: What advantage does RoPE offer for context window extension?
    back: RoPE naturally generalizes to unseen sequence lengths via position interpolation (NTK-aware scaling or YaRN).
