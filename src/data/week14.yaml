- id: '99'
  day_num: 99
  title: 'Capstone Part 1: Advanced Information Retrieval (RAG)'
  subtitle: Retrieval-Augmented Generation (RAG) pipelines combine the embedding power of BERT/Sentence-Transformers with vector databases for semantic search to ground LLMs in factual reality.
  time_estimate: 8 hours
  difficulty: +200 XP
  badges:
  - label: 📈 Advanced
    variant: b
  xp: 150
  objectives:
  - Understand hallucination mitigations via RAG.
  - Implement a chunking strategy for long documents.
  - Generate dense vector embeddings using Sentence Transformers.
  - Index and query documents using FAISS (Facebook AI Similarity Search).
  checklist: []
  concept_flow:
  - The Mathematics of Scaled
  - Transformer Architecture
  - 'Day 96 — BERT: Bidirectio'
  - Hugging Face Ecosystem &
  - Parameter-Efficient Fine-
  - 'Capstone Part 1: Advanced'
  - 'Capstone Part 2: Deployme'
  hinglish: Emergent abilities large models mein unexpectedly appear hoti hain. Small models ye tasks nahi kar sakte, phir ek threshold par suddenly capability appear hoti hai — interesting aur mysterious!
  analogy: Fine-tuning is like hiring a fully trained chef who knows how to cook global cuisine (Pre-trained BERT) and teaching them the specific recipes for your local restaurant (your custom classification dataset). They learn the new task in a few hours without needing to go to culinary school again.
  theory_html: "<h3 class=\"sh3\">\n       1. The Need for RAG\n      </h3>\n<p>\n       Instead of fine-tuning a model on proprietary data (which causes hallucinations, requires constant retraining, and is very expensive), we use dense vector embeddings (generated by models like\n       \n        all-MiniLM-L6-v2\n       \n       ) to index our documents in a vector store (ChromaDB / FAISS). Upon a user query, we retrieve the Top-$K$ chunks via cosine similarity and inject them into an LLM's context window.\n      </p>\n\n<div class=\"mermaid\">\ngraph TD\nsubgraph \"1. Document Ingestion\"\n  Doc[\"Raw Documents\"] --&gt; Chunk[\"Document Chunker\"]\n  Chunk --&gt; Embed[\"Embedding Model\\nSentence-Transformers\"]\n  Embed --&gt; DB[\"FAISS Vector DB\"]\nend\nsubgraph \"2. Retrieval &amp; Generation\"\n  UserQ[\"User Query\"] --&gt; QEmbed[\"Query Embedding\"]\n  QEmbed --&gt; Search[\"FAISS Semantic Search\"]\n  DB --&gt; Search\n  Search --&gt; Context[\"Retrieve Top-K Chunks\"]\n \
    \ Context --&gt; Prompt[\"Build Prompt: Context + Query\"]\n  Prompt --&gt; LLM[\"Language Model\"]\n  LLM --&gt; Response[\"Final Answer\"]\nend\n</div>\n<h3 class=\"sh3\">\n       2. Vector Search (FAISS)\n      </h3>\n<p>\n       Doing a dot product between a query vector and 10 million document vectors is slow. FAISS utilizes algorithms like HNSW (Hierarchical Navigable Small World) graphs to perform approximate nearest neighbor search in sub-millisecond times.\n      </p>"
