  theory_html: "<h3 class=\"sh3\">\n       1. Subword Tokenization Algorithms\n      </h3>\n<p>\n       Out of Vocabulary\
    \ (OOV) issues break word-level tokenization. Modern models use subwords:\n      </p>\n<ul>\n<li>\n<strong>\n        \
    \ BPE (Byte Pair Encoding):\n        </strong>\n        Merges the most frequent pairs of bytes/characters iteratively.\
    \ Used in GPT.\n       </li>\n<li>\n<strong>\n         WordPiece:\n        </strong>\n        Merges pairs that maximize\
    \ the language model likelihood (Score = freq(ab) / (freq(a)*freq(b))). Used in BERT.\n       </li>\n<li>\n<strong>\n\
    \         SentencePiece (Unigram):\n        </strong>\n        Starts with a massive vocabulary and iteratively prunes\
    \ tokens that cause the smallest drop in total probability. Used in LLaMA / ALBERT.\n       </li>\n</ul>\n<h3 class=\"\
    sh3\">\n       2. Fast Tokenizers in Rust\n      </h3>\n<p>\n       Hugging Face's\n       \n        tokenizers\n    \
    \   \n       library is written in Rust, utilizing a highly parallelized pipeline allowing encoding of 1GB of text in\
    \ under 20 seconds. The pipeline consists of:\n      </p>\n<ul>\n<li>\n<strong>\n         Normalizer:\n        </strong>\n\
    \        Lowercases, strips accents, applies unicode normalization (NFC, NFKC).\n       </li>\n<li>\n<strong>\n      \
    \   Pre-tokenizer:\n        </strong>\n        Splits text into initial chunks (usually by whitespace and punctuation)\
    \ to restrict subword boundaries.\n       </li>\n<li>\n<strong>\n         Model:\n        </strong>\n        Applies the\
    \ actual algorithm (BPE, WordPiece) to the chunks.\n       </li>\n<li>\n<strong>\n         Post-processor:\n        </strong>\n\
    \        Injects special tokens like [CLS] and [SEP] for BERT.\n       </li>\n</ul>\n<div class=\"mermaid\">\ngraph TD\n\
    \  Raw[\"Raw Input Text\"] --> Norm[\"Normalizer\\nLowercase, Strip Accents, Unicode NFC\"]\n  Norm --> PreT[\"Pre-Tokenizer\\\
    nWhitespace and Punctuation Splitting\"]\n  PreT --> Mod[\"Model\\nBPE / WordPiece Subword Fitting\"]\n  Mod --> PostP[\"\
    Post-Processor\\nAdd CLS, SEP Special Tokens\"]\n  PostP --> Out[\"Encoded Output\\nToken IDs and Attention Mask\"]\n\
    </div>\n\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — train_tokenizer.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n \
    \        </button>\n</div>\n</div>\n<pre><code><span class=\"kw\">from</span> tokenizers <span class=\"kw\">import</span>\
    \ Tokenizer\n<span class=\"kw\">from</span> tokenizers.models <span class=\"kw\">import</span> BPE\n<span class=\"kw\"\
    >from</span> tokenizers.trainers <span class=\"kw\">import</span> BpeTrainer\n<span class=\"kw\">from</span> tokenizers.pre_tokenizers\
    \ <span class=\"kw\">import</span> Whitespace\n\n<span class=\"cm\"># 1. Initialize empty BPE model</span>\ntokenizer\
    \ = <span class=\"fn\">Tokenizer</span>(<span class=\"fn\">BPE</span>(unk_token=<span class=\"str\">\"[UNK]\"</span>))\n\
    tokenizer.pre_tokenizer = <span class=\"fn\">Whitespace</span>()\n\n<span class=\"cm\"># 2. Configure trainer</span>\n\
    trainer = <span class=\"fn\">BpeTrainer</span>(special_tokens=[<span class=\"str\">\"[UNK]\", \"[CLS]\", \"[SEP]\", \"\
    [PAD]\", \"[MASK]\"</span>])\n\n<span class=\"cm\"># 3. Train on text files</span>\nfiles = [<span class=\"str\">\"corpus.txt\"\
    </span>]\ntokenizer.<span class=\"fn\">train</span>(files, trainer)\n\n<span class=\"cm\"># 4. Save to JSON</span>\ntokenizer.<span\
    \ class=\"fn\">save</span>(<span class=\"str\">\"custom-bpe.json\"</span>)</code></pre>\n</div>"
