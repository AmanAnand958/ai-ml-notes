    sol_id: sol-d96t3
    solution_title: ✅ Pure Python BLEU Evaluator
    solution_code: "<span class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core Transformations</span>\n<span class=\"kw\">from</span> collections <span class=\"kw\">import</span> Counter\n<span class=\"kw\">import</span> math\n\n<span class=\"kw\">def</span> <span class=\"fn\">get_ngrams</span>(words, n):\n    <span class=\"kw\">return</span> [<span class=\"fn\">tuple</span>(words[i:i+n]) <span class=\"kw\">for</span> i <span class=\"kw\">in</span> <span class=\"fn\">range</span>(<span class=\"fn\">len</span>(words)-n+<span class=\"num\">1</span>)]\n\n<span class=\"kw\">def</span> <span class=\"fn\">bleu_precision</span>(candidate, reference, n):\n    cand_ngrams = <span class=\"fn\">get_ngrams</span>(candidate, n)\n    ref_ngrams = <span class=\"fn\">get_ngrams</span>(reference, n)\n    <span class=\"kw\">if</span> <span class=\"kw\">not</span> cand_ngrams:\n        <span class=\"kw\">return</span> <span class=\"num\">0.0</span>\n    cand_counts = <span class=\"fn\">Counter</span>(cand_ngrams)\n\
      \    ref_counts = <span class=\"fn\">Counter</span>(ref_ngrams)\n\n    clipped_matches = <span class=\"num\">0</span>\n    <span class=\"kw\">for</span> ngram, count <span class=\"kw\">in</span> cand_counts.<span class=\"fn\">items</span>():\n        clipped_matches += <span class=\"fn\">min</span>(count, ref_counts[ngram])\n    <span class=\"kw\">return</span> clipped_matches / <span class=\"fn\">len</span>(cand_ngrams)\n\n<span class=\"kw\">def</span> <span class=\"fn\">compute_bleu</span>(candidate_text, reference_text):\n    cand_words = candidate_text.<span class=\"fn\">lower</span>().<span class=\"fn\">split</span>()\n    ref_words = reference_text.<span class=\"fn\">lower</span>().<span class=\"fn\">split</span>()\n    p1 = <span class=\"fn\">bleu_precision</span>(cand_words, ref_words, <span class=\"num\">1</span>)\n    p2 = <span class=\"fn\">bleu_precision</span>(cand_words, ref_words, <span class=\"num\">2</span>)\n    <span class=\"kw\">if</span> p1 == <span class=\"num\"\
      >0</span> <span class=\"kw\">or</span> p2 == <span class=\"num\">0</span>:\n        <span class=\"kw\">return</span> <span class=\"num\">0.0</span>\n    c = <span class=\"fn\">len</span>(cand_words)\n    r = <span class=\"fn\">len</span>(ref_words)\n    bp = <span class=\"num\">1.0</span> <span class=\"kw\">if</span> c &gt; r <span class=\"kw\">else</span> math.<span class=\"fn\">exp</span>(<span class=\"num\">1</span> - r / c)\n    score = bp * math.<span class=\"fn\">exp</span>(<span class=\"num\">0.5</span> * math.<span class=\"fn\">log</span>(p1) + <span class=\"num\">0.5</span> * math.<span class=\"fn\">log</span>(p2))\n    <span class=\"kw\">return</span> score\n\ncand = <span class=\"str\">\"the patient was admitted to the hospital\"</span>\nref = <span class=\"str\">\"the patient was admitted to hospital\"</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"BLEU-2 Score: {compute_bleu(cand, ref):.4f}\"</span>)"
    solution_lang: python — bleu_eval.py
  quizzes:
  - num_str: Q1 OF 5
    question: Why does BERT use the 80-10-10 masking rule instead of masking 100% of the selected tokens?
    qid: q96_1
    options:
    - letter: A
      text: To prevent a train-test mismatch, because the [MASK] token never appears during inference/fine-tuning.
      is_correct: true
    - letter: B
      text: To reduce memory usage during backpropagation.
      is_correct: false
    - letter: C
      text: To force the model to learn causal dependencies.
      is_correct: false
    - letter: D
      text: To increase the perplexity of the model.
      is_correct: false
    correct_fb: ✅ Correct! If it only saw [MASK] tokens during training, it wouldn't know how to handle real words during inference.
    wrong_fb: ❌ Incorrect. Think about what the model sees during actual usage versus pre-training.
  - num_str: Q2 OF 5
    question: What architectural component prevents GPT from seeing future tokens?
    qid: q96_2
    options:
    - letter: A
      text: The 80-10-10 Masking Rule.
      is_correct: false
    - letter: B
      text: The Encoder block.
      is_correct: false
    - letter: C
      text: A Lower-Triangular Causal Mask applied before the Softmax in self-attention.
      is_correct: true
    - letter: D
      text: Post-LayerNorm.
      is_correct: false
    correct_fb: ✅ Correct! The causal mask ensures token i can only attend to tokens 0 through i.
    wrong_fb: ❌ Incorrect. GPT is an autoregressive decoder. How does a decoder hide future words?
  - num_str: Q3 OF 5
    question: If a language model achieves a Perplexity (PPL) of 1.0, what does this mean?
    qid: q96_3
    options:
    - letter: A
      text: The model is randomly guessing.
      is_correct: false
    - letter: B
      text: The model perfectly predicts the next token with 100% certainty (Cross Entropy Loss = 0).
      is_correct: true
    - letter: C
      text: The model has perfectly memorized the sequence but cannot generalize.
      is_correct: false
    - letter: D
      text: The model has failed to learn.
      is_correct: false
    correct_fb: ✅ Correct! Since PPL = e^Loss, if Loss = 0, PPL = e^0 = 1. The model is absolutely certain.
    wrong_fb: '❌ Incorrect. Think about the mathematical relationship: PPL = e^Loss.'
  - num_str: Q4 OF 5
    question: Why is ROUGE often preferred over BLEU for summarization tasks?
    qid: q96_4
    options:
    - letter: A
      text: It measures precision rather than recall.
      is_correct: false
    - letter: B
      text: It measures recall (how much of the important reference information was captured in the summary).
      is_correct: true
    - letter: C
      text: It measures perplexity directly.
      is_correct: false
    - letter: D
      text: It requires less compute to calculate.
      is_correct: false
    correct_fb: ✅ Correct! In summarization, missing a key fact (low recall) is worse than adding a little extra fluff.
    wrong_fb: ❌ Incorrect. ROUGE focuses on Recall, BLEU focuses on Precision.
  - num_str: Q5 OF 5
    question: Which finding led to the development of RoBERTa?
    qid: q96_5
    options:
    - letter: A
      text: BERT's causal mask was too restrictive.
      is_correct: false
    - letter: B
      text: BERT overfitted easily on small datasets.
      is_correct: false
    - letter: C
      text: BERT was severely undertrained, and the Next Sentence Prediction objective was actively hurting performance.
      is_correct: true
    - letter: D
      text: BERT required KV Caching.
      is_correct: false
    correct_fb: ✅ Correct! RoBERTa showed that training longer, with bigger batches, and dropping NSP yielded massive gains.
    wrong_fb: ❌ Incorrect. RoBERTa is essentially BERT but "Robustly Optimized".
