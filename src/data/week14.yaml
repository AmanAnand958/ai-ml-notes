- id: '100'
  day_num: 100
  title: 'Capstone Part 2: Deployment & Model Serving'
  subtitle: Taking your NLP models to production using FastAPI and Gradio, packaging dependencies with Docker, and pushing the final interface to Hugging Face Spaces.
  time_estimate: '6 hours (Note: High-volume day. Take 2 days to fully digest if needed) (Note: High-volume day. Take 2 days to fully digest if needed) (Note: High-volume day. Take 2 days to fully digest if needed)'
  difficulty: +300 XP
  badges:
  - label: 📈 Advanced
    variant: b
  xp: 150
  objectives:
  - Expose PyTorch models securely via asynchronous REST endpoints using FastAPI.
  - Construct an interactive chat UI using Gradio Blocks.
  - Containerize complex ML environments using Docker.
  checklist: []
  concept_flow:
  - The Mathematics of Scaled
  - Transformer Architecture
  - 'Day 96 — BERT: Bidirectio'
  - Hugging Face Ecosystem &
  - Parameter-Efficient Fine-
  - 'Capstone Part 1: Advanced'
  - 'Capstone Part 2: Deployme'
  hinglish: 'Mixed precision training (FP16 aur BF16): memory half use hoti hai, training 2-3x faster ho sakta hai. Modern hardware FP16 operations natively accelerate karta hai!'
  analogy: Hugging Face Spaces is like renting a small food stall in a busy marketplace (Hugging Face Hub). Instead of building a restaurant from scratch, you just place your menu (Gradio app) in the stall, and customers can instantly interact with it over the web.
  theory_html: "<h3 class=\"sh3\">\n       1. FastAPI for Machine Learning\n      </h3>\n<p>\n       Flask and Django are synchronous and can block when running heavy GPU inference. FastAPI leverages Python's\n       \n        asyncio\n       \n       , allowing the web server to handle thousands of requests while waiting for the GPU to finish batch processing.\n      </p>\n<h3 class=\"sh3\">\n       2. Docker Containerization\n      </h3>\n<p>\n       Dependency hell is a massive problem in ML (CUDA versions, PyTorch builds). A\n       \n        Dockerfile\n       \n       guarantees that your model runs exactly the same on an AWS server as it does on your local machine.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         Dockerfile\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n</div>\n</div>\n<pre>FROM python:<span class=\"num\">3.9</span>-slim\nWORKDIR /app\n\
    COPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY . .\nCMD [<span class=\"str\">\"uvicorn\", \"app:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"</span>]</pre>\n</div>\n<div class=\"mermaid\">\ngraph TD\n  User[\"User / Client Browser\"] --&gt;|1. Submit Query| Gradio[\"Gradio Web UI Frontend\"]\n  Gradio --&gt;|2. Async HTTP POST  or query| API[\"FastAPI Application Server\"]\nsubgraph \"Docker Container Sandbox\"\n  API --&gt;|3. Query Embeddings| DB[\"FAISS Vector Index\"]\n  DB --&gt;|4. Retrieve Context Chunks| API\n  API --&gt;|5. Context + Prompt| Model[\"Local PyTorch LLM\"]\n  Model --&gt;|6. Streamed Text Output| API\nend\n  API --&gt;|7. JSON Response| Gradio\n  Gradio --&gt;|8. Render Output| User\n</div>"
  predict:
    question: ''
    answer: 0.1%
    explanation: ''
    code: ''
  tasks:
  - title: Deploy Async FastAPI Model Server
    badge: 🔴 HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n           Wrap your Day 99 RAG system in an async FastAPI endpoint. Implement a POST route that takes a JSON query, runs the FAISS retrieval, calls the model, and returns a JSON response. Write a Dockerfile, and create a sleek Gradio front-end that connects to the FastAPI backend.\n          </p>"
    done_when: Your UI successfully pings the dockerized backend and streams the answer back.
    git_cmd: 'git add . &amp;&amp; git commit -m "day100: fastapi and docker model serving capstone"'
    sol_id: sol-d100t1
    solution_title: ✅ Full FastAPI Server, Dockerfile &amp; Gradio Client App
    solution_code: "<span class=\"kw\">from</span> fastapi <span class=\"kw\">import</span> FastAPI\n<span class=\"kw\">from</span> pydantic <span class=\"kw\">import</span> BaseModel\n<span class=\"kw\">from</span> sentence_transformers <span class=\"kw\">import</span> SentenceTransformer\n<span class=\"kw\">import</span> faiss\n\n<span class=\"cm\"># 1. Initialize high-performance asynchronous API application</span>\napp = <span class=\"fn\">FastAPI</span>()\nmodel = <span class=\"fn\">SentenceTransformer</span>(<span class=\"str\">\"all-MiniLM-L6-v2\"</span>)\n\ncorpus = [<span class=\"str\">\"FastAPI serves ML models asynchronously.\", \"Docker packages system dependencies.\", \"FAISS indices vectors in memory.\"</span>]\ncorpus_embeddings = model.<span class=\"fn\">encode</span>(corpus).<span class=\"fn\">astype</span>(<span class=\"str\">'float32'</span>)\nindex = faiss.<span class=\"fn\">IndexFlatL2</span>(<span class=\"num\">384</span>)\nindex.<span class=\"fn\">add</span>(corpus_embeddings)\n\
      \n<span class=\"kw\">class</span> <span class=\"cls\">QueryRequest</span>(BaseModel):\n    query: str\n\n<span class=\"cm\"># 2. Define prediction endpoint with Pydantic schema validation</span>\n@app.<span class=\"fn\">post</span>(<span class=\"str\">\"/query\"</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">retrieve_info</span>(request: QueryRequest):\n    q_embed = model.<span class=\"fn\">encode</span>([request.query]).<span class=\"fn\">astype</span>(<span class=\"str\">'float32'</span>)\n    _, indices = index.<span class=\"fn\">search</span>(q_embed, k=<span class=\"num\">1</span>)\n    matched_text = corpus[indices[<span class=\"num\">0</span>][<span class=\"num\">0</span>]]\n    <span class=\"kw\">return</span> {<span class=\"str\">\"context\"</span>: matched_text}"
    solution_lang: python — app.py (FastAPI App)
