  theory_html: |-
    <h3 class="sh3">
           1. Information Bottleneck in RNNs
          </h3>
    <p>
           In standard sequence-to-sequence models (e.g., LSTMs), an entire input sequence of length
           <em>
            T
           </em>
           is encoded into a fixed-dimensional context vector
           <em>
            $h_T$ ∈ ℝ^d
           </em>
           . For large
           <em>
            T
           </em>
           (e.g., 500 words), compressing a distribution of variable length into a static bounded space leads to high information loss. The Jacobian matrix of hidden states across time steps reveals exponentially decaying singular values, proving that long-term dependencies vanish.
          </p>

    <h3 class="sh3">
           2. $Q$, $K$, $V$ Projections
          </h3>
    <p>
           Attention resolves this by allowing the decoder to access a soft-addressed memory of all encoder states. We project the input embeddings
           <em>
            $X$ ∈ ℝ^(T × $d_{\text{model}}$)
           </em>
           into three distinct sub-spaces using learned weight matrices:
          </p>
    <div class="math-block">
    <span class="formula">
            $Q$ = $XW_Q$  (where $W_Q$ ∈ ℝ^($d_{\text{model}}$ × $d_k$))
           </span>
    <span class="formula">
            $K$ = $XW_K$  (where $W_K$ ∈ ℝ^($d_{\text{model}}$ × $d_k$))
           </span>
    <span class="formula">
            $V$ = $XW_V$  (where $W_V$ ∈ ℝ^($d_{\text{model}}$ × $d_v$))
           </span>
    <span class="desc">
            $Q$ represents what we are searching for, $K$ acts as the database index, and $V$ is the actual feature content.
           </span>
    </div>
    <h3 class="sh3">
           3. Deriving Scaled Dot-Product Attention
          </h3>
    <p>
           The unscaled attention scores are given by
           <em>
            S = $QK$^T
           </em>
           . If components of $Q$ and $K$ are independent random variables with mean 0 and variance 1, the dot product will have mean 0 and variance
           <em>
            $d_k$
           </em>
           . For a large
           <em>
            $d_k$
           </em>
           (e.g., 64), the variance is 64.
          </p>
    <p>
           Passing a vector with high variance into the Softmax function pushes the values to the tails of the exponential curve, where the derivative of softmax approaches zero. This causes
           <strong>
            gradient saturation
           </strong>
           and halts learning. To solve this, we scale by the standard deviation
           <em>
            √$d_k$
           </em>
           .
          </p>
    <div class="math-block">
    <span class="formula">
            $$\text{Attention}(Q, K, V) = \text{Softmax}\left( \frac{QK^T}{\sqrt{d_k}} \right) V$$
           </span>
    </div>
    <div class="mermaid">
    graph TD
      Q["Query Q"] --> M1["MatMul"]
      K["Key K"] --> T["Transpose K^T"]
      T --> M1
      M1 --> S["Scale by 1/sqrt - d_k"]
      S --> Mask["Mask optional"]
      Mask --> Softmax["Softmax"]
      Softmax --> M2["MatMul"]
      V["Value V"] --> M2
      M2 --> Out["Output Vector"]
    </div>
    <div class="table-wrap" style="overflow-x: auto; margin: 1.2rem 0; width: 100%;"><table class="concept-table">
    <thead>
    <tr>
    <th>
              Operation
             </th>
    <th>
              Complexity per Layer
             </th>
    <th>
              Sequential Operations
             </th>
    <th>
              Maximum Path Length
             </th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td>
    <strong>
               Recurrent (LSTM)
              </strong>
    </td>
    <td>
              $O(n \cdot d^2)$
             </td>
    <td>
              O(n)
             </td>
    <td>
              O(n)
             </td>
    </tr>
    <tr>
    <td>
    <strong>
               Self-Attention
              </strong>
    </td>
    <td>
              O(n^2 * d)
             </td>
    <td>
              $O(1)$
             </td>
    <td>
              $O(1)$
             </td>
    </tr>
    </tbody>
    </table></div>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — causal_attention.py
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">import</span> torch
    <span class="kw">import</span> torch.nn.functional <span class="kw">as</span> F
    <span class="kw">import</span> math

    <span class="kw">def</span> <span class="fn">causal_self_attention</span>(q, k, v, mask=<span class="kw">True</span>):
        <span class="cm"># q, k, v shapes: [batch_size, seq_len, d_k]</span>
        d_k = q.<span class="fn">size</span>(-<span class="num">1</span>)
        seq_len = q.<span class="fn">size</span>(-<span class="num">2</span>)

        <span class="cm"># 1. Dot product: (Q @ K.T) / sqrt(d_k)</span>
        scores = torch.<span class="fn">matmul</span>(q, k.<span class="fn">transpose</span>(-<span class="num">2</span>, -<span class="num">1</span>)) / math.<span class="fn">sqrt</span>(d_k)

        <span class="cm"># 2. Causal Masking (autoregressive property)</span>
        <span class="kw">if</span> mask:
            <span class="cm"># lower triangular matrix of ones</span>
            causal_mask = torch.<span class="fn">tril</span>(torch.<span class="fn">ones</span>(seq_len, seq_len, device=q.device))
            <span class="cm"># replace 0s with -infinity</span>
            scores = scores.<span class="fn">masked_fill</span>(causal_mask == <span class="num">0</span>, <span class="fn">float</span>(<span class="str">'-inf'</span>))

        <span class="cm"># 3. Softmax along the last dimension (keys)</span>
        attn_weights = F.<span class="fn">softmax</span>(scores, dim=-<span class="num">1</span>)

        <span class="cm"># 4. Multiply with values</span>
        output = torch.<span class="fn">matmul</span>(attn_weights, v)
        <span class="kw">return</span> output, attn_weights
    </code></pre>
