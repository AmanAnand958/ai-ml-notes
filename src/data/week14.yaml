  analogy: Imagine you are in a library searching for 'Indian spices'. The query (Q) is your search term. The database cards
    (K) are the index descriptions of all the books in the library. The value (V) is the actual content pages of the books.
    Self-attention does a dot-product search of Q against all Ks, finds the best matches, and pulls a weighted combination
