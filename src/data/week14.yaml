- id: '98'
  day_num: 98
  title: Parameter-Efficient Fine-Tuning (PEFT) & LoRA
  subtitle: Fine-tuning 7B+ parameter models is impossible on consumer GPUs. Today we study LoRA (Low-Rank Adaptation) and how to freeze base models while injecting trainable low-rank matrices. We also explore QLoRA for 4-bit quantization.
  time_estimate: '6 hours (Note: High-volume day. Take 2 days to fully digest if needed) (Note: High-volume day. Take 2 days to fully digest if needed) (Note: High-volume day. Take 2 days to fully digest if needed)'
  difficulty: +150 XP
  badges:
  - label: 📈 Advanced
    variant: b
  - label: LoRA Math
    variant: t
  xp: 150
  objectives:
  - Mathematically understand the Intrinsic Rank Hypothesis.
  - Formulate the Low-Rank Adaptation (LoRA) update equations.
  - Implement a custom LoRA layer natively in PyTorch.
  - "Utilize the Hugging Face\n        \n         peft\n        \n        library for rapid LLM adaptation."
  checklist: []
  concept_flow:
  - The Mathematics of Scaled
  - Transformer Architecture
  - 'Day 96 — BERT: Bidirectio'
  - Hugging Face Ecosystem &
  - Parameter-Efficient Fine-
  - 'Capstone Part 1: Advanced'
  - 'Capstone Part 2: Deployme'
  hinglish: 'BART denoising autoencoder hai: corrupted text ko original mein reconstruct karo. Summarization aur translation ke liye state-of-the-art results deta hai pre-training ke baad!'
  analogy: Decoder-only models (like GPT-2) are like playing word association games where you are only allowed to look at the words already spoken. You must write the next word using a causal mask that hides all future cards in the deck, forcing the model to generate one step at a time.
  theory_html: "<h3 class=\"sh3\">\n       1. The Need for PEFT\n      </h3>\n<p>\n       Full fine-tuning requires updating and storing optimizer states for every parameter. For a 7B model, Adam optimizer states take 14GB of VRAM on top of the model weights. Parameter-Efficient Fine-Tuning (PEFT) methods reduce trainable parameters by &gt;99% while maintaining 90-100% of performance.\n      </p>\n<h3 class=\"sh3\">\n       2. LoRA (Low-Rank Adaptation)\n      </h3>\n<p>\n       LoRA hypothesizes that the change in weights (ΔW) during fine-tuning has a low \"intrinsic rank\". Instead of updating the massive weight matrix\n       <em>\n        $W$ ∈ ℝ^(d × k)\n       </em>\n       directly, we freeze\n       <em>\n        $W$\n       </em>\n       and inject trainable rank decomposition matrices\n       <em>\n        A ∈ ℝ^(d × r)\n       </em>\n       and\n       <em>\n        B ∈ ℝ^(r × k)\n       </em>\n       , where\n       <em>\n        r ≪ min(d, k)\n       </em>\n       .\n      </p>\n\
    <div class=\"math-block\">\n<span class=\"formula\">\n        $$h = Wx + ΔWx = Wx + B(Ax)$$\n       </span>\n<span class=\"desc\">\n        During inference, B and A can be multiplied together and explicitly added to $W$, resulting in zero added latency.\n       </span>\n</div>\n<div class=\"mermaid\">\ngraph LR\n  X[\"Input vector x\"] --&gt; W[\"Frozen Base Weight W_0\\nshape: d x k\"]\n  X --&gt; A[\"Trainable Matrix A\\nshape: d x r\\nRandom Gaussian Init\"]\n  A --&gt; B[\"Trainable Matrix B\\nshape: r x k\\nZero Init\"]\n  W --&gt; Add[\"Summation Node +\"]\n  B --&gt; Scale[\"Scale by alpha/r\"]\n  Scale --&gt; Add\n  Add --&gt; Out[\"Output vector h\"]\n</div>\n\n<h3 class=\"sh3\">\n       3. QLoRA (Quantized LoRA)\n      </h3>\n<p>\n       By loading the base model in 4-bit NormalFloat (NF4) quantization and utilizing Double Quantization and Paged Optimizers, QLoRA allows fine-tuning a 65B parameter model on a single 48GB GPU without performance degradation.\n      </p>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — lora.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">from</span> peft <span class=\"kw\">import</span> LoraConfig, get_peft_model\n<span class=\"kw\">from</span> transformers <span class=\"kw\">import</span> AutoModelForCausalLM\n\n<span class=\"cm\"># Load base model</span>\nmodel = AutoModelForCausalLM.<span class=\"fn\">from_pretrained</span>(<span class=\"str\">\"meta-llama/Llama-2-7b-hf\"</span>)\n\n<span class=\"cm\"># Define LoRA Config</span>\nconfig = <span class=\"fn\">LoraConfig</span>(\n    r=<span class=\"num\">8</span>,\n    lora_alpha=<span class=\"num\">32</span>,\n    target_modules=[<span class=\"str\">\"q_proj\", \"v_proj\"</span>],\n   \
    \ lora_dropout=<span class=\"num\">0.05</span>,\n    bias=<span class=\"str\">\"none\"</span>,\n    task_type=<span class=\"str\">\"CAUSAL_LM\"</span>\n)\n\n<span class=\"cm\"># Apply LoRA</span>\npeft_model = <span class=\"fn\">get_peft_model</span>(model, config)\npeft_model.<span class=\"fn\">print_trainable_parameters</span>()\n<span class=\"cm\"># Output: trainable params: 4,194,304 || all params: 6,742,609,920 || trainable%: 0.0622</span></pre>\n</div>"
  predict:
    question: ''
    answer: (4096, 4096)
    explanation: ''
    code: ''
  tasks:
  - title: Initialize PEFT config
    badge: 🟢 EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n           Using the Hugging Face\n           \n            peft\n           \n           library, configure a LoRA setup for\n           \n            roberta-base\n           \n           for sequence classification. Target the\n           \n            query\n           \n           and\n           \n            value\n           \n           matrices.\n          </p>"
    done_when: Your configuration object prints correctly without errors.
    git_cmd: 'git add . &amp;&amp; git commit -m "day98: complete day 98 tasks and coding exercises"'
    sol_id: sol-d98t1
    solution_title: ✅ Roberta-Base LoRA Config with PEFT
    solution_code: "<span class=\"cm\"># Step 1: Model Training &amp; Evaluation Workflow</span>\n<span class=\"kw\">from</span> peft <span class=\"kw\">import</span> LoraConfig, TaskType, get_peft_model\n<span class=\"kw\">from</span> transformers <span class=\"kw\">import</span> AutoModelForSequenceClassification\n\nmodel = AutoModelForSequenceClassification.<span class=\"fn\">from_pretrained</span>(<span class=\"str\">\"roberta-base\"</span>, num_labels=<span class=\"num\">2</span>)\n\nconfig = <span class=\"fn\">LoraConfig</span>(\n    r=<span class=\"num\">8</span>,\n    lora_alpha=<span class=\"num\">32</span>,\n    target_modules=[<span class=\"str\">\"query\", \"value\"</span>],\n    lora_dropout=<span class=\"num\">0.05</span>,\n    bias=<span class=\"str\">\"none\"</span>,\n    task_type=TaskType.SEQ_CLS\n)\n\npeft_model = <span class=\"fn\">get_peft_model</span>(model, config)\npeft_model.<span class=\"fn\">print_trainable_parameters</span>()"
    solution_lang: python — lora_peft_config.py
  - title: Train and Merge
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n           Train a dummy LoRA model for 1 epoch. Once trained, write the code to use the\n           \n            merge_and_unload()\n           \n           function from PEFT to collapse the A and B matrices back into the base weights, yielding a standard inference model.\n          </p>"
    done_when: "The resulting merged model can be saved and loaded directly via\n           \n            AutoModel.from_pretrained\n           \n           without needing PEFT."
    git_cmd: 'git add train_and_merge.py &amp;&amp; git commit -m "day98: train-and-merge"'
    sol_id: sol-d98t2
    solution_title: ✅ Merge LoRA Adapter Weights to Base Model
    solution_code: '<span class="kw">from</span> peft <span class="kw">import</span> PeftModel

      <span class="kw">from</span> transformers <span class="kw">import</span> AutoModelForCausalLM


      base_model = AutoModelForCausalLM.<span class="fn">from_pretrained</span>(<span class="str">"gpt2"</span>)

      model = PeftModel.<span class="fn">from_pretrained</span>(base_model, <span class="str">"lora_checkpoints"</span>)

      merged_model = model.<span class="fn">merge_and_unload</span>()

      merged_model.<span class="fn">save_pretrained</span>(<span class="str">"merged_gpt2_model"</span>)'
    solution_lang: python — merge_weights.py
  - title: Implement LoRA Layer from Scratch
    badge: 🔴 HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n           Do not use the PEFT library. Implement a PyTorch\n           \n            LoRALinear\n           \n           module that wraps an existing\n           \n            nn.Linear\n           \n           layer. It should freeze the original weights and initialize matrix A (Kaiming Normal) and matrix B (Zeros). Write a test asserting that only A and B receive gradients during a backward pass.\n          </p>"
    done_when: "Your module successfully performs a forward pass matching\n           \n            Wx + BAx\n           \n           and gradients are isolated."
    git_cmd: 'git add implement_lora_layer_from_scratch.py &amp;&amp; git commit -m "day98: implement-lora-layer-from-scratch"'
    sol_id: sol-d98t3
    solution_title: ✅ Custom PyTorch LoRA Layer Implementation
    solution_code: "<span class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core Transformations</span>\n<span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n<span class=\"kw\">import</span> math\n\n<span class=\"kw\">class</span> <span class=\"cls\">LoRALinear</span>(nn.Module):\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, linear_layer, r=<span class=\"num\">8</span>, alpha=<span class=\"num\">16</span>):\n        <span class=\"fn\">super</span>().<span class=\"fn\">__init__</span>()\n        <span class=\"kw\">self</span>.linear = linear_layer\n        <span class=\"kw\">self</span>.r = r\n        <span class=\"kw\">self</span>.alpha = alpha\n        <span class=\"kw\">self</span>.scaling = alpha / r\n\n        <span class=\"kw\">for</span> param <span class=\"kw\">in</span> <span class=\"kw\">self</span>.linear.<span class=\"fn\">parameters</span>():\n         \
      \   param.requires_grad = <span class=\"kw\">False</span>\n\n        in_features = <span class=\"kw\">self</span>.linear.in_features\n        out_features = <span class=\"kw\">self</span>.linear.out_features\n\n        <span class=\"kw\">self</span>.lora_A = nn.<span class=\"fn\">Parameter</span>(torch.<span class=\"fn\">zeros</span>(in_features, r))\n        <span class=\"kw\">self</span>.lora_B = nn.<span class=\"fn\">Parameter</span>(torch.<span class=\"fn\">zeros</span>(r, out_features))\n\n        nn.init.<span class=\"fn\">kaiming_uniform_</span>(<span class=\"kw\">self</span>.lora_A, a=math.<span class=\"fn\">sqrt</span>(<span class=\"num\">5</span>))\n        nn.init.<span class=\"fn\">zeros_</span>(<span class=\"kw\">self</span>.lora_B)\n\n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\">self</span>, x):\n        base_out = <span class=\"kw\">self</span>.<span class=\"fn\">linear</span>(x)\n        adapter_out = (x @ <span class=\"kw\"\
      >self</span>.lora_A @ <span class=\"kw\">self</span>.lora_B) * <span class=\"kw\">self</span>.scaling\n        <span class=\"kw\">return</span> base_out + adapter_out\n\nfc = nn.<span class=\"fn\">Linear</span>(<span class=\"num\">10</span>, <span class=\"num\">5</span>)\nlora_fc = <span class=\"fn\">LoRALinear</span>(fc, r=<span class=\"num\">4</span>)\n\nx = torch.<span class=\"fn\">randn</span>(<span class=\"num\">1</span>, <span class=\"num\">10</span>)\ny = <span class=\"fn\">lora_fc</span>(x)\nloss = y.<span class=\"fn\">sum</span>()\nloss.<span class=\"fn\">backward</span>()\n\n<span class=\"fn\">print</span>(<span class=\"str\">\"lora_A gradient computed:\"</span>, lora_fc.lora_A.grad <span class=\"kw\">is</span> <span class=\"kw\">not</span> <span class=\"kw\">None</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"lora_B gradient computed:\"</span>, lora_fc.lora_B.grad <span class=\"kw\">is</span> <span class=\"kw\">not</span> <span class=\"kw\">None</span>)\n\
      <span class=\"fn\">print</span>(<span class=\"str\">\"Base weight gradient computed:\"</span>, lora_fc.linear.weight.grad <span class=\"kw\">is</span> <span class=\"kw\">not</span> <span class=\"kw\">None</span>)"
    solution_lang: python — custom_lora.py
  quizzes:
  - num_str: Q1 OF 5
    question: What is the primary benefit of LoRA over full fine-tuning?
    qid: q98_1
    options:
    - letter: A
      text: It makes the base model smaller on disk.
      is_correct: false
    - letter: B
      text: It increases the context window size.
      is_correct: false
    - letter: C
      text: It drastically reduces the number of trainable parameters and VRAM requirements.
      is_correct: true
    - letter: D
      text: It natively handles multimodality.
      is_correct: false
    correct_fb: ✅ Correct! By freezing $W$ and only training A and B, we save immense amounts of memory (Adam states).
    wrong_fb: ❌ Incorrect. The VRAM savings come from not needing optimizer states for the giant $W$ matrix.
  - num_str: Q2 OF 5
    question: Why does LoRA add zero latency during inference?
    qid: q98_2
    options:
    - letter: A
      text: Because A and B are dropped during inference.
      is_correct: false
    - letter: B
      text: Because the matrices A and B can be multiplied together and explicitly added to the frozen weight matrix $W$.
      is_correct: true
    - letter: C
      text: Because it uses sparse matrices.
      is_correct: false
    - letter: D
      text: Because of KV Caching.
      is_correct: false
    correct_fb: ✅ Correct! W_new = $W$ + BA. We just deploy W_new, which has the exact same dimensions as the original model!
    wrong_fb: ❌ Incorrect. Think about algebraic matrix addition.
  - num_str: Q3 OF 5
    question: In LoRA, what is the 'r' parameter?
    qid: q98_3
    options:
    - letter: A
      text: Learning rate.
      is_correct: false
    - letter: B
      text: The number of layers to freeze.
      is_correct: false
    - letter: C
      text: The rank of the low-rank matrices A and B.
      is_correct: true
    - letter: D
      text: The dropout rate.
      is_correct: false
    correct_fb: ✅ Correct! r determines the dimensionality of the inner dimension between A and B. Smaller r = fewer parameters.
    wrong_fb: '❌ Incorrect. Look at the matrix dimensions: A(d x r) and B(r x k).'
  - num_str: Q4 OF 5
    question: What does the '$Q$' in QLoRA stand for?
    qid: q98_4
    options:
    - letter: A
      text: Query
      is_correct: false
    - letter: B
      text: Quick
      is_correct: false
    - letter: C
      text: Quantized (loading the base model in 4-bit precision)
      is_correct: true
    - letter: D
      text: Quantum
      is_correct: false
    correct_fb: ✅ Correct! QLoRA keeps the massive base model in 4-bit precision in VRAM while training the 16-bit LoRA adapters.
    wrong_fb: ❌ Incorrect. It refers to the precision of the base model weights.
  - num_str: Q5 OF 5
    question: Which modules in a Transformer are most commonly targeted by LoRA?
    qid: q98_5
    options:
    - letter: A
      text: The Query (W_q) and Value (W_v) projection matrices in the attention blocks.
      is_correct: true
    - letter: B
      text: The LayerNorm layers.
      is_correct: false
    - letter: C
      text: The final Softmax layer.
      is_correct: false
    - letter: D
      text: The Positional Encodings.
      is_correct: false
    correct_fb: ✅ Correct! Targeting the attention projections yields the best performance trade-offs.
    wrong_fb: ❌ Incorrect. We want to target massive dense weight matrices.
  flashcards:
  - front: How does FlashAttention achieve 2-4x speedups on GPU self-attention?
    back: It uses SRAM tiling and an online softmax algorithm to compute attention without materializing the full N x N intermediate matrix in high-latency GPU High Bandwidth Memory (HBM).
  - front: What is the primary memory bottleneck solved by FlashAttention?
    back: Memory bandwidth I/O between GPU High Bandwidth Memory (HBM) and Fast On-Chip SRAM cache.
  - front: WSGI vs ASGI?
    back: 'WSGI: Web Server Gateway Interface (synchronous). ASGI: Asynchronous Server Gateway Interface (async, supports WebSockets).'
  - front: Docker Image?
    back: Read-only blueprint template with instructions to build a container environment (defined in a Dockerfile).
  - front: Pydantic Validation?
    back: Python library for data parsing and validation using type hints, raising clear runtime errors for invalid input schemas.
  gotcha: null
  takeaways:
    hinglish_line: "<strong>\n          Ek line mein:\n         </strong>\n         Decoder models (jaise GPT-2) causal mask ka use karte hain taaki predictions ke waqt aage ke words hide rahein aur model auto-regressively generate kare."
    bullets:
    - "<strong>\n           LoRA\n          </strong>\n          decomposes weight updates as ΔW = BA where B and A are low-rank matrices. Only B and A are trained — the original weights stay frozen."
    - "<strong>\n           Rank r\n          </strong>\n          controls expressiveness vs parameter count. r=8-16 works for most tasks. Higher rank = more capacity, more parameters."
    - "<strong>\n           PEFT methods\n          </strong>\n          (LoRA, Adapters, Prefix Tuning) enable fine-tuning models with billions of parameters on a single GPU."
    - "<strong>\n           Merge weights\n          </strong>\n          after training: $W_{\\text{new}} = W + \\frac{\\alpha}{r} \\cdot BA$. This eliminates inference overhead — the merged model runs at original speed."
