    <h3 class="sh3">
           2. Multi-Head Attention
          </h3>
    <p>
           Instead of calculating a single attention distribution, Multi-Head Attention splits the embeddings into
           <em>
            h
           </em>
           heads, computes attention independently in parallel, and concatenates the results. This allows the model to simultaneously attend to different representation subspaces (e.g., one head for syntax, one head for subject-verb relationships).
          </p>
    <h3 class="sh3">
           3. Rotary Positional Embeddings (RoPE)
          </h3>
    <p>
           The original Transformer used Absolute Positional Encodings (adding sine/cosine waves to token vectors). Modern LLMs (like LLaMA and Mistral) use
           <strong>
            RoPE
           </strong>
           , which encodes relative position by rotating the query and key representations in a 2D plane by an angle proportional to their absolute position.
          </p>
    <div class="math-block">
    <span class="formula">
            $$RoPE(x_m) = x_m * cos(mθ) + [-x_m(2), x_m(1)] * sin(mθ)$$
           </span>
    <span class="desc">
            Where m is the absolute position. The inner product between two rotated vectors naturally decays relative to their distance (m - n), giving strong relative position bias.
           </span>
    </div>
    <h3 class="sh3">
           4. Pre-LN vs Post-LN
          </h3>
    <p>
           Original Transformers used Post-LayerNorm (LayerNorm after residual connections). This led to severe gradient vanishing during early training, requiring a long learning rate warmup. Modern architectures (GPT-2, LLaMA) use Pre-LayerNorm (LayerNorm inside the residual block), allowing for stable training without warmup.
          </p>
    <h3 class="sh3">
           5. Autoregressive Generation &amp; KV Caching
          </h3>
    <p>
           During inference, decoder models generate tokens one by one. Recomputing attention for all past tokens at every step is computationally expensive
           <em>
            $O(N^2)$
           </em>
           .
           <strong>
            KV Caching
           </strong>
           solves this by storing the previously computed Key and Value vectors for past tokens in memory. At step
           <em>
            t
           </em>
           , we only compute the Query, Key, and Value for the new token, and append its $K$ and $V$ to the cache, reducing time complexity per step to
           <em>
            $O(N)$
           </em>
           .
          </p>
