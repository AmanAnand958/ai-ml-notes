  - title: Custom MLM Data Collator
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n           Write a PyTorch\n           \n            DataCollator\n           \n           class that takes a batch of tokenized sequences and applies the 80-10-10 masking strategy manually. Return the\n           \n            input_ids\n           \n           ,\n           \n            attention_mask\n           \n           , and\n           \n            labels\n           \n           (with -100 for unmasked tokens to ignore in CrossEntropy calculation).\n          </p>"
    done_when: Your collator accurately masks 15% of tokens and properly ignores the loss on unmasked tokens.
    git_cmd: 'git add custom_mlm_data_collator.py &amp;&amp; git commit -m "day96: custom-mlm-data-collator"'
    sol_id: sol-d96t2
    solution_title: ✅ PyTorch Custom MLM Data Collator
    solution_code: "<span class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core Transformations</span>\n<span class=\"kw\">import</span> torch\n\n<span class=\"kw\">class</span> <span class=\"cls\">MLMDataCollator</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, tokenizer, mlm_probability=<span class=\"num\">0.15</span>):\n        <span class=\"kw\">self</span>.tokenizer = tokenizer\n        <span class=\"kw\">self</span>.mlm_probability = mlm_probability\n\n    <span class=\"kw\">def</span> <span class=\"fn\">__call__</span>(<span class=\"kw\">self</span>, examples):\n        input_ids = torch.<span class=\"fn\">stack</span>([ex[<span class=\"str\">\"input_ids\"</span>] <span class=\"kw\">for</span> ex <span class=\"kw\">in</span> examples])\n        labels = input_ids.<span class=\"fn\">clone</span>()\n\n        probability_matrix = torch.<span class=\"fn\">full</span>(labels.shape, <span class=\"kw\">self</span>.mlm_probability)\n\
      \        special_tokens_mask = [\n            <span class=\"kw\">self</span>.tokenizer.<span class=\"fn\">get_special_tokens_mask</span>(val, already_has_special_tokens=<span class=\"kw\">True</span>)\n            <span class=\"kw\">for</span> val <span class=\"kw\">in</span> labels.<span class=\"fn\">tolist</span>()\n        ]\n        special_tokens_mask = torch.<span class=\"fn\">tensor</span>(special_tokens_mask, dtype=torch.bool)\n        probability_matrix.<span class=\"fn\">masked_fill_</span>(special_tokens_mask, value=<span class=\"num\">0.0</span>)\n\n        masked_indices = torch.<span class=\"fn\">bernoulli</span>(probability_matrix).<span class=\"fn\">bool</span>()\n        labels[~masked_indices] = -<span class=\"num\">100</span>\n\n        indices_replaced = torch.<span class=\"fn\">bernoulli</span>(torch.<span class=\"fn\">full</span>(labels.shape, <span class=\"num\">0.8</span>)).<span class=\"fn\">bool</span>() &amp; masked_indices\n        input_ids[indices_replaced]\
      \ = <span class=\"kw\">self</span>.tokenizer.<span class=\"fn\">convert_tokens_to_ids</span>(<span class=\"str\">\"[MASK]\"</span>)\n\n        indices_random = torch.<span class=\"fn\">bernoulli</span>(torch.<span class=\"fn\">full</span>(labels.shape, <span class=\"num\">0.5</span>)).<span class=\"fn\">bool</span>() &amp; masked_indices &amp; ~indices_replaced\n        random_words = torch.<span class=\"fn\">randint</span>(<span class=\"fn\">len</span>(<span class=\"kw\">self</span>.tokenizer), labels.shape, dtype=torch.long)\n        input_ids[indices_random] = random_words[indices_random]\n\n        <span class=\"kw\">return</span> {\n            <span class=\"str\">\"input_ids\"</span>: input_ids,\n            <span class=\"str\">\"attention_mask\": torch.stack([ex[\"attention_mask\"</span>] <span class=\"kw\">for</span> ex <span class=\"kw\">in</span> examples]),\n            <span class=\"str\">\"labels\"</span>: labels\n        }"
    solution_lang: python — mlm_collator.py
