    sol_id: sol-d96t1
    solution_title: ✅ Python Perplexity Calculator
    solution_code: "<span class=\"kw\">import</span> math\n\nlosses = [<span class=\"num\">0.1</span>, <span class=\"num\">0.5</span>, <span class=\"num\">2.3</span>, <span class=\"num\">5.0</span>]\n\n<span class=\"kw\">for</span> loss <span class=\"kw\">in</span> losses:\n    perplexity = math.<span class=\"fn\">exp</span>(loss)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Cross Entropy Loss: {loss:.2f} | Perplexity: {perplexity:.4f}\"</span>)"
