    hinglish_line: "<strong>\n          Ek line mein:\n         </strong>\n         BPE aur WordPiece tokenizers unknown words ko chhote subwords mein tod dete hain taaki model vocabulary limits ke bahar na jaaye."
    bullets:
    - "<strong>\n           Tokenization\n          </strong>\n          converts text into integer IDs. BPE (GPT) merges frequent character pairs; WordPiece (BERT) merges based on likelihood gain."
