    solution_title: ✅ Full FastAPI Server, Dockerfile &amp; Gradio Client App
    solution_code: |-
      from fastapi import FastAPI
      from pydantic import BaseModel
      from sentence_transformers import SentenceTransformer
      import faiss

      # 1. Initialize high-performance asynchronous API application
      app = FastAPI()
      model = SentenceTransformer("all-MiniLM-L6-v2")

      corpus = ["FastAPI serves ML models asynchronously.", "Docker packages system dependencies.", "FAISS indices vectors in memory."]
      corpus_embeddings = model.encode(corpus).astype('float32')
      index = faiss.IndexFlatL2(384)
      index.add(corpus_embeddings)

      class QueryRequest(BaseModel):
          query: str

      # 2. Define prediction endpoint with Pydantic schema validation
      @app.post("/query")
      async def retrieve_info(request: QueryRequest):
          q_embed = model.encode([request.query]).astype('float32')
          _, indices = index.search(q_embed, k=1)
          matched_text = corpus[indices[0][0]]
          return {"context": matched_text}
      assert matched_text is not None, "matched_text should not be None"
    solution_lang: python
  - title: 'Production Benchmark — Capstone Part 2: Deployment & Model Serving'
    solution_code: |-
      # Day 100: Capstone Part 2 — Model Serving & Deployment
      from flask import Flask, request, jsonify
      import numpy as np
      import pickle, os

      # Train a production-ready model
      from sklearn.ensemble import GradientBoostingClassifier
      from sklearn.preprocessing import StandardScaler
      from sklearn.model_selection import train_test_split

      np.random.seed(42)
      X = np.random.randn(500, 8)
      y = (X[:, 0] + X[:, 2] - X[:, 5] > 0.5).astype(int)
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2)

      scaler = StandardScaler()
      X_tr_s = scaler.fit_transform(X_train)
      X_te_s = scaler.transform(X_test)
      model = GradientBoostingClassifier(n_estimators=100, random_state=42)
      model.fit(X_tr_s, y_train)
      test_acc = model.score(X_te_s, y_test)
      print(f"Test accuracy: {test_acc:.4f}")

      # Serialize
      MODEL_PATH = '/tmp/day100_model.pkl'
      SCALER_PATH = '/tmp/day100_scaler.pkl'
      with open(MODEL_PATH, 'wb') as f: pickle.dump(model, f)
      with open(SCALER_PATH, 'wb') as f: pickle.dump(scaler, f)

      # Flask serving app
      app = Flask(__name__)
      _model = pickle.load(open(MODEL_PATH, 'rb'))
      _scaler = pickle.load(open(SCALER_PATH, 'rb'))

      @app.route('/health')
      def health(): return jsonify({'status': 'ok', 'version': '1.0', 'accuracy': round(test_acc, 4)})

      @app.route('/predict', methods=['POST'])
      def predict():
          body = request.get_json()
          features = body.get('features')
          if not features or len(features) != 8:
              return jsonify({'error': 'Exactly 8 features required'}), 400
          X_in = _scaler.transform([features])
          pred = int(_model.predict(X_in)[0])
          prob = float(_model.predict_proba(X_in)[0].max())
          return jsonify({'prediction': pred, 'confidence': round(prob, 4)})

      with app.test_client() as c:
          r_health = c.get('/health')
          r_predict = c.post('/predict', json={'features': [0.5]*8})
          r_error   = c.post('/predict', json={'features': [1.0]})
          assert r_health.status_code == 200
          assert r_predict.status_code == 200
          assert r_error.status_code == 400
          body = r_predict.get_json()
          assert 'prediction' in body and body['prediction'] in [0, 1]

      for f in [MODEL_PATH, SCALER_PATH]: os.remove(f)
      print("✅ Model Serving Capstone assertions passed")
