    sol_id: sol-d99t2
    solution_title: ✅ FAISS Semantic Vector Indexing &amp; Search
    solution_code: "<span class=\"cm\"># Step 1: Model Training &amp; Evaluation Workflow</span>\n<span class=\"kw\">import</span> faiss\n<span class=\"kw\">from</span> sentence_transformers <span class=\"kw\">import</span> SentenceTransformer\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\nmodel = <span class=\"fn\">SentenceTransformer</span>(<span class=\"str\">\"all-MiniLM-L6-v2\"</span>)\nsentences = [\n    <span class=\"str\">\"Machine learning is a subset of artificial intelligence.\"</span>,\n    <span class=\"str\">\"Dense embeddings capture semantic text meaning.\"</span>,\n    <span class=\"str\">\"RAG pipelines retrieve relevant document chunks.\"</span>,\n    <span class=\"str\">\"Transformers rely on parallel self-attention.\"</span>,\n    <span class=\"str\">\"FAISS indexes vectors for fast search.\"</span>\n]\nembeddings = model.<span class=\"fn\">encode</span>(sentences).<span class=\"fn\">astype</span>(<span class=\"str\">'float32'</span>)\n\n\
      index = faiss.<span class=\"fn\">IndexFlatL2</span>(<span class=\"num\">384</span>)\nindex.<span class=\"fn\">add</span>(embeddings)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Total vectors indexed:\"</span>, index.ntotal)\n\nquery = <span class=\"str\">\"How do we fetch context for LLMs?\"</span>\nquery_vector = model.<span class=\"fn\">encode</span>([query]).<span class=\"fn\">astype</span>(<span class=\"str\">'float32'</span>)\n\ndistances, indices = index.<span class=\"fn\">search</span>(query_vector, k=<span class=\"num\">2</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"\\nQuery:\"</span>, query)\n<span class=\"kw\">for</span> idx, dist <span class=\"kw\">in</span> <span class=\"fn\">zip</span>(indices[<span class=\"num\">0</span>], distances[<span class=\"num\">0</span>]):\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Match: '</span>{sentences[idx]}<span class=\"str\">' (L2 Distance: {dist:.4f})\"</span>)"
    solution_lang: python — faiss_search.py
  - title: Build a Pure PyTorch RAG Pipeline
    badge: 🔴 HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n           Without using LangChain or LlamaIndex, build a chunker, embedder (using\n           \n            transformers\n           \n           ), and a naive FAISS index. Ingest a Wikipedia article, generate query embeddings, retrieve the top 3 chunks, inject them into a prompt string, and pass it to a local Hugging Face generation model to get an answer.\n          </p>"
    done_when: The local model answers the question accurately based entirely on the retrieved chunks.
    git_cmd: 'git add build_a_pure_pytorch_rag_pipeline.py &amp;&amp; git commit -m "day99: build-a-pure-pytorch-rag-pipeline"'
    sol_id: sol-d99t3
    solution_title: ✅ Custom PyTorch RAG Pipeline Code
    solution_code: "<span class=\"cm\"># Step 1: Model Training &amp; Evaluation Workflow</span>\n<span class=\"kw\">import</span> torch\n<span class=\"kw\">from</span> transformers <span class=\"kw\">import</span> AutoTokenizer, AutoModelForCausalLM\n<span class=\"kw\">from</span> sentence_transformers <span class=\"kw\">import</span> SentenceTransformer\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span> faiss\n\ncorpus = [\n    <span class=\"str\">\"Artificial intelligence is intelligence demonstrated by machines, unlike natural intelligence.\"</span>,\n    <span class=\"str\">\"Attention mechanism allows decoder models to focus on specific sequence inputs.\"</span>,\n    <span class=\"str\">\"FAISS (Facebook AI Similarity Search) is a library for efficient similarity search.\"</span>,\n    <span class=\"str\">\"Generative Pre-trained Transformers (GPT) generate text autoregressively.\"</span>\n]\n\nembed_model = <span class=\"fn\"\
      >SentenceTransformer</span>(<span class=\"str\">\"all-MiniLM-L6-v2\"</span>)\ncorpus_embeddings = embed_model.<span class=\"fn\">encode</span>(corpus).<span class=\"fn\">astype</span>(<span class=\"str\">'float32'</span>)\n\nindex = faiss.<span class=\"fn\">IndexFlatL2</span>(<span class=\"num\">384</span>)\nindex.<span class=\"fn\">add</span>(corpus_embeddings)\n\nquery = <span class=\"str\">\"What is FAISS used for?\"</span>\nq_embed = embed_model.<span class=\"fn\">encode</span>([query]).<span class=\"fn\">astype</span>(<span class=\"str\">'float32'</span>)\n_, indices = index.<span class=\"fn\">search</span>(q_embed, k=<span class=\"num\">1</span>)\nretrieved_chunk = corpus[indices[<span class=\"num\">0</span>][<span class=\"num\">0</span>]]\n\ntokenizer = AutoTokenizer.<span class=\"fn\">from_pretrained</span>(<span class=\"str\">\"gpt2\"</span>)\nmodel = AutoModelForCausalLM.<span class=\"fn\">from_pretrained</span>(<span class=\"str\">\"gpt2\"</span>)\n\nprompt = <span class=\"\
      str\">f\"Context: {retrieved_chunk}\\nQuestion: {query}\\nAnswer:\"</span>\ninputs = <span class=\"fn\">tokenizer</span>(prompt, return_tensors=<span class=\"str\">\"pt\"</span>)\n<span class=\"kw\">with</span> torch.<span class=\"fn\">no_grad</span>():\n    outputs = model.<span class=\"fn\">generate</span>(**inputs, max_new_tokens=<span class=\"num\">25</span>, pad_token_id=tokenizer.eos_token_id)\n\n<span class=\"fn\">print</span>(<span class=\"str\">\"\\nGenerated Output:\\n\"</span>, tokenizer.<span class=\"fn\">decode</span>(outputs[<span class=\"num\">0</span>], skip_special_tokens=<span class=\"kw\">True</span>))"
    solution_lang: python — custom_rag.py
  quizzes:
  - num_str: Q1 OF 5
    question: Why is RAG generally preferred over Fine-Tuning for injecting new knowledge into an LLM?
    qid: q99_1
    options:
    - letter: A
      text: It grounds the model in retrieved facts, drastically reducing hallucinations, and allows for instant knowledge updates without retraining.
      is_correct: true
    - letter: B
      text: It is slower but more accurate.
      is_correct: false
    - letter: C
      text: It increases the model's vocabulary size.
      is_correct: false
    - letter: D
      text: It requires KV Caching.
      is_correct: false
    correct_fb: ✅ Correct! RAG provides provenance (you know exactly where the answer came from) and is much cheaper.
    wrong_fb: ❌ Incorrect. Fine-tuning for knowledge injection is notoriously unreliable.
  - num_str: Q2 OF 5
    question: Which mathematical operation is primarily used in vector databases to find similar documents?
    qid: q99_2
    options:
    - letter: A
      text: Matrix Inversion
      is_correct: false
    - letter: B
      text: Cosine Similarity (Normalized Dot Product)
      is_correct: true
    - letter: C
      text: Cross Entropy
      is_correct: false
    - letter: D
      text: Sigmoid Activation
      is_correct: false
    correct_fb: ✅ Correct! The angle between vectors dictates their semantic similarity.
    wrong_fb: ❌ Incorrect. How do we measure distance between embeddings?
  - num_str: Q3 OF 5
    question: What is the purpose of HNSW in FAISS?
    qid: q99_3
    options:
    - letter: A
      text: To compress vectors to 4-bit.
      is_correct: false
    - letter: B
      text: To fine-tune the LLM.
      is_correct: false
    - letter: C
      text: To perform Approximate Nearest Neighbor (ANN) search extremely quickly using graphs.
      is_correct: true
    - letter: D
      text: To generate the embeddings.
      is_correct: false
    correct_fb: ✅ Correct! HNSW avoids checking every single vector, vastly speeding up retrieval.
    wrong_fb: ❌ Incorrect. FAISS is a search library. What kind of search does it do?
  - num_str: Q4 OF 5
    question: Why must we "chunk" long documents before embedding them?
    qid: q99_4
    options:
    - letter: A
      text: To save disk space.
      is_correct: false
    - letter: B
      text: Because embedding models have limited context windows (e.g., 512 tokens) and single dense vectors lose specificity if trying to represent a massive document.
      is_correct: true
    - letter: C
      text: To increase the perplexity of the text.
      is_correct: false
    - letter: D
      text: To prevent overfitting during RAG.
      is_correct: false
    correct_fb: ✅ Correct! A single 768-D vector cannot accurately summarize a 100-page book. We must split it up.
    wrong_fb: ❌ Incorrect. Embedding models like BERT have strict token limits.
  - num_str: Q5 OF 5
    question: In a RAG system, what role does the LLM (e.g., GPT-4) play?
    qid: q99_5
    options:
    - letter: A
      text: It stores the document database.
      is_correct: false
    - letter: B
      text: It retrieves the documents from the database.
      is_correct: false
    - letter: C
      text: It receives the user's query AND the retrieved context, and synthesizes a final natural language answer.
      is_correct: true
    - letter: D
      text: It generates the embeddings.
      is_correct: false
    correct_fb: ✅ Correct! The LLM is just the final reasoning engine that reads the retrieved context and answers the query.
    wrong_fb: ❌ Incorrect. RAG is Retrieval (Vector DB) + Augmented Generation (LLM).
  flashcards:
  - front: How does Low-Rank Adaptation (LoRA) parameterize weight updates?
    back: delta_W = (alpha / r) * (B @ A), where A in R^(r x d_in) and B in R^(d_out x r) with rank r &lt;&lt; d. This reduces trainable parameters by over 99%.
  - front: Can LoRA adapters be merged into base model weights for zero-latency serving?
    back: Yes, W_final = W_base + (alpha / r) * (B @ A) allows serving the adapted model with identical latency to the base model.
  - front: WSGI vs ASGI?
    back: 'WSGI: Web Server Gateway Interface (synchronous). ASGI: Asynchronous Server Gateway Interface (async, supports WebSockets).'
  - front: Docker Image?
    back: Read-only blueprint template with instructions to build a container environment (defined in a Dockerfile).
  - front: Pydantic Validation?
    back: Python library for data parsing and validation using type hints, raising clear runtime errors for invalid input schemas.
