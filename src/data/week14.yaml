    prompt_html: |-
      <p><strong>
                 Wrap your Day 99 RAG system in an async FastAPI endpoint. Implement a POST route that takes a JSON query, runs the FAISS retrieval, calls the model, and returns a JSON response. Write a Dockerfile, and create a sleek Gradio front-end that connects to the FastAPI backend.
