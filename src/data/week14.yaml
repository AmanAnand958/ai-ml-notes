- id: '96'
  day_num: 96
  title: 'Day 96 — BERT: Bidirectional Encoder Representations from Transformers'
  subtitle: BERT (Devlin et al., Google 2018) was the moment NLP changed forever. For the first time, a single pre-trained model could be fine-tuned to achieve state-of-the-art on eleven different NLP benchmarks simultaneously. Today we dissect exactly how BERT's bidirectional architecture works, how Masked Language Modeling forces the model to learn deep contextual representations, and how to prepare inputs and fine-tune BERT for classification tasks.
  time_estimate: '6 hours (Note: High-volume day. Take 2 days to fully digest if needed) (Note: High-volume day. Take 2 days to fully digest if needed) (Note: High-volume day. Take 2 days to fully digest if needed)'
  difficulty: +150 XP
  badges:
  - label: 📈 Advanced
    variant: o
  - label: BERT Finetuning
    variant: b
  xp: 150
  objectives:
  - Explain BERT's architecture (Encoder-only, Bidirectional Self-Attention) and why bidirectionality matters for representations
  - 'Detail both pre-training tasks: Masked Language Modeling (MLM) with 80/10/10 masking strategy, and Next Sentence Prediction (NSP)'
  - Explain the function of [CLS], [SEP], and [MASK] special tokens and how [CLS] is used for classification
  - Prepare text inputs with WordPiece tokenization, attention masks, and token type IDs for a classification task
  - Compare BERT-base vs BERT-large and understand the parameter scaling tradeoffs
  checklist: []
  concept_flow:
  - The Mathematics of Scaled
  - Transformer Architecture
  - 'Day 96 — BERT: Bidirectio'
  - Hugging Face Ecosystem &
  - Parameter-Efficient Fine-
  - 'Capstone Part 1: Advanced'
  - 'Capstone Part 2: Deployme'
  hinglish: "BERT fine-tuning:\n       \n        [CLS]\n       \n       token representation classification ke liye use karo. Token representations NER ke liye.\n       \n        [SEP]\n       \n       sentence pair tasks ke liye. Ye design intentional hai!"
  analogy: BERT is like a student filling in the blanks in a textbook paragraph where some words are blacked out (Masked Language Model). By looking at both the left and right context of the sentence simultaneously, the student can easily guess the missing words with high accuracy.
  theory_html: "<div id=\"transformer-ln-rope-enriched\" style=\"margin:1.5rem 0;\">\n<h3 class=\"sh3\">Pre-LN vs Post-LN &amp; Rotary Positional Embeddings (RoPE)</h3>\n<p>Modern LLMs (Llama 3, Mistral, Gemma) replace original Post-LN and Sinusoidal encodings with two critical architectural innovations:</p>\n<ul>\n<li><strong>Pre-Layer Normalization (Pre-LN with RMSNorm):</strong> Normalizes inputs <em>before</em> the Multi-Head Attention and MLP blocks ($x + \text{MHA}(\text{RMSNorm}(x))$), preventing exploding gradients and enabling stable training without aggressive warmup schedules.</li>\n<li><strong>Rotary Positional Embedding (RoPE):</strong> Encodes relative token distance by rotating Query and Key vector pairs in the 2D complex plane ($R_{\\Theta, m} q_m$), preserving relative spatial awareness across long context windows (32k–128k tokens).</li>\n</ul>\n</div>\n<h3 class=\"sh3\">\n       1. Why Bidirectionality Is the Key Innovation\n      </h3>\n<p>\n       GPT (OpenAI, 2018) used\
    \ a Decoder-only Transformer — trained left-to-right, predicting the next token. This creates representations where each token can only \"see\" the tokens before it. For a word like \"bank\" in \"I went to the bank to deposit money\", a left-to-right model has only seen \"I went to the\" — not enough context to disambiguate financial vs. river bank.\n      </p>\n<p>\n       BERT uses only the Encoder stack, which applies\n       <strong>\n        fully bidirectional\n       </strong>\n       self-attention — each token attends to every other token in both directions simultaneously. The representation of \"bank\" is computed using the full context including \"deposit money\" which follows it. This produces dramatically richer contextual representations, especially for tasks requiring deep understanding like QA, NLI, and coreference resolution.\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$h_i^{(l)} = \\\\text{TransformerEncoder}\\\\!\\\\left(h_1^{(l-1)},\
    \ \\\\ldots, h_n^{(l-1)}\\\\right)_i$$\n       </span>\n<span class=\"desc\">\n        Each token representation at layer l is a function of ALL tokens at layer l-1. Contrast with GPT where h_i^(l) depends only on h_1...h_i^(l-1).\n       </span>\n</div>\n<div class=\"mermaid\">\ngraph LR\nsubgraph \"BERT: Bidirectional Attention\"\n  B1[\"Token 1\"] --- B2[\"Token 2\"]\n  B2 --- B3[\"Token 3\"]\n  B1 --- B3\nend\nsubgraph \"GPT: Causal Masked Attention\"\n  G1[\"Token 1\"] --&gt; G2[\"Token 2\"]\n  G1 --&gt; G3[\"Token 3\"]\n  G2 --&gt; G3\nend\n</div>\n<h3 class=\"sh3\">\n       2. Masked Language Modeling — The 80/10/10 Strategy\n      </h3>\n<p>\n       BERT cannot use standard next-token prediction (that would require a causal mask, destroying bidirectionality). Instead, it uses\n       <strong>\n        Masked Language Modeling (MLM)\n       </strong>\n       : randomly select 15% of tokens per sequence, then replace them as follows — 80% with [MASK], 10% with a random token, 10%\
    \ left unchanged. The model must predict the original token for all 15% selected positions.\n      </p>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<thead>\n<tr>\n<th>\n          Selection (15%)\n         </th>\n<th>\n          What happens\n         </th>\n<th>\n          Proportion\n         </th>\n<th>\n          Rationale\n         </th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n          Selected\n         </td>\n<td>\n          Replaced with [MASK]\n         </td>\n<td>\n          80%\n         </td>\n<td>\n          Primary learning signal — predict masked tokens\n         </td>\n</tr>\n<tr>\n<td>\n          Selected\n         </td>\n<td>\n          Replaced with random token\n         </td>\n<td>\n          10%\n         </td>\n<td>\n          Forces model to maintain contextual representation for all tokens (not just [MASK])\n         </td>\n</tr>\n<tr>\n<td>\n          Selected\n         </td>\n<td>\n \
    \         Left unchanged\n         </td>\n<td>\n          10%\n         </td>\n<td>\n          Prevents model from only focusing on [MASK] positions\n         </td>\n</tr>\n<tr>\n<td>\n          Not selected (85%)\n         </td>\n<td>\n          Unchanged\n         </td>\n<td>\n          85%\n         </td>\n<td>\n          Context for predicting the masked tokens\n         </td>\n</tr>\n</tbody>\n</table></div>\n<p>\n       The 80/10/10 split is critical. If we only ever replaced with [MASK], the model would learn \"only attend to [MASK] positions\" — but at fine-tuning time, there are no [MASK] tokens. The 10% random + 10% unchanged forces the model to maintain useful representations for every token in every context.\n      </p>\n<h3 class=\"sh3\">\n       3. Special Tokens and Input Construction\n      </h3>\n<p>\n       Every BERT input has a specific structure. Understanding exactly how inputs are constructed is essential for fine-tuning:\n      </p>\n<ul class=\"prose-list\">\n\
    <li>\n<strong>\n         [CLS] (Classification Token):\n        </strong>\n        Always the first token. After 12/24 layers of self-attention, the [CLS] representation has attended to all tokens and accumulates a sequence-level summary. For classification tasks, only this representation is passed to the output layer.\n       </li>\n<li>\n<strong>\n         [SEP] (Separator Token):\n        </strong>\n        Marks the end of a sentence or the boundary between two sentences in a pair. Required even for single-sentence inputs (appended at end).\n       </li>\n<li>\n<strong>\n         Token Type IDs (Segment Embeddings):\n        </strong>\n        0 for all tokens in sentence A, 1 for all tokens in sentence B. Allows BERT to distinguish which sentence each token belongs to in pair tasks.\n       </li>\n<li>\n<strong>\n         Attention Mask:\n        </strong>\n        1 for real tokens, 0 for [PAD] tokens (used when batching sequences of different lengths). Prevents the model from\
    \ attending to padding positions.\n       </li>\n</ul>\n<h3 class=\"sh3\">\n       4. BERT-base vs BERT-large: Architecture Scaling\n      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<thead>\n<tr>\n<th>\n          Model\n         </th>\n<th>\n          Layers (L)\n         </th>\n<th>\n          Hidden Size (H)\n         </th>\n<th>\n          Attention Heads (A)\n         </th>\n<th>\n          Parameters\n         </th>\n<th>\n          Training Cost\n         </th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n          BERT-base\n         </td>\n<td>\n          12\n         </td>\n<td>\n          768\n         </td>\n<td>\n          12\n         </td>\n<td>\n          110M\n         </td>\n<td>\n          4 TPUs × 4 days\n         </td>\n</tr>\n<tr>\n<td>\n          BERT-large\n         </td>\n<td>\n          24\n         </td>\n<td>\n          1024\n         </td>\n<td>\n          16\n         </td>\n<td>\n\
    \          340M\n         </td>\n<td>\n          16 TPUs × 4 days\n         </td>\n</tr>\n<tr>\n<td>\n          DistilBERT\n         </td>\n<td>\n          6\n         </td>\n<td>\n          768\n         </td>\n<td>\n          12\n         </td>\n<td>\n          66M\n         </td>\n<td>\n          Knowledge distillation from BERT-base\n         </td>\n</tr>\n<tr>\n<td>\n          RoBERTa-base\n         </td>\n<td>\n          12\n         </td>\n<td>\n          768\n         </td>\n<td>\n          12\n         </td>\n<td>\n          125M\n         </td>\n<td>\n          Longer training, no NSP, dynamic masking\n         </td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"sh3\">\n       5. NLP Evaluation Metrics\n      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<thead>\n<tr>\n<th>\n          Metric\n         </th>\n<th>\n          Use Case\n         </th>\n<th>\n          How it Works\n         </th>\n\
    </tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<strong>\n           Perplexity (PPL)\n          </strong>\n</td>\n<td>\n          Language Modeling\n         </td>\n<td>\n          The exponentiated average negative log-likelihood of a sequence. Lower is better. A perplexity of 10 means the model is as confused as if it had to guess uniformly among 10 words.\n         </td>\n</tr>\n<tr>\n<td>\n<strong>\n           BLEU\n          </strong>\n</td>\n<td>\n          Translation\n         </td>\n<td>\n          Measures n-gram precision. Counts how many n-grams in the generated text appear in the reference text, heavily penalized for short sentences.\n         </td>\n</tr>\n<tr>\n<td>\n<strong>\n           ROUGE\n          </strong>\n</td>\n<td>\n          Summarization\n         </td>\n<td>\n          Measures n-gram recall. Counts how many n-grams from the reference text were successfully captured in the generated text.\n         </td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"cb\">\n<div\
    \ class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — bert_tokenization_and_encoding.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">from</span> transformers <span class=\"kw\">import</span> BertTokenizer, BertForSequenceClassification\n<span class=\"kw\">import</span> torch\n\ntokenizer = BertTokenizer.<span class=\"fn\">from_pretrained</span>(<span class=\"str\">'bert-base-uncased'</span>)\n\n<span class=\"cm\"># --- Single Sentence ---</span>\ntext = <span class=\"str\">\"NLP embeddings are highly contextual.\"</span>\nenc = <span class=\"fn\">tokenizer</span>(text, padding=<span class=\"str\">'max_length'</span>, max_length=<span class=\"num\">12</span>, truncation=<span class=\"kw\">True</span>, return_tensors=<span class=\"\
    str\">'pt'</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Tokens:\", tokenizer.convert_ids_to_tokens(enc['</span>input_ids'][<span class=\"num\">0</span>].<span class=\"fn\">tolist</span>()))\n<span class=\"cm\"># &amp;rarr; ['[CLS]', 'nl', '##p', 'em', '##bed', '##ding', '##s', 'are', 'highly', 'contextual', '.', '[SEP]']</span>\n<span class=\"fn\">print</span>(<span class=\"str\">\"Input IDs:   \", enc['</span>input_ids'])\n<span class=\"fn\">print</span>(<span class=\"str\">\"Attn Mask:   \", enc['</span>attention_mask'])  <span class=\"cm\"># All 1s (no padding needed here)</span>\n<span class=\"fn\">print</span>(<span class=\"str\">\"Token Types: \", enc['</span>token_type_ids'])   <span class=\"cm\"># All 0s (single sentence)</span>\n\n<span class=\"cm\"># --- Sentence Pair (for NSP / NLI tasks) ---</span>\nsent_a = <span class=\"str\">\"The patient was admitted to hospital.\"</span>\nsent_b = <span class=\"str\">\"She needed urgent medical attention.\"</span>\n\
    pair_enc = <span class=\"fn\">tokenizer</span>(sent_a, sent_b, padding=<span class=\"str\">'max_length'</span>, max_length=<span class=\"num\">24</span>,\n                     truncation=<span class=\"kw\">True</span>, return_tensors=<span class=\"str\">'pt'</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"\\\\nPair Token Type IDs:\", pair_enc['</span>token_type_ids'])\n<span class=\"cm\"># Sentence A tokens &amp;rarr; 0, Sentence B tokens &amp;rarr; 1</span>\n\n<span class=\"cm\"># --- Run forward pass to get CLS representation ---</span>\nmodel = BertForSequenceClassification.<span class=\"fn\">from_pretrained</span>(<span class=\"str\">'bert-base-uncased'</span>, num_labels=<span class=\"num\">2</span>)\nmodel.<span class=\"fn\">eval</span>()\n<span class=\"kw\">with</span> torch.<span class=\"fn\">no_grad</span>():\n    outputs = <span class=\"fn\">model</span>(**enc, labels=torch.<span class=\"fn\">tensor</span>([<span class=\"num\">1</span>]))\n    logits = outputs.logits\n\
    \    loss = outputs.loss\n<span class=\"fn\">print</span>(<span class=\"str\">\"Logits:\"</span>, logits)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Loss:\"</span>, loss)</pre>\n</div>"
