  - title: Basic Softmax Calculation
    badge: 🟢 EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n           Using NumPy, write a function that takes a 1D array of scores\n           \n            [10, 20, 30]\n           \n           , applies softmax, and prints the probabilities. Then try it with\n           \n            [100, 200, 300]\n           \n           to observe numerical instability (overflow) and fix it by subtracting the maximum value before exponentiation.\n          </p>"
    done_when: Your function prints correct probability distributions without NaN errors for large numbers.
    git_cmd: 'git add . &amp;&amp; git commit -m "day94: complete day 94 tasks and coding exercises"'
    sol_id: sol-d94t1
    solution_title: ✅ NumPy Stable Softmax Implementation
    solution_code: "<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\">softmax_naive</span>(x):\n    exps = np.<span class=\"fn\">exp</span>(x)\n    <span class=\"kw\">return</span> exps / np.<span class=\"fn\">sum</span>(exps)\n\n<span class=\"kw\">def</span> <span class=\"fn\">softmax_stable</span>(x):\n    <span class=\"cm\"># Subtract the max value to prevent overflow (e^300 = inf)</span>\n    shifted_x = x - np.<span class=\"fn\">max</span>(x)\n    exps = np.<span class=\"fn\">exp</span>(shifted_x)\n    <span class=\"kw\">return</span> exps / np.<span class=\"fn\">sum</span>(exps)\n\nx1 = np.<span class=\"fn\">array</span>([<span class=\"num\">10.0</span>, <span class=\"num\">20.0</span>, <span class=\"num\">30.0</span>])\n<span class=\"fn\">print</span>(<span class=\"str\">\"Naive:\"</span>, <span class=\"fn\">softmax_naive</span>(x1))\n<span class=\"fn\">print</span>(<span class=\"str\">\"Stable:\"</span>, <span\
      \ class=\"fn\">softmax_stable</span>(x1))\n\nx2 = np.<span class=\"fn\">array</span>([<span class=\"num\">100.0</span>, <span class=\"num\">200.0</span>, <span class=\"num\">300.0</span>])\n<span class=\"cm\"># print(softmax_naive(x2)) # Prints [nan, nan, nan] because of inf / inf</span>\n<span class=\"fn\">print</span>(<span class=\"str\">\"Stable large:\"</span>, <span class=\"fn\">softmax_stable</span>(x2))"
    solution_lang: python — stable_softmax.py
  - title: $QKV$ Projections
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n           Create a PyTorch script with a dummy sequence\n           \n            X\n           \n           of shape\n           \n            (batch=2, seq_len=5, d_model=16)\n           \n           . Initialize three linear layers for $Q$, $K$, and $V$. Pass\n           \n            X\n           \n           through them, calculate the scaled dot-product attention without a mask, and verify the output shape is exactly the same as\n           \n            X\n           \n           .\n          </p>"
    done_when: "Output shape is verified as\n           \n            (2, 5, 16)\n           \n           ."
    git_cmd: 'git add q_k_v_projections.py &amp;&amp; git commit -m "day94: q-k-v-projections"'
    sol_id: sol-d94t2
    solution_title: ✅ PyTorch QKV Projections &amp; Attention Flow
    solution_code: '<span class="cm"># Step 1: Model Training &amp; Evaluation Workflow</span>

      <span class="kw">import</span> torch

      <span class="kw">import</span> torch.nn <span class="kw">as</span> nn

      <span class="kw">import</span> math


      torch.<span class="fn">manual_seed</span>(<span class="num">42</span>)

      B, T, d_model = <span class="num">2</span>, <span class="num">5</span>, <span class="num">16</span>

      d_k = <span class="num">16</span>


      X = torch.<span class="fn">randn</span>(B, T, d_model)


      W_q = nn.<span class="fn">Linear</span>(d_model, d_k, bias=<span class="kw">False</span>)

      W_k = nn.<span class="fn">Linear</span>(d_model, d_k, bias=<span class="kw">False</span>)

      W_v = nn.<span class="fn">Linear</span>(d_model, d_model, bias=<span class="kw">False</span>)


      Q = <span class="fn">W_q</span>(X) <span class="cm"># (B, T, d_k)</span>

      K = <span class="fn">W_k</span>(X) <span class="cm"># (B, T, d_k)</span>

      V = <span class="fn">W_v</span>(X) <span class="cm"># (B, T, d_model)</span>


      scores = torch.<span class="fn">matmul</span>(Q, K.<span class="fn">transpose</span>(-<span class="num">2</span>, -<span class="num">1</span>)) / math.<span class="fn">sqrt</span>(d_k) <span class="cm"># (B, T, T)</span>

      attn_weights = torch.<span class="fn">softmax</span>(scores, dim=-<span class="num">1</span>)                  <span class="cm"># (B, T, T)</span>

      output = torch.<span class="fn">matmul</span>(attn_weights, V)                         <span class="cm"># (B, T, d_model)</span>


      <span class="fn">print</span>(<span class="str">"Input shape:"</span>, X.shape)

      <span class="fn">print</span>(<span class="str">"Output shape:"</span>, output.shape)

      <span class="kw">assert</span> output.shape == X.shape'
    solution_lang: python — qkv_projection.py
  - title: Implement FlashAttention Concept (Tiling)
    badge: 🔴 HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n           Standard attention has\n           \n            O(N^2)\n           \n           memory complexity. FlashAttention avoids this by block-tiling the computation. Write a naive PyTorch implementation of block-wise attention (without fused CUDA kernels). Loop over chunks of queries (size\n           \n            B_q\n           \n           ) and chunks of keys/values (size\n           \n            B_k\n           \n           ) to compute the softmax incrementally using the online softmax trick, never instantiating the full\n           \n            N x N\n           \n           matrix.\n          </p>"
    done_when: Your chunked attention output matches the standard PyTorch attention output to within 1e-5 tolerance.
    git_cmd: 'git add implement_flashattention_concept_tiling.py &amp;&amp; git commit -m "day94: implement-flashattention-concept-tiling"'
    sol_id: sol-d94t3
    solution_title: ✅ Naive Tiled FlashAttention Implementation
    solution_code: "<span class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core Transformations</span>\n<span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> math\n\n<span class=\"kw\">def</span> <span class=\"fn\">flash_attention_naive</span>(Q, K, V, B_q=<span class=\"num\">2</span>, B_k=<span class=\"num\">2</span>):\n    T, d = Q.shape\n    O = torch.<span class=\"fn\">zeros</span>(T, d)\n    L = torch.<span class=\"fn\">zeros</span>(T, <span class=\"num\">1</span>)\n    M = torch.<span class=\"fn\">fill</span>(torch.<span class=\"fn\">zeros</span>(T, <span class=\"num\">1</span>), <span class=\"fn\">float</span>(<span class=\"str\">'-inf'</span>))\n\n    <span class=\"kw\">for</span> i <span class=\"kw\">in</span> <span class=\"fn\">range</span>(<span class=\"num\">0</span>, T, B_q):\n        q_block = Q[i:i+B_q]\n\n        <span class=\"kw\">for</span> j <span class=\"kw\">in</span> <span class=\"fn\">range</span>(<span class=\"num\">0</span>, T, B_k):\n \
      \           k_block = K[j:j+B_k]\n            v_block = V[j:j+B_k]\n\n            S = torch.<span class=\"fn\">matmul</span>(q_block, k_block.<span class=\"fn\">t</span>()) / math.<span class=\"fn\">sqrt</span>(d)\n            m_block = torch.<span class=\"fn\">max</span>(S, dim=-<span class=\"num\">1</span>, keepdim=<span class=\"kw\">True</span>)[<span class=\"num\">0</span>]\n\n            new_M = torch.<span class=\"fn\">max</span>(M[i:i+B_q], m_block)\n            exp_old = torch.<span class=\"fn\">exp</span>(M[i:i+B_q] - new_M)\n            exp_new = torch.<span class=\"fn\">exp</span>(S - new_M)\n\n            new_L = exp_old * L[i:i+B_q] + torch.<span class=\"fn\">sum</span>(exp_new, dim=-<span class=\"num\">1</span>, keepdim=<span class=\"kw\">True</span>)\n            O[i:i+B_q] = (O[i:i+B_q] * exp_old * L[i:i+B_q] + torch.<span class=\"fn\">matmul</span>(exp_new, v_block)) / new_L\n\n            L[i:i+B_q] = new_L\n            M[i:i+B_q] = new_M\n\n    <span class=\"kw\"\
      >return</span> O\n\nQ = torch.<span class=\"fn\">randn</span>(<span class=\"num\">6</span>, <span class=\"num\">8</span>)\nK = torch.<span class=\"fn\">randn</span>(<span class=\"num\">6</span>, <span class=\"num\">8</span>)\nV = torch.<span class=\"fn\">randn</span>(<span class=\"num\">6</span>, <span class=\"num\">8</span>)\n\nstandard_attn = torch.<span class=\"fn\">softmax</span>(torch.<span class=\"fn\">matmul</span>(Q, K.<span class=\"fn\">t</span>()) / math.<span class=\"fn\">sqrt</span>(<span class=\"num\">8</span>), dim=-<span class=\"num\">1</span>) @ V\ntiled_attn = <span class=\"fn\">flash_attention_naive</span>(Q, K, V)\n\n<span class=\"fn\">print</span>(<span class=\"str\">\"Max Difference:\"</span>, torch.<span class=\"fn\">max</span>(torch.<span class=\"fn\">abs</span>(standard_attn - tiled_attn)).<span class=\"fn\">item</span>())"
    solution_lang: python — flash_attention.py
  quizzes:
  - num_str: Q1 OF 5
    question: Mathematically, what is the variance of the dot product of two vectors of size $d_k$, assuming their elements are i.i.d with mean 0 and variance 1?
    qid: q94_1
    options:
    - letter: A
      text: 1 / √$d_k$
      is_correct: false
    - letter: B
      text: $d_k$
      is_correct: true
    - letter: C
      text: √$d_k$
      is_correct: false
    - letter: D
      text: '1'
      is_correct: false
    correct_fb: ✅ Correct! The variance of the sum of independent variables is the sum of their variances, which equals $d_k$. Scaling by √$d_k$ brings the standard deviation back to 1.
    wrong_fb: ❌ Incorrect. The variance sums up across the dimensions.
  - num_str: Q2 OF 5
    question: Why does an unscaled dot-product cause issues during backpropagation?
    qid: q94_2
    options:
    - letter: A
      text: It leads to floating-point overflows.
      is_correct: false
    - letter: B
      text: It creates zero gradients everywhere.
      is_correct: false
    - letter: C
      text: It pushes the softmax function into regions with extremely small gradients.
      is_correct: true
    - letter: D
      text: It causes memory fragmentation.
      is_correct: false
    correct_fb: ✅ Correct! Large values push the softmax output towards 1 and 0, where the derivative of softmax is nearly flat (vanishing gradients).
    wrong_fb: ❌ Incorrect. Focus on the derivative of the softmax function for extreme values.
  - num_str: Q3 OF 5
    question: What is the memory complexity of calculating the full attention matrix for a sequence of length N?
    qid: q94_3
    options:
    - letter: A
      text: $O(N)$
      is_correct: false
    - letter: B
      text: O(N log N)
      is_correct: false
    - letter: C
      text: $O(N^2)$
      is_correct: true
    - letter: D
      text: $O(1)$
      is_correct: false
    correct_fb: ✅ Correct! The scores matrix is $N \times N$, making self-attention scale quadratically with sequence length.
    wrong_fb: ❌ Incorrect. If every token attends to every other token, how large is the resulting grid?
  - num_str: Q4 OF 5
    question: In causal attention, what value is used to mask out future tokens BEFORE applying softmax?
    qid: q94_4
    options:
    - letter: A
      text: Negative Infinity (-inf)
      is_correct: true
    - letter: B
      text: Zero (0)
      is_correct: false
    - letter: C
      text: One (1)
      is_correct: false
    - letter: D
      text: Positive Infinity (+inf)
      is_correct: false
    correct_fb: ✅ Correct! Setting values to -inf ensures that after the exponentiation in softmax (e^-inf = 0), the attention weight becomes exactly 0.
    wrong_fb: ❌ Incorrect. If you mask with 0, e^0 becomes 1 in the softmax numerator, which still gives a probability!
  - num_str: Q5 OF 5
    question: In the query-key-value analogy, what does the Key ($K$) represent?
    qid: q94_5
    options:
    - letter: A
      text: The search term you are looking for.
      is_correct: false
    - letter: B
      text: The address or label of the information in the database.
      is_correct: true
    - letter: C
      text: The actual content of the database.
      is_correct: false
    - letter: D
      text: The final context vector.
      is_correct: false
    correct_fb: ✅ Correct! Query searches, Key indexes, and Value holds the actual content.
    wrong_fb: ❌ Incorrect. Think of it like a hash map. $Q$ is the lookup, $V$ is the value. What is $K$?
  flashcards:
  - front: What is the Scaled Dot-Product Attention formula?
    back: Attention(Q,K,V) = softmax(Q K^T / sqrt(d_k)) V. The scaling factor sqrt(d_k) prevents dot products from growing large and pushing softmax into vanishing gradients.
  - front: Why does Transformer self-attention have O(N^2) complexity?
    back: Every token in a sequence of length N computes an attention score with every other token, resulting in an N x N attention matrix.
  - front: WSGI vs ASGI?
    back: 'WSGI: Web Server Gateway Interface (synchronous). ASGI: Asynchronous Server Gateway Interface (async, supports WebSockets).'
  - front: Docker Image?
    back: Read-only blueprint template with instructions to build a container environment (defined in a Dockerfile).
  - front: Pydantic Validation?
    back: Python library for data parsing and validation using type hints, raising clear runtime errors for invalid input schemas.
