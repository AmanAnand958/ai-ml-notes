    )

    <span class="cm"># Apply LoRA</span>
    peft_model = <span class="fn">get_peft_model</span>(model, config)
    peft_model.<span class="fn">print_trainable_parameters</span>()
    <span class="cm"># Output: trainable params: 4,194,304 || all params: 6,742,609,920 || trainable%: 0.0622</span></code></pre>
