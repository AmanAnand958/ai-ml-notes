    <pre><code><span class="kw">from</span> peft <span class="kw">import</span> LoraConfig, get_peft_model
    <span class="kw">from</span> transformers <span class="kw">import</span> AutoModelForCausalLM

    <span class="cm"># Load base model</span>
    model = AutoModelForCausalLM.<span class="fn">from_pretrained</span>(<span class="str">"meta-llama/Llama-2-7b-hf"</span>)

    <span class="cm"># Define LoRA Config</span>
    config = <span class="fn">LoraConfig</span>(
        r=<span class="num">8</span>,
        lora_alpha=<span class="num">32</span>,
        target_modules=[<span class="str">"q_proj", "v_proj"</span>],
        lora_dropout=<span class="num">0.05</span>,
