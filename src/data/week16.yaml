  theory_html: "<h3 class=\"sh3\">\n       1. SSE vs WebSockets — When to Use Which\n\
    \      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem\
    \ 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Feature\n\
    \        </th>\n<th>\n         Server-Sent Events (SSE)\n        </th>\n<th>\n\
    \         WebSockets\n        </th>\n</tr>\n<tr>\n<td>\n         Direction\n \
    \       </td>\n<td>\n         Server → Client only\n        </td>\n<td>\n    \
    \     Bidirectional\n        </td>\n</tr>\n<tr>\n<td>\n         Protocol\n   \
    \     </td>\n<td>\n         HTTP/1.1 (normal)\n        </td>\n<td>\n         Upgraded\
    \ TCP (ws://)\n        </td>\n</tr>\n<tr>\n<td>\n         Reconnection\n     \
    \   </td>\n<td>\n         Automatic browser reconnect\n        </td>\n<td>\n \
    \        Manual reconnect logic needed\n        </td>\n</tr>\n<tr>\n<td>\n   \
    \      Best for\n        </td>\n<td>\n         LLM token streaming, live feeds\n\
    \        </td>\n<td>\n         Chat, collaborative editing, games\n        </td>\n\
    </tr>\n<tr>\n<td>\n         Complexity\n        </td>\n<td>\n         Simple —\
    \ just text/event-stream\n        </td>\n<td>\n         Complex — need connection\
    \ state mgmt\n        </td>\n</tr>\n</table></div>\n<h3 class=\"sh3\">\n     \
    \  2. FastAPI SSE Streaming Endpoint\n      </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       Server-Sent\
    \ Events (SSE) stream text chunks from the LLM back to the client in real-time,\
    \ reducing perceived response latency.\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — FASTAPI SSE STREAMING\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">from</span> fastapi <span\
    \ class=\"kw\">import</span> FastAPI\n<span class=\"kw\">from</span> fastapi.responses\
    \ <span class=\"kw\">import</span> StreamingResponse\n<span class=\"kw\">from</span>\
    \ openai <span class=\"kw\">import</span> AsyncOpenAI\n<span class=\"kw\">from</span>\
    \ pydantic <span class=\"kw\">import</span> BaseModel\n<span class=\"kw\">import</span>\
    \ json, asyncio\n\n<span class=\"cm\"># 1. Initialize high-performance asynchronous\
    \ API application</span>\napp = <span class=\"fn\">FastAPI</span>()\nclient =\
    \ <span class=\"fn\">AsyncOpenAI</span>()\n\n<span class=\"kw\">class</span> <span\
    \ class=\"cls\">ChatRequest</span>(BaseModel):\n    message: str\n    history:\
    \ list[dict] = []\n\n<span class=\"kw\">async</span> <span class=\"kw\">def</span>\
    \ <span class=\"fn\">stream_llm_tokens</span>(messages: list) -&gt; str:  <span\
    \ class=\"cm\"># async generator</span>\n    <span class=\"str\">\"\"\"Async generator\
    \ that yields SSE-formatted token chunks.\"\"\"</span>\n    <span class=\"kw\"\
    >async</span> <span class=\"kw\">with</span> <span class=\"kw\">await</span> client.chat.completions.<span\
    \ class=\"fn\">create</span>(\n        model=<span class=\"str\">\"gpt-4o-mini\"\
    </span>,\n        messages=messages,\n        stream=<span class=\"kw\">True</span>\n\
    \    ) <span class=\"kw\">as</span> stream:\n        <span class=\"kw\">async</span>\
    \ <span class=\"kw\">for</span> chunk <span class=\"kw\">in</span> stream:\n \
    \           delta = chunk.choices[<span class=\"str\">\"0\"</span>].delta.content\n\
    \            <span class=\"kw\">if</span> delta:\n                <span class=\"\
    cm\"># SSE format: \"data: {json}\\n\\n\"</span>\n                payload = json.<span\
    \ class=\"fn\">dumps</span>({<span class=\"str\">\"token\": delta, \"done\"</span>:\
    \ <span class=\"kw\">False</span>})\n                <span class=\"kw\">yield</span>\
    \ <span class=\"str\">f\"data: {payload}\\n\\n\"</span>\n        <span class=\"\
    cm\"># Signal stream completion</span>\n        <span class=\"kw\">yield</span>\
    \ <span class=\"str\">f'data: {json.dumps({\"token\": \"\", \"done\": True})}\\\
    n\\n'</span>\n\n<span class=\"cm\"># 2. Define prediction endpoint with Pydantic\
    \ schema validation</span>\n@app.<span class=\"fn\">post</span>(<span class=\"\
    str\">\"/chat/stream\"</span>)\n<span class=\"kw\">async</span> <span class=\"\
    kw\">def</span> <span class=\"fn\">chat_stream</span>(request: ChatRequest):\n\
    \    <span class=\"str\">\"\"\"Returns an SSE stream of LLM tokens.\"\"\"</span>\n\
    \    messages = request.history + [{<span class=\"str\">\"role\": \"user\", \"\
    content\"</span>: request.message}]\n    <span class=\"kw\">return</span> <span\
    \ class=\"fn\">StreamingResponse</span>(\n        <span class=\"fn\">stream_llm_tokens</span>(messages),\n\
    \        media_type=<span class=\"str\">\"text/event-stream\"</span>,\n      \
    \  headers={\n            <span class=\"str\">\"Cache-Control\":       \"no-cache\"\
    </span>,\n            <span class=\"str\">\"X-Accel-Buffering\":   \"no\"</span>,\
    \   <span class=\"cm\"># disable nginx buffering for SSE</span>\n            <span\
    \ class=\"str\">\"Connection\":          \"keep-alive\"</span>,\n        }\n \
    \   )</pre>\n</div>\n<h3 class=\"sh3\">\n       3. JavaScript Frontend — EventSource\
    \ API\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       The EventSource API on the frontend receives streaming\
    \ text chunks from SSE endpoints, updating the UI dynamically.\n      </p>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         JAVASCRIPT\
    \ — SSE CLIENT\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><span class=\"kw\">async</span> function\
    \ <span class=\"fn\">streamChat</span>(message, historyDiv) {\n    // Use fetch\
    \ <span class=\"kw\">for</span> POST <span class=\"fn\">SSE</span> (EventSource\
    \ only supports GET)\n    const response = <span class=\"kw\">await</span> <span\
    \ class=\"fn\">fetch</span>(<span class=\"str\">\"/chat/stream\"</span>, {\n \
    \       method:  <span class=\"str\">\"POST\"</span>,\n        headers: {<span\
    \ class=\"str\">\"Content-Type\": \"application/json\", \"X-API-Key\": \"dev-key-123\"\
    </span>},\n        body:    JSON.<span class=\"fn\">stringify</span>({ message\
    \ })\n    });\n\n    const reader = response.body.<span class=\"fn\">getReader</span>();\n\
    \    const decoder = new <span class=\"fn\">TextDecoder</span>();\n    let buffer\
    \ = <span class=\"str\">\"\"</span>;\n\n    const msgDiv = document.<span class=\"\
    fn\">createElement</span>(<span class=\"str\">\"div\"</span>);\n    msgDiv.className\
    \ = <span class=\"str\">\"ai-message\"</span>;\n    historyDiv.<span class=\"\
    fn\">appendChild</span>(msgDiv);\n\n    <span class=\"kw\">while</span> (true)\
    \ {\n        const { done, value } = <span class=\"kw\">await</span> reader.<span\
    \ class=\"fn\">read</span>();\n        <span class=\"kw\">if</span> (done) <span\
    \ class=\"kw\">break</span>;\n\n        buffer += decoder.<span class=\"fn\">decode</span>(value,\
    \ { stream: true });\n        const lines = buffer.<span class=\"fn\">split</span>(<span\
    \ class=\"str\">\"\\n\"</span>);\n        buffer = lines.<span class=\"fn\">pop</span>();\
    \  // keep incomplete line <span class=\"kw\">in</span> buffer\n\n        <span\
    \ class=\"kw\">for</span> (const line of lines) {\n            <span class=\"\
    kw\">if</span> (!line.<span class=\"fn\">startsWith</span>(<span class=\"str\"\
    >\"data: \"</span>)) <span class=\"kw\">continue</span>;\n            <span class=\"\
    kw\">try</span> {\n                const data = JSON.<span class=\"fn\">parse</span>(line.<span\
    \ class=\"fn\">slice</span>(<span class=\"num\">6</span>));  // remove <span class=\"\
    str\">\"data: \"</span> prefix\n                <span class=\"kw\">if</span> (data.done)\
    \ { console.<span class=\"fn\">log</span>(<span class=\"str\">\"Stream complete\"\
    </span>); <span class=\"kw\">break</span>; }\n                msgDiv.textContent\
    \ += data.token;  // append token to UI\n                historyDiv.scrollTop\
    \ = historyDiv.scrollHeight;  // auto-scroll\n            } <span class=\"fn\"\
    >catch</span> (e) { /* ignore partial JSON */ }\n        }\n    }\n}</pre>\n</div>\n\
    <h3 class=\"sh3\">\n       4. Streamlit Streaming Chat\n      </h3>\n<p style=\"\
    margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n\
    \       Streamlit's built-in chat UI components support streaming token renders,\
    \ offering a clean playground for demonstrating LLM outputs.\n      </p>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON\
    \ — STREAMLIT STREAMING CHAT UI\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"cm\"\
    ># pip install streamlit openai</span>\n<span class=\"cm\"># streamlit run app.py</span>\n\
    <span class=\"kw\">import</span> streamlit <span class=\"kw\">as</span> st\n<span\
    \ class=\"kw\">from</span> openai <span class=\"kw\">import</span> OpenAI\n\n\
    st.<span class=\"fn\">title</span>(<span class=\"str\">\"\U0001F916 AI Chat —\
    \ Streaming Demo\"</span>)\nclient = <span class=\"fn\">OpenAI</span>()\n\n<span\
    \ class=\"cm\"># Session state for conversation history</span>\n<span class=\"\
    kw\">if</span> <span class=\"str\">\"messages\"</span> <span class=\"kw\">not</span>\
    \ <span class=\"kw\">in</span> st.session_state:\n    st.session_state.messages\
    \ = []\n\n<span class=\"cm\"># Render chat history</span>\n<span class=\"kw\"\
    >for</span> msg <span class=\"kw\">in</span> st.session_state.messages:\n    <span\
    \ class=\"kw\">with</span> st.<span class=\"fn\">chat_message</span>(msg[<span\
    \ class=\"str\">\"\\\"role\\\"\"</span>]):\n        st.<span class=\"fn\">markdown</span>(msg[<span\
    \ class=\"str\">\"\\\"content\\\"\"</span>])\n\n<span class=\"cm\"># Chat input\
    \ at the bottom</span>\n<span class=\"kw\">if</span> prompt := st.<span class=\"\
    fn\">chat_input</span>(<span class=\"str\">\"Ask anything...\"</span>):\n    <span\
    \ class=\"cm\"># Show user message</span>\n    st.session_state.messages.<span\
    \ class=\"fn\">append</span>({<span class=\"str\">\"role\": \"user\", \"content\"\
    </span>: prompt})\n    <span class=\"kw\">with</span> st.<span class=\"fn\">chat_message</span>(<span\
    \ class=\"str\">\"user\"</span>): st.<span class=\"fn\">markdown</span>(prompt)\n\
    \n    <span class=\"cm\"># Stream AI response</span>\n    <span class=\"kw\">with</span>\
    \ st.<span class=\"fn\">chat_message</span>(<span class=\"str\">\"assistant\"\
    </span>):\n        <span class=\"cm\"># st.write_stream() handles the streaming\
    \ render automatically!</span>\n        response_text = st.<span class=\"fn\"\
    >write_stream</span>(\n            client.chat.completions.<span class=\"fn\"\
    >create</span>(\n                model=<span class=\"str\">\"gpt-4o-mini\"</span>,\n\
    \                messages=st.session_state.messages,\n                stream=<span\
    \ class=\"kw\">True</span>\n            )\n        )\n    st.session_state.messages.<span\
    \ class=\"fn\">append</span>({<span class=\"str\">\"role\": \"assistant\", \"\
    content\"</span>: response_text})</pre>\n</div>\n<h3 class=\"sh3\">\n       5.\
    \ WebSocket Bidirectional Chat\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       WebSockets establish persistent,\
    \ full-duplex TCP connections, allowing bidirectional real-time text exchange\
    \ for chat dashboards.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         PYTHON — FASTAPI WEBSOCKET CHAT\n      \
    \  </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">from</span> fastapi <span class=\"kw\">import</span> WebSocket,\
    \ WebSocketDisconnect\n\n@app.<span class=\"fn\">websocket</span>(<span class=\"\
    str\">\"/ws/chat\"</span>)\n<span class=\"kw\">async</span> <span class=\"kw\"\
    >def</span> <span class=\"fn\">ws_chat</span>(websocket: WebSocket):\n    <span\
    \ class=\"str\">\"\"\"WebSocket endpoint: receive user messages, stream AI responses.\"\
    \"\"</span>\n    <span class=\"kw\">await</span> websocket.<span class=\"fn\"\
    >accept</span>()\n    history = []\n    <span class=\"kw\">try</span>:\n     \
    \   <span class=\"kw\">while</span> <span class=\"kw\">True</span>:\n        \
    \    <span class=\"cm\"># Receive text message from client</span>\n          \
    \  user_msg = <span class=\"kw\">await</span> websocket.<span class=\"fn\">receive_text</span>()\n\
    \            history.<span class=\"fn\">append</span>({<span class=\"str\">\"\
    role\": \"user\", \"content\"</span>: user_msg})\n\n            <span class=\"\
    cm\"># Send typing indicator</span>\n            <span class=\"kw\">await</span>\
    \ websocket.<span class=\"fn\">send_json</span>({<span class=\"str\">\"type\"\
    : \"typing\", \"content\": \"\"</span>})\n\n            <span class=\"cm\"># Stream\
    \ LLM tokens back to client</span>\n            full_response = <span class=\"\
    str\">\"\"</span>\n            <span class=\"kw\">async</span> <span class=\"\
    kw\">with</span> <span class=\"kw\">await</span> client.chat.completions.<span\
    \ class=\"fn\">create</span>(\n                model=<span class=\"str\">\"gpt-4o-mini\"\
    </span>, messages=history, stream=<span class=\"kw\">True</span>\n           \
    \ ) <span class=\"kw\">as</span> stream:\n                <span class=\"kw\">async</span>\
    \ <span class=\"kw\">for</span> chunk <span class=\"kw\">in</span> stream:\n \
    \                   delta = chunk.choices[<span class=\"str\">\"0\"].delta.content\
    \ or \"\"</span>\n                    <span class=\"kw\">if</span> delta:\n  \
    \                      full_response += delta\n                        <span class=\"\
    kw\">await</span> websocket.<span class=\"fn\">send_json</span>({<span class=\"\
    str\">\"type\": \"token\", \"content\"</span>: delta})\n\n            <span class=\"\
    cm\"># Signal end of stream</span>\n            <span class=\"kw\">await</span>\
    \ websocket.<span class=\"fn\">send_json</span>({<span class=\"str\">\"type\"\
    : \"done\", \"content\"</span>: full_response})\n            history.<span class=\"\
    fn\">append</span>({<span class=\"str\">\"role\": \"assistant\", \"content\"</span>:\
    \ full_response})\n\n    <span class=\"kw\">except</span> WebSocketDisconnect:\n\
    \        <span class=\"fn\">print</span>(<span class=\"str\">\"Client disconnected\"\
    </span>)</pre>\n</div>\n\n<!-- /theory -->\n<h2 class=\"sh2\">\n       ⚡ Tasks\n\
