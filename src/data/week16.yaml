  tasks:
  - title: Install & Test 3 Community MCP Servers
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n         Install Claude Desktop (free). Configure 3 community\
      \ MCP servers: (1) filesystem server pointing to your ML notes folder, (2) SQLite\
      \ server pointing to a test database you create, (3) any server of your choice\
      \ from the MCP registry. Test each by asking Claude to use them and documenting\
      \ what works and what the limitations are.\n        </p>"
    done_when: Claude Desktop shows all 3 servers as connected (green indicator).
      You can ask Claude "list all markdown files in my notes folder" and it correctly
      calls the filesystem server.
    git_cmd: 'git add . &amp;&amp; git commit -m "day111: agentic retrieval and execution
      pipeline capstone"'
    sol_id: sol-w16d111t1
    solution_title: ✅ COMPLETE SOLUTION — install_test_3_community_mcp_servers.py
    solution_code: "<span class=\"cm\"># install_test_3_community_mcp_servers.py —\
      \ Solution</span>\n<span class=\"cm\"># Complete solution for: Install &amp;\
      \ Test 3 Community MCP Servers</span>\n\n<span class=\"cm\"># Guardrails + Retry\
      \ Pipeline for LLM Applications</span>\n<span class=\"cm\"># pip install openai\
      \ pydantic tenacity</span>\n\n<span class=\"kw\">import</span> json\n<span class=\"\
      kw\">import</span> re\n<span class=\"kw\">from</span> openai <span class=\"\
      kw\">import</span> OpenAI\n<span class=\"kw\">from</span> pydantic <span class=\"\
      kw\">import</span> BaseModel, field_validator\n<span class=\"kw\">from</span>\
      \ tenacity <span class=\"kw\">import</span> retry, stop_after_attempt, wait_exponential\n\
      \nclient = <span class=\"fn\">OpenAI</span>()\n\n<span class=\"cm\"># 1. Define\
      \ output schema with validation</span>\n<span class=\"kw\">class</span> <span\
      \ class=\"cls\">SafeResponse</span>(BaseModel):\n    answer: str\n    confidence:\
      \ float\n    sources: list[str]\n    \n    @<span class=\"fn\">field_validator</span>(<span\
      \ class=\"str\">\"answer\"</span>)\n    @classmethod\n    <span class=\"kw\"\
      >def</span> <span class=\"fn\">check_no_pii</span>(cls, v):\n        <span class=\"\
      str\">\"\"\"Block responses containing PII patterns.\"\"\"</span>\n        pii_patterns\
      \ = [\n            r<span class=\"str\">\"\\b\\d{3}-\\d{2}-\\d{4}\\b\"</span>,\
      \  <span class=\"cm\"># SSN</span>\n            r<span class=\"str\">\"\\b\\\
      d{16}\\b\"</span>,               <span class=\"cm\"># Credit card</span>\n \
      \           r<span class=\"str\">\"\\b[A-Z]{2}\\d{6,8}\\b\"</span>,      <span\
      \ class=\"cm\"># Passport</span>\n        ]\n        <span class=\"kw\">for</span>\
      \ pattern <span class=\"kw\">in</span> pii_patterns:\n            <span class=\"\
      kw\">if</span> re.<span class=\"fn\">search</span>(pattern, v):\n          \
      \      <span class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(<span\
      \ class=\"str\">\"Response contains PII — blocked!\"</span>)\n        <span\
      \ class=\"kw\">return</span> v\n    \n    @<span class=\"fn\">field_validator</span>(<span\
      \ class=\"str\">\"confidence\"</span>)\n    @classmethod  \n    <span class=\"\
      kw\">def</span> <span class=\"fn\">check_confidence_range</span>(cls, v):\n\
      \        <span class=\"kw\">if</span> <span class=\"kw\">not</span> <span class=\"\
      num\">0</span> &lt;= v &lt;= <span class=\"num\">1</span>:\n            <span\
      \ class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(<span class=\"\
      str\">\"Confidence must be between 0 and 1\"</span>)\n        <span class=\"\
      kw\">return</span> v\n\n<span class=\"cm\"># 2. Retry-enabled LLM call with\
      \ structured output</span>\n@<span class=\"fn\">retry</span>(stop=<span class=\"\
      fn\">stop_after_attempt</span>(<span class=\"num\">3</span>), wait=<span class=\"\
      fn\">wait_exponential</span>(multiplier=<span class=\"num\">1</span>, min=<span\
      \ class=\"num\">2</span>, max=<span class=\"num\">10</span>))\n<span class=\"\
      kw\">def</span> <span class=\"fn\">safe_llm_call</span>(query: str) -&gt; SafeResponse:\n\
      \    <span class=\"str\">\"\"\"LLM call with automatic retries, structured output,\
      \ and guardrails.\"\"\"</span>\n    response = client.chat.completions.<span\
      \ class=\"fn\">create</span>(\n        model=<span class=\"str\">\"gpt-4o-mini\"\
      </span>,\n        messages=[\n            {<span class=\"str\">\"role\": \"\
      system\", \"content\": \"You are a helpful assistant. Always respond in JSON\
      \ with keys: answer, confidence (0-1), sources (list of URLs).\"</span>},\n\
      \            {<span class=\"str\">\"role\": \"user\", \"content\"</span>: query}\n\
      \        ],\n        response_format={<span class=\"str\">\"type\": \"json_object\"\
      </span>},\n        temperature=<span class=\"num\">0</span>,\n    )\n    \n\
      \    raw = json.<span class=\"fn\">loads</span>(response.choices[<span class=\"\
      num\">0</span>].message.content)\n    \n    <span class=\"cm\"># Validate with\
      \ Pydantic guardrails (raises on PII, bad confidence, etc.)</span>\n    validated\
      \ = <span class=\"fn\">SafeResponse</span>(**raw)\n    <span class=\"kw\">return</span>\
      \ validated\n\n<span class=\"cm\"># 3. Usage</span>\n<span class=\"kw\">try</span>:\n\
      \    result = <span class=\"fn\">safe_llm_call</span>(<span class=\"str\">\"\
      What is gradient descent?\"</span>)\n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Answer: {result.answer}\"</span>)\n    <span class=\"fn\"\
      >print</span>(<span class=\"str\">f\"Confidence: {result.confidence}\"</span>)\n\
      \    <span class=\"fn\">print</span>(<span class=\"str\">f\"Sources: {result.sources}\"\
      </span>)\n<span class=\"kw\">except</span> Exception <span class=\"kw\">as</span>\
      \ e:\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Pipeline failed\
      \ after retries: {e}\"</span>)\n\n<span class=\"kw\">if</span> __name__ == <span\
      \ class=\"str\">'__main__'</span>:\n    <span class=\"fn\">solve</span>()"
    solution_lang: python
  - title: Build a Study Notes MCP Server
    badge: MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n          Build a custom MCP server that gives Claude access\
      \ to your study notes. Tools to implement:\n         </p>\n<ul class=\"prose-list\"\
      >\n<li>\n\n            search_notes(query: str)\n           \n           — semantic\
      \ search over your notes using sentence-transformers + FAISS\n          </li>\n\
      <li>\n\n            get_note(day: int)\n           \n           — return the\
      \ full content of a specific day's notes\n          </li>\n<li>\n\n        \
      \    add_note(day: int, content: str)\n           \n           — append a note\
      \ to the correct file\n          </li>\n<li>\n           Resources: expose all\
      \ .md files in your notes directory\n          </li>\n</ul>\n<p>\n         \
      \ Connect to Claude Desktop and test by asking: \"Find my notes about attention\
      \ mechanisms and summarize them.\"\n         </p>"
    done_when: Server connects to Claude Desktop. Semantic search correctly finds
      relevant notes even without exact keyword matches. Claude can add new notes
      that persist to disk.
    git_cmd: 'git add build_a_study_notes_mcp_server.py &amp;&amp; git commit -m "day111:
      build-a-study-notes-mcp-server"'
    sol_id: sol-w16d111t2
    solution_title: ✅ COMPLETE SOLUTION — build_a_study_notes_mcp_server.py
    solution_code: "<span class=\"cm\"># build_a_study_notes_mcp_server.py — Solution</span>\n\
      <span class=\"cm\"># Complete solution for: Build a Study Notes MCP Server</span>\n\
      \n<span class=\"cm\"># AutoGen Code Review Pipeline</span>\n<span class=\"cm\"\
      ># pip install pyautogen</span>\n\n<span class=\"kw\">import</span> autogen\n\
      \n<span class=\"cm\"># 1. Configure LLM</span>\nconfig_list = [{<span class=\"\
      str\">\"model\": \"gpt-4o-mini\", \"api_key\": \"your-key\"</span>}]\nllm_config\
      \ = {<span class=\"str\">\"config_list\": config_list, \"temperature\"</span>:\
      \ <span class=\"num\">0</span>}\n\n<span class=\"cm\"># 2. Create specialized\
      \ agents</span>\ncode_reviewer = autogen.<span class=\"fn\">AssistantAgent</span>(\n\
      \    name=<span class=\"str\">\"CodeReviewer\"</span>,\n    system_message=<span\
      \ class=\"str\">\"\"\"</span>You are a senior Python code reviewer. \n    Review\
      \ code <span class=\"kw\">for</span>: bugs, security issues, performance, style.\n\
      \    Rate each category <span class=\"num\">1</span>-<span class=\"num\">5</span>\
      \ <span class=\"kw\">and</span> provide specific suggestions.<span class=\"\
      str\">\"\"\"</span>,\n    llm_config=llm_config,\n)\n\nsecurity_auditor = autogen.<span\
      \ class=\"fn\">AssistantAgent</span>(\n    name=<span class=\"str\">\"SecurityAuditor\"\
      </span>,\n    system_message=<span class=\"str\">\"\"\"</span>You are a security\
      \ auditor. \n    Check <span class=\"kw\">for</span>: SQL injection, XSS, credential\
      \ leaks, \n    insecure deserialization, path traversal. Flag any issues.<span\
      \ class=\"str\">\"\"\"</span>,\n    llm_config=llm_config,\n)\n\nuser_proxy\
      \ = autogen.<span class=\"fn\">UserProxyAgent</span>(\n    name=<span class=\"\
      str\">\"Developer\"</span>,\n    human_input_mode=<span class=\"str\">\"NEVER\"\
      </span>,\n    max_consecutive_auto_reply=<span class=\"num\">3</span>,\n   \
      \ code_execution_config=<span class=\"kw\">False</span>,\n)\n\n<span class=\"\
      cm\"># 3. Create group chat for multi-agent review</span>\ngroupchat = autogen.<span\
      \ class=\"fn\">GroupChat</span>(\n    agents=[user_proxy, code_reviewer, security_auditor],\n\
      \    messages=[],\n    max_round=<span class=\"num\">6</span>,\n)\nmanager =\
      \ autogen.<span class=\"fn\">GroupChatManager</span>(groupchat=groupchat, llm_config=llm_config)\n\
      \n<span class=\"cm\"># 4. Submit code for review</span>\ncode_to_review = <span\
      \ class=\"str\">\"\"\"</span>\n<span class=\"kw\">from</span> flask <span class=\"\
      kw\">import</span> Flask, request\n<span class=\"kw\">import</span> sqlite3,\
      \ pickle\n\napp = <span class=\"fn\">Flask</span>(__name__)\n\n@app.<span class=\"\
      fn\">route</span>(<span class=\"str\">\"/user\"</span>)\n<span class=\"kw\"\
      >def</span> <span class=\"fn\">get_user</span>():\n    name = request.args.<span\
      \ class=\"fn\">get</span>(<span class=\"str\">\"name\"</span>)\n    conn = sqlite3.<span\
      \ class=\"fn\">connect</span>(<span class=\"str\">\"users.db\"</span>)\n   \
      \ result = conn.<span class=\"fn\">execute</span>(<span class=\"str\">f\"SELECT\
      \ * FROM users WHERE name='</span>{name}<span class=\"str\">'\"</span>)\n  \
      \  <span class=\"kw\">return</span> <span class=\"fn\">str</span>(result.<span\
      \ class=\"fn\">fetchall</span>())\n\n@app.<span class=\"fn\">route</span>(<span\
      \ class=\"str\">\"/load\"</span>)\n<span class=\"kw\">def</span> <span class=\"\
      fn\">load_data</span>():\n    data = request.<span class=\"fn\">get_data</span>()\n\
      \    <span class=\"kw\">return</span> <span class=\"fn\">str</span>(pickle.<span\
      \ class=\"fn\">loads</span>(data))\n<span class=\"str\">\"\"\"</span>\n\nuser_proxy.<span\
      \ class=\"fn\">initiate_chat</span>(\n    manager,\n    message=<span class=\"\
      str\">f\"Please review this code for quality and security:\\n```python\\n{code_to_review}\\\
      n```\"</span>\n)\n\n<span class=\"kw\">if</span> __name__ == <span class=\"\
      str\">'__main__'</span>:\n    <span class=\"fn\">solve</span>()"
    solution_lang: python
  - title: MCP Server with Prompt Templates + OAuth-Style Auth
