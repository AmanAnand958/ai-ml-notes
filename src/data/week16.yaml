  analogy: API integration testing is like running a practice fire drill in a building.
    You simulate the emergency (client requests) to verify that all exits and alarms
    (API endpoints) function correctly.
  theory_html: "<div id=\"ragas-theory-deep-dive\" style=\"margin: 1.2rem 0; line-height:\
    \ 1.7; font-size: 14px;\">\n<p><strong>Automated LLM &amp; RAG Evaluation Triad\
    \ (RAGAS &amp; TruLens):</strong> Evaluating production Retrieval-Augmented Generation\
    \ systems requires quantifying three independent probabilistic dimensions:</p>\n\
    <div style=\"background: var(--bg2); border: 1px solid var(--border); border-radius:\
    \ 8px; padding: 14px; margin: 1rem 0;\">\n<h4 style=\"color: var(--accent); margin-top:\
    \ 0; margin-bottom: 8px; font-size: 14px;\">\U0001F4D0 The Core RAG Triad Metrics:</h4>\n\
    <ul style=\"margin: 0; padding-left: 20px; font-size: 13.5px; color: var(--text);\"\
    >\n<li><strong>Faithfulness (Grounding):</strong> Measures if every factual claim\
    \ in the generated answer can be mathematically derived from the retrieved context\
    \ chunks, detecting model hallucination.</li>\n<li><strong>Answer Relevance:</strong>\
    \ Measures whether the generated output directly addresses the user's specific\
    \ prompt without drifting into tangential or unprompted assertions.</li>\n<li><strong>Context\
    \ Precision &amp; Recall:</strong> Measures whether all relevant ground-truth\
    \ chunks appear at the top of the retrieval rank ($K$), and whether extraneous\
    \ noise chunks were filtered out.</li>\n</ul>\n</div>\n</div>\n<h3 class=\"sh3\"\
    >\n       1. Evaluation Triad\n      </h3>\n<p>\n       Evaluating RAG involves\
    \ testing: Context Relevance (did we retrieve the right docs?), Faithfulness (is\
    \ the answer based on the docs?), and Answer Relevance (does it answer the query?).\n\
    \      </p>\n<!-- /theory -->\n<h2 class=\"sh2\">\n       ⚡ Tasks\n      </h2>\n\
    <div style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\"\
    >\n       \U0001F50D\n       <strong>\n        Search terms:\n       </strong>\n\
    \n        docker compose multi container environment yaml, docker compose volume\
    \ mounts relative paths\n       \n</div>\n<div class=\"resource-section\" style=\"\
    margin-top:1.5rem;\">\n<h3 style=\"font-size:14px; font-weight:700; color:var(--text);\
    \ margin-bottom:10px;\">\n        \U0001F4DA Recommended Resources\n       </h3>\n\
    </div>\n<!-- ═══════════ DAY 117 ═══════════ -->\n\n<!-- /day-116 -->"
  predict:
    question: What does this verification function for LLM Evaluation (RAGAS & TruLens)
