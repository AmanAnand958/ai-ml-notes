    badge: MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: |-
      <p><strong>
                Build a dataset of 50 instruction-response pairs in the Alpaca format for a custom task (e.g., converting raw Python code to documented code, translating tech terms to simple Hindi, or generating SQL from natural language). Requirements:
               </strong></p>
