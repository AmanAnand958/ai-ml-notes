  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">\n       1. Why LLMOps is Different\
    \ from MLOps\n      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table\
    \ class=\"concept-table\">\n<tr>\n<th>\n         Aspect\n        </th>\n<th>\n         Traditional MLOps\n        </th>\n\
    <th>\n         LLMOps\n        </th>\n</tr>\n<tr>\n<td>\n         Model versioning\n        </td>\n<td>\n         Model\
