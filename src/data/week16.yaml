  tasks:
  - title: FastAPI "Hello RAG" App
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p><strong>\n         Build a minimal FastAPI app with: (1) a POST /query endpoint that takes {\"question\"\
      : \"...\"} and returns a mock {\"answer\": \"...\"}, (2) a GET /health endpoint, (3) API key auth via X-API-Key header,\
      \ (4) automatic /docs page with OpenAPI. Test with curl and the built-in Swagger UI. Then run it with\n         \n \
      \         uvicorn main:app --reload\n         \n         .\n        </strong></p>"
    done_when: When pOST /query returns a 200 response. GET /query with wrong API key returns 403. /docs page shows interactive
      Swagger UI. You can test endpoints directly in the browser.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day112: complete day 112 tasks and coding exercises"'
    sol_id: sol-w16d112t1
    solution_title: ✅ COMPLETE SOLUTION — fastapi_hello_rag_app.py
    solution_code: |
      # Day 112 Task 1: FastAPI RAG Microservice
      from fastapi import FastAPI
      from pydantic import BaseModel
      from typing import List

      app = FastAPI(title="Production RAG API")

      DOCUMENTS = [
          "FlashAttention optimizes GPU SRAM IO bandwidth.",
          "PagedAttention eliminates memory fragmentation in vLLM.",
          "LoRA injects low-rank parameter update matrices."
      ]

      class QueryRequest(BaseModel):
          query: str
          top_k: int = 2

      class QueryResponse(BaseModel):
          query: str
          retrieved: List[str]

      @app.post("/rag/query", response_model=QueryResponse)
      def query_rag(req: QueryRequest):
          words = req.query.lower().split()
          hits = [doc for doc in DOCUMENTS if any(w in doc.lower() for w in words)]
          return QueryResponse(query=req.query, retrieved=hits[:req.top_k])

      # Verification via test client simulation
      req = QueryRequest(query="Tell me about vLLM memory")
      res = query_rag(req)
      print("FastAPI RAG Response:", res.retrieved)
      assert len(res.retrieved) >= 1
      print("✓ FastAPI RAG microservice verified.")
    solution_lang: python
