  theory_html: "<h3 class=\"sh3\">\n       1. Why LLMOps is Different from MLOps\n\
    \      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem\
    \ 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Aspect\n\
    \        </th>\n<th>\n         Traditional MLOps\n        </th>\n<th>\n      \
    \   LLMOps\n        </th>\n</tr>\n<tr>\n<td>\n         Model versioning\n    \
    \    </td>\n<td>\n         Model weights (GB files)\n        </td>\n<td>\n   \
    \      Prompt versions + tiny adapters (KB–MB)\n        </td>\n</tr>\n<tr>\n<td>\n\
    \         Evaluation\n        </td>\n<td>\n         Accuracy, F1 on held-out set\n\
    \        </td>\n<td>\n         LLM-as-judge, human preference, RAGAS metrics\n\
    \        </td>\n</tr>\n<tr>\n<td>\n         Latency\n        </td>\n<td>\n   \
    \      ms for inference\n        </td>\n<td>\n         s for LLM calls — streaming\
    \ changes everything\n        </td>\n</tr>\n<tr>\n<td>\n         Cost driver\n\
    \        </td>\n<td>\n         GPU serving cost\n        </td>\n<td>\n       \
    \  Token cost × number of API calls\n        </td>\n</tr>\n<tr>\n<td>\n      \
    \   Failures\n        </td>\n<td>\n         Wrong predictions (measurable)\n \
    \       </td>\n<td>\n         Hallucinations, prompt injection, format failures\
    \ (hard to detect)\n        </td>\n</tr>\n</table></div>\n<h3 class=\"sh3\">\n\
    \       2. LangSmith — Tracing Every LLM Call\n      </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       LangSmith\
    \ records input/output tokens, latencies, and function calls, providing comprehensive\
    \ tracing for debugging agent chains.\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">gitignore</span>\n<div class=\"cb-btns\">\n\
    <button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n     \
    \    </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left:\
    \ 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span\
    \ class=\"kw\">import</span> os\n\n<span class=\"cm\"># 3 env vars — that's all\
    \ LangSmith needs</span>\nos.environ[<span class=\"str\">\"\\\"LANGCHAIN_TRACING_V2\\\
    \"\"]   = \"true\"</span>\nos.environ[<span class=\"str\">\"\\\"LANGCHAIN_API_KEY\\\
    \"\"]       = \"lsv2_...\"</span>        <span class=\"cm\"># from smith.langchain.com</span>\n\
    os.environ[<span class=\"str\">\"\\\"LANGCHAIN_PROJECT\\\"\"]       = \"my-rag-app\"\
    </span>    <span class=\"cm\"># project namespace</span>\n\n<span class=\"cm\"\
    ># Now every LangChain call is automatically traced</span>\n<span class=\"kw\"\
    >from</span> langchain_openai <span class=\"kw\">import</span> ChatOpenAI\n<span\
    \ class=\"kw\">from</span> langchain_core.prompts <span class=\"kw\">import</span>\
    \ ChatPromptTemplate\n<span class=\"kw\">from</span> langchain_core.output_parsers\
    \ <span class=\"kw\">import</span> StrOutputParser\n\nchain = (\n    ChatPromptTemplate.<span\
    \ class=\"fn\">from_template</span>(<span class=\"str\">\"Answer in 1 sentence:\
    \ {question}\"</span>)\n    | <span class=\"fn\">ChatOpenAI</span>(model=<span\
    \ class=\"str\">\"gpt-4o-mini\"</span>)\n    | <span class=\"fn\">StrOutputParser</span>()\n\
    )\n\n<span class=\"cm\"># This call is automatically traced — visible in the LangSmith\
    \ UI</span>\nresult = chain.<span class=\"fn\">invoke</span>({<span class=\"str\"\
    >\"question\": \"What is attention in transformers?\"</span>})\n<span class=\"\
    cm\"># LangSmith shows: prompt, model, response, latency, tokens, cost</span>\n\
    \n<span class=\"cm\"># --- Manual tracing with @traceable decorator ---</span>\n\
    <span class=\"kw\">from</span> langsmith <span class=\"kw\">import</span> traceable\n\
    \n@<span class=\"fn\">traceable</span>(run_type=<span class=\"str\">\"chain\"\
    , name=\"my-rag-pipeline\"</span>)\n<span class=\"kw\">def</span> <span class=\"\
    fn\">my_rag</span>(query: str) -&gt; str:\n    <span class=\"cm\"># Any function\
    \ decorated with @traceable is captured in LangSmith</span>\n    context = <span\
    \ class=\"str\">\"...\"</span>  <span class=\"cm\"># retrieval step</span>\n \
    \   answer  = chain.<span class=\"fn\">invoke</span>({<span class=\"str\">\"question\"\
    </span>: query})\n    <span class=\"kw\">return</span> answer</code></pre>\n</div>\n\
    <h3 class=\"sh3\">\n       3. Systematic LLM Evaluation\n      </h3>\n<p>\n  \
    \     Manual testing is not enough for production. You need a test dataset and\
    \ automated scoring that runs on every code change — exactly like unit tests in\
    \ software engineering.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         PYTHON — EVALUATION PIPELINE\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><code><span class=\"kw\">from</span> langsmith <span class=\"kw\">import</span>\
    \ Client\n<span class=\"kw\">from</span> langsmith.evaluation <span class=\"kw\"\
    >import</span> evaluate, LangChainStringEvaluator\n\nclient = <span class=\"fn\"\
    >Client</span>()\n\n<span class=\"cm\"># 1. Define test dataset (stored in LangSmith)</span>\n\
    dataset = client.<span class=\"fn\">create_dataset</span>(<span class=\"str\"\
    >\"rag-qa-eval\", description=\"RAG system evaluation set\"</span>)\ntest_cases\
    \ = [\n    {<span class=\"str\">\"inputs\": {\"question\": \"What is backpropagation?\"\
    </span>},\n     <span class=\"str\">\"outputs\": {\"answer\": \"Backpropagation\
    \ is an algorithm for computing gradients in neural networks.\"</span>}},\n  \
    \  {<span class=\"str\">\"inputs\": {\"question\": \"What does LSTM stand for?\"\
    </span>},\n     <span class=\"str\">\"outputs\": {\"answer\": \"Long Short-Term\
    \ Memory.\"</span>}},\n]\nclient.<span class=\"fn\">create_examples</span>(inputs=[t[<span\
    \ class=\"str\">\"\\\"inputs\\\"\"</span>] <span class=\"kw\">for</span> t <span\
    \ class=\"kw\">in</span> test_cases],\n                       outputs=[t[<span\
    \ class=\"str\">\"\\\"outputs\\\"\"</span>] <span class=\"kw\">for</span> t <span\
    \ class=\"kw\">in</span> test_cases],\n                       dataset_id=dataset.id)\n\
    \n<span class=\"cm\"># 2. Define the application to evaluate</span>\n<span class=\"\
    kw\">def</span> <span class=\"fn\">my_app</span>(inputs: dict) -&gt; dict:\n \
    \   result = chain.<span class=\"fn\">invoke</span>(inputs)\n    <span class=\"\
    kw\">return</span> {<span class=\"str\">\"answer\"</span>: result}\n\n<span class=\"\
    cm\"># 3. Define evaluators</span>\nqa_evaluator    = <span class=\"fn\">LangChainStringEvaluator</span>(<span\
    \ class=\"str\">\"qa\"</span>)           <span class=\"cm\"># LLM judges correctness</span>\n\
    cosine_evaluator = <span class=\"fn\">LangChainStringEvaluator</span>(<span class=\"\
    str\">\"embedding_distance\"</span>)  <span class=\"cm\"># embedding similarity</span>\n\
    \n<span class=\"cm\"># 4. Run the evaluation — results visible in LangSmith dashboard</span>\n\
    results = <span class=\"fn\">evaluate</span>(\n    my_app,\n    data=<span class=\"\
    str\">\"rag-qa-eval\"</span>,\n    evaluators=[qa_evaluator, cosine_evaluator],\n\
    \    experiment_prefix=<span class=\"str\">\"gpt-4o-mini-v1\"</span>\n)\n<span\
    \ class=\"fn\">print</span>(results.<span class=\"fn\">to_pandas</span>()[[<span\
    \ class=\"str\">\"question\", \"score\", \"reasoning\"</span>]])</code></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       4. Guardrails AI — Output Validation\n    \
    \  </h3>\n<p>\n       LLMs can return wrong types, missing fields, toxic content,\
    \ or PII. Guardrails AI wraps your LLM call with validators — if the output fails\
    \ validation, it can retry automatically with a correction prompt.\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   PYTHON — GUARDRAILS AI SETUP\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span class=\"\
    cm\"># pip install guardrails-ai</span>\n<span class=\"kw\">from</span> guardrails\
    \ <span class=\"kw\">import</span> Guard\n<span class=\"kw\">from</span> guardrails.hub\
    \ <span class=\"kw\">import</span> ToxicLanguage, ValidLength, DetectPII\n<span\
    \ class=\"kw\">from</span> pydantic <span class=\"kw\">import</span> BaseModel,\
    \ Field\n\n<span class=\"cm\"># --- Method 1: Pydantic schema validation ---</span>\n\
    <span class=\"kw\">class</span> <span class=\"cls\">ProductSummary</span>(BaseModel):\n\
    \    title:      str = <span class=\"fn\">Field</span>(min_length=<span class=\"\
    num\">5</span>,  max_length=<span class=\"num\">100</span>)\n    rating:     int\
    \ = <span class=\"fn\">Field</span>(ge=<span class=\"num\">1</span>, le=<span\
    \ class=\"num\">5</span>)\n    summary:    str = <span class=\"fn\">Field</span>(min_length=<span\
    \ class=\"num\">20</span>, max_length=<span class=\"num\">500</span>)\n\nguard\
    \ = Guard.<span class=\"fn\">from_pydantic</span>(ProductSummary)\n\nresult =\
    \ <span class=\"fn\">guard</span>(\n    openai.<span class=\"fn\">OpenAI</span>().chat.completions.create,\n\
    \    prompt=<span class=\"str\">\"Summarize this product: '</span>iPhone <span\
    \ class=\"num\">15</span> Pro — best camera, great performance<span class=\"str\"\
    >'\"</span>,\n    model=<span class=\"str\">\"gpt-4o-mini\"</span>,\n    max_tokens=<span\
    \ class=\"num\">300</span>,\n)\n<span class=\"fn\">print</span>(result.validated_output)\
    \  <span class=\"cm\"># guaranteed to match ProductSummary schema</span>\n\n<span\
    \ class=\"cm\"># --- Method 2: Content safety validators ---</span>\nguard_safe\
    \ = (\n    <span class=\"fn\">Guard</span>()\n    .<span class=\"fn\">use</span>(ToxicLanguage,\
    \ threshold=<span class=\"num\">0.5</span>, on_fail=<span class=\"str\">\"exception\"\
    </span>)   <span class=\"cm\"># raise if toxic</span>\n    .<span class=\"fn\"\
    >use</span>(DetectPII, pii_entities=[<span class=\"str\">\"EMAIL\", \"PHONE\"\
    ], on_fail=\"fix\"</span>)  <span class=\"cm\"># anonymise PII</span>\n    .<span\
    \ class=\"fn\">use</span>(ValidLength, min=<span class=\"num\">10</span>, max=<span\
    \ class=\"num\">1000</span>, on_fail=<span class=\"str\">\"reask\"</span>)  <span\
    \ class=\"cm\"># re-prompt if too short/long</span>\n)\n<span class=\"cm\"># on_fail\
    \ options: \"exception\", \"fix\" (auto-correct), \"reask\" (retry with correction),</span>\n\
    <span class=\"cm\">#                  \"filter\" (remove violating content), \"\
    noop\" (just log)</span></code></pre>\n</div>\n<h3 class=\"sh3\">\n       5. Token\
    \ Budget Monitoring\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       Monitoring token consumption\
    \ across requests prevents budget overruns and highlights inefficient prompt or\
    \ response parameters.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         PYTHON — COST MONITORING CALLBACK\n    \
    \    </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><code><span class=\"kw\">from</span> langchain.callbacks.base <span class=\"\
    kw\">import</span> BaseCallbackHandler\n<span class=\"kw\">from</span> dataclasses\
    \ <span class=\"kw\">import</span> dataclass, field\n<span class=\"kw\">from</span>\
    \ typing <span class=\"kw\">import</span> List, Dict, Any\n<span class=\"kw\"\
    >import</span> logging\n\n@dataclass\n<span class=\"kw\">class</span> <span class=\"\
    cls\">TokenBudgetMonitor</span>(BaseCallbackHandler):\n    <span class=\"str\"\
    >\"\"\"Tracks token usage and alerts when per-request cost exceeds budget.\"\"\
    \"</span>\n    budget_usd:      float = <span class=\"num\">0.01</span>      <span\
    \ class=\"cm\"># alert if any single request costs &gt; $0.01</span>\n    total_cost:\
    \      float = <span class=\"fn\">field</span>(default=<span class=\"num\">0.0</span>)\n\
    \    request_count:   int   = <span class=\"fn\">field</span>(default=<span class=\"\
    num\">0</span>)\n\n    PRICING = {<span class=\"str\">\"gpt-4o-mini\": (0.15,\
    \ 0.60), \"gpt-4o\"</span>: (<span class=\"num\">2.50</span>, <span class=\"num\"\
    >10.00</span>)}\n\n    <span class=\"kw\">def</span> <span class=\"fn\">on_llm_end</span>(<span\
    \ class=\"kw\">self</span>, response, **kwargs):\n        usage = response.llm_output.<span\
    \ class=\"fn\">get</span>(<span class=\"str\">\"token_usage\"</span>, {})\n  \
    \      model  = response.llm_output.<span class=\"fn\">get</span>(<span class=\"\
    str\">\"model_name\", \"gpt-4o-mini\"</span>)\n        inp, out = <span class=\"\
    kw\">self</span>.PRICING.<span class=\"fn\">get</span>(model, (<span class=\"\
    num\">0.15</span>, <span class=\"num\">0.60</span>))\n        cost = (usage.<span\
    \ class=\"fn\">get</span>(<span class=\"str\">\"prompt_tokens\"</span>, <span\
    \ class=\"num\">0</span>) * inp +\n                usage.<span class=\"fn\">get</span>(<span\
    \ class=\"str\">\"completion_tokens\"</span>, <span class=\"num\">0</span>) *\
    \ out) / 1_000_000\n        <span class=\"kw\">self</span>.total_cost  += cost\n\
    \        <span class=\"kw\">self</span>.request_count += <span class=\"num\">1</span>\n\
    \        <span class=\"kw\">if</span> cost &gt; <span class=\"kw\">self</span>.budget_usd:\n\
    \            logging.<span class=\"fn\">warning</span>(<span class=\"str\">f\"\
    ⚠️ Request ${cost:.5f} exceeded budget ${self.budget_usd:.5f}! Tokens: {usage}\"\
    </span>)\n\n    <span class=\"kw\">def</span> <span class=\"fn\">summary</span>(<span\
    \ class=\"kw\">self</span>):\n        avg = <span class=\"kw\">self</span>.total_cost\
    \ / <span class=\"fn\">max</span>(<span class=\"kw\">self</span>.request_count,\
    \ <span class=\"num\">1</span>)\n        <span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"\U0001F4CA {self.request_count} requests | Total: ${self.total_cost:.4f}\
    \ | Avg: ${avg:.6f}\"</span>)\n\nmonitor = <span class=\"fn\">TokenBudgetMonitor</span>(budget_usd=<span\
    \ class=\"num\">0.005</span>)\n<span class=\"cm\"># llm = ChatOpenAI(model=\"\
    gpt-4o-mini\", callbacks=[monitor])</span></code></pre>\n</div>\n\n<!-- /theory\
    \ -->\n<h2 class=\"sh2\">\n       ⚡ Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size:\
    \ 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\">\n       \U0001F50D\
    \n       <strong>\n        Search terms:\n       </strong>\n\n        docker build\
    \ context no such file COPY, docker container environment variable python\n  \
    \     \n</div>\n<div class=\"resource-section\" style=\"margin-top:1.5rem;\">\n\
    <h3> style=\"font-size:14px; font-weight:700; color:var(--text); margin-bottom:10px;\"\
    >\n        \U0001F4DA Recommended Resources\n       </h3>\n</div>\n<!-- ═══════════\
    \ DAY 110 ═══════════ -->\n<!-- /day-109 -->"
