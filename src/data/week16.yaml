- id: 111
  day_num: 111
  title: Model Context Protocol (MCP) — The Universal AI Tool Standard
  subtitle: Anthropic ka MCP ek open standard hai jo AI models aur external tools ke beech communication ko standardize karta
    hai — jaise USB-C ne chargers ko standardize kiya. Aaj hum MCP architecture samjhenge, ek custom MCP server banayenge,
    aur Claude Desktop ke saath connect karenge.
  time_estimate: 5 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - 'Demonstrate MCP''s client-server architecture and the three primitive types: Tools, Resources, and Prompts.'
  - "Build a working MCP server in Python using the official\n        \n         mcp\n        \n        SDK."
  - Connect your MCP server to Claude Desktop and test it interactively.
  - 'Analyze the security model: MCP servers run locally, user grants explicit per-server permissions.'
  - 'Apply: Browse and use existing MCP servers from the community ecosystem.'
  checklist:
