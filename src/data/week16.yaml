    sol_id: sol-w16d108t2
    solution_title: SOLUTION — Dataset Generation Pipeline
    solution_code: "<span class=\"kw\">import</span> json, openai\n<span class=\"\
      kw\">from</span> datasets <span class=\"kw\">import</span> Dataset\n<span class=\"\
      kw\">from</span> tqdm <span class=\"kw\">import</span> tqdm\n\nclient = openai.<span\
      \ class=\"fn\">OpenAI</span>()\n\nSEED_EXAMPLES = [\n    {<span class=\"str\"\
      >\"instruction\": \"Convert this Python function to have full docstrings.\"\
      </span>,\n     <span class=\"str\">\"input\": \"def add(a, b): return a + b\"\
      </span>,\n     <span class=\"str\">\"output\": '</span><span class=\"kw\">def</span>\
      \ <span class=\"fn\">add</span>(a: int, b: int) -&gt; int:\\n    <span class=\"\
      str\">\"\"\"Add two integers.\\n    ...\"\"\"\\n    return a + b'</span>},\n\
      ]\n\n<span class=\"kw\">def</span> <span class=\"fn\">generate_example</span>(template_instruction:\
      \ str) -&gt; dict:\n    <span class=\"str\">\"\"\"Use GPT to generate a new\
      \ instruction-response pair.\"\"\"</span>\n    prompt = <span class=\"str\"\
      >f\"\"\"Generate a new Python documentation example similar to:\\n\"{template_instruction}\"\
      \\n\\nRespond ONLY as JSON with keys: instruction, input, output.\\nMake it\
      \ different and interesting.\"\"\"</span>\n    resp = client.chat.completions.<span\
      \ class=\"fn\">create</span>(\n        model=<span class=\"str\">\"gpt-4o-mini\"\
      , messages=[{\"role\": \"user\", \"content\"</span>: prompt}],\n        temperature=<span\
      \ class=\"num\">0.9</span>, max_tokens=<span class=\"num\">600</span>, response_format={<span\
      \ class=\"str\">\"type\": \"json_object\"</span>}\n    )\n    <span class=\"\
      kw\">return</span> json.<span class=\"fn\">loads</span>(resp.choices[<span class=\"\
      str\">\"0\"</span>].message.content)\n\nexamples = <span class=\"fn\">list</span>(SEED_EXAMPLES)\n\
      <span class=\"kw\">for</span> _ <span class=\"kw\">in</span> <span class=\"\
      fn\">tqdm</span>(<span class=\"fn\">range</span>(<span class=\"num\">40</span>)):\n\
      \    <span class=\"kw\">try</span>:\n        examples.<span class=\"fn\">append</span>(<span\
      \ class=\"fn\">generate_example</span>(SEED_EXAMPLES[<span class=\"str\">\"\
      0\"][\"instruction\"</span>]))\n    <span class=\"kw\">except</span> Exception\
      \ <span class=\"kw\">as</span> e:\n        <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Error: {e}\"</span>)\n\nds = Dataset.<span class=\"fn\">from_list</span>(examples)\n\
      <span class=\"fn\">print</span>(ds)\n\n<span class=\"cm\"># Statistics</span>\n\
      lengths = [<span class=\"fn\">len</span>(x[<span class=\"str\">\"\\\"output\\\
      \"\"</span>]) <span class=\"kw\">for</span> x <span class=\"kw\">in</span> examples]\n\
      <span class=\"fn\">print</span>(<span class=\"str\">f\"Responses — min: {min(lengths)},\
      \ max: {max(lengths)}, avg: {sum(lengths)/len(lengths):.0f} chars\"</span>)\n\
      \n<span class=\"cm\"># Push to Hub (requires: huggingface-cli login)</span>\n\
      <span class=\"cm\"># ds.push_to_hub(\"your-username/python-docstring-dataset\"\
      , private=True)</span>"
