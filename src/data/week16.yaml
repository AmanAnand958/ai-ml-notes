  tasks:
  - title: Parameter Count Calculator
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p><strong>\n         Write a Python function that, given a model\
      \ name and LoRA config (r, target_modules), calculates: (1) total base model\
      \ parameters, (2) trainable LoRA parameters, (3) percentage of trainable params.\
      \ Test on phi-2 (2.7B), Llama-2-7B, and Mistral-7B configs. Without actually\
      \ loading the models — use the published architecture specs to calculate.\n\
      \        </strong></p>"
    done_when: "When function outputs a comparison table. You can manually verify\
      \ against\n         \n          print_trainable_parameters()\n         \n  \
      \       output when models are loaded."
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day108: complete day
      108 tasks and coding exercises"'
    sol_id: sol-w16d108t1
    solution_title: ✅ COMPLETE SOLUTION — parameter_count_calculator.py
    solution_code: "# parameter_count_calculator.py — Solution\n# Complete solution\
      \ for: Parameter Count Calculator\n\nimport torch\nfrom transformers import\
      \ AutoModelForCausalLM, AutoConfig\n\ndef count_parameters(model_name: str)\
      \ -> dict:\n    \"\"\"Count total, trainable, and frozen parameters in a HuggingFace\
      \ model.\"\"\"\n    config = AutoConfig.from_pretrained(model_name)\n    model\
      \ = AutoModelForCausalLM.from_config(config)\n    \n    total = sum(p.numel()\
      \ for p in model.parameters())\n    trainable = sum(p.numel() for p in model.parameters()\
      \ if p.requires_grad)\n    frozen = total - trainable\n    \n    print(f\"Model:\
      \ {model_name}\")\n    print(f\"  Total parameters:     {total:>15,}\")\n  \
      \  print(f\"  Trainable parameters: {trainable:>15,}\")\n    print(f\"  Frozen\
      \ parameters:    {frozen:>15,}\")\n    print(f\"  Size (float32):       {total\
      \ * 4 / 1e9:.2f} GB\")\n    print(f\"  Size (float16):       {total * 2 / 1e9:.2f}\
      \ GB\")\n    \n    # LoRA parameter estimate (r=16, targeting q_proj and v_proj)\n\
      \    r = 16\n    d_model = config.hidden_size\n    n_layers = config.num_hidden_layers\n\
      \    lora_params = 2 * (2 * d_model * r) * n_layers  # 2 matrices × 2 targets\
      \ × layers\n    print(f\"  LoRA params (r={r}):   {lora_params:>15,} ({lora_params/total*100:.4f}%)\"\
      )\n    \n    return {\"total\": total, \"trainable\": trainable, \"frozen\"\
      : frozen, \"lora\": lora_params}\n\n# Example usage\ncount_parameters(\"gpt2\"\
      )\n# count_parameters(\"meta-llama/Llama-2-7b-hf\")  # Requires HF access\n\n\
      if __name__ == '__main__':\n    solve()"
    solution_lang: python
    time_minutes: 30
  - title: Create a Custom Instruction Dataset
    badge: MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p><strong>\n          Build a dataset of 50 instruction-response\
      \ pairs in the Alpaca format for a custom task (e.g., converting raw Python\
      \ code to documented code, translating tech terms to simple Hindi, or generating\
      \ SQL from natural language). Requirements:\n         </strong></p>\n<ul class=\"\
      prose-list\">\n<li>\n           50 examples covering a diverse range of your\
      \ chosen task\n          </li>\n<li>\n           Use GPT-4o-mini to help generate\
      \ high-quality responses (seed 10 manually, generate 40 with the API)\n    \
      \      </li>\n<li>\n           Save as a Hugging Face Dataset and push to your\
      \ Hub (private repo)\n          </li>\n<li>\n           Print: min/max/avg response\
      \ length, vocabulary overlap between instructions\n          </li>\n</ul>"
    done_when: When code executes without errors, passes all unit assertions, and
      prints verified output metrics for Create a Custom Instruction Dataset.
    git_cmd: 'git add . && git commit -m "feat(day108): implement create-a-custom-instruction-da"'
    sol_id: sol-w16d108t2
    solution_title: SOLUTION — Dataset Generation Pipeline
    solution_code: "import json, openai\nfrom datasets import Dataset\nfrom tqdm import\
      \ tqdm\n\nclient = openai.OpenAI()\n\nSEED_EXAMPLES = [\n    {\"instruction\"\
      : \"Convert this Python function to have full docstrings.\",\n     \"input\"\
      : \"def add(a, b): return a + b\",\n     \"output\": 'def add(a: int, b: int)\
      \ -> int:\\n    \"\"\"Add two integers.\\n    ...\"\"\"\\n    return a + b'},\n\
      ]\n\ndef generate_example(template_instruction: str) -> dict:\n    \"\"\"Use\
      \ GPT to generate a new instruction-response pair.\"\"\"\n    prompt = f\"\"\
      \"Generate a new Python documentation example similar to:\\n\"{template_instruction}\"\
      \\n\\nRespond ONLY as JSON with keys: instruction, input, output.\\nMake it\
      \ different and interesting.\"\"\"\n    resp = client.chat.completions.create(\n\
      \        model=\"gpt-4o-mini\", messages=[{\"role\": \"user\", \"content\":\
      \ prompt}],\n        temperature=0.9, max_tokens=600, response_format={\"type\"\
      : \"json_object\"}\n    )\n    return json.loads(resp.choices[\"0\"].message.content)\n\
      \nexamples = list(SEED_EXAMPLES)\nfor _ in tqdm(range(40)):\n    try:\n    \
      \    examples.append(generate_example(SEED_EXAMPLES[\"0\"][\"instruction\"]))\n\
      \    except Exception as e:\n        print(f\"Error: {e}\")\n\nds = Dataset.from_list(examples)\n\
      print(ds)\n\n# Statistics\nlengths = [len(x[\"\\\"output\\\"\"]) for x in examples]\n\
      print(f\"Responses — min: {min(lengths)}, max: {max(lengths)}, avg: {sum(lengths)/len(lengths):.0f}\
      \ chars\")\n\n# Push to Hub (requires: huggingface-cli login)\n# ds.push_to_hub(\"\
      your-username/python-docstring-dataset\", private=True)\nassert lengths is not\
      \ None, \"lengths should not be None\""
    solution_lang: python
    time_minutes: 45
  - title: QLoRA Fine-Tune on Colab
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p><strong>\n         Open Google Colab (free T4 GPU), fine-tune\
      \ a small model (phi-2 or TinyLlama-1.1B) on your Day 2 dataset using QLoRA.\
      \ Requirements:\n        </strong></p>\n<ul class=\"prose-list\">\n<li>\n  \
      \        Load in 4-bit with BitsAndBytesConfig (NF4)\n         </li>\n<li>\n\
      \          Apply LoRA with r=8, alpha=32 on q_proj and v_proj\n         </li>\n\
      <li>\n          Train for 3 epochs with SFTTrainer\n         </li>\n<li>\n \
      \         Log training loss every 10 steps\n         </li>\n<li>\n         \
      \ Compare base model vs fine-tuned model on 5 test prompts\n         </li>\n\
      <li>\n          Save and merge the LoRA adapter\n         </li>\n</ul>"
    done_when: When training loss decreases visibly. Fine-tuned model produces better-formatted
      output on your task compared to the base model on at least 3 of 5 test prompts.
    git_cmd: 'git add qlora_fine_tune_on_colab.py &amp;&amp; git commit -m "feat(day):
      day108: qlora-fine-tune-on-colab"'
    sol_id: sol-w16d108t3
    solution_title: ✅ COMPLETE SOLUTION — qlora_fine_tune_on_colab.py
    solution_code: "# qlora_fine_tune_on_colab.py — Solution\n# Complete solution\
      \ for: QLoRA Fine-Tune on Colab\n\n# QLoRA Fine-Tuning on Google Colab\n# Requires:\
      \ pip install transformers peft bitsandbytes datasets trl accelerate\n\nimport\
      \ torch\nfrom transformers import AutoModelForCausalLM, AutoTokenizer, BitsAndBytesConfig\n\
      from peft import LoraConfig, get_peft_model, prepare_model_for_kbit_training\n\
      from datasets import load_dataset\nfrom trl import SFTTrainer, SFTConfig\n\n\
      # 1. Load model in 4-bit quantization (QLoRA)\nbnb_config = BitsAndBytesConfig(\n\
      \    load_in_4bit=True,\n    bnb_4bit_quant_type=\"nf4\",\n    bnb_4bit_compute_dtype=torch.float16,\n\
      \    bnb_4bit_use_double_quant=True,\n)\n\nmodel_name = \"TinyLlama/TinyLlama-1.1B-Chat-v1.0\"\
      \nmodel = AutoModelForCausalLM.from_pretrained(\n    model_name, quantization_config=bnb_config,\
      \ device_map=\"auto\"\n)\ntokenizer = AutoTokenizer.from_pretrained(model_name)\n\
      tokenizer.pad_token = tokenizer.eos_token\n\n# 2. Prepare for k-bit training\n\
      model = prepare_model_for_kbit_training(model)\n\n# 3. Configure LoRA\nlora_config\
      \ = LoraConfig(\n    r=16,                    # Low rank\n    lora_alpha=32,\
      \           # Scaling factor\n    target_modules=[\"q_proj\", \"v_proj\"], \
      \ # Which layers to adapt\n    lora_dropout=0.05,\n    bias=\"none\",\n    task_type=\"\
      CAUSAL_LM\",\n)\nmodel = get_peft_model(model, lora_config)\nmodel.print_trainable_parameters()\
      \  # Should show ~0.5% trainable\n\n# 4. Load dataset\ndataset = load_dataset(\"\
      tatsu-lab/alpaca\", split=\"train[:1000]\")\n\ndef format_instruction(example):\n\
      \    if example.get(\"input\"):\n        return f\"### Instruction:\\n{example['instruction']}\\\
      n\\n### Input:\\n{example['input']}\\n\\n### Response:\\n{example['output']}\"\
      \n    return f\"### Instruction:\\n{example['instruction']}\\n\\n### Response:\\\
      n{example['output']}\"\n\n# 5. Train with SFTTrainer\ntraining_args = SFTConfig(\n\
      \    output_dir=\"./qlora-output\",\n    num_train_epochs=1,\n    per_device_train_batch_size=4,\n\
      \    gradient_accumulation_steps=4,\n    learning_rate=2e-4,\n    fp16=True,\n\
      \    logging_steps=10,\n    save_strategy=\"epoch\",\n    max_seq_length=512,\n\
      )\n\ntrainer = SFTTrainer(\n    model=model,\n    train_dataset=dataset,\n \
      \   formatting_func=format_instruction,\n    args=training_args,\n    tokenizer=tokenizer,\n\
      )\n\ntrainer.train()\n\n# 6. Save LoRA adapter (small, ~16MB)\nmodel.save_pretrained(\"\
      ./qlora-adapter\")\ntokenizer.save_pretrained(\"./qlora-adapter\")\nprint(\"\
      LoRA adapter saved! Merge with base model for deployment.\")\n\nif __name__\
      \ == '__main__':\n    solve()"
    solution_lang: python
    time_minutes: 60
  quizzes:
  - num_str: Q1 OF 5
    question: Why does LoRA set the A matrix (the right matrix) to random Gaussian
      initialization but the B matrix to zeros at the start of training?
    qid: q108_1
    options:
    - letter: A
      text: It saves GPU memory during initialization
      is_correct: false
      id: a
    - letter: B
      text: So that ΔW = BA = 0 at the start of training, meaning the fine-tuning
        starts from the exact same state as the pre-tra...
      is_correct: true
      id: b
    - letter: C
      text: B is always zero because it represents bias terms
      is_correct: false
      id: c
    - letter: D
      text: Random A + zero B ensures gradient flow is maximised
      is_correct: false
      id: d
    correct_fb: '✅ Correct! If both A and B were random, ΔW = BA would be non-zero
      at step 0, corrupting the pretrained features immediately. By zeroing B: BA
      = 0 at step 0, so the model starts training from its original pretrained state.
      As training progresses, B learns non-zero values.'
    wrong_fb: ❌ The initialization trick ensures ΔW = BA = 0 at step 0 (zero matrix
      × anything = zero). This means training starts from the exact pretrained state.
      Only after the first gradient update does B become non-zero, gradually introducing
      the task-specific adaptation.
    correct: b
  - num_str: Q2 OF 5
    question: What is the key difference between NF4 (NormalFloat4) quantisation and
      standard INT4 quantisation?
    qid: q108_2
    options:
    - letter: A
      text: NF4 uses 4 bits per weight while INT4 uses 8 bits
      is_correct: false
      id: a
    - letter: B
      text: NF4 is information-theoretically optimal for normally-distributed weights
        — its quantisation levels are spaced to min...
      is_correct: true
      id: b
    - letter: C
      text: INT4 is for integers only; NF4 is for floating-point
      is_correct: false
      id: c
    - letter: D
      text: NF4 is faster because it uses unsigned integers
      is_correct: false
      id: d
    correct_fb: ✅ Exactly. INT4 has evenly-spaced quantisation levels (like a ruler
      with equal tick marks). NF4 has more levels near 0 where most weights cluster
      (due to Gaussian distribution) and fewer levels in the tails. This minimises
      the reconstruction error for neural network weights specifically.
    wrong_fb: ❌ Both use 4 bits. The difference is WHERE those 4 bits place their
      quantisation levels. NF4 is designed specifically for Gaussian-distributed weights
      (which neural networks have), placing more precision near 0 where most weights
      are clustered.
    correct: b
  - num_str: Q3 OF 5
    question: Your LoRA fine-tuned model performs well on training data but poorly
      on new inputs. What should you try first?
    qid: q108_3
    options:
    - letter: A
      text: Increase the rank r to capture more complex patterns
      is_correct: false
      id: a
    - letter: B
      text: 'The model is overfitting — try: increasing lora_dropout, reducing r,
        adding more training data (diversity, not just q...'
      is_correct: true
      id: b
    - letter: C
      text: Switch from LoRA to full fine-tuning
      is_correct: false
      id: c
    - letter: D
      text: Increase learning rate for faster convergence
      is_correct: false
      id: d
    correct_fb: '✅ Good diagnosis. Classic overfitting — high training performance,
      low generalisation. Solutions in order: (1) more diverse data, (2) add dropout
      (lora_dropout=0.1), (3) reduce rank r, (4) train fewer epochs (use early stopping
      with validation loss). Increasing r or LR would make it worse.'
    wrong_fb: '❌ Training well + test poorly = overfitting. For LoRA, fixes are: increase
      lora_dropout, reduce rank r (fewer parameters = less overfitting), add more
      diverse training data, or reduce training epochs. Increasing r would increase
      capacity and make overfitting worse.'
    correct: b
  - num_str: Q4 OF 5
    question: "After training, you call\n        \n         merge_and_unload()\n \
      \       \n        on your PEFT model. What does this produce and what are the\
      \ tradeoffs?"
    qid: q108_4
    options:
    - letter: A
      text: It deletes the LoRA adapters to free memory
      is_correct: false
      id: a
    - letter: B
      text: 'It bakes W'' = W + BA into the base weights and returns a standard model
        — Pro: no adapter overhead at inference, load...'
      is_correct: true
      id: b
    - letter: C
      text: It quantises the merged model to 4 bits automatically
      is_correct: false
      id: c
    - letter: D
      text: It exports the model to ONNX format
      is_correct: false
      id: d
    correct_fb: ✅ Correct. merge_and_unload() computes W_new = W_base + B×A for every
      LoRA layer, fusing the adapters into the base weights. The result is a standard
      HuggingFace model with no PEFT overhead — perfect for deployment. But you lose
      the ability to swap adapters dynamically.
    wrong_fb: '❌ merge_and_unload() adds the LoRA update (BA) directly into the base
      weights permanently: W'' = W + BA. The resulting model has no adapter overhead
      and works like any normal transformers model. Tradeoff: can''t switch adapters
      anymore without reloading.'
    correct: b
  - num_str: Q5 OF 5
    question: You want to fine-tune a model to always respond in a specific JSON schema.
      Should you use LoRA fine-tuning or Structured Outputs (OpenAI API feature)?
    qid: q108_5
    options:
    - letter: A
      text: Always LoRA — it's more reliable
      is_correct: false
      id: a
    - letter: B
      text: Use Structured Outputs first — it's instant, zero training cost, schema-enforced
        at the token level. Only fine-tune i...
      is_correct: true
      id: b
    - letter: C
      text: They are equivalent — choose based on personal preference
      is_correct: false
      id: c
    - letter: D
      text: Structured Outputs are only available for classification tasks
      is_correct: false
      id: d
    correct_fb: ✅ Exactly right. For format control (JSON schema), Structured Outputs
      (OpenAI API) or Pydantic output parsers (LangChain) solve the problem perfectly
      with zero training cost. Fine-tuning is overkill for pure format constraints.
      Fine-tune only when the task requires knowledge or style that.
    wrong_fb: ❌ For JSON format enforcement, Structured Outputs are the right tool
      — no training needed, enforced at the grammar/token level, works instantly.
      Save fine-tuning for problems that require changing what the model knows or
      how it reasons, not just how it formats output.
    correct: b
