      response = chain.invoke({\"question\": \"Explain LoRA in simple terms\"})\n\
      print(response.content)\n\n# Method 2: Custom function tracing with @traceable\n\
      @traceable(name=\"custom_rag_pipeline\")\ndef rag_pipeline(query: str) -> str:\n\
