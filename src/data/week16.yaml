  hinglish: 'Soft prompts: trainable tokens prepend karo input sequence mein. Inka koee inherent meaning nahi — model sikhta
    hai inhe optimize karo specific tasks ke liye. Interesting approach hai!'
  analogy: Hugging Face Spaces is like posting a video on YouTube. Instead of hosting a server, you upload the app repository,
    and Hugging Face serves it to the public for free. (This mirrors how Next fundamentally operates.)
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">1. Why Next.js for AI Applications?</h3>\n\
    <p>Python backend frameworks like FastAPI are excellent for model inference, but delivering a <strong>real-time, streaming\
    \ chat UI</strong> requires a frontend framework. Next.js bridges both worlds — it renders React components on the server\
    \ (SSR/RSC) and handles API routes in the same codebase, eliminating the need for a separate Express or Flask layer for\
    \ the web tier.</p>\n<div class=\"callout ci\">\n<strong>Key Architecture Insight:</strong>\n<p>Vercel AI SDK's <code>useChat</code>\
    \ hook consumes a streaming <code>ReadableStream</code> from your Next.js <code>/api/chat</code> route, updating React\
    \ state token-by-token with zero-latency UX. The model never sends a full JSON blob — it streams deltas.</p>\n</div>\n\
    <h3 class=\"sh3\">2. Vercel AI SDK Core Primitives</h3>\n<table class=\"concept-table\">\n<tr><th>Primitive</th><th>Purpose</th><th>Runtime</th></tr>\n\
    <tr><td><code>streamText()</code></td><td>Stream LLM tokens from any model (OpenAI, Anthropic, Gemini, Ollama)</td><td>Server\
    \ (Node/Edge)</td></tr>\n<tr><td><code>useChat()</code></td><td>React hook: manages messages[], loading, and token streaming</td><td>Client\
    \ (React)</td></tr>\n<tr><td><code>useCompletion()</code></td><td>Single-shot streaming text completions</td><td>Client\
    \ (React)</td></tr>\n<tr><td><code>generateObject()</code></td><td>Structured JSON generation with Zod schema validation</td><td>Server</td></tr>\n\
    <tr><td><code>tool()</code></td><td>Define server-side tools the LLM can call (function calling)</td><td>Server</td></tr>\n\
    </table>\n<h3 class=\"sh3\">3. Streaming Architecture: Server to Client</h3>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    ><span class=\"cb-lang\">typescript</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >copy</button></div></div>\n<pre><code class=\"language-typescript\">// app/api/chat/route.ts — Server-side streaming\
    \ endpoint\nimport { streamText } from 'ai';\nimport { openai } from '@ai-sdk/openai';\n\nexport const runtime = 'edge';\
    \ // Run on Vercel Edge Network for true streaming\n\nexport async function POST(req: Request) {\n  const { messages }\
    \ = await req.json();\n  const result = streamText({\n    model: openai('gpt-4o-mini'),\n    messages,\n    maxTokens:\
    \ 1024,\n    temperature: 0.7,\n  });\n  return result.toDataStreamResponse(); // Sends ReadableStream to client\n}\n\n\
    // app/page.tsx — Client component\n'use client';\nimport { useChat } from 'ai/react';\n\nexport default function Chat()\
    \ {\n  const { messages, input, handleInputChange, handleSubmit, isLoading } = useChat();\n  return (\n    &lt;div className=\"\
    flex flex-col h-screen max-w-2xl mx-auto p-4\"&gt;\n      &lt;div className=\"flex-1 overflow-y-auto\"&gt;\n        {messages.map(m\
    \ =&gt; (\n          &lt;div key={m.id}&gt;\n            &lt;strong&gt;{m.role}:&lt;/strong&gt; {m.content}\n        \
    \  &lt;/div&gt;\n        ))}\n        {isLoading &amp;&amp; &lt;span className=\"animate-pulse\"&gt;Thinking...&lt;/span&gt;}\n\
    \      &lt;/div&gt;\n      &lt;form onSubmit={handleSubmit} className=\"flex gap-2 mt-4\"&gt;\n        &lt;input value={input}\
    \ onChange={handleInputChange} className=\"flex-1 border rounded p-2\" /&gt;\n        &lt;button type=\"submit\" className=\"\
    bg-blue-600 text-white px-4 rounded\"&gt;Send&lt;/button&gt;\n      &lt;/form&gt;\n    &lt;/div&gt;\n  );\n}</code></pre>\n\
    </div>\n<h3 class=\"sh3\">4. Server Actions vs. API Routes for Streaming</h3>\n<p>Next.js 14+ allows calling server-side\
    \ functions directly from client components using <strong>React Server Actions</strong>. However, for AI streaming, <code>/api/chat</code>\
    \ routes are preferred because they return a raw <code>Response</code> object with a <code>ReadableStream</code>. React\
    \ Server Actions return serialized data, not raw streams, so the <code>useChat</code> hook cannot consume them directly.</p>\n\
    <h3 class=\"sh3\">5. Multi-Provider Support</h3>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">typescript</span><div\
    \ class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"\
    language-typescript\">import { anthropic } from '@ai-sdk/anthropic';\nimport { google } from '@ai-sdk/google';\nimport\
    \ { ollama } from 'ollama-ai-provider';\n\n// Anthropic Claude — same streamText() API\nconst claudeResult = streamText({\
    \ model: anthropic('claude-3-5-sonnet-20241022'), messages });\n\n// Google Gemini\nconst geminiResult = streamText({\
    \ model: google('gemini-2.0-flash'), messages });\n\n// Local Ollama (no API key, runs on localhost)\nconst localResult\
    \ = streamText({ model: ollama('llama3.2'), messages });</code></pre>\n</div>\n<div class=\"callout cw\">\n<strong>Production\
    \ Note:</strong>\n<p>Always set <code>export const runtime = 'edge'</code> for streaming routes on Vercel. The Node.js\
    \ runtime buffers the response before sending, breaking the streaming UX. The Edge runtime pipes each token immediately\
    \ as it arrives from the model.</p>\n</div>\n<h3 class=\"sh3\">6. Token Streaming Latency Model</h3>\n<p>Time-to-first-token\
    \ (TTFT) and streaming throughput:</p>\n<p>$$\\text{TTFT} = t_{\\text{network}} + t_{\\text{model\\_prefill}}$$</p>\n\
    <p>$$\\text{Total Latency} = \\text{TTFT} + N_{\\text{tokens}} \\cdot \\frac{1}{\\text{TPS}}$$</p>\n<p>For GPT-4o, TPS\
    \ is typically 100–120. Edge streaming ensures the client renders each token the instant it arrives, making TTFT the dominant\
    \ user-perceived latency metric.</p>\n<!-- /theory -->\n<!-- /theory -->\n<!-- /theory -->\n<h2 class=\"sh2\">\n     \
    \  ⚡ Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\"\
    >\n       \U0001F50D\n       <strong>\n        Search terms:\n       </strong>\n\n        gradio custom layout blocks\
    \ gr.Row gr.Column, gradio concurrent request queue limit\n       \n</div>\n<div class=\"resource-section\" style=\"margin-top:1.5rem;\"\
    >\n<h3> style=\"font-size:14px; font-weight:700; color:var(--text); margin-bottom:10px;\"&gt;\n        \U0001F4DA Recommended\
    \ Resources\n       </h3>\n</div>\n<!-- ═══════════ DAY 115 ═══════════ -->\n<!-- /day-114 -->\n"
