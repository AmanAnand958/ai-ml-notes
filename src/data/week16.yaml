  tasks:
  - title: Parameter Count Calculator
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n         Write a Python function that, given a model name and\
      \ LoRA config (r, target_modules), calculates: (1) total base model parameters,\
      \ (2) trainable LoRA parameters, (3) percentage of trainable params. Test on\
      \ phi-2 (2.7B), Llama-2-7B, and Mistral-7B configs. Without actually loading\
      \ the models — use the published architecture specs to calculate.\n        </p>"
    done_when: "Function outputs a comparison table. You can manually verify against\n\
      \         \n          print_trainable_parameters()\n         \n         output\
      \ when models are loaded."
    git_cmd: 'git add . &amp;&amp; git commit -m "day108: complete day 108 tasks and
      coding exercises"'
    sol_id: sol-w16d108t1
    solution_title: ✅ COMPLETE SOLUTION — parameter_count_calculator.py
    solution_code: "<span class=\"cm\"># parameter_count_calculator.py — Solution</span>\n\
      <span class=\"cm\"># Complete solution for: Parameter Count Calculator</span>\n\
      \n<span class=\"kw\">import</span> torch\n<span class=\"kw\">from</span> transformers\
      \ <span class=\"kw\">import</span> AutoModelForCausalLM, AutoConfig\n\n<span\
      \ class=\"kw\">def</span> <span class=\"fn\">count_parameters</span>(model_name:\
      \ str) -&gt; dict:\n    <span class=\"str\">\"\"\"Count total, trainable, and\
      \ frozen parameters in a HuggingFace model.\"\"\"</span>\n    config = AutoConfig.<span\
      \ class=\"fn\">from_pretrained</span>(model_name)\n    model = AutoModelForCausalLM.<span\
      \ class=\"fn\">from_config</span>(config)\n    \n    total = <span class=\"\
      fn\">sum</span>(p.<span class=\"fn\">numel</span>() <span class=\"kw\">for</span>\
      \ p <span class=\"kw\">in</span> model.<span class=\"fn\">parameters</span>())\n\
      \    trainable = <span class=\"fn\">sum</span>(p.<span class=\"fn\">numel</span>()\
      \ <span class=\"kw\">for</span> p <span class=\"kw\">in</span> model.<span class=\"\
      fn\">parameters</span>() <span class=\"kw\">if</span> p.requires_grad)\n   \
      \ frozen = total - trainable\n    \n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Model: {model_name}\"</span>)\n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"  Total parameters:     {total:&gt;15,}\"</span>)\n    <span\
      \ class=\"fn\">print</span>(<span class=\"str\">f\"  Trainable parameters: {trainable:&gt;15,}\"\
      </span>)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"  Frozen\
      \ parameters:    {frozen:&gt;15,}\"</span>)\n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"  Size (float32):       {total * 4 / 1e9:.2f} GB\"</span>)\n\
      \    <span class=\"fn\">print</span>(<span class=\"str\">f\"  Size (float16):\
      \       {total * 2 / 1e9:.2f} GB\"</span>)\n    \n    <span class=\"cm\"># LoRA\
      \ parameter estimate (r=16, targeting q_proj and v_proj)</span>\n    r = <span\
      \ class=\"num\">16</span>\n    d_model = config.hidden_size\n    n_layers =\
      \ config.num_hidden_layers\n    lora_params = <span class=\"num\">2</span> *\
      \ (<span class=\"num\">2</span> * d_model * r) * n_layers  <span class=\"cm\"\
      ># 2 matrices × 2 targets × layers</span>\n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"  LoRA params (r={r}):   {lora_params:&gt;15,} ({lora_params/total*100:.4f}%)\"\
      </span>)\n    \n    <span class=\"kw\">return</span> {<span class=\"str\">\"\
      total\": total, \"trainable\": trainable, \"frozen\": frozen, \"lora\"</span>:\
      \ lora_params}\n\n<span class=\"cm\"># Example usage</span>\n<span class=\"\
      fn\">count_parameters</span>(<span class=\"str\">\"gpt2\"</span>)\n<span class=\"\
      cm\"># count_parameters(\"meta-llama/Llama-2-7b-hf\")  # Requires HF access</span>\n\
      \n<span class=\"kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n\
      \    <span class=\"fn\">solve</span>()"
    solution_lang: python
