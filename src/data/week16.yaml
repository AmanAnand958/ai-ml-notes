      text: Negative cases test that the model correctly refuses or says "I don't know" for out-of-scope or unanswerable question...
      is_correct: true
      id: b
    - letter: C
      text: They balance the dataset for statistical significance
      is_correct: false
      id: c
    - letter: D
      text: Negative cases are only relevant for classification models
      is_correct: false
      id: d
    correct_fb: ✅ Perfect reasoning. A RAG system that always generates an answer (even when the information isn't in the
      retrieved context) has 0% abstention. Without negative cases, you never know the hallucination rate. Include questions
      whose answers are NOT in your corpus — the correct response is "I.
    wrong_fb: ❌ Negative cases (questions whose answers aren't in the corpus) test the model's abstention rate. A model that
      hallucinations answers when it should say "I don't know" is dangerous in production. Without negative cases, your eval
      looks perfect while your hallucination rate might be 50%.
    correct: b
    explanation: ''
