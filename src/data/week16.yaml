    \ class=\"fn\">from_pretrained</span>(<span class=\"str\">\"./my_lora_adapter\"\
    </span>)\ninputs  = <span class=\"fn\">tokenizer</span>(<span class=\"str\">\"\
    ### Instruction:\\nExplain attention.\\n\\n### Response:\\n\", return_tensors=\"\
