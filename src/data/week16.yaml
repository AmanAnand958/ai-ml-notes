week_number: 16
title: Production AI Engineering
description: 'Agentic AI frameworks: LangChain, LangGraph, AutoGen, CrewAI, Function Calling, and MCP (Model Context Protocol).'
days:
- id: 108
  day_num: 108
  title: Fine-Tuning LLMs — LoRA, QLoRA & PEFT
  subtitle: Sirf prompting aur RAG hamesha enough nahi hota. Jab model ko domain-specific knowledge ya ek specific style adopt
    karni ho permanently, tab fine-tuning karo. LoRA aur QLoRA se consumer GPU pe bhi billion-parameter models fine-tune hote
    hain — ye magic hai linear algebra ka.
  time_estimate: 7 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Demonstrate when to use fine-tuning vs. prompting vs. RAG with concrete decision criteria.
  - 'Analyze LoRA''s mathematical trick: decomposing weight updates into two low-rank matrices.'
  - Apply Hugging Face PEFT library to apply LoRA on any transformer model.
  - Run QLoRA (4-bit quantization + LoRA) to fine-tune a 7B model on a free Colab T4 GPU.
  - Build a custom dataset in the Alpaca/ShareGPT instruction format for supervised fine-tuning.
  checklist:
  - id: chk_108_1
    text: Master the core concepts, mathematical principles, and architecture of Fine-Tuning LLMs — LoRA, QLoRA & PEFT
  - id: chk_108_2
    text: Complete hands-on implementation and test assertions for Parameter Count Calculator
  - id: chk_108_3
    text: Validate practical edge cases, performance trade-offs, and failure modes for Day 108
  - id: chk_108_4
    text: Evaluate conceptual mastery via interactive flashcards and quiz challenges
  concept_flow:
  - Fine-Tuning LLMs — LoRA, QLoRA & PEFT
  - LLMOps — Tracing, Evaluation & Guardrails
  - Multi-Agent Systems — LangGraph & AutoGen
  - Model Context Protocol (MCP) — The Universal AI Tool Standard
  - FastAPI + Docker — Production AI App Deployment
  - Streaming Responses & Real-Time AI Interfaces
  - Next.js & Vercel AI SDK
  - LLM Observability with LangSmith & Phoenix
  - LLM Evaluation (RAGAS & TruLens)
  - 'Week 16 Capstone: Production RAG Deployment'
  hinglish: 'Full fine-tuning sab parameters update karta hai — expensive! Parameter-efficient fine-tuning (PEFT): sirf kuch
    parameters train karo, rest freeze. LoRA sabse popular PEFT method hai!'
  analogy: 'LoRA ko samjho jaise IAS exam ki preparation: poora 10 saal ka syllabus dobara padhna (full fine-tuning) vs sirf
    current affairs aur recent question patterns padhna (LoRA) — kyunki model ka base knowledge already solid hai, sirf ek
    specific "layer" add karni hai.'
  theory_html: |
    <h2 class="sh2">🧠 Theory &amp; Concepts</h2>
    <h3 class="sh3">
           1. When to Fine-Tune vs. Prompt vs. RAG
          </h3>
    <div class="table-wrap" style="overflow-x: auto; margin: 1.2rem 0; width: 100%;"><table class="concept-table">
    <tr>
    <th>
             Approach
            </th>
    <th>
             When to Use
            </th>
    <th>
             Cost
            </th>
    <th>
             Latency Impact
            </th>
    </tr>
    <tr>
    <td>
    <strong>
              Prompting
             </strong>
    </td>
    <td>
             General tasks, standard domains, quick iteration
            </td>
    <td>
             Very low
            </td>
    <td>
             None
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              RAG
             </strong>
    </td>
    <td>
             Dynamic knowledge, large private corpora, facts that change
            </td>
    <td>
             Low (storage)
            </td>
    <td>
             +retrieval time
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              Fine-Tuning
             </strong>
    </td>
    <td>
             Specific style/persona, domain jargon, highly structured output, lower inference cost at scale
            </td>
    <td>
             High (one-time training)
            </td>
    <td>
             None (model is smaller)
            </td>
    </tr>
    </table></div>
    <h3 class="sh3">
           2. LoRA — Low-Rank Adaptation
          </h3>
    <p>
           Full fine-tuning updates all model weights — for a 7B parameter model that's 28GB of gradient storage. LoRA observes that
           <strong>
            weight updates during fine-tuning have low intrinsic rank
           </strong>
           , so instead of updating the full weight matrix W, we add a small low-rank update:
          </p>
    <div class="math-block">
    <span class="desc">
            Standard weight update (full fine-tuning):
           </span>
    <span class="formula">
            $$W' = W + \Delta W \quad \text{where } \Delta W \in \mathbb{R}^{d \times k}$$
           </span>
    <span class="desc">
            LoRA approximation — decompose ΔW into two small matrices:
           </span>
    <span class="formula">
            $$\Delta W = BA \quad \text{where } B \in \mathbb{R}^{d \times r},\ A \in \mathbb{R}^{r \times k},\ r \ll \min(d, k)$$
           </span>
    <span class="desc">
            At rank r=8, a 4096×4096 matrix: full ΔW = 16.7M params. LoRA ΔW = 2×(4096×8) = 65K params — a 256× reduction!
           </span>
    </div>
    <svg aria-label="LoRA low-rank decomposition showing frozen weight matrix W and small trainable matrices A and B" height="340" role="img" style="max-width: 100%; height: auto;" viewbox="0 0 700 340" width="700" xmlns="http://www.w3.org/2000/svg">
    <style>
            svg .w16t{font-family:DM Sans,sans-serif} svg .w16m{font-family:IBM Plex Mono,monospace}
           </style>
    <defs>
    <lineargradient id="w16-bg_s" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0%" stop-color="#1a1e2e">
    </stop>
    <stop offset="100%" stop-color="var(--bg)">
    </stop>
    </lineargradient>
    </defs>
    <rect fill="url(#w16-bg_s)" height="340" rx="12" width="700">
    </rect>
    <text class="w16t" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle" x="350" y="26">
            LoRA — W′ = W + BA instead of W + ΔW
           </text>
    <text class="w16t" fill="var(--text2)" font-size="11" text-anchor="middle" x="180" y="52">
            FULL FINE-TUNING
           </text>
    <text class="w16t" fill="var(--text2)" font-size="11" text-anchor="middle" x="460" y="52">
            LORA
           </text>
    <rect fill="var(--bg)" fill-opacity="0.6" height="150" rx="8" stroke="#6c8cff" stroke-width="1.5" width="120" x="120" y="66">
    </rect>
    <text class="w16t" fill="#6c8cff" font-size="12" font-weight="700" text-anchor="middle" x="180" y="120">
            W
           </text>
    <text class="w16t" fill="var(--text2)" font-size="9.5" text-anchor="middle" x="180" y="136">
            d × k
           </text>
    <text class="w16m" fill="#e56b8c" font-size="9.5" text-anchor="middle" x="180" y="158">
            16.7M params
           </text>
    <text class="w16m" fill="#e56b8c" font-size="9.5" text-anchor="middle" x="180" y="196">
            updated → new checkpoint
           </text>
    <rect fill="var(--bg)" fill-opacity="0.6" height="150" rx="8" stroke="#6c8cff" stroke-width="1.5" width="100" x="410" y="66">
    </rect>
    <text class="w16t" fill="#6c8cff" font-size="12" font-weight="700" text-anchor="middle" x="460" y="120">
            W
           </text>
    <text class="w16t" fill="var(--text2)" font-size="9.5" text-anchor="middle" x="460" y="136">
            d × k
           </text>
    <text class="w16t" fill="#4fd1a5" font-size="9.5" font-weight="700" text-anchor="middle" x="460" y="158">
            FROZEN ❄️
           </text>
    <text class="w16m" fill="var(--text2)" font-size="9.5" text-anchor="middle" x="460" y="196">
            0 trainable params
           </text>
    <text class="w16t" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle" x="390" y="130">
            +
           </text>
    <rect fill="#e56b8c" fill-opacity="0.14" height="80" rx="8" stroke="#e56b8c" stroke-width="1.5" width="26" x="516" y="136">
    </rect>
    <text class="w16t" fill="#e56b8c" font-size="10" font-weight="700" text-anchor="middle" x="529" y="168">
            B
           </text>
    <text class="w16m" fill="#e56b8c" font-size="9" text-anchor="middle" x="529" y="184">
            d×r
           </text>
    <rect fill="#f7a94b" fill-opacity="0.14" height="26" rx="8" stroke="#f7a94b" stroke-width="1.5" width="146" x="548" y="160">
    </rect>
    <text class="w16t" fill="#f7a94b" font-size="10" font-weight="700" text-anchor="middle" x="621" y="178">
            A
           </text>
    <text class="w16m" fill="#f7a94b" font-size="9" text-anchor="middle" x="621" y="192">
            r×k
           </text>
    <line stroke="#f5d76e" stroke-width="2" x1="621" x2="621" y1="186" y2="236">
    </line>
    <text class="w16t" fill="#f5d76e" font-size="11" font-weight="700" text-anchor="middle" x="585" y="126">
            ΔW = BA ≈ W′ = W + BA
           </text>
    <rect fill="#f5d76e" fill-opacity="0.1" height="40" rx="8" stroke="#f5d76e" stroke-width="1.5" width="240" x="455" y="236">
    </rect>
    <text class="w16m" fill="#f5d76e" font-size="9.5" text-anchor="middle" x="585" y="254">
            65K params (r=8)
           </text>
    <text class="w16m" fill="#f5d76e" font-size="9.5" text-anchor="middle" x="585" y="268">
            256× fewer · one small adapter file
           </text>
    <text class="w16t" fill="var(--text2)" font-size="10" text-anchor="middle" x="350" y="318">
            Train only B and A — a tiny adapter (~0.1% of params) that can be swapped per task
           </text>
    </svg>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             PYTHON — APPLYING LORA WITH PEFT
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code class="language-html"><span class="cm"># pip install transformers peft accelerate datasets bitsandbytes</span>
    <span class="kw">from</span> transformers <span class="kw">import</span> AutoModelForCausalLM, AutoTokenizer
    <span class="kw">from</span> peft <span class="kw">import</span> LoraConfig, get_peft_model, TaskType
    <span class="kw">import</span> torch

    <span class="cm"># Load base model (use a small one for demo)</span>
    model_name = <span class="str">"microsoft/phi-2"</span>   <span class="cm"># 2.7B params, great for experimentation</span>
    tokenizer  = AutoTokenizer.<span class="fn">from_pretrained</span>(model_name)
    model      = AutoModelForCausalLM.<span class="fn">from_pretrained</span>(
        model_name, torch_dtype=torch.float16, device_map=<span class="str">"auto"</span>
    )

    <span class="cm"># Define LoRA configuration</span>
    lora_config = <span class="fn">LoraConfig</span>(
        task_type=TaskType.CAUSAL_LM,  <span class="cm"># language model fine-tuning</span>
        r=<span class="num">8</span>,                            <span class="cm"># rank — lower r = fewer params, faster but less expressive</span>
        lora_alpha=<span class="num">32</span>,                 <span class="cm"># scaling factor: α/r = 4 (effective learning rate scale)</span>
        target_modules=[<span class="str">"q_proj", "v_proj"</span>],  <span class="cm"># which layers to apply LoRA to</span>
        lora_dropout=<span class="num">0.05</span>,             <span class="cm"># regularization</span>
        bias=<span class="str">"none"</span>                     <span class="cm"># don't add bias parameters</span>
    )

    <span class="cm"># Wrap the model with LoRA — only LoRA params will be trained</span>
    peft_model = <span class="fn">get_peft_model</span>(model, lora_config)
    peft_model.<span class="fn">print_trainable_parameters</span>()
    <span class="cm"># trainable params: 2,097,152 || all params: 2,779,683,840 || trainable%: 0.08%</span>
    <span class="cm"># Only 0.08% of parameters are trained!</span>

    <span class="cm"># Inspect which modules have LoRA adapters</span>
    <span class="kw">for</span> name, module <span class="kw">in</span> peft_model.<span class="fn">named_modules</span>():
        <span class="kw">if</span> <span class="str">"lora"</span> <span class="kw">in</span> name:
            <span class="fn">print</span>(name, <span class="str">"→"</span>, module.__class__.__name__)</code></pre>
    </div>
    <h3 class="sh3">
           3. QLoRA — 4-bit Quantisation + LoRA
          </h3>
    <p>
           QLoRA (Dettmers et al., 2023) lets you fine-tune a
           <strong>
            65B model on a single 48GB GPU
           </strong>
           — or a 7B model on a free Colab T4 (15GB). The trick: load the frozen base model in 4-bit NormalFloat (NF4) quantisation, add 16-bit LoRA adapters on top. Gradients flow through LoRA (fp16) but base model stays 4-bit.
          </p>
    <div class="table-wrap" style="overflow-x: auto; margin: 1.2rem 0; width: 100%;"><table class="concept-table">
    <tr>
    <th>
             Technique
            </th>
    <th>
             Memory for 7B model
            </th>
    <th>
             Quality vs Full FT
            </th>
    </tr>
    <tr>
    <td>
             Full fine-tuning (fp16)
            </td>
    <td>
             ~112 GB
            </td>
    <td>
             Baseline
            </td>
    </tr>
    <tr>
    <td>
             LoRA (fp16 base)
            </td>
    <td>
             ~14 GB
            </td>
    <td>
             ~97% of full FT
            </td>
    </tr>
    <tr>
    <td>
             QLoRA (4-bit base + fp16 LoRA)
            </td>
    <td>
             ~6 GB
            </td>
    <td>
             ~95% of full FT
            </td>
    </tr>
    </table></div>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             PYTHON — QLORA SETUP WITH BITSANDBYTES
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code class="language-html"><span class="kw">import</span> torch

    <span class="kw">from</span> transformers <span class="kw">import</span> BitsAndBytesConfig
    <span class="kw">from</span> peft <span class="kw">import</span> prepare_model_for_kbit_training

    <span class="cm"># 4-bit quantisation config (NF4 = NormalFloat4, best quality)</span>
    bnb_config = <span class="fn">BitsAndBytesConfig</span>(
        load_in_4bit=<span class="kw">True</span>,
        bnb_4bit_quant_type=<span class="str">"nf4"</span>,          <span class="cm"># NormalFloat4 — optimal for normally-distributed weights</span>
        bnb_4bit_compute_dtype=torch.bfloat16, <span class="cm"># compute in bf16 even though stored in 4-bit</span>
        bnb_4bit_use_double_quant=<span class="kw">True</span>,       <span class="cm"># quantise the quantisation constants too (saves ~0.4 bits/param)</span>
    )

    <span class="cm"># Load in 4-bit — only ~6GB for a 7B model!</span>
    model = AutoModelForCausalLM.<span class="fn">from_pretrained</span>(
        <span class="str">"meta-llama/Llama-2-7b-hf"</span>,
        quantization_config=bnb_config,
        device_map=<span class="str">"auto"</span>,
    )

    <span class="cm"># Prepare for k-bit training: cast layer norms to fp32, enable gradient checkpointing</span>
    model = <span class="fn">prepare_model_for_kbit_training</span>(model)

    <span class="cm"># Apply LoRA on top of the quantised model</span>
    lora_config = <span class="fn">LoraConfig</span>(
        r=<span class="num">16</span>,
        lora_alpha=<span class="num">64</span>,
        target_modules=[<span class="str">"q_proj", "k_proj", "v_proj", "o_proj"</span>],  <span class="cm"># all attention projections</span>
        lora_dropout=<span class="num">0.1</span>,
        task_type=TaskType.CAUSAL_LM,
    )
    peft_model = <span class="fn">get_peft_model</span>(model, lora_config)
    peft_model.<span class="fn">print_trainable_parameters</span>()
    <span class="cm"># trainable params: 33,554,432 || all params: 3,540,389,888 || trainable%: 0.95%</span></code></pre>
    </div>
    <h3 class="sh3">
           4. Dataset Preparation — Alpaca &amp; ShareGPT Formats
          </h3>
    <p>
           Supervised Fine-Tuning (SFT) needs instruction-response pairs. The two dominant formats are Alpaca (simple) and ShareGPT (multi-turn conversation). Both ultimately get formatted into a single string that the model learns to predict.
          </p>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             PYTHON — DATASET FORMATTING FOR SFT
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code class="language-html"><span class="kw">from</span> datasets <span class="kw">import</span> Dataset

    <span class="cm"># --- Alpaca format ---</span>
    alpaca_examples = [
        {
            <span class="str">"instruction": "Explain gradient descent in Hindi in 2 sentences."</span>,
            <span class="str">"input": ""</span>,   <span class="cm"># optional extra context</span>
            <span class="str">"output":     "Gradient descent ek optimization algorithm hai jo loss ko minimise karta hai. Ye har step mein gradient ke ulte direction mein weights ko update karta hai."</span>
        }
    ]

    <span class="kw">def</span> <span class="fn">alpaca_to_prompt</span>(sample: dict) -&gt; str:
        <span class="str">"""Format one Alpaca sample into a training string."""</span>
        inp = (<span class="str">f"\n\n### Input:\n{sample['</span>input<span class="str">']}" if sample["\"input\""] else ""</span>)
        <span class="kw">return</span> (
            <span class="str">f"### Instruction:\n{sample["'</span>instruction<span class="str">'"]}{inp}\n\n"</span>
            <span class="str">f"### Response:\n{sample["'</span>output<span class="str">'"]}"</span>
        )

    <span class="cm"># --- ShareGPT format (multi-turn) ---</span>
    sharegpt_example = {
        <span class="str">"conversations"</span>: [
            {<span class="str">"from": "human",  "value": "What is a transformer architecture?"</span>},
            {<span class="str">"from": "gpt",    "value": "A transformer is a neural network architecture..."</span>},
            {<span class="str">"from": "human",  "value": "What problem does attention solve?"</span>},
            {<span class="str">"from": "gpt",    "value": "Attention solves the fixed-length bottleneck..."</span>},
        ]
    }

    <span class="cm"># Use TRL's SFTTrainer which handles formatting automatically</span>
    <span class="kw">from</span> trl <span class="kw">import</span> SFTTrainer
    <span class="kw">from</span> transformers <span class="kw">import</span> TrainingArguments

    training_args = <span class="fn">TrainingArguments</span>(
        output_dir=<span class="str">"./lora_output"</span>,
        num_train_epochs=<span class="num">3</span>,
        per_device_train_batch_size=<span class="num">4</span>,
        gradient_accumulation_steps=<span class="num">4</span>,   <span class="cm"># effective batch = 16</span>
        learning_rate=<span class="num">2e-4</span>,               <span class="cm"># higher than full FT because only few params trained</span>
        fp16=<span class="kw">True</span>,
        logging_steps=<span class="num">10</span>,
        save_steps=<span class="num">100</span>,
        warmup_ratio=<span class="num">0.03</span>,
        lr_scheduler_type=<span class="str">"cosine"</span>,
    )

    <span class="cm"># SFTTrainer handles tokenisation, packing, and formatting</span>
    trainer = <span class="fn">SFTTrainer</span>(
        model=peft_model,
        args=training_args,
        train_dataset=Dataset.<span class="fn">from_list</span>(alpaca_examples),
        formatting_func=alpaca_to_prompt,
        max_seq_length=<span class="num">2048</span>,
    )
    <span class="cm"># trainer.train()  # uncomment to actually train</span></code></pre>
    </div>
    <h3 class="sh3">
           5. Merging &amp; Saving LoRA Adapters
          </h3>
    <p style="margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;">
           After fine-tuning, merging LoRA adapter weights directly back into the base model prevents inference latency and simplifies model sharing.
          </p>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             PYTHON — SAVE, MERGE &amp; PUSH TO HUB
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code class="language-html"><span class="kw">import</span> torch

    <span class="cm"># Option A: Save just the LoRA adapters (tiny, ~16MB for r=16)</span>
    peft_model.<span class="fn">save_pretrained</span>(<span class="str">"./my_lora_adapter"</span>)
    tokenizer.<span class="fn">save_pretrained</span>(<span class="str">"./my_lora_adapter"</span>)

    <span class="cm"># Option B: Merge LoRA weights into base model (for faster inference — no adapter overhead)</span>
    <span class="kw">from</span> peft <span class="kw">import</span> PeftModel

    base   = AutoModelForCausalLM.<span class="fn">from_pretrained</span>(<span class="str">"microsoft/phi-2"</span>, torch_dtype=torch.float16)
    merged = PeftModel.<span class="fn">from_pretrained</span>(base, <span class="str">"./my_lora_adapter"</span>)
    merged = merged.<span class="fn">merge_and_unload</span>()     <span class="cm"># bakes LoRA into base weights: W' = W + BA</span>
    merged.<span class="fn">save_pretrained</span>(<span class="str">"./merged_model"</span>)

    <span class="cm"># Option C: Push to Hugging Face Hub for sharing / deployment</span>
    peft_model.<span class="fn">push_to_hub</span>(<span class="str">"your-username/my-lora-model"</span>)

    <span class="cm"># Load and use later</span>
    <span class="kw">from</span> peft <span class="kw">import</span> AutoPeftModelForCausalLM
    loaded = AutoPeftModelForCausalLM.<span class="fn">from_pretrained</span>(<span class="str">"./my_lora_adapter"</span>)
    inputs  = <span class="fn">tokenizer</span>(<span class="str">"### Instruction:\nExplain attention.\n\n### Response:\n", return_tensors="pt"</span>)
    outputs = loaded.<span class="fn">generate</span>(**inputs, max_new_tokens=<span class="num">200</span>, temperature=<span class="num">0.7</span>)
    <span class="fn">print</span>(tokenizer.<span class="fn">decode</span>(outputs[<span class="num">0</span>], skip_special_tokens=<span class="kw">True</span>))</code></pre>
    </div>
    <!-- /theory -->
    <h2 class="sh2">
           ⚡ Tasks
          </h2>
  predict:
    question: What is the output shape of the Multi-Head Attention projection tensor (Batch, Seq_Len, Hidden_Dim)?
