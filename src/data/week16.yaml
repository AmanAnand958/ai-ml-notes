    \ float\n    tokens_used: int\n\n<span class=\"cm\"># --- Endpoints ---</span>\n<span class=\"cm\"># 2. Define prediction\
    \ endpoint with Pydantic schema validation</span>\n@app.<span class=\"fn\">post</span>(<span class=\"str\">\"/query\"\
    </span>, response_model=QueryResponse, dependencies=[<span class=\"fn\">Depends</span>(verify_api_key)])\n<span class=\"\
    kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">query_documents</span>(request: QueryRequest):\n  \
    \  <span class=\"str\">\"\"\"Answer a question using RAG over stored documents.\"\"\"</span>\n    t0 = time.<span class=\"\
    fn\">time</span>()\n    collection = app.state.collection\n\n    <span class=\"cm\"># Retrieve</span>\n    results = collection.<span\
    \ class=\"fn\">query</span>(query_texts=[request.question], n_results=request.top_k)\n    context = <span class=\"str\"\
    >\"\\n\\n\".join(results[\"\\\"documents\\\"\"</span>][<span class=\"num\">0</span>])\n    sources = [m.<span class=\"\
