  - title: LangGraph Research Agent with Human Approval
    badge: MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: |-
      <p><strong>
                Build a LangGraph agent that: (1) takes a research question, (2) decides whether to use web search or answer from training data, (3) if web search is chosen, pauses for human approval before calling it, (4) generates a structured report with: summary, key_points (list), sources (list). Use MemorySaver for checkpointing so the conversation can be resumed.
               </strong></p>
    done_when: When code executes without errors, passes all unit assertions, and prints verified output metrics for LangGraph
      Research Agent with Human Approval.
    git_cmd: 'git add . && git commit -m "feat(day110): implement langgraph-research-agent-with-"'
    sol_id: sol-w16d110t2
    solution_title: SOLUTION — Research Agent Graph Structure
    solution_code: |
      # Graph structure:
      # START → classify_query → {needs_search: web_search, no_search: generate_report} → END
      # With interrupt_before=["web_search"] for human approval

      class ResearchState(TypedDict):
          question:      str
          needs_search:  bool
          search_result: str
          report:        dict  # {summary, key_points, sources}
          messages:      Annotated["list, operator.add"]

      def classify_query(state: ResearchState) -> ResearchState:
          """Decide if web search is needed."""
          resp = ChatOpenAI(model="gpt-4o-mini", temperature=0).invoke([
              HumanMessage(content=f"Does answering '{state['question']}' require current web data? Reply only YES or NO.")
          ])
          needs = "YES" in resp.content.upper()
          return {"needs_search": needs, "messages": [resp]}

      def web_search(state: ResearchState) -> ResearchState:
          """Perform web search (runs only after human approval)."""
          # In real implementation: use Tavily or DuckDuckGo API
          result = f"[Web search results for: {state['question']}]"
          return {"search_result": result}

      def generate_report(state: ResearchState) -> ResearchState:
          """Generate structured report."""
          context = state.get("search_result", "No web search performed.")
          # ... LLM call to generate structured report
          return {"report": {"summary": "...", "key_points": [], "sources": []}}

      graph = StateGraph(ResearchState)
      graph.add_node("classify_query", classify_query)
      graph.add_node("web_search", web_search)
      graph.add_node("generate_report", generate_report)
      graph.set_entry_point("classify_query")
      graph.add_conditional_edges("classify_query",
          lambda s: "web_search" if s["\"needs_search\""] else "generate_report")
      graph.add_edge("web_search", "generate_report")
      graph.add_edge("generate_report", END)
      app = graph.compile(checkpointer=MemorySaver(), interrupt_before=["web_search"])
      assert app is not None, "app should not be None"
    solution_lang: python
  - title: AutoGen Code Review Pipeline
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: |-
      <p>
               Build an AutoGen group chat with 4 specialized agents for automated code review: (1)
               <strong>
                Developer
               </strong>
               : writes Python functions from natural language specs, (2)
               <strong>
                Code Reviewer
               </strong>
               : reviews for bugs, edge cases, style issues, (3)
               <strong>
                Security Auditor
               </strong>
               : checks for security vulnerabilities (injection, unsafe eval, etc.), (4)
               <strong>
                Tech Lead
               </strong>
               : makes final approval or rejection decision. Test with 3 Python coding tasks of varying complexity.
              </p>
    done_when: "All 4 agents participate in the conversation. Security Auditor correctly flags the unsafe\n         \n   \
      \       eval(user_input)\n         \n         pattern. Tech Lead provides a final verdict with summary of all reviewers'\
      \ findings."
    git_cmd: 'git add autogen_code_review_pipeline.py &amp;&amp; git commit -m "feat(day): day110: autogen-code-review-pipeline"'
    sol_id: sol-w16d110t3
    solution_title: ✅ COMPLETE SOLUTION — autogen_code_review_pipeline.py
    solution_code: |
      # Day 110 Task 3: Multi-Agent Collaborative Code Review Pipeline
      from typing import Dict, List

      class CodeReviewAgentTeam:
          def __init__(self):
              self.agents = ["SyntaxCritic", "SecurityAuditor", "PerformanceProfiler"]

          def review_code_snippet(self, code: str) -> Dict[str, List[str]]:
              feedback = {"Security": [], "Performance": [], "Style": []}
              if "eval(" in code or "exec(" in code:
                  feedback["Security"].append("CRITICAL: eval/exec found; replace with safe parser.")
              if "for " in code and ".append(" in code:
                  feedback["Performance"].append("INFO: Consider list comprehension or vectorized NumPy operations.")
              feedback["Style"].append("PASS: Variable naming conforms to PEP-8.")
              return feedback

      team = CodeReviewAgentTeam()
      sample_pr = """def process(items):
          res = []
          for x in items:
              res.append(x * 2)
          return res"""

      review_result = team.review_code_snippet(sample_pr)
      print("Team Review Output:", review_result)
      assert len(review_result["Performance"]) > 0
      print("✓ Multi-agent code review pipeline verified.")
    solution_lang: python
  quizzes:
  - num_str: Question 1
    question: "In LangGraph, why is\n        \n         Annotated[\"list, operator.add\"]\n        \n        used for the\
      \ messages field in the State?"
    qid: q110_1
    options:
    - letter: A
      text: It validates that messages is a valid Python list
      is_correct: false
      id: a
    - letter: B
      text: 'It defines a reducer — when two nodes return {messages: [new_msg]}, the state merges them via list concatenation
        inst...'
      is_correct: true
      id: b
    - letter: C
      text: It makes messages thread-safe for parallel nodes
      is_correct: false
      id: c
    - letter: D
      text: operator.add is needed for JSON serialisation
      is_correct: false
      id: d
    correct_fb: '✅ Perfect. The Annotated reducer tells LangGraph how to merge state updates from nodes. Default merging:
      last-write-wins (new value replaces old). With operator.add, when node returns {messages: [x]}, LangGraph does state.messages
      += [x] instead of state.messages = [x]. Essential for.'
    wrong_fb: ❌ The Annotated["list, operator.add"] is a state reducer definition. Without it, each node's return value would
      overwrite the entire messages list. With operator.add, returns are concatenated — each node appends to the conversation
      history instead of replacing it.
    correct: b
    explanation: ''
  - num_str: Question 2
    question: "What does\n        \n         interrupt_before=[\"tool_node\"]\n        \n        in\n        \n         graph.compile()\n\
      \        \n        do at runtime?"
    qid: q110_2
    options:
    - letter: A
      text: It disables the tool_node permanently
      is_correct: false
      id: a
    - letter: B
      text: Execution stops just before tool_node runs and returns control to the caller. State is checkpointed. The graph
        can be...
      is_correct: true
      id: b
    - letter: C
      text: It adds a timeout of 30s before the tool runs
      is_correct: false
      id: c
    - letter: D
      text: It logs tool inputs for debugging only
      is_correct: false
      id: d
    correct_fb: ✅ Exactly. interrupt_before creates a breakpoint. When the graph reaches the node boundary before tool_node,
      execution freezes, the current state is saved to the checkpointer, and invoke() returns. Passing invoke(None, config)
      with the same thread_id resumes from exactly where it stopped.
    wrong_fb: ❌ interrupt_before is a breakpoint declaration. When execution reaches this node boundary, it pauses, saves
      state to checkpointer, and returns control to your code. You inspect state, get human approval, then resume by calling
      invoke(None, config) with the same thread_id.
    correct: b
    explanation: ''
  - num_str: Question 3
    question: "In AutoGen, what is\n        \n         human_input_mode=\"TERMINATE\"\n        \n        vs\n        \n  \
      \       \"ALWAYS\"\n        \n        vs\n        \n         \"NEVER\"\n        \n        ?"
    qid: q110_3
    options:
    - letter: A
      text: NEVER = fully autonomous (no human interrupts). ALWAYS = human must approve every message. TERMINATE = human only
        ask...
      is_correct: true
      id: a
    - letter: B
      text: These control how the agent terminates conversations
      is_correct: false
      id: b
    - letter: C
      text: TERMINATE is the default and blocks all agent communication
      is_correct: false
      id: c
    - letter: D
      text: They are the same — just different names for the same behavior
      is_correct: false
      id: d
    correct_fb: ✅ Correct. NEVER = best for demos and tests (no waiting). ALWAYS = best for high-stakes tasks where every
      action needs approval. TERMINATE = the balanced production choice — agent runs autonomously but pauses to ask the human
      when it's unsure or completed a major milestone.
    wrong_fb: '❌ human_input_mode controls when to pause for human input. NEVER: agent runs autonomously to completion. ALWAYS:
      human approves every single message. TERMINATE: pause only when the AI says "TERMINATE" (task done) or hits the auto-reply
      limit. TERMINATE is the practical production setting.'
    correct: a
    explanation: ''
  - num_str: Question 4
    question: Why is the Supervisor pattern generally preferred over the Network pattern for production multi-agent systems?
    qid: q110_4
    options:
    - letter: A
      text: Supervisor uses less memory than Network
      is_correct: false
      id: a
    - letter: B
      text: Network patterns can cause infinite loops (Agent A calls B, B calls A). Supervisor provides a single orchestration
        po...
      is_correct: true
      id: b
    - letter: C
      text: Supervisor is always faster because it has fewer LLM calls
      is_correct: false
      id: c
    - letter: D
      text: Network patterns don't support tool use
      is_correct: false
      id: d
    correct_fb: '✅ Correct. Network topology has no natural termination guarantee — agents can call each other indefinitely.
      Supervisor creates a clear hub: supervisor decides who does what, when to proceed, and when to stop. This centralisation
      makes it easier to add max_turns, cost limits, human.'
    wrong_fb: ❌ Network patterns can cycle. Without a supervisor, there's no single entity ensuring the task terminates correctly.
      Supervisor provides centralised control, making it easier to add safety checks, budgets, interrupts, and observability.
      For production, centralised control &gt; maximal flexibility.
    correct: b
    explanation: ''
  - num_str: Question 5
    question: What is the purpose of a MemorySaver checkpointer in LangGraph?
    qid: q110_5
    options:
    - letter: A
      text: It caches LLM responses to avoid duplicate API calls
      is_correct: false
      id: a
    - letter: B
      text: It saves the full agent state at each step to a storage backend (in-memory for MemorySaver, database for production)....
      is_correct: true
      id: b
    - letter: C
      text: It limits memory usage by capping the message history length
      is_correct: false
      id: c
    - letter: D
      text: It's required only for parallel node execution
      is_correct: false
      id: d
    correct_fb: '✅ Exactly. Checkpointing serialises and saves the entire graph state (all accumulated messages, tool results,
      custom state fields) after every node. MemorySaver = in-RAM storage (lost on restart). For production: SqliteSaver or
      PostgresSaver persist to disk/database. The thread_id parameter.'
    wrong_fb: '❌ Checkpointer = persistence layer for agent state. After every node execution, the full state is serialized
      and saved. This enables: (1) interrupt_before patterns (pause/resume), (2) conversation continuity across sessions,
      (3) state replay for debugging. MemorySaver is in-memory only; use SqliteSaver for durability.'
    correct: b
    explanation: ''
