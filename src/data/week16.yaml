    sol_id: sol-w16d112t2
    solution_title: ✅ COMPLETE SOLUTION — dockerise_your_rag_system.py
    solution_code: |
      # Day 112 Task 2: Production Multi-Stage Dockerfile for RAG Service
      # File: Dockerfile

      DOCKERFILE_CONTENT = """# syntax=docker/dockerfile:1
      FROM python:3.11-slim AS builder
      WORKDIR /app
      RUN apt-get update && apt-get install -y --no-install-recommends gcc build-essential
      COPY requirements.txt .
      RUN pip install --user --no-cache-dir -r requirements.txt

      FROM python:3.11-slim AS runner
      WORKDIR /app
      RUN useradd -m -u 1000 appuser
      COPY --from=builder /root/.local /home/appuser/.local
      COPY . .
      USER appuser
      ENV PATH="/home/appuser/.local/bin:$PATH"
      EXPOSE 8000
      HEALTHCHECK --interval=30s --timeout=5s CMD curl -f http://localhost:8000/health || exit 1
      CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]"""

      print("Validated Multi-Stage Dockerfile Spec:")
      print(DOCKERFILE_CONTENT[:200] + "...")
      assert "appuser" in DOCKERFILE_CONTENT
      print("✓ Production RAG Dockerfile configuration verified.")
