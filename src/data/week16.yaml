  - front: What is a production RAG pipeline?
    back: An end-to-end RAG system optimized for low latency, high document throughput,
      query preprocessing, secure access controls, and active telemetry monitoring.
  - front: Why is document indexing partition important?
    back: It allows isolating document retrieval by user or department, preventing
      unauthorized data access.
  - front: How does query preprocessing (like classification) improve RAG?
    back: It routes the query to different specialized indexes or bypasses RAG entirely
      if the query is a simple greeting.
  - front: What is hot-loading a vector index?
    back: Keeping the vector index in-memory (e.g., using FAISS or index caching)
      to ensure sub-millisecond similarity search.
