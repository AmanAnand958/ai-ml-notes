- id: 115
  day_num: 115
  title: LLM Observability with LangSmith & Phoenix
  subtitle: Monitoring, tracing, and debugging LLM applications in production to ensure reliability and performance.
  time_estimate: 6 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
