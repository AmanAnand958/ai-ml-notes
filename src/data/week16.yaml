  - front: What is the difference between Cosine Similarity and Dot Product when comparing
      vector embeddings?
    back: Cosine similarity measures angle between vectors (normalized dot product);
      if embeddings are L2-normalized to unit length, Dot Product equals Cosine Similarity.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Fine-Tuning
      LLMs — LoRA, QLoRA & PEFT in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation,
      resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
