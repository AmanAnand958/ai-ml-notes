  - title: Add Redis Semantic Cache + Rate Limiting
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n          Add two production features to your FastAPI RAG app:\
      \ (1)\n          <strong>\n           Semantic cache\n          </strong>\n\
      \          : before calling the LLM, embed the question and check Redis for\
      \ a cached response with cosine similarity &gt; 0.95. If found, return cached\
      \ answer (near-zero latency). (2)\n          <strong>\n           Rate limiting\n\
      \          </strong>\n          : using\n          \n           slowapi\n  \
      \        \n          , limit each API key to 20 requests/minute. Measure cache\
      \ hit rate on 50 test queries where 30% are paraphrases of previous queries.\n\
      \         </p>"
    done_when: Cache hit rate &gt; 25% on the test query set. Rate limiter returns
      429 after 20 requests/minute. Cache lookup adds &lt; 5ms to latency on hits
      (vs 2000ms+ for LLM calls).
    git_cmd: 'git add add_redis_semantic_cache_rate_limiting.py &amp;&amp; git commit
      -m "day112: add-redis-semantic-cache-rate-limiting"'
    sol_id: sol-w16d112t3
    solution_title: ✅ COMPLETE SOLUTION — add_redis_semantic_cache_rate_limiting.py
    solution_code: "<span class=\"cm\"># add_redis_semantic_cache_rate_limiting.py\
      \ — Solution</span>\n<span class=\"cm\"># Complete solution for: Add Redis Semantic\
      \ Cache + Rate Limiting</span>\n\n<span class=\"cm\"># Redis Semantic Cache\
      \ + Rate Limiting for FastAPI</span>\n<span class=\"cm\"># pip install fastapi\
      \ redis aioredis slowapi sentence-transformers numpy</span>\n\n<span class=\"\
      kw\">from</span> fastapi <span class=\"kw\">import</span> FastAPI, Request,\
      \ HTTPException\n<span class=\"kw\">from</span> slowapi <span class=\"kw\">import</span>\
      \ Limiter, _rate_limit_exceeded_handler\n<span class=\"kw\">from</span> slowapi.util\
      \ <span class=\"kw\">import</span> get_remote_address\n<span class=\"kw\">from</span>\
      \ slowapi.errors <span class=\"kw\">import</span> RateLimitExceeded\n<span class=\"\
      kw\">import</span> redis\n<span class=\"kw\">import</span> json\n<span class=\"\
      kw\">import</span> hashlib\n<span class=\"kw\">import</span> numpy <span class=\"\
      kw\">as</span> np\n<span class=\"kw\">from</span> sentence_transformers <span\
      \ class=\"kw\">import</span> SentenceTransformer\n\n<span class=\"cm\"># 1.\
      \ Initialize high-performance asynchronous API application</span>\napp = <span\
      \ class=\"fn\">FastAPI</span>()\n\n<span class=\"cm\"># 1. Rate Limiting with\
      \ SlowAPI</span>\nlimiter = <span class=\"fn\">Limiter</span>(key_func=get_remote_address)\n\
      app.state.limiter = limiter\napp.<span class=\"fn\">add_exception_handler</span>(RateLimitExceeded,\
      \ _rate_limit_exceeded_handler)\n\n<span class=\"cm\"># 2. Redis connection</span>\n\
      r = redis.<span class=\"fn\">Redis</span>(host=<span class=\"str\">\"localhost\"\
      </span>, port=<span class=\"num\">6379</span>, decode_responses=<span class=\"\
      kw\">True</span>)\nembed_model = <span class=\"fn\">SentenceTransformer</span>(<span\
      \ class=\"str\">\"all-MiniLM-L6-v2\"</span>)\n\nCACHE_TTL = <span class=\"num\"\
      >3600</span>  <span class=\"cm\"># 1 hour</span>\nSIMILARITY_THRESHOLD = <span\
      \ class=\"num\">0.92</span>\n\n<span class=\"kw\">def</span> <span class=\"\
      fn\">get_cache_key</span>(query: str) -&gt; str:\n    <span class=\"str\">\"\
      \"\"Generate deterministic cache key.\"\"\"</span>\n    <span class=\"kw\">return</span>\
      \ <span class=\"str\">f\"cache:{hashlib.md5(query.encode()).hexdigest()}\"</span>\n\
      \n<span class=\"kw\">def</span> <span class=\"fn\">semantic_cache_lookup</span>(query:\
      \ str) -&gt; str | <span class=\"kw\">None</span>:\n    <span class=\"str\"\
      >\"\"\"Check if a semantically similar query was already answered.\"\"\"</span>\n\
      \    query_embedding = embed_model.<span class=\"fn\">encode</span>(query)\n\
      \    \n    <span class=\"cm\"># Check recent cache entries</span>\n    <span\
      \ class=\"kw\">for</span> key <span class=\"kw\">in</span> r.<span class=\"\
      fn\">scan_iter</span>(<span class=\"str\">\"cache:*\"</span>):\n        cached\
      \ = json.<span class=\"fn\">loads</span>(r.<span class=\"fn\">get</span>(key)\
      \ <span class=\"kw\">or</span> <span class=\"str\">\"{}\"</span>)\n        <span\
      \ class=\"kw\">if</span> <span class=\"str\">\"embedding\"</span> <span class=\"\
      kw\">in</span> cached:\n            cached_emb = np.<span class=\"fn\">array</span>(cached[<span\
      \ class=\"str\">\"embedding\"</span>])\n            similarity = np.<span class=\"\
      fn\">dot</span>(query_embedding, cached_emb) / (\n                np.linalg.<span\
      \ class=\"fn\">norm</span>(query_embedding) * np.linalg.<span class=\"fn\">norm</span>(cached_emb)\n\
      \            )\n            <span class=\"kw\">if</span> similarity &gt; SIMILARITY_THRESHOLD:\n\
      \                <span class=\"kw\">return</span> cached.<span class=\"fn\"\
      >get</span>(<span class=\"str\">\"answer\"</span>)\n    <span class=\"kw\">return</span>\
      \ <span class=\"kw\">None</span>\n\n<span class=\"kw\">def</span> <span class=\"\
      fn\">cache_response</span>(query: str, answer: str):\n    <span class=\"str\"\
      >\"\"\"Store query + answer + embedding in Redis.\"\"\"</span>\n    embedding\
      \ = embed_model.<span class=\"fn\">encode</span>(query).<span class=\"fn\">tolist</span>()\n\
      \    r.<span class=\"fn\">setex</span>(\n        <span class=\"fn\">get_cache_key</span>(query),\n\
      \        CACHE_TTL,\n        json.<span class=\"fn\">dumps</span>({<span class=\"\
      str\">\"query\": query, \"answer\": answer, \"embedding\"</span>: embedding}),\n\
      \    )\n\n<span class=\"cm\"># 3. Rate-limited + cached endpoint</span>\n<span\
      \ class=\"cm\"># 2. Define prediction endpoint with Pydantic schema validation</span>\n\
      @app.<span class=\"fn\">post</span>(<span class=\"str\">\"/query\"</span>)\n\
      @limiter.<span class=\"fn\">limit</span>(<span class=\"str\">\"10/minute\"</span>)\n\
      <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"\
      fn\">query_with_cache</span>(request: Request, question: str):\n    <span class=\"\
      cm\"># Check semantic cache first</span>\n    cached = <span class=\"fn\">semantic_cache_lookup</span>(question)\n\
      \    <span class=\"kw\">if</span> cached:\n        <span class=\"kw\">return</span>\
      \ {<span class=\"str\">\"answer\": cached, \"cached\"</span>: <span class=\"\
      kw\">True</span>}\n    \n    <span class=\"cm\"># Generate answer (replace with\
      \ actual LLM call)</span>\n    answer = <span class=\"str\">f\"Answer to: {question}\"\
      </span>\n    \n    <span class=\"cm\"># Cache the response</span>\n    <span\
      \ class=\"fn\">cache_response</span>(question, answer)\n    <span class=\"kw\"\
      >return</span> {<span class=\"str\">\"answer\": answer, \"cached\"</span>: <span\
      \ class=\"kw\">False</span>}\n\n@app.<span class=\"fn\">get</span>(<span class=\"\
      str\">\"/cache/stats\"</span>)\n<span class=\"kw\">async</span> <span class=\"\
      kw\">def</span> <span class=\"fn\">cache_stats</span>():\n    keys = <span class=\"\
      fn\">list</span>(r.<span class=\"fn\">scan_iter</span>(<span class=\"str\">\"\
      cache:*\"</span>))\n    <span class=\"kw\">return</span> {<span class=\"str\"\
      >\"cached_queries\": len(keys), \"ttl_seconds\"</span>: CACHE_TTL}\n\n<span\
      \ class=\"kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n\
      \    <span class=\"fn\">solve</span>()"
    solution_lang: python
  quizzes:
  - num_str: Q1 OF 5
    question: "Why is\n         \n          async def\n         \n         critical\
      \ for LLM API endpoints in FastAPI, whereas in Flask it doesn't matter as much?"
    qid: q112_1
    options:
    - letter: A
      text: async def is only a syntax difference, no performance impact
      is_correct: false
    - letter: B
      text: LLM API calls take 1–5 seconds — with async/await, FastAPI can handle
        hundreds of concurrent requests with one thread (the event loop serves other
        requests while waiting for I/O). Flask's sync model blocks the thread for
        the full 2 seconds per request
      is_correct: true
    - letter: C
      text: async def is required by OpenAI's Python library
      is_correct: false
    - letter: D
      text: async def enables GPU acceleration for LLM inference
      is_correct: false
    correct_fb: '✅ Correct. The key insight: LLM calls are I/O-bound (waiting for
      network response from OpenAI). With async/await + event loop, during the 2s
      wait for OpenAI''s response, FastAPI serves hundreds of other requests. Flask''s
      sync model: 10 concurrent users = 10 threads × 2s = needs 10 threads. FastAPI
      async: 10 concurrent users = 1 thread handles all via event loop.'
    wrong_fb: ❌ LLM API calls are I/O-bound (waiting for OpenAI's server to respond).
      async/await releases the thread during that wait. Flask uses synchronous threading
      — 100 concurrent LLM calls needs 100 threads. FastAPI async handles 100 concurrent
      calls with 1 thread via the event loop.
  - num_str: Q2 OF 5
    question: In a multi-stage Docker build, what is the purpose of the builder stage?
    qid: q112_2
    options:
    - letter: A
      text: The builder stage runs unit tests before deployment
      is_correct: false
    - letter: B
      text: 'The builder stage installs dependencies (including build tools like gcc)
        and is then discarded. Only the installed packages (in --user or a venv) are
        copied to the final stage. Result: final image has no build tools, reducing
        size by 60–80%'
      is_correct: true
    - letter: C
      text: The builder stage compiles Python to native code
      is_correct: false
    - letter: D
      text: It's required for multi-architecture builds only
      is_correct: false
    correct_fb: ✅ Correct. The builder stage installs packages using build tools (gcc,
      cmake, etc. needed to compile C extensions). The final stage starts fresh from
      slim base and only copies the installed packages from builder. This removes
      gcc, pip caches, .c files, etc. — easily saving 500MB+ for ML apps with numpy/scipy/torch.
    wrong_fb: ❌ Builder stage = install everything (including large build tools).
      Final stage = copy only what's needed (installed packages, app code). Build
      tools are in layer cache but not in the final image. For ML apps with numpy/scipy,
      this typically reduces image size from 2GB to 400MB.
  - num_str: Q3 OF 5
    question: "What does the\n         \n          lifespan\n         \n         context\
      \ manager in FastAPI replace, and why is it preferred?"
    qid: q112_3
    options:
    - letter: A
      text: "It replaces deprecated\n          \n           @app.on_event(\"startup\"\
        )\n          \n          and\n          \n           @app.on_event(\"shutdown\"\
        )\n          \n          decorators. Lifespan is preferred because it keeps\
        \ startup/shutdown logic together in one function, supports async context\
        \ managers, and is compatible with testing frameworks"
      is_correct: true
    - letter: B
      text: It replaces Docker HEALTHCHECK instructions
      is_correct: false
    - letter: C
      text: It's a replacement for Pydantic Settings
      is_correct: false
    - letter: D
      text: Lifespan is only needed for WebSocket connections
      is_correct: false
    correct_fb: ✅ Exactly. on_event() decorators are deprecated in FastAPI 0.93+.
      The lifespan pattern uses an async context manager where code before yield runs
      on startup, code after yield runs on shutdown. It's cleaner, testable (you can
      inject a test lifespan), and keeps the startup/shutdown pair together in one
      function.
    wrong_fb: '❌ lifespan replaces @app.on_event("startup") and @app.on_event("shutdown").
      The pattern: async with lifespan(app): runs startup before yield and shutdown
      after yield. It''s the modern FastAPI pattern — cleaner, testable, and supported
      by the ASGI lifespan protocol.'
  - num_str: Q4 OF 5
    question: Why should you never run your Docker container as root in production?
    qid: q112_4
    options:
    - letter: A
      text: Root containers use more CPU resources
      is_correct: false
    - letter: B
      text: 'If an attacker exploits your application (e.g., via code injection in
        the AI response), root access in the container makes container escape and
        host compromise much easier. Non-root: attacker has limited permissions even
        inside the container'
      is_correct: true
    - letter: C
      text: Root containers can't access network ports above 1024
      is_correct: false
    - letter: D
      text: Docker won't start containers as root on modern Linux
      is_correct: false
    correct_fb: '✅ Correct defence-in-depth. Container isolation is not perfect. If
      there''s a kernel vulnerability or container escape, root inside the container
      = root on the host. Non-root: even after container escape, attacker has limited
      host permissions. Always add: adduser appuser &amp;&amp; USER appuser in your
      Dockerfile.'
    wrong_fb: '❌ Defence-in-depth: if an attacker exploits your app and escapes the
      container, root inside = root on host. A non-root user limits the blast radius.
      This is especially important for AI apps where user input (prompt injection)
      could trigger code execution in the container.'
  - num_str: Q5 OF 5
    question: A semantic cache for LLM responses works by checking embedding similarity.
      Why use cosine similarity ≥ 0.95 as the cache hit threshold, not a lower value
      like 0.8?
    qid: q112_5
    options:
    - letter: A
      text: 0.8 is too slow to compute
      is_correct: false
    - letter: B
      text: 0.8 would cache responses for semantically related but factually different
        questions (e.g., "what is Q2 revenue?" and "what is Q3 revenue?" might have
        0.82 similarity). 0.95 ensures only near-identical paraphrases are cache hits,
        preventing wrong answers being served
      is_correct: true
    - letter: C
      text: 0.95 gives the most cache hits for better performance
      is_correct: false
    - letter: D
      text: Anything below 0.95 causes Redis memory overflow
      is_correct: false
    correct_fb: ✅ Perfect reasoning. Low threshold = more cache hits but risk serving
      wrong answers for semantically-similar-but-factually-different questions. High
      threshold (≥0.95) = only exact paraphrases ("what's the weather?" / "how's the
      weather today?") hit cache. For factual QA over documents, set threshold high
      to avoid cache poisoning. For conversational chitchat, 0.85 is fine.
    wrong_fb: ❌ Semantic caches need high threshold for factual applications. "Q2
      revenue" and "Q3 revenue" might have 0.82 cosine similarity (similar domain,
      similar question structure). Serving Q2's cached answer for Q3's question is
      wrong and dangerous. 0.95 ensures only true paraphrases (same intent, same facts
      needed) trigger cache hits.
