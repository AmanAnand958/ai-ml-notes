  - title: LangGraph Research Agent with Human Approval
    badge: MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p><strong>\n          Build a LangGraph agent that: (1) takes a\
      \ research question, (2) decides whether to use web search or answer from training\
      \ data, (3) if web search is chosen, pauses for human approval before calling\
      \ it, (4) generates a structured report with: summary, key_points (list), sources\
      \ (list). Use MemorySaver for checkpointing so the conversation can be resumed.\n\
      \         </strong></p>"
    done_when: When code executes without errors, passes all unit assertions, and
      prints verified output metrics for LangGraph Research Agent with Human Approval.
    git_cmd: 'git add . && git commit -m "feat(day110): implement langgraph-research-agent-with-"'
    sol_id: sol-w16d110t2
    solution_title: SOLUTION — Research Agent Graph Structure
    solution_code: "# Graph structure:\n# START → classify_query → {needs_search:\
      \ web_search, no_search: generate_report} → END\n# With interrupt_before=[\"\
      web_search\"] for human approval\n\nclass ResearchState(TypedDict):\n    question:\
      \      str\n    needs_search:  bool\n    search_result: str\n    report:   \
      \     dict  # {summary, key_points, sources}\n    messages:      Annotated[\"\
      list, operator.add\"]\n\ndef classify_query(state: ResearchState) -> ResearchState:\n\
      \    \"\"\"Decide if web search is needed.\"\"\"\n    resp = ChatOpenAI(model=\"\
      gpt-4o-mini\", temperature=0).invoke([\n        HumanMessage(content=f\"Does\
      \ answering '{state['question']}' require current web data? Reply only YES or\
      \ NO.\")\n    ])\n    needs = \"YES\" in resp.content.upper()\n    return {\"\
      needs_search\": needs, \"messages\": [resp]}\n\ndef web_search(state: ResearchState)\
      \ -> ResearchState:\n    \"\"\"Perform web search (runs only after human approval).\"\
      \"\"\n    # In real implementation: use Tavily or DuckDuckGo API\n    result\
      \ = f\"[Web search results for: {state['question']}]\"\n    return {\"search_result\"\
      : result}\n\ndef generate_report(state: ResearchState) -> ResearchState:\n \
      \   \"\"\"Generate structured report.\"\"\"\n    context = state.get(\"search_result\"\
      , \"No web search performed.\")\n    # ... LLM call to generate structured report\n\
      \    return {\"report\": {\"summary\": \"...\", \"key_points\": [], \"sources\"\
      : []}}\n\ngraph = StateGraph(ResearchState)\ngraph.add_node(\"classify_query\"\
      , classify_query)\ngraph.add_node(\"web_search\", web_search)\ngraph.add_node(\"\
      generate_report\", generate_report)\ngraph.set_entry_point(\"classify_query\"\
      )\ngraph.add_conditional_edges(\"classify_query\",\n    lambda s: \"web_search\"\
      \ if s[\"\\\"needs_search\\\"\"] else \"generate_report\")\ngraph.add_edge(\"\
      web_search\", \"generate_report\")\ngraph.add_edge(\"generate_report\", END)\n\
      app = graph.compile(checkpointer=MemorySaver(), interrupt_before=[\"web_search\"\
      ])\nassert app is not None, \"app should not be None\""
    solution_lang: python
    time_minutes: 45
  - title: AutoGen Code Review Pipeline
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n         Build an AutoGen group chat with 4 specialized agents\
      \ for automated code review: (1)\n         <strong>\n          Developer\n \
      \        </strong>\n         : writes Python functions from natural language\
      \ specs, (2)\n         <strong>\n          Code Reviewer\n         </strong>\n\
      \         : reviews for bugs, edge cases, style issues, (3)\n         <strong>\n\
      \          Security Auditor\n         </strong>\n         : checks for security\
      \ vulnerabilities (injection, unsafe eval, etc.), (4)\n         <strong>\n \
      \         Tech Lead\n         </strong>\n         : makes final approval or\
      \ rejection decision. Test with 3 Python coding tasks of varying complexity.\n\
      \        </p>"
    done_when: "All 4 agents participate in the conversation. Security Auditor correctly\
      \ flags the unsafe\n         \n          eval(user_input)\n         \n     \
      \    pattern. Tech Lead provides a final verdict with summary of all reviewers'\
      \ findings."
    git_cmd: 'git add autogen_code_review_pipeline.py &amp;&amp; git commit -m "feat(day):
      day110: autogen-code-review-pipeline"'
    sol_id: sol-w16d110t3
    solution_title: ✅ COMPLETE SOLUTION — autogen_code_review_pipeline.py
    solution_code: "# autogen_code_review_pipeline.py — Solution\n# Complete solution\
      \ for: AutoGen Code Review Pipeline\n\n# Multi-Agent Pattern: Research + Writer\
      \ + Reviewer\n# pip install langgraph langchain-openai\n\nfrom langgraph.graph\
      \ import StateGraph, END\nfrom langchain_openai import ChatOpenAI\nfrom typing\
      \ import TypedDict, Annotated\nimport operator\n\n# 1. Define shared state\n\
      class AgentState(TypedDict):\n    topic: str\n    research: Annotated[list[str],\
      \ operator.add]\n    draft: str\n    review: str\n    final: str\n\nllm = ChatOpenAI(model=\"\
      gpt-4o-mini\", temperature=0.3)\n\n# 2. Define agent nodes\ndef researcher(state:\
      \ AgentState) -> AgentState:\n    \"\"\"Research agent: gathers key facts about\
      \ the topic.\"\"\"\n    response = llm.invoke(\n        f\"You are a research\
      \ assistant. List 5 key facts about: {state['topic']}. \"\n        f\"Be concise\
      \ and factual.\"\n    )\n    return {\"research\": [response.content]}\n\ndef\
      \ writer(state: AgentState) -> AgentState:\n    \"\"\"Writer agent: creates\
      \ a draft from research.\"\"\"\n    research = \"\\n\".join(state[\"research\"\
      ])\n    response = llm.invoke(\n        f\"You are a technical writer. Write\
      \ a clear 200-word summary based on this research:\\n{research}\"\n    )\n \
      \   return {\"draft\": response.content}\n\ndef reviewer(state: AgentState)\
      \ -> AgentState:\n    \"\"\"Reviewer agent: critiques the draft.\"\"\"\n   \
      \ response = llm.invoke(\n        f\"You are a critical reviewer. Review this\
      \ draft for accuracy and clarity. \"\n        f\"List specific improvements:\\\
      n{state['draft']}\"\n    )\n    return {\"review\": response.content}\n\ndef\
      \ finalizer(state: AgentState) -> AgentState:\n    \"\"\"Finalizer: incorporates\
      \ review feedback.\"\"\"\n    response = llm.invoke(\n        f\"Revise this\
      \ draft based on the review feedback.\\n\\n\"\n        f\"Draft:\\n{state['draft']}\\\
      n\\nFeedback:\\n{state['review']}\"\n    )\n    return {\"final\": response.content}\n\
      \n# 3. Build the graph\nworkflow = StateGraph(AgentState)\nworkflow.add_node(\"\
      researcher\", researcher)\nworkflow.add_node(\"writer\", writer)\nworkflow.add_node(\"\
      reviewer\", reviewer)\nworkflow.add_node(\"finalizer\", finalizer)\n\nworkflow.set_entry_point(\"\
      researcher\")\nworkflow.add_edge(\"researcher\", \"writer\")\nworkflow.add_edge(\"\
      writer\", \"reviewer\")\nworkflow.add_edge(\"reviewer\", \"finalizer\")\nworkflow.add_edge(\"\
      finalizer\", END)\n\napp = workflow.compile()\n\n# 4. Run\nresult = app.invoke({\"\
      topic\": \"How LoRA fine-tuning works\", \"research\": []})\nprint(\"=== Final\
      \ Article ===\")\nprint(result[\"final\"])\n\nif __name__ == '__main__':\n \
      \   solve()"
    solution_lang: python
    time_minutes: 60
  quizzes:
  - num_str: Q1 OF 5
    question: "In LangGraph, why is\n        \n         Annotated[\"list, operator.add\"\
      ]\n        \n        used for the messages field in the State?"
    qid: q110_1
    options:
    - letter: A
      text: It validates that messages is a valid Python list
      is_correct: false
      id: a
    - letter: B
      text: 'It defines a reducer — when two nodes return {messages: [new_msg]}, the
        state merges them via list concatenation inst...'
      is_correct: true
      id: b
    - letter: C
      text: It makes messages thread-safe for parallel nodes
      is_correct: false
      id: c
    - letter: D
      text: operator.add is needed for JSON serialisation
      is_correct: false
      id: d
    correct_fb: '✅ Perfect. The Annotated reducer tells LangGraph how to merge state
      updates from nodes. Default merging: last-write-wins (new value replaces old).
      With operator.add, when node returns {messages: [x]}, LangGraph does state.messages
      += [x] instead of state.messages = [x]. Essential for.'
    wrong_fb: ❌ The Annotated["list, operator.add"] is a state reducer definition.
      Without it, each node's return value would overwrite the entire messages list.
      With operator.add, returns are concatenated — each node appends to the conversation
      history instead of replacing it.
    correct: b
  - num_str: Q2 OF 5
    question: "What does\n        \n         interrupt_before=[\"tool_node\"]\n  \
      \      \n        in\n        \n         graph.compile()\n        \n        do\
      \ at runtime?"
    qid: q110_2
    options:
    - letter: A
      text: It disables the tool_node permanently
      is_correct: false
      id: a
    - letter: B
      text: Execution stops just before tool_node runs and returns control to the
        caller. State is checkpointed. The graph can be...
      is_correct: true
      id: b
    - letter: C
      text: It adds a timeout of 30s before the tool runs
      is_correct: false
      id: c
    - letter: D
      text: It logs tool inputs for debugging only
      is_correct: false
      id: d
    correct_fb: ✅ Exactly. interrupt_before creates a breakpoint. When the graph reaches
      the node boundary before tool_node, execution freezes, the current state is
      saved to the checkpointer, and invoke() returns. Passing invoke(None, config)
      with the same thread_id resumes from exactly where it stopped.
    wrong_fb: ❌ interrupt_before is a breakpoint declaration. When execution reaches
      this node boundary, it pauses, saves state to checkpointer, and returns control
      to your code. You inspect state, get human approval, then resume by calling
      invoke(None, config) with the same thread_id.
    correct: b
  - num_str: Q3 OF 5
    question: "In AutoGen, what is\n        \n         human_input_mode=\"TERMINATE\"\
      \n        \n        vs\n        \n         \"ALWAYS\"\n        \n        vs\n\
      \        \n         \"NEVER\"\n        \n        ?"
    qid: q110_3
    options:
    - letter: A
      text: NEVER = fully autonomous (no human interrupts). ALWAYS = human must approve
        every message. TERMINATE = human only ask...
      is_correct: true
      id: a
    - letter: B
      text: These control how the agent terminates conversations
      is_correct: false
      id: b
    - letter: C
      text: TERMINATE is the default and blocks all agent communication
      is_correct: false
      id: c
    - letter: D
      text: They are the same — just different names for the same behavior
      is_correct: false
      id: d
    correct_fb: ✅ Correct. NEVER = best for demos and tests (no waiting). ALWAYS =
      best for high-stakes tasks where every action needs approval. TERMINATE = the
      balanced production choice — agent runs autonomously but pauses to ask the human
      when it's unsure or completed a major milestone.
    wrong_fb: '❌ human_input_mode controls when to pause for human input. NEVER: agent
      runs autonomously to completion. ALWAYS: human approves every single message.
      TERMINATE: pause only when the AI says "TERMINATE" (task done) or hits the auto-reply
      limit. TERMINATE is the practical production setting.'
    correct: a
  - num_str: Q4 OF 5
    question: Why is the Supervisor pattern generally preferred over the Network pattern
      for production multi-agent systems?
    qid: q110_4
    options:
    - letter: A
      text: Supervisor uses less memory than Network
      is_correct: false
      id: a
    - letter: B
      text: Network patterns can cause infinite loops (Agent A calls B, B calls A).
        Supervisor provides a single orchestration po...
      is_correct: true
      id: b
    - letter: C
      text: Supervisor is always faster because it has fewer LLM calls
      is_correct: false
      id: c
    - letter: D
      text: Network patterns don't support tool use
      is_correct: false
      id: d
    correct_fb: '✅ Correct. Network topology has no natural termination guarantee
      — agents can call each other indefinitely. Supervisor creates a clear hub: supervisor
      decides who does what, when to proceed, and when to stop. This centralisation
      makes it easier to add max_turns, cost limits, human.'
    wrong_fb: ❌ Network patterns can cycle. Without a supervisor, there's no single
      entity ensuring the task terminates correctly. Supervisor provides centralised
      control, making it easier to add safety checks, budgets, interrupts, and observability.
      For production, centralised control &gt; maximal flexibility.
    correct: b
  - num_str: Q5 OF 5
    question: What is the purpose of a MemorySaver checkpointer in LangGraph?
    qid: q110_5
    options:
    - letter: A
      text: It caches LLM responses to avoid duplicate API calls
      is_correct: false
      id: a
    - letter: B
      text: It saves the full agent state at each step to a storage backend (in-memory
        for MemorySaver, database for production)....
      is_correct: true
      id: b
    - letter: C
      text: It limits memory usage by capping the message history length
      is_correct: false
      id: c
    - letter: D
      text: It's required only for parallel node execution
      is_correct: false
      id: d
    correct_fb: '✅ Exactly. Checkpointing serialises and saves the entire graph state
      (all accumulated messages, tool results, custom state fields) after every node.
      MemorySaver = in-RAM storage (lost on restart). For production: SqliteSaver
      or PostgresSaver persist to disk/database. The thread_id parameter.'
    wrong_fb: '❌ Checkpointer = persistence layer for agent state. After every node
      execution, the full state is serialized and saved. This enables: (1) interrupt_before
      patterns (pause/resume), (2) conversation continuity across sessions, (3) state
      replay for debugging. MemorySaver is in-memory only; use SqliteSaver for durability.'
    correct: b
