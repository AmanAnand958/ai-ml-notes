- id: 114
  day_num: 114
  title: Next.js & Vercel AI SDK
  subtitle: Transitioning from Python prototypes to production-grade full-stack web applications using React, Next.js, and
    the Vercel AI SDK.
  time_estimate: 6 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Analyze the Vercel AI SDK architecture.
  - Build a streaming chat interface in Next.js.
  - Integrate useChat hook to manage chat state.
  checklist:
  - id: chk_114_1
    text: Master the core concepts, mathematical principles, and architecture of Next.js & Vercel AI SDK
  - id: chk_114_2
    text: Complete hands-on implementation and test assertions for Next.js Chat App
