  - title: Parameter Count Calculator
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: |-
      <p><strong>
               Write a Python function that, given a model name and LoRA config (r, target_modules), calculates: (1) total base model parameters, (2) trainable LoRA parameters, (3) percentage of trainable params. Test on phi-2 (2.7B), Llama-2-7B, and Mistral-7B configs. Without actually loading the models — use the published architecture specs to calculate.
              </strong></p>
    done_when: "When function outputs a comparison table. You can manually verify against\n         \n          print_trainable_parameters()\n\
      \         \n         output when models are loaded."
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day108: complete day 108 tasks and coding exercises"'
    sol_id: sol-w16d108t1
    solution_title: ✅ COMPLETE SOLUTION — parameter_count_calculator.py
    solution_code: "# parameter_count_calculator.py — Solution\n# Complete solution for: Parameter Count Calculator\n\nimport\
      \ torch\nfrom transformers import AutoModelForCausalLM, AutoConfig\n\ndef count_parameters(model_name: str) -> dict:\n\
      \    \"\"\"Count total, trainable, and frozen parameters in a HuggingFace model.\"\"\"\n    config = AutoConfig.from_pretrained(model_name)\n\
      \    model = AutoModelForCausalLM.from_config(config)\n    \n    total = sum(p.numel() for p in model.parameters())\n\
      \    trainable = sum(p.numel() for p in model.parameters() if p.requires_grad)\n    frozen = total - trainable\n   \
      \ \n    print(f\"Model: {model_name}\")\n    print(f\"  Total parameters:     {total:>15,}\")\n    print(f\"  Trainable\
      \ parameters: {trainable:>15,}\")\n    print(f\"  Frozen parameters:    {frozen:>15,}\")\n    print(f\"  Size (float32):\
      \       {total * 4 / 1e9:.2f} GB\")\n    print(f\"  Size (float16):       {total * 2 / 1e9:.2f} GB\")\n    \n    # LoRA\
      \ parameter estimate (r=16, targeting q_proj and v_proj)\n    r = 16\n    d_model = config.hidden_size\n    n_layers\
      \ = config.num_hidden_layers\n    lora_params = 2 * (2 * d_model * r) * n_layers  # 2 matrices × 2 targets × layers\n\
      \    print(f\"  LoRA params (r={r}):   {lora_params:>15,} ({lora_params/total*100:.4f}%)\")\n    \n    return {\"total\"\
      : total, \"trainable\": trainable, \"frozen\": frozen, \"lora\": lora_params}\n\n# Example usage\ncount_parameters(\"\
      gpt2\")\n# count_parameters(\"meta-llama/Llama-2-7b-hf\")  # Requires HF access\n\nif __name__ == '__main__':\n    solve()\n"
    solution_lang: python
