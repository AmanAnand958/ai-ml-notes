    </div>\n</div>\n<pre><code class=\"language-html\"><span class=\"cm\"># pip install fastapi uvicorn[\"standard\"] pydantic\
    \ openai chromadb sentence-transformers</span>\n<span class=\"kw\">from</span> fastapi <span class=\"kw\">import</span>\
    \ FastAPI, Depends, HTTPException, Security\n<span class=\"kw\">from</span> fastapi.security <span class=\"kw\">import</span>\
