  theory_html: |
    <h2 class="sh2">🧠 Theory &amp; Concepts</h2>
    <h3 class="sh3">
           1. Multi-Agent Architecture Patterns
          </h3>
    <div class="table-wrap" style="overflow-x: auto; margin: 1.2rem 0; width: 100%;"><table class="concept-table">
    <tr>
    <th>
             Pattern
            </th>
    <th>
             Structure
            </th>
    <th>
             Best For
            </th>
    <th>
             Example
            </th>
    </tr>
    <tr>
    <td>
    <strong>
              Network
             </strong>
    </td>
    <td>
             Any agent can call any other
            </td>
    <td>
             Flexible collaboration
            </td>
    <td>
             Research team agents
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              Supervisor
             </strong>
    </td>
    <td>
             One orchestrator routes to specialists
            </td>
    <td>
             Known task decomposition
            </td>
    <td>
             CEO → developer, designer, QA
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              Hierarchical
             </strong>
    </td>
    <td>
             Supervisor of supervisors
            </td>
    <td>
             Very complex tasks
            </td>
    <td>
             Company org chart as agents
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              Sequential Pipeline
             </strong>
    </td>
    <td>
             Agent A → Agent B → Agent C
            </td>
    <td>
             Deterministic workflows
            </td>
    <td>
             Draft → review → publish
            </td>
    </tr>
    </table></div>
    <h3 class="sh3">
           2. LangGraph — Stateful Agent Graphs
          </h3>
    <p>
           LangGraph models an agent as a
           <strong>
            directed graph
           </strong>
           where nodes are functions (LLM calls, tool calls, conditions) and edges define what runs next. State is explicitly passed between nodes — no hidden globals.
          </p>
    <div class="mermaid">
    graph TD
      A["START"] --&gt; B["Agent Node"]
      B --&gt; C["Tool Needed?"]
      C --&gt;|Yes| D["Tool Node"]
      D --&gt; B
      C --&gt;|No| E["END"]
    style A fill:#1c2030,stroke:#b47cfc,color:#dde2f0
    style E fill:#1c2030,stroke:#4fd1a5,color:#dde2f0
    style B fill:#1c2030,stroke:#38bdf8,color:#dde2f0
    style D fill:#1c2030,stroke:#f7a94b,color:#dde2f0
    </div>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             PYTHON — LANGGRAPH AGENT WITH TOOL USE
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code class="language-html"><span class="kw">from</span> langgraph.graph <span class="kw">import</span> StateGraph, END
    <span class="kw">from</span> langgraph.prebuilt <span class="kw">import</span> ToolNode
    <span class="kw">from</span> langchain_openai <span class="kw">import</span> ChatOpenAI
    <span class="kw">from</span> langchain_core.tools <span class="kw">import</span> tool
    <span class="kw">from</span> typing <span class="kw">import</span> TypedDict, List, Annotated
    <span class="kw">import</span> operator

    <span class="cm"># 1. Define state schema</span>
    <span class="kw">class</span> <span class="cls">AgentState</span>(TypedDict):
        messages: Annotated[<span class="str">"list, operator.add"</span>]  <span class="cm"># messages accumulate with +</span>

    <span class="cm"># 2. Define tools</span>
    @tool
    <span class="kw">def</span> <span class="fn">search_web</span>(query: str) -&gt; str:
        <span class="str">"""Search the web for current information. Returns a snippet."""</span>
        <span class="kw">return</span> <span class="str">f"Web result for '</span>{query}<span class="str">': [mock result]"</span>

    tools = [search_web]
    llm   = <span class="fn">ChatOpenAI</span>(model=<span class="str">"gpt-4o-mini"</span>).<span class="fn">bind_tools</span>(tools)

    <span class="cm"># 3. Define node functions</span>
    <span class="kw">def</span> <span class="fn">agent_node</span>(state: AgentState) -&gt; AgentState:
        <span class="str">"""The LLM decides: answer directly or call a tool."""</span>
        response = llm.<span class="fn">invoke</span>(state[<span class="str">"\"messages\""</span>])
        <span class="kw">return</span> {<span class="str">"messages"</span>: [response]}

    <span class="kw">def</span> <span class="fn">should_use_tools</span>(state: AgentState) -&gt; str:
        <span class="str">"""Routing function: did the LLM call a tool?"""</span>
        last = state[<span class="str">"\"messages\""</span>][-<span class="num">1</span>]
        <span class="kw">return</span> <span class="str">"tool_node" if hasattr(last, "tool_calls") and last.tool_calls else "end"</span>

    <span class="cm"># 4. Build the graph</span>
    graph = <span class="fn">StateGraph</span>(AgentState)
    graph.<span class="fn">add_node</span>(<span class="str">"agent"</span>, agent_node)
    graph.<span class="fn">add_node</span>(<span class="str">"tool_node"</span>, <span class="fn">ToolNode</span>(tools))

    graph.<span class="fn">set_entry_point</span>(<span class="str">"agent"</span>)
    graph.<span class="fn">add_conditional_edges</span>(<span class="str">"agent"</span>, should_use_tools, {
        <span class="str">"tool_node": "tool_node"</span>,
        <span class="str">"end"</span>:       END,
    })
    graph.<span class="fn">add_edge</span>(<span class="str">"tool_node", "agent"</span>)  <span class="cm"># tool result → back to agent</span>
    app = graph.<span class="fn">compile</span>()

    <span class="cm"># 5. Run the agent</span>
    <span class="kw">from</span> langchain_core.messages <span class="kw">import</span> HumanMessage
    result = app.<span class="fn">invoke</span>({<span class="str">"messages": [HumanMessage(content="What is today'</span>s top AI news?")]})
    <span class="fn">print</span>(result[<span class="str">"\"messages\""</span>][-<span class="num">1</span>].content)</code></pre>
    </div>
    <h3 class="sh3">
           3. Human-in-the-Loop with LangGraph Interrupts
          </h3>
    <p style="margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;">
           LangGraph interrupts pause agent execution before high-risk states, requesting human confirmation before executing tool calls.
          </p>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             PYTHON — LANGGRAPH INTERRUPT FOR APPROVAL
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code class="language-html"><span class="kw">from</span> langgraph.checkpoint.memory <span class="kw">import</span> MemorySaver

    <span class="cm"># compile with checkpointer for persistence and interrupts</span>
    memory = <span class="fn">MemorySaver</span>()
    app_with_interrupt = graph.<span class="fn">compile</span>(
        checkpointer=memory,
        interrupt_before=[<span class="str">"tool_node"</span>]  <span class="cm"># pause BEFORE executing tools</span>
    )

    config = {<span class="str">"configurable": {"thread_id": "session-1"</span>}}

    <span class="cm"># Run until interrupt</span>
    result = app_with_interrupt.<span class="fn">invoke</span>(
        {<span class="str">"messages": [HumanMessage("Search for: latest NVIDIA GPU release"</span>)]},
        config=config
    )

    <span class="cm"># At this point execution STOPPED before tool_node</span>
    <span class="cm"># Current state shows what tool the agent wants to call</span>
    state = app_with_interrupt.<span class="fn">get_state</span>(config)
    <span class="fn">print</span>(<span class="str">"Agent wants to call:"</span>, state.next)

    <span class="cm"># Human approval step</span>
    human_input = <span class="fn">input</span>(<span class="str">"Approve this tool call? (y/n): "</span>)
    <span class="kw">if</span> human_input == <span class="str">"y"</span>:
        <span class="cm"># Resume execution from the checkpoint</span>
        result = app_with_interrupt.<span class="fn">invoke</span>(<span class="kw">None</span>, config=config)
        <span class="fn">print</span>(result[<span class="str">"\"messages\""</span>][-<span class="num">1</span>].content)
    <span class="kw">else</span>:
        <span class="fn">print</span>(<span class="str">"Tool call rejected."</span>)</code></pre>
    </div>
    <h3 class="sh3">
           4. AutoGen — Multi-Agent Conversations
          </h3>
    <p>
           AutoGen uses a
           <strong>
            conversational paradigm
           </strong>
           — agents take turns sending messages. A GroupChat manager routes messages to the right agent. Perfect for open-ended collaborative tasks like code generation + review + execution.
          </p>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             PYTHON — AUTOGEN GROUP CHAT
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code class="language-html"><span class="cm"># pip install pyautogen</span>
    <span class="kw">import</span> autogen

    config_list = [{<span class="str">"model": "gpt-4o-mini", "api_key": "sk-..."</span>}]
    llm_cfg = {<span class="str">"config_list": config_list, "temperature"</span>: <span class="num">0</span>}

    <span class="cm"># Define specialized agents</span>\nuser_proxy = autogen.<span class="fn">UserProxyAgent</span>(
        name=<span class="str">"User"</span>,
        human_input_mode=<span class="str">"TERMINATE"</span>,        <span class="cm"># only ask for input on TERMINATE</span>
        max_consecutive_auto_reply=<span class="num">10</span>,
        code_execution_config={<span class="str">"use_docker"</span>: <span class="kw">False</span>},
    )

    researcher = autogen.<span class="fn">AssistantAgent</span>(
        name=<span class="str">"Researcher"</span>,
        llm_config=llm_cfg,
        system_message=<span class="str">"You research topics and provide factual summaries. Never write code."</span>
    )

    coder = autogen.<span class="fn">AssistantAgent</span>(
        name=<span class="str">"Coder"</span>,
        llm_config=llm_cfg,
        system_message=<span class="str">"You write clean Python code based on requirements. Always include docstrings."</span>
    )

    critic = autogen.<span class="fn">AssistantAgent</span>(
        name=<span class="str">"Critic"</span>,
        llm_config=llm_cfg,
        system_message=<span class="str">"You review code and research for errors, edge cases, and improvements. Be specific."</span>
    )

    <span class="cm"># GroupChat manages turn-taking</span>
    group_chat = autogen.<span class="fn">GroupChat</span>(
        agents=[user_proxy, researcher, coder, critic],
        messages=[],
        max_round=<span class="num">12</span>,
        speaker_selection_method=<span class="str">"auto"</span>   <span class="cm"># LLM decides who speaks next</span>
    )
    manager = autogen.<span class="fn">GroupChatManager</span>(groupchat=group_chat, llm_config=llm_cfg)

    <span class="cm"># Start the conversation</span>\nuser_proxy.<span class="fn">initiate_chat</span>(
        manager,
        message=<span class="str">"Research best practices for Python error handling, then write a production-grade decorator that retries functions on exception with exponential backoff, then review it."</span>
    )</code></pre>
    </div>
    <!-- /theory -->
    <h2 class="sh2">
           ⚡ Tasks
          </h2>
