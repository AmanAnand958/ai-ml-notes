  tasks:
  - title: FastAPI "Hello RAG" App
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n         Build a minimal FastAPI app with: (1) a POST /query\
      \ endpoint that takes {\"question\": \"...\"} and returns a mock {\"answer\"\
      : \"...\"}, (2) a GET /health endpoint, (3) API key auth via X-API-Key header,\
      \ (4) automatic /docs page with OpenAPI. Test with curl and the built-in Swagger\
      \ UI. Then run it with\n         \n          uvicorn main:app --reload\n   \
      \      \n         .\n        </p>"
    done_when: POST /query returns a 200 response. GET /query with wrong API key returns
      403. /docs page shows interactive Swagger UI. You can test endpoints directly
      in the browser.
    git_cmd: 'git add . &amp;&amp; git commit -m "day112: complete day 112 tasks and
      coding exercises"'
    sol_id: sol-w16d112t1
    solution_title: ✅ COMPLETE SOLUTION — fastapi_hello_rag_app.py
    solution_code: "<span class=\"cm\"># fastapi_hello_rag_app.py — Solution</span>\n\
      <span class=\"cm\"># Complete solution for: FastAPI \"Hello RAG\" App</span>\n\
      \n<span class=\"cm\"># Multi-Agent Pattern: Research + Writer + Reviewer</span>\n\
      <span class=\"cm\"># pip install langgraph langchain-openai</span>\n\n<span\
      \ class=\"kw\">from</span> langgraph.graph <span class=\"kw\">import</span>\
      \ StateGraph, END\n<span class=\"kw\">from</span> langchain_openai <span class=\"\
      kw\">import</span> ChatOpenAI\n<span class=\"kw\">from</span> typing <span class=\"\
      kw\">import</span> TypedDict, Annotated\n<span class=\"kw\">import</span> operator\n\
      \n<span class=\"cm\"># 1. Define shared state</span>\n<span class=\"kw\">class</span>\
      \ <span class=\"cls\">AgentState</span>(TypedDict):\n    topic: str\n    research:\
      \ Annotated[list[str], operator.add]\n    draft: str\n    review: str\n    final:\
      \ str\n\nllm = <span class=\"fn\">ChatOpenAI</span>(model=<span class=\"str\"\
      >\"gpt-4o-mini\"</span>, temperature=<span class=\"num\">0.3</span>)\n\n<span\
      \ class=\"cm\"># 2. Define agent nodes</span>\n<span class=\"kw\">def</span>\
      \ <span class=\"fn\">researcher</span>(state: AgentState) -&gt; AgentState:\n\
      \    <span class=\"str\">\"\"\"Research agent: gathers key facts about the topic.\"\
      \"\"</span>\n    response = llm.<span class=\"fn\">invoke</span>(\n        <span\
      \ class=\"str\">f\"You are a research assistant. List 5 key facts about: {state['</span>topic<span\
      \ class=\"str\">']}. \"</span>\n        <span class=\"str\">f\"Be concise and\
      \ factual.\"</span>\n    )\n    <span class=\"kw\">return</span> {<span class=\"\
      str\">\"research\"</span>: [response.content]}\n\n<span class=\"kw\">def</span>\
      \ <span class=\"fn\">writer</span>(state: AgentState) -&gt; AgentState:\n  \
      \  <span class=\"str\">\"\"\"Writer agent: creates a draft from research.\"\"\
      \"</span>\n    research = <span class=\"str\">\"\\n\".join(state[\"research\"\
      </span>])\n    response = llm.<span class=\"fn\">invoke</span>(\n        <span\
      \ class=\"str\">f\"You are a technical writer. Write a clear 200-word summary\
      \ based on this research:\\n{research}\"</span>\n    )\n    <span class=\"kw\"\
      >return</span> {<span class=\"str\">\"draft\"</span>: response.content}\n\n\
      <span class=\"kw\">def</span> <span class=\"fn\">reviewer</span>(state: AgentState)\
      \ -&gt; AgentState:\n    <span class=\"str\">\"\"\"Reviewer agent: critiques\
      \ the draft.\"\"\"</span>\n    response = llm.<span class=\"fn\">invoke</span>(\n\
      \        <span class=\"str\">f\"You are a critical reviewer. Review this draft\
      \ for accuracy and clarity. \"</span>\n        <span class=\"str\">f\"List specific\
      \ improvements:\\n{state['</span>draft<span class=\"str\">']}\"</span>\n   \
      \ )\n    <span class=\"kw\">return</span> {<span class=\"str\">\"review\"</span>:\
      \ response.content}\n\n<span class=\"kw\">def</span> <span class=\"fn\">finalizer</span>(state:\
      \ AgentState) -&gt; AgentState:\n    <span class=\"str\">\"\"\"Finalizer: incorporates\
      \ review feedback.\"\"\"</span>\n    response = llm.<span class=\"fn\">invoke</span>(\n\
      \        <span class=\"str\">f\"Revise this draft based on the review feedback.\\\
      n\\n\"</span>\n        <span class=\"str\">f\"Draft:\\n{state['</span>draft<span\
      \ class=\"str\">']}\\n\\nFeedback:\\n{state['</span>review<span class=\"str\"\
      >']}\"</span>\n    )\n    <span class=\"kw\">return</span> {<span class=\"str\"\
      >\"final\"</span>: response.content}\n\n<span class=\"cm\"># 3. Build the graph</span>\n\
      workflow = <span class=\"fn\">StateGraph</span>(AgentState)\nworkflow.<span\
      \ class=\"fn\">add_node</span>(<span class=\"str\">\"researcher\"</span>, researcher)\n\
      workflow.<span class=\"fn\">add_node</span>(<span class=\"str\">\"writer\"</span>,\
      \ writer)\nworkflow.<span class=\"fn\">add_node</span>(<span class=\"str\">\"\
      reviewer\"</span>, reviewer)\nworkflow.<span class=\"fn\">add_node</span>(<span\
      \ class=\"str\">\"finalizer\"</span>, finalizer)\n\nworkflow.<span class=\"\
      fn\">set_entry_point</span>(<span class=\"str\">\"researcher\"</span>)\nworkflow.<span\
      \ class=\"fn\">add_edge</span>(<span class=\"str\">\"researcher\", \"writer\"\
      </span>)\nworkflow.<span class=\"fn\">add_edge</span>(<span class=\"str\">\"\
      writer\", \"reviewer\"</span>)\nworkflow.<span class=\"fn\">add_edge</span>(<span\
      \ class=\"str\">\"reviewer\", \"finalizer\"</span>)\nworkflow.<span class=\"\
      fn\">add_edge</span>(<span class=\"str\">\"finalizer\"</span>, END)\n\napp =\
      \ workflow.<span class=\"fn\">compile</span>()\n\n<span class=\"cm\"># 4. Run</span>\n\
      result = app.<span class=\"fn\">invoke</span>({<span class=\"str\">\"topic\"\
      : \"How LoRA fine-tuning works\", \"research\"</span>: []})\n<span class=\"\
      fn\">print</span>(<span class=\"str\">\"=== Final Article ===\"</span>)\n<span\
      \ class=\"fn\">print</span>(result[<span class=\"str\">\"final\"</span>])\n\n\
      <span class=\"kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n\
      \    <span class=\"fn\">solve</span>()"
    solution_lang: python
