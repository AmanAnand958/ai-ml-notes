  hinglish: 'Alignment tax: safety ke liye optimize karna capability reduce kar sakta hai. Balance karna important hai — bahut
    zyada restrict mat karo, bahut kam bhi mat. Benchmark par track karo!'
  analogy: Docker Compose is like organizing a stage performance. You write a script (yml file) specifying when the lights
    (databases), audio (backend API), and actors (frontend) should coordinate. (This mirrors how Observability fundamentally
    operates.)
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">1. Why LLM Observability is Different\
    \ from Classical APM</h3>\n<p>Classical application performance monitoring tracks CPU, memory, latency, and error rates.\
    \ LLMs introduce a qualitatively new failure mode: <strong>silent semantic errors</strong>. A hallucinated answer returns\
    \ HTTP 200 with no exception. Standard APM tools see a successful request; the user sees a confident lie. LLM observability\
    \ exists specifically to detect these invisible failures.</p>\n<div class=\"callout ci\">\n<strong>The Three Pillars of\
    \ LLM Observability:</strong>\n<ul>\n<li><strong>Tracing:</strong> Full chain-of-calls visibility — what prompt was sent,\
    \ what context was retrieved, latency per step</li>\n<li><strong>Evaluation:</strong> Automated quality scoring (faithfulness,\
    \ relevance, toxicity) via LLM-as-judge</li>\n<li><strong>Monitoring:</strong> Cost per query, token usage trends, retrieval\
    \ precision drift over time</li>\n</ul>\n</div>\n<h3 class=\"sh3\">2. LangSmith — Zero-Config LangChain Tracing</h3>\n\
    <p>LangSmith is LangChain's official observability platform. Every <code>Runnable</code> in LangChain automatically emits\
    \ structured traces when you set two environment variables — no code changes needed.</p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\"><span class=\"cb-lang\">python</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >copy</button></div></div>\n<pre><code class=\"language-python\">import os\nos.environ[\"LANGCHAIN_TRACING_V2\"] = \"\
    true\"\nos.environ[\"LANGCHAIN_API_KEY\"] = \"ls__your_key_here\"\nos.environ[\"LANGCHAIN_PROJECT\"] = \"rag-production-v1\"\
    \n\nfrom langchain_openai import ChatOpenAI\nfrom langchain_core.prompts import ChatPromptTemplate\n\nllm = ChatOpenAI(model=\"\
    gpt-4o-mini\")\nprompt = ChatPromptTemplate.from_template(\"Answer in Hindi: {question}\")\nchain = prompt | llm\n\n#\
    \ This call is now automatically traced in LangSmith dashboard\nresponse = chain.invoke({\"question\": \"What is RAG?\"\
    })\n\n# LangSmith records:\n# - Full rendered prompt (with injected values)\n# - Model name, temperature, max_tokens\n\
    # - Input tokens, output tokens, total cost\n# - Latency per step (prompt formatting, LLM call, output parsing)\n# - Full\
    \ response text\n# - Parent-child chain hierarchy (nested traces)</code></pre>\n</div>\n<h3 class=\"sh3\">3. Arize Phoenix\
    \ — Open-Source, Self-Hosted, Any Framework</h3>\n<p>Arize Phoenix uses OpenTelemetry (OTEL) standards and works with\
    \ any LLM framework. It's self-hosted — essential for GDPR/HIPAA environments where shipping traces to a third-party SaaS\
    \ violates data residency requirements.</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python</span><div\
    \ class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"\
    language-python\">import phoenix as px\nfrom openinference.instrumentation.openai import OpenAIInstrumentor\nfrom opentelemetry.sdk.trace\
    \ import TracerProvider\nfrom opentelemetry.sdk.trace.export import SimpleSpanProcessor\nfrom opentelemetry.exporter.otlp.proto.http.trace_exporter\
    \ import OTLPSpanExporter\n\n# Launch local Phoenix UI at http://localhost:6006\nsession = px.launch_app()\n\n# Auto-instrument\
    \ all OpenAI calls (works for LangChain, LlamaIndex too)\nOpenAIInstrumentor().instrument()\n\nfrom openai import OpenAI\n\
    client = OpenAI()\n\n# Every completion call is now traced in Phoenix\nresponse = client.chat.completions.create(\n  \
    \  model=\"gpt-4o-mini\",\n    messages=[{\"role\": \"user\", \"content\": \"Explain KV caching in 2 sentences.\"}]\n\
    )\n# Phoenix shows: span name, duration, token counts, \n# full prompt/response text, embedding latencies, retrieval chains\n\
    print(response.choices[0].message.content)</code></pre>\n</div>\n<h3 class=\"sh3\">4. Key Metrics to Monitor in Production</h3>\n\
    <table class=\"concept-table\">\n<tr><th>Metric</th><th>What It Catches</th><th>Alert Threshold</th></tr>\n<tr><td>TTFT\
    \ (Time-to-first-token)</td><td>Model serving latency degradation</td><td>&gt; 1.5s</td></tr>\n<tr><td>Total tokens /\
    \ query</td><td>Prompt bloat and cost overruns</td><td>&gt; 4000 tokens</td></tr>\n<tr><td>Retrieval precision@5</td><td>Vector\
    \ DB degradation after updates</td><td>&lt; 0.7</td></tr>\n<tr><td>Hallucination rate (LLM judge)</td><td>Model drift,\
    \ prompt regression post-deploy</td><td>&gt; 5%</td></tr>\n<tr><td>Cost per query (USD)</td><td>Budget overrun from verbose\
    \ prompts</td><td>&gt; $0.01</td></tr>\n</table>\n<h3 class=\"sh3\">5. Sampling Strategy for High-Throughput Systems</h3>\n\
    <p>Tracing 100% of LLM calls at 1000 QPS is prohibitively expensive. Use intelligent sampling:</p>\n<ul>\n<li><strong>Head-based\
    \ (10%):</strong> Sample randomly at request start. Simple, but misses rare failures.</li>\n<li><strong>Tail-based (100%\
    \ for slow/error):</strong> Capture all requests with latency &gt; P99 or error codes. Finds the interesting cases.</li>\n\
    <li><strong>Priority sampling:</strong> Always trace new prompt versions, A/B test cohorts, and user-flagged feedback.</li>\n\
    </ul>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python</span><div class=\"cb-btns\"><button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\">from opentelemetry.sdk.trace.sampling\
    \ import TraceIdRatioBased\nfrom opentelemetry.sdk.trace import TracerProvider\n\n# Sample 20% of all traces randomly\n\
    sampler = TraceIdRatioBased(fraction=0.20)\nprovider = TracerProvider(sampler=sampler)\n\n# Custom logic: bump to 100%\
    \ for slow queries\nimport time\ndef maybe_trace(fn, *args, **kwargs):\n    start = time.perf_counter()\n    result =\
    \ fn(*args, **kwargs)\n    elapsed = time.perf_counter() - start\n    if elapsed &gt; 1.5:  # Always trace slow queries\n\
    \        log_trace(args, kwargs, result, elapsed)\n    return result</code></pre>\n</div>\n<div class=\"callout ct\">\n\
    <strong>Industry Pattern:</strong>\n<p>At scale, teams use LangSmith for development-time debugging (full traces, per-developer\
    \ isolation) and Phoenix self-hosted for production monitoring (data residency, custom dashboards). Both export in OpenTelemetry\
    \ format for downstream Grafana or Datadog dashboards.</p>\n</div>\n<!-- /theory -->\n<!-- /theory -->\n<!-- /theory -->\n\
    <h2 class=\"sh2\">\n       ⚡ Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\"\
    >\n       \U0001F50D\n       <strong>\n        Search terms:\n       </strong>\n\n        gradio image input type numpy\
    \ pillow filepath, gradio interface share public url link\n       \n</div>\n<div class=\"resource-section\" style=\"margin-top:1.5rem;\"\
    >\n<h3> style=\"font-size:14px; font-weight:700; color:var(--text); margin-bottom:10px;\"&gt;\n        \U0001F4DA Recommended\
    \ Resources\n       </h3>\n</div>\n<!-- ═══════════ DAY 116 ═══════════ -->\n<!-- /day-115 -->\n<div class=\"diagram-container\"\
    \ style=\"background:var(--bg3); padding:1.2rem; border-radius:8px; margin:1.5rem auto; border:1px solid var(--border);\
    \ text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center;\">\n<h4 style=\"\
    color:var(--accent); margin-top:0; font-size:1.05rem;\">Architecture Blueprint: LoRA Low-Rank Parameter Decomposition\
    \ ($W = W_0 + \\frac{\\alpha}{r} B A$)</h4>\n<div class=\"mermaid\">\ngraph LR\n    X[\"Input x (d_in)\"] --&gt; Frozen[\"\
    Frozen Base Weights W_0 (d_in x d_out)\"]\n    X --&gt; A[\"Down-Projection Matrix A (d_in x r)\"]\n    A --&gt; B[\"\
    Up-Projection Matrix B (r x d_out)\"]\n    B --&gt; Scale[\"Scaling Factor (alpha / r)\"]\n    Frozen --&gt; Sum[\"(+)\
    \ Output Combiner\"]\n    Scale --&gt; Sum\n    Sum --&gt; Out[\"Forward Activation h = W_0 x + (alpha/r) B A x\"]\n</div>\n\
    </div>\n"
