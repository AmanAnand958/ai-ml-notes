  - title: QLoRA Fine-Tune on Colab
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n         Open Google Colab (free T4 GPU), fine-tune a small\
      \ model (phi-2 or TinyLlama-1.1B) on your Day 2 dataset using QLoRA. Requirements:\n\
      \        </p>\n<ul class=\"prose-list\">\n<li>\n          Load in 4-bit with\
      \ BitsAndBytesConfig (NF4)\n         </li>\n<li>\n          Apply LoRA with\
      \ r=8, alpha=32 on q_proj and v_proj\n         </li>\n<li>\n          Train\
      \ for 3 epochs with SFTTrainer\n         </li>\n<li>\n          Log training\
      \ loss every 10 steps\n         </li>\n<li>\n          Compare base model vs\
      \ fine-tuned model on 5 test prompts\n         </li>\n<li>\n          Save and\
      \ merge the LoRA adapter\n         </li>\n</ul>"
    done_when: Training loss decreases visibly. Fine-tuned model produces better-formatted
      output on your task compared to the base model on at least 3 of 5 test prompts.
    git_cmd: 'git add qlora_fine_tune_on_colab.py &amp;&amp; git commit -m "day108:
      qlora-fine-tune-on-colab"'
    sol_id: sol-w16d108t3
    solution_title: ✅ COMPLETE SOLUTION — qlora_fine_tune_on_colab.py
    solution_code: "<span class=\"cm\"># qlora_fine_tune_on_colab.py — Solution</span>\n\
      <span class=\"cm\"># Complete solution for: QLoRA Fine-Tune on Colab</span>\n\
      \n<span class=\"cm\"># QLoRA Fine-Tuning on Google Colab</span>\n<span class=\"\
      cm\"># Requires: pip install transformers peft bitsandbytes datasets trl accelerate</span>\n\
      \n<span class=\"kw\">import</span> torch\n<span class=\"kw\">from</span> transformers\
      \ <span class=\"kw\">import</span> AutoModelForCausalLM, AutoTokenizer, BitsAndBytesConfig\n\
      <span class=\"kw\">from</span> peft <span class=\"kw\">import</span> LoraConfig,\
      \ get_peft_model, prepare_model_for_kbit_training\n<span class=\"kw\">from</span>\
      \ datasets <span class=\"kw\">import</span> load_dataset\n<span class=\"kw\"\
      >from</span> trl <span class=\"kw\">import</span> SFTTrainer, SFTConfig\n\n\
      <span class=\"cm\"># 1. Load model in 4-bit quantization (QLoRA)</span>\nbnb_config\
      \ = <span class=\"fn\">BitsAndBytesConfig</span>(\n    load_in_4bit=<span class=\"\
      kw\">True</span>,\n    bnb_4bit_quant_type=<span class=\"str\">\"nf4\"</span>,\n\
      \    bnb_4bit_compute_dtype=torch.float16,\n    bnb_4bit_use_double_quant=<span\
      \ class=\"kw\">True</span>,\n)\n\nmodel_name = <span class=\"str\">\"TinyLlama/TinyLlama-1.1B-Chat-v1.0\"\
      </span>\nmodel = AutoModelForCausalLM.<span class=\"fn\">from_pretrained</span>(\n\
      \    model_name, quantization_config=bnb_config, device_map=<span class=\"str\"\
      >\"auto\"</span>\n)\ntokenizer = AutoTokenizer.<span class=\"fn\">from_pretrained</span>(model_name)\n\
      tokenizer.pad_token = tokenizer.eos_token\n\n<span class=\"cm\"># 2. Prepare\
      \ for k-bit training</span>\nmodel = <span class=\"fn\">prepare_model_for_kbit_training</span>(model)\n\
      \n<span class=\"cm\"># 3. Configure LoRA</span>\nlora_config = <span class=\"\
      fn\">LoraConfig</span>(\n    r=<span class=\"num\">16</span>,              \
      \      <span class=\"cm\"># Low rank</span>\n    lora_alpha=<span class=\"num\"\
      >32</span>,           <span class=\"cm\"># Scaling factor</span>\n    target_modules=[<span\
      \ class=\"str\">\"q_proj\", \"v_proj\"</span>],  <span class=\"cm\"># Which\
      \ layers to adapt</span>\n    lora_dropout=<span class=\"num\">0.05</span>,\n\
      \    bias=<span class=\"str\">\"none\"</span>,\n    task_type=<span class=\"\
      str\">\"CAUSAL_LM\"</span>,\n)\nmodel = <span class=\"fn\">get_peft_model</span>(model,\
      \ lora_config)\nmodel.<span class=\"fn\">print_trainable_parameters</span>()\
      \  <span class=\"cm\"># Should show ~0.5% trainable</span>\n\n<span class=\"\
      cm\"># 4. Load dataset</span>\ndataset = <span class=\"fn\">load_dataset</span>(<span\
      \ class=\"str\">\"tatsu-lab/alpaca\", split=\"train[:1000]\"</span>)\n\n<span\
      \ class=\"kw\">def</span> <span class=\"fn\">format_instruction</span>(example):\n\
      \    <span class=\"kw\">if</span> example.<span class=\"fn\">get</span>(<span\
      \ class=\"str\">\"input\"</span>):\n        <span class=\"kw\">return</span>\
      \ <span class=\"str\">f\"### Instruction:\\n{example['</span>instruction<span\
      \ class=\"str\">']}\\n\\n### Input:\\n{example['</span>input<span class=\"str\"\
      >']}\\n\\n### Response:\\n{example['</span>output<span class=\"str\">']}\"</span>\n\
      \    <span class=\"kw\">return</span> <span class=\"str\">f\"### Instruction:\\\
      n{example['</span>instruction<span class=\"str\">']}\\n\\n### Response:\\n{example['</span>output<span\
      \ class=\"str\">']}\"</span>\n\n<span class=\"cm\"># 5. Train with SFTTrainer</span>\n\
      training_args = <span class=\"fn\">SFTConfig</span>(\n    output_dir=<span class=\"\
      str\">\"./qlora-output\"</span>,\n    num_train_epochs=<span class=\"num\">1</span>,\n\
      \    per_device_train_batch_size=<span class=\"num\">4</span>,\n    gradient_accumulation_steps=<span\
      \ class=\"num\">4</span>,\n    learning_rate=<span class=\"num\">2e-4</span>,\n\
      \    fp16=<span class=\"kw\">True</span>,\n    logging_steps=<span class=\"\
      num\">10</span>,\n    save_strategy=<span class=\"str\">\"epoch\"</span>,\n\
      \    max_seq_length=<span class=\"num\">512</span>,\n)\n\ntrainer = <span class=\"\
      fn\">SFTTrainer</span>(\n    model=model,\n    train_dataset=dataset,\n    formatting_func=format_instruction,\n\
      \    args=training_args,\n    tokenizer=tokenizer,\n)\n\ntrainer.<span class=\"\
      fn\">train</span>()\n\n<span class=\"cm\"># 6. Save LoRA adapter (small, ~16MB)</span>\n\
      model.<span class=\"fn\">save_pretrained</span>(<span class=\"str\">\"./qlora-adapter\"\
      </span>)\ntokenizer.<span class=\"fn\">save_pretrained</span>(<span class=\"\
      str\">\"./qlora-adapter\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
      str\">\"LoRA adapter saved! Merge with base model for deployment.\"</span>)\n\
      \n<span class=\"kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n\
      \    <span class=\"fn\">solve</span>()"
    solution_lang: python
  quizzes:
  - num_str: Q1 OF 5
    question: Why does LoRA set the A matrix (the right matrix) to random Gaussian
      initialization but the B matrix to zeros at the start of training?
    qid: q108_1
    options:
    - letter: A
      text: It saves GPU memory during initialization
      is_correct: false
    - letter: B
      text: So that ΔW = BA = 0 at the start of training, meaning the fine-tuning
        starts from the exact same state as the pre-trained model — no disruption
        to the pretrained weights
      is_correct: true
    - letter: C
      text: B is always zero because it represents bias terms
      is_correct: false
    - letter: D
      text: Random A + zero B ensures gradient flow is maximised
      is_correct: false
    correct_fb: '✅ Correct! If both A and B were random, ΔW = BA would be non-zero
      at step 0, corrupting the pretrained features immediately. By zeroing B: BA
      = 0 at step 0, so the model starts training from its original pretrained state.
      As training progresses, B learns non-zero values.'
    wrong_fb: ❌ The initialization trick ensures ΔW = BA = 0 at step 0 (zero matrix
      × anything = zero). This means training starts from the exact pretrained state.
      Only after the first gradient update does B become non-zero, gradually introducing
      the task-specific adaptation.
  - num_str: Q2 OF 5
    question: What is the key difference between NF4 (NormalFloat4) quantisation and
      standard INT4 quantisation?
    qid: q108_2
    options:
    - letter: A
      text: NF4 uses 4 bits per weight while INT4 uses 8 bits
      is_correct: false
    - letter: B
      text: NF4 is information-theoretically optimal for normally-distributed weights
        — its quantisation levels are spaced to minimise quantisation error given
        that neural network weights follow a Gaussian distribution
      is_correct: true
    - letter: C
      text: INT4 is for integers only; NF4 is for floating-point
      is_correct: false
    - letter: D
      text: NF4 is faster because it uses unsigned integers
      is_correct: false
    correct_fb: ✅ Exactly. INT4 has evenly-spaced quantisation levels (like a ruler
      with equal tick marks). NF4 has more levels near 0 where most weights cluster
      (due to Gaussian distribution) and fewer levels in the tails. This minimises
      the reconstruction error for neural network weights specifically.
    wrong_fb: ❌ Both use 4 bits. The difference is WHERE those 4 bits place their
      quantisation levels. NF4 is designed specifically for Gaussian-distributed weights
      (which neural networks have), placing more precision near 0 where most weights
      are clustered.
  - num_str: Q3 OF 5
    question: Your LoRA fine-tuned model performs well on training data but poorly
      on new inputs. What should you try first?
    qid: q108_3
    options:
    - letter: A
      text: Increase the rank r to capture more complex patterns
      is_correct: false
    - letter: B
      text: 'The model is overfitting — try: increasing lora_dropout, reducing r,
        adding more training data (diversity, not just quantity), or reducing num_epochs'
      is_correct: true
    - letter: C
      text: Switch from LoRA to full fine-tuning
      is_correct: false
    - letter: D
      text: Increase learning rate for faster convergence
      is_correct: false
    correct_fb: '✅ Good diagnosis. Classic overfitting — high training performance,
      low generalisation. Solutions in order: (1) more diverse data, (2) add dropout
      (lora_dropout=0.1), (3) reduce rank r, (4) train fewer epochs (use early stopping
      with validation loss). Increasing r or LR would make it worse.'
    wrong_fb: '❌ Training well + test poorly = overfitting. For LoRA, fixes are: increase
      lora_dropout, reduce rank r (fewer parameters = less overfitting), add more
      diverse training data, or reduce training epochs. Increasing r would increase
      capacity and make overfitting worse.'
  - num_str: Q4 OF 5
    question: "After training, you call\n        \n         merge_and_unload()\n \
      \       \n        on your PEFT model. What does this produce and what are the\
      \ tradeoffs?"
    qid: q108_4
    options:
    - letter: A
      text: It deletes the LoRA adapters to free memory
      is_correct: false
    - letter: B
      text: 'It bakes W'' = W + BA into the base weights and returns a standard model
        — Pro: no adapter overhead at inference, loads like any normal model. Con:
        you can''t easily switch adapters at runtime and the merged model is the full
        model size'
      is_correct: true
    - letter: C
      text: It quantises the merged model to 4 bits automatically
      is_correct: false
    - letter: D
      text: It exports the model to ONNX format
      is_correct: false
    correct_fb: ✅ Correct. merge_and_unload() computes W_new = W_base + B×A for every
      LoRA layer, fusing the adapters into the base weights. The result is a standard
      HuggingFace model with no PEFT overhead — perfect for deployment. But you lose
      the ability to swap adapters dynamically.
    wrong_fb: '❌ merge_and_unload() adds the LoRA update (BA) directly into the base
      weights permanently: W'' = W + BA. The resulting model has no adapter overhead
      and works like any normal transformers model. Tradeoff: can''t switch adapters
      anymore without reloading.'
  - num_str: Q5 OF 5
    question: You want to fine-tune a model to always respond in a specific JSON schema.
      Should you use LoRA fine-tuning or Structured Outputs (OpenAI API feature)?
    qid: q108_5
    options:
    - letter: A
      text: Always LoRA — it's more reliable
      is_correct: false
    - letter: B
      text: Use Structured Outputs first — it's instant, zero training cost, schema-enforced
        at the token level. Only fine-tune if you need a specific domain vocabulary
        or the schema changes content quality, not just format
      is_correct: true
    - letter: C
      text: They are equivalent — choose based on personal preference
      is_correct: false
    - letter: D
      text: Structured Outputs are only available for classification tasks
      is_correct: false
    correct_fb: ✅ Exactly right. For format control (JSON schema), Structured Outputs
      (OpenAI API) or Pydantic output parsers (LangChain) solve the problem perfectly
      with zero training cost. Fine-tuning is overkill for pure format constraints.
      Fine-tune only when the task requires knowledge or style that can't be injected
      via prompts or retrieved via RAG.
    wrong_fb: ❌ For JSON format enforcement, Structured Outputs are the right tool
      — no training needed, enforced at the grammar/token level, works instantly.
      Save fine-tuning for problems that require changing what the model knows or
      how it reasons, not just how it formats output.
  flashcards:
  - front: QLoRA NF4?
    back: NormalFloat4. Data type optimized for normally distributed model weights.
  - front: How is Day 108 structured?
    back: It combines theory, hands-on coding tasks, and quizzes.
  - front: Where does Day 108 fit in Week 16?
    back: It is a key day in Week 16 (MLOps, Flask APIs, Docker, Gradio, Model Serving).
  - front: What is the difference between Cosine Similarity and Dot Product when comparing
      vector embeddings?
    back: Cosine similarity measures angle between vectors (normalized dot product);
      if embeddings are L2-normalized to unit length, Dot Product equals Cosine Similarity.
  gotcha:
    title: '⚠️ Gotcha: Distributed Data Parallel (DDP) Gradient Sync'
    description: Ensure all processes initialize identical random seeds and model
      weights before starting DDP training loops.
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       Flask\
      \ API routes definitions incoming client JSON payloads values check methods\
      \ handle karti hain."
    bullets:
    - Fine-tune only when prompting and RAG genuinely can't solve the problem — it's
      expensive and risky compared to RAG.
    - 'LoRA: ΔW = BA. B initialised to zero so training starts from pretrained state.
      Only 0.1–1% of parameters need training.'
    - QLoRA = 4-bit NF4 base + fp16 LoRA adapters. Enables 7B model fine-tuning on
      a free Colab T4 GPU (15GB VRAM).
    - lora_alpha/r is the key scaling hyperparameter. Start with alpha=4×r. Use dropout=0.05–0.1
      to prevent overfitting.
    - "merge_and_unload()\n        \n        bakes LoRA back into base weights — use\
      \ this for deployment to eliminate adapter overhead."
