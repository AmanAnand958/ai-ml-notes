    \ ) <span class=\"kw\">as</span> stream:\n                <span class=\"kw\">async</span>\
    \ <span class=\"kw\">for</span> chunk <span class=\"kw\">in</span> stream:\n \
    \                   delta = chunk.choices[<span class=\"str\">\"0\"].delta.content\
    \ or \"\"</span>\n                    <span class=\"kw\">if</span> delta:\n  \
    \                      full_response += delta\n                        <span class=\"\
    kw\">await</span> websocket.<span class=\"fn\">send_json</span>({<span class=\"\
    str\">\"type\": \"token\", \"content\"</span>: delta})\n\n            <span class=\"\
    cm\"># Signal end of stream</span>\n            <span class=\"kw\">await</span>\
