  hinglish: 'A/B testing LLM changes: gradually roll out naye model, human raters se quality evaluate karwao, business metrics
    track karo. Statistical significance ke baad full rollout karo!'
  analogy: '⚡ Analogy: Model Optimization & Quantization is like packing a giant camping tent into a tiny ultralight backpack
    — compressing 16-bit floating point weights into 4-bit integers without ripping the fabric. (This mirrors how Week fundamentally
    operates.)'
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">1. Production RAG System Architecture</h3>\n\
    <p>A production RAG deployment is not a Python script calling ChromaDB and OpenAI. It is a distributed system with five\
    \ distinct layers, each with its own scaling, failure, and observability requirements.</p>\n<div class=\"callout ci\"\
    >\n<strong>The Five Production RAG Layers:</strong>\n<ol>\n<li><strong>Ingestion Pipeline:</strong> Document loading →\
    \ Chunking → Embedding → Vector DB upsert (async, batched, idempotent)</li>\n<li><strong>Retrieval Engine:</strong> Query\
    \ embedding → ANN search → Reranking (cross-encoder) → Context assembly</li>\n<li><strong>LLM Generation:</strong> Prompt\
    \ assembly → Streaming LLM call → Response validation</li>\n<li><strong>API Layer:</strong> FastAPI with async handlers,\
    \ rate limiting, JWT auth, health checks</li>\n<li><strong>Observability:</strong> LangSmith/Phoenix tracing + RAGAS shadow\
    \ evaluation + cost monitoring</li>\n</ol>\n</div>\n<h3 class=\"sh3\">2. Technology Stack for Production</h3>\n<table\
    \ class=\"concept-table\">\n<tr><th>Layer</th><th>Dev Prototype</th><th>Production Standard</th><th>Why Upgrade</th></tr>\n\
    <tr><td>Vector DB</td><td>ChromaDB (local)</td><td>Pinecone / Qdrant Cloud</td><td>HA, autoscaling, backup</td></tr>\n\
    <tr><td>Embeddings</td><td>text-embedding-ada-002</td><td>text-embedding-3-large</td><td>+15% retrieval quality</td></tr>\n\
    <tr><td>Reranker</td><td>None</td><td>Cohere Rerank v3</td><td>+15-20% Precision@5</td></tr>\n<tr><td>LLM</td><td>GPT-4o-mini</td><td>GPT-4o\
    \ / Claude 3.5 Sonnet</td><td>Faithfulness, complex reasoning</td></tr>\n<tr><td>API</td><td>Flask dev server</td><td>FastAPI\
    \ + gunicorn + uvicorn</td><td>Async, auto-docs, type safety</td></tr>\n<tr><td>Frontend</td><td>Gradio</td><td>Next.js\
    \ + Vercel AI SDK</td><td>Streaming UX, production deployable</td></tr>\n</table>\n<h3 class=\"sh3\">3. Production RAG\
    \ FastAPI Backend</h3>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python</span><div class=\"\
    cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\"\
    >from fastapi import FastAPI, HTTPException\nfrom fastapi.responses import StreamingResponse\nfrom pydantic import BaseModel\n\
    from langchain_openai import ChatOpenAI, OpenAIEmbeddings\nfrom langchain_pinecone import PineconeVectorStore\nfrom langchain_core.prompts\
    \ import ChatPromptTemplate\nfrom langchain_core.runnables import RunnablePassthrough\nfrom langchain_cohere import CohereRerank\n\
    import logging\n\napp = FastAPI(title=\"Production RAG API v2.0\")\nlogger = logging.getLogger(__name__)\n\n# Initialise\
    \ all components once at startup (not per-request)\nembeddings  = OpenAIEmbeddings(model=\"text-embedding-3-large\")\n\
    vectorstore = PineconeVectorStore(index_name=\"prod-rag\", embedding=embeddings)\nreranker    = CohereRerank(model=\"\
    rerank-english-v3.0\", top_n=5)\n\n# Over-fetch 20 candidates, then rerank to top 5 — best quality\nretriever = vectorstore.as_retriever(search_kwargs={\"\
    k\": 20})\nllm = ChatOpenAI(model=\"gpt-4o\", streaming=True)\n\nSYSTEM_PROMPT = \"\"\"You are a precise technical assistant.\n\
    Answer ONLY based on the provided context.\nIf the context doesn't contain the answer, say exactly: \"I don't know based\
    \ on the available documents.\"\n\nContext:\n{context}\"\"\"\n\nrag_chain = (\n    {\"context\": retriever | reranker,\
    \ \"question\": RunnablePassthrough()}\n    | ChatPromptTemplate.from_messages([\n        (\"system\", SYSTEM_PROMPT),\n\
    \        (\"human\", \"{question}\")\n    ])\n    | llm\n)\n\nclass QueryRequest(BaseModel):\n    question: str\n    session_id:\
    \ str | None = None\n\n@app.post(\"/query/stream\")\nasync def query_stream(req: QueryRequest):\n    \"\"\"Stream RAG\
    \ response token-by-token via SSE.\"\"\"\n    async def event_generator():\n        try:\n            async for chunk\
    \ in rag_chain.astream(req.question):\n                if chunk.content:\n                    yield f\"data: {chunk.content}\\\
    n\\n\"\n            yield \"data: [DONE]\\n\\n\"\n        except Exception as e:\n            logger.error(f\"RAG error:\
    \ {e}\")\n            yield f\"data: [ERROR] {str(e)}\\n\\n\"\n    \n    return StreamingResponse(event_generator(), media_type=\"\
    text/event-stream\")\n\n@app.get(\"/health\")\nasync def health():\n    return {\"status\": \"ok\", \"version\": \"2.0.0\"\
    }</code></pre>\n</div>\n<h3 class=\"sh3\">4. Docker Multi-Stage Production Build</h3>\n<div class=\"cb\">\n<div class=\"\
    cb-head\"><span class=\"cb-lang\">dockerfile</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >copy</button></div></div>\n<pre><code class=\"language-dockerfile\">FROM python:3.12-slim AS builder\nWORKDIR /build\n\
    COPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nFROM python:3.12-slim AS runtime\nWORKDIR\
    \ /app\nCOPY --from=builder /usr/local/lib/python3.12/site-packages /usr/local/lib/python3.12/site-packages\nCOPY . .\n\
    \nENV PORT=8000\nEXPOSE 8000\n\n# 4 workers × 1 thread each — async-friendly for LLM streaming\nCMD [\"gunicorn\", \"\
    main:app\", \"-w\", \"4\", \"-k\", \"uvicorn.workers.UvicornWorker\",\n     \"--bind\", \"0.0.0.0:8000\", \"--timeout\"\
    , \"120\"]</code></pre>\n</div>\n<h3 class=\"sh3\">5. Retrieval Quality Targets</h3>\n<p>RAG quality is dominated by retrieval,\
    \ not generation. Target these baselines before tuning the LLM prompt:</p>\n<ul>\n<li>$$\\text{Precision@5} = \\frac{|\\\
