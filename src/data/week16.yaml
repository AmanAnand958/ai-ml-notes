    - letter: D
      text: Docker won't start containers as root on modern Linux
      is_correct: false
      id: d
    correct_fb: '✅ Correct defence-in-depth. Container isolation is not perfect. If there''s a kernel vulnerability or container
      escape, root inside the container = root on the host. Non-root: even after container escape, attacker has limited host
      permissions. Always add: adduser appuser &amp;&amp; USER.'
    wrong_fb: '❌ Defence-in-depth: if an attacker exploits your app and escapes the container, root inside = root on host.
      A non-root user limits the blast radius. This is especially important for AI apps where user input (prompt injection)
      could trigger code execution in the container.'
    correct: b
    explanation: ''
  - num_str: Question 5
    question: A semantic cache for LLM responses works by checking embedding similarity. Why use cosine similarity ≥ 0.95
      as the cache hit threshold, not a lower value like 0.8?
    qid: q112_5
    options:
    - letter: A
      text: 0.8 is too slow to compute
      is_correct: false
      id: a
    - letter: B
      text: 0.8 would cache responses for semantically related but factually different questions (e.g., "what is Q2 revenue?"
        and...
      is_correct: true
      id: b
    - letter: C
      text: 0.95 gives the most cache hits for better performance
      is_correct: false
      id: c
    - letter: D
      text: Anything below 0.95 causes Redis memory overflow
      is_correct: false
      id: d
    correct_fb: ✅ Perfect reasoning. Low threshold = more cache hits but risk serving wrong answers for semantically-similar-but-factually-different
      questions. High threshold (≥0.95) = only exact paraphrases ("what's the weather?" / "how's the weather today?") hit
      cache. For factual QA over documents, set.
    wrong_fb: ❌ Semantic caches need high threshold for factual applications. "Q2 revenue" and "Q3 revenue" might have 0.82
      cosine similarity (similar domain, similar question structure). Serving Q2's cached answer for Q3's question is wrong
      and dangerous. 0.95 ensures only true paraphrases (same intent, same facts needed) trigger cache hits.
    correct: b
    explanation: ''
