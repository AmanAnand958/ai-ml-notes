    solution_code: "<span class=\"cm\"># add_langsmith_tracing_to_week_15s_rag_sy.py\
      \ — Solution</span>\n<span class=\"cm\"># Complete solution for: Add LangSmith\
      \ Tracing to Week 15's RAG System</span>\n\n<span class=\"cm\"># Add LangSmith\
      \ Tracing to any LangChain/OpenAI application</span>\n<span class=\"cm\"># pip\
      \ install langsmith langchain langchain-openai</span>\n\n<span class=\"kw\"\
      >import</span> os\nos.environ[<span class=\"str\">\"LANGCHAIN_TRACING_V2\"]\
      \ = \"true\"</span>\nos.environ[<span class=\"str\">\"LANGCHAIN_API_KEY\"] =\
      \ \"your-langsmith-api-key\"</span>\nos.environ[<span class=\"str\">\"LANGCHAIN_PROJECT\"\
      ] = \"rag-tracing-demo\"</span>\n\n<span class=\"kw\">from</span> langchain_openai\
      \ <span class=\"kw\">import</span> ChatOpenAI\n<span class=\"kw\">from</span>\
      \ langchain_core.prompts <span class=\"kw\">import</span> ChatPromptTemplate\n\
      <span class=\"kw\">from</span> langsmith <span class=\"kw\">import</span> traceable\n\
      \n<span class=\"cm\"># Method 1: Automatic tracing with LangChain</span>\nllm\
      \ = <span class=\"fn\">ChatOpenAI</span>(model=<span class=\"str\">\"gpt-4o-mini\"\
      </span>, temperature=<span class=\"num\">0</span>)\nprompt = ChatPromptTemplate.<span\
      \ class=\"fn\">from_messages</span>([\n    (<span class=\"str\">\"system\",\
      \ \"You are a helpful AI tutor for ML concepts.\"</span>),\n    (<span class=\"\
      str\">\"user\", \"{question}\"</span>)\n])\nchain = prompt | llm\n\n<span class=\"\
      cm\"># Every invocation is automatically traced in LangSmith</span>\nresponse\
      \ = chain.<span class=\"fn\">invoke</span>({<span class=\"str\">\"question\"\
      : \"Explain LoRA in simple terms\"</span>})\n<span class=\"fn\">print</span>(response.content)\n\
      \n<span class=\"cm\"># Method 2: Custom function tracing with @traceable</span>\n\
      @<span class=\"fn\">traceable</span>(name=<span class=\"str\">\"custom_rag_pipeline\"\
      </span>)\n<span class=\"kw\">def</span> <span class=\"fn\">rag_pipeline</span>(query:\
      \ str) -&gt; str:\n    <span class=\"str\">\"\"\"Traced RAG pipeline — every\
      \ step visible in LangSmith.\"\"\"</span>\n    <span class=\"cm\"># Step 1:\
      \ Retrieve (would use vector DB in production)</span>\n    retrieved_docs =\
      \ <span class=\"fn\">retrieve_docs</span>(query)\n    \n    <span class=\"cm\"\
      ># Step 2: Generate</span>\n    context = <span class=\"str\">\"\\n\"</span>.<span\
      \ class=\"fn\">join</span>(retrieved_docs)\n    response = chain.<span class=\"\
      fn\">invoke</span>({\n        <span class=\"str\">\"question\": f\"Context:\
      \ {context}\\n\\nQuestion: {query}\"</span>\n    })\n    <span class=\"kw\"\
      >return</span> response.content\n\n@<span class=\"fn\">traceable</span>(name=<span\
      \ class=\"str\">\"retrieve_docs\"</span>)\n<span class=\"kw\">def</span> <span\
      \ class=\"fn\">retrieve_docs</span>(query: str) -&gt; list:\n    <span class=\"\
      str\">\"\"\"Simulated retrieval — replace with actual vector DB.\"\"\"</span>\n\
      \    <span class=\"kw\">return</span> [\n        <span class=\"str\">\"LoRA\
      \ adds low-rank matrices to frozen weights.\"</span>,\n        <span class=\"\
      str\">\"Rank r=16 is a common default for LoRA.\"</span>\n    ]\n\nresult =\
      \ <span class=\"fn\">rag_pipeline</span>(<span class=\"str\">\"What rank should\
      \ I use for LoRA?\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
      str\">f\"Answer: {result}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
      str\">\"Check LangSmith dashboard for full trace!\"</span>)\n\n<span class=\"\
      kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n    <span\
      \ class=\"fn\">solve</span>()"
