  - title: Build an Evaluation Dashboard
    badge: MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n          Create a 20-question evaluation dataset for your\
      \ RAG system and run it through 2 different system configurations: (A) pure\
      \ vector search, (B) hybrid search + reranking. Use an LLM-as-judge evaluator\
      \ to score answers 1–5 on correctness. Build a pandas comparison table.\n  \
      \       </p>\n<ul class=\"prose-list\">\n<li>\n           20 questions with\
      \ known ground-truth answers\n          </li>\n<li>\n           GPT-4o-mini\
      \ as the judge (prompt: \"Rate the answer correctness 1-5 given the ground truth\"\
      )\n          </li>\n<li>\n           Parse the numeric rating reliably with\
      \ regex\n          </li>\n<li>\n           Compute mean score, std deviation,\
      \ and win/lose/tie count for A vs B\n          </li>\n</ul>"
    done_when: "Comparison table shows System B (hybrid+rerank) wins on at least 12\
      \ of 20 questions. You can explain\n          <em>\n           why\n       \
      \   </em>\n          it wins on specific question types."
    git_cmd: 'git add build_an_evaluation_dashboard.py &amp;&amp; git commit -m "day109:
      build-an-evaluation-dashboard"'
    sol_id: sol-w16d109t2
    solution_title: ✅ COMPLETE SOLUTION — build_an_evaluation_dashboard.py
    solution_code: "<span class=\"cm\"># build_an_evaluation_dashboard.py — Solution</span>\n\
      <span class=\"cm\"># Complete solution for: Build an Evaluation Dashboard</span>\n\
      \n<span class=\"cm\"># Build an LLM Evaluation Dashboard</span>\n<span class=\"\
      cm\"># pip install langsmith pandas streamlit plotly</span>\n\n<span class=\"\
      kw\">import</span> streamlit <span class=\"kw\">as</span> st\n<span class=\"\
      kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\"\
      >import</span> plotly.express <span class=\"kw\">as</span> px\n<span class=\"\
      kw\">from</span> langsmith <span class=\"kw\">import</span> Client\n<span class=\"\
      kw\">from</span> datetime <span class=\"kw\">import</span> datetime, timedelta\n\
      \nst.<span class=\"fn\">set_page_config</span>(page_title=<span class=\"str\"\
      >\"LLM Eval Dashboard\", layout=\"wide\"</span>)\nst.<span class=\"fn\">title</span>(<span\
      \ class=\"str\">\"\U0001F4CA LLM Evaluation Dashboard\"</span>)\n\nclient =\
      \ <span class=\"fn\">Client</span>()\n\n<span class=\"cm\"># Sidebar: Select\
      \ project and date range</span>\nproject = st.sidebar.<span class=\"fn\">selectbox</span>(\n\
      \    <span class=\"str\">\"Project\"</span>, [p.name <span class=\"kw\">for</span>\
      \ p <span class=\"kw\">in</span> client.<span class=\"fn\">list_projects</span>()]\n\
      )\ndays = st.sidebar.<span class=\"fn\">slider</span>(<span class=\"str\">\"\
      Days to analyze\"</span>, <span class=\"num\">1</span>, <span class=\"num\"\
      >30</span>, <span class=\"num\">7</span>)\n\n<span class=\"cm\"># Fetch runs</span>\n\
      runs = <span class=\"fn\">list</span>(client.<span class=\"fn\">list_runs</span>(\n\
      \    project_name=project,\n    start_time=datetime.<span class=\"fn\">now</span>()\
      \ - <span class=\"fn\">timedelta</span>(days=days),\n    is_root=<span class=\"\
      kw\">True</span>,\n    limit=<span class=\"num\">500</span>,\n))\n\n<span class=\"\
      kw\">if</span> <span class=\"kw\">not</span> runs:\n    st.<span class=\"fn\"\
      >warning</span>(<span class=\"str\">\"No runs found for this project/date range.\"\
      </span>)\n    st.<span class=\"fn\">stop</span>()\n\n<span class=\"cm\"># Build\
      \ DataFrame</span>\ndata = []\n<span class=\"kw\">for</span> run <span class=\"\
      kw\">in</span> runs:\n    data.<span class=\"fn\">append</span>({\n        <span\
      \ class=\"str\">\"id\"</span>: <span class=\"fn\">str</span>(run.id)[:<span\
      \ class=\"num\">8</span>],\n        <span class=\"str\">\"name\"</span>: run.name,\n\
      \        <span class=\"str\">\"status\"</span>: run.status,\n        <span class=\"\
      str\">\"latency_s\"</span>: (run.end_time - run.start_time).<span class=\"fn\"\
      >total_seconds</span>() <span class=\"kw\">if</span> run.end_time <span class=\"\
      kw\">else</span> <span class=\"kw\">None</span>,\n        <span class=\"str\"\
      >\"tokens_in\"</span>: run.prompt_tokens <span class=\"kw\">or</span> <span\
      \ class=\"num\">0</span>,\n        <span class=\"str\">\"tokens_out\"</span>:\
      \ run.completion_tokens <span class=\"kw\">or</span> <span class=\"num\">0</span>,\n\
      \        <span class=\"str\">\"cost\"</span>: (run.prompt_tokens <span class=\"\
      kw\">or</span> <span class=\"num\">0</span>) * <span class=\"num\">0.00015</span>/<span\
      \ class=\"num\">1000</span> + (run.completion_tokens <span class=\"kw\">or</span>\
      \ <span class=\"num\">0</span>) * <span class=\"num\">0.0006</span>/<span class=\"\
      num\">1000</span>,\n        <span class=\"str\">\"error\"</span>: run.error\
      \ <span class=\"kw\">is</span> <span class=\"kw\">not</span> <span class=\"\
      kw\">None</span>,\n        <span class=\"str\">\"date\"</span>: run.start_time.<span\
      \ class=\"fn\">date</span>(),\n    })\ndf = pd.<span class=\"fn\">DataFrame</span>(data)\n\
      \n<span class=\"cm\"># KPI row</span>\ncol1, col2, col3, col4 = st.<span class=\"\
      fn\">columns</span>(<span class=\"num\">4</span>)\ncol1.<span class=\"fn\">metric</span>(<span\
      \ class=\"str\">\"Total Runs\"</span>, <span class=\"fn\">len</span>(df))\n\
      col2.<span class=\"fn\">metric</span>(<span class=\"str\">\"Avg Latency\", f\"\
      {df['</span>latency_s<span class=\"str\">'].mean():.2f}s\"</span>)\ncol3.<span\
      \ class=\"fn\">metric</span>(<span class=\"str\">\"Error Rate\", f\"{df['</span>error<span\
      \ class=\"str\">'].mean()*100:.1f}%\"</span>)\ncol4.<span class=\"fn\">metric</span>(<span\
      \ class=\"str\">\"Total Cost\", f\"${df['</span>cost<span class=\"str\">'].sum():.4f}\"\
      </span>)\n\n<span class=\"cm\"># Charts</span>\nst.<span class=\"fn\">subheader</span>(<span\
      \ class=\"str\">\"Latency Distribution\"</span>)\nfig = px.<span class=\"fn\"\
      >histogram</span>(df, x=<span class=\"str\">\"latency_s\", nbins=30, title=\"\
      Response Latency (seconds)\"</span>)\nst.<span class=\"fn\">plotly_chart</span>(fig,\
      \ use_container_width=<span class=\"kw\">True</span>)\n\nst.<span class=\"fn\"\
      >subheader</span>(<span class=\"str\">\"Runs Over Time\"</span>)\ndaily = df.<span\
      \ class=\"fn\">groupby</span>(<span class=\"str\">\"date\").size().reset_index(name=\"\
      runs\"</span>)\nfig2 = px.<span class=\"fn\">line</span>(daily, x=<span class=\"\
      str\">\"date\", y=\"runs\", title=\"Daily Run Count\"</span>)\nst.<span class=\"\
      fn\">plotly_chart</span>(fig2, use_container_width=<span class=\"kw\">True</span>)\n\
      \nst.<span class=\"fn\">subheader</span>(<span class=\"str\">\"Token Usage\"\
      </span>)\nfig3 = px.<span class=\"fn\">scatter</span>(df, x=<span class=\"str\"\
      >\"tokens_in\", y=\"tokens_out\", color=\"status\", title=\"Input vs Output\
      \ Tokens\"</span>)\nst.<span class=\"fn\">plotly_chart</span>(fig3, use_container_width=<span\
      \ class=\"kw\">True</span>)\n\n<span class=\"cm\"># Run streamlit run dashboard.py</span>\n\
      \n<span class=\"kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n\
      \    <span class=\"fn\">solve</span>()"
    solution_lang: python
  - title: Guardrails + Retry Pipeline
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n          Build a production-grade output validation system.\
      \ Given a customer support AI that should respond with structured JSON, implement\
      \ validation that: (1) checks JSON schema (title, response_body, escalate bool,\
      \ sentiment string), (2) detects and redacts PII (emails, phone numbers) in\
      \ the response, (3) auto-retries with a correction prompt if validation fails,\
      \ (4) after 3 failures raises an exception and logs to a file. Test with 20\
      \ adversarial inputs designed to fail validation.\n         </p>"
    done_when: Pipeline handles all 20 test cases without crashing. PII is redacted
      in responses. At least 3 test cases that initially fail validation succeed after
      the auto-retry correction.
    git_cmd: 'git add guardrails_retry_pipeline.py &amp;&amp; git commit -m "day109:
      guardrails-retry-pipeline"'
    sol_id: sol-w16d109t3
    solution_title: ✅ COMPLETE SOLUTION — guardrails_retry_pipeline.py
    solution_code: "<span class=\"cm\"># guardrails_retry_pipeline.py — Solution</span>\n\
      <span class=\"cm\"># Complete solution for: Guardrails + Retry Pipeline</span>\n\
      \n<span class=\"cm\"># Guardrails + Retry Pipeline for LLM Applications</span>\n\
      <span class=\"cm\"># pip install openai pydantic tenacity</span>\n\n<span class=\"\
      kw\">import</span> json\n<span class=\"kw\">import</span> re\n<span class=\"\
      kw\">from</span> openai <span class=\"kw\">import</span> OpenAI\n<span class=\"\
      kw\">from</span> pydantic <span class=\"kw\">import</span> BaseModel, field_validator\n\
      <span class=\"kw\">from</span> tenacity <span class=\"kw\">import</span> retry,\
      \ stop_after_attempt, wait_exponential\n\nclient = <span class=\"fn\">OpenAI</span>()\n\
      \n<span class=\"cm\"># 1. Define output schema with validation</span>\n<span\
      \ class=\"kw\">class</span> <span class=\"cls\">SafeResponse</span>(BaseModel):\n\
      \    answer: str\n    confidence: float\n    sources: list[str]\n    \n    @<span\
      \ class=\"fn\">field_validator</span>(<span class=\"str\">\"answer\"</span>)\n\
      \    @classmethod\n    <span class=\"kw\">def</span> <span class=\"fn\">check_no_pii</span>(cls,\
      \ v):\n        <span class=\"str\">\"\"\"Block responses containing PII patterns.\"\
      \"\"</span>\n        pii_patterns = [\n            r<span class=\"str\">\"\\\
      b\\d{3}-\\d{2}-\\d{4}\\b\"</span>,  <span class=\"cm\"># SSN</span>\n      \
      \      r<span class=\"str\">\"\\b\\d{16}\\b\"</span>,               <span class=\"\
      cm\"># Credit card</span>\n            r<span class=\"str\">\"\\b[A-Z]{2}\\\
      d{6,8}\\b\"</span>,      <span class=\"cm\"># Passport</span>\n        ]\n \
      \       <span class=\"kw\">for</span> pattern <span class=\"kw\">in</span> pii_patterns:\n\
      \            <span class=\"kw\">if</span> re.<span class=\"fn\">search</span>(pattern,\
      \ v):\n                <span class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(<span\
      \ class=\"str\">\"Response contains PII — blocked!\"</span>)\n        <span\
      \ class=\"kw\">return</span> v\n    \n    @<span class=\"fn\">field_validator</span>(<span\
      \ class=\"str\">\"confidence\"</span>)\n    @classmethod  \n    <span class=\"\
      kw\">def</span> <span class=\"fn\">check_confidence_range</span>(cls, v):\n\
      \        <span class=\"kw\">if</span> <span class=\"kw\">not</span> <span class=\"\
      num\">0</span> &lt;= v &lt;= <span class=\"num\">1</span>:\n            <span\
      \ class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(<span class=\"\
      str\">\"Confidence must be between 0 and 1\"</span>)\n        <span class=\"\
      kw\">return</span> v\n\n<span class=\"cm\"># 2. Retry-enabled LLM call with\
      \ structured output</span>\n@<span class=\"fn\">retry</span>(stop=<span class=\"\
      fn\">stop_after_attempt</span>(<span class=\"num\">3</span>), wait=<span class=\"\
      fn\">wait_exponential</span>(multiplier=<span class=\"num\">1</span>, min=<span\
      \ class=\"num\">2</span>, max=<span class=\"num\">10</span>))\n<span class=\"\
      kw\">def</span> <span class=\"fn\">safe_llm_call</span>(query: str) -&gt; SafeResponse:\n\
      \    <span class=\"str\">\"\"\"LLM call with automatic retries, structured output,\
      \ and guardrails.\"\"\"</span>\n    response = client.chat.completions.<span\
      \ class=\"fn\">create</span>(\n        model=<span class=\"str\">\"gpt-4o-mini\"\
      </span>,\n        messages=[\n            {<span class=\"str\">\"role\": \"\
      system\", \"content\": \"You are a helpful assistant. Always respond in JSON\
      \ with keys: answer, confidence (0-1), sources (list of URLs).\"</span>},\n\
      \            {<span class=\"str\">\"role\": \"user\", \"content\"</span>: query}\n\
      \        ],\n        response_format={<span class=\"str\">\"type\": \"json_object\"\
      </span>},\n        temperature=<span class=\"num\">0</span>,\n    )\n    \n\
      \    raw = json.<span class=\"fn\">loads</span>(response.choices[<span class=\"\
      num\">0</span>].message.content)\n    \n    <span class=\"cm\"># Validate with\
      \ Pydantic guardrails (raises on PII, bad confidence, etc.)</span>\n    validated\
      \ = <span class=\"fn\">SafeResponse</span>(**raw)\n    <span class=\"kw\">return</span>\
      \ validated\n\n<span class=\"cm\"># 3. Usage</span>\n<span class=\"kw\">try</span>:\n\
      \    result = <span class=\"fn\">safe_llm_call</span>(<span class=\"str\">\"\
      What is gradient descent?\"</span>)\n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Answer: {result.answer}\"</span>)\n    <span class=\"fn\"\
      >print</span>(<span class=\"str\">f\"Confidence: {result.confidence}\"</span>)\n\
      \    <span class=\"fn\">print</span>(<span class=\"str\">f\"Sources: {result.sources}\"\
      </span>)\n<span class=\"kw\">except</span> Exception <span class=\"kw\">as</span>\
      \ e:\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Pipeline failed\
      \ after retries: {e}\"</span>)\n\n<span class=\"kw\">if</span> __name__ == <span\
      \ class=\"str\">'__main__'</span>:\n    <span class=\"fn\">solve</span>()"
    solution_lang: python
  quizzes:
  - num_str: Q1 OF 5
    question: What does "LLM-as-judge" evaluation mean and what is its primary weakness?
    qid: q109_1
    options:
    - letter: A
      text: Using an LLM to generate test datasets only
      is_correct: false
    - letter: B
      text: 'Using a powerful LLM (e.g. GPT-4) to score another LLM''s outputs. Primary
        weakness: positional bias (it favours its own outputs), verbosity bias (longer
        answers score higher), and self-consistency issues'
      is_correct: true
    - letter: C
      text: Using LLMs only for safety classification
      is_correct: false
    - letter: D
      text: It's identical to human evaluation
      is_correct: false
    correct_fb: '✅ Correct. LLM-as-judge is scalable (evaluates thousands of outputs
      automatically) but has known biases: models favour their own outputs, favour
      longer responses, and can be inconsistent on the same input. Always calibrate
      with a human-annotated gold set and use multiple judges to reduce bias.'
    wrong_fb: '❌ LLM-as-judge uses a capable LLM (like GPT-4) to evaluate another
      model''s responses, usually with a prompt like "Rate this answer 1-5 for correctness
      given the ground truth." It''s scalable but has biases: prefers longer text,
      self-preference, and positional bias in pairwise comparisons.'
  - num_str: Q2 OF 5
    question: "In Guardrails AI, what is the difference between\n         \n     \
      \     on_fail=\"fix\"\n         \n         and\n         \n          on_fail=\"\
      reask\"\n         \n         ?"
    qid: q109_2
    options:
    - letter: A
      text: "fix\n          \n          programmatically corrects the output (e.g.,\
        \ truncating text, redacting PII) without another LLM call.\n          \n\
        \           reask\n          \n          sends the failed output back to the\
        \ LLM with a correction prompt, consuming another API call"
      is_correct: true
    - letter: B
      text: They are the same — both retry the LLM call
      is_correct: false
    - letter: C
      text: "fix\n          \n          raises an exception,\n          \n       \
        \    reask\n          \n          silently retries"
      is_correct: false
    - letter: D
      text: "reask\n          \n          only works with Pydantic models"
      is_correct: false
    correct_fb: "✅ Correct.\n         \n          fix\n         \n         is deterministic\
      \ and free (no LLM call) — truncate, redact, format.\n         \n          reask\n\
      \         \n         calls the LLM again with the original prompt + feedback\
      \ about what failed. Use\n         \n          fix\n         \n         for\
      \ structural issues (length, PII),\n         \n          reask\n         \n\
      \         for content issues that require the model to regenerate."
    wrong_fb: ❌ fix = deterministic code-based correction (cheap, instant). reask
      = send the failed output back to the LLM with an error message asking it to
      fix the specific issue (costs another API call). Use fix for PII/length; reask
      for content quality issues.
  - num_str: Q3 OF 5
    question: What is "prompt regression" and how does LangSmith help prevent it?
    qid: q109_3
    options:
    - letter: A
      text: When a prompt gets shorter over time due to token limits
      is_correct: false
    - letter: B
      text: When changing a prompt to fix one issue accidentally degrades performance
        on other inputs. LangSmith prevents it by running evals on every prompt version
        change against the same test dataset, showing before/after score comparison
      is_correct: true
    - letter: C
      text: When an LLM model is rolled back to an older version
      is_correct: false
    - letter: D
      text: When prompt costs increase over time
      is_correct: false
    correct_fb: ✅ Exactly. Prompt regression is like software regression — a change
      that fixes one case breaks three others. LangSmith's "Compare" feature runs
      your eval dataset on the old and new prompt version and shows a side-by-side
      score comparison, catching regressions before deployment.
    wrong_fb: ❌ Prompt regression = editing a prompt fixes test case A but breaks
      test cases B, C, D. LangSmith enables prompt versioning + evaluation runs, so
      you can compare eval scores between prompt versions and detect regressions before
      shipping the change.
  - num_str: Q4 OF 5
    question: 'Your RAG app is in production. Latency p95 is 3.2 seconds. LangSmith
      shows: retrieval=50ms, LLM=3100ms, parsing=50ms. Where should you optimize first?'
    qid: q109_4
    options:
    - letter: A
      text: Optimize the retrieval step — use HNSW instead of flat index
      is_correct: false
    - letter: B
      text: 'The LLM call dominates at 97% of total latency. Solutions: enable streaming
        (improves perceived latency), switch to a faster model (gpt-4o-mini is 3-5x
        faster than gpt-4), reduce max_tokens, or use response caching for repeated
        queries'
      is_correct: true
    - letter: C
      text: The parsing step — use a faster JSON library
      is_correct: false
    - letter: D
      text: Run retrieval and LLM in parallel
      is_correct: false
    correct_fb: '✅ Correct profiling. LLM = 3100/3200 = 97% of total latency. Optimising
      retrieval (50ms) would give ≤1.6% improvement. Focus on the bottleneck: enable
      streaming (users see first tokens in ~300ms), try gpt-4o-mini (much faster),
      cache common queries with Redis semantic cache.'
    wrong_fb: '❌ Always optimize the bottleneck. LLM is 3100ms out of 3200ms total
      (97%). Retrieval is 50ms (1.6%). Halving retrieval time saves 25ms. Halving
      LLM time saves 1550ms. Apply Amdahl''s Law: focus on what dominates. Enable
      streaming or switch models.'
  - num_str: Q5 OF 5
    question: Why is it important to include "negative test cases" in your LLM eval
      dataset?
    qid: q109_5
    options:
    - letter: A
      text: Negative cases reduce API costs during evaluation
      is_correct: false
    - letter: B
      text: Negative cases test that the model correctly refuses or says "I don't
        know" for out-of-scope or unanswerable questions — without them, a model that
        answers everything confidently (even incorrectly) looks perfect on eval
      is_correct: true
    - letter: C
      text: They balance the dataset for statistical significance
      is_correct: false
    - letter: D
      text: Negative cases are only relevant for classification models
      is_correct: false
    correct_fb: ✅ Perfect reasoning. A RAG system that always generates an answer
      (even when the information isn't in the retrieved context) has 0% abstention.
      Without negative cases, you never know the hallucination rate. Include questions
      whose answers are NOT in your corpus — the correct response is "I don't have
      enough information."
    wrong_fb: ❌ Negative cases (questions whose answers aren't in the corpus) test
      the model's abstention rate. A model that hallucinations answers when it should
      say "I don't know" is dangerous in production. Without negative cases, your
      eval looks perfect while your hallucination rate might be 50%.
  flashcards:
  - front: MLflow tracking?
    back: Observability server recording parameters, metrics, and models across runs.
  - front: How is Day 109 structured?
    back: It combines theory, hands-on coding tasks, and quizzes.
  - front: Where does Day 109 fit in Week 16?
    back: It is a key day in Week 16 (MLOps, Flask APIs, Docker, Gradio, Model Serving).
  - front: What is the difference between Cosine Similarity and Dot Product when comparing
      vector embeddings?
    back: Cosine similarity measures angle between vectors (normalized dot product);
      if embeddings are L2-normalized to unit length, Dot Product equals Cosine Similarity.
  gotcha:
    title: '⚠️ Gotcha: Distributed Data Parallel (DDP) Gradient Sync'
    description: Ensure all processes initialize identical random seeds and model
      weights before starting DDP training loops.
  takeaways:
    hinglish_line: "<strong>\n         Ek line mein:\n        </strong>\n        Docker\
