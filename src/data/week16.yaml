    \ pydantic <span class=\"kw\">import</span> BaseModel\n<span class=\"kw\">import</span>\
    \ json, asyncio\n\n<span class=\"cm\"># 1. Initialize high-performance asynchronous\
    \ API application</span>\napp = <span class=\"fn\">FastAPI</span>()\nclient =\
    \ <span class=\"fn\">AsyncOpenAI</span>()\n\n<span class=\"kw\">class</span> <span\
    \ class=\"cls\">ChatRequest</span>(BaseModel):\n    message: str\n    history:\
    \ list[dict] = []\n\n<span class=\"kw\">async</span> <span class=\"kw\">def</span>\
    \ <span class=\"fn\">stream_llm_tokens</span>(messages: list) -&gt; str:  <span\
    \ class=\"cm\"># async generator</span>\n    <span class=\"str\">\"\"\"Async generator\
    \ that yields SSE-formatted token chunks.\"\"\"</span>\n    <span class=\"kw\"\
    >async</span> <span class=\"kw\">with</span> <span class=\"kw\">await</span> client.chat.completions.<span\
    \ class=\"fn\">create</span>(\n        model=<span class=\"str\">\"gpt-4o-mini\"\
    </span>,\n        messages=messages,\n        stream=<span class=\"kw\">True</span>\n\
    \    ) <span class=\"kw\">as</span> stream:\n        <span class=\"kw\">async</span>\
    \ <span class=\"kw\">for</span> chunk <span class=\"kw\">in</span> stream:\n \
    \           delta = chunk.choices[<span class=\"str\">\"0\"</span>].delta.content\n\
    \            <span class=\"kw\">if</span> delta:\n                <span class=\"\
    cm\"># SSE format: \"data: {json}\\n\\n\"</span>\n                payload = json.<span\
    \ class=\"fn\">dumps</span>({<span class=\"str\">\"token\": delta, \"done\"</span>:\
    \ <span class=\"kw\">False</span>})\n                <span class=\"kw\">yield</span>\
    \ <span class=\"str\">f\"data: {payload}\\n\\n\"</span>\n        <span class=\"\
    cm\"># Signal stream completion</span>\n        <span class=\"kw\">yield</span>\
    \ <span class=\"str\">f'data: {json.dumps({\"token\": \"\", \"done\": True})}\\\
    n\\n'</span>\n\n<span class=\"cm\"># 2. Define prediction endpoint with Pydantic\
    \ schema validation</span>\n@app.<span class=\"fn\">post</span>(<span class=\"\
    str\">\"/chat/stream\"</span>)\n<span class=\"kw\">async</span> <span class=\"\
    kw\">def</span> <span class=\"fn\">chat_stream</span>(request: ChatRequest):\n\
    \    <span class=\"str\">\"\"\"Returns an SSE stream of LLM tokens.\"\"\"</span>\n\
    \    messages = request.history + [{<span class=\"str\">\"role\": \"user\", \"\
    content\"</span>: request.message}]\n    <span class=\"kw\">return</span> <span\
    \ class=\"fn\">StreamingResponse</span>(\n        <span class=\"fn\">stream_llm_tokens</span>(messages),\n\
    \        media_type=<span class=\"str\">\"text/event-stream\"</span>,\n      \
    \  headers={\n            <span class=\"str\">\"Cache-Control\":       \"no-cache\"\
    </span>,\n            <span class=\"str\">\"X-Accel-Buffering\":   \"no\"</span>,\
    \   <span class=\"cm\"># disable nginx buffering for SSE</span>\n            <span\
    \ class=\"str\">\"Connection\":          \"keep-alive\"</span>,\n        }\n \
    \   )</code></pre>\n</div>\n<h3 class=\"sh3\">\n       3. JavaScript Frontend\
    \ — EventSource API\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       The EventSource API on the frontend\
    \ receives streaming text chunks from SSE endpoints, updating the UI dynamically.\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         JAVASCRIPT — SSE CLIENT\n        </span>\n<div class=\"cb-btns\">\n\
