    bullets:
    - LangSmith tracing = 3 env vars. Add them to every LangChain project from day
      one — tracing is free and invaluable for debugging.
    - Evaluation = test dataset + automated scoring. Build this before deployment,
      run it on every change. Use LLM-as-judge but calibrate with human annotations.
    - "Guardrails: use\n         \n          fix\n         \n         for deterministic\
      \ corrections (PII, length),\n         \n          reask\n         \n      \
      \   for content regeneration. Don't over-guard — each reask = one extra API\
      \ call."
    - 'Always profile with LangSmith before optimizing: retrieval vs. LLM vs. parsing.
      The LLM call almost always dominates.'
    - "Include negative test cases — questions the model should\n         <em>\n \
      \         not\n         </em>\n         answer from context. This is the only\
      \ way to measure hallucination rate in production."
