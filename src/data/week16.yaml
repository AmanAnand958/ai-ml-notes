    time: 25 min
    prompt_html: |-
      <p><strong>
               Take your RAG system from week 15 (Day 105's hybrid search pipeline), add 3 LangSmith env vars, and make 10 different queries. In the LangSmith dashboard, identify: which query had the highest token count, which step took the longest latency, and which query had the most retrieval chunks.
