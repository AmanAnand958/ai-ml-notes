      <li>
                 50 examples covering a diverse range of your chosen task
                </li>
      <li>
                 Use GPT-4o-mini to help generate high-quality responses (seed 10 manually, generate 40 with the API)
                </li>
      <li>
                 Save as a Hugging Face Dataset and push to your Hub (private repo)
                </li>
      <li>
                 Print: min/max/avg response length, vocabulary overlap between instructions
                </li>
      </ul>
    done_when: When code executes without errors, passes all unit assertions, and prints verified output metrics for Create
      a Custom Instruction Dataset.
    git_cmd: 'git add . && git commit -m "feat(day108): implement create-a-custom-instruction-da"'
    sol_id: sol-w16d108t2
    solution_title: SOLUTION — Dataset Generation Pipeline
    solution_code: |
      import json, openai
      from datasets import Dataset
      from tqdm import tqdm

      client = openai.OpenAI()

      SEED_EXAMPLES = [
          {"instruction": "Convert this Python function to have full docstrings.",
           "input": "def add(a, b): return a + b",
           "output": 'def add(a: int, b: int) -> int:\n    """Add two integers.\n    ..."""\n    return a + b'},
      ]

      def generate_example(template_instruction: str) -> dict:
          """Use GPT to generate a new instruction-response pair."""
          prompt = f"""Generate a new Python documentation example similar to:\n"{template_instruction}"\n\nRespond ONLY as JSON with keys: instruction, input, output.\nMake it different and interesting."""
          resp = client.chat.completions.create(
              model="gpt-4o-mini", messages=[{"role": "user", "content": prompt}],
              temperature=0.9, max_tokens=600, response_format={"type": "json_object"}
          )
          return json.loads(resp.choices["0"].message.content)

      examples = list(SEED_EXAMPLES)
      for _ in tqdm(range(40)):
          try:
              examples.append(generate_example(SEED_EXAMPLES["0"]["instruction"]))
          except Exception as e:
              print(f"Error: {e}")

      ds = Dataset.from_list(examples)
      print(ds)

      # Statistics
      lengths = [len(x["\"output\""]) for x in examples]
      print(f"Responses — min: {min(lengths)}, max: {max(lengths)}, avg: {sum(lengths)/len(lengths):.0f} chars")

      # Push to Hub (requires: huggingface-cli login)
      # ds.push_to_hub("your-username/python-docstring-dataset", private=True)
      assert lengths is not None, "lengths should not be None"
    solution_lang: python
  - title: QLoRA Fine-Tune on Colab
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: |-
      <p><strong>
               Open Google Colab (free T4 GPU), fine-tune a small model (phi-2 or TinyLlama-1.1B) on your Day 2 dataset using QLoRA. Requirements:
              </strong></p>
      <ul class="prose-list">
      <li>
                Load in 4-bit with BitsAndBytesConfig (NF4)
               </li>
      <li>
                Apply LoRA with r=8, alpha=32 on q_proj and v_proj
               </li>
      <li>
                Train for 3 epochs with SFTTrainer
               </li>
      <li>
                Log training loss every 10 steps
               </li>
      <li>
                Compare base model vs fine-tuned model on 5 test prompts
               </li>
      <li>
                Save and merge the LoRA adapter
               </li>
      </ul>
    done_when: When training loss decreases visibly. Fine-tuned model produces better-formatted output on your task compared
      to the base model on at least 3 of 5 test prompts.
    git_cmd: 'git add qlora_fine_tune_on_colab.py &amp;&amp; git commit -m "feat(day): day108: qlora-fine-tune-on-colab"'
    sol_id: sol-w16d108t3
    solution_title: ✅ COMPLETE SOLUTION — qlora_fine_tune_on_colab.py
    solution_code: |
      # qlora_fine_tune_on_colab.py — Solution
      # Complete solution for: QLoRA Fine-Tune on Colab

      # QLoRA Fine-Tuning on Google Colab
      # Requires: pip install transformers peft bitsandbytes datasets trl accelerate

      import torch
      from transformers import AutoModelForCausalLM, AutoTokenizer, BitsAndBytesConfig
      from peft import LoraConfig, get_peft_model, prepare_model_for_kbit_training
      from datasets import load_dataset
      from trl import SFTTrainer, SFTConfig

      # 1. Load model in 4-bit quantization (QLoRA)
      bnb_config = BitsAndBytesConfig(
          load_in_4bit=True,
          bnb_4bit_quant_type="nf4",
          bnb_4bit_compute_dtype=torch.float16,
          bnb_4bit_use_double_quant=True,
      )

      model_name = "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
      model = AutoModelForCausalLM.from_pretrained(
          model_name, quantization_config=bnb_config, device_map="auto"
      )
      tokenizer = AutoTokenizer.from_pretrained(model_name)
      tokenizer.pad_token = tokenizer.eos_token

      # 2. Prepare for k-bit training
      model = prepare_model_for_kbit_training(model)

      # 3. Configure LoRA
      lora_config = LoraConfig(
          r=16,                    # Low rank
          lora_alpha=32,           # Scaling factor
          target_modules=["q_proj", "v_proj"],  # Which layers to adapt
          lora_dropout=0.05,
          bias="none",
          task_type="CAUSAL_LM",
      )
      model = get_peft_model(model, lora_config)
      model.print_trainable_parameters()  # Should show ~0.5% trainable

      # 4. Load dataset
      dataset = load_dataset("tatsu-lab/alpaca", split="train[:1000]")

      def format_instruction(example):
          if example.get("input"):
              return f"### Instruction:\n{example['instruction']}\n\n### Input:\n{example['input']}\n\n### Response:\n{example['output']}"
          return f"### Instruction:\n{example['instruction']}\n\n### Response:\n{example['output']}"

      # 5. Train with SFTTrainer
      training_args = SFTConfig(
          output_dir="./qlora-output",
          num_train_epochs=1,
          per_device_train_batch_size=4,
          gradient_accumulation_steps=4,
          learning_rate=2e-4,
          fp16=True,
          logging_steps=10,
          save_strategy="epoch",
          max_seq_length=512,
      )

      trainer = SFTTrainer(
          model=model,
          train_dataset=dataset,
          formatting_func=format_instruction,
          args=training_args,
          tokenizer=tokenizer,
      )

      trainer.train()

      # 6. Save LoRA adapter (small, ~16MB)
      model.save_pretrained("./qlora-adapter")
      tokenizer.save_pretrained("./qlora-adapter")
      print("LoRA adapter saved! Merge with base model for deployment.")

      if __name__ == '__main__':
          solve()
    solution_lang: python
  quizzes:
  - num_str: Question 1
    question: Why does LoRA set the A matrix (the right matrix) to random Gaussian initialization but the B matrix to zeros
      at the start of training?
    qid: q108_1
    options:
    - letter: A
      text: It saves GPU memory during initialization
      is_correct: false
      id: a
    - letter: B
      text: So that ΔW = BA = 0 at the start of training, meaning the fine-tuning starts from the exact same state as the
        pre-tra...
      is_correct: true
      id: b
    - letter: C
      text: B is always zero because it represents bias terms
      is_correct: false
      id: c
    - letter: D
      text: Random A + zero B ensures gradient flow is maximised
      is_correct: false
      id: d
    correct_fb: '✅ Correct! If both A and B were random, ΔW = BA would be non-zero at step 0, corrupting the pretrained features
      immediately. By zeroing B: BA = 0 at step 0, so the model starts training from its original pretrained state. As training
      progresses, B learns non-zero values.'
    wrong_fb: ❌ The initialization trick ensures ΔW = BA = 0 at step 0 (zero matrix × anything = zero). This means training
      starts from the exact pretrained state. Only after the first gradient update does B become non-zero, gradually introducing
      the task-specific adaptation.
    correct: b
    explanation: ''
  - num_str: Question 2
    question: What is the key difference between NF4 (NormalFloat4) quantisation and standard INT4 quantisation?
    qid: q108_2
    options:
    - letter: A
      text: NF4 uses 4 bits per weight while INT4 uses 8 bits
      is_correct: false
      id: a
    - letter: B
      text: NF4 is information-theoretically optimal for normally-distributed weights — its quantisation levels are spaced
        to min...
      is_correct: true
      id: b
    - letter: C
      text: INT4 is for integers only; NF4 is for floating-point
      is_correct: false
      id: c
    - letter: D
      text: NF4 is faster because it uses unsigned integers
      is_correct: false
      id: d
    correct_fb: ✅ Exactly. INT4 has evenly-spaced quantisation levels (like a ruler with equal tick marks). NF4 has more levels
      near 0 where most weights cluster (due to Gaussian distribution) and fewer levels in the tails. This minimises the reconstruction
      error for neural network weights specifically.
    wrong_fb: ❌ Both use 4 bits. The difference is WHERE those 4 bits place their quantisation levels. NF4 is designed specifically
      for Gaussian-distributed weights (which neural networks have), placing more precision near 0 where most weights are
      clustered.
    correct: b
    explanation: ''
  - num_str: Question 3
    question: Your LoRA fine-tuned model performs well on training data but poorly on new inputs. What should you try first?
    qid: q108_3
    options:
    - letter: A
      text: Increase the rank r to capture more complex patterns
      is_correct: false
      id: a
    - letter: B
      text: 'The model is overfitting — try: increasing lora_dropout, reducing r, adding more training data (diversity, not
        just q...'
      is_correct: true
      id: b
    - letter: C
      text: Switch from LoRA to full fine-tuning
      is_correct: false
      id: c
    - letter: D
      text: Increase learning rate for faster convergence
      is_correct: false
      id: d
    correct_fb: '✅ Good diagnosis. Classic overfitting — high training performance, low generalisation. Solutions in order:
      (1) more diverse data, (2) add dropout (lora_dropout=0.1), (3) reduce rank r, (4) train fewer epochs (use early stopping
      with validation loss). Increasing r or LR would make it worse.'
    wrong_fb: '❌ Training well + test poorly = overfitting. For LoRA, fixes are: increase lora_dropout, reduce rank r (fewer
      parameters = less overfitting), add more diverse training data, or reduce training epochs. Increasing r would increase
      capacity and make overfitting worse.'
    correct: b
    explanation: ''
  - num_str: Question 4
    question: "After training, you call\n        \n         merge_and_unload()\n        \n        on your PEFT model. What\
      \ does this produce and what are the tradeoffs?"
    qid: q108_4
    options:
    - letter: A
      text: It deletes the LoRA adapters to free memory
      is_correct: false
      id: a
    - letter: B
      text: 'It bakes W'' = W + BA into the base weights and returns a standard model — Pro: no adapter overhead at inference,
        load...'
      is_correct: true
      id: b
    - letter: C
      text: It quantises the merged model to 4 bits automatically
      is_correct: false
      id: c
    - letter: D
      text: It exports the model to ONNX format
      is_correct: false
      id: d
    correct_fb: ✅ Correct. merge_and_unload() computes W_new = W_base + B×A for every LoRA layer, fusing the adapters into
      the base weights. The result is a standard HuggingFace model with no PEFT overhead — perfect for deployment. But you
      lose the ability to swap adapters dynamically.
    wrong_fb: '❌ merge_and_unload() adds the LoRA update (BA) directly into the base weights permanently: W'' = W + BA. The
      resulting model has no adapter overhead and works like any normal transformers model. Tradeoff: can''t switch adapters
      anymore without reloading.'
    correct: b
    explanation: ''
  - num_str: Question 5
    question: You want to fine-tune a model to always respond in a specific JSON schema. Should you use LoRA fine-tuning or
      Structured Outputs (OpenAI API feature)?
    qid: q108_5
    options:
    - letter: A
      text: Always LoRA — it's more reliable
      is_correct: false
      id: a
    - letter: B
      text: Use Structured Outputs first — it's instant, zero training cost, schema-enforced at the token level. Only fine-tune
        i...
      is_correct: true
      id: b
    - letter: C
      text: They are equivalent — choose based on personal preference
      is_correct: false
      id: c
    - letter: D
      text: Structured Outputs are only available for classification tasks
      is_correct: false
      id: d
    correct_fb: ✅ Exactly right. For format control (JSON schema), Structured Outputs (OpenAI API) or Pydantic output parsers
      (LangChain) solve the problem perfectly with zero training cost. Fine-tuning is overkill for pure format constraints.
      Fine-tune only when the task requires knowledge or style that.
    wrong_fb: ❌ For JSON format enforcement, Structured Outputs are the right tool — no training needed, enforced at the grammar/token
      level, works instantly. Save fine-tuning for problems that require changing what the model knows or how it reasons,
      not just how it formats output.
    correct: b
    explanation: ''
