  analogy: 'FastAPI + Docker ko samjho jaise ek dabba mein poora restaurant band karna:
    FastAPI hai chef + menu (logic + API), Pydantic hai order form validation (no
    wrong orders), Docker hai sealed tiffin box (works same everywhere), docker-compose
    hai full dabbawala system (multiple boxes, right order, right destination).'
  theory_html: "<h3 class=\"sh3\">\n       1. FastAPI vs Flask for AI Apps\n     \
    \ </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0;\
    \ width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Feature\n\
    \        </th>\n<th>\n         Flask\n        </th>\n<th>\n         FastAPI\n\
    \        </th>\n</tr>\n<tr>\n<td>\n         Async support\n        </td>\n<td>\n\
    \         Requires Quart (separate lib)\n        </td>\n<td>\n         Native\
    \ async/await — critical for concurrent LLM calls\n        </td>\n</tr>\n<tr>\n\
    <td>\n         Input validation\n        </td>\n<td>\n         Manual\n      \
    \  </td>\n<td>\n         Automatic via Pydantic models\n        </td>\n</tr>\n\
    <tr>\n<td>\n         API docs\n        </td>\n<td>\n         Manual (Flask-Swagger)\n\
    \        </td>\n<td>\n         Auto-generated OpenAPI at /docs\n        </td>\n\
    </tr>\n<tr>\n<td>\n         Type safety\n        </td>\n<td>\n         None\n\
    \        </td>\n<td>\n         Full Python type hints throughout\n        </td>\n\
    </tr>\n<tr>\n<td>\n         Performance\n        </td>\n<td>\n         ~4K req/s\
    \ (sync)\n        </td>\n<td>\n         ~10K+ req/s (async)\n        </td>\n</tr>\n\
    </table></div>\n<h3 class=\"sh3\">\n       2. Async FastAPI with Dependency Injection\n\
    \      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       Asynchronous FastAPI endpoints handle concurrent\
    \ requests efficiently, while dependency injection handles connections and authorization\
    \ pools.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">gitignore</span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><code><span class=\"cm\"># pip install\
    \ fastapi uvicorn[\"standard\"] pydantic openai chromadb sentence-transformers</span>\n\
    <span class=\"kw\">from</span> fastapi <span class=\"kw\">import</span> FastAPI,\
    \ Depends, HTTPException, Security\n<span class=\"kw\">from</span> fastapi.security\
    \ <span class=\"kw\">import</span> APIKeyHeader\n<span class=\"kw\">from</span>\
    \ fastapi.middleware.cors <span class=\"kw\">import</span> CORSMiddleware\n<span\
    \ class=\"kw\">from</span> pydantic <span class=\"kw\">import</span> BaseModel,\
    \ Field\n<span class=\"kw\">from</span> contextlib <span class=\"kw\">import</span>\
    \ asynccontextmanager\n<span class=\"kw\">from</span> openai <span class=\"kw\"\
    >import</span> AsyncOpenAI\n<span class=\"kw\">import</span> chromadb, os, time,\
    \ logging\n\n<span class=\"cm\"># --- Lifespan: startup/shutdown ---</span>\n\
    @asynccontextmanager\n<span class=\"kw\">async</span> <span class=\"kw\">def</span>\
    \ <span class=\"fn\">lifespan</span>(app: FastAPI):\n    <span class=\"cm\">#\
    \ Startup: initialise shared resources once</span>\n    app.state.openai   = <span\
    \ class=\"fn\">AsyncOpenAI</span>()\n    app.state.chromadb = chromadb.<span class=\"\
    fn\">PersistentClient</span>(path=<span class=\"str\">\"./chroma_data\"</span>)\n\
    \    app.state.collection = app.state.chromadb.<span class=\"fn\">get_or_create_collection</span>(<span\
    \ class=\"str\">\"documents\"</span>)\n    logging.<span class=\"fn\">info</span>(<span\
    \ class=\"str\">\"✅ Resources initialised\"</span>)\n    <span class=\"kw\">yield</span>\n\
    \    <span class=\"cm\"># Shutdown: clean up</span>\n    logging.<span class=\"\
    fn\">info</span>(<span class=\"str\">\"\U0001F6D1 Shutting down\"</span>)\n\n\
    <span class=\"cm\"># 1. Initialize high-performance asynchronous API application</span>\n\
    app = <span class=\"fn\">FastAPI</span>(title=<span class=\"str\">\"RAG API\"\
    , version=\"1.0\"</span>, lifespan=lifespan)\n\n<span class=\"cm\"># --- CORS\
    \ ---</span>\napp.<span class=\"fn\">add_middleware</span>(CORSMiddleware,\n \
    \   allow_origins=[<span class=\"str\">\"http://localhost:3000\"</span>],  <span\
    \ class=\"cm\"># in prod, list exact origins</span>\n    allow_methods=[<span\
    \ class=\"str\">\"GET\", \"POST\"</span>],\n    allow_headers=[<span class=\"\
    str\">\"*\"</span>])\n\n<span class=\"cm\"># --- API Key Authentication ---</span>\n\
    api_key_header = <span class=\"fn\">APIKeyHeader</span>(name=<span class=\"str\"\
    >\"X-API-Key\"</span>)\nVALID_KEYS = {os.environ.<span class=\"fn\">get</span>(<span\
    \ class=\"str\">\"API_KEY\", \"dev-key-123\"</span>)}\n\n<span class=\"kw\">async</span>\
    \ <span class=\"kw\">def</span> <span class=\"fn\">verify_api_key</span>(key:\
    \ str = <span class=\"fn\">Security</span>(api_key_header)):\n    <span class=\"\
    kw\">if</span> key <span class=\"kw\">not</span> <span class=\"kw\">in</span>\
    \ VALID_KEYS:\n        <span class=\"kw\">raise</span> <span class=\"fn\">HTTPException</span>(status_code=<span\
    \ class=\"num\">403</span>, detail=<span class=\"str\">\"Invalid API key\"</span>)\n\
    \    <span class=\"kw\">return</span> key\n\n<span class=\"cm\"># --- Request\
    \ / Response Models ---</span>\n<span class=\"kw\">class</span> <span class=\"\
    cls\">QueryRequest</span>(BaseModel):\n    question: str          = <span class=\"\
    fn\">Field</span>(min_length=<span class=\"num\">3</span>, max_length=<span class=\"\
    num\">1000</span>)\n    top_k:    int           = <span class=\"fn\">Field</span>(default=<span\
    \ class=\"num\">3</span>, ge=<span class=\"num\">1</span>, le=<span class=\"num\"\
    >10</span>)\n    model:    str           = <span class=\"fn\">Field</span>(default=<span\
    \ class=\"str\">\"gpt-4o-mini\"</span>)\n\n<span class=\"kw\">class</span> <span\
    \ class=\"cls\">QueryResponse</span>(BaseModel):\n    answer:     str\n    sources:\
    \    list[str]\n    latency_ms: float\n    tokens_used: int\n\n<span class=\"\
    cm\"># --- Endpoints ---</span>\n<span class=\"cm\"># 2. Define prediction endpoint\
    \ with Pydantic schema validation</span>\n@app.<span class=\"fn\">post</span>(<span\
    \ class=\"str\">\"/query\"</span>, response_model=QueryResponse, dependencies=[<span\
    \ class=\"fn\">Depends</span>(verify_api_key)])\n<span class=\"kw\">async</span>\
    \ <span class=\"kw\">def</span> <span class=\"fn\">query_documents</span>(request:\
    \ QueryRequest):\n    <span class=\"str\">\"\"\"Answer a question using RAG over\
    \ stored documents.\"\"\"</span>\n    t0 = time.<span class=\"fn\">time</span>()\n\
    \    collection = app.state.collection\n\n    <span class=\"cm\"># Retrieve</span>\n\
    \    results = collection.<span class=\"fn\">query</span>(query_texts=[request.question],\
    \ n_results=request.top_k)\n    context = <span class=\"str\">\"\\n\\n\".join(results[\"\
    \\\"documents\\\"\"</span>][<span class=\"num\">0</span>])\n    sources = [m.<span\
    \ class=\"fn\">get</span>(<span class=\"str\">\"source\", \"unknown\") for m in\
    \ results[\"\\\"metadatas\\\"\"</span>][<span class=\"num\">0</span>]]\n\n   \
    \ <span class=\"cm\"># Generate</span>\n    completion = <span class=\"kw\">await</span>\
    \ app.state.openai.chat.completions.<span class=\"fn\">create</span>(\n      \
    \  model=request.model,\n        messages=[\n            {<span class=\"str\"\
    >\"role\": \"system\", \"content\": \"Answer using ONLY the context. If not found,\
    \ say '</span>I don<span class=\"str\">'t know'</span>.\"},\n            {<span\
    \ class=\"str\">\"role\": \"user\",   \"content\": f\"Context:\\n{context}\\n\\\
    nQuestion: {request.question}\"</span>}\n        ],\n        temperature=<span\
    \ class=\"num\">0</span>, max_tokens=<span class=\"num\">500</span>\n    )\n \
    \   answer = completion.choices[<span class=\"str\">\"0\"</span>].message.content\n\
    \    <span class=\"kw\">return</span> <span class=\"fn\">QueryResponse</span>(\n\
    \        answer=answer, sources=sources,\n        latency_ms=(time.<span class=\"\
    fn\">time</span>()-t0)*<span class=\"num\">1000</span>,\n        tokens_used=completion.usage.total_tokens\n\
    \    )\n\n@app.<span class=\"fn\">get</span>(<span class=\"str\">\"/health\"</span>)\n\
    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\"\
    >health</span>(): <span class=\"kw\">return</span> {<span class=\"str\">\"status\"\
    : \"ok\", \"version\": \"1.0\"</span>}</code></pre>\n</div>\n<h3 class=\"sh3\"\
    >\n       3. Multi-Stage Dockerfile\n      </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       Multi-stage\
    \ Docker builds separate build environments from slim runtime environments, shrinking\
    \ final container sizes by up to 80%.\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         DOCKERFILE — MULTI-STAGE BUILD\
    \ FOR AI APP\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><code><span class=\"cm\"># Stage 1:\
    \ Build dependencies (separate for caching)</span>\nFROM python:<span class=\"\
    num\">3.11</span>-slim <span class=\"kw\">as</span> builder\n\nWORKDIR /build\n\
    <span class=\"cm\"># Copy only requirements first (better layer caching)</span>\n\
    COPY requirements.txt .\nRUN pip install --no-cache-dir --user -r requirements.txt\n\
    \n<span class=\"cm\"># Stage 2: Final image (smaller — no build tools)</span>\n\
    FROM python:<span class=\"num\">3.11</span>-slim\n\nWORKDIR /app\n\n<span class=\"\
    cm\"># Copy installed packages from builder</span>\nCOPY --<span class=\"kw\"\
    >from</span>=builder /root/.local /root/.local\n<span class=\"cm\"># Copy application\
    \ code</span>\nCOPY . .\n\n<span class=\"cm\"># Non-root user for security</span>\n\
    RUN adduser --disabled-password --gecos <span class=\"str\">\"\"</span> appuser\n\
    USER appuser\n\n<span class=\"cm\"># Environment</span>\nENV PYTHONPATH=/app \\\
    \n    PYTHONDONTWRITEBYTECODE=<span class=\"num\">1</span> \\\n    PYTHONUNBUFFERED=<span\
    \ class=\"num\">1</span>\n\nEXPOSE <span class=\"num\">8000</span>\n\n<span class=\"\
    cm\"># Healthcheck so Docker knows when app is ready</span>\nHEALTHCHECK --interval=30s\
    \ --timeout=3s --start-period=5s \\\n    CMD python -c <span class=\"str\">\"\
    import httpx; httpx.get('</span>http://localhost:<span class=\"num\">8000</span>/health<span\
    \ class=\"str\">').raise_for_status()\"</span>\n\nCMD [<span class=\"str\">\"\
    uvicorn\", \"main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\", \"--workers\"\
    , \"2\"</span>]</code></pre>\n</div>\n<h3 class=\"sh3\">\n       4. Docker Compose\
    \ with Dependencies\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       Docker Compose coordinates multi-container\
    \ stacks, managing dependency boot order (like database launching before application\
    \ startup).\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         YAML — DOCKER COMPOSE FOR RAG STACK\n        </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><code><span class=\"cm\"># docker-compose.yml</span>\nversion: <span class=\"\
    str\">\"3.9\"</span>\n\nservices:\n  api:\n    build: .\n    ports: [<span class=\"\
    str\">\"8000:8000\"</span>]\n    environment:\n      - OPENAI_API_KEY=${OPENAI_API_KEY}\n\
    \      - API_KEY=${API_KEY}\n      - REDIS_URL=redis://redis:<span class=\"num\"\
    >6379</span>\n      - CHROMA_HOST=chromadb\n    volumes:\n      - chroma_data:/app/chroma_data\n\
    \    depends_on:\n      redis:\n        condition: service_healthy\n    restart:\
    \ unless-stopped\n\n  redis:\n    image: redis:<span class=\"num\">7</span>-alpine\n\
    \    ports: [<span class=\"str\">\"6379:6379\"</span>]\n    healthcheck:\n   \
    \   test: [<span class=\"str\">\"CMD\", \"redis-cli\", \"ping\"</span>]\n    \
    \  interval: 5s\n      timeout: 3s\n      retries: <span class=\"num\">5</span>\n\
    \    restart: unless-stopped\n\n  nginx:\n    image: nginx:alpine\n    ports:\
    \ [<span class=\"str\">\"80:80\", \"443:443\"</span>]\n    volumes:\n      - ./nginx.conf:/etc/nginx/nginx.conf:ro\n\
    \      - ./certs:/etc/nginx/certs:ro\n    depends_on: [api]\n    restart: unless-stopped\n\
    \nvolumes:\n  chroma_data:</code></pre>\n</div>\n\n<!-- /theory -->\n<h2 class=\"\
    sh2\">\n       ⚡ Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size:\
    \ 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\">\n       \U0001F50D\
    \n       <strong>\n        Search terms:\n       </strong>\n\n        docker cmd\
    \ vs entrypoint foreground process, container exits instantly exit code 0\n  \
    \     \n</div>\n<div class=\"resource-section\" style=\"margin-top:1.5rem;\">\n\
    <h3> style=\"font-size:14px; font-weight:700; color:var(--text); margin-bottom:10px;\"\
    >\n        \U0001F4DA Recommended Resources\n       </h3>\n</div>\n<!-- ═══════════\
    \ DAY 113 ═══════════ -->\n<!-- /day-112 -->"
  predict:
    question: What is the computed throughput (requests per second) for 100 requests
      served in 2.0 seconds?
    answer: '50'
    explanation: Throughput = total_requests / total_seconds = 100 / 2.0 = 50 req/sec.
    code: 'reqs = 100

      sec = 2.0

      rps = int(reqs / sec)

      print(rps)'
  tasks:
  - title: FastAPI "Hello RAG" App
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p><strong>\n         Build a minimal FastAPI app with: (1) a POST\
      \ /query endpoint that takes {\"question\": \"...\"} and returns a mock {\"\
      answer\": \"...\"}, (2) a GET /health endpoint, (3) API key auth via X-API-Key\
      \ header, (4) automatic /docs page with OpenAPI. Test with curl and the built-in\
      \ Swagger UI. Then run it with\n         \n          uvicorn main:app --reload\n\
      \         \n         .\n        </strong></p>"
    done_when: When pOST /query returns a 200 response. GET /query with wrong API
      key returns 403. /docs page shows interactive Swagger UI. You can test endpoints
      directly in the browser.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day112: complete day
      112 tasks and coding exercises"'
    sol_id: sol-w16d112t1
    solution_title: ✅ COMPLETE SOLUTION — fastapi_hello_rag_app.py
    solution_code: "# fastapi_hello_rag_app.py — Solution\n# Complete solution for:\
      \ FastAPI \"Hello RAG\" App\n\n# Multi-Agent Pattern: Research + Writer + Reviewer\n\
      # pip install langgraph langchain-openai\n\nfrom langgraph.graph import StateGraph,\
      \ END\nfrom langchain_openai import ChatOpenAI\nfrom typing import TypedDict,\
      \ Annotated\nimport operator\n\n# 1. Define shared state\nclass AgentState(TypedDict):\n\
      \    topic: str\n    research: Annotated[list[str], operator.add]\n    draft:\
      \ str\n    review: str\n    final: str\n\nllm = ChatOpenAI(model=\"gpt-4o-mini\"\
      , temperature=0.3)\n\n# 2. Define agent nodes\ndef researcher(state: AgentState)\
      \ -> AgentState:\n    \"\"\"Research agent: gathers key facts about the topic.\"\
      \"\"\n    response = llm.invoke(\n        f\"You are a research assistant. List\
      \ 5 key facts about: {state['topic']}. \"\n        f\"Be concise and factual.\"\
      \n    )\n    return {\"research\": [response.content]}\n\ndef writer(state:\
      \ AgentState) -> AgentState:\n    \"\"\"Writer agent: creates a draft from research.\"\
      \"\"\n    research = \"\\n\".join(state[\"research\"])\n    response = llm.invoke(\n\
      \        f\"You are a technical writer. Write a clear 200-word summary based\
      \ on this research:\\n{research}\"\n    )\n    return {\"draft\": response.content}\n\
      \ndef reviewer(state: AgentState) -> AgentState:\n    \"\"\"Reviewer agent:\
      \ critiques the draft.\"\"\"\n    response = llm.invoke(\n        f\"You are\
      \ a critical reviewer. Review this draft for accuracy and clarity. \"\n    \
      \    f\"List specific improvements:\\n{state['draft']}\"\n    )\n    return\
      \ {\"review\": response.content}\n\ndef finalizer(state: AgentState) -> AgentState:\n\
      \    \"\"\"Finalizer: incorporates review feedback.\"\"\"\n    response = llm.invoke(\n\
      \        f\"Revise this draft based on the review feedback.\\n\\n\"\n      \
      \  f\"Draft:\\n{state['draft']}\\n\\nFeedback:\\n{state['review']}\"\n    )\n\
      \    return {\"final\": response.content}\n\n# 3. Build the graph\nworkflow\
      \ = StateGraph(AgentState)\nworkflow.add_node(\"researcher\", researcher)\n\
      workflow.add_node(\"writer\", writer)\nworkflow.add_node(\"reviewer\", reviewer)\n\
      workflow.add_node(\"finalizer\", finalizer)\n\nworkflow.set_entry_point(\"researcher\"\
      )\nworkflow.add_edge(\"researcher\", \"writer\")\nworkflow.add_edge(\"writer\"\
      , \"reviewer\")\nworkflow.add_edge(\"reviewer\", \"finalizer\")\nworkflow.add_edge(\"\
      finalizer\", END)\n\napp = workflow.compile()\n\n# 4. Run\nresult = app.invoke({\"\
      topic\": \"How LoRA fine-tuning works\", \"research\": []})\nprint(\"=== Final\
      \ Article ===\")\nprint(result[\"final\"])\n\nif __name__ == '__main__':\n \
      \   solve()"
    solution_lang: python
    time_minutes: 30
