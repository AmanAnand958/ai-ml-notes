    \     </button>\n</div>\n</div>\n<pre><code><span class=\"kw\">from</span> fastapi\
    \ <span class=\"kw\">import</span> WebSocket, WebSocketDisconnect\n\n@app.<span\
    \ class=\"fn\">websocket</span>(<span class=\"str\">\"/ws/chat\"</span>)\n<span\
    \ class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">ws_chat</span>(websocket:\
    \ WebSocket):\n    <span class=\"str\">\"\"\"WebSocket endpoint: receive user\
    \ messages, stream AI responses.\"\"\"</span>\n    <span class=\"kw\">await</span>\
    \ websocket.<span class=\"fn\">accept</span>()\n    history = []\n    <span class=\"\
    kw\">try</span>:\n        <span class=\"kw\">while</span> <span class=\"kw\">True</span>:\n\
    \            <span class=\"cm\"># Receive text message from client</span>\n  \
    \          user_msg = <span class=\"kw\">await</span> websocket.<span class=\"\
    fn\">receive_text</span>()\n            history.<span class=\"fn\">append</span>({<span\
    \ class=\"str\">\"role\": \"user\", \"content\"</span>: user_msg})\n\n       \
    \     <span class=\"cm\"># Send typing indicator</span>\n            <span class=\"\
    kw\">await</span> websocket.<span class=\"fn\">send_json</span>({<span class=\"\
    str\">\"type\": \"typing\", \"content\": \"\"</span>})\n\n            <span class=\"\
    cm\"># Stream LLM tokens back to client</span>\n            full_response = <span\
    \ class=\"str\">\"\"</span>\n            <span class=\"kw\">async</span> <span\
    \ class=\"kw\">with</span> <span class=\"kw\">await</span> client.chat.completions.<span\
    \ class=\"fn\">create</span>(\n                model=<span class=\"str\">\"gpt-4o-mini\"\
