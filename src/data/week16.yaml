    kw\">import</span> AsyncOpenAI\n<span class=\"kw\">import</span> chromadb, os, time, logging\n\n<span class=\"cm\"># ---\
    \ Lifespan: startup/shutdown ---</span>\n@asynccontextmanager\n<span class=\"kw\">async</span> <span class=\"kw\">def</span>\
    \ <span class=\"fn\">lifespan</span>(app: FastAPI):\n    <span class=\"cm\"># Startup: initialise shared resources once</span>\n\
