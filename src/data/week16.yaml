  tasks:
  - title: Draw 4 Multi-Agent Patterns
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n         Using Mermaid diagrams (or paper), draw the 4 architecture\
      \ patterns (Network, Supervisor, Hierarchical, Sequential). For each, describe\
      \ a real-world AI use case it fits best. Then for the following task — \"User\
      \ uploads a PDF, system extracts tables, converts to CSV, writes analysis report,\
      \ sends email\" — identify which pattern fits best and justify why.\n      \
      \  </p>"
    done_when: 4 diagrams drawn. You can explain why the given PDF task fits the sequential
      pipeline pattern (deterministic, no backtracking needed).
    git_cmd: 'git add . &amp;&amp; git commit -m "day110: complete day 110 tasks and
      coding exercises"'
    sol_id: sol-w16d110t1
    solution_title: ✅ COMPLETE SOLUTION — draw_4_multi_agent_patterns.py
    solution_code: "<span class=\"cm\"># draw_4_multi_agent_patterns.py — Solution</span>\n\
      <span class=\"cm\"># Complete solution for: Draw 4 Multi-Agent Patterns</span>\n\
      \n<span class=\"cm\"># Add LangSmith Tracing to any LangChain/OpenAI application</span>\n\
      <span class=\"cm\"># pip install langsmith langchain langchain-openai</span>\n\
      \n<span class=\"kw\">import</span> os\nos.environ[<span class=\"str\">\"LANGCHAIN_TRACING_V2\"\
      ] = \"true\"</span>\nos.environ[<span class=\"str\">\"LANGCHAIN_API_KEY\"] =\
      \ \"your-langsmith-api-key\"</span>\nos.environ[<span class=\"str\">\"LANGCHAIN_PROJECT\"\
      ] = \"rag-tracing-demo\"</span>\n\n<span class=\"kw\">from</span> langchain_openai\
      \ <span class=\"kw\">import</span> ChatOpenAI\n<span class=\"kw\">from</span>\
      \ langchain_core.prompts <span class=\"kw\">import</span> ChatPromptTemplate\n\
      <span class=\"kw\">from</span> langsmith <span class=\"kw\">import</span> traceable\n\
      \n<span class=\"cm\"># Method 1: Automatic tracing with LangChain</span>\nllm\
      \ = <span class=\"fn\">ChatOpenAI</span>(model=<span class=\"str\">\"gpt-4o-mini\"\
      </span>, temperature=<span class=\"num\">0</span>)\nprompt = ChatPromptTemplate.<span\
      \ class=\"fn\">from_messages</span>([\n    (<span class=\"str\">\"system\",\
      \ \"You are a helpful AI tutor for ML concepts.\"</span>),\n    (<span class=\"\
      str\">\"user\", \"{question}\"</span>)\n])\nchain = prompt | llm\n\n<span class=\"\
      cm\"># Every invocation is automatically traced in LangSmith</span>\nresponse\
      \ = chain.<span class=\"fn\">invoke</span>({<span class=\"str\">\"question\"\
      : \"Explain LoRA in simple terms\"</span>})\n<span class=\"fn\">print</span>(response.content)\n\
      \n<span class=\"cm\"># Method 2: Custom function tracing with @traceable</span>\n\
      @<span class=\"fn\">traceable</span>(name=<span class=\"str\">\"custom_rag_pipeline\"\
      </span>)\n<span class=\"kw\">def</span> <span class=\"fn\">rag_pipeline</span>(query:\
      \ str) -&gt; str:\n    <span class=\"str\">\"\"\"Traced RAG pipeline — every\
      \ step visible in LangSmith.\"\"\"</span>\n    <span class=\"cm\"># Step 1:\
      \ Retrieve (would use vector DB in production)</span>\n    retrieved_docs =\
      \ <span class=\"fn\">retrieve_docs</span>(query)\n    \n    <span class=\"cm\"\
      ># Step 2: Generate</span>\n    context = <span class=\"str\">\"\\n\"</span>.<span\
      \ class=\"fn\">join</span>(retrieved_docs)\n    response = chain.<span class=\"\
      fn\">invoke</span>({\n        <span class=\"str\">\"question\": f\"Context:\
      \ {context}\\n\\nQuestion: {query}\"</span>\n    })\n    <span class=\"kw\"\
      >return</span> response.content\n\n@<span class=\"fn\">traceable</span>(name=<span\
      \ class=\"str\">\"retrieve_docs\"</span>)\n<span class=\"kw\">def</span> <span\
      \ class=\"fn\">retrieve_docs</span>(query: str) -&gt; list:\n    <span class=\"\
      str\">\"\"\"Simulated retrieval — replace with actual vector DB.\"\"\"</span>\n\
      \    <span class=\"kw\">return</span> [\n        <span class=\"str\">\"LoRA\
      \ adds low-rank matrices to frozen weights.\"</span>,\n        <span class=\"\
      str\">\"Rank r=16 is a common default for LoRA.\"</span>\n    ]\n\nresult =\
      \ <span class=\"fn\">rag_pipeline</span>(<span class=\"str\">\"What rank should\
      \ I use for LoRA?\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
      str\">f\"Answer: {result}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
      str\">\"Check LangSmith dashboard for full trace!\"</span>)\n\n<span class=\"\
      kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n    <span\
      \ class=\"fn\">solve</span>()"
    solution_lang: gitignore
  - title: LangGraph Research Agent with Human Approval
    badge: MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n          Build a LangGraph agent that: (1) takes a research\
      \ question, (2) decides whether to use web search or answer from training data,\
      \ (3) if web search is chosen, pauses for human approval before calling it,\
      \ (4) generates a structured report with: summary, key_points (list), sources\
      \ (list). Use MemorySaver for checkpointing so the conversation can be resumed.\n\
      \         </p>"
    done_when: Code executes without errors, passes all unit assertions, and prints
      verified output metrics for LangGraph Research Agent with Human Approval.
    git_cmd: ''
    sol_id: sol-w16d110t2
    solution_title: SOLUTION — Research Agent Graph Structure
    solution_code: "<span class=\"cm\"># Graph structure:</span>\n<span class=\"cm\"\
      ># START → classify_query → {needs_search: web_search, no_search: generate_report}\
      \ → END</span>\n<span class=\"cm\"># With interrupt_before=[\"web_search\"]\
      \ for human approval</span>\n\n<span class=\"kw\">class</span> <span class=\"\
      cls\">ResearchState</span>(TypedDict):\n    question:      str\n    needs_search:\
      \  bool\n    search_result: str\n    report:        dict  <span class=\"cm\"\
      ># {summary, key_points, sources}</span>\n    messages:      Annotated[<span\
      \ class=\"str\">\"list, operator.add\"</span>]\n\n<span class=\"kw\">def</span>\
      \ <span class=\"fn\">classify_query</span>(state: ResearchState) -&gt; ResearchState:\n\
      \    <span class=\"str\">\"\"\"Decide if web search is needed.\"\"\"</span>\n\
      \    resp = <span class=\"fn\">ChatOpenAI</span>(model=<span class=\"str\">\"\
      gpt-4o-mini\"</span>, temperature=<span class=\"num\">0</span>).<span class=\"\
      fn\">invoke</span>([\n        <span class=\"fn\">HumanMessage</span>(content=<span\
      \ class=\"str\">f\"Does answering '</span>{state[<span class=\"str\">'question'</span>]}<span\
      \ class=\"str\">' require current web data? Reply only YES or NO.\"</span>)\n\
      \    ])\n    needs = <span class=\"str\">\"YES\"</span> <span class=\"kw\">in</span>\
      \ resp.content.<span class=\"fn\">upper</span>()\n    <span class=\"kw\">return</span>\
      \ {<span class=\"str\">\"needs_search\": needs, \"messages\"</span>: [resp]}\n\
      \n<span class=\"kw\">def</span> <span class=\"fn\">web_search</span>(state:\
      \ ResearchState) -&gt; ResearchState:\n    <span class=\"str\">\"\"\"Perform\
      \ web search (runs only after human approval).\"\"\"</span>\n    <span class=\"\
      cm\"># In real implementation: use Tavily or DuckDuckGo API</span>\n    result\
      \ = <span class=\"str\">f\"[Web search results for: {state['</span>question<span\
      \ class=\"str\">']}]\"</span>\n    <span class=\"kw\">return</span> {<span class=\"\
      str\">\"search_result\"</span>: result}\n\n<span class=\"kw\">def</span> <span\
      \ class=\"fn\">generate_report</span>(state: ResearchState) -&gt; ResearchState:\n\
      \    <span class=\"str\">\"\"\"Generate structured report.\"\"\"</span>\n  \
      \  context = state.<span class=\"fn\">get</span>(<span class=\"str\">\"search_result\"\
      , \"No web search performed.\"</span>)\n    <span class=\"cm\"># ... LLM call\
      \ to generate structured report</span>\n    <span class=\"kw\">return</span>\
      \ {<span class=\"str\">\"report\": {\"summary\": \"...\", \"key_points\": [],\
      \ \"sources\"</span>: []}}\n\ngraph = <span class=\"fn\">StateGraph</span>(ResearchState)\n\
      graph.<span class=\"fn\">add_node</span>(<span class=\"str\">\"classify_query\"\
      </span>, classify_query)\ngraph.<span class=\"fn\">add_node</span>(<span class=\"\
      str\">\"web_search\"</span>, web_search)\ngraph.<span class=\"fn\">add_node</span>(<span\
      \ class=\"str\">\"generate_report\"</span>, generate_report)\ngraph.<span class=\"\
      fn\">set_entry_point</span>(<span class=\"str\">\"classify_query\"</span>)\n\
      graph.<span class=\"fn\">add_conditional_edges</span>(<span class=\"str\">\"\
      classify_query\"</span>,\n    <span class=\"kw\">lambda</span> s: <span class=\"\
      str\">\"web_search\" if s[\"\\\"needs_search\\\"\"] else \"generate_report\"\
      </span>)\ngraph.<span class=\"fn\">add_edge</span>(<span class=\"str\">\"web_search\"\
      , \"generate_report\"</span>)\ngraph.<span class=\"fn\">add_edge</span>(<span\
      \ class=\"str\">\"generate_report\"</span>, END)\napp = graph.<span class=\"\
      fn\">compile</span>(checkpointer=<span class=\"fn\">MemorySaver</span>(), interrupt_before=[<span\
      \ class=\"str\">\"web_search\"</span>])"
    solution_lang: PYTHON — LANGGRAPH NODES
  - title: AutoGen Code Review Pipeline
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n         Build an AutoGen group chat with 4 specialized agents\
      \ for automated code review: (1)\n         <strong>\n          Developer\n \
      \        </strong>\n         : writes Python functions from natural language\
      \ specs, (2)\n         <strong>\n          Code Reviewer\n         </strong>\n\
      \         : reviews for bugs, edge cases, style issues, (3)\n         <strong>\n\
      \          Security Auditor\n         </strong>\n         : checks for security\
      \ vulnerabilities (injection, unsafe eval, etc.), (4)\n         <strong>\n \
      \         Tech Lead\n         </strong>\n         : makes final approval or\
      \ rejection decision. Test with 3 Python coding tasks of varying complexity.\n\
      \        </p>"
    done_when: "All 4 agents participate in the conversation. Security Auditor correctly\
      \ flags the unsafe\n         \n          eval(user_input)\n         \n     \
      \    pattern. Tech Lead provides a final verdict with summary of all reviewers'\
      \ findings."
    git_cmd: 'git add autogen_code_review_pipeline.py &amp;&amp; git commit -m "day110:
      autogen-code-review-pipeline"'
    sol_id: sol-w16d110t3
    solution_title: ✅ COMPLETE SOLUTION — autogen_code_review_pipeline.py
    solution_code: "<span class=\"cm\"># autogen_code_review_pipeline.py — Solution</span>\n\
      <span class=\"cm\"># Complete solution for: AutoGen Code Review Pipeline</span>\n\
      \n<span class=\"cm\"># Multi-Agent Pattern: Research + Writer + Reviewer</span>\n\
      <span class=\"cm\"># pip install langgraph langchain-openai</span>\n\n<span\
      \ class=\"kw\">from</span> langgraph.graph <span class=\"kw\">import</span>\
      \ StateGraph, END\n<span class=\"kw\">from</span> langchain_openai <span class=\"\
      kw\">import</span> ChatOpenAI\n<span class=\"kw\">from</span> typing <span class=\"\
      kw\">import</span> TypedDict, Annotated\n<span class=\"kw\">import</span> operator\n\
      \n<span class=\"cm\"># 1. Define shared state</span>\n<span class=\"kw\">class</span>\
      \ <span class=\"cls\">AgentState</span>(TypedDict):\n    topic: str\n    research:\
      \ Annotated[list[str], operator.add]\n    draft: str\n    review: str\n    final:\
      \ str\n\nllm = <span class=\"fn\">ChatOpenAI</span>(model=<span class=\"str\"\
      >\"gpt-4o-mini\"</span>, temperature=<span class=\"num\">0.3</span>)\n\n<span\
      \ class=\"cm\"># 2. Define agent nodes</span>\n<span class=\"kw\">def</span>\
      \ <span class=\"fn\">researcher</span>(state: AgentState) -&gt; AgentState:\n\
      \    <span class=\"str\">\"\"\"Research agent: gathers key facts about the topic.\"\
      \"\"</span>\n    response = llm.<span class=\"fn\">invoke</span>(\n        <span\
      \ class=\"str\">f\"You are a research assistant. List 5 key facts about: {state['</span>topic<span\
      \ class=\"str\">']}. \"</span>\n        <span class=\"str\">f\"Be concise and\
      \ factual.\"</span>\n    )\n    <span class=\"kw\">return</span> {<span class=\"\
      str\">\"research\"</span>: [response.content]}\n\n<span class=\"kw\">def</span>\
      \ <span class=\"fn\">writer</span>(state: AgentState) -&gt; AgentState:\n  \
      \  <span class=\"str\">\"\"\"Writer agent: creates a draft from research.\"\"\
      \"</span>\n    research = <span class=\"str\">\"\\n\".join(state[\"research\"\
      </span>])\n    response = llm.<span class=\"fn\">invoke</span>(\n        <span\
      \ class=\"str\">f\"You are a technical writer. Write a clear 200-word summary\
      \ based on this research:\\n{research}\"</span>\n    )\n    <span class=\"kw\"\
      >return</span> {<span class=\"str\">\"draft\"</span>: response.content}\n\n\
      <span class=\"kw\">def</span> <span class=\"fn\">reviewer</span>(state: AgentState)\
      \ -&gt; AgentState:\n    <span class=\"str\">\"\"\"Reviewer agent: critiques\
      \ the draft.\"\"\"</span>\n    response = llm.<span class=\"fn\">invoke</span>(\n\
      \        <span class=\"str\">f\"You are a critical reviewer. Review this draft\
      \ for accuracy and clarity. \"</span>\n        <span class=\"str\">f\"List specific\
      \ improvements:\\n{state['</span>draft<span class=\"str\">']}\"</span>\n   \
      \ )\n    <span class=\"kw\">return</span> {<span class=\"str\">\"review\"</span>:\
      \ response.content}\n\n<span class=\"kw\">def</span> <span class=\"fn\">finalizer</span>(state:\
      \ AgentState) -&gt; AgentState:\n    <span class=\"str\">\"\"\"Finalizer: incorporates\
      \ review feedback.\"\"\"</span>\n    response = llm.<span class=\"fn\">invoke</span>(\n\
      \        <span class=\"str\">f\"Revise this draft based on the review feedback.\\\
      n\\n\"</span>\n        <span class=\"str\">f\"Draft:\\n{state['</span>draft<span\
      \ class=\"str\">']}\\n\\nFeedback:\\n{state['</span>review<span class=\"str\"\
      >']}\"</span>\n    )\n    <span class=\"kw\">return</span> {<span class=\"str\"\
      >\"final\"</span>: response.content}\n\n<span class=\"cm\"># 3. Build the graph</span>\n\
      workflow = <span class=\"fn\">StateGraph</span>(AgentState)\nworkflow.<span\
      \ class=\"fn\">add_node</span>(<span class=\"str\">\"researcher\"</span>, researcher)\n\
      workflow.<span class=\"fn\">add_node</span>(<span class=\"str\">\"writer\"</span>,\
      \ writer)\nworkflow.<span class=\"fn\">add_node</span>(<span class=\"str\">\"\
      reviewer\"</span>, reviewer)\nworkflow.<span class=\"fn\">add_node</span>(<span\
      \ class=\"str\">\"finalizer\"</span>, finalizer)\n\nworkflow.<span class=\"\
      fn\">set_entry_point</span>(<span class=\"str\">\"researcher\"</span>)\nworkflow.<span\
      \ class=\"fn\">add_edge</span>(<span class=\"str\">\"researcher\", \"writer\"\
      </span>)\nworkflow.<span class=\"fn\">add_edge</span>(<span class=\"str\">\"\
      writer\", \"reviewer\"</span>)\nworkflow.<span class=\"fn\">add_edge</span>(<span\
      \ class=\"str\">\"reviewer\", \"finalizer\"</span>)\nworkflow.<span class=\"\
      fn\">add_edge</span>(<span class=\"str\">\"finalizer\"</span>, END)\n\napp =\
      \ workflow.<span class=\"fn\">compile</span>()\n\n<span class=\"cm\"># 4. Run</span>\n\
      result = app.<span class=\"fn\">invoke</span>({<span class=\"str\">\"topic\"\
      : \"How LoRA fine-tuning works\", \"research\"</span>: []})\n<span class=\"\
      fn\">print</span>(<span class=\"str\">\"=== Final Article ===\"</span>)\n<span\
      \ class=\"fn\">print</span>(result[<span class=\"str\">\"final\"</span>])\n\n\
      <span class=\"kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n\
      \    <span class=\"fn\">solve</span>()"
    solution_lang: python
  quizzes:
  - num_str: Q1 OF 5
    question: "In LangGraph, why is\n        \n         Annotated[\"list, operator.add\"\
      ]\n        \n        used for the messages field in the State?"
    qid: q110_1
    options:
    - letter: A
      text: It validates that messages is a valid Python list
      is_correct: false
    - letter: B
      text: 'It defines a reducer — when two nodes return {messages: [new_msg]}, the
        state merges them via list concatenation instead of overwriting. Without this,
        each node would replace the full message history'
      is_correct: true
    - letter: C
      text: It makes messages thread-safe for parallel nodes
      is_correct: false
    - letter: D
      text: operator.add is needed for JSON serialisation
      is_correct: false
    correct_fb: '✅ Perfect. The Annotated reducer tells LangGraph how to merge state
      updates from nodes. Default merging: last-write-wins (new value replaces old).
      With operator.add, when node returns {messages: [x]}, LangGraph does state.messages
      += [x] instead of state.messages = [x]. Essential for accumulating conversation
      history.'
    wrong_fb: ❌ The Annotated["list, operator.add"] is a state reducer definition.
      Without it, each node's return value would overwrite the entire messages list.
      With operator.add, returns are concatenated — each node appends to the conversation
      history instead of replacing it.
  - num_str: Q2 OF 5
    question: "What does\n        \n         interrupt_before=[\"tool_node\"]\n  \
      \      \n        in\n        \n         graph.compile()\n        \n        do\
      \ at runtime?"
    qid: q110_2
    options:
    - letter: A
      text: It disables the tool_node permanently
      is_correct: false
    - letter: B
      text: Execution stops just before tool_node runs and returns control to the
        caller. State is checkpointed. The graph can be resumed by calling invoke(None,
        config) — this is the human-in-the-loop pattern
      is_correct: true
    - letter: C
      text: It adds a timeout of 30s before the tool runs
      is_correct: false
    - letter: D
      text: It logs tool inputs for debugging only
      is_correct: false
    correct_fb: ✅ Exactly. interrupt_before creates a breakpoint. When the graph reaches
      the node boundary before tool_node, execution freezes, the current state is
      saved to the checkpointer, and invoke() returns. Passing invoke(None, config)
      with the same thread_id resumes from exactly where it stopped.
    wrong_fb: ❌ interrupt_before is a breakpoint declaration. When execution reaches
      this node boundary, it pauses, saves state to checkpointer, and returns control
      to your code. You inspect state, get human approval, then resume by calling
      invoke(None, config) with the same thread_id.
  - num_str: Q3 OF 5
    question: "In AutoGen, what is\n        \n         human_input_mode=\"TERMINATE\"\
      \n        \n        vs\n        \n         \"ALWAYS\"\n        \n        vs\n\
      \        \n         \"NEVER\"\n        \n        ?"
    qid: q110_3
    options:
    - letter: A
      text: NEVER = fully autonomous (no human interrupts). ALWAYS = human must approve
        every message. TERMINATE = human only asked when the AI sends a "TERMINATE"
        signal or hits max_consecutive_auto_reply — best for production automation
        with oversight
      is_correct: true
    - letter: B
      text: These control how the agent terminates conversations
      is_correct: false
    - letter: C
      text: TERMINATE is the default and blocks all agent communication
      is_correct: false
    - letter: D
      text: They are the same — just different names for the same behavior
      is_correct: false
    correct_fb: ✅ Correct. NEVER = best for demos and tests (no waiting). ALWAYS =
      best for high-stakes tasks where every action needs approval. TERMINATE = the
      balanced production choice — agent runs autonomously but pauses to ask the human
      when it's unsure or completed a major milestone.
    wrong_fb: '❌ human_input_mode controls when to pause for human input. NEVER: agent
      runs autonomously to completion. ALWAYS: human approves every single message.
      TERMINATE: pause only when the AI says "TERMINATE" (task done) or hits the auto-reply
      limit. TERMINATE is the practical production setting.'
  - num_str: Q4 OF 5
    question: Why is the Supervisor pattern generally preferred over the Network pattern
      for production multi-agent systems?
    qid: q110_4
    options:
    - letter: A
      text: Supervisor uses less memory than Network
      is_correct: false
    - letter: B
      text: Network patterns can cause infinite loops (Agent A calls B, B calls A).
        Supervisor provides a single orchestration point with controlled routing,
        making it easier to add guardrails, logging, timeouts, and human-in-the-loop
        checkpoints
      is_correct: true
    - letter: C
      text: Supervisor is always faster because it has fewer LLM calls
      is_correct: false
    - letter: D
      text: Network patterns don't support tool use
      is_correct: false
    correct_fb: '✅ Correct. Network topology has no natural termination guarantee
      — agents can call each other indefinitely. Supervisor creates a clear hub: supervisor
      decides who does what, when to proceed, and when to stop. This centralisation
      makes it easier to add max_turns, cost limits, human checkpoints, and debugging.'
    wrong_fb: ❌ Network patterns can cycle. Without a supervisor, there's no single
      entity ensuring the task terminates correctly. Supervisor provides centralised
      control, making it easier to add safety checks, budgets, interrupts, and observability.
      For production, centralised control &gt; maximal flexibility.
  - num_str: Q5 OF 5
    question: What is the purpose of a MemorySaver checkpointer in LangGraph?
    qid: q110_5
    options:
    - letter: A
      text: It caches LLM responses to avoid duplicate API calls
      is_correct: false
    - letter: B
      text: 'It saves the full agent state at each step to a storage backend (in-memory
        for MemorySaver, database for production). This enables: resuming interrupted
        runs, human-in-the-loop pausing, multi-turn conversations with persistent
        context, and debugging by replaying state'
      is_correct: true
    - letter: C
      text: It limits memory usage by capping the message history length
      is_correct: false
    - letter: D
      text: It's required only for parallel node execution
      is_correct: false
    correct_fb: '✅ Exactly. Checkpointing serialises and saves the entire graph state
      (all accumulated messages, tool results, custom state fields) after every node.
      MemorySaver = in-RAM storage (lost on restart). For production: SqliteSaver
      or PostgresSaver persist to disk/database. The thread_id parameter identifies
      which conversation thread to save/load.'
    wrong_fb: '❌ Checkpointer = persistence layer for agent state. After every node
      execution, the full state is serialized and saved. This enables: (1) interrupt_before
      patterns (pause/resume), (2) conversation continuity across sessions, (3) state
      replay for debugging. MemorySaver is in-memory only; use SqliteSaver for durability.'
