week_number: 16
title: Production AI Engineering
description: ''
days:
- id: '108'
  day_num: 108
  title: Fine-Tuning LLMs — LoRA, QLoRA & PEFT
  subtitle: Sirf prompting aur RAG hamesha enough nahi hota. Jab model ko domain-specific
    knowledge ya ek specific style adopt karni ho permanently, tab fine-tuning karo.
    LoRA aur QLoRA se consumer GPU pe bhi billion-parameter models fine-tune hote
    hain — ye magic hai linear algebra ka.
  time_estimate: 7 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Explain when to use fine-tuning vs. prompting vs. RAG with concrete decision criteria.
  - 'Understand LoRA''s mathematical trick: decomposing weight updates into two low-rank
    matrices.'
  - Use Hugging Face PEFT library to apply LoRA on any transformer model.
  - Run QLoRA (4-bit quantization + LoRA) to fine-tune a 7B model on a free Colab
    T4 GPU.
  - Prepare a custom dataset in the Alpaca/ShareGPT instruction format for supervised
    fine-tuning.
  checklist:
  - id: chk_108_1
    text: Study the core mathematical and architectural principles of Fine-Tuning
      LLMs — LoRA, QLoRA & PEFT
  - id: chk_108_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_108_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_108_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - LoRA/QLoRA
  - PEFT library
  - Supervised Fine-Tuning
  - Dataset Formatting
  - Adapter Merging
  - Model Quantization
  hinglish: 'Full fine-tuning sab parameters update karta hai — expensive! Parameter-efficient
    fine-tuning (PEFT): sirf kuch parameters train karo, rest freeze. LoRA sabse popular
    PEFT method hai!'
  analogy: 'LoRA ko samjho jaise IAS exam ki preparation: poora 10 saal ka syllabus
    dobara padhna (full fine-tuning) vs sirf current affairs aur recent question patterns
    padhna (LoRA) — kyunki model ka base knowledge already solid hai, sirf ek specific
    "layer" add karni hai.'
  theory_html: "<h3 class=\"sh3\">\n       1. When to Fine-Tune vs. Prompt vs. RAG\n\
    \      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem\
    \ 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Approach\n\
    \        </th>\n<th>\n         When to Use\n        </th>\n<th>\n         Cost\n\
    \        </th>\n<th>\n         Latency Impact\n        </th>\n</tr>\n<tr>\n<td>\n\
    <strong>\n          Prompting\n         </strong>\n</td>\n<td>\n         General\
    \ tasks, standard domains, quick iteration\n        </td>\n<td>\n         Very\
    \ low\n        </td>\n<td>\n         None\n        </td>\n</tr>\n<tr>\n<td>\n\
    <strong>\n          RAG\n         </strong>\n</td>\n<td>\n         Dynamic knowledge,\
    \ large private corpora, facts that change\n        </td>\n<td>\n         Low\
    \ (storage)\n        </td>\n<td>\n         +retrieval time\n        </td>\n</tr>\n\
    <tr>\n<td>\n<strong>\n          Fine-Tuning\n         </strong>\n</td>\n<td>\n\
    \         Specific style/persona, domain jargon, highly structured output, lower\
    \ inference cost at scale\n        </td>\n<td>\n         High (one-time training)\n\
    \        </td>\n<td>\n         None (model is smaller)\n        </td>\n</tr>\n\
    </table></div>\n<h3 class=\"sh3\">\n       2. LoRA — Low-Rank Adaptation\n   \
    \   </h3>\n<p>\n       Full fine-tuning updates all model weights — for a 7B parameter\
    \ model that's 28GB of gradient storage. LoRA observes that\n       <strong>\n\
    \        weight updates during fine-tuning have low intrinsic rank\n       </strong>\n\
    \       , so instead of updating the full weight matrix W, we add a small low-rank\
    \ update:\n      </p>\n<div class=\"math-block\">\n<span class=\"desc\">\n   \
    \     Standard weight update (full fine-tuning):\n       </span>\n<span class=\"\
    formula\">\n        $$W' = W + \\Delta W \\quad \\text{where } \\Delta W \\in\
    \ \\mathbb{R}^{d \\times k}$$\n       </span>\n<span class=\"desc\">\n       \
    \ LoRA approximation — decompose ΔW into two small matrices:\n       </span>\n\
    <span class=\"formula\">\n        $$\\Delta W = BA \\quad \\text{where } B \\\
    in \\mathbb{R}^{d \\times r},\\ A \\in \\mathbb{R}^{r \\times k},\\ r \\ll \\\
    min(d, k)$$\n       </span>\n<span class=\"desc\">\n        At rank r=8, a 4096×4096\
    \ matrix: full ΔW = 16.7M params. LoRA ΔW = 2×(4096×8) = 65K params — a 256× reduction!\n\
    \       </span>\n</div>\n\n<svg aria-label=\"LoRA low-rank decomposition showing\
    \ frozen weight matrix W and small trainable matrices A and B\" height=\"340\"\
    \ role=\"img\" viewbox=\"0 0 700 340\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\"\
    >\n<style>\n        svg .w16t{font-family:DM Sans,sans-serif} svg .w16m{font-family:IBM\
    \ Plex Mono,monospace}\n       </style>\n<defs>\n<lineargradient id=\"w16-bg_s\"\
    \ x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n<stop offset=\"0%\" stop-color=\"#1a1e2e\"\
    >\n</stop>\n<stop offset=\"100%\" stop-color=\"var(--bg)\">\n</stop>\n</lineargradient>\n\
    </defs>\n<rect fill=\"url(#w16-bg_s)\" height=\"340\" rx=\"12\" width=\"700\"\
    >\n</rect>\n<text class=\"w16t\" fill=\"#e6edf3\" font-size=\"14\" font-weight=\"\
    700\" text-anchor=\"middle\" x=\"350\" y=\"26\">\n        LoRA — W′ = W + BA instead\
    \ of W + ΔW\n       </text>\n<text class=\"w16t\" fill=\"var(--text2)\" font-size=\"\
    11\" text-anchor=\"middle\" x=\"180\" y=\"52\">\n        FULL FINE-TUNING\n  \
    \     </text>\n<text class=\"w16t\" fill=\"var(--text2)\" font-size=\"11\" text-anchor=\"\
    middle\" x=\"460\" y=\"52\">\n        LORA\n       </text>\n<rect fill=\"var(--bg)\"\
    \ fill-opacity=\"0.6\" height=\"150\" rx=\"8\" stroke=\"#6c8cff\" stroke-width=\"\
    1.5\" width=\"120\" x=\"120\" y=\"66\">\n</rect>\n<text class=\"w16t\" fill=\"\
    #6c8cff\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" x=\"180\"\
    \ y=\"120\">\n        W\n       </text>\n<text class=\"w16t\" fill=\"var(--text2)\"\
    \ font-size=\"9.5\" text-anchor=\"middle\" x=\"180\" y=\"136\">\n        d × k\n\
    \       </text>\n<text class=\"w16m\" fill=\"#e56b8c\" font-size=\"9.5\" text-anchor=\"\
    middle\" x=\"180\" y=\"158\">\n        16.7M params\n       </text>\n<text class=\"\
    w16m\" fill=\"#e56b8c\" font-size=\"9.5\" text-anchor=\"middle\" x=\"180\" y=\"\
    196\">\n        updated → new checkpoint\n       </text>\n<rect fill=\"var(--bg)\"\
    \ fill-opacity=\"0.6\" height=\"150\" rx=\"8\" stroke=\"#6c8cff\" stroke-width=\"\
    1.5\" width=\"100\" x=\"410\" y=\"66\">\n</rect>\n<text class=\"w16t\" fill=\"\
    #6c8cff\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" x=\"460\"\
    \ y=\"120\">\n        W\n       </text>\n<text class=\"w16t\" fill=\"var(--text2)\"\
    \ font-size=\"9.5\" text-anchor=\"middle\" x=\"460\" y=\"136\">\n        d × k\n\
    \       </text>\n<text class=\"w16t\" fill=\"#4fd1a5\" font-size=\"9.5\" font-weight=\"\
    700\" text-anchor=\"middle\" x=\"460\" y=\"158\">\n        FROZEN ❄️\n       </text>\n\
    <text class=\"w16m\" fill=\"var(--text2)\" font-size=\"9.5\" text-anchor=\"middle\"\
    \ x=\"460\" y=\"196\">\n        0 trainable params\n       </text>\n<text class=\"\
    w16t\" fill=\"#e6edf3\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\"\
    \ x=\"390\" y=\"130\">\n        +\n       </text>\n<rect fill=\"#e56b8c\" fill-opacity=\"\
    0.14\" height=\"80\" rx=\"8\" stroke=\"#e56b8c\" stroke-width=\"1.5\" width=\"\
    26\" x=\"516\" y=\"136\">\n</rect>\n<text class=\"w16t\" fill=\"#e56b8c\" font-size=\"\
    10\" font-weight=\"700\" text-anchor=\"middle\" x=\"529\" y=\"168\">\n       \
    \ B\n       </text>\n<text class=\"w16m\" fill=\"#e56b8c\" font-size=\"9\" text-anchor=\"\
    middle\" x=\"529\" y=\"184\">\n        d×r\n       </text>\n<rect fill=\"#f7a94b\"\
    \ fill-opacity=\"0.14\" height=\"26\" rx=\"8\" stroke=\"#f7a94b\" stroke-width=\"\
    1.5\" width=\"146\" x=\"548\" y=\"160\">\n</rect>\n<text class=\"w16t\" fill=\"\
    #f7a94b\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\" x=\"621\"\
    \ y=\"178\">\n        A\n       </text>\n<text class=\"w16m\" fill=\"#f7a94b\"\
    \ font-size=\"9\" text-anchor=\"middle\" x=\"621\" y=\"192\">\n        r×k\n \
    \      </text>\n<line stroke=\"#f5d76e\" stroke-width=\"2\" x1=\"621\" x2=\"621\"\
    \ y1=\"186\" y2=\"236\">\n</line>\n<text class=\"w16t\" fill=\"#f5d76e\" font-size=\"\
    11\" font-weight=\"700\" text-anchor=\"middle\" x=\"585\" y=\"126\">\n       \
    \ ΔW = BA ≈ W′ = W + BA\n       </text>\n<rect fill=\"#f5d76e\" fill-opacity=\"\
    0.1\" height=\"40\" rx=\"8\" stroke=\"#f5d76e\" stroke-width=\"1.5\" width=\"\
    240\" x=\"455\" y=\"236\">\n</rect>\n<text class=\"w16m\" fill=\"#f5d76e\" font-size=\"\
    9.5\" text-anchor=\"middle\" x=\"585\" y=\"254\">\n        65K params (r=8)\n\
    \       </text>\n<text class=\"w16m\" fill=\"#f5d76e\" font-size=\"9.5\" text-anchor=\"\
    middle\" x=\"585\" y=\"268\">\n        256× fewer · one small adapter file\n \
    \      </text>\n<text class=\"w16t\" fill=\"var(--text2)\" font-size=\"10\" text-anchor=\"\
    middle\" x=\"350\" y=\"318\">\n        Train only B and A — a tiny adapter (~0.1%\
    \ of params) that can be swapped per task\n       </text>\n</svg>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — APPLYING\
    \ LORA WITH PEFT\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><span class=\"cm\"># pip install transformers\
    \ peft accelerate datasets bitsandbytes</span>\n<span class=\"kw\">from</span>\
    \ transformers <span class=\"kw\">import</span> AutoModelForCausalLM, AutoTokenizer\n\
    <span class=\"kw\">from</span> peft <span class=\"kw\">import</span> LoraConfig,\
    \ get_peft_model, TaskType\n<span class=\"kw\">import</span> torch\n\n<span class=\"\
    cm\"># Load base model (use a small one for demo)</span>\nmodel_name = <span class=\"\
    str\">\"microsoft/phi-2\"</span>   <span class=\"cm\"># 2.7B params, great for\
    \ experimentation</span>\ntokenizer  = AutoTokenizer.<span class=\"fn\">from_pretrained</span>(model_name)\n\
    model      = AutoModelForCausalLM.<span class=\"fn\">from_pretrained</span>(\n\
    \    model_name, torch_dtype=torch.float16, device_map=<span class=\"str\">\"\
    auto\"</span>\n)\n\n<span class=\"cm\"># Define LoRA configuration</span>\nlora_config\
    \ = <span class=\"fn\">LoraConfig</span>(\n    task_type=TaskType.CAUSAL_LM, \
    \ <span class=\"cm\"># language model fine-tuning</span>\n    r=<span class=\"\
    num\">8</span>,                            <span class=\"cm\"># rank — lower r\
    \ = fewer params, faster but less expressive</span>\n    lora_alpha=<span class=\"\
    num\">32</span>,                 <span class=\"cm\"># scaling factor: α/r = 4\
    \ (effective learning rate scale)</span>\n    target_modules=[<span class=\"str\"\
    >\"q_proj\", \"v_proj\"</span>],  <span class=\"cm\"># which layers to apply LoRA\
    \ to</span>\n    lora_dropout=<span class=\"num\">0.05</span>,             <span\
    \ class=\"cm\"># regularization</span>\n    bias=<span class=\"str\">\"none\"\
    </span>                     <span class=\"cm\"># don't add bias parameters</span>\n\
    )\n\n<span class=\"cm\"># Wrap the model with LoRA — only LoRA params will be\
    \ trained</span>\npeft_model = <span class=\"fn\">get_peft_model</span>(model,\
    \ lora_config)\npeft_model.<span class=\"fn\">print_trainable_parameters</span>()\n\
    <span class=\"cm\"># trainable params: 2,097,152 || all params: 2,779,683,840\
    \ || trainable%: 0.08%</span>\n<span class=\"cm\"># Only 0.08% of parameters are\
    \ trained!</span>\n\n<span class=\"cm\"># Inspect which modules have LoRA adapters</span>\n\
    <span class=\"kw\">for</span> name, module <span class=\"kw\">in</span> peft_model.<span\
    \ class=\"fn\">named_modules</span>():\n    <span class=\"kw\">if</span> <span\
    \ class=\"str\">\"lora\"</span> <span class=\"kw\">in</span> name:\n        <span\
    \ class=\"fn\">print</span>(name, <span class=\"str\">\"→\"</span>, module.__class__.__name__)</pre>\n\
    </div>\n<h3 class=\"sh3\">\n       3. QLoRA — 4-bit Quantisation + LoRA\n    \
    \  </h3>\n<p>\n       QLoRA (Dettmers et al., 2023) lets you fine-tune a\n   \
    \    <strong>\n        65B model on a single 48GB GPU\n       </strong>\n    \
    \   — or a 7B model on a free Colab T4 (15GB). The trick: load the frozen base\
    \ model in 4-bit NormalFloat (NF4) quantisation, add 16-bit LoRA adapters on top.\
    \ Gradients flow through LoRA (fp16) but base model stays 4-bit.\n      </p>\n\
    <div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"\
    ><table class=\"concept-table\">\n<tr>\n<th>\n         Technique\n        </th>\n\
    <th>\n         Memory for 7B model\n        </th>\n<th>\n         Quality vs Full\
    \ FT\n        </th>\n</tr>\n<tr>\n<td>\n         Full fine-tuning (fp16)\n   \
    \     </td>\n<td>\n         ~112 GB\n        </td>\n<td>\n         Baseline\n\
    \        </td>\n</tr>\n<tr>\n<td>\n         LoRA (fp16 base)\n        </td>\n\
    <td>\n         ~14 GB\n        </td>\n<td>\n         ~97% of full FT\n       \
    \ </td>\n</tr>\n<tr>\n<td>\n         QLoRA (4-bit base + fp16 LoRA)\n        </td>\n\
    <td>\n         ~6 GB\n        </td>\n<td>\n         ~95% of full FT\n        </td>\n\
    </tr>\n</table></div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         PYTHON — QLORA SETUP WITH BITSANDBYTES\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> torch\n\n<span class=\"kw\">from</span>\
    \ transformers <span class=\"kw\">import</span> BitsAndBytesConfig\n<span class=\"\
    kw\">from</span> peft <span class=\"kw\">import</span> prepare_model_for_kbit_training\n\
    \n<span class=\"cm\"># 4-bit quantisation config (NF4 = NormalFloat4, best quality)</span>\n\
    bnb_config = <span class=\"fn\">BitsAndBytesConfig</span>(\n    load_in_4bit=<span\
    \ class=\"kw\">True</span>,\n    bnb_4bit_quant_type=<span class=\"str\">\"nf4\"\
    </span>,          <span class=\"cm\"># NormalFloat4 — optimal for normally-distributed\
    \ weights</span>\n    bnb_4bit_compute_dtype=torch.bfloat16, <span class=\"cm\"\
    ># compute in bf16 even though stored in 4-bit</span>\n    bnb_4bit_use_double_quant=<span\
    \ class=\"kw\">True</span>,       <span class=\"cm\"># quantise the quantisation\
    \ constants too (saves ~0.4 bits/param)</span>\n)\n\n<span class=\"cm\"># Load\
    \ in 4-bit — only ~6GB for a 7B model!</span>\nmodel = AutoModelForCausalLM.<span\
    \ class=\"fn\">from_pretrained</span>(\n    <span class=\"str\">\"meta-llama/Llama-2-7b-hf\"\
    </span>,\n    quantization_config=bnb_config,\n    device_map=<span class=\"str\"\
    >\"auto\"</span>,\n)\n\n<span class=\"cm\"># Prepare for k-bit training: cast\
    \ layer norms to fp32, enable gradient checkpointing</span>\nmodel = <span class=\"\
    fn\">prepare_model_for_kbit_training</span>(model)\n\n<span class=\"cm\"># Apply\
    \ LoRA on top of the quantised model</span>\nlora_config = <span class=\"fn\"\
    >LoraConfig</span>(\n    r=<span class=\"num\">16</span>,\n    lora_alpha=<span\
    \ class=\"num\">64</span>,\n    target_modules=[<span class=\"str\">\"q_proj\"\
    , \"k_proj\", \"v_proj\", \"o_proj\"</span>],  <span class=\"cm\"># all attention\
    \ projections</span>\n    lora_dropout=<span class=\"num\">0.1</span>,\n    task_type=TaskType.CAUSAL_LM,\n\
    )\npeft_model = <span class=\"fn\">get_peft_model</span>(model, lora_config)\n\
    peft_model.<span class=\"fn\">print_trainable_parameters</span>()\n<span class=\"\
    cm\"># trainable params: 33,554,432 || all params: 3,540,389,888 || trainable%:\
    \ 0.95%</span></pre>\n</div>\n<h3 class=\"sh3\">\n       4. Dataset Preparation\
    \ — Alpaca &amp; ShareGPT Formats\n      </h3>\n<p>\n       Supervised Fine-Tuning\
    \ (SFT) needs instruction-response pairs. The two dominant formats are Alpaca\
    \ (simple) and ShareGPT (multi-turn conversation). Both ultimately get formatted\
    \ into a single string that the model learns to predict.\n      </p>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — DATASET\
    \ FORMATTING FOR SFT\n        </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n \
    \         Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">from</span>\
    \ datasets <span class=\"kw\">import</span> Dataset\n\n<span class=\"cm\"># ---\
    \ Alpaca format ---</span>\nalpaca_examples = [\n    {\n        <span class=\"\
    str\">\"instruction\": \"Explain gradient descent in Hindi in 2 sentences.\"</span>,\n\
    \        <span class=\"str\">\"input\": \"\"</span>,   <span class=\"cm\"># optional\
    \ extra context</span>\n        <span class=\"str\">\"output\":     \"Gradient\
    \ descent ek optimization algorithm hai jo loss ko minimise karta hai. Ye har\
    \ step mein gradient ke ulte direction mein weights ko update karta hai.\"</span>\n\
    \    }\n]\n\n<span class=\"kw\">def</span> <span class=\"fn\">alpaca_to_prompt</span>(sample:\
    \ dict) -&gt; str:\n    <span class=\"str\">\"\"\"Format one Alpaca sample into\
    \ a training string.\"\"\"</span>\n    inp = (<span class=\"str\">f\"\\n\\n###\
    \ Input:\\n{sample['</span>input<span class=\"str\">']}\" if sample[\"\\\"input\\\
    \"\"] else \"\"</span>)\n    <span class=\"kw\">return</span> (\n        <span\
    \ class=\"str\">f\"### Instruction:\\n{sample[\"'</span>instruction<span class=\"\
    str\">'\"]}{inp}\\n\\n\"</span>\n        <span class=\"str\">f\"### Response:\\\
    n{sample[\"'</span>output<span class=\"str\">'\"]}\"</span>\n    )\n\n<span class=\"\
    cm\"># --- ShareGPT format (multi-turn) ---</span>\nsharegpt_example = {\n   \
    \ <span class=\"str\">\"conversations\"</span>: [\n        {<span class=\"str\"\
    >\"from\": \"human\",  \"value\": \"What is a transformer architecture?\"</span>},\n\
    \        {<span class=\"str\">\"from\": \"gpt\",    \"value\": \"A transformer\
    \ is a neural network architecture...\"</span>},\n        {<span class=\"str\"\
    >\"from\": \"human\",  \"value\": \"What problem does attention solve?\"</span>},\n\
    \        {<span class=\"str\">\"from\": \"gpt\",    \"value\": \"Attention solves\
    \ the fixed-length bottleneck...\"</span>},\n    ]\n}\n\n<span class=\"cm\">#\
    \ Use TRL's SFTTrainer which handles formatting automatically</span>\n<span class=\"\
    kw\">from</span> trl <span class=\"kw\">import</span> SFTTrainer\n<span class=\"\
    kw\">from</span> transformers <span class=\"kw\">import</span> TrainingArguments\n\
    \ntraining_args = <span class=\"fn\">TrainingArguments</span>(\n    output_dir=<span\
    \ class=\"str\">\"./lora_output\"</span>,\n    num_train_epochs=<span class=\"\
    num\">3</span>,\n    per_device_train_batch_size=<span class=\"num\">4</span>,\n\
    \    gradient_accumulation_steps=<span class=\"num\">4</span>,   <span class=\"\
    cm\"># effective batch = 16</span>\n    learning_rate=<span class=\"num\">2e-4</span>,\
    \               <span class=\"cm\"># higher than full FT because only few params\
    \ trained</span>\n    fp16=<span class=\"kw\">True</span>,\n    logging_steps=<span\
    \ class=\"num\">10</span>,\n    save_steps=<span class=\"num\">100</span>,\n \
    \   warmup_ratio=<span class=\"num\">0.03</span>,\n    lr_scheduler_type=<span\
    \ class=\"str\">\"cosine\"</span>,\n)\n\n<span class=\"cm\"># SFTTrainer handles\
    \ tokenisation, packing, and formatting</span>\ntrainer = <span class=\"fn\">SFTTrainer</span>(\n\
    \    model=peft_model,\n    args=training_args,\n    train_dataset=Dataset.<span\
    \ class=\"fn\">from_list</span>(alpaca_examples),\n    formatting_func=alpaca_to_prompt,\n\
    \    max_seq_length=<span class=\"num\">2048</span>,\n)\n<span class=\"cm\">#\
    \ trainer.train()  # uncomment to actually train</span></pre>\n</div>\n<h3 class=\"\
    sh3\">\n       5. Merging &amp; Saving LoRA Adapters\n      </h3>\n<p style=\"\
    margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n\
    \       After fine-tuning, merging LoRA adapter weights directly back into the\
    \ base model prevents inference latency and simplifies model sharing.\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   PYTHON — SAVE, MERGE &amp; PUSH TO HUB\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> torch\n\n<span class=\"cm\"># Option A: Save just\
    \ the LoRA adapters (tiny, ~16MB for r=16)</span>\npeft_model.<span class=\"fn\"\
    >save_pretrained</span>(<span class=\"str\">\"./my_lora_adapter\"</span>)\ntokenizer.<span\
    \ class=\"fn\">save_pretrained</span>(<span class=\"str\">\"./my_lora_adapter\"\
    </span>)\n\n<span class=\"cm\"># Option B: Merge LoRA weights into base model\
    \ (for faster inference — no adapter overhead)</span>\n<span class=\"kw\">from</span>\
    \ peft <span class=\"kw\">import</span> PeftModel\n\nbase   = AutoModelForCausalLM.<span\
    \ class=\"fn\">from_pretrained</span>(<span class=\"str\">\"microsoft/phi-2\"\
    </span>, torch_dtype=torch.float16)\nmerged = PeftModel.<span class=\"fn\">from_pretrained</span>(base,\
    \ <span class=\"str\">\"./my_lora_adapter\"</span>)\nmerged = merged.<span class=\"\
    fn\">merge_and_unload</span>()     <span class=\"cm\"># bakes LoRA into base weights:\
    \ W' = W + BA</span>\nmerged.<span class=\"fn\">save_pretrained</span>(<span class=\"\
    str\">\"./merged_model\"</span>)\n\n<span class=\"cm\"># Option C: Push to Hugging\
    \ Face Hub for sharing / deployment</span>\npeft_model.<span class=\"fn\">push_to_hub</span>(<span\
