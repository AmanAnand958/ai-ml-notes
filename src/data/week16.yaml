      >return</span> response.content\n\n@<span class=\"fn\">traceable</span>(name=<span\
      \ class=\"str\">\"retrieve_docs\"</span>)\n<span class=\"kw\">def</span> <span\
      \ class=\"fn\">retrieve_docs</span>(query: str) -&gt; list:\n    <span class=\"\
