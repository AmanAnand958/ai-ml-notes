  theory_html: "<h3 class=\"sh3\">\n       1. Multi-Agent Architecture Patterns\n\
    \      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem\
    \ 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Pattern\n\
    \        </th>\n<th>\n         Structure\n        </th>\n<th>\n         Best For\n\
    \        </th>\n<th>\n         Example\n        </th>\n</tr>\n<tr>\n<td>\n<strong>\n\
    \          Network\n         </strong>\n</td>\n<td>\n         Any agent can call\
    \ any other\n        </td>\n<td>\n         Flexible collaboration\n        </td>\n\
    <td>\n         Research team agents\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n\
    \          Supervisor\n         </strong>\n</td>\n<td>\n         One orchestrator\
    \ routes to specialists\n        </td>\n<td>\n         Known task decomposition\n\
    \        </td>\n<td>\n         CEO → developer, designer, QA\n        </td>\n\
    </tr>\n<tr>\n<td>\n<strong>\n          Hierarchical\n         </strong>\n</td>\n\
    <td>\n         Supervisor of supervisors\n        </td>\n<td>\n         Very complex\
    \ tasks\n        </td>\n<td>\n         Company org chart as agents\n        </td>\n\
    </tr>\n<tr>\n<td>\n<strong>\n          Sequential Pipeline\n         </strong>\n\
    </td>\n<td>\n         Agent A → Agent B → Agent C\n        </td>\n<td>\n     \
    \    Deterministic workflows\n        </td>\n<td>\n         Draft → review → publish\n\
    \        </td>\n</tr>\n</table></div>\n<h3 class=\"sh3\">\n       2. LangGraph\
    \ — Stateful Agent Graphs\n      </h3>\n<p>\n       LangGraph models an agent\
    \ as a\n       <strong>\n        directed graph\n       </strong>\n       where\
    \ nodes are functions (LLM calls, tool calls, conditions) and edges define what\
    \ runs next. State is explicitly passed between nodes — no hidden globals.\n \
    \     </p>\n<div class=\"mermaid\">\ngraph TD\n  A[\"START\"] --&gt; B[\"Agent\
    \ Node\"]\n  B --&gt; C[\"Tool Needed?\"]\n  C --&gt;|Yes| D[\"Tool Node\"]\n\
    \  D --&gt; B\n  C --&gt;|No| E[\"END\"]\nstyle A fill:#1c2030,stroke:#b47cfc,color:#dde2f0\n\
    style E fill:#1c2030,stroke:#4fd1a5,color:#dde2f0\nstyle B fill:#1c2030,stroke:#38bdf8,color:#dde2f0\n\
    style D fill:#1c2030,stroke:#f7a94b,color:#dde2f0\n</div>\n<div class=\"cb\">\n\
    <div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — LANGGRAPH\
    \ AGENT WITH TOOL USE\n        </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n \
    \         Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">from</span>\
    \ langgraph.graph <span class=\"kw\">import</span> StateGraph, END\n<span class=\"\
    kw\">from</span> langgraph.prebuilt <span class=\"kw\">import</span> ToolNode\n\
    <span class=\"kw\">from</span> langchain_openai <span class=\"kw\">import</span>\
    \ ChatOpenAI\n<span class=\"kw\">from</span> langchain_core.tools <span class=\"\
    kw\">import</span> tool\n<span class=\"kw\">from</span> typing <span class=\"\
    kw\">import</span> TypedDict, List, Annotated\n<span class=\"kw\">import</span>\
    \ operator\n\n<span class=\"cm\"># 1. Define state schema</span>\n<span class=\"\
    kw\">class</span> <span class=\"cls\">AgentState</span>(TypedDict):\n    messages:\
    \ Annotated[<span class=\"str\">\"list, operator.add\"</span>]  <span class=\"\
    cm\"># messages accumulate with +</span>\n\n<span class=\"cm\"># 2. Define tools</span>\n\
    @tool\n<span class=\"kw\">def</span> <span class=\"fn\">search_web</span>(query:\
    \ str) -&gt; str:\n    <span class=\"str\">\"\"\"Search the web for current information.\
    \ Returns a snippet.\"\"\"</span>\n    <span class=\"kw\">return</span> <span\
    \ class=\"str\">f\"Web result for '</span>{query}<span class=\"str\">': [mock\
    \ result]\"</span>\n\ntools = [search_web]\nllm   = <span class=\"fn\">ChatOpenAI</span>(model=<span\
    \ class=\"str\">\"gpt-4o-mini\"</span>).<span class=\"fn\">bind_tools</span>(tools)\n\
    \n<span class=\"cm\"># 3. Define node functions</span>\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">agent_node</span>(state: AgentState) -&gt; AgentState:\n\
    \    <span class=\"str\">\"\"\"The LLM decides: answer directly or call a tool.\"\
    \"\"</span>\n    response = llm.<span class=\"fn\">invoke</span>(state[<span class=\"\
    str\">\"\\\"messages\\\"\"</span>])\n    <span class=\"kw\">return</span> {<span\
    \ class=\"str\">\"messages\"</span>: [response]}\n\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">should_use_tools</span>(state: AgentState) -&gt; str:\n \
    \   <span class=\"str\">\"\"\"Routing function: did the LLM call a tool?\"\"\"\
    </span>\n    last = state[<span class=\"str\">\"\\\"messages\\\"\"</span>][-<span\
    \ class=\"num\">1</span>]\n    <span class=\"kw\">return</span> <span class=\"\
    str\">\"tool_node\" if hasattr(last, \"tool_calls\") and last.tool_calls else\
    \ \"end\"</span>\n\n<span class=\"cm\"># 4. Build the graph</span>\ngraph = <span\
    \ class=\"fn\">StateGraph</span>(AgentState)\ngraph.<span class=\"fn\">add_node</span>(<span\
    \ class=\"str\">\"agent\"</span>, agent_node)\ngraph.<span class=\"fn\">add_node</span>(<span\
    \ class=\"str\">\"tool_node\"</span>, <span class=\"fn\">ToolNode</span>(tools))\n\
    \ngraph.<span class=\"fn\">set_entry_point</span>(<span class=\"str\">\"agent\"\
    </span>)\ngraph.<span class=\"fn\">add_conditional_edges</span>(<span class=\"\
    str\">\"agent\"</span>, should_use_tools, {\n    <span class=\"str\">\"tool_node\"\
    : \"tool_node\"</span>,\n    <span class=\"str\">\"end\"</span>:       END,\n\
    })\ngraph.<span class=\"fn\">add_edge</span>(<span class=\"str\">\"tool_node\"\
    , \"agent\"</span>)  <span class=\"cm\"># tool result → back to agent</span>\n\
    app = graph.<span class=\"fn\">compile</span>()\n\n<span class=\"cm\"># 5. Run\
    \ the agent</span>\n<span class=\"kw\">from</span> langchain_core.messages <span\
    \ class=\"kw\">import</span> HumanMessage\nresult = app.<span class=\"fn\">invoke</span>({<span\
    \ class=\"str\">\"messages\": [HumanMessage(content=\"What is today'</span>s top\
    \ AI news?\")]})\n<span class=\"fn\">print</span>(result[<span class=\"str\">\"\
    \\\"messages\\\"\"</span>][-<span class=\"num\">1</span>].content)</pre>\n</div>\n\
    <h3 class=\"sh3\">\n       3. Human-in-the-Loop with LangGraph Interrupts\n  \
    \    </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       LangGraph interrupts pause agent execution before\
    \ high-risk states, requesting human confirmation before executing tool calls.\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         PYTHON — LANGGRAPH INTERRUPT FOR APPROVAL\n        </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n         \
    \ copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">from</span> langgraph.checkpoint.memory <span class=\"\
    kw\">import</span> MemorySaver\n\n<span class=\"cm\"># compile with checkpointer\
    \ for persistence and interrupts</span>\nmemory = <span class=\"fn\">MemorySaver</span>()\n\
    app_with_interrupt = graph.<span class=\"fn\">compile</span>(\n    checkpointer=memory,\n\
    \    interrupt_before=[<span class=\"str\">\"tool_node\"</span>]  <span class=\"\
    cm\"># pause BEFORE executing tools</span>\n)\n\nconfig = {<span class=\"str\"\
    >\"configurable\": {\"thread_id\": \"session-1\"</span>}}\n\n<span class=\"cm\"\
    ># Run until interrupt</span>\nresult = app_with_interrupt.<span class=\"fn\"\
    >invoke</span>(\n    {<span class=\"str\">\"messages\": [HumanMessage(\"Search\
    \ for: latest NVIDIA GPU release\"</span>)]},\n    config=config\n)\n\n<span class=\"\
    cm\"># At this point execution STOPPED before tool_node</span>\n<span class=\"\
    cm\"># Current state shows what tool the agent wants to call</span>\nstate = app_with_interrupt.<span\
    \ class=\"fn\">get_state</span>(config)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Agent wants to call:\"</span>, state.next)\n\n<span class=\"\
    cm\"># Human approval step</span>\nhuman_input = <span class=\"fn\">input</span>(<span\
    \ class=\"str\">\"Approve this tool call? (y/n): \"</span>)\n<span class=\"kw\"\
    >if</span> human_input == <span class=\"str\">\"y\"</span>:\n    <span class=\"\
    cm\"># Resume execution from the checkpoint</span>\n    result = app_with_interrupt.<span\
    \ class=\"fn\">invoke</span>(<span class=\"kw\">None</span>, config=config)\n\
    \    <span class=\"fn\">print</span>(result[<span class=\"str\">\"\\\"messages\\\
    \"\"</span>][-<span class=\"num\">1</span>].content)\n<span class=\"kw\">else</span>:\n\
    \    <span class=\"fn\">print</span>(<span class=\"str\">\"Tool call rejected.\"\
    </span>)</pre>\n</div>\n<h3 class=\"sh3\">\n       4. AutoGen — Multi-Agent Conversations\n\
    \      </h3>\n<p>\n       AutoGen uses a\n       <strong>\n        conversational\
    \ paradigm\n       </strong>\n       — agents take turns sending messages. A GroupChat\
    \ manager routes messages to the right agent. Perfect for open-ended collaborative\
    \ tasks like code generation + review + execution.\n      </p>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — AUTOGEN\
    \ GROUP CHAT\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><span class=\"cm\"># pip install pyautogen</span>\n\
    <span class=\"kw\">import</span> autogen\n\nconfig_list = [{<span class=\"str\"\
    >\"model\": \"gpt-4o-mini\", \"api_key\": \"sk-...\"</span>}]\nllm_cfg = {<span\
    \ class=\"str\">\"config_list\": config_list, \"temperature\"</span>: <span class=\"\
    num\">0</span>}\n\n<span class=\"cm\"># Define specialized agents</span>\nuser_proxy\
    \ = autogen.<span class=\"fn\">UserProxyAgent</span>(\n    name=<span class=\"\
    str\">\"User\"</span>,\n    human_input_mode=<span class=\"str\">\"TERMINATE\"\
    </span>,        <span class=\"cm\"># only ask for input on TERMINATE</span>\n\
    \    max_consecutive_auto_reply=<span class=\"num\">10</span>,\n    code_execution_config={<span\
    \ class=\"str\">\"use_docker\"</span>: <span class=\"kw\">False</span>},\n)\n\n\
    researcher = autogen.<span class=\"fn\">AssistantAgent</span>(\n    name=<span\
    \ class=\"str\">\"Researcher\"</span>,\n    llm_config=llm_cfg,\n    system_message=<span\
    \ class=\"str\">\"You research topics and provide factual summaries. Never write\
    \ code.\"</span>\n)\n\ncoder = autogen.<span class=\"fn\">AssistantAgent</span>(\n\
    \    name=<span class=\"str\">\"Coder\"</span>,\n    llm_config=llm_cfg,\n   \
    \ system_message=<span class=\"str\">\"You write clean Python code based on requirements.\
    \ Always include docstrings.\"</span>\n)\n\ncritic = autogen.<span class=\"fn\"\
    >AssistantAgent</span>(\n    name=<span class=\"str\">\"Critic\"</span>,\n   \
    \ llm_config=llm_cfg,\n    system_message=<span class=\"str\">\"You review code\
    \ and research for errors, edge cases, and improvements. Be specific.\"</span>\n\
    )\n\n<span class=\"cm\"># GroupChat manages turn-taking</span>\ngroup_chat = autogen.<span\
    \ class=\"fn\">GroupChat</span>(\n    agents=[user_proxy, researcher, coder, critic],\n\
    \    messages=[],\n    max_round=<span class=\"num\">12</span>,\n    speaker_selection_method=<span\
    \ class=\"str\">\"auto\"</span>   <span class=\"cm\"># LLM decides who speaks\
    \ next</span>\n)\nmanager = autogen.<span class=\"fn\">GroupChatManager</span>(groupchat=group_chat,\
    \ llm_config=llm_cfg)\n\n<span class=\"cm\"># Start the conversation</span>\n\
    user_proxy.<span class=\"fn\">initiate_chat</span>(\n    manager,\n    message=<span\
    \ class=\"str\">\"Research best practices for Python error handling, then write\
    \ a production-grade decorator that retries functions on exception with exponential\
    \ backoff, then review it.\"</span>\n)</pre>\n</div>\n\n<!-- /theory -->\n<h2\
    \ class=\"sh2\">\n       ⚡ Tasks\n      </h2>"
