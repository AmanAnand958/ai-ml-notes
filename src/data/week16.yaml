    correct_fb: ✅ Exactly. Principle of Least Privilege applied to AI agents. A prompt injection attack could trick the AI
      into executing "DROP TABLE users" if write access is granted. Start with read-only, add write access only for specific
      operations with explicit human confirmation. Treat the AI as an.
