  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">1. The LLM Evaluation Problem</h3>\n\
    <p>Traditional ML evaluation is simple: compare model predictions against ground-truth labels with F1, RMSE, or accuracy.\
    \ LLMs break this entirely — there is no single correct answer. \"Paris is the capital of France\" and \"The capital of\
    \ France is Paris\" are both correct but share no common n-grams. BLEU and ROUGE scores are therefore meaningless for\
    \ generative LLMs. We need <strong>semantic evaluation powered by another LLM</strong>.</p>\n<h3 class=\"sh3\">2. RAGAS\
    \ — Automated RAG Pipeline Evaluation</h3>\n<p>RAGAS evaluates the three components of a RAG system independently: the\
    \ <em>retriever</em>, the <em>generator</em>, and the end-to-end <em>answer quality</em>. Each metric is computed by a\
    \ judge LLM (GPT-4o by default) using carefully designed evaluation prompts.</p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    ><span class=\"cb-lang\">python</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n\
    <pre><code class=\"language-python\">from ragas import evaluate\nfrom ragas.metrics import (\n    faithfulness,      \
    \  # Does the answer stick to the retrieved context?\n    answer_relevancy,   # Does the answer address the actual question?\n\
    \    context_precision,  # Are the retrieved chunks actually relevant?\n    context_recall,     # Did we retrieve all\
    \ the necessary information?\n    answer_correctness, # How accurate is the answer vs. ground truth?\n)\nfrom datasets\
    \ import Dataset\n\n# Evaluation dataset format — collect from production logs\neval_dataset = Dataset.from_dict({\n \
    \   \"question\":     [\"What is PagedAttention?\", \"What is vLLM?\"],\n    \"contexts\":     [\n        [\"PagedAttention\
    \ manages KV cache like virtual memory pages in an OS.\"],\n        [\"vLLM is a high-throughput LLM serving library with\
    \ PagedAttention.\"]\n    ],\n    \"answer\":       [\n        \"PagedAttention eliminates GPU memory fragmentation by\
    \ paging KV cache blocks.\",\n        \"vLLM is a fast LLM serving system that uses PagedAttention for memory efficiency.\"\
    \n    ],\n    \"ground_truth\": [\n        \"PagedAttention is a memory-efficient attention algorithm for LLM serving.\"\
    ,\n        \"vLLM is an open-source library for efficient LLM inference and serving.\"\n    ]\n})\n\nresults = evaluate(\n\
    \    eval_dataset,\n    metrics=[faithfulness, answer_relevancy, context_precision, context_recall, answer_correctness]\n\
    )\nprint(results)\n# {'faithfulness': 0.92, 'answer_relevancy': 0.87, 'context_precision': 0.83,\n#  'context_recall':\
    \ 0.91, 'answer_correctness': 0.78}</code></pre>\n</div>\n<h3 class=\"sh3\">3. RAGAS Metric Definitions</h3>\n<table class=\"\
    concept-table\">\n<tr><th>Metric</th><th>Formula (Intuition)</th><th>What It Catches</th></tr>\n<tr><td><strong>Faithfulness</strong></td><td>Supported\
    \ claims ÷ Total claims in answer</td><td>Hallucinations: answer says things not grounded in context</td></tr>\n<tr><td><strong>Answer\
    \ Relevancy</strong></td><td>Cosine similarity(question, answer)</td><td>Off-topic responses: model answered a different\
    \ question</td></tr>\n<tr><td><strong>Context Precision</strong></td><td>Relevant chunks ÷ Total chunks retrieved</td><td>Retriever\
    \ noise: irrelevant chunks diluting the context</td></tr>\n<tr><td><strong>Context Recall</strong></td><td>Required info\
    \ retrieved ÷ Total required info</td><td>Retriever gaps: missing key evidence</td></tr>\n<tr><td><strong>Answer Correctness</strong></td><td>Semantic\
    \ F1(answer, ground_truth)</td><td>End-to-end accuracy vs. human-written reference</td></tr>\n</table>\n<h3 class=\"sh3\"\
    >4. TruLens — Real-Time Evaluation on Any LLM App</h3>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\"\
    >python</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n\
    <pre><code class=\"language-python\">from trulens_eval import TruChain, Feedback, Tru\nfrom trulens_eval.feedback.provider\
    \ import OpenAI as TruOpenAI\n\ntru = Tru()\ntru.reset_database()\nopenai_provider = TruOpenAI()\n\n# Define feedback\
    \ functions (what to evaluate)\nf_relevance = Feedback(\n    openai_provider.relevance_with_cot_reasons,\n    name=\"\
    Answer Relevance\"\n).on_input_output()  # Takes (question, answer) as input\n\nf_groundedness = Feedback(\n    openai_provider.groundedness_measure_with_cot_reasons,\n\
    \    name=\"Groundedness\"\n).on_input_output()\n\n# Wrap any LangChain chain\ntru_chain = TruChain(\n    my_rag_chain,\
    \        # Your LangChain chain object\n    app_id=\"rag-prod-v2\",\n    feedbacks=[f_relevance, f_groundedness]\n)\n\n\
    # Every invocation now records automatic feedback scores\nwith tru_chain as recording:\n    response = my_rag_chain.invoke(\"\
    What is vLLM?\")\n\n# Launch interactive dashboard at http://localhost:8501\ntru.run_dashboard()</code></pre>\n</div>\n\
    <h3 class=\"sh3\">5. LLM-as-a-Judge Scoring Mechanism</h3>\n<p>The judge LLM receives a structured prompt instructing\
    \ it to decompose and score an answer. The key insight is <strong>chain-of-thought reasoning</strong> before scoring dramatically\
    \ improves reliability:</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">text</span><div class=\"\
    cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-text\"\
    >FAITHFULNESS JUDGE PROMPT:\nGiven context: {context}\nGiven answer: {answer}\n\nStep 1: List every factual claim made\
    \ in the answer.\nStep 2: For each claim, determine if it is DIRECTLY SUPPORTED by the context.\nStep 3: Score = number_of_supported_claims\
    \ / total_claims.\n\nSupported claims: [claim 1: YES, claim 2: NO, ...]\nFinal score: 0.XX</code></pre>\n</div>\n<h3 class=\"\
    sh3\">6. Evaluation Pipeline Best Practices</h3>\n<div class=\"callout ct\">\n<strong>Production Evaluation Strategy:</strong>\n\
    <ul>\n<li><strong>Golden dataset:</strong> Maintain 200–500 Q&amp;A pairs with human-verified ground truths — update quarterly</li>\n\
    <li><strong>CI/CD gate:</strong> Run RAGAS on golden set in every PR. Block merge if faithfulness &lt; 0.80</li>\n<li><strong>Shadow\
    \ evaluation:</strong> Run TruLens on 10% of live traffic to catch distribution shift without user impact</li>\n<li><strong>Human-in-the-loop:</strong>\
    \ Automatically flag samples with any score &lt; 0.6 for human review; add corrected versions to golden set</li>\n</ul>\n\
    </div>\n<!-- /theory -->\n<!-- /theory -->\n<!-- /theory -->\n<h2 class=\"sh2\">\n       ⚡ Tasks\n      </h2>\n<div style=\"\
    font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\">\n       \U0001F50D\
    \n       <strong>\n        Search terms:\n       </strong>\n\n        docker compose multi container environment yaml,\
    \ docker compose volume mounts relative paths\n       \n</div>\n<div class=\"resource-section\" style=\"margin-top:1.5rem;\"\
    >\n<h3> style=\"font-size:14px; font-weight:700; color:var(--text); margin-bottom:10px;\"&gt;\n        \U0001F4DA Recommended\
    \ Resources\n       </h3>\n</div>\n<!-- ═══════════ DAY 117 ═══════════ -->\n<!-- /day-116 -->\n"
