  - 'Week 16 Capstone: Product'
  hinglish: 'Gradient checkpointing: intermediate activations mat save karo, backward
    pass mein recompute karo. Memory 5-10x reduce hoti hai at cost of 30-40% slower
    training. Large models ke liye essential!'
  analogy: 'MCP ko samjho jaise IFTTT (If This Then That) ka enterprise version: pehle
    har AI tool ke liye alag integration banana padta tha (jaise pehle har phone ka
    alag charger hota tha). MCP ek common interface hai — ek baar server banao, har
    compatible AI client use kar sakta hai. USB-C moment of AI tooling.'
  theory_html: "<h3 class=\"sh3\">\n       1. What Problem Does MCP Solve?\n     \
    \ </h3>\n<p>\n       Before MCP: every AI app had to write custom integrations\
    \ for every tool. A coding assistant that wants to read files, run tests, and\
    \ query a database needed three separate bespoke implementations. With MCP: any\
    \ MCP-compatible client (Claude, Cursor, VS Code Copilot) can use any MCP server\
    \ — one standard, unlimited integrations.\n      </p>\n<div class=\"mermaid\"\
    >\ngraph LR\n  A[\"Claude / Cursor / IDE\"] --&gt;|MCP Protocol| B[\"MCP Server:\
    \ Files\"]\n  A --&gt;|MCP Protocol| C[\"MCP Server: Database\"]\n  A --&gt;|MCP\
    \ Protocol| D[\"MCP Server: GitHub\"]\n  A --&gt;|MCP Protocol| E[\"Your Custom\
    \ MCP Server\"]\nstyle A fill:#1c2030,stroke:#b47cfc,color:#dde2f0\nstyle B fill:#1c2030,stroke:#38bdf8,color:#dde2f0\n\
    style C fill:#1c2030,stroke:#4fd1a5,color:#dde2f0\nstyle D fill:#1c2030,stroke:#f7a94b,color:#dde2f0\n\
    style E fill:#1c2030,stroke:#e56b8c,color:#dde2f0\n</div>\n<h3 class=\"sh3\">\n\
    \       2. MCP Primitives\n      </h3>\n<div class=\"table-wrap\" style=\"overflow-x:\
    \ auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n\
    <th>\n         Primitive\n        </th>\n<th>\n         What It Is\n        </th>\n\
    <th>\n         Example\n        </th>\n<th>\n         Who Calls It\n        </th>\n\
    </tr>\n<tr>\n<td>\n<strong>\n          Tools\n         </strong>\n</td>\n<td>\n\
    \         Functions the AI can call to perform actions\n        </td>\n<td>\n\
    \         read_file(), run_query(), send_email()\n        </td>\n<td>\n      \
    \   AI (with user permission)\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n  \
    \        Resources\n         </strong>\n</td>\n<td>\n         Data the AI can\
    \ read (like GET endpoints)\n        </td>\n<td>\n         project://README.md,\
    \ db://schema\n        </td>\n<td>\n         AI (read-only)\n        </td>\n</tr>\n\
    <tr>\n<td>\n<strong>\n          Prompts\n         </strong>\n</td>\n<td>\n   \
    \      Pre-built prompt templates for common tasks\n        </td>\n<td>\n    \
    \     \"summarise_document\", \"code_review\"\n        </td>\n<td>\n         User\
    \ (triggers template)\n        </td>\n</tr>\n</table></div>\n<h3 class=\"sh3\"\
    >\n       3. Building a Custom MCP Server\n      </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       Model Context\
    \ Protocol (MCP) servers expose local filesystem tools or databases to LLM agents\
    \ using standard protocol exchanges.\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — MCP SERVER WITH TOOLS\
    \ &amp; RESOURCES\n        </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n \
    \         Run\n         </button>\n</div>\n</div>\n<pre><span class=\"cm\"># pip\
    \ install mcp</span>\n<span class=\"kw\">from</span> mcp.server <span class=\"\
    kw\">import</span> Server\n<span class=\"kw\">from</span> mcp.server.stdio <span\
    \ class=\"kw\">import</span> stdio_server\n<span class=\"kw\">from</span> mcp\
    \ <span class=\"kw\">import</span> types\n<span class=\"kw\">import</span> json,\
    \ sqlite3, asyncio\n<span class=\"kw\">from</span> pathlib <span class=\"kw\"\
    >import</span> Path\n\nserver = <span class=\"fn\">Server</span>(<span class=\"\
    str\">\"my-data-server\"</span>)\n\n<span class=\"cm\"># --- TOOL: Execute a safe\
    \ read-only SQL query ---</span>\n@server.<span class=\"fn\">call_tool</span>()\n\
    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\"\
    >query_database</span>(name: str, arguments: dict) -&gt; list[types.TextContent]:\n\
    \    <span class=\"kw\">if</span> name != <span class=\"str\">\"query_database\"\
    </span>:\n        <span class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(<span\
    \ class=\"str\">f\"Unknown tool: {name}\"</span>)\n    sql = arguments.<span class=\"\
    fn\">get</span>(<span class=\"str\">\"sql\", \"\"</span>)\n    <span class=\"\
    cm\"># Safety: only allow SELECT statements</span>\n    <span class=\"kw\">if</span>\
    \ <span class=\"kw\">not</span> sql.<span class=\"fn\">strip</span>().<span class=\"\
    fn\">upper</span>().<span class=\"fn\">startswith</span>(<span class=\"str\">\"\
    SELECT\"</span>):\n        <span class=\"kw\">return</span> [types.<span class=\"\
    fn\">TextContent</span>(type=<span class=\"str\">\"text\", text=\"Error: only\
    \ SELECT queries allowed\"</span>)]\n    conn = sqlite3.<span class=\"fn\">connect</span>(arguments.<span\
    \ class=\"fn\">get</span>(<span class=\"str\">\"db_path\", \"data.db\"</span>))\n\
    \    cursor = conn.<span class=\"fn\">execute</span>(sql)\n    rows = cursor.<span\
    \ class=\"fn\">fetchall</span>()\n    cols = [d[<span class=\"str\">\"0\"</span>]\
    \ <span class=\"kw\">for</span> d <span class=\"kw\">in</span> cursor.description]\n\
    \    result = json.<span class=\"fn\">dumps</span>({<span class=\"str\">\"columns\"\
    : cols, \"rows\": rows[\":50\"</span>]}, indent=<span class=\"num\">2</span>)\n\
    \    <span class=\"kw\">return</span> [types.<span class=\"fn\">TextContent</span>(type=<span\
    \ class=\"str\">\"text\"</span>, text=result)]\n\n<span class=\"cm\"># --- List\
    \ available tools ---</span>\n@server.<span class=\"fn\">list_tools</span>()\n\
    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\"\
    >list_tools</span>() -&gt; list[types.Tool]:\n    <span class=\"kw\">return</span>\
    \ [\n        types.<span class=\"fn\">Tool</span>(\n            name=<span class=\"\
    str\">\"query_database\"</span>,\n            description=<span class=\"str\"\
    >\"Execute a read-only SQL SELECT query against a SQLite database.\"</span>,\n\
    \            inputSchema={\n                <span class=\"str\">\"type\": \"object\"\
    </span>,\n                <span class=\"str\">\"properties\"</span>: {\n     \
    \               <span class=\"str\">\"sql\":     {\"type\": \"string\", \"description\"\
    : \"SQL SELECT statement\"</span>},\n                    <span class=\"str\">\"\
    db_path\": {\"type\": \"string\", \"description\": \"Path to SQLite file\"</span>}\n\
    \                },\n                <span class=\"str\">\"required\": [\"sql\"\
    </span>]\n            }\n        )\n    ]\n\n<span class=\"cm\"># --- RESOURCE:\
    \ Expose files in a directory ---</span>\n@server.<span class=\"fn\">list_resources</span>()\n\
    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\"\
    >list_resources</span>() -&gt; list[types.Resource]:\n    resources = []\n   \
    \ <span class=\"kw\">for</span> f <span class=\"kw\">in</span> <span class=\"\
    fn\">Path</span>(<span class=\"str\">\"./docs\").glob(\"*.md\"</span>):\n    \
    \    resources.<span class=\"fn\">append</span>(types.<span class=\"fn\">Resource</span>(\n\
    \            uri=<span class=\"str\">f\"file://{f.resolve()}\"</span>,\n     \
    \       name=f.name,\n            description=<span class=\"str\">f\"Markdown\
    \ file: {f.name}\"</span>,\n            mimeType=<span class=\"str\">\"text/markdown\"\
    </span>\n        ))\n    <span class=\"kw\">return</span> resources\n\n@server.<span\
    \ class=\"fn\">read_resource</span>()\n<span class=\"kw\">async</span> <span class=\"\
    kw\">def</span> <span class=\"fn\">read_resource</span>(uri: str) -&gt; str:\n\
    \    path = uri.<span class=\"fn\">replace</span>(<span class=\"str\">\"file://\"\
    , \"\"</span>)\n    <span class=\"kw\">return</span> <span class=\"fn\">Path</span>(path).<span\
    \ class=\"fn\">read_text</span>()\n\n<span class=\"cm\"># Run the server over\
    \ stdio (Claude Desktop communicates via stdin/stdout)</span>\n<span class=\"\
    kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n    asyncio.<span\
    \ class=\"fn\">run</span>(<span class=\"fn\">stdio_server</span>(server))</pre>\n\
    </div>\n<h3 class=\"sh3\">\n       4. Connecting to Claude Desktop\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       Integrating custom MCP servers with Claude Desktop enables interactive\
    \ assistants to run local filesystem actions on user commands.\n      </p>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         JSON\
    \ — CLAUDE DESKTOP CONFIG (~/.config/claude/claude_desktop_config.json)\n    \
    \    </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre>{\n  <span class=\"str\">\"mcpServers\"</span>: {\n    <span class=\"str\"\
    >\"my-data-server\"</span>: {\n      <span class=\"str\">\"command\": \"python\"\
    </span>,\n      <span class=\"str\">\"args\": [\"/absolute/path/to/my_mcp_server.py\"\
    </span>],\n      <span class=\"str\">\"env\"</span>: {\n        <span class=\"\
    str\">\"DB_PATH\": \"/path/to/your/database.db\"</span>\n      }\n    },\n   \
    \ <span class=\"str\">\"filesystem\"</span>: {\n      <span class=\"str\">\"command\"\
    : \"npx\"</span>,\n      <span class=\"str\">\"args\": [\"-y\", \"@modelcontextprotocol/server-filesystem\"\
    , \"/Users/yourname/Documents\"</span>]\n    }\n  }\n}</pre>\n</div>\n<h3 class=\"\
    sh3\">\n       5. Ecosystem — Popular Community MCP Servers\n      </h3>\n<div\
    \ class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"\
