    \ mein hota hai — Excel toh crash ho jata hai, Pandas nahi."
  theory_html: "<h3 class=\"sh3\">\n       1. Why Pandas? The Data Science Workhorse\n\
    \      </h3>\n\n<p>\n       Pandas has two core data structures:\n       <strong>\n\
    \        Series\n       </strong>\n       (1D — like a single column) and\n  \
    \     <strong>\n        DataFrame\n       </strong>\n       (2D — like a full\
    \ spreadsheet).\n      </p>\n<p>\n       Almost all ML workflows start with loading\
    \ a DataFrame from a CSV file.\n      </p>\n<div class=\"mermaid\">\ngraph LR\n\
    subgraph \"Series (1D Labeled Array)\"\n  S_Idx[\"Index\"] --- S_Val[\"Values\"\
    ]\n  S_Idx0[\"0\"] --&gt; S_Val0[\"85\"]\n  S_Idx1[\"1\"] --&gt; S_Val1[\"92\"\
    ]\n  S_Idx2[\"2\"] --&gt; S_Val2[\"78\"]\nend\nsubgraph \"DataFrame (2D Tabular\
    \ Structure)\"\n  DF_Index[\"Index\"]\n  DF_Col1[\"Name\"]\n  DF_Col2[\"Age\"\
    ]\n  DF_Col3[\"City\"]\n  DF_Index --&gt; DF_Row0[\"0\"]\n  DF_Row0 --&gt; DF_R0C1[\"\
    Rahul\"]\n  DF_Row0 --&gt; DF_R0C2[\"22\"]\n  DF_Row0 --&gt; DF_R0C3[\"Mumbai\"\
    ]\n  DF_Index --&gt; DF_Row1[\"1\"]\n  DF_Row1 --&gt; DF_R1C1[\"Priya\"]\n  DF_Row1\
    \ --&gt; DF_R1C2[\"24\"]\n  DF_Row1 --&gt; DF_R1C3[\"Delhi\"]\nend\n</div>\n<div\
    \ class=\"diagram-cap\">\n       Series (1D column representation) vs. DataFrame\
    \ (2D table structure with multiple columns).\n      </div>\n<div class=\"ml-connect\"\
    >\n       In ML, your dataset IS a DataFrame.\n       <br/>\n<br/>\n       Features\
    \ (columns) go into X, target (label column) goes into y.\n       <br/>\n<br/>\n\
    \       Understanding DataFrame operations like iloc, loc, and boolean indexing\
    \ is essential before you can split data for training.\n      </div>\n<h3 class=\"\
    sh3\">\n       2. Series — A Labeled 1D Array\n      </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       A Pandas\
    \ Series is a one-dimensional array-like object that contains a sequence of values\
    \ associated with a labeling array, called its index.\n      </p>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — series_basics.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"run-btn\" onclick=\"\
    openRepl()\">\n          ▶ try online\n         </button>\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> pandas\
    \ <span class=\"kw\">as</span> pd\n\n<span class=\"cm\"># Create a Series from\
    \ a list — auto-indexed 0,1,2...</span>\nscores = pd.<span class=\"fn\">Series</span>([<span\
    \ class=\"num\">85</span>, <span class=\"num\">92</span>, <span class=\"num\"\
    >78</span>, <span class=\"num\">95</span>, <span class=\"num\">88</span>])\n<span\
    \ class=\"fn\">print</span>(scores)\n<span class=\"cm\"># 0    85</span>\n<span\
    \ class=\"cm\"># 1    92  (left = index, right = value)</span>\n<span class=\"\
    cm\"># 2    78</span>\n<span class=\"cm\"># dtype: int64</span>\n\n<span class=\"\
    cm\"># Custom index (like a labeled Excel column)</span>\nstudent_scores = pd.<span\
    \ class=\"fn\">Series</span>(\n    [<span class=\"num\">85</span>, <span class=\"\
    num\">92</span>, <span class=\"num\">78</span>],\n    index=[<span class=\"str\"\
    >\"Rahul\", \"Priya\", \"Arjun\"</span>]\n)\n<span class=\"fn\">print</span>(student_scores[<span\
    \ class=\"str\">\"Priya\"</span>])  <span class=\"cm\"># 92</span>\n<span class=\"\
    fn\">print</span>(student_scores.<span class=\"fn\">mean</span>())    <span class=\"\
    cm\"># 85.0</span>\n<span class=\"fn\">print</span>(student_scores.<span class=\"\
    fn\">max</span>())     <span class=\"cm\"># 92</span></pre>\n</div>\n<h3 class=\"\
    sh3\">\n       3. DataFrame — The Core Structure\n      </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       A DataFrame\
    \ represents a tabular, spreadsheet-like data structure containing an ordered\
    \ collection of columns, each of which can be a different value type.\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — dataframe_basics.py\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\"\
    >import</span> pandas <span class=\"kw\">as</span> pd\n\n<span class=\"cm\">#\
    \ Create DataFrame from a dictionary</span>\ndata = {\n    <span class=\"str\"\
    >\"name\":   [\"Rahul\", \"Priya\", \"Arjun\", \"Sneha\"</span>],\n    <span class=\"\
    str\">\"age\"</span>:    [<span class=\"num\">22</span>, <span class=\"num\">24</span>,\
    \ <span class=\"num\">21</span>, <span class=\"num\">23</span>],\n    <span class=\"\
    str\">\"city\":   [\"Mumbai\", \"Delhi\", \"Pune\", \"Bangalore\"</span>],\n \
    \   <span class=\"str\">\"salary\"</span>: [<span class=\"num\">50000</span>,\
    \ <span class=\"num\">65000</span>, <span class=\"num\">45000</span>, <span class=\"\
    num\">70000</span>]\n}\ndf = pd.<span class=\"fn\">DataFrame</span>(data)\n\n\
    <span class=\"cm\"># Essential exploration commands</span>\n<span class=\"fn\"\
    >print</span>(df.shape)        <span class=\"cm\"># (4, 4) — 4 rows, 4 columns</span>\n\
    <span class=\"fn\">print</span>(df.dtypes)       <span class=\"cm\"># shows data\
    \ type per column</span>\n<span class=\"fn\">print</span>(df.<span class=\"fn\"\
    >head</span>(<span class=\"num\">2</span>))      <span class=\"cm\"># first 2\
    \ rows</span>\n<span class=\"fn\">print</span>(df.<span class=\"fn\">tail</span>(<span\
    \ class=\"num\">2</span>))      <span class=\"cm\"># last 2 rows</span>\n<span\
    \ class=\"fn\">print</span>(df.<span class=\"fn\">info</span>())       <span class=\"\
    cm\"># column info + memory usage</span>\n<span class=\"fn\">print</span>(df.<span\
    \ class=\"fn\">describe</span>())   <span class=\"cm\"># stats: mean, std, min,\
    \ max...</span>\n<span class=\"fn\">print</span>(df.columns)      <span class=\"\
    cm\"># Index(['name', 'age', 'city', 'salary'])</span></pre>\n</div>\n<h3 class=\"\
    sh3\">\n       4. Selecting Data — iloc, loc, Boolean Indexing\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       Pandas offers optimized label-based selection using\n       \n     \
    \   loc\n       \n       , position-based selection using\n       \n        iloc\n\
    \       \n       , and conditional filtering using Boolean masks.\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — selection.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n \
    \         Run\n         </button>\n</div>\n</div>\n<pre><span class=\"cm\"># ---\
    \ Column selection ---</span>\n<span class=\"fn\">print</span>(df[<span class=\"\
    str\">\"name\"</span>])               <span class=\"cm\"># single column → Series</span>\n\
    <span class=\"fn\">print</span>(df[[<span class=\"str\">\"name\", \"salary\"</span>]])\
    \  <span class=\"cm\"># multiple columns → DataFrame</span>\n\n<span class=\"\
    cm\"># --- iloc: Integer-based (position) ---</span>\n<span class=\"fn\">print</span>(df.iloc[<span\
    \ class=\"num\">0</span>])         <span class=\"cm\"># row at position 0 (first\
    \ row)</span>\n<span class=\"fn\">print</span>(df.iloc[<span class=\"num\">0</span>,\
    \ <span class=\"num\">2</span>])      <span class=\"cm\"># row 0, column 2 → \"\
    Mumbai\"</span>\n<span class=\"fn\">print</span>(df.iloc[<span class=\"num\">1</span>:<span\
    \ class=\"num\">3</span>])       <span class=\"cm\"># rows 1 and 2 (slice)</span>\n\
    \n<span class=\"cm\"># --- loc: Label-based (use column name) ---</span>\n<span\
    \ class=\"fn\">print</span>(df.loc[<span class=\"num\">0</span>, <span class=\"\
    str\">\"name\"</span>])  <span class=\"cm\"># row 0, column \"name\" → \"Rahul\"\
    </span>\n<span class=\"fn\">print</span>(df.loc[:, <span class=\"str\">\"salary\"\
    </span>]) <span class=\"cm\"># all rows, salary column</span>\n\n<span class=\"\
    cm\"># --- Boolean indexing (most used in ML!) ---</span>\nhigh_earners = df[df[<span\
    \ class=\"str\">\"salary\"</span>] &gt; <span class=\"num\">55000</span>]\nmumbai_people\
    \ = df[df[<span class=\"str\">\"city\"] == \"Mumbai\"</span>]\nyoung_rich = df[(df[<span\
    \ class=\"str\">\"age\"] &lt; 24) &amp; (df[\"salary\"</span>] &gt; <span class=\"\
    num\">50000</span>)]</pre>\n</div>\n<h3 class=\"sh3\">\n       5. Loading Real\
    \ Data with pd.read_csv()\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       The\n       \n        pd.read_csv()\n\
    \       \n       function reads a comma-separated values (CSV) file into a Pandas\
    \ DataFrame, offering rich configuration parameters for parsing custom delimiters\
    \ and missing values.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — load_titanic.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\
    \n<span class=\"cm\"># Download Titanic.csv from: kaggle.com/c/titanic/data</span>\n\
    df = pd.<span class=\"fn\">read_csv</span>(<span class=\"str\">\"titanic.csv\"\
    </span>)\n\n<span class=\"fn\">print</span>(df.shape)           <span class=\"\
    cm\"># (891, 12) — 891 passengers, 12 cols</span>\n<span class=\"fn\">print</span>(df.<span\
    \ class=\"fn\">head</span>())          <span class=\"cm\"># first 5 rows</span>\n\
    <span class=\"fn\">print</span>(df.<span class=\"fn\">isnull</span>().<span class=\"\
    fn\">sum</span>())  <span class=\"cm\"># missing values per column</span>\n<span\
    \ class=\"fn\">print</span>(df[<span class=\"str\">\"Survived\"</span>].<span\
    \ class=\"fn\">value_counts</span>())  <span class=\"cm\"># 0=died, 1=survived</span>\n\
    \n<span class=\"cm\"># How many passengers survived?</span>\nsurvived = df[df[<span\
    \ class=\"str\">\"Survived\"</span>] == <span class=\"num\">1</span>]\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"Survived: {len(survived)} / {len(df)}\"\
    </span>)\nsurvival_rate = survived[<span class=\"str\">\"Survived\"</span>].<span\
    \ class=\"fn\">mean</span>() * <span class=\"num\">100</span>\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"Survival rate: {survival_rate:.1f}%\"\
    </span>)  <span class=\"cm\"># 38.4%</span></pre>\n</div>\n<h3 class=\"sh3\">\n\
    \       6. Concept Depth: Under the Hood\n      </h3>\n<div class=\"table-wrap\"\
    \ style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\"\
    >\n<tr>\n<th>\n         Tool\n        </th>\n<th>\n         Best For\n       \
    \ </th>\n<th>\n         Mental Model\n        </th>\n</tr>\n<tr>\n<td>\n     \
    \    Excel\n        </td>\n<td>\n         Manual analysis, small data\n      \
    \  </td>\n<td>\n         Visual, cell-based\n        </td>\n</tr>\n<tr>\n<td>\n\
    \         Pandas\n        </td>\n<td>\n         Medium datasets (fits in RAM),\
    \ complex cleaning\n        </td>\n<td>\n         Code-driven, vectorized\n  \
    \      </td>\n</tr>\n<tr>\n<td>\n         SQL\n        </td>\n<td>\n         Extracting\
    \ data from databases\n        </td>\n<td>\n         Declarative querying\n  \
    \      </td>\n</tr>\n<tr>\n<td>\n         Spark/Dask\n        </td>\n<td>\n  \
    \       Huge distributed data (Terabytes)\n        </td>\n<td>\n         Cluster\
    \ computing\n        </td>\n</tr>\n</table></div>\n<!-- SVG: iloc vs loc Selection\
    \ Mechanics -->\n<figure class=\"svg-diagram\">\n<svg aria-label=\"iloc vs loc\
    \ Selection Mechanics showing how loc references index labels and iloc references\
    \ integer positions\" height=\"240\" role=\"img\" viewbox=\"0 0 540 240\" width=\"\
    540\" xmlns=\"http://www.w3.org/2000/svg\">\n<!-- Grid Labels -->\n<text fill=\"\
    #4fd1a5\" font-family=\"DM Sans,sans-serif\" font-size=\"10\" font-weight=\"600\"\
    \ text-anchor=\"middle\" x=\"65\" y=\"35\">\n         loc (Labels)\n        </text>\n\
    <text fill=\"#6c8cff\" font-family=\"DM Sans,sans-serif\" font-size=\"10\" font-weight=\"\
    600\" text-anchor=\"middle\" x=\"180\" y=\"35\">\n         iloc (Integers)\n \
    \       </text>\n<text fill=\"#6b7590\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    11\" text-anchor=\"middle\" x=\"330\" y=\"35\">\n         DataFrame Rows (Data)\n\
    \        </text>\n<!-- Row 1: \"a\" / 0 -->\n<!-- loc label \"a\" -->\n<rect fill=\"\
    rgba(79, 209, 165, 0.08)\" height=\"40\" rx=\"6\" stroke=\"#4fd1a5\" stroke-width=\"\
    1.5\" width=\"80\" x=\"35\" y=\"55\">\n</rect>\n<text fill=\"#4fd1a5\" font-family=\"\
    IBM Plex Mono,monospace\" font-size=\"12\" font-weight=\"600\" text-anchor=\"\
    middle\" x=\"75\" y=\"80\">\n         \"a\"\n        </text>\n<!-- iloc integer\
    \ 0 -->\n<rect fill=\"rgba(108, 140, 255, 0.08)\" height=\"40\" rx=\"6\" stroke=\"\
    #6c8cff\" stroke-width=\"1.5\" width=\"50\" x=\"135\" y=\"55\">\n</rect>\n<text\
    \ fill=\"#6c8cff\" font-family=\"IBM Plex Mono,monospace\" font-size=\"12\" font-weight=\"\
    600\" text-anchor=\"middle\" x=\"160\" y=\"80\">\n         0\n        </text>\n\
    <!-- Data cell Rahul -->\n<rect fill=\"#1e2230\" height=\"40\" rx=\"6\" stroke=\"\
    #252a40\" stroke-width=\"1\" width=\"220\" x=\"220\" y=\"55\">\n</rect>\n<text\
    \ fill=\"#dde2f0\" font-family=\"IBM Plex Mono,monospace\" font-size=\"11\" text-anchor=\"\
    middle\" x=\"330\" y=\"79\">\n         \"Rahul\" | 50000\n        </text>\n<!--\
    \ Row 2: \"b\" / 1 -->\n<!-- loc label \"b\" -->\n<rect fill=\"rgba(79, 209, 165,\
    \ 0.08)\" height=\"40\" rx=\"6\" stroke=\"#4fd1a5\" stroke-width=\"1\" width=\"\
    80\" x=\"35\" y=\"110\">\n</rect>\n<text fill=\"#4fd1a5\" font-family=\"IBM Plex\
    \ Mono,monospace\" font-size=\"12\" text-anchor=\"middle\" x=\"75\" y=\"135\"\
    >\n         \"b\"\n        </text>\n<!-- iloc integer 1 -->\n<rect fill=\"rgba(108,\
    \ 140, 255, 0.08)\" height=\"40\" rx=\"6\" stroke=\"#6c8cff\" stroke-width=\"\
    1\" width=\"50\" x=\"135\" y=\"110\">\n</rect>\n<text fill=\"#6c8cff\" font-family=\"\
    IBM Plex Mono,monospace\" font-size=\"12\" text-anchor=\"middle\" x=\"160\" y=\"\
    135\">\n         1\n        </text>\n<!-- Data cell Priya -->\n<rect fill=\"#1e2230\"\
    \ height=\"40\" rx=\"6\" stroke=\"#252a40\" stroke-width=\"1\" width=\"220\" x=\"\
    220\" y=\"110\">\n</rect>\n<text fill=\"#dde2f0\" font-family=\"IBM Plex Mono,monospace\"\
    \ font-size=\"11\" text-anchor=\"middle\" x=\"330\" y=\"134\">\n         \"Priya\"\
    \ | 65000\n        </text>\n<!-- Row 3: \"c\" / 2 -->\n<!-- loc label \"c\" -->\n\
    <rect fill=\"rgba(79, 209, 165, 0.08)\" height=\"40\" rx=\"6\" stroke=\"#4fd1a5\"\
    \ stroke-width=\"1\" width=\"80\" x=\"35\" y=\"165\">\n</rect>\n<text fill=\"\
    #4fd1a5\" font-family=\"IBM Plex Mono,monospace\" font-size=\"12\" text-anchor=\"\
    middle\" x=\"75\" y=\"190\">\n         \"c\"\n        </text>\n<!-- iloc integer\
    \ 2 -->\n<rect fill=\"rgba(108, 140, 255, 0.08)\" height=\"40\" rx=\"6\" stroke=\"\
    #6c8cff\" stroke-width=\"1\" width=\"50\" x=\"135\" y=\"165\">\n</rect>\n<text\
    \ fill=\"#6c8cff\" font-family=\"IBM Plex Mono,monospace\" font-size=\"12\" text-anchor=\"\
    middle\" x=\"160\" y=\"190\">\n         2\n        </text>\n<!-- Data cell Arjun\
    \ -->\n<rect fill=\"#1e2230\" height=\"40\" rx=\"6\" stroke=\"#252a40\" stroke-width=\"\
    1\" width=\"220\" x=\"220\" y=\"165\">\n</rect>\n<text fill=\"#dde2f0\" font-family=\"\
    IBM Plex Mono,monospace\" font-size=\"11\" text-anchor=\"middle\" x=\"330\" y=\"\
    189\">\n         \"Arjun\" | 45000\n        </text>\n<!-- Connections &amp; Queries\
    \ -->\n<!-- loc query -->\n<path d=\"M 120,75 L 210,75\" stroke=\"#4fd1a5\" stroke-dasharray=\"\
    3,3\" stroke-width=\"1.5\">\n</path>\n<polygon fill=\"#4fd1a5\" points=\"215,75\
    \ 208,71 208,79\">\n</polygon>\n<text fill=\"#4fd1a5\" font-family=\"IBM Plex\
    \ Mono,monospace\" font-size=\"10\" font-weight=\"600\" x=\"450\" y=\"79\">\n\
    \         df.loc[\"a\"]\n        </text>\n<!-- iloc query -->\n<path d=\"M 195,130\
    \ L 210,130\" stroke=\"#6c8cff\" stroke-dasharray=\"3,3\" stroke-width=\"1.5\"\
    >\n</path>\n<polygon fill=\"#6c8cff\" points=\"215,130 208,126 208,134\">\n</polygon>\n\
    <text fill=\"#6c8cff\" font-family=\"IBM Plex Mono,monospace\" font-size=\"10\"\
    \ font-weight=\"600\" x=\"450\" y=\"134\">\n         df.iloc[1]\n        </text>\n\
    </svg>\n<figcaption>\n        iloc vs loc Selection Mechanics showing how loc\
    \ references index labels and iloc references integer positions.\n       </figcaption>\n\
    </figure>\n<div class=\"hinglish\">\n       \U0001F4A1 Ek line mein: DataFrame\
    \ = Excel ka sheet Python mein. iloc = position se select (0,1,2...), loc = label\
    \ se select (\"name\",\"age\").\n       <br/>\n<br/>\n       Boolean indexing\
    \ = conditions lagao jaise SQL WHERE clause.\n      </div>\n<h3 class=\"sh3\"\
    >\n       7. Sorting &amp; Frequency Analysis\n      </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       Sorting rows\
    \ based on values and computing value frequencies (using\n       \n        value_counts\n\
    \       \n       ) are crucial steps in initial data exploration and validation.\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — sorting_frequency.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"cm\"># sort_values — sort by one or more columns</span>\ndf.<span class=\"\
    fn\">sort_values</span>(<span class=\"str\">\"salary\"</span>, ascending=<span\
    \ class=\"kw\">False</span>)          <span class=\"cm\"># highest first</span>\n\
    df.<span class=\"fn\">sort_values</span>([<span class=\"str\">\"city\", \"salary\"\
    </span>], ascending=[<span class=\"kw\">True</span>, <span class=\"kw\">False</span>])\
    \  <span class=\"cm\"># multi-col sort</span>\n\n<span class=\"cm\"># sort_index\
    \ — sort by the index labels</span>\ndf.<span class=\"fn\">sort_index</span>()\
    \          <span class=\"cm\"># useful after groupby/reset_index shuffles rows</span>\n\
    df.<span class=\"fn\">sort_index</span>(ascending=<span class=\"kw\">False</span>)\n\
    \n<span class=\"cm\"># value_counts — frequency of each unique value</span>\n\
    df[<span class=\"str\">\"city\"</span>].<span class=\"fn\">value_counts</span>()\
    \           <span class=\"cm\"># sorted highest first by default</span>\ndf[<span\
    \ class=\"str\">\"city\"</span>].<span class=\"fn\">value_counts</span>(normalize=<span\
    \ class=\"kw\">True</span>)  <span class=\"cm\"># as proportions (0.0 → 1.0)</span>\n\
    df[<span class=\"str\">\"city\"</span>].<span class=\"fn\">value_counts</span>(dropna=<span\
    \ class=\"kw\">False</span>)   <span class=\"cm\"># include NaN count</span>\n\
    \n<span class=\"cm\"># nunique — count of distinct values (great for cardinality\
    \ check)</span>\ndf[<span class=\"str\">\"city\"</span>].<span class=\"fn\">nunique</span>()\
    \  <span class=\"cm\"># how many unique cities?</span>\ndf.<span class=\"fn\"\
    >nunique</span>()           <span class=\"cm\"># unique count for EVERY column\
    \ at once</span></pre>\n</div>\n<h3 class=\"sh3\">\n       8. Binning Continuous\
    \ Data — cut() and qcut()\n      </h3>\n\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — binning.py\n        </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\
    \n<span class=\"cm\"># cut() — fixed bin edges (YOU define the boundaries)</span>\n\
    df[<span class=\"str\">\"age_group\"</span>] = pd.<span class=\"fn\">cut</span>(\n\
    \    df[<span class=\"str\">\"age\"</span>],\n    bins=[<span class=\"num\">0</span>,\
    \ <span class=\"num\">18</span>, <span class=\"num\">35</span>, <span class=\"\
    num\">60</span>, <span class=\"num\">100</span>],\n    labels=[<span class=\"\
    str\">\"child\", \"young\", \"middle\", \"senior\"</span>]\n)\n\n<span class=\"\
    cm\"># qcut() — quantile-based cut (equal FREQUENCY in each bin)</span>\ndf[<span\
    \ class=\"str\">\"salary_quartile\"] = pd.qcut(df[\"salary\"</span>], q=<span\
    \ class=\"num\">4</span>,\n    labels=[<span class=\"str\">\"Q1\", \"Q2\", \"\
    Q3\", \"Q4\"</span>])\n\n<span class=\"cm\"># When to use which?</span>\n<span\
    \ class=\"cm\"># cut()  → you know domain boundaries (0-18 is minor, etc.)</span>\n\
    <span class=\"cm\"># qcut() → you want equal population in each bucket</span></pre>\n\
    </div>\n<div class=\"ml-connect\">\n       cut() and qcut() are core feature engineering\
    \ tools.\n       <br/>\n<br/>\n       Age groups, salary bands, and risk tiers\
    \ are all created this way before feeding data into ML models.\n      </div>\n\
    <h3 class=\"sh3\">\n       9. Slicing Caution: SettingWithCopyWarning &amp; .copy()\n\
    \      </h3>\n<p>\n       When you slice a subset of a DataFrame (e.g.\n     \
    \  \n        subset = df[df[\"salary\"] &gt; 55000]\n       \n       ) and then\
    \ try to modify it (e.g.\n       \n        subset[\"bonus\"] = 100\n       \n\
    \       ), Pandas will frequently throw a\n       \n        SettingWithCopyWarning\n\
    \       \n       .\n      </p>\n<p>\n       This happens because Pandas is unsure\
    \ whether your slice is a\n       <strong>\n        View\n       </strong>\n \
    \      (points to the original data) or a\n       <strong>\n        Copy\n   \
    \    </strong>\n       (a separate object in memory).\n      </p>\n<p>\n     \
    \  Modifying a view modifies the original, while modifying a copy does not.\n\
    \      </p>\n<p>\n<strong>\n        How to fix it:\n       </strong>\n       If\
    \ you want a completely independent copy to modify safely, explicitly use\n  \
    \     \n        .copy()\n       \n       :\n      </p>\n<div class=\"cb\">\n<div\
    \ class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — safe_copy.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"cm\"># Safe way to modify\
    \ a sliced subset without warnings</span>\nhigh_earners = df[df[<span class=\"\
    str\">\"salary\"</span>] &gt; <span class=\"num\">55000</span>].<span class=\"\
    fn\">copy</span>()\nhigh_earners[<span class=\"str\">\"bonus\"] = high_earners[\"\
    salary\"</span>] * <span class=\"num\">0.1</span>  <span class=\"cm\"># Safe!\
    \ No warning.</span>\n\n<span class=\"cm\"># If you WANT to modify the original\
    \ DataFrame, use .loc:</span>\ndf.loc[df[<span class=\"str\">\"salary\"] &gt;\
    \ 55000, \"bonus\"] = df[\"salary\"</span>] * <span class=\"num\">0.1</span> \
    \ <span class=\"cm\"># Safe and direct!</span></pre>\n</div>\n<h2 class=\"sh2\"\
    >\n       \U0001F52E Predict the Output\n      </h2>\n<h2 class=\"sh2\">\n   \
    \    \U0001F41B Find the Bug\n      </h2>\n<div class=\"debug-block\">\n<div class=\"\
