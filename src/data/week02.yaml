      \            <span class=\"kw\">if</span> c.name.<span class=\"fn\">lower</span>()\
      \ == name.<span class=\"fn\">lower</span>():\n                <span class=\"\
      kw\">self</span>.contacts.<span class=\"fn\">pop</span>(i)\n               \
      \ <span class=\"kw\">self</span>.<span class=\"fn\">save</span>(); <span class=\"\
      fn\">print</span>(<span class=\"str\">\"✅ Deleted!\"</span>); <span class=\"\
      kw\">return</span>\n        <span class=\"fn\">print</span>(<span class=\"str\"\
      >\"Contact not found!\"</span>)\n\n    <span class=\"kw\">def</span> <span class=\"\
      fn\">list_all</span>(<span class=\"kw\">self</span>):\n        <span class=\"\
      kw\">if</span> <span class=\"kw\">not</span> <span class=\"kw\">self</span>.contacts:\
      \ <span class=\"fn\">print</span>(<span class=\"str\">\"No contacts yet!\"</span>);\
      \ <span class=\"kw\">return</span>\n        <span class=\"kw\">for</span> c\
      \ <span class=\"kw\">in</span> <span class=\"fn\">sorted</span>(<span class=\"\
      kw\">self</span>.contacts, key=<span class=\"kw\">lambda</span> c: c.name):\
      \ <span class=\"fn\">print</span>(c)\n\n<span class=\"kw\">def</span> <span\
      \ class=\"fn\">main</span>():\n    book = <span class=\"fn\">ContactBook</span>()\n\
      \    menu = {<span class=\"str\">\"1\":book.add,\"2\":book.search,\"3\":book.delete,\"\
      4\"</span>:book.list_all}\n    <span class=\"kw\">while</span> <span class=\"\
      kw\">True</span>:\n        <span class=\"fn\">print</span>(<span class=\"str\"\
      >\"\\n\U0001F4D2 1.Add 2.Search 3.Delete 4.List 5.Exit\"</span>)\n        choice\
      \ = <span class=\"fn\">input</span>(<span class=\"str\">\"Choice: \"</span>).<span\
