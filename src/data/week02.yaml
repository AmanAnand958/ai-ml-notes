  hinglish: ".groupby()\n       \n       SQL ka GROUP BY hai Pandas mein. Iske saath\n       \n        .agg()\n       \n \
    \      lagao toh powerful aggregations ban jaate hain — mean, std, count sab ek saath!"
  analogy: Imagine student attendance register mein kuch din khali chhod diye. Aap kya karoge — us din absent maano, ya pichle
    din se copy karo, ya average lao? Yahi choices hain missing data mein — drop, fill with constant, fill with mean/median.
    (This mirrors how Pandas fundamentally operates.)
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">\n       1. Handling Missing Values\n\
    \      </h3>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — missing_values.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n \
    \        </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> pandas <span class=\"\
    kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\ndf = pd.<span class=\"fn\"\
    >DataFrame</span>({\n    <span class=\"str\">\"name\":  [\"Rahul\", \"Priya\", np.nan, \"Arjun\"</span>],\n    <span class=\"\
    str\">\"age\"</span>:   [<span class=\"num\">25</span>, np.nan, <span class=\"num\">30</span>, <span class=\"num\">22</span>],\n\
    \    <span class=\"str\">\"score\"</span>: [<span class=\"num\">85</span>, <span class=\"num\">90</span>, np.nan, np.nan]\n\
    })\n\n<span class=\"cm\"># Detect missing values</span>\n<span class=\"fn\">print</span>(df.<span class=\"fn\">isnull</span>())\
    \          <span class=\"cm\"># True/False for each cell</span>\n<span class=\"fn\">print</span>(df.<span class=\"fn\"\
    >isnull</span>().<span class=\"fn\">sum</span>())    <span class=\"cm\"># count of nulls per column</span>\n<span class=\"\
    fn\">print</span>(df.<span class=\"fn\">isnull</span>().<span class=\"fn\">mean</span>())   <span class=\"cm\"># percentage\
    \ of nulls per column</span>\n\n<span class=\"cm\"># Drop rows with ANY missing value</span>\ndf_clean = df.<span class=\"\
    fn\">dropna</span>()          <span class=\"cm\"># only Rahul row survives</span>\n\n<span class=\"cm\"># Drop rows only\
    \ if SPECIFIC column is null</span>\ndf2 = df.<span class=\"fn\">dropna</span>(subset=[<span class=\"str\">\"name\"</span>])\
    \  <span class=\"cm\"># drops only the np.nan name row</span>\n\n<span class=\"cm\"># Fill nulls with a constant</span>\n\
    df[<span class=\"str\">\"age\"] = df[\"age\"</span>].<span class=\"fn\">fillna</span>(<span class=\"num\">0</span>)  \
    \    <span class=\"cm\"># Reassignment is best practice</span>\n\n<span class=\"cm\"># Fill with mean (better for numeric\
    \ data)</span>\nmean_score = df[<span class=\"str\">\"score\"</span>].<span class=\"fn\">mean</span>()\ndf[<span class=\"\
    str\">\"score\"] = df[\"score\"</span>].<span class=\"fn\">fillna</span>(mean_score)  <span class=\"cm\"># fills 87.5</span>\n\
    \n<span class=\"cm\"># Fill with forward fill (use previous row's value)</span>\ndf[<span class=\"str\">\"score\"] = df[\"\
    score\"</span>].<span class=\"fn\">ffill</span>()   <span class=\"cm\"># useful for time series</span></code></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       2. Removing Duplicates + Renaming + Type Casting\n      </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       Data cleaning frequently requires identifying and\
    \ removing duplicate rows, renaming column headers for consistency, and casting variables to their correct data types.\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — cleaning_ops.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n \
    \        </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"cm\"># Remove duplicate rows</span>\n\
    df = df.<span class=\"fn\">drop_duplicates</span>()                      <span class=\"cm\"># Reassignment avoids inplace</span>\n\
    df = df.<span class=\"fn\">drop_duplicates</span>(subset=[<span class=\"str\">\"name\"], keep=\"first\"</span>)  <span\
    \ class=\"cm\"># dedupe by name</span>\n\n<span class=\"cm\"># Rename columns</span>\ndf = df.<span class=\"fn\">rename</span>(columns={<span\
    \ class=\"str\">\"name\": \"student_name\", \"age\": \"student_age\"</span>})\n\n\n<span class=\"cm\"># Fix data types</span>\n\
    df[<span class=\"str\">\"student_age\"] = df[\"student_age\"</span>].<span class=\"fn\">astype</span>(int)\ndf[<span class=\"\
    str\">\"score\"] = df[\"score\"</span>].<span class=\"fn\">astype</span>(float)\n\n<span class=\"cm\"># Strip whitespace\
    \ from string columns (very common problem!)</span>\ndf[<span class=\"str\">\"student_name\"] = df[\"student_name\"</span>].str.<span\
    \ class=\"fn\">strip</span>()\ndf[<span class=\"str\">\"student_name\"] = df[\"student_name\"</span>].str.<span class=\"\
    fn\">lower</span>()</code></pre>\n</div>\n<h3 class=\"sh3\">\n       3. apply() and map() — Transforming Data\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       The\n       \n      \
    \  apply()\n       \n       and\n       \n        map()\n       \n       functions enable custom element-wise transformations\
    \ across rows or columns, avoiding slow iterative Python loops.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — apply_map.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"\
    ><span class=\"cm\"># apply() — runs a function on each element</span>\ndf[<span class=\"str\">\"score_grade\"] = df[\"\
    score\"</span>].<span class=\"fn\">apply</span>(\n    <span class=\"kw\">lambda</span> x: <span class=\"str\">\"A\" if\
    \ x &gt;= 90 else (\"B\" if x &gt;= 75 else \"C\"</span>)\n)\n\n<span class=\"cm\"># apply on full row (axis=1)</span>\n\
    <span class=\"kw\">def</span> <span class=\"fn\">describe_student</span>(row):\n    <span class=\"kw\">return</span> <span\
    \ class=\"str\">f\"{row['</span>student_name<span class=\"str\">']} scored {row['</span>score<span class=\"str\">']}\"\
    </span>\n\ndf[<span class=\"str\">\"description\"</span>] = df.<span class=\"fn\">apply</span>(describe_student, axis=<span\
    \ class=\"num\">1</span>)\n\n<span class=\"cm\"># map() — replace values using a dict (great for encoding)</span>\ndf[<span\
    \ class=\"str\">\"pass_fail\"] = df[\"score_grade\"].map({\"A\": True, \"B\": True, \"C\"</span>: <span class=\"kw\">False</span>})</code></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       4. Merging DataFrames\n      </h3>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n         python — merge_concat.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"\
    ><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\nstudents = pd.<span class=\"fn\">DataFrame</span>({<span\
    \ class=\"str\">\"id\": [1, 2, 3], \"name\": [\"Rahul\", \"Priya\", \"Arjun\"</span>]})\nscores   = pd.<span class=\"\
    fn\">DataFrame</span>({<span class=\"str\">\"id\": [1, 2, 4], \"score\"</span>: [<span class=\"num\">85</span>, <span\
    \ class=\"num\">92</span>, <span class=\"num\">78</span>]})\n\n<span class=\"cm\"># INNER JOIN — only matching ids (1,2)</span>\n\
    inner = pd.<span class=\"fn\">merge</span>(students, scores, on=<span class=\"str\">\"id\", how=\"inner\"</span>)\n\n\
    <span class=\"cm\"># LEFT JOIN — all students, NaN for id=3 (no score)</span>\nleft = pd.<span class=\"fn\">merge</span>(students,\
    \ scores, on=<span class=\"str\">\"id\", how=\"left\"</span>)\n\n<span class=\"cm\"># Concatenate (stack DataFrames vertically)</span>\n\
    df_all = pd.<span class=\"fn\">concat</span>([students, students], ignore_index=<span class=\"kw\">True</span>)</code></pre>\n\
    </div>\n<div class=\"mermaid\">\ngraph TD\nsubgraph \"Left DataFrame\"\n  L1[\"ID 1: Rahul\"]\n  L2[\"ID 2: Priya\"]\n\
    \  L3[\"ID 3: Arjun\"]\nend\nsubgraph \"Right DataFrame\"\n  R1[\"ID 1: 85\"]\n  R2[\"ID 2: 92\"]\n  R4[\"ID 4: 78\"]\n\
    end\nsubgraph \"Inner Join - Matches only\"\n  IJ1[\"ID 1: Rahul | 85\"]\n  IJ2[\"ID 2: Priya | 92\"]\nend\nsubgraph \"\
    Left Join - All Left + Matches\"\n  LJ1[\"ID 1: Rahul | 85\"]\n  LJ2[\"ID 2: Priya | 92\"]\n  LJ3[\"ID 3: Arjun | NaN\"\
    ]\nend\n  L1 --&gt; IJ1\n  R1 --&gt; IJ1\n  L2 --&gt; IJ2\n  R2 --&gt; IJ2\n  L1 --&gt; LJ1\n  R1 --&gt; LJ1\n  L2 --&gt;\
    \ LJ2\n  R2 --&gt; LJ2\n  L3 --&gt; LJ3\n</div>\n<div class=\"diagram-cap\">\n       Conceptual visualization of Left\
    \ vs. Inner merges.\n      </div>\n<!-- SVG: Merge Types Diagram -->\n<figure class=\"svg-diagram\">\n<svg aria-label=\"\
    Visual comparison of inner, left, right, and outer merges. Shows which rows are retained and where NaN is filled for missing\
