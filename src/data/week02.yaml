  tasks:
  - title: Clean a Messy DataFrame
    badge: MEDIUM
    badge_class: tb-easy
    time: 25 min
    prompt_html: |-
      <p style="margin-bottom: 0.6rem;">
      <strong>
                  Failure-Based Learning:
                 </strong>
                 Create an intentionally broken CSV (corrupt delimiters, "$5,000" salaries, date strings, and NaN values).
                </p>
      <ul style="padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;">
      <li style="margin-bottom: 0.4rem;">
                  Load it.
                 </li>
      <li style="margin-bottom: 0.4rem;">
                  Notice how Pandas reads the types wrong.
                 </li>
      <li style="margin-bottom: 0.4rem;">
                  Clean it: strip currency symbols, fix types, standardise names.
                 </li>
      <li style="margin-bottom: 0.4rem;">
                  Print before/after dtypes.
                 </li>
      </ul>
      <p style="margin-bottom: 0.6rem;">
      <strong>
                  Reading Existing Code:
                 </strong>
                 Find a public Kaggle notebook about data cleaning.
                </p>
      <ul style="padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;">
      <li style="margin-bottom: 0.4rem;">
                  Find a bug or inefficiency in their code.
                 </li>
      <li style="margin-bottom: 0.4rem;">
                  Add a markdown cell explaining "Why is this code buggy?" and "How would I improve it?".
                 </li>
      </ul>
    done_when: When df.isnull().sum() returns all zeros after cleaning and dtypes are all correct. You have successfully debugged
      another person's code.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day9: data cleaning — fillna, dropna, astype, apply"'
    sol_id: sol-w2d9t1
    solution_title: 📓 Complete Colab Code
    solution_code: |
      # Clean a Messy DataFrame
      import pandas as pd
      import numpy as np
      df = pd.DataFrame({
          "name": ["Alice "," Bob"," Charlie","Alice ","Eve"],
          "age": [25, -30, 35, 25, 200],
          "salary": ["50000", "60000", "NA", "50000", "75000"],
          "date": ["2021-01-01", "2021/02/15", "2021-03-20", "2021-01-01", "01-04-2021"]
      })
      print("Before:", df, sep="\n")
      df["name"] = df["name"].str.strip()
      df = df.drop_duplicates()
      df["age"] = pd.to_numeric(df["age"], errors="coerce").clip(0, 120)
      df.loc[df["age"].isna(), "age"] = df["age"].median()
      df["salary"] = pd.to_numeric(df["salary"], errors="coerce").fillna(df["salary"].median())
      print("After:", df, sep="\n")
      assert df is not None, "df should not be None"
    solution_lang: python
  - title: 'Incremental Project: Clean Titanic Dataset Fully'
    badge: MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Take titanic.csv. Clean it completely:\n          </p>\n\
      <ul style=\"padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;\">\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n<strong>\n             (1)\n            </strong>\n            Fill Age nulls with median by Pclass (advanced\
      \ — use groupby fillna)\n           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n             (2)\n     \
      \       </strong>\n            Fill Embarked nulls with mode\n           </li>\n<li style=\"margin-bottom: 0.4rem;\"\
      >\n<strong>\n             (3)\n            </strong>\n            Drop Cabin column (too many nulls)\n           </li>\n\
      <li style=\"margin-bottom: 0.4rem;\">\n<strong>\n             (4)\n            </strong>\n            Create a new column\
      \ \"FamilySize\" = SibSp + Parch + 1\n           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n          \
      \   (5)\n            </strong>\n            Apply a lambda to create \"IsAlone\" = 1 if FamilySize==1. Save cleaned\
      \ CSV\n           </li>\n</ul>\n<p>\n<strong>\n            \U0001F4A1 Hint:\n           </strong>\n           If you\
      \ get a\n           \n            SettingWithCopyWarning\n           \n           , add\n           \n            .copy()\n\
      \           \n           when creating your subset — this was covered in Day 8.\n          </p>"
    done_when: When zero null values except Cabin (dropped). 3 new derived columns exist.
    git_cmd: 'git add incremental_project_clean_titanic_dataset_fully.py &amp;&amp; git commit -m "feat(day): day9: incremental-project-clean-titanic-dataset-fully"'
    sol_id: sol-w2d9t2
    solution_title: 📓 Complete Colab Code
    solution_code: |
      # Incremental Project: Clean Titanic Dataset Fully
      import pandas as pd
      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"
      df = pd.read_csv(url)
      print(f"Original: {df.shape}")
      print(f"Missing:\n{df.isnull().sum()}\n")
      df.drop("Cabin", axis=1, inplace=True)
      df["Age"] = df["Age"].fillna(df["Age"].median())
      df["Embarked"] = df["Embarked"].fillna(df["Embarked"].mode()[0])
      print(f"Missing after:\n{df.isnull().sum()}")
      print(f"Clean shape: {df.shape}")
      assert df is not None, "df should not be None"
    solution_lang: python
  quizzes:
  - num_str: Question 1
    question: "What does\n        \n         df.dropna()\n        \n        do by default?"
    qid: q9_1
    options:
    - letter: A
      text: Fills NaN with 0
      is_correct: false
      id: a
    - letter: B
      text: Drops any row that has at least one NaN
      is_correct: true
      id: b
    - letter: C
      text: Drops columns with more than 50% NaN
      is_correct: false
      id: c
    - letter: D
      text: Replaces NaN with column mean
      is_correct: false
      id: d
    correct_fb: ✅ Correct! dropna() by default drops any row containing at least one NaN. Use dropna(subset=["col"]) to only
      drop rows where a specific column is null. Use how="all" to only drop rows where ALL values are NaN.
    wrong_fb: ❌ dropna() removes rows with ANY null value by default. To fill nulls, use fillna(). To drop columns use dropna(axis=1).
    correct: b
    explanation: ''
  - num_str: Question 2
    question: "What is the key difference between\n        \n         apply()\n        \n        and\n        \n         map()\n\
      \        \n        in Pandas?"
    qid: q9_2
    options:
    - letter: A
      text: map() works on DataFrames, apply() works on Series
      is_correct: false
      id: a
    - letter: B
      text: map() replaces values using a dict; apply() runs a function
      is_correct: true
      id: b
    - letter: C
      text: They are identical — just different syntax
      is_correct: false
      id: c
    - letter: D
      text: apply() is faster than map() in all cases
      is_correct: false
      id: d
    correct_fb: ✅ Correct! map() is best for substituting values (like encoding "Male"→1, "Female"→0 using a dict). apply()
      runs any custom function element-wise or row-wise. Both work on Series; apply() also works on DataFrames with axis=1.
    wrong_fb: ❌ map() is for substitution using a dict or function. apply() runs any function on each element or row. Use
      map() for simple value replacement, apply() for custom logic.
    correct: b
    explanation: ''
  - num_str: Question 3
    question: You have two DataFrames with a common "user_id" column. Which merge keeps ALL rows from the left DataFrame,
      even if no match in the right?
    qid: q9_3
    options:
    - letter: A
      text: how="inner"
      is_correct: false
      id: a
    - letter: B
      text: how="left"
      is_correct: true
      id: b
    - letter: C
      text: how="right"
      is_correct: false
      id: c
    - letter: D
      text: how="outer"
      is_correct: false
      id: d
    correct_fb: ✅ Correct! LEFT join = all rows from left table, matching rows from right (NaN for no match). This mirrors
      SQL LEFT JOIN. Use this when you want to keep all your customers even if some have no transactions yet.
    wrong_fb: ❌ LEFT join keeps all rows from the left DataFrame. Inner = only matches. Right = all from right. Outer = all
      from both. LEFT is the most commonly used in data pipelines.
    correct: b
    explanation: ''
  - num_str: Question 4
    question: A column has values ["Male", "Female", "male", " Female"]. What's the best way to standardise it?
    qid: q9_4
    options:
    - letter: A
      text: df.drop_duplicates()
      is_correct: false
      id: a
    - letter: B
      text: df["gender"].str.strip().str.lower()
      is_correct: true
      id: b
    - letter: C
      text: df["gender"].fillna("Unknown")
      is_correct: false
      id: c
    - letter: D
      text: df["gender"].astype(int)
      is_correct: false
      id: d
    correct_fb: '✅ Correct! str.strip() removes leading/trailing spaces (fixes " Female"), str.lower() normalizes case (fixes
      "Male" vs "male"). Chain them: df["gender"].str.strip().str.lower() gives you "male","female" consistently.'
    wrong_fb: '❌ Use str.strip() to remove whitespace, str.lower() to normalize case. Chain them: .str.strip().str.lower().
      This is one of the most common data cleaning patterns.'
    correct: b
    explanation: ''
