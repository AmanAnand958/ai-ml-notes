    \ text-anchor=\"end\" x=\"688\" y=\"98\">\n         155000\n        </text>\n<title>\n         Result row: Laptop ₹155000\n\
    \        </title>\n</g>\n<g class=\"hov\">\n<rect fill=\"#e56b8c\" fill-opacity=\"0.12\" height=\"34\" rx=\"4\" stroke=\"\
    #2a3050\" width=\"120\" x=\"580\" y=\"130\">\n</rect>\n<text fill=\"#e6edf3\" font-family=\"IBM Plex Mono,monospace\"\
    \ font-size=\"11\" x=\"592\" y=\"150\">\n         Phone\n        </text>\n<text fill=\"var(--text)\" font-family=\"IBM\
    \ Plex Mono,monospace\" font-size=\"11\" text-anchor=\"end\" x=\"688\" y=\"150\">\n         27000\n        </text>\n<title>\n\
    \         Result row: Phone ₹27000\n        </title>\n</g>\n<text fill=\"var(--text2)\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"9.5\" font-weight=\"400\" text-anchor=\"middle\" x=\"640\" y=\"262\">\n        Final DataFrame — one row\
    \ per group\n       </text>\n</svg>\n<div class=\"mermaid\">\ngraph TD\nsubgraph \"1. Input DataFrame\"\n  Row0[\"Phone\
    \ | 15000\"]\n  Row1[\"Laptop | 80000\"]\n  Row2[\"Phone | 12000\"]\n  Row3[\"Laptop | 75000\"]\nend\nsubgraph \"2. Split\
    \ by Product\"\n  G1[\"Phone Group \\n - 15000 \\n - 12000\"]\n  G2[\"Laptop Group \\n - 80000 \\n - 75000\"]\nend\nsubgraph\
    \ \"3. Apply Aggregation - SUM\"\n  A1[\"Phone Sum \\n 15000 + 12000 = 27000\"]\n  A2[\"Laptop Sum \\n 80000 + 75000 =\
    \ 155000\"]\nend\nsubgraph \"4. Combine Result\"\n  Res0[\"Laptop | 155000\"]\n  Res1[\"Phone | 27000\"]\nend\n  Row0\
    \ --&gt;|groupby| G1\n  Row2 --&gt;|groupby| G1\n  Row1 --&gt;|groupby| G2\n  Row3 --&gt;|groupby| G2\n  G1 --&gt;|sum|\
    \ A1\n  G2 --&gt;|sum| A2\n  A1 --&gt;|combine| Res1\n  A2 --&gt;|combine| Res0\n</div>\n<div class=\"diagram-cap\">\n\
    \       Split-Apply-Combine execution process in Pandas groupby operations.\n      </div>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         python — groupby_basics.py\n        </span>\n<div class=\"cb-btns\">\n\
    <button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code\
    \ class=\"language-html\"><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\nsales = pd.<span\
    \ class=\"fn\">DataFrame</span>({\n    <span class=\"str\">\"product\":  [\"Phone\", \"Laptop\", \"Phone\", \"Tablet\"\
    , \"Laptop\", \"Phone\"</span>],\n    <span class=\"str\">\"region\":   [\"North\", \"South\", \"North\", \"East\", \"\
    North\", \"South\"</span>],\n    <span class=\"str\">\"revenue\"</span>:  [<span class=\"num\">15000</span>, <span class=\"\
    num\">80000</span>, <span class=\"num\">12000</span>, <span class=\"num\">25000</span>, <span class=\"num\">75000</span>,\
    \ <span class=\"num\">18000</span>],\n    <span class=\"str\">\"quantity\"</span>: [<span class=\"num\">3</span>, <span\
    \ class=\"num\">1</span>, <span class=\"num\">2</span>, <span class=\"num\">2</span>, <span class=\"num\">1</span>, <span\
    \ class=\"num\">3</span>]\n})\n\n<span class=\"cm\"># Total revenue by product</span>\nproduct_rev = sales.<span class=\"\
    fn\">groupby</span>(<span class=\"str\">\"product\")[\"revenue\"</span>].<span class=\"fn\">sum</span>()\n<span class=\"\
    fn\">print</span>(product_rev)\n<span class=\"cm\"># product</span>\n<span class=\"cm\"># Laptop    155000</span>\n<span\
    \ class=\"cm\"># Phone      45000</span>\n<span class=\"cm\"># Tablet     25000</span>\n\n<span class=\"cm\"># Multiple\
    \ aggregations at once</span>\nproduct_stats = sales.<span class=\"fn\">groupby</span>(<span class=\"str\">\"product\"\
    </span>).<span class=\"fn\">agg</span>(\n    total_revenue=(<span class=\"str\">\"revenue\", \"sum\"</span>),\n    avg_revenue=(\
    \  <span class=\"str\">\"revenue\", \"mean\"</span>),\n    total_qty=(    <span class=\"str\">\"quantity\", \"sum\"</span>),\n\
    \    transactions=( <span class=\"str\">\"revenue\", \"count\"</span>)\n).<span class=\"fn\">reset_index</span>()\n\n\
    <span class=\"fn\">print</span>(product_stats.<span class=\"fn\">sort_values</span>(<span class=\"str\">\"total_revenue\"\
    </span>, ascending=<span class=\"kw\">False</span>))</code></pre>\n</div>\n<h3 class=\"sh3\">\n       2. pivot_table()\
    \ — Cross-tabulation\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       Pivot tables summarize and aggregate tabular data along specified dimensions, providing a spreadsheet-like cross-tabulation\
    \ view of features.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\
    \ — pivot_table.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n\
    \          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"cm\"># Revenue by\
    \ product AND region (like a cross-tab Excel table)</span>\npivot = sales.<span class=\"fn\">pivot_table</span>(\n   \
    \ values=<span class=\"str\">\"revenue\"</span>,\n    index=<span class=\"str\">\"product\"</span>,\n    columns=<span\
    \ class=\"str\">\"region\"</span>,\n    aggfunc=<span class=\"str\">\"sum\"</span>,\n    fill_value=<span class=\"num\"\
    >0</span>     <span class=\"cm\"># NaN → 0 for missing combos</span>\n)\n<span class=\"fn\">print</span>(pivot)\n<span\
    \ class=\"cm\">#          East  North  South</span>\n<span class=\"cm\"># Laptop      0  75000  80000</span>\n<span class=\"\
    cm\"># Phone       0  27000  18000</span>\n<span class=\"cm\"># Tablet  25000      0      0</span>\n\n<span class=\"cm\"\
    ># value_counts — frequency of each category</span>\n<span class=\"fn\">print</span>(sales[<span class=\"str\">\"product\"\
    </span>].<span class=\"fn\">value_counts</span>())\n<span class=\"cm\"># Phone     3</span>\n<span class=\"cm\"># Laptop\
    \    2</span>\n<span class=\"cm\"># Tablet    1</span></code></pre>\n</div>\n<h3 class=\"sh3\">\n       3. String Operations\
    \ on Columns\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n\
    \       Pandas provides vectorized string methods (accessible via the\n       \n        .str\n       \n       accessor)\
    \ to perform operations like parsing, splitting, and replacing text in columns.\n      </p>\n<div class=\"cb\">\n<div\
    \ class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — string_ops.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code\
    \ class=\"language-python\">df[<span class=\"str\">\"product\"</span>].str.<span class=\"fn\">lower</span>()         <span\
    \ class=\"cm\"># \"Phone\" → \"phone\"</span>\ndf[<span class=\"str\">\"product\"</span>].str.<span class=\"fn\">upper</span>()\
    \         <span class=\"cm\"># \"phone\" → \"PHONE\"</span>\ndf[<span class=\"str\">\"product\"].str.contains(\"Lap\"\
    </span>) <span class=\"cm\"># True/False — like SQL LIKE</span>\ndf[<span class=\"str\">\"product\"].str.startswith(\"\
    P\"</span>) <span class=\"cm\"># True for \"Phone\"</span>\ndf[<span class=\"str\">\"product\"</span>].str.<span class=\"\
    fn\">len</span>()           <span class=\"cm\"># character count</span>\ndf[<span class=\"str\">\"product\"].str.replace(\"\
    Ph\", \"Sm\"</span>) <span class=\"cm\"># \"Phone\" → \"Smone\"</span>\n\n<span class=\"cm\"># Split a column (e.g. \"\
    first_last\" → [\"first\",\"last\"])</span>\ndf[<span class=\"str\">\"full_name\"].str.split(\"_\"</span>, expand=<span\
    \ class=\"kw\">True</span>)  <span class=\"cm\"># 2 separate columns</span></code></pre>\n</div>\n<div class=\"ml-connect\"\
    >\n       In ML, groupby is used for stratified sampling — making sure each class appears proportionally in train/test\
    \ splits. pivot_table is used for feature engineering — creating features from categorical combinations.\n      </div>\n\
    <div class=\"hinglish\">\n       \U0001F4A1 Ek line mein: groupby() = data ko groups mein baant ke stats nikalo. agg()\
    \ se ek saath multiple stats. pivot_table() = rows/columns cross-tab. str. operations = text columns ko clean aur transform\
    \ karo.\n      </div>\n<h3 class=\"sh3\">\n       4. Datetime Operations — pd.to_datetime() + .dt Accessor\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       Converting objects to\
    \ datetime representations and using the\n       \n        .dt\n       \n       accessor allows developers to extract\
    \ time-based features like day of week, hour, or month.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n         python — datetime_ops.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"\
    ><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\n<span class=\"cm\"># Convert a string column\
    \ to datetime</span>\ndf[<span class=\"str\">\"date\"] = pd.to_datetime(df[\"date\"</span>])        <span class=\"cm\"\
    ># auto-detects format</span>\ndf[<span class=\"str\">\"date\"] = pd.to_datetime(df[\"date\"], format=\"%d/%m/%Y\"</span>)\
    \  <span class=\"cm\"># explicit format</span>\n\n<span class=\"cm\"># .dt accessor — extract date parts</span>\ndf[<span\
    \ class=\"str\">\"year\"]    = df[\"date\"</span>].dt.year\ndf[<span class=\"str\">\"month\"]   = df[\"date\"</span>].dt.month\n\
    df[<span class=\"str\">\"day\"]     = df[\"date\"</span>].dt.day\ndf[<span class=\"str\">\"weekday\"] = df[\"date\"</span>].dt.<span\
    \ class=\"fn\">day_name</span>()  <span class=\"cm\"># \"Monday\", \"Tuesday\"...</span>\ndf[<span class=\"str\">\"quarter\"\
    ] = df[\"date\"</span>].dt.quarter\n\n<span class=\"cm\"># Date arithmetic</span>\ndf[<span class=\"str\">\"days_since\"\
    ] = (pd.Timestamp(\"today\") - df[\"date\"</span>]).dt.days\n\n<span class=\"cm\"># resample() — aggregate over time periods\
    \ (like groupby for dates)</span>\ndf = df.<span class=\"fn\">set_index</span>(<span class=\"str\">\"date\"</span>)\n\
    monthly = df[<span class=\"str\">\"revenue\"].resample(\"ME\"</span>).<span class=\"fn\">sum</span>()   <span class=\"\
    cm\"># month-end totals</span>\nweekly  = df[<span class=\"str\">\"revenue\"].resample(\"W\"</span>).<span class=\"fn\"\
    >mean</span>()   <span class=\"cm\"># weekly averages</span></code></pre>\n</div>\n<details style=\"margin-top:20px; background:rgba(255,255,255,0.03);\
    \ padding:10px; border-radius:8px;\">\n<summary style=\"cursor:pointer; font-weight:bold; color:var(--orange);\">\n  \
    \      Advanced: Rolling Windows &amp; Memory Optimization (Optional)\n       </summary>\n<h3 class=\"sh3\">\n       \
    \ 5. Rolling &amp; Expanding Windows\n       </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n        Rolling and expanding window functions calculate moving statistics (like moving averages\
    \ or cumulative sums) over a sliding interval of time-series records.\n       </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n          python — rolling_expanding.py\n         </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n           Run\n          </button>\n</div>\n</div>\n<pre><code\
    \ class=\"language-html\"><span class=\"cm\"># rolling() — sliding window (fixed size)</span>\ndf[<span class=\"str\"\
    >\"7day_avg\"]  = df[\"sales\"</span>].<span class=\"fn\">rolling</span>(window=<span class=\"num\">7</span>).<span class=\"\
    fn\">mean</span>()   <span class=\"cm\"># 7-day moving avg</span>\ndf[<span class=\"str\">\"30day_sum\"] = df[\"sales\"\
    </span>].<span class=\"fn\">rolling</span>(window=<span class=\"num\">30</span>).<span class=\"fn\">sum</span>()\n\n<span\
    \ class=\"cm\"># expanding() — growing window (all data up to current row)</span>\ndf[<span class=\"str\">\"cumulative_max\"\
    ] = df[\"sales\"</span>].<span class=\"fn\">expanding</span>().<span class=\"fn\">max</span>()\ndf[<span class=\"str\"\
    >\"running_total\"]  = df[\"sales\"</span>].<span class=\"fn\">expanding</span>().<span class=\"fn\">sum</span>()\n<span\
    \ class=\"cm\"># First N-1 rows of rolling(N) are NaN — no full window yet</span></code></pre>\n</div>\n<div class=\"\
    ml-connect\">\n        Rolling averages smooth out noise in time-series data.\n        <br/>\n<br/>\n        They are\
    \ a standard feature engineering technique in stock price prediction, sales forecasting, and anomaly detection.\n    \
    \   </div>\n<h3 class=\"sh3\">\n        6. Reshaping Data — melt(), stack(), unstack(), explode()\n       </h3>\n<p style=\"\
    margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n        Reshaping functions transform data\
    \ between wide format and long format, expanding nested lists or rotating hierarchical index structures.\n       </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python — reshaping.py\n         </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n           Run\n          </button>\n\
    </div>\n</div>\n<pre><code class=\"language-html\"><span class=\"cm\"># melt() — wide format → long format (unpivot)</span>\n\
    <span class=\"cm\"># Wide: one row per student, one col per subject</span>\n<span class=\"cm\"># Long: one row per (student,\
    \ subject) combination</span>\ndf_long = df.<span class=\"fn\">melt</span>(\n    id_vars=[<span class=\"str\">\"name\"\
    </span>],\n    value_vars=[<span class=\"str\">\"math\", \"science\", \"english\"</span>],\n    var_name=<span class=\"\
    str\">\"subject\", value_name=\"score\"</span>\n)\n\n<span class=\"cm\"># stack() / unstack() — move columns ↔ index levels</span>\n\
    df_stacked   = df.<span class=\"fn\">stack</span>()    <span class=\"cm\"># columns → inner index level</span>\ndf_unstacked\
    \ = df.<span class=\"fn\">unstack</span>()  <span class=\"cm\"># inner index level → columns</span>\n\n<span class=\"\
    cm\"># explode() — one row per list element</span>\ndf[<span class=\"str\">\"tags\"] = [[\"python\",\"sql\"], [\"ml\"\
    ], [\"python\",\"ml\",\"data\"</span>]]\ndf.<span class=\"fn\">explode</span>(<span class=\"str\">\"tags\"</span>)  <span\
    \ class=\"cm\"># each tag gets its own row</span></code></pre>\n</div>\n<h3 class=\"sh3\">\n        7. MultiIndex — Hierarchical\
    \ Indexing\n       </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n \
    \       Hierarchical indexing (MultiIndex) enables you to represent higher-dimensional data structures within a standard\
    \ two-dimensional DataFrame.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n   \
    \       python — multiindex.py\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n           Run\n          </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"cm\"># MultiIndex\
    \ created by groupby without reset_index</span>\nmulti = df.<span class=\"fn\">groupby</span>([<span class=\"str\">\"\
    city\", \"product\"])[\"revenue\"</span>].<span class=\"fn\">sum</span>()\n<span class=\"fn\">print</span>(multi.index)\
    \  <span class=\"cm\"># MultiIndex([('Mumbai','Phone'),('Delhi','Laptop')...])</span>\n\n<span class=\"cm\"># Access specific\
    \ level</span>\nmulti.loc[<span class=\"str\">\"Mumbai\"</span>]               <span class=\"cm\"># all products in Mumbai</span>\n\
    multi.loc[(<span class=\"str\">\"Mumbai\", \"Phone\"</span>)]    <span class=\"cm\"># specific (city, product) pair</span>\n\
    multi.<span class=\"fn\">reset_index</span>()                 <span class=\"cm\"># flatten back to regular columns</span>\n\
    \n<span class=\"cm\"># unstack() converts inner index to columns — great for cross-tabs</span>\nmulti.<span class=\"fn\"\
    >unstack</span>(level=<span class=\"str\">\"product\"</span>)</code></pre>\n</div>\n<h3 class=\"sh3\">\n        8. Memory\
    \ Optimization &amp; Chunking Large Files\n       </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n        When datasets exceed RAM capacity, chunking (loading data in batches) and optimizing data\
    \ types (like downcasting floats or using categories) prevents memory exhaustion.\n       </p>\n<div class=\"cb\">\n<div\
    \ class=\"cb-head\">\n<span class=\"cb-lang\">\n          python — memory_chunking.py\n         </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n           Run\n          </button>\n</div>\n</div>\n\
    <pre><code class=\"language-html\"><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\n<span class=\"\
    cm\"># Check memory usage</span>\ndf.<span class=\"fn\">info</span>(memory_usage=<span class=\"str\">\"deep\"</span>)\
    \         <span class=\"cm\"># true memory per column</span>\ndf.<span class=\"fn\">memory_usage</span>(deep=<span class=\"\
    kw\">True</span>).<span class=\"fn\">sum</span>()    <span class=\"cm\"># total bytes</span>\n\n<span class=\"cm\"># Downcast\
    \ dtypes — int64 → int32 saves 50% memory</span>\ndf[<span class=\"str\">\"age\"]    = df[\"age\"].astype(\"int8\"</span>)\
    \      <span class=\"cm\"># 0-127 fits in int8</span>\ndf[<span class=\"str\">\"salary\"] = df[\"salary\"].astype(\"float32\"\
    </span>)  <span class=\"cm\"># half the size of float64</span>\ndf[<span class=\"str\">\"city\"]   = df[\"city\"].astype(\"\
    category\"</span>)  <span class=\"cm\"># huge savings for low-cardinality strings</span>\n\n<span class=\"cm\"># Chunking\
    \ — process huge CSV files that don't fit in RAM</span>\nchunk_iter = pd.<span class=\"fn\">read_csv</span>(<span class=\"\
    str\">\"huge_file.csv\"</span>, chunksize=<span class=\"num\">10000</span>)\nresults = []\n<span class=\"kw\">for</span>\
    \ chunk <span class=\"kw\">in</span> chunk_iter:\n    results.<span class=\"fn\">append</span>(chunk[chunk[<span class=\"\
    str\">\"city\"] == \"Mumbai\"</span>])  <span class=\"cm\"># filter each chunk</span>\ndf_filtered = pd.<span class=\"\
    fn\">concat</span>(results, ignore_index=<span class=\"kw\">True</span>)</code></pre>\n</div>\n</details>\n"
