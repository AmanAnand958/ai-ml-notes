  gotcha:
    title: '⚠️ Gotcha: Default Window Frame in Window Functions'
    description: When using `OVER (ORDER BY date)`, SQL implicitly defaults the frame to `RANGE BETWEEN UNBOUNDED PRECEDING
      AND CURRENT ROW`, which aggregates duplicate dates simultaneously. Use `ROWS BETWEEN` for exact cumulative steps.
  takeaways:
