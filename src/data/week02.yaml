          df = pd.read_csv(url)
          print("Shape:", df.shape)
          print("Columns:", df.columns.tolist())
          print("Top teams by wins:", df["winner"].value_counts().head(5))
      except Exception as e:
          print(f"Loaded fallback: {e}")
    solution_lang: python
  quizzes:
  - num_str: Question 1
    question: "What does\n         \n          df.shape\n         \n         return for a DataFrame with 100 rows and 5 columns?"
    qid: q8_1
    options:
    - letter: A
      text: '[100, 5]'
      is_correct: false
      id: a
    - letter: B
      text: (100, 5)
      is_correct: true
      id: b
    - letter: C
      text: '500'
      is_correct: false
      id: c
    - letter: D
      text: (5, 100)
      is_correct: false
      id: d
    correct_fb: ✅ Correct! shape returns a tuple (rows, columns). Always rows first, columns second. Tuple uses () not [].
      This is important when checking your data dimensions before ML.
    wrong_fb: ❌ df.shape returns a tuple (rows, columns) → (100, 5). It's a tuple (with parentheses), not a list. Rows always
      come first.
    correct: b
    explanation: ''
  - num_str: Question 2
    question: Which statement selects all rows where the "age" column is greater than 25?
    qid: q8_2
    options:
    - letter: A
      text: df.iloc[df["age"] &gt; 25]
      is_correct: false
      id: a
    - letter: B
      text: df.select(age &gt; 25)
      is_correct: false
      id: b
    - letter: C
      text: df[df["age"] &gt; 25]
      is_correct: true
      id: c
    - letter: D
      text: df.where("age &gt; 25")
      is_correct: false
      id: d
    correct_fb: '✅ Correct! Boolean indexing: df[condition]. The inner df["age"] &gt; 25 creates a boolean Series (True/False
      per row), then df[that_series] filters to only True rows. This is the most used pattern in data analysis.'
    wrong_fb: '❌ Boolean indexing syntax: df[df["age"] &gt; 25]. The inner expression creates a True/False mask, and the outer
      df[] applies the mask. iloc doesn''t accept boolean conditions like that.'
    correct: c
    explanation: ''
  - num_str: Question 3
    question: "What is the difference between\n         \n          df.iloc[0]\n         \n         and\n         \n     \
      \     df.loc[0]\n         \n         ?"
    qid: q8_3
    options:
    - letter: A
      text: They are always identical
      is_correct: false
      id: a
    - letter: B
      text: iloc uses integer position; loc uses index label
      is_correct: true
      id: b
    - letter: C
      text: iloc is for columns; loc is for rows
      is_correct: false
      id: c
    - letter: D
      text: iloc is slower than loc
      is_correct: false
      id: d
    correct_fb: ✅ Correct! iloc = integer Location (always 0,1,2... position). loc = Label-based Location (uses the actual
      index value). They differ when the index is not 0,1,2 — e.g. after filtering, your index might be [5,10,22] — then iloc[0]
      = row at position 0, but loc[0] = KeyError!
    wrong_fb: ❌ iloc uses integer position (0,1,2...), loc uses index labels. They behave differently when the DataFrame index
      is not the default 0,1,2 sequence — for example after filtering.
    correct: b
    explanation: ''
  - num_str: Question 4
    question: "What does\n         \n          df.info()\n         \n         show that\n         \n          df.describe()\n\
      \         \n         does NOT?"
    qid: q8_4
    options:
    - letter: A
      text: Mean and standard deviation
      is_correct: false
      id: a
    - letter: B
      text: Data types and non-null counts per column
      is_correct: true
      id: b
    - letter: C
      text: First 5 rows of data
      is_correct: false
      id: c
    - letter: D
      text: Minimum and maximum values
      is_correct: false
      id: d
    correct_fb: '✅ Correct! info() shows: column names, data types (dtype), non-null count, and memory usage. describe() shows:
      count, mean, std, min, 25%, 50%, 75%, max — but only for numeric columns. Always run both when exploring a new dataset.'
    wrong_fb: ❌ info() shows dtypes, non-null counts, and memory usage. describe() shows statistics (mean, std, min, max)
      for numeric columns. They are complementary — use both.
    correct: b
    explanation: ''
  flashcards:
  - front: What is the difference between a Series and DataFrame?
    back: |-
      Series = 1D (one column)
                 <br/>
                 DataFrame = 2D (rows + columns)
                 <br/>
                 like a table
  - front: How to load a CSV file in Pandas?
    back: |-
      pd.read_csv("filename.csv")
                 <br/>
                 returns a DataFrame This establishes the core invariant in Pandas — Series & DataFrames, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: What does df.describe() show?
    back: |-
      count, mean, std,
                 <br/>
                 min, 25%, 50%, 75%, max
                 <br/>
                 for numeric columns only
  - front: iloc vs loc — key rule?
    back: |-
      iloc = integer position (0,1,2)
                 <br/>
                 loc = index label
                 <br/>
                 After filtering, use reset_index()!
  - front: Boolean indexing pattern?
    back: |-
      df[df["col"] > value]
                 <br/>
                 Multiple: use & or |
                 <br/>
                 Wrap each in ()
  gotcha:
    title: '⚠️ Gotcha: SettingWithCopyWarning & Chained Indexing'
    description: Never use chained indexing like `df[df['A'] > 0]['B'] = 1` for assignment. It operates on a temporary slice
      view and will fail silently or throw SettingWithCopyWarning. Always use `df.loc[df['A'] > 0, 'B'] = 1`.
  takeaways:
    hinglish_line: Production mein Pandas — Series & DataFrames ko use karte waqt edge cases aur mathematical constraints
      ko pehle validate karo, taaki downstream deployment bilkul rock-solid rahe!
    bullets:
    - DataFrame = 2D table. Series = 1 column. All ML data starts as a DataFrame.
    - Always run shape, info(), describe(), isnull().sum() on any new dataset.
    - iloc = position (integers), loc = label (column names and index values).
    - 'Boolean indexing: df[df["col"] &gt; value] — this is the SQL WHERE of Pandas.'
    - isnull().sum() tells you where your data has gaps — critical before ML!
