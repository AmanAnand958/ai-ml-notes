  hinglish: "Window functions jaise\n       \n        ROW_NUMBER()\n       \n       ,\n       \n        RANK()\n       \n\
    \       ,\n       \n        LAG()\n       \n       — ye intermediate-to-advanced SQL hai. Analytics mein ye bahut use\
    \ hota hai toh aaj pakka seekh lo!"
  analogy: 'Imagine trying to find the tallest student in a classroom. You cannot filter the students until you first measure
    everyone and calculate the average height. A subquery is exactly that: a query that runs first to find a dynamic threshold
    (like average salary), which is then passed to the outer query to filter the rows. (This mirrors how Advanced fundamentally
    operates.)'
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">\n       1. Subqueries — The \"\
    Stuck Query\" Problem\n      </h3>\n<p>\n       Suppose you want to find employees who earn more than the average salary\
    \ of the entire company.\n      </p>\n<p>\n       Your first instinct might be to write this query:\n      </p>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — wrong_where_aggregate.sql\n       \
    \ </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n\
    </div>\n</div>\n<pre><code class=\"language-plaintext\">-- ❌ THIS WILL FAIL WITH A SYNTAX ERROR!\nSELECT name, salary\n\
    FROM employees\nWHERE salary &gt; <span class=\"fn\">AVG</span>(salary);  -- Aggregates <span class=\"kw\">not</span>\
    \ allowed <span class=\"kw\">in</span> WHERE</code></pre>\n</div>\n<p>\n       To solve this, we nest a query inside another\
    \ query.\n      </p>\n<p>\n       The\n       <strong>\n        inner query\n       </strong>\n       calculates the average\
    \ first, and its single output value is handed to the\n       <strong>\n        outer query\n       </strong>\n      \
    \ for row filtering:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql\
    \ — independent_subquery.sql\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-python\">-- ✅ Independent Subquery:\
    \ Runs exactly once first, then filters the outer query\nSELECT name, salary\nFROM employees\nWHERE salary &gt; (\n  \
    \  SELECT <span class=\"fn\">AVG</span>(salary) FROM employees\n);\n\n-- Subquery <span class=\"kw\">with</span> <span\
    \ class=\"fn\">IN</span> (finding employees who work <span class=\"kw\">in</span> departments located <span class=\"kw\"\
    >in</span> Mumbai)\nSELECT name \nFROM employees\nWHERE dept_id <span class=\"fn\">IN</span> (\n    SELECT id FROM departments\
    \ WHERE location = <span class=\"str\">'Mumbai'</span>\n);</code></pre>\n</div>\n<h3 class=\"sh3\" style=\"color:var(--orange)\"\
    >\n       Correlated Subqueries — The Performance Bottleneck\n      </h3>\n<p>\n       Unlike independent subqueries which\
    \ run once, a\n       <strong>\n        Correlated Subquery\n       </strong>\n       references columns from the outer\
    \ query.\n      </p>\n<p>\n       The database engine must execute the inner query\n       <strong>\n        once for\
    \ every single row\n       </strong>\n       processed by the outer query.\n      </p>\n<p>\n       This is physically\
    \ slow and should be avoided on large datasets unless optimized.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         sql — correlated_subquery.sql\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"\
    runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-python\"\
    >-- Find employees earning more than the average salary of THEIR specific department\nSELECT e1.name, e1.salary, e1.dept_id\n\
    FROM employees e1\nWHERE e1.salary &gt; (\n    SELECT <span class=\"fn\">AVG</span>(e2.salary)\n    FROM employees e2\n\
    \    WHERE e2.dept_id = e1.dept_id  -- Binds inner query to the current outer row\n);</code></pre>\n</div>\n<h3 class=\"\
    sh3\">\n       2. CTEs (WITH clause) — Solving the \"Spaghetti Query\"\n      </h3>\n<p>\n       If you need to perform\
    \ multiple levels of aggregations or joins on subqueries, nesting them quickly turns your SQL script into unreadable spaghetti\
    \ code.\n      </p>\n<p>\n       For example:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         sql — nested_spaghetti.sql\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-python\"\
    >-- ❌ Nested Subqueries: Hard to read, scan, <span class=\"kw\">and</span> maintain\nSELECT d.department_name, ds.headcount\n\
    <span class=\"fn\">FROM</span> (\n    SELECT dept_id, <span class=\"fn\">COUNT</span>(*) AS headcount\n    <span class=\"\
    fn\">FROM</span> (\n        SELECT name, salary, dept_id \n        FROM employees \n        WHERE salary &gt; <span class=\"\
    num\">70000</span>\n    ) AS high_earners\n    GROUP BY dept_id\n) ds\nJOIN departments d ON ds.dept_id = d.id;</code></pre>\n\
    </div>\n<p>\n       A\n       <strong>\n        Common Table Expression (CTE)\n       </strong>\n       solves this.\n\
    \      </p>\n<p>\n       By using the\n       \n        WITH\n       \n       clause, you declare named, temporary virtual\
    \ tables at the start of your script and query them sequentially:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         sql — cte_refactored.sql\n        </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-python\"\
    >-- ✅ Clean, modular, <span class=\"kw\">and</span> <span class=\"kw\">self</span>-documenting\nWITH high_earners <span\
    \ class=\"fn\">AS</span> (\n    SELECT name, salary, dept_id\n    FROM employees\n    WHERE salary &gt; <span class=\"\
    num\">70000</span>\n),\ndept_summary <span class=\"fn\">AS</span> (\n    SELECT dept_id, <span class=\"fn\">COUNT</span>(*)\
    \ AS headcount\n    FROM high_earners\n    GROUP BY dept_id\n)\nSELECT d.department_name, ds.headcount\nFROM dept_summary\
    \ ds\nJOIN departments d ON ds.dept_id = d.id\nORDER BY ds.headcount DESC;</code></pre>\n</div>\n<h3 class=\"sh3\" style=\"\
    color:var(--orange)\">\n       2.1. Recursive CTEs — Tree Traversal\n      </h3>\n<p>\n       Standard SQL joins cannot\
    \ query hierarchical structures (like company org charts or nested website categories) where the depth is unknown.\n \
    \     </p>\n<p>\n<strong>\n        Recursive CTEs\n       </strong>\n       loop through rows until no more connections\
    \ are found.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — recursive_org_chart.sql\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n \
    \        </button>\n</div>\n</div>\n<pre><code class=\"language-sql\">WITH RECURSIVE org_chart <span class=\"fn\">AS</span>\
    \ (\n    -- <span class=\"num\">1</span>. Anchor Member: Find the top-level <span class=\"fn\">bosses</span> (manager_id\
    \ <span class=\"kw\">is</span> NULL)\n    SELECT id, name, manager_id, <span class=\"num\">1</span> AS level\n    FROM\
    \ employees\n    WHERE manager_id IS NULL\n    \n    UNION ALL\n    \n    -- <span class=\"num\">2</span>. Recursive Member:\
    \ Join the CTE back to find direct reports\n    SELECT e.id, e.name, e.manager_id, o.level + <span class=\"num\">1</span>\n\
    \    FROM employees e\n    INNER JOIN org_chart o ON e.manager_id = o.id\n)\nSELECT * FROM org_chart ORDER BY level, name;</code></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       3. Window Functions — Aggregates Without Collapsing\n      </h3>\n<div class=\"mermaid\"\
    >\ngraph LR\nsubgraph \"GROUP BY - Collapses Rows\"\n  G_In[\"Name |Dept| Sal \\n A |HR| 100 \\n B |HR| 200\"] --&gt;\
    \ G_Proc[\"Collapse by Dept\"]\n  G_Proc --&gt; G_Out[\"Dept | AvgSal \\n HR | 150\"]\nend\nsubgraph \"Window Function\
    \ - Retains Row Identity\"\n  W_In[\"Name |Dept| Sal \\n A |HR| 100 \\n B |HR| 200\"] --&gt; W_Proc[\"Calculate window\
    \ partition avg\"]\n  W_Proc --&gt; W_Out[\"Name |Dept| Sal | AvgSal \\n A |HR| 100 | 150 \\n B |HR| 200 | 150\"]\nend\n\
    </div>\n<div class=\"diagram-cap\">\n       GROUP BY (collapsing rows into a single group result) vs. Window functions\
    \ (retaining all rows and attaching the calculation to each record).\n      </div>\n<div class=\"table-wrap\" style=\"\
    overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Operation\n \
    \       </th>\n<th>\n         GROUP BY\n        </th>\n<th>\n         Window Function (\n         \n          OVER\n \
    \        \n         )\n        </th>\n</tr>\n<tr>\n<td>\n<strong>\n          Row Count\n         </strong>\n</td>\n<td>\n\
    \         Collapses rows (100 rows become 5 summary rows)\n        </td>\n<td>\n         Keeps all original rows intact\
    \ (100 rows stay 100 rows)\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          Selection\n         </strong>\n</td>\n\
    <td>\n         Only grouped columns &amp; aggregates can be selected\n        </td>\n<td>\n         Any columns can be\
    \ selected alongside window aggregates\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          Best for\n         </strong>\n\
    </td>\n<td>\n         Summarized reporting and overall group counts\n        </td>\n<td>\n         Running totals, rolling\
    \ averages, rankings, and LEAD/LAG checks\n        </td>\n</tr>\n</table></div>\n<p>\n       To use window functions,\
    \ we use the\n       \n        OVER\n       \n       clause.\n      </p>\n<p>\n       It defines the \"window\" or partition\
    \ of data the function calculates across.\n      </p>\n<p>\n       Let's break down the syntax step-by-step:\n      </p>\n\
    <h3 class=\"sh3\" style=\"color:var(--orange)\">\n       Ranking Functions: ROW_NUMBER vs. RANK vs. DENSE_RANK\n     \
    \ </h3>\n<p>\n       Suppose three employees in the IT department earn the exact same salary ($80,000).\n      </p>\n\
    <p>\n       How do different ranking functions rank them?\n      </p>\n<ul>\n<li>\n\n         ROW_NUMBER()\n        \n\
    \        : Assigns a unique consecutive number to every row (1, 2, 3) ignoring ties.\n       </li>\n<li>\n\n         RANK()\n\
    \        \n        : Assigns the same rank to ties, but skips the next rank numbers (1, 1, 1, 4).\n       </li>\n<li>\n\
    \n         DENSE_RANK()\n        \n        : Assigns the same rank to ties without skipping numbers (1, 1, 1, 2).\n  \
    \     </li>\n</ul>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — window_rankings.sql\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n</div>\n</div>\n<pre><code class=\"language-sql\">SELECT name, department, salary,\n    <span class=\"\
    fn\">ROW_NUMBER</span>() <span class=\"fn\">OVER</span> (PARTITION BY department ORDER BY salary DESC) AS row_num,\n \
    \   <span class=\"fn\">RANK</span>() <span class=\"fn\">OVER</span> (PARTITION BY department ORDER BY salary DESC) AS\
    \ rnk,\n    <span class=\"fn\">DENSE_RANK</span>() <span class=\"fn\">OVER</span> (PARTITION BY department ORDER BY salary\
    \ DESC) AS dense_rnk\nFROM employees;</code></pre>\n</div>\n<h3 class=\"sh3\" style=\"color:var(--orange)\">\n       Time-Series\
    \ Row Comparisons: LEAD and LAG\n      </h3>\n<p>\n\n        LEAD()\n       \n       fetches a value from a subsequent\
    \ row, and\n       \n        LAG()\n       \n       fetches a value from a preceding row.\n      </p>\n<p>\n       They\
    \ allow you to compare rows sequentially without expensive self-joins (perfect for Month-over-Month changes).\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — lead_lag.sql\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    </div>\n</div>\n<pre><code class=\"language-sql\">SELECT month, revenue,\n    <span class=\"fn\">LAG</span>(revenue, <span\
    \ class=\"num\">1</span>) <span class=\"fn\">OVER</span> (ORDER BY month) AS prev_month_revenue,\n    revenue - <span\
    \ class=\"fn\">LAG</span>(revenue, <span class=\"num\">1</span>) <span class=\"fn\">OVER</span> (ORDER BY month) AS mom_change\n\
    FROM monthly_sales;</code></pre>\n</div>\n<h3 class=\"sh3\">\n       4. CASE WHEN &amp; COALESCE — Row-Level Logic\n \
    \     </h3>\n<p>\n       SQL provides standard inline conditional statements to alter data values on a row-by-row basis:\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — case_coalesce.sql\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n \
    \        </button>\n</div>\n</div>\n<pre><code class=\"language-plaintext\">-- <span class=\"num\">1</span>. CASE WHEN:\
    \ The IF-ELSE statement of SQL\nSELECT name, salary,\n    CASE\n        WHEN salary &gt; <span class=\"num\">80000</span>\
    \ THEN <span class=\"str\">'Senior'</span>\n        WHEN salary &gt; <span class=\"num\">50000</span> THEN <span class=\"\
    str\">'Mid-level'</span>\n        ELSE <span class=\"str\">'Junior'</span>\n    END AS job_level\nFROM employees;\n\n\
    -- <span class=\"num\">2</span>. COALESCE: Evaluates arguments <span class=\"kw\">from</span> left to right <span class=\"\
    kw\">and</span> returns the first non-NULL value\nSELECT name, <span class=\"fn\">COALESCE</span>(phone, email, emergency_contact,\
    \ <span class=\"str\">'No Contact Available'</span>) AS contact_info\nFROM employees;</code></pre>\n</div>\n<h3 class=\"\
    sh3\">\n       5. EXISTS vs. IN — Performance &amp; Null Behaviors\n      </h3>\n<p>\n       To check if a value exists\
    \ in another set, we use\n       \n        IN\n       \n       or\n       \n        EXISTS\n       \n       .\n      </p>\n\
    <p>\n       But they act differently under the hood:\n      </p>\n<ul>\n<li>\n\n         IN\n        \n        : The database\
    \ retrieves the entire subquery result set, caches it in memory, and checks if the outer value exists in that set.\n \
    \      </li>\n<li>\n\n         EXISTS\n        \n        : The database uses a\n        <strong>\n         semi-join\n\
    \        </strong>\n        . It stops searching the moment it finds the\n        <strong>\n         first matching record\n\
    \        </strong>\n        in the subquery. For large subqueries,\n        \n         EXISTS\n        \n        is significantly\
    \ faster!\n       </li>\n</ul>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql —\
    \ exists_vs_in.sql\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n\
    \          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-python\">-- Use IN <span class=\"kw\"\
    >for</span> small, static <span class=\"fn\">lists</span> (e.g. <span class=\"fn\">IN</span> (<span class=\"num\">1</span>,\
    \ <span class=\"num\">2</span>, <span class=\"num\">3</span>))\nSELECT name FROM employees\nWHERE dept_id <span class=\"\
    fn\">IN</span> (\n    SELECT id FROM departments WHERE location = <span class=\"str\">'Mumbai'</span>\n);\n\n-- Use EXISTS\
    \ <span class=\"kw\">for</span> large <span class=\"fn\">subqueries</span> (Faster execution)\nSELECT e.name FROM employees\
    \ e\nWHERE <span class=\"fn\">EXISTS</span> (\n    SELECT <span class=\"num\">1</span> FROM departments d\n    WHERE d.id\
    \ = e.dept_id AND d.location = <span class=\"str\">'Mumbai'</span>\n);</code></pre>\n</div>\n<h3 class=\"sh3\">\n    \
    \   6. Running Aggregates — Dynamic Windows\n      </h3>\n<p>\n       By ordering inside the\n       \n        OVER\n\
    \       \n       clause, we can compute cumulative and rolling metrics over time:\n      </p>\n<div class=\"cb\">\n<div\
    \ class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — running_aggregates.sql\n        </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n</div>\n</div>\n\
    <pre><code class=\"language-sql\">SELECT month, revenue,\n    <span class=\"fn\">SUM</span>(revenue) <span class=\"fn\"\
    >OVER</span> (ORDER BY month) AS running_total,\n    <span class=\"fn\">AVG</span>(revenue) <span class=\"fn\">OVER</span>\
    \ (\n        ORDER BY month\n        ROWS BETWEEN <span class=\"num\">2</span> PRECEDING AND CURRENT ROW\n    ) AS rolling_3mo_avg,\n\
    \    <span class=\"fn\">NTILE</span>(<span class=\"num\">4</span>) <span class=\"fn\">OVER</span> (ORDER BY revenue) AS\
    \ revenue_quartile,\n    <span class=\"fn\">PERCENT_RANK</span>() <span class=\"fn\">OVER</span> (ORDER BY revenue) AS\
    \ percentile_rank\nFROM monthly_sales;</code></pre>\n</div>\n<h3 class=\"sh3\">\n       7. Views &amp; Materialized Views\
    \ — Virtual vs. Cached Queries\n      </h3>\n<p>\n       To reuse code and restrict access to sensitive table columns,\
    \ databases let you save queries as views:\n      </p>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem\
    \ 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Feature\n        </th>\n<th>\n         Standard\
    \ View\n        </th>\n<th>\n         Materialized View\n        </th>\n</tr>\n<tr>\n<td>\n<strong>\n          Data Storage\n\
    \         </strong>\n</td>\n<td>\n         Virtual (Stores query syntax only, no physical data)\n        </td>\n<td>\n\
    \         Physical (Caches query results to disk like a table)\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n         \
    \ Performance\n         </strong>\n</td>\n<td>\n         Slower (Must run query from scratch each time)\n        </td>\n\
    <td>\n         Extremely Fast (Reads precomputed rows directly)\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n        \
    \  Data Freshness\n         </strong>\n</td>\n<td>\n         Always Fresh (Retrieves real-time table state)\n        </td>\n\
    <td>\n         Stale until updated manually/automatically\n        </td>\n</tr>\n</table></div>\n<div class=\"cb\">\n\
    <div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — views.sql\n        </span>\n<div class=\"cb-btns\">\n\
    <button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code\
    \ class=\"language-sql\">-- <span class=\"num\">1</span>. Create a Standard View\nCREATE VIEW v_high_earners AS\n    SELECT\
    \ name, department, salary\n    FROM employees\n    WHERE salary &gt; <span class=\"num\">70000</span>;\n\n-- <span class=\"\
    num\">2</span>. Create a Materialized <span class=\"fn\">View</span> (Requires REFRESH to update)\nCREATE MATERIALIZED\
    \ VIEW mv_sales_summary AS\n    SELECT order_date, <span class=\"fn\">COUNT</span>(*) AS total_orders, <span class=\"\
    fn\">SUM</span>(amount) AS daily_revenue\n    FROM orders\n    GROUP BY order_date;\n\n-- Refreshing the cached data <span\
    \ class=\"kw\">in</span> the materialized view\nREFRESH MATERIALIZED VIEW mv_sales_summary;</code></pre>\n</div>\n<h3\
    \ class=\"sh3\">\n       8. Database Triggers — Event-Driven Automation\n      </h3>\n<p>\n       A\n       <strong>\n\
    \        Trigger\n       </strong>\n       automatically executes a procedure in response to\n       \n        INSERT\n\
    \       \n       ,\n       \n        UPDATE\n       \n       , or\n       \n        DELETE\n       \n       events on\
    \ a specific table.\n      </p>\n<p>\n       This is perfect for security auditing and maintaining history logs:\n   \
    \   </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — triggers.sql\n       \
    \ </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n\
    </div>\n</div>\n<pre><code class=\"language-sql\">-- <span class=\"num\">1</span>. Audit log table\nCREATE TABLE <span\
    \ class=\"fn\">salary_audit_log</span> (\n    emp_id INT,\n    old_salary INT,\n    new_salary INT,\n    changed_at TIMESTAMP\
    \ DEFAULT CURRENT_TIMESTAMP\n);\n\n-- <span class=\"num\">2</span>. Trigger <span class=\"fn\">Function</span> (PostgreSQL\
    \ PL/pgSQL syntax)\nCREATE OR REPLACE FUNCTION <span class=\"fn\">log_salary_change</span>()\nRETURNS TRIGGER AS $$\n\
    BEGIN\n    IF NEW.salary &lt;&gt; OLD.salary THEN\n        INSERT INTO <span class=\"fn\">salary_audit_log</span>(emp_id,\
    \ old_salary, new_salary)\n        <span class=\"fn\">VALUES</span>(OLD.id, OLD.salary, NEW.salary);\n    END IF;\n  \
    \  RETURN NEW;\nEND;\n$$ LANGUAGE plpgsql;\n\n-- <span class=\"num\">3</span>. Bind the trigger to run BEFORE the update\
    \ executes on each row\nCREATE TRIGGER trg_salary_update\nBEFORE UPDATE ON employees\nFOR EACH ROW\nEXECUTE FUNCTION <span\
    \ class=\"fn\">log_salary_change</span>();</code></pre>\n</div>\n<h3 class=\"sh3\">\n       9. Cursors, Stored Procedures\
    \ &amp; User-Defined Functions\n      </h3>\n<p>\n       When write operations require complex procedural logic rather\
    \ than simple set statements, database engines support running code blocks:\n      </p>\n<div class=\"table-wrap\" style=\"\
    overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Feature\n   \
    \     </th>\n<th>\n         Stored Procedures (\n         \n          CREATE PROCEDURE\n         \n         )\n      \
    \  </th>\n<th>\n         User-Defined Functions (UDFs) (\n         \n          CREATE FUNCTION\n         \n         )\n\
    \        </th>\n</tr>\n<tr>\n<td>\n<strong>\n          Call Syntax\n         </strong>\n</td>\n<td>\n         Called explicitly:\n\
    \         \n          CALL proc_name(args);\n         \n</td>\n<td>\n         Called inline:\n         \n          SELECT\
    \ func_name(col) FROM table;\n         \n</td>\n</tr>\n<tr>\n<td>\n<strong>\n          Return Requirements\n         </strong>\n\
    </td>\n<td>\n         Can return data, multiple output parameters, or nothing\n        </td>\n<td>\n<strong>\n       \
    \   Must\n         </strong>\n         return a single value or a table result\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n\
    \          Transactions\n         </strong>\n</td>\n<td>\n<strong>\n          Allowed\n         </strong>\n         to\
    \ run\n         \n          COMMIT\n         \n         and\n         \n          ROLLBACK\n         \n         statements\n\
    \        </td>\n<td>\n<strong>\n          Strictly Forbidden\n         </strong>\n         from controlling transactions\n\
    \        </td>\n</tr>\n</table></div>\n<h3 class=\"sh3\" style=\"color:var(--orange)\">\n       Cursors — Row-by-Row Iteration\n\
    \      </h3>\n<p>\n       While standard SQL works on\n       <strong>\n        sets of rows\n       </strong>\n     \
    \  simultaneously, a\n       <strong>\n        Cursor\n       </strong>\n       is a pointer that allows you to iterate\
    \ through query results row-by-row, running loops and conditional operations in a procedural container.\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — cursors.sql\n        </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n\
    </div>\n<pre><code class=\"language-sql\">CREATE OR REPLACE FUNCTION <span class=\"fn\">distribute_bonuses</span>() RETURNS\
    \ VOID AS $$\nDECLARE\n    emp_record RECORD;\n    emp_cursor CURSOR FOR SELECT id, salary FROM employees WHERE perf_score\
    \ &gt;= <span class=\"num\">9</span>;\nBEGIN\n    OPEN emp_cursor;\n    LOOP\n        FETCH NEXT FROM emp_cursor INTO\
    \ emp_record;\n        EXIT WHEN NOT FOUND;\n        \n        UPDATE employees \n        SET salary = salary + (emp_record.salary\
    \ * <span class=\"num\">0.10</span>) \n        WHERE id = emp_record.id;\n    END LOOP;\n    CLOSE emp_cursor;\nEND;\n\
    $$ LANGUAGE plpgsql;</code></pre>\n</div>\n<details style=\"margin-top:20px; background:rgba(255,255,255,0.03); padding:10px;\
    \ border-radius:8px;\">\n<summary style=\"cursor:pointer; font-weight:bold; color:var(--orange);\">\n        Bonus/Advanced:\
    \ Transactions, Concurrency &amp; Query Plans\n       </summary>\n<h3 class=\"sh3\">\n        10. Transactions &amp; ACID\
    \ Properties\n       </h3>\n<p>\n        Transactions bundle multiple SQL writes into a single, atomic block.\n      \
    \ </p>\n<p>\n        Either\n        <strong>\n         all\n        </strong>\n        operations succeed, or\n     \
    \   <strong>\n         none\n        </strong>\n        do.\n       </p>\n<p>\n        This preserves database integrity\
    \ in the event of hardware failures or network cuts.\n       </p>\n<ul>\n<li>\n<strong>\n          Atomicity:\n      \
    \   </strong>\n         All statements in a transaction succeed, or everything is rolled back (All-or-Nothing).\n    \
    \    </li>\n<li>\n<strong>\n          Consistency:\n         </strong>\n         The database transitions cleanly according\
    \ to rules (e.g. constraints, unique keys).\n        </li>\n<li>\n<strong>\n          Isolation:\n         </strong>\n\
    \         Concurrent transactions run independently and do not read uncommitted states.\n        </li>\n<li>\n<strong>\n\
    \          Durability:\n         </strong>\n         Once committed, updates are permanently written to disk and survive\
    \ system crashes.\n        </li>\n</ul>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n     \
    \     sql — transactions.sql\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n           Run\n          </button>\n</div>\n</div>\n<pre><code class=\"language-sql\">BEGIN;\n    UPDATE accounts\
    \ SET balance = balance - <span class=\"num\">1000</span> WHERE id = <span class=\"num\">1</span>;  -- Debit\n    UPDATE\
    \ accounts SET balance = balance + <span class=\"num\">1000</span> WHERE id = <span class=\"num\">2</span>;  -- Credit\n\
    COMMIT;   -- Persists changes on disk\n\n-- If an operation fails, run ROLLBACK to revert to initial state:\nBEGIN;\n\
    \    DELETE FROM orders WHERE status = <span class=\"str\">'cancelled'</span>;\nROLLBACK;  -- Reverts the deletes</code></pre>\n\
    </div>\n<h3 class=\"sh3\">\n        11. Database Locks — Shared vs. Exclusive\n       </h3>\n<div class=\"cb\">\n<div\
    \ class=\"cb-head\">\n<span class=\"cb-lang\">\n          sql — locks.sql\n         </span>\n<div class=\"cb-btns\">\n\
    <button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n           Run\n          </button>\n</div>\n</div>\n<pre><code\
    \ class=\"language-python\">-- <span class=\"num\">1</span>. Shared <span class=\"fn\">Lock</span> (FOR SHARE): Allows\
    \ others to read, blocks write updates\nSELECT balance FROM accounts WHERE id = <span class=\"num\">1</span> FOR SHARE;\n\
    \n-- <span class=\"num\">2</span>. Exclusive <span class=\"fn\">Lock</span> (FOR UPDATE): Blocks others <span class=\"\
    kw\">from</span> both reading <span class=\"kw\">and</span> writing\nSELECT balance FROM accounts WHERE id = <span class=\"\
    num\">1</span> FOR UPDATE;</code></pre>\n</div>\n<h3 class=\"sh3\">\n        12. Transaction Isolation Levels\n      \
    \ </h3>\n<p>\n        To balance performance against transaction interference, databases support four isolation levels:\n\
    \       </p>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\"\
    >\n<tr>\n<th>\n          Level\n         </th>\n<th>\n          Dirty Reads (Read uncommitted data)\n         </th>\n\
    <th>\n          Non-Repeatable Reads (Values change mid-transaction)\n         </th>\n<th>\n          Phantom Reads (New\
    \ rows appear mid-transaction)\n         </th>\n</tr>\n<tr>\n<td>\n<strong>\n           Read Uncommitted\n          </strong>\n\
    </td>\n<td>\n          Allowed\n         </td>\n<td>\n          Allowed\n         </td>\n<td>\n          Allowed\n   \
    \      </td>\n</tr>\n<tr>\n<td>\n<strong>\n           Read Committed\n          </strong>\n          (Default)\n     \
    \    </td>\n<td>\n          Prevented\n         </td>\n<td>\n          Allowed\n         </td>\n<td>\n          Allowed\n\
    \         </td>\n</tr>\n<tr>\n<td>\n<strong>\n           Repeatable Read\n          </strong>\n</td>\n<td>\n         \
    \ Prevented\n         </td>\n<td>\n          Prevented\n         </td>\n<td>\n          Allowed\n         </td>\n</tr>\n\
    <tr>\n<td>\n<strong>\n           Serializable\n          </strong>\n          (Strict)\n         </td>\n<td>\n       \
    \   Prevented\n         </td>\n<td>\n          Prevented\n         </td>\n<td>\n          Prevented\n         </td>\n\
    </tr>\n</table></div>\n<h3 class=\"sh3\">\n        13. EXPLAIN — Reading the Query Plan\n       </h3>\n<p>\n        To\
    \ see how the query planner compiles your query, prefix it with\n        \n         EXPLAIN\n        \n        .\n   \
    \    </p>\n<p>\n        This displays the cost and execution pathways (e.g. using index lookup trees vs reading files\
    \ sequentially):\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          sql —\
    \ explain_plans.sql\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n           Run\n          </button>\n</div>\n</div>\n<pre><code class=\"language-sql\">-- EXPLAIN displays execution\
    \ steps\nEXPLAIN SELECT * FROM employees WHERE dept_id = <span class=\"num\">5</span>;\n-- Output shows <span class=\"\
    str\">\"Seq Scan\"</span> (Full table scan - slow!)\n\n-- EXPLAIN ANALYZE actually runs the query <span class=\"kw\">and</span>\
    \ prints physical times\nEXPLAIN ANALYZE SELECT * FROM employees WHERE dept_id = <span class=\"num\">5</span>;\n\n-- Adding\
    \ an index changes the query plan <span class=\"kw\">from</span> a Seq Scan to an Index Scan\nCREATE INDEX idx_dept_id\
    \ ON <span class=\"fn\">employees</span>(dept_id);</code></pre>\n</div>\n</details>\n<h3 class=\"sh3\">\n       14. Python\
    \ Integration — pd.read_sql() and SQLAlchemy\n      </h3>\n<p>\n       In real-world data pipelines, we use Python to\
    \ extract data from a relational database and load it directly into a Pandas DataFrame for modeling or cleaning:\n   \
    \   </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — read_sql.py\n     \
    \   </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button><button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">Run</button></div>\n</div>\n<pre><code class=\"language-html\"\
    ><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">from</span> sqlalchemy <span\
    \ class=\"kw\">import</span> create_engine\n\n<span class=\"cm\"># 1. Establish database connection</span>\nengine = <span\
    \ class=\"fn\">create_engine</span>(<span class=\"str\">'sqlite:///my_database.db'</span>)\n\n<span class=\"cm\"># 2.\
    \ Write and execute SQL to load directly into DataFrame</span>\nquery = <span class=\"str\">''</span><span class=\"str\"\
    >'\\nSELECT department, AVG(salary) as avg_sal\\nFROM employees\\nGROUP BY department\\nHAVING AVG(salary) &gt; 50000\\\
    n'</span><span class=\"str\">''</span>\ndf = pd.<span class=\"fn\">read_sql</span>(query, engine)\n<span class=\"fn\"\
    >print</span>(df.<span class=\"fn\">head</span>())</code></pre>\n</div>\n<h3 class=\"sh3\">\n       15. pgvector — Modern\
    \ Vector Search &amp; Similarity\n      </h3>\n<p>\n       Keyword search using operators like\n       \n        LIKE\
    \ '%python%'\n       \n       has a major limitation: it only returns exact character matches.\n      </p>\n<p>\n    \
    \   If a user searches for \"machine learning\", keyword queries fail to match documents containing \"ML\", \"neural networks\"\
    , or \"deep learning\" because the terms are textually different, despite being semantically similar.\n      </p>\n<p>\n\
    \       Modern LLM applications (like Retrieval-Augmented Generation or RAG) convert text blocks into high-dimensional\
    \ numerical lists called\n       <strong>\n        vector embeddings\n       </strong>\n       .\n      </p>\n<p>\n  \
    \     The\n       <strong>\n\n         pgvector\n        \n</strong>\n       extension allows PostgreSQL to store, index,\
    \ and query vectors directly alongside your relational tables:\n      </p>\n<div class=\"ml-connect\">\n       In RAG\
    \ architectures, we embed a user's natural language question, run a vector similarity query in PostgreSQL to retrieve\
    \ the most relevant background documents, and pass that retrieved text as context to LLMs like Claude or GPT.\n      </div>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — pgvector_search.sql\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n\
    </div>\n</div>\n<pre><code class=\"language-sql\">-- <span class=\"num\">1</span>. Enable pgvector extension\nCREATE EXTENSION\
    \ IF NOT EXISTS vector;\n\n-- <span class=\"num\">2</span>. Create table storing text alongside <span class=\"num\">1536</span>-dimensional\
    \ <span class=\"fn\">embeddings</span> (OpenAI standard)\nCREATE TABLE <span class=\"fn\">documents</span> (\n    id SERIAL\
    \ PRIMARY KEY,\n    content TEXT,\n    embedding <span class=\"fn\">VECTOR</span>(<span class=\"num\">1536</span>)\n);\n\
    \n-- <span class=\"num\">3</span>. Perform Cosine Similarity vector search to find top <span class=\"num\">3</span> matching\
    \ documents\nSELECT content, <span class=\"num\">1</span> - (embedding &lt;=&gt; <span class=\"str\">'[0.012, -0.004,\
    \ ..., 0.89]'</span>) AS cosine_similarity\nFROM documents\nORDER BY embedding &lt;=&gt; <span class=\"str\">'[0.012,\
    \ -0.004, ..., 0.89]'</span> ASC\nLIMIT <span class=\"num\">3</span>;\n\n-- Distance Operators:\n-- &lt;=&gt; Cosine <span\
    \ class=\"fn\">Distance</span> (used <span class=\"kw\">for</span> textual semantic similarity)\n-- &lt;-&gt; L2 Euclidean\
    \ <span class=\"fn\">Distance</span> (used <span class=\"kw\">for</span> physical distance/coordinate metrics)\n-- &lt;<span\
    \ class=\"cm\">#&gt; Negative Inner Product</span></code></pre>\n</div>\n"
  predict:
    question: What is the cosine similarity between identical normalized unit vectors?
    answer: '1.0'
    explanation: dot(u, u) for any normalized unit vector is 1.0 (exact match).
    code: |-
      import numpy as np
      v = np.array([0.6, 0.8])
      sim = np.dot(v, v) / (np.linalg.norm(v) * np.linalg.norm(v))
      print(f'{sim:.1f}')
