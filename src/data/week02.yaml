  flashcards:
  - front: SQL clause order?
    back: |-
      SELECT → FROM → WHERE
                <br/>
                → GROUP BY → HAVING
                <br/>
                → ORDER BY → LIMIT
  - front: INNER vs LEFT JOIN?
    back: |-
      INNER = only matches
                <br/>
                LEFT = all from left + matches
                <br/>
                missing = NULL
  - front: WHERE vs HAVING?
    back: |-
      WHERE = filter rows (before GROUP)
                <br/>
                HAVING = filter groups (after GROUP)
                <br/>
                Aggregates only in HAVING
  - front: Pandas groupby equivalent in SQL?
    back: |-
      GROUP BY + aggregate function
                <br/>
                df.groupby("col")["val"].sum()
                <br/>
                → SELECT col, SUM(val) GROUP BY col
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling SQL — SELECT, WHERE, JOIN Basics in distributed
      systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: NULL Comparisons & Three-Valued Logic in SQL'
    description: In SQL, `WHERE status != 'active'` will completely exclude rows where `status IS NULL` because comparisons
      with NULL return UNKNOWN. Always write `WHERE status != 'active' OR status IS NULL`.
  takeaways:
    hinglish_line: Production mein SQL — SELECT, WHERE, JOIN Basics ko use karte waqt edge cases aur mathematical constraints
      ko pehle validate karo, taaki downstream deployment bilkul rock-solid rahe!
    bullets:
    - |-
      <strong>
                 SELECT
                </strong>
                specifies columns,
                <strong>
                 WHERE
                </strong>
                filters rows before GROUP BY,
                <strong>
         .
    - |-
      <strong>
                 JOINs:
                </strong>
                INNER JOIN returns matching rows; LEFT JOIN keeps all left rows. Always specify the join key with ON. Missing join conditions cause.
    - |-
      <strong>
                 NULL
                </strong>
                is unknown — use IS NULL / IS NOT NULL. Comparisons with NULL always yield NULL, not TRUE/FALSE.
    - |-
      <strong>
                 LIKE
                </strong>
                for pattern matching: % matches any sequence, _ matches single char. ILIKE for case-insensitive in PostgreSQL.
