      \ class=\"str\">\"age\"] = pd.to_numeric(df[\"age\"], errors=\"coerce\"</span>).<span\
      \ class=\"fn\">clip</span>(<span class=\"num\">0</span>, <span class=\"num\"\
      >120</span>)\ndf.loc[df[<span class=\"str\">\"age\"].isna(), \"age\"] = df[\"\
      age\"</span>].<span class=\"fn\">median</span>()\ndf[<span class=\"str\">\"\
