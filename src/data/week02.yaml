    sol_id: sol-w2-t06
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Incremental Project: Clean Titanic Dataset
      Fully</span>

      <span class="kw">import</span> pandas <span class="kw">as</span> pd

      url = <span class="str">"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"</span>

      df = pd.<span class="fn">read_csv</span>(url)

      <span class="fn">print</span>(<span class="str">f"Original: {df.shape}"</span>)

      <span class="fn">print</span>(<span class="str">f"Missing:\n{df.isnull().sum()}\n"</span>)

      df.<span class="fn">drop</span>(<span class="str">"Cabin"</span>, axis=<span
      class="num">1</span>, inplace=<span class="kw">True</span>)

      df[<span class="str">"Age"] = df["Age"].fillna(df["Age"</span>].<span class="fn">median</span>())

      df[<span class="str">"Embarked"] = df["Embarked"].fillna(df["Embarked"</span>].<span
      class="fn">mode</span>()[<span class="num">0</span>])

      <span class="fn">print</span>(<span class="str">f"Missing after:\n{df.isnull().sum()}"</span>)

      <span class="fn">print</span>(<span class="str">f"Clean shape: {df.shape}"</span>)'
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: "What does\n        \n         df.dropna()\n        \n        do by\
      \ default?"
    qid: q9_1
    options:
    - letter: A
      text: Fills NaN with 0
      is_correct: false
    - letter: B
      text: Drops any row that has at least one NaN
      is_correct: true
    - letter: C
      text: Drops columns with more than 50% NaN
      is_correct: false
    - letter: D
      text: Replaces NaN with column mean
      is_correct: false
    correct_fb: ✅ Correct! dropna() by default drops any row containing at least one
      NaN. Use dropna(subset=["col"]) to only drop rows where a specific column is
      null. Use how="all" to only drop rows where ALL values are NaN.
    wrong_fb: ❌ dropna() removes rows with ANY null value by default. To fill nulls,
      use fillna(). To drop columns use dropna(axis=1).
  - num_str: QUESTION 2 OF 4
    question: "What is the key difference between\n        \n         apply()\n  \
      \      \n        and\n        \n         map()\n        \n        in Pandas?"
    qid: q9_2
    options:
    - letter: A
      text: map() works on DataFrames, apply() works on Series
      is_correct: false
    - letter: B
      text: map() replaces values using a dict; apply() runs a function
      is_correct: true
    - letter: C
      text: They are identical — just different syntax
      is_correct: false
    - letter: D
      text: apply() is faster than map() in all cases
      is_correct: false
    correct_fb: ✅ Correct! map() is best for substituting values (like encoding "Male"→1,
      "Female"→0 using a dict). apply() runs any custom function element-wise or row-wise.
      Both work on Series; apply() also works on DataFrames with axis=1.
    wrong_fb: ❌ map() is for substitution using a dict or function. apply() runs any
      function on each element or row. Use map() for simple value replacement, apply()
      for custom logic.
  - num_str: QUESTION 3 OF 4
    question: You have two DataFrames with a common "user_id" column. Which merge
      keeps ALL rows from the left DataFrame, even if no match in the right?
    qid: q9_3
    options:
    - letter: A
      text: how="inner"
      is_correct: false
    - letter: B
      text: how="left"
      is_correct: true
    - letter: C
      text: how="right"
      is_correct: false
    - letter: D
      text: how="outer"
      is_correct: false
    correct_fb: ✅ Correct! LEFT join = all rows from left table, matching rows from
      right (NaN for no match). This mirrors SQL LEFT JOIN. Use this when you want
      to keep all your customers even if some have no transactions yet.
    wrong_fb: ❌ LEFT join keeps all rows from the left DataFrame. Inner = only matches.
      Right = all from right. Outer = all from both. LEFT is the most commonly used
      in data pipelines.
  - num_str: QUESTION 4 OF 4
    question: A column has values ["Male", "Female", "male", " Female"]. What's the
      best way to standardise it?
    qid: q9_4
    options:
    - letter: A
      text: df.drop_duplicates()
      is_correct: false
    - letter: B
      text: df["gender"].str.strip().str.lower()
      is_correct: true
    - letter: C
      text: df["gender"].fillna("Unknown")
      is_correct: false
    - letter: D
      text: df["gender"].astype(int)
      is_correct: false
    correct_fb: '✅ Correct! str.strip() removes leading/trailing spaces (fixes " Female"),
      str.lower() normalizes case (fixes "Male" vs "male"). Chain them: df["gender"].str.strip().str.lower()
      gives you "male","female" consistently.'
    wrong_fb: '❌ Use str.strip() to remove whitespace, str.lower() to normalize case.
      Chain them: .str.strip().str.lower(). This is one of the most common data cleaning
      patterns.'
