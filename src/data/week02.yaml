    solution_title: 📓 Complete Colab Code
    solution_code: |
      # Sales Data Analysis - GroupBy Deep Dive
      import pandas as pd
      import numpy as np
      np.random.seed(42)
      df = pd.DataFrame({
          "region": np.random.choice(["North","South","East","West"], 100),
          "product": np.random.choice(["A","B","C"], 100),
          "sales": np.random.randint(100, 1000, 100),
          "profit": np.random.randint(10, 200, 100),
      })
      print("Sales by region:")
      print(df.groupby("region")["sales"].agg(["sum","mean","count"]))
      print("Profit by product:")
      print(df.groupby("product")["profit"].agg(["sum","mean"]))
      print("Region-Product breakdown:")
      print(df.groupby(["region","product"])[["sales","profit"]].mean().round(1))
      assert df is not None, "df should not be None"
    solution_lang: python
  - title: Pandas GroupBy — Production Aggregation Pipeline
    solution_code: |
      # Day 10 Task 2 Solution: Pandas GroupBy & Aggregation
      import pandas as pd

      def group_and_aggregate(df: pd.DataFrame, group_col: str, agg_col: str) -> pd.DataFrame:
          return df.groupby(group_col)[agg_col].agg(['mean', 'count', 'sum']).reset_index()

      df = pd.DataFrame({
          "department": ["Sales", "Sales", "Eng", "Eng"],
          "salary": [50000, 60000, 80000, 90000]
      })
      agg_df = group_and_aggregate(df, "department", "salary")
      assert len(agg_df) == 2
      print("✅ Pandas groupby verified")
