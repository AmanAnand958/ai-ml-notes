      \        <span class=\"kw\">for</span> c <span class=\"kw\">in</span> results:\
      \ <span class=\"fn\">print</span>(c)\n\n    <span class=\"kw\">def</span> <span\
      \ class=\"fn\">delete</span>(<span class=\"kw\">self</span>):\n        name\
      \ = <span class=\"fn\">input</span>(<span class=\"str\">\"Delete contact name:\
      \ \"</span>)\n        <span class=\"kw\">for</span> i, c <span class=\"kw\"\
