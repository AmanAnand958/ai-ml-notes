  quizzes:
  - num_str: QUESTION 1 OF 4
    question: You want departments where the total salary bill exceeds ₹5,00,000.
      Which clause do you use to filter?
    qid: q11_1
    options:
    - letter: A
      text: WHERE SUM(salary) &gt; 500000
      is_correct: false
    - letter: B
      text: HAVING SUM(salary) &gt; 500000
      is_correct: true
    - letter: C
      text: FILTER SUM(salary) &gt; 500000
      is_correct: false
    - letter: D
      text: SELECT WHERE salary &gt; 500000
      is_correct: false
    correct_fb: '✅ Correct! HAVING filters groups after GROUP BY. WHERE filters individual
      rows before grouping — you can''t use aggregate functions (SUM, AVG, COUNT)
      in WHERE. Always: GROUP BY first, then HAVING to filter those groups.'
    wrong_fb: ❌ Use HAVING for aggregate conditions after GROUP BY. WHERE cannot use
      aggregate functions. HAVING SUM(salary) &gt; 500000 is correct.
  - num_str: QUESTION 2 OF 4
    question: What is the correct SQL order of clauses?
    qid: q11_2
    options:
    - letter: A
      text: SELECT → FROM → GROUP BY → WHERE → HAVING → ORDER BY
      is_correct: false
    - letter: B
      text: SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY
      is_correct: true
    - letter: C
      text: FROM → WHERE → SELECT → GROUP BY → ORDER BY
      is_correct: false
    - letter: D
      text: ORDER doesn't matter in SQL
      is_correct: false
    correct_fb: '✅ Correct! SELECT-FROM-WHERE-GROUP BY-HAVING-ORDER BY-LIMIT. Memorise
      this order — it''s in every SQL interview. Note: the execution order is different
      (FROM→WHERE→GROUP BY→HAVING→SELECT→ORDER BY), but the writing order is as above.'
    wrong_fb: '❌ The clause order is: SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER
      BY, LIMIT. Memorise this — it appears in every SQL interview.'
  - num_str: QUESTION 3 OF 4
    question: An INNER JOIN between employees(100 rows) and departments(10 rows) returns
      85 rows. What does this mean?
    qid: q11_3
    options:
    - letter: A
      text: 15 departments have no employees
      is_correct: false
    - letter: B
      text: 15 employees have no matching department (no dept_id match)
      is_correct: true
    - letter: C
      text: The JOIN condition is wrong
      is_correct: false
    - letter: D
      text: 15 duplicate rows were removed
      is_correct: false
    correct_fb: ✅ Correct! INNER JOIN only keeps rows where the key exists in BOTH
      tables. 100 employees - 85 matches = 15 employees have a dept_id that doesn't
      exist in the departments table (NULL or invalid). Use LEFT JOIN to keep all
      employees.
    wrong_fb: ❌ INNER JOIN drops rows without a match. 100 - 85 = 15 employees have
      no matching department. Use LEFT JOIN to keep all employees even without a department
      match.
  - num_str: QUESTION 4 OF 4
    question: "What does\n        \n         SELECT COUNT(DISTINCT city) FROM employees\n\
      \        \n        return?"
    qid: q11_4
    options:
    - letter: A
      text: Total number of employees
      is_correct: false
    - letter: B
      text: A list of all unique cities
      is_correct: false
    - letter: C
      text: The count of unique cities in the table
      is_correct: true
    - letter: D
      text: Error — DISTINCT can't be inside COUNT
      is_correct: false
    correct_fb: ✅ Correct! COUNT(DISTINCT col) counts how many unique values exist
      — equivalent to len(df["city"].unique()) in Pandas. Extremely useful for cardinality
      checks on categorical columns.
    wrong_fb: '❌ COUNT(DISTINCT city) = number of unique cities. It''s one number.
      Pandas equivalent: df["city"].nunique().'
  flashcards:
  - front: SQL clause order?
    back: "SELECT → FROM → WHERE\n          <br/>\n          → GROUP BY → HAVING\n\
      \          <br/>\n          → ORDER BY → LIMIT"
  - front: INNER vs LEFT JOIN?
    back: "INNER = only matches\n          <br/>\n          LEFT = all from left +\
      \ matches\n          <br/>\n          missing = NULL"
  - front: WHERE vs HAVING?
    back: "WHERE = filter rows (before GROUP)\n          <br/>\n          HAVING =\
      \ filter groups (after GROUP)\n          <br/>\n          Aggregates only in\
      \ HAVING"
  - front: Pandas groupby equivalent in SQL?
    back: "GROUP BY + aggregate function\n          <br/>\n          df.groupby(\"\
      col\")[\"val\"].sum()\n          <br/>\n          → SELECT col, SUM(val) GROUP\
      \ BY col"
  gotcha:
    title: '⚠️ Gotcha: Dictionary Keys & List Mutability'
    description: Never use mutable data types (like lists) as dictionary keys or default
      function arguments (`def func(x=[])`).
  takeaways:
    hinglish_line: ''
    bullets:
    - "<strong>\n           SELECT\n          </strong>\n          specifies columns,\n\
      \          <strong>\n           WHERE\n          </strong>\n          filters\
      \ rows before GROUP BY,\n          <strong>\n           HAVING\n          </strong>\n\
      \          filters groups after GROUP BY. Execution order: FROM → WHERE → GROUP\
      \ BY → HAVING → SELECT → ORDER BY."
    - "<strong>\n           JOINs:\n          </strong>\n          INNER JOIN returns\
      \ matching rows; LEFT JOIN keeps all left rows. Always specify the join key\
      \ with ON. Missing join conditions cause Cartesian products."
    - "<strong>\n           NULL\n          </strong>\n          is unknown — use\
      \ IS NULL / IS NOT NULL. Comparisons with NULL always yield NULL, not TRUE/FALSE."
    - "<strong>\n           LIKE\n          </strong>\n          for pattern matching:\
      \ % matches any sequence, _ matches single char. ILIKE for case-insensitive\
      \ in PostgreSQL."
