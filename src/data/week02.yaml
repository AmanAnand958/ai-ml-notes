  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Pandas — Data Cleaning in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: In-Place Mutation & Silent Null Type Coercion'
    description: 'Using `df.fillna(..., inplace=True)` on sliced columns can fail silently or cause inconsistent behavior
      across Pandas 2.0+ CoW (Copy-on-Write). Prefer explicit assignment: `df[''col''] = df[''col''].fillna(val)`.'
  takeaways:
    hinglish_line: Production mein Pandas — Data Cleaning ko use karte waqt edge cases aur mathematical constraints ko pehle
      validate karo, taaki downstream deployment bilkul rock-solid rahe!
    bullets:
    - |-
      <strong>
                 df.isnull().sum()
                </strong>
                is the first EDA step — always check for nulls before any analysis.
    - |-
      <strong>
                 fillna()
                </strong>
                with method='ffill' for time series, median/mean for numerical, mode for categorical.
    - |-
      <strong>
                 drop_duplicates()
                </strong>
                is essential — real data always has duplicates. Always check with .duplicated().sum() first.
    - |-
      <strong>
                 apply() with lambda
                </strong>
                lets you transform columns using custom logic — essential for feature engineering.
