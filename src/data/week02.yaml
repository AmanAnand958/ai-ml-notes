  quizzes:
  - num_str: QUESTION 1 OF 7
    question: What is the key advantage of a CTE over a subquery?
    qid: q12_1
    options:
    - letter: A
      text: CTEs are faster than subqueries always
      is_correct: false
    - letter: B
      text: CTEs are reusable and make complex queries much more readable
      is_correct: true
    - letter: C
      text: CTEs can update data; subqueries cannot
      is_correct: false
    - letter: D
      text: CTEs work with JOINs; subqueries don't
      is_correct: false
    correct_fb: ✅ Correct! CTEs (Common Table Expressions) give a meaningful name
      to intermediate results, making the query self-documenting. You can also reference
      the same CTE multiple times in one query — unlike a subquery that must be repeated.
    wrong_fb: ❌ CTEs improve readability by naming intermediate results. You can reference
      them multiple times. Performance is similar to subqueries — the main benefit
      is clean, maintainable code.
  - num_str: QUESTION 2 OF 7
    question: To find the 2nd highest salary in each department using window functions,
      which function should you use?
    qid: q12_2
    options:
    - letter: A
      text: MAX() with HAVING
      is_correct: false
    - letter: B
      text: RANK() without PARTITION BY
      is_correct: false
    - letter: C
      text: DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) then filter
        WHERE rank=2
      is_correct: true
    - letter: D
      text: LAG(salary, 1) OVER ...
      is_correct: false
    correct_fb: ✅ Correct! DENSE_RANK() with PARTITION BY dept ranks employees within
      each department. Filter WHERE rank=2 gives 2nd highest per dept. Use DENSE_RANK
      (not RANK) so ties don't skip rank 2.
    wrong_fb: ❌ Use DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC)
      wrapped in a CTE, then filter WHERE rank = 2. This is one of the most common
      SQL interview questions.
  - num_str: QUESTION 3 OF 7
    question: "What does\n        \n         LAG(revenue, 1) OVER (ORDER BY month)\n\
      \        \n        return for the first row?"
    qid: q12_3
    options:
    - letter: A
      text: '0'
      is_correct: false
    - letter: B
      text: NULL (no previous row exists)
      is_correct: true
    - letter: C
      text: The last row's revenue
      is_correct: false
    - letter: D
      text: An error
      is_correct: false
    correct_fb: ✅ Correct! LAG() looks back N rows. For the first row, there's no
      previous row, so it returns NULL. You can handle this with COALESCE(LAG(revenue,1)
      OVER(...), 0) to default to 0.
    wrong_fb: ❌ LAG returns NULL for the first row because there's no previous row.
      Handle it with COALESCE(LAG(revenue,1) OVER(ORDER BY month), 0).
  - num_str: QUESTION 4 OF 7
    question: What is the main difference between a standard View and a Materialized
      View?
    qid: q12_4
    options:
    - letter: A
      text: Standard views allow indexes; materialized views do not.
      is_correct: false
    - letter: B
      text: Materialized views physically store the query results and require refreshing;
        standard views execute the query dynamically on the fly.
      is_correct: true
    - letter: C
      text: Standard views can only perform SELECT operations; materialized views
        can perform INSERT/UPDATE.
      is_correct: false
    - letter: D
      text: Standard views are stored in memory; materialized views are stored on
        disk permanently.
      is_correct: false
    correct_fb: ✅ Correct! A standard view runs its query dynamically every time it
      is referenced. A materialized view acts like a cache table, storing physical
      records that must be periodically refreshed.
    wrong_fb: ❌ Materialized views cache physical records and must be refreshed manually
      or on a schedule, whereas standard views dynamically evaluate the SQL on the
      fly.
  - num_str: QUESTION 5 OF 7
    question: Why are SQL Cursors generally discouraged in production databases for
      large-scale operations?
    qid: q12_5
    options:
    - letter: A
      text: Cursors process records row-by-row, which lacks the optimization and speed
        of set-based operations.
      is_correct: true
    - letter: B
      text: Cursors are deprecated in modern relational databases.
      is_correct: false
    - letter: C
      text: Cursors are restricted to only SELECT statements and cannot update data.
      is_correct: false
    - letter: D
      text: Cursors require administrator privileges to run.
      is_correct: false
    correct_fb: ✅ Correct! SQL databases are optimized for set-based processing. Row-by-row
      cursor loops run procedurally, bypassing the compiler's set optimizations and
      causing high I/O overhead.
    wrong_fb: ❌ Cursors operate row-by-row (procedural loops), which is vastly slower
      and less efficient than the database engine's set-based parallel operations.
      Use set operations whenever possible.
  - num_str: QUESTION 6 OF 7
    question: "Which operator in PostgreSQL's\n        \n         pgvector\n     \
      \   \n        extension calculates the Cosine Distance similarity?"
    qid: q12_6
    options:
    - letter: A
      text: '&lt;-&gt;'
      is_correct: false
    - letter: B
      text: '&lt;#&gt;'
      is_correct: false
    - letter: C
      text: '&lt;=&gt;'
      is_correct: true
    - letter: D
      text: +
      is_correct: false
    correct_fb: ✅ Correct! &lt;=&gt; calculates Cosine Distance (often used in textual/embeddings
      semantic similarity). &lt;-&gt; is L2 Euclidean Distance, and &lt;#&gt; represents
      Negative Inner Product.
    wrong_fb: ❌ The &lt;=&gt; operator is used for Cosine Distance. &lt;-&gt; is used
      for L2/Euclidean distance.
  - num_str: QUESTION 7 OF 7
    question: What are the two query components combined by a UNION/UNION ALL inside
      a Recursive CTE?
    qid: q12_7
    options:
    - letter: A
      text: Inner query and Outer query
      is_correct: false
    - letter: B
      text: Anchor member and Recursive member
      is_correct: true
    - letter: C
      text: Base table and Temp view
      is_correct: false
    - letter: D
      text: Parent node and Child node
      is_correct: false
    correct_fb: ✅ Correct! The Anchor member sets the initial result set (the root),
      and the Recursive member runs repeatedly, referencing the CTE name, until no
      new rows are found.
    wrong_fb: ❌ A recursive query combines the Anchor Member (base case) and the Recursive
      Member (loops back on the CTE) using a UNION/UNION ALL operator.
  flashcards:
  - front: CTE syntax?
    back: "WITH cte_name AS (\n          <br/>\n          SELECT ...\n          <br/>\n\
      \          )\n          <br/>\n          SELECT * FROM cte_name"
  - front: RANK vs DENSE_RANK?
    back: "RANK: 1,1,3 (skips after tie)\n          <br/>\n          DENSE_RANK: 1,1,2\
      \ (no skip)\n          <br/>\n          ROW_NUMBER: always unique"
  - front: Window function syntax?
    back: "func() OVER (\n          <br/>\n          PARTITION BY col\n          <br/>\n\
      \          ORDER BY col2\n          <br/>\n          )"
  - front: COALESCE use case?
    back: "Return first non-NULL value\n          <br/>\n          COALESCE(phone,\
      \ email, 'none')\n          <br/>\n          → phone if exists, else email..."
  - front: View vs Materialized View?
    back: "View: virtual, dynamic query.\n          <br/>\n          Materialized\
      \ View: physical cache, requires manual REFRESH."
  - front: Database Trigger?
    back: Automatic procedure executing on events (INSERT/UPDATE/DELETE). BEFORE/AFTER,
      ROW/STATEMENT level.
  - front: Why avoid Cursors?
    back: Cursors iterate row-by-row (slow). Prefer set-based operations (highly optimized
      by db compiler).
  - front: pgvector similarity operator?
    back: "Cosine Similarity: 1 - (embedding &lt;=&gt; '[...]')\n          <br/>\n\
      \          Cosine Distance: &lt;=&gt; (smaller = more similar)"
  - front: Recursive CTE parts?
    back: Anchor Member (base query) + UNION ALL + Recursive Member (joining CTE back
      with table)
  - front: ACID Isolation levels?
    back: Read Uncommitted, Read Committed (default), Repeatable Read, and Serializable
      (strictest)
  gotcha:
    title: '⚠️ Gotcha: Dictionary Keys & List Mutability'
    description: Never use mutable data types (like lists) as dictionary keys or default
      function arguments (`def func(x=[])`).
  takeaways:
    hinglish_line: ''
    bullets:
    - "<strong>\n           Window functions\n          </strong>\n          compute\
      \ across rows related to the current row without collapsing them.\n        \
      \  \n           ROW_NUMBER()\n          \n          ,\n          \n        \
      \   RANK()\n          \n          ,\n          \n           DENSE_RANK()\n \
      \         \n          are essential for interview problems."
    - "<strong>\n           CTEs (WITH clause)\n          </strong>\n          make\
      \ complex queries readable.\n          <strong>\n           Recursive CTEs\n\
      \          </strong>\n          loop back on themselves using an Anchor Member\
      \ and a Recursive Member, making them ideal for hierarchical or tree traversal\
      \ queries."
    - "<strong>\n           Views\n          </strong>\n          are virtual tables\
      \ executing queries dynamically.\n          <strong>\n           Materialized\
      \ Views\n          </strong>\n          cache physical data for faster queries\
      \ but require manual updates using\n          \n           REFRESH MATERIALIZED\
      \ VIEW\n          \n          ."
    - "<strong>\n           Triggers\n          </strong>\n          are event-driven\
      \ database procedures executing automatically BEFORE or AFTER database write\
      \ events (INSERT, UPDATE, DELETE)."
    - "<strong>\n           Stored Procedures vs. Functions:\n          </strong>\n\
      \          Stored Procedures (\n          \n           CALL\n          \n  \
      \        ) are used for business workflows and support transaction control (\n\
      \          \n           COMMIT\n          \n          /\n          \n      \
      \     ROLLBACK\n          \n          ). User-Defined Functions (\n        \
      \  \n           SELECT\n          \n          ) must return a value and cannot\
      \ control transactions."
    - "<strong>\n           Cursors\n          </strong>\n          iterate result\
      \ sets row-by-row and are generally slower than optimized\n          <strong>\n\
      \           set-based SQL\n          </strong>\n          operations, which\
      \ the database engine executes in parallel."
    - "<strong>\n           pgvector Similarity Search:\n          </strong>\n   \
      \       Relational databases can perform vector search natively using\n    \
      \      \n           pgvector\n          \n          . This uses distance operators\
      \ like Cosine Distance (\n          \n           &lt;=&gt;\n          \n   \
      \       ) or L2 Distance (\n          \n           &lt;-&gt;\n          \n \
      \         ) and indexes (IVFFlat/HNSW) to retrieve semantically matching text\
      \ embeddings (crucial for AI/ML RAG architectures)."
    - "<strong>\n           Concurrency &amp; Locks:\n          </strong>\n      \
      \    Relational databases manage concurrent access using Shared (\n        \
      \  \n           FOR SHARE\n          \n          ) or Exclusive (\n        \
      \  \n           FOR UPDATE\n          \n          ) locks and isolation levels\
      \ (Read Committed to Serializable) to enforce ACID consistency."
