  - front: Difference between inner and left join?
    back: |-
      inner = only matches
                <br/>
                left = all from left + matches
                <br/>
                outer = all from both
  - front: How to apply a function to every row?
    back: |-
      df.apply(func, axis=1)
                <br/>
                axis=0 = per column
                <br/>
