    >\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\"\
    >import</span> pandas <span class=\"kw\">as</span> pd\n\ndf = pd.<span class=\"\
    fn\">DataFrame</span>({<span class=\"str\">\"score\": [80, 90, 70], \"grade\"\
    : [\"A\", \"A+\", \"B\"</span>]})\n<span class=\"fn\">print</span>(df.iloc[<span\
    \ class=\"str\">\"score\"</span>])     <span class=\"cm\"># Bug 1</span>\n<span\
    \ class=\"fn\">print</span>(df[df.score &gt; <span class=\"num\">75</span>]) \
    \   <span class=\"cm\"># Bug 2 — hint: preferred style</span>\ntop = df.loc[<span\
    \ class=\"num\">0</span>:<span class=\"num\">1</span>, score]   <span class=\"\
    cm\"># Bug 3</span></pre>\n</div>\n<button class=\"solution-toggle\" onclick=\"\
    toggleSolution('debug8-sol')\">\n        \U0001F441 Show Fixes\n       </button>\n\
    <div class=\"solution-box\" id=\"debug8-sol\">\n<div class=\"sol-header\">\n \
    \        BUGS EXPLAINED\n        </div>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n           python — fixed\n          </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button><button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">Run</button></div>\n\
    </div>\n<pre><span class=\"cm\"># Bug 1: iloc uses INTEGER positions, not column\
    \ names</span>\n<span class=\"fn\">print</span>(df[<span class=\"str\">\"score\"\
    </span>])            <span class=\"cm\"># correct: bracket notation for column</span>\n\
    <span class=\"cm\"># Bug 2: df.score works but df[\"score\"] is preferred (no\
