    sol_id: sol-w2d12t1
    solution_title: 📓 Complete Colab Code
    solution_code: |
      # SQL Problems Practice
      import sqlite3
      conn = sqlite3.connect(":memory:")
      cur = conn.cursor()
      cur.execute("CREATE TABLE orders (id INTEGER, customer TEXT, product TEXT, amount REAL, city TEXT)")
      for d in [(1,'Alice','Laptop',1200,'Mumbai'),(2,'Bob','Phone',800,'Delhi'),(3,'Alice','Tablet',600,'Mumbai'),
                (4,'Charlie','Laptop',1300,'Pune'),(5,'Diana','Phone',750,'BLR'),(6,'Bob','Charger',50,'Delhi')]:
          cur.execute("INSERT INTO orders VALUES (?,?,?,?,?)", d)
      print("Total revenue:", cur.execute("SELECT SUM(amount) FROM orders").fetchone()[0])
      print("Revenue by customer:")
      for r in cur.execute("SELECT customer, SUM(amount) FROM orders GROUP BY customer ORDER BY SUM(amount) DESC"): print(r)
      print("City with most orders:")
      for r in cur.execute("SELECT city, COUNT(*) FROM orders GROUP BY city ORDER BY COUNT(*) DESC LIMIT 1"): print(r)
      conn.close()
      assert cur is not None, "cur should not be None"
    solution_lang: python
  - title: Top Earner Per Department (Classic Interview)
    badge: MEDIUM
    badge_class: tb-hard
    time: 90 min
    prompt_html: |-
      <strong><p style="margin-bottom: 0.6rem;">
                 Usin</strong> <p style="margin-bottom: 0.6rem;">
                 Using DB Fiddle (dbfiddle.uk), create a sample employees table with 15 rows across 3 departments.
                </p>
      <ul style="padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;">
      <li style="margin-bottom: 0.4rem;">
                  Then write a query using a CTE + ROW_NUMBER() to find the top-earning employee in each department.
                 </li>
      <li style="margin-bottom: 0.4rem;">
                  Then extend it to find TOP 3 per department using DENSE_RANK.
                 </li>
      </ul>
    done_when: Both queries run correctly in DB Fiddle. You can reproduce them from memory in 5 minutes.
    git_cmd: 'git add top_earner_per_department_classic_interview.py &amp;&amp; git commit -m "feat(day): day12: top-earner-per-department-classic-interview"'
    sol_id: sol-w2d12t2
    solution_title: 📓 Complete Colab Code
    solution_code: |
      # Top Earner Per Department - Classic Interview
      import sqlite3
      conn = sqlite3.connect(":memory:")
      cur = conn.cursor()
      cur.execute("CREATE TABLE emp (id INTEGER, name TEXT, dept TEXT, salary INTEGER)")
      for e in [(1,'Alice','Eng',100),(2,'Bob','Eng',90),(3,'Charlie','Sales',80),(4,'Diana','Sales',95),(5,'Eve','Eng',85)]:
          cur.execute("INSERT INTO emp VALUES (?,?,?,?)", e)
      print("All employees:")
      for r in cur.execute("SELECT * FROM emp"): print(r)
      print("Top earner per department:")
      for r in cur.execute("SELECT e.dept, e.name, e.salary FROM emp e WHERE e.salary = (SELECT MAX(salary) FROM emp WHERE dept=e.dept)"):
          print(f"  {r[0]}: {r[1]} (${r[2]}k)")
      conn.close()
      assert cur is not None, "cur should not be None"
    solution_lang: python
  quizzes:
  - num_str: Question 1
    question: What is the key advantage of a CTE over a subquery?
    qid: q12_1
    options:
    - letter: A
      text: CTEs are faster than subqueries always
      is_correct: false
      id: a
    - letter: B
      text: CTEs are reusable and make complex queries much more readable
      is_correct: true
      id: b
    - letter: C
      text: CTEs can update data; subqueries cannot
      is_correct: false
      id: c
    - letter: D
      text: CTEs work with JOINs; subqueries don't
      is_correct: false
      id: d
    correct_fb: ✅ Correct! CTEs (Common Table Expressions) give a meaningful name to intermediate results, making the query
      self-documenting. You can also reference the same CTE multiple times in one query — unlike a subquery that must be repeated.
    wrong_fb: ❌ CTEs improve readability by naming intermediate results. You can reference them multiple times. Performance
      is similar to subqueries — the main benefit is clean, maintainable code.
    correct: b
    explanation: ''
  - num_str: Question 2
    question: To find the 2nd highest salary in each department using window functions, which function should you use?
    qid: q12_2
    options:
    - letter: A
      text: MAX() with HAVING
      is_correct: false
      id: a
    - letter: B
      text: RANK() without PARTITION BY
      is_correct: false
      id: b
    - letter: C
      text: DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) then filter WHERE rank=2
      is_correct: true
      id: c
    - letter: D
      text: LAG(salary, 1) OVER ...
      is_correct: false
      id: d
    correct_fb: ✅ Correct! DENSE_RANK() with PARTITION BY dept ranks employees within each department. Filter WHERE rank=2
      gives 2nd highest per dept. Use DENSE_RANK (not RANK) so ties don't skip rank 2.
    wrong_fb: ❌ Use DENSE_RANK() OVER (PARTITION BY department ORDER BY salary DESC) wrapped in a CTE, then filter WHERE rank
      = 2. This is one of the most common SQL interview questions.
    correct: c
    explanation: ''
  - num_str: Question 3
    question: "What does\n        \n         LAG(revenue, 1) OVER (ORDER BY month)\n        \n        return for the first\
      \ row?"
    qid: q12_3
    options:
    - letter: A
      text: Option A
      is_correct: false
      id: a
    - letter: B
      text: NULL (no previous row exists)
      is_correct: true
      id: b
    - letter: C
      text: The last row's revenue
      is_correct: false
      id: c
    - letter: D
      text: An error
      is_correct: false
      id: d
    correct_fb: ✅ Correct! LAG() looks back N rows. For the first row, there's no previous row, so it returns NULL. You can
      handle this with COALESCE(LAG(revenue,1) OVER(...), 0) to default to 0.
    wrong_fb: ❌ LAG returns NULL for the first row because there's no previous row. Handle it with COALESCE(LAG(revenue,1)
      OVER(ORDER BY month), 0).
    correct: b
    explanation: ''
  - num_str: Question 4
    question: What is the main difference between a standard View and a Materialized View?
    qid: q12_4
    options:
    - letter: A
      text: Standard views allow indexes; materialized views do not.
      is_correct: false
      id: a
    - letter: B
      text: Materialized views physically store the query results and require refreshing; standard views execute the query
        dynami...
      is_correct: true
      id: b
    - letter: C
      text: Standard views can only perform SELECT operations; materialized views can perform INSERT/UPDATE.
      is_correct: false
      id: c
    - letter: D
      text: Standard views are stored in memory; materialized views are stored on disk permanently.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! A standard view runs its query dynamically every time it is referenced. A materialized view acts
      like a cache table, storing physical records that must be periodically refreshed.
    wrong_fb: ❌ Materialized views cache physical records and must be refreshed manually or on a schedule, whereas standard
      views dynamically evaluate the SQL on the fly.
    correct: b
    explanation: ''
  - num_str: Question 5
    question: Why are SQL Cursors generally discouraged in production databases for large-scale operations?
    qid: q12_5
    options:
    - letter: A
      text: Cursors process records row-by-row, which lacks the optimization and speed of set-based operations.
      is_correct: true
      id: a
    - letter: B
      text: Cursors are deprecated in modern relational databases.
      is_correct: false
      id: b
    - letter: C
      text: Cursors are restricted to only SELECT statements and cannot update data.
      is_correct: false
      id: c
    - letter: D
      text: Cursors require administrator privileges to run.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! SQL databases are optimized for set-based processing. Row-by-row cursor loops run procedurally,
      bypassing the compiler's set optimizations and causing high I/O overhead.
    wrong_fb: ❌ Cursors operate row-by-row (procedural loops), which is vastly slower and less efficient than the database
      engine's set-based parallel operations. Use set operations whenever possible.
    correct: a
    explanation: ''
