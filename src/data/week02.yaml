  quizzes:
  - num_str: QUESTION 1 OF 4
    question: "What does\n         \n          df.shape\n         \n         return\
      \ for a DataFrame with 100 rows and 5 columns?"
    qid: q8_1
    options:
    - letter: A
      text: '[100, 5]'
      is_correct: false
    - letter: B
      text: (100, 5)
      is_correct: true
    - letter: C
      text: '500'
      is_correct: false
    - letter: D
      text: (5, 100)
      is_correct: false
    correct_fb: ✅ Correct! shape returns a tuple (rows, columns). Always rows first,
      columns second. Tuple uses () not []. This is important when checking your data
      dimensions before ML.
    wrong_fb: ❌ df.shape returns a tuple (rows, columns) → (100, 5). It's a tuple
      (with parentheses), not a list. Rows always come first.
  - num_str: QUESTION 2 OF 4
    question: Which statement selects all rows where the "age" column is greater than
      25?
    qid: q8_2
    options:
    - letter: A
      text: df.iloc[df["age"] &gt; 25]
      is_correct: false
    - letter: B
      text: df.select(age &gt; 25)
      is_correct: false
    - letter: C
      text: df[df["age"] &gt; 25]
      is_correct: true
    - letter: D
      text: df.where("age &gt; 25")
      is_correct: false
    correct_fb: '✅ Correct! Boolean indexing: df[condition]. The inner df["age"] &gt;
      25 creates a boolean Series (True/False per row), then df[that_series] filters
      to only True rows. This is the most used pattern in data analysis.'
    wrong_fb: '❌ Boolean indexing syntax: df[df["age"] &gt; 25]. The inner expression
      creates a True/False mask, and the outer df[] applies the mask. iloc doesn''t
      accept boolean conditions like that.'
  - num_str: QUESTION 3 OF 4
    question: "What is the difference between\n         \n          df.iloc[0]\n \
      \        \n         and\n         \n          df.loc[0]\n         \n       \
      \  ?"
    qid: q8_3
    options:
    - letter: A
      text: They are always identical
      is_correct: false
    - letter: B
      text: iloc uses integer position; loc uses index label
      is_correct: true
    - letter: C
      text: iloc is for columns; loc is for rows
      is_correct: false
    - letter: D
      text: iloc is slower than loc
      is_correct: false
    correct_fb: ✅ Correct! iloc = integer Location (always 0,1,2... position). loc
      = Label-based Location (uses the actual index value). They differ when the index
      is not 0,1,2 — e.g. after filtering, your index might be [5,10,22] — then iloc[0]
      = row at position 0, but loc[0] = KeyError!
    wrong_fb: ❌ iloc uses integer position (0,1,2...), loc uses index labels. They
      behave differently when the DataFrame index is not the default 0,1,2 sequence
      — for example after filtering.
  - num_str: QUESTION 4 OF 4
    question: "What does\n         \n          df.info()\n         \n         show\
      \ that\n         \n          df.describe()\n         \n         does NOT?"
    qid: q8_4
    options:
    - letter: A
      text: Mean and standard deviation
      is_correct: false
    - letter: B
      text: Data types and non-null counts per column
      is_correct: true
    - letter: C
      text: First 5 rows of data
      is_correct: false
    - letter: D
      text: Minimum and maximum values
      is_correct: false
    correct_fb: '✅ Correct! info() shows: column names, data types (dtype), non-null
      count, and memory usage. describe() shows: count, mean, std, min, 25%, 50%,
      75%, max — but only for numeric columns. Always run both when exploring a new
      dataset.'
    wrong_fb: ❌ info() shows dtypes, non-null counts, and memory usage. describe()
      shows statistics (mean, std, min, max) for numeric columns. They are complementary
      — use both.
  flashcards:
  - front: What is the difference between a Series and DataFrame?
    back: "Series = 1D (one column)\n           <br/>\n           DataFrame = 2D (rows\
      \ + columns)\n           <br/>\n           like a table"
  - front: How to load a CSV file in Pandas?
    back: "pd.read_csv(\"filename.csv\")\n           <br/>\n           returns a DataFrame"
  - front: What does df.describe() show?
    back: "count, mean, std,\n           <br/>\n           min, 25%, 50%, 75%, max\n\
      \           <br/>\n           for numeric columns only"
  - front: iloc vs loc — key rule?
    back: "iloc = integer position (0,1,2)\n           <br/>\n           loc = index\
      \ label\n           <br/>\n           After filtering, use reset_index()!"
  - front: Boolean indexing pattern?
    back: "df[df[\"col\"] &gt; value]\n           <br/>\n           Multiple: use\
      \ &amp; or |\n           <br/>\n           Wrap each in ()"
  gotcha:
    title: '⚠️ Gotcha: Dictionary Keys & List Mutability'
    description: Never use mutable data types (like lists) as dictionary keys or default
      function arguments (`def func(x=[])`).
  takeaways:
    hinglish_line: ''
    bullets:
    - DataFrame = 2D table. Series = 1 column. All ML data starts as a DataFrame.
    - Always run shape, info(), describe(), isnull().sum() on any new dataset.
    - iloc = position (integers), loc = label (column names and index values).
    - 'Boolean indexing: df[df["col"] &gt; value] — this is the SQL WHERE of Pandas.'
    - isnull().sum() tells you where your data has gaps — critical before ML!
