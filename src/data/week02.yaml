  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">\n       1. The Git Mental Model\n\
    \      </h3>\n<div class=\"mermaid\">\ngraph LR\n  WD[\"Working Directory \\n Untracked / Modified\"] --&gt;|git add|\
    \ SA[\"Staging Area \\n Staged\"]\n  SA --&gt;|git commit| LR[\"Local Repo \\n Committed\"]\n  LR --&gt;|git push| RR[\"\
    Remote Repo / GitHub \\n Pushed\"]\n</div>\n<div class=\"diagram-cap\">\n       Git's 4 zones — understand this and Git\
    \ makes sense\n      </div>\n<h3 class=\"sh3\">\n       2. Core Git Commands\n      </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       Git version control tracks modifications across files.\n\
    \      </p>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       Commands\
    \ like\n       \n        status\n       \n       ,\n       \n        add\n       \n       , and\n       \n        commit\n\
    \       \n       manage changes in the staging area.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         bash — git_workflow.sh\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left:\
    \ 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"cm\">#\
    \ --- SETUP (one-time) ---</span>\ngit config --<span class=\"kw\">global</span> user.name <span class=\"str\">\"Your\
    \ Name\"</span>\ngit config --<span class=\"kw\">global</span> user.email <span class=\"str\">\"your@email.com\"</span>\n\
    \n<span class=\"cm\"># --- START A PROJECT ---</span>\ngit init                      <span class=\"cm\"># start tracking\
    \ in current folder</span>\ngit clone &lt;url&gt;               <span class=\"cm\"># copy a remote repo to local</span>\n\
    \n<span class=\"cm\"># --- DAILY WORKFLOW ---</span>\ngit status                    <span class=\"cm\"># what changed?</span>\n\
    git add filename.py           <span class=\"cm\"># stage ONE file</span>\ngit add .                     <span class=\"\
    cm\"># stage ALL changed files</span>\ngit commit -m <span class=\"str\">\"feat: add pandas data cleaning script\"</span>\
    \  <span class=\"cm\"># snapshot</span>\ngit push origin main          <span class=\"cm\"># upload to GitHub</span>\n\
    git pull origin main          <span class=\"cm\"># download latest from GitHub</span>\n\n<span class=\"cm\"># --- HISTORY\
    \ ---</span>\ngit log --oneline             <span class=\"cm\"># compact commit history</span>\ngit diff HEAD~<span class=\"\
    num\">1</span>               <span class=\"cm\"># compare with last commit</span>\ngit checkout abc1234          <span\
    \ class=\"cm\"># jump to a specific commit</span></code></pre>\n</div>\n<h3 class=\"sh3\">\n       3. Branching — The\
    \ Safe Way to Experiment\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       Branching isolates code changes, enabling developers to build features or fix bugs in parallel without disrupting\
    \ the main production branch.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n   \
    \      bash — git_branches.sh\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"cm\"># Create and\
    \ switch to a new branch</span>\ngit checkout -b feature/pandas-cleaning   <span class=\"cm\"># create + switch</span>\n\
    git branch                                <span class=\"cm\"># list all branches</span>\n\n<span class=\"cm\"># Work on\
    \ your branch, commit changes...</span>\ngit add .\ngit commit -m <span class=\"str\">\"feat: add Titanic data cleaning\"\
    </span>\n\n<span class=\"cm\"># Switch back to main and merge</span>\ngit checkout main\ngit merge feature/pandas-cleaning\
    \        <span class=\"cm\"># bring changes in</span>\ngit branch -d feature/pandas-cleaning   <span class=\"cm\"># delete\
    \ merged branch</span></code></pre>\n</div>\n<h3 class=\"sh3\">\n       3.5 Advanced Git: Stash, Conflicts &amp; Rewriting\
    \ History\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n   \
    \    Advanced Git commands allow stashing changes temporarily, resolving merge conflicts, and interactive rebasing to\
    \ maintain a clean project history.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         bash — advanced_git.sh\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"cm\"># Stash: \"\
    I'm not ready to commit, but need to switch branches\"</span>\ngit stash                 <span class=\"cm\"># saves uncommitted\
    \ work temporarily</span>\ngit checkout other-branch\ngit checkout feature-branch\ngit stash pop             <span class=\"\
    cm\"># brings your saved work back</span>\n\n<span class=\"cm\"># Merge Conflicts happen when 2 people edit the same line.</span>\n\
    <span class=\"cm\"># Git pauses the merge and modifies the file to show both versions.</span>\n<span class=\"cm\"># You\
    \ must manually edit the file to fix it, then git add &amp; commit.</span>\n\n<span class=\"cm\"># Rebase vs Merge (Interview\
    \ Favorite)</span>\n<span class=\"cm\"># Merge: Keeps history exactly as it happened (creates a merge commit).</span>\n\
    <span class=\"cm\"># Rebase: Re-applies your branch on top of main (linear history).</span>\ngit pull --rebase origin\
    \ main\n\n<span class=\"cm\"># Undo mistakes</span>\ngit revert HEAD           <span class=\"cm\"># Safely undoes last\
    \ commit by creating inverse commit</span>\ngit reset --hard HEAD~<span class=\"num\">1</span>   <span class=\"cm\">#\
    \ DANGEROUS: permanently deletes the last commit</span></code></pre>\n</div>\n<h3 class=\"sh3\">\n       4. Writing a\
    \ Professional README.md\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       A README file provides clear documentation on installation, usage, architecture, and configuration, acting as\
    \ the entry point for new contributors.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         markdown — README.md template\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left:\
    \ 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"cm\">#\
    \ \U0001F6A2 Titanic Data Analysis</span>\n\n<span class=\"cm\">## \U0001F4CC Overview</span>\nComplete EDA on the Titanic\
    \ dataset exploring survival rates\nby passenger <span class=\"kw\">class</span>, gender, <span class=\"kw\">and</span>\
    \ age.\n\n<span class=\"cm\">## \U0001F50D Key Findings</span>\n- Women had 3x higher survival rate than <span class=\"\
    fn\">men</span> (<span class=\"num\">74</span>% vs <span class=\"num\">19</span>%)\n- 1st <span class=\"kw\">class</span>\
    \ <span class=\"cls\">passengers</span> survived at <span class=\"num\">63</span>% vs <span class=\"num\">24</span>% <span\
    \ class=\"kw\">in</span> 3rd <span class=\"kw\">class</span>\n- Children under <span class=\"num\">10</span> had <span\
    \ class=\"num\">60</span>% survival rate\n\n<span class=\"cm\">## \U0001F6E0️ Tech Stack</span>\nPython · Pandas · Pandas\
    \ plotting · Jupyter\n\n<span class=\"cm\">## \U0001F4C2 Files</span>\n- `eda_titanic.ipynb` — Main analysis notebook\n\
    - `data/train.csv` — <span class=\"fn\">Dataset</span> (<span class=\"kw\">from</span> Kaggle)\n\n<span class=\"cm\">##\
    \ ▶️ Run Locally</span>\ngit clone &lt;repo-url&gt;\npip install -r requirements.txt\njupyter notebook eda_titanic.ipynb</code></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       5. .gitignore — Never Push Secrets or Junk\n      </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       The\n       \n        .gitignore\n       \n     \
    \  file prevents build artifacts, local environment configurations, and sensitive credentials from being committed to\
    \ repository history.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">gitignore</span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n\
    </div>\n</div>\n<pre><code class=\"language-html\"><span class=\"cm\"># Virtual environments</span>\nvenv/\n.env\nenv/\n\
    \n<span class=\"cm\"># Python cache</span>\n__pycache__/\n*.pyc\n*.pyo\n\n<span class=\"cm\"># Jupyter checkpoints</span>\n\
    .ipynb_checkpoints/\n\n<span class=\"cm\"># Data files (often too large for GitHub)</span>\n*.csv\n*.xlsx\ndata/raw/\n\
    \n<span class=\"cm\"># API keys / secrets (NEVER push these!)</span>\n.env\nsecrets.json\nconfig.py</code></pre>\n</div>\n\
    <div class=\"hinglish\">\n       \U0001F4A1 Ek line mein: Git = local version control (commits).\n       <br/>\n<br/>\n\
    \       GitHub = remote backup + portfolio.\n       <br/>\n<br/>\n       Branch = safe experiment zone.\n       <br/>\n\
    <br/>\n       README = project ka face — isko seriously lena. .gitignore = private cheezein hide karo.\n      </div>\n\
    <details style=\"margin-top:20px; background:rgba(255,255,255,0.03); padding:10px; border-radius:8px;\">\n<summary style=\"\
    cursor:pointer; font-weight:bold; color:var(--orange);\">\n        Pro Git: SSH, Cherry-pick, Bisect &amp; Hooks\n   \
    \    </summary>\n<h3 class=\"sh3\">\n        6. SSH Keys &amp; Authentication\n       </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n        SSH authentication secures remote operations, eliminating\
    \ the need to enter account credentials during git push and pull procedures.\n       </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n          bash — ssh_setup.sh\n         </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"\
    runCode(this)\" style=\"margin-left: 4px;\">\n           Run\n          </button>\n</div>\n</div>\n<pre><code class=\"\
    language-html\"><span class=\"cm\"># SSH vs HTTPS: SSH = key-based (no password every push)</span>\n<span class=\"cm\"\
    ># HTTPS = username+token (fine but repetitive)</span>\n\n<span class=\"cm\"># Generate SSH key pair (once per machine)</span>\n\
    ssh-keygen -t ed25519 -C <span class=\"str\">\"your@email.com\"</span>\n<span class=\"cm\"># Creates: ~/.ssh/id_ed25519\
    \ (private key) + ~/.ssh/id_ed25519.pub (public)</span>\n\n<span class=\"cm\"># Copy public key to GitHub → Settings →\
    \ SSH Keys → New</span>\ncat ~/.ssh/id_ed25519.pub  <span class=\"cm\"># paste this into GitHub</span>\n\n<span class=\"\
    cm\"># Test connection</span>\nssh -T git@github.com  <span class=\"cm\"># should say \"Hi username!\"</span>\n\n<span\
    \ class=\"cm\"># Clone with SSH (no password needed ever again)</span>\ngit clone git@github.com:username/repo.git</code></pre>\n\
    </div>\n<h3 class=\"sh3\">\n        7. Git Log — Visualizing History\n       </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n        The git log command displays the commit history of a repository, supporting\
    \ custom formatting and branching maps for tracing project changes.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n          bash — git_log.sh\n         </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n           Run\n          </button>\n</div>\n</div>\n<pre><code class=\"language-html\"\
    ><span class=\"cm\"># git log variants — find anything in history</span>\ngit log                           <span class=\"\
    cm\"># full log with diffs</span>\ngit log --oneline                 <span class=\"cm\"># one line per commit (compact)</span>\n\
    git log --oneline --graph --all   <span class=\"cm\"># visual ASCII branch graph</span>\ngit log --author=<span class=\"\
    str\">\"Rahul\"</span>          <span class=\"cm\"># filter by author</span>\ngit log --since=<span class=\"str\">\"2024-01-01\"\
    </span>      <span class=\"cm\"># since a date</span>\ngit log --grep=<span class=\"str\">\"fix\"</span>             \
    \ <span class=\"cm\"># search commit messages</span>\ngit log -p filename.py            <span class=\"cm\"># show all\
    \ changes to one file</span>\ngit show abc1234                  <span class=\"cm\"># full details of a specific commit</span></code></pre>\n\
    </div>\n<h3 class=\"sh3\">\n        8. Detached HEAD, Tags &amp; Cherry-pick\n       </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n        Cherry-picking imports specific commits from separate\
    \ branches, while tags label release versions and a detached HEAD state lets you inspect past commits.\n       </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          bash — advanced_git2.sh\n         </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n           Run\n          </button>\n\
    </div>\n</div>\n<pre><code class=\"language-html\"><span class=\"cm\"># Detached HEAD — when you checkout a commit directly\
    \ (not a branch)</span>\ngit checkout abc1234              <span class=\"cm\"># HEAD points to a commit, not a branch</span>\n\
    <span class=\"cm\"># Warning: commits here are \"floating\". Save work by creating a branch:</span>\ngit checkout -b branch-<span\
    \ class=\"kw\">from</span>-here\n\n<span class=\"cm\"># Tags — mark important commits (releases)</span>\ngit tag v1.<span\
    \ class=\"num\">0.0</span>                    <span class=\"cm\"># lightweight tag</span>\ngit tag -a v1.<span class=\"\
    num\">0.0</span> -m <span class=\"str\">\"First release\"</span>  <span class=\"cm\"># annotated tag (preferred)</span>\n\
    git push origin v1.<span class=\"num\">0.0</span>           <span class=\"cm\"># tags are NOT pushed by default!</span>\n\
    git push origin --tags           <span class=\"cm\"># push all tags</span>\ngit tag                          <span class=\"\
    cm\"># list all tags</span>\n\n<span class=\"cm\"># cherry-pick — apply ONE specific commit from another branch</span>\n\
    git cherry-pick abc1234          <span class=\"cm\"># apply that commit to current branch</span>\n<span class=\"cm\">#\
    \ Use case: a bug fix on feature branch needs to go to main now</span>\n<span class=\"cm\"># without merging the entire\
    \ feature branch</span></code></pre>\n</div>\n<h3 class=\"sh3\">\n        9. Git Bisect &amp; Reflog — Power Recovery\
    \ Tools\n       </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n    \
    \    Git bisect performs a binary search to identify the commit that introduced a bug, and git reflog tracks every local\
    \ reference change to recover lost commits.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n          bash — bisect_reflog.sh\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n           Run\n          </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"\
    cm\"># git bisect — binary search to find WHICH commit introduced a bug</span>\ngit bisect start\ngit bisect bad     \
    \              <span class=\"cm\"># current commit is broken</span>\ngit bisect good v1.<span class=\"num\">0.0</span>\
    \           <span class=\"cm\"># this version was working</span>\n<span class=\"cm\"># Git checks out the middle commit.\
    \ Test it, then:</span>\ngit bisect good   <span class=\"cm\"># or: git bisect bad</span>\n<span class=\"cm\"># Repeats\
    \ until it finds the exact breaking commit</span>\ngit bisect reset                 <span class=\"cm\"># return to normal</span>\n\
    \n<span class=\"cm\"># git reflog — the ultimate recovery tool</span>\n<span class=\"cm\"># Records EVERY HEAD movement\
    \ (even after reset --hard!)</span>\ngit reflog                       <span class=\"cm\"># shows all recent HEAD positions</span>\n\
    git checkout abc1234             <span class=\"cm\"># recover a \"deleted\" commit</span>\n<span class=\"cm\"># Reflog\
    \ saves you when git reset --hard deletes commits you needed</span></code></pre>\n</div>\n<h3 class=\"sh3\">\n       \
    \ 10. Pre-commit Hooks — Automate Quality Checks\n       </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n        Pre-commit hooks automatically execute scripts (like linters, formatting tools, or test\
    \ suites) before a commit is completed, ensuring standard code quality.\n       </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n          bash — pre_commit_hook.sh\n         </span>\n<div class=\"cb-btns\">\n\
    <button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n           Run\n          </button>\n</div>\n</div>\n<pre><code\
    \ class=\"language-html\"><span class=\"cm\"># Git hooks run scripts automatically at git events</span>\n<span class=\"\
    cm\"># Location: .git/hooks/pre-commit  (runs before every commit)</span>\n\n<span class=\"cm\"># Install pre-commit tool\
    \ (industry standard)</span>\npip install pre-commit\n\n<span class=\"cm\"># .pre-commit-config.yaml in repo root</span>\n\
    <span class=\"cm\"># repos:</span>\n<span class=\"cm\">#   - repo: https://github.com/psf/black</span>\n<span class=\"\
    cm\">#     hooks:</span>\n<span class=\"cm\">#       - id: black  (auto-format Python code)</span>\n<span class=\"cm\"\
    >#   - repo: https://github.com/PyCQA/flake8</span>\n<span class=\"cm\">#     hooks:</span>\n<span class=\"cm\">#    \
    \   - id: flake8  (catch style errors)</span>\n\npre-commit install  <span class=\"cm\"># now runs on every git commit\
    \ automatically</span>\n<span class=\"cm\"># If checks fail, the commit is BLOCKED until code is fixed</span></code></pre>\n\
    </div>\n<div class=\"ml-connect\">\n        In real ML teams, pre-commit hooks enforce code formatting (black), linting\
    \ (flake8), and even notebook cell output clearing so notebooks don't pollute git history with binary blobs.\n       </div>\n\
    </details>\n"
  predict:
    question: How many untracked files will remain in the staging area after running `git add a.py` when 3 new files exist?
    code: |-
      total_new_files = 3
      staged_files = 1
      untracked_remaining = total_new_files - staged_files
      print(untracked_remaining)
    answer: '2'
    explanation: Staging 1 specific file out of 3 new untracked files leaves exactly 2 untracked files in the working tree.
