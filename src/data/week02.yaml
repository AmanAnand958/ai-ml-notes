  hinglish: Correlation coefficient -1 se +1 tak hota hai. +1 matlab perfect positive
    relationship, -1 matlab perfect inverse. Feature selection mein highly correlated
    features ko drop karte hain.
  analogy: "School registry register ki tarah relational database ko socho.\n    \
    \   <br/>\n<br/>\n       Ek page pe student detail, doosre page pe attendance,\
    \ teesre page pe library books.\n       <br/>\n<br/>\n       In sabko link karne\
    \ ke liye standard columns hote hain (jaise Roll Number).\n       <br/>\n<br/>\n\
    \       Yahi Relational Database hai jahan multi-tables mein data linked rehta\
    \ hai."
  theory_html: "<h3 class=\"sh3\">\n       1. Database &amp; RDBMS Fundamentals\n\
    \      </h3>\n\n<p>\n       A\n       <strong>\n        Database\n       </strong>\n\
    \       is an organized collection of structured information or data, typically\
    \ stored electronically in a computer system.\n      </p>\n<p>\n       A\n   \
    \    <strong>\n        Relational Database Management System (RDBMS)\n       </strong>\n\
    \       is a type of database management system (DBMS) that stores data in tables\
    \ (relations) of rows (tuples) and columns (attributes), and manages data based\
    \ on the relational model.\n      </p>\n<h3 class=\"sh3\" style=\"color:var(--orange)\"\
    >\n       Entity Relationships &amp; Junction Tables\n      </h3>\n<p>\n     \
    \  Databases model the real world via three primary relationship types:\n    \
    \  </p>\n<ul style=\"margin-left:1.25rem; margin-bottom:1rem;\">\n<li>\n<strong>\n\
    \         One-to-One (1:1):\n        </strong>\n        A row in Table A is linked\
    \ to exactly one row in Table B. E.g., A\n        \n         user\n        \n\
    \        has exactly one\n        \n         user_profile\n        \n        .\n\
    \       </li>\n<li>\n<strong>\n         One-to-Many (1:N):\n        </strong>\n\
    \        A row in Table A can be linked to multiple rows in Table B. E.g., A\n\
    \        \n         department\n        \n        has multiple\n        \n   \
    \      employees\n        \n        , but each employee belongs to only one department.\n\
    \       </li>\n<li>\n<strong>\n         Many-to-Many (M:N):\n        </strong>\n\
    \        Multiple rows in Table A can relate to multiple rows in Table B. E.g.,\n\
    \        \n         students\n        \n        can enroll in multiple\n     \
    \   \n         courses\n        \n        , and each course has multiple students.\
    \ This is resolved in databases using a\n        <strong>\n         Junction Table\n\
    \        </strong>\n        (also called Join or Bridge table) that stores pairs\
    \ of foreign keys.\n       </li>\n</ul>\n<div class=\"mermaid\">\ngraph TD\nsubgraph\
    \ \"1:1 Relationship\"\n  User[\"users - user_id PK\"] --&gt;|1:1| Profile[\"\
    user_profiles - user_id FK, UNIQUE\"]\nend\nsubgraph \"1:N Relationship\"\n  Dept[\"\
    departments - dept_id PK\"] --&gt;|1:N| Emp[\"employees - dept_id FK\"]\nend\n\
    subgraph \"M:N Relationship\"\n  Student[\"students - student_id PK\"] --&gt;|1:N|\
    \ Enrollment[\"student_courses - Junction Table: student_id FK, course_id FK\"\
    ]\n  Course[\"courses - course_id PK\"] --&gt;|1:N| Enrollment\nend\n</div>\n\
    <div class=\"diagram-cap\">\n       RDBMS Relationship Cardinalities and Junction\
    \ Table implementation.\n      </div>\n<h3 class=\"sh3\">\n       2. SQL vs. Pandas\
    \ — The Paradigm Shift\n      </h3>\n\n<p>\n       As a data scientist, you already\
    \ know Pandas.\n      </p>\n<p>\n       But Pandas has a limit: it loads the\n\
    \       <strong>\n        entire dataset into RAM\n       </strong>\n       .\n\
    \      </p>\n<p>\n       If you have a 50GB dataset and 16GB of RAM, Pandas will\
    \ crash.\n      </p>\n<p>\n<strong>\n        SQL (Structured Query Language)\n\
    \       </strong>\n       solves this.\n      </p>\n<p>\n       SQL is\n     \
    \  <strong>\n        declarative\n       </strong>\n       (you define\n     \
    \  <em>\n        what\n       </em>\n       data you want, not\n       <em>\n\
    \        how\n       </em>\n       to get it) and operates directly on database\
    \ files stored on disk, streaming only the necessary results to your computer.\n\
    \      </p>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem\
    \ 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Feature\n\
    \        </th>\n<th>\n         Pandas\n        </th>\n<th>\n         SQL\n   \
    \     </th>\n</tr>\n<tr>\n<td>\n<strong>\n          Execution style\n        \
    \ </strong>\n</td>\n<td>\n         Procedural (Step-by-step code)\n        </td>\n\
    <td>\n         Declarative (Describe the target output)\n        </td>\n</tr>\n\
    <tr>\n<td>\n<strong>\n          Memory footprint\n         </strong>\n</td>\n\
    <td>\n         High (Loads entire dataset into RAM)\n        </td>\n<td>\n   \
    \      Low (Streams data from disk storage)\n        </td>\n</tr>\n<tr>\n<td>\n\
    <strong>\n          Best for\n         </strong>\n</td>\n<td>\n         Complex\
    \ preprocessing, feature engineering, modeling\n        </td>\n<td>\n        \
    \ Data extraction, cleaning, multi-table joining\n        </td>\n</tr>\n</table></div>\n\
    <h3 class=\"sh3\">\n       3. SELECT &amp; WHERE — The Filter Scaffolding\n  \
    \    </h3>\n<p>\n       To learn SQL, we start with the simplest retrieval: choosing\
    \ columns (\n       \n        SELECT\n       \n       ) and filtering rows (\n\
    \       \n        WHERE\n       \n       ).\n      </p>\n<div class=\"cb\">\n\
    <div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — select_basics.sql\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre>-- <span class=\"num\">1</span>. Select\
    \ specific <span class=\"fn\">columns</span> (Pandas: df[[<span class=\"str\"\
    >'name'</span>, <span class=\"str\">'salary'</span>]])\nSELECT name, age, salary\n\
    FROM employees;\n\n-- <span class=\"num\">2</span>. Select all <span class=\"\
    fn\">columns</span> (Pandas: df)\nSELECT * FROM employees;\n\n-- <span class=\"\
    num\">3</span>. Row <span class=\"fn\">filtering</span> (Pandas: df[df[<span class=\"\
    str\">'salary'</span>] &gt; <span class=\"num\">50000</span>])\nSELECT name, salary\n\
    FROM employees\nWHERE salary &gt; <span class=\"num\">50000</span>;\n\n-- <span\
    \ class=\"num\">4</span>. Sorting <span class=\"kw\">and</span> <span class=\"\
    fn\">limiting</span> (Pandas: df.<span class=\"fn\">sort_values</span>(<span class=\"\
    str\">'salary'</span>, ascending=<span class=\"kw\">False</span>).<span class=\"\
    fn\">head</span>(<span class=\"num\">5</span>))\nSELECT name, salary\nFROM employees\n\
    ORDER BY salary DESC\nLIMIT <span class=\"num\">5</span>;</pre>\n</div>\n<h3 class=\"\
    sh3\">\n       4. Aggregations, GROUP BY &amp; The HAVING Scaffold\n      </h3>\n\
    <p>\n       Suppose you want to find statistics about departments.\n      </p>\n\
    <p>\n       We use\n       <strong>\n        Aggregations\n       </strong>\n\
    \       (like\n       \n        SUM\n       \n       or\n       \n        AVG\n\
    \       \n       ) to collapse multiple values into one.\n      </p>\n<p>\n  \
    \     But how do we group them?\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         sql — group_by_basics.sql\n   \
    \     </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre>-- Simple <span class=\"fn\">Aggregation</span>\
    \ (Pandas: df[<span class=\"str\">'salary'</span>].<span class=\"fn\">mean</span>())\n\
    SELECT <span class=\"fn\">AVG</span>(salary) AS avg_sal FROM employees;\n\n--\
    \ Grouping <span class=\"fn\">rows</span> (Pandas: df.<span class=\"fn\">groupby</span>(<span\
    \ class=\"str\">'department'</span>)[<span class=\"str\">'salary'</span>].<span\
    \ class=\"fn\">mean</span>())\nSELECT department, <span class=\"fn\">AVG</span>(salary)\
    \ AS avg_sal, <span class=\"fn\">COUNT</span>(*) AS headcount\nFROM employees\n\
    GROUP BY department;</pre>\n</div>\n<h3 class=\"sh3\" style=\"color:var(--orange)\"\
    >\n       The HAVING Limitation (Where vs Having)\n      </h3>\n<p>\n       What\
    \ if you want to filter out departments with an average salary of less than 60,000?\n\
    \      </p>\n<p>\n       Your first instinct might be to write this:\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   sql — wrong_where.sql\n        </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">copy</button><button class=\"run-btn\" onclick=\"\
    runCode(this)\" style=\"margin-left: 4px;\">Run</button></div>\n</div>\n<pre>--\
    \ ❌ THIS WILL FAIL WITH A SYNTAX ERROR!\nSELECT department, <span class=\"fn\"\
    >AVG</span>(salary)\nFROM employees\nWHERE <span class=\"fn\">AVG</span>(salary)\
    \ &gt; <span class=\"num\">60000</span>  -- Aggregates <span class=\"kw\">not</span>\
    \ allowed <span class=\"kw\">in</span> WHERE\nGROUP BY department;</pre>\n</div>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   sql — correct_having.sql\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre>-- ✅ CORRECT: HAVING\
    \ filters AFTER grouping\nSELECT department, <span class=\"fn\">AVG</span>(salary)\
    \ AS avg_sal\nFROM employees\nGROUP BY department\nHAVING <span class=\"fn\">AVG</span>(salary)\
    \ &gt; <span class=\"num\">60000</span>;</pre>\n</div>\n<h3 class=\"sh3\">\n \
    \      5. JOINs — Combining Tables from First Principles\n      </h3>\n<p>\n \
    \      When data is split across tables (e.g.\n       \n        employees\n  \
    \     \n       and\n       \n        departments\n       \n       ), we must join\
    \ them.\n      </p>\n<p>\n       Let's understand how a join actually works step-by-step.\n\
    \      </p>\n<h3 class=\"sh3\" style=\"color:var(--orange)\">\n       Step 1:\
    \ The Cartesian Product (CROSS JOIN)\n      </h3>\n<p>\n       If you join two\
    \ tables without any matching keys, the engine matches\n       <strong>\n    \
    \    every row\n       </strong>\n       of Table A with\n       <strong>\n  \
    \      every row\n       </strong>\n       of Table B.\n      </p>\n<p>\n    \
    \   If Table A has 100 rows and Table B has 10 rows, the result is 1,000 rows.\n\
    \      </p>\n<p>\n       This is a Cartesian Product.\n      </p>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — cross_join.sql\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">copy</button><button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">Run</button></div>\n</div>\n<pre>SELECT e.name,\
    \ d.department_name\nFROM employees e\nCROSS JOIN departments d;  -- Matches everything\
    \ <span class=\"kw\">with</span> everything</pre>\n</div>\n<h3 class=\"sh3\" style=\"\
    color:var(--orange)\">\n       Step 2: INNER JOIN (Filtering the Cartesian Product)\n\
    \      </h3>\n<p>\n       To make the join meaningful, we add an\n       \n  \
    \      ON\n       \n       clause.\n      </p>\n<p>\n       This acts like a filter\
    \ on the Cartesian Product, retaining only rows where keys match (e.g.\n     \
    \  \n        e.dept_id = d.id\n       \n       ).\n      </p>\n<div class=\"cb\"\
    >\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — inner_join.sql\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n</div>\n</div>\n<pre>SELECT\
    \ e.name, d.department_name\nFROM employees e\nINNER JOIN departments d ON e.dept_id\
    \ = d.id;  -- Only matching records kept</pre>\n</div>\n<h3 class=\"sh3\" style=\"\
    color:var(--orange)\">\n       Step 3: LEFT JOIN (Handling Dangling Keys)\n  \
    \    </h3>\n<p>\n       If an employee has a\n       \n        dept_id\n     \
    \  \n       of\n       \n        NULL\n       \n       (or a department that doesn't\
    \ exist), the\n       \n        INNER JOIN\n       \n       will drop that employee\
    \ row.\n      </p>\n<p>\n       We call this a\n       <strong>\n        dangling\
    \ key\n       </strong>\n       .\n      </p>\n<p>\n       To retain all employees\
    \ regardless of whether they have a department match, we use a\n       <strong>\n\
    \n         LEFT JOIN\n        \n</strong>\n       .\n      </p>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — left_join.sql\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n</div>\n</div>\n<pre>SELECT\
    \ e.name, d.department_name\nFROM employees e\nLEFT JOIN departments d ON e.dept_id\
    \ = d.id;  -- Retains all employees, shows NULL <span class=\"kw\">if</span> no\
    \ match</pre>\n</div>\n<div class=\"hinglish\">\n       \U0001F4A1 Ek line mein:\
    \ SELECT kya chahiye, FROM kahan se, WHERE kon sa row, GROUP BY kaise group karo,\
    \ HAVING group filter, ORDER BY sort karo, LIMIT kitna lena.\n       <br/>\n<br/>\n\
    \       JOIN = do tables combine karo common key pe.\n      </div>\n<h3 class=\"\
    sh3\">\n       6. Complete JOIN Family — FULL OUTER, CROSS, SELF\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       SQL joins combine rows from two or more tables based on a related column,\
    \ supporting full outer, cross, and self join strategies for relational queries.\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         sql — all_joins.sql\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre>-- RIGHT JOIN — all\
    \ <span class=\"kw\">from</span> right <span class=\"fn\">table</span> (mirror\
    \ of LEFT JOIN)\nSELECT e.name, d.department_name\nFROM employees e RIGHT JOIN\
    \ departments d ON e.dept_id = d.id;\n\n-- FULL OUTER JOIN — all rows <span class=\"\
    kw\">from</span> BOTH, NULLs where no match\nSELECT e.name, d.department_name\n\
    FROM employees e FULL OUTER JOIN departments d ON e.dept_id = d.id;\n\n-- CROSS\
    \ JOIN — every <span class=\"fn\">combination</span> (m×n rows). Use carefully!\n\
    SELECT a.color, b.size FROM colors a CROSS JOIN sizes b;\n\n-- SELF JOIN — join\
    \ a table to <span class=\"fn\">itself</span> (e.g. employee → manager)\nSELECT\
    \ e.name AS employee, m.name AS manager\nFROM employees e\nLEFT JOIN employees\
    \ m ON e.manager_id = m.id;</pre>\n</div>\n<h3 class=\"sh3\">\n       7. UNION\
    \ vs UNION ALL + String &amp; Date Functions\n      </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       The\n   \
    \    \n        UNION\n       \n       operator combines the result sets of two\
    \ or more queries, where\n       \n        UNION ALL\n       \n       retains\
    \ duplicates and runs significantly faster.\n      </p>\n<div class=\"cb\">\n\
    <div class=\"cb-head\">\n<span class=\"cb-lang\">\n         sql — union_strings_dates.sql\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre>-- UNION — combine rows <span class=\"kw\"\
    >from</span> <span class=\"num\">2</span> queries, removes duplicates\nSELECT\
    \ name FROM employees_2023\nUNION\nSELECT name FROM employees_2024;  -- distinct\
    \ names only\n\n-- UNION ALL — keeps <span class=\"fn\">duplicates</span> (faster,\
    \ no dedup overhead)\nSELECT name FROM employees_2023\nUNION ALL\nSELECT name\
    \ FROM employees_2024;  -- all rows including dupes\n\n-- String functions\nSELECT\
    \ <span class=\"fn\">UPPER</span>(name), <span class=\"fn\">LOWER</span>(email),\
    \ <span class=\"fn\">LENGTH</span>(name) FROM employees;\nSELECT <span class=\"\
    fn\">TRIM</span>(name), <span class=\"fn\">LTRIM</span>(name), <span class=\"\
    fn\">RTRIM</span>(name) FROM employees;\nSELECT <span class=\"fn\">SUBSTR</span>(name,\
    \ <span class=\"num\">1</span>, <span class=\"num\">3</span>) FROM employees;\
    \     -- first <span class=\"num\">3</span> chars\nSELECT name FROM employees\
    \ WHERE name LIKE <span class=\"str\">'%Kumar%'</span>;  -- contains\nSELECT <span\
    \ class=\"fn\">CONCAT</span>(first_name, <span class=\"str\">' '</span>, last_name)\
    \ AS full_name FROM employees;\n\n-- Date/Time functions\nSELECT CURRENT_DATE,\
    \ CURRENT_TIMESTAMP;\nSELECT <span class=\"fn\">EXTRACT</span>(YEAR FROM hire_date)\
    \ AS hire_year FROM employees;\nSELECT <span class=\"fn\">DATE_DIFF</span>(<span\
    \ class=\"str\">'day'</span>, hire_date, CURRENT_DATE) AS days_employed\nFROM\
    \ employees;  -- syntax varies by <span class=\"fn\">DB</span> (PostgreSQL, MySQL,\
    \ BigQuery differ!)\nSELECT <span class=\"fn\">DATE_TRUNC</span>(<span class=\"\
    str\">'month'</span>, order_date) AS month,\n       <span class=\"fn\">SUM</span>(revenue)\
    \ AS monthly_revenue\nFROM orders GROUP BY <span class=\"num\">1</span>;</pre>\n\
    </div>\n<h3 class=\"sh3\">\n       8. Database Normalization — 1NF, 2NF, 3NF,\
    \ BCNF\n      </h3>"
