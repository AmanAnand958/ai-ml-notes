    solution_title: 📓 Complete Colab Code
    solution_code: |
      # SQL Practice - Mode Analytics Tutorial Demo
      import sqlite3
      conn = sqlite3.connect(":memory:")
      cur = conn.cursor()
      cur.execute("CREATE TABLE employees (id INTEGER, name TEXT, dept TEXT, salary INTEGER)")
      for e in [(1,'Alice','Engineering',90000),(2,'Bob','Sales',70000),(3,'Charlie','Engineering',85000)]:
          cur.execute("INSERT INTO employees VALUES (?,?,?,?)", e)
      print("All employees:")
      for r in cur.execute("SELECT * FROM employees"): print(r)
      print("Engineering dept:")
      for r in cur.execute("SELECT * FROM employees WHERE dept='Engineering'"): print(r)
      print("Avg salary by dept:")
      for r in cur.execute("SELECT dept, AVG(salary) FROM employees GROUP BY dept"): print(r)
      conn.close()
      assert cur is not None, "cur should not be None"
