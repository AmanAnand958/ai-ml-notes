    solution_code: "<span class=\"cm\"># Top Earner Per Department - Classic Interview</span>\n\
      <span class=\"kw\">import</span> sqlite3\nconn = sqlite3.<span class=\"fn\"\
      >connect</span>(<span class=\"str\">\":memory:\"</span>)\ncur = conn.<span class=\"\
