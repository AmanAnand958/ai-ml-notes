  quizzes:
  - num_str: QUESTION 1 OF 3
    question: What is the correct order of commands to save your changes to GitHub?
    qid: q13_1
    options:
    - letter: A
      text: git push → git commit → git add
      is_correct: false
    - letter: B
      text: git add → git commit → git push
      is_correct: true
    - letter: C
      text: git commit → git add → git push
      is_correct: false
    - letter: D
      text: git push → git add → git commit
      is_correct: false
    correct_fb: '✅ Correct! add → commit → push. add stages files (puts them in the
      queue), commit takes a snapshot of staged files, push uploads to GitHub. Think:
      Stage → Snapshot → Ship.'
    wrong_fb: '❌ Always: git add (stage) → git commit (snapshot) → git push (upload
      to GitHub). This is the fundamental Git workflow.'
  - num_str: QUESTION 2 OF 3
    question: Why should you NEVER push a .env file or config.py with API keys to
      GitHub?
    qid: q13_2
    options:
    - letter: A
      text: GitHub doesn't support those file formats
      is_correct: false
    - letter: B
      text: GitHub is public/accessible and bots scrape for credentials within seconds
      is_correct: true
    - letter: C
      text: It makes repos too large
      is_correct: false
    - letter: D
      text: Only reason is that it's bad practice
      is_correct: false
    correct_fb: ✅ Correct! Automated bots scan GitHub for API keys within seconds
      of a push. Your AWS/GCP/OpenAI credentials can be stolen and used to run up
      thousands of dollars in charges. Always add .env to .gitignore BEFORE your first
      commit.
    wrong_fb: ❌ Bots scan GitHub continuously for leaked credentials. Exposed API
      keys get stolen within minutes and can result in huge cloud bills. Always .gitignore
      your .env files.
  - num_str: QUESTION 3 OF 3
    question: "What does\n        \n         git checkout -b feature/new-model\n \
      \       \n        do?"
    qid: q13_3
    options:
    - letter: A
      text: Deletes the current branch and creates a new one
      is_correct: false
    - letter: B
      text: Creates a new branch AND switches to it in one command
      is_correct: true
    - letter: C
      text: Checks if the branch exists
      is_correct: false
    - letter: D
      text: Pushes the current branch to remote as feature/new-model
      is_correct: false
    correct_fb: '✅ Correct! The -b flag = create branch. checkout = switch to it.
      Combined: create AND switch in one step. Without -b, you''d only switch to an
      existing branch. Alternative: git switch -c feature/new-model (newer syntax).'
    wrong_fb: ❌ checkout -b creates a new branch AND switches to it. -b = "new branch".
      Without -b, git checkout only switches to an existing branch.
