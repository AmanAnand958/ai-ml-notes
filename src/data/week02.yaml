      ,\" Charlie\",\"Alice \",\"Eve\"</span>],\n    <span class=\"str\">\"age\"</span>:\
      \ [<span class=\"num\">25</span>, -<span class=\"num\">30</span>, <span class=\"\
      num\">35</span>, <span class=\"num\">25</span>, <span class=\"num\">200</span>],\n\
      \    <span class=\"str\">\"salary\": [\"50000\", \"60000\", \"NA\", \"50000\"\
      , \"75000\"</span>],\n    <span class=\"str\">\"date\": [\"2021-01-01\", \"\
      2021/02/15\", \"2021-03-20\", \"2021-01-01\", \"01-04-2021\"</span>]\n})\n<span\
      \ class=\"fn\">print</span>(<span class=\"str\">\"Before:\", df, sep=\"\\n\"\
      </span>)\ndf[<span class=\"str\">\"name\"] = df[\"name\"</span>].str.<span class=\"\
