    title: '⚠️ Gotcha: Dropped NaN Groups in GroupBy'
    description: By default, `df.groupby('category')` silently drops rows where the group key is `NaN`! In customer or financial
      analytics, this hides untracked revenue. Always pass `dropna=False` if missing categories must be accounted for.
