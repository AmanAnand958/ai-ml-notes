  quizzes:
  - num_str: Question 1
    question: You want departments where the total salary bill exceeds ₹5,00,000. Which clause do you use to filter?
    qid: q11_1
    options:
    - letter: A
      text: WHERE SUM(salary) &gt; 500000
      is_correct: false
      id: a
    - letter: B
      text: HAVING SUM(salary) &gt; 500000
      is_correct: true
      id: b
    - letter: C
      text: FILTER SUM(salary) &gt; 500000
      is_correct: false
      id: c
    - letter: D
      text: SELECT WHERE salary &gt; 500000
      is_correct: false
      id: d
    correct_fb: '✅ Correct! HAVING filters groups after GROUP BY. WHERE filters individual rows before grouping — you can''t
      use aggregate functions (SUM, AVG, COUNT) in WHERE. Always: GROUP BY first, then HAVING to filter those groups.'
    wrong_fb: ❌ Use HAVING for aggregate conditions after GROUP BY. WHERE cannot use aggregate functions. HAVING SUM(salary)
      &gt; 500000 is correct.
    correct: b
    explanation: ''
  - num_str: Question 2
    question: What is the correct SQL order of clauses?
    qid: q11_2
    options:
    - letter: A
      text: SELECT → FROM → GROUP BY → WHERE → HAVING → ORDER BY
      is_correct: false
      id: a
    - letter: B
      text: SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY
      is_correct: true
      id: b
    - letter: C
      text: FROM → WHERE → SELECT → GROUP BY → ORDER BY
      is_correct: false
      id: c
    - letter: D
      text: ORDER doesn't matter in SQL
      is_correct: false
      id: d
    correct_fb: '✅ Correct! SELECT-FROM-WHERE-GROUP BY-HAVING-ORDER BY-LIMIT. Memorise this order — it''s in every SQL interview.
      Note: the execution order is different (FROM→WHERE→GROUP BY→HAVING→SELECT→ORDER BY), but the writing order is as above.'
    wrong_fb: '❌ The clause order is: SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT. Memorise this — it appears in
      every SQL interview.'
    correct: b
    explanation: ''
  - num_str: Question 3
    question: An INNER JOIN between employees(100 rows) and departments(10 rows) returns 85 rows. What does this mean?
    qid: q11_3
    options:
    - letter: A
      text: 15 departments have no employees
      is_correct: false
      id: a
    - letter: B
      text: 15 employees have no matching department (no dept_id match)
      is_correct: true
      id: b
    - letter: C
      text: The JOIN condition is wrong
      is_correct: false
      id: c
    - letter: D
      text: 15 duplicate rows were removed
      is_correct: false
      id: d
    correct_fb: ✅ Correct! INNER JOIN only keeps rows where the key exists in BOTH tables. 100 employees - 85 matches = 15
      employees have a dept_id that doesn't exist in the departments table (NULL or invalid). Use LEFT JOIN to keep all employees.
    wrong_fb: ❌ INNER JOIN drops rows without a match. 100 - 85 = 15 employees have no matching department. Use LEFT JOIN
      to keep all employees even without a department match.
    correct: b
    explanation: ''
  - num_str: Question 4
