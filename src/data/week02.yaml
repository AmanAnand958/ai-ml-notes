  analogy: ''
  theory_html: "<h2 class=\"sh2\">\n        \U0001F4CB EDA Project Framework — Follow\
    \ This Structure\n       </h2><div class=\"mermaid\">\ngraph LR\n  Acq[\"Acquire\"\
    ] --&gt; Insp[\"Inspect\"] --&gt; Val[\"Validate\"] --&gt; Cln[\"Clean\"] --&gt;\
    \ Trans[\"Transform\"] --&gt; Ana[\"Analyze\"] --&gt; Vis[\"Visualize\"] --&gt;\
    \ Feat[\"Feature Eng\"] --&gt; Model[\"Model\"]\n</div><div class=\"diagram-cap\"\
    >\n        End-to-End Workflow Mindset: You don't just \"do Pandas\". You build\
    \ a pipeline.\n       </div><h3 class=\"sh3\">\n        0. Project Architecture\
    \ Thinking\n       </h3><h3 class=\"sh3\">\n        Step 1 — Load &amp; First\
    \ Look (30 min)\n       </h3><p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n        In this step, we establish database\
    \ connections, load raw data into DataFrames, and print initial metadata to inspect\
    \ column layouts.\n       </p><div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n          python — step1_load.py\n         </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n           Run\n          </button>\n</div>\n\
    </div>\n<pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span>\
    \ pd\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span>\
    \ plt\n<span class=\"kw\">import</span> seaborn <span class=\"kw\">as</span> sns\n\
    \ndf = pd.<span class=\"fn\">read_csv</span>(<span class=\"str\">\"your_dataset.csv\"\
    </span>)\n\n<span class=\"cm\"># Always start with these 5 commands</span>\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">\"Shape:\"</span>, df.shape)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"\\nColumns:\"</span>, df.columns.<span\
    \ class=\"fn\">tolist</span>())\ndf.<span class=\"fn\">info</span>()\ndf.<span\
    \ class=\"fn\">describe</span>()\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"\\nNull counts:\\n\"</span>, df.<span class=\"fn\">isnull</span>().<span\
    \ class=\"fn\">sum</span>())</pre>\n</div><h3 class=\"sh3\">\n        Step 2 —\
    \ Clean the Data (45 min)\n       </h3><p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n        Here we run custom data cleaning\
    \ pipelines to impute missing attributes, correct column schemas, and strip whitespace\
    \ from text entries.\n       </p><div class=\"cb\">\n<div class=\"cb-head\">\n\
    <span class=\"cb-lang\">\n          python — step2_clean.py\n         </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"\
    runCode(this)\" style=\"margin-left: 4px;\">\n           Run\n          </button>\n\
    </div>\n</div>\n<pre><span class=\"cm\"># Document every cleaning decision with\
    \ a comment explaining WHY</span>\ndf[<span class=\"str\">\"Age\"] = df[\"Age\"\
    ].fillna(df[\"Age\"</span>].<span class=\"fn\">median</span>())   <span class=\"\
    cm\"># median: robust to outliers</span>\ndf = df.<span class=\"fn\">drop</span>(columns=[<span\
    \ class=\"str\">\"Cabin\"</span>])          <span class=\"cm\"># 77% null — unusable</span>\n\
    df = df.<span class=\"fn\">drop_duplicates</span>()\ndf[<span class=\"str\">\"\
    Embarked\"] = df[\"Embarked\"].fillna(df[\"Embarked\"</span>].<span class=\"fn\"\
    >mode</span>()[<span class=\"num\">0</span>])\n\n<span class=\"cm\"># Verify cleaning\
    \ worked</span>\n<span class=\"fn\">print</span>(<span class=\"str\">\"Nulls after\
    \ cleaning:\\n\"</span>, df.<span class=\"fn\">isnull</span>().<span class=\"\
    fn\">sum</span>())\n</pre>\n</div><h3 class=\"sh3\">\n        Step 3 — Analysis\
    \ + Visualization (3 hours)\n       </h3><p>\n        Write at least 10 analysis\
    \ cells, each answering one question.\n       </p><p>\n        Add a markdown\
    \ cell above each with the question and a markdown cell below with the finding\
    \ in plain English.\n       </p><p>\n        Think deeply:\n        <em>\n   \
    \      Why use median instead of mean?\n        </em>\n</p><p>\n        Why is\
    \ dropping nulls dangerous? Add these\n        <strong>\n         Thinking Questions\n\
    \        </strong>\n        to your notebook.\n       </p><div class=\"cb\">\n\
    <div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python — step3_analysis_example.py\n\
    \         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n           Run\n   \
    \       </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> matplotlib.pyplot\
    \ <span class=\"kw\">as</span> plt\n\n<span class=\"cm\"># Question: Does gender\
    \ affect survival?</span>\nsurvival_by_gender = df.<span class=\"fn\">groupby</span>(<span\
    \ class=\"str\">\"Sex\")[\"Survived\"</span>].<span class=\"fn\">mean</span>()\
    \ * <span class=\"num\">100</span>\n\nplt.<span class=\"fn\">figure</span>(figsize=(<span\
    \ class=\"num\">8</span>, <span class=\"num\">5</span>))\nsns.<span class=\"fn\"\
    >barplot</span>(x=survival_by_gender.index, y=survival_by_gender.values, palette=<span\
    \ class=\"str\">\"Set2\"</span>)\nplt.<span class=\"fn\">title</span>(<span class=\"\
    str\">\"Survival Rate by Gender (%)\", fontsize=14, fontweight=\"bold\"</span>)\n\
    plt.<span class=\"fn\">ylabel</span>(<span class=\"str\">\"Survival Rate (%)\"\
    </span>)\nplt.<span class=\"fn\">savefig</span>(<span class=\"str\">\"plots/survival_by_gender.png\"\
    , dpi=150, bbox_inches=\"tight\"</span>)\nplt.<span class=\"fn\">show</span>()\n\
    \n<span class=\"cm\"># Finding: Women survived at 74% vs men at 19% — 3x difference.</span>\n\
    <span class=\"cm\"># \"Women and children first\" was clearly enforced on Titanic.</span>\n\
    </pre>\n</div><h3 class=\"sh3\">\n        Step 4 — Write Your README (45 min)\n\
    \       </h3><h2 class=\"sh2\">\n        ✅ Week 2 Checkpoint\n       </h2>\n<!--\
    \ /day-14-theory -->"
