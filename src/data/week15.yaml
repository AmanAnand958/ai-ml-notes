  hinglish: 'LangChain chains banane ki library hai: LLM + retriever + memory + tools sab ek workflow mein. Rapid prototyping ke liye excellent hai lekin production mein carefully optimize karo!'
  analogy: 'Think of it like this: API calls ko samjho jaise Mumbai local train: peak hours mein (rate limit) train nahi milti, aur tum platform pe wait karte ho. Exponential backoff matlab: 1 minute wait, phir 2 minute, phir 4 minute — jab tak congestion kam na ho jaye. Tenacity library ye automatically handle karti hai. (This mirrors how APIs fundamentally operates.)'
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">\n       1. OpenAI Chat Completions API — Complete Reference\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       The Chat Completions API is the primary interface for prompting OpenAI models, accepting a structured array of developer, system, user, and assistant messages.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — OPENAI COMPLETE EXAMPLE\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">from</span> typing <span class=\"kw\">import</span> List, Dict\n\n<span class=\"kw\">class</span> <span class=\"cls\">MultiLanguageTranslatorChain</span>:\n\
    \    <span class=\"str\">\"\"\"</span>\n    Sequential LLM Prompt Chain: Translates technical concepts into target languages\n    <span class=\"kw\">while</span> preserving code blocks <span class=\"kw\">and</span> technical terminology.\n    <span class=\"str\">\"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, target_languages: List[str]):\n        <span class=\"kw\">self</span>.target_languages = target_languages\n\n    <span class=\"kw\">def</span> <span class=\"fn\">generate_prompt</span>(<span class=\"kw\">self</span>, source_text: str, target_lang: str) -&gt; str:\n        <span class=\"kw\">return</span> <span class=\"str\">f\"\"\"</span>You are a professional technical localization expert.\nTranslate the following technical explanation into {target_lang}.\nPreserve all variable names, <span class=\"fn\">formulas</span> ($...$), <span class=\"kw\">and</span> code intact:\n\nSource:\n{source_text}\n\nTranslation:<span\
    \ class=\"str\">\"\"\"</span>\n\n    <span class=\"kw\">def</span> <span class=\"fn\">run_chain</span>(<span class=\"kw\">self</span>, technical_text: str) -&gt; Dict[str, str]:\n        results = {}\n        <span class=\"kw\">for</span> lang <span class=\"kw\">in</span> <span class=\"kw\">self</span>.target_languages:\n            prompt = <span class=\"kw\">self</span>.<span class=\"fn\">generate_prompt</span>(technical_text, lang)\n            <span class=\"cm\"># Simulated API call: response = client.chat.completions.create(...)</span>\n            results[lang] = <span class=\"str\">f\"[{lang} Localized Content for: '</span>{technical_text[:<span class=\"num\">30</span>]}...<span class=\"str\">']\"</span>\n            <span class=\"fn\">print</span>(<span class=\"str\">f\"✅ Generated translation for {lang}\"</span>)\n        <span class=\"kw\">return</span> results\n\ntranslator = <span class=\"fn\">MultiLanguageTranslatorChain</span>(target_languages=[<span class=\"str\">\"Hindi\"\
    , \"Spanish\", \"German\"</span>])\ntranslations = translator.<span class=\"fn\">run_chain</span>(<span class=\"str\">\"Backpropagation calculates the gradient of the loss function with respect to weights.\"</span>)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       2. Streaming — Reduce Perceived Latency\n      </h3>\n<p>\n       Without streaming, the user stares at a blank screen until the entire response is ready. With streaming, tokens appear word-by-word. For a 500-token response this can feel\n       <strong>\n        10x faster\n       </strong>\n       even if total time is the same.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — STREAMING RESPONSE\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code\
    \ class=\"language-html\"><span class=\"kw\">from</span> typing <span class=\"kw\">import</span> List, Dict\n\n<span class=\"kw\">class</span> <span class=\"cls\">MultiLanguageTranslatorChain</span>:\n    <span class=\"str\">\"\"\"</span>\n    Sequential LLM Prompt Chain: Translates technical concepts into target languages\n    <span class=\"kw\">while</span> preserving code blocks <span class=\"kw\">and</span> technical terminology.\n    <span class=\"str\">\"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, target_languages: List[str]):\n        <span class=\"kw\">self</span>.target_languages = target_languages\n\n    <span class=\"kw\">def</span> <span class=\"fn\">generate_prompt</span>(<span class=\"kw\">self</span>, source_text: str, target_lang: str) -&gt; str:\n        <span class=\"kw\">return</span> <span class=\"str\">f\"\"\"</span>You are a professional technical localization expert.\nTranslate the following\
    \ technical explanation into {target_lang}.\nPreserve all variable names, <span class=\"fn\">formulas</span> ($...$), <span class=\"kw\">and</span> code intact:\n\nSource:\n{source_text}\n\nTranslation:<span class=\"str\">\"\"\"</span>\n\n    <span class=\"kw\">def</span> <span class=\"fn\">run_chain</span>(<span class=\"kw\">self</span>, technical_text: str) -&gt; Dict[str, str]:\n        results = {}\n        <span class=\"kw\">for</span> lang <span class=\"kw\">in</span> <span class=\"kw\">self</span>.target_languages:\n            prompt = <span class=\"kw\">self</span>.<span class=\"fn\">generate_prompt</span>(technical_text, lang)\n            <span class=\"cm\"># Simulated API call: response = client.chat.completions.create(...)</span>\n            results[lang] = <span class=\"str\">f\"[{lang} Localized Content for: '</span>{technical_text[:<span class=\"num\">30</span>]}...<span class=\"str\">']\"</span>\n            <span class=\"fn\">print</span>(<span class=\"str\">f\"✅ Generated\
    \ translation for {lang}\"</span>)\n        <span class=\"kw\">return</span> results\n\ntranslator = <span class=\"fn\">MultiLanguageTranslatorChain</span>(target_languages=[<span class=\"str\">\"Hindi\", \"Spanish\", \"German\"</span>])\ntranslations = translator.<span class=\"fn\">run_chain</span>(<span class=\"str\">\"Backpropagation calculates the gradient of the loss function with respect to weights.\"</span>)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       3. Anthropic Claude API\n      </h3>\n<p>\n       Claude API ka structure OpenAI se slightly alag hai —\n       <strong>\n        system message alag parameter hai\n       </strong>\n       , messages array mein nahi. Aur content blocks ka concept hai instead of plain strings.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — ANTHROPIC CLAUDE API\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">from</span> typing <span class=\"kw\">import</span> List, Dict\n\n<span class=\"kw\">class</span> <span class=\"cls\">MultiLanguageTranslatorChain</span>:\n    <span class=\"str\">\"\"\"</span>\n    Sequential LLM Prompt Chain: Translates technical concepts into target languages\n    <span class=\"kw\">while</span> preserving code blocks <span class=\"kw\">and</span> technical terminology.\n    <span class=\"str\">\"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, target_languages: List[str]):\n        <span class=\"kw\">self</span>.target_languages = target_languages\n\n    <span class=\"kw\">def</span> <span class=\"fn\">generate_prompt</span>(<span class=\"kw\">self</span>, source_text: str, target_lang: str) -&gt; str:\n        <span\
    \ class=\"kw\">return</span> <span class=\"str\">f\"\"\"</span>You are a professional technical localization expert.\nTranslate the following technical explanation into {target_lang}.\nPreserve all variable names, <span class=\"fn\">formulas</span> ($...$), <span class=\"kw\">and</span> code intact:\n\nSource:\n{source_text}\n\nTranslation:<span class=\"str\">\"\"\"</span>\n\n    <span class=\"kw\">def</span> <span class=\"fn\">run_chain</span>(<span class=\"kw\">self</span>, technical_text: str) -&gt; Dict[str, str]:\n        results = {}\n        <span class=\"kw\">for</span> lang <span class=\"kw\">in</span> <span class=\"kw\">self</span>.target_languages:\n            prompt = <span class=\"kw\">self</span>.<span class=\"fn\">generate_prompt</span>(technical_text, lang)\n            <span class=\"cm\"># Simulated API call: response = client.chat.completions.create(...)</span>\n            results[lang] = <span class=\"str\">f\"[{lang} Localized Content for: '</span>{technical_text[:<span\
    \ class=\"num\">30</span>]}...<span class=\"str\">']\"</span>\n            <span class=\"fn\">print</span>(<span class=\"str\">f\"✅ Generated translation for {lang}\"</span>)\n        <span class=\"kw\">return</span> results\n\ntranslator = <span class=\"fn\">MultiLanguageTranslatorChain</span>(target_languages=[<span class=\"str\">\"Hindi\", \"Spanish\", \"German\"</span>])\ntranslations = translator.<span class=\"fn\">run_chain</span>(<span class=\"str\">\"Backpropagation calculates the gradient of the loss function with respect to weights.\"</span>)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       4. Structured Output — Guaranteed JSON\n      </h3>\n<p>\n       OpenAI's\n       \n        response_format={\"type\": \"json_object\"}\n       \n       guarantees valid JSON. The newer\n       <strong>\n        Structured Outputs\n       </strong>\n       (with Pydantic schema) guarantees the JSON matches your exact schema.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n         PYTHON — STRUCTURED OUTPUT WITH PYDANTIC\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">from</span> typing <span class=\"kw\">import</span> List, Dict\n\n<span class=\"kw\">class</span> <span class=\"cls\">MultiLanguageTranslatorChain</span>:\n    <span class=\"str\">\"\"\"</span>\n    Sequential LLM Prompt Chain: Translates technical concepts into target languages\n    <span class=\"kw\">while</span> preserving code blocks <span class=\"kw\">and</span> technical terminology.\n    <span class=\"str\">\"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, target_languages: List[str]):\n        <span class=\"kw\">self</span>.target_languages\
