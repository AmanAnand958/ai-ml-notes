        to prevent context window overflow
      is_correct: true
    - letter: C
      text: It's faster because it doesn't store any messages
      is_correct: false
    - letter: D
      text: It compresses text using gzip before storing
      is_correct: false
    correct_fb: '✅ Perfect. ConversationSummaryBufferMemory is the best of both worlds:
      recent context is available verbatim (for accurate follow-ups), while old context
      is compressed into a summary (preventing token limit overflow in long conversations).'
    wrong_fb: ❌ ConversationBufferMemory grows indefinitely and eventually exceeds
      the context window. SummaryBufferMemory summarises old messages (keeping them
      shorter) while keeping recent messages verbatim.
  - num_str: Q3 OF 5
    question: "What does\n        \n         RunnablePassthrough()\n        \n   \
      \     do in an LCEL chain?"
    qid: q103_3
    options:
    - letter: A
      text: It skips the current step entirely
      is_correct: false
    - letter: B
      text: It converts the input to a string
      is_correct: false
    - letter: C
      text: It passes the input through unchanged — useful in RunnableParallel to
        include the original input alongside transformed versions
      is_correct: true
    - letter: D
      text: It caches the input for future chains
      is_correct: false
    correct_fb: ✅ Correct. RunnablePassthrough() is an identity function — it passes
      whatever it receives unchanged. Very useful in RunnableParallel when you want
      to include the original input alongside other processed versions.
    wrong_fb: ❌ RunnablePassthrough() is an identity Runnable — input goes in, same
      input comes out unchanged. Used in parallel chains to include the original input
      in the final output dict.
  - num_str: Q4 OF 5
    question: "Why does\n        \n         PydanticOutputParser.get_format_instructions()\n\
      \        \n        need to be included in the prompt?"
    qid: q103_4
    options:
    - letter: A
      text: It tells the model how many tokens to generate
      is_correct: false
    - letter: B
      text: It tells the LLM exactly what JSON schema to output so the Pydantic model
        can parse it — without it, the LLM wouldn't know the required field names
        and types
      is_correct: true
    - letter: C
      text: It's only needed for streaming outputs
      is_correct: false
    - letter: D
      text: It sets the temperature automatically
      is_correct: false
    correct_fb: '✅ Exactly. The format instructions tell the LLM: "Output a JSON object
      with these specific fields: title (str), author (str), score (int)..." — without
      this, the LLM might use different field names or formats that the parser can''t
      handle.'
    wrong_fb: ❌ Format instructions are injected into the prompt to tell the LLM what
      JSON schema to produce. The LLM reads these instructions and generates output
      matching your Pydantic model's field names and types.
  - num_str: Q5 OF 5
    question: "When using\n        \n         .partial()\n        \n        on a\n\
      \        \n         ChatPromptTemplate\n        \n        , what does it accomplish?"
    qid: q103_5
    options:
    - letter: A
      text: It runs only part of the prompt
      is_correct: false
    - letter: B
      text: It formats the prompt immediately and returns a string
      is_correct: false
    - letter: C
      text: It pre-fills one or more template variables, returning a new template
        that requires fewer inputs at invoke time
      is_correct: true
    - letter: D
      text: It creates a cached version of the prompt for performance
      is_correct: false
    correct_fb: "✅ Correct.\n        \n         .partial(format_instructions=parser.get_format_instructions())\n\
      \        \n        pre-fills that variable so you don't have to pass it every\
      \ time you call\n        \n         .invoke()\n        \n        . It's like\
      \ Python's\n        \n         functools.partial\n        \n        — partial\
      \ application of arguments to create a new callable."
    wrong_fb: ❌ .partial() is like functools.partial — it pre-fills template variables.
      The result is a new template with fewer required inputs. Used often to pre-fill
      format_instructions, current_date, or other constants.
