    solution_lang: PYTHON
  - title: FAISS IVFFlat vs FlatL2 Performance Benchmark
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n         Generate 100,000 random 384-dim vectors. Build both\n\
      \         \n          IndexFlatL2\n         \n         (exact) and\n       \
      \  \n          IndexIVFFlat\n         \n         (approximate, nlist=100) FAISS\
      \ indices. Benchmark: (1) index build time, (2) query time for 1000 queries,\
      \ (3) recall@10 (how many of the exact top-10 are in the ANN top-10). Plot recall\
      \ vs nprobe tradeoff.\n        </p>"
    done_when: IVFFlat is measurably faster (5–20x) than FlatL2. Recall@10 &gt; 95%
      at nprobe=10. You understand the speed/accuracy tradeoff.
    git_cmd: 'git add faiss_ivfflat_vs_flatl2_performance_benchmark.py &amp;&amp;
      git commit -m "day104: faiss-ivfflat-vs-flatl2-performance-benchmark"'
    sol_id: sol-w15t12
    solution_title: ✅ COMPLETE SOLUTION — faiss_ivfflat_vs_flatl2_performance_benc.py
    solution_code: "<span class=\"cm\"># faiss_ivfflat_vs_flatl2_performance_benc.py\
      \ — Solution</span>\n<span class=\"cm\"># Complete solution for: FAISS IVFFlat\
      \ vs FlatL2 Performance Benchmark</span>\n\n<span class=\"kw\">import</span>\
      \ numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">class</span> <span\
      \ class=\"cls\">RandomForestClassifierScratch</span>:\n    <span class=\"str\"\
      >\"\"\"Random Forest Classifier with Bootstrap Sampling and Feature Subsampling.\"\
      \"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span\
      \ class=\"kw\">self</span>, n_estimators=<span class=\"num\">10</span>, max_depth=<span\
      \ class=\"num\">5</span>, max_features=<span class=\"str\">'sqrt'</span>):\n\
      \        <span class=\"kw\">self</span>.n_estimators = n_estimators\n      \
      \  <span class=\"kw\">self</span>.max_depth = max_depth\n        <span class=\"\
      kw\">self</span>.max_features = max_features\n        <span class=\"kw\">self</span>.trees\
      \ = []\n\n    <span class=\"kw\">def</span> <span class=\"fn\">fit</span>(<span\
      \ class=\"kw\">self</span>, X, y):\n        X, y = np.<span class=\"fn\">asarray</span>(X),\
      \ np.<span class=\"fn\">asarray</span>(y)\n        n_samples, n_features = X.shape\n\
      \        <span class=\"kw\">from</span> sklearn.tree <span class=\"kw\">import</span>\
      \ DecisionTreeClassifier\n        <span class=\"kw\">self</span>.trees = []\n\
      \        \n        <span class=\"kw\">for</span> _ <span class=\"kw\">in</span>\
      \ <span class=\"fn\">range</span>(<span class=\"kw\">self</span>.n_estimators):\n\
      \            <span class=\"cm\"># Bootstrap sampling</span>\n            indices\
      \ = np.random.<span class=\"fn\">choice</span>(n_samples, size=n_samples, replace=<span\
      \ class=\"kw\">True</span>)\n            X_boot, y_boot = X[indices], y[indices]\n\
      \            \n            <span class=\"cm\"># Select sub-features</span>\n\
      \            tree = <span class=\"fn\">DecisionTreeClassifier</span>(max_depth=<span\
      \ class=\"kw\">self</span>.max_depth, max_features=<span class=\"kw\">self</span>.max_features)\n\
      \            tree.<span class=\"fn\">fit</span>(X_boot, y_boot)\n          \
      \  <span class=\"kw\">self</span>.trees.<span class=\"fn\">append</span>(tree)\n\
      \        <span class=\"kw\">return</span> <span class=\"kw\">self</span>\n\n\
      \    <span class=\"kw\">def</span> <span class=\"fn\">predict</span>(<span class=\"\
      kw\">self</span>, X):\n        predictions = np.<span class=\"fn\">array</span>([tree.<span\
      \ class=\"fn\">predict</span>(X) <span class=\"kw\">for</span> tree <span class=\"\
      kw\">in</span> <span class=\"kw\">self</span>.trees])\n        <span class=\"\
      cm\"># Majority voting across trees</span>\n        <span class=\"kw\">from</span>\
      \ scipy.stats <span class=\"kw\">import</span> mode\n        m, _ = <span class=\"\
      fn\">mode</span>(predictions, axis=<span class=\"num\">0</span>)\n        <span\
      \ class=\"kw\">return</span> m.<span class=\"fn\">ravel</span>()\n\n<span class=\"\
      cm\"># Test</span>\n<span class=\"kw\">from</span> sklearn.datasets <span class=\"\
      kw\">import</span> make_classification\nX, y = <span class=\"fn\">make_classification</span>(n_samples=<span\
      \ class=\"num\">200</span>, n_features=<span class=\"num\">10</span>, random_state=<span\
      \ class=\"num\">42</span>)\nrf = <span class=\"fn\">RandomForestClassifierScratch</span>(n_estimators=<span\
      \ class=\"num\">15</span>, max_depth=<span class=\"num\">4</span>)\nrf.<span\
      \ class=\"fn\">fit</span>(X, y)\nacc = (rf.<span class=\"fn\">predict</span>(X)\
      \ == y).<span class=\"fn\">mean</span>()\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Random Forest Training Accuracy: {acc:.4f}\"</span>)\n\n\
      <span class=\"kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n\
      \    <span class=\"fn\">solve</span>()"
    solution_lang: python
  quizzes:
  - num_str: Q1 OF 5
    question: "Why must FAISS vectors be\n        \n         float32\n        \n \
      \       , not\n        \n         float64\n        \n        (the numpy default)?"
    qid: q104_1
    options:
    - letter: A
      text: float64 causes FAISS to produce incorrect similarity scores
      is_correct: false
    - letter: B
      text: It's just a legacy limitation with no practical consequence
      is_correct: false
    - letter: C
      text: FAISS uses SIMD (AVX2) CPU instructions that are optimized for 32-bit
        floats — it raises a TypeError for float64 and float32 halves memory usage,
        enabling more vectors per CPU cache line
      is_correct: true
    - letter: D
      text: float64 is not supported by Python
      is_correct: false
    correct_fb: "✅ Correct! FAISS uses vectorized SIMD instructions (SSE/AVX) optimized\
      \ for float32. This enables massive parallelism at the CPU level. Always call\n\
      \        \n         .astype('float32')\n        \n        on your numpy arrays\
      \ before FAISS operations."
    wrong_fb: '❌ FAISS requires float32 for two reasons: (1) its SIMD (AVX2) optimisations
      are written for 32-bit floats, (2) float32 uses half the memory of float64,
      allowing 2x more vectors per cache line.'
  - num_str: Q2 OF 5
    question: For two normalised unit vectors, what is the relationship between L2
      distance and cosine similarity?
    qid: q104_2
    options:
    - letter: A
      text: They have no mathematical relationship
      is_correct: false
    - letter: B
      text: $\|a - b\|^2 = 2(1 - \cos\theta)$, so maximising cosine similarity is
        equivalent to minimising L2 distance for unit vectors
      is_correct: true
    - letter: C
      text: L2 distance equals cosine similarity numerically
      is_correct: false
    - letter: D
      text: L2 distance only works for integer vectors
      is_correct: false
    correct_fb: ✅ Perfect. $\|a-b\|^2 = \|a\|^2 + \|b\|^2 - 2a\cdot b = 1 + 1 - 2\cos\theta
      = 2(1-\cos\theta)$. So for normalised vectors, ranking by L2 distance gives
      the same order as ranking by cosine similarity. This is why we normalise before
      using IndexFlatIP.
    wrong_fb: '❌ For unit vectors: $\|a-b\|^2 = 2(1-\cos\theta)$. Minimising L2 =
      maximising cosine similarity when both vectors are normalised. This is why normalising
      before FAISS IndexFlatIP gives cosine similarity results.'
  - num_str: Q3 OF 5
    question: "What does the\n        \n         nprobe\n        \n        parameter\
      \ in FAISS\n        \n         IndexIVFFlat\n        \n        control?"
    qid: q104_3
    options:
    - letter: A
      text: The number of results to return
      is_correct: false
    - letter: B
      text: The number of dimensions to use
      is_correct: false
    - letter: C
      text: The number of Voronoi cells (clusters) to search during query — higher
        nprobe = higher recall but slower query time
      is_correct: true
    - letter: D
      text: The number of training iterations for the k-means clustering step
      is_correct: false
    correct_fb: ✅ Correct! IVFFlat partitions the vector space into nlist Voronoi
      cells during indexing. At query time, it only searches nprobe cells (not all
      nlist). nprobe=1 = fastest, lowest recall. nprobe=nlist = same as exact search
      but slower to build.
    wrong_fb: ❌ nprobe controls how many Voronoi cells (clusters) to search during
      a query. IVFFlat partitions the space into nlist clusters. At query time, only
      nprobe nearest clusters are searched. Higher nprobe → better recall, slower
      speed.
  - num_str: Q4 OF 5
    question: You have 50 million vectors and need real-time queries with &lt;10ms
      latency. Which FAISS index should you use?
    qid: q104_4
    options:
    - letter: A
      text: IndexFlatL2 — always use exact search for accuracy
      is_correct: false
    - letter: B
      text: IndexIVFFlat with nlist=100
      is_correct: false
    - letter: C
      text: IndexHNSWFlat or IndexIVFPQ — hierarchical NSW or product-quantized IVF
        for sub-linear query time and memory efficiency at hundreds of millions of
        vectors
      is_correct: true
    - letter: D
      text: ChromaDB — it handles all scale automatically
      is_correct: false
    correct_fb: '✅ Correct! At 50M vectors: FlatL2 would take ~5 seconds per query.
      IVFFlat is better but still memory-heavy. HNSW provides sub-10ms queries at
      high recall. IVF+PQ compresses vectors to save RAM. For production at this scale,
      also consider Pinecone, Weaviate, or Qdrant.'
    wrong_fb: ❌ At 50M vectors, exact search is too slow. HNSW (Hierarchical Navigable
      Small World) provides ~logarithmic query time with ~98% recall. IVF+PQ adds
      product quantisation to reduce memory. These are the production-grade choices
      at this scale.
  - num_str: Q5 OF 5
    question: "What does\n        \n         normalize_embeddings=True\n        \n\
      \        do in sentence-transformers'\n        \n         encode()\n       \
      \ \n        , and when should you use it?"
    qid: q104_5
    options:
    - letter: A
      text: It normalises the input text to lowercase before encoding
      is_correct: false
    - letter: B
      text: It removes outlier dimensions from the embedding
      is_correct: false
    - letter: C
      text: It L2-normalises each vector to unit length, so that dot product equals
        cosine similarity — use it whenever you want to measure semantic similarity
        rather than magnitude
      is_correct: true
    - letter: D
      text: It makes all embeddings have values between 0 and 1 using min-max scaling
      is_correct: false
    correct_fb: ✅ Exactly. L2-normalisation divides each vector by its L2 norm, making
      $\|v\| = 1$. After normalisation, cosine similarity = dot product (no division
      needed). Always normalise when using FAISS IndexFlatIP or any cosine similarity
      computation.
    wrong_fb: '❌ normalize_embeddings=True applies L2-normalisation: each vector is
      divided by its magnitude so $\|v\|=1$. For unit vectors, dot product = cosine
      similarity. Always use this when you want similarity to reflect semantic closeness,
      not vector magnitude.'
