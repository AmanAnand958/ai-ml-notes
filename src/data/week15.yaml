  gotcha:
    title: '⚠️ Gotcha: CUDA Out-of-Memory (OOM) Overhead'
    description: PyTorch allocates memory in cached chunks. Use `torch.cuda.empty_cache()` and gradient accumulation when batch sizes hit limits.
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       Ragas evaluation framework retrieval precision, faithfulness aur answer relevance parameters ko check karke RAG pipeline ke hallucinations ko spot karta hai."
    bullets:
    - Naive RAG fails on keyword-sensitive queries — hybrid search (BM25 + vector) with RRF solves this.
    - RecursiveCharacterTextSplitter with 10–15% overlap is the go-to chunking strategy for most documents.
    - Use bi-encoder for first-stage retrieval (top-50), cross-encoder for reranking (top-5) — this gives accuracy without sacrificing speed.
    - RAGAS separates retrieval quality (context_recall, context_precision) from generation quality (faithfulness, answer_relevancy) — essential for diagnosing where your RAG breaks.
    - High faithfulness + low context_recall = fix retrieval. High context_recall + low faithfulness = fix generation/prompting.
