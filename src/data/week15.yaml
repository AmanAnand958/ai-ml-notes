  flashcards:
  - front: What is the ReAct agent framework?
    back: A framework that combines Reasoning (thinking steps) and Acting (calling
      tools) to solve complex tasks using an LLM.
  - front: What is a Tool in the context of LLM agents?
    back: A wrapper around a programming function (like a calculator, web search,
      or database query) that the agent can choose to run by outputting structured
      arguments.
  - front: What is an agent's loop limit?
    back: A safety constraint that limits the maximum number of reasoning-action iterations
      an agent can run to prevent infinite loops and runaway API costs.
  - front: How do agents maintain conversation state?
    back: By appending previous messages, actions, and observations to the LLM's conversation
      history window on each turn.
