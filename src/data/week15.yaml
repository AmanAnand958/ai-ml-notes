  tasks:
  - title: Multi-Language Translator Chain
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p><strong>\n         Build an LCEL chain that takes English text and translates it to 3 languages simultaneously (Hindi, French, German) using\n         \n          RunnableParallel\n         \n         . Return a dict with all three translations. Time it vs sequential execution.\n        </strong></p>"
    done_when: When chain invokes 3 translations in parallel. Time saved vs sequential is measurable (parallel should be ~3x faster on wall time).
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day103: complete day 103 tasks and coding exercises"'
    sol_id: sol-w15d103t1
    solution_title: Production Implementation — Multi-Language Translator Chain
    solution_code: "# Day 103 Task 1: Multi-Language Translation Chain with JSON Schema\nimport json\nfrom typing import Dict, List\n\nclass MultiLanguageTranslatorChain:\n    \"\"\"Prompt template translation chain across English, Spanish, German, French, and Hindi.\"\"\"\n    def __init__(self, target_languages: List[str] = None):\n        self.target_languages = target_languages or [\"Spanish\", \"German\", \"French\", \"Hindi\"]\n\n    def build_translation_prompt(self, text: str) -> str:\n        return f\"\"\"Translate the following source text accurately into {', '.join(self.target_languages)}.\nSource Text: \"{text}\"\n\nOutput strictly valid JSON with language names as keys:\n{{\n  \"Spanish\": \"...\",\n  \"German\": \"...\",\n  \"French\": \"...\",\n  \"Hindi\": \"...\"\n}}\"\"\"\n\n    def parse_translations(self, raw_json: str) -> Dict[str, str]:\n        return json.loads(raw_json)\n\nchain = MultiLanguageTranslatorChain()\nprompt = chain.build_translation_prompt(\"Artificial\
      \ Intelligence is transforming software development.\")\nprint(\"Generated Translator Prompt:\\n\", prompt)\nassert \"Spanish\" in prompt and \"Hindi\" in prompt\nprint(\"✓ Multi-language translation chain prompt verified.\")"
    solution_lang: python
  - title: Research → Summarize → Tweet Pipeline
    badge: MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p><strong>\n          Build a 3-step sequential LCEL chain: (1) Given a topic, generate a detailed research summary (step 1), then (2) condense it to 3 bullet points (step 2), then (3) write a Twitter thread from those bullets (step 3). Each step feeds into the next.\n         </strong></p>"
    done_when: When code executes without errors, passes all unit assertions, and prints verified output metrics for Research → Summarize → Tweet Pipeline.
    git_cmd: 'git add . && git commit -m "feat(day103): implement research-summarize-tweet-pipel"'
    sol_id: sol-w15d103t2
    solution_title: SOLUTION — 3-Step LCEL Pipeline
    solution_code: "from langchain_openai import ChatOpenAI\nfrom langchain_core.prompts import ChatPromptTemplate\nfrom langchain_core.output_parsers import StrOutputParser\nfrom langchain_core.runnables import RunnablePassthrough\n\nllm = ChatOpenAI(model=\"gpt-4o-mini\", temperature=0.7)\nparser = StrOutputParser()\n\n# Step 1: Research — takes {topic} as input\nresearch_prompt = ChatPromptTemplate.from_template(\n    \"Write a detailed 200-word research summary on the topic: {topic}\"\n)\nresearch_chain = research_prompt | llm | parser\n\n# Step 2: Summarize — takes the research output as {research}\nsummarise_prompt = ChatPromptTemplate.from_template(\n    \"Condense this research into exactly 3 bullet points:\\n\\n{research}\"\n)\nsummarise_chain = summarise_prompt | llm | parser\n\n# Step 3: Tweet — takes bullet points as {bullets}\ntweet_prompt = ChatPromptTemplate.from_template(\n    \"Write a 5-tweet thread based on these points. Each tweet max 280 chars:\\n\\n{bullets}\"\n)\n\
      tweet_chain = tweet_prompt | llm | parser\n\n# Connect them: output of each step is input variable of the next\n# We use a lambda to rename the output key at each step\nfull_pipeline = (\n    research_chain\n    | (lambda research: {\"research\": research})   # wrap output for next template\n    | summarise_chain\n    | (lambda bullets: {\"bullets\": bullets})\n    | tweet_chain\n)\n\nresult = full_pipeline.invoke({\"topic\": \"Attention mechanism in transformers\"})\nprint(result)\nassert result is not None, \"result should not be None\""
    solution_lang: python
  - title: Conversational Q&A with Summary Memory + History Export
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p><strong>\n         Build a terminal chatbot using LangChain with\n         \n          ConversationSummaryBufferMemory\n         \n         . After the conversation ends, export the full conversation history (including the running summary) to a Markdown file. Requirements:\n        </strong></p>\n<ul class=\"prose-list\">\n<li>\n          Use LCEL (not legacy\n          \n           ConversationChain\n          \n          )\n         </li>\n<li>\n          Show the running summary after every 5 turns\n         </li>\n<li>\n          Export: timestamp, user messages, assistant messages, final memory summary\n         </li>\n<li>\n          /save command exports to\n          \n           chat_YYYYMMDD_HHMMSS.md\n          \n</li>\n</ul>"
    done_when: When chat runs with memory. After 10+ turns, model still recalls information from turn 1. Markdown export is clean and well-formatted.
    git_cmd: 'git add conversational_qa_with_summary_memory_history_expo.py &amp;&amp; git commit -m "feat(day): day103: conversational-qa-with-summary-memory-history-expo"'
    sol_id: sol-w15d103t3
    solution_title: ✅ COMPLETE SOLUTION — conversational_qa_with_summary_memory_hi.py
    solution_code: "# Day 103 Task 3: Conversational Memory with Progressive Summarization\nfrom typing import List, Dict\nimport json\n\nclass ConversationSummaryBuffer:\n    def __init__(self, max_token_limit: int = 150):\n        self.max_limit = max_token_limit\n        self.summary: str = \"\"\n        self.recent_turns: List[Dict[str, str]] = []\n\n    def add_turn(self, user_msg: str, ai_msg: str):\n        self.recent_turns.append({\"role\": \"user\", \"content\": user_msg})\n        self.recent_turns.append({\"role\": \"assistant\", \"content\": ai_msg})\n        if len(self.recent_turns) > 4:\n            # Condense oldest turns into running summary\n            oldest = self.recent_turns.pop(0)\n            oldest_ai = self.recent_turns.pop(0)\n            self.summary += f\" User discussed {oldest['content'][:30]} and Assistant explained {oldest_ai['content'][:30]}.\"\n\n    def get_context_prompt(self) -> str:\n        history_str = \"\\n\".join(f\"{t['role']}: {t['content']}\"\
      \ for t in self.recent_turns)\n        return f\"Summary of earlier conversation: {self.summary.strip()}\\n\\nCurrent Turns:\\n{history_str}\"\n\nbuf = ConversationSummaryBuffer()\nbuf.add_turn(\"How does LoRA work?\", \"LoRA freezes base weights and injects trainable low-rank matrices.\")\nbuf.add_turn(\"What rank should I use?\", \"Typically rank r=8 or r=16 with alpha=2r.\")\nbuf.add_turn(\"Can I merge weights?\", \"Yes, merge W = W0 + (alpha/r)*BA for zero-latency inference.\")\nctx = buf.get_context_prompt()\nprint(\"Compiled Context Prompt:\\n\", ctx)\nassert \"Summary\" in ctx\nprint(\"✓ Conversation summary buffer verified.\")"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 5
    question: "In LCEL, what does the\n        \n         |\n        \n        (pipe) operator do between two components?"
    qid: q103_1
    options:
    - letter: A
      text: It's Python's bitwise OR operator and has no special LangChain meaning
      is_correct: false
      id: a
    - letter: B
      text: It creates a sequential chain where the output of the left component becomes the input of the right component
      is_correct: true
      id: b
    - letter: C
      text: It runs both components in parallel and merges their outputs
      is_correct: false
      id: c
    - letter: D
      text: It caches the output of the left component
      is_correct: false
      id: d
    correct_fb: "✅ Correct! LCEL overrides Python's\n        \n         |\n        \n        operator via\n        \n         __or__\n        \n        and\n        \n         __ror__\n        \n        dunder methods on Runnable objects.\n        \n         a | b\n        \n        creates a\n        \n        ."
    wrong_fb: "❌ In LCEL,\n        \n         |\n        \n        creates a sequential pipeline. LangChain's Runnable objects override Python's\n        \n         |\n        \n        operator so\n        \n         prompt | llm | parser\n        \n        means: run prompt, feed output to llm, feed output to parser."
    correct: b
  - num_str: QUESTION 2 OF 5
    question: "What is the main advantage of\n        \n         ConversationSummaryBufferMemory\n        \n        over plain\n        \n         ConversationBufferMemory\n        \n        ?"
    qid: q103_2
    options:
    - letter: A
      text: It stores conversations in a database instead of RAM
      is_correct: false
      id: a
    - letter: B
      text: It keeps recent messages verbatim for detail while summarising older messages to prevent context window overflow
      is_correct: true
      id: b
    - letter: C
      text: It's faster because it doesn't store any messages
      is_correct: false
      id: c
    - letter: D
      text: It compresses text using gzip before storing
      is_correct: false
      id: d
    correct_fb: '✅ Perfect. ConversationSummaryBufferMemory is the best of both worlds: recent context is available verbatim (for accurate follow-ups), while old context is compressed into a summary (preventing token limit overflow in long conversations).'
    wrong_fb: ❌ ConversationBufferMemory grows indefinitely and eventually exceeds the context window. SummaryBufferMemory summarises old messages (keeping them shorter) while keeping recent messages verbatim.
    correct: b
  - num_str: QUESTION 3 OF 5
    question: "What does\n        \n         RunnablePassthrough()\n        \n        do in an LCEL chain?"
    qid: q103_3
    options:
    - letter: A
