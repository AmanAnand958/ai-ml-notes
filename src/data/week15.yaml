week_number: 15
title: LLMs + Generative AI + OpenAI APIs
description: ''
days:
- id: '101'
  day_num: 101
  title: Prompt Engineering — The Art of Talking to LLMs
  subtitle: LLMs ke paas ek superpower hai — lekin us superpower ko unlock karna sikho.
    Zero-shot, few-shot, Chain-of-Thought (CoT), ReAct, temperature tuning, aur prompt
    injection defense — ye sab milke ek complete prompt engineer banaate hain.
  time_estimate: 6 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - "Understand the three message roles:\n        \n         system\n        \n  \
    \      ,\n        \n         user\n        \n        ,\n        \n         assistant\n\
    \        \n        and why they matter."
  - Apply Zero-shot, Few-shot, and Chain-of-Thought prompting strategies correctly.
  - Use ReAct (Reason + Act) prompting for multi-step problem solving.
  - "Control output randomness using\n        \n         temperature\n        \n \
    \       ,\n        \n         top_p\n        \n        , and\n        \n     \
    \    max_tokens\n        \n        ."
  - Recognize and defend against prompt injection attacks.
  checklist:
  - id: chk_101_1
    text: Study the core mathematical and architectural principles of Prompt Engineering
      — The Art of Talking to LLMs
  - id: chk_101_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_101_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_101_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - LLM APIs
  - Vector Embeddings
  - Vector Store Indexes
  - Retrieval Logic
  - LangChain Integrations
  - RAG Evaluation
  hinglish: "\U0001F4E2\n       <strong>\n        Ek line mein:\n       </strong>\n\
    \       RAG pipeline external context documents ko prompts vectors index se search\
    \ karke LLM queries generation augment karta hai."
  analogy: "Ye bilkul waisa hai jaise ek job interview mein HR ne pehle bata diya:\
    \ \"Aap sirf technical questions answer karenge, koi personal baat nahi.\" Ye\n\
    \       <strong>\n        system prompt\n       </strong>\n       hai. Phir interviewer\
    \ (user) poochta hai, aur tum (assistant) jawab dete ho."
  theory_html: "<h3 class=\"sh3\">\n       1. The Message Structure — System, User,\
    \ Assistant\n      </h3>\n<p>\n       Ek LLM ko baat karne ka ek specific format\
    \ hota hai. Ye ek chat window nahi hai — ye ek\n       <strong>\n        structured\
    \ message array\n       </strong>\n       hai. Teen roles hain:\n      </p>\n\
    <div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"\
    ><table class=\"concept-table\">\n<tr>\n<th>\n         Role\n        </th>\n<th>\n\
    \         Purpose\n        </th>\n<th>\n         Example\n        </th>\n</tr>\n\
    <tr>\n<td>\n\n          system\n         \n</td>\n<td>\n         Sets the AI's\
    \ persona, rules, and constraints. Processed first, highest priority.\n      \
    \  </td>\n<td>\n         \"You are a Python expert who only answers in code.\"\
    \n        </td>\n</tr>\n<tr>\n<td>\n\n          user\n         \n</td>\n<td>\n\
    \         The human's actual question or request.\n        </td>\n<td>\n     \
    \    \"Write a function to reverse a linked list.\"\n        </td>\n</tr>\n<tr>\n\
    <td>\n\n          assistant\n         \n</td>\n<td>\n         Previous AI responses\
    \ — used to build conversation history (few-shot examples too).\n        </td>\n\
    <td>\n         Prior answers in the conversation.\n        </td>\n</tr>\n</table></div>\n\
    \n<svg aria-label=\"Structured chat message array showing system, user, assistant\
    \ and user roles flowing into an API request\" height=\"330\" role=\"img\" viewbox=\"\
    0 0 700 330\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\">\n<style>\n \
    \       svg .w15t{font-family:DM Sans,sans-serif}\n       </style>\n<defs>\n<lineargradient\
    \ id=\"w15-bg_s\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n<stop offset=\"0%\" stop-color=\"\
    #1a1e2e\">\n</stop>\n<stop offset=\"100%\" stop-color=\"var(--bg)\">\n</stop>\n\
    </lineargradient>\n</defs>\n<rect fill=\"url(#w15-bg_s)\" height=\"330\" rx=\"\
    12\" width=\"700\">\n</rect>\n<text class=\"w15t\" fill=\"#e6edf3\" font-size=\"\
    14\" font-weight=\"700\" text-anchor=\"middle\" x=\"350\" y=\"26\">\n        The\
    \ message array — a structured conversation, not a chat window\n       </text>\n\
    <rect fill=\"#6c8cff\" fill-opacity=\"0.12\" height=\"44\" rx=\"8\" stroke=\"\
    #6c8cff\" stroke-width=\"1.5\" width=\"430\" x=\"80\" y=\"48\">\n</rect>\n<text\
    \ class=\"w15t\" fill=\"#6c8cff\" font-size=\"11\" font-weight=\"700\" x=\"96\"\
    \ y=\"67\">\n        SYSTEM\n       </text>\n<text class=\"w15t\" fill=\"#e6edf3\"\
    \ font-size=\"11\" x=\"150\" y=\"67\">\n        You are a Python expert. Answer\
    \ with code only.\n       </text>\n<rect fill=\"#4fd1a5\" fill-opacity=\"0.12\"\
    \ height=\"44\" rx=\"8\" stroke=\"#4fd1a5\" stroke-width=\"1.5\" width=\"430\"\
    \ x=\"80\" y=\"102\">\n</rect>\n<text class=\"w15t\" fill=\"#4fd1a5\" font-size=\"\
    11\" font-weight=\"700\" x=\"96\" y=\"121\">\n        USER\n       </text>\n<text\
    \ class=\"w15t\" fill=\"#e6edf3\" font-size=\"11\" x=\"150\" y=\"121\">\n    \
    \    Write a function to reverse a linked list.\n       </text>\n<rect fill=\"\
