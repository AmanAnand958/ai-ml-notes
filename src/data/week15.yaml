  theory_html: "<h3 class=\"sh3\">\n       1. OpenAI Chat Completions API — Complete\
    \ Reference\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       The Chat Completions API is the primary interface\
    \ for prompting OpenAI models, accepting a structured array of developer, system,\
    \ user, and assistant messages.\n      </p>\n<div class=\"cb\">\n<div class=\"\
