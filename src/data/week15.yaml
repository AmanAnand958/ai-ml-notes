  gotcha:
    title: '⚠️ Gotcha: API Key Exposure'
    description: "Never hardcode API keys in source code. Use environment variables (\n       \n        os.getenv(\"OPENAI_API_KEY\")\n       \n       ) or\n       \n        .env\n       \n       files with\n       \n        python-dotenv\n       \n       . Add\n       \n        .env\n       \n       to\n       \n        .gitignore\n       \n       . A single committed API key can result in thousands of dollars of unauthorized usage within hours."
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       RAG pipeline external context documents ko prompts vectors index se search karke LLM queries generation augment karta hai."
    bullets:
    - System prompt is the highest-priority instruction; always separate it from user input to prevent injection.
    - Chain-of-Thought works by decomposing hard problems into easy intermediate steps — add "Let's think step by step" for free accuracy gains.
    - temperature=0 for structured/factual output; temperature=0.7–1.0 for creative tasks.
    - ReAct (Thought→Action→Observation) is the foundation of every modern AI agent framework.
    - 'Self-consistency: generate N answers at temperature&gt;0, take majority vote — improves reliability on hard reasoning tasks.'
