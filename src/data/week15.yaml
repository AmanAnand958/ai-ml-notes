  - title: Research → Summarize → Tweet Pipeline
    badge: MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n          Build a 3-step sequential LCEL chain: (1) Given a\
      \ topic, generate a detailed research summary (step 1), then (2) condense it\
      \ to 3 bullet points (step 2), then (3) write a Twitter thread from those bullets\
      \ (step 3). Each step feeds into the next.\n         </p>"
    done_when: ''
    git_cmd: ''
    sol_id: sol-103-2
    solution_title: SOLUTION — 3-Step LCEL Pipeline
    solution_code: "<span class=\"kw\">from</span> langchain_openai <span class=\"\
      kw\">import</span> ChatOpenAI\n<span class=\"kw\">from</span> langchain_core.prompts\
      \ <span class=\"kw\">import</span> ChatPromptTemplate\n<span class=\"kw\">from</span>\
      \ langchain_core.output_parsers <span class=\"kw\">import</span> StrOutputParser\n\
      <span class=\"kw\">from</span> langchain_core.runnables <span class=\"kw\">import</span>\
      \ RunnablePassthrough\n\nllm = <span class=\"fn\">ChatOpenAI</span>(model=<span\
      \ class=\"str\">\"gpt-4o-mini\"</span>, temperature=<span class=\"num\">0.7</span>)\n\
      parser = <span class=\"fn\">StrOutputParser</span>()\n\n<span class=\"cm\">#\
      \ Step 1: Research — takes {topic} as input</span>\nresearch_prompt = ChatPromptTemplate.<span\
      \ class=\"fn\">from_template</span>(\n    <span class=\"str\">\"Write a detailed\
      \ 200-word research summary on the topic: {topic}\"</span>\n)\nresearch_chain\
      \ = research_prompt | llm | parser\n\n<span class=\"cm\"># Step 2: Summarize\
      \ — takes the research output as {research}</span>\nsummarise_prompt = ChatPromptTemplate.<span\
      \ class=\"fn\">from_template</span>(\n    <span class=\"str\">\"Condense this\
      \ research into exactly 3 bullet points:\\n\\n{research}\"</span>\n)\nsummarise_chain\
      \ = summarise_prompt | llm | parser\n\n<span class=\"cm\"># Step 3: Tweet —\
      \ takes bullet points as {bullets}</span>\ntweet_prompt = ChatPromptTemplate.<span\
      \ class=\"fn\">from_template</span>(\n    <span class=\"str\">\"Write a 5-tweet\
      \ thread based on these points. Each tweet max 280 chars:\\n\\n{bullets}\"</span>\n\
      )\ntweet_chain = tweet_prompt | llm | parser\n\n<span class=\"cm\"># Connect\
      \ them: output of each step is input variable of the next</span>\n<span class=\"\
      cm\"># We use a lambda to rename the output key at each step</span>\nfull_pipeline\
      \ = (\n    research_chain\n    | (<span class=\"kw\">lambda</span> research:\
      \ {<span class=\"str\">\"research\"</span>: research})   <span class=\"cm\"\
      ># wrap output for next template</span>\n    | summarise_chain\n    | (<span\
      \ class=\"kw\">lambda</span> bullets: {<span class=\"str\">\"bullets\"</span>:\
      \ bullets})\n    | tweet_chain\n)\n\nresult = full_pipeline.<span class=\"fn\"\
      >invoke</span>({<span class=\"str\">\"topic\": \"Attention mechanism in transformers\"\
      </span>})\n<span class=\"fn\">print</span>(result)"
    solution_lang: PYTHON
