week_number: 15
title: LLMs + Generative AI + OpenAI APIs
description: 'Retrieval-Augmented Generation (RAG): Dense retrieval, hybrid search, semantic chunking, and RAGAS evaluation.'
days:
- id: 101
  day_num: 101
  title: Prompt Engineering — The Art of Talking to LLMs
  subtitle: LLMs ke paas ek superpower hai — lekin us superpower ko unlock karna sikho. Zero-shot, few-shot, Chain-of-Thought (CoT), ReAct, temperature tuning, aur prompt injection defense — ye sab milke ek complete prompt engineer banaate hain.
  time_estimate: 6 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - "Analyze the three message roles:\n        \n         system\n        \n        ,\n        \n         user\n        \n        ,\n        \n         assistant\n        \n        and why they matter."
  - Apply Zero-shot, Few-shot, and Chain-of-Thought prompting strategies correctly.
  - Apply ReAct (Reason + Act) prompting for multi-step problem solving.
  - Implement output randomness using temperature , top_p , and max_tokens .
  - 'Apply: Recognize and defend against prompt injection attacks.'
  checklist:
  - id: chk_101_1
    text: Derive and analyze mathematical and architectural principles for Prompt Engineering — The Art of Talking to LLMs
  - id: chk_101_2
    text: Build and benchmark production coding pipelines for Prompt Engineering — The Art of Talking to LLMs
  - id: chk_101_3
    text: Execute and validate test verification suite for Prompt Zoo — 5 Techniques on the Same Problem
  - id: chk_101_4
    text: Evaluate conceptual mastery via interactive flashcards and quiz challenges
  concept_flow:
  - Prompt Engineering — The Art of Talking to LLMs
  - LLM APIs — OpenAI, Anthropic & Google Gemini
  - LangChain & LCEL — LLM Orchestration
  - Vector Databases — Semantic Search Infrastructure
  - Advanced RAG — Beyond Naive Retrieval
