      \ class=\"str\">\"metadatas\"</span>][<span class=\"num\">0</span>]):\n    \
      \    <span class=\"fn\">print</span>(<span class=\"str\">f\"  [{1-dist:.3f}]\
      \ ({meta['</span>topic<span class=\"str\">']}/{meta['</span>level<span class=\"\
      str\">']}) {doc}\"</span>)\n\n<span class=\"fn\">search</span>(<span class=\"\
