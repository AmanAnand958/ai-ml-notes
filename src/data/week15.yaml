    \      </h3>\n<div class=\"mermaid\">\ngraph TD\n  A[\"\U0001F4C4 Document\"]\
    \ --&gt; B[\"Split into Chunks\"]\n  B --&gt; C[\"Embed Chunks\"]\n  C --&gt;\
    \ D[\"Store in Vector DB\"]\n  E[\"❓ User Query\"] --&gt; F[\"Embed Query\"]\n\
    \  F --&gt; G[\"Semantic Search Top-K\"]\n  D --&gt; G\n  G --&gt; H[\"Reranker\"\
    ]\n  H --&gt; I[\"LLM + Context\"]\n  I --&gt; J[\"✅ Answer\"]\nstyle A fill:#1c2030,stroke:#38bdf8,color:#dde2f0\n\
    style J fill:#1c2030,stroke:#4fd1a5,color:#dde2f0\nstyle H fill:#1c2030,stroke:#f7a94b,color:#dde2f0\n\
    </div>\n<h3 class=\"sh3\">\n       2. Chunking Strategies\n      </h3>\n<div class=\"\
    table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table\
    \ class=\"concept-table\">\n<tr>\n<th>\n         Strategy\n        </th>\n<th>\n\
    \         How it works\n        </th>\n<th>\n         Best For\n        </th>\n\
    <th>\n         Overlap\n        </th>\n</tr>\n<tr>\n<td>\n         Fixed-size\n\
    \        </td>\n<td>\n         Split every N characters, no respect for structure\n\
    \        </td>\n<td>\n         Never — use recursive instead\n        </td>\n\
    <td>\n         Optional\n        </td>\n</tr>\n<tr>\n<td>\n         Recursive\
    \ Text Splitter\n        </td>\n<td>\n         Try to split on \\n\\n, then \\\
    n, then \". \", then \" \" — respects natural structure\n        </td>\n<td>\n\
    \         General text, articles, README files\n        </td>\n<td>\n        \
    \ 50–200 chars\n        </td>\n</tr>\n<tr>\n<td>\n         Semantic Chunking\n\
    \        </td>\n<td>\n         Split when embedding similarity between sentences\
    \ drops below threshold\n        </td>\n<td>\n         Dense technical documents\n\
    \        </td>\n<td>\n         None needed\n        </td>\n</tr>\n<tr>\n<td>\n\
    \         Parent-Child\n        </td>\n<td>\n         Store large parent chunks;\
    \ retrieve small child chunks; return parent to LLM\n        </td>\n<td>\n   \
    \      Documents with hierarchical structure\n        </td>\n<td>\n         Built-in\n\
    \        </td>\n</tr>\n<tr>\n<td>\n         Document-specific\n        </td>\n\
    <td>\n         Use markdown headers, HTML tags, or PDF section markers\n     \
    \   </td>\n<td>\n         Structured documents (wikis, legal PDFs)\n        </td>\n\
    <td>\n         Section-level\n        </td>\n</tr>\n</table></div>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — RECURSIVE\
    \ TEXT SPLITTER\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><span class=\"kw\">from</span> typing\
    \ <span class=\"kw\">import</span> List, Dict\n\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">compute_rrf_hybrid_search</span>(\n    bm25_ranks: Dict[str,\
    \ int], \n    vector_ranks: Dict[str, int], \n    k: int = <span class=\"num\"\
    >60</span>\n) -&gt; List[Dict]:\n    <span class=\"str\">\"\"\"</span>\n    Reciprocal\
    \ Rank <span class=\"fn\">Fusion</span> (RRF) <span class=\"kw\">for</span> Combining\
    \ Sparse BM25 <span class=\"kw\">and</span> Dense Vector Search.\n    Formula:\
    \ <span class=\"fn\">RRF_Score</span>(d) = <span class=\"num\">1</span>/(k + <span\
    \ class=\"fn\">rank_bm25</span>(d)) + <span class=\"num\">1</span>/(k + <span\
    \ class=\"fn\">rank_vec</span>(d))\n    <span class=\"str\">\"\"\"</span>\n  \
    \  all_doc_ids = <span class=\"fn\">set</span>(bm25_ranks.<span class=\"fn\">keys</span>()).<span\
    \ class=\"fn\">union</span>(<span class=\"fn\">set</span>(vector_ranks.<span class=\"\
    fn\">keys</span>()))\n    rrf_scores = {}\n    \n    <span class=\"kw\">for</span>\
    \ doc_id <span class=\"kw\">in</span> all_doc_ids:\n        score = <span class=\"\
    num\">0.0</span>\n        <span class=\"kw\">if</span> doc_id <span class=\"kw\"\
    >in</span> bm25_ranks:\n            score += <span class=\"num\">1.0</span> /\
    \ (k + bm25_ranks[doc_id])\n        <span class=\"kw\">if</span> doc_id <span\
    \ class=\"kw\">in</span> vector_ranks:\n            score += <span class=\"num\"\
    >1.0</span> / (k + vector_ranks[doc_id])\n        rrf_scores[doc_id] = score\n\
    \        \n    ranked = <span class=\"fn\">sorted</span>(rrf_scores.<span class=\"\
    fn\">items</span>(), key=<span class=\"kw\">lambda</span> x: x[<span class=\"\
    num\">1</span>], reverse=<span class=\"kw\">True</span>)\n    <span class=\"kw\"\
    >return</span> [{<span class=\"str\">\"doc_id\": doc, \"rrf_score\"</span>: <span\
    \ class=\"fn\">round</span>(score, <span class=\"num\">5</span>)} <span class=\"\
    kw\">for</span> doc, score <span class=\"kw\">in</span> ranked]\n\n<span class=\"\
    cm\"># Example execution</span>\nbm25_results = {<span class=\"str\">\"doc_101\"\
    : 1, \"doc_102\": 2, \"doc_103\"</span>: <span class=\"num\">3</span>}\nvector_results\
    \ = {<span class=\"str\">\"doc_103\": 1, \"doc_101\": 2, \"doc_104\"</span>: <span\
    \ class=\"num\">3</span>}\nfused = <span class=\"fn\">compute_rrf_hybrid_search</span>(bm25_results,\
    \ vector_results, k=<span class=\"num\">60</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Hybrid RRF Ranks:\"</span>, fused)</pre>\n</div>\n<h3 class=\"\
    sh3\">\n       3. Hybrid Search — BM25 + Vector Similarity\n      </h3>\n<p>\n\
    \       BM25 is the gold standard keyword search (used by Elasticsearch, Solr).\
    \ It catches\n       <strong>\n        exact keyword matches\n       </strong>\n\
    \       that vector search misses. Vector search catches\n       <strong>\n  \
    \      semantic matches\n       </strong>\n       that BM25 misses. Combined =\
    \ best of both worlds.\n      </p>\n<div class=\"math-block\">\n<span class=\"\
    desc\">\n        BM25 score for query term t in document d:\n       </span>\n\
    <span class=\"formula\">\n        $$\\text{BM25}(t,d) = \\text{IDF}(t) \\cdot\
    \ \\frac{f(t,d) \\cdot (k_1 + 1)}{f(t,d) + k_1 \\cdot \\left(1 - b + b \\cdot\
    \ \\frac{|d|}{\\text{avgdl}}\\right)}$$\n       </span>\n<span class=\"desc\"\
    >\n        Where f(t,d) = term frequency, |d| = document length, avgdl = avg doc\
    \ length, k₁=1.5, b=0.75 are tuning params.\n       </span>\n</div>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — HYBRID\
    \ SEARCH WITH RECIPROCAL RANK FUSION\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">from</span> typing <span class=\"kw\">import</span> List, Dict\n\
    \n<span class=\"kw\">class</span> <span class=\"cls\">CrossEncoderReranker</span>:\n\
    \    <span class=\"str\">\"\"\"</span>\n    Cross-Encoder Re-ranker: Performs\
    \ joint full <span class=\"kw\">self</span>-attention over [CLS] Query [SEP] Document\
    \ [SEP]\n    to output an uncompressed relevance probability score.\n    <span\
    \ class=\"str\">\"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"\
    fn\">__init__</span>(<span class=\"kw\">self</span>, model_name: str = <span class=\"\
    str\">\"cross-encoder/ms-marco-MiniLM-L-6-v2\"</span>):\n        <span class=\"\
    kw\">self</span>.model_name = model_name\n\n    <span class=\"kw\">def</span>\
    \ <span class=\"fn\">predict_relevance</span>(<span class=\"kw\">self</span>,\
    \ query: str, candidate_docs: List[str]) -&gt; List[Dict]:\n        <span class=\"\
    cm\"># Simulated Cross-Encoder scoring (in production: cross_encoder.predict([[query,\
    \ d] for d in candidate_docs]))</span>\n        results = []\n        <span class=\"\
    kw\">for</span> idx, doc <span class=\"kw\">in</span> <span class=\"fn\">enumerate</span>(candidate_docs):\n\
    \            query_terms = <span class=\"fn\">set</span>(query.<span class=\"\
    fn\">lower</span>().<span class=\"fn\">split</span>())\n            doc_terms\
    \ = <span class=\"fn\">set</span>(doc.<span class=\"fn\">lower</span>().<span\
    \ class=\"fn\">split</span>())\n            overlap = <span class=\"fn\">len</span>(query_terms.<span\
    \ class=\"fn\">intersection</span>(doc_terms)) / <span class=\"fn\">max</span>(<span\
    \ class=\"num\">1</span>, <span class=\"fn\">len</span>(query_terms))\n      \
    \      score = <span class=\"num\">1.0</span> / (<span class=\"num\">1.0</span>\
    \ + np.<span class=\"fn\">exp</span>(- (<span class=\"num\">2.5</span> * overlap\
    \ - <span class=\"num\">0.5</span>))) <span class=\"cm\"># Sigmoid calibrated\
    \ score</span>\n            results.<span class=\"fn\">append</span>({<span class=\"\
    str\">\"doc_id\": f\"doc_{idx+1}\", \"text\": doc, \"cross_encoder_score\"</span>:\
    \ <span class=\"fn\">round</span>(<span class=\"fn\">float</span>(score), <span\
    \ class=\"num\">4</span>)})\n            \n        ranked = <span class=\"fn\"\
    >sorted</span>(results, key=<span class=\"kw\">lambda</span> x: x[<span class=\"\
    str\">\"cross_encoder_score\"</span>], reverse=<span class=\"kw\">True</span>)\n\
    \        <span class=\"kw\">return</span> ranked\n\n<span class=\"kw\">import</span>\
    \ numpy <span class=\"kw\">as</span> np\nreranker = <span class=\"fn\">CrossEncoderReranker</span>()\n\
    candidates = [\n    <span class=\"str\">\"Machine learning neural networks require\
    \ backpropagation.\"</span>,\n    <span class=\"str\">\"Reciprocal rank fusion\
    \ combines multiple ranking lists.\"</span>,\n    <span class=\"str\">\"Cross-encoders\
    \ process query and passage jointly for high accuracy.\"</span>\n]\nranked_candidates\
    \ = reranker.<span class=\"fn\">predict_relevance</span>(<span class=\"str\">\"\
    What is a cross encoder?\"</span>, candidates)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Cross-Encoder Re-ranked:\"</span>, ranked_candidates)</pre>\n\
    </div>\n<h3 class=\"sh3\">\n       4. Cross-Encoder Reranking\n      </h3>\n<p>\n\
    \       Bi-encoder (sentence-transformers) mein query aur document separately\
    \ embed hote hain — fast but approximate.\n       <strong>\n        Cross-encoder\n\
    \       </strong>\n       mein query aur document ko\n       <strong>\n      \
    \  together\n       </strong>\n       feed kiya jaata hai — much more accurate\
    \ but slower. Solution: bi-encoder se top-50 retrieve karo, cross-encoder se top-5\
    \ mein rerank karo.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n\
    <span class=\"cb-lang\">\n         PYTHON — CROSS-ENCODER RERANKER\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core Transformations</span>\n\
    <span class=\"kw\">from</span> typing <span class=\"kw\">import</span> List\n\n\
    <span class=\"kw\">def</span> <span class=\"fn\">fixed_size_chunking</span>(text:\
    \ str, chunk_size: int = <span class=\"num\">200</span>, chunk_overlap: int =\
    \ <span class=\"num\">40</span>) -&gt; List[str]:\n    <span class=\"str\">\"\"\
    \"Fixed character length chunking with sliding window overlap.\"\"\"</span>\n\
    \    chunks = []\n    start = <span class=\"num\">0</span>\n    <span class=\"\
    kw\">while</span> start &lt; <span class=\"fn\">len</span>(text):\n        end\
    \ = start + chunk_size\n        chunks.<span class=\"fn\">append</span>(text[start:end])\n\
    \        start += chunk_size - chunk_overlap\n    <span class=\"kw\">return</span>\
    \ chunks\n\n<span class=\"kw\">def</span> <span class=\"fn\">recursive_character_chunking</span>(text:\
    \ str, max_chunk_size: int = <span class=\"num\">200</span>, separators: List[str]\
    \ = <span class=\"kw\">None</span>) -&gt; List[str]:\n    <span class=\"str\"\
    >\"\"\"Recursively splits by double newlines, single newlines, spaces, and characters.\"\
    \"\"</span>\n    <span class=\"kw\">if</span> separators <span class=\"kw\">is</span>\
    \ <span class=\"kw\">None</span>:\n        separators = [<span class=\"str\">\"\
    \\n\\n\", \"\\n\", \". \", \" \"</span>]\n        \n    paragraphs = text.<span\
    \ class=\"fn\">split</span>(separators[<span class=\"num\">0</span>])\n    valid_chunks\
    \ = []\n    current_chunk = <span class=\"str\">\"\"</span>\n    <span class=\"\
    kw\">for</span> para <span class=\"kw\">in</span> paragraphs:\n        <span class=\"\
    kw\">if</span> <span class=\"fn\">len</span>(current_chunk) + <span class=\"fn\"\
    >len</span>(para) &lt;= max_chunk_size:\n            current_chunk += (<span class=\"\
    str\">\"\\n\\n\" if current_chunk else \"\"</span>) + para\n        <span class=\"\
    kw\">else</span>:\n            <span class=\"kw\">if</span> current_chunk:\n \
    \               valid_chunks.<span class=\"fn\">append</span>(current_chunk)\n\
    \            current_chunk = para\n    <span class=\"kw\">if</span> current_chunk:\n\
    \        valid_chunks.<span class=\"fn\">append</span>(current_chunk)\n    <span\
    \ class=\"kw\">return</span> valid_chunks\n\nsample_text = <span class=\"str\"\
    >\"\"\"</span>Deep Learning systems rely on hierarchical representation learning.\
    \ \nLower layers capture low-level primitive features such <span class=\"kw\"\
    >as</span> edges <span class=\"kw\">and</span> textures. \nIntermediate layers\
    \ aggregate features into parts <span class=\"kw\">and</span> motifs.\nUpper layers\
    \ compute high-level task-specific <span class=\"kw\">class</span> <span class=\"\
    cls\">probabilities</span>.<span class=\"str\">\"\"\"</span>\n\nfixed = <span\
    \ class=\"fn\">fixed_size_chunking</span>(sample_text, chunk_size=<span class=\"\
    num\">120</span>, chunk_overlap=<span class=\"num\">20</span>)\nrecursive = <span\
    \ class=\"fn\">recursive_character_chunking</span>(sample_text, max_chunk_size=<span\
    \ class=\"num\">120</span>)\n\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"Fixed Chunks ({len(fixed)} chunks):\"</span>, fixed)\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"\\nRecursive Chunks ({len(recursive)}\
    \ chunks):\"</span>, recursive)</pre>\n</div>\n<h3 class=\"sh3\">\n       5. RAGAS\
    \ — RAG Evaluation Framework\n      </h3>\n<div class=\"table-wrap\" style=\"\
    overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\"\
    >\n<tr>\n<th>\n         Metric\n        </th>\n<th>\n         Measures\n     \
    \   </th>\n<th>\n         Range\n        </th>\n<th>\n         Formula Intuition\n\
    \        </th>\n</tr>\n<tr>\n<td>\n         Faithfulness\n        </td>\n<td>\n\
    \         Is the answer grounded in the retrieved context? (no hallucination)\n\
    \        </td>\n<td>\n         0–1\n        </td>\n<td>\n         Claims in answer\
    \ ÷ claims that can be inferred from context\n        </td>\n</tr>\n<tr>\n<td>\n\
    \         Answer Relevancy\n        </td>\n<td>\n         Does the answer address\
    \ the question?\n        </td>\n<td>\n         0–1\n        </td>\n<td>\n    \
    \     Cosine sim of generated questions from answer vs original question\n   \
    \     </td>\n</tr>\n<tr>\n<td>\n         Context Recall\n        </td>\n<td>\n\
    \         Did retrieval find all relevant information?\n        </td>\n<td>\n\
    \         0–1\n        </td>\n<td>\n         Ground truth sentences attributable\
    \ to context ÷ total ground truth sentences\n        </td>\n</tr>\n<tr>\n<td>\n\
    \         Context Precision\n        </td>\n<td>\n         Are the retrieved chunks\
    \ relevant? (no noise)\n        </td>\n<td>\n         0–1\n        </td>\n<td>\n\
    \         Relevant chunks in context ÷ total chunks retrieved\n        </td>\n\
    </tr>\n</table></div>\n<!-- /theory -->\n<h2 class=\"sh2\">\n       ⚡ Tasks\n\
    \      </h2>"
