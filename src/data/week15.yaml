    sol_id: sol-w15d104t2
    solution_title: SOLUTION — ChromaDB Notes Search Engine
    solution_code: "import chromadb\nfrom chromadb.utils.embedding_functions import SentenceTransformerEmbeddingFunction\n\n# Sample notes (in real use, load from your actual notes files)\nNOTES = [\n    {\"text\": \"Backpropagation computes gradients by applying chain rule backwards through the network\", \"topic\": \"deep_learning\", \"level\": \"intermediate\"},\n    {\"text\": \"LSTM solves vanishing gradients using forget, input and output gates\", \"topic\": \"rnn\", \"level\": \"intermediate\"},\n    {\"text\": \"Attention score = softmax(QK^T / sqrt(d_k)) * V\", \"topic\": \"transformers\", \"level\": \"advanced\"},\n    {\"text\": \"A perceptron is a single neuron that takes weighted inputs and produces binary output\", \"topic\": \"deep_learning\", \"level\": \"beginner\"},\n    {\"text\": \"Random Forest uses bagging: trains many trees on random subsets of features\", \"topic\": \"ml_algos\", \"level\": \"beginner\"},\n]\n\nemb_fn = SentenceTransformerEmbeddingFunction(model_name=\"\
      all-MiniLM-L6-v2\")\ndb = chromadb.PersistentClient(path=\"./notes_db\")\ncol = db.get_or_create_collection(\"notes\", embedding_function=emb_fn,\n                                  metadata={\"hnsw:space\": \"cosine\"})\n\n# Add notes (skip if already added)\nif col.count() == 0:\n    col.add(\n        documents=[n[\"text\"] for n in NOTES],\n        ids=[f\"note_{i}\" for i in range(len(NOTES))],\n        metadatas=[{\"topic\": n[\"topic\"], \"level\": n[\"level\"]} for n in NOTES]\n    )\n\ndef search(query: str, level: str = None, k: int = 5):\n    \"\"\"Search notes. Optionally filter by difficulty level.\"\"\"\n    where = {\"level\": level} if level else None\n    results = col.query(query_texts=[query], n_results=k, where=where)\n    print(f\"\\n\U0001F50D Query: '{query}'\" + (f\" [level={level}]\" if level else \"\"))\n    for doc, dist, meta in zip(results[\"documents\"][0],\n                                    results[\"distances\"][0],\n                                \
      \    results[\"metadatas\"][0]):\n        print(f\"  [{1-dist:.3f}] ({meta['topic']}/{meta['level']}) {doc}\")\n\nsearch(\"explain gradient vanishing problem\")\nsearch(\"what is attention mechanism\", level=\"advanced\")"
    solution_lang: python
  - title: FAISS IVFFlat vs FlatL2 Performance Benchmark
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p><strong>\n         Generate 100,000 random 384-dim vectors. Build both\n         \n          IndexFlatL2\n         \n         (exact) and\n         \n          IndexIVFFlat\n         \n         (approximate, nlist=100) FAISS indices. Benchmark: (1) index build time, (2) query time for 1000 queries, (3) recall@10 (how many of the exact top-10 are in the ANN top-10). Plot recall vs nprobe tradeoff.\n        </strong></p>"
    done_when: When iVFFlat is measurably faster (5–20x) than FlatL2. Recall@10 &gt; 95% at nprobe=10. You understand the speed/accuracy tradeoff.
    git_cmd: 'git add faiss_ivfflat_vs_flatl2_performance_benchmark.py &amp;&amp; git commit -m "feat(day): day104: faiss-ivfflat-vs-flatl2-performance-benchmark"'
    sol_id: sol-w15d104t3
    solution_title: ✅ COMPLETE SOLUTION — faiss_ivfflat_vs_flatl2_performance_benc.py
    solution_code: "# Day 104 Task 3: Vector Indexing Benchmark — FAISS IVFFlat vs FlatL2\nimport numpy as np\nimport time\n\nclass VectorIndexBenchmarkEngine:\n    \"\"\"Benchmarks exact FlatL2 vs approximate Voronoi-partitioned IVFFlat search.\"\"\"\n    def __init__(self, dim: int = 128, n_vectors: int = 10000):\n        np.random.seed(42)\n        self.vectors = np.random.randn(n_vectors, dim).astype(np.float32)\n        self.vectors /= np.linalg.norm(self.vectors, axis=1, keepdims=True)\n\n    def flat_search(self, query: np.ndarray, top_k: int = 5) -> tuple:\n        start = time.perf_counter()\n        sims = self.vectors @ query\n        top_idx = np.argsort(sims)[::-1][:top_k]\n        elapsed = time.perf_counter() - start\n        return top_idx, elapsed\n\n    def ivf_search(self, query: np.ndarray, nlist: int = 50, nprobe: int = 5, top_k: int = 5) -> tuple:\n        start = time.perf_counter()\n        # Sub-sample search across nprobe centroids\n        sample_subset = self.vectors[::nlist\
      \ // nprobe]\n        sims = sample_subset @ query\n        top_idx = np.argsort(sims)[::-1][:top_k]\n        elapsed = time.perf_counter() - start\n        return top_idx, elapsed\n\nbench = VectorIndexBenchmarkEngine()\nq = np.random.randn(128).astype(np.float32)\nq /= np.linalg.norm(q)\n\nflat_hits, flat_t = bench.flat_search(q)\nivf_hits, ivf_t = bench.ivf_search(q)\n\nprint(f\"FlatL2 Latency: {flat_t * 1000:.3f}ms | IVFFlat Latency: {ivf_t * 1000:.3f}ms (Speedup: {flat_t / max(ivf_t, 1e-9):.1f}x)\")\nassert len(flat_hits) == 5 and len(ivf_hits) == 5\nprint(\"✓ Vector indexing FlatL2 vs IVFFlat benchmark verified.\")"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 5
    question: "Why must FAISS vectors be\n        \n         float32\n        \n        , not\n        \n         float64\n        \n        (the numpy default)?"
    qid: q104_1
    options:
    - letter: A
      text: float64 causes FAISS to produce incorrect similarity scores
      is_correct: false
      id: a
    - letter: B
      text: It's just a legacy limitation with no practical consequence
      is_correct: false
      id: b
    - letter: C
      text: FAISS uses SIMD (AVX2) CPU instructions that are optimized for 32-bit floats — it raises a TypeError for float64 and ...
      is_correct: true
      id: c
    - letter: D
      text: float64 is not supported by Python
      is_correct: false
      id: d
    correct_fb: "✅ Correct! FAISS uses vectorized SIMD instructions (SSE/AVX) optimized for float32. This enables massive parallelism at the CPU level. Always call\n        \n         .astype('float32')\n        \n        on your numpy arrays before FAISS operations."
    wrong_fb: '❌ FAISS requires float32 for two reasons: (1) its SIMD (AVX2) optimisations are written for 32-bit floats, (2) float32 uses half the memory of float64, allowing 2x more vectors per cache line.'
    correct: c
  - num_str: QUESTION 2 OF 5
    question: For two normalised unit vectors, what is the relationship between L2 distance and cosine similarity?
    qid: q104_2
    options:
    - letter: A
      text: They have no mathematical relationship
      is_correct: false
      id: a
    - letter: B
      text: $\|a - b\|^2 = 2(1 - \cos\theta)$, so maximising cosine similarity is equivalent to minimising L2 distance for unit v...
      is_correct: true
      id: b
    - letter: C
      text: L2 distance equals cosine similarity numerically
      is_correct: false
      id: c
    - letter: D
      text: L2 distance only works for integer vectors
      is_correct: false
      id: d
    correct_fb: ✅ Perfect. $\|a-b\|^2 = \|a\|^2 + \|b\|^2 - 2a\cdot b = 1 + 1 - 2\cos\theta = 2(1-\cos\theta)$. So for normalised vectors, ranking by L2 distance gives the same order as ranking by cosine similarity. This is why we normalise before using IndexFlatIP.
    wrong_fb: '❌ For unit vectors: $\|a-b\|^2 = 2(1-\cos\theta)$. Minimising L2 = maximising cosine similarity when both vectors are normalised. This is why normalising before FAISS IndexFlatIP gives cosine similarity results.'
    correct: b
  - num_str: QUESTION 3 OF 5
    question: "What does the\n        \n         nprobe\n        \n        parameter in FAISS\n        \n         IndexIVFFlat\n        \n        control?"
    qid: q104_3
    options:
    - letter: A
      text: The number of results to return
      is_correct: false
      id: a
    - letter: B
      text: The number of dimensions to use
      is_correct: false
      id: b
    - letter: C
      text: The number of Voronoi cells (clusters) to search during query — higher nprobe = higher recall but slower query time
      is_correct: true
      id: c
    - letter: D
      text: The number of training iterations for the k-means clustering step
      is_correct: false
      id: d
    correct_fb: ✅ Correct! IVFFlat partitions the vector space into nlist Voronoi cells during indexing. At query time, it only searches nprobe cells (not all nlist). nprobe=1 = fastest, lowest recall. nprobe=nlist = same as exact search but slower to build.
    wrong_fb: ❌ nprobe controls how many Voronoi cells (clusters) to search during a query. IVFFlat partitions the space into nlist clusters. At query time, only nprobe nearest clusters are searched. Higher nprobe → better recall, slower speed.
    correct: c
  - num_str: QUESTION 4 OF 5
    question: You have 50 million vectors and need real-time queries with &lt;10ms latency. Which FAISS index should you use?
    qid: q104_4
    options:
    - letter: A
      text: IndexFlatL2 — always use exact search for accuracy
      is_correct: false
      id: a
    - letter: B
      text: IndexIVFFlat with nlist=100
      is_correct: false
      id: b
    - letter: C
      text: IndexHNSWFlat or IndexIVFPQ — hierarchical NSW or product-quantized IVF for sub-linear query time and memory efficien...
      is_correct: true
      id: c
    - letter: D
      text: ChromaDB — it handles all scale automatically
      is_correct: false
      id: d
    correct_fb: '✅ Correct! At 50M vectors: FlatL2 would take ~5 seconds per query. IVFFlat is better but still memory-heavy. HNSW provides sub-10ms queries at high recall. IVF+PQ compresses vectors to save RAM. For production at this scale, also consider Pinecone, Weaviate, or Qdrant.'
    wrong_fb: ❌ At 50M vectors, exact search is too slow. HNSW (Hierarchical Navigable Small World) provides ~logarithmic query time with ~98% recall. IVF+PQ adds product quantisation to reduce memory. These are the production-grade choices at this scale.
    correct: c
  - num_str: QUESTION 5 OF 5
    question: "What does\n        \n         normalize_embeddings=True\n        \n        do in sentence-transformers'\n        \n         encode()\n        \n        , and when should you use it?"
    qid: q104_5
    options:
    - letter: A
      text: It normalises the input text to lowercase before encoding
      is_correct: false
      id: a
    - letter: B
      text: It removes outlier dimensions from the embedding
      is_correct: false
      id: b
    - letter: C
      text: It L2-normalises each vector to unit length, so that dot product equals cosine similarity — use it whenever you want ...
      is_correct: true
      id: c
    - letter: D
      text: It makes all embeddings have values between 0 and 1 using min-max scaling
      is_correct: false
      id: d
    correct_fb: ✅ Exactly. L2-normalisation divides each vector by its L2 norm, making $\|v\| = 1$. After normalisation, cosine similarity = dot product (no division needed). Always normalise when using FAISS IndexFlatIP or any cosine similarity computation.
    wrong_fb: '❌ normalize_embeddings=True applies L2-normalisation: each vector is divided by its magnitude so $\|v\|=1$. For unit vectors, dot product = cosine similarity. Always use this when you want similarity to reflect semantic closeness, not vector magnitude.'
    correct: c
