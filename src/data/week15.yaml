  - front: What is the difference between max_tokens and context_window in LLM API requests?
    back: Context window is the total budget for input prompt + generated output tokens; max_tokens limits only the maximum number of newly generated tokens.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling LangChain & LCEL — LLM Orchestration in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
