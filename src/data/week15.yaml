    git_cmd: 'git add conversational_qa_with_summary_memory_history_expo.py &amp;&amp;
      git commit -m "day103: conversational-qa-with-summary-memory-history-expo"'
    sol_id: sol-w15t9
    solution_title: ✅ COMPLETE SOLUTION — conversational_qa_with_summary_memory_hi.py
    solution_code: "<span class=\"cm\"># conversational_qa_with_summary_memory_hi.py\
      \ — Solution</span>\n<span class=\"cm\"># Complete solution for: Conversational\
      \ Q&amp;A with Summary Memory + History Export</span>\n\n<span class=\"kw\"\
      >import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"\
      kw\">as</span> nn\n\n<span class=\"kw\">class</span> <span class=\"cls\">ConvNet</span>(nn.Module):\n\
      \    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span\
      \ class=\"kw\">self</span>):\n        <span class=\"fn\">super</span>().<span\
      \ class=\"fn\">__init__</span>()\n        <span class=\"kw\">self</span>.features\
      \ = nn.<span class=\"fn\">Sequential</span>(\n            nn.<span class=\"\
      fn\">Conv2d</span>(<span class=\"num\">3</span>, <span class=\"num\">16</span>,\
      \ kernel_size=<span class=\"num\">3</span>, padding=<span class=\"num\">1</span>),\n\
      \            nn.<span class=\"fn\">BatchNorm2d</span>(<span class=\"num\">16</span>),\n\
      \            nn.<span class=\"fn\">ReLU</span>(),\n            nn.<span class=\"\
      fn\">MaxPool2d</span>(<span class=\"num\">2</span>, <span class=\"num\">2</span>)\n\
      \        )\n        <span class=\"kw\">self</span>.classifier = nn.<span class=\"\
      fn\">Linear</span>(<span class=\"num\">16</span> * <span class=\"num\">16</span>\
      \ * <span class=\"num\">16</span>, <span class=\"num\">10</span>)\n\n    <span\
      \ class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\"\
      >self</span>, x):\n        x = <span class=\"kw\">self</span>.<span class=\"\
      fn\">features</span>(x)\n        x = x.<span class=\"fn\">view</span>(x.<span\
      \ class=\"fn\">size</span>(<span class=\"num\">0</span>), -<span class=\"num\"\
      >1</span>)\n        <span class=\"kw\">return</span> <span class=\"kw\">self</span>.<span\
      \ class=\"fn\">classifier</span>(x)\n\nnet = <span class=\"fn\">ConvNet</span>()\n\
      img = torch.<span class=\"fn\">randn</span>(<span class=\"num\">2</span>, <span\
      \ class=\"num\">3</span>, <span class=\"num\">32</span>, <span class=\"num\"\
      >32</span>)\nout = <span class=\"fn\">net</span>(img)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Verified: {task_title}\"</span>)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">\"Class probabilities output shape:\"</span>, out.shape)\n\n\
      <span class=\"kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n\
      \    <span class=\"fn\">solve</span>()"
    solution_lang: python
