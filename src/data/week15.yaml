      : \"Attention score = softmax(QK^T / sqrt(d_k)) * V\", \"topic\": \"transformers\"\
      , \"level\": \"advanced\"</span>},\n    {<span class=\"str\">\"text\": \"A perceptron\
      \ is a single neuron that takes weighted inputs and produces binary output\"\
      , \"topic\": \"deep_learning\", \"level\": \"beginner\"</span>},\n    {<span\
      \ class=\"str\">\"text\": \"Random Forest uses bagging: trains many trees on\
      \ random subsets of features\", \"topic\": \"ml_algos\", \"level\": \"beginner\"\
      </span>},\n]\n\nemb_fn = <span class=\"fn\">SentenceTransformerEmbeddingFunction</span>(model_name=<span\
      \ class=\"str\">\"all-MiniLM-L6-v2\"</span>)\ndb = chromadb.<span class=\"fn\"\
      >PersistentClient</span>(path=<span class=\"str\">\"./notes_db\"</span>)\ncol\
      \ = db.<span class=\"fn\">get_or_create_collection</span>(<span class=\"str\"\
      >\"notes\"</span>, embedding_function=emb_fn,\n                            \
      \      metadata={<span class=\"str\">\"hnsw:space\": \"cosine\"</span>})\n\n\
      <span class=\"cm\"># Add notes (skip if already added)</span>\n<span class=\"\
      kw\">if</span> col.<span class=\"fn\">count</span>() == <span class=\"num\"\
      >0</span>:\n    col.<span class=\"fn\">add</span>(\n        documents=[n[<span\
      \ class=\"str\">\"text\"</span>] <span class=\"kw\">for</span> n <span class=\"\
      kw\">in</span> NOTES],\n        ids=[<span class=\"str\">f\"note_{i}\"</span>\
      \ <span class=\"kw\">for</span> i <span class=\"kw\">in</span> <span class=\"\
      fn\">range</span>(<span class=\"fn\">len</span>(NOTES))],\n        metadatas=[{<span\
      \ class=\"str\">\"topic\": n[\"topic\"], \"level\": n[\"level\"</span>]} <span\
      \ class=\"kw\">for</span> n <span class=\"kw\">in</span> NOTES]\n    )\n\n<span\
      \ class=\"kw\">def</span> <span class=\"fn\">search</span>(query: str, level:\
      \ str = <span class=\"kw\">None</span>, k: int = <span class=\"num\">5</span>):\n\
