  quizzes:
  - num_str: Q1 OF 5
    question: What is the key structural difference between the Anthropic Messages
      API and the OpenAI Chat Completions API?
    qid: q102_1
    options:
    - letter: A
      text: Anthropic uses XML, OpenAI uses JSON
      is_correct: false
    - letter: B
      text: In Anthropic's API, the system message is a top-level parameter, not inside
        the messages array
      is_correct: true
    - letter: C
      text: Anthropic doesn't support multi-turn conversations
      is_correct: false
    - letter: D
      text: OpenAI supports streaming but Anthropic does not
      is_correct: false
    correct_fb: "✅ Correct! In Anthropic's API:\n        \n         client.messages.create(model=...,\
      \ system=\"...\", messages=[...])\n        \n        — system is a separate\
      \ top-level param. In OpenAI: system goes inside messages[] as {\"role\":\"\
      system\", \"content\":\"...\"}."
    wrong_fb: "❌ The key difference: Anthropic places the system instruction as a\
      \ top-level\n        \n         system\n        \n        parameter, not inside\
      \ the messages array. Both APIs support multi-turn conversations and streaming."
  - num_str: Q2 OF 5
    question: You're processing 10,000 documents overnight — no user is watching.
      Should you use streaming?
    qid: q102_2
    options:
    - letter: A
      text: Yes — always use streaming for maximum performance
      is_correct: false
    - letter: B
      text: No — streaming is for improving perceived latency in interactive UIs.
        For batch processing, use standard async calls which simplify code and don't
        complicate token counting
      is_correct: true
    - letter: C
      text: Yes — streaming reduces total API cost
      is_correct: false
    - letter: D
      text: No — streaming is not supported for gpt-4o models
      is_correct: false
    correct_fb: ✅ Correct! Streaming adds UX value when a human is watching. For batch
      jobs, non-streaming calls are simpler (you get usage stats directly, no need
      to count tokens manually) and easier to debug.
    wrong_fb: ❌ Streaming doesn't change cost or raw throughput. It improves perceived
      latency for human users. For overnight batch processing with no user watching,
      standard async calls are simpler and preferred.
  - num_str: Q3 OF 5
    question: You receive a 429 RateLimitError from OpenAI. What is the correct immediate
      response in production code?
    qid: q102_3
    options:
    - letter: A
      text: Immediately retry the same request
      is_correct: false
    - letter: B
      text: Switch to a different model permanently
      is_correct: false
    - letter: C
      text: Wait with exponential backoff (1s, 2s, 4s...) and retry up to N attempts,
        respecting the Retry-After header if present
      is_correct: true
    - letter: D
      text: Throw an exception and terminate the entire batch job
      is_correct: false
    correct_fb: ✅ Exactly. Exponential backoff prevents thundering herd (all retries
      hitting at once). Check the Retry-After header in the response for the server's
      suggested wait time. Libraries like tenacity handle this automatically.
    wrong_fb: ❌ Immediate retry makes the problem worse (you'll get rate-limited again
      immediately). Exponential backoff with jitter is the standard strategy — wait
      1s, 2s, 4s... with randomization to prevent synchronized retries.
  - num_str: Q4 OF 5
    question: "What advantage does OpenAI Structured Outputs (with Pydantic schema)\
      \ have over JSON mode (\n        \n         response_format={\"type\":\"json_object\"\
      }\n        \n        )?"
    qid: q102_4
    options:
    - letter: A
      text: Structured Outputs guarantees the JSON matches your exact schema (keys,
        types, required fields), while JSON mode only guarantees syntactically valid
        JSON
      is_correct: true
    - letter: B
      text: JSON mode is always faster than Structured Outputs
      is_correct: false
    - letter: C
      text: They are identical — both guarantee schema compliance
      is_correct: false
    - letter: D
      text: Structured Outputs only works with gpt-4o, not gpt-4o-mini
      is_correct: false
    correct_fb: ✅ Perfect. JSON mode → valid JSON, but might have wrong keys or types.
      Structured Outputs → valid JSON that exactly matches your Pydantic schema (correct
      keys, correct types, no missing required fields). No json.loads() needed — you
      get a typed object directly.
    wrong_fb: "❌ JSON mode just guarantees parseable JSON. Structured Outputs actually\
      \ enforces your schema — if you define\n        \n         score: int\n    \
      \    \n        , you'll get an integer, not a string. The parsed output is already\
      \ a typed Pydantic object."
  - num_str: Q5 OF 5
    question: Using gpt-4o-mini pricing ($0.15/1M input, $0.60/1M output), what is
      the approximate cost of 1000 API calls each with 800 input tokens and 300 output
      tokens?
    qid: q102_5
    options:
    - letter: A
      text: $15.00
      is_correct: false
    - letter: B
      text: $1.50
      is_correct: false
    - letter: C
      text: ~$0.30 (800K input tokens × $0.15 + 300K output tokens × $0.60, all divided
        by 1M)
      is_correct: true
    - letter: D
      text: $0.003
      is_correct: false
    correct_fb: ✅ Correct! (800,000 × 0.15/1,000,000) + (300,000 × 0.60/1,000,000)
      = $0.12 + $0.18 = $0.30. gpt-4o-mini is extremely cheap — 1000 real-world API
      calls cost about 30 cents!
    wrong_fb: '❌ Calculate: 1000 calls × 800 tokens = 800,000 input tokens; 1000 ×
      300 = 300,000 output. Cost = (800K × 0.15 + 300K × 0.60) / 1,000,000 = (120
      + 180) / 1,000,000 × 1,000,000 = $0.12 + $0.18 = $0.30.'
