- id: 105
  day_num: 105
  title: Advanced RAG — Beyond Naive Retrieval
  subtitle: Naive RAG mein ek simple semantic search se document dhundh ke LLM ko dete hain — aur production mein fail ho jaata hai. Advanced RAG mein chunking strategy, hybrid search, cross-encoder reranking, aur RAGAS evaluation — ye sab milke ek production-grade system banate hain.
