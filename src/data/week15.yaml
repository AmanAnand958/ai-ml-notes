  flashcards:
  - front: What is an agentic workflow?
    back: A system design where LLMs are wrapped in iterative loops and conditional branches to act as decision-makers, rather than simple single-turn text generators.
  - front: Why is debugging agentic systems difficult?
    back: Because the execution path is non-deterministic and depends on intermediate LLM outputs, making tracing and logging tools essential.
  - front: What is the benefit of a multi-agent system over a single agent?
    back: Dividing a complex task among specialized agents (e.g., researcher, writer, editor) reduces prompt complexity and improves reliability.
  - front: What is human-in-the-loop (HITL) inside agentic systems?
    back: A checkpoint where the agent pauses and waits for user approval or feedback before executing a critical tool (like sending an email or running a transaction).
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Capstone — Agentic Systems in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
