      \         </p>\n<ul class=\"prose-list\">\n<li>\n           Store in ChromaDB\
      \ with metadata: topic, date, difficulty_level\n          </li>\n<li>\n    \
      \       Natural language search: \"explain vanishing gradients\" finds relevant\
      \ notes even if exact words don't match\n          </li>\n<li>\n           Filter\
      \ by metadata: \"show me only beginner-level notes about transformers\"\n  \
      \        </li>\n<li>\n           Show top-5 results with similarity score and\
      \ metadata\n          </li>\n</ul>"
    done_when: ''
    git_cmd: ''
    sol_id: sol-104-2
    solution_title: SOLUTION — ChromaDB Notes Search Engine
    solution_code: "<span class=\"kw\">import</span> chromadb\n<span class=\"kw\"\
      >from</span> chromadb.utils.embedding_functions <span class=\"kw\">import</span>\
      \ SentenceTransformerEmbeddingFunction\n\n<span class=\"cm\"># Sample notes\
      \ (in real use, load from your actual notes files)</span>\nNOTES = [\n    {<span\
      \ class=\"str\">\"text\": \"Backpropagation computes gradients by applying chain\
