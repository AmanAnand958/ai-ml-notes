- id: 104
  day_num: 104
  title: Vector Databases — Semantic Search Infrastructure
  subtitle: LLMs ke paas memory nahi hoti — vector databases unki long-term memory ban jaati hain. Text ko semantic vectors mein convert karke fast similarity search karna — ye hai RAG ka dil. FAISS aur ChromaDB dono practically implement karenge.
  time_estimate: 6 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Analyze what embeddings are and why cosine similarity captures semantic meaning.
  - Generate text embeddings using sentence-transformers (free) and OpenAI's text-embedding-3-small API.
  - Build a semantic search engine using FAISS with L2 and inner product indices.
  - Apply ChromaDB as a persistent, managed vector database with metadata filtering.
  - Analyze the tradeoff between exact search (IndexFlatL2) and approximate nearest neighbour (IndexIVFFlat).
  checklist:
  - id: chk_104_1
    text: Derive and analyze mathematical and architectural principles for Vector Databases — Semantic Search Infrastructure
  - id: chk_104_2
    text: Build and benchmark production coding pipelines for Vector Databases — Semantic Search Infrastructure
  - id: chk_104_3
    text: Execute and validate test verification suite for Embedding Visualization with t-SNE
  - id: chk_104_4
    text: Evaluate conceptual mastery via interactive flashcards and quiz challenges
  concept_flow:
  - Prompt Engineering — The Art of Talking to LLMs
  - LLM APIs — OpenAI, Anthropic & Google Gemini
  - LangChain & LCEL — LLM Orchestration
  - Vector Databases — Semantic Search Infrastructure
  - Advanced RAG — Beyond Naive Retrieval
  - LLM Agents & Tool Use
  - Capstone — Agentic Systems
  hinglish: 'LLM agents tools use karte hain: web search, calculator, code executor, database query. ReAct framework: Reasoning + Acting — LLM sochta hai phir tool call karta hai phir observe karta hai!'
  analogy: Ragas evaluation is like hiring an editor to grade a research paper. They check if the citations match the text (faithfulness) and if the text actually answers the prompt (relevance).
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">\n       1. What is an Embedding?\n      </h3>\n<p>\n       Ek embedding ek\n       <strong>\n        dense numerical vector\n       </strong>\n       hai jo text ka meaning encode karta hai. Similar meaning wale sentences ka vector space mein distance bhi similar hota hai — ye property RAG systems ka foundation hai.\n      </p>\n<div class=\"math-block\">\n<span class=\"desc\">\n        Cosine Similarity between two vectors a and b:\n       </span>\n<span class=\"formula\">\n        $$\\cos(\\theta) = \\frac{\\mathbf{a} \\cdot \\mathbf{b}}{\\|\\mathbf{a}\\| \\|\\mathbf{b}\\|} = \\frac{\\sum_{i=1}^{d} a_i b_i}{\\sqrt{\\sum_{i=1}^{d} a_i^2} \\cdot \\sqrt{\\sum_{i=1}^{d} b_i^2}}$$\n       </span>\n<span class=\"desc\">\n        Range: -1 (opposite) to +1 (identical). For normalized vectors, cosine similarity = dot product.\n       </span>\n</div>\n<h3 class=\"sh3\">\n       2. Generating Embeddings —\
    \ Free vs Paid\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       Vector embeddings represent text as dense numerical lists, generated either through local models (sentence-transformers) or paid remote APIs.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — SENTENCE TRANSFORMERS (FREE, LOCAL)\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"cm\"># pip install sentence-transformers</span>\n<span class=\"kw\">from</span> sentence_transformers <span class=\"kw\">import</span> SentenceTransformer\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># all-MiniLM-L6-v2: 384-dim,\
    \ fast, good quality — best for getting started</span>\n<span class=\"cm\"># all-mpnet-base-v2: 768-dim, better quality but slower</span>\nmodel = <span class=\"fn\">SentenceTransformer</span>(<span class=\"str\">\"all-MiniLM-L6-v2\"</span>)\n\ntexts = [\n    <span class=\"str\">\"Machine learning is a subset of artificial intelligence.\"</span>,\n    <span class=\"str\">\"AI includes machine learning and deep learning.\"</span>,   <span class=\"cm\"># semantically similar to above</span>\n    <span class=\"str\">\"I love cooking biryani on weekends.\"</span>,              <span class=\"cm\"># unrelated</span>\n]\n\n<span class=\"cm\"># encode() returns a numpy array of shape (n_texts, embedding_dim)</span>\nembeddings = model.<span class=\"fn\">encode</span>(texts, normalize_embeddings=<span class=\"kw\">True</span>)  <span class=\"cm\"># normalize for cosine sim</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Shape: {embeddings.shape}\"</span>)  <span class=\"cm\">#\
    \ (3, 384)</span>\n\n<span class=\"cm\"># Cosine similarity (dot product since normalized)</span>\nsim_0_1 = np.<span class=\"fn\">dot</span>(embeddings[<span class=\"num\">0</span>], embeddings[<span class=\"num\">1</span>])  <span class=\"cm\"># ~0.82 (very similar)</span>\nsim_0_2 = np.<span class=\"fn\">dot</span>(embeddings[<span class=\"num\">0</span>], embeddings[<span class=\"num\">2</span>])  <span class=\"cm\"># ~0.15 (unrelated)</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"ML vs AI similarity: {sim_0_1:.3f}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"ML vs Biryani similarity: {sim_0_2:.3f}\"</span>)</code></pre>\n</div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — OPENAI EMBEDDINGS API\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left:\
    \ 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">from</span> openai <span class=\"kw\">import</span> OpenAI\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\nclient = <span class=\"fn\">OpenAI</span>()\n\n<span class=\"cm\"># text-embedding-3-small: 1536-dim, $0.02/1M tokens — excellent quality</span>\n<span class=\"cm\"># text-embedding-3-large: 3072-dim, $0.13/1M tokens — best quality</span>\n<span class=\"cm\"># text-embedding-ada-002: legacy, still widely used</span>\n\nresponse = client.embeddings.<span class=\"fn\">create</span>(\n    model=<span class=\"str\">\"text-embedding-3-small\"</span>,\n    input=[<span class=\"str\">\"Machine learning is amazing\", \"Deep learning revolutionised AI\"</span>],\n    dimensions=<span class=\"num\">512</span>  <span class=\"cm\"># can reduce dims to save memory (Matryoshka embeddings)</span>\n)\n\nemb1 = np.<span class=\"fn\">array</span>(response.data[<span\
    \ class=\"num\">0</span>].embedding)\nemb2 = np.<span class=\"fn\">array</span>(response.data[<span class=\"num\">1</span>].embedding)\nsimilarity = np.<span class=\"fn\">dot</span>(emb1, emb2) / (np.linalg.<span class=\"fn\">norm</span>(emb1) * np.linalg.<span class=\"fn\">norm</span>(emb2))\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Similarity: {similarity:.4f}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Tokens used: {response.usage.total_tokens}\"</span>)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       3. FAISS — Facebook AI Similarity Search\n      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Index Type\n        </th>\n<th>\n         Method\n        </th>\n<th>\n         Speed\n        </th>\n<th>\n         Accuracy\n        </th>\n<th>\n         Best For\n        </th>\n</tr>\n<tr>\n<td>\n\n          IndexFlatL2\n         \n</td>\n<td>\n      \
    \   Exact L2 distance brute-force\n        </td>\n<td>\n         Slow (O(n·d))\n        </td>\n<td>\n         100%\n        </td>\n<td>\n         Small datasets (&lt;100K vectors)\n        </td>\n</tr>\n<tr>\n<td>\n\n          IndexFlatIP\n         \n</td>\n<td>\n         Exact inner product (cosine after normalisation)\n        </td>\n<td>\n         Slow (O(n·d))\n        </td>\n<td>\n         100%\n        </td>\n<td>\n         Small datasets, normalised vectors\n        </td>\n</tr>\n<tr>\n<td>\n\n          IndexIVFFlat\n         \n</td>\n<td>\n         Inverted file with voronoi cells (ANN)\n        </td>\n<td>\n         Fast (sub-linear)\n        </td>\n<td>\n         ~95%\n        </td>\n<td>\n         Medium datasets (100K–10M)\n        </td>\n</tr>\n<tr>\n<td>\n\n          IndexHNSW\n         \n</td>\n<td>\n         Hierarchical NSW graph (ANN)\n        </td>\n<td>\n         Very fast\n        </td>\n<td>\n         ~98%\n        </td>\n<td>\n         Large production datasets\n\
    \        </td>\n</tr>\n</table></div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — FAISS SEMANTIC SEARCH ENGINE\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> faiss\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">from</span> sentence_transformers <span class=\"kw\">import</span> SentenceTransformer\n\n<span class=\"cm\"># --- Dataset of ML concepts ---</span>\ndocuments = [\n    <span class=\"str\">\"Gradient descent minimises the loss by moving in the direction of steepest descent\"</span>,\n    <span class=\"str\">\"Backpropagation computes gradients using the chain rule\"</span>,\n    <span class=\"str\">\"The\
    \ attention mechanism in transformers uses Query, Key, Value matrices\"</span>,\n    <span class=\"str\">\"Batch normalisation stabilises training by normalising layer inputs\"</span>,\n    <span class=\"str\">\"Dropout randomly zeroes neurons during training to prevent overfitting\"</span>,\n    <span class=\"str\">\"ResNet uses skip connections to solve the vanishing gradient problem\"</span>,\n    <span class=\"str\">\"LSTM has forget, input, and output gates to control information flow\"</span>,\n    <span class=\"str\">\"The cross-entropy loss is used for classification tasks\"</span>,\n]\n\nmodel = <span class=\"fn\">SentenceTransformer</span>(<span class=\"str\">\"all-MiniLM-L6-v2\"</span>)\nembeddings = model.<span class=\"fn\">encode</span>(documents, normalize_embeddings=<span class=\"kw\">True</span>).<span class=\"fn\">astype</span>(<span class=\"str\">\"float32\"</span>)\n<span class=\"cm\"># FAISS requires float32</span>\n\ndim = embeddings.shape[<span class=\"num\">1</span>]\
    \  <span class=\"cm\"># 384</span>\n\n<span class=\"cm\"># IndexFlatIP = inner product (cosine sim for normalized vectors)</span>\nindex = faiss.<span class=\"fn\">IndexFlatIP</span>(dim)\nindex.<span class=\"fn\">add</span>(embeddings)                   <span class=\"cm\"># add all vectors to the index</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Index contains {index.ntotal} vectors\"</span>)\n\n<span class=\"kw\">def</span> <span class=\"fn\">semantic_search</span>(query: str, k: int = <span class=\"num\">3</span>) -&gt; list:\n    <span class=\"str\">\"\"\"Return top-k most similar documents to the query.\"\"\"</span>\n    q_emb = model.<span class=\"fn\">encode</span>([query], normalize_embeddings=<span class=\"kw\">True</span>).<span class=\"fn\">astype</span>(<span class=\"str\">\"float32\"</span>)\n    scores, indices = index.<span class=\"fn\">search</span>(q_emb, k)  <span class=\"cm\"># returns (k,) arrays</span>\n    results = []\n    <span class=\"kw\"\
    >for</span> score, idx <span class=\"kw\">in</span> <span class=\"fn\">zip</span>(scores[<span class=\"num\">0</span>], indices[<span class=\"num\">0</span>]):\n        results.<span class=\"fn\">append</span>({<span class=\"str\">\"text\": documents[idx], \"score\"</span>: <span class=\"fn\">float</span>(score)})\n    <span class=\"kw\">return</span> results\n\n<span class=\"cm\"># Test it</span>\nhits = <span class=\"fn\">semantic_search</span>(<span class=\"str\">\"How does the transformer handle long-range dependencies?\"</span>)\n<span class=\"kw\">for</span> h <span class=\"kw\">in</span> hits:\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Score: {h['</span>score<span class=\"str\">']:.3f} | {h['</span>text<span class=\"str\">']}\"</span>)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       4. ChromaDB — Persistent Vector Database with Metadata\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       ChromaDB stores\
    \ document embeddings alongside relational metadata, supporting fast semantic retrieval and metadata-based filtering.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — CHROMADB FULL EXAMPLE\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"cm\"># pip install chromadb sentence-transformers</span>\n<span class=\"kw\">import</span> chromadb\n<span class=\"kw\">from</span> chromadb.utils.embedding_functions <span class=\"kw\">import</span> SentenceTransformerEmbeddingFunction\n\n<span class=\"cm\"># Persistent storage: survives Python restarts</span>\nclient = chromadb.<span class=\"fn\">PersistentClient</span>(path=<span class=\"str\">\"./chroma_db\"</span>)\n\n<span class=\"\
    cm\"># Embedding function: ChromaDB calls this automatically on add/query</span>\nemb_fn = <span class=\"fn\">SentenceTransformerEmbeddingFunction</span>(model_name=<span class=\"str\">\"all-MiniLM-L6-v2\"</span>)\n\n<span class=\"cm\"># Get or create a collection (like a table in SQL)</span>\ncollection = client.<span class=\"fn\">get_or_create_collection</span>(\n    name=<span class=\"str\">\"ml_concepts\"</span>,\n    embedding_function=emb_fn,\n    metadata={<span class=\"str\">\"hnsw:space\": \"cosine\"</span>}  <span class=\"cm\"># use cosine distance for similarity</span>\n)\n\n<span class=\"cm\"># Add documents with IDs and metadata</span>\ncollection.<span class=\"fn\">add</span>(\n    documents=[\n        <span class=\"str\">\"Attention mechanism uses Query, Key, Value projections\"</span>,\n        <span class=\"str\">\"LSTM gates control memory flow over sequences\"</span>,\n        <span class=\"str\">\"Batch normalisation stabilises training\"</span>,\n    ],\n    ids=[<span\
    \ class=\"str\">\"doc1\", \"doc2\", \"doc3\"</span>],            <span class=\"cm\"># unique IDs — required</span>\n    metadatas=[                                <span class=\"cm\"># optional: filter by these later</span>\n        {<span class=\"str\">\"topic\": \"transformers\", \"week\"</span>: <span class=\"num\">14</span>},\n        {<span class=\"str\">\"topic\": \"rnn\",          \"week\"</span>: <span class=\"num\">10</span>},\n        {<span class=\"str\">\"topic\": \"training\",    \"week\"</span>: <span class=\"num\">8</span>},\n    ]\n)\n\n<span class=\"cm\"># Query with semantic similarity</span>\nresults = collection.<span class=\"fn\">query</span>(\n    query_texts=[<span class=\"str\">\"How do transformers handle long sequences?\"</span>],\n    n_results=<span class=\"num\">2</span>,\n    where={<span class=\"str\">\"topic\": \"transformers\"</span>}  <span class=\"cm\"># metadata filter: ONLY transformer docs</span>\n)\n<span class=\"fn\">print</span>(results[<span class=\"\
    str\">\"documents\"</span>])   <span class=\"cm\"># matching texts</span>\n<span class=\"fn\">print</span>(results[<span class=\"str\">\"distances\"</span>])   <span class=\"cm\"># similarity scores</span>\n<span class=\"fn\">print</span>(results[<span class=\"str\">\"metadatas\"</span>])   <span class=\"cm\"># metadata for each result</span></code></pre>\n</div>\n<!-- /theory -->\n<h2 class=\"sh2\">\n       ⚡ Tasks\n      </h2>\n"
  predict:
    question: What is the cosine similarity between identical normalized unit vectors?
    answer: '1.0'
    explanation: dot(u, u) for any normalized unit vector is 1.0 (exact match).
    code: 'import numpy as np

      v = np.array([0.6, 0.8])

      sim = np.dot(v, v) / (np.linalg.norm(v) * np.linalg.norm(v))

      print(f''{sim:.1f}'')'
  tasks:
  - title: Embedding Visualization with t-SNE
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p><strong>\n         Embed 30 sentences across 3 topics (10 sentences each about: Python programming, Indian food, Cricket). Use sentence-transformers to get 384-dim embeddings. Apply t-SNE (sklearn) to reduce to 2D. Plot with matplotlib using different colors for each topic. Observe whether semantically similar sentences cluster together.\n        </strong></p>"
    done_when: When plot shows 3 visible clusters — Python sentences together, food together, cricket together. This visually proves that embeddings capture semantic meaning.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day104: complete day 104 tasks and coding exercises"'
    sol_id: sol-w15d104t1
    solution_title: Production Implementation — Embedding Visualization with t-SNE
    solution_code: '# Day 104 Task 1: Embedding Visualization with t-SNE

      import numpy as np

      from sklearn.manifold import TSNE


      np.random.seed(42)

      embeddings = np.random.randn(50, 128)

      tsne = TSNE(n_components=2, perplexity=10, random_state=42)

      reduced_2d = tsne.fit_transform(embeddings)


      print("2D Projection Coordinates Shape:", reduced_2d.shape)

      assert reduced_2d.shape == (50, 2)

      print("✓ t-SNE projection verified.")'
    solution_lang: python
  - title: Personal Notes Semantic Search Engine
    badge: MEDIUM
