      \  \n        operator via\n        \n         __or__\n        \n        and\n\
      \        \n         __ror__\n        \n        dunder methods on Runnable objects.\n\
      \        \n         a | b\n        \n        creates a\n        \n         RunnableSequence\n\
      \        \n        where a's output → b's input. This enables the clean pipeline\
      \ syntax."
