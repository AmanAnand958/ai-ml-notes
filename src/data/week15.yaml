    \ class=\"w15t\" fill=\"#4fd1a5\" font-size=\"11\" font-weight=\"700\" x=\"96\"\
    \ y=\"229\">\n        USER\n       </text>\n<text class=\"w15t\" fill=\"#e6edf3\"\
    \ font-size=\"11\" x=\"150\" y=\"229\">\n        What about a circular doubly-linked\
