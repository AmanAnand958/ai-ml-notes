  - front: How is Day 102 structured?
    back: It combines theory, hands-on coding tasks, and quizzes.
  - front: Where does Day 102 fit in Week 15?
    back: It is a key day in Week 15 (LLMs + Generative AI + OpenAI APIs, RAG, Prompt
      Engineering, Vector Databases).
  - front: How does the temperature parameter alter token sampling distributions in
      LLMs?
    back: Lower temperature (T → 0) sharpens logits making outputs deterministic;
      higher temperature (T &gt; 0.7) flattens logits increasing randomness and creativity.
  gotcha:
    title: '⚠️ Gotcha: CUDA Out-of-Memory (OOM) Overhead'
    description: PyTorch allocates memory in cached chunks. Use `torch.cuda.empty_cache()`
      and gradient accumulation when batch sizes hit limits.
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       Fine-tuning\
      \ model internals change karti hai jabki RAG custom knowledge resources data\
      \ search prompts inputs load karta hai."
    bullets:
    - Anthropic's system parameter is top-level, not inside messages[] — this is the
      most common copy-paste bug when switching APIs.
    - Use streaming only for interactive UIs; use standard async calls for batch jobs
      where usage stats are needed.
    - Structured Outputs (Pydantic schema) &gt; JSON mode &gt; unstructured — choose
      based on how much schema strictness you need.
    - Always estimate token costs before running batch experiments — gpt-4o-mini makes
      most experiments extremely affordable.
    - Exponential backoff with tenacity is the industry standard for handling API
      rate limits.
