  tasks:
  - title: API Comparison Table
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p><strong>\n         Write the same prompt to all three APIs (OpenAI gpt-4o-mini, Anthropic claude-haiku-4-5, Gemini 1.5-flash):\n         <em>\n          \"Explain gradient descent in exactly 3 sentences, suitable for a beginner.\"\n         </em>\n</strong></p>\n<p>\n         Record and compare: response quality, latency (use\n         \n          time.time()\n         \n         ), token count, and estimated cost. Build a comparison DataFrame with Pandas. Which is best value for this task?\n        </p>"
    done_when: When a comparison table printed showing all 3 APIs side-by-side with latency, tokens, cost, and a quality rating (your own 1–5 subjective score).
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day102: complete day 102 tasks and coding exercises"'
    sol_id: sol-w15d102t1
    solution_title: ✅ COMPLETE SOLUTION — api_comparison_table.py
    solution_code: "# Day 102 Task 1: Frontier LLM API Parameter Comparison\nclass LLMRequestConfig:\n    def __init__(self, temperature: float = 0.7, top_p: float = 0.95, max_tokens: int = 1024):\n        self.temperature = max(0.0, min(2.0, temperature))\n        self.top_p = max(0.0, min(1.0, top_p))\n        self.max_tokens = max_tokens\n\n    def to_payload(self, model: str, prompt: str) -> dict:\n        return {\n            \"model\": model,\n            \"messages\": [{\"role\": \"user\", \"content\": prompt}],\n            \"temperature\": self.temperature,\n            \"top_p\": self.top_p,\n            \"max_tokens\": self.max_tokens\n        }\n\ncfg = LLMRequestConfig(temperature=0.2, top_p=0.9, max_tokens=512)\npayload = cfg.to_payload(\"gpt-4o\", \"Analyze this code.\")\nprint(\"Generated API Payload:\", payload)\nassert payload[\"temperature\"] == 0.2\nprint(\"✓ LLM configuration builder verified.\")"
    solution_lang: python
  - title: Streaming Chat Terminal App
    badge: MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p><strong>\n          Build a terminal-based multi-turn chat application using OpenAI streaming. Requirements:\n         </strong></p>\n<ul class=\"prose-list\">\n<li>\n           Maintain conversation history (last N=10 turns to stay within token limits)\n          </li>\n<li>\n           Stream tokens in real-time using\n           \n            stream=True\n           \n</li>\n<li>\n           Show token count and cumulative cost after each response\n          </li>\n<li>\n           Commands:\n           \n            /clear\n           \n           (reset history),\n           \n            /cost\n           \n           (show session total),\n           \n            /exit\n           \n</li>\n<li>\n           Use\n           \n            tiktoken\n           \n           to count tokens before each API call\n          </li>\n</ul>"
    done_when: When code executes without errors, passes all unit assertions, and prints verified output metrics for Streaming Chat Terminal App.
    git_cmd: 'git add . && git commit -m "feat(day102): implement streaming-chat-terminal-app"'
    sol_id: sol-w15d102t2
    solution_title: SOLUTION — Streaming Chat App
    solution_code: "# Day 102 Task 2: Streaming Chat Response Generator\nimport time\n\ndef simulate_streaming_tokens(text: str):\n    tokens = text.split()\n    for tok in tokens:\n        yield tok + \" \"\n\nstream = simulate_streaming_tokens(\"Transformers compute scaled dot product self-attention over sequences.\")\ncollected = []\nfor chunk in stream:\n    collected.append(chunk)\nfull_text = \"\".join(collected).strip()\nprint(\"Streamed Output:\", full_text)\nassert \"Transformers\" in full_text\nprint(\"✓ Streaming response simulator verified.\")"
    solution_lang: python
  - title: Structured Extraction Pipeline with Batch Processing
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p><strong>\n         Build a production-grade structured extraction pipeline that processes 50 product reviews from a CSV file and extracts: sentiment, key_phrases (list), rating_prediction (1–5), and purchase_intent (bool). Requirements:\n        </strong></p>\n<ul class=\"prose-list\">\n<li>\n          Use OpenAI Structured Outputs with Pydantic for guaranteed schema compliance\n         </li>\n<li>\n          Process in async batches of 10 using\n          \n           asyncio\n          \n          +\n          \n           openai.AsyncOpenAI\n          \n</li>\n<li>\n          Implement exponential backoff retry on rate limits\n         </li>\n<li>\n          Save results to CSV with pandas\n         </li>\n<li>\n          Print total cost, total time, and average latency per request\n         </li>\n</ul>"
    done_when: All 50 reviews processed successfully. Results saved to CSV. Total cost under $0.01. Async processing is demonstrably faster than sequential (measure both).
    git_cmd: 'git add structured_extraction_pipeline_with_batch_processi.py &amp;&amp; git commit -m "feat(day): day102: structured-extraction-pipeline-with-batch-processi"'
    sol_id: sol-w15d102t3
    solution_title: ✅ COMPLETE SOLUTION — structured_extraction_pipeline_with_batc.py
    solution_code: "# Day 102 Task 3: Structured Information Extraction Pipeline\nimport json\n\ndef extract_key_value_pairs(text: str) -> dict:\n    data = {}\n    for line in text.splitlines():\n        if \":\" in line:\n            k, v = line.split(\":\", 1)\n            data[k.strip().lower()] = v.strip()\n    return data\n\nraw = \"\"\"\nModel: Llama-3-70B\nProvider: Meta\nPrecision: FP16\nContext_Window: 8192\n\"\"\"\nparsed = extract_key_value_pairs(raw)\nprint(\"Extracted Metadata:\", parsed)\nassert parsed[\"model\"] == \"Llama-3-70B\"\nassert parsed[\"context_window\"] == \"8192\"\nprint(\"✓ Key-value extraction pipeline verified.\")"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 5
    question: What is the key structural difference between the Anthropic Messages API and the OpenAI Chat Completions API?
    qid: q102_1
    options:
    - letter: A
      text: Anthropic uses XML, OpenAI uses JSON
      is_correct: false
      id: a
    - letter: B
      text: In Anthropic's API, the system message is a top-level parameter, not inside the messages array
      is_correct: true
      id: b
    - letter: C
      text: Anthropic doesn't support multi-turn conversations
      is_correct: false
      id: c
    - letter: D
      text: OpenAI supports streaming but Anthropic does not
      is_correct: false
      id: d
    correct_fb: "✅ Correct! In Anthropic's API:\n        \n         client.messages.create(model=..., system=\"...\", messages=[...])\n        \n        — system is a separate top-level param. In OpenAI: system goes inside messages[] as {\"role\":\"system\", \"content\":\"...\"}."
    wrong_fb: "❌ The key difference: Anthropic places the system instruction as a top-level\n        \n         system\n        \n        parameter, not inside the messages array. Both APIs support multi-turn conversations and streaming."
    correct: b
  - num_str: QUESTION 2 OF 5
    question: You're processing 10,000 documents overnight — no user is watching. Should you use streaming?
    qid: q102_2
    options:
    - letter: A
      text: Yes — always use streaming for maximum performance
      is_correct: false
      id: a
    - letter: B
      text: No — streaming is for improving perceived latency in interactive UIs. For batch processing, use standard async calls ...
      is_correct: true
      id: b
    - letter: C
      text: Yes — streaming reduces total API cost
      is_correct: false
      id: c
    - letter: D
      text: No — streaming is not supported for gpt-4o models
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Streaming adds UX value when a human is watching. For batch jobs, non-streaming calls are simpler (you get usage stats directly, no need to count tokens manually) and easier to debug.
    wrong_fb: ❌ Streaming doesn't change cost or raw throughput. It improves perceived latency for human users. For overnight batch processing with no user watching, standard async calls are simpler and preferred.
    correct: b
  - num_str: QUESTION 3 OF 5
    question: You receive a 429 RateLimitError from OpenAI. What is the correct immediate response in production code?
    qid: q102_3
    options:
    - letter: A
      text: Immediately retry the same request
      is_correct: false
      id: a
    - letter: B
      text: Switch to a different model permanently
      is_correct: false
      id: b
    - letter: C
      text: Wait with exponential backoff (1s, 2s, 4s...) and retry up to N attempts, respecting the Retry-After header if present
      is_correct: true
      id: c
    - letter: D
      text: Throw an exception and terminate the entire batch job
      is_correct: false
      id: d
    correct_fb: ✅ Exactly. Exponential backoff prevents thundering herd (all retries hitting at once). Check the Retry-After header in the response for the server's suggested wait time. Libraries like tenacity handle this automatically.
    wrong_fb: ❌ Immediate retry makes the problem worse (you'll get rate-limited again immediately). Exponential backoff with jitter is the standard strategy — wait 1s, 2s, 4s... with randomization to prevent synchronized retries.
    correct: c
  - num_str: QUESTION 4 OF 5
    question: "What advantage does OpenAI Structured Outputs (with Pydantic schema) have over JSON mode (\n        \n         response_format={\"type\":\"json_object\"}\n        \n        )?"
    qid: q102_4
    options:
    - letter: A
      text: Structured Outputs guarantees the JSON matches your exact schema (keys, types, required fields), while JSON mode only...
      is_correct: true
      id: a
    - letter: B
      text: JSON mode is always faster than Structured Outputs
      is_correct: false
      id: b
    - letter: C
      text: They are identical — both guarantee schema compliance
      is_correct: false
      id: c
    - letter: D
      text: Structured Outputs only works with gpt-4o, not gpt-4o-mini
      is_correct: false
      id: d
    correct_fb: ✅ Perfect. JSON mode → valid JSON, but might have wrong keys or types. Structured Outputs → valid JSON that exactly matches your Pydantic schema (correct keys, correct types, no missing required fields). No json.loads() needed — you get a typed object directly.
    wrong_fb: "❌ JSON mode just guarantees parseable JSON. Structured Outputs actually enforces your schema — if you define\n        \n         score: int\n        \n        , you'll get an integer, not a string. The parsed output is already a typed Pydantic object."
    correct: a
  - num_str: QUESTION 5 OF 5
    question: Using gpt-4o-mini pricing ($0.15/1M input, $0.60/1M output), what is the approximate cost of 1000 API calls each with 800 input tokens and 300 output tokens?
    qid: q102_5
    options:
    - letter: A
      text: $15.00
      is_correct: false
      id: a
    - letter: B
      text: $1.50
      is_correct: false
      id: b
    - letter: C
      text: ~$0.30 (800K input tokens × $0.15 + 300K output tokens × $0.60, all divided by 1M)
      is_correct: true
      id: c
    - letter: D
      text: $0.003
      is_correct: false
      id: d
    correct_fb: ✅ Correct! (800,000 × 0.15/1,000,000) + (300,000 × 0.60/1,000,000) = $0.12 + $0.18 = $0.30. gpt-4o-mini is extremely cheap — 1000 real-world API calls cost about 30 cents!
    wrong_fb: '❌ Calculate: 1000 calls × 800 tokens = 800,000 input tokens; 1000 × 300 = 300,000 output. Cost = (800K × 0.15 + 300K × 0.60) / 1,000,000 = (120 + 180) / 1,000,000 × 1,000,000 = $0.12 + $0.18 = $0.30.'
    correct: c
  flashcards:
  - front: Structured Extraction?
    back: Using function calling or JSON schemas to force LLMs to output valid structured objects.
  - front: How is Day 102 structured?
    back: It combines theory, hands-on coding tasks, and quizzes. This establishes the core invariant in LLM APIs — OpenAI, Anthropic & Google Gemini, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: Where does Day 102 fit in Week 15?
    back: It is a key day in Week 15 (LLMs + Generative AI + OpenAI APIs, RAG, Prompt Engineering, Vector Databases).
  - front: How does the temperature parameter alter token sampling distributions in LLMs (D102)?
    back: Lower temperature (T → 0) sharpens logits making outputs deterministic; higher temperature (T > 0.7) flattens logits increasing randomness and creativity.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling LLM APIs — OpenAI, Anthropic & Google Gemini in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: CUDA Out-of-Memory (OOM) Overhead'
    description: PyTorch allocates memory in cached chunks. Use `torch.cuda.empty_cache()` and gradient accumulation when batch sizes hit limits.
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       Fine-tuning model internals change karti hai jabki RAG custom knowledge resources data search prompts inputs load karta hai."
    bullets:
    - Anthropic's system parameter is top-level, not inside messages[] — this is the most common copy-paste bug when switching APIs.
    - Use streaming only for interactive UIs; use standard async calls for batch jobs where usage stats are needed.
    - Structured Outputs (Pydantic schema) &gt; JSON mode &gt; unstructured — choose based on how much schema strictness you need.
    - Always estimate token costs before running batch experiments — gpt-4o-mini makes most experiments extremely affordable.
    - Exponential backoff with tenacity is the industry standard for handling API rate limits.
