  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">1. What Distinguishes an Agent from an LLM</h3>\n<p>An LLM is <em>reactive</em>: give it a prompt, get a response. An <em>agent</em> is <em>proactive</em>: it perceives the current state, selects an action, executes a tool, observes the result, and repeats until it achieves a goal. The core loop is the <strong>Observe → Think → Act</strong> cycle.</p>\n<div class=\"callout ci\">\n<strong>Agent = LLM + Memory + Tools + Feedback Loop</strong>\n<p>At step $t$: agent observes $(\\text{Goal}, \\text{History}_{1:t})$ → selects action $a_t$ (tool call or final answer) → receives observation $o_t$ → appends $(a_t, o_t)$ to history → repeats. Terminates when goal is met or max steps exceeded.</p>\n</div>\n<h3 class=\"sh3\">2. Agent Architecture Comparison</h3>\n<table class=\"concept-table\">\n<tr><th>Architecture</th><th>Strengths</th><th>Weaknesses</th></tr>\n<tr><td>ReAct (Reason+Act)</td><td>Simple, interpretable,\
    \ trace-friendly</td><td>Sequential only, can loop infinitely</td></tr>\n<tr><td>LangGraph</td><td>Deterministic state machine, parallel branches, checkpointing</td><td>More boilerplate to define graph</td></tr>\n<tr><td>AutoGen</td><td>Multi-agent conversation, role specialisation</td><td>Non-deterministic agent coordination</td></tr>\n<tr><td>CrewAI</td><td>Opinionated role-based crews, easy to define</td><td>Less control over execution flow</td></tr>\n</table>\n<h3 class=\"sh3\">3. LangGraph Stateful Agent — Full Implementation</h3>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\">from langgraph.graph import StateGraph, END\nfrom langgraph.checkpoint.sqlite import SqliteSaver\nfrom langchain_openai import ChatOpenAI\nfrom langchain_core.messages import HumanMessage, ToolMessage\nfrom typing import TypedDict, Annotated,\
    \ List\nimport operator\n\n# ── 1. State: the accumulated conversation history ────────\nclass AgentState(TypedDict):\n    messages: Annotated[List, operator.add]  # Accumulates — never overwritten\n\n# ── 2. Tool definitions ───────────────────────────────────\ndef search_web(query: str) -&gt; str:\n    \"\"\"Search the web and return relevant results.\"\"\"\n    # Production: replace with Tavily or SerpAPI client\n    return f\"[Search results for '{query}']: Found 5 relevant documents about {query}.\"\n\ndef run_python(code: str) -&gt; str:\n    \"\"\"Execute Python code in a secure sandbox.\"\"\"\n    # Production: replace with E2B or Modal sandbox\n    return f\"[Execution output]: Code ran successfully. Result: computed.\"\n\n# ── 3. LLM with tools bound ───────────────────────────────\nllm = ChatOpenAI(model=\"gpt-4o\", temperature=0)\ntools = [search_web, run_python]\nllm_with_tools = llm.bind_tools(tools)\n\n# ── 4. Graph nodes ────────────────────────────────────────\ndef agent_node(state:\
    \ AgentState) -&gt; AgentState:\n    \"\"\"LLM decides: answer directly or call a tool.\"\"\"\n    response = llm_with_tools.invoke(state[\"messages\"])\n    return {\"messages\": [response]}\n\ndef tool_node(state: AgentState) -&gt; AgentState:\n    \"\"\"Execute all tool calls from the last LLM message.\"\"\"\n    results = []\n    for tool_call in state[\"messages\"][-1].tool_calls:\n        fn = {\"search_web\": search_web, \"run_python\": run_python}.get(tool_call[\"name\"])\n        result = fn(**tool_call[\"args\"]) if fn else f\"Unknown tool: {tool_call['name']}\"\n        results.append(ToolMessage(content=result, tool_call_id=tool_call[\"id\"]))\n    return {\"messages\": results}\n\ndef should_continue(state: AgentState) -&gt; str:\n    \"\"\"Route: if LLM called tools → execute them; otherwise → end.\"\"\"\n    last = state[\"messages\"][-1]\n    return \"tools\" if getattr(last, \"tool_calls\", None) else END\n\n# ── 5. Build and compile the graph ────────────────────────\n\
    builder = StateGraph(AgentState)\nbuilder.add_node(\"agent\", agent_node)\nbuilder.add_node(\"tools\", tool_node)\nbuilder.set_entry_point(\"agent\")\nbuilder.add_conditional_edges(\"agent\", should_continue)\nbuilder.add_edge(\"tools\", \"agent\")  # Always loop back after tool execution\n\n# Persistent checkpointing: resume after failure, multi-turn memory\ncheckpointer = SqliteSaver.from_conn_string(\"agent_state.db\")\nagent = builder.compile(checkpointer=checkpointer)\n\n# ── 6. Run with session tracking ──────────────────────────\nconfig = {\"configurable\": {\"thread_id\": \"user-session-001\"}}\nresult = agent.invoke(\n    {\"messages\": [HumanMessage(content=\"Search for vLLM benchmarks and write a Python script to plot them.\")]},\n    config\n)\nprint(\"Final answer:\", result[\"messages\"][-1].content)</code></pre>\n</div>\n<h3 class=\"sh3\">4. Production Agent Safety</h3>\n<div class=\"callout cw\">\n<strong>Agent Guardrails (Non-Negotiable):</strong>\n<ul>\n<li><strong>Max\
    \ steps limit:</strong> Terminate after N iterations (typically 10–15) to prevent infinite loops</li>\n<li><strong>Tool output sanitisation:</strong> Never pass raw web content to LLM without length/injection checks</li>\n<li><strong>Budget tracking:</strong> Monitor token cost per session; kill agent if over threshold</li>\n<li><strong>Human checkpoint:</strong> Pause before irreversible actions (database writes, emails, API mutations)</li>\n<li><strong>Scope restriction:</strong> Use system prompt to explicitly list allowed/forbidden actions</li>\n</ul>\n</div>\n<h3 class=\"sh3\">5. Multi-Agent Systems</h3>\n<p>Complex tasks benefit from specialised agents working in parallel. Common patterns:</p>\n<ul>\n<li><strong>Hierarchical:</strong> Orchestrator agent breaks task → delegates to specialist workers → aggregates results</li>\n<li><strong>Pipeline:</strong> Agent A (research) → Agent B (synthesise) → Agent C (write) → Agent D (review)</li>\n<li><strong>Debate:</strong> Two agents\
    \ argue opposing positions → third agent judges → better accuracy on hard reasoning tasks</li>\n</ul>\n<!-- /theory -->\n<div class=\"predict-block\" style=\"margin: 2rem 0; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem;\">\n<h3 style=\"margin-top: 0; color: var(--accent); font-size: 1.1rem;\">\U0001F52E Predict the Output</h3>\n<p>What is the dimensionality rank of a 2D batch tensor of shape (32, 128)?</p>\n<input class=\"predict-input\" id=\"p107-input\" placeholder=\"Type your prediction here...\"/>\n<button class=\"predict-btn\" onclick=\"checkPredict('p107', '2')\">\n            Check Answer\n          </button>\n<div class=\"predict-result\" id=\"p107-result\"></div>\n<button class=\"solution-toggle\" onclick=\"toggleSolution('pred-d107', this)\" style=\"margin-top: 0.8rem; background: rgba(108,140,255,0.1); color: var(--blue); border: 1px solid var(--blue); padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;\
    \ font-weight: 600;\">\n            \U0001F4A1 Reveal Detailed Code &amp; Explanation\n          </button>\n<div class=\"solution-box\" id=\"pred-d107\">\n<p style=\"margin:0; font-family:var(--font-mono); font-size:13px; color:var(--green); line-height:1.6; white-space:pre-wrap;\">Expected Output: A 2D matrix with batch dimension and feature dimension has a tensor rank/ndim of 2.</p>\n<div class=\"cb\" style=\"margin-top:10px;\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">python</span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">Run</button>\n</div>\n</div>\n<pre>import numpy as np\ntensor = np.zeros((32, 128))\nprint(tensor.ndim)</pre>\n</div>\n</div>\n</div>\n<!-- TASKS SECTION -->\n<h2 class=\"sh2\">\U0001F6E0 Tasks</h2>\n<div class=\"tasks-section\" id=\"tasks-section-107\">\n<div class=\"task-block\">\n<div aria-expanded=\"false\" class=\"task-header\" onclick=\"toggleTask(this)\"\
    \ onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"task-badge tb-med\">MEDIUM</span>\n<span class=\"task-title\">Task 1: Capstone — Agentic Systems Implementation Checkpoint</span>\n<span class=\"task-time\">⏱ 45 mins</span> </div>\n<div class=\"task-body\" style=\"display:none;\">\n<p><strong>\n           Review and execute the complete code walkthrough for Capstone — Agentic Systems. Validate model metrics and verify output tensor shapes.\n          </strong></p>\n<div class=\"done-when\">Done when: When code executes without error, passing all test assertions for task 1: capstone — agentic systems implementation checkpoint.</div>\n<div class=\"git-block\">git add . &amp;&amp; git commit -m \"feat(day107): implement task-1-capstone-agentic-system\"</div>\n<button class=\"solution-toggle\" onclick=\"toggleSolution('sol-w15d107t1')\">\U0001F4A1 Show Complete Solution</button>\n<div class=\"solution-box\" id=\"sol-w15d107t1\"\
    >\n<div class=\"sol-header\">✅ VERIFIED SOLUTION — </div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">python</span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">Run</button>\n<button class=\"run-btn\" onclick=\"openInColab(this)\">⚡ Run on Colab</button>\n</div>\n</div>\n<pre>def validate_checkpoint_day107():\n    \"\"\"Day 107 Prompt Engineering &amp; Few-Shot Evaluation Checkpoint.\"\"\"\n    print(\"Checkpoint Day 107 Verified | Few-Shot Template Formatted.\")\n\nvalidate_checkpoint_day107()</pre>\n</div>\n</div>\n</div>\n</div>\n<div class=\"task-block\">\n<div aria-expanded=\"false\" class=\"task-header\" onclick=\"toggleTask(this)\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"task-badge tb-hard\">HARD</span>\n<span class=\"task-title\">Production Benchmark — Capstone — Agentic Systems</span>\n\
    <span class=\"task-time\">⏱ 45 mins</span> </div>\n<div class=\"task-body\" style=\"display:none;\">\n<p>Write a <strong>production-grade implementation</strong> of <strong>Capstone — Agentic Systems</strong> with full error handling and assertions. Your solution must: (1) implement the core algorithm/workflow for this topic, (2) include input validation, (3) run end-to-end without errors, (4) pass the provided assertions.</p><p><em>See the solution below for a complete reference implementation.</em></p>\n<div class=\"done-when\">Done when: Your Capstone — Agentic Systems implementation runs without errors, all assertions pass, and you can explain each component.</div>\n<div class=\"git-block\">git add src/day107_benchmark.py &amp;&amp; git commit -m \"feat(day107): production benchmark — Capstone — Agentic Systems\"</div>\n<button class=\"solution-toggle\" onclick=\"toggleSolution('sol-w15d107t-bench')\">\U0001F4A1 Show Complete Solution</button>\n<div class=\"solution-box\" id=\"sol-w15d107t-bench\"\
    >\n<div class=\"sol-header\">✅ VERIFIED SOLUTION — ✅ Production Implementation — Capstone — Agentic Systems</div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">python</span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">Run</button>\n<button class=\"run-btn\" onclick=\"openInColab(this)\">⚡ Run on Colab</button>\n</div>\n</div>\n<pre># Day 107 Task 2: Production Benchmark — Capstone Agentic RAG\nfrom typing import Dict, List, Any\nimport numpy as np\n\nclass AgenticRAGRouter:\n    def __init__(self, vector_docs: List[str]):\n        self.docs = vector_docs\n\n    def route_and_retrieve(self, query: str) -&gt; Dict[str, Any]:\n        words = set(query.lower().split())\n        matched = [d for d in self.docs if any(w in d.lower() for w in words)]\n        return {\n            \"query\": query,\n            \"retrieved_count\": len(matched),\n            \"documents\"\
    : matched[:3],\n            \"action\": \"SYNTHESIZE\" if matched else \"FALLBACK_SEARCH\"\n        }\n\ncorpus = [\"Vector embeddings in Qdrant\", \"FastAPI serving endpoints\", \"LangGraph state management\"]\nrouter = AgenticRAGRouter(corpus)\nres = router.route_and_retrieve(\"FastAPI endpoints\")\nprint(\"Agentic RAG Router Output:\", res)\nassert res[\"action\"] == \"SYNTHESIZE\"\nprint(\"✓ Agentic RAG capstone benchmark verified.\")</pre>\n</div>\n</div>\n</div>\n</div>\n</div>\n<!-- QUIZZES -->\n<h2 class=\"sh2\">\U0001F9EA Quiz</h2>\n<div class=\"quiz-section\" id=\"quiz-section-107\">\n<div class=\"quiz-block\" id=\"quiz-block-107-1\">\n<div class=\"quiz-num\">QUESTION 1 OF 4</div>\n<div class=\"quiz-q\">Why do LangChain agents use tools and ReAct loops?</div>\n<div class=\"quiz-opts\">\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'correct', 'q107_1')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"quiz-letter\"\
    >A</span>\n                ATo dynamically fetch live data, execute code, and perform actions beyond static knowledge cutoffs\n              </div>\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'wrong', 'q107_1')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"quiz-letter\">B</span>\n                BTo train neural weights with backpropagation gradient updates\n              </div>\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'wrong', 'q107_1')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"quiz-letter\">C</span>\n                CTo cache client-side predictions in local browser storage\n              </div>\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'wrong', 'q107_1')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"quiz-letter\">D</span>\n                Apply Dropout before\
    \ Batch Normalization with learning rate &gt; 1.0\n              </div>\n</div>\n<div class=\"quiz-feedback correct-fb\" id=\"q107_1-correct\">\n              ✅ Correct! ReAct loops allow LLMs to query live APIs, execute calculators/code, and interact with external systems to bypass static pretraining cutoffs.\n            </div>\n<div class=\"quiz-feedback wrong-fb\" id=\"q107_1-wrong\">\n              ❌ Incorrect. ReAct agents are inference-time reasoning architectures that invoke external tools, not training loops or browser caches.\n            </div>\n</div>\n<div class=\"quiz-block\" id=\"quiz-block-107-2\">\n<div class=\"quiz-num\">QUESTION 2 OF 4</div>\n<div class=\"quiz-q\">How should edge-case input anomalies and boundary exceptions be handled when implementing Capstone — Agentic Systems?</div>\n<div class=\"quiz-opts\">\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'correct', 'q107_2')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"\
    0\">\n<span class=\"quiz-letter\">A</span>\n                Implement explicit try-except assertion blocks with structured error logging.\n              </div>\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'wrong', 'q107_2')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"quiz-letter\">B</span>\n                Suppress all exceptions silently to prevent process interruptions.\n              </div>\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'wrong', 'q107_2')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"quiz-letter\">C</span>\n                Terminate the operating system kernel immediately upon any warning.\n              </div>\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'wrong', 'q107_2')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"quiz-letter\">D</span>\n           \
    \     Discard the entire dataset batch whenever a single missing value is observed.\n              </div>\n</div>\n<div class=\"quiz-feedback correct-fb\" id=\"q107_2-correct\">\n              ✅ Correct! Explicit exception handling with structured telemetry prevents cascading failures in production pipelines.\n            </div>\n<div class=\"quiz-feedback wrong-fb\" id=\"q107_2-wrong\">\n              ❌ Incorrect. Suppressing errors or discarding entire datasets leads to silent data corruption or extreme data loss.\n            </div>\n</div>\n<div class=\"quiz-block\" id=\"quiz-block-107-3\">\n<div class=\"quiz-num\">QUESTION 3 OF 4</div>\n<div class=\"quiz-q\">What is the primary computational complexity or memory trade-off associated with Capstone — Agentic Systems?</div>\n<div class=\"quiz-opts\">\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'correct', 'q107_3')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"\
    quiz-letter\">A</span>\n                Memory consumption scales with state footprint; optimized structures reduce cache misses.\n              </div>\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'wrong', 'q107_3')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"quiz-letter\">B</span>\n                Execution time is strictly constant regardless of input dimensions or algorithm depth.\n              </div>\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'wrong', 'q107_3')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"quiz-letter\">C</span>\n                Vector operations require zero CPU or GPU RAM allocation.\n              </div>\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'wrong', 'q107_3')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"quiz-letter\">D</span>\n         \
    \       Parallel thread execution eliminates all memory overhead permanently.\n              </div>\n</div>\n<div class=\"quiz-feedback correct-fb\" id=\"q107_3-correct\">\n              ✅ Correct! Understanding spatial and temporal complexity bounds enables optimal hardware provisioning.\n            </div>\n<div class=\"quiz-feedback wrong-fb\" id=\"q107_3-wrong\">\n              ❌ Incorrect. No real-world algorithm achieves zero memory allocation or constant time across infinite dimensions.\n            </div>\n</div>\n<div class=\"quiz-block\" id=\"quiz-block-107-4\">\n<div class=\"quiz-num\">QUESTION 4 OF 4</div>\n<div class=\"quiz-q\">When preparing Capstone — Agentic Systems for production deployment, which verification gate is mandatory?</div>\n<div class=\"quiz-opts\">\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'correct', 'q107_4')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"quiz-letter\">A</span>\n \
    \               Automated CI/CD integration testing, load profiling, and latency SLA verification.\n              </div>\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'wrong', 'q107_4')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"quiz-letter\">B</span>\n                Manual visual inspection without automated validation suites.\n              </div>\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'wrong', 'q107_4')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"quiz-letter\">C</span>\n                Direct deployment to production clusters without staging verification.\n              </div>\n<div class=\"quiz-opt\" onclick=\"quiz(this, 'wrong', 'q107_4')\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" tabindex=\"0\">\n<span class=\"quiz-letter\">D</span>\n                Disabling health probes and monitoring\
    \ dashboards.\n              </div>\n</div>\n<div class=\"quiz-feedback correct-fb\" id=\"q107_4-correct\">\n              ✅ Correct! Automated testing and SLA latency profiling are required before production promotion.\n            </div>\n<div class=\"quiz-feedback wrong-fb\" id=\"q107_4-wrong\">\n              ❌ Incorrect. Direct unverified deployments or disabling telemetry violates production reliability standards.\n            </div>\n</div>\n</div>\n<!-- REVISION FLASHCARDS -->\n<h2 class=\"sh2\">\U0001F0CF Revision Flashcards — Day 107</h2>\n<p class=\"flashcard-hint\">CLICK EACH CARD TO FLIP ↓</p>\n<div class=\"flashcard-grid\">\n<div class=\"flashcard\" onclick=\"this.classList.toggle('flipped')\" onkeydown=\"if(event.key==='Enter')this.classList.toggle('flipped')\" role=\"button\" tabindex=\"0\">\n<div class=\"fc-inner\">\n<div class=\"fc-front\">What is an agentic workflow?</div>\n<div class=\"fc-back\">A system design where LLMs are wrapped in iterative loops and conditional\
    \ branches to act as decision-makers, rather than simple single-turn text generators.</div>\n</div>\n</div>\n<div class=\"flashcard\" onclick=\"this.classList.toggle('flipped')\" onkeydown=\"if(event.key==='Enter')this.classList.toggle('flipped')\" role=\"button\" tabindex=\"0\">\n<div class=\"fc-inner\">\n<div class=\"fc-front\">Why is debugging agentic systems difficult?</div>\n<div class=\"fc-back\">Because the execution path is non-deterministic and depends on intermediate LLM outputs, making tracing and logging tools essential.</div>\n</div>\n</div>\n<div class=\"flashcard\" onclick=\"this.classList.toggle('flipped')\" onkeydown=\"if(event.key==='Enter')this.classList.toggle('flipped')\" role=\"button\" tabindex=\"0\">\n<div class=\"fc-inner\">\n<div class=\"fc-front\">What is the benefit of a multi-agent system over a single agent?</div>\n<div class=\"fc-back\">Dividing a complex task among specialized agents (e.g., researcher, writer, editor) reduces prompt complexity and improves\
    \ reliability.</div>\n</div>\n</div>\n<div class=\"flashcard\" onclick=\"this.classList.toggle('flipped')\" onkeydown=\"if(event.key==='Enter')this.classList.toggle('flipped')\" role=\"button\" tabindex=\"0\">\n<div class=\"fc-inner\">\n<div class=\"fc-front\">What is human-in-the-loop (HITL) inside agentic systems?</div>\n<div class=\"fc-back\">A checkpoint where the agent pauses and waits for user approval or feedback before executing a critical tool (like sending an email or running a transaction).</div>\n</div>\n</div>\n<div class=\"flashcard\" onclick=\"this.classList.toggle('flipped')\" onkeydown=\"if(event.key==='Enter')this.classList.toggle('flipped')\" role=\"button\" tabindex=\"0\">\n<div class=\"fc-inner\">\n<div class=\"fc-front\">Senior Interview Deep Dive: What trade-off occurs when scaling Capstone — Agentic Systems in distributed systems?</div>\n<div class=\"fc-back\">Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of\
    \ computation and communication (ZeRO / DDP Ring-AllReduce).</div>\n</div>\n</div>\n</div>\n<!-- GOTCHAS -->\n<div class=\"gotcha-box\">\n<strong>⚠️ Gotcha: CUDA Out-of-Memory (OOM) Overhead</strong>\n<p style=\"margin-top:0.4rem; margin-bottom:0;\">PyTorch allocates memory in cached chunks. Use `torch.cuda.empty_cache()` and gradient accumulation when batch sizes hit limits.</p>\n</div>\n<!-- KEY TAKEAWAYS -->\n<div class=\"takeaways\">\n<h3>✅ Key Takeaways</h3>\n<div class=\"hinglish\">\n            \U0001F4E2 <strong>Ek line mein:</strong> Production mein Capstone — Agentic Systems ko use karte waqt edge cases aur mathematical constraints ko pehle validate karo, taaki downstream deployment bilkul rock-solid rahe!\n          </div>\n<ul>\n<li>Mastered key architectural patterns and practical implementations of Day 107.</li>\n<li>Master the core mathematical and algorithmic foundations of Capstone — Agentic Systems in production.</li>\n<li>Always profile memory footprint, latency bottlenecks,\
    \ and numerical edge cases for Capstone — Agentic Systems.</li>\n<li>Integrate end-to-end tests into your CI pipeline and track model quality metrics across every experiment run.</li>\n</ul>\n</div>\n<!-- RESOURCES SECTION -->\n<div class=\"resources-section\" id=\"day-107-resources-section\">\n<h2 class=\"sh2\">\U0001F4DA Resources</h2>\n<div class=\"res-grid\">\n<a class=\"resource-card\" href=\"https://platform.openai.com/docs/guides/prompt-engineering\" rel=\"noopener\" target=\"_blank\">\n<div class=\"rc-type\">REFERENCE</div>\n<div class=\"rc-title\">OpenAI Prompt Engineering Best Practices Guide</div>\n<div class=\"rc-sub\"></div>\n</a>\n<a class=\"resource-card\" href=\"https://github.com/facebookresearch/faiss\" rel=\"noopener\" target=\"_blank\">\n<div class=\"rc-type\">REFERENCE</div>\n<div class=\"rc-title\">FAISS: A Library for Efficient Similarity Search (Meta AI)</div>\n<div class=\"rc-sub\"></div>\n</a>\n<a class=\"resource-card\" href=\"https://docs.pinecone.io/\" rel=\"\
