  hinglish: "\U0001F4E2\n       <strong>\n        Ek line mein:\n       </strong>\n       Ragas evaluation framework retrieval precision, faithfulness aur answer relevance parameters ko check karke RAG pipeline ke hallucinations ko spot karta hai."
  analogy: AI agents are like smart customer support executives who have access to a calculator, search engine, and booking database. They don't just answer questions; they think, use the calculator, search the web, and book tickets on your behalf. (This mirrors how Advanced fundamentally operates.)
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">\n       1. The RAG Pipeline — Naive vs Advanced\n      </h3>\n<div class=\"mermaid\">\ngraph TD\n  A[\"\U0001F4C4 Document\"] --&gt; B[\"Split into Chunks\"]\n  B --&gt; C[\"Embed Chunks\"]\n  C --&gt; D[\"Store in Vector DB\"]\n  E[\"❓ User Query\"] --&gt; F[\"Embed Query\"]\n  F --&gt; G[\"Semantic Search Top-K\"]\n  D --&gt; G\n  G --&gt; H[\"Reranker\"]\n  H --&gt; I[\"LLM + Context\"]\n  I --&gt; J[\"✅ Answer\"]\nstyle A fill:#1c2030,stroke:#38bdf8,color:#dde2f0\nstyle J fill:#1c2030,stroke:#4fd1a5,color:#dde2f0\nstyle H fill:#1c2030,stroke:#f7a94b,color:#dde2f0\n</div>\n<h3 class=\"sh3\">\n       2. Chunking Strategies\n      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Strategy\n        </th>\n<th>\n         How it works\n        </th>\n<th>\n         Best For\n        </th>\n<th>\n        \
    \ Overlap\n        </th>\n</tr>\n<tr>\n<td>\n         Fixed-size\n        </td>\n<td>\n         Split every N characters, no respect for structure\n        </td>\n<td>\n         Never — use recursive instead\n        </td>\n<td>\n         Optional\n        </td>\n</tr>\n<tr>\n<td>\n         Recursive Text Splitter\n        </td>\n<td>\n         Try to split on \\n\\n, then \\n, then \". \", then \" \" — respects natural structure\n        </td>\n<td>\n         General text, articles, README files\n        </td>\n<td>\n         50–200 chars\n        </td>\n</tr>\n<tr>\n<td>\n         Semantic Chunking\n        </td>\n<td>\n         Split when embedding similarity between sentences drops below threshold\n        </td>\n<td>\n         Dense technical documents\n        </td>\n<td>\n         None needed\n        </td>\n</tr>\n<tr>\n<td>\n         Parent-Child\n        </td>\n<td>\n         Store large parent chunks; retrieve small child chunks; return parent to LLM\n        </td>\n<td>\n\
    \         Documents with hierarchical structure\n        </td>\n<td>\n         Built-in\n        </td>\n</tr>\n<tr>\n<td>\n         Document-specific\n        </td>\n<td>\n         Use markdown headers, HTML tags, or PDF section markers\n        </td>\n<td>\n         Structured documents (wikis, legal PDFs)\n        </td>\n<td>\n         Section-level\n        </td>\n</tr>\n</table></div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — RECURSIVE TEXT SPLITTER\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">from</span> typing <span class=\"kw\">import</span> List, Dict\n\n<span class=\"kw\">def</span> <span class=\"fn\">compute_rrf_hybrid_search</span>(\n    bm25_ranks: Dict[str,\
    \ int], \n    vector_ranks: Dict[str, int], \n    k: int = <span class=\"num\">60</span>\n) -&gt; List[Dict]:\n    <span class=\"str\">\"\"\"</span>\n    Reciprocal Rank <span class=\"fn\">Fusion</span> (RRF) <span class=\"kw\">for</span> Combining Sparse BM25 <span class=\"kw\">and</span> Dense Vector Search.\n    Formula: <span class=\"fn\">RRF_Score</span>(d) = <span class=\"num\">1</span>/(k + <span class=\"fn\">rank_bm25</span>(d)) + <span class=\"num\">1</span>/(k + <span class=\"fn\">rank_vec</span>(d))\n    <span class=\"str\">\"\"\"</span>\n    all_doc_ids = <span class=\"fn\">set</span>(bm25_ranks.<span class=\"fn\">keys</span>()).<span class=\"fn\">union</span>(<span class=\"fn\">set</span>(vector_ranks.<span class=\"fn\">keys</span>()))\n    rrf_scores = {}\n    \n    <span class=\"kw\">for</span> doc_id <span class=\"kw\">in</span> all_doc_ids:\n        score = <span class=\"num\">0.0</span>\n        <span class=\"kw\">if</span> doc_id <span class=\"kw\">in</span> bm25_ranks:\n\
    \            score += <span class=\"num\">1.0</span> / (k + bm25_ranks[doc_id])\n        <span class=\"kw\">if</span> doc_id <span class=\"kw\">in</span> vector_ranks:\n            score += <span class=\"num\">1.0</span> / (k + vector_ranks[doc_id])\n        rrf_scores[doc_id] = score\n        \n    ranked = <span class=\"fn\">sorted</span>(rrf_scores.<span class=\"fn\">items</span>(), key=<span class=\"kw\">lambda</span> x: x[<span class=\"num\">1</span>], reverse=<span class=\"kw\">True</span>)\n    <span class=\"kw\">return</span> [{<span class=\"str\">\"doc_id\": doc, \"rrf_score\"</span>: <span class=\"fn\">round</span>(score, <span class=\"num\">5</span>)} <span class=\"kw\">for</span> doc, score <span class=\"kw\">in</span> ranked]\n\n<span class=\"cm\"># Example execution</span>\nbm25_results = {<span class=\"str\">\"doc_101\": 1, \"doc_102\": 2, \"doc_103\"</span>: <span class=\"num\">3</span>}\nvector_results = {<span class=\"str\">\"doc_103\": 1, \"doc_101\": 2, \"doc_104\"\
    </span>: <span class=\"num\">3</span>}\nfused = <span class=\"fn\">compute_rrf_hybrid_search</span>(bm25_results, vector_results, k=<span class=\"num\">60</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Hybrid RRF Ranks:\"</span>, fused)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       3. Hybrid Search — BM25 + Vector Similarity\n      </h3>\n<p>\n       BM25 is the gold standard keyword search (used by Elasticsearch, Solr). It catches\n       <strong>\n        exact keyword matches\n       </strong>\n       that vector search misses. Vector search catches\n       <strong>\n        semantic matches\n       </strong>\n       that BM25 misses. Combined = best of both worlds.\n      </p>\n<div class=\"math-block\">\n<span class=\"desc\">\n        BM25 score for query term t in document d:\n       </span>\n<span class=\"formula\">\n        $$\\text{BM25}(t,d) = \\text{IDF}(t) \\cdot \\frac{f(t,d) \\cdot (k_1 + 1)}{f(t,d) + k_1 \\cdot \\left(1 - b + b \\cdot \\frac{|d|}{\\\
    text{avgdl}}\\right)}$$\n       </span>\n<span class=\"desc\">\n        Where f(t,d) = term frequency, |d| = document length, avgdl = avg doc length, k₁=1.5, b=0.75 are tuning params.\n       </span>\n</div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — HYBRID SEARCH WITH RECIPROCAL RANK FUSION\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">from</span> typing <span class=\"kw\">import</span> List, Dict\n\n<span class=\"kw\">class</span> <span class=\"cls\">CrossEncoderReranker</span>:\n    <span class=\"str\">\"\"\"</span>\n    Cross-Encoder Re-ranker: Performs joint full <span class=\"kw\">self</span>-attention over [CLS] Query [SEP] Document [SEP]\n    to output an uncompressed\
    \ relevance probability score.\n    <span class=\"str\">\"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, model_name: str = <span class=\"str\">\"cross-encoder/ms-marco-MiniLM-L-6-v2\"</span>):\n        <span class=\"kw\">self</span>.model_name = model_name\n\n    <span class=\"kw\">def</span> <span class=\"fn\">predict_relevance</span>(<span class=\"kw\">self</span>, query: str, candidate_docs: List[str]) -&gt; List[Dict]:\n        <span class=\"cm\"># Simulated Cross-Encoder scoring (in production: cross_encoder.predict([[query, d] for d in candidate_docs]))</span>\n        results = []\n        <span class=\"kw\">for</span> idx, doc <span class=\"kw\">in</span> <span class=\"fn\">enumerate</span>(candidate_docs):\n            query_terms = <span class=\"fn\">set</span>(query.<span class=\"fn\">lower</span>().<span class=\"fn\">split</span>())\n            doc_terms = <span class=\"fn\">set</span>(doc.<span class=\"\
    fn\">lower</span>().<span class=\"fn\">split</span>())\n            overlap = <span class=\"fn\">len</span>(query_terms.<span class=\"fn\">intersection</span>(doc_terms)) / <span class=\"fn\">max</span>(<span class=\"num\">1</span>, <span class=\"fn\">len</span>(query_terms))\n            score = <span class=\"num\">1.0</span> / (<span class=\"num\">1.0</span> + np.<span class=\"fn\">exp</span>(- (<span class=\"num\">2.5</span> * overlap - <span class=\"num\">0.5</span>))) <span class=\"cm\"># Sigmoid calibrated score</span>\n            results.<span class=\"fn\">append</span>({<span class=\"str\">\"doc_id\": f\"doc_{idx+1}\", \"text\": doc, \"cross_encoder_score\"</span>: <span class=\"fn\">round</span>(<span class=\"fn\">float</span>(score), <span class=\"num\">4</span>)})\n            \n        ranked = <span class=\"fn\">sorted</span>(results, key=<span class=\"kw\">lambda</span> x: x[<span class=\"str\">\"cross_encoder_score\"</span>], reverse=<span class=\"kw\">True</span>)\n\
    \        <span class=\"kw\">return</span> ranked\n\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\nreranker = <span class=\"fn\">CrossEncoderReranker</span>()\ncandidates = [\n    <span class=\"str\">\"Machine learning neural networks require backpropagation.\"</span>,\n    <span class=\"str\">\"Reciprocal rank fusion combines multiple ranking lists.\"</span>,\n    <span class=\"str\">\"Cross-encoders process query and passage jointly for high accuracy.\"</span>\n]\nranked_candidates = reranker.<span class=\"fn\">predict_relevance</span>(<span class=\"str\">\"What is a cross encoder?\"</span>, candidates)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Cross-Encoder Re-ranked:\"</span>, ranked_candidates)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       4. Cross-Encoder Reranking\n      </h3>\n<p>\n       Bi-encoder (sentence-transformers) mein query aur document separately embed hote hain — fast but approximate.\n       <strong>\n        Cross-encoder\n\
    \       </strong>\n       mein query aur document ko\n       <strong>\n        together\n       </strong>\n       feed kiya jaata hai — much more accurate but slower. Solution: bi-encoder se top-50 retrieve karo, cross-encoder se top-5 mein rerank karo.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — CROSS-ENCODER RERANKER\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core Transformations</span>\n<span class=\"kw\">from</span> typing <span class=\"kw\">import</span> List\n\n<span class=\"kw\">def</span> <span class=\"fn\">fixed_size_chunking</span>(text: str, chunk_size: int = <span class=\"num\">200</span>, chunk_overlap:\
    \ int = <span class=\"num\">40</span>) -&gt; List[str]:\n    <span class=\"str\">\"\"\"Fixed character length chunking with sliding window overlap.\"\"\"</span>\n    chunks = []\n    start = <span class=\"num\">0</span>\n    <span class=\"kw\">while</span> start &lt; <span class=\"fn\">len</span>(text):\n        end = start + chunk_size\n        chunks.<span class=\"fn\">append</span>(text[start:end])\n        start += chunk_size - chunk_overlap\n    <span class=\"kw\">return</span> chunks\n\n<span class=\"kw\">def</span> <span class=\"fn\">recursive_character_chunking</span>(text: str, max_chunk_size: int = <span class=\"num\">200</span>, separators: List[str] = <span class=\"kw\">None</span>) -&gt; List[str]:\n    <span class=\"str\">\"\"\"Recursively splits by double newlines, single newlines, spaces, and characters.\"\"\"</span>\n    <span class=\"kw\">if</span> separators <span class=\"kw\">is</span> <span class=\"kw\">None</span>:\n        separators = [<span class=\"str\">\"\\\
    n\\n\", \"\\n\", \". \", \" \"</span>]\n        \n    paragraphs = text.<span class=\"fn\">split</span>(separators[<span class=\"num\">0</span>])\n    valid_chunks = []\n    current_chunk = <span class=\"str\">\"\"</span>\n    <span class=\"kw\">for</span> para <span class=\"kw\">in</span> paragraphs:\n        <span class=\"kw\">if</span> <span class=\"fn\">len</span>(current_chunk) + <span class=\"fn\">len</span>(para) &lt;= max_chunk_size:\n            current_chunk += (<span class=\"str\">\"\\n\\n\" if current_chunk else \"\"</span>) + para\n        <span class=\"kw\">else</span>:\n            <span class=\"kw\">if</span> current_chunk:\n                valid_chunks.<span class=\"fn\">append</span>(current_chunk)\n            current_chunk = para\n    <span class=\"kw\">if</span> current_chunk:\n        valid_chunks.<span class=\"fn\">append</span>(current_chunk)\n    <span class=\"kw\">return</span> valid_chunks\n\nsample_text = <span class=\"str\">\"\"\"</span>Deep Learning systems\
    \ rely on hierarchical representation learning. \nLower layers capture low-level primitive features such <span class=\"kw\">as</span> edges <span class=\"kw\">and</span> textures. \nIntermediate layers aggregate features into parts <span class=\"kw\">and</span> motifs.\nUpper layers compute high-level task-specific <span class=\"kw\">class</span> <span class=\"cls\">probabilities</span>.<span class=\"str\">\"\"\"</span>\n\nfixed = <span class=\"fn\">fixed_size_chunking</span>(sample_text, chunk_size=<span class=\"num\">120</span>, chunk_overlap=<span class=\"num\">20</span>)\nrecursive = <span class=\"fn\">recursive_character_chunking</span>(sample_text, max_chunk_size=<span class=\"num\">120</span>)\n\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Fixed Chunks ({len(fixed)} chunks):\"</span>, fixed)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\\nRecursive Chunks ({len(recursive)} chunks):\"</span>, recursive)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       5. RAGAS\
    \ — RAG Evaluation Framework\n      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Metric\n        </th>\n<th>\n         Measures\n        </th>\n<th>\n         Range\n        </th>\n<th>\n         Formula Intuition\n        </th>\n</tr>\n<tr>\n<td>\n         Faithfulness\n        </td>\n<td>\n         Is the answer grounded in the retrieved context? (no hallucination)\n        </td>\n<td>\n         0–1\n        </td>\n<td>\n         Claims in answer ÷ claims that can be inferred from context\n        </td>\n</tr>\n<tr>\n<td>\n         Answer Relevancy\n        </td>\n<td>\n         Does the answer address the question?\n        </td>\n<td>\n         0–1\n        </td>\n<td>\n         Cosine sim of generated questions from answer vs original question\n        </td>\n</tr>\n<tr>\n<td>\n         Context Recall\n        </td>\n<td>\n         Did retrieval find all relevant information?\n \
    \       </td>\n<td>\n         0–1\n        </td>\n<td>\n         Ground truth sentences attributable to context ÷ total ground truth sentences\n        </td>\n</tr>\n<tr>\n<td>\n         Context Precision\n        </td>\n<td>\n         Are the retrieved chunks relevant? (no noise)\n        </td>\n<td>\n         0–1\n        </td>\n<td>\n         Relevant chunks in context ÷ total chunks retrieved\n        </td>\n</tr>\n</table></div>\n<!-- /theory -->\n<h2 class=\"sh2\">\n       ⚡ Tasks\n      </h2>\n"
  predict:
    question: What is the cosine similarity between identical normalized unit vectors?
    answer: '1.0'
    explanation: dot(u, u) for any normalized unit vector is 1.0 (exact match).
    code: 'import numpy as np

      v = np.array([0.6, 0.8])

      sim = np.dot(v, v) / (np.linalg.norm(v) * np.linalg.norm(v))

      print(f''{sim:.1f}'')'
  tasks:
  - title: Chunking Strategy Comparison
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p><strong>\n         Take a 5000-word Wikipedia article (download with\n         \n          wikipedia\n         \n         Python library). Apply 3 chunking strategies: (1) fixed-size 200 chars, (2) RecursiveCharacterTextSplitter 512 chars with 64 overlap, (3) Markdown header splitter. For each: print chunk count, min/max/avg chunk length, and visually inspect first 3 chunks. Which strategy preserves the most semantic integrity?\n        </strong></p>"
    done_when: When comparison table showing chunk statistics for all 3 strategies. You can articulate why recursive splitter is superior to fixed-size.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day105: complete day 105 tasks and coding exercises"'
    sol_id: sol-w15d105t1
    solution_title: ✅ COMPLETE SOLUTION — chunking_strategy_comparison.py
    solution_code: "# Day 105 Task 1: Chunking Strategy Benchmarking\ndef compare_chunking(text: str, chunk_size: int = 50, overlap: int = 10) -> dict:\n    words = text.split()\n    chunks = []\n    for i in range(0, len(words), chunk_size - overlap):\n        chunk = \" \".join(words[i:i + chunk_size])\n        if chunk:\n            chunks.append(chunk)\n    return {\"total_words\": len(words), \"num_chunks\": len(chunks), \"avg_chunk_len\": np.mean([len(c.split()) for c in chunks])}\n\nimport numpy as np\nsample_corpus = \" \".join([\"word\" + str(i) for i in range(200)])\nres = compare_chunking(sample_corpus, chunk_size=50, overlap=10)\nprint(\"Chunking Benchmark:\", res)\nassert res[\"num_chunks\"] > 1\nprint(\"✓ Chunking benchmark verified.\")"
    solution_lang: python
  - title: Hybrid Search RAG — PDF Q&A
    badge: MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p><strong>\n          Build a complete hybrid search RAG system for a PDF document (use any PDF — your ML notes, a research paper). Steps:\n         </strong></p>\n<ol class=\"prose-list\">\n<li>\n           Extract text from PDF with\n           \n            pypdf\n           \n</li>\n<li>\n           Chunk with RecursiveCharacterTextSplitter (512 tokens, 50 overlap)\n          </li>\n<li>\n           Build BM25 index + ChromaDB vector index\n          </li>\n<li>\n           Hybrid search with RRF merging\n          </li>\n<li>\n           Cross-encoder reranking on top-10 candidates\n          </li>\n<li>\n           Pass top-3 reranked chunks as context to GPT-4o-mini\n          </li>\n<li>\n           Compare: pure vector search vs hybrid search on 5 test questions\n          </li>\n</ol>"
    done_when: When code executes without errors, passes all unit assertions, and prints verified output metrics for Hybrid Search RAG — PDF Q&A.
    git_cmd: 'git add . && git commit -m "feat(day105): implement hybrid-search-rag-pdf-q-a"'
    sol_id: sol-w15d105t2
    solution_title: SOLUTION — Architecture Overview
    solution_code: "# Day 105 Task 2: Hybrid Search RAG Retrieval Engine\nimport numpy as np\n\ndef hybrid_rank_fusion(dense_scores: dict, sparse_scores: dict, alpha: float = 0.5) -> dict:\n    all_keys = set(dense_scores.keys()) | set(sparse_scores.keys())\n    combined = {}\n    for k in all_keys:\n        d = dense_scores.get(k, 0.0)\n        s = sparse_scores.get(k, 0.0)\n        combined[k] = alpha * d + (1 - alpha) * s\n    return dict(sorted(combined.items(), key=lambda x: -x[1]))\n\ndense = {\"doc1\": 0.92, \"doc2\": 0.75}\nsparse = {\"doc1\": 0.40, \"doc2\": 0.88}\nfused = hybrid_rank_fusion(dense, sparse, alpha=0.6)\nprint(\"Fused Document Scores:\", fused)\nassert len(fused) == 2\nprint(\"✓ Hybrid rank fusion verified.\")"
    solution_lang: python
  - title: RAGAS Evaluation Pipeline
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p><strong>\n         Evaluate your hybrid RAG system from Task 2 using RAGAS. Create a test dataset of 20 (question, ground_truth_answer, context) triplets from a PDF. Compute: faithfulness, answer_relevancy, context_recall, context_precision. Compare scores between your naive RAG (simple vector search) and advanced RAG (hybrid + reranking).\n        </strong></p>"
    done_when: When rAGAS evaluation table showing all 4 metrics for both naive and advanced RAG. Advanced RAG scores higher on at least 3 metrics.
    git_cmd: 'git add ragas_evaluation_pipeline.py &amp;&amp; git commit -m "feat(day): day105: ragas-evaluation-pipeline"'
    sol_id: sol-w15d105t3
    solution_title: ✅ COMPLETE SOLUTION — ragas_evaluation_pipeline.py
    solution_code: "# Day 105 Task 3: RAGAS Faithfulness & Groundedness Metric\ndef compute_faithfulness(answer_claims: list, retrieved_facts: list) -> float:\n    if not answer_claims: return 1.0\n    supported = 0\n    for claim in answer_claims:\n        if any(fact.lower() in claim.lower() or claim.lower() in fact.lower() for fact in retrieved_facts):\n            supported += 1\n    return float(supported / len(answer_claims))\n\nfacts = [\"Postgres operates on port 5432.\", \"FastAPI uses Pydantic.\"]\nclaims = [\"FastAPI uses Pydantic for validation.\", \"Postgres default port is 5432.\"]\nscore = compute_faithfulness(claims, facts)\nprint(f\"RAGAS Groundedness Score: {score * 100:.1f}%\")\nassert score == 1.0\nprint(\"✓ Faithfulness calculation verified.\")"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 5
    question: A user asks "What did CEO say in Q3 earnings call?" but your vector search returns "Q2 results were strong" (wrong quarter). BM25 returns the correct Q3 document. This is an example of which...?
    qid: q105_1
    options:
    - letter: A
      text: Context window overflow
      is_correct: false
      id: a
    - letter: B
      text: Vocabulary mismatch — "Q3" and "Q2" have similar embeddings (both are earnings-related) but BM25 correctly distinguis...
      is_correct: true
      id: b
    - letter: C
      text: Hallucination by the LLM
      is_correct: false
      id: c
    - letter: D
      text: Insufficient chunk overlap
      is_correct: false
      id: d
    correct_fb: ✅ Exactly. Vector search captures semantic similarity — Q2 and Q3 earnings reports are semantically similar (same domain, same structure). BM25 distinguishes them via exact term matching. This is the primary motivation for hybrid search.
    wrong_fb: ❌ This is a vocabulary mismatch failure. "Q3" and "Q2" are semantically similar (both quarterly earnings) but factually different. BM25 correctly matches exact tokens like "Q3". Hybrid search is the solution.
    correct: b
  - num_str: QUESTION 2 OF 5
    question: In Reciprocal Rank Fusion (RRF), why is the constant k=60 used in the formula $\frac{1}{k + \text{rank}}$?
    qid: q105_2
    options:
    - letter: A
      text: 60 is the maximum number of results any retrieval system can return
      is_correct: false
      id: a
    - letter: B
      text: k prevents very highly-ranked documents from dominating the score — without k, rank=1 gives score=1.0 while rank=2 gi...
      is_correct: true
      id: b
    - letter: C
      text: k=60 was chosen to match the default FAISS nlist parameter
      is_correct: false
      id: c
    - letter: D
      text: It's an arbitrary constant with no theoretical justification
      is_correct: false
      id: d
    correct_fb: '✅ Correct. Without k, 1/1=1.0 vs 1/2=0.5 — a rank-1 document gets 2x the score of rank-2. With k=60: 1/61 vs 1/62 — nearly equal. This smoothing was empirically shown to work well at k=60 in the original RRF paper (Cormack et al., 2009).'
    wrong_fb: ❌ k prevents top-1 documents from completely dominating. With k=60, rank differences of a few positions have much smaller impact on the final score, making the fusion more robust to rank noise.
    correct: b
  - num_str: QUESTION 3 OF 5
    question: What is the key difference between a bi-encoder and a cross-encoder for retrieval?
    qid: q105_3
    options:
    - letter: A
      text: Bi-encoder encodes query and document independently (fast, scalable for large corpora). Cross-encoder processes them ...
      is_correct: true
      id: a
    - letter: B
      text: Bi-encoder is used for short texts, cross-encoder for long documents
      is_correct: false
      id: b
    - letter: C
      text: They are the same architecture but bi-encoder uses 2 GPUs
      is_correct: false
      id: c
    - letter: D
      text: Cross-encoder cannot be used with FAISS
      is_correct: false
      id: d
    correct_fb: '✅ Perfect. Bi-encoder: query → vector, doc → vector (pre-computed), compare at search time. O(1) per query. Cross-encoder: feed [query, doc] together, output relevance score. O(N) per query. Solution: bi-encoder for retrieval (fast), cross-encoder for reranking (accurate on small set).'
    wrong_fb: ❌ Bi-encoder = independent encoding (fast, scalable). Cross-encoder = joint processing with attention between query and document (accurate, but can't pre-compute — must process every query-document pair at query time, making it O(N)).
    correct: a
  - num_str: QUESTION 4 OF 5
    question: Your RAG system has Faithfulness=0.95 but Context_Recall=0.40. What does this tell you?
    qid: q105_4
    options:
    - letter: A
      text: The LLM is hallucinating heavily
      is_correct: false
      id: a
    - letter: B
      text: The LLM stays grounded in what it retrieves (high faithfulness), but retrieval is missing 60% of relevant information...
      is_correct: true
      id: b
    - letter: C
      text: The chunking strategy is creating chunks that are too large
      is_correct: false
      id: c
    - letter: D
      text: The context window is too small
      is_correct: false
      id: d
    correct_fb: '✅ Correct diagnostic. High faithfulness = the LLM doesn''t hallucinate beyond what it retrieves. Low context_recall = retrieval is the bottleneck — it''s finding only 40% of the relevant ground truth. Fix: improve chunking, add hybrid search, or use a better embedding model.'
    wrong_fb: '❌ Faithfulness=0.95 means the LLM is being accurate relative to what it receives — no hallucination issue. Context_Recall=0.40 means retrieval is the problem: only 40% of ground truth info is being found. Improve the retrieval pipeline, not the generation.'
    correct: b
  - num_str: QUESTION 5 OF 5
    question: Why should chunk_overlap be set to 10–15% of chunk_size in RecursiveCharacterTextSplitter?
    qid: q105_5
    options:
    - letter: A
      text: To reduce storage costs by duplicating some text
      is_correct: false
      id: a
    - letter: B
      text: To preserve context at chunk boundaries — an answer that spans two chunks is more likely to be retrievable because bo...
      is_correct: true
      id: b
    - letter: C
      text: To improve BM25 ranking scores by increasing term frequency
      is_correct: false
      id: c
    - letter: D
      text: Overlap is optional and has no practical benefit
      is_correct: false
      id: d
    correct_fb: ✅ Exactly. Without overlap, a sentence that starts in chunk N and ends in chunk N+1 would never be fully retrievable. Overlap ensures that boundary sentences appear in both chunks, so they can be retrieved by either. 10–15% overlap is the empirical sweet spot.
    wrong_fb: ❌ Overlap handles the chunk boundary problem. Without it, sentences that cross chunk boundaries are split and neither chunk contains the complete thought. Overlap ensures boundary content appears in adjacent chunks, making it retrievable.
    correct: b
