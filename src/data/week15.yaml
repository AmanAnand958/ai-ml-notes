- id: '106'
  day_num: 106
  title: LLM Agents & Tool Use
  subtitle: ReAct framework se agents tak — LLMs ko tools de do, phir dekho kaisa
    "autonomous" kaam karte hain. Function calling, tool definitions, AgentExecutor,
    multi-hop reasoning — ye sab milke ek AI agent banaate hain jo real-world actions
    le sakta hai.
  time_estimate: 7 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Define tools using OpenAI function calling JSON schema and Pydantic BaseModel.
  - 'Understand the full ReAct agent loop: Thought → Action → Observation → repeat.'
  - "Build a LangChain agent with custom tools using\n        \n         @tool\n \
    \       \n        decorator."
  - Implement an agent with web search, calculator, and Python REPL tools.
  - 'Handle multi-hop reasoning: the agent breaks a complex question into steps and
    answers each with the right tool.'
  checklist:
  - id: chk_106_1
    text: Study the core mathematical and architectural principles of LLM Agents &
      Tool Use
  - id: chk_106_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_106_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_106_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - Prompt Engineering — The
  - LLM APIs — OpenAI, Anthro
  - LangChain & LCEL — LLM Or
  - Vector Databases — Semant
  - Advanced RAG — Beyond Nai
  - LLM Agents & Tool Use
  - Capstone — Agentic System
  hinglish: 'Constitutional AI: helpful, harmless, honest — ye principles Anthropic
    ke Claude training mein use hote hain. RLHF ke saath red-teaming LLM safety improve
    karta hai!'
  analogy: Building an agentic pipeline is like setting up an automated office assistant.
    You configure the routing rules, register the tools, specify safety parameters,
    and let it run tasks autonomously while keeping audit logs.
  theory_html: "<h3 class=\"sh3\">\n       1. What Makes an Agent Different from a\
    \ Chain?\n      </h3>\n<p>\n       Chain mein execution path\n       <strong>\n\
    \        fixed\n       </strong>\n       hota hai — always step 1 → step 2 → step\
    \ 3. Agent mein execution path\n       <strong>\n        dynamic\n       </strong>\n\
    \       hai — the LLM decides at each step what to do next, which tool to call,\
    \ and when to stop.\n      </p>\n<div class=\"table-wrap\" style=\"overflow-x:\
    \ auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n\
    <th>\n         Property\n        </th>\n<th>\n         Chain\n        </th>\n\
    <th>\n         Agent\n        </th>\n</tr>\n<tr>\n<td>\n         Execution path\n\
    \        </td>\n<td>\n         Fixed, pre-defined\n        </td>\n<td>\n     \
    \    Dynamic, LLM decides\n        </td>\n</tr>\n<tr>\n<td>\n         Tool selection\n\
    \        </td>\n<td>\n         Explicit by developer\n        </td>\n<td>\n  \
    \       LLM chooses which tool and when\n        </td>\n</tr>\n<tr>\n<td>\n  \
    \       Iterations\n        </td>\n<td>\n         Fixed N steps\n        </td>\n\
    <td>\n         Until task complete or max_iterations\n        </td>\n</tr>\n<tr>\n\
    <td>\n         Best for\n        </td>\n<td>\n         Known, structured workflows\n\
    \        </td>\n<td>\n         Open-ended tasks, variable complexity\n       \
    \ </td>\n</tr>\n<tr>\n<td>\n         Risk\n        </td>\n<td>\n         Predictable\n\
    \        </td>\n<td>\n         Can loop infinitely or make wrong tool choices\n\
    \        </td>\n</tr>\n</table></div>\n<h3 class=\"sh3\">\n       2. OpenAI Function\
    \ Calling — Tool Definition\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       Function calling allows developers\
    \ to describe application functions to LLMs, which return structured arguments\
    \ for executing local actions.\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — OPENAI FUNCTION CALLING\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> json, openai,\
    \ math\n\nclient = openai.<span class=\"fn\">OpenAI</span>()\n\n<span class=\"\
    cm\"># --- Define tools as JSON schemas ---</span>\nTOOLS = [\n    {\n       \
    \ <span class=\"str\">\"type\": \"function\"</span>,\n        <span class=\"str\"\
    >\"function\"</span>: {\n            <span class=\"str\">\"name\": \"calculate\"\
    </span>,\n            <span class=\"str\">\"description\": \"Evaluate a mathematical\
    \ expression. Use this for any arithmetic.\"</span>,\n            <span class=\"\
    str\">\"parameters\"</span>: {\n                <span class=\"str\">\"type\":\
    \ \"object\"</span>,\n                <span class=\"str\">\"properties\"</span>:\
    \ {\n                    <span class=\"str\">\"expression\"</span>: {\n      \
    \                  <span class=\"str\">\"type\": \"string\"</span>,\n        \
    \                <span class=\"str\">\"description\": \"Python math expression,\
    \ e.g. '</span><span class=\"num\">2</span> ** <span class=\"num\">10</span><span\
    \ class=\"str\">' or '</span>math.<span class=\"fn\">sqrt</span>(<span class=\"\
    num\">144</span>)<span class=\"str\">'\"</span>\n                    }\n     \
    \           },\n                <span class=\"str\">\"required\": [\"expression\"\
    </span>]\n            }\n        }\n    }\n]\n\n<span class=\"cm\"># --- Tool\
    \ execution function ---</span>\n<span class=\"kw\">def</span> <span class=\"\
    fn\">execute_tool</span>(name: str, args: dict) -&gt; str:\n    <span class=\"\
    kw\">if</span> name == <span class=\"str\">\"calculate\"</span>:\n        <span\
    \ class=\"kw\">try</span>:\n            result = <span class=\"fn\">eval</span>(args[<span\
    \ class=\"str\">\"expression\"], {\"math\": math, \"__builtins__\"</span>: {}})\n\
    \            <span class=\"kw\">return</span> <span class=\"fn\">str</span>(result)\n\
    \        <span class=\"kw\">except</span> Exception <span class=\"kw\">as</span>\
    \ e:\n            <span class=\"kw\">return</span> <span class=\"str\">f\"Error:\
    \ {e}\"</span>\n    <span class=\"kw\">return</span> <span class=\"str\">\"Tool\
    \ not found\"</span>\n\n<span class=\"cm\"># --- Agent loop ---</span>\nmessages\
    \ = [{<span class=\"str\">\"role\": \"user\", \"content\": \"What is 17 raised\
    \ to the power of 5, divided by 1024?\"</span>}]\n\n<span class=\"kw\">while</span>\
    \ <span class=\"kw\">True</span>:\n    response = client.chat.completions.<span\
    \ class=\"fn\">create</span>(\n        model=<span class=\"str\">\"gpt-4o-mini\"\
    , messages=messages, tools=TOOLS, tool_choice=\"auto\"</span>\n    )\n    msg\
    \ = response.choices[<span class=\"num\">0</span>].message\n    messages.<span\
    \ class=\"fn\">append</span>(msg)  <span class=\"cm\"># add assistant message\
    \ to history</span>\n\n    <span class=\"kw\">if</span> msg.tool_calls:\n    \
    \    <span class=\"cm\"># Model wants to call a tool</span>\n        <span class=\"\
    kw\">for</span> tc <span class=\"kw\">in</span> msg.tool_calls:\n            args\
    \   = json.<span class=\"fn\">loads</span>(tc.function.arguments)\n          \
    \  result = <span class=\"fn\">execute_tool</span>(tc.function.name, args)\n \
    \           <span class=\"fn\">print</span>(<span class=\"str\">f\"Tool: {tc.function.name}({args})\
    \ → {result}\"</span>)\n            <span class=\"cm\"># Add tool result back\
    \ to conversation</span>\n            messages.<span class=\"fn\">append</span>({\n\
    \                <span class=\"str\">\"role\":         \"tool\"</span>,\n    \
    \            <span class=\"str\">\"tool_call_id\"</span>: tc.id,\n           \
    \     <span class=\"str\">\"content\"</span>:      result\n            })\n  \
    \  <span class=\"kw\">else</span>:\n        <span class=\"cm\"># Model finished\
    \ — no more tool calls</span>\n        <span class=\"fn\">print</span>(<span class=\"\
    str\">f\"\\nFinal Answer: {msg.content}\"</span>)\n        <span class=\"kw\"\
    >break</span></pre>\n</div>\n<h3 class=\"sh3\">\n       3. LangChain Agents with\
    \ @tool Decorator\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       LangChain agents dynamically\
    \ select which tools to call based on user input, orchestrating complex multi-step\
    \ workflows autonomously.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         PYTHON — LANGCHAIN AGENT WITH CUSTOM TOOLS\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">from</span> langchain.agents\
    \ <span class=\"kw\">import</span> AgentExecutor, create_tool_calling_agent\n\
    <span class=\"kw\">from</span> langchain_core.tools <span class=\"kw\">import</span>\
    \ tool\n<span class=\"kw\">from</span> langchain_openai <span class=\"kw\">import</span>\
    \ ChatOpenAI\n<span class=\"kw\">from</span> langchain_core.prompts <span class=\"\
    kw\">import</span> ChatPromptTemplate\n<span class=\"kw\">import</span> math,\
    \ datetime, requests\n\n<span class=\"cm\"># Define tools using @tool decorator</span>\n\
    <span class=\"cm\"># The docstring becomes the tool description — make it clear\
    \ and specific</span>\n\n@tool\n<span class=\"kw\">def</span> <span class=\"fn\"\
    >calculator</span>(expression: str) -&gt; str:\n    <span class=\"str\">\"\"\"\
    Evaluate a mathematical expression. Input: valid Python math expression.\\n  \
    \  Examples: '</span><span class=\"num\">210</span><span class=\"str\">', '</span>math.<span\
    \ class=\"fn\">sqrt</span>(<span class=\"num\">144</span>)<span class=\"str\"\
    >', '</span>(<span class=\"num\">15</span> * <span class=\"num\">3</span>) / (<span\
    \ class=\"num\">2</span> + <span class=\"num\">1</span>)<span class=\"str\">'\"\
    \"\"</span>\n    <span class=\"kw\">try</span>:\n        <span class=\"kw\">return</span>\
    \ <span class=\"fn\">str</span>(<span class=\"fn\">eval</span>(expression, {<span\
    \ class=\"str\">\"math\": math, \"__builtins__\"</span>: {}}))\n    <span class=\"\
    kw\">except</span> Exception <span class=\"kw\">as</span> e:\n        <span class=\"\
    kw\">return</span> <span class=\"str\">f\"Error: {e}\"</span>\n\n@tool\n<span\
    \ class=\"kw\">def</span> <span class=\"fn\">get_current_date</span>() -&gt; str:\n\
    \    <span class=\"str\">\"\"\"Get today'</span>s current date <span class=\"\
    kw\">and</span> time. Use when the user asks about the current date.<span class=\"\
    str\">\"\"\"</span>\n    <span class=\"kw\">return</span> datetime.datetime.<span\
    \ class=\"fn\">now</span>().<span class=\"fn\">strftime</span>(<span class=\"\
    str\">\"%Y-%m-%d %H:%M:%S\"</span>)\n\n@tool\n<span class=\"kw\">def</span> <span\
    \ class=\"fn\">web_search</span>(query: str) -&gt; str:\n    <span class=\"str\"\
    >\"\"\"Lightweight web search using DuckDuckGo Instant Answer API (demo).\\n \
    \   Returns a short text snippet for the query.\"\"\"</span>\n    <span class=\"\
    kw\">try</span>:\n        resp = requests.<span class=\"fn\">get</span>(<span\
    \ class=\"str\">\"https://api.duckduckgo.com\", params={\"q\": query, \"format\"\
    : \"json\"</span>}, timeout=<span class=\"num\">5</span>)\n        data = resp.<span\
    \ class=\"fn\">json</span>()\n        <span class=\"kw\">return</span> data.<span\
    \ class=\"fn\">get</span>(<span class=\"str\">\"AbstractText\") or data.get(\"\
    Heading\") or \"No results\"</span>\n    <span class=\"kw\">except</span> Exception\
    \ <span class=\"kw\">as</span> e:\n        <span class=\"kw\">return</span> <span\
    \ class=\"str\">f\"Error: {e}\"</span>\n\n@tool\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">python_repl</span>(code: str) -&gt; str:\n    <span class=\"\
    str\">\"\"\"Execute a tiny Python snippet in a restricted locals dict and\\n \
    \   return a textual result. THIS IS FOR DEMO ONLY — not safe for untrusted code.\"\
    \"\"</span>\n    <span class=\"kw\">try</span>:\n        local = {}\n        <span\
    \ class=\"fn\">exec</span>(code, {<span class=\"str\">\"__builtins__\"</span>:\
    \ {}}, local)\n        <span class=\"kw\">return</span> <span class=\"fn\">str</span>(local.<span\
    \ class=\"fn\">get</span>(<span class=\"str\">\"result\", \"Executed\"</span>))\n\
    \    <span class=\"kw\">except</span> Exception <span class=\"kw\">as</span> e:\n\
    \        <span class=\"kw\">return</span> <span class=\"str\">f\"Error: {e}\"\
    </span>\n</pre>\n</div>\n<h3 class=\"sh3\">\n       4. Putting It Together — AgentExecutor\n\
    \      </h3>\n<p>\n       Use\n       \n        AgentExecutor\n       \n     \
    \  to wire tools and a chat LLM. The model will decide which tool to call and\
    \ when.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
