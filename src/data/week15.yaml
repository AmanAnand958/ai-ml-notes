    40\" rx=\"8\" stroke=\"#f5d76e\" stroke-width=\"1.5\" width=\"430\" x=\"80\" y=\"\
    268\">\n</rect>\n<text class=\"w15t\" fill=\"#f5d76e\" font-size=\"11\" font-weight=\"\
    700\" x=\"96\" y=\"292\">\n        messages = [ … ]\n       </text>\n<text class=\"\
    w15t\" fill=\"var(--text2)\" font-size=\"11\" x=\"210\" y=\"292\">\n        sent\
    \ as one API request\n       </text>\n<line stroke=\"#f5d76e\" stroke-width=\"\
    2\" x1=\"510\" x2=\"600\" y1=\"288\" y2=\"228\">\n</line>\n<path d=\"M 600 228\
    \ L 640 196\" stroke=\"#f5d76e\" stroke-width=\"2\">\n</path>\n<circle cx=\"660\"\
    \ cy=\"182\" fill=\"#f5d76e\" fill-opacity=\"0.15\" r=\"34\" stroke=\"#f5d76e\"\
    \ stroke-width=\"2\">\n</circle>\n<text class=\"w15t\" fill=\"#f5d76e\" font-size=\"\
    12\" font-weight=\"700\" text-anchor=\"middle\" x=\"660\" y=\"186\">\n       \
    \ LLM\n       </text>\n<text class=\"w15t\" fill=\"var(--text2)\" font-size=\"\
    9.5\" text-anchor=\"middle\" x=\"660\" y=\"236\">\n        completion\n      \
    \ </text>\n<text class=\"w15t\" fill=\"var(--text2)\" font-size=\"10\" text-anchor=\"\
    middle\" x=\"350\" y=\"318\">\n        system = rules · user = requests · assistant\
    \ = history — only the last user turn is new\n       </text>\n</svg>\n<h3 class=\"\
    sh3\">\n       2. Zero-shot vs Few-shot vs Many-shot\n      </h3>\n<p>\n<strong>\n\
    \        Zero-shot:\n       </strong>\n       No examples given — model relies\
    \ entirely on its training. Works best for clear, standard tasks.\n       <em>\n\
    \        \"Classify this review as positive or negative: 'The movie was fantastic!'\"\
    \n       </em>\n</p>\n<p>\n<strong>\n        Few-shot:\n       </strong>\n   \
    \    2–5 examples in the prompt that demonstrate the format/task. Dramatically\
    \ improves consistency for novel or structured outputs. The examples act as\n\
    \       <strong>\n        in-context training\n       </strong>\n       .\n  \
    \    </p>\n<p>\n<strong>\n        Many-shot:\n       </strong>\n       10–100+\
    \ examples. Useful for very specific output formats. Limited by context window.\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         PYTHON — FEW-SHOT EXAMPLE\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core Transformations</span>\n\
    <span class=\"kw\">import</span> time\n<span class=\"kw\">from</span> typing <span\
    \ class=\"kw\">import</span> Dict, Any\n\n<span class=\"kw\">def</span> <span\
    \ class=\"fn\">benchmark_llm_apis</span>(prompt: str) -&gt; Dict[str, Dict[str,\
    \ Any]]:\n    <span class=\"str\">\"\"\"</span>\n    Benchmarks pricing tiers,\
    \ context windows, <span class=\"kw\">and</span> theoretical throughput\n    across\
    \ leading foundation model APIs.\n    <span class=\"str\">\"\"\"</span>\n    models\
    \ = {\n        <span class=\"str\">\"OpenAI gpt-4o\"</span>: {\n            <span\
    \ class=\"str\">\"input_cost_per_m\"</span>: <span class=\"num\">2.50</span>,\n\
    \            <span class=\"str\">\"output_cost_per_m\"</span>: <span class=\"\
    num\">10.00</span>,\n            <span class=\"str\">\"context_window\"</span>:\
    \ <span class=\"num\">128000</span>,\n            <span class=\"str\">\"avg_latency_ms\"\
    </span>: <span class=\"num\">450</span>\n        },\n        <span class=\"str\"\
    >\"Anthropic Claude 3.5 Sonnet\"</span>: {\n            <span class=\"str\">\"\
    input_cost_per_m\"</span>: <span class=\"num\">3.00</span>,\n            <span\
    \ class=\"str\">\"output_cost_per_m\"</span>: <span class=\"num\">15.00</span>,\n\
    \            <span class=\"str\">\"context_window\"</span>: <span class=\"num\"\
    >200000</span>,\n            <span class=\"str\">\"avg_latency_ms\"</span>: <span\
    \ class=\"num\">520</span>\n        },\n        <span class=\"str\">\"Google Gemini\
    \ 1.5 Pro\"</span>: {\n            <span class=\"str\">\"input_cost_per_m\"</span>:\
    \ <span class=\"num\">1.25</span>,\n            <span class=\"str\">\"output_cost_per_m\"\
    </span>: <span class=\"num\">5.00</span>,\n            <span class=\"str\">\"\
    context_window\"</span>: <span class=\"num\">2000000</span>,\n            <span\
    \ class=\"str\">\"avg_latency_ms\"</span>: <span class=\"num\">680</span>\n  \
    \      }\n    }\n    \n    <span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"{'</span>Model Provider<span class=\"str\">':&lt;28} | {'</span><span class=\"\
    fn\">Input</span> ($/1M)<span class=\"str\">':&lt;12} | {'</span><span class=\"\
    fn\">Output</span> ($/1M)<span class=\"str\">':&lt;12} | {'</span>Context<span\
    \ class=\"str\">':&lt;10} | {'</span>Latency<span class=\"str\">':&lt;10}\"</span>)\n\
    \    <span class=\"fn\">print</span>(<span class=\"str\">\"─\"</span> * <span\
    \ class=\"num\">80</span>)\n    <span class=\"kw\">for</span> name, data <span\
    \ class=\"kw\">in</span> models.<span class=\"fn\">items</span>():\n        <span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"{name:&lt;28} | ${data['</span>input_cost_per_m<span\
    \ class=\"str\">']:&lt;11.2f} | ${data['</span>output_cost_per_m<span class=\"\
    str\">']:&lt;11.2f} | {data['</span>context_window<span class=\"str\">']:&lt;10}\
    \ | {data['</span>avg_latency_ms<span class=\"str\">']}ms\"</span>)\n        \n\
    \    <span class=\"kw\">return</span> models\n\n<span class=\"fn\">benchmark_llm_apis</span>(<span\
    \ class=\"str\">\"Explain Scaled Dot-Product Attention in 2 sentences.\"</span>)</pre>\n\
    </div>\n<h3 class=\"sh3\">\n       3. Chain-of-Thought (CoT) Prompting\n     \
    \ </h3>\n<p>\n       CoT ek revolutionary technique hai jisse LLMs ke reasoning\
    \ ability dramatically improve hoti hai. Sirf\n       <strong>\n        \"Let's\
    \ think step by step\"\n       </strong>\n       add karne se complex reasoning\
    \ tasks mein 30–50% accuracy improve hoti hai.\n      </p>\n<div class=\"math-block\"\
    >\n<span class=\"desc\">\n        Why CoT works — probability decomposition:\n\
    \       </span>\n<span class=\"formula\">\n        $$P(\\text{correct answer})\
    \ = \\prod_{i=1}^{n} P(\\text{step}_i \\mid \\text{steps}_{1..i-1})$$\n      \
    \ </span>\n<span class=\"desc\">\n        Each intermediate reasoning step conditions\
    \ the next, reducing the probability of errors cascading from a single wrong jump.\n\
    \       </span>\n</div>\n<h3 class=\"sh3\">\n       4. ReAct Prompting (Reason\
    \ + Act)\n      </h3>\n<p>\n       ReAct is the foundation of all modern AI agents.\
    \ The model interleaves\n       <strong>\n        Thought\n       </strong>\n\
    \       (reasoning),\n       <strong>\n        Action\n       </strong>\n    \
    \   (tool use), and\n       <strong>\n        Observation\n       </strong>\n\
    \       (tool result) in a loop until the task is complete.\n      </p>\n<div\
    \ class=\"mermaid\">\ngraph LR\n  A[\"Question\"] --&gt; B[\"Thought: Reason about\
    \ what to do\"]\n  B --&gt; C[\"Action: Call a tool or API\"]\n  C --&gt; D[\"\
    Observation: Get tool result\"]\n  D --&gt; E[\"Task done?\"]\n  E --&gt;|No|\
    \ B\n  E --&gt;|Yes| F[\"Final Answer\"]\nstyle A fill:#1c2030,stroke:#38bdf8,color:#dde2f0\n\
    style F fill:#1c2030,stroke:#4fd1a5,color:#dde2f0\n</div>\n<h3 class=\"sh3\">\n\
    \       5. Sampling Parameters — Controlling Randomness\n      </h3>\n<div class=\"\
    table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table\
    \ class=\"concept-table\">\n<tr>\n<th>\n         Parameter\n        </th>\n<th>\n\
    \         Range\n        </th>\n<th>\n         Effect\n        </th>\n<th>\n \
    \        When to Use\n        </th>\n</tr>\n<tr>\n<td>\n\n          temperature\n\
    \         \n</td>\n<td>\n         0.0 – 2.0\n        </td>\n<td>\n         Scales\
    \ logit distribution. 0 = deterministic (greedy), 1 = normal, &gt;1 = chaotic\n\
    \        </td>\n<td>\n         0 for factual/code, 0.7 for balanced, 1.2+ for\
    \ creative writing\n        </td>\n</tr>\n<tr>\n<td>\n\n          top_p\n    \
    \     \n</td>\n<td>\n         0.0 – 1.0\n        </td>\n<td>\n         Nucleus\
    \ sampling: only consider tokens whose cumulative probability ≤ top_p\n      \
    \  </td>\n<td>\n         0.9 default. Use with temperature, not instead of it\n\
    \        </td>\n</tr>\n<tr>\n<td>\n\n          top_k\n         \n</td>\n<td>\n\
    \         1 – ∞\n        </td>\n<td>\n         Only sample from the top-k tokens\
    \ at each step\n        </td>\n<td>\n         40–100 for diversity, 1 for greedy\n\
    \        </td>\n</tr>\n<tr>\n<td>\n\n          max_tokens\n         \n</td>\n\
    <td>\n         1 – model max\n        </td>\n<td>\n         Hard cap on output\
    \ length\n        </td>\n<td>\n         Set low for structured outputs, high for\
    \ long-form\n        </td>\n</tr>\n</table></div>\n<div class=\"math-block\">\n\
    <span class=\"desc\">\n        Temperature scaling on logits before softmax:\n\
    \       </span>\n<span class=\"formula\">\n        $$P(w_i) = \\frac{\\exp(z_i\
    \ / T)}{\\sum_{j} \\exp(z_j / T)}$$\n       </span>\n<span class=\"desc\">\n \
    \       T → 0: distribution collapses to argmax (greedy). T → ∞: uniform distribution\
    \ (pure random).\n       </span>\n</div>\n\n<h3 class=\"sh3\">\n       6. Prompt\
    \ Injection — Attack &amp; Defense\n      </h3>\n<p>\n       Prompt injection\
    \ tab hota hai jab malicious user input apne andar hidden instructions daal deta\
    \ hai jo model ke original instructions ko override karne ki koshish karta hai.\
    \ Ye LLM security ka #1 threat hai.\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         PYTHON — INJECTION-SAFE PROMPT\
    \ TEMPLATE\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><span class=\"cm\"># Step 1: Algorithmic\
    \ Implementation &amp; Core Transformations</span>\n<span class=\"kw\">import</span>\
    \ time\n<span class=\"kw\">from</span> typing <span class=\"kw\">import</span>\
    \ Dict, Any\n\n<span class=\"kw\">def</span> <span class=\"fn\">benchmark_llm_apis</span>(prompt:\
    \ str) -&gt; Dict[str, Dict[str, Any]]:\n    <span class=\"str\">\"\"\"</span>\n\
    \    Benchmarks pricing tiers, context windows, <span class=\"kw\">and</span>\
    \ theoretical throughput\n    across leading foundation model APIs.\n    <span\
    \ class=\"str\">\"\"\"</span>\n    models = {\n        <span class=\"str\">\"\
    OpenAI gpt-4o\"</span>: {\n            <span class=\"str\">\"input_cost_per_m\"\
    </span>: <span class=\"num\">2.50</span>,\n            <span class=\"str\">\"\
    output_cost_per_m\"</span>: <span class=\"num\">10.00</span>,\n            <span\
    \ class=\"str\">\"context_window\"</span>: <span class=\"num\">128000</span>,\n\
    \            <span class=\"str\">\"avg_latency_ms\"</span>: <span class=\"num\"\
    >450</span>\n        },\n        <span class=\"str\">\"Anthropic Claude 3.5 Sonnet\"\
    </span>: {\n            <span class=\"str\">\"input_cost_per_m\"</span>: <span\
    \ class=\"num\">3.00</span>,\n            <span class=\"str\">\"output_cost_per_m\"\
    </span>: <span class=\"num\">15.00</span>,\n            <span class=\"str\">\"\
    context_window\"</span>: <span class=\"num\">200000</span>,\n            <span\
    \ class=\"str\">\"avg_latency_ms\"</span>: <span class=\"num\">520</span>\n  \
    \      },\n        <span class=\"str\">\"Google Gemini 1.5 Pro\"</span>: {\n \
    \           <span class=\"str\">\"input_cost_per_m\"</span>: <span class=\"num\"\
    >1.25</span>,\n            <span class=\"str\">\"output_cost_per_m\"</span>: <span\
    \ class=\"num\">5.00</span>,\n            <span class=\"str\">\"context_window\"\
    </span>: <span class=\"num\">2000000</span>,\n            <span class=\"str\"\
    >\"avg_latency_ms\"</span>: <span class=\"num\">680</span>\n        }\n    }\n\
    \    \n    <span class=\"fn\">print</span>(<span class=\"str\">f\"{'</span>Model\
    \ Provider<span class=\"str\">':&lt;28} | {'</span><span class=\"fn\">Input</span>\
    \ ($/1M)<span class=\"str\">':&lt;12} | {'</span><span class=\"fn\">Output</span>\
    \ ($/1M)<span class=\"str\">':&lt;12} | {'</span>Context<span class=\"str\">':&lt;10}\
    \ | {'</span>Latency<span class=\"str\">':&lt;10}\"</span>)\n    <span class=\"\
    fn\">print</span>(<span class=\"str\">\"─\"</span> * <span class=\"num\">80</span>)\n\
    \    <span class=\"kw\">for</span> name, data <span class=\"kw\">in</span> models.<span\
    \ class=\"fn\">items</span>():\n        <span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"{name:&lt;28} | ${data['</span>input_cost_per_m<span class=\"\
    str\">']:&lt;11.2f} | ${data['</span>output_cost_per_m<span class=\"str\">']:&lt;11.2f}\
    \ | {data['</span>context_window<span class=\"str\">']:&lt;10} | {data['</span>avg_latency_ms<span\
    \ class=\"str\">']}ms\"</span>)\n        \n    <span class=\"kw\">return</span>\
    \ models\n\n<span class=\"fn\">benchmark_llm_apis</span>(<span class=\"str\">\"\
    Explain Scaled Dot-Product Attention in 2 sentences.\"</span>)</pre>\n</div>\n\
    <h3 class=\"sh3\">\n       7. Advanced Prompt Patterns\n      </h3>\n<ul class=\"\
    prose-list\">\n<li>\n<strong>\n         Persona Pattern:\n        </strong>\n\
    \        \"Act as a senior Google SWE reviewing this code.\"\n       </li>\n<li>\n\
    <strong>\n         Output Format Specification:\n        </strong>\n        \"\
    Respond ONLY as valid JSON with keys: {name, score, reason}.\"\n       </li>\n\
    <li>\n<strong>\n         Negative Constraints:\n        </strong>\n        \"\
    Do not use bullet points. Do not mention competitors.\"\n       </li>\n<li>\n\
    <strong>\n         Role Reversal:\n        </strong>\n        \"Ask me clarifying\
    \ questions before answering.\"\n       </li>\n<li>\n<strong>\n         Self-Consistency:\n\
    \        </strong>\n        Generate multiple answers at temperature=0.7, then\
    \ vote on majority.\n       </li>\n<li>\n<strong>\n         Tree of Thought (ToT):\n\
    \        </strong>\n        Branch multiple reasoning paths and evaluate which\
    \ path is best.\n       </li>\n</ul>"
