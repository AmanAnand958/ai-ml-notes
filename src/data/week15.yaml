- id: '103'
  day_num: 103
  title: LangChain & LCEL — LLM Orchestration
  subtitle: Alag-alag API calls ko chain karke powerful pipelines banana — ye hai
    LangChain ka kaam. LangChain Expression Language (LCEL) ke saath hum PromptTemplate,
    LLM calls, output parsers, aur memory ko ek clean pipeline mein connect karenge.
  time_estimate: 7 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - "Build LCEL chains using the pipe operator (\n        \n         |\n        \n\
    \        ) for clean, composable pipelines."
  - "Use\n        \n         ChatPromptTemplate\n        \n        for structured,\
    \ reusable prompt templates."
  - "Implement conversation memory with\n        \n         ConversationBufferMemory\n\
    \        \n        and\n        \n         ConversationSummaryMemory\n       \
    \ \n        ."
  - "Parse structured outputs with\n        \n         StructuredOutputParser\n  \
    \      \n        and\n        \n         PydanticOutputParser\n        \n    \
    \    ."
  - Build a multi-step sequential chain that does research → summarize → translate.
  checklist:
  - id: chk_103_1
    text: Study the core mathematical and architectural principles of LangChain &
      LCEL — LLM Orchestration
  - id: chk_103_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_103_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_103_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - Prompt Engineering — The
  - LLM APIs — OpenAI, Anthro
  - LangChain & LCEL — LLM Or
  - Vector Databases — Semant
  - Advanced RAG — Beyond Nai
  - LLM Agents & Tool Use
  - Capstone — Agentic System
  hinglish: 'Embedding model choice important hai: OpenAI ada-002, HuggingFace sentence-transformers
    — compare karo apne domain par. Domain-specific data par fine-tuned embeddings
    generic se better ho sakte hain!'
  analogy: 'LangChain ko samjho jaise ek railway junction: akela train (API call)
    seedha chali jaati hai. LangChain mein aap multiple tracks bichha sakte ho — ek
    track Hindi summary ke liye, ek track English ke liye, ek track sentiment ke liye
    — sab ek saath, parallel mein, ek hi input se.'
  theory_html: "<h3 class=\"sh3\">\n       1. What is LangChain and Why Use It?\n\
    \      </h3>\n<p>\n       LangChain ek\n       <strong>\n        orchestration\
    \ framework\n       </strong>\n       hai — ye khud koi LLM nahi hai. Ye alag-alag\
    \ building blocks ko connect karta hai: prompts, models, parsers, memory, retrieval\
    \ systems, tools. Jaise LEGO bricks — har piece standard interface follow karta\
    \ hai, isliye freely combine kar sakte hain.\n      </p>\n<div class=\"mermaid\"\
    >\ngraph LR\n  A[\"PromptTemplate\"] --&gt; B[\"LLM / Chat Model\"]\n  B --&gt;\
    \ C[\"Output Parser\"]\n  C --&gt; D[\"Next Chain Step\"]\nstyle A fill:#1c2030,stroke:#38bdf8,color:#dde2f0\n\
    style B fill:#1c2030,stroke:#b47cfc,color:#dde2f0\nstyle C fill:#1c2030,stroke:#f7a94b,color:#dde2f0\n\
    style D fill:#1c2030,stroke:#4fd1a5,color:#dde2f0\n</div>\n<h3 class=\"sh3\">\n\
    \       2. LCEL — LangChain Expression Language\n      </h3>\n<p>\n       LCEL\
    \ is the modern way to build LangChain chains. The\n       \n        |\n     \
    \  \n       pipe operator connects components, making the data flow crystal clear.\
    \ It also enables automatic parallelism, streaming, and async support.\n     \
    \ </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n\
    \         PYTHON — LCEL BASICS\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\"\
    >from</span> langchain_openai <span class=\"kw\">import</span> ChatOpenAI\n<span\
    \ class=\"kw\">from</span> langchain_core.prompts <span class=\"kw\">import</span>\
    \ ChatPromptTemplate\n<span class=\"kw\">from</span> langchain_core.output_parsers\
    \ <span class=\"kw\">import</span> StrOutputParser\n\n<span class=\"cm\"># 1.\
    \ Define the model</span>\nllm = <span class=\"fn\">ChatOpenAI</span>(model=<span\
    \ class=\"str\">\"gpt-4o-mini\"</span>, temperature=<span class=\"num\">0.7</span>)\n\
    \n<span class=\"cm\"># 2. Define the prompt template (variables in curly braces)</span>\n\
    prompt = ChatPromptTemplate.<span class=\"fn\">from_messages</span>([\n    (<span\
    \ class=\"str\">\"system\", \"You are a {role}. Answer in exactly {num_sentences}\
    \ sentences.\"</span>),\n    (<span class=\"str\">\"human\",  \"{question}\"</span>)\n\
    ])\n\n<span class=\"cm\"># 3. Define the output parser (StrOutputParser just returns\
    \ the text)</span>\nparser = <span class=\"fn\">StrOutputParser</span>()\n\n<span\
    \ class=\"cm\"># 4. Build the chain with the pipe operator |</span>\n<span class=\"\
    cm\"># Data flows: prompt → llm → parser</span>\nchain = prompt | llm | parser\n\
    \n<span class=\"cm\"># 5. Invoke the chain with a dictionary of variables</span>\n\
    result = chain.<span class=\"fn\">invoke</span>({\n    <span class=\"str\">\"\
    role\": \"ML researcher\"</span>,\n    <span class=\"str\">\"num_sentences\":\
    \ \"2\"</span>,\n    <span class=\"str\">\"question\": \"What is attention in\
    \ transformers?\"</span>\n})\n<span class=\"fn\">print</span>(result)\n\n<span\
    \ class=\"cm\"># 6. Streaming with LCEL — just use .stream() instead of .invoke()</span>\n\
    <span class=\"kw\">for</span> chunk <span class=\"kw\">in</span> chain.<span class=\"\
    fn\">stream</span>({<span class=\"str\">\"role\": \"tutor\", \"num_sentences\"\
    : \"3\", \"question\": \"Explain LSTM\"</span>}):\n    <span class=\"fn\">print</span>(chunk,\
    \ end=<span class=\"str\">\"\"</span>, flush=<span class=\"kw\">True</span>)</pre>\n\
    </div>\n<h3 class=\"sh3\">\n       3. Output Parsers — Structured Data from LLMs\n\
    \      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       Output parsers instruct LLMs to return answers in\
    \ structured formats (like JSON or Pydantic schemas) and parse them directly into\
    \ Python objects.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n         PYTHON — PYDANTIC OUTPUT PARSER\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">from</span> langchain.output_parsers <span class=\"kw\"\
    >import</span> PydanticOutputParser\n<span class=\"kw\">from</span> langchain_core.prompts\
    \ <span class=\"kw\">import</span> ChatPromptTemplate\n<span class=\"kw\">from</span>\
    \ pydantic <span class=\"kw\">import</span> BaseModel, Field\n<span class=\"kw\"\
    >from</span> typing <span class=\"kw\">import</span> List\n\n<span class=\"cm\"\
    ># Define the output schema</span>\n<span class=\"kw\">class</span> <span class=\"\
    cls\">BookRecommendation</span>(BaseModel):\n    title: str     = <span class=\"\
    fn\">Field</span>(description=<span class=\"str\">\"Title of the book\"</span>)\n\
    \    author: str    = <span class=\"fn\">Field</span>(description=<span class=\"\
    str\">\"Author'</span>s full name\")\n    reason: str    = <span class=\"fn\"\
    >Field</span>(description=<span class=\"str\">\"Why this book is relevant (1 sentence)\"\
    </span>)\n    level: str     = <span class=\"fn\">Field</span>(description=<span\
    \ class=\"str\">\"beginner | intermediate | advanced\"</span>)\n\n<span class=\"\
    kw\">class</span> <span class=\"cls\">RecommendationList</span>(BaseModel):\n\
    \    books: List[BookRecommendation] = <span class=\"fn\">Field</span>(description=<span\
    \ class=\"str\">\"List of 3 book recommendations\"</span>)\n\n<span class=\"cm\"\
    ># Create the parser — it generates format instructions automatically</span>\n\
    parser = <span class=\"fn\">PydanticOutputParser</span>(pydantic_object=RecommendationList)\n\
    \n<span class=\"cm\"># Inject format instructions into the prompt</span>\nprompt\
    \ = ChatPromptTemplate.<span class=\"fn\">from_messages</span>([\n    (<span class=\"\
    str\">\"system\", \"You are a book recommender. {format_instructions}\"</span>),\n\
    \    (<span class=\"str\">\"human\",  \"Recommend 3 books for learning {topic}.\"\
    </span>)\n]).<span class=\"fn\">partial</span>(format_instructions=parser.<span\
    \ class=\"fn\">get_format_instructions</span>())\n<span class=\"cm\"># .partial()\
    \ pre-fills a variable — format_instructions won't need to be passed at invoke\
    \ time</span>\n\nchain = prompt | <span class=\"fn\">ChatOpenAI</span>(model=<span\
    \ class=\"str\">\"gpt-4o-mini\"</span>, temperature=<span class=\"num\">0</span>)\
    \ | parser\n\nresult: RecommendationList = chain.<span class=\"fn\">invoke</span>({<span\
    \ class=\"str\">\"topic\": \"deep learning\"</span>})\n<span class=\"kw\">for</span>\
    \ book <span class=\"kw\">in</span> result.books:\n    <span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"\U0001F4DA {book.title} by {book.author} [{book.level}]\"</span>)\n\
    \    <span class=\"fn\">print</span>(<span class=\"str\">f\"   {book.reason}\"\
    </span>)</pre>\n</div>\n<h3 class=\"sh3\">\n       4. Conversation Memory Types\n\
    \      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem\
    \ 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Memory\
    \ Type\n        </th>\n<th>\n         How it works\n        </th>\n<th>\n    \
    \     Tokens Used\n        </th>\n<th>\n         Best For\n        </th>\n</tr>\n\
    <tr>\n<td>\n\n          ConversationBufferMemory\n         \n</td>\n<td>\n   \
    \      Stores ALL messages verbatim\n        </td>\n<td>\n         Grows unbounded\n\
    \        </td>\n<td>\n         Short conversations (&lt;10 turns)\n        </td>\n\
    </tr>\n<tr>\n<td>\n\n          ConversationBufferWindowMemory\n         \n</td>\n\
    <td>\n         Stores last K messages only\n        </td>\n<td>\n         Fixed\
    \ (K × avg_tokens)\n        </td>\n<td>\n         Long conversations with recent\
    \ context\n        </td>\n</tr>\n<tr>\n<td>\n\n          ConversationSummaryMemory\n\
    \         \n</td>\n<td>\n         Summarises older messages with LLM\n       \
    \ </td>\n<td>\n         Summary grows slowly\n        </td>\n<td>\n         Very\
    \ long conversations, topic tracking\n        </td>\n</tr>\n<tr>\n<td>\n\n   \
    \       ConversationSummaryBufferMemory\n         \n</td>\n<td>\n         Recent\
    \ messages verbatim + older as summary\n        </td>\n<td>\n         token_limit\
    \ controlled\n        </td>\n<td>\n         Production chatbots — best of both\n\
    \        </td>\n</tr>\n</table></div>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         PYTHON — CONVERSATIONSUMMARYBUFFERMEMORY\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">from</span> langchain.memory\
    \ <span class=\"kw\">import</span> ConversationSummaryBufferMemory\n<span class=\"\
    kw\">from</span> langchain_openai <span class=\"kw\">import</span> ChatOpenAI\n\
    <span class=\"kw\">from</span> langchain.chains <span class=\"kw\">import</span>\
    \ ConversationChain\n\nllm = <span class=\"fn\">ChatOpenAI</span>(model=<span\
    \ class=\"str\">\"gpt-4o-mini\"</span>, temperature=<span class=\"num\">0.7</span>)\n\
    \n<span class=\"cm\"># Keep recent messages verbatim until they exceed 500 tokens</span>\n\
    <span class=\"cm\"># Then summarize old ones with another LLM call</span>\nmemory\
    \ = <span class=\"fn\">ConversationSummaryBufferMemory</span>(\n    llm=llm, \
    \           <span class=\"cm\"># uses this to summarize old messages</span>\n\
    \    max_token_limit=<span class=\"num\">500</span> <span class=\"cm\"># threshold\
    \ before summarisation kicks in</span>\n)\n\nconversation = <span class=\"fn\"\
    >ConversationChain</span>(llm=llm, memory=memory, verbose=<span class=\"kw\">False</span>)\n\
    \n<span class=\"cm\"># Each call automatically maintains history</span>\nr1 =\
    \ conversation.<span class=\"fn\">predict</span>(input=<span class=\"str\">\"\
    Hi, my name is Rahul and I'</span>m learning about CNNs.\")\nr2 = conversation.<span\
    \ class=\"fn\">predict</span>(input=<span class=\"str\">\"What'</span>s the key\
    \ innovation <span class=\"kw\">in</span> ResNet that we discussed?\")\n<span\
    \ class=\"cm\"># Even after many turns, the model remembers \"Rahul\" because\
    \ it's in the summary</span>\n<span class=\"fn\">print</span>(memory.moving_summary_buffer)\
    \  <span class=\"cm\"># see what got summarised</span></pre>\n</div>\n<h3 class=\"\
    sh3\">\n       5. Parallel LCEL with RunnableParallel\n      </h3>\n<p>\n    \
    \   Kai baar hume ek hi input pe multiple chains simultaneously run karni hoti\
    \ hain.\n       \n        RunnableParallel\n       \n       se ye automatically\
    \ parallel hoti hain.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         PYTHON — PARALLEL CHAINS\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">from</span> langchain_core.runnables <span class=\"kw\"\
    >import</span> RunnableParallel, RunnablePassthrough\n\nllm = <span class=\"fn\"\
    >ChatOpenAI</span>(model=<span class=\"str\">\"gpt-4o-mini\"</span>, temperature=<span\
    \ class=\"num\">0</span>)\n\n<span class=\"cm\"># Two chains that run IN PARALLEL\
    \ on the same input</span>\nsummary_chain  = ChatPromptTemplate.<span class=\"\
    fn\">from_template</span>(<span class=\"str\">\"Summarize this in 1 sentence:\
    \ {text}\"</span>) | llm | <span class=\"fn\">StrOutputParser</span>()\nsentiment_chain\
    \ = ChatPromptTemplate.<span class=\"fn\">from_template</span>(<span class=\"\
    str\">\"What is the sentiment (POSITIVE/NEGATIVE/NEUTRAL) of: {text}\"</span>)\
    \ | llm | <span class=\"fn\">StrOutputParser</span>()\n\n<span class=\"cm\">#\
    \ RunnableParallel runs both chains simultaneously, returns dict</span>\nparallel\
    \ = <span class=\"fn\">RunnableParallel</span>({\n    <span class=\"str\">\"summary\"\
    </span>:   summary_chain,\n    <span class=\"str\">\"sentiment\"</span>: sentiment_chain,\n\
    \    <span class=\"str\">\"original\"</span>:  <span class=\"fn\">RunnablePassthrough</span>()\
    \  <span class=\"cm\"># passes input through unchanged</span>\n})\n\nresult =\
    \ parallel.<span class=\"fn\">invoke</span>({<span class=\"str\">\"text\": \"\
    The new iPhone is incredible but way too expensive for Indian market.\"</span>})\n\
    <span class=\"fn\">print</span>(result[<span class=\"str\">\"summary\"</span>])\
    \   <span class=\"cm\"># both ran at the same time!</span>\n<span class=\"fn\"\
    >print</span>(result[<span class=\"str\">\"sentiment\"</span>])</pre>\n</div>\n\
    \n<!-- /theory -->\n<h2 class=\"sh2\">\n       ⚡ Tasks\n      </h2>"
