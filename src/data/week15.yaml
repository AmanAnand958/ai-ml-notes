  quizzes:
  - num_str: Q1 OF 5
    question: A user asks "What did CEO say in Q3 earnings call?" but your vector
      search returns "Q2 results were strong" (wrong quarter). BM25 returns the correct
      Q3 document. This is an example of which vector search failure mode?
    qid: q105_1
    options:
    - letter: A
      text: Context window overflow
      is_correct: false
    - letter: B
      text: Vocabulary mismatch — "Q3" and "Q2" have similar embeddings (both are
        earnings-related) but BM25 correctly distinguishes them via exact keyword
        matching
      is_correct: true
    - letter: C
      text: Hallucination by the LLM
      is_correct: false
    - letter: D
      text: Insufficient chunk overlap
      is_correct: false
    correct_fb: ✅ Exactly. Vector search captures semantic similarity — Q2 and Q3
      earnings reports are semantically similar (same domain, same structure). BM25
      distinguishes them via exact term matching. This is the primary motivation for
      hybrid search.
    wrong_fb: ❌ This is a vocabulary mismatch failure. "Q3" and "Q2" are semantically
      similar (both quarterly earnings) but factually different. BM25 correctly matches
      exact tokens like "Q3". Hybrid search is the solution.
  - num_str: Q2 OF 5
    question: In Reciprocal Rank Fusion (RRF), why is the constant k=60 used in the
      formula $\frac{1}{k + \text{rank}}$?
    qid: q105_2
    options:
    - letter: A
      text: 60 is the maximum number of results any retrieval system can return
      is_correct: false
    - letter: B
      text: k prevents very highly-ranked documents from dominating the score — without
        k, rank=1 gives score=1.0 while rank=2 gives 0.5 (50% drop). k=60 makes the
        ranking smoother and less sensitive to small rank differences
      is_correct: true
    - letter: C
      text: k=60 was chosen to match the default FAISS nlist parameter
      is_correct: false
    - letter: D
      text: It's an arbitrary constant with no theoretical justification
      is_correct: false
    correct_fb: '✅ Correct. Without k, 1/1=1.0 vs 1/2=0.5 — a rank-1 document gets
      2x the score of rank-2. With k=60: 1/61 vs 1/62 — nearly equal. This smoothing
      was empirically shown to work well at k=60 in the original RRF paper (Cormack
      et al., 2009).'
    wrong_fb: ❌ k prevents top-1 documents from completely dominating. With k=60,
      rank differences of a few positions have much smaller impact on the final score,
      making the fusion more robust to rank noise.
  - num_str: Q3 OF 5
    question: What is the key difference between a bi-encoder and a cross-encoder
      for retrieval?
    qid: q105_3
    options:
    - letter: A
      text: Bi-encoder encodes query and document independently (fast, scalable for
        large corpora). Cross-encoder processes them jointly, allowing attention between
        them (accurate but too slow for large-scale retrieval)
      is_correct: true
    - letter: B
      text: Bi-encoder is used for short texts, cross-encoder for long documents
      is_correct: false
    - letter: C
      text: They are the same architecture but bi-encoder uses 2 GPUs
      is_correct: false
    - letter: D
      text: Cross-encoder cannot be used with FAISS
      is_correct: false
    correct_fb: '✅ Perfect. Bi-encoder: query → vector, doc → vector (pre-computed),
      compare at search time. O(1) per query. Cross-encoder: feed [query, doc] together,
      output relevance score. O(N) per query. Solution: bi-encoder for retrieval (fast),
      cross-encoder for reranking (accurate on small set).'
    wrong_fb: ❌ Bi-encoder = independent encoding (fast, scalable). Cross-encoder
      = joint processing with attention between query and document (accurate, but
      can't pre-compute — must process every query-document pair at query time, making
      it O(N)).
  - num_str: Q4 OF 5
    question: Your RAG system has Faithfulness=0.95 but Context_Recall=0.40. What
      does this tell you?
    qid: q105_4
    options:
    - letter: A
      text: The LLM is hallucinating heavily
      is_correct: false
    - letter: B
      text: The LLM stays grounded in what it retrieves (high faithfulness), but retrieval
        is missing 60% of relevant information — the retrieval pipeline needs improvement,
        not the generation step
      is_correct: true
    - letter: C
      text: The chunking strategy is creating chunks that are too large
      is_correct: false
    - letter: D
      text: The context window is too small
      is_correct: false
    correct_fb: '✅ Correct diagnostic. High faithfulness = the LLM doesn''t hallucinate
      beyond what it retrieves. Low context_recall = retrieval is the bottleneck —
      it''s finding only 40% of the relevant ground truth. Fix: improve chunking,
      add hybrid search, or use a better embedding model.'
    wrong_fb: '❌ Faithfulness=0.95 means the LLM is being accurate relative to what
      it receives — no hallucination issue. Context_Recall=0.40 means retrieval is
      the problem: only 40% of ground truth info is being found. Improve the retrieval
      pipeline, not the generation.'
  - num_str: Q5 OF 5
    question: Why should chunk_overlap be set to 10–15% of chunk_size in RecursiveCharacterTextSplitter?
    qid: q105_5
    options:
    - letter: A
      text: To reduce storage costs by duplicating some text
      is_correct: false
    - letter: B
      text: To preserve context at chunk boundaries — an answer that spans two chunks
        is more likely to be retrievable because both chunks contain the bridge text
      is_correct: true
    - letter: C
      text: To improve BM25 ranking scores by increasing term frequency
      is_correct: false
    - letter: D
      text: Overlap is optional and has no practical benefit
      is_correct: false
    correct_fb: ✅ Exactly. Without overlap, a sentence that starts in chunk N and
      ends in chunk N+1 would never be fully retrievable. Overlap ensures that boundary
      sentences appear in both chunks, so they can be retrieved by either. 10–15%
      overlap is the empirical sweet spot.
    wrong_fb: ❌ Overlap handles the chunk boundary problem. Without it, sentences
      that cross chunk boundaries are split and neither chunk contains the complete
      thought. Overlap ensures boundary content appears in adjacent chunks, making
      it retrievable.
  flashcards:
  - front: Cross-Encoder Re-Ranker
    back: Cross-encoder scoring retrieved documents against query, improving precision
      over cosine similarity.
  - front: How is Day 105 structured?
    back: It combines theory, hands-on coding tasks, and quizzes.
  - front: Where does Day 105 fit in Week 15?
    back: It is a key day in Week 15 (LLMs + Generative AI + OpenAI APIs, RAG, Prompt
      Engineering, Vector Databases).
  - front: Does an LLM execute API tools directly when using Function Calling?
    back: No; the LLM outputs a structured JSON tool call name and arguments. Your
      client application executes the tool and sends back the result as a tool message.
  gotcha:
    title: '⚠️ Gotcha: CUDA Out-of-Memory (OOM) Overhead'
    description: PyTorch allocates memory in cached chunks. Use `torch.cuda.empty_cache()`
      and gradient accumulation when batch sizes hit limits.
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       Ragas\
      \ evaluation framework retrieval precision, faithfulness aur answer relevance\
      \ parameters ko check karke RAG pipeline ke hallucinations ko spot karta hai."
    bullets:
    - Naive RAG fails on keyword-sensitive queries — hybrid search (BM25 + vector)
      with RRF solves this.
    - RecursiveCharacterTextSplitter with 10–15% overlap is the go-to chunking strategy
      for most documents.
    - Use bi-encoder for first-stage retrieval (top-50), cross-encoder for reranking
      (top-5) — this gives accuracy without sacrificing speed.
    - RAGAS separates retrieval quality (context_recall, context_precision) from generation
      quality (faithfulness, answer_relevancy) — essential for diagnosing where your
      RAG breaks.
    - High faithfulness + low context_recall = fix retrieval. High context_recall
      + low faithfulness = fix generation/prompting.
