  - front: What is the benefit of a multi-agent system over a single agent?
    back: Dividing a complex task among specialized agents (e.g., researcher, writer,
      editor) reduces prompt complexity and improves reliability.
  - front: What is human-in-the-loop (HITL) inside agentic systems?
    back: A checkpoint where the agent pauses and waits for user approval or feedback
      before executing a critical tool (like sending an email or running a transaction).
