  checklist:
  - id: chk_175_1
    text: Derive and analyze mathematical and architectural principles for Model & Data Drift Monitoring with Evidently AI
  - id: chk_175_2
    text: Build and benchmark production coding pipelines for Model & Data Drift Monitoring with Evidently AI
