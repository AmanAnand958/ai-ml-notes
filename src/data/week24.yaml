    solution_code: |
      # Day 172 Task 1 Solution: MLflow Model Registry Promotion via Aliases
      from typing import Dict, Any

      class ModelRegistryManager:
          def __init__(self):
              self.registry: Dict[str, Dict[str, Any]] = {}
              self.aliases: Dict[str, str] = {}

          def register_model(self, model_name: str, version: str, metrics: Dict[str, float]):
              self.registry[version] = {"model": model_name, "metrics": metrics}

          def promote_to_champion(self, version: str, min_accuracy: float = 0.90):
              if self.registry[version]["metrics"].get("accuracy", 0.0) >= min_accuracy:
                  self.aliases["champion"] = version
                  return f"Version {version} successfully assigned @champion alias."
              raise ValueError(f"Version {version} failed quality threshold for @champion promotion.")

      mgr = ModelRegistryManager()
      mgr.register_model("fraud_detector", "v2.1", {"accuracy": 0.94, "latency_ms": 12.0})
      msg = mgr.promote_to_champion("v2.1")
      assert mgr.aliases["champion"] == "v2.1"
      print(f"✅ {msg}")
