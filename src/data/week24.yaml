    conditions deviate from normal baseline air.
  theory_html: '<div class="theory-prose" style="line-height:1.7; font-size:14.5px;
    color:var(--text);">

    <p>Analogy:

    Model Drift Detection

    💡 Gotcha &amp; Common Pitfall Warning:

    Always double check tensor dimensions, verify data types before matrix operations,
    and ensure feature scaling is fitted strictly on the training set to prevent data
    leakage.</p>

    </div>'
  predict:
    question: What action should you take when Evidently detects significant data
      drift?
    answer: Retrain or investigate
    explanation: Investigate feature distributions, validate if upstream data schema
      shifted, trigger an automated model retraining pipeline with recent data, or
      fallback to a conservative baseline model.
    code: "<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\
      <span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span\
      \ class=\"kw\">def</span> <span class=\"fn\">compute_population_stability_index</span>(reference:\
      \ np.ndarray, current: np.ndarray, num_bins: int = <span class=\"num\">10</span>)\
      \ -&gt; float:\n    <span class=\"str\">\"\"\"</span>\n    Computes Population\
      \ Stability <span class=\"fn\">Index</span> (PSI) to detect feature distribution\
      \ drift.\n    PSI = <span class=\"num\">0.25</span>: Significant Drift\n   \
      \ <span class=\"str\">\"\"\"</span>\n    quantiles = np.<span class=\"fn\">linspace</span>(<span\
      \ class=\"num\">0</span>, <span class=\"num\">100</span>, num_bins + <span class=\"\
      num\">1</span>)\n    bins = np.<span class=\"fn\">percentile</span>(reference,\
      \ quantiles)\n    bins[<span class=\"num\">0</span>], bins[-<span class=\"num\"\
      >1</span>] = -np.inf, np.inf\n    \n    ref_counts = np.<span class=\"fn\">histogram</span>(reference,\
      \ bins=bins)[<span class=\"num\">0</span>] / <span class=\"fn\">len</span>(reference)\n\
      \    cur_counts = np.<span class=\"fn\">histogram</span>(current, bins=bins)[<span\
      \ class=\"num\">0</span>] / <span class=\"fn\">len</span>(current)\n    \n \
      \   <span class=\"cm\"># Avoid zero division</span>\n    ref_counts = np.<span\
      \ class=\"fn\">where</span>(ref_counts == <span class=\"num\">0</span>, <span\
      \ class=\"num\">0.0001</span>, ref_counts)\n    cur_counts = np.<span class=\"\
      fn\">where</span>(cur_counts == <span class=\"num\">0</span>, <span class=\"\
      num\">0.0001</span>, cur_counts)\n    \n    psi = np.<span class=\"fn\">sum</span>((cur_counts\
      \ - ref_counts) * np.<span class=\"fn\">log</span>(cur_counts / ref_counts))\n\
      <span class=\"kw\">return</span> <span class=\"fn\">float</span>(psi)\n\nref_data\
      \ = np.random.<span class=\"fn\">normal</span>(loc=<span class=\"num\">50</span>,\
      \ scale=<span class=\"num\">10</span>, size=<span class=\"num\">1000</span>)\n\
      prod_data_drifted = np.random.<span class=\"fn\">normal</span>(loc=<span class=\"\
      num\">65</span>, scale=<span class=\"num\">12</span>, size=<span class=\"num\"\
      >1000</span>)\npsi_score = <span class=\"fn\">compute_population_stability_index</span>(ref_data,\
      \ prod_data_drifted)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
      Computed Feature PSI Drift Score: {psi_score:.4f} - {'</span>⚠️ DRIFT DETECTED<span\
      \ class=\"str\">' if psi_score &gt;= 0.25 else '</span>✅ STABLE<span class=\"\
      str\">'}\"</span>)"
