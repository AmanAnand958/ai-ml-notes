    solution_code: "import numpy as np\nimport torch\nnp.random.seed(42)\ntorch.manual_seed(42)\n\
      import pandas as pd\nimport numpy as np\n\ndef compute_population_stability_index(reference:\
      \ np.ndarray, current: np.ndarray, num_bins: int = 10) -> float:\n    \"\"\"\
      \n    Computes Population Stability Index (PSI) to detect feature distribution\
      \ drift.\n    PSI = 0.25: Significant Drift\n    \"\"\"\n    quantiles = np.linspace(0,\
      \ 100, num_bins + 1)\n    bins = np.percentile(reference, quantiles)\n    bins[0],\
      \ bins[-1] = -np.inf, np.inf\n    \n    ref_counts = np.histogram(reference,\
      \ bins=bins)[0] / len(reference)\n    cur_counts = np.histogram(current, bins=bins)[0]\
      \ / len(current)\n    \n    # Avoid zero division\n    ref_counts = np.where(ref_counts\
      \ == 0, 0.0001, ref_counts)\n    cur_counts = np.where(cur_counts == 0, 0.0001,\
      \ cur_counts)\n    \n    psi = np.sum((cur_counts - ref_counts) * np.log(cur_counts\
      \ / ref_counts))\nreturn float(psi)\n\nref_data = np.random.normal(loc=50, scale=10,\
      \ size=1000)\nprod_data_drifted = np.random.normal(loc=65, scale=12, size=1000)\n\
      psi_score = compute_population_stability_index(ref_data, prod_data_drifted)\n\
      print(f\"Computed Feature PSI Drift Score: {psi_score:.4f} - {'⚠️ DRIFT DETECTED'\
      \ if psi_score >= 0.25 else '✅ STABLE'}\")"
