  quizzes:
  - num_str: QUESTION 1 OF 4
    question: In MLflow, what is the difference between Parameters, Metrics, and Artifacts?
    qid: q171_1
    options:
    - letter: A
      text: Parameters are hyperparameters logged at run start; Metrics are numerical scalars tracked over epochs; Artifacts are ...
      is_correct: true
      id: a
    - letter: B
      text: Parameters are model weights; Metrics are user names; Artifacts are error logs.
      is_correct: false
      id: b
    - letter: C
      text: They are three names for the same integer variable.
      is_correct: false
      id: c
    - letter: D
      text: Parameters only apply to databases.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! MLflow categorizes experiment metadata into configuration inputs (parameters), scalar time-series (metrics), and binary outputs (artifacts). This pattern ensures mathematical consistency, minimizes runtime latency, and adheres to production-grade engineering standards.
    wrong_fb: ❌ Incorrect. Understanding parameter/metric/artifact separation is foundational for structured experiment tracking in MLflow. In enterprise systems, selecting this alternative introduces subtle edge-case failures, unhandled memory overhead, or degraded precision.
    correct: a
  - num_str: QUESTION 2 OF 4
    question: What backend architecture is recommended for production MLflow Tracking Servers?
    qid: q171_2
    options:
    - letter: A
      text: A managed SQL database (e.g. Amazon RDS PostgreSQL) for metadata tracking combined with an S3 bucket for artifact sto...
      is_correct: true
      id: a
    - letter: B
      text: A local SQLite file stored in a shared folder.
      is_correct: false
      id: b
    - letter: C
      text: A plain text notepad file on a desktop computer.
      is_correct: false
      id: c
    - letter: D
      text: Storing all artifacts in browser localStorage.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Separating relational metadata into SQL and large binaries into cloud object storage ensures scalability across thousands of runs. This pattern ensures mathematical consistency, minimizes runtime latency, and adheres to production-grade engineering standards.
    wrong_fb: ❌ Incorrect. Enterprise MLflow deployments use SQL databases for relational metadata and object stores (S3/GCS) for large artifacts. In enterprise systems, selecting this alternative introduces subtle edge-case failures, unhandled memory overhead, or degraded precision.
    correct: a
  - num_str: QUESTION 3 OF 4
