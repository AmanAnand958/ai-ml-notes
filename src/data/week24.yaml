  predict:
    question: Why use a hash of user_id instead of random() for traffic splitting?
    answer: Deterministic routing
    explanation: 'Deterministic consistency: Consistent hashing ensures a specific
      user is always routed to the identical model variant (Canary or Baseline) on
      repeated queries throughout their session.'
    code: "import numpy as np\nfrom scipy import stats\n\ndef evaluate_ab_test_significance(\n\
      \    conversions_a: int, impressions_a: int,\n    conversions_b: int, impressions_b:\
      \ int,\n    alpha: float = 0.05\n) -> dict:\n    p_a = conversions_a / impressions_a\n\
      \    p_b = conversions_b / impressions_b\n    p_pool = (conversions_a + conversions_b)\
      \ / (impressions_a + impressions_b)\n    \n    se = np.sqrt(p_pool * (1 - p_pool)\
      \ * (1/impressions_a + 1/impressions_b))\n    z_stat = (p_b - p_a) / se\n  \
      \  p_value = 2 * (1 - stats.norm.cdf(abs(z_stat)))\n    \n    return {\n   \
      \     \"conversion_rate_a\": round(p_a, 4),\n        \"conversion_rate_b\":\
      \ round(p_b, 4),\n        \"z_statistic\": round(z_stat, 4),\n        \"p_value\"\
      : round(p_value, 5),\n        \"statistically_significant\": p_value < alpha\n\
      \    }\n\nif __name__ == \"__main__\":\n    res = evaluate_ab_test_significance(850,\
      \ 10000, 980, 10000)\n    assert res[\"statistically_significant\"] is True"
