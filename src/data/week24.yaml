  theory_html: |-
    <h3 class="sh3">2. Mathematical Formulation: Kolmogorov-Smirnov &amp; Population Stability Index (PSI)</h3><p>Evidently AI and production drift monitors evaluate continuous feature distributions using the two-sample <strong>Kolmogorov-Smirnov (KS) test</strong> and <strong>Population Stability Index (PSI)</strong>:</p><p>Where $F(x)$ represents the empirical cumulative distribution function (eCDF). If $p\text{-value} &lt; \alpha = 0.05$, the null hypothesis that reference and current samples originate from identical distributions is rejected.</p><p>For categorical or binned continuous features, the <strong>Population Stability Index (PSI)</strong> quantifies total distribution shift:</p><p>Where $P_b$ is the proportion of current samples in bin $b$, and $Q_b$ is the proportion in baseline reference bin $b$.</p><div class="callout ci">
    <strong>PSI Operational Interpretation Thresholds:</strong>
    <ul>
    <li>$\text{PSI} &lt; 0.10$: <strong>No Significant Shift</strong> — Model predictions remain stable; no action required.</li>
    <li>$0.10 \le \text{PSI} &lt; 0.25$: <strong>Moderate Shift</strong> — Increased telemetry warning; queue automated retraining.</li>
    <li>$\text{PSI} \ge 0.25$: <strong>Severe Drift</strong> — Immediate automated alert; trigger circuit breaker or rollback to baseline model.</li>
    </ul>
    </div><h3 class="sh3">Production Engineering Walkthrough: Model &amp; Data Drift Monitoring with Evidently AI</h3><p>
