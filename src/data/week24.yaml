      # Day 174 Task 1 Solution: Apache Airflow DAG Definition for ML Pipeline
      class AirflowDAGSimulator:
          def __init__(self, dag_id: str):
              self.dag_id = dag_id
              self.tasks = {}
              self.dependencies = []

          def add_task(self, task_id: str):
              self.tasks[task_id] = "REGISTERED"

          def set_dependency(self, upstream: str, downstream: str):
              self.dependencies.append((upstream, downstream))

      dag = AirflowDAGSimulator("ml_training_pipeline_v1")
      dag.add_task("extract_data")
      dag.add_task("preprocess_features")
      dag.add_task("train_model")
      dag.set_dependency("extract_data", "preprocess_features")
