  hinglish: Git 100GB datasets handle nahi kar sakta. DVC actual datasets ko S3 mein sync karta hai aur Git mein sirf chote `.dvc` pointer files track karta hai, jisse code aur data ka exact version lock ho jata hai.
  analogy: 'DVC (Data Version Control) is like a coat-check ticket: Git tracks the small paper claim ticket (.dvc file with SHA256 hash), while the actual heavy winter coat (100GB dataset) sits safely in the secure warehouse cloakroom (S3).'
  theory_html: "<h3 class=\"sh3\">Mathematical Formulation &amp; Performance Bounds</h3><div class=\"math-block\">\n$$ \\text{StorageSize} = \\text{Size}_{base} + \\sum_{v \\in \\text{versions}} \\text{Size}_{\\Delta v} $$\n<p class=\"math-caption\">DVC storage efficiency via content-addressable deduplication across dataset versions.</p>\n</div><p>\nThis optimization metric balances raw computational throughput against per-token GPU memory consumption and cluster financial cost.\n</p><h3 class=\"sh3\">Production Engineering Walkthrough: Data Version Control (DVC) &amp; Dataset Lineage</h3><p>\nThe following production implementation demonstrates the core architecture, defensive error handling, and telemetry integration required for **Data Version Control (DVC) &amp; Dataset Lineage** in enterprise production systems:\n</p><div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — production_day_173_implementation.py</span><div class=\"cb-btns\"><button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\"># Day 173 — Production DVC Dataset &amp; Model Version Manager\nimport subprocess, json, logging, os, hashlib\nfrom typing import Dict, Any, Optional, List\nfrom pathlib import Path\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"DVCManager\")\n\nclass DVCDataVersionManager:\n    \"\"\"\n    Production DVC wrapper for dataset and model artifact versioning.\n    Tracks data lineage: raw → processed → train/val/test splits → model.\n    \"\"\"\n\n    def __init__(self, repo_root: str = \".\", remote_name: str = \"storage\"):\n        self.root = Path(repo_root)\n        self.remote = remote_name\n\n    def _run(self, *args: str) -&gt; subprocess.CompletedProcess:\n        result = subprocess.run([\"dvc\", *args], capture_output=True, text=True, cwd=self.root)\n        if result.returncode != 0:\n            logger.error(f\"\
    dvc {' '.join(args)}: {result.stderr}\")\n        return result\n\n    def track(self, path: str) -&gt; bool:\n        \"\"\"Add file/directory to DVC tracking.\"\"\"\n        r = self._run(\"add\", path)\n        if r.returncode == 0:\n            logger.info(f\"DVC tracking: {path}\")\n            # Auto-stage .dvc file\n            dvc_file = f\"{path}.dvc\"\n            subprocess.run([\"git\", \"add\", dvc_file, \".gitignore\"], capture_output=True, cwd=self.root)\n        return r.returncode == 0\n\n    def push(self) -&gt; bool:\n        r = self._run(\"push\", \"--remote\", self.remote)\n        logger.info(f\"DVC push: {'OK' if r.returncode == 0 else 'FAILED'}\")\n        return r.returncode == 0\n\n    def pull(self, path: Optional[str] = None) -&gt; bool:\n        args = [\"pull\", \"--remote\", self.remote]\n        if path:\n            args.append(path)\n        r = self._run(*args)\n        logger.info(f\"DVC pull {path or 'all'}: {'OK' if r.returncode == 0 else 'FAILED'}\"\
    )\n        return r.returncode == 0\n\n    def file_checksum(self, path: str) -&gt; str:\n        \"\"\"Compute SHA-256 of a file for integrity verification.\"\"\"\n        sha256 = hashlib.sha256()\n        with open(path, \"rb\") as f:\n            for chunk in iter(lambda: f.read(65536), b\"\"):\n                sha256.update(chunk)\n        return sha256.hexdigest()\n\n    def log_dataset_metadata(self, path: str, description: str,\n                               n_samples: int, splits: Dict[str, int]) -&gt; None:\n        \"\"\"Write a human-readable dataset card alongside the .dvc file.\"\"\"\n        card = {\n            \"path\": path, \"description\": description,\n            \"n_samples\": n_samples, \"splits\": splits,\n            \"checksum\": self.file_checksum(path) if os.path.isfile(path) else \"N/A\",\n        }\n        card_path = f\"{path}.meta.json\"\n        with open(card_path, \"w\") as f:\n            json.dump(card, f, indent=2)\n        logger.info(f\"Dataset\
    \ card written: {card_path}\")\n\n    def reproduce(self) -&gt; bool:\n        \"\"\"Re-run all DVC pipeline stages from dvc.yaml.\"\"\"\n        r = self._run(\"repro\", \"--force\")\n        logger.info(f\"Pipeline reproduced: {'OK' if r.returncode == 0 else 'FAILED'}\")\n        return r.returncode == 0\n\nif __name__ == \"__main__\":\n    print(\"DVCDataVersionManager: Requires dvc + git initialized repo\")\n    print(\"Flow: dvc add data/ → git commit → dvc push (to S3/GCS/Azure)\")\n    # Simulate checksum\n    import tempfile, os\n    with tempfile.NamedTemporaryFile(delete=False, mode='w') as f:\n        f.write(\"sample dataset content\")\n        tmp = f.name\n    mgr = DVCDataVersionManager()\n    cksum = mgr.file_checksum(tmp)\n    print(f\"Checksum of sample file: {cksum[:16]}...\")\n    assert len(cksum) == 64  # SHA-256 hex = 64 chars\n    os.unlink(tmp)\n    print(\"DVCDataVersionManager: OK\")\n</code></pre>\n</div>\n"
