  - front: 'Core concept: What is the significance of dvc repro in Data Version Control (DVC) & Dataset Lineage?'
    back: • Runs the full pipeline defined in dvc.<br/>• yaml, skipping stages whose dependencies haven't changed (like Makefile).
  - front: 'Core concept: What is the significance of dvc checkout in Data Version Control (DVC) & Dataset Lineage?'
    back: "After\n         \n          git checkout\n         \n         to an old commit,\n         \n          dvc checkout\n         \n         restores the data files that match that commit's\n         \n          .dvc\n         \n         pointers."
  - front: How is Data Version Control (DVC) & Dataset Lineage tested and validated in industrial ML pipelines (Day 173)?
    back: • Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.<br/>• allclose at 1e-5), and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Data Version Control (DVC) & Dataset Lineage in distributed systems?'
    back: • Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
