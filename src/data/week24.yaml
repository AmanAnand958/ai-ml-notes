    solution_code: 'import mlflow

      from mlflow import MlflowClient


      client = MlflowClient(tracking_uri="http://localhost:5000")

      model_name = "CustomerChurnRF"

      # Assign modern model aliases (@challenger, @champion)

      latest_versions = client.get_latest_versions(model_name)

      latest_v = latest_versions[0].version


      client.set_model_version_alias(name=model_name, alias="challenger", version=latest_v)

      print(f"Model {model_name} version {latest_v} tagged as @challenger")


      # Load model using production @champion alias

      champion_model = mlflow.pyfunc.load_model(f"models:/{model_name}@champion")

      print("Successfully loaded @champion model for real-time inference.")

      assert champion_model is not None, "champion_model should not be None"'
