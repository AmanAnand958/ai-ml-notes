            logger.info(f"Data drift report: {drifted:.1%} of columns drifted → {output_path}")
            return {"drifted_share": drifted, "report_path": output_path, "alert": drifted &gt; 0.2}

        def model_performance_report(self, current_df, report_name: str = "performance") -&gt; Dict[str, Any]:
            from evidently.report import Report
