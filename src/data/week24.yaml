  analogy: 'Drift monitoring with PSI and KS-tests is like a water purity sensor on a municipal water reservoir: it sounds an alarm the moment mineral concentrations or pH levels shift before contaminated water reaches household taps.'
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">1. Model &amp; Data Drift Monitoring: PSI &amp; KS-Tests</h3>\n<p>\nReal-world data is non-stationary: macroeconomic conditions change, consumer preferences evolve, and input sensors drift.\n</p>\n<p>\nThe <strong>Population Stability Index (PSI)</strong> quantifies distribution shifts between baseline training data and live inference data:\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\">import numpy as np\n\ndef calculate_psi(expected: np.ndarray, actual: np.ndarray, num_buckets: int = 10) -&gt; float:\n    \"\"\"\n    Computes Population Stability Index (PSI) across reference and production distributions.\n    \"\"\"\n    # Generate quantile bin edges from reference distribution\n    percentiles = np.linspace(0, 100, num_buckets\
    \ + 1)\n    bin_edges = np.percentile(expected, percentiles)\n    bin_edges[0] -= 1e-5\n    bin_edges[-1] += 1e-5\n    \n    # Calculate bucket frequencies\n    exp_counts, _ = np.histogram(expected, bins=bin_edges)\n    act_counts, _ = np.histogram(actual, bins=bin_edges)\n    \n    # Convert to proportions with smoothing\n    exp_pct = (exp_counts / len(expected)) + 1e-5\n    act_pct = (act_counts / len(actual)) + 1e-5\n    \n    psi_value = np.sum((act_pct - exp_pct) * np.log(act_pct / exp_pct))\n    return float(psi_value)</code></pre>\n</div>\n<h3 class=\"sh3\">Engineering Decision Matrix: General Production Trade-offs</h3>\n<div style=\"overflow-x:auto;\">\n<table style=\"width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px; text-align:left;\">\n<thead>\n<tr style=\"border-bottom:2px solid var(--border); background:var(--bg-secondary);\">\n<th style=\"padding:10px;\">Architecture Strategy</th>\n<th style=\"padding:10px;\">Upfront Cost</th>\n<th style=\"padding:10px;\"\
    >Maintenance</th>\n<th style=\"padding:10px;\">Scalability</th>\n<th style=\"padding:10px;\">Time-to-Market</th>\n</tr>\n</thead>\n<tbody>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Monolithic MVP</strong></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span> (Initially)</td>\n<td style=\"padding:10px;\">Poor</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Fast</span> (&lt; 1 week)</td>\n</tr>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Microservices</strong></td>\n<td style=\"padding:10px;\"\
    ><span style=\"color:var(--orange);\">High</span></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--orange);\">High</span></td>\n<td style=\"padding:10px;\">Excellent</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--red);\">Slow</span> (Months)</td>\n</tr>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Serverless Functions</strong></td>\n<td style=\"padding:10px;\">Medium</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span></td>\n<td style=\"padding:10px;\">Infinite</td>\n<td style=\"padding:10px;\">Medium</td>\n</tr>\n</tbody>\n</table>\n</div>\n<h3 class=\"sh3\">Mathematical Formulation &amp; Performance Bounds</h3>\n<div class=\"math-block\">\n$$ D_{KS} = \\sup_x |F_{\\text{reference}}(x) - F_{\\text{current}}(x)| &gt; \\alpha $$\n<p class=\"math-caption\"\
    >Kolmogorov-Smirnov test statistic used by Evidently AI for numerical feature drift detection.</p>\n</div>\n<p>\nThis optimization metric balances raw computational throughput against per-token GPU memory consumption and cluster financial cost.\n</p>\n<div class=\"diagram-container\" style=\"background:var(--bg3); padding:1rem; border-radius:8px; margin:1rem 0; border:1px solid var(--border);\">\n<p><strong>System Execution Flowchart: Model &amp; Data Drift Monitoring with Evidently AI</strong></p>\n<div class=\"mermaid\">\ngraph LR\n    Input[\"1. Client Ingress Request\"] --&gt; Validate[\"2. Schema Validation &amp; Guardrails\"]\n    Validate --&gt; Pipeline[\"3. Core Computational Engine\"]\n    Pipeline --&gt; Cache[\"4. High-Speed Cache &amp; Telemetry\"]\n    Cache --&gt; Egress[\"5. Verified Output Response\"]\n</div>\n</div>\n<h3 class=\"sh3\">Production Engineering Walkthrough: Model &amp; Data Drift Monitoring with Evidently AI</h3>\n<p>\nThe following production snippet demonstrates\
    \ the foundational design pattern, error handling strategies, and telemetry hooks required when deploying <strong>Model &amp; Data Drift Monitoring with Evidently AI</strong> in high-throughput enterprise systems:\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — production_day_175_implementation.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\"># Day 175 — Production Evidently AI Monitoring Suite\nimport logging, numpy as np\nfrom typing import Dict, Any, List, Optional\nfrom dataclasses import dataclass\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"EvidentlyMonitor\")\n\nclass EvidentlyMLMonitor:\n    \"\"\"\n    Production Evidently AI monitoring wrapper:\n    Data drift + target drift + model performance reports.\n    Generates HTML reports and JSON summaries for dashboards.\n\
    \    \"\"\"\n\n    def __init__(self, reference_df, model_name: str = \"production_model\",\n                 output_dir: str = \"./monitoring_reports\"):\n        from evidently import ColumnMapping\n        import os\n        self.ref = reference_df\n        self.model_name = model_name\n        self.output_dir = output_dir\n        os.makedirs(output_dir, exist_ok=True)\n        self.column_mapping = None\n\n    def set_column_mapping(self, target: str, prediction: str,\n                            numerical_features: List[str], categorical_features: List[str]) -&gt; None:\n        from evidently import ColumnMapping\n        self.column_mapping = ColumnMapping(\n            target=target, prediction=prediction,\n            numerical_features=numerical_features, categorical_features=categorical_features\n        )\n\n    def data_drift_report(self, current_df, report_name: str = \"drift\") -&gt; Dict[str, Any]:\n        from evidently.report import Report\n        from evidently.metric_preset\
    \ import DataDriftPreset\n        report = Report(metrics=[DataDriftPreset(stattest_threshold=0.05)])\n        report.run(reference_data=self.ref, current_data=current_df,\n                   column_mapping=self.column_mapping)\n        output_path = f\"{self.output_dir}/{report_name}.html\"\n        report.save_html(output_path)\n        result = report.as_dict()\n        drifted = result[\"metrics\"][0][\"result\"][\"share_of_drifted_columns\"]\n        logger.info(f\"Data drift report: {drifted:.1%} of columns drifted → {output_path}\")\n        return {\"drifted_share\": drifted, \"report_path\": output_path, \"alert\": drifted &gt; 0.2}\n\n    def model_performance_report(self, current_df, report_name: str = \"performance\") -&gt; Dict[str, Any]:\n        from evidently.report import Report\n        from evidently.metric_preset import ClassificationPreset\n        report = Report(metrics=[ClassificationPreset()])\n        report.run(reference_data=self.ref, current_data=current_df,\n\
    \                   column_mapping=self.column_mapping)\n        output_path = f\"{self.output_dir}/{report_name}.html\"\n        report.save_html(output_path)\n        result = report.as_dict()\n        f1 = result[\"metrics\"][0][\"result\"].get(\"current\", {}).get(\"f1\", 0)\n        logger.info(f\"Performance report: F1={f1:.3f} → {output_path}\")\n        return {\"f1\": f1, \"report_path\": output_path, \"degraded\": f1 &lt; 0.75}\n\nif __name__ == \"__main__\":\n    print(\"EvidentlyMLMonitor: Requires evidently + pandas\")\n    # Simulate drift detection without full Evidently\n    import numpy as np\n    ref = np.random.normal(0, 1, 5000)\n    current_stable = np.random.normal(0, 1, 1000)\n    current_drifted = np.random.normal(2.5, 1.5, 1000)\n    from scipy.stats import ks_2samp\n    _, p_stable = ks_2samp(ref, current_stable)\n    _, p_drifted = ks_2samp(ref, current_drifted)\n    print(f\"Stable current: KS p={p_stable:.4f} ({'PASS' if p_stable &gt; 0.05 else 'DRIFT'})\"\
    )\n    print(f\"Drifted current: KS p={p_drifted:.4f} ({'PASS' if p_drifted &gt; 0.05 else 'DRIFT'})\")\n    assert p_drifted &lt; p_stable\n    print(\"EvidentlyMLMonitor: OK\")\n</code></pre>\n</div>\n<h3 class=\"sh3\">Canary &amp; Shadow Traffic Routing for ML Models</h3>\n<p>\nDeploying a new model candidate directly to 100% traffic risks catastrophic downstream failures. Production MLOps employs:\n- <strong>Shadow Deployments:</strong> Ingress router mirrors 100% of live traffic to the candidate model; candidate predictions are logged for telemetry but not returned to clients.\n- <strong>Canary Rollouts:</strong> Routes 5% of live traffic to candidate model, monitoring error rates and latency percentiles before gradual promotion.\n</p>\n"
  predict:
    question: What Population Stability Index (PSI) drift status string is returned for these binned reference vs target distributions?
    answer: Significant Drift
    explanation: The computed PSI is 0.285 (> 0.20 threshold), which flags a statistically significant population distribution shift requiring retraining.
    code: |-
      import numpy as np

      def compute_psi(ref_dist: np.ndarray, target_dist: np.ndarray) -> float:
          """PSI = sum((Actual% - Expected%) * ln(Actual% / Expected%))"""
          ref_norm = ref_dist / np.sum(ref_dist)
          tar_norm = target_dist / np.sum(target_dist)
          eps = 1e-6
          psi = np.sum((tar_norm - ref_norm) * np.log((tar_norm + eps) / (ref_norm + eps)))
          return float(psi)

      def classify_drift(psi_val: float) -> str:
          if psi_val < 0.10: return "Stable"
          elif psi_val < 0.20: return "Moderate Drift"
          return "Significant Drift"

      ref = np.array([0.40, 0.30, 0.20, 0.10])
      target = np.array([0.15, 0.20, 0.35, 0.30])
      psi_score = compute_psi(ref, target)
      print(classify_drift(psi_score))
