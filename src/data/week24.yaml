    question: What critical problem does a Feature Store (e.g. Feast, Tecton) solve
      in enterprise ML?
    qid: q173_1
    options:
    - letter: A
      text: Train-serve skew, by ensuring identical feature engineering logic and
        consistent point-in-time correct data across training and low-latency inference.
      is_correct: true
    - letter: B
      text: It provides a graphical user interface for playing video games.
      is_correct: false
    - letter: C
      text: It eliminates the need for machine learning algorithms.
      is_correct: false
    - letter: D
      text: It makes databases 100% free of charge.
      is_correct: false
    correct_fb: ✅ Correct! Feature stores bridge the gap between offline batch analytics
      and online low-latency key-value feature retrieval.
    wrong_fb: ❌ Incorrect. Feature stores prevent train-serve skew and enable feature
      sharing across disparate models.
  - num_str: QUESTION 2 OF 4
    question: What is 'Point-in-Time Correctness' (Time-Travel Joins) in feature engineering?
    qid: q173_2
    options:
    - letter: A
      text: Joining features as they existed at the exact historical timestamp of
        each training label, preventing future data leakage.
      is_correct: true
    - letter: B
      text: Changing the system clock on the server.
      is_correct: false
    - letter: C
      text: Predicting timestamps into the next decade.
      is_correct: false
    - letter: D
      text: Deleting features that are older than 1 day.
      is_correct: false
    correct_fb: ✅ Correct! Time-travel joins prevent target leakage by ensuring training
      sets only contain information available before the prediction event.
    wrong_fb: ❌ Incorrect. Point-in-time joins reconstruct historical feature values
      precisely as they existed at label generation time.
  - num_str: QUESTION 3 OF 4
    question: In Feast feature store architecture, what is the difference between
      the Offline Store and Online Store?
    qid: q173_3
    options:
    - letter: A
      text: The Offline store (Snowflake/BigQuery) handles high-throughput historical
        batch extraction; the Online store (Redis/DynamoDB) handles sub-10ms real-time
        feature lookup.
      is_correct: true
    - letter: B
      text: The Offline store is disconnected from power; the Online store is connected.
      is_correct: false
    - letter: C
      text: The Offline store is for images; the Online store is for text.
      is_correct: false
    - letter: D
      text: There is no difference.
      is_correct: false
    correct_fb: ✅ Correct! Offline stores scale for petabyte batch analytics; online
      stores provide low-latency key-value serving for live inference.
    wrong_fb: ❌ Incorrect. Dual-store architecture balances scalable analytical training
      queries with ultra-fast real-time inference retrieval.
  - num_str: QUESTION 4 OF 4
    question: What is 'Train-Serve Skew' in machine learning operations?
    qid: q173_4
    options:
    - letter: A
      text: Discrepancies in data transformations or feature definitions between the
        offline training environment and online production serving.
      is_correct: true
    - letter: B
      text: A model that trains on a crooked monitor.
      is_correct: false
    - letter: C
      text: A training run that finishes too quickly.
      is_correct: false
    - letter: D
      text: A server with uneven network cables.
      is_correct: false
    correct_fb: ✅ Correct! Inconsistent preprocessing logic between training code
      and production endpoints is a leading cause of production accuracy collapse.
    wrong_fb: ❌ Incorrect. Train-serve skew occurs when feature computation pipelines
      differ between offline training and live serving.
  flashcards:
