  analogy: 'DVC (Data Version Control) is like a coat-check ticket: Git tracks the small paper claim ticket (.dvc file with SHA256 hash), while the actual heavy winter coat (100GB dataset) sits safely in the secure warehouse cloakroom (S3).'
  theory_html: |
    <h2 class="sh2">🧠 Theory &amp; Concepts</h2>
    <h3 class="sh3">1. Why Git Fails on Large ML Datasets</h3>
    <p>
    Git is an immutable Content-Addressable Storage (CAS) engine designed for textual source code. Storing 50GB binary datasets or multi-gigabyte PyTorch weights (<code>model.safetensors</code>) inside Git repositories causes severe performance collapse: cloning times stretch to hours, local <code>.git</code> repository folders swell into hundreds of gigabytes, and delta compression fails on binary blobs.
    </p>
    <p>
    <strong>Data Version Control (DVC)</strong> decouples the <strong>metadata pointer</strong> from the <strong>raw binary payload</strong>:
    </p>
    <div style="margin: 1.5rem 0; text-align: center;">
    <svg aria-label="DVC Architecture Diagram" height="240" style="max-width: 100%; height: auto; font-family: var(--font-mono, monospace);" viewbox="0 0 680 240" width="680" xmlns="http://www.w3.org/2000/svg">
    <rect fill="#0f172a" height="220" rx="10" stroke="#334155" stroke-width="2" width="660" x="10" y="10"></rect>
    <text fill="#f59e0b" font-size="13" font-weight="bold" x="25" y="35">DVC (Data Version Control) Two-Tier Storage Architecture</text>
    <!-- Left: Git Repository -->
    <rect fill="#1e293b" height="155" rx="8" stroke="#38bdf8" stroke-width="1.5" width="280" x="30" y="55"></rect>
    <text fill="#60a5fa" font-size="12" font-weight="bold" x="45" y="80">Git Repository (Local &amp; GitHub)</text>
    <text fill="#f8fafc" font-size="10.5" x="45" y="105">📄 train.py (Source Code)</text>
    <text fill="#facc15" font-size="10.5" x="45" y="130">📄 data.dvc (Small Pointer File)</text>
    <text fill="#94a3b8" font-size="9" x="55" y="150">md5: 8f4e2b10a9c3...</text>
    <text fill="#94a3b8" font-size="9" x="55" y="165">size: 52428800000 (50GB)</text>
    <text fill="#ef4444" font-size="9.5" x="45" y="190">🚫 raw_data/ added to .gitignore</text>
    <!-- Bidirectional Arrow -->
    <path d="M 310 130 L 370 130" stroke="#f59e0b" stroke-dasharray="4" stroke-width="2"></path>
    <text fill="#fbbf24" font-size="10" x="315" y="120">dvc push/pull</text>
    <!-- Right: DVC Remote Storage -->
    <rect fill="#1e293b" height="155" rx="8" stroke="#10b981" stroke-width="1.5" width="280" x="370" y="55"></rect>
    <text fill="#34d399" font-size="12" font-weight="bold" x="385" y="80">DVC Remote (AWS S3 / GCS)</text>
    <text fill="#f8fafc" font-size="10.5" x="385" y="105">📦 s3://bucket/dvcstore/8f/4e2b10...</text>
    <text fill="#cbd5e1" font-size="9.5" x="385" y="135">Content-Addressable Storage (CAS)</text>
    <text fill="#94a3b8" font-size="9" x="385" y="155">Deduplicated across experiments</text>
    <text fill="#94a3b8" font-size="9" x="385" y="175">Fast chunked parallel multi-part upload</text>
    </svg>
    <div class="diagram-cap">Figure 173.1: DVC Architecture separating Git metadata pointers from S3 Content-Addressable Storage.</div>
    </div>
    <h3 class="sh3">Engineering Decision Matrix: General Production Trade-offs</h3>
    <div style="overflow-x:auto;">
    <table style="width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px; text-align:left;">
    <thead>
    <tr style="border-bottom:2px solid var(--border); background:var(--bg-secondary);">
    <th style="padding:10px;">Architecture Strategy</th>
    <th style="padding:10px;">Upfront Cost</th>
    <th style="padding:10px;">Maintenance</th>
    <th style="padding:10px;">Scalability</th>
    <th style="padding:10px;">Time-to-Market</th>
    </tr>
    </thead>
    <tbody>
    <tr onmouseout="this.style.background='transparent'" onmouseover="this.style.background='var(--bg-secondary)'" style="border-bottom:1px solid var(--border); transition: background 0.2s;">
    <td style="padding:10px;"><strong>Monolithic MVP</strong></td>
    <td style="padding:10px;"><span style="color:var(--green);">Low</span></td>
    <td style="padding:10px;"><span style="color:var(--green);">Low</span> (Initially)</td>
    <td style="padding:10px;">Poor</td>
    <td style="padding:10px;"><span style="color:var(--green);">Fast</span> (&lt; 1 week)</td>
    </tr>
    <tr onmouseout="this.style.background='transparent'" onmouseover="this.style.background='var(--bg-secondary)'" style="border-bottom:1px solid var(--border); transition: background 0.2s;">
    <td style="padding:10px;"><strong>Microservices</strong></td>
    <td style="padding:10px;"><span style="color:var(--orange);">High</span></td>
