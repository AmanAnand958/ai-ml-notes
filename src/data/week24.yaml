    - letter: B
      text: Running 10 Docker containers on 10 different computers.
      is_correct: false
    - letter: C
      text: Building a physical stage for a presentation.
      is_correct: false
    - letter: D
      text: Writing Dockerfiles in multiple programming languages.
      is_correct: false
    correct_fb: ✅ Correct! Multi-stage builds dramatically reduce final image sizes
      (from 15GB to &lt;2GB) by discarding build-time compilers and dev headers.
    wrong_fb: ❌ Incorrect. Multi-stage builds isolate build-time dependencies, producing
      lightweight, secure production images.
  - num_str: QUESTION 2 OF 4
    question: Why should GPU Docker images use NVIDIA Container Toolkit (nvidia-docker)?
    qid: q176_2
    options:
    - letter: A
      text: It exposes underlying host NVIDIA GPU drivers and CUDA hardware directly
        to containerized PyTorch/vLLM applications.
      is_correct: true
    - letter: B
      text: It converts GPU code into CPU instructions.
      is_correct: false
    - letter: C
      text: It deletes the host operating system.
      is_correct: false
    - letter: D
      text: It speeds up hard drive write speeds.
      is_correct: false
    correct_fb: ✅ Correct! The NVIDIA Container Toolkit mounts kernel drivers and
      GPU device nodes into container namespaces.
    wrong_fb: ❌ Incorrect. The toolkit enables containerized runtimes to access host
      GPU accelerators seamlessly.
  - num_str: QUESTION 3 OF 4
    question: What is the primary security vulnerability of running Docker containers
      as the `root` user in production?
    qid: q176_3
    options:
    - letter: A
      text: Container breakout vulnerabilities could grant an attacker full administrative
        control over the host server operating system.
      is_correct: true
    - letter: B
      text: The container runs out of memory faster.
      is_correct: false
    - letter: C
      text: The container cannot access the internet.
      is_correct: false
    - letter: D
      text: The container changes font sizes.
      is_correct: false
    correct_fb: ✅ Correct! Running containers with dedicated non-root user accounts
      enforces least-privilege security and prevents privilege escalation.
    wrong_fb: ❌ Incorrect. Non-root execution prevents container escape vulnerabilities
      from compromising host systems.
  - num_str: QUESTION 4 OF 4
    question: How does Docker layer caching accelerate CI/CD build pipelines?
    qid: q176_4
    options:
    - letter: A
      text: Unchanged Dockerfile instructions (e.g. installing OS packages) are reused
        from cache, cutting build times from minutes to seconds.
      is_correct: true
    - letter: B
      text: It deletes all code before building.
      is_correct: false
    - letter: C
      text: It recompiles Python on every commit.
      is_correct: false
    - letter: D
      text: It runs tests on multiple computers.
      is_correct: false
    correct_fb: ✅ Correct! Ordering stable instructions (like requirements.txt installation)
      before dynamic application code maximizes cache reuse.
    wrong_fb: ❌ Incorrect. Layer caching avoids redundant dependency re-installation
      when only application code changes.
