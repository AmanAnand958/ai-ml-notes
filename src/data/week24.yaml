  quizzes:
  - question: What is the difference between Data Drift (Covariate Shift) and Concept
      Drift in production ML systems?
    options:
    - letter: A
      text: Data Drift changes the input feature distribution P(X); Concept Drift
        changes the statistical relationship between features and labels P(Y|X)
      is_correct: true
    - letter: B
      text: Data Drift occurs only in computer vision; Concept Drift occurs in NLP
      is_correct: false
    - letter: C
      text: Data Drift is caused by network latency; Concept Drift is caused by GPU
