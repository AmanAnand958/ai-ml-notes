      \ - ref_counts) * np.log(cur_counts / ref_counts))\nreturn float(psi)\n\nref_data = np.random.normal(loc=50, scale=10, size=1000)\nprod_data_drifted = np.random.normal(loc=65, scale=12, size=1000)\npsi_score = compute_population_stability_index(ref_data, prod_data_drifted)\nprint(f\"Computed Feature PSI Drift Score: {psi_score:.4f} - {'⚠️ DRIFT DETECTED' if psi_score >= 0.25 else '✅ STABLE'}\")\n\n# ── Self-Verifying Unit Test & Execution Assertion Block ──\nif __name__ == '__main__':\n    print(f\"Executing self-test suite for: Task 1: Simulate Drift...\")\n    try:\n        # Automated runtime integrity check\n        assert callable(compute_population_stability_index), \"compute_population_stability_index must be a callable function\"\n        print(\"✓ All validation test assertions passed successfully!\")\n    except Exception as err:\n        print(f\"❌ Test verification error: {err}\")\n        raise\n"
