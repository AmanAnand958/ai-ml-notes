  gotcha:
    title: '⚠️ Gotcha: Local File URI Storage in Distributed Training'
    description: Logging artifacts to local file paths (e.g. file:///tmp/mlruns) fails in distributed clusters because worker
      nodes cannot access the master node's local disk. Always configure an S3 or GCS artifact root URI..
