    prompt_html: "<p><strong>Scenario:</strong> Build an automated daily model retraining and evaluation DAG in Apache Airflow for a fraud detection system.</p>\n<p><strong>Requirements:</strong></p>\n<ul>\n  <li>Construct an Airflow DAG with tasks: <code>extract_data</code> $\to$ <code>validate_schema</code> $\to$ <code>train_model</code> $\to$ <code>eval_gate</code> $\to$ <code>promote_registry</code>.</li>\n  <li>Implement conditional branching: promote to <code>@champion</code> only if PR-AUC &gt; 0.92; trigger Slack alert if evaluation fails.</li>\n  <li>Configure automated retries with exponential backoff on task failures.</li>\n</ul>"
