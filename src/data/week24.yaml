      \ / len(current)\n    \n    # Avoid zero division\n    ref_counts = np.where(ref_counts\
      \ == 0, 0.0001, ref_counts)\n    cur_counts = np.where(cur_counts == 0, 0.0001,\
      \ cur_counts)\n    \n    psi = np.sum((cur_counts - ref_counts) * np.log(cur_counts\
      \ / ref_counts))\nreturn float(psi)\n\nref_data = np.random.normal(loc=50, scale=10,\
      \ size=1000)\nprod_data_drifted = np.random.normal(loc=65, scale=12, size=1000)\n\
      psi_score = compute_population_stability_index(ref_data, prod_data_drifted)\n\
      print(f\"Computed Feature PSI Drift Score: {psi_score:.4f} - {'⚠️ DRIFT DETECTED'\
