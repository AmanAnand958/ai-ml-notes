  hinglish: Jupyter notebook mein model train karne se parameters aur metrics kho jate hain. MLflow har training run ka learning rate, loss curves, confusion matrix aur model binary PostgreSQL aur S3 mein store karta hai taaki har experiment 100% reproducible rahe.
  analogy: 'MLflow experiment tracking is like a high-tech flight data recorder: it continuously logs airspeed, altitude, engine temperatures, and cockpit commands during every single flight for full post-flight analysis.'
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">1. MLflow Tracking Server Architecture</h3>\n<p>\nProduction MLOps requires centralizing experiment parameters, code git commits, metrics time-series, and model artifacts in a shared tracking server.\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> mlflow\n<span class=\"kw\">import</span> mlflow.sklearn\n<span class=\"kw\">from</span> sklearn.ensemble <span class=\"kw\">import</span> GradientBoostingClassifier\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> roc_auc_score, accuracy_score\n\n<span class=\"kw\">def</span> <span class=\"fn\">train_and_log_experiment</span>(X_train, y_train, X_val, y_val, params: dict):\n    mlflow.set_experiment(<span class=\"str\"\
    >\"fraud_detection_production\"</span>)\n    \n    <span class=\"kw\">with</span> mlflow.start_run(run_name=<span class=\"str\">\"gbdt_baseline_v1\"</span>):\n        <span class=\"cm\"># 1. Log Hyperparameters</span>\n        mlflow.log_params(params)\n        \n        <span class=\"cm\"># 2. Train Model</span>\n        model = GradientBoostingClassifier(**params)\n        model.fit(X_train, y_train)\n        \n        <span class=\"cm\"># 3. Evaluate &amp; Log Metrics</span>\n        preds = model.predict_proba(X_val)[:, <span class=\"num\">1</span>]\n        auc = roc_auc_score(y_val, preds)\n        mlflow.log_metric(<span class=\"str\">\"val_auc\"</span>, auc)\n        \n        <span class=\"cm\"># 4. Log Artifact with Signature</span>\n        mlflow.sklearn.log_model(\n            sk_model=model,\n            artifact_path=<span class=\"str\">\"model\"</span>,\n            registered_model_name=<span class=\"str\">\"fraud_detector\"</span>\n        )\n        print(f<span class=\"\
    str\">\"Run logged with Val AUC: {auc:.4f}\"</span>)</code></pre>\n</div>\n<h3 class=\"sh3\">Engineering Decision Matrix: General Production Trade-offs</h3>\n<div style=\"overflow-x:auto;\">\n<table style=\"width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px; text-align:left;\">\n<thead>\n<tr style=\"border-bottom:2px solid var(--border); background:var(--bg-secondary);\">\n<th style=\"padding:10px;\">Architecture Strategy</th>\n<th style=\"padding:10px;\">Upfront Cost</th>\n<th style=\"padding:10px;\">Maintenance</th>\n<th style=\"padding:10px;\">Scalability</th>\n<th style=\"padding:10px;\">Time-to-Market</th>\n</tr>\n</thead>\n<tbody>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Monolithic MVP</strong></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span></td>\n\
    <td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span> (Initially)</td>\n<td style=\"padding:10px;\">Poor</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Fast</span> (&lt; 1 week)</td>\n</tr>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Microservices</strong></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--orange);\">High</span></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--orange);\">High</span></td>\n<td style=\"padding:10px;\">Excellent</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--red);\">Slow</span> (Months)</td>\n</tr>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td\
    \ style=\"padding:10px;\"><strong>Serverless Functions</strong></td>\n<td style=\"padding:10px;\">Medium</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span></td>\n<td style=\"padding:10px;\">Infinite</td>\n<td style=\"padding:10px;\">Medium</td>\n</tr>\n</tbody>\n</table>\n</div>\n<h3 class=\"sh3\">Mathematical Formulation &amp; Performance Bounds</h3>\n<div class=\"math-block\">\n$$ \\text{ReproducibilityScore} = \\mathbb{I}(\\text{Hash}_{train} == \\text{Hash}_{orig}) \\cdot \\mathbb{I}(|M_{new} - M_{orig}| &lt; \\epsilon) $$\n<p class=\"math-caption\">Strict reproducibility definition requiring identical data hashes and model metrics within margin.</p>\n</div>\n<p>\nThis optimization metric balances raw computational throughput against per-token GPU memory consumption and cluster financial cost.\n</p>\n<div class=\"diagram-container\" style=\"background:var(--bg3); padding:1rem; border-radius:8px; margin:1rem 0; border:1px solid var(--border);\">\n<p><strong>System\
    \ Execution Flowchart: MLflow Experiment Tracking &amp; Metadata Logging</strong></p>\n<div class=\"mermaid\">\ngraph LR\n    Input[\"1. Client Ingress Request\"] --&gt; Validate[\"2. Schema Validation &amp; Guardrails\"]\n    Validate --&gt; Pipeline[\"3. Core Computational Engine\"]\n    Pipeline --&gt; Cache[\"4. High-Speed Cache &amp; Telemetry\"]\n    Cache --&gt; Egress[\"5. Verified Output Response\"]\n</div>\n</div>\n<h3 class=\"sh3\">Production Engineering Walkthrough: MLflow Experiment Tracking &amp; Metadata Logging</h3>\n<p>\nThe following production snippet demonstrates the foundational design pattern, error handling strategies, and telemetry hooks required when deploying <strong>MLflow Experiment Tracking &amp; Metadata Logging</strong> in high-throughput enterprise systems:\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — production_drift_detector.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n\
    <pre><code class=\"language-python\"># Day 171 — Production Statistical Drift Detector\nimport logging, numpy as np\nfrom typing import Dict, Any, List\nfrom scipy import stats\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"DriftDetector\")\n\nclass ProductionDriftDetector:\n    \"\"\"\n    Production drift monitoring:\n    - PSI (Population Stability Index) for feature distribution shift\n    - KS test for statistical distribution change\n    - Wasserstein distance for severity quantification\n    \"\"\"\n\n    PSI_BINS = 10\n    PSI_WARN, PSI_ALERT = 0.1, 0.2  # STABLE / WARNING / ALERT thresholds\n\n    def psi(self, ref: np.ndarray, prod: np.ndarray) -&gt; Dict[str, Any]:\n        _, bins = np.histogram(ref, bins=self.PSI_BINS)\n        ref_pct = (np.histogram(ref, bins=bins)[0] + 1e-8) / len(ref)\n        prod_pct = (np.histogram(prod, bins=bins)[0] + 1e-8) / len(prod)\n        value = float(np.sum((prod_pct\
    \ - ref_pct) * np.log(prod_pct / ref_pct)))\n        status = \"STABLE\" if value &lt; self.PSI_WARN else (\"WARNING\" if value &lt; self.PSI_ALERT else \"ALERT\")\n        return {\"psi\": round(value, 4), \"status\": status}\n\n    def ks_test(self, ref: np.ndarray, prod: np.ndarray, alpha: float = 0.05) -&gt; Dict[str, Any]:\n        stat, p = stats.ks_2samp(ref, prod)\n        return {\"ks_stat\": round(stat, 4), \"p_value\": round(p, 4), \"drifted\": p &lt; alpha}\n\n    def wasserstein(self, ref: np.ndarray, prod: np.ndarray) -&gt; float:\n        return round(float(stats.wasserstein_distance(ref, prod)), 4)\n\n    def monitor_features(self, ref_df, prod_df, features: List[str]) -&gt; Dict[str, Any]:\n        report, drifted = {}, []\n        for col in features:\n            r, p = ref_df[col].dropna().values, prod_df[col].dropna().values\n            psi_res = self.psi(r, p)\n            ks_res = self.ks_test(r, p)\n            w1 = self.wasserstein(r, p)\n            report[col]\
    \ = {\"psi\": psi_res, \"ks\": ks_res, \"wasserstein\": w1}\n            if ks_res[\"drifted\"] or psi_res[\"status\"] == \"ALERT\":\n                drifted.append(col)\n        report[\"_summary\"] = {\"drifted_features\": drifted, \"total_monitored\": len(features)}\n        logger.info(f\"Drift monitoring: {len(drifted)}/{len(features)} features drifted\")\n        return report\n\nif __name__ == \"__main__\":\n    import pandas as pd\n    rng = np.random.RandomState(42)\n    ref_data = pd.DataFrame({\"feature_A\": rng.normal(0, 1, 5000), \"feature_B\": rng.uniform(0, 1, 5000)})\n    # Stable production distribution\n    prod_stable = pd.DataFrame({\"feature_A\": rng.normal(0, 1, 2000), \"feature_B\": rng.uniform(0, 1, 2000)})\n    # Drifted production distribution\n    prod_drift  = pd.DataFrame({\"feature_A\": rng.normal(2.5, 1.5, 2000), \"feature_B\": rng.uniform(0.5, 1.5, 2000)})\n\n    detector = ProductionDriftDetector()\n    stable_report = detector.monitor_features(ref_data,\
    \ prod_stable, [\"feature_A\", \"feature_B\"])\n    drift_report  = detector.monitor_features(ref_data, prod_drift,  [\"feature_A\", \"feature_B\"])\n    print(f\"Stable drifted: {stable_report['_summary']['drifted_features']}\")\n    print(f\"Drifted drifted: {drift_report['_summary']['drifted_features']}\")\n    assert len(drift_report[\"_summary\"][\"drifted_features\"]) &gt; len(stable_report[\"_summary\"][\"drifted_features\"])\n    print(\"ProductionDriftDetector: OK\")\n</code></pre>\n</div>\n<h3 class=\"sh3\">MLflow Model Registry Lifecycle &amp; Approval Gates</h3>\n<p>\nThe MLflow Model Registry governs model progression across environment tiers:\n- <strong>Staging:</strong> Automated integration tests evaluate latency, throughput, and statistical data validation suites.\n- <strong>Production:</strong> Requires signed peer approvals and compliance audits before tagging the model as <code>@champion</code>.\n- <strong>Archived:</strong> Deprecated models retained for auditability\
    \ and regulatory compliance.\n</p>\n"
