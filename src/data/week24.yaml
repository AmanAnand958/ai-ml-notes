week_number: 24
title: Production MLOps Pipelines
description: ''
days:
- id: '171'
  day_num: 171
  title: MLflow Experiment Tracking & Metadata Logging
  subtitle: Reproducible ML Experiments at Scale
  time_estimate: 45 mins
  difficulty: Medium
  badges: []
  xp: 150
  objectives:
  - Log parameters, metrics, and artifacts using MLflow Tracking.
  - Compare runs in the MLflow UI.
  - pip install mlflow
  - Basic PyTorch or sklearn knowledge
  checklist: []
  concept_flow:
  - MLflow Experiment Tracking
  - MLflow Model Registry
  - DVC — Data Version Control
  - Apache Airflow
  - Model Drift Detection
  - A/B Testing & Canary Deployments
  - 'Capstone: Full MLOps Pipeline'
  hinglish: MLflow Experiment Tracking har training run ke metrics (loss, accuracy,
    F1), parameters (lr, batch_size), aur model artifacts ko central database dashboard
    mein log karta hai.
  analogy: MLflow experiment tracking is like a lab notebook recording every chemistry
    experiment's temperature, ingredients, and yield.
  theory_html: '<div class="theory-prose" style="line-height:1.7; font-size:14.5px;
    color:var(--text);">

    <p>Analogy:

    MLflow Experiment Tracking

    💡 Gotcha &amp; Common Pitfall Warning:

    Always double check tensor dimensions, verify data types before matrix operations,
    and ensure feature scaling is fitted strictly on the training set to prevent data
    leakage.</p>

    </div>'
  predict:
    question: "What is the difference between MLflow\n       \n        log_metric\n\
      \       \n       and\n       \n        log_param\n       \n       ?"
    answer: Parameters static metrics dynamic
    explanation: log_param records static training configuration (e.g. learning_rate,
      batch_size, model_type), while log_metric records scalar values that change
      over time/epochs (e.g. loss, accuracy, F1-score).
    code: "<span class=\"kw\">import</span> mlflow\n<span class=\"kw\">import</span>\
      \ mlflow.sklearn\n<span class=\"kw\">from</span> sklearn.ensemble <span class=\"\
      kw\">import</span> RandomForestClassifier\n<span class=\"kw\">from</span> sklearn.datasets\
      \ <span class=\"kw\">import</span> load_iris\n<span class=\"kw\">from</span>\
      \ sklearn.model_selection <span class=\"kw\">import</span> train_test_split\n\
      <span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span>\
      \ accuracy_score, f1_score\n\n<span class=\"cm\"># Configure MLflow Tracking\
      \ URI to PostgreSQL + S3 artifact store</span>\nmlflow.<span class=\"fn\">set_tracking_uri</span>(<span\
      \ class=\"str\">\"http://localhost:5000\"</span>)\nmlflow.<span class=\"fn\"\
      >set_experiment</span>(<span class=\"str\">\"Customer_Churn_Prediction\"</span>)\n\
      \nX, y = <span class=\"fn\">load_iris</span>(return_X_y=<span class=\"kw\">True</span>)\n\
      X_train, X_test, y_train, y_test = <span class=\"fn\">train_test_split</span>(X,\
      \ y, test_size=<span class=\"num\">0.2</span>, random_state=<span class=\"num\"\
      >42</span>)\n\n<span class=\"kw\">with</span> mlflow.<span class=\"fn\">start_run</span>(run_name=<span\
      \ class=\"str\">\"rf_n_estimators_100\"</span>):\n    n_est, max_d = <span class=\"\
      num\">100</span>, <span class=\"num\">5</span>\n    mlflow.<span class=\"fn\"\
      >log_params</span>({<span class=\"str\">\"n_estimators\": n_est, \"max_depth\"\
      </span>: max_d})\n    \n    model = <span class=\"fn\">RandomForestClassifier</span>(n_estimators=n_est,\
      \ max_depth=max_d, random_state=<span class=\"num\">42</span>)\n    model.<span\
      \ class=\"fn\">fit</span>(X_train, y_train)\n    \n    preds = model.<span class=\"\
      fn\">predict</span>(X_test)\n    acc = <span class=\"fn\">accuracy_score</span>(y_test,\
      \ preds)\n    f1 = <span class=\"fn\">f1_score</span>(y_test, preds, average=<span\
      \ class=\"str\">'weighted'</span>)\n    \n    mlflow.<span class=\"fn\">log_metrics</span>({<span\
      \ class=\"str\">\"accuracy\": acc, \"f1_score\"</span>: f1})\n    mlflow.sklearn.<span\
      \ class=\"fn\">log_model</span>(model, artifact_path=<span class=\"str\">\"\
      model\", registered_model_name=\"CustomerChurnRF\"</span>)\n    <span class=\"\
      fn\">print</span>(<span class=\"str\">f\"Run logged successfully. Accuracy:\
      \ {acc:.4f}, F1: {f1:.4f}\"</span>)"
  tasks:
  - title: 'Task 1: Compare 3 Models'
    badge: MEDIUM
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p>\n         Run 3 experiments varying\n         \n          n_estimators\n\
      \         \n         (50, 100, 200) in a loop. Compare accuracy in\n       \
      \  \n          mlflow ui\n         \n         .\n         <strong>\n       \
      \   Bonus Task: MLflow with LLM · MEDIUM · ⏱ 45 mins\n         </strong>\n \
      \        Use\n         \n          mlflow.log_text()\n         \n         to\
      \ save the system prompt and response of an LLM call as an artifact for auditability.\n\
      \        </p>"
    done_when: Task completed successfully when output matches expected verification
      metrics and unit tests pass.
    git_cmd: 'git add . &amp;&amp; git commit -m "day171: complete hands-on task implementation"'
    sol_id: sol-w24d171t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "<span class=\"kw\">import</span> mlflow\n<span class=\"kw\">import</span>\
      \ mlflow.sklearn\n<span class=\"kw\">from</span> sklearn.ensemble <span class=\"\
      kw\">import</span> RandomForestClassifier\n<span class=\"kw\">from</span> sklearn.datasets\
      \ <span class=\"kw\">import</span> load_iris\n<span class=\"kw\">from</span>\
      \ sklearn.model_selection <span class=\"kw\">import</span> train_test_split\n\
      <span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span>\
      \ accuracy_score, f1_score\n\n<span class=\"cm\"># Configure MLflow Tracking\
      \ URI to PostgreSQL + S3 artifact store</span>\nmlflow.<span class=\"fn\">set_tracking_uri</span>(<span\
      \ class=\"str\">\"http://localhost:5000\"</span>)\n<span class=\"cm\"># Step\
      \ 1: Initialize experiment metadata tracking</span>\nmlflow.<span class=\"fn\"\
      >set_experiment</span>(<span class=\"str\">\"Customer_Churn_Prediction\"</span>)\n\
      \nX, y = <span class=\"fn\">load_iris</span>(return_X_y=<span class=\"kw\">True</span>)\n\
      X_train, X_test, y_train, y_test = <span class=\"fn\">train_test_split</span>(X,\
      \ y, test_size=<span class=\"num\">0.2</span>, random_state=<span class=\"num\"\
      >42</span>)\n\n<span class=\"cm\"># Step 2: Start an atomic tracked run context</span>\n\
      <span class=\"kw\">with</span> mlflow.<span class=\"fn\">start_run</span>(run_name=<span\
      \ class=\"str\">\"rf_n_estimators_100\"</span>):\n    n_est, max_d = <span class=\"\
      num\">100</span>, <span class=\"num\">5</span>\n    <span class=\"cm\"># Step\
      \ 3: Record hyperparameters for run comparison</span>\n    mlflow.<span class=\"\
      fn\">log_params</span>({<span class=\"str\">\"n_estimators\": n_est, \"max_depth\"\
      </span>: max_d})\n    \n    model = <span class=\"fn\">RandomForestClassifier</span>(n_estimators=n_est,\
      \ max_depth=max_d, random_state=<span class=\"num\">42</span>)\n    model.<span\
      \ class=\"fn\">fit</span>(X_train, y_train)\n    \n    preds = model.<span class=\"\
      fn\">predict</span>(X_test)\n    acc = <span class=\"fn\">accuracy_score</span>(y_test,\
      \ preds)\n    f1 = <span class=\"fn\">f1_score</span>(y_test, preds, average=<span\
      \ class=\"str\">'weighted'</span>)\n    \n    <span class=\"cm\"># Step 4: Stream\
      \ evaluation telemetry metrics</span>\n    mlflow.<span class=\"fn\">log_metrics</span>({<span\
      \ class=\"str\">\"accuracy\": acc, \"f1_score\"</span>: f1})\n    <span class=\"\
      cm\"># Step 5: Save model weights, conda environment, and signature</span>\n\
      \    mlflow.sklearn.<span class=\"fn\">log_model</span>(model, artifact_path=<span\
      \ class=\"str\">\"model\", registered_model_name=\"CustomerChurnRF\"</span>)\n\
      \    <span class=\"fn\">print</span>(<span class=\"str\">f\"Run logged successfully.\
      \ Accuracy: {acc:.4f}, F1: {f1:.4f}\"</span>)"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: In MLflow, what is the difference between Parameters, Metrics, and Artifacts?
    qid: q171_1
    options:
    - letter: A
      text: Parameters are hyperparameters logged at run start; Metrics are numerical
        scalars tracked over epochs; Artifacts are output files (weights, plots).
      is_correct: true
    - letter: B
      text: Parameters are model weights; Metrics are user names; Artifacts are error
        logs.
      is_correct: false
    - letter: C
      text: They are three names for the same integer variable.
      is_correct: false
    - letter: D
      text: Parameters only apply to databases.
      is_correct: false
    correct_fb: ✅ Correct! MLflow categorizes experiment metadata into configuration
      inputs (parameters), scalar time-series (metrics), and binary outputs (artifacts).
    wrong_fb: ❌ Incorrect. Understanding parameter/metric/artifact separation is foundational
      for structured experiment tracking in MLflow.
  - num_str: QUESTION 2 OF 4
    question: What backend architecture is recommended for production MLflow Tracking
      Servers?
    qid: q171_2
    options:
    - letter: A
      text: A managed SQL database (e.g. Amazon RDS PostgreSQL) for metadata tracking
        combined with an S3 bucket for artifact storage.
      is_correct: true
    - letter: B
      text: A local SQLite file stored in a shared folder.
      is_correct: false
    - letter: C
      text: A plain text notepad file on a desktop computer.
      is_correct: false
    - letter: D
      text: Storing all artifacts in browser localStorage.
      is_correct: false
    correct_fb: ✅ Correct! Separating relational metadata into SQL and large binaries
      into cloud object storage ensures scalability across thousands of runs.
    wrong_fb: ❌ Incorrect. Enterprise MLflow deployments use SQL databases for relational
      metadata and object stores (S3/GCS) for large artifacts.
  - num_str: QUESTION 3 OF 4
    question: What is the MLflow Model Registry and how does it manage model lifecycle
      states?
    qid: q171_3
    options:
    - letter: A
      text: A centralized model repository that versions models and tracks transitions
        across stages (e.g. Development ➔ Staging ➔ Production ➔ Archived).
      is_correct: true
    - letter: B
      text: A marketplace where users buy and sell models for money.
      is_correct: false
    - letter: C
      text: A tool that deletes old models automatically.
      is_correct: false
    - letter: D
      text: A Python package for training linear regressions.
      is_correct: false
    correct_fb: ✅ Correct! The Model Registry provides collaborative model governance,
      versioning, automated promotion gates, and lineage tracking.
    wrong_fb: ❌ Incorrect. The Model Registry formalizes model governance by tracking
      version stages and release approvals.
  - num_str: QUESTION 4 OF 4
    question: Why should large model weights never be logged directly to the tracking
      server's SQL database?
    qid: q171_4
    options:
    - letter: A
      text: It causes severe database bloat, connection timeouts, and locking contention;
        large files must be stored in object storage (S3/GCS).
      is_correct: true
    - letter: B
      text: Because SQL databases only support English text.
      is_correct: false
    - letter: C
      text: Because model weights lose precision in SQL.
      is_correct: false
    - letter: D
      text: Because SQL databases delete large files automatically.
      is_correct: false
    correct_fb: ✅ Correct! Relational databases are optimized for structured tabular
      metadata, not multi-gigabyte binary model checkpoint transfers.
    wrong_fb: ❌ Incorrect. Storing tensor checkpoints in SQL degrades query performance;
      object stores are designed for high-throughput binary storage.
  flashcards:
  - front: What is the key principle behind Day 171 (MLflow Experiment Tracking &
      Metadata Logging)?
    back: Optimizing throughput, numerical stability, and model convergence through
      standardized pipelines.
  - front: What is the most dangerous failure mode to watch for?
    back: Silent data leakage, unnormalized inputs, or uncalibrated inference parameters.
  - front: How is this verified in production?
    back: Automated unit assertions, end-to-end integration tests, and live telemetry
      metric tracking.
  gotcha:
    title: '⚠️ Gotcha: Day 171 Pitfall Warning'
    description: "<p style=\"margin-top:0.4rem; margin-bottom:0;\">\n       Logging\
      \ massive model weight checkpoints directly into the MLflow tracking SQLite\
      \ backend database causes database lock contention and crash.\n      </p>"
  takeaways:
    hinglish_line: MLflow Experiment Tracking & Metadata Logging ko master karne ke
      liye theoretical math aur practical code dono align hona chahiye.
    bullets:
    - Always validate tensor shapes before forward passes
    - Instrument metrics early to catch drift in production
    - Write unit tests for custom operations and data transforms
  resources: &id001
  - type: DOCS
    title: 'MLflow 2.0: Unified LLMOps & Experiment Tracking'
    url: https://mlflow.org/docs/latest/index.html
    desc: Prompt tracking, evaluation datasets, and model registry
  - type: DOCS
    title: 'Evidently AI: Production Model Drift & Data Quality'
    url: https://docs.evidentlyai.com/
    desc: Automated KS-tests, PSI calculations, and drift alerts
  - type: FRAMEWORK
    title: 'Feast: Production Open Source Feature Store'
    url: https://docs.feast.dev/
    desc: Point-in-time correct joins for training and online serving
  - type: TOOL
    title: 'Great Expectations: Data Testing and Validation'
    url: https://greatexpectations.io/
    desc: Data pipeline assertion suites
- id: '172'
  day_num: 172
  title: MLflow Model Registry & Model Aliases
  subtitle: Staging → Production Model Lifecycle
  time_estimate: 45 mins
  difficulty: Medium
  badges: []
  xp: 150
  objectives:
  - Register a model from an MLflow run.
  - Promote a model through Staging → Production stages.
  - MLflow tracking server running
  checklist: []
  concept_flow:
  - MLflow Experiment Tracking
  - MLflow Model Registry
  - DVC — Data Version Control
  - Apache Airflow
  - Model Drift Detection
  - A/B Testing & Canary Deployments
  - 'Capstone: Full MLOps Pipeline'
  hinglish: MLflow Model Registry models ko staging, production, aur archived environments
    mein manage karta hai. Dynamic `@champion` aur `@challenger` tags production model
    routing control karte hain.
  analogy: MLflow Model Registry is like a trophy case where only validated champion
    models get the gold star for production.
  theory_html: '<div class="theory-prose" style="line-height:1.7; font-size:14.5px;
    color:var(--text);">

    <p>Analogy:

    MLflow Model Registry

    💡 Gotcha &amp; Common Pitfall Warning:

    Always double check tensor dimensions, verify data types before matrix operations,
    and ensure feature scaling is fitted strictly on the training set to prevent data
    leakage.</p>

    </div>'
  predict:
    question: If you have version 1 in Production and promote version 2 to Production,
      what happens to version 1?
    answer: Archived
    explanation: Version 1 is automatically transitioned to 'Archived' stage (when
      archive_existing_versions=True), leaving Version 2 as the single active 'Production'
      model artifact.
    code: '<span class="kw">import</span> mlflow

      <span class="kw">from</span> mlflow <span class="kw">import</span> MlflowClient


      client = <span class="fn">MlflowClient</span>(tracking_uri=<span class="str">"http://localhost:5000"</span>)

      model_name = <span class="str">"CustomerChurnRF"</span>

      <span class="cm"># Assign modern model aliases (@challenger, @champion)</span>

      latest_versions = client.<span class="fn">get_latest_versions</span>(model_name)

      latest_v = latest_versions[<span class="num">0</span>].version


      client.<span class="fn">set_model_version_alias</span>(name=model_name, alias=<span
      class="str">"challenger"</span>, version=latest_v)

      <span class="fn">print</span>(<span class="str">f"Model {model_name} version
      {latest_v} tagged as @challenger"</span>)


      <span class="cm"># Load model using production @champion alias</span>

      champion_model = mlflow.pyfunc.<span class="fn">load_model</span>(<span class="str">f"models:/{model_name}@champion"</span>)

      <span class="fn">print</span>(<span class="str">"Successfully loaded @champion
      model for real-time inference."</span>)'
  tasks:
  - title: 'Task 1: Champion/Challenger'
    badge: MEDIUM
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p>\n        Implement a script that loads both the Production and\
      \ Staging models, evaluates them on a holdout set, and promotes Staging to Production\
      \ only if it beats the champion.\n       </p>"
    done_when: Task completed successfully when output matches expected verification
      metrics and unit tests pass.
    git_cmd: 'git add . &amp;&amp; git commit -m "day172: complete hands-on task implementation"'
    sol_id: sol-w24d172t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: '<span class="kw">import</span> mlflow

      <span class="kw">from</span> mlflow <span class="kw">import</span> MlflowClient


      client = <span class="fn">MlflowClient</span>(tracking_uri=<span class="str">"http://localhost:5000"</span>)

      model_name = <span class="str">"CustomerChurnRF"</span>

      <span class="cm"># Assign modern model aliases (@challenger, @champion)</span>

      latest_versions = client.<span class="fn">get_latest_versions</span>(model_name)

      latest_v = latest_versions[<span class="num">0</span>].version


      client.<span class="fn">set_model_version_alias</span>(name=model_name, alias=<span
      class="str">"challenger"</span>, version=latest_v)

      <span class="fn">print</span>(<span class="str">f"Model {model_name} version
      {latest_v} tagged as @challenger"</span>)


      <span class="cm"># Load model using production @champion alias</span>

      champion_model = mlflow.pyfunc.<span class="fn">load_model</span>(<span class="str">f"models:/{model_name}@champion"</span>)

      <span class="fn">print</span>(<span class="str">"Successfully loaded @champion
      model for real-time inference."</span>)'
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: What is Data Drift (Covariate Shift) in deployed machine learning systems?
    qid: q172_1
    options:
    - letter: A
      text: When the statistical distribution of input features $P(X)$ changes over
        time while the conditional relationship $P(Y \mid X)$ remains unchanged.
      is_correct: true
    - letter: B
      text: When the server hard drive runs out of disk space.
      is_correct: false
    - letter: C
      text: When model weights are accidentally deleted.
      is_correct: false
    - letter: D
      text: When user passwords expire.
      is_correct: false
    correct_fb: ✅ Correct! Covariate shift occurs when production user inputs diverge
      from the training distribution, degrading model accuracy.
    wrong_fb: ❌ Incorrect. Data drift represents changes in input feature distributions
      $P(X)$ over time.
  - num_str: QUESTION 2 OF 4
    question: What is Concept Drift in production ML?
    qid: q172_2
    options:
    - letter: A
      text: When the underlying relationship between inputs and outputs $P(Y \mid
        X)$ changes over time (e.g. changing consumer buying habits after macroeconomic
        events).
      is_correct: true
    - letter: B
      text: When a developer forgets how the code works.
      is_correct: false
    - letter: C
      text: When Python updates from version 3.10 to 3.11.
      is_correct: false
    - letter: D
      text: When the database schema is renamed.
      is_correct: false
    correct_fb: ✅ Correct! Concept drift occurs when the true mathematical function
      mapping inputs to targets shifts in the real world.
    wrong_fb: ❌ Incorrect. Concept drift denotes changes in the statistical relationship
      between features and target labels ($P(Y \mid X)$).
  - num_str: QUESTION 3 OF 4
    question: What statistical test is commonly used by Evidently AI to detect numerical
      feature drift?
    qid: q172_3
    options:
    - letter: A
      text: The two-sample Kolmogorov-Smirnov (KS) test or Population Stability Index
        (PSI).
      is_correct: true
    - letter: B
      text: A coin flip simulation.
      is_correct: false
    - letter: C
      text: Calculating the sum of all numbers.
      is_correct: false
    - letter: D
      text: Measuring the file size in megabytes.
      is_correct: false
    correct_fb: ✅ Correct! The KS test and PSI quantify distribution divergence between
      baseline reference datasets and live production windows.
    wrong_fb: ❌ Incorrect. Non-parametric statistical tests like Kolmogorov-Smirnov
      and PSI detect significant distribution shifts in continuous features.
  - num_str: QUESTION 4 OF 4
    question: How should an automated MLOps pipeline respond when persistent concept
      drift is detected?
    qid: q172_4
    options:
    - letter: A
      text: Trigger automated data validation, re-ingest fresh labeled production
        data, and initiate an automated retraining pipeline.
      is_correct: true
    - letter: B
      text: Ignore the drift and increase marketing spend.
      is_correct: false
    - letter: C
      text: Permanently delete the database.
      is_correct: false
    - letter: D
      text: Shut down all customer accounts.
      is_correct: false
    correct_fb: ✅ Correct! Automated drift alerts trigger data curation and continuous
      retraining pipelines to restore model performance.
    wrong_fb: ❌ Incorrect. Detecting significant drift requires retraining models
      on recent data distributions to restore accuracy.
  flashcards:
  - front: Staging Stage
    back: Model is ready for QA/integration testing but not yet serving real users.
  - front: Champion/Challenger
    back: Testing a new model (challenger) against the current best (champion) on
      held-out data before promoting.
  - front: load_model URI
    back: "models:/ModelName/Production\n         \n         — resolves to whichever\
      \ version is currently in the Production stage."
  gotcha:
    title: '⚠️ Gotcha: Day 172 Pitfall Warning'
    description: "<p style=\"margin-top:0.4rem; margin-bottom:0;\">\n       Data drift\
      \ detectors triggered on small sample windows trigger high false-alarm rates;\
      \ calibrate Kolmogorov-Smirnov (KS) test sample sizes.\n      </p>"
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       \"Model\
      \ Registry = 'git' for ML models. Har version traceable, rollback possible,\
      \ audit ready!\""
    bullets:
    - Never load a model by run ID in production — use the registry URI.
    - Automate champion/challenger evaluation in CI to prevent regressions.
    - Add model tags with training date and dataset version for traceability.
  resources: *id001
- id: '173'
  day_num: 173
  title: Data Version Control (DVC) & Dataset Lineage
  subtitle: Git for Datasets and Models
  time_estimate: 45 mins
  difficulty: Medium
  badges: []
  xp: 150
  objectives:
  - Track datasets and model weights using DVC.
  - Reproduce a specific data version from git history.
  - Git repo initialized
  - pip install dvc dvc-s3
  checklist: []
  concept_flow:
  - MLflow Experiment Tracking
  - MLflow Model Registry
  - DVC — Data Version Control
  - Apache Airflow
  - Model Drift Detection
  - A/B Testing & Canary Deployments
  - 'Capstone: Full MLOps Pipeline'
  hinglish: Data Version Control (DVC) Git ke saath milkar large dataset files (.csv,
    .h5) ko MD5 hashes ke roop mein version karta hai bina Git repo size inflate kiye.
  analogy: DVC data versioning is like Git for massive data files, saving lightweight
    fingerprint hashes instead of megabytes of raw CSVs.
  theory_html: '<div class="theory-prose" style="line-height:1.7; font-size:14.5px;
    color:var(--text);">

    <p>Analogy:

    DVC — Data Version Control

    💡 Gotcha &amp; Common Pitfall Warning:

    Always double check tensor dimensions, verify data types before matrix operations,
    and ensure feature scaling is fitted strictly on the training set to prevent data
    leakage.</p>

    </div>'
  predict:
    question: "What does\n       \n        dvc repro\n       \n       do?"
    answer: Executes pipeline stages
    explanation: dvc repro executes the data and model pipeline stages defined in
      dvc.yaml, skipping steps whose input data and code hashes have not changed.
    code: "<span class=\"kw\">import</span> subprocess\n\n<span class=\"kw\">def</span>\
      \ <span class=\"fn\">run_dvc_pipeline</span>():\n    <span class=\"str\">\"\"\
      \"</span>\n    Executes reproducible DVC pipeline stages <span class=\"kw\"\
      >for</span> dataset versioning <span class=\"kw\">and</span> preprocessing.\n\
      \    <span class=\"str\">\"\"\"</span>\n    commands = [\n        <span class=\"\
      str\">\"dvc init --no-scm\"</span>,\n        <span class=\"str\">\"dvc remote\
