  tasks:
  - title: Detect and Visualise Outliers
    badge: 🟢 EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: |-
      <p style="margin-bottom: 0.6rem;">
                 Load the Titanic dataset. For the "Fare" column:
                </p>
      <ul style="padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;">
      <li style="margin-bottom: 0.4rem;">
      <strong>
                   (1)
                  </strong>
                  Plot a boxplot showing outliers
                 </li>
      <li style="margin-bottom: 0.4rem;">
      <strong>
                   (2)
                  </strong>
                  Apply the IQR method to find outlier thresholds and list outlier values
                 </li>
      <li style="margin-bottom: 0.4rem;">
      <strong>
                   (3)
                  </strong>
                  Apply Z-score method (threshold=3) to find outliers
                 </li>
      <li style="margin-bottom: 0.4rem;">
      <strong>
                   (4)
                  </strong>
                  Compare: do both methods agree on the same outliers? Which is more conservative?
                 </li>
