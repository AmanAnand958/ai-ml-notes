      ko pehle validate karo, taaki downstream deployment bilkul rock-solid rahe!
    bullets:
    - Scale for distance/gradient-based models; skip for tree-based models
    - 'StandardScaler: symmetric data. MinMaxScaler: bounded output. RobustScaler: outlier-heavy data'
    - 'IQR method: Q1−1.5×IQR to Q3+1.5×IQR. Z-score: |z| &gt; 3'
    - Don't blindly remove outliers — prefer RobustScaler or log transform
    - Always fit scaler on train only — never on the full dataset
