    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day15: MNAR indicator
      feature + logistic regression pipeline"'
    sol_id: sol-w3d15t3
    solution_title: 📓 Complete Colab Code
    solution_code: '# Full Pipeline with MNAR Indicator

      import pandas as pd

      import numpy as np

      from sklearn.pipeline import Pipeline

      from sklearn.impute import SimpleImputer

      from sklearn.preprocessing import StandardScaler, OneHotEncoder

      from sklearn.compose import ColumnTransformer

      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"

      df = pd.read_csv(url).head(20)

      mnar = df["Cabin"].isna().astype(int).rename("Cabin_Missing")

      df = pd.concat([df, mnar], axis=1)

      num_f = ["Age","Fare","Cabin_Missing"]

      cat_f = ["Sex","Embarked"]

      num_p = Pipeline([("i",SimpleImputer(strategy="median")),("s",StandardScaler())])

      cat_p = Pipeline([("i",SimpleImputer(strategy="most_frequent")),("e",OneHotEncoder(drop="first"))])

      ct = ColumnTransformer([("n",num_p,num_f),("c",cat_p,cat_f)])

      X = ct.fit_transform(df[num_f+cat_f])

      print(f"Input cols: {len(num_f+cat_f)}, Output dims: {X.shape}")

      print(f"MNAR (Cabin missing) created and included as a feature!")

      assert X is not None, "X should not be None"'
