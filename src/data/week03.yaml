  - num_str: QUESTION 3 OF 4
    question: What is the "dummy variable trap"?
    qid: q16_3
    options:
    - letter: A
      text: Using too few dummy variables for a column
      is_correct: false
      id: a
    - letter: B
      text: Perfect multicollinearity when all one-hot columns together predict each other
      is_correct: true
      id: b
    - letter: C
      text: Using One-Hot Encoding on ordinal data
      is_correct: false
      id: c
    - letter: D
      text: When get_dummies() creates wrong column names
      is_correct: false
      id: d
    correct_fb: '✅ Correct! For 3 categories (A, B, C): col_C = 1 − col_A − col_B always. This perfect linear relationship
      breaks linear regression''s matrix inversion (XᵀX becomes singular). Fix: always use drop_first=True — drop one column.
      The model can reconstruct its value from the remaining columns..'
    wrong_fb: '❌ The dummy variable trap: with k categories, you get k binary columns where the last = 1 − sum(all others).
      This is perfect multicollinearity — breaks linear models. Fix: drop_first=True to keep only k−1 columns. Tree models
      don''t have this issue.'
