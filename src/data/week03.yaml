    \         What it is:\n        </strong>\n        A Bar Chart represents categorical\
    \ data with rectangular bars.\n       </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem\
    \ 0;line-height:1.5;\">\n        The length or height of each bar is proportional\
    \ to the value it represents.\n       </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem\
    \ 0;line-height:1.5;\">\n<strong>\n         When to use:\n        </strong>\n\
    \        Comparing discrete categories (e.g., average salaries across cities,\
    \ sales figures across product segments, feature importances in a decision tree).\n\
    \       </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\"\
