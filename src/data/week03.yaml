  quizzes:
  - num_str: QUESTION 1 OF 4
    question: What is the correct order of operations in an ML preprocessing pipeline?
    qid: q21_1
    options:
    - letter: A
      text: Scale → Split → Impute → Encode → Train model
      is_correct: false
      id: a
    - letter: B
      text: Split → Impute (fit on train) → Encode → Scale (fit on train) → Train model
      is_correct: true
      id: b
    - letter: C
      text: Impute → Encode → Scale → Split → Train model
      is_correct: false
      id: c
    - letter: D
      text: Split → Scale → Impute → Encode → Train model
      is_correct: false
      id: d
    correct_fb: ✅ Correct! SPLIT first — then all fitting (imputer, encoder, scaler) happens on training data ONLY, and those
      fitted transformers are applied to test data. Fitting on the whole dataset before splitting = data leakage. The sklearn
      Pipeline + ColumnTransformer pattern enforces this.
    wrong_fb: '❌ Always SPLIT first, THEN fit transformers on training data only. Fitting imputers/scalers before splitting
      means test data statistics leak into training = data leakage = unrealistically good validation metrics but poor production
      performance. Correct order: split → fit on train → transform train + test.'
    correct: b
  - num_str: QUESTION 2 OF 4
    question: 'You build a Pipeline with steps: [(''imputer'', SimpleImputer()), (''scaler'', StandardScaler()), (''model'',
      LogisticRegression())]. What does pipeline.fit(X_train, y_train) do internally?'
    qid: q21_2
    options:
    - letter: A
      text: Only fits the LogisticRegression model
      is_correct: false
      id: a
    - letter: B
      text: Fits imputer on X_train, transforms X_train, fits scaler on result, transforms, then fits model
      is_correct: true
      id: b
    - letter: C
      text: Runs all steps on X_test first to validate
      is_correct: false
      id: c
    - letter: D
      text: Only stores the steps without fitting anything
      is_correct: false
      id: d
    correct_fb: '✅ Correct! sklearn Pipeline chains transformers sequentially. During fit(): each transformer''s fit_transform()
      is called in sequence, feeding the output of each step as input to the next. Only the final step gets just fit() (not
      fit_transform()). During predict(): each transformer''s.'
    wrong_fb: '❌ Pipeline.fit(X_train, y_train) runs: imputer.fit_transform(X_train) → scaler.fit_transform(result) → model.fit(final_result,
      y_train). Each step is fit and applied in sequence. Pipeline.predict(X_test) runs: imputer.transform(X_test) → scaler.transform(result)
      → model.predict(final_result). No re-fitting on test data.'
    correct: b
  - num_str: QUESTION 3 OF 4
    question: Which sklearn class applies DIFFERENT transformations to DIFFERENT columns (e.g., OneHotEncoder to categorical,
      StandardScaler to numeric)?
    qid: q21_3
    options:
    - letter: A
      text: Pipeline
      is_correct: false
      id: a
    - letter: B
      text: ColumnTransformer
      is_correct: true
      id: b
    - letter: C
      text: FeatureUnion
      is_correct: false
      id: c
    - letter: D
      text: SimpleImputer with strategy='all'
      is_correct: false
      id: d
    correct_fb: ✅ Correct! ColumnTransformer is the key class for applying different preprocessors to different column groups.
      You specify tuples of (name, transformer, columns). It processes each group in parallel and concatenates the results.
      Wrap ColumnTransformer inside a Pipeline as the 'preprocessor'.
    wrong_fb: '❌ ColumnTransformer! It lets you define different transformations for different column subsets: {''numeric'':
      StandardScaler, ''categorical'': OneHotEncoder, ''binary'': passthrough}. Pipeline applies transforms SEQUENTIALLY to
      ALL features. ColumnTransformer applies transforms IN PARALLEL to SUBSETS of features, then concatenates the outputs.'
    correct: b
  - num_str: QUESTION 4 OF 4
    question: After completing Week 3's preprocessing pipeline, what is the first model you should try as your baseline?
    qid: q21_4
    options:
    - letter: A
      text: A deep neural network — most powerful
      is_correct: false
      id: a
    - letter: B
      text: XGBoost — state of the art
      is_correct: false
      id: b
    - letter: C
      text: Logistic Regression — simple, fast, interpretable baseline
      is_correct: true
      id: c
    - letter: D
      text: Random Forest with 1000 trees
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Always start with the simplest model (Logistic Regression for classification, Linear Regression
      for regression). It trains in seconds, is fully interpretable (check coefficients to understand which features matter),
      and sets a performance baseline. If a complex model doesn't beat.
    wrong_fb: ❌ Start with Logistic Regression (classification) or Linear Regression (regression). Simple models are fast,
      interpretable, and give you a baseline to beat. If your fancy neural network only beats logistic regression by 0.5%
      accuracy, the simpler model wins (less latency, easier to debug, more interpretable). Start simple — add complexity
      only when the baseline isn't good enough.
    correct: c
  flashcards:
  - front: MCAR vs MAR vs MNAR?
    back: |-
      MCAR: completely random.
                <br/>
                MAR: related to observed data.
                <br/>
                MNAR: related to missing value itself.
  - front: StandardScaler formula (D21)?
    back: |-
      z = (x - mean) / std
                <br/>
                Creates mean=0, variance=1. This establishes the core invariant in Full Preprocessing + Visualization Pipeline, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: RobustScaler advantage?
    back: |-
      Uses median and IQR (interquartile range)
                <br/>
                Not influenced by extreme outliers.
  - front: One-Hot Encoding dummy trap?
    back: |-
      Multicollinearity from dummy columns.
                <br/>
                Fixed by dropping first column. This establishes the core invariant in Full Preprocessing + Visualization Pipeline, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: What is data leakage?
    back: |-
      Information from test/validation set
                <br/>
                leaking into training process. This establishes the core invariant in Full Preprocessing + Visualization Pipeline, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: Neural architecture relying entirely on multi-head self-attention and positional encodings, eliminating sequential...
    back: |-
      Pipeline: sequential transformations.
                <br/>
                ColumnTransformer: parallel, column-specific. This establishes the core invariant in Full Preprocessing + Visualization Pipeline, ensuring memory efficiency, numerical stability, and robust scaling.
  gotcha:
    title: '⚠️ Gotcha: NumPy In-Place vs Copy Operations'
    description: NumPy slicing returns a view, not a copy. Modifying a slice directly mutates the original array.
  takeaways:
    hinglish_line: Production mein Full Preprocessing + Visualization Pipeline ko use karte waqt edge cases aur mathematical
      constraints ko pehle validate karo, taaki downstream deployment bilkul rock-solid rahe!
    bullets:
    - |-
      <strong>
                Missing Data:
               </strong>
               MCAR/MAR/MNAR types. Drop if &gt;70% missing. Fit imputer on train, transform test. KNNImputer &gt; mean for correlated data.
    - |-
      <strong>
                Encoding:
               </strong>
               Nominal → One-Hot (drop_first=True). Ordinal → custom map. High cardinality → Target Encoding. Trees = Label OK; Linear = One-Hot required.
    - |-
      <strong>
                Scaling:
               </strong>
               Distance-based/gradient models need it; trees don't. Outliers → RobustScaler. Normal data → StandardScaler. Bounded → MinMaxScaler.
    - |-
      <strong>
                Matplotlib:
               </strong>
               fig, ax = plt.subplots(). ax-level API for multi-plot. Always tight_layout() + savefig() for reports.
    - |-
      <strong>
                Seaborn:
               </strong>
               histplot (dist), boxplot/violinplot (spread), heatmap (correlation), pairplot (all relationships). hue= splits by category.
    - |-
      <strong>
                Feature Engineering:
               </strong>
               New features from domain knowledge. Bin continuous, combine columns, extract datetime parts. Always on train only.
