    <h4 style="color:var(--accent); margin-top:0; font-size:1.05rem;">Architecture Blueprint: Pandas Relational Join Mechanics (Inner, Left, Outer)</h4>
    <div class="mermaid">
    graph LR
        subgraph LeftTable["Left DataFrame (L)"]
            L1["Key: A, Val: 10"]
