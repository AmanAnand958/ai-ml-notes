    <h3 class="sh3">
           1. Why Missing Data Matters
          </h3>

    <p>
           Almost every real dataset has missing values — whether it's a Kaggle competition or a company's production database.
          </p>
    <p>
           The key insight:
           <strong>
            how you handle missing data
           </strong>
           is often more important than which model you pick.
          </p>
    <div class="ml-connect">
           Sklearn's estimators (LinearRegression, RandomForest, etc.) cannot handle NaN values by default — they will throw a ValueError.
           <br/>
    <br/>
           You MUST handle missing values in the preprocessing pipeline before fitting any model.
           <br/>
    <br/>
           This is step 1 in every ML project.
          </div>
    <h3 class="sh3">
           2. Three Types of Missing Data
          </h3>
