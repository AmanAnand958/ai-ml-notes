      column. Indices go left-to-right, then top-to-bottom, starting at 1.
    wrong_fb: ❌ plt.subplot(rows, cols, index). 2 rows × 3 cols = 6 panels. Panel
      4 = row 2, col 1 (panels numbered left→right then top→bottom starting at 1).
      Panel 1 = top-left, panel 6 = bottom-right.
    correct: b
  - num_str: QUESTION 3 OF 4
    question: What are the dots plotted BEYOND the whiskers in a box plot?
    qid: q18_3
    options:
    - letter: A
      text: The mean and standard deviation markers
      is_correct: false
      id: a
    - letter: B
      text: The 5th and 95th percentile values
      is_correct: false
      id: b
    - letter: C
      text: Outliers — values beyond Q1−1.5×IQR or Q3+1.5×IQR
      is_correct: true
      id: c
    - letter: D
      text: Data entry errors that should be deleted
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Whiskers extend to Q1−1.5×IQR (lower) and Q3+1.5×IQR (upper).
      Points beyond these are plotted individually as dots — these are outliers by
      Tukey's fence definition. They're not necessarily errors — they could be real
      extreme values. The box contains the middle 50% of data (Q1 to Q3).
    wrong_fb: ❌ Dots outside whiskers = outliers (Q1−1.5×IQR to Q3+1.5×IQR bounds).
      They're not errors — just extreme values. The box = Q1 to Q3 (middle 50%). Median
      line is inside the box. Whiskers go to the fence limits.
    correct: c
  - num_str: QUESTION 4 OF 4
    question: Which function adds a best-fit straight trend line to a scatter plot?
    qid: q18_4
    options:
    - letter: A
      text: np.polyfit(x, y, 1) — returns [slope, intercept]
      is_correct: true
      id: a
    - letter: B
      text: np.correlate(x, y)
      is_correct: false
      id: b
    - letter: C
      text: np.gradient(y, x)
      is_correct: false
      id: c
    - letter: D
      text: np.linalg.fit(x, y)
      is_correct: false
      id: d
    correct_fb: '✅ Correct! np.polyfit(x, y, 1) fits a degree-1 polynomial (a line)
      and returns [slope, intercept]. Then: x_line = np.linspace(x.min(), x.max(),
      100); plt.plot(x_line, slope*x_line + intercept, ''--''). Degree=2 gives a parabola.'
    wrong_fb: ❌ np.polyfit(x, y, 1) is the answer. Returns [slope, intercept]. Then
      evaluate y = slope*x + intercept on a smooth x range and plot it with plt.plot().
      Degree=1 is linear; degree=2 is quadratic curve.
    correct: a
  flashcards:
  - front: Chart for distribution of one variable?
    back: "plt.hist(data, bins=30)\n           <br/>\n           Shows frequency per\
      \ bin\n           <br/>\n           Use density=True for probability"
  - front: Add trend line to scatter?
    back: "m, b = np.polyfit(x, y, 1)\n           <br/>\n           x_line = np.linspace(xmin,xmax,100)\n\
      \           <br/>\n           plt.plot(x_line, m*x_line+b, '--')"
  - front: 3-row × 2-col grid, bottom-right?
    back: "plt.subplot(3, 2, 6)\n           <br/>\n           Rows=3, cols=2 → 6 panels\n\
      \           <br/>\n           Index 6 = row 3, col 2"
  - front: Box plot outlier boundary?
    back: "Lower: Q1 − 1.5×IQR\n           <br/>\n           Upper: Q3 + 1.5×IQR\n\
      \           <br/>\n           Points beyond = outlier dots"
  - front: Donut chart vs pie chart?
    back: "plt.pie(..., wedgeprops=dict(width=0.5))\n           <br/>\n          \
      \ width < 1 = donut hole\n           <br/>\n           width=1 = full pie"
  gotcha:
    title: '⚠️ Gotcha: NumPy In-Place vs Copy Operations'
    description: NumPy slicing returns a view, not a copy. Modifying a slice directly
      mutates the original array.
  takeaways:
    hinglish_line: Production mein Matplotlib — Every Important Plot Type ko use karte
      waqt edge cases aur mathematical constraints ko pehle validate karo, taaki downstream
      deployment bilkul rock-solid rahe!
    bullets:
    - '8 plot types: line (trend), bar (categories), scatter (2 vars + trend), histogram
      (distribution), pie/donut (proportions), box (outliers + quartiles), area (stacked),
      subplot grid (dashboard)'
    - plt.subplot(rows, cols, index) — index starts at 1, left→right, top→bottom
    - plt.tight_layout() — ALWAYS before savefig() to prevent label overlap
    - np.polyfit(x, y, 1) → [slope, intercept] — for scatter trend lines
    - plt.style.use('dark_background') — instant professional dark theme
    - plt.annotate() with arrowprops → adds arrows + labels to highlight specific
      points
