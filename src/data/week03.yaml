      \ report = report[report[\"Missing\"] > 0].sort_values(\"Percent\", ascending=False)\n\
      \    print(\"Column          Missing  Percent  Flag               Rec\")\n \
      \   print(\"=\" * 60)\n    for col in report.index:\n        pct = report.loc[col,\
