    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">copy</button><button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">Run</button></div>
    </div>
    <pre><code><span class="kw">import</span> pandas <span class="kw">as</span> pd

    <span class="cm"># BUG: City is NOMINAL (no order). LabelEncoder assigns Delhi=1, Mumbai=2, Chennai=0</span>
    <span class="cm"># This tells LogisticRegression Mumbai &gt; Delhi &gt; Chennai — WRONG!</span>
    <span class="cm"># Fix: Use One-Hot Encoding for nominal data with linear models</span>
    dummies = pd.<span class="fn">get_dummies</span>(df[<span class="str">'city'</span>], prefix=<span class="str">'city'</span>, drop_first=<span class="kw">True</span>)
    df = pd.<span class="fn">concat</span>([df.<span class="fn">drop</span>(<span class="str">'city'</span>, axis=<span class="num">1</span>), dummies], axis=<span class="num">1</span>)</code></pre>
