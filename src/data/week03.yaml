    solution_title: 📓 Complete Colab Code
    solution_code: "# Interactive Plotly Dashboard\nimport pandas as pd\nimport numpy\
      \ as np\ntry:\n    import plotly.express as px\n    import plotly.graph_objects\
      \ as go\n    from plotly.subplots import make_subplots\n    url = \"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv\"\
      \n    df = pd.read_csv(url)\n    fig = make_subplots(rows=2, cols=2, subplot_titles=[\"\
      Age Dist\",\"Class Survival\",\"Fare vs Age\",\"Gender\"])\n    fig.add_trace(go.Histogram(x=df[\"\
      Age\"].dropna(),name=\"Age\"), row=1, col=1)\n    for c in [1,2,3]:\n      \
      \  sr = df[df[\"Pclass\"]==c][\"Survived\"].mean()\n        fig.add_trace(go.Bar(x=[f\"\
      Class {c}\"], y=[sr], name=f\"Class {c}\"), row=1, col=2)\n    fig.add_trace(go.Scatter(x=df[\"\
      Age\"], y=df[\"Fare\"], mode=\"markers\",\n                  marker=dict(color=df[\"\
      Survived\"],colorscale=\"RdBu\"), name=\"Survival\"), row=2, col=1)\n    gb\
      \ = df[\"Sex\"].value_counts()\n    fig.add_trace(go.Pie(labels=gb.index, values=gb.values),\
      \ row=2, col=2)\n    fig.update_layout(height=700, title_text=\"Titanic Interactive\
      \ Dashboard\")\n    fig.write_html(\"titanic_dashboard.html\")\n    print(\"\
      Saved titanic_dashboard.html!\")\nexcept ImportError:\n    print(\"Plotly not\
      \ installed. Install with: pip install plotly\")"
