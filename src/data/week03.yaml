      \    </strong>\n            Drop the raw Cabin column\n           </li>\n<li\
      \ style=\"margin-bottom: 0.4rem;\">\n<strong>\n             (3)\n          \
      \  </strong>\n            Handle Age with median imputation\n           </li>\n\
      <li style=\"margin-bottom: 0.4rem;\">\n<strong>\n             (4)\n        \
      \    </strong>\n            Handle Embarked with mode imputation. Then train\
