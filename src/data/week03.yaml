    >\n            c\n           </td>\n<td>\n            color or array\n       \
    \    </td>\n<td>\n            Marker color. Can map to categories (categorical\
    \ colors) or float numbers (colormap gradient).\n           </td>\n</tr>\n<tr>\n\
    <td style=\"font-family:var(--font-mono);color:var(--blue);\">\n            marker\n\
    \           </td>\n<td>\n            str / 'o'\n           </td>\n<td>\n     \
    \       Marker shape style (e.g.\n\n             'o'\n\n            circle,\n\n\
