      x_line = np.linspace(x.min(), x.max(), 100); plt.plot(x_line, slope*x_line + intercept, ''--''). Degree=2 gives a parabola.'
    wrong_fb: ❌ np.polyfit(x, y, 1) is the answer. Returns [slope, intercept]. Then evaluate y = slope*x + intercept on a
      smooth x range and plot it with plt.plot(). Degree=1 is linear; degree=2 is quadratic curve.
