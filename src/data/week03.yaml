    df[<span class="str">'is_weekend'</span>] = (df[<span class="str">'day_of_week'</span>] >= <span class="num">5</span>).<span class="fn">astype</span>(int)  <span class="cm"># 0 or 1</span>
    df[<span class="str">'is_month_end'</span>] = df[<span class="str">'order_date'</span>].dt.is_month_end.<span class="fn">astype</span>(int)

    <span class="fn">print</span>(df.<span class="fn">drop</span>(<span class="str">'order_date'</span>, axis=<span class="num">1</span>))
