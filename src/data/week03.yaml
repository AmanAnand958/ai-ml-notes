                 <br/>
                 Upper: Q3 + 1.5×IQR
                 <br/>
                 IQR = Q3 − Q1
  - front: When to use RobustScaler?
    back: |-
      When data has significant outliers
                 <br/>
                 Uses median + IQR
                 <br/>
                 Outliers don't affect it
  - front: 'Core concept: What is the significance of log1p vs log? in Feature Scaling + Outlier Handling?'
    back: |-
      log1p(x) = log(1+x)
                 <br/>
                 Safe when x=0
                 <br/>
                 log(0) = -infinity → crash
  gotcha:
    title: '⚠️ Gotcha: NumPy In-Place vs Copy Operations'
    description: NumPy slicing returns a view, not a copy. Modifying a slice directly mutates the original array.
  takeaways:
