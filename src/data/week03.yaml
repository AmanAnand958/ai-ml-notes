  - num_str: QUESTION 2 OF 4
    question: A "State" column has 28 unique values. You plan to use it in a linear
      regression model. What's the best strategy?
    qid: q16_2
    options:
    - letter: A
      text: LabelEncoder — compact and simple
      is_correct: false
      id: a
    - letter: B
      text: One-Hot Encoding — creates 28 columns
      is_correct: false
      id: b
    - letter: C
      text: Target Encoding — replace each state with mean target value
      is_correct: true
      id: c
    - letter: D
      text: Drop the column — too many categories
      is_correct: false
      id: d
    correct_fb: '✅ Correct! 28 states → One-Hot creates 27 new columns (high dimensionality).
      LabelEncoder on nominal states is invalid for linear models (implies ordering).
      Target Encoding replaces each state with its mean target value — one compact
      column that captures the signal. Remember: compute target.'
    wrong_fb: '❌ 28 states is medium-high cardinality. LabelEncoder implies false
      ordering. One-Hot creates 27 columns — acceptable but adds dimensionality. Best
      choice: Target Encoding for linear models (replace state with mean target value
      for that state, computed on train set only).'
    correct: c
  - num_str: QUESTION 3 OF 4
    question: What is the "dummy variable trap"?
    qid: q16_3
    options:
    - letter: A
      text: Using too few dummy variables for a column
      is_correct: false
      id: a
    - letter: B
      text: Perfect multicollinearity when all one-hot columns together predict each
        other
      is_correct: true
      id: b
    - letter: C
      text: Using One-Hot Encoding on ordinal data
      is_correct: false
      id: c
    - letter: D
      text: When get_dummies() creates wrong column names
      is_correct: false
      id: d
    correct_fb: '✅ Correct! For 3 categories (A, B, C): col_C = 1 − col_A − col_B
      always. This perfect linear relationship breaks linear regression''s matrix
      inversion (XᵀX becomes singular). Fix: always use drop_first=True — drop one
      column. The model can reconstruct its value from the remaining columns..'
    wrong_fb: '❌ The dummy variable trap: with k categories, you get k binary columns
      where the last = 1 − sum(all others). This is perfect multicollinearity — breaks
      linear models. Fix: drop_first=True to keep only k−1 columns. Tree models don''t
      have this issue.'
    correct: b
