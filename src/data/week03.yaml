    solution_code: '# Engineer 5 New Titanic Features

      import pandas as pd

      import numpy as np

      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"

      df = pd.read_csv(url)

      df["FamilySize"] = df["SibSp"] + df["Parch"] + 1

      df["IsAlone"] = (df["FamilySize"] == 1).astype(int)

      df["Title"] = df["Name"].str.extract(r", (\w+)\.")

      rare = ["Lady","Countess","Capt","Col","Don","Dr","Major","Rev","Sir","Jonkheer","Dona"]

      df["Title"] = df["Title"].replace(rare, "Rare")

      df["Title"] = df["Title"].replace(["Mlle","Ms"],"Miss").replace("Mme","Mrs")

      df["FareBin"] = pd.qcut(df["Fare"], 4, labels=["Low","Med","High","VHigh"],
      duplicates="drop")

      df["AgeBin"] = pd.cut(df["Age"], bins=[0,12,18,35,60,100], labels=["Child","Teen","Adult","Middle","Senior"])

      print(f"1. FamilySize: range {df[''FamilySize''].min()}-{df[''FamilySize''].max()}")

      print(f"2. IsAlone: {dict(df[''IsAlone''].value_counts())}")

      print(f"3. Title: {list(df[''Title''].dropna().unique())}")

      print(f"4. FareBin: {list(df[''FareBin''].dropna().unique())}")

      print(f"5. AgeBin: {list(df[''AgeBin''].dropna().unique())}")'
