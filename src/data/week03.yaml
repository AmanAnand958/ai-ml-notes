  analogy: sns.set_theme() ek line mein sab charts ko professional look deta hai.
    Iske bina charts basic dikhte hain; iske baad woh publication-quality lagte hain.
  theory_html: "<h3 class=\"sh3\">\n       0. Setup — Always Start With Theme\n  \
    \    </h3>\n\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — seaborn_setup.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span\
    \ class=\"kw\">import</span> seaborn <span class=\"kw\">as</span> sns\n<span class=\"\
    kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"\
    kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\"\
    >import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># ──\
    \ Set theme ONCE at top — affects all charts ──</span>\nsns.<span class=\"fn\"\
    >set_theme</span>(style=<span class=\"str\">'darkgrid'</span>)    <span class=\"\
    cm\"># dark background with grid</span>\n<span class=\"cm\"># style options: 'darkgrid',\
    \ 'whitegrid', 'dark', 'white', 'ticks'</span>\n\nsns.<span class=\"fn\">set_palette</span>(<span\
    \ class=\"str\">'husl'</span>)             <span class=\"cm\"># beautiful color\
    \ palette</span>\n<span class=\"cm\"># palette options: 'husl', 'Set2', 'coolwarm',\
    \ 'muted', 'deep'</span>\n\n<span class=\"cm\"># ── Load built-in datasets (no\
    \ file needed!) ──</span>\ndf_titanic = sns.<span class=\"fn\">load_dataset</span>(<span\
    \ class=\"str\">'titanic'</span>)    <span class=\"cm\"># 891 rows, 15 cols</span>\n\
    df_iris    = sns.<span class=\"fn\">load_dataset</span>(<span class=\"str\">'iris'</span>)\
    \       <span class=\"cm\"># 150 rows, 5 cols, 3 species</span>\ndf_tips    =\
    \ sns.<span class=\"fn\">load_dataset</span>(<span class=\"str\">'tips'</span>)\
    \       <span class=\"cm\"># 244 rows, restaurant tips</span>\ndf_penguins= sns.<span\
    \ class=\"fn\">load_dataset</span>(<span class=\"str\">'penguins'</span>)  <span\
    \ class=\"cm\"># 344 rows, 3 species</span>\n\n<span class=\"fn\">print</span>(df_titanic.shape)\
    \   <span class=\"cm\"># (891, 15)</span>\n<span class=\"fn\">print</span>(df_titanic.columns.<span\
    \ class=\"fn\">tolist</span>())</code></pre>\n</div>\n<!-- ─── CORRELATION HEATMAP\
    \ ─── -->\n<h3 class=\"sh3\">\n       1. \U0001F525 Correlation Heatmap — The\
    \ #1 EDA Chart\n      </h3>\n\n<div class=\"ml-connect\">\n       Correlation\
    \ heatmap instantly shows: (1) which features are predictive of the target (high\
    \ |corr| with Survived), (2) which features are multicollinear with each other\
    \ (bad for linear models).\n       <br/>\n<br/>\n       Run this before every\
    \ ML project.\n      </div>\n<div style=\"background:var(--bg2);border:1px solid\
    \ var(--border);border-radius:var(--radius);padding:1rem;margin:1rem 0;\">\n<strong\
    \ style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\"\
    >\n        \U0001F4CA Live Preview — Correlation Heatmap\n       </strong>\n<canvas\
    \ height=\"220\" id=\"canvas-heatmap19\" style=\"width:100%;max-max-width: 100%;\
    \ width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0 auto;\"\
    \ width=\"560\">\n</canvas>\n\n</div>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — correlation_heatmap.py\n      \
    \  </span>\n<div class=\"cb-btns\">\n<button class=\"run-btn\" onclick=\"openRepl()\"\
    >\n          ▶ try online\n         </button>\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><code><span class=\"kw\">import</span> seaborn\
    \ <span class=\"kw\">as</span> sns\n<span class=\"kw\">import</span> matplotlib.pyplot\
    \ <span class=\"kw\">as</span> plt\n\ndf = sns.<span class=\"fn\">load_dataset</span>(<span\
    \ class=\"str\">'titanic'</span>)\n\n<span class=\"cm\"># ── Always select numeric\
    \ columns first ──</span>\nnumeric_df = df.<span class=\"fn\">select_dtypes</span>(include=[<span\
    \ class=\"str\">'number'</span>])\ncorr = numeric_df.<span class=\"fn\">corr</span>()\
    \    <span class=\"cm\"># Pearson correlation: -1 to +1</span>\n\nplt.<span class=\"\
    fn\">figure</span>(figsize=(<span class=\"num\">9</span>, <span class=\"num\"\
    >7</span>))\nsns.<span class=\"fn\">heatmap</span>(\n    corr,\n    annot=<span\
    \ class=\"kw\">True</span>,           <span class=\"cm\"># show numbers in each\
    \ cell</span>\n    fmt=<span class=\"str\">'.2f'</span>,             <span class=\"\
    cm\"># 2 decimal places</span>\n    cmap=<span class=\"str\">'coolwarm'</span>,\
    \      <span class=\"cm\"># blue=negative, red=positive</span>\n    center=<span\
    \ class=\"num\">0</span>,             <span class=\"cm\"># centre the colormap\
    \ at 0</span>\n    square=<span class=\"kw\">True</span>,          <span class=\"\
    cm\"># make cells square</span>\n    linewidths=<span class=\"num\">0.5</span>,\
    \       <span class=\"cm\"># grid lines between cells</span>\n    vmin=-<span\
    \ class=\"num\">1</span>, vmax=<span class=\"num\">1</span>,      <span class=\"\
    cm\"># fix scale from -1 to +1</span>\n    annot_kws={<span class=\"str\">'size'</span>:\
    \ <span class=\"num\">9</span>}  <span class=\"cm\"># font size of numbers</span>\n\
    )\nplt.<span class=\"fn\">title</span>(<span class=\"str\">'Titanic Feature Correlation\
    \ Matrix'</span>, fontsize=<span class=\"num\">14</span>, pad=<span class=\"num\"\
    >15</span>)\nplt.<span class=\"fn\">xticks</span>(rotation=<span class=\"num\"\
    >45</span>, ha=<span class=\"str\">'right'</span>)\nplt.<span class=\"fn\">tight_layout</span>()\n\
    plt.<span class=\"fn\">savefig</span>(<span class=\"str\">'correlation_heatmap.png'</span>,\
    \ dpi=<span class=\"num\">150</span>); plt.<span class=\"fn\">show</span>()\n\n\
    <span class=\"cm\"># ── Reading the heatmap ──</span>\n<span class=\"cm\"># Survived\
    \ vs Pclass: -0.34 → lower class = less survival</span>\n<span class=\"cm\">#\
    \ Survived vs Fare: +0.26 → higher fare = more survival</span>\n<span class=\"\
    cm\"># SibSp vs Parch: +0.41 → families travel together</span>\n<span class=\"\
    cm\"># Look for: high |corr| with target = useful feature</span>\n<span class=\"\
    cm\"># Look for: high |corr| between features = multicollinearity</span>\n\n<span\
    \ class=\"cm\"># ── Find top correlations with target ──</span>\ncorr_with_target\
    \ = corr[<span class=\"str\">'survived'</span>].<span class=\"fn\">abs</span>().<span\
    \ class=\"fn\">sort_values</span>(ascending=<span class=\"kw\">False</span>)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">'Top features by correlation\
    \ with Survived:'</span>)\n<span class=\"fn\">print</span>(corr_with_target.<span\
    \ class=\"fn\">drop</span>(<span class=\"str\">'survived'</span>).<span class=\"\
    fn\">head</span>(<span class=\"num\">5</span>))</code></pre>\n</div>\n<!-- ───\
    \ PAIRPLOT ─── -->\n<h3 class=\"sh3\">\n       2. \U0001F517 Pairplot — All Feature\
    \ Relationships at Once\n      </h3>\n\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — pairplot.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><code><span class=\"kw\">import</span> seaborn <span class=\"kw\">as</span>\
    \ sns\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span>\
    \ plt\n\ndf = sns.<span class=\"fn\">load_dataset</span>(<span class=\"str\">'iris'</span>)\
    \    <span class=\"cm\"># 4 features, 3 species</span>\n\n<span class=\"cm\">#\
    \ ── Basic pairplot ──</span>\nsns.<span class=\"fn\">pairplot</span>(df, hue=<span\
    \ class=\"str\">'species'</span>)   <span class=\"cm\"># color by class</span>\n\
    plt.<span class=\"fn\">suptitle</span>(<span class=\"str\">'Iris Dataset — Pairplot'</span>,\
    \ y=<span class=\"num\">1.02</span>)\nplt.<span class=\"fn\">savefig</span>(<span\
    \ class=\"str\">'pairplot_basic.png'</span>, dpi=<span class=\"num\">120</span>,\
    \ bbox_inches=<span class=\"str\">'tight'</span>); plt.<span class=\"fn\">show</span>()\n\
    \n<span class=\"cm\"># ── Customised pairplot ──</span>\nsns.<span class=\"fn\"\
    >pairplot</span>(\n    df,\n    hue=<span class=\"str\">'species'</span>,\n  \
    \  palette=<span class=\"str\">'Set2'</span>,            <span class=\"cm\">#\
    \ color palette</span>\n    diag_kind=<span class=\"str\">'kde'</span>,      \
    \    <span class=\"cm\"># 'hist' or 'kde' on diagonal</span>\n    plot_kws={<span\
    \ class=\"str\">'alpha'</span>: <span class=\"num\">0.6</span>},   <span class=\"\
    cm\"># transparency for scatter dots</span>\n    markers=[<span class=\"str\"\
    >'o'</span>, <span class=\"str\">'s'</span>, <span class=\"str\">'^'</span>] \
    \   <span class=\"cm\"># different markers per class</span>\n)\nplt.<span class=\"\
    fn\">suptitle</span>(<span class=\"str\">'Iris — Customised Pairplot'</span>,\
    \ y=<span class=\"num\">1.02</span>)\nplt.<span class=\"fn\">savefig</span>(<span\
    \ class=\"str\">'pairplot_custom.png'</span>, dpi=<span class=\"num\">120</span>,\
    \ bbox_inches=<span class=\"str\">'tight'</span>)\n\n<span class=\"cm\"># ⚠️ Pairplot\
