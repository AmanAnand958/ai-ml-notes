  theory_html: "<h3 class=\"sh3\">\n       1. Why Scaling Matters\n      </h3>\n\n\
    <div class=\"ml-connect\">\n       Models that compute distances (KNN, SVM, K-Means)\
    \ or use gradient descent (Linear Regression, Neural Networks, Logistic Regression)\
    \ are heavily affected by feature scale.\n       <br/>\n<br/>\n       Tree-based\
    \ models (Decision Tree, Random Forest, XGBoost) are completely unaffected — they\
    \ split on values, not distances.\n       <br/>\n<br/>\n       Always scale for\
    \ the former group; skip for the latter.\n      </div>\n<h3 class=\"sh3\">\n \
    \      2. StandardScaler (Z-score Normalization)\n      </h3>\n<div class=\"cb\"\
    >\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — scaling.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"run-btn\" onclick=\"\
