      df = pd.<span class="fn">read_csv</span>(url)

      fig,ax = plt.<span class="fn">subplots</span>(<span class="num">1</span>,<span
      class="num">2</span>,figsize=(<span class="num">14</span>,<span class="num">6</span>))

