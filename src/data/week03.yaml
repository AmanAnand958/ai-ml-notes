    \ solid var(--border);border-radius:10px;padding:1.2rem;margin:1rem 0;\">\n<h3> style=\"margin-top:0;color:var(--blue);font-size:14px;display:flex;align-items:center;gap:0.4rem;\"\
    >\n        \U0001F4D6 Core Theory &amp; Parameters\n        (3)</h3>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem\
    \ 0;line-height:1.5;\">\n<strong>\n         What it is:\n        </strong>\n        A Scatter Plot displays individual\
    \ data points as markers on a 2D coordinate space, plotting two numerical variables along the X and Y axes.\n       </p>\n\
    <p style=\"font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\">\n<strong>\n         When to use:\n   \
    \     </strong>\n        Examining correlations, trends, cluster patterns, or detecting outliers between two continuous\
    \ variables (e.g., Age vs. Fare, Study Hours vs. Score).\n       </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem\
    \ 0;line-height:1.5;\">\n<strong>\n         Basic Syntax:\n        </strong>\n\n         plt.scatter(x, y, s=None, c=None,\
    \ marker=None, cmap=None, alpha=None, edgecolors=None)\n\n</p>\n<div style=\"margin-top:0.8rem;\">\n<strong style=\"font-size:12px;color:var(--muted);display:block;margin-bottom:0.4rem;\"\
    >\n         \U0001F4A1 Key Parameters:\n        </strong>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin:\
    \ 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<thead>\n<tr>\n<th style=\"width:25%;\">\n            Parameter\n\
    \           </th>\n<th style=\"width:25%;\">\n            Type / Default\n           </th>\n<th style=\"width:50%;\">\n\
    \            Description &amp; Options\n           </th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\"\
    >\n            s\n           </td>\n<td>\n            scalar or array\n           </td>\n<td>\n            Marker size.\
    \ Can map to a third numeric variable (creating a bubble chart).\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\"\
    >\n            c\n           </td>\n<td>\n            color or array\n           </td>\n<td>\n            Marker color.\
    \ Can map to categories (categorical colors) or float numbers (colormap gradient).\n           </td>\n</tr>\n<tr>\n<td\
    \ style=\"font-family:var(--font-mono);color:var(--blue);\">\n            marker\n           </td>\n<td>\n           \
    \ str / 'o'\n           </td>\n<td>\n            Marker shape style (e.g.\n\n             'o'\n\n            circle,\n\
    \n             's'\n\n            square,\n\n             '^'\n\n            triangle,\n\n             'x'\n\n       \
    \     cross).\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\">\n       \
    \     cmap\n           </td>\n<td>\n            str / None\n           </td>\n<td>\n            Colormap used to map continuous\
    \ floats in\n\n             c\n\n            to colors (e.g.\n\n             'viridis'\n\n            ,\n\n          \
    \   'coolwarm'\n\n            ).\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\"\
    >\n            alpha\n           </td>\n<td>\n            float / None\n           </td>\n<td>\n            Transparency\
    \ of markers (0.0 to 1.0). Great for resolving overplotting issues.\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\"\
    >\n            edgecolors\n           </td>\n<td>\n            str / None\n           </td>\n<td>\n            Color of\
    \ the marker boundaries. Set to\n\n             'none'\n\n            to remove borders.\n           </td>\n</tr>\n</tbody>\n\
    </table></div>\n</div>\n</div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\
    \ — scatter_plot.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n\
    \          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> matplotlib.pyplot <span class=\"\
    kw\">as</span> plt\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\nnp.random.<span class=\"\
    fn\">seed</span>(<span class=\"num\">42</span>)\nage    = np.random.<span class=\"fn\">randint</span>(<span class=\"num\"\
    >22</span>, <span class=\"num\">60</span>, <span class=\"num\">200</span>)\nsalary = age * <span class=\"num\">1500</span>\
    \ + np.random.<span class=\"fn\">normal</span>(<span class=\"num\">0</span>, <span class=\"num\">10000</span>, <span class=\"\
    num\">200</span>)\ndept   = np.random.<span class=\"fn\">choice</span>([<span class=\"str\">'ML'</span>, <span class=\"\
    str\">'Data'</span>, <span class=\"str\">'Software'</span>], <span class=\"num\">200</span>)\nexp    = np.random.<span\
    \ class=\"fn\">randint</span>(<span class=\"num\">1</span>, <span class=\"num\">15</span>, <span class=\"num\">200</span>)\n\
    \nplt.<span class=\"fn\">figure</span>(figsize=(<span class=\"num\">10</span>, <span class=\"num\">5</span>))\n\n<span\
    \ class=\"cm\"># ── Color each department differently ──</span>\ncolors_map = {<span class=\"str\">'ML'</span>: <span\
    \ class=\"str\">'#6c8cff'</span>, <span class=\"str\">'Data'</span>: <span class=\"str\">'#4fd1a5'</span>, <span class=\"\
    str\">'Software'</span>: <span class=\"str\">'#f7a94b'</span>}\n<span class=\"kw\">for</span> d <span class=\"kw\">in</span>\
    \ [<span class=\"str\">'ML'</span>, <span class=\"str\">'Data'</span>, <span class=\"str\">'Software'</span>]:\n    mask\
    \ = dept == d\n    plt.<span class=\"fn\">scatter</span>(age[mask], salary[mask],\n                c=colors_map[d],\n\
    \                s=exp[mask]*<span class=\"num\">8</span>,      <span class=\"cm\"># size = years of experience</span>\n\
    \                alpha=<span class=\"num\">0.7</span>, edgecolors=<span class=\"str\">'none'</span>, label=d)\n\n<span\
    \ class=\"cm\"># ── Add best-fit trend line ──</span>\nm, b = np.<span class=\"fn\">polyfit</span>(age, salary, <span\
    \ class=\"num\">1</span>)   <span class=\"cm\"># returns [slope, intercept]</span>\nx_line = np.<span class=\"fn\">linspace</span>(<span\
    \ class=\"num\">22</span>, <span class=\"num\">60</span>, <span class=\"num\">100</span>)\nplt.<span class=\"fn\">plot</span>(x_line,\
    \ m*x_line + b, <span class=\"str\">'--'</span>, color=<span class=\"str\">'white'</span>, lw=<span class=\"num\">2</span>,\
    \ label=<span class=\"str\">'Trend'</span>)\n\n<span class=\"cm\"># ── Annotate the top earner ──</span>\nidx = np.<span\
    \ class=\"fn\">argmax</span>(salary)\nplt.<span class=\"fn\">annotate</span>(\n    <span class=\"str\">f'Top: ₹{salary[idx]:,.0f}'</span>,\n\
    \    xy=(age[idx], salary[idx]),\n    xytext=(age[idx]-<span class=\"num\">8</span>, salary[idx]-<span class=\"num\">12000</span>),\n\
    \    arrowprops=<span class=\"fn\">dict</span>(arrowstyle=<span class=\"str\">'-&gt;'</span>, color=<span class=\"str\"\
    >'#f7a94b'</span>),\n    fontsize=<span class=\"num\">9</span>, color=<span class=\"str\">'#f7a94b'</span>\n)\n\nplt.<span\
    \ class=\"fn\">title</span>(<span class=\"str\">'Salary by Age — Color=Dept, Size=Experience'</span>, fontsize=<span class=\"\
    num\">13</span>)\nplt.<span class=\"fn\">xlabel</span>(<span class=\"str\">'Age'</span>); plt.<span class=\"fn\">ylabel</span>(<span\
    \ class=\"str\">'Salary (₹)'</span>)\nplt.<span class=\"fn\">legend</span>(); plt.<span class=\"fn\">grid</span>(alpha=<span\
    \ class=\"num\">0.2</span>)\nplt.<span class=\"fn\">tight_layout</span>(); plt.<span class=\"fn\">savefig</span>(<span\
    \ class=\"str\">'scatter.png'</span>, dpi=<span class=\"num\">150</span>); plt.<span class=\"fn\">show</span>()\n</pre>\n\
