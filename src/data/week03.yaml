    str\">'ML'</span>, <span class=\"str\">'Data'</span>, <span class=\"str\">'Software'</span>],\
    \ <span class=\"num\">200</span>)\nexp    = np.random.<span class=\"fn\">randint</span>(<span\
    \ class=\"num\">1</span>, <span class=\"num\">15</span>, <span class=\"num\">200</span>)\n\
    \nplt.<span class=\"fn\">figure</span>(figsize=(<span class=\"num\">10</span>,\
    \ <span class=\"num\">5</span>))\n\n<span class=\"cm\"># ── Color each department\
    \ differently ──</span>\ncolors_map = {<span class=\"str\">'ML'</span>: <span\
    \ class=\"str\">'#6c8cff'</span>, <span class=\"str\">'Data'</span>: <span class=\"\
    str\">'#4fd1a5'</span>, <span class=\"str\">'Software'</span>: <span class=\"\
    str\">'#f7a94b'</span>}\n<span class=\"kw\">for</span> d <span class=\"kw\">in</span>\
    \ [<span class=\"str\">'ML'</span>, <span class=\"str\">'Data'</span>, <span class=\"\
    str\">'Software'</span>]:\n    mask = dept == d\n    plt.<span class=\"fn\">scatter</span>(age[mask],\
    \ salary[mask],\n                c=colors_map[d],\n                s=exp[mask]*<span\
    \ class=\"num\">8</span>,      <span class=\"cm\"># size = years of experience</span>\n\
    \                alpha=<span class=\"num\">0.7</span>, edgecolors=<span class=\"\
    str\">'none'</span>, label=d)\n\n<span class=\"cm\"># ── Add best-fit trend line\
    \ ──</span>\nm, b = np.<span class=\"fn\">polyfit</span>(age, salary, <span class=\"\
    num\">1</span>)   <span class=\"cm\"># returns [slope, intercept]</span>\nx_line\
    \ = np.<span class=\"fn\">linspace</span>(<span class=\"num\">22</span>, <span\
    \ class=\"num\">60</span>, <span class=\"num\">100</span>)\nplt.<span class=\"\
