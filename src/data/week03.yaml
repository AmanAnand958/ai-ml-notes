    solution_code: |-
      # Full EDA Report - 7 Charts
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"
      df = pd.read_csv(url)
      fig,ax = plt.subplots(3,3,figsize=(16,14))
      ax = ax.flat
      df["Survived"].value_counts().plot(kind="pie",ax=ax[0],autopct="%1.1f%%",colors=["salmon","lightgreen"])
      ax[0].set_title("Survival Rate")
      ax[0].set_ylabel("")
      df.groupby("Pclass")["Survived"].mean().plot(kind="bar",ax=ax[1],color="steelblue")
      ax[1].set_title("Survival by Class")
      df.groupby("Sex")["Survived"].mean().plot(kind="bar",ax=ax[2],color=["pink","lightblue"])
      ax[2].set_title("Survival by Gender")
      df.groupby(["Pclass","Sex"])["Survived"].mean().unstack().plot(kind="bar",ax=ax[3])
      ax[3].set_title("Survival by Class+Gender")
      df["Age"].hist(bins=30,ax=ax[4],color="purple",alpha=0.7,edgecolor="black")
      ax[4].set_title("Age Distribution")
      df["Fare"].hist(bins=30,ax=ax[5],color="orange",alpha=0.7,edgecolor="black")
      ax[5].set_title("Fare Distribution")
      df["Embarked"].value_counts().plot(kind="bar",ax=ax[6],color="green")
      ax[6].set_title("Embarkation Port")
      df["SibSp"].value_counts().sort_index().plot(kind="bar",ax=ax[7])
      ax[7].set_title("Siblings/Spouses Aboard")
      ax[8].axis("off")
      plt.tight_layout()
      plt.savefig("eda_7_chart_report.png")
      print("Full EDA Report (7 charts) saved!")
      assert ax is not None, "ax should not be None"
    solution_lang: python
