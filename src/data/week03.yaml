      \ data.\n          <br/>\n          MNAR: related to missing value itself."
  - front: StandardScaler formula (D21)?
    back: "z = (x - mean) / std\n          <br/>\n          Creates mean=0, variance=1.\
      \ This establishes the core invariant in Full Preprocessing + Visualization\
      \ Pipeline, ensuring memory efficiency, numerical stability, and robust scaling."
  - front: RobustScaler advantage?
    back: "Uses median and IQR (interquartile range)\n          <br/>\n          Not\
      \ influenced by extreme outliers."
  - front: One-Hot Encoding dummy trap?
    back: "Multicollinearity from dummy columns.\n          <br/>\n          Fixed\
      \ by dropping first column. This establishes the core invariant in Full Preprocessing\
      \ + Visualization Pipeline, ensuring memory efficiency, numerical stability,\
      \ and robust scaling."
  - front: What is data leakage?
