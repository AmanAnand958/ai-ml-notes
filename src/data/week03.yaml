                 </li>
      </ul>
    done_when: When side-by-side histograms showing the skewness improvement, and lower RMSE from the log-transformed model.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day17: log transformation on house prices + RMSE comparison"'
    sol_id: sol-w3d17t3
    solution_title: 📓 Complete Colab Code
    solution_code: |-
      # Log Transform + Distribution Analysis
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"
      df = pd.read_csv(url)["Fare"].dropna()
      fig,ax = plt.subplots(1,2,figsize=(12,5))
      ax[0].hist(df, bins=40, alpha=0.7, edgecolor='black')
      ax[0].set_title(f"Original: skew={df.skew():.2f}")
      log_fare = np.log1p(df)
      ax[1].hist(log_fare, bins=40, alpha=0.7, edgecolor='black')
      ax[1].set_title(f"Log-transformed: skew={log_fare.skew():.2f}")
      plt.tight_layout()
      plt.savefig("log_transform.png")
      print(f"Original: mean={df.mean():.1f} median={df.median():.1f} skew={df.skew():.2f}")
      print(f"Log(1+x): mean={log_fare.mean():.3f} median={log_fare.median():.3f} skew={log_fare.skew():.2f}")
      print("Log transform normalised the distribution significantly!")
      assert log_fare is not None, "log_fare should not be None"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: 'You have a salary feature: most values are between ₹30,000–₹80,000 but a few are ₹10,00,000+. Which scaler
      should you use?'
    qid: q17_1
    options:
    - letter: A
      text: StandardScaler — it's the default
      is_correct: false
      id: a
    - letter: B
      text: MinMaxScaler — maps to [0,1]
      is_correct: false
      id: b
    - letter: C
      text: RobustScaler — robust to those outliers
      is_correct: true
      id: c
    - letter: D
      text: No scaling needed for salary
      is_correct: false
      id: d
    correct_fb: ✅ Correct! MinMaxScaler would map ₹10L to 1.0 and compress everything else into [0, 0.07]. StandardScaler's
      mean gets pulled by those extreme values. RobustScaler uses median and IQR — the ₹10L outliers don't affect the median
      or IQR significantly, so the bulk of the data is still.
    wrong_fb: ❌ With salary outliers at ₹10L+, MinMaxScaler maps all normal salaries into a tiny range [0, 0.07] — the outlier
      dominates. StandardScaler's mean and std get pulled by outliers. RobustScaler uses median and IQR which are outlier-resistant
      — the right choice here.
    correct: c
  - num_str: QUESTION 2 OF 4
    question: Which of these models does NOT require feature scaling?
    qid: q17_2
    options:
    - letter: A
      text: K-Nearest Neighbors
      is_correct: false
      id: a
    - letter: B
      text: Support Vector Machine
      is_correct: false
      id: b
    - letter: C
      text: Random Forest
      is_correct: true
      id: c
    - letter: D
      text: Neural Network
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Random Forest is a tree-based ensemble. Trees split by asking "is feature X above threshold T?"
      — the actual scale doesn't matter, only the relative ordering of values. A salary of ₹50,000 vs ₹5,000 — the tree just
      checks which side of a threshold it falls on. KNN uses Euclidean.
    wrong_fb: ❌ Random Forest doesn't need scaling. Tree-based models split by thresholds — scale is irrelevant. KNN uses
      Euclidean distance (scale matters massively), SVM uses kernel distances, Neural Networks use gradient descent (large
      feature values → exploding/vanishing gradients). Tree = no scale needed; everything else = scale!
    correct: c
  - num_str: QUESTION 3 OF 4
    question: The IQR method flags outliers as values beyond Q1 − 1.5×IQR and Q3 + 1.5×IQR. What is IQR?
    qid: q17_3
    options:
    - letter: A
      text: max − min of the data
      is_correct: false
      id: a
    - letter: B
      text: Q3 − Q1 (75th percentile minus 25th percentile)
      is_correct: true
      id: b
    - letter: C
      text: The standard deviation of the data
      is_correct: false
      id: c
    - letter: D
      text: The median minus the mean
      is_correct: false
      id: d
    correct_fb: '✅ Correct! IQR = Interquartile Range = Q3 − Q1. It represents the middle 50% of the data. The "1.5×IQR fence"
      rule was developed by John Tukey — points outside this range are flagged as potential outliers. Using IQR makes outlier
      detection robust: extreme outliers don''t affect Q1, Q3, or.'
    wrong_fb: '❌ IQR = Q3 − Q1 = 75th percentile minus 25th percentile. It captures the middle 50% of your data. Outlier bounds:
      Q1 − 1.5×IQR (lower) and Q3 + 1.5×IQR (upper). Points outside these fences are flagged. IQR is robust — outliers don''t
      affect it, unlike range or std.'
    correct: b
  - num_str: QUESTION 4 OF 4
    question: "What does\n         \n          np.log1p(x)\n         \n         do and why is it preferred over\n        \
      \ \n          np.log(x)\n         \n         for feature transformation?"
    qid: q17_4
    options:
    - letter: A
      text: It adds 1 to the output of log(x)
      is_correct: false
      id: a
    - letter: B
      text: It computes log(1 + x) — handles zero values safely
      is_correct: true
      id: b
    - letter: C
      text: It computes the natural log on positive values only
      is_correct: false
      id: c
    - letter: D
      text: It is faster than np.log() for large arrays
      is_correct: false
      id: d
    correct_fb: ✅ Correct! log(0) = −∞ which breaks everything. log1p(x) = log(1+x), so log1p(0) = log(1) = 0. This safely
      handles features that include zero values (e.g., purchase count = 0). Also numerically more stable for very small values
      near 0. Always prefer np.log1p() over np.log() for feature.
    wrong_fb: ❌ log1p(x) computes log(1+x). log(0) = −∞ which crashes everything. log1p(0) = log(1) = 0 — safe! This is important
      when your feature can have zero values (purchases, counts, etc). Always use np.log1p() for feature transformation to
      avoid the log(0) problem.
    correct: b
  flashcards:
  - front: StandardScaler formula?
    back: |-
      (x − mean) / std
                 <br/>
                 Result: mean=0, std=1 This establishes the core invariant in Feature Scaling + Outlier Handling, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: Which models NEED scaling?
