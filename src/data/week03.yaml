    sol_id: sol-w3d17t1
    solution_title: 📓 Complete Colab Code
    solution_code: '# Detect and Visualise Outliers with IQR

      import numpy as np

      import pandas as pd

      np.random.seed(42)

      data = np.concatenate([np.random.normal(50, 10, 100), [120, 5, 130, 3, 140,
      2]])

      s = pd.Series(data, name="values")

      Q1, Q3 = s.quantile(0.25), s.quantile(0.75)

      IQR = Q3 - Q1

      lo, hi = Q1 - 1.5*IQR, Q3 + 1.5*IQR

      outliers = s[(s<lo)|(s>hi)]

      print(f"Q1={Q1:.2f}, Q3={Q3:.2f}, IQR={IQR:.2f}")

      print(f"Fences: [{lo:.2f}, {hi:.2f}]")

      print(f"Outliers ({len(outliers)}): {list(outliers.values)}")

      print(f"With outliers: mean={s.mean():.2f}, med={s.median():.2f}")

      clean = s[(s>=lo)&(s<=hi)]

      print(f"Without outliers: mean={clean.mean():.2f}, med={clean.median():.2f}")

      assert clean is not None, "clean should not be None"'
