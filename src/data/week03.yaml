    sol_id: sol-w3d19t3
    solution_title: 📓 Complete Colab Code
    solution_code: |-
      # Interactive Plotly Dashboard
      import pandas as pd
      import numpy as np
      try:
          import plotly.express as px
          import plotly.graph_objects as go
          from plotly.subplots import make_subplots
          url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"
          df = pd.read_csv(url)
          fig = make_subplots(rows=2, cols=2, subplot_titles=["Age Dist","Class Survival","Fare vs Age","Gender"])
          fig.add_trace(go.Histogram(x=df["Age"].dropna(),name="Age"), row=1, col=1)
          for c in [1,2,3]:
              sr = df[df["Pclass"]==c]["Survived"].mean()
              fig.add_trace(go.Bar(x=[f"Class {c}"], y=[sr], name=f"Class {c}"), row=1, col=2)
          fig.add_trace(go.Scatter(x=df["Age"], y=df["Fare"], mode="markers",
                        marker=dict(color=df["Survived"],colorscale="RdBu"), name="Survival"), row=2, col=1)
          gb = df["Sex"].value_counts()
          fig.add_trace(go.Pie(labels=gb.index, values=gb.values), row=2, col=2)
          fig.update_layout(height=700, title_text="Titanic Interactive Dashboard")
          fig.write_html("titanic_dashboard.html")
          print("Saved titanic_dashboard.html!")
      except ImportError:
          print("Plotly not installed. Install with: pip install plotly")
    solution_lang: python
