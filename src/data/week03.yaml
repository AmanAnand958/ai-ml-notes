  quizzes:
  - num_str: QUESTION 1 OF 5
    question: 'A correlation value of −0.8 between two features means:'
    qid: q19_1
    options:
    - letter: A
      text: The two features are almost identical
      is_correct: false
    - letter: B
      text: Strong negative correlation — as one increases, the other strongly decreases
      is_correct: true
    - letter: C
      text: The two features are unrelated
      is_correct: false
    - letter: D
      text: One feature is 80% of the other's value
      is_correct: false
    correct_fb: '✅ Correct! Correlation ranges from −1 to +1. −0.8 is strong negative:
      as X goes up, Y strongly goes down. In ML: |corr| &gt; 0.8 between two features
      → multicollinearity (bad for linear models). High |corr| with target → feature
      is predictive (good). 0 = no linear relationship.'
    wrong_fb: '❌ −0.8 = strong negative relationship. When X increases, Y strongly
      decreases. Range: −1 (perfectly opposite), 0 (no relation), +1 (perfectly same).
      In ML: high |corr| with target = useful feature. High |corr| between features
      = multicollinearity.'
  - num_str: QUESTION 2 OF 5
    question: "What extra information does\n         \n          sns.violinplot()\n\
      \         \n         show compared to\n         \n          sns.boxplot()\n\
      \         \n         ?"
    qid: q19_2
    options:
    - letter: A
      text: The median value
      is_correct: false
    - letter: B
      text: The outlier points beyond whiskers
      is_correct: false
    - letter: C
      text: The full density distribution shape — where data is most concentrated
      is_correct: true
    - letter: D
      text: The exact mean vs median difference
      is_correct: false
    correct_fb: '✅ Correct! A boxplot shows 5 summary statistics (Q1, median, Q3,
      whiskers, outliers). A violin adds the full KDE shape — the violin is wider
      where data is denser. Bimodal distributions (two bumps) that are hidden in boxplots
      are clearly visible in violin plots. Best practice: use inner=''box'' to show
      both simultaneously.'
    wrong_fb: ❌ Violin plot adds the density shape. Boxplot hides the distribution
      shape — two datasets with identical quartiles but different shapes look the
      same as boxes. A violin reveals if data is bimodal, symmetric, or skewed. Use
      inner='box' to get box statistics inside the violin.
  - num_str: QUESTION 3 OF 5
    question: "Why must you select numeric columns before calling\n         \n   \
      \       df.corr()\n         \n         ?"
    qid: q19_3
    options:
    - letter: A
      text: Numeric columns give more accurate correlations
      is_correct: false
    - letter: B
      text: String/categorical columns cannot be correlated — they cause a TypeError
      is_correct: true
    - letter: C
      text: It makes the heatmap look prettier
      is_correct: false
    - letter: D
      text: Correlation only works on columns with &gt;100 values
      is_correct: false
    correct_fb: '✅ Correct! Pearson correlation is only defined for numeric values.
      If your DataFrame has string columns (like ''sex'', ''embarked''), df.corr()
      raises a TypeError. Fix: numeric_df = df.select_dtypes(include=[''number''])
      before calling .corr().'
    wrong_fb: '❌ String/categorical columns cannot be mathematically correlated. df.corr()
      raises TypeError on non-numeric columns. Always do: numeric_df = df.select_dtypes(include=[''number''])
      first, then numeric_df.corr().'
  - num_str: QUESTION 4 OF 5
    question: What is the key advantage of Plotly Express over Seaborn/Matplotlib?
    qid: q19_4
    options:
    - letter: A
      text: Plotly renders faster on large datasets
      is_correct: false
    - letter: B
      text: Plotly requires less code than Seaborn
      is_correct: false
    - letter: C
      text: Plotly charts are interactive — zoom, pan, hover for exact data values
      is_correct: true
    - letter: D
      text: Plotly is free but Matplotlib requires a license
      is_correct: false
    correct_fb: ✅ Correct! Plotly generates interactive HTML — zoom, pan, hover over
      any point to see exact values, click legend to hide/show groups. Seaborn/Matplotlib
      produce static PNGs. All three are completely free. Use Plotly for presentations
      and stakeholder dashboards where interactivity matters.
    wrong_fb: ❌ Interactivity! Plotly HTML charts let users zoom in, pan, hover for
      values, and click legend to filter. Static PNG charts from Matplotlib/Seaborn
      can't do this. All three libraries are free. Plotly also tends to need slightly
      more boilerplate for complex customisation.
  - num_str: QUESTION 5 OF 5
    question: A pairplot on a 5-feature dataset creates how many total panels?
    qid: q19_5
    options:
    - letter: A
      text: '5'
      is_correct: false
    - letter: B
      text: '10'
      is_correct: false
    - letter: C
      text: '20'
      is_correct: false
    - letter: D
      text: 25 (k×k grid, diagonal=distributions, off-diagonal=scatter plots)
      is_correct: true
    correct_fb: '✅ Correct! Pairplot creates a k×k grid. For k=5: 5×5=25 panels total.
      Diagonal=5 distribution plots. Off-diagonal=20 scatter plots. This is why pairplot
      is slow for &gt;10 features — it creates k×k panels. For large feature sets,
      use correlation heatmap as a faster alternative.'
    wrong_fb: ❌ k×k grid for k features. k=5 → 5×5=25 total panels. Diagonal=5 distribution
      plots. Off-diagonal=20 scatter plots (10 unique pairs shown twice — A×B and
      B×A). For &gt;10 features, use heatmap instead of pairplot.
