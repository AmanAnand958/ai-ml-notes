    >\n        \U0001F4CA Pairplot Matrix Preview (Relationships Matrix)\n       </strong>\n\
    <canvas height=\"200\" id=\"canvas-pairplot19\" style=\"width:100%;max-max-width:\
    \ 100%; width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0\
    \ auto;\" width=\"560\">\n</canvas>\n\n</div>\n<!-- ─── BOX PLOT ─── -->\n<h3\
    \ class=\"sh3\">\n       3. \U0001F4E6 Box Plot — Quartiles + Outliers by Category\n\
    \      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       Box plots visualize the distribution of numerical\
    \ features across categories, highlighting medians, quartiles, and individual\
    \ outliers.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         python — seaborn_boxplot.py\n        </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n         \
    \ copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><code><span class=\"kw\">import</span> seaborn <span class=\"kw\">as</span>\
    \ sns\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span>\
    \ plt\n\ndf = sns.<span class=\"fn\">load_dataset</span>(<span class=\"str\">'titanic'</span>)\n\
    \nplt.<span class=\"fn\">figure</span>(figsize=(<span class=\"num\">12</span>,\
    \ <span class=\"num\">4</span>))\n\n<span class=\"cm\"># ── Subplot 1: Box plot\
    \ ──</span>\nplt.<span class=\"fn\">subplot</span>(<span class=\"num\">1</span>,\
    \ <span class=\"num\">2</span>, <span class=\"num\">1</span>)\nsns.<span class=\"\
    fn\">boxplot</span>(\n    data=df,\n    x=<span class=\"str\">'pclass'</span>,\
    \ y=<span class=\"str\">'age'</span>,\n    palette=<span class=\"str\">'Blues'</span>,\
    \          <span class=\"cm\"># color palette</span>\n    hue=<span class=\"str\"\
    >'pclass'</span>, legend=<span class=\"kw\">False</span> <span class=\"cm\">#\
    \ color by x variable (no dup legend)</span>\n)\nplt.<span class=\"fn\">title</span>(<span\
    \ class=\"str\">'Age by Passenger Class (Box)'</span>)\nplt.<span class=\"fn\"\
    >xlabel</span>(<span class=\"str\">'Passenger Class'</span>); plt.<span class=\"\
    fn\">ylabel</span>(<span class=\"str\">'Age'</span>)\n\n<span class=\"cm\"># ──\
    \ Subplot 2: Horizontal box plot ──</span>\nplt.<span class=\"fn\">subplot</span>(<span\
