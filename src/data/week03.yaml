    solution_code: '# 6-Chart EDA Visualization Report

      import pandas as pd

      import numpy as np

      import matplotlib.pyplot as plt

      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"

      df = pd.read_csv(url)

      fig,ax = plt.subplots(2,3,figsize=(15,10))

      ax = ax.flat

      df["Survived"].value_counts().plot(kind="bar",ax=ax[0],color=["salmon","lightgreen"])

      ax[0].set_title("Survival Count")

      ax[0].set_xticklabels(["No","Yes"])

      df.groupby("Pclass")["Survived"].mean().plot(kind="bar",ax=ax[1],color="steelblue")

      ax[1].set_title("Survival Rate by Class")

      df.groupby("Sex")["Survived"].mean().plot(kind="bar",ax=ax[2],color=["pink","lightblue"])

      ax[2].set_title("Survival Rate by Gender")

      df["Age"].hist(bins=30,ax=ax[3],color="purple",alpha=0.7,edgecolor="black")

      ax[3].set_title("Age Distribution")

      df["Fare"].hist(bins=50,ax=ax[4],color="orange",alpha=0.7,edgecolor="black")

      ax[4].set_title("Fare Distribution")

      df["Embarked"].value_counts().plot(kind="bar",ax=ax[5],color="green")

      ax[5].set_title("Embarkation Port")

      plt.tight_layout()

      plt.savefig("eda_6_chart_report.png")

      print("6-Chart EDA Report saved!")

      assert ax is not None, "ax should not be None"'
