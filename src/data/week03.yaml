- id: '20'
  day_num: 20
  title: Feature Engineering Basics
  subtitle: Feature engineering is alag karne wali skill hai mediocre ML engineers
    aur great ones ke beech.
  time_estimate: 4 hours
  difficulty: Medium
  badges:
