  gotcha:
    title: '⚠️ Gotcha: Data Leakage in Feature Engineering'
    description: Computing feature scaling stats, bin thresholds, or target-encoded values across the entire dataset before
      splitting into train/test sets causes severe data leakage, resulting in artificially inflated validation scores and
      immediate real-world failure.
  takeaways:
    hinglish_line: Production mein Feature Engineering Basics ko use karte waqt edge cases aur mathematical constraints ko
      pehle validate karo, taaki downstream deployment bilkul rock-solid rahe!
    bullets:
    - Feature engineering is often more impactful than model selection — invest time here
    - Date columns → extract year, month, day_of_week, is_weekend, quarter as separate features
    - Combine related columns into meaningful ratios (fare_per_person, family_size)
    - pd.cut = equal-width bins; pd.qcut = equal-frequency bins. Use qcut for skewed data.
    - Random Forest feature importances are more powerful than correlation for identifying predictive features
