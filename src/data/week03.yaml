    hinglish_line: Production mein Seaborn — Every Important Chart for EDA ko use
      karte waqt edge cases aur mathematical constraints ko pehle validate karo, taaki
      downstream deployment bilkul rock-solid rahe!
    bullets:
    - 'Heatmap (sns.heatmap(numeric_df.corr())) = #1 EDA chart — always run first.
      Always select numeric columns first!'
    - pairplot() = overview of all feature pairs. Use hue= for class coloring. Slow
      for &gt;10 features.
    - Violin &gt; box for understanding distribution shape. Use split=True for 2-group
      comparison inside.
