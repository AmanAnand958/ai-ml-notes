    </p>\n<div style=\"margin-top:0.8rem;\">\n<strong style=\"font-size:12px;color:var(--muted);display:block;margin-bottom:0.4rem;\"\
    >\n         \U0001F4A1 Key Parameters:\n        </strong>\n<div class=\"table-wrap\"\
    \ style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\"\
