    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day17: scaling impact
      on KNN accuracy comparison"'
    sol_id: sol-w3d17t2
    solution_title: 📓 Complete Colab Code
    solution_code: '# Scaling Impact on KNN Accuracy

      import pandas as pd

      import numpy as np

      from sklearn.neighbors import KNeighborsClassifier

      from sklearn.preprocessing import StandardScaler, MinMaxScaler

      from sklearn.model_selection import cross_val_score

      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"

      df = pd.read_csv(url).dropna(subset=["Age","Fare"])

      X = df[["Age","Fare","Pclass"]].values

      y = df["Survived"].values

      raw = cross_val_score(KNeighborsClassifier(n_neighbors=5), X, y, cv=5).mean()

      std = cross_val_score(KNeighborsClassifier(n_neighbors=5), StandardScaler().fit_transform(X),
      y, cv=5).mean()

      mm = cross_val_score(KNeighborsClassifier(n_neighbors=5), MinMaxScaler().fit_transform(X),
      y, cv=5).mean()

      print(f"Raw accuracy:       {raw:.4f}")

      print(f"StandardScaler:     {std:.4f}")

      print(f"MinMaxScaler:       {mm:.4f}")

      print(f"Best: {''StandardScaler'' if std>mm else ''MinMaxScaler''} improves
      by {(max(std,mm)-raw)*100:.1f}%")

      assert mm is not None, "mm should not be None"'
    solution_lang: python
    time_minutes: 45
