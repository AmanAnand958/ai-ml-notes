      is_correct: false
      id: d
    correct_fb: '✅ Correct! Correlation ranges from −1 to +1. −0.8 is strong negative: as X goes up, Y strongly goes down.
      In ML: |corr| &gt; 0.8 between two features → multicollinearity (bad for linear models). High |corr| with target → feature
      is predictive (good). 0 = no linear relationship.'
    wrong_fb: '❌ −0.8 = strong negative relationship. When X increases, Y strongly decreases. Range: −1 (perfectly opposite),
      0 (no relation), +1 (perfectly same). In ML: high |corr| with target = useful feature. High |corr| between features
      = multicollinearity.'
    correct: b
