      >add_trace</span>(go.<span class=\"fn\">Scatter</span>(x=df[<span class=\"str\"\
      >\"Age\"], y=df[\"Fare\"], mode=\"markers\"</span>,\n                  marker=<span\
      \ class=\"fn\">dict</span>(color=df[<span class=\"str\">\"Survived\"],colorscale=\"\
