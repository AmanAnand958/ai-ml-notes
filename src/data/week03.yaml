      ,\"JavaScript\",\"R\",\"Julia\",\"Swift\"</span>]\ndata = {n:np.random.<span\
      \ class=\"fn\">rand</span>(steps).<span class=\"fn\">cumsum</span>()*<span class=\"\
      num\">10</span>+np.random.<span class=\"fn\">randint</span>(<span class=\"num\"\
      >20</span>,<span class=\"num\">50</span>) <span class=\"kw\">for</span> n <span\
      \ class=\"kw\">in</span> names}\ndf = pd.<span class=\"fn\">DataFrame</span>(data)\n\
      <span class=\"fn\">print</span>(<span class=\"str\">\"Top language at each step:\"\
      </span>)\n<span class=\"kw\">for</span> i <span class=\"kw\">in</span> <span\
      \ class=\"fn\">range</span>(steps):\n    ranking = df.iloc[i].<span class=\"\
      fn\">sort_values</span>(ascending=<span class=\"kw\">False</span>)\n    <span\
      \ class=\"fn\">print</span>(<span class=\"str\">f\"  Step {i+1:2d}: {ranking.index[0]:12s}\
      \ {ranking.iloc[0]:6.1f}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
      str\">\"\\nFinal ranking:\"</span>)\n<span class=\"kw\">for</span> r,(l,v) <span\
      \ class=\"kw\">in</span> <span class=\"fn\">enumerate</span>(df.iloc[-<span\
      \ class=\"num\">1</span>].<span class=\"fn\">sort_values</span>(ascending=<span\
      \ class=\"kw\">False</span>).<span class=\"fn\">items</span>(),<span class=\"\
      num\">1</span>):\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"\
      \  #{r}: {l:12s} {v:.1f}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
      str\">\"\\n(For actual animation: pip install bar_chart_race)\"</span>)"
