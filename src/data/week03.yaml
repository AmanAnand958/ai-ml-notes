    \ class=\"str\">'-&gt;'</span>, color=<span class=\"str\">'#f7a94b'</span>),\n\
    \    fontsize=<span class=\"num\">9</span>, color=<span class=\"str\">'#f7a94b'</span>\n\
    )\n\nplt.<span class=\"fn\">title</span>(<span class=\"str\">'Salary by Age —\
    \ Color=Dept, Size=Experience'</span>, fontsize=<span class=\"num\">13</span>)\n\
