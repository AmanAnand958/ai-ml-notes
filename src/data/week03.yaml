  gotcha:
    title: '⚠️ Gotcha: NumPy In-Place vs Copy Operations'
    description: NumPy slicing returns a view, not a copy. Modifying a slice directly
      mutates the original array.
  takeaways:
    hinglish_line: Production mein Feature Scaling + Outlier Handling ko use karte
      waqt edge cases aur mathematical constraints ko pehle validate karo, taaki downstream
      deployment bilkul rock-solid rahe!
    bullets:
    - Scale for distance/gradient-based models; skip for tree-based models
    - 'StandardScaler: symmetric data. MinMaxScaler: bounded output. RobustScaler:
      outlier-heavy data'
    - 'IQR method: Q1−1.5×IQR to Q3+1.5×IQR. Z-score: |z| &gt; 3'
