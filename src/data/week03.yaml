    solution_code: "<span class=\"cm\"># Animated Bar Chart Race</span>\n<span class=\"\
      kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\"\
      >import</span> pandas <span class=\"kw\">as</span> pd\nnp.random.<span class=\"\
      fn\">seed</span>(<span class=\"num\">42</span>)\nN,steps = <span class=\"num\"\
