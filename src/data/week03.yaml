    \         </button>\n</div>\n</div>\n<pre><code><span class=\"kw\">from</span>\
    \ sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler, MinMaxScaler,\
    \ RobustScaler\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
    \ np\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\
    \ndata = pd.<span class=\"fn\">DataFrame</span>({<span class=\"str\">'age'</span>:\
    \ [<span class=\"num\">25</span>,<span class=\"num\">35</span>,<span class=\"\
    num\">45</span>,<span class=\"num\">28</span>,<span class=\"num\">60</span>],\n\
    \                     <span class=\"str\">'salary'</span>: [<span class=\"num\"\
    >30000</span>,<span class=\"num\">50000</span>,<span class=\"num\">70000</span>,<span\
    \ class=\"num\">35000</span>,<span class=\"num\">200000</span>]})\n\n<span class=\"\
    cm\"># --- StandardScaler: (x - mean) / std ---</span>\n<span class=\"cm\"># Result:\
    \ mean=0, std=1. Values roughly in [-3, 3]</span>\n<span class=\"cm\"># Best for:\
    \ normally distributed data, linear/logistic regression, neural nets</span>\n\
    ss = <span class=\"fn\">StandardScaler</span>()\ndata_std = ss.<span class=\"\
    fn\">fit_transform</span>(data)\n<span class=\"fn\">print</span>(<span class=\"\
    str\">\"StandardScaler:\\n\"</span>, data_std)\n\n<span class=\"cm\"># --- MinMaxScaler:\
    \ (x - min) / (max - min) ---</span>\n<span class=\"cm\"># Result: all values\
    \ in [0, 1]. Preserves shape exactly.</span>\n<span class=\"cm\"># Best for: image\
    \ pixels (0-255 → 0-1), bounded ranges, KNN</span>\n<span class=\"cm\"># Weakness:\
    \ one extreme outlier destroys the scale</span>\nmms = <span class=\"fn\">MinMaxScaler</span>()\n\
    data_mm = mms.<span class=\"fn\">fit_transform</span>(data)\n<span class=\"fn\"\
    >print</span>(<span class=\"str\">f\"\\nMinMaxScaler:\\n\"</span>, data_mm)\n\n\
    <span class=\"cm\"># --- RobustScaler: (x - median) / IQR ---</span>\n<span class=\"\
    cm\"># Result: centered at median, scaled by interquartile range</span>\n<span\
    \ class=\"cm\"># Best for: data with outliers (salary: ₹30k to ₹2L)</span>\n<span\
    \ class=\"cm\"># Outliers don't dominate because we use MEDIAN and IQR</span>\n\
    rs = <span class=\"fn\">RobustScaler</span>()\ndata_rob = rs.<span class=\"fn\"\
    >fit_transform</span>(data)\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"\\nRobustScaler:\\n\"</span>, data_rob)</code></pre>\n</div>\n<div style=\"\
    background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem\
    \ 0;\">\n<strong style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\"\
