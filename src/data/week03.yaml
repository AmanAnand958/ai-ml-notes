      \ class=\"num\">1</span>)\n    gb = df[<span class=\"str\">\"Sex\"</span>].<span\
      \ class=\"fn\">value_counts</span>()\n    fig.<span class=\"fn\">add_trace</span>(go.<span\
      \ class=\"fn\">Pie</span>(labels=gb.index, values=gb.values), row=<span class=\"\
      num\">2</span>, col=<span class=\"num\">2</span>)\n    fig.<span class=\"fn\"\
      >update_layout</span>(height=<span class=\"num\">700</span>, title_text=<span\
