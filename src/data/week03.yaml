  quizzes:
  - num_str: QUESTION 1 OF 4
    question: Which plot type should you use to see how exam scores are distributed
      across students?
    qid: q18_1
    options:
    - letter: A
      text: Bar chart — plt.bar()
      is_correct: false
    - letter: B
      text: Histogram — plt.hist()
      is_correct: true
    - letter: C
      text: Scatter plot — plt.scatter()
      is_correct: false
    - letter: D
      text: Pie chart — plt.pie()
      is_correct: false
    correct_fb: '✅ Correct! plt.hist() shows how many values fall in each range (bin)
      — this reveals the shape of the distribution: normal, skewed, bimodal, etc.
      Bar charts compare discrete categories. Scatter = two variables. Pie = proportions
      of a whole.'
    wrong_fb: ❌ Use plt.hist() for distribution. It groups values into bins (ranges)
      and shows the frequency of each bin. This instantly reveals whether data is
      normally distributed, skewed, or has multiple peaks.
  - num_str: QUESTION 2 OF 4
    question: "What does\n         \n          plt.subplot(2, 3, 4)\n         \n \
      \        mean?"
    qid: q18_2
    options:
    - letter: A
      text: 4 rows, 3 columns, position 2
      is_correct: false
    - letter: B
      text: 2 rows × 3 columns grid, selecting the 4th panel (row 2, col 1)
      is_correct: true
    - letter: C
      text: 2nd row of a 3×4 grid
      is_correct: false
    - letter: D
      text: 4 subplots inside a 2×3 space
      is_correct: false
    correct_fb: ✅ Correct! plt.subplot(rows, cols, index). rows=2, cols=3 → 6 panels
      total. Index 1,2,3 = row 1; Index 4,5,6 = row 2. So index 4 = second row, first
      column. Indices go left-to-right, then top-to-bottom, starting at 1.
    wrong_fb: ❌ plt.subplot(rows, cols, index). 2 rows × 3 cols = 6 panels. Panel
      4 = row 2, col 1 (panels numbered left→right then top→bottom starting at 1).
      Panel 1 = top-left, panel 6 = bottom-right.
  - num_str: QUESTION 3 OF 4
    question: What are the dots plotted BEYOND the whiskers in a box plot?
    qid: q18_3
    options:
    - letter: A
      text: The mean and standard deviation markers
      is_correct: false
    - letter: B
      text: The 5th and 95th percentile values
      is_correct: false
    - letter: C
      text: Outliers — values beyond Q1−1.5×IQR or Q3+1.5×IQR
      is_correct: true
    - letter: D
      text: Data entry errors that should be deleted
      is_correct: false
    correct_fb: ✅ Correct! Whiskers extend to Q1−1.5×IQR (lower) and Q3+1.5×IQR (upper).
      Points beyond these are plotted individually as dots — these are outliers by
      Tukey's fence definition. They're not necessarily errors — they could be real
      extreme values. The box contains the middle 50% of data (Q1 to Q3).
    wrong_fb: ❌ Dots outside whiskers = outliers (Q1−1.5×IQR to Q3+1.5×IQR bounds).
      They're not errors — just extreme values. The box = Q1 to Q3 (middle 50%). Median
      line is inside the box. Whiskers go to the fence limits.
  - num_str: QUESTION 4 OF 4
    question: Which function adds a best-fit straight trend line to a scatter plot?
    qid: q18_4
    options:
    - letter: A
      text: np.polyfit(x, y, 1) — returns [slope, intercept]
      is_correct: true
    - letter: B
      text: np.correlate(x, y)
      is_correct: false
    - letter: C
      text: np.gradient(y, x)
      is_correct: false
    - letter: D
      text: np.linalg.fit(x, y)
      is_correct: false
    correct_fb: '✅ Correct! np.polyfit(x, y, 1) fits a degree-1 polynomial (a line)
      and returns [slope, intercept]. Then: x_line = np.linspace(x.min(), x.max(),
      100); plt.plot(x_line, slope*x_line + intercept, ''--''). Degree=2 gives a parabola.'
    wrong_fb: ❌ np.polyfit(x, y, 1) is the answer. Returns [slope, intercept]. Then
      evaluate y = slope*x + intercept on a smooth x range and plot it with plt.plot().
      Degree=1 is linear; degree=2 is quadratic curve.
