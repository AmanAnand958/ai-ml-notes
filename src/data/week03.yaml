    \    hue=<span class=\"str\">'embarked'</span>, legend=<span class=\"kw\">False</span>\n\
    )\nplt.<span class=\"fn\">title</span>(<span class=\"str\">'Fare by Embarkation\
    \ Port (Horizontal)'</span>)\nplt.<span class=\"fn\">xlabel</span>(<span class=\"\
    str\">'Fare (£)'</span>); plt.<span class=\"fn\">ylabel</span>(<span class=\"\
    str\">'Port'</span>)\n\nplt.<span class=\"fn\">tight_layout</span>()\nplt.<span\
    \ class=\"fn\">savefig</span>(<span class=\"str\">'sns_boxplot.png'</span>, dpi=<span\
    \ class=\"num\">150</span>); plt.<span class=\"fn\">show</span>()</code></pre>\n\
    </div>\n<div style=\"background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem\
    \ 0;\">\n<strong style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\"\
    >\n        \U0001F4CA Box Plot Categorical Preview (Vertical vs Horizontal)\n\
