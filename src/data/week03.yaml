    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Use sklearn's\n           \n            ColumnTransformer\n\
      \           \n           to build a single preprocessing pipeline that:\n          </p>\n<ul style=\"padding-left: 1.5rem;\
      \ margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;\">\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n\
      \             (1)\n            </strong>\n            Applies OneHotEncoder to nominal columns\n           </li>\n<li\
      \ style=\"margin-bottom: 0.4rem;\">\n<strong>\n             (2)\n            </strong>\n            Applies OrdinalEncoder\
      \ to ordinal columns\n           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n             (3)\n        \
      \    </strong>\n            Applies StandardScaler to numeric columns. Use\n            \n             Pipeline(steps=[('preprocessor',\
      \ ct), ('model', LogisticRegression())])\n            \n            . This is the professional way to preprocess — study\
      \ it carefully\n           </li>\n</ul>"
    done_when: When a single sklearn Pipeline object preprocesses and predicts in one call, with all transformations correctly
      applied.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day16: sklearn ColumnTransformer full preprocessing pipeline"'
    sol_id: sol-w3d16t3
    solution_title: 📓 Complete Colab Code
    solution_code: |-
      # Full Encoding Pipeline with ColumnTransformer
      import pandas as pd
      import numpy as np
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler, OneHotEncoder, LabelEncoder
      from sklearn.impute import SimpleImputer
      from sklearn.compose import ColumnTransformer
      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"
      df = pd.read_csv(url).head(30)
      num_f = ["Age","Fare"]
      cat_f = ["Sex","Embarked"]
      num_p = Pipeline([("imp",SimpleImputer(strategy="median")),("scl",StandardScaler())])
      cat_p = Pipeline([("imp",SimpleImputer(strategy="most_frequent")),("enc",OneHotEncoder(drop="first"))])
      ct = ColumnTransformer([("num",num_p,num_f),("cat",cat_p,cat_f)])
      X = ct.fit_transform(df[num_f+cat_f])
      print(f"Input shape: {df.shape}")
      print(f"Output shape: {X.shape}")
      print(f"\nFeature names: {ct.get_feature_names_out()}")
      print(f"\nEncoded data (first 5 rows):")
      print(pd.DataFrame(X, columns=ct.get_feature_names_out()).head().round(3))
      assert X is not None, "X should not be None"
    solution_lang: python
