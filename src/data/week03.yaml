    </div>
    <pre><code><span class="kw">import</span> pandas <span class="kw">as</span> pd
    df = pd.<span class="fn">DataFrame</span>({<span class="str">'age'</span>: [<span class="num">20</span>, <span class="num">25</span>, <span class="kw">None</span>, <span class="num">30</span>]})
    <span class="cm"># Update original DataFrame in-place safely</span>
    df[<span class="str">'age'</span>] = df[<span class="str">'age'</span>].<span class="fn">fillna</span>(df[<span class="str">'age'</span>].<span class="fn">mean</span>())</code></pre>
