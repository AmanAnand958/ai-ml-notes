  hinglish: "Feature engineering ka matlab hai: raw features se naye aur better features banana. Jaise\n       \n        age\n\
    \       \n       aur\n       \n        year_of_birth\n       \n       se\n       \n        age_group\n       \n      \
    \ banana — model ko ye zyada useful lagta hai!"
  analogy: KNN algorithm aur SVM distances calculate karte hain features ke beech. Agar age (0–100) aur income (50,000–10,00,000)
    hain bina scaling ke, income dominate kar lega kyunki uske numbers bahut bade hain. Model sochega income zyada "important"
    hai sirf kyunki uski units badi hain. Yeh unit-bias hai, real importance nahi.
  theory_html: "<h3 class=\"sh3\">\n       1. Why Scaling Matters\n      </h3>\n\n<div class=\"ml-connect\">\n       Models\
    \ that compute distances (KNN, SVM, K-Means) or use gradient descent (Linear Regression, Neural Networks, Logistic Regression)\
    \ are heavily affected by feature scale.\n       <br/>\n<br/>\n       Tree-based models (Decision Tree, Random Forest,\
    \ XGBoost) are completely unaffected — they split on values, not distances.\n       <br/>\n<br/>\n       Always scale\
    \ for the former group; skip for the latter.\n      </div>\n<h3 class=\"sh3\">\n       2. StandardScaler (Z-score Normalization)\n\
    \      </h3>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — scaling.py\n  \
    \      </span>\n<div class=\"cb-btns\">\n<button class=\"run-btn\" onclick=\"openRepl()\">\n          ▶ try online\n \
    \        </button>\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n\
    </div>\n<pre><code><span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler,\
    \ MinMaxScaler, RobustScaler\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\"\
    >import</span> pandas <span class=\"kw\">as</span> pd\n\ndata = pd.<span class=\"fn\">DataFrame</span>({<span class=\"\
    str\">'age'</span>: [<span class=\"num\">25</span>,<span class=\"num\">35</span>,<span class=\"num\">45</span>,<span class=\"\
    num\">28</span>,<span class=\"num\">60</span>],\n                     <span class=\"str\">'salary'</span>: [<span class=\"\
    num\">30000</span>,<span class=\"num\">50000</span>,<span class=\"num\">70000</span>,<span class=\"num\">35000</span>,<span\
    \ class=\"num\">200000</span>]})\n\n<span class=\"cm\"># --- StandardScaler: (x - mean) / std ---</span>\n<span class=\"\
    cm\"># Result: mean=0, std=1. Values roughly in [-3, 3]</span>\n<span class=\"cm\"># Best for: normally distributed data,\
    \ linear/logistic regression, neural nets</span>\nss = <span class=\"fn\">StandardScaler</span>()\ndata_std = ss.<span\
    \ class=\"fn\">fit_transform</span>(data)\n<span class=\"fn\">print</span>(<span class=\"str\">\"StandardScaler:\\n\"\
    </span>, data_std)\n\n<span class=\"cm\"># --- MinMaxScaler: (x - min) / (max - min) ---</span>\n<span class=\"cm\">#\
    \ Result: all values in [0, 1]. Preserves shape exactly.</span>\n<span class=\"cm\"># Best for: image pixels (0-255 →\
    \ 0-1), bounded ranges, KNN</span>\n<span class=\"cm\"># Weakness: one extreme outlier destroys the scale</span>\nmms\
    \ = <span class=\"fn\">MinMaxScaler</span>()\ndata_mm = mms.<span class=\"fn\">fit_transform</span>(data)\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"\\nMinMaxScaler:\\n\"</span>, data_mm)\n\n<span class=\"cm\"># --- RobustScaler:\
    \ (x - median) / IQR ---</span>\n<span class=\"cm\"># Result: centered at median, scaled by interquartile range</span>\n\
    <span class=\"cm\"># Best for: data with outliers (salary: ₹30k to ₹2L)</span>\n<span class=\"cm\"># Outliers don't dominate\
    \ because we use MEDIAN and IQR</span>\nrs = <span class=\"fn\">RobustScaler</span>()\ndata_rob = rs.<span class=\"fn\"\
    >fit_transform</span>(data)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\\nRobustScaler:\\n\"</span>, data_rob)</code></pre>\n\
    </div>\n<div style=\"background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem\
    \ 0;\">\n<strong style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\">\n        \U0001F4CA Visualizing\
    \ Feature Scaling &amp; Outlier Sensitivity\n       </strong>\n<canvas height=\"220\" id=\"canvas-scaling17\" style=\"\
    width:100%;max-max-width: 100%; width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0 auto;\" width=\"\
    560\">\n</canvas>\n\n</div>\n<h3 class=\"sh3\">\n       3. Outlier Detection — IQR Method\n      </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       The Interquartile Range (IQR) method identifies data\
    \ points that deviate significantly from the distribution, classifying values beyond $1.5 \t\\times IQR$ as outliers.\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — outlier_detection.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n \
    \        </button>\n</div>\n</div>\n<pre><code><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\
    <span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\nsalaries = pd.<span class=\"fn\">Series</span>([<span\
    \ class=\"num\">30000</span>, <span class=\"num\">35000</span>, <span class=\"num\">40000</span>, <span class=\"num\"\
    >42000</span>, <span class=\"num\">45000</span>,\n                      <span class=\"num\">48000</span>, <span class=\"\
    num\">50000</span>, <span class=\"num\">55000</span>, <span class=\"num\">60000</span>, <span class=\"num\">500000</span>])\
    \  <span class=\"cm\"># 500k is outlier</span>\n\n<span class=\"cm\"># --- Method 1: IQR Method (most common) ---</span>\n\
    Q1 = salaries.<span class=\"fn\">quantile</span>(<span class=\"num\">0.25</span>)   <span class=\"cm\"># 25th percentile</span>\n\
    Q3 = salaries.<span class=\"fn\">quantile</span>(<span class=\"num\">0.75</span>)   <span class=\"cm\"># 75th percentile</span>\n\
    IQR = Q3 - Q1\n\nlower = Q1 - <span class=\"num\">1.5</span> * IQR\nupper = Q3 + <span class=\"num\">1.5</span> * IQR\n\
    \noutliers = salaries[(salaries &lt; lower) | (salaries &gt; upper)]\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"Outliers detected: {outliers.tolist()}\"</span>)  <span class=\"cm\"># [500000]</span>\n\n<span class=\"cm\"># Remove\
    \ outliers</span>\nclean = salaries[(salaries >= lower) &amp; (salaries <= upper)]\n\n<span class=\"cm\"># --- Method\
    \ 2: Z-Score Method ---</span>\nz_scores = (salaries - salaries.<span class=\"fn\">mean</span>()) / salaries.<span class=\"\
    fn\">std</span>()\noutliers_z = salaries[np.<span class=\"fn\">abs</span>(z_scores) &gt; <span class=\"num\">3</span>]\
    \   <span class=\"cm\"># beyond 3 standard deviations</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
    Z-score outliers: {outliers_z.tolist()}\"</span>)\n\n<span class=\"cm\"># --- Method 3: Log transformation (for skewed\
    \ distributions) ---</span>\n<span class=\"cm\"># Instead of removing outliers, compress the scale</span>\n<span class=\"\
