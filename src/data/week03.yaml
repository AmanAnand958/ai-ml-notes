      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"

      df = pd.read_csv(url)["Fare"].dropna()

      fig,ax = plt.subplots(1,2,figsize=(12,5))

      ax[0].hist(df, bins=40, alpha=0.7, edgecolor=''black'')

      ax[0].set_title(f"Original: skew={df.skew():.2f}")

      log_fare = np.log1p(df)

      ax[1].hist(log_fare, bins=40, alpha=0.7, edgecolor=''black'')

      ax[1].set_title(f"Log-transformed: skew={log_fare.skew():.2f}")

      plt.tight_layout()

      plt.savefig("log_transform.png")

      print(f"Original: mean={df.mean():.1f} median={df.median():.1f} skew={df.skew():.2f}")

      print(f"Log(1+x): mean={log_fare.mean():.3f} median={log_fare.median():.3f}
      skew={log_fare.skew():.2f}")

      print("Log transform normalised the distribution significantly!")

      assert log_fare is not None, "log_fare should not be None"'
