    sol_id: sol-w3d20t2
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Feature Engineering Impact on Accuracy</span>

      <span class="kw">import</span> pandas <span class="kw">as</span> pd

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      <span class="kw">from</span> sklearn.ensemble <span class="kw">import</span>
      RandomForestClassifier

      <span class="kw">from</span> sklearn.model_selection <span class="kw">import</span>
      cross_val_score

      url = <span class="str">"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"</span>

      df = pd.<span class="fn">read_csv</span>(url).<span class="fn">drop</span>([<span
      class="str">"Cabin","Name","Ticket","PassengerId"</span>],axis=<span class="num">1</span>).<span
      class="fn">dropna</span>()

      y = df[<span class="str">"Survived"</span>]

      basic_f = [<span class="str">"Pclass","Sex","Age","Fare","SibSp","Parch","Embarked"</span>]

      basic = pd.<span class="fn">get_dummies</span>(df[basic_f], drop_first=<span
      class="kw">True</span>)

      basic_acc = <span class="fn">cross_val_score</span>(<span class="fn">RandomForestClassifier</span>(n_estimators=<span
      class="num">50</span>,random_state=<span class="num">42</span>), basic, y, cv=<span
      class="num">5</span>).<span class="fn">mean</span>()

      df[<span class="str">"FamilySize"] = df["SibSp"]+df["Parch"</span>]+<span class="num">1</span>

      df[<span class="str">"IsAlone"] = (df["FamilySize"</span>]==<span class="num">1</span>).<span
      class="fn">astype</span>(int)

      df[<span class="str">"Title"] = df["Name"].str.extract(r", (\w+)\."</span>)

      eng_f = basic_f + [<span class="str">"FamilySize","IsAlone","Title"</span>]

      eng = pd.<span class="fn">get_dummies</span>(df[eng_f], drop_first=<span class="kw">True</span>)

      eng_acc = <span class="fn">cross_val_score</span>(<span class="fn">RandomForestClassifier</span>(n_estimators=<span
      class="num">50</span>,random_state=<span class="num">42</span>), eng, y, cv=<span
      class="num">5</span>).<span class="fn">mean</span>()

      <span class="fn">print</span>(<span class="str">f"Basic features accuracy: {basic_acc:.4f}"</span>)

      <span class="fn">print</span>(<span class="str">f"With engineered features:
      {eng_acc:.4f}"</span>)

      <span class="fn">print</span>(<span class="str">f"Improvement: {(eng_acc-basic_acc)*100:.2f}%"</span>)'
    solution_lang: python
