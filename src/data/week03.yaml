  theory_html: |-
    <h2 class="sh2">
           🏗️ The Complete Pipeline — Putting It All Together
          </h2>
    <p>
           This is what your preprocessing pipeline should look like after Week 3.
          </p>
    <p>
           This is the
           <strong>
            professional, production-ready way
           </strong>
           to preprocess data in Python:
          </p>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem 0;">
    <strong style="color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;">
            🏗️ Visualizing Scikit-Learn ColumnTransformer Workflow
           </strong>
    <canvas height="200" id="canvas-pipeline-flow21" style="width:100%;max-max-width: 100%; width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0 auto;" width="560">
    </canvas>

    </div>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — complete_pipeline.py
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">import</span> pandas <span class="kw">as</span> pd
    <span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt
    <span class="kw">import</span> seaborn <span class="kw">as</span> sns
    <span class="kw">from</span> sklearn.model_selection <span class="kw">import</span> train_test_split
    <span class="kw">from</span> sklearn.pipeline <span class="kw">import</span> Pipeline
    <span class="kw">from</span> sklearn.compose <span class="kw">import</span> ColumnTransformer
    <span class="kw">from</span> sklearn.impute <span class="kw">import</span> SimpleImputer
    <span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span> StandardScaler, OneHotEncoder
    <span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> LogisticRegression
    <span class="kw">from</span> sklearn.metrics <span class="kw">import</span> accuracy_score, classification_report

    <span class="cm"># ── 1. LOAD DATA ────────────────────────────────</span>
    df = pd.<span class="fn">read_csv</span>(<span class="str">"titanic.csv"</span>)

    <span class="cm"># ── 2. FEATURE ENGINEERING (before split!) ──────</span>
    df[<span class="str">'family_size'</span>] = df[<span class="str">'SibSp'</span>] + df[<span class="str">'Parch'</span>] + <span class="num">1</span>
    df[<span class="str">'is_alone'</span>] = (df[<span class="str">'family_size'</span>] == <span class="num">1</span>).<span class="fn">astype</span>(int)
    df[<span class="str">'title'</span>] = df[<span class="str">'Name'</span>].str.<span class="fn">extract</span>(r<span class="str">' ([A-Za-z]+)\.'</span>)
    df[<span class="str">'fare_per_person'</span>] = df[<span class="str">'Fare'</span>] / df[<span class="str">'family_size'</span>]
    df[<span class="str">'cabin_recorded'</span>] = df[<span class="str">'Cabin'</span>].<span class="fn">notna</span>().<span class="fn">astype</span>(int)

    <span class="cm"># ── 3. DEFINE FEATURES ──────────────────────────</span>
    numeric_features = [<span class="str">'Age'</span>, <span class="str">'Fare'</span>, <span class="str">'Pclass'</span>, <span class="str">'family_size'</span>, <span class="str">'fare_per_person'</span>]
    categorical_features = [<span class="str">'Sex'</span>, <span class="str">'Embarked'</span>]
    binary_features = [<span class="str">'is_alone'</span>, <span class="str">'cabin_recorded'</span>]

    X = df[numeric_features + categorical_features + binary_features]
    y = df[<span class="str">'Survived'</span>]

    <span class="cm"># ── 4. TRAIN-TEST SPLIT (BEFORE any fitting!) ───</span>
    X_train, X_test, y_train, y_test = <span class="fn">train_test_split</span>(
        X, y, test_size=<span class="num">0.2</span>, random_state=<span class="num">42</span>, stratify=y
    )

    <span class="cm"># ── 5. PREPROCESSING PIPELINE ───────────────────</span>
    numeric_pipeline = <span class="fn">Pipeline</span>([
        (<span class="str">'imputer'</span>, <span class="fn">SimpleImputer</span>(strategy=<span class="str">'median'</span>)),
        (<span class="str">'scaler'</span>, <span class="fn">StandardScaler</span>())
    ])

    categorical_pipeline = <span class="fn">Pipeline</span>([
        (<span class="str">'imputer'</span>, <span class="fn">SimpleImputer</span>(strategy=<span class="str">'most_frequent'</span>)),
        (<span class="str">'encoder'</span>, <span class="fn">OneHotEncoder</span>(drop=<span class="str">'first'</span>, sparse_output=<span class="kw">False</span>))
    ])

    preprocessor = <span class="fn">ColumnTransformer</span>([
        (<span class="str">'num'</span>, numeric_pipeline, numeric_features),
        (<span class="str">'cat'</span>, categorical_pipeline, categorical_features),
        (<span class="str">'bin'</span>, <span class="str">'passthrough'</span>, binary_features)   <span class="cm"># no transform needed</span>
    ])

    <span class="cm"># ── 6. FULL MODEL PIPELINE ──────────────────────</span>
    model_pipeline = <span class="fn">Pipeline</span>([
        (<span class="str">'preprocessor'</span>, preprocessor),
        (<span class="str">'model'</span>, <span class="fn">LogisticRegression</span>(max_iter=<span class="num">1000</span>, random_state=<span class="num">42</span>))
    ])

    <span class="cm"># ── 7. FIT AND EVALUATE ─────────────────────────</span>
    model_pipeline.<span class="fn">fit</span>(X_train, y_train)
    y_pred = model_pipeline.<span class="fn">predict</span>(X_test)
    acc = <span class="fn">accuracy_score</span>(y_test, y_pred)

    <span class="fn">print</span>(<span class="str">f"Accuracy: {acc:.4f}"</span>)
    <span class="fn">print</span>(<span class="fn">classification_report</span>(y_test, y_pred))</code></pre>
    </div>
    <div class="hinglish">
           💡 Quick recap: Data pipeline banana simple hai agar rules yaad rakho.
