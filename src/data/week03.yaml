              </button>
    </div>
    </div>
    <pre><code><span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span> LabelEncoder
    <span class="kw">import</span> pandas <span class="kw">as</span> pd
    df = pd.<span class="fn">DataFrame</span>({<span class="str">'city'</span>: [<span class="str">'Delhi'</span>,<span class="str">'Mumbai'</span>,<span class="str">'Chennai'</span>]})
    le = <span class="fn">LabelEncoder</span>()
    df[<span class="str">'city_enc'</span>] = le.<span class="fn">fit_transform</span>(df[<span class="str">'city'</span>])  <span class="cm"># feeding into LogisticRegression</span></code></pre>
    </div>
    <button class="solution-toggle" onclick="toggleSolution('debug16-sol')">
            👁 Show Fix
