  gotcha:
    title: '⚠️ Gotcha: NumPy In-Place vs Copy Operations'
    description: NumPy slicing returns a view, not a copy. Modifying a slice directly
      mutates the original array.
  takeaways:
    hinglish_line: Production mein Encoding Categorical Variables ko use karte waqt
      edge cases aur mathematical constraints ko pehle validate karo, taaki downstream
      deployment bilkul rock-solid rahe!
    bullets:
    - Nominal = no order (use One-Hot). Ordinal = has order (use Ordinal/custom mapping).
    - Label Encoding on nominals is only safe for tree-based models, never linear
      models
    - Always use drop_first=True in One-Hot Encoding to avoid the dummy variable trap
    - For high-cardinality (&gt;20 categories), use Target Encoding — compute on train
      only!
    - ColumnTransformer is the professional way to apply different encodings to different
      columns
