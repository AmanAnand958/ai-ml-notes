      is_correct: true
      id: c
    - letter: D
      text: The exact mean vs median difference
      is_correct: false
      id: d
    correct_fb: '✅ Correct! A boxplot shows 5 summary statistics (Q1, median, Q3, whiskers, outliers). A violin adds the full
      KDE shape — the violin is wider where data is denser. Bimodal distributions (two bumps) that are hidden in boxplots
      are clearly visible in violin plots. Best practice: use.'
    wrong_fb: ❌ Violin plot adds the density shape. Boxplot hides the distribution shape — two datasets with identical quartiles
      but different shapes look the same as boxes. A violin reveals if data is bimodal, symmetric, or skewed. Use inner='box'
      to get box statistics inside the violin.
