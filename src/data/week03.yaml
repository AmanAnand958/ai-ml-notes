      \           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n       \
      \      (2)\n            </strong>\n            Flags columns with &gt;50% missing\
      \ as \"DROP CANDIDATE\", and\n           </li>\n<li style=\"margin-bottom: 0.4rem;\"\
      >\n<strong>\n             (3)\n            </strong>\n            Recommends\
      \ \"mean\", \"median\", or \"most_frequent\" imputation for each numeric column\
