  theory_html: |-
    <h3 class="sh3">
           1. Why Feature Engineering?
          </h3>

    <p>
           The raw columns in a dataset are often not the best representation of the underlying patterns.
          </p>
    <p>
           Feature engineering is the art of
           <strong>
            creating new variables
           </strong>
           that make the model's job easier.
          </p>
    <p>
           A well-engineered feature can outperform a complex model on a poorly engineered dataset.
          </p>
    <div class="ml-connect">
           In ML competitions, the winner often isn't the person with the best model — it's the one with the best features.
           <br/>
    <br/>
           Andrew Ng (DeepLearning.AI founder) has said: "Coming up with features is difficult, time-consuming, requires expert knowledge.
           <br/>
    <br/>
           Applied machine learning is basically feature engineering." It's that important.
          </div>
    <h3 class="sh3">
           2. Date and Time Feature Extraction
          </h3>
    <p style="margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;">
           Extracting day, month, hour, and day of week from datetime columns turns static text timestamps into predictive cyclical features.
          </p>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
