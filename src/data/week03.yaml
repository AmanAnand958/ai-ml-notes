      full preprocessing pipeline"'
    sol_id: sol-w3d16t3
    solution_title: 📓 Complete Colab Code
    solution_code: '# Full Encoding Pipeline with ColumnTransformer

      import pandas as pd

      import numpy as np

      from sklearn.pipeline import Pipeline

      from sklearn.preprocessing import StandardScaler, OneHotEncoder, LabelEncoder

      from sklearn.impute import SimpleImputer

      from sklearn.compose import ColumnTransformer

      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"

      df = pd.read_csv(url).head(30)

      num_f = ["Age","Fare"]

      cat_f = ["Sex","Embarked"]

      num_p = Pipeline([("imp",SimpleImputer(strategy="median")),("scl",StandardScaler())])

      cat_p = Pipeline([("imp",SimpleImputer(strategy="most_frequent")),("enc",OneHotEncoder(drop="first"))])

      ct = ColumnTransformer([("num",num_p,num_f),("cat",cat_p,cat_f)])

      X = ct.fit_transform(df[num_f+cat_f])

      print(f"Input shape: {df.shape}")

      print(f"Output shape: {X.shape}")

      print(f"\nFeature names: {ct.get_feature_names_out()}")

      print(f"\nEncoded data (first 5 rows):")

      print(pd.DataFrame(X, columns=ct.get_feature_names_out()).head().round(3))

      assert X is not None, "X should not be None"'
    solution_lang: python
    time_minutes: 60
