  theory_html: "<h3 class=\"sh3\">\n       1. Why Feature Engineering?\n      </h3>\n\
    \n<p>\n       The raw columns in a dataset are often not the best representation\
    \ of the underlying patterns.\n      </p>\n<p>\n       Feature engineering is\
    \ the art of\n       <strong>\n        creating new variables\n       </strong>\n\
    \       that make the model's job easier.\n      </p>\n<p>\n       A well-engineered\
    \ feature can outperform a complex model on a poorly engineered dataset.\n   \
    \   </p>\n<div class=\"ml-connect\">\n       In ML competitions, the winner often\
    \ isn't the person with the best model — it's the one with the best features.\n\
    \       <br/>\n<br/>\n       Andrew Ng (DeepLearning.AI founder) has said: \"\
    Coming up with features is difficult, time-consuming, requires expert knowledge.\n\
    \       <br/>\n<br/>\n       Applied machine learning is basically feature engineering.\"\
    \ It's that important.\n      </div>\n<h3 class=\"sh3\">\n       2. Date and Time\
    \ Feature Extraction\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       Extracting day, month, hour,\
    \ and day of week from datetime columns turns static text timestamps into predictive\
    \ cyclical features.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n\
    <span class=\"cb-lang\">\n         python — datetime_features.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"run-btn\" onclick=\"openRepl()\">\n \
    \         ▶ try online\n         </button>\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><code><span class=\"kw\">import</span> pandas\
    \ <span class=\"kw\">as</span> pd\n\ndf = pd.<span class=\"fn\">DataFrame</span>({\n\
    \    <span class=\"str\">'order_date'</span>: pd.<span class=\"fn\">to_datetime</span>([<span\
    \ class=\"str\">'2024-01-15'</span>, <span class=\"str\">'2024-03-22'</span>,\
    \ <span class=\"str\">'2024-07-04'</span>, <span class=\"str\">'2024-12-25'</span>]),\n\
    \    <span class=\"str\">'sales'</span>: [<span class=\"num\">1200</span>, <span\
    \ class=\"num\">800</span>, <span class=\"num\">2100</span>, <span class=\"num\"\
    >3500</span>]\n})\n\n<span class=\"cm\"># Extract multiple features from one datetime\
    \ column!</span>\ndf[<span class=\"str\">'year'</span>] = df[<span class=\"str\"\
    >'order_date'</span>].dt.year\ndf[<span class=\"str\">'month'</span>] = df[<span\
    \ class=\"str\">'order_date'</span>].dt.month\ndf[<span class=\"str\">'day_of_week'</span>]\
    \ = df[<span class=\"str\">'order_date'</span>].dt.dayofweek  <span class=\"cm\"\
    ># 0=Monday, 6=Sunday</span>\ndf[<span class=\"str\">'day_of_year'</span>] = df[<span\
    \ class=\"str\">'order_date'</span>].dt.dayofyear\ndf[<span class=\"str\">'quarter'</span>]\
    \ = df[<span class=\"str\">'order_date'</span>].dt.quarter\ndf[<span class=\"\
    str\">'is_weekend'</span>] = (df[<span class=\"str\">'day_of_week'</span>] &gt;=\
    \ <span class=\"num\">5</span>).<span class=\"fn\">astype</span>(int)  <span class=\"\
    cm\"># 0 or 1</span>\ndf[<span class=\"str\">'is_month_end'</span>] = df[<span\
    \ class=\"str\">'order_date'</span>].dt.is_month_end.<span class=\"fn\">astype</span>(int)\n\
    \n<span class=\"fn\">print</span>(df.<span class=\"fn\">drop</span>(<span class=\"\
    str\">'order_date'</span>, axis=<span class=\"num\">1</span>))\n<span class=\"\
    cm\"># One date column → 7 new useful features!</span>\n<span class=\"cm\"># Model\
    \ can learn: weekend sales are higher, Q4 has holiday spike, etc.</span></code></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       3. Ratio + Interaction Features\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       Interaction and ratio features capture mathematical dependencies between\
    \ separate variables, assisting linear models in identifying non-linear patterns.\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — engineered_features.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span\
    \ class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"\
    kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">from</span>\
    \ sklearn.preprocessing <span class=\"kw\">import</span> PolynomialFeatures\n\n\
    df = pd.<span class=\"fn\">read_csv</span>(<span class=\"str\">\"titanic.csv\"\
    </span>)\n\n<span class=\"cm\"># --- Ratio features ---</span>\ndf[<span class=\"\
    str\">'fare_per_class'</span>] = df[<span class=\"str\">'Fare'</span>] / df[<span\
    \ class=\"str\">'Pclass'</span>]  <span class=\"cm\"># relative fare within class</span>\n\
    df[<span class=\"str\">'family_size'</span>] = df[<span class=\"str\">'SibSp'</span>]\
    \ + df[<span class=\"str\">'Parch'</span>] + <span class=\"num\">1</span>    <span\
    \ class=\"cm\"># total people travelling</span>\ndf[<span class=\"str\">'is_alone'</span>]\
    \ = (df[<span class=\"str\">'family_size'</span>] == <span class=\"num\">1</span>).<span\
    \ class=\"fn\">astype</span>(int)   <span class=\"cm\"># 1 if travelling alone</span>\n\
    \n<span class=\"cm\"># --- Title extraction from Name (text feature engineering)\
    \ ---</span>\ndf[<span class=\"str\">'title'</span>] = df[<span class=\"str\"\
    >'Name'</span>].str.<span class=\"fn\">extract</span>(r<span class=\"str\">' ([A-Za-z]+)\\\
    .'</span>)\n<span class=\"cm\"># Extracts: Mr, Mrs, Miss, Master, Dr, Rev etc.</span>\n\
    <span class=\"cm\"># This single feature is highly predictive of survival!</span>\n\
    title_survival = df.<span class=\"fn\">groupby</span>(<span class=\"str\">'title'</span>)[<span\
    \ class=\"str\">'Survived'</span>].<span class=\"fn\">mean</span>().<span class=\"\
    fn\">sort_values</span>(ascending=<span class=\"kw\">False</span>)\n<span class=\"\
    fn\">print</span>(title_survival)\n\n<span class=\"cm\"># --- Binning: Age into\
    \ groups ---</span>\ndf[<span class=\"str\">'age_group'</span>] = pd.<span class=\"\
    fn\">cut</span>(df[<span class=\"str\">'Age'</span>],\n                      \
    \   bins=[<span class=\"num\">0</span>, <span class=\"num\">12</span>, <span class=\"\
    num\">18</span>, <span class=\"num\">35</span>, <span class=\"num\">60</span>,\
    \ <span class=\"num\">100</span>],\n                         labels=[<span class=\"\
    str\">'child'</span>, <span class=\"str\">'teen'</span>, <span class=\"str\">'adult'</span>,\
    \ <span class=\"str\">'middle'</span>, <span class=\"str\">'senior'</span>])\n\
    <span class=\"fn\">print</span>(df[<span class=\"str\">'age_group'</span>].<span\
    \ class=\"fn\">value_counts</span>())\n\n<span class=\"cm\"># --- Polynomial features\
    \ (for linear models) ---</span>\nX = df[[<span class=\"str\">'Age'</span>, <span\
    \ class=\"str\">'Fare'</span>]].<span class=\"fn\">dropna</span>()\npoly = <span\
    \ class=\"fn\">PolynomialFeatures</span>(degree=<span class=\"num\">2</span>,\
    \ include_bias=<span class=\"kw\">False</span>)\nX_poly = poly.<span class=\"\
    fn\">fit_transform</span>(X)\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"Original: {X.shape}, Polynomial: {X_poly.shape}\"</span>)\n<span class=\"\
    cm\"># Original: (714, 2) → Polynomial: (714, 5)</span>\n<span class=\"cm\">#\
    \ New features: Age, Fare, Age², Age×Fare, Fare²</span>\n<span class=\"fn\">print</span>(poly.<span\
    \ class=\"fn\">get_feature_names_out</span>())  <span class=\"cm\"># ['Age', 'Fare',\
    \ 'Age^2', 'Age Fare', 'Fare^2']</span></code></pre>\n</div>\n<div style=\"background:var(--bg2);border:1px\
    \ solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem 0;\"\
    >\n<strong style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\"\
    >\n        \U0001F4CA Visualizing Binning &amp; Polynomial Expansion\n       </strong>\n\
    <canvas height=\"220\" id=\"canvas-feature-eng20\" style=\"width:100%;max-max-width:\
    \ 100%; width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0\
    \ auto;\" width=\"560\">\n</canvas>\n\n</div>\n<h3 class=\"sh3\">\n       4. Feature\
    \ Importance with Correlation\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       Correlation analysis measures\
    \ linear relationships between features and target labels, highlighting highly\
    \ predictive inputs.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n\
    <span class=\"cb-lang\">\n         python — feature_importance.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><code><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span>\
    \ pd\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span>\
    \ plt\n<span class=\"kw\">from</span> sklearn.ensemble <span class=\"kw\">import</span>\
    \ RandomForestClassifier\n\ndf = pd.<span class=\"fn\">read_csv</span>(<span class=\"\
    str\">\"titanic.csv\"</span>)\n<span class=\"cm\"># Assume df is already preprocessed\
    \ (no nulls, all numeric)</span>\n\n<span class=\"cm\"># Method 1: Correlation\
    \ with target</span>\ncorr_with_target = df.<span class=\"fn\">corr</span>()[<span\
    \ class=\"str\">'Survived'</span>].<span class=\"fn\">abs</span>().<span class=\"\
    fn\">sort_values</span>(ascending=<span class=\"kw\">False</span>)\n<span class=\"\
    fn\">print</span>(corr_with_target.<span class=\"fn\">drop</span>(<span class=\"\
    str\">'Survived'</span>))  <span class=\"cm\"># top features by correlation</span>\n\
    \n<span class=\"cm\"># Method 2: Random Forest feature importance</span>\nX =\
    \ df.<span class=\"fn\">drop</span>(<span class=\"str\">'Survived'</span>, axis=<span\
    \ class=\"num\">1</span>)\ny = df[<span class=\"str\">'Survived'</span>]\nrf =\
    \ <span class=\"fn\">RandomForestClassifier</span>(n_estimators=<span class=\"\
    num\">100</span>, random_state=<span class=\"num\">42</span>)\nrf.<span class=\"\
    fn\">fit</span>(X, y)\n\nimportances = pd.<span class=\"fn\">Series</span>(rf.feature_importances_,\
    \ index=X.columns)\nimportances.<span class=\"fn\">sort_values</span>(ascending=<span\
    \ class=\"kw\">False</span>).<span class=\"fn\">plot</span>(kind=<span class=\"\
    str\">'bar'</span>, figsize=(<span class=\"num\">10</span>,<span class=\"num\"\
    >4</span>))\nplt.<span class=\"fn\">title</span>(<span class=\"str\">'Feature\
    \ Importances (Random Forest)'</span>)\nplt.<span class=\"fn\">tight_layout</span>()\n\
    plt.<span class=\"fn\">savefig</span>(<span class=\"str\">'feature_importance.png'</span>,\
    \ dpi=<span class=\"num\">150</span>)</code></pre>\n</div>\n<div class=\"hinglish\"\
    >\n       \U0001F4A1 Feature engineering ki golden rule: domain knowledge + imagination.\n\
