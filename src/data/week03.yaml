  theory_html: "<h3 class=\"sh3\">\n       0. Setup — Always Start With Theme\n  \
    \    </h3>\n\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — seaborn_setup.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> seaborn <span class=\"kw\">as</span> sns\n<span class=\"\
    kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"\
    kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\"\
    >import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># ──\
    \ Set theme ONCE at top — affects all charts ──</span>\nsns.<span class=\"fn\"\
    >set_theme</span>(style=<span class=\"str\">'darkgrid'</span>)    <span class=\"\
    cm\"># dark background with grid</span>\n<span class=\"cm\"># style options: 'darkgrid',\
    \ 'whitegrid', 'dark', 'white', 'ticks'</span>\n\nsns.<span class=\"fn\">set_palette</span>(<span\
    \ class=\"str\">'husl'</span>)             <span class=\"cm\"># beautiful color\
    \ palette</span>\n<span class=\"cm\"># palette options: 'husl', 'Set2', 'coolwarm',\
    \ 'muted', 'deep'</span>\n\n<span class=\"cm\"># ── Load built-in datasets (no\
    \ file needed!) ──</span>\ndf_titanic = sns.<span class=\"fn\">load_dataset</span>(<span\
    \ class=\"str\">'titanic'</span>)    <span class=\"cm\"># 891 rows, 15 cols</span>\n\
    df_iris    = sns.<span class=\"fn\">load_dataset</span>(<span class=\"str\">'iris'</span>)\
    \       <span class=\"cm\"># 150 rows, 5 cols, 3 species</span>\ndf_tips    =\
    \ sns.<span class=\"fn\">load_dataset</span>(<span class=\"str\">'tips'</span>)\
    \       <span class=\"cm\"># 244 rows, restaurant tips</span>\ndf_penguins= sns.<span\
    \ class=\"fn\">load_dataset</span>(<span class=\"str\">'penguins'</span>)  <span\
    \ class=\"cm\"># 344 rows, 3 species</span>\n\n<span class=\"fn\">print</span>(df_titanic.shape)\
    \   <span class=\"cm\"># (891, 15)</span>\n<span class=\"fn\">print</span>(df_titanic.columns.<span\
    \ class=\"fn\">tolist</span>())</pre>\n</div>\n<!-- ─── CORRELATION HEATMAP ───\
    \ -->\n<h3 class=\"sh3\">\n       1. \U0001F525 Correlation Heatmap — The #1 EDA\
    \ Chart\n      </h3>\n\n<div class=\"ml-connect\">\n       Correlation heatmap\
    \ instantly shows: (1) which features are predictive of the target (high |corr|\
    \ with Survived), (2) which features are multicollinear with each other (bad for\
    \ linear models).\n       <br/>\n<br/>\n       Run this before every ML project.\n\
    \      </div>\n<div style=\"background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem\
    \ 0;\">\n<strong style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\"\
    >\n        \U0001F4CA Live Preview — Correlation Heatmap\n       </strong>\n<canvas\
    \ height=\"220\" id=\"canvas-heatmap19\" style=\"width:100%;max-max-width: 100%;\
    \ width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0 auto;\"\
    \ width=\"560\">\n</canvas>\n<script>\n        (function(){\nvar c=document.getElementById('canvas-heatmap19');if(!c)return;\n\
    var ctx=c.getContext('2d');var W=c.width,H=c.height;\nctx.fillStyle='#1a1d27';ctx.fillRect(0,0,W,H);\n\
    var labels=['Survived','Pclass','Age','SibSp','Parch','Fare'];\nvar n=labels.length;\n\
    var corr=[\n  [1,-0.34,-0.08,-0.04,0.08,0.26],\n  [-0.34,1,-0.37,0.08,0.02,-0.55],\n\
    \  [-0.08,-0.37,1,-0.31,-0.18,0.18],\n  [-0.04,0.08,-0.31,1,0.41,0.16],\n  [0.08,0.02,-0.18,0.41,1,0.22],\n\
    \  [0.26,-0.55,0.18,0.16,0.22,1]\n];\nvar pad={l:65,r:20,t:20,b:60};\nvar pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;\n\
    var cw=pw/n,ch=ph/n;\nfunction corr2color(v){\n  var r=v>0?Math.round(100+v*155):Math.round(100+v*80);\n\
    \  var b=v<0?Math.round(100-v*155):Math.round(100+v*80);\n  var g=Math.round(80+Math.abs(v)*20);\n\
    \  return 'rgb('+r+','+g+','+b+')';\n}\nfor(var i=0;i<n;i++){\n  for(var j=0;j<n;j++){\n\
    \    var v=corr[i][j];\n    var bx=pad.l+j*cw,by=pad.t+i*ch;\n    ctx.fillStyle=corr2color(v);\n\
    \    ctx.fillRect(bx+1,by+1,cw-2,ch-2);\n    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold\
    \ 9px monospace';ctx.textAlign='center';\n    ctx.fillText(v.toFixed(2),bx+cw/2,by+ch/2+4);\n\
    \  }\n}\nctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='10px monospace';ctx.textAlign='right';\n\
    for(var i=0;i<n;i++)ctx.fillText(labels[i],pad.l-4,pad.t+i*ch+ch/2+4);\nctx.textAlign='center';\n\
    for(var j=0;j<n;j++)ctx.fillText(labels[j],pad.l+j*cw+cw/2,H-pad.b+16);\nctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='bold\
    \ 11px sans-serif';ctx.textAlign='center';\nctx.fillText('Titanic Correlation\
    \ Matrix — Blue=Negative, Red=Positive',W/2,14);\n})();\n       </script>\n</div>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — correlation_heatmap.py\n        </span>\n<div class=\"cb-btns\">\n\
    <button class=\"run-btn\" onclick=\"openRepl()\">\n          ▶ try online\n  \
    \       </button>\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n  \
    \        copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> seaborn <span class=\"kw\">as</span> sns\n\
    <span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span>\
    \ plt\n\ndf = sns.<span class=\"fn\">load_dataset</span>(<span class=\"str\">'titanic'</span>)\n\
    \n<span class=\"cm\"># ── Always select numeric columns first ──</span>\nnumeric_df\
    \ = df.<span class=\"fn\">select_dtypes</span>(include=[<span class=\"str\">'number'</span>])\n\
    corr = numeric_df.<span class=\"fn\">corr</span>()    <span class=\"cm\"># Pearson\
    \ correlation: -1 to +1</span>\n\nplt.<span class=\"fn\">figure</span>(figsize=(<span\
    \ class=\"num\">9</span>, <span class=\"num\">7</span>))\nsns.<span class=\"fn\"\
    >heatmap</span>(\n    corr,\n    annot=<span class=\"kw\">True</span>,       \
    \    <span class=\"cm\"># show numbers in each cell</span>\n    fmt=<span class=\"\
    str\">'.2f'</span>,             <span class=\"cm\"># 2 decimal places</span>\n\
    \    cmap=<span class=\"str\">'coolwarm'</span>,      <span class=\"cm\"># blue=negative,\
    \ red=positive</span>\n    center=<span class=\"num\">0</span>,             <span\
    \ class=\"cm\"># centre the colormap at 0</span>\n    square=<span class=\"kw\"\
    >True</span>,          <span class=\"cm\"># make cells square</span>\n    linewidths=<span\
    \ class=\"num\">0.5</span>,       <span class=\"cm\"># grid lines between cells</span>\n\
    \    vmin=-<span class=\"num\">1</span>, vmax=<span class=\"num\">1</span>,  \
