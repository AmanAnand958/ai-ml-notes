    prompt_html: |-
      <p style="margin-bottom: 0.6rem;">
                 Load the Titanic dataset. Artificially introduce 20% random missing values into the "Age" column. Then impute using:
                </p>
      <ul style="padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;">
