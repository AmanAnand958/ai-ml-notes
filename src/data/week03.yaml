    sol_id: sol-w3d15t1
    solution_title: 📓 Complete Colab Code
    solution_code: "<span class=\"cm\"># Missing Value Report Generator</span>\n<span\
      \ class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\nurl = <span\
      \ class=\"str\">\"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv\"\
      </span>\ndf = pd.<span class=\"fn\">read_csv</span>(url)\n<span class=\"kw\"\
      >def</span> <span class=\"fn\">missing_report</span>(df):\n    report = pd.<span\
      \ class=\"fn\">DataFrame</span>({\n        <span class=\"str\">\"Missing\"</span>:\
      \ df.<span class=\"fn\">isnull</span>().<span class=\"fn\">sum</span>(),\n \
      \       <span class=\"str\">\"Percent\"</span>: (df.<span class=\"fn\">isnull</span>().<span\
      \ class=\"fn\">sum</span>()/<span class=\"fn\">len</span>(df)*<span class=\"\
      num\">100</span>).<span class=\"fn\">round</span>(<span class=\"num\">2</span>)\n\
      \    })\n    report = report[report[<span class=\"str\">\"Missing\"]&gt;0].sort_values(\"\
      Percent\"</span>, ascending=<span class=\"kw\">False</span>)\n    <span class=\"\
      fn\">print</span>(<span class=\"str\">f\"{'</span>Column<span class=\"str\"\
      >':&lt;15} {'</span>Missing<span class=\"str\">':&lt;8} {'</span>Percent<span\
      \ class=\"str\">':&lt;8} {'</span>Flag<span class=\"str\">':&lt;18} {'</span>Rec<span\
      \ class=\"str\">':&lt;12}\"</span>)\n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">\"=\"</span>*<span class=\"num\">60</span>)\n    <span class=\"\
      kw\">for</span> col <span class=\"kw\">in</span> report.index:\n        pct\
      \ = report.loc[col,<span class=\"str\">\"Percent\"</span>]\n        flag = <span\
      \ class=\"str\">\"DROP CANDIDATE\" if pct&gt;50 else \"\"</span>\n        dtype\
      \ = df[col].dtype\n        <span class=\"kw\">if</span> dtype <span class=\"\
      kw\">in</span> [<span class=\"str\">\"int64\",\"float64\"</span>] <span class=\"\
      kw\">and</span> pct&lt;=<span class=\"num\">50</span>:\n            rec = <span\
      \ class=\"str\">\"median\" if abs(df[col].skew())&gt;1 else \"mean\"</span>\n\
      \        <span class=\"kw\">elif</span> pct&lt;=<span class=\"num\">50</span>:\n\
      \            rec = <span class=\"str\">\"most_frequent\"</span>\n        <span\
      \ class=\"kw\">else</span>: rec = <span class=\"str\">\"-\"</span>\n       \
      \ <span class=\"fn\">print</span>(<span class=\"str\">f\"{col:&lt;15} {int(report.loc[col,'</span>Missing<span\
      \ class=\"str\">']):&lt;8} {pct:&lt;8} {flag:&lt;18} {rec:&lt;12}\"</span>)\n\
      <span class=\"fn\">missing_report</span>(df)"
