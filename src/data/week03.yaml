    bullets:
    - Nominal = no order (use One-Hot). Ordinal = has order (use Ordinal/custom mapping).
    - Label Encoding on nominals is only safe for tree-based models, never linear models
    - Always use drop_first=True in One-Hot Encoding to avoid the dummy variable trap
