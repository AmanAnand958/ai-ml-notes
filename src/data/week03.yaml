    correct_fb: ✅ Correct! When &gt;70% of a column is missing, imputation introduces
      more noise than signal. The "imputed" values are mostly guesses with no real
      data to base them on. Dropping the column is cleaner. Sometimes you can create
      a binary "was_cabin_recorded" indicator feature instead.
    wrong_fb: ❌ With 80% missing, imputation is unreliable — you'd be inventing data
      for 4 out of every 5 rows. Drop the column. The 20% that exists isn't enough
      to learn a meaningful pattern from.
    correct: c
  - num_str: QUESTION 2 OF 4
    question: Which type of missing data is HARDEST to handle and requires domain
      expertise?
    qid: q15_2
    options:
    - letter: A
      text: MCAR — Missing Completely At Random
      is_correct: false
      id: a
    - letter: B
      text: MAR — Missing At Random
      is_correct: false
      id: b
    - letter: C
      text: MNAR — Missing Not At Random
      is_correct: true
      id: c
    - letter: D
      text: All types are equally hard
      is_correct: false
      id: d
    correct_fb: '✅ Correct! MNAR is the hardest because the probability of missing
      depends on the value itself — meaning you can''t infer it from other columns.
      Example: high earners skip the income question. No statistical trick fixes this
      without domain knowledge. The best approach is to create an.'
    wrong_fb: ❌ MNAR (Missing Not At Random) is hardest — the missingness IS the signal.
      For example, if only sick patients skip a health field, "skipped" tells you
      something. Standard imputation destroys this signal. Create an indicator feature
      instead.
    correct: c
  - num_str: QUESTION 3 OF 4
    question: What is "data leakage" in the context of imputation?
    qid: q15_3
    options:
    - letter: A
      text: When you accidentally delete rows from your dataset
      is_correct: false
      id: a
    - letter: B
      text: When imputation statistics (mean/median) are computed using test data
      is_correct: true
      id: b
    - letter: C
      text: When two columns are correlated with each other
      is_correct: false
      id: c
    - letter: D
      text: When KNNImputer uses too many neighbors
      is_correct: false
      id: d
    correct_fb: '✅ Correct! Data leakage means your model "sees" test data during
      training — which makes your validation metrics unrealistically good but causes
      the model to fail in production. For imputation: always fit() on training data
      only, then transform() test data using those training statistics..'
    wrong_fb: '❌ Leakage = test data influencing training. If you compute the mean
      on the ENTIRE dataset (train+test) then impute, the training data''s mean is
      "contaminated" by test information. This makes CV scores optimistic but models
      fail in production. Always: fit on train, transform on test.'
    correct: b
  - num_str: QUESTION 4 OF 4
    question: 'For a numeric column with a highly skewed distribution (e.g. salary),
      which imputation is better: mean or median?'
    qid: q15_4
    options:
    - letter: A
      text: Mean — it uses all data points
      is_correct: false
      id: a
    - letter: B
      text: Median — it is robust to outliers
      is_correct: true
      id: b
    - letter: C
      text: They are always identical for any dataset
      is_correct: false
      id: c
    - letter: D
      text: Mode — since salary repeats
      is_correct: false
      id: d
    correct_fb: '✅ Correct! For skewed data (like salary, house prices), a few extreme
      values pull the mean far from the "typical" value. The median ignores those
      outliers. Example: if 9 people earn ₹40,000 and 1 person earns ₹10,00,000, mean
      ≈ ₹1,36,000 but median = ₹40,000. Filling missing salary with.'
    wrong_fb: '❌ For skewed distributions, use median. The mean is pulled by outliers
      — one ₹1 crore salary drags the mean far above the typical value. Median stays
      in the middle regardless. Rule: symmetric distribution → mean is fine; skewed
      or has outliers → use median.'
    correct: b
