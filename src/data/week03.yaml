    sol_id: sol-w3d18t1
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># 8-Chart Titanic Dashboard</span>

      <span class="kw">import</span> pandas <span class="kw">as</span> pd

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      <span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span>
      plt

      url = <span class="str">"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"</span>

      df = pd.<span class="fn">read_csv</span>(url)

      fig,ax = plt.<span class="fn">subplots</span>(<span class="num">3</span>,<span
      class="num">3</span>,figsize=(<span class="num">16</span>,<span class="num">14</span>))

      ax = ax.flat

      df[<span class="str">"Age"</span>].<span class="fn">hist</span>(bins=<span class="num">30</span>,ax=ax[<span
      class="num">0</span>])

      ax[<span class="num">0</span>].<span class="fn">set_title</span>(<span class="str">"Age
      Distribution"</span>)

      df[<span class="str">"Fare"</span>].<span class="fn">hist</span>(bins=<span
      class="num">30</span>,ax=ax[<span class="num">1</span>])

      ax[<span class="num">1</span>].<span class="fn">set_title</span>(<span class="str">"Fare
      Distribution"</span>)

      df[<span class="str">"Survived"].value_counts().plot(kind="bar"</span>,ax=ax[<span
      class="num">2</span>])

      ax[<span class="num">2</span>].<span class="fn">set_title</span>(<span class="str">"Survival"</span>)

      df[<span class="str">"Pclass"].value_counts().sort_index().plot(kind="bar"</span>,ax=ax[<span
      class="num">3</span>])

      ax[<span class="num">3</span>].<span class="fn">set_title</span>(<span class="str">"Passenger
      Class"</span>)

      df[<span class="str">"Sex"].value_counts().plot(kind="pie",ax=ax[4],autopct=''</span>%<span
      class="num">1</span>.0f%%'')

      ax[<span class="num">4</span>].<span class="fn">set_title</span>(<span class="str">"Gender"</span>)

      df.<span class="fn">groupby</span>(<span class="str">"Pclass")["Survived"].mean().plot(kind="bar"</span>,ax=ax[<span
      class="num">5</span>])

      ax[<span class="num">5</span>].<span class="fn">set_title</span>(<span class="str">"Survival
      by Class"</span>)

      df.<span class="fn">groupby</span>(<span class="str">"Sex")["Survived"].mean().plot(kind="bar"</span>,ax=ax[<span
      class="num">6</span>])

      ax[<span class="num">6</span>].<span class="fn">set_title</span>(<span class="str">"Survival
      by Gender"</span>)

      df[<span class="str">"Embarked"].value_counts().plot(kind="bar"</span>,ax=ax[<span
      class="num">7</span>])

      ax[<span class="num">7</span>].<span class="fn">set_title</span>(<span class="str">"Embarkation
      Port"</span>)

      ax[<span class="num">8</span>].<span class="fn">axis</span>(<span class="str">"off"</span>)

      plt.<span class="fn">tight_layout</span>()

      plt.<span class="fn">savefig</span>(<span class="str">"titanic_8chart_dashboard.png"</span>)

      <span class="fn">print</span>(<span class="str">"8-Chart Dashboard saved!"</span>)'
    solution_lang: python
