    <pre><span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span>\
    \ plt\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    \nnp.random.<span class=\"fn\">seed</span>(<span class=\"num\">42</span>)\nage\
    \    = np.random.<span class=\"fn\">randint</span>(<span class=\"num\">22</span>,\
