    solution_title: 📓 Complete Colab Code
    solution_code: '# Titanic Correlation + Violin Analysis

      import pandas as pd

      import numpy as np

      import matplotlib.pyplot as plt

      import seaborn as sns

      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"

      df = pd.read_csv(url)

      fig,ax = plt.subplots(1,2,figsize=(14,6))

      num_c = df[["Age","Fare","SibSp","Parch","Survived"]].dropna()

      sns.heatmap(num_c.corr(), annot=True, cmap="RdBu_r", center=0, ax=ax[0])

      ax[0].set_title("Correlation Heatmap")

      df_v = df.dropna(subset=["Age"])

      sns.violinplot(x="Pclass", y="Age", hue="Survived", data=df_v, split=True, ax=ax[1])

      ax[1].set_title("Age Distribution by Class and Survival")

      plt.tight_layout()

      plt.savefig("correlation_violin.png")

      print("Saved correlation heatmap + violin plots!")

      assert df_v is not None, "df_v should not be None"'
