            J1["Inner Join: Key B (Exact match intersection)"]
            J2["Left Join: Key A + Key B (Preserves all L keys, NaN on R)"]
            J3["Outer Join: Keys A, B, C (Full union with NaNs)"]
        end
        LeftTable --> Joins
        RightTable --> Joins
    </div>
    </div>
