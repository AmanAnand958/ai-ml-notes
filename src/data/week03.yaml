    </div>\n<!-- ─── MATPLOTLIB OO API ─── -->\n<h3 class=\"sh3\">\n       9. \U0001F3D7\
    ️ Object-Oriented (OO) API — Explicit Control\n      </h3>\n\n<div class=\"theory-block\"\
    \ style=\"background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:1.2rem;margin:1rem\
    \ 0;\">\n<h3 style=\"margin-top:0;color:var(--blue);font-size:14px;display:flex;align-items:center;gap:0.4rem;\"\
    >\n        \U0001F4D6 Pyplot vs. Object-Oriented Interface\n       </h3>\n<p style=\"\
    font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\">\n       \
    \ Matplotlib has two distinct ways of building plots:\n       </p>\n<p style=\"\
    font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\">\n       \
    \ •\n        <strong>\n         Pyplot API (State-based):\n        </strong>\n\
    \        Uses\n\n         plt.plot()\n\n        ,\n\n         plt.title()\n\n\
    \        , etc. It acts on the \"currently active\" figure and axes in the background.\n\
    \       </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\"\
    >\n        Good for quick scripts, but gets confusing when drawing multiple figures\
    \ or grids.\n       </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem\
    \ 0;line-height:1.5;\">\n        •\n        <strong>\n         Object-Oriented\
    \ (OO) API:\n        </strong>\n        Uses objects.\n       </p>\n<p style=\"\
    font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\">\n       \
    \ You explicitly create a Figure (the blank canvas container) and one or more\
    \ Axes (individual coordinate spaces for drawing).\n       </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem\
    \ 0;line-height:1.5;\">\n        You modify them by calling methods like\n\n \
    \        ax.plot()\n\n        and\n\n         ax.set_title()\n\n        .\n  \
    \     </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\"\
    >\n        This is the\n        <strong>\n         standard recommended style\n\
    \        </strong>\n        for production code.\n       </p>\n<div style=\"margin-top:0.8rem;\"\
    >\n<strong style=\"font-size:12px;color:var(--muted);display:block;margin-bottom:0.4rem;\"\
    >\n         \U0001F504 Interface Translation Cheat Sheet:\n        </strong>\n\
    <div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"\
    ><table class=\"concept-table\">\n<thead>\n<tr>\n<th style=\"width:50%;\">\n \
    \           Pyplot (State-based plt.*)\n           </th>\n<th style=\"width:50%;\"\
    >\n            Object-Oriented (ax.* / fig.*)\n           </th>\n</tr>\n</thead>\n\
    <tbody>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--orange);\"\
    >\n            plt.plot(x, y)\n           </td>\n<td style=\"font-family:var(--font-mono);color:var(--green);\"\
    >\n            ax.plot(x, y)\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--orange);\"\
    >\n            plt.title(\"My Title\")\n           </td>\n<td style=\"font-family:var(--font-mono);color:var(--green);\"\
    >\n            ax.set_title(\"My Title\")\n           </td>\n</tr>\n<tr>\n<td\
    \ style=\"font-family:var(--font-mono);color:var(--orange);\">\n            plt.xlabel(\"\
    Time\") / plt.ylabel(\"Sales\")\n           </td>\n<td style=\"font-family:var(--font-mono);color:var(--green);\"\
    >\n            ax.set_xlabel(\"Time\") / ax.set_ylabel(\"Sales\")\n          \
    \ </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--orange);\"\
    >\n            plt.xlim([x_min, x_max]) / plt.ylim(...)\n           </td>\n<td\
    \ style=\"font-family:var(--font-mono);color:var(--green);\">\n            ax.set_xlim([x_min,\
    \ x_max]) / ax.set_ylim(...)\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--orange);\"\
    >\n            plt.legend() / plt.grid()\n           </td>\n<td style=\"font-family:var(--font-mono);color:var(--green);\"\
    >\n            ax.legend() / ax.grid()\n           </td>\n</tr>\n<tr>\n<td style=\"\
    font-family:var(--font-mono);color:var(--orange);\">\n            plt.gcf() (Get\
    \ Current Fig) / plt.gca() (Get Current Axes)\n           </td>\n<td style=\"\
    font-family:var(--font-mono);color:var(--green);\">\n            You already have\
    \ variables\n\n             fig\n\n            and\n\n             ax\n\n    \
    \        !\n           </td>\n</tr>\n</tbody>\n</table></div>\n</div>\n<p style=\"\
    font-size:13px;color:var(--text);margin:0.8rem 0 0 0;line-height:1.5;\">\n   \
