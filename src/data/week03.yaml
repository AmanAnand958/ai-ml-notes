    solution_title: 📓 Complete Colab Code
    solution_code: |-
      # 8-Chart Titanic Dashboard
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"
      df = pd.read_csv(url)
      fig,ax = plt.subplots(3,3,figsize=(16,14))
      ax = ax.flat
      df["Age"].hist(bins=30,ax=ax[0])
      ax[0].set_title("Age Distribution")
      df["Fare"].hist(bins=30,ax=ax[1])
      ax[1].set_title("Fare Distribution")
      df["Survived"].value_counts().plot(kind="bar",ax=ax[2])
      ax[2].set_title("Survival")
      df["Pclass"].value_counts().sort_index().plot(kind="bar",ax=ax[3])
      ax[3].set_title("Passenger Class")
      df["Sex"].value_counts().plot(kind="pie",ax=ax[4],autopct='%1.0f%%')
      ax[4].set_title("Gender")
      df.groupby("Pclass")["Survived"].mean().plot(kind="bar",ax=ax[5])
      ax[5].set_title("Survival by Class")
      df.groupby("Sex")["Survived"].mean().plot(kind="bar",ax=ax[6])
      ax[6].set_title("Survival by Gender")
      df["Embarked"].value_counts().plot(kind="bar",ax=ax[7])
      ax[7].set_title("Embarkation Port")
      ax[8].axis("off")
      plt.tight_layout()
      plt.savefig("titanic_8chart_dashboard.png")
      print("8-Chart Dashboard saved!")
      assert ax is not None, "ax should not be None"
