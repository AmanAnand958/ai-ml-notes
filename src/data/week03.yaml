    solution_title: 📓 Complete Colab Code
    solution_code: "<span class=\"cm\"># Interactive Plotly Dashboard</span>\n<span\
      \ class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"\
      kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\"\
      >try</span>:\n    <span class=\"kw\">import</span> plotly.express <span class=\"\
      kw\">as</span> px\n    <span class=\"kw\">import</span> plotly.graph_objects\
      \ <span class=\"kw\">as</span> go\n    <span class=\"kw\">from</span> plotly.subplots\
      \ <span class=\"kw\">import</span> make_subplots\n    url = <span class=\"str\"\
      >\"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv\"\
      </span>\n    df = pd.<span class=\"fn\">read_csv</span>(url)\n    fig = <span\
      \ class=\"fn\">make_subplots</span>(rows=<span class=\"num\">2</span>, cols=<span\
      \ class=\"num\">2</span>, subplot_titles=[<span class=\"str\">\"Age Dist\",\"\
      Class Survival\",\"Fare vs Age\",\"Gender\"</span>])\n    fig.<span class=\"\
      fn\">add_trace</span>(go.<span class=\"fn\">Histogram</span>(x=df[<span class=\"\
      str\">\"Age\"].dropna(),name=\"Age\"</span>), row=<span class=\"num\">1</span>,\
      \ col=<span class=\"num\">1</span>)\n    <span class=\"kw\">for</span> c <span\
      \ class=\"kw\">in</span> [<span class=\"num\">1</span>,<span class=\"num\">2</span>,<span\
      \ class=\"num\">3</span>]:\n        sr = df[df[<span class=\"str\">\"Pclass\"\
      ]==c][\"Survived\"</span>].<span class=\"fn\">mean</span>()\n        fig.<span\
      \ class=\"fn\">add_trace</span>(go.<span class=\"fn\">Bar</span>(x=[<span class=\"\
