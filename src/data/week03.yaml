    correct_fb: '✅ Correct! 28 states → One-Hot creates 27 new columns (high dimensionality). LabelEncoder on nominal states
      is invalid for linear models (implies ordering). Target Encoding replaces each state with its mean target value — one
      compact column that captures the signal. Remember: compute target.'
    wrong_fb: '❌ 28 states is medium-high cardinality. LabelEncoder implies false ordering. One-Hot creates 27 columns — acceptable
      but adds dimensionality. Best choice: Target Encoding for linear models (replace state with mean target value for that
      state, computed on train set only).'
