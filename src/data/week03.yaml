    \ median (Q2), third quartile (Q3), and maximum, plus any outlier points.\n  \
    \     </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\"\
    >\n<strong>\n         When to use:\n        </strong>\n        Comparing distributions\
