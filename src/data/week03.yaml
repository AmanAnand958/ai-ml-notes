  quizzes:
  - num_str: QUESTION 1 OF 4
    question: Which pandas method should you use to extract equal-frequency bins (each
      bin has the same number of rows)?
    qid: q20_1
    options:
    - letter: A
      text: pd.cut() with equal bin widths
      is_correct: false
    - letter: B
      text: pd.qcut() with specified quantiles
      is_correct: true
    - letter: C
      text: pd.bin() with n_bins parameter
      is_correct: false
    - letter: D
      text: df.groupby() with equal groups
      is_correct: false
    correct_fb: ✅ Correct! pd.qcut(df["salary"], q=5) creates 5 bins where each bin
      has roughly the same number of rows (quintiles). pd.cut() creates equal-width
      bins — for skewed salary data, most people would land in bin 1 (low salary)
      making the other bins mostly empty. qcut is better for skewed distributions
      where you want each bin to be equally "populated".
    wrong_fb: ❌ pd.qcut() creates equal-frequency bins (quantile-based). pd.cut()
      creates equal-width bins. For skewed salary data (most people earn less), pd.cut()
      with equal width puts 90% of data in one bin. pd.qcut() ensures each bin has
      roughly the same count — better for modeling.
  - num_str: QUESTION 2 OF 4
    question: PolynomialFeatures(degree=2) on 2 features [A, B] creates how many output
      features (with include_bias=False)?
    qid: q20_2
    options:
    - letter: A
      text: '2'
      is_correct: false
    - letter: B
      text: '4'
      is_correct: false
    - letter: C
      text: '5'
      is_correct: true
    - letter: D
      text: '6'
      is_correct: false
    correct_fb: '✅ Correct! With 2 features [A, B] and degree=2: the output is [A,
      B, A², AB, B²] = 5 features. Formula: (n+d)! / (n! × d!) − 1 (bias excluded)
      where n=features, d=degree. For degree=3 with 2 features: [A, B, A², AB, B²,
      A³, A²B, AB², B³] = 9 features. This is why high-degree polynomial features
      on many features cause combinatorial explosion.'
    wrong_fb: '❌ With [A, B] and degree=2: output = [A, B, A², A×B, B²] = 5 features.
      The interactions (A×B) are what make it powerful for linear models — they can
      now fit non-linear decision boundaries. For 3 features and degree=2: 9 features.
      Growth is combinatorial — be careful with degree=3+ on many features.'
  - num_str: QUESTION 3 OF 4
    question: Why is creating a "family_size = SibSp + Parch + 1" feature on Titanic
      useful?
    qid: q20_3
    options:
    - letter: A
      text: It reduces the number of columns
      is_correct: false
    - letter: B
      text: It captures the real-world insight that family group size affects survival
        behavior
      is_correct: true
    - letter: C
      text: It makes the SibSp and Parch columns redundant
      is_correct: false
    - letter: D
      text: SibSp and Parch are correlated, so summing them reduces noise
      is_correct: false
    correct_fb: ✅ Correct! Historically, families on Titanic made group decisions
      — small families (2–4) had better coordination. Very large families (5+) struggled
      to stay together. Alone passengers (family_size=1) had different survival rates.
      A linear model using SibSp and Parch separately can't capture "being alone"
      vs "small family" vs "large family" as cleanly as a single engineered feature
      can. Domain knowledge → better features → better models.
    wrong_fb: ❌ The value is domain-driven insight. "Total people travelling together"
      is a more meaningful concept than raw siblings or parents count. Solo travellers,
      small families, and large groups had different survival behaviors. The engineered
      feature captures this pattern that SibSp and Parch alone don't express clearly.
      This is why feature engineering requires domain thinking.
  - num_str: QUESTION 4 OF 4
    question: 'Random Forest''s feature importances measure:'
    qid: q20_4
    options:
    - letter: A
      text: The correlation of each feature with the target variable
      is_correct: false
    - letter: B
      text: How much each feature reduces impurity across all trees in the forest
      is_correct: true
    - letter: C
      text: The percentage of rows each feature appears in
      is_correct: false
    - letter: D
      text: How many times each feature was selected as the best split
      is_correct: false
    correct_fb: ✅ Correct! Random Forest computes feature importance as the average
      decrease in impurity (Gini impurity or entropy) across all splits where that
      feature is used, averaged across all trees. Features that consistently create
      "purer" child nodes (better-separated classes) get higher importance. This is
      also called "mean decrease in impurity" (MDI). All importances sum to 1.0.
    wrong_fb: ❌ RF feature importance = mean decrease in impurity. Each time a feature
      is used to split a node, it measures how much the split reduces impurity (Gini).
      Average this across all trees → importance score. All scores sum to 1.0. Correlation
      only captures linear relationships; RF importance captures non-linear importance
      too — that's why it's more powerful for feature selection.
