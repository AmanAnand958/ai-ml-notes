    solution_title: 📓 Complete Colab Code
    solution_code: |-
      # Animated Bar Chart Race
      import numpy as np
      import pandas as pd
      np.random.seed(42)
      N,steps = 5,20
      names = ["Python","JavaScript","R","Julia","Swift"]
      data = {n:np.random.rand(steps).cumsum()*10+np.random.randint(20,50) for n in names}
      df = pd.DataFrame(data)
      print("Top language at each step:")
      for i in range(steps):
          ranking = df.iloc[i].sort_values(ascending=False)
          print(f"  Step {i+1:2d}: {ranking.index[0]:12s} {ranking.iloc[0]:6.1f}")
      print("\nFinal ranking:")
      for r,(l,v) in enumerate(df.iloc[-1].sort_values(ascending=False).items(),1):
          print(f"  #{r}: {l:12s} {v:.1f}")
      print("\n(For actual animation: pip install bar_chart_race)")
      assert ranking is not None, "ranking should not be None"
