    sol_id: sol-w3d16t2
    solution_title: 📓 Complete Colab Code
    solution_code: '# Encoding Impact on Logistic Regression

      import pandas as pd

      import numpy as np

      from sklearn.preprocessing import LabelEncoder, OneHotEncoder

      from sklearn.linear_model import LogisticRegression

      from sklearn.model_selection import cross_val_score

      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"

      df = pd.read_csv(url).dropna(subset=["Embarked"])

      X = df[["Sex","Embarked","Pclass","Fare"]].copy()

      y = df["Survived"]

      X_le = X.copy()

      X_le["Sex"] = LabelEncoder().fit_transform(X_le["Sex"])

      X_le["Embarked"] = LabelEncoder().fit_transform(X_le["Embarked"])

      ohe = OneHotEncoder(drop="first", sparse_output=False)

      ohe_cols = ohe.fit_transform(X[["Sex","Embarked"]])

      feat_names = ohe.get_feature_names_out(["Sex","Embarked"])

      X_ohe = pd.concat([X[["Pclass","Fare"]], pd.DataFrame(ohe_cols, columns=feat_names)],
      axis=1)

      le_acc = cross_val_score(LogisticRegression(max_iter=1000), X_le, y, cv=5).mean()

      ohe_acc = cross_val_score(LogisticRegression(max_iter=1000), X_ohe, y, cv=5).mean()

      print(f"Label Encoding CV accuracy: {le_acc:.4f}")

      print(f"OneHot Encoding CV accuracy: {ohe_acc:.4f}")

      print(f"Difference: {(ohe_acc-le_acc)*100:.2f}%")

      assert ohe_acc is not None, "ohe_acc should not be None"'
    solution_lang: python
    time_minutes: 45
  - title: Full Encoding Pipeline with ColumnTransformer
    badge: 🔵 CHALLENGE
