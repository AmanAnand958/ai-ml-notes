    <pre><code><span class="kw">import</span> pandas <span class="kw">as</span> pd
    <span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span> PolynomialFeatures

    df = pd.<span class="fn">read_csv</span>(<span class="str">"titanic.csv"</span>)

    <span class="cm"># --- Ratio features ---</span>
    df[<span class="str">'fare_per_class'</span>] = df[<span class="str">'Fare'</span>] / df[<span class="str">'Pclass'</span>]  <span class="cm"># relative fare within class</span>
    df[<span class="str">'family_size'</span>] = df[<span class="str">'SibSp'</span>] + df[<span class="str">'Parch'</span>] + <span class="num">1</span>    <span class="cm"># total people travelling</span>
    df[<span class="str">'is_alone'</span>] = (df[<span class="str">'family_size'</span>] == <span class="num">1</span>).<span class="fn">astype</span>(int)   <span class="cm"># 1 if travelling alone</span>

    <span class="cm"># --- Title extraction from Name (text feature engineering) ---</span>
    df[<span class="str">'title'</span>] = df[<span class="str">'Name'</span>].str.<span class="fn">extract</span>(r<span class="str">' ([A-Za-z]+)\.'</span>)
    <span class="cm"># Extracts: Mr, Mrs, Miss, Master, Dr, Rev etc.</span>
    <span class="cm"># This single feature is highly predictive of survival!</span>
    title_survival = df.<span class="fn">groupby</span>(<span class="str">'title'</span>)[<span class="str">'Survived'</span>].<span class="fn">mean</span>().<span class="fn">sort_values</span>(ascending=<span class="kw">False</span>)
    <span class="fn">print</span>(title_survival)

    <span class="cm"># --- Binning: Age into groups ---</span>
    df[<span class="str">'age_group'</span>] = pd.<span class="fn">cut</span>(df[<span class="str">'Age'</span>],
                             bins=[<span class="num">0</span>, <span class="num">12</span>, <span class="num">18</span>, <span class="num">35</span>, <span class="num">60</span>, <span class="num">100</span>],
                             labels=[<span class="str">'child'</span>, <span class="str">'teen'</span>, <span class="str">'adult'</span>, <span class="str">'middle'</span>, <span class="str">'senior'</span>])
    <span class="fn">print</span>(df[<span class="str">'age_group'</span>].<span class="fn">value_counts</span>())

    <span class="cm"># --- Polynomial features (for linear models) ---</span>
    X = df[[<span class="str">'Age'</span>, <span class="str">'Fare'</span>]].<span class="fn">dropna</span>()
    poly = <span class="fn">PolynomialFeatures</span>(degree=<span class="num">2</span>, include_bias=<span class="kw">False</span>)
    X_poly = poly.<span class="fn">fit_transform</span>(X)
    <span class="fn">print</span>(<span class="str">f"Original: {X.shape}, Polynomial: {X_poly.shape}"</span>)
    <span class="cm"># Original: (714, 2) → Polynomial: (714, 5)</span>
    <span class="cm"># New features: Age, Fare, Age², Age×Fare, Fare²</span>
    <span class="fn">print</span>(poly.<span class="fn">get_feature_names_out</span>())  <span class="cm"># ['Age', 'Fare', 'Age^2', 'Age Fare', 'Fare^2']</span></code></pre>
