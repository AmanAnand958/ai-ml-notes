  hinglish: Box plots outliers dikhate hain visually — IQR se 1.5x zyada door jo points
    hain wo outliers hain. Inhe handle karna — winsorize ya remove — important decision
    hai.
  analogy: 'Think of it like this: Cricket batting positions (Opener=1, Middle=2,
    Finisher=3) ka encoding theek hai kyunki order matter karta hai. Lekin agar cities
    ko encode karein (Delhi=1, Mumbai=2, Chennai=3), model sochega Mumbai aur Delhi
    ke beech ka average Chennai hai! Yeh bilkul galat hai — cities ke beech koi order
    nahi hota.'
  theory_html: "<h3 class=\"sh3\">\n       1. Why Encoding Matters\n      </h3>\n\n\
    <p>\n       Categorical variables come in two flavours.\n      </p>\n<p>\n<strong>\n\
    \        Nominal\n       </strong>\n       : no natural order (color, city, gender).\n\
    \      </p>\n<p>\n<strong>\n        Ordinal\n       </strong>\n       : a natural\
    \ order exists (small/medium/large, poor/average/good).\n      </p>\n<p>\n   \
    \    The choice of encoding depends entirely on this distinction.\n      </p>\n\
    <div class=\"ml-connect\">\n       Tree-based models (Decision Tree, Random Forest,\
    \ XGBoost) can handle Label Encoding on nominals because they split on values\
    \ rather than assuming order.\n       <br/>\n<br/>\n       But linear models (Linear\
    \ Regression, Logistic Regression, SVM) absolutely require proper One-Hot Encoding\
    \ for nominal features — they assume numeric order matters.\n      </div>\n<h3\
    \ class=\"sh3\">\n       2. Label Encoding — For Ordinal Data Only\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       Label encoding converts categorical strings into sequential integers,\
    \ suitable only for categories with a natural mathematical order.\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — label_encoding.py\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"run-btn\" onclick=\"openRepl()\">\n          ▶ try online\n        \
    \ </button>\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n        \
    \  copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><code><span class=\"kw\">from</span> sklearn.preprocessing <span class=\"\
    kw\">import</span> LabelEncoder\n<span class=\"kw\">import</span> pandas <span\
    \ class=\"kw\">as</span> pd\n\n<span class=\"cm\"># GOOD USE: Ordinal data — order\
    \ matters</span>\ndf = pd.<span class=\"fn\">DataFrame</span>({<span class=\"\
    str\">'education'</span>: [<span class=\"str\">'High School'</span>, <span class=\"\
    str\">'Bachelor'</span>, <span class=\"str\">'Master'</span>, <span class=\"str\"\
    >'PhD'</span>]})\nedu_order = {<span class=\"str\">'High School'</span>: <span\
    \ class=\"num\">0</span>, <span class=\"str\">'Bachelor'</span>: <span class=\"\
    num\">1</span>, <span class=\"str\">'Master'</span>: <span class=\"num\">2</span>,\
    \ <span class=\"str\">'PhD'</span>: <span class=\"num\">3</span>}\ndf[<span class=\"\
    str\">'education_encoded'</span>] = df[<span class=\"str\">'education'</span>].<span\
    \ class=\"fn\">map</span>(edu_order)\n<span class=\"fn\">print</span>(df)\n<span\
    \ class=\"cm\"># education  education_encoded</span>\n<span class=\"cm\"># High\
    \ School  0   ← less education</span>\n<span class=\"cm\"># Bachelor     1</span>\n\
    <span class=\"cm\"># Master       2</span>\n<span class=\"cm\"># PhD         \
    \ 3   ← most education (order preserved!)</span>\n\n<span class=\"cm\"># BAD USE:\
    \ Nominal data — DO NOT use LabelEncoder here</span>\nle = <span class=\"fn\"\
    >LabelEncoder</span>()\ndf[<span class=\"str\">'city'</span>] = [<span class=\"\
    str\">'Delhi'</span>, <span class=\"str\">'Mumbai'</span>, <span class=\"str\"\
    >'Chennai'</span>]\ndf[<span class=\"str\">'city_encoded'</span>] = le.<span class=\"\
    fn\">fit_transform</span>(df[<span class=\"str\">'city'</span>])\n<span class=\"\
    cm\"># Chennai=0, Delhi=1, Mumbai=2  ← WRONG: implies Delhi is between Chennai\
    \ &amp; Mumbai!</span></code></pre>\n</div>\n<h3 class=\"sh3\">\n       3. One-Hot\
    \ Encoding — For Nominal Data\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       One-hot encoding creates separate\
    \ binary columns for each categorical value, preventing models from assuming ordinal\
    \ relationships between nominal tags.\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         python — one_hot_encoding.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><code><span class=\"kw\">import</span> pandas\
    \ <span class=\"kw\">as</span> pd\n<span class=\"kw\">from</span> sklearn.preprocessing\
    \ <span class=\"kw\">import</span> OneHotEncoder\n\ndf = pd.<span class=\"fn\"\
    >DataFrame</span>({<span class=\"str\">'city'</span>: [<span class=\"str\">'Delhi'</span>,\
    \ <span class=\"str\">'Mumbai'</span>, <span class=\"str\">'Chennai'</span>, <span\
    \ class=\"str\">'Delhi'</span>]})\n\n<span class=\"cm\"># Method 1: pd.get_dummies\
    \ (quick and easy)</span>\ndummies = pd.<span class=\"fn\">get_dummies</span>(df[<span\
    \ class=\"str\">'city'</span>], prefix=<span class=\"str\">'city'</span>)\n<span\
    \ class=\"fn\">print</span>(dummies)\n<span class=\"cm\"># city_Chennai  city_Delhi\
    \  city_Mumbai</span>\n<span class=\"cm\">#     0              1           0 \
    \      ← Delhi row</span>\n<span class=\"cm\">#     0              0         \
    \  1       ← Mumbai row</span>\n<span class=\"cm\">#     1              0    \
    \       0       ← Chennai row</span>\n\n<span class=\"cm\"># IMPORTANT: drop_first=True\
    \ to avoid \"dummy variable trap\"</span>\ndummies = pd.<span class=\"fn\">get_dummies</span>(df[<span\
    \ class=\"str\">'city'</span>], prefix=<span class=\"str\">'city'</span>, drop_first=<span\
    \ class=\"kw\">True</span>)\n<span class=\"cm\"># Removes one column (it's redundant\
    \ — if not Delhi and not Mumbai, must be Chennai)</span>\n\n<span class=\"cm\"\
    ># Method 2: sklearn OneHotEncoder (better for pipelines)</span>\nohe = <span\
    \ class=\"fn\">OneHotEncoder</span>(drop=<span class=\"str\">'first'</span>, sparse_output=<span\
    \ class=\"kw\">False</span>)\nencoded = ohe.<span class=\"fn\">fit_transform</span>(df[[<span\
    \ class=\"str\">'city'</span>]])\n<span class=\"fn\">print</span>(encoded)\n<span\
    \ class=\"fn\">print</span>(ohe.<span class=\"fn\">get_feature_names_out</span>())</code></pre>\n\
    </div>\n<div style=\"background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem\
    \ 0;\">\n<strong style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\"\
    >\n        \U0001F4CA Visualizing Encoding Mechanisms\n       </strong>\n<canvas\
    \ height=\"200\" id=\"canvas-encoding16\" style=\"width:100%;max-max-width: 100%;\
    \ width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0 auto;\"\
    \ width=\"560\">\n</canvas>\n\n</div>\n<h3 class=\"sh3\">\n       4. Target Encoding\
    \ — For High-Cardinality Columns\n      </h3>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         python — target_encoding.py\n \
    \       </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><code><span class=\"kw\">import</span> pandas\
    \ <span class=\"kw\">as</span> pd\n\n<span class=\"cm\"># Problem: 500 cities\
    \ → One-Hot creates 499 columns (too many!)</span>\n<span class=\"cm\"># Solution:\
    \ replace each city with its MEAN TARGET VALUE</span>\n\ndf = pd.<span class=\"\
    fn\">DataFrame</span>({\n    <span class=\"str\">'city'</span>: [<span class=\"\
    str\">'Delhi'</span>, <span class=\"str\">'Mumbai'</span>, <span class=\"str\"\
    >'Delhi'</span>, <span class=\"str\">'Mumbai'</span>, <span class=\"str\">'Chennai'</span>],\n\
    \    <span class=\"str\">'churned'</span>: [<span class=\"num\">1</span>, <span\
    \ class=\"num\">0</span>, <span class=\"num\">1</span>, <span class=\"num\">0</span>,\
    \ <span class=\"num\">1</span>]   <span class=\"cm\"># target variable</span>\n\
    })\n\n<span class=\"cm\"># Method 1: Manual Target Encoding (risky for data leakage)</span>\n\
    city_target_mean = df.<span class=\"fn\">groupby</span>(<span class=\"str\">'city'</span>)[<span\
    \ class=\"str\">'churned'</span>].<span class=\"fn\">mean</span>()\ndf[<span class=\"\
    str\">'city_encoded'</span>] = df[<span class=\"str\">'city'</span>].<span class=\"\
    fn\">map</span>(city_target_mean)\n\n<span class=\"cm\"># Method 2: category_encoders\
    \ library (Industry Standard, prevents leakage)</span>\n<span class=\"kw\">import</span>\
    \ category_encoders <span class=\"kw\">as</span> ce\nencoder = ce.<span class=\"\
    fn\">TargetEncoder</span>(cols=[<span class=\"str\">'city'</span>])\n<span class=\"\
    cm\"># Fit on training data ONLY</span>\ndf[<span class=\"str\">'city_ce_encoded'</span>]\
    \ = encoder.<span class=\"fn\">fit_transform</span>(df[<span class=\"str\">'city'</span>],\
    \ df[<span class=\"str\">'churned'</span>])\n<span class=\"fn\">print</span>(df[[<span\
    \ class=\"str\">'city'</span>, <span class=\"str\">'city_encoded'</span>]])\n\
    <span class=\"cm\"># Delhi   → 1.0 (both Delhi rows churned)</span>\n<span class=\"\
    cm\"># Mumbai  → 0.0 (neither Mumbai row churned)</span>\n<span class=\"cm\">#\
    \ Chennai → 1.0 (churned)</span>\n\n<span class=\"cm\"># ⚠️ Always compute target\
    \ mean on TRAINING set only (leakage risk!)</span></code></pre>\n</div>\n<div\
    \ style=\"background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem\
    \ 0;\">\n<strong style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\"\
    >\n        \U0001F4CA Visualizing Target Encoding Calculation\n       </strong>\n\
    <canvas height=\"200\" id=\"canvas-target-encoding16\" style=\"width:100%;max-max-width:\
    \ 100%; width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0\
    \ auto;\" width=\"560\">\n</canvas>\n\n</div>\n<div class=\"table-wrap\" style=\"\
    overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\"\
    >\n<tr>\n<th>\n         Encoding\n        </th>\n<th>\n         When to Use\n\
    \        </th>\n<th>\n         Pros\n        </th>\n<th>\n         Cons\n    \
    \    </th>\n</tr>\n<tr>\n<td>\n<strong>\n          Label Encoding\n         </strong>\n\
    </td>\n<td>\n         Ordinal data with clear order\n        </td>\n<td>\n   \
