  tasks:
  - title: Detect and Visualise Outliers
    badge: 🟢 EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Load the Titanic\
      \ dataset. For the \"Fare\" column:\n          </p>\n<ul style=\"padding-left:\
      \ 1.5rem; margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;\"\
      >\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n             (1)\n     \
      \       </strong>\n            Plot a boxplot showing outliers\n           </li>\n\
      <li style=\"margin-bottom: 0.4rem;\">\n<strong>\n             (2)\n        \
      \    </strong>\n            Apply the IQR method to find outlier thresholds\
      \ and list outlier values\n           </li>\n<li style=\"margin-bottom: 0.4rem;\"\
      >\n<strong>\n             (3)\n            </strong>\n            Apply Z-score\
      \ method (threshold=3) to find outliers\n           </li>\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n<strong>\n             (4)\n            </strong>\n          \
      \  Compare: do both methods agree on the same outliers? Which is more conservative?\n\
      \           </li>\n</ul>"
    done_when: Two outlier lists printed (IQR and Z-score methods), a boxplot saved,
      and a comment on which method flags more values.
    git_cmd: 'git add . &amp;&amp; git commit -m "day17: outlier detection IQR and
      Z-score on Titanic Fare"'
    sol_id: sol-w3d17t1
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Detect and Visualise Outliers with IQR</span>

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      <span class="kw">import</span> pandas <span class="kw">as</span> pd

      np.random.<span class="fn">seed</span>(<span class="num">42</span>)

      data = np.<span class="fn">concatenate</span>([np.random.<span class="fn">normal</span>(<span
      class="num">50</span>, <span class="num">10</span>, <span class="num">100</span>),
      [<span class="num">120</span>, <span class="num">5</span>, <span class="num">130</span>,
      <span class="num">3</span>, <span class="num">140</span>, <span class="num">2</span>]])

      s = pd.<span class="fn">Series</span>(data, name=<span class="str">"values"</span>)

      Q1, Q3 = s.<span class="fn">quantile</span>(<span class="num">0.25</span>),
      s.<span class="fn">quantile</span>(<span class="num">0.75</span>)

      IQR = Q3 - Q1

      lo, hi = Q1 - <span class="num">1.5</span>*IQR, Q3 + <span class="num">1.5</span>*IQR

      outliers = s[(s&lt;lo)|(s&gt;hi)]

      <span class="fn">print</span>(<span class="str">f"Q1={Q1:.2f}, Q3={Q3:.2f},
      IQR={IQR:.2f}"</span>)

      <span class="fn">print</span>(<span class="str">f"Fences: [{lo:.2f}, {hi:.2f}]"</span>)

      <span class="fn">print</span>(<span class="str">f"Outliers ({len(outliers)}):
      {list(outliers.values)}"</span>)

      <span class="fn">print</span>(<span class="str">f"With outliers: mean={s.mean():.2f},
      med={s.median():.2f}"</span>)

      clean = s[(s&gt;=lo)&amp;(s&lt;=hi)]

      <span class="fn">print</span>(<span class="str">f"Without outliers: mean={clean.mean():.2f},
      med={clean.median():.2f}"</span>)'
    solution_lang: python
  - title: Scaling Impact on KNN Accuracy
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Use Titanic (numeric\
      \ features only: Age, Fare, Pclass, SibSp, Parch).\n          </p>\n<p style=\"\
      margin-bottom: 0.6rem;\">\n           Train a KNeighborsClassifier to predict\
      \ survival. Compare:\n          </p>\n<ul style=\"padding-left: 1.5rem; margin-top:\
      \ 0.4rem; margin-bottom: 1rem; list-style-type: disc;\">\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n<strong>\n             (1)\n            </strong>\n          \
      \  No scaling\n           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n\
      \             (2)\n            </strong>\n            StandardScaler\n     \
      \      </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n            \
      \ (3)\n            </strong>\n            MinMaxScaler\n           </li>\n<li\
      \ style=\"margin-bottom: 0.4rem;\">\n<strong>\n             (4)\n          \
      \  </strong>\n            RobustScaler. Report accuracy for each. Which scaler\
      \ works best? Plot a bar chart comparing the four\n           </li>\n</ul>"
    done_when: Bar chart with 4 accuracies, and a written conclusion about which scaler
      wins and why it matters for KNN.
    git_cmd: 'git add . &amp;&amp; git commit -m "day17: scaling impact on KNN accuracy
      comparison"'
    sol_id: sol-w3d17t2
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Scaling Impact on KNN Accuracy</span>

      <span class="kw">import</span> pandas <span class="kw">as</span> pd

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      <span class="kw">from</span> sklearn.neighbors <span class="kw">import</span>
      KNeighborsClassifier

      <span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span>
      StandardScaler, MinMaxScaler

      <span class="kw">from</span> sklearn.model_selection <span class="kw">import</span>
      cross_val_score

      url = <span class="str">"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"</span>

      df = pd.<span class="fn">read_csv</span>(url).<span class="fn">dropna</span>(subset=[<span
      class="str">"Age","Fare"</span>])

      X = df[[<span class="str">"Age","Fare","Pclass"</span>]].values

      y = df[<span class="str">"Survived"</span>].values

      raw = <span class="fn">cross_val_score</span>(<span class="fn">KNeighborsClassifier</span>(n_neighbors=<span
      class="num">5</span>), X, y, cv=<span class="num">5</span>).<span class="fn">mean</span>()

      std = <span class="fn">cross_val_score</span>(<span class="fn">KNeighborsClassifier</span>(n_neighbors=<span
      class="num">5</span>), <span class="fn">StandardScaler</span>().<span class="fn">fit_transform</span>(X),
      y, cv=<span class="num">5</span>).<span class="fn">mean</span>()

      mm = <span class="fn">cross_val_score</span>(<span class="fn">KNeighborsClassifier</span>(n_neighbors=<span
      class="num">5</span>), <span class="fn">MinMaxScaler</span>().<span class="fn">fit_transform</span>(X),
      y, cv=<span class="num">5</span>).<span class="fn">mean</span>()

      <span class="fn">print</span>(<span class="str">f"Raw accuracy:       {raw:.4f}"</span>)

      <span class="fn">print</span>(<span class="str">f"StandardScaler:     {std:.4f}"</span>)

      <span class="fn">print</span>(<span class="str">f"MinMaxScaler:       {mm:.4f}"</span>)

      <span class="fn">print</span>(<span class="str">f"Best: {''</span>StandardScaler<span
      class="str">'' if std&gt;mm else ''</span>MinMaxScaler<span class="str">''}
      improves by {(max(std,mm)-raw)*100:.1f}%"</span>)'
    solution_lang: python
  - title: Log Transform + Distribution Analysis
    badge: 🔵 CHALLENGE
    badge_class: tb-proj
    time: 3 hours
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Download the \"\
      House Prices\" dataset from Kaggle. The SalePrice column is right-skewed.\n\
      \          </p>\n<ul style=\"padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom:\
      \ 1rem; list-style-type: disc;\">\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n\
      \             (1)\n            </strong>\n            Plot histogram of SalePrice\
      \ — note the skewness\n           </li>\n<li style=\"margin-bottom: 0.4rem;\"\
      >\n<strong>\n             (2)\n            </strong>\n            Apply np.log1p()\
      \ transformation\n           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n\
      <strong>\n             (3)\n            </strong>\n            Plot histogram\
      \ of log-transformed prices\n           </li>\n<li style=\"margin-bottom: 0.4rem;\"\
      >\n<strong>\n             (4)\n            </strong>\n            Train LinearRegression\
      \ on both versions; compare RMSE on test set\n           </li>\n<li style=\"\
      margin-bottom: 0.4rem;\">\n<strong>\n             (5)\n            </strong>\n\
      \            When predicting with log model, remember to apply np.expm1() to\
      \ reverse the log!\n           </li>\n</ul>"
    done_when: Side-by-side histograms showing the skewness improvement, and lower
      RMSE from the log-transformed model.
    git_cmd: 'git add . &amp;&amp; git commit -m "day17: log transformation on house
      prices + RMSE comparison"'
    sol_id: sol-w3d17t3
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Log Transform + Distribution Analysis</span>

      <span class="kw">import</span> pandas <span class="kw">as</span> pd

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      <span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span>
      plt

      url = <span class="str">"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"</span>

      df = pd.<span class="fn">read_csv</span>(url)[<span class="str">"Fare"</span>].<span
      class="fn">dropna</span>()

      fig,ax = plt.<span class="fn">subplots</span>(<span class="num">1</span>,<span
      class="num">2</span>,figsize=(<span class="num">12</span>,<span class="num">5</span>))

      ax[<span class="num">0</span>].<span class="fn">hist</span>(df, bins=<span class="num">40</span>,
      alpha=<span class="num">0.7</span>, edgecolor=<span class="str">''black''</span>)

      ax[<span class="num">0</span>].<span class="fn">set_title</span>(<span class="str">f"Original:
      skew={df.skew():.2f}"</span>)

      log_fare = np.<span class="fn">log1p</span>(df)

      ax[<span class="num">1</span>].<span class="fn">hist</span>(log_fare, bins=<span
      class="num">40</span>, alpha=<span class="num">0.7</span>, edgecolor=<span class="str">''black''</span>)

      ax[<span class="num">1</span>].<span class="fn">set_title</span>(<span class="str">f"Log-transformed:
      skew={log_fare.skew():.2f}"</span>)

      plt.<span class="fn">tight_layout</span>()

      plt.<span class="fn">savefig</span>(<span class="str">"log_transform.png"</span>)

      <span class="fn">print</span>(<span class="str">f"Original: mean={df.mean():.1f}
      median={df.median():.1f} skew={df.skew():.2f}"</span>)

      <span class="fn">print</span>(<span class="str">f"Log(1+x): mean={log_fare.mean():.3f}
      median={log_fare.median():.3f} skew={log_fare.skew():.2f}"</span>)

      <span class="fn">print</span>(<span class="str">"Log transform normalised the
      distribution significantly!"</span>)'
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: 'You have a salary feature: most values are between ₹30,000–₹80,000
      but a few are ₹10,00,000+. Which scaler should you use?'
    qid: q17_1
    options:
    - letter: A
      text: StandardScaler — it's the default
      is_correct: false
    - letter: B
      text: MinMaxScaler — maps to [0,1]
      is_correct: false
    - letter: C
      text: RobustScaler — robust to those outliers
      is_correct: true
    - letter: D
      text: No scaling needed for salary
      is_correct: false
    correct_fb: ✅ Correct! MinMaxScaler would map ₹10L to 1.0 and compress everything
      else into [0, 0.07]. StandardScaler's mean gets pulled by those extreme values.
      RobustScaler uses median and IQR — the ₹10L outliers don't affect the median
      or IQR significantly, so the bulk of the data is still well-scaled. Always use
      RobustScaler when you have genuine outliers you want to keep.
    wrong_fb: ❌ With salary outliers at ₹10L+, MinMaxScaler maps all normal salaries
      into a tiny range [0, 0.07] — the outlier dominates. StandardScaler's mean and
      std get pulled by outliers. RobustScaler uses median and IQR which are outlier-resistant
      — the right choice here.
  - num_str: QUESTION 2 OF 4
    question: Which of these models does NOT require feature scaling?
    qid: q17_2
    options:
    - letter: A
      text: K-Nearest Neighbors
      is_correct: false
    - letter: B
      text: Support Vector Machine
      is_correct: false
    - letter: C
      text: Random Forest
      is_correct: true
    - letter: D
      text: Neural Network
      is_correct: false
    correct_fb: ✅ Correct! Random Forest is a tree-based ensemble. Trees split by
      asking "is feature X above threshold T?" — the actual scale doesn't matter,
      only the relative ordering of values. A salary of ₹50,000 vs ₹5,000 — the tree
      just checks which side of a threshold it falls on. KNN uses Euclidean distance,
      SVM uses dot products, Neural Networks use gradient descent — all affected by
      scale.
    wrong_fb: ❌ Random Forest doesn't need scaling. Tree-based models split by thresholds
      — scale is irrelevant. KNN uses Euclidean distance (scale matters massively),
      SVM uses kernel distances, Neural Networks use gradient descent (large feature
      values → exploding/vanishing gradients). Tree = no scale needed; everything
      else = scale!
  - num_str: QUESTION 3 OF 4
    question: The IQR method flags outliers as values beyond Q1 − 1.5×IQR and Q3 +
      1.5×IQR. What is IQR?
    qid: q17_3
    options:
    - letter: A
      text: max − min of the data
      is_correct: false
    - letter: B
      text: Q3 − Q1 (75th percentile minus 25th percentile)
      is_correct: true
    - letter: C
      text: The standard deviation of the data
      is_correct: false
    - letter: D
      text: The median minus the mean
      is_correct: false
    correct_fb: '✅ Correct! IQR = Interquartile Range = Q3 − Q1. It represents the
      middle 50% of the data. The "1.5×IQR fence" rule was developed by John Tukey
      — points outside this range are flagged as potential outliers. Using IQR makes
      outlier detection robust: extreme outliers don''t affect Q1, Q3, or IQR because
      those are percentile-based statistics.'
    wrong_fb: '❌ IQR = Q3 − Q1 = 75th percentile minus 25th percentile. It captures
      the middle 50% of your data. Outlier bounds: Q1 − 1.5×IQR (lower) and Q3 + 1.5×IQR
      (upper). Points outside these fences are flagged. IQR is robust — outliers don''t
      affect it, unlike range or std.'
  - num_str: QUESTION 4 OF 4
    question: "What does\n         \n          np.log1p(x)\n         \n         do\
      \ and why is it preferred over\n         \n          np.log(x)\n         \n\
      \         for feature transformation?"
    qid: q17_4
    options:
    - letter: A
      text: It adds 1 to the output of log(x)
      is_correct: false
    - letter: B
      text: It computes log(1 + x) — handles zero values safely
      is_correct: true
    - letter: C
      text: It computes the natural log on positive values only
      is_correct: false
    - letter: D
      text: It is faster than np.log() for large arrays
      is_correct: false
    correct_fb: ✅ Correct! log(0) = −∞ which breaks everything. log1p(x) = log(1+x),
      so log1p(0) = log(1) = 0. This safely handles features that include zero values
      (e.g., purchase count = 0). Also numerically more stable for very small values
      near 0. Always prefer np.log1p() over np.log() for feature transformation on
      non-negative data.
    wrong_fb: ❌ log1p(x) computes log(1+x). log(0) = −∞ which crashes everything.
      log1p(0) = log(1) = 0 — safe! This is important when your feature can have zero
      values (purchases, counts, etc). Always use np.log1p() for feature transformation
      to avoid the log(0) problem.
