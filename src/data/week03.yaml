    \ use the correlation heatmap instead</span>\n<span class=\"cm\"># k×k grid for\
    \ k features: (5 features → 25 panels, 10→100 panels)</span></code></pre>\n</div>\n\
    <div style=\"background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem\
