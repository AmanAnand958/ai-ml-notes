  - title: Encoding Impact on Logistic Regression
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Using the Titanic\
      \ dataset, train a LogisticRegression model to predict survival. Compare three\
      \ versions:\n          </p>\n<ul style=\"padding-left: 1.5rem; margin-top: 0.4rem;\
      \ margin-bottom: 1rem; list-style-type: disc;\">\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n<strong>\n             (1)\n            </strong>\n          \
      \  LabelEncoder on Sex and Embarked\n           </li>\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n<strong>\n             (2)\n            </strong>\n          \
      \  OneHotEncoder on Sex and Embarked\n           </li>\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n<strong>\n             (3)\n            </strong>\n          \
      \  No encoding (drop categorical columns). Report accuracy for each. Which encoding\
      \ gives best results? Can you explain why?\n           </li>\n</ul>"
    done_when: Three accuracy numbers printed with reasoning about which encoding
      works best for logistic regression.
    git_cmd: 'git add . &amp;&amp; git commit -m "day16: encoding impact on logistic
      regression accuracy"'
    sol_id: sol-w3d16t2
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Encoding Impact on Logistic Regression</span>

      <span class="kw">import</span> pandas <span class="kw">as</span> pd

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      <span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span>
      LabelEncoder, OneHotEncoder

      <span class="kw">from</span> sklearn.linear_model <span class="kw">import</span>
      LogisticRegression

      <span class="kw">from</span> sklearn.model_selection <span class="kw">import</span>
      cross_val_score

      url = <span class="str">"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"</span>

      df = pd.<span class="fn">read_csv</span>(url).<span class="fn">dropna</span>(subset=[<span
      class="str">"Embarked"</span>])

      X = df[[<span class="str">"Sex","Embarked","Pclass","Fare"</span>]].<span class="fn">copy</span>()

      y = df[<span class="str">"Survived"</span>]

      X_le = X.<span class="fn">copy</span>()

      X_le[<span class="str">"Sex"] = LabelEncoder().fit_transform(X_le["Sex"</span>])

      X_le[<span class="str">"Embarked"] = LabelEncoder().fit_transform(X_le["Embarked"</span>])

      ohe = <span class="fn">OneHotEncoder</span>(drop=<span class="str">"first"</span>,
      sparse_output=<span class="kw">False</span>)

      ohe_cols = ohe.<span class="fn">fit_transform</span>(X[[<span class="str">"Sex","Embarked"</span>]])

      feat_names = ohe.<span class="fn">get_feature_names_out</span>([<span class="str">"Sex","Embarked"</span>])

      X_ohe = pd.<span class="fn">concat</span>([X[[<span class="str">"Pclass","Fare"</span>]],
      pd.<span class="fn">DataFrame</span>(ohe_cols, columns=feat_names)], axis=<span
      class="num">1</span>)

      le_acc = <span class="fn">cross_val_score</span>(<span class="fn">LogisticRegression</span>(max_iter=<span
      class="num">1000</span>), X_le, y, cv=<span class="num">5</span>).<span class="fn">mean</span>()

      ohe_acc = <span class="fn">cross_val_score</span>(<span class="fn">LogisticRegression</span>(max_iter=<span
      class="num">1000</span>), X_ohe, y, cv=<span class="num">5</span>).<span class="fn">mean</span>()

      <span class="fn">print</span>(<span class="str">f"Label Encoding CV accuracy:
      {le_acc:.4f}"</span>)

      <span class="fn">print</span>(<span class="str">f"OneHot Encoding CV accuracy:
      {ohe_acc:.4f}"</span>)

      <span class="fn">print</span>(<span class="str">f"Difference: {(ohe_acc-le_acc)*100:.2f}%"</span>)'
    solution_lang: python
  - title: Full Encoding Pipeline with ColumnTransformer
    badge: 🔵 CHALLENGE
    badge_class: tb-proj
    time: 3 hours
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Use sklearn's\n\
      \           \n            ColumnTransformer\n           \n           to build\
      \ a single preprocessing pipeline that:\n          </p>\n<ul style=\"padding-left:\
      \ 1.5rem; margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;\"\
      >\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n             (1)\n     \
      \       </strong>\n            Applies OneHotEncoder to nominal columns\n  \
      \         </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n         \
      \    (2)\n            </strong>\n            Applies OrdinalEncoder to ordinal\
      \ columns\n           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n\
      \             (3)\n            </strong>\n            Applies StandardScaler\
      \ to numeric columns. Use\n            \n             Pipeline(steps=[('preprocessor',\
      \ ct), ('model', LogisticRegression())])\n            \n            . This is\
      \ the professional way to preprocess — study it carefully\n           </li>\n\
      </ul>"
    done_when: A single sklearn Pipeline object preprocesses and predicts in one call,
      with all transformations correctly applied.
    git_cmd: 'git add . &amp;&amp; git commit -m "day16: sklearn ColumnTransformer
      full preprocessing pipeline"'
    sol_id: sol-w3d16t3
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Full Encoding Pipeline with ColumnTransformer</span>

      <span class="kw">import</span> pandas <span class="kw">as</span> pd

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      <span class="kw">from</span> sklearn.pipeline <span class="kw">import</span>
      Pipeline

      <span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span>
      StandardScaler, OneHotEncoder, LabelEncoder

      <span class="kw">from</span> sklearn.impute <span class="kw">import</span> SimpleImputer

      <span class="kw">from</span> sklearn.compose <span class="kw">import</span>
      ColumnTransformer

      url = <span class="str">"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"</span>

      df = pd.<span class="fn">read_csv</span>(url).<span class="fn">head</span>(<span
      class="num">30</span>)

      num_f = [<span class="str">"Age","Fare"</span>]

      cat_f = [<span class="str">"Sex","Embarked"</span>]

      num_p = <span class="fn">Pipeline</span>([(<span class="str">"imp",SimpleImputer(strategy="median")),("scl"</span>,<span
      class="fn">StandardScaler</span>())])

      cat_p = <span class="fn">Pipeline</span>([(<span class="str">"imp",SimpleImputer(strategy="most_frequent")),("enc",OneHotEncoder(drop="first"</span>))])

      ct = <span class="fn">ColumnTransformer</span>([(<span class="str">"num",num_p,num_f),("cat"</span>,cat_p,cat_f)])

      X = ct.<span class="fn">fit_transform</span>(df[num_f+cat_f])

      <span class="fn">print</span>(<span class="str">f"Input shape: {df.shape}"</span>)

      <span class="fn">print</span>(<span class="str">f"Output shape: {X.shape}"</span>)

      <span class="fn">print</span>(<span class="str">f"\nFeature names: {ct.get_feature_names_out()}"</span>)

      <span class="fn">print</span>(<span class="str">f"\nEncoded data (first 5 rows):"</span>)

      <span class="fn">print</span>(pd.<span class="fn">DataFrame</span>(X, columns=ct.<span
      class="fn">get_feature_names_out</span>()).<span class="fn">head</span>().<span
      class="fn">round</span>(<span class="num">3</span>))'
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: 'A column "T-shirt Size" has values: Small, Medium, Large, XL. Which
      encoding is most appropriate?'
    qid: q16_1
    options:
    - letter: A
      text: One-Hot Encoding with drop_first=True
      is_correct: false
    - letter: B
      text: 'Ordinal Encoding with custom order: Small=0, Medium=1, Large=2, XL=3'
      is_correct: true
    - letter: C
      text: Target Encoding
      is_correct: false
    - letter: D
      text: No encoding needed — leave as text
      is_correct: false
    correct_fb: ✅ Correct! T-shirt size is ORDINAL — there's a clear meaningful order
      (Small &lt; Medium &lt; Large &lt; XL). Ordinal Encoding preserves this order
      with custom mapping. One-Hot would treat all sizes as equally different, losing
      the ordering information that might matter to a model predicting fit or price.
    wrong_fb: '❌ T-shirt size is ordinal — order matters (Small &lt; Medium &lt; Large
      &lt; XL). Use ordinal encoding with custom order: {Small:0, Medium:1, Large:2,
      XL:3}. One-Hot ignores the ordering. Never leave text as-is for ML models.'
  - num_str: QUESTION 2 OF 4
    question: A "State" column has 28 unique values. You plan to use it in a linear
      regression model. What's the best strategy?
    qid: q16_2
    options:
    - letter: A
      text: LabelEncoder — compact and simple
      is_correct: false
    - letter: B
      text: One-Hot Encoding — creates 28 columns
      is_correct: false
    - letter: C
      text: Target Encoding — replace each state with mean target value
      is_correct: true
    - letter: D
      text: Drop the column — too many categories
      is_correct: false
    correct_fb: '✅ Correct! 28 states → One-Hot creates 27 new columns (high dimensionality).
      LabelEncoder on nominal states is invalid for linear models (implies ordering).
      Target Encoding replaces each state with its mean target value — one compact
      column that captures the signal. Remember: compute target means on training
      data only!'
    wrong_fb: '❌ 28 states is medium-high cardinality. LabelEncoder implies false
      ordering. One-Hot creates 27 columns — acceptable but adds dimensionality. Best
      choice: Target Encoding for linear models (replace state with mean target value
      for that state, computed on train set only).'
  - num_str: QUESTION 3 OF 4
    question: What is the "dummy variable trap"?
    qid: q16_3
    options:
    - letter: A
      text: Using too few dummy variables for a column
      is_correct: false
    - letter: B
      text: Perfect multicollinearity when all one-hot columns together predict each
        other
      is_correct: true
    - letter: C
      text: Using One-Hot Encoding on ordinal data
      is_correct: false
    - letter: D
      text: When get_dummies() creates wrong column names
      is_correct: false
    correct_fb: '✅ Correct! For 3 categories (A, B, C): col_C = 1 − col_A − col_B
      always. This perfect linear relationship breaks linear regression''s matrix
      inversion (XᵀX becomes singular). Fix: always use drop_first=True — drop one
      column. The model can reconstruct its value from the remaining columns. Tree
      models are unaffected.'
    wrong_fb: '❌ The dummy variable trap: with k categories, you get k binary columns
      where the last = 1 − sum(all others). This is perfect multicollinearity — breaks
      linear models. Fix: drop_first=True to keep only k−1 columns. Tree models don''t
      have this issue.'
  - num_str: QUESTION 4 OF 4
    question: Which model type is safe to use with Label Encoding on nominal (unordered)
      categorical data?
    qid: q16_4
    options:
    - letter: A
      text: Linear Regression
      is_correct: false
    - letter: B
      text: Logistic Regression
      is_correct: false
    - letter: C
      text: Random Forest / Decision Tree
      is_correct: true
    - letter: D
      text: SVM with linear kernel
      is_correct: false
    correct_fb: ✅ Correct! Tree-based models split data by asking "is value ≤ threshold?"
      — they don't assume numerical ordering carries meaning. So Label Encoding on
      nominals (city=0,1,2) works because the tree will just split into subsets, not
      assume Mumbai=2 is "more" than Delhi=1. Linear models, however, assume that
      numerical value differences are meaningful — so they need proper One-Hot Encoding.
    wrong_fb: ❌ Random Forest / Decision Trees are safe. Tree-based models don't assume
      any ordering in encoded integers — they just split on values. Linear models
      (LR, SVM, Ridge) treat the numbers as real numerical values, so LabelEncoding
      on nominals gives them false ordering signals.
