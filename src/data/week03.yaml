    solution_code: "<span class=\"cm\"># Apply to a New Dataset - House Prices</span>\n\
      <span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span\
      \ class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"\
      kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span\
      \ class=\"kw\">try</span>:\n    url=<span class=\"str\">\"https://raw.githubusercontent.com/ageron/handson-ml2/master/datasets/housing/housing.csv\"\
      </span>\n    df=pd.<span class=\"fn\">read_csv</span>(url).<span class=\"fn\"\
      >head</span>(<span class=\"num\">200</span>)\n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Shape: {df.shape}\"</span>)\n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Columns: {list(df.columns)}\"</span>)\n    <span class=\"\
      fn\">print</span>(<span class=\"str\">f\"Missing:\\n{df.isnull().sum()[df.isnull().sum()&gt;0]}\\\
      n\"</span>)\n    df[<span class=\"str\">\"rooms_per_household\"]=df[\"total_rooms\"\
      ]/df[\"households\"</span>]\n    df[<span class=\"str\">\"bedrooms_per_room\"\
      ]=df[\"total_bedrooms\"]/df[\"total_rooms\"</span>]\n    df[<span class=\"str\"\
      >\"population_per_household\"]=df[\"population\"]/df[\"households\"</span>]\n\
      \    <span class=\"fn\">print</span>(<span class=\"str\">\"Engineered features:\"\
      </span>)\n    <span class=\"fn\">print</span>(df[[<span class=\"str\">\"rooms_per_household\"\
      ,\"bedrooms_per_room\",\"population_per_household\"</span>]].<span class=\"\
      fn\">describe</span>().<span class=\"fn\">round</span>(<span class=\"num\">3</span>))\n\
      \    df_clean=df.<span class=\"fn\">dropna</span>().<span class=\"fn\">copy</span>()\n\
      \    df_clean[<span class=\"str\">\"ocean_proximity_enc\"]=pd.factorize(df_clean[\"\
      ocean_proximity\"</span>])[<span class=\"num\">0</span>]\n    corr=df_clean[[<span\
      \ class=\"str\">\"median_house_value\",\"median_income\",\"housing_median_age\"\
      ,\"rooms_per_household\"</span>]].<span class=\"fn\">corr</span>()\n    <span\
      \ class=\"fn\">print</span>(<span class=\"str\">f\"\\nCorrelation with target:\\\
      n{corr['</span>median_house_value<span class=\"str\">'].sort_values(ascending=False)}\"\
      </span>)\n    fig,ax=plt.<span class=\"fn\">subplots</span>(figsize=(<span class=\"\
      num\">8</span>,<span class=\"num\">6</span>))\n    ax.<span class=\"fn\">scatter</span>(df_clean[<span\
      \ class=\"str\">\"median_income\"],df_clean[\"median_house_value\"</span>],alpha=<span\
      \ class=\"num\">0.5</span>,s=<span class=\"num\">10</span>)\n    ax.<span class=\"\
      fn\">set_xlabel</span>(<span class=\"str\">\"Median Income\"</span>)\n    ax.<span\
      \ class=\"fn\">set_ylabel</span>(<span class=\"str\">\"Median House Value\"\
      </span>)\n    ax.<span class=\"fn\">set_title</span>(<span class=\"str\">\"\
      House Prices\"</span>)\n    plt.<span class=\"fn\">tight_layout</span>()\n \
      \   plt.<span class=\"fn\">savefig</span>(<span class=\"str\">\"house_prices_eda.png\"\
      </span>)\n    <span class=\"fn\">print</span>(<span class=\"str\">\"Saved analysis!\"\
      </span>)\n<span class=\"kw\">except</span> Exception <span class=\"kw\">as</span>\
      \ e:\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Data load error:\
      \ {e}. Using fallback sample.\"</span>)\n    np.random.<span class=\"fn\">seed</span>(<span\
      \ class=\"num\">42</span>)\n    N=<span class=\"num\">100</span>\n    df=pd.<span\
      \ class=\"fn\">DataFrame</span>({<span class=\"str\">\"price\":np.random.normal(200000,50000,N),\"\
      sqft\"</span>:np.random.<span class=\"fn\">normal</span>(<span class=\"num\"\
      >1500</span>,<span class=\"num\">400</span>,N),\n                     <span\
      \ class=\"str\">\"bedrooms\":np.random.randint(1,5,N),\"age\"</span>:np.random.<span\
      \ class=\"fn\">randint</span>(<span class=\"num\">0</span>,<span class=\"num\"\
      >50</span>,N)})\n    <span class=\"fn\">print</span>(df.<span class=\"fn\">head</span>())\n\
      \    <span class=\"fn\">print</span>(df.<span class=\"fn\">describe</span>().<span\
      \ class=\"fn\">round</span>(<span class=\"num\">0</span>))\n    <span class=\"\
      fn\">print</span>(<span class=\"str\">f\"Price-sqft correlation: {df['</span>price<span\
      \ class=\"str\">'].corr(df['</span>sqft<span class=\"str\">']):.3f}\"</span>)"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: What is the correct order of operations in an ML preprocessing pipeline?
    qid: q21_1
    options:
    - letter: A
      text: Scale → Split → Impute → Encode → Train model
      is_correct: false
    - letter: B
      text: Split → Impute (fit on train) → Encode → Scale (fit on train) → Train
        model
      is_correct: true
    - letter: C
      text: Impute → Encode → Scale → Split → Train model
      is_correct: false
    - letter: D
      text: Split → Scale → Impute → Encode → Train model
      is_correct: false
    correct_fb: ✅ Correct! SPLIT first — then all fitting (imputer, encoder, scaler)
      happens on training data ONLY, and those fitted transformers are applied to
      test data. Fitting on the whole dataset before splitting = data leakage. The
      sklearn Pipeline + ColumnTransformer pattern enforces this automatically — it's
      the professional way to avoid this mistake.
    wrong_fb: '❌ Always SPLIT first, THEN fit transformers on training data only.
      Fitting imputers/scalers before splitting means test data statistics leak into
      training = data leakage = unrealistically good validation metrics but poor production
      performance. Correct order: split → fit on train → transform train + test.'
  - num_str: QUESTION 2 OF 4
    question: 'You build a Pipeline with steps: [(''imputer'', SimpleImputer()), (''scaler'',
      StandardScaler()), (''model'', LogisticRegression())]. What does pipeline.fit(X_train,
      y_train) do internally?'
    qid: q21_2
    options:
    - letter: A
      text: Only fits the LogisticRegression model
      is_correct: false
    - letter: B
      text: Fits imputer on X_train, transforms X_train, fits scaler on result, transforms,
        then fits model
      is_correct: true
    - letter: C
      text: Runs all steps on X_test first to validate
      is_correct: false
    - letter: D
      text: Only stores the steps without fitting anything
      is_correct: false
    correct_fb: '✅ Correct! sklearn Pipeline chains transformers sequentially. During
      fit(): each transformer''s fit_transform() is called in sequence, feeding the
      output of each step as input to the next. Only the final step gets just fit()
      (not fit_transform()). During predict(): each transformer''s transform() is
      called (NO fitting) in sequence. This is the safest, cleanest way to build ML
      pipelines.'
    wrong_fb: '❌ Pipeline.fit(X_train, y_train) runs: imputer.fit_transform(X_train)
      → scaler.fit_transform(result) → model.fit(final_result, y_train). Each step
      is fit and applied in sequence. Pipeline.predict(X_test) runs: imputer.transform(X_test)
      → scaler.transform(result) → model.predict(final_result). No re-fitting on test
      data.'
  - num_str: QUESTION 3 OF 4
    question: Which sklearn class applies DIFFERENT transformations to DIFFERENT columns
      (e.g., OneHotEncoder to categorical, StandardScaler to numeric)?
    qid: q21_3
    options:
    - letter: A
      text: Pipeline
      is_correct: false
    - letter: B
      text: ColumnTransformer
      is_correct: true
    - letter: C
      text: FeatureUnion
      is_correct: false
    - letter: D
      text: SimpleImputer with strategy='all'
      is_correct: false
    correct_fb: ✅ Correct! ColumnTransformer is the key class for applying different
      preprocessors to different column groups. You specify tuples of (name, transformer,
      columns). It processes each group in parallel and concatenates the results.
      Wrap ColumnTransformer inside a Pipeline as the 'preprocessor' step — this is
      the sklearn best practice for real-world ML projects.
    wrong_fb: '❌ ColumnTransformer! It lets you define different transformations for
      different column subsets: {''numeric'': StandardScaler, ''categorical'': OneHotEncoder,
      ''binary'': passthrough}. Pipeline applies transforms SEQUENTIALLY to ALL features.
      ColumnTransformer applies transforms IN PARALLEL to SUBSETS of features, then
      concatenates the outputs.'
  - num_str: QUESTION 4 OF 4
    question: After completing Week 3's preprocessing pipeline, what is the first
      model you should try as your baseline?
    qid: q21_4
    options:
    - letter: A
      text: A deep neural network — most powerful
      is_correct: false
    - letter: B
      text: XGBoost — state of the art
      is_correct: false
    - letter: C
      text: Logistic Regression — simple, fast, interpretable baseline
      is_correct: true
    - letter: D
      text: Random Forest with 1000 trees
      is_correct: false
    correct_fb: ✅ Correct! Always start with the simplest model (Logistic Regression
      for classification, Linear Regression for regression). It trains in seconds,
      is fully interpretable (check coefficients to understand which features matter),
      and sets a performance baseline. If a complex model doesn't beat this baseline
      by a meaningful margin, it's not worth the added complexity. "Start simple,
      add complexity only when needed" is a core ML engineering principle.
    wrong_fb: ❌ Start with Logistic Regression (classification) or Linear Regression
      (regression). Simple models are fast, interpretable, and give you a baseline
      to beat. If your fancy neural network only beats logistic regression by 0.5%
      accuracy, the simpler model wins (less latency, easier to debug, more interpretable).
      Start simple — add complexity only when the baseline isn't good enough.
  flashcards:
  - front: MCAR vs MAR vs MNAR?
    back: "MCAR: completely random.\n          <br/>\n          MAR: related to observed\
      \ data.\n          <br/>\n          MNAR: related to missing value itself."
  - front: StandardScaler formula?
    back: "z = (x - mean) / std\n          <br/>\n          Creates mean=0, variance=1."
  - front: RobustScaler advantage?
    back: "Uses median and IQR (interquartile range)\n          <br/>\n          Not\
      \ influenced by extreme outliers."
  - front: One-Hot Encoding dummy trap?
    back: "Multicollinearity from dummy columns.\n          <br/>\n          Fixed\
      \ by dropping first column."
  - front: What is data leakage?
    back: "Information from test/validation set\n          <br/>\n          leaking\
      \ into training process."
  - front: Neural architecture relying entirely on multi-head self-attention and positional
      encodings, eliminating sequential recurrence.
    back: "Pipeline: sequential transformations.\n          <br/>\n          ColumnTransformer:\
      \ parallel, column-specific."
  gotcha:
    title: '⚠️ Gotcha: NumPy In-Place vs Copy Operations'
    description: NumPy slicing returns a view, not a copy. Modifying a slice directly
      mutates the original array.
  takeaways:
    hinglish_line: Production mein Full Preprocessing + Visualization Pipeline ko
      use karte waqt edge cases aur mathematical constraints ko pehle validate karo,
      taaki downstream deployment bilkul rock-solid rahe!
    bullets:
    - "<strong>\n          Missing Data:\n         </strong>\n         MCAR/MAR/MNAR\
      \ types. Drop if &gt;70% missing. Fit imputer on train, transform test. KNNImputer\
      \ &gt; mean for correlated data."
    - "<strong>\n          Encoding:\n         </strong>\n         Nominal → One-Hot\
      \ (drop_first=True). Ordinal → custom map. High cardinality → Target Encoding.\
      \ Trees = Label OK; Linear = One-Hot required."
    - "<strong>\n          Scaling:\n         </strong>\n         Distance-based/gradient\
      \ models need it; trees don't. Outliers → RobustScaler. Normal data → StandardScaler.\
      \ Bounded → MinMaxScaler."
    - "<strong>\n          Matplotlib:\n         </strong>\n         fig, ax = plt.subplots().\
      \ ax-level API for multi-plot. Always tight_layout() + savefig() for reports."
    - "<strong>\n          Seaborn:\n         </strong>\n         histplot (dist),\
      \ boxplot/violinplot (spread), heatmap (correlation), pairplot (all relationships).\
      \ hue= splits by category."
    - "<strong>\n          Feature Engineering:\n         </strong>\n         New\
      \ features from domain knowledge. Bin continuous, combine columns, extract datetime\
      \ parts. Always on train only."
    - "<strong>\n          Pipeline:\n         </strong>\n         sklearn Pipeline\
      \ wraps impute → encode → scale → model. ColumnTransformer applies different\
      \ transforms to different column groups. No leakage possible."
