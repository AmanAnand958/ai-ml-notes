  theory_html: "<h3 class=\"sh3\">\n       1. Why Missing Data Matters\n      </h3>\n\
    \n<p>\n       Almost every real dataset has missing values — whether it's a Kaggle\
    \ competition or a company's production database.\n      </p>\n<p>\n       The\
    \ key insight:\n       <strong>\n        how you handle missing data\n       </strong>\n\
    \       is often more important than which model you pick.\n      </p>\n<div class=\"\
    ml-connect\">\n       Sklearn's estimators (LinearRegression, RandomForest, etc.)\
    \ cannot handle NaN values by default — they will throw a ValueError.\n      \
    \ <br/>\n<br/>\n       You MUST handle missing values in the preprocessing pipeline\
    \ before fitting any model.\n       <br/>\n<br/>\n       This is step 1 in every\
    \ ML project.\n      </div>\n<h3 class=\"sh3\">\n       2. Three Types of Missing\
    \ Data\n      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin:\
    \ 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n     \
    \    Type\n        </th>\n<th>\n         Full Name\n        </th>\n<th>\n    \
    \     Meaning\n        </th>\n<th>\n         Example\n        </th>\n<th>\n  \
    \       Best Strategy\n        </th>\n</tr>\n<tr>\n<td>\n<strong style=\"color:var(--green)\"\
    >\n          MCAR\n         </strong>\n</td>\n<td>\n         Missing Completely\
    \ At Random\n        </td>\n<td>\n         Missing-ness has nothing to do with\
    \ the data itself\n        </td>\n<td>\n         Sensor malfunction randomly dropped\
    \ readings\n        </td>\n<td>\n         Safe to drop rows or impute with mean/median\n\
    \        </td>\n</tr>\n<tr>\n<td>\n<strong style=\"color:var(--orange)\">\n  \
    \        MAR\n         </strong>\n</td>\n<td>\n         Missing At Random\n  \
    \      </td>\n<td>\n         Missing-ness depends on OTHER observed variables\n\
    \        </td>\n<td>\n         Older patients less likely to fill income field\n\
    \        </td>\n<td>\n         Impute using other features (KNN, regression)\n\
    \        </td>\n</tr>\n<tr>\n<td>\n<strong style=\"color:var(--pink)\">\n    \
    \      MNAR\n         </strong>\n</td>\n<td>\n         Missing Not At Random\n\
    \        </td>\n<td>\n         Missing-ness depends on the missing value itself\n\
    \        </td>\n<td>\n         High earners don't report salary\n        </td>\n\
    <td>\n         Very hard — domain expertise required; create \"missing\" indicator\
    \ feature\n        </td>\n</tr>\n</table></div>\n<h3 class=\"sh3\">\n       3.\
    \ Detecting Missingness\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       Before cleaning datasets, we\
    \ must locate and count null records across columns to choose the best imputation\
    \ strategies.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n         python — detect_missing.py\n        </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"run-btn\" onclick=\"openRepl()\">\n    \
    \      ▶ try online\n         </button>\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> pandas\
    \ <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span\
    \ class=\"kw\">as</span> np\n\ndf = pd.<span class=\"fn\">read_csv</span>(<span\
    \ class=\"str\">\"titanic.csv\"</span>)\n\n<span class=\"cm\"># --- Count missing\
    \ per column ---</span>\nmissing_count = df.<span class=\"fn\">isnull</span>().<span\
    \ class=\"fn\">sum</span>()\nmissing_pct = (df.<span class=\"fn\">isnull</span>().<span\
    \ class=\"fn\">sum</span>() / <span class=\"fn\">len</span>(df)) * <span class=\"\
    num\">100</span>\n\nmissing_report = pd.<span class=\"fn\">DataFrame</span>({\n\
    \    <span class=\"str\">'Missing Count'</span>: missing_count,\n    <span class=\"\
    str\">'Missing %'</span>: missing_pct.<span class=\"fn\">round</span>(<span class=\"\
    num\">2</span>)\n}).<span class=\"fn\">sort_values</span>(<span class=\"str\"\
    >'Missing %'</span>, ascending=<span class=\"kw\">False</span>)\n\n<span class=\"\
    fn\">print</span>(missing_report[missing_report[<span class=\"str\">'Missing Count'</span>]\
    \ &gt; <span class=\"num\">0</span>])\n<span class=\"cm\"># Age      177   19.87%\
    \  ← MAR (older passengers less likely to report)</span>\n<span class=\"cm\">#\
    \ Cabin    687   77.10%  ← MNAR (1st class more likely to have cabin records)</span>\n\
    <span class=\"cm\"># Embarked   2    0.22%  ← MCAR (random admin error)</span>\n\
    \n<span class=\"cm\"># --- Heatmap to visualise missing pattern ---</span>\n<span\
    \ class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\
    <span class=\"kw\">import</span> seaborn <span class=\"kw\">as</span> sns\n\n\
    plt.<span class=\"fn\">figure</span>(figsize=(<span class=\"num\">10</span>,<span\
    \ class=\"num\">4</span>))\nsns.<span class=\"fn\">heatmap</span>(df.<span class=\"\
    fn\">isnull</span>(), cbar=<span class=\"kw\">False</span>, yticklabels=<span\
    \ class=\"kw\">False</span>, cmap=<span class=\"str\">'viridis'</span>)\nplt.<span\
    \ class=\"fn\">title</span>(<span class=\"str\">\"Missing Data Heatmap (yellow\
    \ = missing)\"</span>)\nplt.<span class=\"fn\">tight_layout</span>()\nplt.<span\
    \ class=\"fn\">savefig</span>(<span class=\"str\">\"missing_heatmap.png\"</span>)</pre>\n\
    </div>\n<div style=\"background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem\
    \ 0;\">\n<strong style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\"\
    >\n        \U0001F4CA Visualizing Missingness Patterns (MCAR vs MAR vs MNAR)\n\
    \       </strong>\n<canvas height=\"240\" id=\"canvas-missingness15\" style=\"\
    width:100%;max-max-width: 100%; width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0\
    \ auto;\" width=\"560\">\n</canvas>\n<script>\n        (function(){\n  var c=document.getElementById('canvas-missingness15');if(!c)return;\n\
    \  var ctx=c.getContext('2d');var W=c.width,H=c.height;\n  ctx.fillStyle='#1a1d27';ctx.fillRect(0,0,W,H);\n\
    \  \n  var types = ['MCAR (Random)', 'MAR (Conditional)', 'MNAR (Self-related)'];\n\
    \  var gx = [25, 205, 385];\n  var gy = 55;\n  var gw = 150;\n  var gh = 130;\n\
    \  var cols = 5;\n  var rows = 12;\n  var cw = gw / cols;\n  var ch = gh / rows;\n\
    \  \n  for (var t = 0; t < 3; t++) {\n    ctx.fillStyle = '#2d3142';\n    ctx.fillRect(gx[t],\
    \ gy, gw, gh);\n    \n    ctx.strokeStyle = '#3e445b';\n    ctx.lineWidth = 1;\n\
    \    for (var i = 0; i <= cols; i++) {\n      ctx.beginPath();\n      ctx.moveTo(gx[t]\
    \ + i * cw, gy);\n      ctx.lineTo(gx[t] + i * cw, gy + gh);\n      ctx.stroke();\n\
    \    }\n    for (var j = 0; j <= rows; j++) {\n      ctx.beginPath();\n      ctx.moveTo(gx[t],\
    \ gy + j * ch);\n      ctx.lineTo(gx[t] + gw, gy + j * ch);\n      ctx.stroke();\n\
    \    }\n    \n    ctx.fillStyle = '#ffd166';\n    \n    if (t === 0) {\n     \
    \ var missing = [[1, 2], [3, 4], [5, 1], [7, 3], [10, 0], [2, 4], [8, 2]];\n \
    \     missing.forEach(function(pt) {\n        ctx.fillRect(gx[t] + pt[1]*cw +\
    \ 1, gy + pt[0]*ch + 1, cw - 2, ch - 2);\n      });\n    } else if (t === 1) {\n\
    \      var missing = [[0, 3], [1, 3], [2, 3], [3, 3], [10, 2], [11, 2], [4, 3],\
    \ [5, 3], [0, 4], [1, 4]];\n      missing.forEach(function(pt) {\n        ctx.fillRect(gx[t]\
    \ + pt[1]*cw + 1, gy + pt[0]*ch + 1, cw - 2, ch - 2);\n      });\n    } else {\n\
    \      var missing = [[8, 4], [9, 4], [10, 4], [11, 4], [7, 4], [6, 4]];\n   \
    \   missing.forEach(function(pt) {\n        ctx.fillRect(gx[t] + pt[1]*cw + 1,\
    \ gy + pt[0]*ch + 1, cw - 2, ch - 2);\n      });\n    }\n    \n    ctx.fillStyle\
    \ = '#ffffff';\n    ctx.font = 'bold 12px sans-serif';\n    ctx.textAlign = 'center';\n\
    \    ctx.fillText(types[t], gx[t] + gw/2, gy - 12);\n    \n    ctx.fillStyle =\
    \ '#8f9cae';\n    ctx.font = '9px monospace';\n    for (var c_idx = 0; c_idx <\
    \ cols; c_idx++) {\n      ctx.fillText('C' + (c_idx+1), gx[t] + c_idx*cw + cw/2,\
    \ gy + gh + 12);\n    }\n  }\n  \n  ctx.fillStyle = '#ffd166';\n  ctx.fillRect(150,\
    \ H - 25, 12, 12);\n  ctx.fillStyle = '#2d3142';\n  ctx.fillRect(300, H - 25,\
    \ 12, 12);\n  ctx.strokeStyle = '#3e445b';\n  ctx.strokeRect(300, H - 25, 12,\
    \ 12);\n  \n  ctx.fillStyle = '#ffffff';\n  ctx.font = '11px sans-serif';\n  ctx.textAlign\
    \ = 'left';\n  ctx.fillText('Missing Value (NaN)', 170, H - 16);\n  ctx.fillText('Observed\
    \ Value', 320, H - 16);\n})();\n       </script>\n</div>\n<h3 class=\"sh3\">\n\
    \       4. Imputation Strategies\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       Imputation handles missing records\
    \ by filling them with central statistics like mean, median, mode, or using predictive\
    \ ML models.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         python — imputation_strategies.py\n        </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">from</span> sklearn.impute <span class=\"kw\">import</span>\
    \ SimpleImputer, KNNImputer\n<span class=\"kw\">import</span> pandas <span class=\"\
    kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
    \ np\n\ndf = pd.<span class=\"fn\">DataFrame</span>({\n    <span class=\"str\"\
    >'age'</span>: [<span class=\"num\">25</span>, np.nan, <span class=\"num\">30</span>,\
    \ np.nan, <span class=\"num\">35</span>],\n    <span class=\"str\">'salary'</span>:\
    \ [<span class=\"num\">50000</span>, <span class=\"num\">60000</span>, np.nan,\
    \ <span class=\"num\">55000</span>, <span class=\"num\">70000</span>],\n    <span\
    \ class=\"str\">'gender'</span>: [<span class=\"str\">'M'</span>, <span class=\"\
    str\">'F'</span>, np.nan, <span class=\"str\">'M'</span>, <span class=\"str\"\
    >'F'</span>]\n})\n\n<span class=\"cm\"># --- Strategy 1: SimpleImputer (numeric)\
    \ ---</span>\nnum_imputer = <span class=\"fn\">SimpleImputer</span>(strategy=<span\
    \ class=\"str\">'median'</span>)  <span class=\"cm\"># or 'mean', 'most_frequent'</span>\n\
    df[<span class=\"str\">'age'</span>] = num_imputer.<span class=\"fn\">fit_transform</span>(df[[<span\
    \ class=\"str\">'age'</span>]])\ndf[<span class=\"str\">'salary'</span>] = num_imputer.<span\
    \ class=\"fn\">fit_transform</span>(df[[<span class=\"str\">'salary'</span>]])\n\
    \n<span class=\"cm\"># --- Strategy 2: SimpleImputer (categorical) ---</span>\n\
    cat_imputer = <span class=\"fn\">SimpleImputer</span>(strategy=<span class=\"\
    str\">'most_frequent'</span>)\ndf[<span class=\"str\">'gender'</span>] = cat_imputer.<span\
    \ class=\"fn\">fit_transform</span>(df[[<span class=\"str\">'gender'</span>]]).<span\
    \ class=\"fn\">ravel</span>()\n\n<span class=\"cm\"># --- Strategy 3: KNNImputer\
    \ (uses similar rows to fill) ---</span>\ndf_num = pd.<span class=\"fn\">DataFrame</span>({\n\
    \    <span class=\"str\">'age'</span>: [<span class=\"num\">25</span>, np.nan,\
    \ <span class=\"num\">30</span>, np.nan, <span class=\"num\">35</span>],\n   \
    \ <span class=\"str\">'salary'</span>: [<span class=\"num\">50000</span>, <span\
    \ class=\"num\">60000</span>, <span class=\"num\">65000</span>, <span class=\"\
    num\">55000</span>, <span class=\"num\">70000</span>]\n})\nknn_imputer = <span\
    \ class=\"fn\">KNNImputer</span>(n_neighbors=<span class=\"num\">2</span>)\ndf_filled\
    \ = pd.<span class=\"fn\">DataFrame</span>(\n    knn_imputer.<span class=\"fn\"\
    >fit_transform</span>(df_num),\n    columns=df_num.columns\n)\n<span class=\"\
    fn\">print</span>(df_filled)\n<span class=\"cm\"># KNN looks at the 2 most similar\
    \ rows (by salary) and averages their age</span>\n<span class=\"cm\"># Much smarter\
    \ than a global mean — uses local patterns</span></pre>\n</div>\n<div style=\"\
    background:var(--bg2);border:1px solid rgba(108,140,255,0.2);border-radius:var(--radius);padding:1rem;margin:1rem\
    \ 0;\">\n<strong style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\"\
    >\n        \U0001F4CA Visualizing KNN Imputation (k=2) — Find 2 nearest neighbors,\
    \ average their Age\n        <span style=\"font-size: 12px;color:var(--muted);font-family:var(--font-mono);\"\
    >\n         (hover to explore)\n        </span>\n</strong>\n<canvas height=\"\
    280\" id=\"canvas-knnimputer15\" style=\"width:100%;max-max-width: 100%; width:\
    \ 100%;background:#0f1219;border-radius:8px;display:block;margin:0 auto;\" width=\"\
    640\">\n</canvas>\n<script>\n        (function(){\n  var c=document.getElementById('canvas-knnimputer15');if(!c)return;\n\
    \  var ctx=c.getContext('2d');var W=c.width,H=c.height;\n\n  var pad={l:62,r:22,t:42,b:56};\n\
    \  var pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;\n  var salMin=44000,salMax=86000,ageMin=20,ageMax=44;\n\
    \n  function sx(sal){return pad.l+(sal-salMin)/(salMax-salMin)*pw;}\n  function\
    \ sy(age){return pad.t+ph-(age-ageMin)/(ageMax-ageMin)*ph;}\n\n  // Only 4 points\
    \ — spread far apart so no label collisions\n  // Non-neighbors pushed to right\
    \ side (far from target at 60k)\n  var pts=[\n    {sal:50000,age:25, nb:true,\
    \  anchor:'bl', txt:'Row 1  Age=25yr ₹50k'},\n    {sal:65000,age:30, nb:true,\
    \  anchor:'br', txt:'Row 3  Age=30yr ₹65k'},\n    {sal:76000,age:35, nb:false,\
    \ anchor:'tr', txt:'Row 5'},\n    {sal:82000,age:40, nb:false, anchor:'tr', txt:'Row\
    \ 7'},\n  ];\n  var target={sal:60000, imputedAge:27.5};\n\n  function draw(){\n\
    \    ctx.clearRect(0,0,W,H);\n    var bg=ctx.createLinearGradient(0,0,0,H);\n\
    \    bg.addColorStop(0,'#0f1219');bg.addColorStop(1,'#141820');\n    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);\n\
    \n    // grid\n    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;\n\
    \    for(var s=50000;s<=80000;s+=10000){\n      ctx.beginPath();ctx.moveTo(sx(s),pad.t);ctx.lineTo(sx(s),pad.t+ph);ctx.stroke();\n\
    \      ctx.fillStyle='rgba(255,255,255,0.28)';ctx.font='9px monospace';ctx.textAlign='center';\n\
    \      ctx.fillText('₹'+(s/1000)+'k',sx(s),pad.t+ph+14);\n    }\n    for(var a=25;a<=40;a+=5){\n\
    \      ctx.beginPath();ctx.moveTo(pad.l,sy(a));ctx.lineTo(pad.l+pw,sy(a));ctx.stroke();\n\
    \      ctx.fillStyle='rgba(255,255,255,0.28)';ctx.font='9px monospace';ctx.textAlign='right';\n\
    \      ctx.fillText(a,pad.l-6,sy(a)+3);\n    }\n\n    // dashed lines to neighbors\n\
    \    pts.filter(function(p){return p.nb;}).forEach(function(p){\n      ctx.strokeStyle='rgba(108,140,255,0.55)';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);\n\
    \      ctx.beginPath();\n      ctx.moveTo(sx(target.sal),sy(target.imputedAge));\n\
    \      ctx.lineTo(sx(p.sal),sy(p.age));\n      ctx.stroke();ctx.setLineDash([]);\n\
    \      var lx2=sx(target.sal)*0.67+sx(p.sal)*0.33;\n      var ly2=sy(target.imputedAge)*0.67+sy(p.age)*0.33;\n\
    \      var dist=Math.abs(p.sal-target.sal)/1000;\n      ctx.fillStyle='rgba(108,140,255,0.9)';ctx.font='bold\
    \ 9px monospace';ctx.textAlign='center';\n      ctx.fillText('Δ₹'+dist+'k',lx2,ly2-8);\n\
    \    });\n\n    // non-neighbor points (dimmed, far right)\n    pts.filter(function(p){return\
