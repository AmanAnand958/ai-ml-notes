    solution_title: 📓 Complete Colab Code
    solution_code: |-
      # Styled Publication-Quality Scatter
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"
      df = pd.read_csv(url).dropna(subset=["Age","Fare"])
      fig,ax = plt.subplots(figsize=(10,7))
      sc = ax.scatter(df["Age"], df["Fare"], c=df["Survived"], cmap="coolwarm",
                      s=30, alpha=0.6, edgecolors="black", linewidth=0.5)
      ax.set_xlabel("Age (years)", fontsize=12, fontweight="bold")
      ax.set_ylabel("Fare ($)", fontsize=12, fontweight="bold")
      ax.set_title("Titanic: Age vs Fare (colored by Survival)", fontsize=14, fontweight="bold")
      ax.grid(True, alpha=0.3)
      cbar = plt.colorbar(sc, ax=ax)
      cbar.set_label("Survived", fontsize=10)
      ax.text(0.98,0.98,"n="+str(len(df)),transform=ax.transAxes,ha="right",va="top",fontsize=10)
      plt.tight_layout()
      plt.savefig("publication_scatter.png", dpi=150)
      print("Publication-quality scatter saved!")
      assert cbar is not None, "cbar should not be None"
