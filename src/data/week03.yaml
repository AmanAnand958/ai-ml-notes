    sol_id: sol-w3d20t1
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Engineer 5 New Titanic Features</span>

      <span class="kw">import</span> pandas <span class="kw">as</span> pd

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      url = <span class="str">"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"</span>

      df = pd.<span class="fn">read_csv</span>(url)

      df[<span class="str">"FamilySize"] = df["SibSp"] + df["Parch"</span>] + <span
      class="num">1</span>

      df[<span class="str">"IsAlone"] = (df["FamilySize"</span>] == <span class="num">1</span>).<span
      class="fn">astype</span>(int)

      df[<span class="str">"Title"] = df["Name"].str.extract(r", (\w+)\."</span>)

      rare = [<span class="str">"Lady","Countess","Capt","Col","Don","Dr","Major","Rev","Sir","Jonkheer","Dona"</span>]

      df[<span class="str">"Title"] = df["Title"].replace(rare, "Rare"</span>)

      df[<span class="str">"Title"] = df["Title"].replace(["Mlle","Ms"],"Miss").replace("Mme","Mrs"</span>)

      df[<span class="str">"FareBin"] = pd.qcut(df["Fare"], 4, labels=["Low","Med","High","VHigh"],
      duplicates="drop"</span>)

      df[<span class="str">"AgeBin"] = pd.cut(df["Age"], bins=[0,12,18,35,60,100],
      labels=["Child","Teen","Adult","Middle","Senior"</span>])

      <span class="fn">print</span>(<span class="str">f"1. FamilySize: range {df[''</span>FamilySize<span
      class="str">''].min()}-{df[''</span>FamilySize<span class="str">''].max()}"</span>)

      <span class="fn">print</span>(<span class="str">f"2. IsAlone: {dict(df[''</span>IsAlone<span
      class="str">''].value_counts())}"</span>)

      <span class="fn">print</span>(<span class="str">f"3. Title: {list(df[''</span>Title<span
      class="str">''].dropna().unique())}"</span>)

      <span class="fn">print</span>(<span class="str">f"4. FareBin: {list(df[''</span>FareBin<span
      class="str">''].dropna().unique())}"</span>)

      <span class="fn">print</span>(<span class="str">f"5. AgeBin: {list(df[''</span>AgeBin<span
      class="str">''].dropna().unique())}"</span>)'
