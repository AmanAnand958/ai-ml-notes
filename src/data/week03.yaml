    \ class=\"str\">'white'</span>, lw=<span class=\"num\">2</span>, label=<span class=\"\
    str\">'Trend'</span>)\n\n<span class=\"cm\"># ── Annotate the top earner ──</span>\n\
    idx = np.<span class=\"fn\">argmax</span>(salary)\nplt.<span class=\"fn\">annotate</span>(\n\
