    solution_code: '# Feature Engineering Impact on Accuracy

      import pandas as pd

      import numpy as np

      from sklearn.ensemble import RandomForestClassifier

      from sklearn.model_selection import cross_val_score

      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"

      df = pd.read_csv(url).drop(["Cabin","Name","Ticket","PassengerId"],axis=1).dropna()

      y = df["Survived"]

      basic_f = ["Pclass","Sex","Age","Fare","SibSp","Parch","Embarked"]

      basic = pd.get_dummies(df[basic_f], drop_first=True)

      basic_acc = cross_val_score(RandomForestClassifier(n_estimators=50,random_state=42),
      basic, y, cv=5).mean()

      df["FamilySize"] = df["SibSp"]+df["Parch"]+1

      df["IsAlone"] = (df["FamilySize"]==1).astype(int)

      df["Title"] = df["Name"].str.extract(r", (\w+)\.")

      eng_f = basic_f + ["FamilySize","IsAlone","Title"]

      eng = pd.get_dummies(df[eng_f], drop_first=True)

      eng_acc = cross_val_score(RandomForestClassifier(n_estimators=50,random_state=42),
      eng, y, cv=5).mean()

      print(f"Basic features accuracy: {basic_acc:.4f}")

      print(f"With engineered features: {eng_acc:.4f}")

      print(f"Improvement: {(eng_acc-basic_acc)*100:.2f}%")'
