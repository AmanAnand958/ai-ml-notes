      is_correct: false
      id: c
    - letter: D
      text: 4 subplots inside a 2×3 space
      is_correct: false
      id: d
    correct_fb: ✅ Correct! plt.subplot(rows, cols, index). rows=2, cols=3 → 6 panels total. Index 1,2,3 = row 1; Index 4,5,6
      = row 2. So index 4 = second row, first column. Indices go left-to-right, then top-to-bottom, starting at 1.
    wrong_fb: ❌ plt.subplot(rows, cols, index). 2 rows × 3 cols = 6 panels. Panel 4 = row 2, col 1 (panels numbered left→right
      then top→bottom starting at 1). Panel 1 = top-left, panel 6 = bottom-right.
    correct: b
  - num_str: QUESTION 3 OF 4
    question: What are the dots plotted BEYOND the whiskers in a box plot?
    qid: q18_3
    options:
    - letter: A
      text: The mean and standard deviation markers
      is_correct: false
      id: a
    - letter: B
      text: The 5th and 95th percentile values
      is_correct: false
      id: b
    - letter: C
      text: Outliers — values beyond Q1−1.5×IQR or Q3+1.5×IQR
      is_correct: true
      id: c
    - letter: D
      text: Data entry errors that should be deleted
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Whiskers extend to Q1−1.5×IQR (lower) and Q3+1.5×IQR (upper). Points beyond these are plotted individually
      as dots — these are outliers by Tukey's fence definition. They're not necessarily errors — they could be real extreme
      values. The box contains the middle 50% of data (Q1 to Q3).
    wrong_fb: ❌ Dots outside whiskers = outliers (Q1−1.5×IQR to Q3+1.5×IQR bounds). They're not errors — just extreme values.
