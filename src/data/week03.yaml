  - title: Compare Imputation Strategies
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Load the Titanic\
      \ dataset. Artificially introduce 20% random missing values into the \"Age\"\
      \ column. Then impute using:\n          </p>\n<ul style=\"padding-left: 1.5rem;\
      \ margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;\">\n<li style=\"\
      margin-bottom: 0.4rem;\">\n<strong>\n             (1)\n            </strong>\n\
      \            Mean\n           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n\
      <strong>\n             (2)\n            </strong>\n            Median\n    \
      \       </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n           \
      \  (3)\n            </strong>\n            KNNImputer (k=5). For each strategy,\
      \ compute RMSE against the original Age values. Plot a bar chart comparing RMSE.\
      \ Which strategy is most accurate on this dataset?\n           </li>\n</ul>"
    done_when: You have a bar chart comparing 3 imputation strategies by RMSE and
      can explain which wins and why.
    git_cmd: 'git add . &amp;&amp; git commit -m "day15: compare imputation strategies
      with RMSE"'
    sol_id: sol-w3d15t2
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Compare Imputation Strategies</span>

      <span class="kw">import</span> pandas <span class="kw">as</span> pd

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      <span class="kw">from</span> sklearn.impute <span class="kw">import</span> KNNImputer

      <span class="kw">from</span> sklearn.metrics <span class="kw">import</span>
      mean_squared_error

      url = <span class="str">"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"</span>

      df = pd.<span class="fn">read_csv</span>(url)

      np.random.<span class="fn">seed</span>(<span class="num">42</span>)

      true_ages = df[<span class="str">"Age"</span>].<span class="fn">dropna</span>().values

      mask = np.random.<span class="fn">rand</span>(<span class="fn">len</span>(true_ages))
      &lt; <span class="num">0.2</span>

      corrupted = true_ages.<span class="fn">copy</span>()

      corrupted[mask] = np.nan

      rmse_mean = np.<span class="fn">sqrt</span>(<span class="fn">mean_squared_error</span>(true_ages[~mask],
      [np.<span class="fn">nanmean</span>(corrupted)]*<span class="fn">sum</span>(~mask)))

      rmse_median = np.<span class="fn">sqrt</span>(<span class="fn">mean_squared_error</span>(true_ages[~mask],
      [np.<span class="fn">nanmedian</span>(corrupted)]*<span class="fn">sum</span>(~mask)))

      knn = <span class="fn">KNNImputer</span>(n_neighbors=<span class="num">5</span>)

      knn_imputed = knn.<span class="fn">fit_transform</span>(corrupted.<span class="fn">reshape</span>(-<span
      class="num">1</span>,<span class="num">1</span>)).<span class="fn">ravel</span>()

      rmse_knn = np.<span class="fn">sqrt</span>(<span class="fn">mean_squared_error</span>(true_ages[~mask],
      knn_imputed[~mask]))

      <span class="fn">print</span>(<span class="str">f"RMSE Mean:   {rmse_mean:.3f}"</span>)

      <span class="fn">print</span>(<span class="str">f"RMSE Median: {rmse_median:.3f}"</span>)

      <span class="fn">print</span>(<span class="str">f"RMSE KNN:    {rmse_knn:.3f}"</span>)

      best = <span class="str">"KNN" if rmse_knn&lt;min(rmse_mean,rmse_median) else
      ("Mean" if rmse_mean&lt;rmse_median else "Median"</span>)

      <span class="fn">print</span>(<span class="str">f"Best: {best}"</span>)'
    solution_lang: python
