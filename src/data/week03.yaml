    git_cmd: 'git add . &amp;&amp; git commit -m "day15: MNAR indicator feature +
      logistic regression pipeline"'
    sol_id: sol-w3d15t3
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Full Pipeline with MNAR Indicator</span>

      <span class="kw">import</span> pandas <span class="kw">as</span> pd

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      <span class="kw">from</span> sklearn.pipeline <span class="kw">import</span>
      Pipeline

      <span class="kw">from</span> sklearn.impute <span class="kw">import</span> SimpleImputer

      <span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span>
      StandardScaler, OneHotEncoder

      <span class="kw">from</span> sklearn.compose <span class="kw">import</span>
      ColumnTransformer

      url = <span class="str">"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"</span>

      df = pd.<span class="fn">read_csv</span>(url).<span class="fn">head</span>(<span
      class="num">20</span>)

      mnar = df[<span class="str">"Cabin"].isna().astype(int).rename("Cabin_Missing"</span>)

      df = pd.<span class="fn">concat</span>([df, mnar], axis=<span class="num">1</span>)

      num_f = [<span class="str">"Age","Fare","Cabin_Missing"</span>]

      cat_f = [<span class="str">"Sex","Embarked"</span>]

      num_p = <span class="fn">Pipeline</span>([(<span class="str">"i",SimpleImputer(strategy="median")),("s"</span>,<span
      class="fn">StandardScaler</span>())])

      cat_p = <span class="fn">Pipeline</span>([(<span class="str">"i",SimpleImputer(strategy="most_frequent")),("e",OneHotEncoder(drop="first"</span>))])

      ct = <span class="fn">ColumnTransformer</span>([(<span class="str">"n",num_p,num_f),("c"</span>,cat_p,cat_f)])

      X = ct.<span class="fn">fit_transform</span>(df[num_f+cat_f])

      <span class="fn">print</span>(<span class="str">f"Input cols: {len(num_f+cat_f)},
      Output dims: {X.shape}"</span>)

      <span class="fn">print</span>(<span class="str">f"MNAR (Cabin missing) created
      and included as a feature!"</span>)'
    solution_lang: python
