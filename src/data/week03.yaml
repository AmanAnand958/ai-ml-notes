  analogy: 'Think of it like this: Cricket batting positions (Opener=1, Middle=2, Finisher=3) ka encoding theek hai kyunki
    order matter karta hai. Lekin agar cities ko encode karein (Delhi=1, Mumbai=2, Chennai=3), model sochega Mumbai aur Delhi
    ke beech ka average Chennai hai! Yeh bilkul galat hai — cities ke beech koi order nahi hota.'
  theory_html: |-
    <h3 class="sh3">
           1. Why Encoding Matters
          </h3>

    <p>
           Categorical variables come in two flavours.
          </p>
    <p>
    <strong>
            Nominal
           </strong>
           : no natural order (color, city, gender).
          </p>
    <p>
    <strong>
            Ordinal
           </strong>
           : a natural order exists (small/medium/large, poor/average/good).
          </p>
    <p>
           The choice of encoding depends entirely on this distinction.
          </p>
    <div class="ml-connect">
           Tree-based models (Decision Tree, Random Forest, XGBoost) can handle Label Encoding on nominals because they split on values rather than assuming order.
           <br/>
    <br/>
           But linear models (Linear Regression, Logistic Regression, SVM) absolutely require proper One-Hot Encoding for nominal features — they assume numeric order matters.
          </div>
    <h3 class="sh3">
           2. Label Encoding — For Ordinal Data Only
          </h3>
    <p style="margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;">
           Label encoding converts categorical strings into sequential integers, suitable only for categories with a natural mathematical order.
          </p>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — label_encoding.py
            </span>
    <div class="cb-btns">
    <button class="run-btn" onclick="openRepl()">
              ▶ try online
             </button>
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span> LabelEncoder
    <span class="kw">import</span> pandas <span class="kw">as</span> pd

    <span class="cm"># GOOD USE: Ordinal data — order matters</span>
    df = pd.<span class="fn">DataFrame</span>({<span class="str">'education'</span>: [<span class="str">'High School'</span>, <span class="str">'Bachelor'</span>, <span class="str">'Master'</span>, <span class="str">'PhD'</span>]})
    edu_order = {<span class="str">'High School'</span>: <span class="num">0</span>, <span class="str">'Bachelor'</span>: <span class="num">1</span>, <span class="str">'Master'</span>: <span class="num">2</span>, <span class="str">'PhD'</span>: <span class="num">3</span>}
    df[<span class="str">'education_encoded'</span>] = df[<span class="str">'education'</span>].<span class="fn">map</span>(edu_order)
    <span class="fn">print</span>(df)
    <span class="cm"># education  education_encoded</span>
    <span class="cm"># High School  0   ← less education</span>
    <span class="cm"># Bachelor     1</span>
    <span class="cm"># Master       2</span>
    <span class="cm"># PhD          3   ← most education (order preserved!)</span>

    <span class="cm"># BAD USE: Nominal data — DO NOT use LabelEncoder here</span>
    le = <span class="fn">LabelEncoder</span>()
    df[<span class="str">'city'</span>] = [<span class="str">'Delhi'</span>, <span class="str">'Mumbai'</span>, <span class="str">'Chennai'</span>]
    df[<span class="str">'city_encoded'</span>] = le.<span class="fn">fit_transform</span>(df[<span class="str">'city'</span>])
    <span class="cm"># Chennai=0, Delhi=1, Mumbai=2  ← WRONG: implies Delhi is between Chennai &amp; Mumbai!</span></code></pre>
    </div>
    <h3 class="sh3">
           3. One-Hot Encoding — For Nominal Data
          </h3>
    <p style="margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;">
           One-hot encoding creates separate binary columns for each categorical value, preventing models from assuming ordinal relationships between nominal tags.
          </p>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — one_hot_encoding.py
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">import</span> pandas <span class="kw">as</span> pd
    <span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span> OneHotEncoder

    df = pd.<span class="fn">DataFrame</span>({<span class="str">'city'</span>: [<span class="str">'Delhi'</span>, <span class="str">'Mumbai'</span>, <span class="str">'Chennai'</span>, <span class="str">'Delhi'</span>]})

    <span class="cm"># Method 1: pd.get_dummies (quick and easy)</span>
    dummies = pd.<span class="fn">get_dummies</span>(df[<span class="str">'city'</span>], prefix=<span class="str">'city'</span>)
    <span class="fn">print</span>(dummies)
    <span class="cm"># city_Chennai  city_Delhi  city_Mumbai</span>
    <span class="cm">#     0              1           0       ← Delhi row</span>
    <span class="cm">#     0              0           1       ← Mumbai row</span>
    <span class="cm">#     1              0           0       ← Chennai row</span>

    <span class="cm"># IMPORTANT: drop_first=True to avoid "dummy variable trap"</span>
    dummies = pd.<span class="fn">get_dummies</span>(df[<span class="str">'city'</span>], prefix=<span class="str">'city'</span>, drop_first=<span class="kw">True</span>)
    <span class="cm"># Removes one column (it's redundant — if not Delhi and not Mumbai, must be Chennai)</span>

    <span class="cm"># Method 2: sklearn OneHotEncoder (better for pipelines)</span>
    ohe = <span class="fn">OneHotEncoder</span>(drop=<span class="str">'first'</span>, sparse_output=<span class="kw">False</span>)
    encoded = ohe.<span class="fn">fit_transform</span>(df[[<span class="str">'city'</span>]])
    <span class="fn">print</span>(encoded)
    <span class="fn">print</span>(ohe.<span class="fn">get_feature_names_out</span>())</code></pre>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem 0;">
    <strong style="color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;">
            📊 Visualizing Encoding Mechanisms
           </strong>
    <canvas height="200" id="canvas-encoding16" style="width:100%;max-max-width: 100%; width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0 auto;" width="560">
    </canvas>

    </div>
    <h3 class="sh3">
           4. Target Encoding — For High-Cardinality Columns
          </h3>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — target_encoding.py
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">import</span> pandas <span class="kw">as</span> pd

    <span class="cm"># Problem: 500 cities → One-Hot creates 499 columns (too many!)</span>
    <span class="cm"># Solution: replace each city with its MEAN TARGET VALUE</span>

    df = pd.<span class="fn">DataFrame</span>({
        <span class="str">'city'</span>: [<span class="str">'Delhi'</span>, <span class="str">'Mumbai'</span>, <span class="str">'Delhi'</span>, <span class="str">'Mumbai'</span>, <span class="str">'Chennai'</span>],
        <span class="str">'churned'</span>: [<span class="num">1</span>, <span class="num">0</span>, <span class="num">1</span>, <span class="num">0</span>, <span class="num">1</span>]   <span class="cm"># target variable</span>
    })

    <span class="cm"># Method 1: Manual Target Encoding (risky for data leakage)</span>
    city_target_mean = df.<span class="fn">groupby</span>(<span class="str">'city'</span>)[<span class="str">'churned'</span>].<span class="fn">mean</span>()
    df[<span class="str">'city_encoded'</span>] = df[<span class="str">'city'</span>].<span class="fn">map</span>(city_target_mean)

    <span class="cm"># Method 2: category_encoders library (Industry Standard, prevents leakage)</span>
    <span class="kw">import</span> category_encoders <span class="kw">as</span> ce
    encoder = ce.<span class="fn">TargetEncoder</span>(cols=[<span class="str">'city'</span>])
    <span class="cm"># Fit on training data ONLY</span>
    df[<span class="str">'city_ce_encoded'</span>] = encoder.<span class="fn">fit_transform</span>(df[<span class="str">'city'</span>], df[<span class="str">'churned'</span>])
    <span class="fn">print</span>(df[[<span class="str">'city'</span>, <span class="str">'city_encoded'</span>]])
    <span class="cm"># Delhi   → 1.0 (both Delhi rows churned)</span>
    <span class="cm"># Mumbai  → 0.0 (neither Mumbai row churned)</span>
    <span class="cm"># Chennai → 1.0 (churned)</span>

    <span class="cm"># ⚠️ Always compute target mean on TRAINING set only (leakage risk!)</span></code></pre>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem 0;">
    <strong style="color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;">
            📊 Visualizing Target Encoding Calculation
           </strong>
    <canvas height="200" id="canvas-target-encoding16" style="width:100%;max-max-width: 100%; width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0 auto;" width="560">
    </canvas>

    </div>
    <div class="table-wrap" style="overflow-x: auto; margin: 1.2rem 0; width: 100%;"><table class="concept-table">
    <tr>
    <th>
             Encoding
            </th>
    <th>
             When to Use
            </th>
    <th>
             Pros
            </th>
    <th>
             Cons
            </th>
    </tr>
    <tr>
    <td>
    <strong>
              Label Encoding
             </strong>
    </td>
    <td>
             Ordinal data with clear order
            </td>
    <td>
             Simple, compact (1 column)
            </td>
    <td>
             Implies false ordering on nominals
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              One-Hot Encoding
             </strong>
    </td>
    <td>
             Nominal data with &lt;20 categories
            </td>
    <td>
             No false ordering, linear-model safe
            </td>
    <td>
             Curse of dimensionality at high cardinality
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              Ordinal Encoding
             </strong>
    </td>
    <td>
             Ordinal data (custom order)
            </td>
    <td>
             Preserves order, compact
            </td>
    <td>
             Must define order manually
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              Target Encoding
             </strong>
    </td>
    <td>
             High-cardinality nominals
            </td>
    <td>
             Compact, captures signal
            </td>
    <td>
             Leakage risk if not done carefully
            </td>
    </tr>
    </table></div>
    <div class="hinglish">
           💡 Ek rule: order hai → Ordinal/Label encoding.
           <br/>
    <br/>
           Order nahi hai → One-Hot.
           <br/>
    <br/>
           Bahut zyada categories hain (50+) → Target encoding.
           <br/>
    <br/>
           Tree models ke liye Label Encoding bhi chalti hai, lekin linear models ke liye kabhi nahi nominal columns pe.
          </div>
    <h2 class="sh2">
