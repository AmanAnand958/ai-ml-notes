  theory_html: "<h3 class=\"sh3\">\n       0. The Essential Setup — One Import to Rule Them All\n      </h3>\n\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — setup.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"kw\">import</span> numpy\
    \ <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\n<span class=\"\
    cm\"># ── Apply a style ONCE at the top ──</span>\nplt.style.<span class=\"fn\">use</span>(<span class=\"str\">'dark_background'</span>)\
    \    <span class=\"cm\"># dark mode (great for presentations)</span>\n<span class=\"cm\"># Other options:</span>\n<span\
    \ class=\"cm\"># plt.style.use('ggplot')              # R-like clean style</span>\n<span class=\"cm\"># plt.style.use('seaborn-v0_8-darkgrid')\
    \ # ML notebook look</span>\n<span class=\"cm\"># plt.style.use('bmh')                 # clean academic style</span>\n\
    <span class=\"cm\"># plt.style.use('default')             # matplotlib default (white bg)</span>\n\n<span class=\"cm\"\
    ># ── The Workflow — ALWAYS in this order ──</span>\n<span class=\"cm\"># 1. plt.figure(figsize=(width, height))  ← set\
    \ canvas size</span>\n<span class=\"cm\"># 2. plt.plot/bar/scatter/hist/...        ← draw the chart</span>\n<span class=\"\
    cm\"># 3. plt.title / plt.xlabel / plt.ylabel  ← add labels</span>\n<span class=\"cm\"># 4. plt.legend()             \
    \            ← add legend if needed</span>\n<span class=\"cm\"># 5. plt.grid(alpha=0.3)                  ← add grid</span>\n\
    <span class=\"cm\"># 6. plt.tight_layout()                   ← ALWAYS before save</span>\n<span class=\"cm\"># 7. plt.savefig('name.png',\
    \ dpi=150)     ← save file</span>\n<span class=\"cm\"># 8. plt.show()                           ← display (optional)</span></pre>\n\
    </div>\n<!-- ─── LINE PLOT ─── -->\n<h3 class=\"sh3\">\n       1. \U0001F4C8 Line Plot — Trends Over Time\n      </h3>\n\
    \n<div class=\"theory-block\" style=\"background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:1.2rem;margin:1rem\
    \ 0;\">\n<h3> style=\"margin-top:0;color:var(--blue);font-size:14px;display:flex;align-items:center;gap:0.4rem;\">\n \
    \       \U0001F4D6 Core Theory &amp; Parameters\n       </h3>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem\
    \ 0;line-height:1.5;\">\n<strong>\n         What it is:\n        </strong>\n        A Line Plot connects sequential data\
    \ points with straight line segments.\n       </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\"\
    >\n        It represents how continuous values change relative to another ordered variable.\n       </p>\n<p style=\"\
    font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\">\n<strong>\n         When to use:\n        </strong>\n\
    \        Visualizing trends over a continuous interval or time-series (e.g., stock prices over months, training loss/validation\
    \ accuracy curves per epoch, sensor readings over time).\n       </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem\
    \ 0;line-height:1.5;\">\n<strong>\n         Basic Syntax:\n        </strong>\n\n         plt.plot(x, y, color=None, linewidth=None,\
    \ linestyle=None, marker=None, label=None)\n\n</p>\n<div style=\"margin-top:0.8rem;\">\n<strong style=\"font-size:12px;color:var(--muted);display:block;margin-bottom:0.4rem;\"\
    >\n         \U0001F4A1 Key Parameters:\n        </strong>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin:\
    \ 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<thead>\n<tr>\n<th style=\"width:25%;\">\n            Parameter\n\
    \           </th>\n<th style=\"width:25%;\">\n            Type / Default\n           </th>\n<th style=\"width:50%;\">\n\
    \            Description &amp; Options\n           </th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\"\
    >\n            color / c\n           </td>\n<td>\n            str / None\n           </td>\n<td>\n            Line color\
    \ (e.g.,\n\n             '#6c8cff'\n\n            ,\n\n             'red'\n\n            ,\n\n             'g'\n\n   \
    \         ).\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\">\n        \
    \    linewidth / lw\n           </td>\n<td>\n            float / 1.5\n           </td>\n<td>\n            Thickness of\
    \ the line (e.g.,\n\n             2.5\n\n            ).\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\"\
    >\n            linestyle / ls\n           </td>\n<td>\n            str / '-'\n           </td>\n<td>\n            Style:\
    \ solid (\n\n             '-'\n\n            ), dashed (\n\n             '--'\n\n            ), dash-dot (\n\n       \
    \      '-.'\n\n            ), dotted (\n\n             ':'\n\n            ).\n           </td>\n</tr>\n<tr>\n<td style=\"\
    font-family:var(--font-mono);color:var(--blue);\">\n            marker\n           </td>\n<td>\n            str / None\n\
    \           </td>\n<td>\n            Data point symbol: circle (\n\n             'o'\n\n            ), square (\n\n  \
    \           's'\n\n            ), triangle (\n\n             '^'\n\n            ), diamond (\n\n             'D'\n\n \
    \           ), cross (\n\n             'x'\n\n            ).\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\"\
    >\n            markersize / ms\n           </td>\n<td>\n            float / 6.0\n           </td>\n<td>\n            Size\
    \ of the markers (e.g.,\n\n             5.0\n\n            ).\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\"\
    >\n            label\n           </td>\n<td>\n            str / None\n           </td>\n<td>\n            Wording to display\
    \ in the legend (triggered by\n\n             plt.legend()\n\n            ).\n           </td>\n</tr>\n</tbody>\n</table></div>\n\
    </div>\n</div>\n<div style=\"background:var(--bg2);border:1px solid rgba(108,140,255,0.2);border-radius:var(--radius);padding:1rem;margin:1rem\
    \ 0;position:relative;\">\n<strong style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\">\n \
    \       \U0001F4CA Live Preview — Line Plot with Shaded Area\n        <span style=\"font-size: 12px;color:var(--muted);font-family:var(--font-mono);\"\
    >\n         (hover for values)\n        </span>\n</strong>\n<canvas height=\"260\" id=\"canvas-lineplot18\" style=\"width:100%;max-max-width:\
    \ 100%; width: 100%;background:#0f1219;border-radius:8px;display:block;margin:0 auto;cursor:crosshair;\" width=\"640\"\
    >\n</canvas>\n\n</div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — line_plot.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"run-btn\" onclick=\"openRepl()\">\n          ▶ try online\n\
    \         </button>\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n\
    </div>\n<pre><span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"kw\">import</span>\
    \ numpy <span class=\"kw\">as</span> np\n\nmonths = [<span class=\"str\">'Jan'</span>,<span class=\"str\">'Feb'</span>,<span\
    \ class=\"str\">'Mar'</span>,<span class=\"str\">'Apr'</span>,<span class=\"str\">'May'</span>,<span class=\"str\">'Jun'</span>,\n\
    \          <span class=\"str\">'Jul'</span>,<span class=\"str\">'Aug'</span>,<span class=\"str\">'Sep'</span>,<span class=\"\
    str\">'Oct'</span>,<span class=\"str\">'Nov'</span>,<span class=\"str\">'Dec'</span>]\nsales_2026 = [<span class=\"num\"\
    >1200</span>,<span class=\"num\">1500</span>,<span class=\"num\">1100</span>,<span class=\"num\">1800</span>,<span class=\"\
    num\">2100</span>,<span class=\"num\">1950</span>,<span class=\"num\">2400</span>,<span class=\"num\">2200</span>,<span\
    \ class=\"num\">2600</span>,<span class=\"num\">2900</span>,<span class=\"num\">2750</span>,<span class=\"num\">3200</span>]\n\
    sales_2025 = [<span class=\"num\">900</span>, <span class=\"num\">1100</span>,<span class=\"num\">1000</span>,<span class=\"\
    num\">1400</span>,<span class=\"num\">1700</span>,<span class=\"num\">1600</span>,<span class=\"num\">1900</span>,<span\
    \ class=\"num\">1800</span>,<span class=\"num\">2100</span>,<span class=\"num\">2300</span>,<span class=\"num\">2200</span>,<span\
    \ class=\"num\">2600</span>]\n\nplt.<span class=\"fn\">figure</span>(figsize=(<span class=\"num\">11</span>, <span class=\"\
    num\">4</span>))\n\n<span class=\"cm\"># ── Shaded area + line for 2026 ──</span>\nplt.<span class=\"fn\">fill_between</span>(months,\
    \ sales_2026, alpha=<span class=\"num\">0.15</span>, color=<span class=\"str\">'#6c8cff'</span>)\nplt.<span class=\"fn\"\
    >plot</span>(months, sales_2026, color=<span class=\"str\">'#6c8cff'</span>, linewidth=<span class=\"num\">2.5</span>,\
    \ marker=<span class=\"str\">'o'</span>,\n         markersize=<span class=\"num\">5</span>, label=<span class=\"str\"\
    >'2026'</span>)\n\n<span class=\"cm\"># ── Dashed line for 2025 ──</span>\nplt.<span class=\"fn\">fill_between</span>(months,\
    \ sales_2025, alpha=<span class=\"num\">0.08</span>, color=<span class=\"str\">'#4fd1a5'</span>)\nplt.<span class=\"fn\"\
    >plot</span>(months, sales_2025, color=<span class=\"str\">'#4fd1a5'</span>, linewidth=<span class=\"num\">2</span>, marker=<span\
    \ class=\"str\">'s'</span>,\n         markersize=<span class=\"num\">4</span>, linestyle=<span class=\"str\">'--'</span>,\
    \ label=<span class=\"str\">'2025'</span>)\n\n<span class=\"cm\"># ── Reference horizontal line ──</span>\nplt.<span class=\"\
    fn\">axhline</span>(<span class=\"num\">2000</span>, color=<span class=\"str\">'#f7a94b'</span>, linestyle=<span class=\"\
    str\">':'</span>, linewidth=<span class=\"num\">1.5</span>, label=<span class=\"str\">'Target: 2000'</span>)\n\nplt.<span\
    \ class=\"fn\">title</span>(<span class=\"str\">'Monthly Sales Comparison'</span>, fontsize=<span class=\"num\">14</span>,\
    \ fontweight=<span class=\"str\">'bold'</span>)\nplt.<span class=\"fn\">xlabel</span>(<span class=\"str\">'Month'</span>);\
    \ plt.<span class=\"fn\">ylabel</span>(<span class=\"str\">'Sales (₹)'</span>)\nplt.<span class=\"fn\">legend</span>(loc=<span\
    \ class=\"str\">'upper left'</span>)\nplt.<span class=\"fn\">grid</span>(axis=<span class=\"str\">'y'</span>, alpha=<span\
    \ class=\"num\">0.3</span>, linestyle=<span class=\"str\">'--'</span>)\nplt.<span class=\"fn\">xticks</span>(rotation=<span\
    \ class=\"num\">30</span>)\nplt.<span class=\"fn\">tight_layout</span>()\nplt.<span class=\"fn\">savefig</span>(<span\
    \ class=\"str\">'line_plot.png'</span>, dpi=<span class=\"num\">150</span>); plt.<span class=\"fn\">show</span>()\n\n\
    <span class=\"cm\"># ── Key options ──</span>\n<span class=\"cm\"># marker: 'o'=circle, 's'=square, '^'=triangle, 'D'=diamond,\
    \ '*'=star</span>\n<span class=\"cm\"># linestyle: '-' solid, '--' dashed, '-.' dash-dot, ':' dotted</span>\n<span class=\"\
    cm\"># linewidth: 1=thin, 2.5=normal, 4=thick</span>\n<span class=\"cm\"># plt.axhline(y=val) → horizontal reference line</span>\n\
    <span class=\"cm\"># plt.axvline(x=val) → vertical reference line</span></pre>\n</div>\n<!-- ─── BAR CHART ─── -->\n<h3\
    \ class=\"sh3\">\n       2. \U0001F4CA Bar Chart — Comparing Categories\n      </h3>\n\n<div class=\"theory-block\" style=\"\
    background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:1.2rem;margin:1rem 0;\">\n<h3> style=\"\
    margin-top:0;color:var(--blue);font-size:14px;display:flex;align-items:center;gap:0.4rem;\">\n        \U0001F4D6 Core\
    \ Theory &amp; Parameters\n        (2)</h3>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\"\
    >\n<strong>\n         What it is:\n        </strong>\n        A Bar Chart represents categorical data with rectangular\
    \ bars.\n       </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\">\n        The length\
    \ or height of each bar is proportional to the value it represents.\n       </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem\
    \ 0;line-height:1.5;\">\n<strong>\n         When to use:\n        </strong>\n        Comparing discrete categories (e.g.,\
    \ average salaries across cities, sales figures across product segments, feature importances in a decision tree).\n  \
    \     </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\">\n        Use horizontal bars\
    \ (\n\n         plt.barh\n\n        ) if category names are long to prevent tick labels from overlapping.\n       </p>\n\
    <p style=\"font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\">\n<strong>\n         Basic Syntax:\n  \
    \      </strong>\n<br/>\n        • Vertical:\n\n         plt.bar(x, height, width=0.8, bottom=None, align='center', color=None,\
    \ edgecolor=None)\n\n<br/>\n        • Horizontal:\n\n         plt.barh(y, width, height=0.8, left=None, align='center',\
    \ color=None, edgecolor=None)\n\n</p>\n<div style=\"margin-top:0.8rem;\">\n<strong style=\"font-size:12px;color:var(--muted);display:block;margin-bottom:0.4rem;\"\
    >\n         \U0001F4A1 Key Parameters:\n        </strong>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin:\
    \ 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<thead>\n<tr>\n<th style=\"width:25%;\">\n            Parameter\n\
    \           </th>\n<th style=\"width:25%;\">\n            Type / Default\n           </th>\n<th style=\"width:50%;\">\n\
    \            Description &amp; Options\n           </th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\"\
    >\n            x / y\n           </td>\n<td>\n            array-like\n           </td>\n<td>\n            Positions of\
    \ the bars on the primary axis (categories or positions).\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\"\
    >\n            height / width\n           </td>\n<td>\n            array-like\n           </td>\n<td>\n            The\
    \ values/magnitudes of the bars (determines bar length).\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\"\
    >\n            width / height\n           </td>\n<td>\n            float / 0.8\n           </td>\n<td>\n            Thickness\
    \ of the bars along the axis. Reducing this spaces bars apart.\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\"\
    >\n            color\n           </td>\n<td>\n            str or list\n           </td>\n<td>\n            Fill color\
    \ of the bars (can pass a single color or a list of colors).\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\"\
    >\n            edgecolor\n           </td>\n<td>\n            str / None\n           </td>\n<td>\n            Border color\
    \ of the bars (e.g.\n\n             'white'\n\n            ,\n\n             '#1a1d27'\n\n            ).\n           </td>\n\
    </tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\">\n            linewidth\n           </td>\n\
    <td>\n            float / None\n           </td>\n<td>\n            Border thickness around each bar.\n           </td>\n\
    </tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\">\n            bottom / left\n           </td>\n\
    <td>\n            float / None\n           </td>\n<td>\n            The starting baseline. Essential for creating stacked\
    \ bar charts.\n           </td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — bar_chart.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span>\
    \ matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
    \ np\n\ncities   = [<span class=\"str\">'Delhi'</span>, <span class=\"str\">'Mumbai'</span>, <span class=\"str\">'Bangalore'</span>,\
    \ <span class=\"str\">'Hyderabad'</span>, <span class=\"str\">'Chennai'</span>]\nsalaries = [<span class=\"num\">85000</span>,\
    \ <span class=\"num\">95000</span>, <span class=\"num\">110000</span>, <span class=\"num\">90000</span>, <span class=\"\
    num\">80000</span>]\ncolors   = [<span class=\"str\">'#6c8cff'</span>, <span class=\"str\">'#4fd1a5'</span>, <span class=\"\
    str\">'#f7a94b'</span>, <span class=\"str\">'#e56b8c'</span>, <span class=\"str\">'#b47cfc'</span>]\n\nplt.<span class=\"\
    fn\">figure</span>(figsize=(<span class=\"num\">10</span>, <span class=\"num\">4</span>))\n\n<span class=\"cm\"># ── Simple\
    \ vertical bar ──</span>\nbars = plt.<span class=\"fn\">bar</span>(cities, salaries, color=colors, edgecolor=<span class=\"\
    str\">'none'</span>, width=<span class=\"num\">0.6</span>)\n\n<span class=\"cm\"># ── Value labels on top of each bar\
    \ ──</span>\n<span class=\"kw\">for</span> bar <span class=\"kw\">in</span> bars:\n    plt.<span class=\"fn\">text</span>(\n\
    \        bar.<span class=\"fn\">get_x</span>() + bar.<span class=\"fn\">get_width</span>() / <span class=\"num\">2</span>,\n\
    \        bar.<span class=\"fn\">get_height</span>() + <span class=\"num\">800</span>,\n        <span class=\"str\">f'₹{bar.get_height():,.0f}'</span>,\n\
    \        ha=<span class=\"str\">'center'</span>, va=<span class=\"str\">'bottom'</span>, fontsize=<span class=\"num\"\
    >9</span>\n    )\n\nplt.<span class=\"fn\">title</span>(<span class=\"str\">'Average AI/ML Salary by City'</span>, fontsize=<span\
    \ class=\"num\">14</span>)\nplt.<span class=\"fn\">ylabel</span>(<span class=\"str\">'Salary (₹/year)'</span>)\nplt.<span\
    \ class=\"fn\">ylim</span>(<span class=\"num\">0</span>, <span class=\"num\">130000</span>)\nplt.<span class=\"fn\">grid</span>(axis=<span\
    \ class=\"str\">'y'</span>, alpha=<span class=\"num\">0.3</span>)\nplt.<span class=\"fn\">tight_layout</span>(); plt.<span\
    \ class=\"fn\">savefig</span>(<span class=\"str\">'bar_vertical.png'</span>, dpi=<span class=\"num\">150</span>)\n\n<span\
    \ class=\"cm\"># ── Horizontal bar (barh) — better for long category names ──</span>\nplt.<span class=\"fn\">figure</span>(figsize=(<span\
    \ class=\"num\">8</span>, <span class=\"num\">4</span>))\nplt.<span class=\"fn\">barh</span>(cities, salaries, color=colors,\
    \ edgecolor=<span class=\"str\">'none'</span>)\n<span class=\"kw\">for</span> i, v <span class=\"kw\">in</span> <span\
    \ class=\"fn\">enumerate</span>(salaries):\n    plt.<span class=\"fn\">text</span>(v + <span class=\"num\">500</span>,\
    \ i, <span class=\"str\">f'₹{v:,.0f}'</span>, va=<span class=\"str\">'center'</span>, fontsize=<span class=\"num\">9</span>)\n\
    plt.<span class=\"fn\">xlabel</span>(<span class=\"str\">'Salary (₹)'</span>); plt.<span class=\"fn\">title</span>(<span\
    \ class=\"str\">'Horizontal Bar Chart'</span>)\nplt.<span class=\"fn\">tight_layout</span>(); plt.<span class=\"fn\">savefig</span>(<span\
    \ class=\"str\">'bar_horizontal.png'</span>, dpi=<span class=\"num\">150</span>)\n\n<span class=\"cm\"># ── Grouped bar\
    \ chart (side by side) ──</span>\nplt.<span class=\"fn\">figure</span>(figsize=(<span class=\"num\">10</span>, <span class=\"\
    num\">4</span>))\nx = np.<span class=\"fn\">arange</span>(<span class=\"fn\">len</span>(cities))\nwidth = <span class=\"\
