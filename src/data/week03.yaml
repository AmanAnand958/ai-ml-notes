  - title: Compare Imputation Strategies
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Load the Titanic\
      \ dataset. Artificially introduce 20% random missing values into the \"Age\"\
      \ column. Then impute using:\n          </p>\n<ul style=\"padding-left: 1.5rem;\
      \ margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;\">\n<li style=\"\
      margin-bottom: 0.4rem;\">\n<strong>\n             (1)\n            </strong>\n\
      \            Mean\n           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n\
      <strong>\n             (2)\n            </strong>\n            Median\n    \
      \       </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n           \
      \  (3)\n            </strong>\n            KNNImputer (k=5). For each strategy,\
      \ compute RMSE against the original Age values. Plot a bar chart comparing RMSE.\
      \ Which strategy is most accurate on this dataset?\n           </li>\n</ul>"
    done_when: You have a bar chart comparing 3 imputation strategies by RMSE and
      can explain which wins and why.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day15: compare imputation
      strategies with RMSE"'
    sol_id: sol-w3d15t2
    solution_title: 📓 Complete Colab Code
    solution_code: '# Compare Imputation Strategies

      import pandas as pd

      import numpy as np

      from sklearn.impute import KNNImputer

      from sklearn.metrics import mean_squared_error

      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"

      df = pd.read_csv(url)

      np.random.seed(42)

      true_ages = df["Age"].dropna().values

      mask = np.random.rand(len(true_ages)) < 0.2

      corrupted = true_ages.copy()

      corrupted[mask] = np.nan

      rmse_mean = np.sqrt(mean_squared_error(true_ages[~mask], [np.nanmean(corrupted)]*sum(~mask)))

      rmse_median = np.sqrt(mean_squared_error(true_ages[~mask], [np.nanmedian(corrupted)]*sum(~mask)))

      knn = KNNImputer(n_neighbors=5)

      knn_imputed = knn.fit_transform(corrupted.reshape(-1,1)).ravel()

      rmse_knn = np.sqrt(mean_squared_error(true_ages[~mask], knn_imputed[~mask]))

      print(f"RMSE Mean:   {rmse_mean:.3f}")

      print(f"RMSE Median: {rmse_median:.3f}")

      print(f"RMSE KNN:    {rmse_knn:.3f}")

      best = "KNN" if rmse_knn<min(rmse_mean,rmse_median) else ("Mean" if rmse_mean<rmse_median
      else "Median")

      print(f"Best: {best}")

      assert best is not None, "best should not be None"'
