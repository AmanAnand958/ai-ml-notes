    sol_id: sol-w3d21t3
    solution_title: 📓 Complete Colab Code
    solution_code: |-
      # Apply to a New Dataset - House Prices
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      try:
          url="https://raw.githubusercontent.com/ageron/handson-ml2/master/datasets/housing/housing.csv"
          df=pd.read_csv(url).head(200)
          print(f"Shape: {df.shape}")
          print(f"Columns: {list(df.columns)}")
          print(f"Missing:\n{df.isnull().sum()[df.isnull().sum()>0]}\n")
          df["rooms_per_household"]=df["total_rooms"]/df["households"]
          df["bedrooms_per_room"]=df["total_bedrooms"]/df["total_rooms"]
          df["population_per_household"]=df["population"]/df["households"]
          print("Engineered features:")
          print(df[["rooms_per_household","bedrooms_per_room","population_per_household"]].describe().round(3))
          df_clean=df.dropna().copy()
          df_clean["ocean_proximity_enc"]=pd.factorize(df_clean["ocean_proximity"])[0]
          corr=df_clean[["median_house_value","median_income","housing_median_age","rooms_per_household"]].corr()
          print(f"\nCorrelation with target:\n{corr['median_house_value'].sort_values(ascending=False)}")
          fig,ax=plt.subplots(figsize=(8,6))
          ax.scatter(df_clean["median_income"],df_clean["median_house_value"],alpha=0.5,s=10)
          ax.set_xlabel("Median Income")
          ax.set_ylabel("Median House Value")
          ax.set_title("House Prices")
          plt.tight_layout()
          plt.savefig("house_prices_eda.png")
          print("Saved analysis!")
      except Exception as e:
          print(f"Data load error: {e}. Using fallback sample.")
          np.random.seed(42)
          N=100
          df=pd.DataFrame({"price":np.random.normal(200000,50000,N),"sqft":np.random.normal(1500,400,N),
                           "bedrooms":np.random.randint(1,5,N),"age":np.random.randint(0,50,N)})
          print(df.head())
          print(df.describe().round(0))
          print(f"Price-sqft correlation: {df['price'].corr(df['sqft']):.3f}")
      assert df is not None, "df should not be None"
