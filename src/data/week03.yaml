  hinglish: "Feature engineering ka matlab hai: raw features se naye aur better features\
    \ banana. Jaise\n       \n        age\n       \n       aur\n       \n        year_of_birth\n\
    \       \n       se\n       \n        age_group\n       \n       banana — model\
    \ ko ye zyada useful lagta hai!"
  analogy: "KNN algorithm aur SVM distances calculate karte hain features ke beech.\n\
    \       <br/>\n<br/>\n       Agar age (0–100) aur income (50,000–10,00,000) hain\
    \ bina scaling ke, income dominate kar lega kyunki uske numbers bahut bade hain.\n\
    \       <br/>\n<br/>\n       Model sochega income zyada \"important\" hai sirf\
    \ kyunki uski units badi hain.\n       <br/>\n<br/>\n       Yeh unit-bias hai,\
    \ real importance nahi."
  theory_html: "<h3 class=\"sh3\">\n       1. Why Scaling Matters\n      </h3>\n\n\
    <div class=\"ml-connect\">\n       Models that compute distances (KNN, SVM, K-Means)\
    \ or use gradient descent (Linear Regression, Neural Networks, Logistic Regression)\
    \ are heavily affected by feature scale.\n       <br/>\n<br/>\n       Tree-based\
    \ models (Decision Tree, Random Forest, XGBoost) are completely unaffected — they\
    \ split on values, not distances.\n       <br/>\n<br/>\n       Always scale for\
    \ the former group; skip for the latter.\n      </div>\n<h3 class=\"sh3\">\n \
    \      2. StandardScaler (Z-score Normalization)\n      </h3>\n<div class=\"cb\"\
    >\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — scaling.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"run-btn\" onclick=\"\
    openRepl()\">\n          ▶ try online\n         </button>\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><span class=\"kw\">from</span> sklearn.preprocessing\
    \ <span class=\"kw\">import</span> StandardScaler, MinMaxScaler, RobustScaler\n\
    <span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span\
    \ class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\ndata =\
    \ pd.<span class=\"fn\">DataFrame</span>({<span class=\"str\">'age'</span>: [<span\
    \ class=\"num\">25</span>,<span class=\"num\">35</span>,<span class=\"num\">45</span>,<span\
    \ class=\"num\">28</span>,<span class=\"num\">60</span>],\n                  \
    \   <span class=\"str\">'salary'</span>: [<span class=\"num\">30000</span>,<span\
    \ class=\"num\">50000</span>,<span class=\"num\">70000</span>,<span class=\"num\"\
    >35000</span>,<span class=\"num\">200000</span>]})\n\n<span class=\"cm\"># ---\
    \ StandardScaler: (x - mean) / std ---</span>\n<span class=\"cm\"># Result: mean=0,\
    \ std=1. Values roughly in [-3, 3]</span>\n<span class=\"cm\"># Best for: normally\
    \ distributed data, linear/logistic regression, neural nets</span>\nss = <span\
    \ class=\"fn\">StandardScaler</span>()\ndata_std = ss.<span class=\"fn\">fit_transform</span>(data)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">\"StandardScaler:\\n\"</span>,\
    \ data_std)\n\n<span class=\"cm\"># --- MinMaxScaler: (x - min) / (max - min)\
    \ ---</span>\n<span class=\"cm\"># Result: all values in [0, 1]. Preserves shape\
    \ exactly.</span>\n<span class=\"cm\"># Best for: image pixels (0-255 → 0-1),\
    \ bounded ranges, KNN</span>\n<span class=\"cm\"># Weakness: one extreme outlier\
    \ destroys the scale</span>\nmms = <span class=\"fn\">MinMaxScaler</span>()\n\
    data_mm = mms.<span class=\"fn\">fit_transform</span>(data)\n<span class=\"fn\"\
    >print</span>(<span class=\"str\">f\"\\nMinMaxScaler:\\n\"</span>, data_mm)\n\n\
    <span class=\"cm\"># --- RobustScaler: (x - median) / IQR ---</span>\n<span class=\"\
    cm\"># Result: centered at median, scaled by interquartile range</span>\n<span\
    \ class=\"cm\"># Best for: data with outliers (salary: ₹30k to ₹2L)</span>\n<span\
    \ class=\"cm\"># Outliers don't dominate because we use MEDIAN and IQR</span>\n\
    rs = <span class=\"fn\">RobustScaler</span>()\ndata_rob = rs.<span class=\"fn\"\
    >fit_transform</span>(data)\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"\\nRobustScaler:\\n\"</span>, data_rob)</pre>\n</div>\n<div style=\"background:var(--bg2);border:1px\
    \ solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem 0;\"\
    >\n<strong style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\"\
    >\n        \U0001F4CA Visualizing Feature Scaling &amp; Outlier Sensitivity\n\
    \       </strong>\n<canvas height=\"220\" id=\"canvas-scaling17\" style=\"width:100%;max-max-width:\
    \ 100%; width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0\
    \ auto;\" width=\"560\">\n</canvas>\n<script>\n        (function(){\n  var c=document.getElementById('canvas-scaling17');if(!c)return;\n\
    \  var ctx=c.getContext('2d');\n  \n  // Set up High-DPI support\n  var dpr =\
    \ window.devicePixelRatio || 1;\n  var W = 560;\n  var H = 220;\n  c.width = W\
    \ * dpr;\n  c.height = H * dpr;\n  c.style.width = W + 'px';\n  c.style.height\
    \ = H + 'px';\n  ctx.scale(dpr, dpr);\n\n  ctx.fillStyle='#1a1d27';ctx.fillRect(0,0,W,H);\n\
    \  \n  var titles = ['1. Raw Data', '2. MinMax', '3. Standard', '4. Robust'];\n\
    \  \n  // Adjusted column positions to fill 560px beautifully\n  var gx = [12,\
    \ 148, 284, 420];\n  var gy = 42;\n  var gw = 128;\n  var gh = 120;\n  var py\
    \ = gy + gh / 2; // y = 102\n  \n  var points = [\n    [10, 12, 14, 15, 100],\n\
    \    [0.0, 0.02, 0.04, 0.06, 1.0],\n    [-0.58, -0.52, -0.46, -0.44, 2.0],\n \
    \   [-1.33, -0.67, 0.0, 0.33, 28.67]\n  ];\n  \n  var minX = [0, -0.05, -1.0,\
    \ -5.0];\n  var maxX = [110, 1.05, 2.5, 32.0];\n  \n  var minLabels = ['0', '-0.05',\
    \ '-1.0', '-5.0'];\n  var maxLabels = ['110', '1.05', '2.5', '32.0'];\n  \n  var\
    \ normalLabels = ['10–15', '0.0–0.06', '-0.58…-0.44', '-1.33…0.33'];\n  var outlierLabels\
    \ = ['100', '1.0', '2.0', '28.7'];\n  \n  for(var p=0; p<4; p++) {\n    // Column\
    \ title\n    ctx.fillStyle='#e2e8f0';ctx.font='bold 11.5px sans-serif';ctx.textAlign='center';\n\
    \    ctx.fillText(titles[p], gx[p] + gw/2, gy - 12);\n    \n    // Column box\
    \ background\n    ctx.fillStyle='#222638';\n    ctx.fillRect(gx[p], gy, gw, gh);\n\
    \    ctx.strokeStyle='#323852';ctx.lineWidth=1;\n    ctx.strokeRect(gx[p], gy,\
    \ gw, gh);\n    \n    // Axis line\n    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;\n\
    \    ctx.beginPath();\n    ctx.moveTo(gx[p] + 6, py);\n    ctx.lineTo(gx[p] +\
    \ gw - 6, py);\n    ctx.stroke();\n    \n    var pts = points[p];\n    var mn\
    \ = minX[p];\n    var mx = maxX[p];\n    \n    // Plot points\n    var px_coords\
    \ = [];\n    for(var i=0; i<pts.length; i++) {\n      var val = pts[i];\n    \
    \  var pct = (val - mn) / (mx - mn);\n      // Clamp just in case\n      pct =\
    \ Math.max(0, Math.min(1, pct));\n      // Map to screen coordinates (leave 8px\
    \ padding on left/right inside the box)\n      var px = gx[p] + 8 + pct * (gw\
    \ - 16);\n      px_coords.push(px);\n      \n      ctx.beginPath();\n      ctx.arc(px,\
    \ py, i === 4 ? 4.5 : 3.5, 0, 2*Math.PI);\n      ctx.fillStyle = i === 4 ? '#ff5c5c'\
    \ : '#4fd1a5';\n      ctx.fill();\n      \n      // Add a subtle border around\
    \ the dots to make them pop\n      ctx.strokeStyle = '#1a1d27';ctx.lineWidth =\
    \ 1;\n      ctx.stroke();\n    }\n    \n    // Draw normal cluster bracket (first\
    \ point to fourth point)\n    var px_min = px_coords[0];\n    var px_max = px_coords[3];\n\
    \    var bx_y = py + 14;\n    \n    ctx.strokeStyle = 'rgba(79, 209, 165, 0.6)';ctx.lineWidth\
    \ = 1;\n    ctx.beginPath();\n    // Left tick\n    ctx.moveTo(px_min, bx_y -\
    \ 3); ctx.lineTo(px_min, bx_y + 3);\n    // Right tick\n    ctx.moveTo(px_max,\
    \ bx_y - 3); ctx.lineTo(px_max, bx_y + 3);\n    // Horizontal line\n    ctx.moveTo(px_min,\
    \ bx_y); ctx.lineTo(px_max, bx_y);\n    ctx.stroke();\n    \n    // Normal bracket\
    \ labels (two lines to avoid overlap)\n    ctx.fillStyle = 'rgba(79, 209, 165,\
    \ 0.9)';\n    ctx.font = 'bold 8px sans-serif';\n    ctx.fillText('Normal', (px_min\
    \ + px_max) / 2, bx_y + 11);\n    ctx.font = '8px monospace';\n    ctx.fillText(normalLabels[p],\
    \ (px_min + px_max) / 2, bx_y + 20);\n    \n    // Outlier label (above the red\
    \ dot)\n    var px_outlier = px_coords[4];\n    ctx.fillStyle = '#ff5c5c';\n \
    \   ctx.font = 'bold 8.5px sans-serif';\n    ctx.fillText('Outlier', px_outlier,\
    \ py - 20);\n    ctx.font = '8.5px monospace';\n    ctx.fillText(outlierLabels[p],\
    \ px_outlier, py - 10);\n    \n    // Box bounds (Min/Max scale labels at the\
    \ bottom)\n    ctx.fillStyle = 'rgba(255,255,255,0.4)';\n    ctx.font = '8.5px\
    \ monospace';\n    ctx.textAlign = 'left';\n    ctx.fillText(minLabels[p], gx[p]\
    \ + 6, gy + gh + 14);\n    ctx.textAlign = 'right';\n    ctx.fillText(maxLabels[p],\
    \ gx[p] + gw - 6, gy + gh + 14);\n  }\n  \n  // Overall Legend at the bottom\n\
    \  ctx.textAlign = 'center';\n  ctx.fillStyle = '#ffffff';ctx.font = '10px sans-serif';\n\
    \  \n  ctx.fillStyle='#4fd1a5';ctx.beginPath();ctx.arc(170, H - 15, 4, 0, 2*Math.PI);ctx.fill();\n\
    \  ctx.fillStyle='#e2e8f0';ctx.textAlign='left';\n  ctx.fillText('Normal Cluster\
    \ (Clustered)', 180, H - 11);\n  \n  ctx.fillStyle='#ff5c5c';ctx.beginPath();ctx.arc(335,\
    \ H - 15, 4.5, 0, 2*Math.PI);ctx.fill();\n  ctx.fillStyle='#e2e8f0';ctx.textAlign='left';\n\
    \  ctx.fillText('Outlier (Value = 100)', 345, H - 11);\n})();\n       </script>\n\
    </div>\n<h3 class=\"sh3\">\n       3. Outlier Detection — IQR Method\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       The Interquartile Range (IQR) method identifies data points that deviate\
    \ significantly from the distribution, classifying values beyond $1.5 \t\\times\
    \ IQR$ as outliers.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n\
    <span class=\"cb-lang\">\n         python — outlier_detection.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\
    <span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\nsalaries\
    \ = pd.<span class=\"fn\">Series</span>([<span class=\"num\">30000</span>, <span\
    \ class=\"num\">35000</span>, <span class=\"num\">40000</span>, <span class=\"\
    num\">42000</span>, <span class=\"num\">45000</span>,\n                      <span\
    \ class=\"num\">48000</span>, <span class=\"num\">50000</span>, <span class=\"\
    num\">55000</span>, <span class=\"num\">60000</span>, <span class=\"num\">500000</span>])\
    \  <span class=\"cm\"># 500k is outlier</span>\n\n<span class=\"cm\"># --- Method\
    \ 1: IQR Method (most common) ---</span>\nQ1 = salaries.<span class=\"fn\">quantile</span>(<span\
    \ class=\"num\">0.25</span>)   <span class=\"cm\"># 25th percentile</span>\nQ3\
    \ = salaries.<span class=\"fn\">quantile</span>(<span class=\"num\">0.75</span>)\
    \   <span class=\"cm\"># 75th percentile</span>\nIQR = Q3 - Q1\n\nlower = Q1 -\
    \ <span class=\"num\">1.5</span> * IQR\nupper = Q3 + <span class=\"num\">1.5</span>\
    \ * IQR\n\noutliers = salaries[(salaries &lt; lower) | (salaries &gt; upper)]\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"Outliers detected: {outliers.tolist()}\"\
    </span>)  <span class=\"cm\"># [500000]</span>\n\n<span class=\"cm\"># Remove\
    \ outliers</span>\nclean = salaries[(salaries &gt;= lower) &amp; (salaries &lt;=\
    \ upper)]\n\n<span class=\"cm\"># --- Method 2: Z-Score Method ---</span>\nz_scores\
    \ = (salaries - salaries.<span class=\"fn\">mean</span>()) / salaries.<span class=\"\
    fn\">std</span>()\noutliers_z = salaries[np.<span class=\"fn\">abs</span>(z_scores)\
    \ &gt; <span class=\"num\">3</span>]   <span class=\"cm\"># beyond 3 standard\
    \ deviations</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Z-score\
    \ outliers: {outliers_z.tolist()}\"</span>)\n\n<span class=\"cm\"># --- Method\
    \ 3: Log transformation (for skewed distributions) ---</span>\n<span class=\"\
    cm\"># Instead of removing outliers, compress the scale</span>\n<span class=\"\
    kw\">import</span> numpy <span class=\"kw\">as</span> np\nsalaries_log = np.<span\
    \ class=\"fn\">log1p</span>(salaries)  <span class=\"cm\"># log(1+x) handles zeros\
    \ safely</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Before\
    \ log - skewness: {salaries.skew():.2f}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"After log  - skewness: {salaries_log.skew():.2f}\"</span>)\n\
    <span class=\"cm\"># Skewness drops from ~3.0 to near 0 — much more normal-like!</span></pre>\n\
    </div>\n<div style=\"background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem\
    \ 0;\">\n<strong style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\"\
    >\n        \U0001F4CA Visualizing Outlier Detection: Z-Score vs IQR Rule\n   \
    \    </strong>\n<canvas height=\"200\" id=\"canvas-outliers17\" style=\"width:100%;max-max-width:\
    \ 100%; width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0\
    \ auto;\" width=\"560\">\n</canvas>\n<script>\n        (function(){\n  var c=document.getElementById('canvas-outliers17');if(!c)return;\n\
    \  var ctx=c.getContext('2d');var W=c.width,H=c.height;\n  ctx.fillStyle='#1a1d27';ctx.fillRect(0,0,W,H);\n\
    \  \n  ctx.fillStyle='#ffffff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';\n\
    \  ctx.fillText('1. Z-score Rule (Bell Curve)', 135, 25);\n  \n  var bx1=25, by1=40,\
    \ bw1=220, bh1=120;\n  ctx.strokeStyle='#6c8cff';ctx.lineWidth=2;\n  ctx.beginPath();\n\
    \  var mean = bx1 + bw1/2;\n  var std = 30;\n  for(var x=bx1; x<=bx1+bw1; x++)\
    \ {\n    var diff = x - mean;\n    var y = (by1 + bh1 - 20) - 80 * Math.exp(-Math.pow(diff,\
    \ 2) / (2 * Math.pow(std, 2)));\n    if(x === bx1) ctx.moveTo(x, y);\n    else\
    \ ctx.lineTo(x, y);\n  }\n  ctx.stroke();\n  \n  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.setLineDash([2,\
    \ 2]);\n  ctx.beginPath();ctx.moveTo(mean, by1);ctx.lineTo(mean, by1+bh1);ctx.stroke();\n\
    \  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='8px monospace';\n  ctx.fillText('Mean\
    \ (μ)', mean, by1+bh1+10);\n  \n  var thresh_l = mean - 3*std;\n  var thresh_r\
    \ = mean + 3*std;\n  ctx.strokeStyle='#ff5c5c';\n  ctx.beginPath();ctx.moveTo(thresh_l,\
    \ by1+20);ctx.lineTo(thresh_l, by1+bh1);ctx.stroke();\n  ctx.beginPath();ctx.moveTo(thresh_r,\
    \ by1+20);ctx.lineTo(thresh_r, by1+bh1);ctx.stroke();\n  ctx.setLineDash([]);\n\
    \  \n  ctx.fillStyle='#ff5c5c';ctx.font='bold 8px sans-serif';\n  ctx.fillText('-3σ',\
    \ thresh_l, by1+bh1+10);\n  ctx.fillText('+3σ', thresh_r, by1+bh1+10);\n  ctx.fillText('Outlier\
    \ Zone', thresh_r+15, by1+40);\n  ctx.fillText('Outlier Zone', thresh_l-15, by1+40);\n\
    \  \n  ctx.fillStyle='#ffffff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';\n\
    \  ctx.fillText('2. IQR Rule (Box Plot)', 415, 25);\n  \n  var bx2=305, by2=40,\
    \ bw2=230, bh2=120;\n  var cy2 = by2 + bh2/2;\n  \n  var q1 = bx2 + 50;\n  var\
    \ q3 = bx2 + 150;\n  var med = bx2 + 90;\n  ctx.fillStyle='#2d3142';ctx.fillRect(q1,\
    \ cy2-20, q3-q1, 40);\n  ctx.strokeStyle='#6c8cff';ctx.lineWidth=1.5;ctx.strokeRect(q1,\
    \ cy2-20, q3-q1, 40);\n  \n  ctx.beginPath();ctx.moveTo(med, cy2-20);ctx.lineTo(med,\
    \ cy2+20);ctx.stroke();\n  \n  var w_l = q1 - 1.5 * 20;\n  var w_r = q3 + 1.5\
    \ * 20;\n  \n  ctx.beginPath();ctx.moveTo(q1, cy2);ctx.lineTo(w_l, cy2);ctx.stroke();\n\
    \  ctx.beginPath();ctx.moveTo(q3, cy2);ctx.lineTo(w_r, cy2);ctx.stroke();\n  \n\
    \  ctx.beginPath();ctx.moveTo(w_l, cy2-10);ctx.lineTo(w_l, cy2+10);ctx.stroke();\n\
    \  ctx.beginPath();ctx.moveTo(w_r, cy2-10);ctx.lineTo(w_r, cy2+10);ctx.stroke();\n\
    \  \n  ctx.fillStyle='#ff5c5c';\n  ctx.beginPath();ctx.arc(w_r + 20, cy2, 4, 0,\
    \ 2*Math.PI);ctx.fill();\n  ctx.beginPath();ctx.arc(w_l - 15, cy2, 4, 0, 2*Math.PI);ctx.fill();\n\
    \  ctx.font='bold 8px sans-serif';\n  ctx.fillText('Outlier', w_r + 20, cy2 -\
    \ 8);\n  ctx.fillText('Outlier', w_l - 15, cy2 - 8);\n  \n  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='8px\
    \ monospace';\n  ctx.fillText('Q1', q1, cy2+32);\n  ctx.fillText('Q3', q3, cy2+32);\n\
    \  ctx.fillText('Median', med, cy2-25);\n  ctx.fillText('Q1 - 1.5*IQR', w_l, cy2+22);\n\
    \  ctx.fillText('Q3 + 1.5*IQR', w_r, cy2+22);\n  \n  ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='9px\
    \ sans-serif';ctx.textAlign='left';\n  ctx.fillText('Z-score outlier: |(x - μ)\
    \ / σ| > 3', 35, H-15);\n  ctx.fillText('IQR outlier: x < Q1 - 1.5*IQR or x >\
    \ Q3 + 1.5*IQR', 280, H-15);\n})();\n       </script>\n</div>\n<div class=\"table-wrap\"\
    \ style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\"\
    >\n<tr>\n<th>\n         Scaler\n        </th>\n<th>\n         Formula\n      \
    \  </th>\n<th>\n         Output Range\n        </th>\n<th>\n         Best For\n\
    \        </th>\n<th>\n         Outlier Robust?\n        </th>\n</tr>\n<tr>\n<td>\n\
    <strong>\n          StandardScaler\n         </strong>\n</td>\n<td>\n        \
    \ (x − mean) / std\n        </td>\n<td>\n         Approx [-3, 3]\n        </td>\n\
    <td>\n         Normal data, linear models, neural nets\n        </td>\n<td>\n\
    \         No\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          MinMaxScaler\n\
    \         </strong>\n</td>\n<td>\n         (x − min) / (max − min)\n        </td>\n\
    <td>\n         [0, 1]\n        </td>\n<td>\n         KNN, image data, bounded\
    \ features\n        </td>\n<td>\n         No — one outlier ruins it\n        </td>\n\
    </tr>\n<tr>\n<td>\n<strong>\n          RobustScaler\n         </strong>\n</td>\n\
    <td>\n         (x − median) / IQR\n        </td>\n<td>\n         Varies\n    \
    \    </td>\n<td>\n         Salary, house prices, any outlier-heavy data\n    \
    \    </td>\n<td>\n         Yes\n        </td>\n</tr>\n</table></div>\n<div class=\"\
    hinglish\">\n       \U0001F4A1 Quick rule: Distance-based ya gradient-based model?\
    \ → Scale karo.\n       <br/>\n<br/>\n       Tree-based? → Scale mat karo.\n \
    \      <br/>\n<br/>\n       Outlier hai? → RobustScaler ya log transform.\n  \
    \     <br/>\n<br/>\n       Bounded range chahiye? → MinMaxScaler.\n       <br/>\n\
    <br/>\n       Normal data? → StandardScaler.\n      </div>\n<h3 class=\"sh3\"\
    >\n       4. Professional Workflow: Pipelines &amp; Cross-Validation\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       Scikit-learn pipelines bundle preprocessing and modeling tasks into\
    \ a single object, preventing data leakage during cross-validation.\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — pipeline_cv.py\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\"\
    >from</span> sklearn.pipeline <span class=\"kw\">import</span> make_pipeline\n\
    <span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span>\
    \ StandardScaler\n<span class=\"kw\">from</span> sklearn.linear_model <span class=\"\
    kw\">import</span> LogisticRegression\n<span class=\"kw\">from</span> sklearn.model_selection\
    \ <span class=\"kw\">import</span> cross_val_score\n<span class=\"kw\">import</span>\
    \ numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># Creating a pipeline\
    \ ensures data leakage DOES NOT happen</span>\n<span class=\"cm\"># The scaler\
    \ is fit ONLY on the training folds during CV</span>\npipeline = <span class=\"\
    fn\">make_pipeline</span>(\n    <span class=\"fn\">StandardScaler</span>(),\n\
    \    <span class=\"fn\">LogisticRegression</span>()\n)\n\n<span class=\"cm\">#\
    \ K-Fold Cross-Validation (k=5)</span>\n<span class=\"cm\"># Evaluates the entire\
    \ pipeline 5 times on different splits</span>\nscores = <span class=\"fn\">cross_val_score</span>(pipeline,\
    \ X_train, y_train, cv=<span class=\"num\">5</span>, scoring=<span class=\"str\"\
    >'accuracy'</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"CV\
    \ Accuracies: {scores}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"Mean CV Accuracy: {np.mean(scores):.4f} ± {np.std(scores):.4f}\"</span>)</pre>\n\
    </div>\n<!-- /theory -->\n<h2 class=\"sh2\">\n       \U0001F52E Predict the Output\n\
