  predict:
    question: What integer is printed after missing median imputation?
    answer: '60'
    explanation: Series median of [10, 30, 50] is 30. Imputing NaN at index 1 and
      3 gives 30 + 30 = 60.
    code: 'import pandas as pd

      import numpy as np

      s = pd.Series([10, np.nan, 30, np.nan, 50])

      imputed = s.fillna(s.median())

      print(int(imputed.iloc[1] + imputed.iloc[3]))'
