- id: '17'
  day_num: 17
  title: Feature Scaling + Outlier Handling
  subtitle: Imagine ek race jahan kuch runners kilometres mein measure karo aur kuch
    centimetres mein — unfair!
  time_estimate: 4 hours
  difficulty: Beginner
