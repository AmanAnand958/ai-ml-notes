    \ 100%; width: 100%;background:#0f1219;border-radius:8px;display:block;margin:0 auto;cursor:crosshair;\" width=\"640\"\
    >\n</canvas>\n\n<span class=\"cm\">\n        # ── Key scatter options ──\n<div class=\"cb\"><pre><code># c=array  → color\
    \ each point by a numeric array (requires colorbar)\n# s=array  → size each point differently (in points²)\n# alpha  \
    \  → transparency for overlapping points\n# plt.colorbar() → add color scale bar when c= is numeric\n# np.polyfit(x,y,1)\
    \ → linear trend; degree=2 for curve</code></pre></div>\n       </span>\n</div>\n<!-- ─── HISTOGRAM ─── -->\n<h3 class=\"\
    sh3\">\n       4. \U0001F4C9 Histogram — Distribution of One Variable\n      </h3>\n\n<div class=\"theory-block\" style=\"\
    background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:1.2rem;margin:1rem 0;\">\n<h3> style=\"\
    margin-top:0;color:var(--blue);font-size:14px;display:flex;align-items:center;gap:0.4rem;\">\n        \U0001F4D6 Core\
    \ Theory &amp; Parameters\n        (4)</h3>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\"\
    >\n<strong>\n         What it is:\n        </strong>\n        A Histogram groups continuous numerical data into ranges\
    \ called bins, representing the frequency (count) of values in each bin using vertical bars.\n       </p>\n<p style=\"\
    font-size:13px;color:var(--text);margin:0.5rem 0;line-height:1.5;\">\n<strong>\n         When to use:\n        </strong>\n\
    \        Visualizing the distribution, spread, modality (number of peaks), and skewness of a single numerical variable\
    \ (e.g., distribution of Age, heights, house prices).\n       </p>\n<p style=\"font-size:13px;color:var(--text);margin:0.5rem\
    \ 0;line-height:1.5;\">\n<strong>\n         Basic Syntax:\n        </strong>\n\n         plt.hist(x, bins=None, range=None,\
    \ density=False, cumulative=False, color=None, edgecolor=None, log=False)\n\n</p>\n<div style=\"margin-top:0.8rem;\">\n\
    <strong style=\"font-size:12px;color:var(--muted);display:block;margin-bottom:0.4rem;\">\n         \U0001F4A1 Key Parameters:\n\
    \        </strong>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"\
    concept-table\">\n<thead>\n<tr>\n<th style=\"width:25%;\">\n            Parameter\n           </th>\n<th style=\"width:25%;\"\
    >\n            Type / Default\n           </th>\n<th style=\"width:50%;\">\n            Description &amp; Options\n  \
    \         </th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\">\n    \
    \        bins\n           </td>\n<td>\n            int or sequence\n           </td>\n<td>\n            Number of equal-width\
    \ bins (e.g.\n\n             30\n\n            ) or explicit bin edges (e.g.\n\n             [0, 18, 30, 50, 80]\n\n \
    \           ).\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\">\n      \
    \      density\n           </td>\n<td>\n            bool / False\n           </td>\n<td>\n            If\n\n         \
    \    True\n\n            , normalized to show probability density (area under hist sums to 1) instead of raw counts.\n\
    \           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\">\n            cumulative\n\
    \           </td>\n<td>\n            bool / False\n           </td>\n<td>\n            If\n\n             True\n\n   \
    \         , computes cumulative distribution (each bin contains count of itself plus all smaller bins).\n           </td>\n\
    </tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\">\n            edgecolor\n           </td>\n\
    <td>\n            str / None\n           </td>\n<td>\n            Border color between bins (e.g.\n\n             'white'\n\
    \n            ). Essential to keep bins visually separate.\n           </td>\n</tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\"\
    >\n            orientation\n           </td>\n<td>\n            str / 'vertical'\n           </td>\n<td>\n           \
    \ Renders as\n\n             'vertical'\n\n            or\n\n             'horizontal'\n\n            .\n           </td>\n\
    </tr>\n<tr>\n<td style=\"font-family:var(--font-mono);color:var(--blue);\">\n            log\n           </td>\n<td>\n\
    \            bool / False\n           </td>\n<td>\n            If\n\n             True\n\n            , sets y-axis to\
    \ log scale. Very useful if a few bins dominate (e.g., highly skewed Fare data).\n           </td>\n</tr>\n</tbody>\n\
    </table></div>\n</div>\n</div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\
    \ — histogram.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n \
    \         copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n\
    \          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> matplotlib.pyplot <span class=\"\
    kw\">as</span> plt\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\nnp.random.<span class=\"\
    fn\">seed</span>(<span class=\"num\">42</span>)\nscores_a = np.random.<span class=\"fn\">normal</span>(<span class=\"\
    num\">65</span>, <span class=\"num\">12</span>, <span class=\"num\">500</span>)\nscores_b = np.random.<span class=\"fn\"\
    >normal</span>(<span class=\"num\">78</span>, <span class=\"num\">8</span>,  <span class=\"num\">500</span>)\n\nplt.<span\
    \ class=\"fn\">figure</span>(figsize=(<span class=\"num\">10</span>, <span class=\"num\">5</span>))\n\n<span class=\"\
    cm\"># ── Overlapping histograms ──</span>\nplt.<span class=\"fn\">hist</span>(scores_a, bins=<span class=\"num\">30</span>,\
    \ color=<span class=\"str\">'#6c8cff'</span>, alpha=<span class=\"num\">0.6</span>, label=<span class=\"str\">'Class A'</span>)\n\
    plt.<span class=\"fn\">hist</span>(scores_b, bins=<span class=\"num\">30</span>, color=<span class=\"str\">'#4fd1a5'</span>,\
    \ alpha=<span class=\"num\">0.6</span>, label=<span class=\"str\">'Class B'</span>)\n\n<span class=\"cm\"># ── Mean vertical\
    \ reference lines ──</span>\nplt.<span class=\"fn\">axvline</span>(scores_a.<span class=\"fn\">mean</span>(), color=<span\
    \ class=\"str\">'#4488ff'</span>, linestyle=<span class=\"str\">'--'</span>, lw=<span class=\"num\">2</span>,\n      \
    \      label=<span class=\"str\">f'A mean={scores_a.mean():.1f}'</span>)\nplt.<span class=\"fn\">axvline</span>(scores_b.<span\
    \ class=\"fn\">mean</span>(), color=<span class=\"str\">'#22bb88'</span>, linestyle=<span class=\"str\">'--'</span>, lw=<span\
    \ class=\"num\">2</span>,\n            label=<span class=\"str\">f'B mean={scores_b.mean():.1f}'</span>)\n\nplt.<span\
    \ class=\"fn\">title</span>(<span class=\"str\">'Exam Score Distribution — Class A vs B'</span>)\nplt.<span class=\"fn\"\
    >xlabel</span>(<span class=\"str\">'Score'</span>); plt.<span class=\"fn\">ylabel</span>(<span class=\"str\">'Frequency'</span>)\n\
    plt.<span class=\"fn\">legend</span>(); plt.<span class=\"fn\">grid</span>(alpha=<span class=\"num\">0.2</span>)\nplt.<span\
    \ class=\"fn\">tight_layout</span>(); plt.<span class=\"fn\">savefig</span>(<span class=\"str\">'histogram.png'</span>,\
    \ dpi=<span class=\"num\">150</span>); plt.<span class=\"fn\">show</span>()\n\n<span class=\"cm\"># ── Key histogram options\
    \ ──</span>\n<span class=\"cm\"># bins=30       → more bins = finer detail. Try 10, 20, 50</span>\n<span class=\"cm\"\
    ># density=True  → normalize y-axis to probability (sums to 1.0)</span>\n<span class=\"cm\"># histtype='step'  → outline\
    \ only, no fill (good for 3+ overlapping)</span>\n<span class=\"cm\"># cumulative=True  → CDF (cumulative distribution)</span>\n\
    <span class=\"cm\"># edgecolor='white' → add borders between bars</span></pre>\n</div><!-- truncated for size -->\n<div\
    \ class=\"bonus-deep-dive\" style=\"background:var(--bg3); border-left:4px solid var(--accent); padding:1.2rem; border-radius:8px;\
    \ margin:1.5rem 0;\">\n<h3 class=\"sh3\" style=\"color:var(--accent); margin-top:0;\">\U0001F381 Senior Engineer Bonus:\
    \ Out-of-Core Processing with Polars & DuckDB</h3>\n<p>\nWhile Pandas loads entire tables eagerly into RAM with high object-pointer\
    \ overhead, production ML pipelines handle <strong>50GB–1TB datasets</strong> on single developer workstations using modern\
    \ out-of-core columnar query engines:\n</p>\n<ul>\n  <li><strong>Polars</strong>: Written in Rust on Apache Arrow memory\
    \ layouts. Uses <em>LazyFrame</em> query graphs with automatic predicate pushdown and multi-threaded parallel execution.</li>\n\
    \  <li><strong>DuckDB</strong>: In-process analytical SQL engine executing vectorized queries directly on partitioned\
    \ disk Parquet files without loading full tables into RAM.</li>\n</ul>\n<div class=\"cb\">\n<div class=\"cb-head\"><span\
    \ class=\"cb-lang\">python — polars_and_duckdb.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >copy</button><button class=\"run-btn\" onclick=\"runCode(this)\">Run</button></div></div>\n<pre><code><span class=\"\
    kw\">import</span> polars <span class=\"kw\">as</span> pl\n<span class=\"kw\">import</span> duckdb\n\n<span class=\"cm\"\
    ># 1. Polars Lazy Execution Graph (zero memory allocated until collect)</span>\nq = (\n    pl.<span class=\"fn\">scan_parquet</span>(<span\
    \ class=\"str\">\"large_dataset.parquet\"</span>)\n    .<span class=\"fn\">filter</span>(pl.<span class=\"fn\">col</span>(<span\
    \ class=\"str\">\"age\"</span>) > <span class=\"num\">25</span>)\n    .<span class=\"fn\">group_by</span>(<span class=\"\
    str\">\"country\"</span>)\n    .<span class=\"fn\">agg</span>(pl.<span class=\"fn\">col</span>(<span class=\"str\">\"\
    income\"</span>).<span class=\"fn\">mean</span>().<span class=\"fn\">alias</span>(<span class=\"str\">\"avg_income\"</span>))\n\
    )\n<span class=\"cm\"># Explain optimized query plan without execution:</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Polars Query Plan:\"</span>, q.<span class=\"fn\">explain</span>())\n\n<span class=\"cm\"># 2. DuckDB\
