      <li style="margin-bottom: 0.4rem;">
      <strong>
                   (1)
                  </strong>
                  Plot histogram of SalePrice — note the skewness
                 </li>
      <li style="margin-bottom: 0.4rem;">
      <strong>
                   (2)
                  </strong>
                  Apply np.log1p() transformation
                 </li>
      <li style="margin-bottom: 0.4rem;">
      <strong>
                   (3)
                  </strong>
                  Plot histogram of log-transformed prices
                 </li>
      <li style="margin-bottom: 0.4rem;">
