    baad woh publication-quality lagte hain.
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n          <h3 class=\"sh3\">\n       0. Setup — Always\
    \ Start With Theme\n      </h3>\n\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\
    \ — seaborn_setup.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> seaborn <span class=\"kw\"\
    >as</span> sns\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"kw\"\
    >import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
    \ np\n\n<span class=\"cm\"># ── Set theme ONCE at top — affects all charts ──</span>\nsns.<span class=\"fn\">set_theme</span>(style=<span\
    \ class=\"str\">'darkgrid'</span>)    <span class=\"cm\"># dark background with grid</span>\n<span class=\"cm\"># style\
    \ options: 'darkgrid', 'whitegrid', 'dark', 'white', 'ticks'</span>\n\nsns.<span class=\"fn\">set_palette</span>(<span\
    \ class=\"str\">'husl'</span>)             <span class=\"cm\"># beautiful color palette</span>\n<span class=\"cm\"># palette\
    \ options: 'husl', 'Set2', 'coolwarm', 'muted', 'deep'</span>\n\n<span class=\"cm\"># ── Load built-in datasets (no file\
    \ needed!) ──</span>\ndf_titanic = sns.<span class=\"fn\">load_dataset</span>(<span class=\"str\">'titanic'</span>)  \
    \  <span class=\"cm\"># 891 rows, 15 cols</span>\ndf_iris    = sns.<span class=\"fn\">load_dataset</span>(<span class=\"\
    str\">'iris'</span>)       <span class=\"cm\"># 150 rows, 5 cols, 3 species</span>\ndf_tips    = sns.<span class=\"fn\"\
    >load_dataset</span>(<span class=\"str\">'tips'</span>)       <span class=\"cm\"># 244 rows, restaurant tips</span>\n\
    df_penguins= sns.<span class=\"fn\">load_dataset</span>(<span class=\"str\">'penguins'</span>)  <span class=\"cm\"># 344\
    \ rows, 3 species</span>\n\n<span class=\"fn\">print</span>(df_titanic.shape)   <span class=\"cm\"># (891, 15)</span>\n\
    <span class=\"fn\">print</span>(df_titanic.columns.<span class=\"fn\">tolist</span>())</pre>\n</div>\n<!-- ─── CORRELATION\
    \ HEATMAP ─── -->\n<h3 class=\"sh3\">0b. Seaborn vs. Matplotlib — Core Plot Equivalents & Upgrades</h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\nSeaborn directly elevates standard Matplotlib chart types\
    \ by automating multi-dimensional grouping (<code>hue</code>, <code>style</code>, <code>size</code>), statistical aggregation\
    \ (mean, confidence intervals), and color palette mapping in concise one-liners.\n</p>\n<div class=\"table-wrap\" style=\"\
    overflow-x: auto; margin: 1.2rem 0; width: 100%;\">\n<table class=\"concept-table\">\n<tr><th>Chart Type</th><th>Matplotlib\
    \ Syntax (Manual)</th><th>Seaborn Equivalent (High-Level)</th><th>Key Seaborn Advantage</th></tr>\n<tr><td><strong>Scatter\
    \ Plot</strong></td><td><code>plt.scatter(x, y, c=cat)</code></td><td><code>sns.scatterplot(data=df, x='x', y='y', hue='cat',\
    \ size='num')</code></td><td>Automatic categorical legend & multi-attribute sizing</td></tr>\n<tr><td><strong>Line Plot</strong></td><td><code>plt.plot(x,\
    \ y)</code></td><td><code>sns.lineplot(data=df, x='time', y='val', errorbar='ci')</code></td><td>Auto-aggregates duplicate\
    \ x-values with 95% bootstrap CI band</td></tr>\n<tr><td><strong>Bar Chart</strong></td><td><code>plt.bar(cats, heights)</code></td><td><code>sns.barplot(data=df,\
    \ x='cat', y='val', estimator='mean')</code></td><td>Computes group mean and error bars automatically from raw rows</td></tr>\n\
    <tr><td><strong>Histogram / KDE</strong></td><td><code>plt.hist(x, bins=30)</code></td><td><code>sns.histplot(data=df,\
    \ x='val', kde=True, hue='group')</code></td><td>Combined density curve + stacked/overlaid multi-group distributions</td></tr>\n\
    </table>\n</div>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — seaborn_core_plots.py</span><div\
    \ class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button><button class=\"run-btn\" onclick=\"\
    runCode(this)\" style=\"margin-left: 4px;\">Run</button></div></div>\n<pre><code><span class=\"kw\">import</span> seaborn\
    \ <span class=\"kw\">as</span> sns\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\
    \ndf = sns.<span class=\"fn\">load_dataset</span>(<span class=\"str\">'penguins'</span>)\nsns.<span class=\"fn\">set_theme</span>(style=<span\
    \ class=\"str\">'darkgrid'</span>)\n\nfig, axes = plt.<span class=\"fn\">subplots</span>(<span class=\"num\">2</span>,\
