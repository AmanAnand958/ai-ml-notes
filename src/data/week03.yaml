    num\">500000</span>])  <span class=\"cm\"># 500k is outlier</span>\n\n<span class=\"\
    cm\"># --- Method 1: IQR Method (most common) ---</span>\nQ1 = salaries.<span\
    \ class=\"fn\">quantile</span>(<span class=\"num\">0.25</span>)   <span class=\"\
    cm\"># 25th percentile</span>\nQ3 = salaries.<span class=\"fn\">quantile</span>(<span\
    \ class=\"num\">0.75</span>)   <span class=\"cm\"># 75th percentile</span>\nIQR\
    \ = Q3 - Q1\n\nlower = Q1 - <span class=\"num\">1.5</span> * IQR\nupper = Q3 +\
    \ <span class=\"num\">1.5</span> * IQR\n\noutliers = salaries[(salaries &lt; lower)\
    \ | (salaries &gt; upper)]\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"Outliers detected: {outliers.tolist()}\"</span>)  <span class=\"cm\"># [500000]</span>\n\
    \n<span class=\"cm\"># Remove outliers</span>\nclean = salaries[(salaries &gt;=\
