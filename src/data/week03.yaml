    desc: Statistical data visualization guide and gallery.
    url: https://seaborn.pydata.org/tutorial.html
  - type: DOCS
    title: 📖 Official Python 3 Documentation
    desc: Core Python data structures, standard library, and runtime semantics.
    url: https://docs.python.org/3/tutorial/datastructures.html
- id: '16'
  day_num: 16
  title: Encoding Categorical Variables
  subtitle: ML models sirf numbers samajhte hain — "Male" ya "Delhi" nahi.
  time_estimate: 4 hours
  difficulty: Beginner
  badges:
  - label: ⚡ Beginner
    variant: b
  xp: 150
  objectives:
  - Distinguish between nominal and ordinal categorical variables
  - Apply Label Encoding, One-Hot Encoding, and Ordinal Encoding correctly
  - Understand Target Encoding and when it's useful
  - Explain why Label Encoding on nominal data is dangerous
  - Handle high-cardinality categorical columns (100+ categories)
  checklist:
  - id: chk_16_1
    text: 'Master core theory: Distinguish between nominal and ordinal categorical
      variables'
  - id: chk_16_2
    text: 'Build hands-on pipeline: Apply Label Encoding, One-Hot Encoding, and Ordinal
      Encoding correctly'
  - id: chk_16_3
    text: Complete Encode the Titanic Dataset and verify passing tests
  - id: chk_16_4
    text: Pass daily interactive quiz and review active recall flashcards
  concept_flow:
  - Handling Missing Data — D
  - Encoding Categorical Vari
  - Feature Scaling + Outlier
  - Matplotlib — Every Import
  - Seaborn — Every Important
  - Feature Engineering Basic
  - Full Preprocessing + Visu
  hinglish: Box plots outliers dikhate hain visually — IQR se 1.5x zyada door jo points
    hain wo outliers hain. Inhe handle karna — winsorize ya remove — important decision
    hai.
  analogy: "Cricket batting positions (Opener=1, Middle=2, Finisher=3) ka encoding\
    \ theek hai kyunki order matter karta hai.\n       <br/>\n<br/>\n       Lekin\
    \ agar cities ko encode karein (Delhi=1, Mumbai=2, Chennai=3), model sochega Mumbai\
    \ aur Delhi ke beech ka average Chennai hai!\n       <br/>\n<br/>\n       Yeh\
    \ bilkul galat hai — cities ke beech koi order nahi hota."
  theory_html: "<h3 class=\"sh3\">\n       1. Why Encoding Matters\n      </h3>\n\n\
    <p>\n       Categorical variables come in two flavours.\n      </p>\n<p>\n<strong>\n\
    \        Nominal\n       </strong>\n       : no natural order (color, city, gender).\n\
    \      </p>\n<p>\n<strong>\n        Ordinal\n       </strong>\n       : a natural\
    \ order exists (small/medium/large, poor/average/good).\n      </p>\n<p>\n   \
    \    The choice of encoding depends entirely on this distinction.\n      </p>\n\
    <div class=\"ml-connect\">\n       Tree-based models (Decision Tree, Random Forest,\
    \ XGBoost) can handle Label Encoding on nominals because they split on values\
    \ rather than assuming order.\n       <br/>\n<br/>\n       But linear models (Linear\
    \ Regression, Logistic Regression, SVM) absolutely require proper One-Hot Encoding\
    \ for nominal features — they assume numeric order matters.\n      </div>\n<h3\
    \ class=\"sh3\">\n       2. Label Encoding — For Ordinal Data Only\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       Label encoding converts categorical strings into sequential integers,\
    \ suitable only for categories with a natural mathematical order.\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — label_encoding.py\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"run-btn\" onclick=\"openRepl()\">\n          ▶ try online\n        \
    \ </button>\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n        \
    \  copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span>\
    \ LabelEncoder\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span>\
    \ pd\n\n<span class=\"cm\"># GOOD USE: Ordinal data — order matters</span>\ndf\
    \ = pd.<span class=\"fn\">DataFrame</span>({<span class=\"str\">'education'</span>:\
    \ [<span class=\"str\">'High School'</span>, <span class=\"str\">'Bachelor'</span>,\
    \ <span class=\"str\">'Master'</span>, <span class=\"str\">'PhD'</span>]})\nedu_order\
    \ = {<span class=\"str\">'High School'</span>: <span class=\"num\">0</span>, <span\
    \ class=\"str\">'Bachelor'</span>: <span class=\"num\">1</span>, <span class=\"\
    str\">'Master'</span>: <span class=\"num\">2</span>, <span class=\"str\">'PhD'</span>:\
    \ <span class=\"num\">3</span>}\ndf[<span class=\"str\">'education_encoded'</span>]\
    \ = df[<span class=\"str\">'education'</span>].<span class=\"fn\">map</span>(edu_order)\n\
    <span class=\"fn\">print</span>(df)\n<span class=\"cm\"># education  education_encoded</span>\n\
    <span class=\"cm\"># High School  0   ← less education</span>\n<span class=\"\
    cm\"># Bachelor     1</span>\n<span class=\"cm\"># Master       2</span>\n<span\
    \ class=\"cm\"># PhD          3   ← most education (order preserved!)</span>\n\
    \n<span class=\"cm\"># BAD USE: Nominal data — DO NOT use LabelEncoder here</span>\n\
    le = <span class=\"fn\">LabelEncoder</span>()\ndf[<span class=\"str\">'city'</span>]\
    \ = [<span class=\"str\">'Delhi'</span>, <span class=\"str\">'Mumbai'</span>,\
    \ <span class=\"str\">'Chennai'</span>]\ndf[<span class=\"str\">'city_encoded'</span>]\
    \ = le.<span class=\"fn\">fit_transform</span>(df[<span class=\"str\">'city'</span>])\n\
    <span class=\"cm\"># Chennai=0, Delhi=1, Mumbai=2  ← WRONG: implies Delhi is between\
    \ Chennai &amp; Mumbai!</span></pre>\n</div>\n<h3 class=\"sh3\">\n       3. One-Hot\
    \ Encoding — For Nominal Data\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       One-hot encoding creates separate\
    \ binary columns for each categorical value, preventing models from assuming ordinal\
    \ relationships between nominal tags.\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         python — one_hot_encoding.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> pandas\
    \ <span class=\"kw\">as</span> pd\n<span class=\"kw\">from</span> sklearn.preprocessing\
    \ <span class=\"kw\">import</span> OneHotEncoder\n\ndf = pd.<span class=\"fn\"\
    >DataFrame</span>({<span class=\"str\">'city'</span>: [<span class=\"str\">'Delhi'</span>,\
    \ <span class=\"str\">'Mumbai'</span>, <span class=\"str\">'Chennai'</span>, <span\
    \ class=\"str\">'Delhi'</span>]})\n\n<span class=\"cm\"># Method 1: pd.get_dummies\
    \ (quick and easy)</span>\ndummies = pd.<span class=\"fn\">get_dummies</span>(df[<span\
    \ class=\"str\">'city'</span>], prefix=<span class=\"str\">'city'</span>)\n<span\
    \ class=\"fn\">print</span>(dummies)\n<span class=\"cm\"># city_Chennai  city_Delhi\
    \  city_Mumbai</span>\n<span class=\"cm\">#     0              1           0 \
    \      ← Delhi row</span>\n<span class=\"cm\">#     0              0         \
    \  1       ← Mumbai row</span>\n<span class=\"cm\">#     1              0    \
    \       0       ← Chennai row</span>\n\n<span class=\"cm\"># IMPORTANT: drop_first=True\
    \ to avoid \"dummy variable trap\"</span>\ndummies = pd.<span class=\"fn\">get_dummies</span>(df[<span\
    \ class=\"str\">'city'</span>], prefix=<span class=\"str\">'city'</span>, drop_first=<span\
    \ class=\"kw\">True</span>)\n<span class=\"cm\"># Removes one column (it's redundant\
    \ — if not Delhi and not Mumbai, must be Chennai)</span>\n\n<span class=\"cm\"\
    ># Method 2: sklearn OneHotEncoder (better for pipelines)</span>\nohe = <span\
    \ class=\"fn\">OneHotEncoder</span>(drop=<span class=\"str\">'first'</span>, sparse_output=<span\
    \ class=\"kw\">False</span>)\nencoded = ohe.<span class=\"fn\">fit_transform</span>(df[[<span\
    \ class=\"str\">'city'</span>]])\n<span class=\"fn\">print</span>(encoded)\n<span\
    \ class=\"fn\">print</span>(ohe.<span class=\"fn\">get_feature_names_out</span>())</pre>\n\
    </div>\n<div style=\"background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem\
    \ 0;\">\n<strong style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\"\
    >\n        \U0001F4CA Visualizing Encoding Mechanisms\n       </strong>\n<canvas\
    \ height=\"200\" id=\"canvas-encoding16\" style=\"width:100%;max-max-width: 100%;\
    \ width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0 auto;\"\
    \ width=\"560\">\n</canvas>\n<script>\n        (function(){\n  var c=document.getElementById('canvas-encoding16');if(!c)return;\n\
    \  var ctx=c.getContext('2d');var W=c.width,H=c.height;\n  ctx.fillStyle='#1a1d27';ctx.fillRect(0,0,W,H);\n\
    \  \n  ctx.fillStyle='#ffffff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';\n\
    \  ctx.fillText('Raw Categorical', 80, 25);\n  var raw = ['Delhi', 'Mumbai', 'Chennai',\
    \ 'Delhi'];\n  for(var i=0;i<4;i++){\n    ctx.fillStyle='#2d3142';\n    ctx.fillRect(30,\
    \ 45+i*32, 100, 26);\n    ctx.strokeStyle='#3e445b';\n    ctx.strokeRect(30, 45+i*32,\
    \ 100, 26);\n    ctx.fillStyle='#ffffff';ctx.font='11px monospace';ctx.fillText(raw[i],\
    \ 80, 62+i*32);\n  }\n  \n  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;\n\
    \  ctx.beginPath();\n  ctx.moveTo(140, 100);ctx.lineTo(190, 65);\n  ctx.moveTo(140,\
    \ 100);ctx.lineTo(190, 135);\n  ctx.stroke();\n  \n  ctx.fillStyle='#ffffff';ctx.font='bold\
    \ 11px sans-serif';\n  ctx.fillText('Label Encoding', 260, 25);\n  var le = [0,\
    \ 1, 2, 0];\n  for(var i=0;i<4;i++){\n    ctx.fillStyle='#2b5c8f';\n    ctx.fillRect(220,\
    \ 45+i*32, 80, 26);\n    ctx.fillStyle='#ffffff';ctx.font='11px monospace';ctx.fillText(le[i].toString(),\
    \ 260, 62+i*32);\n  }\n  \n  ctx.fillStyle='#ffffff';ctx.font='bold 11px sans-serif';\n\
    \  ctx.fillText('One-Hot (drop_first=True)', 450, 25);\n  var ohe = [[1, 0], [0,\
    \ 1], [0, 0], [1, 0]];\n  var headers = ['is_Delhi', 'is_Mumbai'];\n  for(var\
    \ j=0;j<2;j++){\n    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='9px monospace';\n\
    \    ctx.fillText(headers[j], 400+j*100, 40);\n  }\n  for(var i=0;i<4;i++){\n\
    \    for(var j=0;j<2;j++){\n      ctx.fillStyle=ohe[i][j]===1?'#4fd1a5':'#2d3142';\n\
    \      ctx.fillRect(360+j*100, 45+i*32, 80, 26);\n      ctx.strokeStyle='#3e445b';\n\
    \      ctx.strokeRect(360+j*100, 45+i*32, 80, 26);\n      ctx.fillStyle='#ffffff';ctx.font='11px\
    \ monospace';ctx.fillText(ohe[i][j].toString(), 400+j*100, 62+i*32);\n    }\n\
    \  }\n})();\n       </script>\n</div>\n<h3 class=\"sh3\">\n       4. Target Encoding\
    \ — For High-Cardinality Columns\n      </h3>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         python — target_encoding.py\n \
    \       </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> pandas\
    \ <span class=\"kw\">as</span> pd\n\n<span class=\"cm\"># Problem: 500 cities\
    \ → One-Hot creates 499 columns (too many!)</span>\n<span class=\"cm\"># Solution:\
    \ replace each city with its MEAN TARGET VALUE</span>\n\ndf = pd.<span class=\"\
    fn\">DataFrame</span>({\n    <span class=\"str\">'city'</span>: [<span class=\"\
    str\">'Delhi'</span>, <span class=\"str\">'Mumbai'</span>, <span class=\"str\"\
    >'Delhi'</span>, <span class=\"str\">'Mumbai'</span>, <span class=\"str\">'Chennai'</span>],\n\
    \    <span class=\"str\">'churned'</span>: [<span class=\"num\">1</span>, <span\
    \ class=\"num\">0</span>, <span class=\"num\">1</span>, <span class=\"num\">0</span>,\
    \ <span class=\"num\">1</span>]   <span class=\"cm\"># target variable</span>\n\
    })\n\n<span class=\"cm\"># Method 1: Manual Target Encoding (risky for data leakage)</span>\n\
    city_target_mean = df.<span class=\"fn\">groupby</span>(<span class=\"str\">'city'</span>)[<span\
    \ class=\"str\">'churned'</span>].<span class=\"fn\">mean</span>()\ndf[<span class=\"\
    str\">'city_encoded'</span>] = df[<span class=\"str\">'city'</span>].<span class=\"\
    fn\">map</span>(city_target_mean)\n\n<span class=\"cm\"># Method 2: category_encoders\
    \ library (Industry Standard, prevents leakage)</span>\n<span class=\"kw\">import</span>\
    \ category_encoders <span class=\"kw\">as</span> ce\nencoder = ce.<span class=\"\
    fn\">TargetEncoder</span>(cols=[<span class=\"str\">'city'</span>])\n<span class=\"\
    cm\"># Fit on training data ONLY</span>\ndf[<span class=\"str\">'city_ce_encoded'</span>]\
    \ = encoder.<span class=\"fn\">fit_transform</span>(df[<span class=\"str\">'city'</span>],\
    \ df[<span class=\"str\">'churned'</span>])\n<span class=\"fn\">print</span>(df[[<span\
    \ class=\"str\">'city'</span>, <span class=\"str\">'city_encoded'</span>]])\n\
    <span class=\"cm\"># Delhi   → 1.0 (both Delhi rows churned)</span>\n<span class=\"\
    cm\"># Mumbai  → 0.0 (neither Mumbai row churned)</span>\n<span class=\"cm\">#\
    \ Chennai → 1.0 (churned)</span>\n\n<span class=\"cm\"># ⚠️ Always compute target\
    \ mean on TRAINING set only (leakage risk!)</span></pre>\n</div>\n<div style=\"\
    background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin:1rem\
    \ 0;\">\n<strong style=\"color:var(--blue);font-size:13px;display:block;margin-bottom:0.5rem;\"\
    >\n        \U0001F4CA Visualizing Target Encoding Calculation\n       </strong>\n\
    <canvas height=\"200\" id=\"canvas-target-encoding16\" style=\"width:100%;max-max-width:\
    \ 100%; width: 100%;background:#1a1d27;border-radius:6px;display:block;margin:0\
    \ auto;\" width=\"560\">\n</canvas>\n<script>\n        (function(){\n  var c=document.getElementById('canvas-target-encoding16');if(!c)return;\n\
    \  var ctx=c.getContext('2d');var W=c.width,H=c.height;\n  ctx.fillStyle='#1a1d27';ctx.fillRect(0,0,W,H);\n\
    \  \n  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='bold 10px monospace';ctx.textAlign='center';\n\
    \  ctx.fillText('CITY (Feature)', 80, 25);\n  ctx.fillText('CHURNED (Target)',\
    \ 260, 25);\n  ctx.fillText('TARGET ENCODED (Result)', 460, 25);\n  \n  var rows\
    \ = [\n    {city: 'Delhi', target: 1},\n    {city: 'Mumbai', target: 0},\n   \
    \ {city: 'Delhi', target: 1},\n    {city: 'Mumbai', target: 0},\n    {city: 'Chennai',\
    \ target: 1}\n  ];\n  \n  var y_start = 50;\n  var y_gap = 26;\n  \n  for(var\
    \ i=0; i<5; i++) {\n    ctx.fillStyle='#2d3142';ctx.fillRect(35, y_start+i*y_gap,\
    \ 90, 20);\n    ctx.strokeStyle='#3e445b';ctx.strokeRect(35, y_start+i*y_gap,\
    \ 90, 20);\n    ctx.fillStyle='#ffffff';ctx.font='10px monospace';ctx.fillText(rows[i].city,\
    \ 80, y_start+i*y_gap+13);\n    \n    ctx.fillStyle=rows[i].target === 1 ? '#d81159'\
    \ : '#218380';\n    ctx.fillRect(225, y_start+i*y_gap, 70, 20);\n    ctx.fillStyle='#ffffff';ctx.fillText(rows[i].target.toString(),\
    \ 260, y_start+i*y_gap+13);\n  }\n  \n  var encVals = [1.0, 0.0, 1.0, 0.0, 1.0];\n\
    \  var encColors = ['#ffbc42', '#73d2de', '#ffbc42', '#73d2de', '#ffbc42'];\n\
    \  \n  for(var i=0; i<5; i++) {\n    ctx.fillStyle=encColors[i];\n    ctx.fillRect(405,\
    \ y_start+i*y_gap, 110, 20);\n    ctx.fillStyle='#1a1d27';ctx.font='bold 10px\
    \ monospace';ctx.fillText(encVals[i].toFixed(1), 460, y_start+i*y_gap+13);\n \
    \   \n    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.setLineDash([2,\
    \ 2]);\n    ctx.beginPath();\n    ctx.moveTo(125, y_start+i*y_gap+10);\n    ctx.lineTo(225,\
    \ y_start+i*y_gap+10);\n    ctx.moveTo(295, y_start+i*y_gap+10);\n    ctx.lineTo(405,\
