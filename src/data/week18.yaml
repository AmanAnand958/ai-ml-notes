    solution_code: "# draw_system_flowchart.py — Solution\n# Complete solution for:\
      \ Draw System Flowchart\n\n# Add LangSmith Tracing to any LangChain/OpenAI application\n\
      # pip install langsmith langchain langchain-openai\n\nimport os\nos.environ[\"\
      LANGCHAIN_TRACING_V2\"] = \"true\"\nos.environ[\"LANGCHAIN_API_KEY\"] = \"your-langsmith-api-key\"\
      \nos.environ[\"LANGCHAIN_PROJECT\"] = \"rag-tracing-demo\"\n\nfrom langchain_openai\
      \ import ChatOpenAI\nfrom langchain_core.prompts import ChatPromptTemplate\n\
      from langsmith import traceable\n\n# Method 1: Automatic tracing with LangChain\n\
      llm = ChatOpenAI(model=\"gpt-4o-mini\", temperature=0)\nprompt = ChatPromptTemplate.from_messages([\n\
      \    (\"system\", \"You are a helpful AI tutor for ML concepts.\"),\n    (\"\
      user\", \"{question}\")\n])\nchain = prompt | llm\n\n# Every invocation is automatically\
      \ traced in LangSmith\nresponse = chain.invoke({\"question\": \"Explain LoRA\
      \ in simple terms\"})\nprint(response.content)\n\n# Method 2: Custom function\
      \ tracing with @traceable\n@traceable(name=\"custom_rag_pipeline\")\ndef rag_pipeline(query:\
      \ str) -> str:\n    \"\"\"Traced RAG pipeline — every step visible in LangSmith.\"\
      \"\"\n    # Step 1: Retrieve (would use vector DB in production)\n    retrieved_docs\
      \ = retrieve_docs(query)\n    \n    # Step 2: Generate\n    context = \"\\n\"\
      .join(retrieved_docs)\n    response = chain.invoke({\n        \"question\":\
      \ f\"Context: {context}\\n\\nQuestion: {query}\"\n    })\n    return response.content\n\
      \n@traceable(name=\"retrieve_docs\")\ndef retrieve_docs(query: str) -> list:\n\
      \    \"\"\"Simulated retrieval — replace with actual vector DB.\"\"\"\n    return\
      \ [\n        \"LoRA adds low-rank matrices to frozen weights.\",\n        \"\
      Rank r=16 is a common default for LoRA.\"\n    ]\n\nresult = rag_pipeline(\"\
      What rank should I use for LoRA?\")\nprint(f\"Answer: {result}\")\nprint(\"\
      Check LangSmith dashboard for full trace!\")\n\nif __name__ == '__main__':\n\
      \    solve()"
