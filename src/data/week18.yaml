    num_str: Question 1
    question: What is the primary role of a Kubernetes Service?
    options:
    - To compile neural networks for faster training.
    - To expose a set of pod replicas to the network and load balance traffic among them.
    - To store persistent training checkpoints.
    - Apply Dropout before Batch Normalization with learning rate > 1.0
    answer_idx: 1
