  - title: Configure GitHub Actions Pipeline
    badge: MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: |-
      <p><strong>
                Add a basic .github/workflows/main.yml file to your repo to automatically run black format checks and pytest suites on every push.
               </strong></p>
    done_when: When gitHub repository displays a green checkmark next to your latest commit, indicating a successful run.
    git_cmd: 'git add configure_github_actions_pipeline.py &amp;&amp; git commit -m "feat(day): day126: configure-github-actions-pipeline"'
    sol_id: sol-w18d126t2
    solution_title: ✅ COMPLETE SOLUTION — configure_github_actions_pipeline.py
    solution_code: |
      # Day 126 Task 2: GitHub Actions MLOps CI/CD Workflow
      GITHUB_ACTIONS_WORKFLOW = """name: MLOps Continuous Integration & Deployment

      on:
        push:
          branches: [ main ]
        pull_request:
          branches: [ main ]

      jobs:
        test:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install flake8 pytest httpx -r requirements.txt
            - name: Lint with flake8
              run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            - name: Run Test Suite
              run: pytest tests/ -v --maxfail=1
      """

      print("GitHub Actions MLOps Workflow Spec Verified.")
      assert "actions/checkout" in GITHUB_ACTIONS_WORKFLOW
      print("✓ GitHub Actions CI/CD pipeline verified.")
    solution_lang: python
