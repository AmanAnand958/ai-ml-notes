    <h3 class="sh3">Mathematical Formulation &amp; Performance Bounds</h3>
    <div class="math-block">
    $$ \text{PodAvailability} = \frac{\text{Uptime}}{\text{Uptime} + \text{Downtime}} \ge 1 - \left(\frac{1}{2}\right)^{\text{Replicas}} $$
    <p class="math-caption">High Availability probability scaling with Kubernetes replicas.</p>
    </div>
    <p>
    This optimization metric balances raw computational throughput against per-token GPU memory consumption and cluster financial cost.
    </p>
    <h3 class="sh3">Production Engineering Walkthrough: Kubernetes Basics for ML Deployments</h3>
    <p>
    The following production snippet demonstrates the foundational design pattern, error handling strategies, and telemetry hooks required when deploying <strong>Kubernetes Basics for ML Deployments</strong> in high-throughput enterprise systems:
    </p>
    <div class="cb">
    <div class="cb-head"><span class="cb-lang">python — production_kubernetes_pod_manager.py</span><div class="cb-btns"><button class="copy-btn" onclick="copyCode(this)">copy</button></div></div>
    <pre><code class="language-bash"># Day 125 — Production Kubernetes Pod Manager
    import subprocess, json, time, logging
    from typing import Dict, Any, Optional

    logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(message)s")
    logger = logging.getLogger("K8sPodManager")

    class KubernetesPodManager:
        """Production Kubernetes Pod lifecycle manager for ML workloads."""

        def __init__(self, namespace: str = "ml-serving", context: Optional[str] = None):
            self.namespace = namespace
            self.ctx_flag = ["--context", context] if context else []

        def _kubectl(self, *args: str) -&gt; Dict:
            cmd = ["kubectl", *self.ctx_flag, "-n", self.namespace, *args]
            result = subprocess.run(cmd, capture_output=True, text=True, timeout=30)
            if result.returncode != 0:
                raise RuntimeError(f"kubectl error: {result.stderr.strip()}")
            return json.loads(result.stdout) if result.stdout.strip().startswith(("{", "[")) else {"output": result.stdout.strip()}

        def get_pod_status(self, label_selector: str) -&gt; Dict[str, Any]:
            pods = self._kubectl("get", "pods", "-l", label_selector, "-o", "json")
            items = pods.get("items", [])
            return {
                "total":   len(items),
                "running": sum(1 for p in items if p["status"]["phase"] == "Running"),
                "pending": sum(1 for p in items if p["status"]["phase"] == "Pending"),
                "failed":  sum(1 for p in items if p["status"]["phase"] == "Failed"),
            }

        def rollout_restart(self, deployment_name: str) -&gt; str:
            result = self._kubectl("rollout", "restart", f"deployment/{deployment_name}")
            logger.info(f"Triggered rollout restart: {deployment_name}")
            return result.get("output", "")

        def wait_for_rollout(self, deployment_name: str, timeout_sec: int = 120) -&gt; bool:
            cmd = ["kubectl", *self.ctx_flag, "-n", self.namespace,
                   "rollout", "status", f"deployment/{deployment_name}", f"--timeout={timeout_sec}s"]
            result = subprocess.run(cmd, capture_output=True, text=True)
            success = result.returncode == 0
            logger.info(f"Rollout {'succeeded' if success else 'FAILED'}: {deployment_name}")
            return success

        def scale_deployment(self, name: str, replicas: int) -&gt; bool:
            self._kubectl("scale", f"deployment/{name}", f"--replicas={replicas}")
            logger.info(f"Scaled {name} to {replicas} replicas")
            return self.wait_for_rollout(name)

    if __name__ == "__main__":
        mgr = KubernetesPodManager(namespace="ml-serving")
        print("KubernetesPodManager ready — connects to active kubectl context")
        print("Ops: get_pod_status, rollout_restart, wait_for_rollout, scale_deployment")
        print("Test: kubectl get pods -l app=llm-api -n ml-serving")
    </code></pre>
    </div>
    <h3 class="sh3">Production Sizing &amp; Compute Allocation for ML Microservices</h3>
    <p>
    When moving from local development to production container orchestration, sizing CPU and RAM allocations requires analyzing peak inference concurrency ($C$), average batch size ($B$), and resident memory for model weights ($M_{\text{weights}}$):
    </p>
    <div class="math-block">
    $$\text{RAM}_{\text{Required}} = M_{\text{weights}} + \left( C \times \text{Payload}_{\text{size}} \right) + \text{Runtime}_{\text{Buffer}}$$
    </div>
    <p>
    In containerized runtimes (Docker/Kubernetes), failing to account for payload serialization buffer overhead leads to immediate <code>OOMKilled</code> (Exit Code 137) container restarts under sudden traffic bursts.
    </p>
