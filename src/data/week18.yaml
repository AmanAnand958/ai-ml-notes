  tasks:
  - title: Design ML System Architecture
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n         Draft a complete system design document for a real-time\
      \ product recommendation engine, covering data pipes, retrieval, ranking, and\
      \ monitoring.\n        </p>"
    done_when: The layout clearly details database choices, API endpoints, caching
