    solution_title: ✅ COMPLETE SOLUTION — compare_runs_in_mlflow_ui.py
    solution_code: |-
      import mlflow
      import pandas as pd

      client = mlflow.tracking.MlflowClient()
      experiment = client.get_experiment_by_name("Customer_Churn_Optimization")

      # Search all runs in the experiment
      runs = client.search_runs(
          experiment_ids=[experiment.experiment_id],
          filter_string="",
          order_by=["metrics.accuracy DESC", "metrics.f1_score DESC"],
          max_results=10
      )

      print(f"{'Run ID':<34} | {'Max Depth':<10} | {'N Est':<6} | {'Accuracy':<10} | {'F1-Score':<10}")
      print("─" * 80)
      for run in runs:
          run_id = run.info.run_id
          depth = run.data.params.get("max_depth", "N/A")
          n_est = run.data.params.get("n_estimators", "N/A")
          acc = run.data.metrics.get("accuracy", 0.0)
          f1 = run.data.metrics.get("f1_score", 0.0)
          print(f"{run_id:<34} | {depth:<10} | {n_est:<6} | {acc:<10.4f} | {f1:<10.4f}")

      best_run = runs[0]
      print(f"\n🏆 Best Champion Model Run ID: {best_run.info.run_id} (Accuracy: {best_run.data.metrics['accuracy']:.4f})")
      assert best_run is not None, "best_run should not be None"
    solution_lang: python
