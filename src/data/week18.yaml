  quizzes:
  - num_str: Q1 OF 1
    question: What is logged in MLflow as an 'Artifact'?
    qid: q127_1
    options:
    - letter: A
      text: The loss gradients calculated during backward pass.
      is_correct: false
    - letter: B
      text: Serialized model files, plots, images, and other binary outputs of a run.
      is_correct: true
    - letter: C
      text: The git history of the training script.
      is_correct: false
    - letter: D
      text: Apply Dropout before Batch Normalization with learning rate > 1.0
      is_correct: false
    correct_fb: ✅ Correct! Artifacts are persistent files (like .pkl files or loss
      curve PNGs) logged and saved in store backends during a run.
    wrong_fb: ❌ Metrics are scalar numbers. Artifacts are static files. Which one
      stores the serialized weights?
  - num_str: QUESTION 2 OF 4
    question: Why is experiment tracking critical during machine learning development?
    qid: q127_2
    options:
    - letter: A
      text: It records exact hyperparameters, code versions, metrics, and model artifacts,
        ensuring 100% reproducibility.
      is_correct: true
    - letter: B
      text: It replaces the need for unit tests.
      is_correct: false
    - letter: C
      text: It increases model training speed by 10x.
      is_correct: false
    - letter: D
      text: It automatically generates patent documentation.
      is_correct: false
    correct_fb: ✅ Correct! Experiment tracking provides systematic auditability across
      iterative training runs.
    wrong_fb: ❌ Incorrect. Tracking ensures that any model can be reliably reproduced
      from recorded parameters.
  - num_str: QUESTION 3 OF 4
    question: What is Data Drift (Covariate Shift) in deployed production models?
    qid: q127_3
    options:
    - letter: A
      text: When the statistical distribution of input features P(X) changes over
        time while the true relationship P(Y|X) remains constant.
      is_correct: true
    - letter: B
      text: When database cables get disconnected in the server room.
      is_correct: false
    - letter: C
      text: When model weight files get corrupted on disk.
      is_correct: false
    - letter: D
      text: When users change their account passwords.
      is_correct: false
    correct_fb: ✅ Correct! Covariate shift represents changes in input feature distributions
      over time.
    wrong_fb: ❌ Incorrect. Data drift occurs when production inputs diverge from training
      distributions.
  - num_str: QUESTION 4 OF 4
    question: What is the function of a Model Registry in production MLOps?
    qid: q127_4
    options:
    - letter: A
      text: It acts as a centralized model store governing versioning, review gates,
        and stage transitions (Staging -&gt; Production).
      is_correct: true
    - letter: B
      text: It is a legal registry for trademarking AI algorithms.
      is_correct: false
    - letter: C
      text: It converts Python scripts into C++ automatically.
      is_correct: false
    - letter: D
      text: It deletes older models after 7 days.
      is_correct: false
    correct_fb: ✅ Correct! Model registries provide governance, lineage, and lifecycle
      control for deployable artifacts.
    wrong_fb: ❌ Incorrect. Registries govern model validation, staging approvals,
      and production rollouts.
  flashcards:
  - front: What is MLflow Tracking?
    back: An API and UI for logging parameters, code versions, metrics, and output
      artifact files during machine learning experiment runs.
  - front: MLflow Autologging?
    back: One-line automated instrumentation (e.g. mlflow.sklearn.autolog()) that
      automatically logs model parameters, training metrics, and artifacts without
      manual log calls.
  - front: Experiment vs Run in MLflow?
    back: An Experiment is a logical collection of related Runs. A Run represents
      a single execution of machine learning code that logs specific parameters and
      metrics.
