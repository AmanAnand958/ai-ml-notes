- id: 130
  day_num: 130
  title: 'Capstone Part 3: API Wrapper & Containerization'
  subtitle: Wrap your core ML model pipeline inside a high-concurrency FastAPI async application and containerize it using multi-stage Dockerfiles.
  time_estimate: 6 hours
