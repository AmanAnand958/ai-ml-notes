  - qid: q125_4
    num_str: Question 4
    question: How does a Kubernetes Horizontal Pod Autoscaler (HPA) determine when to scale up?
    options:
    - By monitoring target metrics (e.g. CPU, RAM, or custom inference queue depth) against configured threshold targets.
    - By checking the time of day on the host machine.
    - By asking developers via email notification.
    - By calculating the number of files in the project folder.
    answer_idx: 0
    explanation: HPA dynamically adjusts replica counts based on observed metric utilization.
  flashcards:
  - front: What is a Kubernetes Pod?
    back: • The smallest deployable compute unit in K8s, containing one or more containers sharing network namespaces and
      storage volumes.
  - front: Deployment vs StatefulSet?
    back: • Deployments manage stateless replica pods (e.g. stateless ML APIs). StatefulSets manage stateful workloads requiring
      persistent identities (e. g. databases, vector stores).
  - front: Kubernetes Cluster IP vs NodePort vs LoadBalancer?
    back: '• ClusterIP: internal cluster only.<br/>• NodePort: exposes port on each node IP. LoadBalancer: provisions an external
      cloud load balancer to route traffic.'
  - front: What is a K8s Ingress Controller?
    back: • An API object that manages external access to services, typically HTTP/HTTPS routing, SSL termination, and host/path-based
      load balancing.
  gotcha:
    title: '⚠️ Gotcha: Missing Resource Requests Leading to Node OOM Kills'
    description: If you don't define `resources.requests` and `resources.limits` for memory and CPU in your ML Pod manifest,
      a single heavy batch prediction can consume all RAM on the node, causing the Linux OOM-killer to terminate the kubelet
      and crash the entire node.
