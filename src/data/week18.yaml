  hinglish: Trained model ko production mein expose karne ke liye hum FastAPI use karte hain. Pydantic request body validate karta hai, model memory mein load rehta hai aur multi-stage Dockerfile se 150MB ka lightweight production container banta hai.
  analogy: 'The API wrapper is like a pharmacy drive-thru: customers present valid prescriptions (Pydantic schemas), the pharmacist dispenses the exact dosage (model prediction), and the drive-thru operates 24/7 inside a secure booth (Docker container).'
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">1. FastAPI Asynchronous Architecture &amp; Pydantic Contracts</h3>\n<p>\nFastAPI leverages Python's <code>asyncio</code> event loop and Starlette core to handle thousands of concurrent requests with minimal overhead. Strict input/output validation contracts defined via Pydantic prevent malformed payloads from reaching model inference routines.\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — app/schemas.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\">from pydantic import BaseModel, Field, validator\nfrom typing import List\n\nclass PredictionInput(BaseModel):\n    account_age_days: int = Field(..., ge=0, description=\"Age of user account in days\")\n    transaction_amount_usd: float = Field(..., gt=0.0, description=\"Transaction value in USD\")\n    country_code: str\
    \ = Field(..., min_length=2, max_length=3)\n    is_foreign_ip: bool\n\n    @validator('country_code')\n    def uppercase_country(cls, v):\n        return v.upper()\n\nclass PredictionOutput(BaseModel):\n    fraud_probability: float = Field(..., ge=0.0, le=1.0)\n    decision: str\n    model_version: str</code></pre>\n</div>\n<h3 class=\"sh3\">2. Non-Blocking Prediction Route with Process Pools</h3>\n<p>\nCPU-bound inference (e.g. matrix multiplications in Scikit-Learn or PyTorch) blocks the asynchronous event loop if invoked directly inside an <code>async def</code> route. Offload computation to an execution pool using <code>run_in_threadpool</code>:\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — app/routes.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\">from fastapi import APIRouter\nfrom fastapi.concurrency import run_in_threadpool\nfrom app.schemas\
    \ import PredictionInput, PredictionOutput\nimport pandas as pd\n\nrouter = APIRouter()\n\ndef sync_predict(pipeline, df: pd.DataFrame) -&gt; float:\n    # CPU-bound Scikit-Learn inference\n    proba = pipeline.predict_proba(df)[0, 1]\n    return float(proba)\n\n@router.post(\"/predict\", response_model=PredictionOutput)\nasync def predict_fraud(payload: PredictionInput):\n    df = pd.DataFrame([payload.dict()])\n    # Execute CPU task without stalling async event loop\n    score = await run_in_threadpool(sync_predict, ModelContainer.model, df)\n    \n    decision = \"FLAG_FRAUD\" if score &gt;= 0.75 else \"APPROVE\"\n    return PredictionOutput(\n        fraud_probability=round(score, 4),\n        decision=decision,\n        model_version=\"v1.2.0\"\n    )</code></pre>\n</div>\n<h3 class=\"sh3\">Engineering Decision Matrix: General Production Trade-offs</h3>\n<div style=\"overflow-x:auto;\">\n<table style=\"width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px; text-align:left;\"\
    >\n<thead>\n<tr style=\"border-bottom:2px solid var(--border); background:var(--bg-secondary);\">\n<th style=\"padding:10px;\">Architecture Strategy</th>\n<th style=\"padding:10px;\">Upfront Cost</th>\n<th style=\"padding:10px;\">Maintenance</th>\n<th style=\"padding:10px;\">Scalability</th>\n<th style=\"padding:10px;\">Time-to-Market</th>\n</tr>\n</thead>\n<tbody>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Monolithic MVP</strong></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span> (Initially)</td>\n<td style=\"padding:10px;\">Poor</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Fast</span> (&lt; 1 week)</td>\n</tr>\n<tr onmouseout=\"this.style.background='transparent'\"\
    \ onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Microservices</strong></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--orange);\">High</span></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--orange);\">High</span></td>\n<td style=\"padding:10px;\">Excellent</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--red);\">Slow</span> (Months)</td>\n</tr>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Serverless Functions</strong></td>\n<td style=\"padding:10px;\">Medium</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span></td>\n<td style=\"padding:10px;\">Infinite</td>\n<td style=\"padding:10px;\">Medium</td>\n</tr>\n</tbody>\n\
    </table>\n</div>\n<h3 class=\"sh3\">Mathematical Formulation &amp; Performance Bounds</h3>\n<div class=\"math-block\">\n$$ \\text{Throughput} = \\frac{C \\cdot \\text{BatchSize}}{\\text{Latency}_{avg}} \\quad \\text{where } C \\text{ is concurrent workers.} $$\n<p class=\"math-caption\">Theoretical maximum throughput for a FastAPI + Uvicorn worker architecture.</p>\n</div>\n<p>\nThis optimization metric balances raw computational throughput against per-token GPU memory consumption and cluster financial cost.\n</p>\n<div class=\"diagram-container\" style=\"background:var(--bg3); padding:1rem; border-radius:8px; margin:1rem 0; border:1px solid var(--border);\">\n<p><strong>System Execution Flowchart: Capstone Part 3: API Wrapper &amp; Containerization</strong></p>\n<div class=\"mermaid\">\ngraph LR\n    Input[\"1. Client Ingress Request\"] --&gt; Validate[\"2. Schema Validation &amp; Guardrails\"]\n    Validate --&gt; Pipeline[\"3. Core Computational Engine\"]\n    Pipeline --&gt; Cache[\"\
    4. High-Speed Cache &amp; Telemetry\"]\n    Cache --&gt; Egress[\"5. Verified Output Response\"]\n</div>\n</div>\n"
