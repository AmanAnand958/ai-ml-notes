  - front: SFT vs RLHF Alignment?
    back: • SFT (Supervised Fine-Tuning) trains on curated input-output demonstrations.<br/>• RLHF uses Proximal Policy Optimization
      (PPO) or DPO on human preference rewards.
  - front: LoRA (Low-Rank Adaptation)?
    back: • Freezes base weights W and trains decomposed low-rank matrices A and B (W + Delta W = W + B * A), reducing trainable
      parameters by 99% with zero added inference latency.
  - front: Post-Training Quantization (PTQ)
    back: • Mapping high-precision 32-bit floating point weights to discrete 8-bit or 4-bit integers using scaling factors
      and zero points to fit large models onto consumer GPUs.
  - front: Hyperparameter determining the step size taken along the negative gradient direction during weight parameter u
      (D135)?
    back: • The tendency of neural networks to lose previously learned skills when fine-tuned aggressively on a narrow new
      domain; mitigated with rehearsal datasets and low learning rates.
