      \            <span class=\"str\">\"1. Built semantic chunking and FAISS HNSW\
      \ indexing pipeline with hybrid BM25 + dense retrieval.\\n\"</span>\n      \
      \      <span class=\"str\">\"2. Integrated Cohere Re-rank API reducing context\
      \ noise by 40%.\\n\"</span>\n            <span class=\"str\">\"3. Implemented\
      \ vLLM serving with PagedAttention and Redis semantic caching for 3.2x latency\
      \ improvement.\\n\"</span>\n            <span class=\"str\">\"4. Established\
      \ RAGAS continuous evaluation gates in GitHub Actions CI/CD.\"</span>\n    \
      \    ),\n        <span class=\"str\">\"Result\": \"Reduced response latency\
      \ from 15 mins to 420ms (p95), achieved 94.2% answer faithfulness, and cut monthly\
      \ LLM API costs by $3,400 via semantic caching.\"</span>\n    }\n}\n\n<span\
      \ class=\"kw\">for</span> title, star <span class=\"kw\">in</span> STAR_PROJECTS.<span\
