  - title: Deploy Container to Cloud
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: |-
      <p><strong>
               Configure continuous deployment on Render or Railway to automatically pull your Docker image and expose it to a public endpoint.
