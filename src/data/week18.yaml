    kw\">import</span> joblib\n\nnumeric_pipeline = Pipeline([\n    (<span class=\"str\">'imputer'</span>, SimpleImputer(strategy=<span\
    \ class=\"str\">'median'</span>)),\n    (<span class=\"str\">'scaler'</span>, StandardScaler())\n])\n\ncategorical_pipeline\
    \ = Pipeline([\n    (<span class=\"str\">'imputer'</span>, SimpleImputer(strategy=<span class=\"str\">'most_frequent'</span>)),\n\
    \    (<span class=\"str\">'ohe'</span>, OneHotEncoder(handle_unknown=<span class=\"str\">'ignore'</span>, sparse_output=<span\
    \ class=\"kw\">False</span>))\n])\n\npreprocessor = ColumnTransformer([\n    (<span class=\"str\">'num'</span>, numeric_pipeline,\
    \ numeric_cols),\n    (<span class=\"str\">'cat'</span>, categorical_pipeline, categorical_cols)\n])\n\nfull_pipeline\
    \ = Pipeline([\n    (<span class=\"str\">'preprocessor'</span>, preprocessor),\n    (<span class=\"str\">'classifier'</span>,\
    \ best_estimator)\n])\n\n<span class=\"cm\"># Save atomic pipeline</span>\njoblib.dump(full_pipeline, <span class=\"str\"\
    >\"models/production_pipeline.joblib\"</span>)</code></pre>\n</div>\n\n<h3 class=\"sh3\">2. Metric Evaluation Beyond Accuracy</h3>\n\
    <p>\nIn imbalanced real-world datasets, raw accuracy is deeply misleading (a model predicting 100% negative achieves 99%\
    \ accuracy on a 1% fraud dataset while catching 0 fraudsters).\n</p>\n<ul>\n  <li><strong>Precision-Recall AUC (PR-AUC):</strong>\
    \ Evaluates performance on the minority positive class regardless of true negative count.</li>\n  <li><strong>Confusion\
    \ Matrix Calibration:</strong> Set classification decision thresholds $\tau$ based on business loss matrix: $\text{Cost}\
    \ = C_{\text{FP}} \\cdot \text{FP} + C_{\text{FN}} \\cdot \text{FN}$.</li>\n</ul>"
