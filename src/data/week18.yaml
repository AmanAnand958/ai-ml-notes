  tasks:
  - title: Deploy Local K3s Cluster
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n         Install k3d or minikube on your local machine and\
      \ verify that you can contact the cluster using kubectl commands.\n        </p>"
    done_when: kubectl cluster-info runs successfully and displays cluster details.
    git_cmd: 'git add . &amp;&amp; git commit -m "day125: complete day 125 tasks and
      coding exercises"'
    sol_id: sol-w18d125t1
    solution_title: ✅ COMPLETE SOLUTION — deploy_local_k3s_cluster.py
    solution_code: '#!/usr/bin/env bash

      # Step 1: Install k3s locally (lightweight Kubernetes)

      curl -sfL https://get.k3s.io | sh -


      # Step 2: Configure kubeconfig permissions for non-root user

      mkdir -p ~/.kube

      sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config

      sudo chown $(id -u):$(id -g) ~/.kube/config

      chmod 600 ~/.kube/config


      # Step 3: Verify cluster status and nodes

      kubectl get nodes -o wide

      kubectl cluster-info


      # Step 4: Create isolated namespace for ML serving

      kubectl create namespace ml-production'
    solution_lang: bash
  - title: Write K8s Deployment Manifest
    badge: MED
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n          Write a complete deployment.yaml manifest for your\
      \ FastAPI model serving image, setting CPU limit to 500m and memory request\
      \ to 256Mi.\n         </p>"
    done_when: yaml linting passes and dry-run validation with kubectl diff runs without
      exceptions.
    git_cmd: 'git add write_k8s_deployment_manifest.py &amp;&amp; git commit -m "day125:
      write-k8s-deployment-manifest"'
    sol_id: sol-w18d125t2
    solution_title: ✅ COMPLETE SOLUTION — write_k8s_deployment_manifest.py
    solution_code: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: fastapi-ml-deployment\n\
      \  namespace: ml-production\n  labels:\n    app: ml-service\nspec:\n  replicas:\
      \ 3\n  selector:\n    matchLabels:\n      app: ml-service\n  template:\n   \
      \ metadata:\n      labels:\n        app: ml-service\n    spec:\n      containers:\n\
      \      - name: model-serving\n        image: myregistry.io/ml-models/sentiment-fastapi:v1.0.0\n\
      \        ports:\n        - containerPort: 8000\n        resources:\n       \
      \   limits:\n            cpu: \"2\"\n            memory: \"4Gi\"\n         \
      \ requests:\n            cpu: \"500m\"\n            memory: \"1Gi\"\n      \
      \  livenessProbe:\n          httpGet:\n            path: /health\n         \
      \   port: 8000\n          initialDelaySeconds: 15\n          periodSeconds:\
      \ 10\n        readinessProbe:\n          httpGet:\n            path: /ready\n\
      \            port: 8000\n          initialDelaySeconds: 5\n          periodSeconds:\
      \ 5\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: fastapi-ml-service\n\
      \  namespace: ml-production\nspec:\n  type: LoadBalancer\n  selector:\n    app:\
      \ ml-service\n  ports:\n  - protocol: TCP\n    port: 80\n    targetPort: 8000"
    solution_lang: yaml
  quizzes:
  - num_str: Q1 OF 1
    question: What is the primary role of a Kubernetes Service?
    qid: q125_1
    options:
    - letter: A
      text: To compile neural networks for faster training.
      is_correct: false
    - letter: B
      text: To expose a set of pod replicas to the network and load balance traffic
        among them.
      is_correct: true
    - letter: C
      text: To store persistent training checkpoints.
      is_correct: false
    - letter: D
      text: Apply Dropout before Batch Normalization with learning rate > 1.0
      is_correct: false
    correct_fb: ✅ Correct! K8s Service abstracts network access, providing a single
      IP address and DNS name to access underlying replica pods dynamically.
    wrong_fb: ❌ Think about what happens when pods crash and restart with new IP addresses.
      Which element maps a stable endpoint?
  - num_str: QUESTION 2 OF 4
    question: What is the primary role of a Kubernetes Pod?
    qid: q125_2
    options:
    - letter: A
      text: A physical machine inside a cloud data center.
      is_correct: false
    - letter: B
      text: The smallest deployable unit in Kubernetes that encapsulates one or more
        containers sharing network and storage.
      is_correct: true
    - letter: C
      text: A Python package manager.
      is_correct: false
    - letter: D
      text: A relational database table.
      is_correct: false
    correct_fb: ✅ Correct! Pods represent the atomic execution unit in Kubernetes
      clusters.
    wrong_fb: ❌ Incorrect. Pods wrap containers and share network namespaces.
  - num_str: QUESTION 3 OF 4
    question: Why is a Kubernetes Service needed in front of ML Deployment Pods?
    qid: q125_3
    options:
    - letter: A
      text: It provides a stable IP address and DNS name, load-balancing traffic across
        ephemeral Pod replicas.
      is_correct: true
    - letter: B
      text: To train neural networks faster.
      is_correct: false
    - letter: C
      text: To compress Docker container images.
      is_correct: false
    - letter: D
      text: To format JSON responses automatically.
      is_correct: false
    correct_fb: ✅ Correct! Services provide stable virtual IPs and load-balance across
      dynamic Pods.
    wrong_fb: ❌ Incorrect. Services route traffic reliably across ephemeral pod instances.
  - num_str: QUESTION 4 OF 4
    question: How does a Kubernetes Horizontal Pod Autoscaler (HPA) determine when
      to scale up?
    qid: q125_4
    options:
    - letter: A
      text: By monitoring target metrics (e.g. CPU, RAM, or custom inference queue
        depth) against configured threshold targets.
      is_correct: true
    - letter: B
      text: By checking the time of day on the host machine.
      is_correct: false
    - letter: C
      text: By asking developers via email notification.
      is_correct: false
    - letter: D
      text: By calculating the number of files in the project folder.
      is_correct: false
    correct_fb: ✅ Correct! HPA dynamically adjusts replica counts based on observed
      metric utilization.
    wrong_fb: ❌ Incorrect. HPA scales based on real-time metric thresholds like CPU
      and queue depth.
  flashcards:
  - front: What is a Kubernetes Pod?
    back: The smallest deployable compute unit in K8s, containing one or more containers
      sharing network namespaces and storage volumes.
  - front: Deployment vs StatefulSet?
    back: Deployments manage stateless replica pods (e.g. stateless ML APIs). StatefulSets
      manage stateful workloads requiring persistent identities (e.g. databases, vector
      stores).
  - front: Kubernetes Cluster IP vs NodePort vs LoadBalancer?
    back: 'ClusterIP: internal cluster only. NodePort: exposes port on each node IP.
      LoadBalancer: provisions an external cloud load balancer to route traffic.'
  - front: What is a K8s Ingress Controller?
    back: An API object that manages external access to services, typically HTTP/HTTPS
      routing, SSL termination, and host/path-based load balancing.
