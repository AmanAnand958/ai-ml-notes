  hinglish: Kubernetes ek container orchestration engine hai jo hamare ML model containers (Pods) ko auto-scale, self-heal aur load balance karta hai. Agar koi model container crash hota hai toh K8s automatically naya pod spawn kar deta hai.
  analogy: 'Kubernetes is like an automated airport traffic controller: instead of managing individual flights manually, it routes incoming traffic to available gates (Services), replaces broken planes instantly (ReplicaSets), and scales runways during peak rush hour (HPA).'
  theory_html: "<div class=\"math-block\">\n$$ \\text{PodAvailability} = \\frac{\\text{Uptime}}{\\text{Uptime} + \\text{Downtime}} \\ge 1 - \\left(\\frac{1}{2}\\right)^{\\text{Replicas}} $$\n<p class=\"math-caption\">High Availability probability scaling with Kubernetes replicas.</p>\n</div><h3 class=\"sh3\">Production Engineering Walkthrough: Kubernetes Basics for ML Deployments</h3><div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — production_kubernetes_pod_manager.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-bash\"># Day 125 — Production Kubernetes Pod Manager\nimport subprocess, json, time, logging\nfrom typing import Dict, Any, Optional\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"K8sPodManager\")\n\nclass KubernetesPodManager:\n    \"\"\"Production Kubernetes Pod lifecycle manager for\
    \ ML workloads.\"\"\"\n\n    def __init__(self, namespace: str = \"ml-serving\", context: Optional[str] = None):\n        self.namespace = namespace\n        self.ctx_flag = [\"--context\", context] if context else []\n\n    def _kubectl(self, *args: str) -&gt; Dict:\n        cmd = [\"kubectl\", *self.ctx_flag, \"-n\", self.namespace, *args]\n        result = subprocess.run(cmd, capture_output=True, text=True, timeout=30)\n        if result.returncode != 0:\n            raise RuntimeError(f\"kubectl error: {result.stderr.strip()}\")\n        return json.loads(result.stdout) if result.stdout.strip().startswith((\"{\", \"[\")) else {\"output\": result.stdout.strip()}\n\n    def get_pod_status(self, label_selector: str) -&gt; Dict[str, Any]:\n        pods = self._kubectl(\"get\", \"pods\", \"-l\", label_selector, \"-o\", \"json\")\n        items = pods.get(\"items\", [])\n        return {\n            \"total\":   len(items),\n            \"running\": sum(1 for p in items if p[\"status\"\
    ][\"phase\"] == \"Running\"),\n            \"pending\": sum(1 for p in items if p[\"status\"][\"phase\"] == \"Pending\"),\n            \"failed\":  sum(1 for p in items if p[\"status\"][\"phase\"] == \"Failed\"),\n        }\n\n    def rollout_restart(self, deployment_name: str) -&gt; str:\n        result = self._kubectl(\"rollout\", \"restart\", f\"deployment/{deployment_name}\")\n        logger.info(f\"Triggered rollout restart: {deployment_name}\")\n        return result.get(\"output\", \"\")\n\n    def wait_for_rollout(self, deployment_name: str, timeout_sec: int = 120) -&gt; bool:\n        cmd = [\"kubectl\", *self.ctx_flag, \"-n\", self.namespace,\n               \"rollout\", \"status\", f\"deployment/{deployment_name}\", f\"--timeout={timeout_sec}s\"]\n        result = subprocess.run(cmd, capture_output=True, text=True)\n        success = result.returncode == 0\n        logger.info(f\"Rollout {'succeeded' if success else 'FAILED'}: {deployment_name}\")\n        return success\n\
    \n    def scale_deployment(self, name: str, replicas: int) -&gt; bool:\n        self._kubectl(\"scale\", f\"deployment/{name}\", f\"--replicas={replicas}\")\n        logger.info(f\"Scaled {name} to {replicas} replicas\")\n        return self.wait_for_rollout(name)\n\nif __name__ == \"__main__\":\n    mgr = KubernetesPodManager(namespace=\"ml-serving\")\n    print(\"KubernetesPodManager ready — connects to active kubectl context\")\n    print(\"Ops: get_pod_status, rollout_restart, wait_for_rollout, scale_deployment\")\n    print(\"Test: kubectl get pods -l app=llm-api -n ml-serving\")\n</code></pre>\n</div><p>\nWhen moving from local development to production container orchestration, sizing CPU and RAM allocations requires analyzing peak inference concurrency ($C$), average batch size ($B$), and resident memory for model weights ($M_{\\text{weights}}$):\n</p><p>\nIn containerized runtimes (Docker/Kubernetes), failing to account for payload serialization buffer overhead leads to immediate\
    \ <code>OOMKilled</code> (Exit Code 137) container restarts under sudden traffic bursts.\n</p>\n"
