  - num_str: QUESTION 4 OF 4
    question: How does a Kubernetes Horizontal Pod Autoscaler (HPA) determine when to scale up?
    qid: q125_4
    options:
    - letter: A
      text: By monitoring target metrics (e.g. CPU, RAM, or custom inference queue depth) against configured threshold targets.
      is_correct: true
      id: a
    - letter: B
      text: By checking the time of day on the host machine.
      is_correct: false
      id: b
    - letter: C
