  tasks:
  - title: Track Hyperparameters with MLflow
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n         Write a training script that integrates MLflow to\
      \ log parameters (learning rate, epochs) and metrics (val_loss, accuracy) during\
      \ a training loop.\n        </p>"
    done_when: The local mlruns/ folder is created and populates metadata for the
      executed run.
    git_cmd: 'git add . &amp;&amp; git commit -m "day127: complete day 127 tasks and
      coding exercises"'
    sol_id: sol-w18d127t1
    solution_title: ✅ COMPLETE SOLUTION — track_hyperparameters_with_mlflow.py
    solution_code: "<span class=\"kw\">import</span> mlflow\n<span class=\"kw\">import</span>\
      \ mlflow.sklearn\n<span class=\"kw\">from</span> sklearn.datasets <span class=\"\
      kw\">import</span> load_iris\n<span class=\"kw\">from</span> sklearn.model_selection\
      \ <span class=\"kw\">import</span> train_test_split\n<span class=\"kw\">from</span>\
      \ sklearn.ensemble <span class=\"kw\">import</span> RandomForestClassifier\n\
      <span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span>\
      \ accuracy_score, f1_score\n\n<span class=\"cm\"># 1. Set tracking URI and experiment\
      \ name</span>\nmlflow.<span class=\"fn\">set_tracking_uri</span>(<span class=\"\
      str\">\"http://localhost:5000\"</span>)\n<span class=\"cm\"># Step 1: Initialize\
      \ experiment metadata tracking</span>\nmlflow.<span class=\"fn\">set_experiment</span>(<span\
      \ class=\"str\">\"Customer_Churn_Optimization\"</span>)\n\nX, y = <span class=\"\
      fn\">load_iris</span>(return_X_y=<span class=\"kw\">True</span>)\nX_train, X_test,\
      \ y_train, y_test = <span class=\"fn\">train_test_split</span>(X, y, test_size=<span\
      \ class=\"num\">0.2</span>, random_state=<span class=\"num\">42</span>)\n\n\
      hyperparameters = [\n    {<span class=\"str\">\"n_estimators\": 50, \"max_depth\"\
      : 3, \"min_samples_split\"</span>: <span class=\"num\">2</span>},\n    {<span\
      \ class=\"str\">\"n_estimators\": 100, \"max_depth\": 5, \"min_samples_split\"\
      </span>: <span class=\"num\">4</span>},\n    {<span class=\"str\">\"n_estimators\"\
      : 200, \"max_depth\": 10, \"min_samples_split\"</span>: <span class=\"num\"\
      >2</span>},\n]\n\n<span class=\"kw\">for</span> params <span class=\"kw\">in</span>\
      \ hyperparameters:\n    <span class=\"cm\"># Step 2: Start an atomic tracked\
      \ run context</span>\n    <span class=\"kw\">with</span> mlflow.<span class=\"\
      fn\">start_run</span>(run_name=<span class=\"str\">f\"rf_d{params['</span>max_depth<span\
      \ class=\"str\">']}_n{params['</span>n_estimators<span class=\"str\">']}\"</span>):\n\
      \        <span class=\"cm\"># Step 3: Record hyperparameters for run comparison</span>\n\
      \        mlflow.<span class=\"fn\">log_params</span>(params)\n        \n   \
      \     <span class=\"cm\"># Train model</span>\n        clf = <span class=\"\
      fn\">RandomForestClassifier</span>(**params, random_state=<span class=\"num\"\
      >42</span>)\n        clf.<span class=\"fn\">fit</span>(X_train, y_train)\n \
      \       \n        <span class=\"cm\"># Evaluate</span>\n        preds = clf.<span\
      \ class=\"fn\">predict</span>(X_test)\n        acc = <span class=\"fn\">accuracy_score</span>(y_test,\
      \ preds)\n        f1 = <span class=\"fn\">f1_score</span>(y_test, preds, average=<span\
      \ class=\"str\">\"weighted\"</span>)\n        \n        <span class=\"cm\">#\
      \ Log Metrics</span>\n        mlflow.<span class=\"fn\">log_metric</span>(<span\
      \ class=\"str\">\"accuracy\"</span>, acc)\n        mlflow.<span class=\"fn\"\
      >log_metric</span>(<span class=\"str\">\"f1_score\"</span>, f1)\n        \n\
      \        <span class=\"cm\"># Step 5: Save model weights, conda environment,\
      \ and signature</span>\n        mlflow.sklearn.<span class=\"fn\">log_model</span>(clf,\
      \ artifact_path=<span class=\"str\">\"model\"</span>)\n        <span class=\"\
      fn\">print</span>(<span class=\"str\">f\"Logged run: params={params} -&gt; Acc:\
      \ {acc:.4f}, F1: {f1:.4f}\"</span>)"
    solution_lang: python
  - title: Compare Runs in MLflow UI
    badge: MED
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n          Launch the MLflow tracking user interface locally,\
      \ compare at least three training runs with different hyperparameters, and export\
      \ the performance table.\n         </p>"
    done_when: Running 'mlflow ui' opens the dashboard at localhost:5000, displaying
      the run metrics side-by-side.
    git_cmd: 'git add compare_runs_in_mlflow_ui.py &amp;&amp; git commit -m "day127:
      compare-runs-in-mlflow-ui"'
    sol_id: sol-w18d127t2
    solution_title: ✅ COMPLETE SOLUTION — compare_runs_in_mlflow_ui.py
    solution_code: "<span class=\"kw\">import</span> mlflow\n<span class=\"kw\">import</span>\
      \ pandas <span class=\"kw\">as</span> pd\n\nclient = mlflow.tracking.<span class=\"\
      fn\">MlflowClient</span>()\nexperiment = client.<span class=\"fn\">get_experiment_by_name</span>(<span\
      \ class=\"str\">\"Customer_Churn_Optimization\"</span>)\n\n<span class=\"cm\"\
      ># Search all runs in the experiment</span>\nruns = client.<span class=\"fn\"\
      >search_runs</span>(\n    experiment_ids=[experiment.experiment_id],\n    filter_string=<span\
      \ class=\"str\">\"\"</span>,\n    order_by=[<span class=\"str\">\"metrics.accuracy\
      \ DESC\", \"metrics.f1_score DESC\"</span>],\n    max_results=<span class=\"\
      num\">10</span>\n)\n\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
      {'</span>Run ID<span class=\"str\">':&lt;34} | {'</span>Max Depth<span class=\"\
      str\">':&lt;10} | {'</span>N Est<span class=\"str\">':&lt;6} | {'</span>Accuracy<span\
      \ class=\"str\">':&lt;10} | {'</span>F1-Score<span class=\"str\">':&lt;10}\"\
      </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"─\"</span> *\
      \ <span class=\"num\">80</span>)\n<span class=\"kw\">for</span> run <span class=\"\
      kw\">in</span> runs:\n    run_id = run.info.run_id\n    depth = run.data.params.<span\
      \ class=\"fn\">get</span>(<span class=\"str\">\"max_depth\", \"N/A\"</span>)\n\
      \    n_est = run.data.params.<span class=\"fn\">get</span>(<span class=\"str\"\
      >\"n_estimators\", \"N/A\"</span>)\n    acc = run.data.metrics.<span class=\"\
      fn\">get</span>(<span class=\"str\">\"accuracy\"</span>, <span class=\"num\"\
      >0.0</span>)\n    f1 = run.data.metrics.<span class=\"fn\">get</span>(<span\
      \ class=\"str\">\"f1_score\"</span>, <span class=\"num\">0.0</span>)\n    <span\
      \ class=\"fn\">print</span>(<span class=\"str\">f\"{run_id:&lt;34} | {depth:&lt;10}\
      \ | {n_est:&lt;6} | {acc:&lt;10.4f} | {f1:&lt;10.4f}\"</span>)\n\nbest_run =\
      \ runs[<span class=\"num\">0</span>]\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"\\n\U0001F3C6 Best Champion Model Run ID: {best_run.info.run_id}\
      \ (Accuracy: {best_run.data.metrics['</span>accuracy<span class=\"str\">']:.4f})\"\
      </span>)"
