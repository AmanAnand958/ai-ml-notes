  - title: Build Model Training Loop
    badge: MED
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n          Assemble the core training pipeline in PyTorch/Keras,\
      \ setting up checkpoints and logging learning curves to your local MLflow instance.\n\
      \         </p>"
    done_when: The model trains without errors, and accuracy/loss curves converge
      as logged in the tracking dashboard.
    git_cmd: 'git add build_model_training_loop.py &amp;&amp; git commit -m "day129:
      build-model-training-loop"'
    sol_id: sol-w18d129t2
    solution_title: ✅ COMPLETE SOLUTION — build_model_training_loop.py
    solution_code: "# Step 1: Algorithmic Implementation & Core Transformations\n\
      import torch\nimport torch.nn as nn\nfrom torch.utils.data import DataLoader,\
      \ TensorDataset\n\nclass ProductionMLP(nn.Module):\n    def __init__(self, in_features=20,\
      \ hidden_dim=64, out_classes=2):\n        super().__init__()\n        self.net\
      \ = nn.Sequential(\n            nn.Linear(in_features, hidden_dim),\n      \
      \      nn.BatchNorm1d(hidden_dim),\n            nn.ReLU(),\n            nn.Dropout(0.3),\n\
      \            nn.Linear(hidden_dim, 32),\n            nn.ReLU(),\n          \
      \  nn.Linear(32, out_classes)\n        )\n    def forward(self, x):\n      \
      \  return self.net(x)\n\ndef train_epoch(model, dataloader, optimizer, criterion,\
      \ device):\n    model.train()\n    total_loss, correct, total = 0.0, 0, 0\n\
      \    for X_batch, y_batch in dataloader:\n        X_batch, y_batch = X_batch.to(device),\
      \ y_batch.to(device)\n        optimizer.zero_grad()\n        logits = model(X_batch)\n\
      \        loss = criterion(logits, y_batch)\n        loss.backward()\n      \
      \  nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)\n        optimizer.step()\n\
      \        \n        total_loss += loss.item() * X_batch.size(0)\n        correct\
      \ += (logits.argmax(dim=1) == y_batch).sum().item()\n        total += y_batch.size(0)\n\
      \        \n    return total_loss / total, correct / total"
    solution_lang: python
  quizzes:
  - num_str: Q1 OF 1
    question: What is the benefit of saving model checkpoints during training?
    qid: q129_1
    options:
    - letter: A
      text: It decreases the VRAM consumption of the training batch.
      is_correct: false
    - letter: B
      text: It allows restoring the model weights from the best epoch if validation
        performance degrades or crashes.
      is_correct: true
    - letter: C
      text: It automatically compiles the model for fast inference.
      is_correct: false
    - letter: D
      text: Apply Dropout before Batch Normalization with learning rate > 1.0
      is_correct: false
    correct_fb: ✅ Correct! Checkpointing acts as a safety net, letting you resume
      training or select the best generalized state safely.
    wrong_fb: ❌ Think about training failures. What happens if the server shuts down
      or the loss diverges after epoch 50?
