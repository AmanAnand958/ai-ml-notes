    solution_code: "import math\n\ndef calculate_system_design_budget(\n    qps=500,                    # Queries per second\n    input_tokens=1024,          # Average prompt length\n    output_tokens=128,          # Average response length\n    model_params_b=8.0,         # 8 Billion parameter model\n    precision_bytes=2,          # FP16 = 2 bytes, INT4 = 0.5 bytes\n    kv_cache_heads=8,\n    head_dim=128,\n    num_layers=32\n):\n    # 1. Model Weights VRAM\n    model_vram_gb = (model_params_b * 10**9 * precision_bytes) / (1024**3)\n    \n    # 2. KV Cache per concurrent request\n    kv_bytes_per_token = 2 * num_layers * kv_cache_heads * head_dim * precision_bytes\n    total_tokens_per_req = input_tokens + output_tokens\n    kv_cache_per_req_mb = (kv_bytes_per_token * total_tokens_per_req) / (1024**2)\n    \n    # 3. Peak Concurrent Active Batches\n    avg_latency_sec = 0.8\n    concurrent_requests = qps * avg_latency_sec\n    total_kv_vram_gb = (concurrent_requests * kv_cache_per_req_mb)\
      \ / 1024\n    \n    total_vram_required = model_vram_gb + total_kv_vram_gb\n    gpus_needed = math.ceil(total_vram_required / 80) # 80GB A100/H100 GPUs\n    \n    print(f\"ML System Capacity Analysis (Target: {qps} QPS):\")\n    print(f\"─\" * 50)\n    print(f\"Model VRAM (Weights):       {model_vram_gb:.2f} GB\")\n    print(f\"KV Cache VRAM ({concurrent_requests:.0f} conc): {total_kv_vram_gb:.2f} GB\")\n    print(f\"Total VRAM Required:        {total_vram_required:.2f} GB\")\n    print(f\"Minimum 80GB GPUs Needed:   {gpus_needed}x 80GB H100 SXM5\")\n\ncalculate_system_design_budget()\nassert gpus_needed is not None, \"gpus_needed should not be None\""
