- id: 127
  day_num: 127
  title: MLOps Basics & Experiment Tracking
  subtitle: Understand the MLOps lifecycle, use MLflow to track parameters, and record training metrics on a model registry.
  time_estimate: 4 hours
  difficulty: Advanced
  badges:
  - label: ⚡ Advanced
    variant: p
  xp: 150
  objectives:
  - 'Apply: Differentiate model metrics tracking from traditional code versioning workflows.'
  - Integrate MLflow SDK into model training scripts to log hyperparameters, training loss, and val accuracy.
  - Benchmark model performance runs side-by-side inside the local MLflow dashboard.
  - Benchmark and profile runtime performance under production latency constraints.
  checklist:
  - id: chk_127_1
    text: Derive and analyze mathematical and architectural principles for MLOps Basics & Experiment Tracking
  - id: chk_127_2
    text: Build and benchmark production coding pipelines for MLOps Basics & Experiment Tracking
  - id: chk_127_3
    text: Execute and validate test verification suite for Track Hyperparameters with MLflow
  - id: chk_127_4
    text: Evaluate conceptual mastery via interactive flashcards and quiz challenges
  concept_flow:
  - Kubernetes Basics for ML Deployments
  - Cloud Deployment on Render & Railway
  - MLOps Basics & Experiment Tracking
  - 'Capstone Part 1: Project Architecture Specification'
  - 'Capstone Part 2: Model Training & Core Pipeline'
  - 'Capstone Part 3: API Wrapper & Containerization'
  - 'Capstone Part 4: Cloud Deployment & Frontend'
  - GitHub Portfolio Polish
  - Resume & LinkedIn Optimization
  - 'Final Interview Prep: ML Theory & Coding'
  - 'Mid-Course Milestone: MLOps & System Design Architecture'
  hinglish: ML experiments mein jab hum 50 models train karte hain, toh yaad rakhna mushkil hota hai ki kaunse hyperparameters se best accuracy aayi thi. MLflow har run ke parameters, metrics (accuracy, loss) aur model artifact ko database mein log karta hai.
  analogy: 'MLflow is like an automated scientific laboratory notebook: every time you conduct an experiment, it logs exact chemical ratios (hyperparameters), temperature curves (loss curves), and stores the resulting compound (model artifact).'
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">1. The MLOps Imperative: Solving Model Chaos</h3>\n<p>\nIn unstructured ML development, data scientists train models in Jupyter Notebooks, naming model files <code>model_final_v2_really_final.pkl</code> without recording what learning rate, dataset version, or random seed produced that specific artifact. When accuracy degrades in production months later, nobody can reproduce the training run.\n</p>\n<p>\n<strong>MLOps (Machine Learning Operations)</strong> standardizes the ML lifecycle across three foundational pillars:\n</p>\n<ol>\n<li><strong>Reproducibility:</strong> Every model binary is deterministically linked to exact git commit hashes, dataset version tags, and hyperparameter dictionaries.</li>\n<li><strong>Governance:</strong> Centralized model registries track staging and production promotion states with audit logs.</li>\n<li><strong>Continuous Telemetry:</strong> Production inference streams\
    \ are monitored for data drift and prediction latency regression.</li>\n</ol>\n<h3 class=\"sh3\">2. MLflow Tracking Architecture</h3>\n<div class=\"mermaid\">\ngraph TD\n    Script[\"Training Script (train.py)\"] --&gt;|Logs Parameters &amp; Metrics| BackendStore[\"PostgreSQL Relational DB (Run Metadata)\"]\n    Script --&gt;|Uploads Model Binaries &amp; Artifacts| S3Storage[\"AWS S3 / MinIO (Artifact Storage)\"]\n    BackendStore --&gt; MLflowServer[\"MLflow Tracking Server UI (:5000)\"]\n    S3Storage --&gt; MLflowServer\n    MLflowServer --&gt; Registry[\"MLflow Model Registry\n(@champion / @challenger)\"]\n    Registry --&gt; ProdAPI[\"FastAPI Production Service\n(Loads models:/ChurnModel@champion)\"]\n</div>\n<div class=\"diagram-cap\">Figure 127.1: MLflow Tracking Architecture decoupling metadata from heavy model artifacts.</div>\n<h3 class=\"sh3\">3. Production Python MLflow Tracking Implementation</h3>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python</span><div\
    \ class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> mlflow\n<span class=\"kw\">import</span> mlflow.sklearn\n<span class=\"kw\">from</span> sklearn.ensemble <span class=\"kw\">import</span> RandomForestClassifier\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> accuracy_score, f1_score\n\n<span class=\"cm\"># 1. Set Remote Tracking Server</span>\nmlflow.set_tracking_uri(<span class=\"str\">\"http://localhost:5000\"</span>)\nmlflow.set_experiment(<span class=\"str\">\"customer-churn-v1\"</span>)\n\n<span class=\"kw\">with</span> mlflow.start_run(run_name=<span class=\"str\">\"rf_depth_12_estimators_200\"</span>):\n    params = {<span class=\"str\">\"n_estimators\"</span>: <span class=\"num\">200</span>, <span class=\"str\">\"max_depth\"</span>: <span class=\"num\">12</span>, <span class=\"str\">\"random_state\"</span>: <span class=\"num\"\
    >42</span>}\n    mlflow.log_params(params)\n    \n    model = RandomForestClassifier(**params)\n    model.fit(X_train, y_train)\n    \n    preds = model.predict(X_test)\n    acc = accuracy_score(y_test, preds)\n    f1 = f1_score(y_test, preds, average=<span class=\"str\">\"macro\"</span>)\n    \n    mlflow.log_metrics({<span class=\"str\">\"test_accuracy\"</span>: acc, <span class=\"str\">\"test_f1\"</span>: f1})\n    \n    <span class=\"cm\"># Log model with explicit input/output signature</span>\n    mlflow.sklearn.log_model(\n        sk_model=model,\n        artifact_path=<span class=\"str\">\"model\"</span>,\n        registered_model_name=<span class=\"str\">\"CustomerChurnClassifier\"</span>\n    )</code></pre>\n</div>\n<h3 class=\"sh3\">Engineering Decision Matrix: General Production Trade-offs</h3>\n<div style=\"overflow-x:auto;\">\n<table style=\"width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px; text-align:left;\">\n<thead>\n<tr style=\"border-bottom:2px solid\
    \ var(--border); background:var(--bg-secondary);\">\n<th style=\"padding:10px;\">Architecture Strategy</th>\n<th style=\"padding:10px;\">Upfront Cost</th>\n<th style=\"padding:10px;\">Maintenance</th>\n<th style=\"padding:10px;\">Scalability</th>\n<th style=\"padding:10px;\">Time-to-Market</th>\n</tr>\n</thead>\n<tbody>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Monolithic MVP</strong></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span> (Initially)</td>\n<td style=\"padding:10px;\">Poor</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Fast</span> (&lt; 1 week)</td>\n</tr>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\"\
    \ style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Microservices</strong></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--orange);\">High</span></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--orange);\">High</span></td>\n<td style=\"padding:10px;\">Excellent</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--red);\">Slow</span> (Months)</td>\n</tr>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Serverless Functions</strong></td>\n<td style=\"padding:10px;\">Medium</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span></td>\n<td style=\"padding:10px;\">Infinite</td>\n<td style=\"padding:10px;\">Medium</td>\n</tr>\n</tbody>\n</table>\n</div>\n<h3 class=\"sh3\">Mathematical Formulation\
    \ &amp; Performance Bounds</h3>\n<div class=\"math-block\">\n$$ \\mathcal{L}_{track}(\\theta) = \\sum_{t=1}^{T} \\alpha_t \\cdot \\text{Loss}(\\theta_t) + \\lambda \\cdot |\\text{Drift}(\\theta_t, \\theta_0)| $$\n<p class=\"math-caption\">Tracking optimization function balancing performance loss and model drift over time.</p>\n</div>\n<p>\nThis optimization metric balances raw computational throughput against per-token GPU memory consumption and cluster financial cost.\n</p>\n<h3 class=\"sh3\">Production Engineering Walkthrough: MLOps Basics &amp; Experiment Tracking</h3>\n<p>\nThe following production snippet demonstrates the foundational design pattern, error handling strategies, and telemetry hooks required when deploying <strong>MLOps Basics &amp; Experiment Tracking</strong> in high-throughput enterprise systems:\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — production_mlflow_tracker.py</span><div class=\"cb-btns\"><button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">copy</button></div></div>\n<pre>\nimport sys\nfrom unittest.mock import MagicMock\nsys.modules[\"mlflow\"] = MagicMock()\n\n# Day 127 — Production MLflow Experiment Tracker\nimport mlflow, time, logging, json\nfrom typing import Dict, Any, Optional\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"MLflowTracker\")\n\nclass MLflowExperimentTracker:\n    \"\"\"Production MLflow tracking with auto-registration and stage promotion.\"\"\"\n\n    def __init__(self, experiment_name: str, tracking_uri: str = \"http://localhost:5000\"):\n        mlflow.set_tracking_uri(tracking_uri)\n        mlflow.set_experiment(experiment_name)\n        self.experiment_name = experiment_name\n        self.client = mlflow.MlflowClient()\n\n    def log_training_run(self, params: Dict[str, Any], metrics: Dict[str, float],\n                          model, artifact_path: str = \"model\", run_name: str = \"run\"\
    ) -&gt; str:\n        with mlflow.start_run(run_name=run_name) as run:\n            mlflow.log_params(params)\n            mlflow.log_metrics(metrics)\n            mlflow.sklearn.log_model(model, artifact_path=artifact_path,\n                                      registered_model_name=self.experiment_name)\n            run_id = run.info.run_id\n            logger.info(f\"Run {run_id}: params={params}, metrics={metrics}\")\n            return run_id\n\n    def promote_best_model(self, metric_key: str = \"val_f1\", stage: str = \"Staging\") -&gt; Optional[str]:\n        exp = self.client.get_experiment_by_name(self.experiment_name)\n        runs = self.client.search_runs(\n            experiment_ids=[exp.experiment_id],\n            order_by=[f\"metrics.{metric_key} DESC\"], max_results=1\n        )\n        if not runs:\n            logger.warning(\"No runs found to promote\")\n            return None\n        versions = self.client.get_latest_versions(self.experiment_name, stages=[\"\
    None\"])\n        if not versions:\n            return None\n        v = versions[0]\n        self.client.transition_model_version_stage(self.experiment_name, v.version, stage)\n        logger.info(f\"Promoted v{v.version} ({runs[0].info.run_id[:8]}) to {stage}\")\n        return v.version\n\n    def get_production_model(self):\n        versions = self.client.get_latest_versions(self.experiment_name, stages=[\"Production\"])\n        if not versions:\n            raise RuntimeError(f\"No Production model for {self.experiment_name}\")\n        return mlflow.pyfunc.load_model(f\"models:/{self.experiment_name}/Production\")\n\nif __name__ == \"__main__\":\n    print(\"MLflowExperimentTracker: connects to localhost:5000 by default\")\n    print(\"Flow: log_training_run -&gt; promote_best_model(Staging) -&gt; promote(Production)\")\n    print(\"Start server: mlflow server --host 0.0.0.0 --port 5000\")\n</pre>\n</div>\n<h3 class=\"sh3\">Relational vs Non-Relational Storage Selection for MLOps</h3>\n\
    <p>\nMLOps systems require a dual storage architecture: relational databases (PostgreSQL) manage user metadata, access tokens, and structured feature tables with strict ACID guarantees, while object stores (S3/GCS) store large immutable artifact blobs (serialized pickle models, ONNX graphs, and evaluation datasets). Storing model binaries directly inside relational rows introduces severe I/O bottlenecks during horizontal scaling.\n</p>\n"
