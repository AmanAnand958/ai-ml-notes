    </tr>
    <tr onmouseout="this.style.background='transparent'" onmouseover="this.style.background='var(--bg-secondary)'" style="border-bottom:1px solid var(--border); transition: background 0.2s;">
    <td style="padding:10px;"><strong>Serverless Functions</strong></td>
    <td style="padding:10px;">Medium</td>
