    \ Architecture with Caching &amp; Drift Detection.</div>\n\n<h3 class=\"sh3\">2. Production Failure Modes &amp; Defensive\
    \ Mitigations</h3>\n<table style=\"width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px;\">\n  <thead>\n\
    \    <tr style=\"border-bottom:2px solid var(--border);\\ text-align:left;\">\n      <th style=\"padding:8px;\">Failure\
    \ Mode</th>\n      <th style=\"padding:8px;\">Root Cause</th>\n      <th style=\"padding:8px;\">Production Defensive Mitigation</th>\n\
    \    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"\
    ><strong>Training-Serving Skew</strong></td>\n      <td style=\"padding:8px;\">Features computed differently in batch\
    \ SQL vs real-time Python API.</td>\n      <td style=\"padding:8px;\">Unified Feature Store (Feast / Hopsworks) with shared\
    \ transform modules.</td>\n    </tr>\n    <tr style=\"border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"\
    ><strong>Covariate / Data Drift</strong></td>\n      <td style=\"padding:8px;\">Input feature distribution (X)$ shifts\
    \ over time while (Y|X)$ remains constant.</td>\n      <td style=\"padding:8px;\">Kolmogorov-Smirnov (KS) test and Population\
    \ Stability Index (PSI &gt; 0.25 trigger automated retraining).</td>\n    </tr>\n    <tr style=\"border-bottom:1px solid\
    \ var(--border);\">\n      <td style=\"padding:8px;\"><strong>Cold-Start Latency Spike</strong></td>\n      <td style=\"\
    padding:8px;\">New container instances loading 10GB+ weights from remote storage during autoscale events.</td>\n     \
    \ <td style=\"padding:8px;\">Pre-warmed Pod pools, node-local SSD weight caches, and aggressive readiness probe initial\
    \ delays.</td>\n    </tr>\n    <tr style=\"border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"\
    ><strong>KV Cache OOM Crash</strong></td>\n      <td style=\"padding:8px;\">Concurrent long-context user queries saturating\
    \ available GPU VRAM.</td>\n      <td style=\"padding:8px;\">PagedAttention virtual memory allocation and token-level\
    \ chunked prefill.</td>\n    </tr>\n  </tbody>\n</table>\n\n<h3 class=\"sh3\">3. Critical Architectural Trade-Off Decisions</h3>\n\
    <div class=\"cb\">\n  <div class=\"cb-head\"><span class=\"cb-lang\">python — system_design_calculator.py</span><div class=\"\
    cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n  <pre><code>def estimate_serving_vram_and_cost(\n\
    \    model_params_billions: float,\n    precision_bytes: int,\n    concurrency: int,\n    max_seq_len: int,\n    gpu_vram_gb:\
    \ float = 80.0\n) -> dict:\n    \"\"\"Calculates GPU allocation and KV cache capacity requirements.\"\"\"\n    weight_mem_gb\
    \ = model_params_billions * precision_bytes\n    # KV cache = 2 * n_layers * n_heads * head_dim * bytes * concurrency\
