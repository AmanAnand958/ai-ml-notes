      kw\">return</span> <span class=\"fn\">len</span>(<span class=\"kw\">self</span>.data)\n\
      \n    <span class=\"kw\">def</span> <span class=\"fn\">__getitem__</span>(<span\
      \ class=\"kw\">self</span>, idx):\n        <span class=\"kw\">return</span>\
