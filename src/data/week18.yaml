  tasks:
  - title: Design ML System Architecture
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: |-
      <p><strong>
               Draft a complete system design document for a real-time product recommendation engine, covering data pipes, retrieval, ranking, and monitoring.
              </strong></p>
    done_when: The layout clearly details database choices, API endpoints, caching layers, and latency budgets.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day135: kubernetes cluster deployment and system graduation capstone"'
    sol_id: sol-w18d135t1
    solution_title: ✅ COMPLETE SOLUTION — design_ml_system_architecture.py
    solution_code: "import math\n\ndef calculate_system_design_budget(\n    qps=500,                    # Queries per second\n\
      \    input_tokens=1024,          # Average prompt length\n    output_tokens=128,          # Average response length\n\
      \    model_params_b=8.0,         # 8 Billion parameter model\n    precision_bytes=2,          # FP16 = 2 bytes, INT4\
      \ = 0.5 bytes\n    kv_cache_heads=8,\n    head_dim=128,\n    num_layers=32\n):\n    # 1. Model Weights VRAM\n    model_vram_gb\
      \ = (model_params_b * 10**9 * precision_bytes) / (1024**3)\n    \n    # 2. KV Cache per concurrent request\n    kv_bytes_per_token\
      \ = 2 * num_layers * kv_cache_heads * head_dim * precision_bytes\n    total_tokens_per_req = input_tokens + output_tokens\n\
      \    kv_cache_per_req_mb = (kv_bytes_per_token * total_tokens_per_req) / (1024**2)\n    \n    # 3. Peak Concurrent Active\
      \ Batches\n    avg_latency_sec = 0.8\n    concurrent_requests = qps * avg_latency_sec\n    total_kv_vram_gb = (concurrent_requests\
      \ * kv_cache_per_req_mb) / 1024\n    \n    total_vram_required = model_vram_gb + total_kv_vram_gb\n    gpus_needed =\
      \ math.ceil(total_vram_required / 80) # 80GB A100/H100 GPUs\n    \n    print(f\"ML System Capacity Analysis (Target:\
      \ {qps} QPS):\")\n    print(f\"─\" * 50)\n    print(f\"Model VRAM (Weights):       {model_vram_gb:.2f} GB\")\n    print(f\"\
      KV Cache VRAM ({concurrent_requests:.0f} conc): {total_kv_vram_gb:.2f} GB\")\n    print(f\"Total VRAM Required:    \
      \    {total_vram_required:.2f} GB\")\n    print(f\"Minimum 80GB GPUs Needed:   {gpus_needed}x 80GB H100 SXM5\")\n\n\
      calculate_system_design_budget()\nassert gpus_needed is not None, \"gpus_needed should not be None\""
    solution_lang: python
  - title: Review Model Drift Metrics
    badge: MED
    badge_class: tb-med
    time: 45 min
    prompt_html: |-
      <p><strong>
                Study how data drift is detected using Population Stability Index (PSI) and formulate a monitoring plan for production serving.
               </strong></p>
    done_when: When you can describe how drift alerts trigger automated pipelines to pull new inputs and retrain.
    git_cmd: 'git add review_model_drift_metrics.py &amp;&amp; git commit -m "feat(day): day135: review-model-drift-metrics"'
    sol_id: sol-w18d135t2
    solution_title: ✅ COMPLETE SOLUTION — review_model_drift_metrics.py
    solution_code: "# Day 135 Task 2: Model & Feature Drift Monitoring Engine\nimport numpy as np\nfrom scipy import stats\n\
      \ndef compute_drift_metrics(ref_feature: np.ndarray, prod_feature: np.ndarray) -> dict:\n    \"\"\"Computes KS statistic,\
      \ p-value, and Population Stability Index (PSI).\"\"\"\n    ks_stat, p_val = stats.ks_2samp(ref_feature, prod_feature)\n\
      \    \n    # Binned PSI\n    ref_counts, bin_edges = np.histogram(ref_feature, bins=10)\n    prod_counts, _ = np.histogram(prod_feature,\
      \ bins=bin_edges)\n    \n    ref_pct = (ref_counts + 1e-6) / (np.sum(ref_counts) + 1e-5)\n    prod_pct = (prod_counts\
      \ + 1e-6) / (np.sum(prod_counts) + 1e-5)\n    psi = np.sum((prod_pct - ref_pct) * np.log(prod_pct / ref_pct))\n    \n\
      \    return {\n        \"ks_statistic\": round(float(ks_stat), 4),\n        \"ks_p_value\": round(float(p_val), 4),\n\
      \        \"psi_score\": round(float(psi), 4),\n        \"drift_detected\": bool(p_val < 0.05 or psi > 0.20)\n    }\n\
      \nref_data = np.random.normal(0, 1, 1000)\nshifted_data = np.random.normal(0.5, 1.2, 500)\ndrift_report = compute_drift_metrics(ref_data,\
      \ shifted_data)\nprint(\"Drift Monitoring Report:\", drift_report)\nassert drift_report[\"drift_detected\"] is True\n\
      print(\"✓ Model drift metrics review verified.\")"
    solution_lang: python
