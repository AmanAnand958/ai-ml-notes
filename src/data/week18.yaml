  theory_html: "<h3 class=\"sh3\">4. Model Explainability: TreeSHAP Feature Attribution</h3><div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — src/explainability.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\">import shap\nimport joblib\nimport numpy as np\n\ndef generate_shap_audit_report(model_path: str, X_val):\n    model = joblib.load(model_path)\n    explainer = shap.TreeExplainer(model)\n    shap_values = explainer.shap_values(X_val)\n    \n    # Calculate global mean absolute SHAP feature importance\n    mean_shap = np.abs(shap_values).mean(axis=0)\n    print(\"Top 5 Driving Features by SHAP Attribution:\")\n    for rank, (feat, score) in enumerate(zip(X_val.columns[:5], mean_shap[:5]), 1):\n        print(f\"  {rank}. {feat}: {score:.4f}\")\n</code></pre>\n</div>\n"
