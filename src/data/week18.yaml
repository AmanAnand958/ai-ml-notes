  theory_html: "<h3 class=\"sh3\">1. The ML System Design Defense Framework</h3>\n<p>\nStaff-level and Senior AI engineering\
    \ interviews evaluate architectural maturity across 5 core lifecycle pillars: <strong>Data Ingestion &amp; Quality</strong>,\
