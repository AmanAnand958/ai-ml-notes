- id: 127
  day_num: 127
  title: MLOps Basics & Experiment Tracking
  subtitle: Understand the MLOps lifecycle, use MLflow to track parameters, and record training metrics on a model registry.
  time_estimate: 4 hours
  difficulty: Advanced
  badges:
  - label: ⚡ Advanced
    variant: p
  xp: 150
  objectives:
  - 'Apply: Differentiate model metrics tracking from traditional code versioning workflows.'
  - Integrate MLflow SDK into model training scripts to log hyperparameters, training loss, and val accuracy.
  - Benchmark model performance runs side-by-side inside the local MLflow dashboard.
  checklist:
  - id: chk_127_1
    text: Derive and analyze mathematical and architectural principles for MLOps Basics & Experiment Tracking
  - id: chk_127_2
    text: Build and benchmark production coding pipelines for MLOps Basics & Experiment Tracking
  - id: chk_127_3
    text: Execute and validate test verification suite for Track Hyperparameters with MLflow
  - id: chk_127_4
    text: Evaluate conceptual mastery via interactive flashcards and quiz challenges
  concept_flow:
  - Kubernetes Basics for ML Deployments
  - Cloud Deployment on Render & Railway
  - MLOps Basics & Experiment Tracking
  - 'Capstone Part 1: Project Architecture Specification'
  - 'Capstone Part 2: Model Training & Core Pipeline'
  - 'Capstone Part 3: API Wrapper & Containerization'
  - 'Capstone Part 4: Cloud Deployment & Frontend'
  - GitHub Portfolio Polish
  - Resume & LinkedIn Optimization
