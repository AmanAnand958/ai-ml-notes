        </tr>
      </tbody>
    </table>

    <h3 class="sh3">3. Standard Architecture Decision Record (ADR) Template</h3>
    <div class="cb">
      <div class="cb-head"><span class="cb-lang">markdown — docs/adr/0002-hybrid-search-migration.md</span><div class="cb-btns"><button class="copy-btn" onclick="copyCode(this)">copy</button></div></div>
      <pre><code># ADR 0002: Migration from Pure Dense Search to Hybrid RRF Search

    ## Context &amp; Problem Statement
    Dense semantic embeddings failed on 18% of user queries containing SKU codes, error identifiers (e.g. ERR_0x800), and exact product names.

    ## Decision Drivers
    - Need 99%+ exact match accuracy for technical identifiers.
    - Must preserve semantic synonym matching for natural language queries.
    - Query latency budget: &lt; 50ms at P95.

    ## Considered Options
    1. Fine-tuning bi-encoder on domain vocabulary.
    2. Two-stage Hybrid Search (BM25 + Dense HNSW) fused with Reciprocal Rank Fusion (k=60).

    ## Decision Outcome
    Chosen option: Option 2 (Hybrid RRF). Reduced retrieval failure rate by 82% with only +12ms P95 latency overhead.</code></pre>
