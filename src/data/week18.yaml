      """
      Production Implementation: Deploy Container to Cloud
      Module: Day 131 — Capstone Part 4: Cloud Deployment & Frontend
      """

      #!/usr/bin/env bash
      # 1. Build optimized multi-stage Docker container
      docker build -t sentiment-analyzer:v1.0.0 -f Dockerfile .

      # 2. Test locally before deployment
      docker run -d -p 8000:8000 --name ml-test sentiment-analyzer:v1.0.0
      sleep 3
      curl -X POST http://localhost:8000/predict \
           -H "Content-Type: application/json" \
           -d '{"text": "The production deployment works smoothly with low latency!"}'

      docker stop ml-test && docker rm ml-test

      # 3. Authenticate with Container Registry (e.g., DockerHub / AWS ECR / Render)
      echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      docker tag sentiment-analyzer:v1.0.0 $DOCKER_USERNAME/sentiment-analyzer:v1.0.0
      docker push $DOCKER_USERNAME/sentiment-analyzer:v1.0.0

