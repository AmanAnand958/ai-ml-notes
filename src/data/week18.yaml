      build-model-training-loop"'
    sol_id: sol-w18d129t2
    solution_title: ✅ COMPLETE SOLUTION — build_model_training_loop.py
    solution_code: "<span class=\"cm\"># Step 1: Algorithmic Implementation &amp;\
      \ Core Transformations</span>\n<span class=\"kw\">import</span> torch\n<span\
      \ class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n<span\
      \ class=\"kw\">from</span> torch.utils.data <span class=\"kw\">import</span>\
      \ DataLoader, TensorDataset\n\n<span class=\"kw\">class</span> <span class=\"\
      cls\">ProductionMLP</span>(nn.Module):\n    <span class=\"kw\">def</span> <span\
      \ class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, in_features=<span\
      \ class=\"num\">20</span>, hidden_dim=<span class=\"num\">64</span>, out_classes=<span\
      \ class=\"num\">2</span>):\n        <span class=\"fn\">super</span>().<span\
      \ class=\"fn\">__init__</span>()\n        <span class=\"kw\">self</span>.net\
      \ = nn.<span class=\"fn\">Sequential</span>(\n            nn.<span class=\"\
      fn\">Linear</span>(in_features, hidden_dim),\n            nn.<span class=\"\
      fn\">BatchNorm1d</span>(hidden_dim),\n            nn.<span class=\"fn\">ReLU</span>(),\n\
      \            nn.<span class=\"fn\">Dropout</span>(<span class=\"num\">0.3</span>),\n\
      \            nn.<span class=\"fn\">Linear</span>(hidden_dim, <span class=\"\
      num\">32</span>),\n            nn.<span class=\"fn\">ReLU</span>(),\n      \
      \      nn.<span class=\"fn\">Linear</span>(<span class=\"num\">32</span>, out_classes)\n\
      \        )\n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span\
      \ class=\"kw\">self</span>, x):\n        <span class=\"kw\">return</span> <span\
      \ class=\"kw\">self</span>.<span class=\"fn\">net</span>(x)\n\n<span class=\"\
      kw\">def</span> <span class=\"fn\">train_epoch</span>(model, dataloader, optimizer,\
      \ criterion, device):\n    model.<span class=\"fn\">train</span>()\n    total_loss,\
      \ correct, total = <span class=\"num\">0.0</span>, <span class=\"num\">0</span>,\
      \ <span class=\"num\">0</span>\n    <span class=\"kw\">for</span> X_batch, y_batch\
      \ <span class=\"kw\">in</span> dataloader:\n        X_batch, y_batch = X_batch.<span\
      \ class=\"fn\">to</span>(device), y_batch.<span class=\"fn\">to</span>(device)\n\
      \        optimizer.<span class=\"fn\">zero_grad</span>()\n        logits = <span\
      \ class=\"fn\">model</span>(X_batch)\n        loss = <span class=\"fn\">criterion</span>(logits,\
      \ y_batch)\n        loss.<span class=\"fn\">backward</span>()\n        nn.utils.<span\
      \ class=\"fn\">clip_grad_norm_</span>(model.<span class=\"fn\">parameters</span>(),\
      \ max_norm=<span class=\"num\">1.0</span>)\n        optimizer.<span class=\"\
      fn\">step</span>()\n        \n        total_loss += loss.<span class=\"fn\"\
      >item</span>() * X_batch.<span class=\"fn\">size</span>(<span class=\"num\"\
      >0</span>)\n        correct += (logits.<span class=\"fn\">argmax</span>(dim=<span\
      \ class=\"num\">1</span>) == y_batch).<span class=\"fn\">sum</span>().<span\
      \ class=\"fn\">item</span>()\n        total += y_batch.<span class=\"fn\">size</span>(<span\
      \ class=\"num\">0</span>)\n        \n    <span class=\"kw\">return</span> total_loss\
      \ / total, correct / total"
    solution_lang: python
