  quizzes:
  - num_str: Q1 OF 1
    question: What does a CI/CD pipeline ensure?
    qid: q126_1
    options:
    - letter: A
      text: That changes are automatically tested and deployed reliably.
      is_correct: true
    - letter: B
      text: That models consume less VRAM on local devices.
      is_correct: false
    - letter: C
      text: That Jupyter notebooks run in parallel threads.
      is_correct: false
    - letter: D
      text: Apply Dropout before Batch Normalization with learning rate > 1.0
      is_correct: false
    correct_fb: ✅ Correct! Automated pipelines handle the repetitive build/test/release
      steps, eliminating human errors and speeding up deployment.
    wrong_fb: '❌ Think about what the name stands for: Continuous Integration and
      Continuous Deployment. What is being continuous?'
  - num_str: QUESTION 2 OF 4
    question: What is the main difference between PaaS (e.g. Render/Railway) and IaaS
      (e.g. raw AWS EC2)?
    qid: q126_2
    options:
    - letter: A
      text: PaaS abstracts away server provisioning, OS patching, and SSL certificates,
        allowing instant git-push deployments.
      is_correct: true
    - letter: B
      text: PaaS is strictly free forever while IaaS is always paid.
      is_correct: false
    - letter: C
      text: PaaS does not support Python runtimes.
      is_correct: false
    - letter: D
      text: IaaS runs exclusively on mobile devices.
      is_correct: false
    correct_fb: ✅ Correct! PaaS platforms manage underlying server infrastructure
      automatically.
    wrong_fb: ❌ Incorrect. PaaS provides automated buildpacks and zero-config deployment
      over raw VM management.
  - num_str: QUESTION 3 OF 4
    question: Why should production API keys and database credentials never be hardcoded
      in git repositories?
    qid: q126_3
    options:
    - letter: A
      text: Public or leaked commits expose secrets to automated scrapers; use environment
        variables and secret managers instead.
      is_correct: true
    - letter: B
      text: Because Python syntax forbids strings longer than 20 characters.
      is_correct: false
    - letter: C
      text: Because git commits fail if string variables contain numbers.
      is_correct: false
    - letter: D
      text: Hardcoding is recommended for staging servers.
      is_correct: false
    correct_fb: ✅ Correct! Secrets must always be injected via environment variables
      (`os.environ`).
    wrong_fb: ❌ Incorrect. Hardcoded keys in git history are vulnerable to credential
      theft.
  - num_str: QUESTION 4 OF 4
    question: What does a health check endpoint (e.g. `/healthz` returning `200 OK`)
      enable in cloud serving platforms?
    qid: q126_4
    options:
    - letter: A
      text: Automated platform orchestrators use it to detect failed instances and
        restart unhealthy containers.
      is_correct: true
    - letter: B
      text: It downloads updated machine learning datasets.
      is_correct: false
    - letter: C
      text: It encrypts user passwords.
      is_correct: false
    - letter: D
      text: It measures GPU temperature.
      is_correct: false
    correct_fb: ✅ Correct! Liveness and readiness probes rely on `/healthz` endpoints
      to ensure zero-downtime routing.
    wrong_fb: ❌ Incorrect. Health checks allow orchestrators to know when a container
      is ready to accept traffic.
  flashcards:
  - front: Render / Railway deployment benefits?
    back: Git-integrated, zero-configuration PaaS platforms providing automatic SSL,
      continuous deployment, and environment variable management for lightweight ML
      APIs.
  - front: Docker Containerization on PaaS?
    back: Packaging Python dependencies, Gunicorn WSGI, and model weights into portable
      containers to prevent environment discrepancies between local and cloud.
  - front: Ephemeral Storage in Cloud Apps?
    back: Container file systems on platforms like Render are non-persistent; uploaded
      datasets or serialized models must be stored in object storage (S3/GCS) or persistent
      volumes.
