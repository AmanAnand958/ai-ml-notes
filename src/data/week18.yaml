      cm\">#   chroma_data:</span>\n\n<span class=\"cm\"># --- requirements.txt ---</span>\n\
      <span class=\"cm\"># fastapi==0.111.0</span>\n<span class=\"cm\"># uvicorn[standard]==0.30.0</span>\n\
      <span class=\"cm\"># chromadb==0.5.0</span>\n<span class=\"cm\"># sentence-transformers==3.0.0</span>\n\
      <span class=\"cm\"># openai==1.35.0</span>\n<span class=\"cm\"># pydantic==2.7.0</span>\n\
      \n<span class=\"cm\"># --- .env.example ---</span>\n<span class=\"cm\"># OPENAI_API_KEY=sk-...</span>\n\
      \n<span class=\"cm\"># Build and run</span>\n<span class=\"kw\">import</span>\
      \ subprocess\n<span class=\"fn\">print</span>(<span class=\"str\">\"To build\
