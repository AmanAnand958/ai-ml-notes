  quizzes:
  - num_str: Q1 OF 1
    question: Why is Precision-Recall AUC preferred over ROC AUC for highly imbalanced
      datasets?
    qid: q134_1
    options:
    - letter: A
      text: PR AUC is faster to compute in python.
      is_correct: false
    - letter: B
      text: PR AUC focuses on the minority positive class and is not affected by a
        large count of true negatives, giving a realistic evaluation.
      is_correct: true
    - letter: C
      text: PR AUC ignores false positives entirely.
      is_correct: false
    - letter: D
      text: Apply Dropout before Batch Normalization with learning rate > 1.0
      is_correct: false
    correct_fb: ✅ Correct! ROC AUC contains False Positive Rate, which uses True Negatives
      in the denominator, masking poor minority predictions when TN is huge.
    wrong_fb: ❌ Think about the formulas. FPR = FP / (FP + TN). If TN is 1 million
      and FP is 100, what happens to FPR?
