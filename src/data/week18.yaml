  tasks:
  - title: Build FastAPI Predictions Route
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: |-
      <p><strong>
               Create a FastAPI web server with a POST endpoint that parses input payloads using a Pydantic schema and returns model predictions.
              </strong></p>
    done_when: When accessing localhost:8000/docs displays the interactive Swagger interface with POST schema details.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day130: complete day 130 tasks and coding exercises"'
    sol_id: sol-w18d130t1
    solution_title: ✅ COMPLETE SOLUTION — build_fastapi_predictions_route.py
    solution_code: |-
      # Day 130 Task 1: FastAPI Inference Router with Pydantic Input Validation
      from fastapi import FastAPI, HTTPException
      from pydantic import BaseModel, Field
      import numpy as np

      app = FastAPI(title="Model Prediction API")

      class CustomerPayload(BaseModel):
          age: float = Field(..., ge=18, le=100)
          income: float = Field(..., ge=0)
          tenure_months: int = Field(..., ge=0)

      class PredictionResponse(BaseModel):
          churn_probability: float
          decision: str

      @app.post("/predict", response_model=PredictionResponse)
      def predict_churn(payload: CustomerPayload):
          # Simulated calibrated logistic regression inference
          logit = 0.05 * payload.age - 0.00002 * payload.income - 0.08 * payload.tenure_months
          prob = float(1.0 / (1.0 + np.exp(-logit)))
          return PredictionResponse(
              churn_probability=round(prob, 4),
              decision="CHURN_RISK" if prob > 0.50 else "STABLE"
          )

      res = predict_churn(CustomerPayload(age=35, income=75000, tenure_months=12))
      print("Prediction Response:", res.dict())
      assert res.decision in ["CHURN_RISK", "STABLE"]
      print("✓ FastAPI prediction route verified.")
    solution_lang: bash
