  hinglish: ML experiments mein jab hum 50 models train karte hain, toh yaad rakhna mushkil hota hai ki kaunse hyperparameters
    se best accuracy aayi thi. MLflow har run ke parameters, metrics (accuracy, loss) aur model artifact ko database mein
    log karta hai.
  analogy: 'MLflow is like an automated scientific laboratory notebook: every time you conduct an experiment, it logs exact
    chemical ratios (hyperparameters), temperature curves (loss curves), and stores the resulting compound (model artifact).'
  theory_html: "<h3 class=\"sh3\">1. The MLOps Imperative: Solving Model Chaos</h3>\n<p>\nIn unstructured ML development,\
    \ data scientists train models in Jupyter Notebooks, naming model files <code>model_final_v2_really_final.pkl</code> without\
    \ recording what learning rate, dataset version, or random seed produced that specific artifact. When accuracy degrades\
    \ in production months later, nobody can reproduce the training run.\n</p>\n<p>\n<strong>MLOps (Machine Learning Operations)</strong>\
    \ standardizes the ML lifecycle across three foundational pillars:\n</p>\n<ol>\n  <li><strong>Reproducibility:</strong>\
    \ Every model binary is deterministically linked to exact git commit hashes, dataset version tags, and hyperparameter\
    \ dictionaries.</li>\n  <li><strong>Governance:</strong> Centralized model registries track staging and production promotion\
    \ states with audit logs.</li>\n  <li><strong>Continuous Telemetry:</strong> Production inference streams are monitored\
    \ for data drift and prediction latency regression.</li>\n</ol>\n\n<h3 class=\"sh3\">2. MLflow Tracking Architecture</h3>\n\
    <div class=\"mermaid\">\ngraph TD\n    Script[\"Training Script (train.py)\"] -->|Logs Parameters & Metrics| BackendStore[\"\
    PostgreSQL Relational DB (Run Metadata)\"]\n    Script -->|Uploads Model Binaries & Artifacts| S3Storage[\"AWS S3 / MinIO\
    \ (Artifact Storage)\"]\n    BackendStore --> MLflowServer[\"MLflow Tracking Server UI (:5000)\"]\n    S3Storage --> MLflowServer\n\
    \    MLflowServer --> Registry[\"MLflow Model Registry\n(@champion / @challenger)\"]\n    Registry --> ProdAPI[\"FastAPI\
    \ Production Service\n(Loads models:/ChurnModel@champion)\"]\n</div>\n<div class=\"diagram-cap\">Figure 127.1: MLflow\
    \ Tracking Architecture decoupling metadata from heavy model artifacts.</div>\n\n<h3 class=\"sh3\">3. Production Python\
    \ MLflow Tracking Implementation</h3>\n<div class=\"cb\">\n  <div class=\"cb-head\"><span class=\"cb-lang\">python</span><div\
    \ class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n  <pre><code><span\
    \ class=\"kw\">import</span> mlflow\n<span class=\"kw\">import</span> mlflow.sklearn\n<span class=\"kw\">from</span> sklearn.ensemble\
    \ <span class=\"kw\">import</span> RandomForestClassifier\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"\
    kw\">import</span> accuracy_score, f1_score\n\n<span class=\"cm\"># 1. Set Remote Tracking Server</span>\nmlflow.set_tracking_uri(<span\
    \ class=\"str\">\"http://localhost:5000\"</span>)\nmlflow.set_experiment(<span class=\"str\">\"customer-churn-v1\"</span>)\n\
    \n<span class=\"kw\">with</span> mlflow.start_run(run_name=<span class=\"str\">\"rf_depth_12_estimators_200\"</span>):\n\
    \    params = {<span class=\"str\">\"n_estimators\"</span>: <span class=\"num\">200</span>, <span class=\"str\">\"max_depth\"\
    </span>: <span class=\"num\">12</span>, <span class=\"str\">\"random_state\"</span>: <span class=\"num\">42</span>}\n\
    \    mlflow.log_params(params)\n    \n    model = RandomForestClassifier(**params)\n    model.fit(X_train, y_train)\n\
    \    \n    preds = model.predict(X_test)\n    acc = accuracy_score(y_test, preds)\n    f1 = f1_score(y_test, preds, average=<span\
    \ class=\"str\">\"macro\"</span>)\n    \n    mlflow.log_metrics({<span class=\"str\">\"test_accuracy\"</span>: acc, <span\
    \ class=\"str\">\"test_f1\"</span>: f1})\n    \n    <span class=\"cm\"># Log model with explicit input/output signature</span>\n\
    \    mlflow.sklearn.log_model(\n        sk_model=model,\n        artifact_path=<span class=\"str\">\"model\"</span>,\n\
    \        registered_model_name=<span class=\"str\">\"CustomerChurnClassifier\"</span>\n    )</code></pre>\n</div>"
  predict:
    question: What is the dimensionality rank of a 2D batch tensor of shape (32, 128)?
