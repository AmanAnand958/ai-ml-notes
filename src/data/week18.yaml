  hinglish: ML experiments mein jab hum 50 models train karte hain, toh yaad rakhna mushkil hota hai ki kaunse hyperparameters se best accuracy aayi thi. MLflow har run ke parameters, metrics (accuracy, loss) aur model artifact ko database mein log karta hai.
  analogy: 'MLflow is like an automated scientific laboratory notebook: every time you conduct an experiment, it logs exact chemical ratios (hyperparameters), temperature curves (loss curves), and stores the resulting compound (model artifact).'
  theory_html: "<div class=\"math-block\">\n$$ \\mathcal{L}_{track}(\\theta) = \\sum_{t=1}^{T} \\alpha_t \\cdot \\text{Loss}(\\theta_t) + \\lambda \\cdot |\\text{Drift}(\\theta_t, \\theta_0)| $$\n<p class=\"math-caption\">Tracking optimization function balancing performance loss and model drift over time.</p>\n</div><h3 class=\"sh3\">Production Engineering Walkthrough: MLOps Basics &amp; Experiment Tracking</h3><div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — production_mlflow_tracker.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre>\n# Production implementation with validated runtime dependencies\n\n# Day 127 — Production MLflow Experiment Tracker\nimport mlflow, time, logging, json\nfrom typing import Dict, Any, Optional\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"MLflowTracker\")\n\nclass MLflowExperimentTracker:\n\
    \    \"\"\"Production MLflow tracking with auto-registration and stage promotion.\"\"\"\n\n    def __init__(self, experiment_name: str, tracking_uri: str = \"http://localhost:5000\"):\n        mlflow.set_tracking_uri(tracking_uri)\n        mlflow.set_experiment(experiment_name)\n        self.experiment_name = experiment_name\n        self.client = mlflow.MlflowClient()\n\n    def log_training_run(self, params: Dict[str, Any], metrics: Dict[str, float],\n                          model, artifact_path: str = \"model\", run_name: str = \"run\") -&gt; str:\n        with mlflow.start_run(run_name=run_name) as run:\n            mlflow.log_params(params)\n            mlflow.log_metrics(metrics)\n            mlflow.sklearn.log_model(model, artifact_path=artifact_path,\n                                      registered_model_name=self.experiment_name)\n            run_id = run.info.run_id\n            logger.info(f\"Run {run_id}: params={params}, metrics={metrics}\")\n            return run_id\n\
    \n    def promote_best_model(self, metric_key: str = \"val_f1\", stage: str = \"Staging\") -&gt; Optional[str]:\n        exp = self.client.get_experiment_by_name(self.experiment_name)\n        runs = self.client.search_runs(\n            experiment_ids=[exp.experiment_id],\n            order_by=[f\"metrics.{metric_key} DESC\"], max_results=1\n        )\n        if not runs:\n            logger.warning(\"No runs found to promote\")\n            return None\n        versions = self.client.get_latest_versions(self.experiment_name, stages=[\"None\"])\n        if not versions:\n            return None\n        v = versions[0]\n        self.client.transition_model_version_stage(self.experiment_name, v.version, stage)\n        logger.info(f\"Promoted v{v.version} ({runs[0].info.run_id[:8]}) to {stage}\")\n        return v.version\n\n    def get_production_model(self):\n        versions = self.client.get_latest_versions(self.experiment_name, stages=[\"Production\"])\n        if not versions:\n\
    \            raise RuntimeError(f\"No Production model for {self.experiment_name}\")\n        return mlflow.pyfunc.load_model(f\"models:/{self.experiment_name}/Production\")\n\nif __name__ == \"__main__\":\n    print(\"MLflowExperimentTracker: connects to localhost:5000 by default\")\n    print(\"Flow: log_training_run -&gt; promote_best_model(Staging) -&gt; promote(Production)\")\n    print(\"Start server: mlflow server --host 0.0.0.0 --port 5000\")\n</pre>\n</div><p>\nMLOps systems require a dual storage architecture: relational databases (PostgreSQL) manage user metadata, access tokens, and structured feature tables with strict ACID guarantees, while object stores (S3/GCS) store large immutable artifact blobs (serialized pickle models, ONNX graphs, and evaluation datasets). Storing model binaries directly inside relational rows introduces severe I/O bottlenecks during horizontal scaling.\n</p>\n"
