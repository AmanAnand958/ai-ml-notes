  theory_html: "<div class=\"math-block\">\n$$ \\text{Throughput} = \\frac{C \\cdot \\text{BatchSize}}{\\text{Latency}_{avg}} \\quad \\text{where } C \\text{ is concurrent workers.} $$\n<p class=\"math-caption\">Theoretical maximum throughput for a FastAPI + Uvicorn worker architecture.</p>\n</div><div class=\"diagram-container\" style=\"background:var(--bg3); padding:1rem; border-radius:8px; margin:1rem 0; border:1px solid var(--border);\">\n<p><strong>System Execution Flowchart: Capstone Part 3: API Wrapper &amp; Containerization</strong></p>\n<div class=\"mermaid\">\ngraph LR\n    Input[\"1. Client Ingress Request\"] --&gt; Validate[\"2. Schema Validation &amp; Guardrails\"]\n    Validate --&gt; Pipeline[\"3. Core Computational Engine\"]\n    Pipeline --&gt; Cache[\"4. High-Speed Cache &amp; Telemetry\"]\n    Cache --&gt; Egress[\"5. Verified Output Response\"]\n</div>\n</div>\n"
