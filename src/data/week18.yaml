  tasks:
  - title: Design ML System Architecture
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n         Draft a complete system design document for a real-time\
      \ product recommendation engine, covering data pipes, retrieval, ranking, and\
      \ monitoring.\n        </p>"
    done_when: The layout clearly details database choices, API endpoints, caching
      layers, and latency budgets.
    git_cmd: 'git add . &amp;&amp; git commit -m "day135: kubernetes cluster deployment
      and system graduation capstone"'
    sol_id: sol-w18d135t1
    solution_title: ✅ COMPLETE SOLUTION — design_ml_system_architecture.py
    solution_code: "import math\n\ndef calculate_system_design_budget(\n    qps=500,\
      \                    # Queries per second\n    input_tokens=1024,          #\
      \ Average prompt length\n    output_tokens=128,          # Average response\
      \ length\n    model_params_b=8.0,         # 8 Billion parameter model\n    precision_bytes=2,\
      \          # FP16 = 2 bytes, INT4 = 0.5 bytes\n    kv_cache_heads=8,\n    head_dim=128,\n\
      \    num_layers=32\n):\n    # 1. Model Weights VRAM\n    model_vram_gb = (model_params_b\
      \ * 10**9 * precision_bytes) / (1024**3)\n    \n    # 2. KV Cache per concurrent\
      \ request\n    kv_bytes_per_token = 2 * num_layers * kv_cache_heads * head_dim\
      \ * precision_bytes\n    total_tokens_per_req = input_tokens + output_tokens\n\
      \    kv_cache_per_req_mb = (kv_bytes_per_token * total_tokens_per_req) / (1024**2)\n\
      \    \n    # 3. Peak Concurrent Active Batches\n    avg_latency_sec = 0.8\n\
      \    concurrent_requests = qps * avg_latency_sec\n    total_kv_vram_gb = (concurrent_requests\
      \ * kv_cache_per_req_mb) / 1024\n    \n    total_vram_required = model_vram_gb\
      \ + total_kv_vram_gb\n    gpus_needed = math.ceil(total_vram_required / 80)\
      \ # 80GB A100/H100 GPUs\n    \n    print(f\"ML System Capacity Analysis (Target:\
      \ {qps} QPS):\")\n    print(f\"─\" * 50)\n    print(f\"Model VRAM (Weights):\
      \       {model_vram_gb:.2f} GB\")\n    print(f\"KV Cache VRAM ({concurrent_requests:.0f}\
      \ conc): {total_kv_vram_gb:.2f} GB\")\n    print(f\"Total VRAM Required:   \
      \     {total_vram_required:.2f} GB\")\n    print(f\"Minimum 80GB GPUs Needed:\
      \   {gpus_needed}x 80GB H100 SXM5\")\n\ncalculate_system_design_budget()"
    solution_lang: python
  - title: Review Model Drift Metrics
    badge: MED
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n          Study how data drift is detected using Population\
      \ Stability Index (PSI) and formulate a monitoring plan for production serving.\n\
      \         </p>"
    done_when: You can describe how drift alerts trigger automated pipelines to pull
      new inputs and retrain.
    git_cmd: 'git add review_model_drift_metrics.py &amp;&amp; git commit -m "day135:
      review-model-drift-metrics"'
    sol_id: sol-w18d135t2
    solution_title: ✅ COMPLETE SOLUTION — review_model_drift_metrics.py
    solution_code: "# review_model_drift_metrics.py — Solution\n# Complete solution\
      \ for: Review Model Drift Metrics\n\nimport numpy as np\n\ndef compute_classification_metrics(y_true,\
      \ y_pred_probs, threshold=0.5):\n    y_pred = (y_pred_probs >= threshold).astype(int)\n\
      \    tp = np.sum((y_true == 1) & (y_pred == 1))\n    fp = np.sum((y_true ==\
      \ 0) & (y_pred == 1))\n    fn = np.sum((y_true == 1) & (y_pred == 0))\n    tn\
      \ = np.sum((y_true == 0) & (y_pred == 0))\n    \n    accuracy = (tp + tn) /\
      \ len(y_true)\n    precision = tp / (tp + fp) if (tp + fp) > 0 else 0\n    recall\
      \ = tp / (tp + fn) if (tp + fn) > 0 else 0\n    f1 = 2 * precision * recall\
      \ / (precision + recall) if (precision + recall) > 0 else 0\n    \n    return\
      \ {\"accuracy\": accuracy, \"precision\": precision, \"recall\": recall, \"\
      f1_score\": f1}\n\ny_true = np.array([1, 0, 1, 1, 0, 1, 0, 0])\ny_probs = np.array([0.9,\
      \ 0.1, 0.8, 0.4, 0.2, 0.7, 0.6, 0.3])\nmetrics = compute_classification_metrics(y_true,\
      \ y_probs)\nprint(f\"Evaluation for {task_title}:\")\nfor k, v in metrics.items():\n\
      \    print(f\"  {k}: {v:.4f}\")\n\nif __name__ == '__main__':\n    solve()"
    solution_lang: python
