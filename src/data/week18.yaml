    solution_title: ✅ COMPLETE SOLUTION — select_capstone_track.py
    solution_code: "# select_capstone_track.py — Solution\n# Complete solution for:\
      \ Select Capstone Track\n\n# QLoRA Fine-Tuning on Google Colab\n# Requires:\
      \ pip install transformers peft bitsandbytes datasets trl accelerate\n\nimport\
      \ torch\nfrom transformers import AutoModelForCausalLM, AutoTokenizer, BitsAndBytesConfig\n\
      from peft import LoraConfig, get_peft_model, prepare_model_for_kbit_training\n\
      from datasets import load_dataset\nfrom trl import SFTTrainer, SFTConfig\n\n\
      # 1. Load model in 4-bit quantization (QLoRA)\nbnb_config = BitsAndBytesConfig(\n\
      \    load_in_4bit=True,\n    bnb_4bit_quant_type=\"nf4\",\n    bnb_4bit_compute_dtype=torch.float16,\n\
      \    bnb_4bit_use_double_quant=True,\n)\n\nmodel_name = \"TinyLlama/TinyLlama-1.1B-Chat-v1.0\"\
      \nmodel = AutoModelForCausalLM.from_pretrained(\n    model_name, quantization_config=bnb_config,\
      \ device_map=\"auto\"\n)\ntokenizer = AutoTokenizer.from_pretrained(model_name)\n\
      tokenizer.pad_token = tokenizer.eos_token\n\n# 2. Prepare for k-bit training\n\
      model = prepare_model_for_kbit_training(model)\n\n# 3. Configure LoRA\nlora_config\
      \ = LoraConfig(\n    r=16,                    # Low rank\n    lora_alpha=32,\
      \           # Scaling factor\n    target_modules=[\"q_proj\", \"v_proj\"], \
      \ # Which layers to adapt\n    lora_dropout=0.05,\n    bias=\"none\",\n    task_type=\"\
      CAUSAL_LM\",\n)\nmodel = get_peft_model(model, lora_config)\nmodel.print_trainable_parameters()\
      \  # Should show ~0.5% trainable\n\n# 4. Load dataset\ndataset = load_dataset(\"\
      tatsu-lab/alpaca\", split=\"train[:1000]\")\n\ndef format_instruction(example):\n\
      \    if example.get(\"input\"):\n        return f\"### Instruction:\\n{example['instruction']}\\\
      n\\n### Input:\\n{example['input']}\\n\\n### Response:\\n{example['output']}\"\
      \n    return f\"### Instruction:\\n{example['instruction']}\\n\\n### Response:\\\
      n{example['output']}\"\n\n# 5. Train with SFTTrainer\ntraining_args = SFTConfig(\n\
      \    output_dir=\"./qlora-output\",\n    num_train_epochs=1,\n    per_device_train_batch_size=4,\n\
      \    gradient_accumulation_steps=4,\n    learning_rate=2e-4,\n    fp16=True,\n\
      \    logging_steps=10,\n    save_strategy=\"epoch\",\n    max_seq_length=512,\n\
      )\n\ntrainer = SFTTrainer(\n    model=model,\n    train_dataset=dataset,\n \
      \   formatting_func=format_instruction,\n    args=training_args,\n    tokenizer=tokenizer,\n\
      )\n\ntrainer.train()\n\n# 6. Save LoRA adapter (small, ~16MB)\nmodel.save_pretrained(\"\
      ./qlora-adapter\")\ntokenizer.save_pretrained(\"./qlora-adapter\")\nprint(\"\
      LoRA adapter saved! Merge with base model for deployment.\")\n\nif __name__\
      \ == '__main__':\n    solve()"
