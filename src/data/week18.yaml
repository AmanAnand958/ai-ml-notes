    solution_title: ✅ COMPLETE SOLUTION — compare_runs_in_mlflow_ui.py
    solution_code: "import mlflow\nimport pandas as pd\n\nclient = mlflow.tracking.MlflowClient()\nexperiment = client.get_experiment_by_name(\"Customer_Churn_Optimization\")\n\n# Search all runs in the experiment\nruns = client.search_runs(\n    experiment_ids=[experiment.experiment_id],\n    filter_string=\"\",\n    order_by=[\"metrics.accuracy DESC\", \"metrics.f1_score DESC\"],\n    max_results=10\n)\n\nprint(f\"{'Run ID':<34} | {'Max Depth':<10} | {'N Est':<6} | {'Accuracy':<10} | {'F1-Score':<10}\")\nprint(\"─\" * 80)\nfor run in runs:\n    run_id = run.info.run_id\n    depth = run.data.params.get(\"max_depth\", \"N/A\")\n    n_est = run.data.params.get(\"n_estimators\", \"N/A\")\n    acc = run.data.metrics.get(\"accuracy\", 0.0)\n    f1 = run.data.metrics.get(\"f1_score\", 0.0)\n    print(f\"{run_id:<34} | {depth:<10} | {n_est:<6} | {acc:<10.4f} | {f1:<10.4f}\")\n\nbest_run = runs[0]\nprint(f\"\\n\U0001F3C6 Best Champion Model Run ID: {best_run.info.run_id} (Accuracy: {best_run.data.metrics['accuracy']:.4f})\"\
      )\nassert best_run is not None, \"best_run should not be None\""
    solution_lang: python
