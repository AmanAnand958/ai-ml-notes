    git_cmd: 'git add . &amp;&amp; git commit -m "day135: kubernetes cluster deployment
      and system graduation capstone"'
    sol_id: sol-w18d135t1
    solution_title: ✅ COMPLETE SOLUTION — design_ml_system_architecture.py
    solution_code: "<span class=\"kw\">import</span> math\n\n<span class=\"kw\">def</span>\
      \ <span class=\"fn\">calculate_system_design_budget</span>(\n    qps=<span class=\"\
      num\">500</span>,                    <span class=\"cm\"># Queries per second</span>\n\
      \    input_tokens=<span class=\"num\">1024</span>,          <span class=\"cm\"\
      ># Average prompt length</span>\n    output_tokens=<span class=\"num\">128</span>,\
      \          <span class=\"cm\"># Average response length</span>\n    model_params_b=<span\
      \ class=\"num\">8.0</span>,         <span class=\"cm\"># 8 Billion parameter\
      \ model</span>\n    precision_bytes=<span class=\"num\">2</span>,          <span\
      \ class=\"cm\"># FP16 = 2 bytes, INT4 = 0.5 bytes</span>\n    kv_cache_heads=<span\
      \ class=\"num\">8</span>,\n    head_dim=<span class=\"num\">128</span>,\n  \
      \  num_layers=<span class=\"num\">32</span>\n):\n    <span class=\"cm\"># 1.\
      \ Model Weights VRAM</span>\n    model_vram_gb = (model_params_b * <span class=\"\
      num\">10</span>**<span class=\"num\">9</span> * precision_bytes) / (<span class=\"\
      num\">1024</span>**<span class=\"num\">3</span>)\n    \n    <span class=\"cm\"\
      ># 2. KV Cache per concurrent request</span>\n    kv_bytes_per_token = <span\
      \ class=\"num\">2</span> * num_layers * kv_cache_heads * head_dim * precision_bytes\n\
      \    total_tokens_per_req = input_tokens + output_tokens\n    kv_cache_per_req_mb\
      \ = (kv_bytes_per_token * total_tokens_per_req) / (<span class=\"num\">1024</span>**<span\
      \ class=\"num\">2</span>)\n    \n    <span class=\"cm\"># 3. Peak Concurrent\
      \ Active Batches</span>\n    avg_latency_sec = <span class=\"num\">0.8</span>\n\
      \    concurrent_requests = qps * avg_latency_sec\n    total_kv_vram_gb = (concurrent_requests\
      \ * kv_cache_per_req_mb) / <span class=\"num\">1024</span>\n    \n    total_vram_required\
      \ = model_vram_gb + total_kv_vram_gb\n    gpus_needed = math.<span class=\"\
      fn\">ceil</span>(total_vram_required / <span class=\"num\">80</span>) <span\
      \ class=\"cm\"># 80GB A100/H100 GPUs</span>\n    \n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"ML System Capacity Analysis (Target: {qps} QPS):\"</span>)\n\
      \    <span class=\"fn\">print</span>(<span class=\"str\">f\"─\"</span> * <span\
      \ class=\"num\">50</span>)\n    <span class=\"fn\">print</span>(<span class=\"\
      str\">f\"Model VRAM (Weights):       {model_vram_gb:.2f} GB\"</span>)\n    <span\
      \ class=\"fn\">print</span>(<span class=\"str\">f\"KV Cache VRAM ({concurrent_requests:.0f}\
      \ conc): {total_kv_vram_gb:.2f} GB\"</span>)\n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Total VRAM Required:        {total_vram_required:.2f} GB\"\
      </span>)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Minimum\
      \ 80GB GPUs Needed:   {gpus_needed}x 80GB H100 SXM5\"</span>)\n\n<span class=\"\
      fn\">calculate_system_design_budget</span>()"
    solution_lang: python
