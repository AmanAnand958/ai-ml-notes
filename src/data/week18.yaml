  flashcards:
  - front: Bias-Variance Tradeoff in System Interviews?
    back: High bias = underfitting (oversimplified model); high variance = overfitting
      (sensitive to noise). Balanced via regularization, cross-validation, and ensembles.
  - front: Post-Training Quantization (PTQ)
    back: 'Precision: TP / (TP + FP) (crucial when false positives are costly, e.g.
      spam); Recall: TP / (TP + FN) (crucial when false negatives are dangerous, e.g.
      cancer detection).'
  - front: First-order iterative optimization algorithm finding local minima by moving
      in the direction of steepest negative gradient.
    back: Vanilla GD uses constant step sizes along the gradient. Adam combines momentum
      (moving average of gradients) and RMSprop (scaling by root mean square of gradients).
