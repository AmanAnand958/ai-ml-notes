  hinglish: Capstone ke is part mein hum data cleaning, train-test split, feature engineering aur automated hyperparameter tuning (Optuna) execute karte hain. Final model ko evaluate karke binary format mein export karte hain.
  analogy: 'Model training is like tuning an F1 race engine: engineers run diagnostic tests across fuel-air mixtures (hyperparameters) on dyno tracks (cross-validation) to extract peak horsepower (accuracy) without blowing the engine (overfitting).'
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">1. Production Preprocessing: The Scikit-Learn ColumnTransformer Pattern</h3>\n<p>\nIn enterprise ML pipelines, feature transformations must be atomic and serializable. Never execute ad-hoc Pandas data cleaning in separate scripts; encapsulate all imputation, scaling, and categorical encoding into a single Scikit-Learn <code>Pipeline</code>:\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — src/pipeline.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\">import pandas as pd\nimport numpy as np\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.preprocessing import RobustScaler, OneHotEncoder\nfrom sklearn.ensemble import HistGradientBoostingClassifier\nimport joblib\n\ndef create_end_to_end_pipeline(num_features:\
    \ list, cat_features: list) -&gt; Pipeline:\n    num_pipeline = Pipeline([\n        ('imputer', SimpleImputer(strategy='median')),\n        ('scaler', RobustScaler())\n    ])\n\n    cat_pipeline = Pipeline([\n        ('imputer', SimpleImputer(strategy='constant', fill_value='UNKNOWN')),\n        ('encoder', OneHotEncoder(handle_unknown='ignore', sparse_output=False))\n    ])\n\n    preprocessor = ColumnTransformer(transformers=[\n        ('num', num_pipeline, num_features),\n        ('cat', cat_pipeline, cat_features)\n    ])\n\n    full_pipeline = Pipeline([\n        ('preprocessor', preprocessor),\n        ('classifier', HistGradientBoostingClassifier(max_iter=200, random_state=42))\n    ])\n\n    return full_pipeline</code></pre>\n</div>\n<h3 class=\"sh3\">2. Bayesian Hyperparameter Optimization with Optuna</h3>\n<p>\nGrid search is computationally inefficient ($O(\\prod |S_i|)$), while Random Search ignores trial history. <strong>Tree-structured Parzen Estimators (TPE)</strong> in\
    \ Optuna construct a probabilistic model of the objective function:\n</p>\n<div class=\"math-block\">\n$$p(\\theta \\mid y) = \\begin{cases} \\ell(\\theta) &amp; \\text{if } y \\lt  y^* \\ g(\\theta) &amp; \\text{if } y \\ge y^* \\end{cases}$$\n</div>\n<p>\nOptuna samples candidate hyperparameter configurations that maximize the expected improvement ratio $\\frac{\\ell(\\theta)}{g(\\theta)}$, finding optimal hyperparameters in <strong>10x fewer iterations</strong> than random search.\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — src/tune.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\">import optuna\nfrom sklearn.model_selection import cross_val_score\n\ndef objective(trial, X, y):\n    params = {\n        'learning_rate': trial.suggest_float('learning_rate', 0.01, 0.2, log=True),\n        'max_leaf_nodes': trial.suggest_int('max_leaf_nodes', 15, 63),\n\
    \        'min_samples_leaf': trial.suggest_int('min_samples_leaf', 10, 100),\n        'l2_regularization': trial.suggest_float('l2_regularization', 1e-4, 10.0, log=True)\n    }\n    \n    model = HistGradientBoostingClassifier(**params, random_state=42)\n    scores = cross_val_score(model, X, y, cv=5, scoring='roc_auc', n_jobs=-1)\n    return scores.mean()\n\n# Execute 100 Bayesian optimization trials\nstudy = optuna.create_study(direction='maximize')\n# study.optimize(lambda trial: objective(trial, X_train, y_train), n_trials=100)</code></pre>\n</div>\n<h3 class=\"sh3\">Engineering Decision Matrix: General Production Trade-offs</h3>\n<div style=\"overflow-x:auto;\">\n<table style=\"width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px; text-align:left;\">\n<thead>\n<tr style=\"border-bottom:2px solid var(--border); background:var(--bg-secondary);\">\n<th style=\"padding:10px;\">Architecture Strategy</th>\n<th style=\"padding:10px;\">Upfront Cost</th>\n<th style=\"padding:10px;\"\
    >Maintenance</th>\n<th style=\"padding:10px;\">Scalability</th>\n<th style=\"padding:10px;\">Time-to-Market</th>\n</tr>\n</thead>\n<tbody>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Monolithic MVP</strong></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span> (Initially)</td>\n<td style=\"padding:10px;\">Poor</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Fast</span> (&lt; 1 week)</td>\n</tr>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Microservices</strong></td>\n<td style=\"padding:10px;\"\
    ><span style=\"color:var(--orange);\">High</span></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--orange);\">High</span></td>\n<td style=\"padding:10px;\">Excellent</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--red);\">Slow</span> (Months)</td>\n</tr>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Serverless Functions</strong></td>\n<td style=\"padding:10px;\">Medium</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span></td>\n<td style=\"padding:10px;\">Infinite</td>\n<td style=\"padding:10px;\">Medium</td>\n</tr>\n</tbody>\n</table>\n</div>\n<div class=\"diagram-container\" style=\"background:var(--bg3); padding:1rem; border-radius:8px; margin:1rem 0; border:1px solid var(--border);\">\n<p><strong>System Execution Flowchart: Capstone Part 2: Model Training\
    \ &amp; Core Pipeline</strong></p>\n<div class=\"mermaid\">\ngraph LR\n    Input[\"1. Client Ingress Request\"] --&gt; Validate[\"2. Schema Validation &amp; Guardrails\"]\n    Validate --&gt; Pipeline[\"3. Core Computational Engine\"]\n    Pipeline --&gt; Cache[\"4. High-Speed Cache &amp; Telemetry\"]\n    Cache --&gt; Egress[\"5. Verified Output Response\"]\n</div>\n</div>\n<h3 class=\"sh3\">4. Model Explainability: TreeSHAP Feature Attribution</h3>\n<p>\nBefore promoting an ensemble model to the production registry, engineers must audit feature attribution using TreeSHAP to verify that predictions align with domain logic and do not exploit spurious correlations or proxy bias:\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — src/explainability.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\">import shap\nimport joblib\nimport numpy as np\n\ndef generate_shap_audit_report(model_path:\
    \ str, X_val):\n    model = joblib.load(model_path)\n    explainer = shap.TreeExplainer(model)\n    shap_values = explainer.shap_values(X_val)\n    \n    # Calculate global mean absolute SHAP feature importance\n    mean_shap = np.abs(shap_values).mean(axis=0)\n    print(\"Top 5 Driving Features by SHAP Attribution:\")\n    for rank, (feat, score) in enumerate(zip(X_val.columns[:5], mean_shap[:5]), 1):\n        print(f\"  {rank}. {feat}: {score:.4f}\")\n</code></pre>\n</div>\n"
