  theory_html: "<div class=\"math-block\">\n$$ P(\\text{Healthy}) = \\lim_{n \\to \\infty} \\left(1 - \\frac{1}{n}\\right)^{\\text{Retries}} = e^{-1} \\approx 36.8\\% \\text{ (baseline)} $$\n<p class=\"math-caption\">Probability analysis of health-check success over repeated polling intervals.</p>\n</div><h3 class=\"sh3\">Production Engineering Walkthrough: Capstone Part 4: Cloud Deployment &amp; Frontend</h3><div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — production_day_131_implementation.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\"># Day 131 — Production Render/Railway Deployment Checker\nimport subprocess, json, time, logging, os\nfrom typing import Dict, Any, Optional\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"DeploymentChecker\")\n\nclass RenderHealthChecker:\n    \"\"\"\n\
    \    Checks live deployment health via HTTP polling.\n    Verifies /health endpoint after each deployment before marking as live.\n    \"\"\"\n\n    def __init__(self, service_url: str, max_retries: int = 20, retry_delay: float = 15.0):\n        self.url = service_url.rstrip(\"/\")\n        self.max_retries = max_retries\n        self.retry_delay = retry_delay\n\n    def check_health(self) -&gt; Dict[str, Any]:\n        import urllib.request, urllib.error\n        try:\n            t0 = time.perf_counter()\n            req = urllib.request.urlopen(f\"{self.url}/health\", timeout=10)\n            latency_ms = (time.perf_counter() - t0) * 1000\n            body = json.loads(req.read().decode())\n            return {\"status\": \"healthy\", \"http_status\": req.status,\n                    \"body\": body, \"latency_ms\": round(latency_ms, 1)}\n        except Exception as e:\n            return {\"status\": \"unhealthy\", \"error\": str(e)}\n\n    def wait_until_live(self) -&gt; bool:\n\
    \        for attempt in range(1, self.max_retries + 1):\n            result = self.check_health()\n            logger.info(f\"Health check {attempt}/{self.max_retries}: {result['status']}\")\n            if result[\"status\"] == \"healthy\":\n                return True\n            time.sleep(self.retry_delay)\n        return False\n\n    def smoke_test(self, test_payload: Dict, endpoint: str = \"/predict\") -&gt; Dict:\n        import urllib.request, json\n        data = json.dumps(test_payload).encode()\n        req = urllib.request.Request(\n            f\"{self.url}{endpoint}\", data=data,\n            headers={\"Content-Type\": \"application/json\"}, method=\"POST\"\n        )\n        try:\n            resp = urllib.request.urlopen(req, timeout=30)\n            return {\"pass\": True, \"response\": json.loads(resp.read().decode())}\n        except Exception as e:\n            return {\"pass\": False, \"error\": str(e)}\n\nif __name__ == \"__main__\":\n    print(\"RenderHealthChecker:\
    \ HTTP-based deployment validation\")\n    print(\"Flow: deploy → wait_until_live (poll /health) → smoke_test /predict\")\n    # Simulate health check structure\n    mock_result = {\"status\": \"healthy\", \"http_status\": 200, \"body\": {\"model\": \"loaded\"}, \"latency_ms\": 42.3}\n    print(f\"Mock health check: {mock_result}\")\n    assert mock_result[\"status\"] == \"healthy\"\n    print(\"RenderHealthChecker: OK\")\n</code></pre>\n</div><p>\nDeploying container updates without dropping in-flight inference requests requires configuring readiness probes with appropriate initial delays. During deployment, the ingress load balancer only directs traffic to new pods after model weights are fully deserialized into memory and warm-up inference queries return <code>200 OK</code>.\n</p>\n"
