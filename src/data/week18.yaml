    correct_fb: ✅ Correct! HPA dynamically adjusts replica counts based on observed metric utilization.
    wrong_fb: ❌ Incorrect. HPA scales based on real-time metric thresholds like CPU and queue depth.
    correct: a
  flashcards:
  - front: What is a Kubernetes Pod?
    back: • The smallest deployable compute unit in K8s, containing one or more containers sharing network namespaces and storage volumes.
  - front: Deployment vs StatefulSet?
    back: • Deployments manage stateless replica pods (e.<br/>• g. stateless ML APIs). StatefulSets manage stateful workloads requiring persistent identities (e. g. databases, vector stores).
  - front: Kubernetes Cluster IP vs NodePort vs LoadBalancer?
    back: '• ClusterIP: internal cluster only.<br/>• NodePort: exposes port on each node IP. LoadBalancer: provisions an external cloud load balancer to route traffic.'
  - front: What is a K8s Ingress Controller?
    back: • An API object that manages external access to services, typically HTTP/HTTPS routing, SSL termination, and host/path-based load balancing.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Kubernetes Basics for ML Deployments in distributed systems?'
    back: • Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Missing Resource Requests Leading to Node OOM Kills'
    description: If you don't define `resources.requests` and `resources.limits` for memory and CPU in your ML Pod manifest, a single heavy batch prediction can consume all RAM on the node, causing the Linux OOM-killer to terminate the kubelet and crash the entire node.
