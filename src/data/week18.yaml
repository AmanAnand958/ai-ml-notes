      >\"  4. POST /ingest to add documents\"</span>)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">\"  5. POST /query to ask questions\"</span>)\n\n<span class=\"\
      kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n    <span\
      \ class=\"fn\">solve</span>()"
