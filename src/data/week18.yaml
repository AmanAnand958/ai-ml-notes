  - qid: q126_3
    num_str: Question 3
    question: Why should production API keys and database credentials never be hardcoded in git repositories?
    options:
    - Public or leaked commits expose secrets to automated scrapers; use environment variables and secret managers instead.
    - Because Python syntax forbids strings longer than 20 characters.
    - Because git commits fail if string variables contain numbers.
    - Hardcoding is recommended for staging servers.
