  hinglish: Kubernetes ek container orchestration engine hai jo hamare ML model containers (Pods) ko auto-scale, self-heal
    aur load balance karta hai. Agar koi model container crash hota hai toh K8s automatically naya pod spawn kar deta hai.
  analogy: 'Kubernetes is like an automated airport traffic controller: instead of managing individual flights manually, it
    routes incoming traffic to available gates (Services), replaces broken planes instantly (ReplicaSets), and scales runways
    during peak rush hour (HPA).'
  theory_html: "<h3 class=\"sh3\">1. Why Kubernetes for Machine Learning Deployments?</h3>\n<p>\nModern machine learning workloads\
    \ have unique operational demands that traditional virtual machines and simple serverless functions cannot satisfy:\n\
    </p>\n<ul>\n  <li><strong>GPU Resource Scheduling:</strong> Deep neural networks require physical access to NVIDIA GPUs\
    \ (A100, H100, T4) with dedicated PCIe passthrough or MIG (Multi-Instance GPU) slicing.</li>\n  <li><strong>Shared Memory\
    \ Overhead:</strong> PyTorch multi-processing data loaders allocate large inter-process tensors in <code>/dev/shm</code>.\
    \ Default container runtimes provide only 64MB of shared memory, leading to immediate <code>SIGBUS</code> worker crashes\
    \ without explicit volume mounts.</li>\n  <li><strong>Elastic Autoscaling:</strong> Inference traffic fluctuates drastically.\
    \ Deployments must automatically scale replica pods up or down based on GPU memory queue saturation or Prometheus request\
    \ latency.</li>\n</ul>\n\n<div style=\"margin: 1.5rem 0; text-align: center;\">\n<svg aria-label=\"Kubernetes GPU Workload\
    \ Orchestration\" height=\"260\" viewBox=\"0 0 720 260\" width=\"720\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:\
    \ 100%; height: auto; font-family: var(--font-mono, monospace);\">\n  <defs>\n    <linearGradient id=\"k8s-grad-18\" x1=\"\
    0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#1e293b\"/>\n      <stop offset=\"100%\"\
    \ stop-color=\"#0f172a\"/>\n    </linearGradient>\n  </defs>\n  \n  <rect x=\"10\" y=\"10\" width=\"700\" height=\"240\"\
    \ rx=\"12\" fill=\"url(#k8s-grad-18)\" stroke=\"#334155\" stroke-width=\"2\"/>\n  <text x=\"30\" y=\"38\" fill=\"#94a3b8\"\
    \ font-size=\"13\" font-weight=\"bold\">Kubernetes Worker Node (8x NVIDIA H100 SXM5 — 640GB VRAM)</text>\n  \n  <rect\
    \ x=\"30\" y=\"55\" width=\"130\" height=\"70\" rx=\"8\" fill=\"#1e293b\" stroke=\"#475569\" stroke-width=\"1.5\"/>\n\
    \  <text x=\"50\" y=\"85\" fill=\"#f8fafc\" font-size=\"13\" font-weight=\"bold\">kubelet</text>\n  <text x=\"42\" y=\"\
    105\" fill=\"#94a3b8\" font-size=\"10\">Node Agent</text>\n  \n  <rect x=\"30\" y=\"145\" width=\"130\" height=\"85\"\
    \ rx=\"8\" fill=\"#1e293b\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n  <text x=\"42\" y=\"175\" fill=\"#10b981\" font-size=\"\
    12\" font-weight=\"bold\">NVIDIA Plugin</text>\n  <text x=\"40\" y=\"195\" fill=\"#cbd5e1\" font-size=\"10\">Device Discovery</text>\n\
    \  <text x=\"40\" y=\"210\" fill=\"#94a3b8\" font-size=\"9\">nvidia.com/gpu: 8</text>\n\n  <path d=\"M 160 90 L 210 90\"\
    \ stroke=\"#64748b\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n  <path d=\"M 160 185 L 210 185\" stroke=\"#10b981\"\
    \ stroke-width=\"2\"/>\n\n  <!-- Pod 1 -->\n  <rect x=\"210\" y=\"55\" width=\"220\" height=\"175\" rx=\"8\" fill=\"#0f172a\"\
    \ stroke=\"#3b82f6\" stroke-width=\"2\"/>\n  <text x=\"225\" y=\"80\" fill=\"#60a5fa\" font-size=\"12\" font-weight=\"\
    bold\">Pod: vllm-serving-0</text>\n  \n  <rect x=\"225\" y=\"95\" width=\"190\" height=\"50\" rx=\"6\" fill=\"#1e293b\"\
    \ stroke=\"#475569\"/>\n  <text x=\"235\" y=\"115\" fill=\"#f1f5f9\" font-size=\"11\">vLLM Inference Core</text>\n  <text\
    \ x=\"235\" y=\"132\" fill=\"#38bdf8\" font-size=\"9.5\">Limits: nvidia.com/gpu: 2</text>\n\n  <rect x=\"225\" y=\"155\"\
    \ width=\"190\" height=\"60\" rx=\"6\" fill=\"#1e293b\" stroke=\"#eab308\"/>\n  <text x=\"235\" y=\"175\" fill=\"#facc15\"\
    \ font-size=\"11\">/dev/shm (emptyDir)</text>\n  <text x=\"235\" y=\"192\" fill=\"#cbd5e1\" font-size=\"9.5\">Shared Memory:\
    \ 16Gi</text>\n\n  <!-- Pod 2 -->\n  <rect x=\"460\" y=\"55\" width=\"230\" height=\"175\" rx=\"8\" fill=\"#0f172a\" stroke=\"\
    #3b82f6\" stroke-width=\"2\"/>\n  <text x=\"475\" y=\"80\" fill=\"#60a5fa\" font-size=\"12\" font-weight=\"bold\">Pod:\
    \ vllm-serving-1</text>\n  \n  <rect x=\"475\" y=\"95\" width=\"200\" height=\"50\" rx=\"6\" fill=\"#1e293b\" stroke=\"\
    #475569\"/>\n  <text x=\"485\" y=\"115\" fill=\"#f1f5f9\" font-size=\"11\">vLLM Inference Core</text>\n  <text x=\"485\"\
    \ y=\"132\" fill=\"#38bdf8\" font-size=\"9.5\">Limits: nvidia.com/gpu: 2</text>\n\n  <rect x=\"475\" y=\"155\" width=\"\
    200\" height=\"60\" rx=\"6\" fill=\"#1e293b\" stroke=\"#eab308\"/>\n  <text x=\"485\" y=\"175\" fill=\"#facc15\" font-size=\"\
    11\">/dev/shm (emptyDir)</text>\n  <text x=\"485\" y=\"192\" fill=\"#cbd5e1\" font-size=\"9.5\">Shared Memory: 16Gi</text>\n\
    </svg>\n<div class=\"diagram-cap\">Figure 125.1: Kubernetes GPU Workload Orchestration with Dedicated GPU Allocation and\
    \ /dev/shm Mounts.</div>\n</div>\n\n<h3 class=\"sh3\">2. Core Kubernetes Primitives for ML Engineers</h3>\n<ol>\n  <li><strong>Pod:</strong>\
    \ The smallest deployable computing unit. In ML serving, a Pod encapsulates the inference engine container alongside shared\
    \ volume mounts.</li>\n  <li><strong>Deployment & ReplicaSet:</strong> Declaratively manages pod scaling, zero-downtime\
    \ rolling updates, and automated restarts on OOM crashes.</li>\n  <li><strong>Service (ClusterIP / LoadBalancer):</strong>\
    \ Provides stable internal IP networking and round-robin load balancing across dynamic pod endpoints.</li>\n  <li><strong>ConfigMap\
    \ & Secret:</strong> Decouples model hyperparameters, Hugging Face tokens, and S3 credentials from container images.</li>\n\
    </ol>\n\n<h3 class=\"sh3\">3. Production Kubernetes ML Serving Manifest</h3>\n<div class=\"cb\">\n  <div class=\"cb-head\"\
    ><span class=\"cb-lang\">yaml</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n\
    \  <pre><code>apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ml-inference-deployment\n  namespace: ai-serving\n\
    spec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: ml-inference\n  template:\n    metadata:\n      labels:\n\
    \        app: ml-inference\n    spec:\n      containers:\n      - name: fastapi-server\n        image: custom-registry.io/ml/inference:v1.2\n\
    \        resources:\n          limits:\n            nvidia.com/gpu: 1\n            memory: 16Gi\n            cpu: \"4\"\
    \n          requests:\n            nvidia.com/gpu: 1\n            memory: 8Gi\n            cpu: \"2\"\n        volumeMounts:\n\
    \        - name: dshm\n          mountPath: /dev/shm\n        readinessProbe:\n          httpGet:\n            path: /health\n\
    \            port: 8000\n          initialDelaySeconds: 30\n          periodSeconds: 10\n      volumes:\n      - name:\
    \ dshm\n        emptyDir:\n          medium: Memory\n          sizeLimit: 8Gi</code></pre>\n</div>\n\n<h3 class=\"sh3\"\
    >4. Health Probes: Liveness vs Readiness for ML Models</h3>\n<p>\nLarge models can take 30–60 seconds to deserialize 10GB\
    \ weight tensors into GPU VRAM at startup.\n</p>\n<ul>\n  <li><strong>Readiness Probe:</strong> Checks if weights are\
    \ fully loaded in VRAM. Traffic is NOT routed to the pod until readiness returns HTTP 200.</li>\n  <li><strong>Liveness\
    \ Probe:</strong> Checks if the container process is alive. If the event loop freezes, Kubernetes restarts the pod.</li>\n\
    </ul>"
  predict:
    question: What is the computed throughput (requests per second) for 100 requests served in 2.0 seconds?
    answer: '50'
    explanation: Throughput = total_requests / total_seconds = 100 / 2.0 = 50 req/sec.
    code: |-
      reqs = 100
      sec = 2.0
      rps = int(reqs / sec)
      print(rps)
