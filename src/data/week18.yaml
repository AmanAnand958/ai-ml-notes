    <div class="diagram-cap">Figure 133.1: The Production Engineering Documentation & Governance Lifecycle.</div>

    <h3 class="sh3">2. Quantifiable Impact Metrics in Engineering Portfolios</h3>
    <p>
    Engineers must articulate technical impact through concrete quantitative metrics rather than vague qualitative claims:
    </p>
    <table style="width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px;">
      <thead>
        <tr style="border-bottom:2px solid var(--border); text-align:left;">
          <th style="padding:8px;">Engineering Dimension</th>
          <th style="padding:8px;">Weak Formulation</th>
          <th style="padding:8px;">Production Formulation</th>
        </tr>
      </thead>
      <tbody>
        <tr style="border-bottom:1px solid var(--border);">
          <td style="padding:8px;"><strong>Serving Latency</strong></td>
          <td style="padding:8px;">"Made model inference faster using ONNX."</td>
          <td style="padding:8px;">"Reduced P99 latency from 320ms to 42ms (7.6x speedup) by exporting PyTorch weights to ONNX Runtime with INT8 dynamic quantization."</td>
        </tr>
        <tr style="border-bottom:1px solid var(--border);">
          <td style="padding:8px;"><strong>VRAM &amp; Compute</strong></td>
          <td style="padding:8px;">"Deployed LLM on GPU server."</td>
          <td style="padding:8px;">"Served Llama-3-8B using vLLM PagedAttention, increasing concurrency from 4 to 32 concurrent streams without GPU out-of-memory errors."</td>
        </tr>
        <tr style="border-bottom:1px solid var(--border);">
          <td style="padding:8px;"><strong>Retrieval Precision</strong></td>
          <td style="padding:8px;">"Built RAG pipeline for company documents."</td>
