  - qid: q125_2
    num_str: Question 2
    question: What is the primary role of a Kubernetes Pod?
    options:
    - A physical machine inside a cloud data center.
    - The smallest deployable unit in Kubernetes that encapsulates one or more containers sharing network and storage.
    - A Python package manager.
    - A relational database table.
    answer_idx: 1
    explanation: Pods represent the atomic execution unit in Kubernetes clusters.
  - qid: q125_3
    num_str: Question 3
    question: Why is a Kubernetes Service needed in front of ML Deployment Pods?
    options:
    - It provides a stable IP address and DNS name, load-balancing traffic across ephemeral Pod replicas.
    - To train neural networks faster.
    - To compress Docker container images.
    - To format JSON responses automatically.
    answer_idx: 0
