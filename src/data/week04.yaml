  tasks:
  - title: Monte Carlo Probability Simulator
    badge: 🟢 EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Use numpy.random\
      \ to simulate these probability experiments:\n          </p>\n<ul style=\"padding-left:\
      \ 1.5rem; margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;\"\
      >\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n             (1)\n     \
      \       </strong>\n            Roll two dice 100,000 times — compute P(sum=7)\
      \ and compare to theoretical 6/36\n           </li>\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n<strong>\n             (2)\n            </strong>\n          \
      \  Draw from a deck with replacement — verify P(ace) ≈ 4/52\n           </li>\n\
      <li style=\"margin-bottom: 0.4rem;\">\n<strong>\n             (3)\n        \
      \    </strong>\n            Simulate the birthday paradox: 30 people in a room\
      \ — what's the probability that at least 2 share a birthday? Run 10,000 simulations.\
      \ (Theoretical answer ≈ 70%)\n           </li>\n</ul>"
    done_when: All 3 simulated probabilities match theoretical values within ±1%.
    git_cmd: 'git add . &amp;&amp; git commit -m "day23: monte carlo probability simulations"'
    sol_id: sol-w4d23t1
    solution_title: 📓 Complete Colab Code
    solution_code: "<span class=\"cm\"># Monte Carlo Probability Simulator</span>\n\
      <span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span\
      \ class=\"kw\">def</span> <span class=\"fn\">mc_dice</span>(ts=<span class=\"\
      num\">7</span>,trials=<span class=\"num\">100000</span>):\n    r=np.random.<span\
      \ class=\"fn\">randint</span>(<span class=\"num\">1</span>,<span class=\"num\"\
      >7</span>,size=(trials,<span class=\"num\">2</span>))\n    p=np.<span class=\"\
      fn\">mean</span>((r[:,<span class=\"num\">0</span>]+r[:,<span class=\"num\"\
      >1</span>])==ts)\n    th=(<span class=\"num\">6</span>-<span class=\"fn\">abs</span>(ts-<span\
      \ class=\"num\">7</span>))/<span class=\"num\">36</span> <span class=\"kw\"\
      >if</span> <span class=\"num\">2</span>&lt;=ts&lt;=<span class=\"num\">12</span>\
      \ <span class=\"kw\">else</span> <span class=\"num\">0</span>\n    <span class=\"\
      fn\">print</span>(<span class=\"str\">f\"P(sum={ts})={p:.4f} (MC), theoretical={th:.4f},\
      \ err={abs(p-th):.4f}\"</span>)\n<span class=\"fn\">mc_dice</span>(<span class=\"\
      num\">7</span>,<span class=\"num\">10000</span>)\n<span class=\"fn\">mc_dice</span>(<span\
      \ class=\"num\">7</span>,<span class=\"num\">100000</span>)\n<span class=\"\
      fn\">mc_dice</span>(<span class=\"num\">7</span>,<span class=\"num\">1000000</span>)\n\
      <span class=\"kw\">def</span> <span class=\"fn\">bday</span>(n=<span class=\"\
      num\">23</span>,trials=<span class=\"num\">50000</span>):\n    c=<span class=\"\
      fn\">sum</span>(<span class=\"fn\">len</span>(<span class=\"fn\">set</span>(np.random.<span\
      \ class=\"fn\">randint</span>(<span class=\"num\">0</span>,<span class=\"num\"\
      >365</span>,n)))&lt;n <span class=\"kw\">for</span> _ <span class=\"kw\">in</span>\
      \ <span class=\"fn\">range</span>(trials))\n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Birthday(n={n}): P(shared)={c/trials:.4f} (theory:~0.507)\"\
      </span>)\n<span class=\"fn\">bday</span>()"
    solution_lang: python
  - title: Build a Naive Bayes Spam Classifier
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Use the SMS Spam\
      \ dataset from Kaggle (or sklearn's fetch_20newsgroups).\n          </p>\n<p\
      \ style=\"margin-bottom: 0.6rem;\">\n           Implement a simple word-frequency\
      \ Naive Bayes from scratch (no sklearn for the classifier itself):\n       \
      \   </p>\n<ul style=\"padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom:\
      \ 1rem; list-style-type: disc;\">\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n\
      \             (1)\n            </strong>\n            Compute P(spam) and P(ham)\n\
      \           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n       \
      \      (2)\n            </strong>\n            For each word, compute P(word|spam)\
      \ and P(word|ham) with Laplace smoothing (add 1 to avoid zero probabilities)\n\
      \           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n       \
      \      (3)\n            </strong>\n            For a new message, compute log\
      \ P(spam|words) and classify. Compare accuracy to sklearn's MultinomialNB\n\
      \           </li>\n</ul>"
    done_when: From-scratch classifier achieves &gt;90% accuracy on test set and matches
      sklearn MultinomialNB closely.
    git_cmd: 'git add . &amp;&amp; git commit -m "day23: naive bayes spam classifier
      from scratch"'
    sol_id: sol-w4d23t2
    solution_title: 📓 Complete Colab Code
    solution_code: "<span class=\"cm\"># Build a Naive Bayes Spam Classifier</span>\n\
      <span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span\
      \ class=\"kw\">def</span> <span class=\"fn\">tk</span>(t): <span class=\"kw\"\
      >return</span> t.<span class=\"fn\">lower</span>().<span class=\"fn\">split</span>()\n\
      <span class=\"kw\">def</span> <span class=\"fn\">train</span>(emails,labels):\n\
      \    sp,hm=[],[]\n    <span class=\"kw\">for</span> e,l <span class=\"kw\">in</span>\
      \ <span class=\"fn\">zip</span>(emails,labels):\n        w=<span class=\"fn\"\
      >tk</span>(e)\n        (sp <span class=\"kw\">if</span> l <span class=\"kw\"\
      >else</span> hm).<span class=\"fn\">extend</span>(w)\n    v=<span class=\"fn\"\
      >list</span>(<span class=\"fn\">set</span>(sp+hm))\n    <span class=\"kw\">return</span>\
      \ ({w:(sp.<span class=\"fn\">count</span>(w)+<span class=\"num\">1</span>)/(<span\
      \ class=\"fn\">len</span>(sp)+<span class=\"fn\">len</span>(v)) <span class=\"\
      kw\">for</span> w <span class=\"kw\">in</span> v},\n            {w:(hm.<span\
      \ class=\"fn\">count</span>(w)+<span class=\"num\">1</span>)/(<span class=\"\
      fn\">len</span>(hm)+<span class=\"fn\">len</span>(v)) <span class=\"kw\">for</span>\
      \ w <span class=\"kw\">in</span> v},\n            <span class=\"fn\">sum</span>(labels)/<span\
      \ class=\"fn\">len</span>(labels))\n<span class=\"kw\">def</span> <span class=\"\
      fn\">clf</span>(email,sp,hm,ps):\n    w=<span class=\"fn\">tk</span>(email)\n\
      \    ls=np.<span class=\"fn\">log</span>(ps)+<span class=\"fn\">sum</span>(np.<span\
      \ class=\"fn\">log</span>(sp.<span class=\"fn\">get</span>(w,<span class=\"\
      num\">1e-10</span>)) <span class=\"kw\">for</span> w <span class=\"kw\">in</span>\
      \ w)\n    lh=np.<span class=\"fn\">log</span>(<span class=\"num\">1</span>-ps)+<span\
      \ class=\"fn\">sum</span>(np.<span class=\"fn\">log</span>(hm.<span class=\"\
      fn\">get</span>(w,<span class=\"num\">1e-10</span>)) <span class=\"kw\">for</span>\
      \ w <span class=\"kw\">in</span> w)\n    <span class=\"kw\">return</span> <span\
      \ class=\"str\">\"SPAM\" if ls&gt;lh else \"HAM\"</span>\nems=[<span class=\"\
      str\">\"buy cheap pills now\",\"meeting at 3pm\",\"win free money\",\"project\
      \ deadline\",\"congrats you won\",\"lunch at noon\"</span>]\nlb=[<span class=\"\
      num\">1</span>,<span class=\"num\">0</span>,<span class=\"num\">1</span>,<span\
      \ class=\"num\">0</span>,<span class=\"num\">1</span>,<span class=\"num\">0</span>]\n\
      sp,hm,ps=<span class=\"fn\">train</span>(ems,lb)\n<span class=\"kw\">for</span>\
      \ t <span class=\"kw\">in</span> [<span class=\"str\">\"free money\",\"meeting\
      \ tomorrow\",\"cheap pills\"</span>]:\n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"'</span>{t}<span class=\"str\">' -&gt; {clf(t,sp,hm,ps)}\"\
      </span>)"
    solution_lang: python
  - title: Bayesian Medical Test Analysis
    badge: 🔵 CHALLENGE
    badge_class: tb-proj
    time: 3 hours
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Build an interactive\
      \ Bayesian analysis tool: given test sensitivity, specificity, and disease prevalence,\
      \ compute and visualise P(disease | positive test).\n          </p>\n<p style=\"\
      margin-bottom: 0.6rem;\">\n           Then plot how posterior probability changes\
      \ as:\n          </p>\n<ul style=\"padding-left: 1.5rem; margin-top: 0.4rem;\
      \ margin-bottom: 1rem; list-style-type: disc;\">\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n<strong>\n             (1)\n            </strong>\n          \
      \  Prevalence varies from 0.1% to 50%\n           </li>\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n<strong>\n             (2)\n            </strong>\n          \
      \  Sensitivity varies from 80% to 99.9%. Create a heatmap showing P(disease\
      \ | positive) across all combinations. This demonstrates the \"base rate fallacy\"\
      \ visually\n           </li>\n</ul>"
    done_when: Heatmap saved showing how low prevalence keeps posterior low even with
      high test accuracy.
    git_cmd: 'git add . &amp;&amp; git commit -m "day23: bayesian medical test analysis
      and base rate fallacy viz"'
    sol_id: sol-w4d23t3
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Bayesian Medical Test Analysis</span>

      pd_d, pd_gd, pg_nd = <span class="num">0.01</span>, <span class="num">0.99</span>,
      <span class="num">0.05</span>

      p_pos = pd_gd*pd_d + pg_nd*(<span class="num">1</span>-pd_d)

      pd_gp = pd_gd*pd_d/p_pos

      <span class="fn">print</span>(<span class="str">"=== Bayes: Medical Test ==="</span>)

      <span class="fn">print</span>(<span class="str">f"P(Disease)={pd_d}"</span>)

      <span class="fn">print</span>(<span class="str">f"P(Pos|Disease)={pd_gd}"</span>)

      <span class="fn">print</span>(<span class="str">f"P(Pos|NoDisease)={pg_nd}"</span>)

      <span class="fn">print</span>(<span class="str">f"P(Disease|Positive)={pd_gp:.4f}
      ({pd_gp*100:.1f}%)"</span>)

      <span class="fn">print</span>(<span class="str">f"Even with 99% accuracy, only
      {pd_gp*100:.1f}% probability"</span>)

      <span class="fn">print</span>(<span class="str">"because disease is rare (1%).
      Most positives are false positives!"</span>)'
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: In Bayes' Theorem P(A|B) = P(B|A)·P(A) / P(B), what is P(A) called?
    qid: q23_1
    options:
    - letter: A
      text: The likelihood
      is_correct: false
    - letter: B
      text: The prior probability
      is_correct: true
    - letter: C
      text: The posterior probability
      is_correct: false
    - letter: D
      text: The marginal likelihood
      is_correct: false
    correct_fb: '✅ Correct! P(A) = prior = our belief before seeing any evidence.
      P(B|A) = likelihood = how probable is evidence B given A is true. P(B) = marginal
      = normalising constant (makes it sum to 1). P(A|B) = posterior = updated belief
      after seeing evidence. The Bayesian learning loop: start with prior → see data
      → update to posterior → posterior becomes new prior for next observation.'
    wrong_fb: '❌ P(A) = prior probability. P(B|A) = likelihood. P(B) = marginal/normalising
      constant. P(A|B) = posterior. In ML, this maps to: prior = your initial model
      guess, likelihood = how well the model explains the data, posterior = updated
      model after training. Naive Bayes explicitly uses all these terms.'
  - num_str: QUESTION 2 OF 4
    question: 'P(A ∩ B) = P(A) × P(B) holds when:'
    qid: q23_2
    options:
    - letter: A
      text: A and B are mutually exclusive
      is_correct: false
    - letter: B
      text: A and B are complements
      is_correct: false
    - letter: C
      text: A and B are independent events
      is_correct: true
    - letter: D
      text: P(A) + P(B) = 1
      is_correct: false
    correct_fb: ✅ Correct! Independence means knowing B happened gives zero information
      about whether A happens. So P(A|B) = P(A), and P(A∩B) = P(A|B)×P(B) = P(A)×P(B).
      The "Naive" in Naive Bayes comes from assuming all features are independent
      given the class label — which is rarely true in practice but still works surprisingly
      well!
    wrong_fb: ❌ P(A∩B) = P(A)×P(B) when A and B are INDEPENDENT. Mutually exclusive
      means P(A∩B) = 0 (they can't both happen). Independent means P(A|B) = P(A) —
      knowing B tells you nothing about A. These are very different! The "Naive" assumption
      in Naive Bayes is that all features are independent given the class.
  - num_str: QUESTION 3 OF 4
    question: You flip a fair coin and it lands heads 8 times in a row. What is the
      probability of heads on the 9th flip?
    qid: q23_3
    options:
    - letter: A
      text: Less than 0.5 — it's "due" for tails
      is_correct: false
    - letter: B
      text: More than 0.5 — the coin is on a hot streak
      is_correct: false
    - letter: C
      text: Exactly 0.5 — each flip is independent
      is_correct: true
    - letter: D
      text: 1/256 — considering all 9 flips together
      is_correct: false
    correct_fb: '✅ Correct! Coin flips are independent — each flip has no memory of
      previous results. This is the "Gambler''s Fallacy" — believing past events influence
      future independent events. In ML: this matters for data splits. If your train/test
      split doesn''t randomise, sequential patterns could "leak" past information
      into future predictions, making your model seem better than it is.'
    wrong_fb: ❌ Exactly 0.5! Each flip is independent — the coin has no memory. The
      probability of 8 heads in a row was 1/256, but that already happened. For the
      NEXT flip, it's still 0.5. This is the Gambler's Fallacy — assuming past independent
      events affect future ones. Coins don't know their history.
  - num_str: QUESTION 4 OF 4
    question: 'The "Naive" in Naive Bayes refers to:'
    qid: q23_4
    options:
    - letter: A
      text: The model is simple and easy to implement
      is_correct: false
    - letter: B
      text: The assumption that all features are independent given the class label
      is_correct: true
    - letter: C
      text: The model only works for naive (untrained) users
      is_correct: false
    - letter: D
      text: It uses naive prior probabilities of 0.5 for all classes
      is_correct: false
    correct_fb: '✅ Correct! The naive independence assumption: P(x₁, x₂, ... xₙ |
      y) = P(x₁|y) × P(x₂|y) × ... P(xₙ|y). This assumption is almost never truly
      valid — word "money" and "win" in an email are NOT independent! But the simplification
      makes it computationally tractable and surprisingly effective for text classification
      (spam filters, sentiment analysis). It''s "naive" but not wrong.'
    wrong_fb: ❌ "Naive" = assumes all features are conditionally independent given
      the class. P(features|class) = product of P(each feature|class). This is almost
      never true in practice but massively simplifies computation and still works
      well for text. Without this assumption, computing joint probability of thousands
      of words would require astronomical amounts of data.
  flashcards:
  - front: Bayes' Theorem formula?
    back: "P(A|B) = P(B|A)·P(A) / P(B)\n           <br/>\n           Posterior = Likelihood×Prior\
      \ / Marginal"
  - front: Prior vs Posterior?
    back: "Prior = belief before data\n           <br/>\n           Posterior = updated\
