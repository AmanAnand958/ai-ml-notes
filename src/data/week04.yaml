      \ class=\"str\">\"Saved breast_cancer_2d.png\"</span>)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">\"\\nTop 5 features for PC1:\"</span>)\npc1_imp = np.<span class=\"\
      fn\">abs</span>(pca.components_[<span class=\"num\">0</span>]).<span class=\"\
      fn\">argsort</span>()[::-<span class=\"num\">1</span>][:<span class=\"num\"\
