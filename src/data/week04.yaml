    <pre><code><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
    \ np\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span>\
    \ plt\n\n<span class=\"cm\"># Entropy H(p) = -Σ p(x) × log₂(p(x))</span>\n<span\
    \ class=\"cm\"># Measured in BITS. Maximum entropy = log₂(n) for n equally likely\
    \ outcomes.</span>\n\n<span class=\"kw\">def</span> <span class=\"fn\">entropy</span>(probs):\n\
    \    probs = np.<span class=\"fn\">array</span>(probs)\n    probs = probs[probs\
    \ &gt; <span class=\"num\">0</span>]  <span class=\"cm\"># avoid log(0)</span>\n\
    \    <span class=\"kw\">return</span> -np.<span class=\"fn\">sum</span>(probs\
    \ * np.<span class=\"fn\">log2</span>(probs))\n\n<span class=\"cm\"># Different\
    \ distributions:</span>\ncertain = [<span class=\"num\">1.0</span>, <span class=\"\
    num\">0.0</span>]             <span class=\"cm\"># certain outcome — H = 0 (no\
    \ surprise)</span>\nfair_coin = [<span class=\"num\">0.5</span>, <span class=\"\
    num\">0.5</span>]          <span class=\"cm\"># maximum uncertainty — H = 1 bit</span>\n\
    fair_die = [<span class=\"num\">1</span>/<span class=\"num\">6</span>]*<span class=\"\
    num\">6</span>               <span class=\"cm\"># fair die — H = log₂(6) ≈ 2.58\
    \ bits</span>\nbiased = [<span class=\"num\">0.9</span>, <span class=\"num\">0.1</span>]\
    \              <span class=\"cm\"># biased coin — low uncertainty</span>\n\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"Certain:    H = {entropy(certain):.4f}\
    \ bits\"</span>)    <span class=\"cm\"># 0.0</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Fair coin:  H = {entropy(fair_coin):.4f} bits\"</span>)  <span\
    \ class=\"cm\"># 1.0</span>\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"Fair die:   H = {entropy(fair_die):.4f} bits\"</span>)   <span class=\"cm\"\
    ># 2.58</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Biased:\
    \     H = {entropy(biased):.4f} bits\"</span>)     <span class=\"cm\"># 0.469</span>\n\
    </code></pre>\n</div>\n<h3 class=\"sh3\">\n       2. Cross-Entropy — The Loss\
    \ Function\n      </h3>\n<div class=\"ml-connect\">\n       In ML classification,\
    \ you have the true labels (y) and model predictions (y_hat).\n       <br/>\n\
    <br/>\n       If true is [1, 0] (it's a cat) and model predicts [0.9, 0.1], the\
    \ model is doing well.\n       <br/>\n<br/>\n       Cross-entropy measures how\
    \ many bits we need to encode the truth using the model's probabilities.\n   \
    \    <br/>\n<br/>\n       If they match, cross-entropy = entropy of the truth.\n\
    \       <br/>\n<br/>\n       If they don't, cross-entropy is higher!\n       <br/>\n\
    <br/>\n       Formula: $\\text{CE} = -\\sum y \\times \\log(\\hat{y})$.\n    \
    \  </div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — bce.py\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span class=\"\
    kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"\
    ># Binary Cross Entropy (BCE)</span>\n<span class=\"cm\"># BCE = - (y * log(p)\
    \ + (1-y) * log(1-p))</span>\n\n<span class=\"kw\">def</span> <span class=\"fn\"\
    >bce</span>(y_true, y_pred):\n    y_pred = np.<span class=\"fn\">clip</span>(y_pred,\
    \ <span class=\"num\">1e-15</span>, <span class=\"num\">1</span>-<span class=\"\
    num\">1e-15</span>) <span class=\"cm\"># prevent log(0)</span>\n    <span class=\"\
    kw\">return</span> - (y_true * np.<span class=\"fn\">log</span>(y_pred) + (<span\
    \ class=\"num\">1</span>-y_true) * np.<span class=\"fn\">log</span>(<span class=\"\
    num\">1</span>-y_pred))\n\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >\"Perfect prediction:\"</span>, <span class=\"fn\">bce</span>(<span class=\"\
    num\">1</span>, <span class=\"num\">0.99</span>))  <span class=\"cm\"># ≈ 0.01</span>\n\
    <span class=\"fn\">print</span>(<span class=\"str\">\"Terrible prediction:\"</span>,\
    \ <span class=\"fn\">bce</span>(<span class=\"num\">1</span>, <span class=\"num\"\
    >0.01</span>)) <span class=\"cm\"># ≈ 4.60 (High loss!)</span></code></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       3. KL Divergence\n      </h3>\n<p>\n      \
    \ Kullback-Leibler (KL) Divergence measures how one probability distribution differs\
    \ from a second, reference probability distribution.\n      </p>\n<p>\n      \
    \ $D_{KL}(P||Q) = \\text{CrossEntropy}(P, Q) - \\text{Entropy}(P)$.\n      </p>\n\
    <p>\n       It's essentially the \"extra\" surprise.\n      </p>\n<p>\n      \
    \ It is not a true distance metric because it is not symmetric ($KL(P||Q) \\neq\
    \ KL(Q||P)$).\n      </p>\n<h2 class=\"sh2\">\n       \U0001F52E Predict the Output\n\
    \      </h2>\n<h2 class=\"sh2\">\n       \U0001F41B Find the Bug\n      </h2>\n\
    <div class=\"debug-block\">\n<div class=\"debug-label\">\n        DEBUG CHALLENGE\
    \ — Math Error\n       </div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n          python — buggy code\n         </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n         \
    \  copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n           Run\n          </button>\n</div>\n\
    </div>\n<pre><code><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
    \ np\n\n<span class=\"cm\"># My BCE loss function gives NaN sometimes!</span>\n\
    <span class=\"kw\">def</span> <span class=\"fn\">bce</span>(y, p):\n    <span\
    \ class=\"kw\">return</span> -(y * np.<span class=\"fn\">log</span>(p) + (<span\
    \ class=\"num\">1</span>-y) * np.<span class=\"fn\">log</span>(<span class=\"\
    num\">1</span>-p))\n\n<span class=\"fn\">bce</span>(<span class=\"num\">1</span>,\
    \ <span class=\"num\">0.0</span>)</code></pre>\n</div>\n<button class=\"solution-toggle\"\
