  quizzes:
  - num_str: QUESTION 1 OF 4
    question: In gradient descent, why do we move in the NEGATIVE gradient direction?
    qid: q27_1
    options:
    - letter: A
      text: Because negative numbers are easier to compute
      is_correct: false
    - letter: B
      text: Because the gradient points in the direction of steepest INCREASE — we
        want to decrease
      is_correct: true
    - letter: C
      text: To avoid numerical overflow
      is_correct: false
    - letter: D
      text: Because all ML loss functions are negative
      is_correct: false
    correct_fb: '✅ Correct! The gradient ∇f at a point points in the direction of
      steepest ASCENT (going uphill). To MINIMISE the loss, we go downhill — the opposite
      direction. Hence: $\theta = \theta - \alpha \nabla f(\theta)$. The learning
      rate α controls how big a step we take downhill. This is gradient DESCENT (going
      down). If we added the gradient, it would be gradient ASCENT — used in some
      reinforcement learning algorithms.'
    wrong_fb: ❌ The gradient points UPHILL (direction of steepest increase). To minimise
      loss, we go DOWNHILL — subtract the gradient. That's why it's called gradient
      DESCENT. $x_{\text{new}} = x - \alpha \times \text{gradient}$. Large learning
      rate = big steps (might overshoot). Small learning rate = small steps (slow
      but safe). Gradient ascent (adding the gradient) is used in game theory and
      reinforcement learning.
  - num_str: QUESTION 2 OF 4
    question: What does the chain rule d(f(g(x)))/dx = f'(g(x)) × g'(x) tell us about
      backpropagation?
    qid: q27_2
    options:
    - letter: A
      text: We can only use functions with known derivatives
      is_correct: false
    - letter: B
      text: Backpropagation only works for 2-layer networks
      is_correct: false
    - letter: C
      text: Gradients flow backwards by multiplying local gradients layer by layer
      is_correct: true
    - letter: D
      text: The chain rule prevents gradient descent from converging
      is_correct: false
    correct_fb: '✅ Correct! Backpropagation is literally the chain rule applied to
      a composition of functions (the neural network). For L = loss(softmax(W₂×relu(W₁×x))):
      dL/dW₁ = dL/dsoftmax × dsoftmax/drelu × drelu/dW₁. Each layer computes its local
      gradient and passes it backwards, multiplied by the gradient coming from the
      layer ahead. PyTorch''s autograd automatically applies this chain rule for any
      computation graph — that''s the magic of automatic differentiation.'
    wrong_fb: '❌ The chain rule IS backpropagation. In a deep network: to find how
      each early weight affects the loss, we must chain derivatives through every
      subsequent layer. dL/dW₁ = (product of all gradients from L back to W₁). PyTorch''s
      .backward() does this automatically using a computation graph. The more layers,
      the more chain rule multiplications — which can cause vanishing gradients if
      values &lt; 1 are multiplied many times.'
  - num_str: QUESTION 3 OF 4
    question: What is a "vanishing gradient" and which activation function helps solve
      it?
    qid: q27_3
    options:
    - letter: A
      text: When gradients become infinite; solved by sigmoid activation
      is_correct: false
    - letter: B
      text: When gradients shrink toward zero in early layers; solved by ReLU
      is_correct: true
    - letter: C
      text: When the learning rate is too high; solved by gradient clipping
      is_correct: false
    - letter: D
      text: When the loss function has no gradient; solved by cross-entropy
      is_correct: false
    correct_fb: '✅ Correct! Sigmoid''s derivative = σ(x)(1-σ(x)) ≤ 0.25. In a 10-layer
      network: backprop multiplies this 10 times: $0.25^{10} \approx 0.000001$. Early
      layers receive essentially zero gradient and stop learning. ReLU''s derivative
      is exactly 1 for positive inputs — no shrinking. That''s why ReLU replaced sigmoid
      in deep networks (2012 AlexNet was a turning point). Residual connections (ResNets)
      also address this via skip connections.'
    wrong_fb: ❌ Vanishing gradient = gradients shrink to ~0 in early layers during
      backprop. Sigmoid derivative ≤ 0.25 — multiply this across 10 layers = 0.25¹⁰
      ≈ near 0. Early layers get essentially zero gradient update = they don't learn.
      ReLU derivative = 1 for x&gt;0 (no shrinking). That's why ReLU became the default
      activation in deep learning — it solves vanishing gradients elegantly.
  - num_str: QUESTION 4 OF 4
    question: 'The learning rate in gradient descent is analogous to:'
    qid: q27_4
    options:
    - letter: A
      text: The number of training epochs
      is_correct: false
    - letter: B
      text: The step size when walking downhill — too big overshoots, too small takes
        forever
      is_correct: true
    - letter: C
      text: The slope of the loss function at the minimum
      is_correct: false
    - letter: D
      text: The number of parameters in the model
      is_correct: false
    correct_fb: '✅ Correct! The learning rate controls step size. Too large (α=2.0
      for x²): the steps overshoot the minimum and diverge (x bounces back and forth
      getting larger). Too small (α=0.00001): converges but takes millions of steps.
      Typical values: 0.001–0.01 for neural networks. Adam optimiser adapts the learning
      rate automatically for each parameter — one of its key advantages over plain
      SGD.'
    wrong_fb: '❌ Learning rate = step size when walking down the loss hill. Too large:
      you overshoot the minimum and start going up the other side (diverge). Too small:
      you inch toward minimum, taking forever. Standard values: 0.1 (SGD), 0.001 (Adam).
      Learning rate schedule: start large, decrease over training — like running then
      walking then carefully placing foot near the minimum.'
  flashcards:
  - front: Hyperparameter determining the step size taken along the negative gradient
      direction during weight parameter updates.
    back: "$\\theta = \\theta - \\alpha \\times \\nabla f(\\theta)$\n           <br/>\n\
      \           α = learning rate\n           <br/>\n           ∇f = gradient (slope)"
  - front: Chain rule formula?
    back: "d[f(g(x))]/dx\n           <br/>\n           = f'(g(x)) × g'(x)\n      \
      \     <br/>\n           Outer × inner derivative"
  - front: Why negative gradient?
    back: "Gradient = direction of increase\n           <br/>\n           We want\
      \ DECREASE (loss min)\n           <br/>\n           So go OPPOSITE direction"
  - front: Vanishing gradients cause?
    back: "Sigmoid derivative ≤ 0.25\n           <br/>\n           Multiplied across\
      \ layers → 0\n           <br/>\n           Fix: use ReLU activation"
  - front: ReLU derivative?
    back: "1 if x &gt; 0\n           <br/>\n           0 if x ≤ 0\n           <br/>\n\
      \           No vanishing gradient problem"
  gotcha:
    title: '⚠️ Gotcha: Matrix Multiplications & Transpose Alignment'
    description: 'Always verify inner dimensions match before matrix multiplication:
      `(M, K) @ (K, N) -> (M, N)`.'
  takeaways:
    hinglish_line: ''
    bullets:
    - Derivative = slope at a point. Gradient = multi-dimensional derivative. Both
      point uphill.
    - 'Gradient descent: $\theta = \theta - \alpha \times \nabla f(\theta)$. Move
      opposite to gradient to decrease loss.'
    - Chain rule = backpropagation. Gradients flow backwards by multiplying local
      derivatives.
    - 'Learning rate: too large → diverge. Too small → very slow. Typical: 0.001 for
      Adam.'
    - 'Vanishing gradients: sigmoid kills gradients in deep nets. ReLU''s derivative=1
      solves this.'
