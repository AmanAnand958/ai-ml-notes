      num\">1</span>-eps)\n    <span class=\"kw\">return</span> (y_pred - y_true)\
      \ / (y_pred * (<span class=\"num\">1</span> - y_pred) + eps) / <span class=\"\
      fn\">len</span>(y_true)\ny_true = np.<span class=\"fn\">array</span>([<span\
      \ class=\"num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\"\
