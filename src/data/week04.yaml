  - front: Information-theoretic loss measuring the difference between predicted probability
      distributions and true categoric...
    back: "$\\\\text{CE} = -\\\\\\\\\\sum (y_{\\\\text{true}} \\\\times \\log(y_{\\\
      \\text{pred}}))$\n           <br/>\n           Used for classification. This\
      \ establishes the core invariant in Information Theory Basics, ensuring memory\
      \ efficiency, numerical stability, and robust scaling."
  - front: KL Divergence definition?
    back: How much one distribution diverges from a reference distribution. Not symmetric!
      This establishes the core invariant in Information Theory Basics, ensuring memory
      efficiency, numerical stability, and robust scaling.
  - front: Why not MSE for classification?
    back: Causes non-convex loss landscapes (local minima) and vanishing gradients
      with sigmoid/softmax. This establishes the core invariant in Information Theory
      Basics, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Information
      Theory Basics in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation,
      resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
