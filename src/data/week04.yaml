  hinglish: 'Vectorized gradient: sare samples ka gradient ek saath compute karo.
    Ek ek sample ka loop mat lagao — GPU acceleration tabhi kaam karta hai jab vectors/matrices
    use hon.'
  analogy: "Slope of a hill par stand karo.\n       <br/>\n<br/>\n       Derivative\
    \ = \"iss point pe yeh hill kitna steep hai?\" Agar derivative positive hai, hill\
    \ upar ja rahi hai.\n       <br/>\n<br/>\n       Negative = neeche.\n       <br/>\n\
    <br/>\n       Zero = flat (peak ya valley).\n       <br/>\n<br/>\n       Gradient\
    \ descent mein hum slope ke opposite direction mein move karte hain — downhill\
    \ jaate hain.\n       <br/>\n<br/>\n       Minimum loss dhundhne ka yahi tarika\
    \ hai."
  theory_html: "<div class=\"mermaid\">\ngraph TD\n      Loss[\"Loss Function J- w\"\
    ] --&gt; Grad[\"Compute Gradient ∇J\"]\n      Grad --&gt; Dir[\"Gradient Points\
    \ UPHILL\"]\n      Dir --&gt; Update[\"Update: w = w - η × ∇J\"]\n      Update\
    \ --&gt; Loop[\"Repeat to Convergence\"]\n</div>\n<!-- SVG: Gradient Descent Parabola\
    \ -->\n<figure class=\"svg-diagram\">\n<svg aria-label=\"Gradient descent steps\
    \ down a parabolic loss curve to reach global minimum\" height=\"200\" role=\"\
    img\" viewbox=\"0 0 580 200\" width=\"580\" xmlns=\"http://www.w3.org/2000/svg\"\
    >\n<defs>\n<!-- Arrow markers -->\n<marker id=\"arrowGD_s\" markerheight=\"6\"\
    \ markerwidth=\"6\" orient=\"auto\" refx=\"4\" refy=\"3\">\n<path d=\"M0,0 L0,6\
    \ L6,3 z\" fill=\"#f7a94b\">\n</path>\n</marker>\n</defs>\n<!-- Parabolic Curve\
    \ (Loss Landscape) -->\n<path d=\"M 90,30 Q 290,230 490,30\" fill=\"none\" stroke=\"\
    #6c8cff\" stroke-width=\"2.5\">\n</path>\n<!-- Y-axis (Loss) -->\n<line stroke=\"\
    #252a40\" stroke-width=\"1.2\" x1=\"50\" x2=\"50\" y1=\"20\" y2=\"180\">\n</line>\n\
    <text fill=\"#6b7590\" font-family=\"DM Sans,sans-serif\" font-size=\"9.5\" text-anchor=\"\
    end\" x=\"42\" y=\"16\">\n         Loss L\n        </text>\n<!-- X-axis (Parameter\
    \ w) -->\n<line stroke=\"#252a40\" stroke-width=\"1.2\" x1=\"50\" x2=\"530\" y1=\"\
    180\" y2=\"180\">\n</line>\n<text fill=\"#6b7590\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"9.5\" x=\"535\" y=\"184\">\n         Parameter w\n        </text>\n\
    <!-- Minimum marker -->\n<circle cx=\"290\" cy=\"130\" fill=\"#4fd1a5\" r=\"5\"\
    >\n</circle>\n<text fill=\"#4fd1a5\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    10\" font-weight=\"600\" text-anchor=\"middle\" x=\"290\" y=\"152\">\n       \
    \  Global Minimum (dL/dw = 0)\n        </text>\n<!-- Descent Steps -->\n<!-- Start\
    \ w_0 -->\n<circle cx=\"450\" cy=\"54\" fill=\"#f7a94b\" r=\"4.5\">\n</circle>\n\
    <text fill=\"#dde2f0\" font-family=\"IBM Plex Mono,monospace\" font-size=\"9\"\
    \ x=\"460\" y=\"52\">\n         w₀ (Initial, high loss)\n        </text>\n<!--\
    \ Tangent slope line at w_0 -->\n<line opacity=\"0.6\" stroke=\"#e56b8c\" stroke-dasharray=\"\
    3,2\" stroke-width=\"1\" x1=\"420\" x2=\"480\" y1=\"24\" y2=\"84\">\n</line>\n\
    <text fill=\"#e56b8c\" font-family=\"DM Sans,sans-serif\" font-size=\"8.5\" x=\"\
    485\" y=\"76\">\n         Positive Slope (+)\n        </text>\n<!-- Step 1 -->\n\
    <path d=\"M 445,58 Q 410,95 385,100\" fill=\"none\" marker-end=\"url(#arrowGD_s)\"\
    \ stroke=\"#f7a94b\" stroke-dasharray=\"3,1\" stroke-width=\"1.5\">\n</path>\n\
    <!-- w_1 -->\n<circle cx=\"380\" cy=\"101\" fill=\"#f7a94b\" r=\"4\">\n</circle>\n\
    <text fill=\"#dde2f0\" font-family=\"IBM Plex Mono,monospace\" font-size=\"9\"\
    \ x=\"390\" y=\"112\">\n         w₁\n        </text>\n<!-- Step 2 -->\n<path d=\"\
    M 375,103 Q 350,120 330,123\" fill=\"none\" marker-end=\"url(#arrowGD_s)\" stroke=\"\
    #f7a94b\" stroke-dasharray=\"3,1\" stroke-width=\"1.5\">\n</path>\n<!-- w_2 -->\n\
    <circle cx=\"325\" cy=\"124\" fill=\"#f7a94b\" r=\"3.5\">\n</circle>\n<text fill=\"\
    #dde2f0\" font-family=\"IBM Plex Mono,monospace\" font-size=\"9\" x=\"332\" y=\"\
    135\">\n         w₂\n        </text>\n<!-- Step 3 -->\n<path d=\"M 321,125 Q 305,130\
    \ 297,130\" fill=\"none\" marker-end=\"url(#arrowGD_s)\" stroke=\"#f7a94b\" stroke-dasharray=\"\
    2,1\" stroke-width=\"1.2\">\n</path>\n<!-- Update rule box -->\n<rect fill=\"\
    #141720\" height=\"48\" rx=\"5\" stroke=\"#252a40\" stroke-width=\"1\" width=\"\
    180\" x=\"70\" y=\"30\">\n</rect>\n<text fill=\"#38bdf8\" font-family=\"IBM Plex\
    \ Mono,monospace\" font-size=\"10.5\" x=\"80\" y=\"47\">\n         w_new = w -\
    \ η × (dL/dw)\n        </text>\n<text fill=\"#6b7590\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"9\" x=\"80\" y=\"64\">\n         subtract gradient to go downhill\n\
    \        </text>\n</svg>\n<figcaption>\n        Gradient descent stepping down\
    \ a 1D parabolic loss curve. Since the slope (derivative) is positive at w₀, subtracting\
    \ it moves the parameter leftwards toward the global minimum.\n       </figcaption>\n\
    </figure>\n<h3 class=\"sh3\">\n       1. Derivatives — Measuring Rate of Change\n\
    \      </h3>\n\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — derivatives.py\n        </span>\n<div class=\"cb-btns\">\n\
    <button class=\"run-btn\" onclick=\"openRepl()\">\n          ▶ try online\n  \
    \       </button>\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n  \
    \        copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span>\
    \ plt\n\n<span class=\"cm\"># Numerical derivative (finite difference approximation)</span>\n\
    <span class=\"cm\"># f'(x) ≈ [f(x+h) - f(x-h)] / (2h)  — central difference, more\
    \ accurate</span>\n\n<span class=\"kw\">def</span> <span class=\"fn\">numerical_derivative</span>(f,\
    \ x, h=<span class=\"num\">1e-5</span>):\n    <span class=\"kw\">return</span>\
    \ (<span class=\"fn\">f</span>(x + h) - <span class=\"fn\">f</span>(x - h)) /\
    \ (<span class=\"num\">2</span> * h)\n\n<span class=\"cm\"># Common functions\
    \ and their derivatives</span>\nf1 = <span class=\"kw\">lambda</span> x: x**2\
    \              <span class=\"cm\"># f(x) = x²,  f'(x) = 2x</span>\nf2 = <span\
    \ class=\"kw\">lambda</span> x: np.<span class=\"fn\">sin</span>(x)          <span\
    \ class=\"cm\"># f(x) = sin(x), f'(x) = cos(x)</span>\nf3 = <span class=\"kw\"\
    >lambda</span> x: np.<span class=\"fn\">exp</span>(x)          <span class=\"\
    cm\"># f(x) = eˣ,  f'(x) = eˣ (special!)</span>\nf4 = <span class=\"kw\">lambda</span>\
    \ x: <span class=\"num\">1</span>/(<span class=\"num\">1</span>+np.<span class=\"\
    fn\">exp</span>(-x))  <span class=\"cm\"># f(x) = sigmoid, f'(x) = σ(x)(1-σ(x))</span>\n\
    \nx_test = <span class=\"num\">2.0</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"f1'</span>(<span class=\"num\">2</span>) = {<span class=\"\
    fn\">numerical_derivative</span>(f1, x_test):.4f}\")   <span class=\"cm\"># ≈\
    \ 4.0 (= 2×2)</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
    f2'</span>(π/<span class=\"num\">4</span>) = {<span class=\"fn\">numerical_derivative</span>(f2,\
    \ np.pi/<span class=\"num\">4</span>):.4f}\")  <span class=\"cm\"># ≈ 0.7071 =\
    \ cos(π/4)</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"f3'</span>(<span\
    \ class=\"num\">1</span>) = {<span class=\"fn\">numerical_derivative</span>(f3,\
    \ <span class=\"num\">1.0</span>):.4f}\")         <span class=\"cm\"># ≈ e ≈ 2.718</span>\n\
    \n<span class=\"cm\"># Visualise a function and its derivative</span>\nx = np.<span\
    \ class=\"fn\">linspace</span>(-<span class=\"num\">3</span>, <span class=\"num\"\
    >3</span>, <span class=\"num\">200</span>)\ny = x**3 - <span class=\"num\">3</span>*x\
    \  <span class=\"cm\"># f(x) = x³ - 3x</span>\ndy = <span class=\"num\">3</span>*x**2\
    \ - <span class=\"num\">3</span>  <span class=\"cm\"># f'(x) = 3x² - 3 (analytical)</span>\n\
    \nfig, (ax1, ax2) = plt.<span class=\"fn\">subplots</span>(<span class=\"num\"\
    >1</span>, <span class=\"num\">2</span>, figsize=(<span class=\"num\">12</span>,<span\
    \ class=\"num\">4</span>))\nax1.<span class=\"fn\">plot</span>(x, y, color=<span\
    \ class=\"str\">'#6c8cff'</span>, linewidth=<span class=\"num\">2</span>, label=<span\
    \ class=\"str\">'f(x) = x³-3x'</span>)\nax1.<span class=\"fn\">axhline</span>(<span\
    \ class=\"num\">0</span>, color=<span class=\"str\">'#252a40'</span>); ax1.<span\
    \ class=\"fn\">axvline</span>(<span class=\"num\">0</span>, color=<span class=\"\
    str\">'#252a40'</span>)\nax1.<span class=\"fn\">set_title</span>(<span class=\"\
    str\">'Function'</span>); ax1.<span class=\"fn\">legend</span>()\n\nax2.<span\
    \ class=\"fn\">plot</span>(x, dy, color=<span class=\"str\">'#4fd1a5'</span>,\
    \ linewidth=<span class=\"num\">2</span>, label=<span class=\"str\">\"f'</span>(x)\
    \ = 3x²-<span class=\"num\">3</span>\")\nax2.<span class=\"fn\">axhline</span>(<span\
    \ class=\"num\">0</span>, color=<span class=\"str\">'#252a40'</span>); ax2.<span\
    \ class=\"fn\">axvline</span>(<span class=\"num\">0</span>, color=<span class=\"\
    str\">'#252a40'</span>)\nax2.<span class=\"fn\">set_title</span>(<span class=\"\
    str\">\"Derivative (zero crossings = f'</span>s extrema)\"); ax2.<span class=\"\
    fn\">legend</span>()\nplt.<span class=\"fn\">tight_layout</span>(); plt.savefig('function_derivative.png',\
    \ dpi=150)</pre>\n</div>\n<h3 class=\"sh3\">\n       2. Gradient Descent — From\
    \ Scratch\n      </h3>\n<p style=\"margin:0.5rem 0 0.8rem;\">\n       To minimize\
    \ a loss function, gradient descent starts at a random point and repeatedly takes\
    \ a small step in the\n       <strong>\n        negative direction of the gradient\n\
    \       </strong>\n       (steepest downhill).\n      </p>\n<p style=\"margin:0.5rem\
    \ 0 0.8rem;\">\n       The size of this step is controlled by the learning rate\
    \ (η or α).\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         python — gradient_descent.py\n        </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n         \
    \ copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span>\
    \ plt\n\n<span class=\"cm\"># --- GRADIENT DESCENT: minimise a function by following\
    \ the negative gradient ---</span>\n<span class=\"cm\"># Update rule: x_new =\
    \ x_old - learning_rate × f'(x_old)</span>\n<span class=\"cm\"># \"Take a step\
    \ in the direction that decreases f most steeply\"</span>\n\n<span class=\"kw\"\
    >def</span> <span class=\"fn\">f</span>(x): <span class=\"kw\">return</span> x2\
    \ + <span class=\"num\">2</span>*x + <span class=\"num\">1</span>        <span\
