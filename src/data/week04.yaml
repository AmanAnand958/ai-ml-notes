  - title: Entropy in Decision Trees
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<strong><p style=\"margin-bottom: 0.6rem;\">\n           Imag</strong>\
      \ <p style=\"margin-bottom: 0.6rem;\">\n           Imagine a dataset of 10 apples\
      \ (6 red, 4 green).\n          </p>\n<ul style=\"padding-left: 1.5rem; margin-top:\
      \ 0.4rem; margin-bottom: 1rem; list-style-type: disc;\">\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n            Calculate the entropy.\n           </li>\n<li style=\"\
      margin-bottom: 0.4rem;\">\n            Now imagine you split the data by size.\n\
      \           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n            The \"\
      Big\" group has 5 red and 1 green.\n           </li>\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n            The \"Small\" group has 1 red and 3 green.\n     \
      \      </li>\n<li style=\"margin-bottom: 0.4rem;\">\n            Write a script\
      \ to calculate the Information Gain (Entropy_before - Weighted_Entropy_after).\n\
      \           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n            This is\
      \ literally how Decision Trees work under the hood!.\n           </li>\n</ul>"
    done_when: When you calculate Information Gain &gt; 0.1.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day28: information gain
      calculator"'
    sol_id: sol-w4d28t2
    solution_title: 📓 Complete Colab Code
    solution_code: "# Entropy in Decision Trees\nimport numpy as np\ndef entropy(labels):\n\
      \    _, counts = np.unique(labels, return_counts=True)\n    probs = counts /\
      \ len(labels)\n    return -np.sum(probs * np.log2(probs))\ndef gini(labels):\n\
      \    _, counts = np.unique(labels, return_counts=True)\n    probs = counts /\
      \ len(labels)\n    return 1 - np.sum(probs**2)\ndef info_gain(data, labels,\
      \ split_col):\n    parent_e = entropy(labels)\n    values = np.unique(data[:,\
      \ split_col])\n    child_e = 0\n    for v in values:\n        mask = data[:,\
      \ split_col] == v\n        child_e += (sum(mask)/len(labels)) * entropy(labels[mask])\n\
      \    return parent_e - child_e\nprint(\"Entropy and Gini examples:\")\nfor dist,\
      \ desc in [([0,0,0,0,0], \"All same\"), ([0,0,0,0,1], \"20%\"), ([0,0,0,1,1],\
      \ \"40%\"),\n                    ([0,0,1,1,1], \"60%\"), ([0,1,1,1,1], \"80%\"\
      ), ([0,1,0,1,0], \"50/50\")]:\n    print(f\"  {desc:8s}: H={entropy(np.array(dist)):.4f},\
      \ Gini={gini(np.array(dist)):.4f}\")\ndata = np.array([[1,0],[1,1],[2,0],[2,1],[2,0],[1,0],[1,1],[2,1],[2,0],[1,0]])\n\
      labels = np.array([0,0,1,1,1,0,1,1,0,0])\nfor col in [0,1]:\n    ig = info_gain(data,\
      \ labels, col)\n    print(f\"Info Gain for column {col}: {ig:.4f}\")\nprint(f\"\
      Best split is column {'0' if info_gain(data,labels,0)>info_gain(data,labels,1)\
      \ else '1'}\")"
    solution_lang: python
    time_minutes: 45
  quizzes:
  - num_str: QUESTION 1 OF 3
    question: Which probability distribution has the HIGHEST entropy?
    qid: q28_1
    options:
    - letter: A
      text: '[0.99, 0.01]'
      is_correct: false
      id: a
    - letter: B
      text: '[0.8, 0.2]'
      is_correct: false
      id: b
    - letter: C
      text: '[0.5, 0.5]'
      is_correct: true
      id: c
    - letter: D
      text: '[1.0, 0.0]'
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Maximum entropy occurs when all outcomes are equally likely
      (maximum uncertainty). A uniform distribution like [0.5, 0.5] gives 1 bit of
      entropy.
    wrong_fb: '❌ Entropy is a measure of uncertainty. If one outcome is highly likely
      (e.g., 0.99), uncertainty is low, so entropy is low. Maximum entropy happens
      when everything is a complete guess: [0.5, 0.5] (a fair coin).'
    correct: c
  - num_str: QUESTION 2 OF 3
    question: Why do we use Cross-Entropy as a loss function instead of Mean Squared
      Error (MSE) for classification?
    qid: q28_2
    options:
    - letter: A
      text: Because MSE is only for deep learning
      is_correct: false
      id: a
    - letter: B
      text: Because Cross-Entropy is faster to compute
      is_correct: false
      id: b
    - letter: C
      text: MSE with probabilities creates non-convex landscapes (local minima), CE
        creates convex landscapes.
      is_correct: true
      id: c
    - letter: D
      text: Cross-entropy doesn't require gradients
      is_correct: false
      id: d
    correct_fb: ✅ Correct! When you combine a sigmoid/softmax activation with MSE,
      the resulting loss landscape has flat regions (vanishing gradients) and local
      minima. Cross-Entropy combined with softmax creates a beautiful bowl shape (convex),
      so gradient descent easily finds the global minimum!
    wrong_fb: ❌ Using MSE for probabilities leads to a non-convex loss function with
      flat spots where gradients vanish. Cross-Entropy was mathematically designed
      to cancel out the flat spots of the sigmoid/softmax function, resulting in a
      smooth, convex bowl that is easy to optimize.
    correct: c
  - num_str: QUESTION 3 OF 3
    question: Is KL Divergence a true distance metric?
    qid: q28_3
    options:
    - letter: A
      text: Yes, because it measures the distance between two distributions.
      is_correct: false
      id: a
    - letter: B
      text: 'No, because it is not symmetric: $KL(P||Q) \neq KL(Q||P)$.'
      is_correct: true
      id: b
    - letter: C
      text: Yes, because it is always positive.
      is_correct: false
      id: c
    - letter: D
      text: No, because it can be negative.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! A mathematical distance metric MUST be symmetric (distance
      from A to B must equal distance from B to A). KL Divergence is not symmetric,
      which is why it's a "divergence", not a "distance".
    wrong_fb: ❌ To be a true distance metric, a function must be symmetric (D(A,B)
      = D(B,A)). KL Divergence is asymmetrical. The "surprise" of experiencing P when
      you expected Q is different from experiencing Q when you expected P.
    correct: b
  flashcards:
  - front: What is Entropy?
    back: A measure of uncertainty or "average surprise" in a distribution. Max for
