    solution_title: 📓 Complete Colab Code
    solution_code: '# Statistical Tests on Titanic

      import pandas as pd

      import numpy as np

      from scipy import stats

      url="https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"

      df=pd.read_csv(url)

      sa,dia=df[df["Survived"]==1]["Age"].dropna(),df[df["Survived"]==0]["Age"].dropna()

      t,p=stats.ttest_ind(sa,dia)

      print(f"T-test Age: t={t:.3f} p={p:.4f} {''Sig'' if p<0.05 else ''Not sig''}")

      ct=pd.crosstab(df["Sex"],df["Survived"])

      c2,pc,_,_=stats.chi2_contingency(ct)

      print(f"Chi2 Gender: chi2={c2:.3f} p={pc:.4f} {''Sig'' if pc<0.05 else ''Not
      sig''}")

      f=stats.f_oneway(df[df["Pclass"]==1]["Fare"],df[df["Pclass"]==2]["Fare"],df[df["Pclass"]==3]["Fare"])

      print(f"ANOVA Fare: F={f.statistic:.1f} p={f.pvalue:.4f}")'
