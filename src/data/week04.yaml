    sol_id: sol-w4d25t3
    solution_title: 📓 Complete Colab Code
    solution_code: '# Statistical Feature Selection

      import pandas as pd

      import numpy as np

      from sklearn.feature_selection import SelectKBest, f_classif, chi2

      from sklearn.preprocessing import MinMaxScaler

      url = "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"

      df = pd.read_csv(url).drop(["Cabin","Name","Ticket","PassengerId"],axis=1).dropna()

      y = df["Survived"]

      X = pd.get_dummies(df.drop("Survived",axis=1), drop_first=True)

      print(f"Features: {X.shape[1]}")

      selector = SelectKBest(score_func=f_classif, k=5)

      selector.fit(X, y)

      scores = pd.DataFrame({"feature":X.columns,"score":selector.scores_}).sort_values("score",ascending=False)

      print("Top 10 features by ANOVA F-score:")

      print(scores.head(10).to_string(index=False))

      selected = X.columns[selector.get_support()]

      print(f"\nSelected features: {list(selected)}")

      chi_sel = SelectKBest(score_func=chi2, k=5)

      X_pos = MinMaxScaler().fit_transform(X)

      chi_sel.fit(X_pos, y)

      chi_scores = pd.DataFrame({"feature":X.columns,"score":chi_sel.scores_}).sort_values("score",ascending=False)

      print("\nTop 10 by Chi2:")

      print(chi_scores.head(10).to_string(index=False))

      assert chi_scores is not None, "chi_scores should not be None"'
    solution_lang: python
    time_minutes: 60
