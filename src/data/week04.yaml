  takeaways:
    hinglish_line: ''
    bullets:
    - 'Curse of dimensionality: high dimensions = sparse data = overfitting.'
    - PCA reduces dimensions by finding axes of maximum variance.
    - ALWAYS scale data before PCA so large-magnitude features don't unfairly dominate.
    - PCA is excellent for visualising high-dimensional datasets in 2D or 3D.
