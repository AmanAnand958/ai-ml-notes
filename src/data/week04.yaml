  tasks:
  - title: Visualise Breast Cancer in 2D
    badge: 🟡 STANDARD
    badge_class: tb-med
    time: 45 min
    prompt_html: "<strong><p style=\"margin-bottom: 0.6rem;\">\n           Load</strong>\
      \ <p style=\"margin-bottom: 0.6rem;\">\n           Load\n           \n     \
      \       sklearn.datasets.load_breast_cancer\n           \n           (30 features).\n\
      \          </p>\n<ul style=\"padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom:\
      \ 1rem; list-style-type: disc;\">\n<li style=\"margin-bottom: 0.4rem;\">\n \
      \           Scale it.\n           </li>\n<li style=\"margin-bottom: 0.4rem;\"\
      >\n            Apply PCA to compress it to 2 components.\n           </li>\n\
      <li style=\"margin-bottom: 0.4rem;\">\n            Plot a scatter plot of PC1\
      \ vs PC2, colored by the target class (Malignant vs Benign).\n           </li>\n\
      <li style=\"margin-bottom: 0.4rem;\">\n            You will see a beautiful\
      \ separation of classes, proving that 30D data can be understood in 2D!.\n \
      \          </li>\n</ul>"
    done_when: When 2D scatter plot saved showing clear class separation.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day29: pca breast cancer
      visualization"'
    sol_id: sol-w4d29t1
    solution_title: 📓 Complete Colab Code
    solution_code: "# Visualise Breast Cancer in 2D\nimport numpy as np\nimport matplotlib.pyplot\
      \ as plt\nfrom sklearn.datasets import load_breast_cancer\nfrom sklearn.decomposition\
      \ import PCA\nfrom sklearn.preprocessing import StandardScaler\ndata = load_breast_cancer()\n\
      X, y = data.data, data.target\nscaler = StandardScaler()\nX_scaled = scaler.fit_transform(X)\n\
      pca = PCA(n_components=2)\nX_pca = pca.fit_transform(X_scaled)\nprint(f\"Original:\
      \ {X.shape}, PCA: {X_pca.shape}\")\nprint(f\"Explained variance: {pca.explained_variance_ratio_.round(4)}\"\
      )\nprint(f\"Total variance retained: {sum(pca.explained_variance_ratio_):.3f}\"\
      )\nfig,ax = plt.subplots(figsize=(10,7))\nfor label, marker, color in [(0,'o','red'),(1,'^','blue')]:\n\
      \    mask = y == label\n    ax.scatter(X_pca[mask,0], X_pca[mask,1], c=color,\
      \ marker=marker,\n               label=data.target_names[label], alpha=0.7,\
      \ s=40, edgecolors='black', linewidth=0.5)\nax.set_xlabel(f\"PC1 ({pca.explained_variance_ratio_[0]:.1%})\"\
      , fontsize=12)\nax.set_ylabel(f\"PC2 ({pca.explained_variance_ratio_[1]:.1%})\"\
      , fontsize=12)\nax.set_title(\"Breast Cancer Dataset in 2D (PCA)\", fontsize=13)\n\
      ax.legend()\nax.grid(True, alpha=0.3)\nplt.tight_layout()\nplt.savefig(\"breast_cancer_2d.png\"\
      )\nprint(\"Saved breast_cancer_2d.png\")\nprint(\"\\nTop 5 features for PC1:\"\
      )\npc1_imp = np.abs(pca.components_[0]).argsort()[::-1][:5]\nfor i in pc1_imp:\n\
      \    print(f\"  {data.feature_names[i]:30s}: {pca.components_[0][i]:+.4f}\")"
    solution_lang: python
    time_minutes: 30
  - title: Production Implementation & Benchmark — Dimensionality Reduction — PCA
    desc: Write an optimized, production-grade implementation of Dimensionality Reduction
      — PCA with automated assertions checking shape invariants and numerical bounds.
    starter_code: "# Day 29: Production Benchmark for Dimensionality Reduction — PCA\n\
      import numpy as np\n\ndef validate_pipeline(data):\n    # TODO: Implement validation\
      \ logic\n    pass\n"
    solution_code: "# Day 29: Production Benchmark for Dimensionality Reduction —\
      \ PCA\nimport numpy as np\n\ndef validate_pipeline(data):\n    arr = np.asarray(data,\
      \ dtype=np.float32)\n    assert arr.ndim >= 1, 'Input must have at least 1 dimension'\n\
      \    normalized = (arr - np.mean(arr)) / (np.std(arr) + 1e-7)\n    return normalized\n\
      \n# Verification\ntest_data = np.array([10.0, 25.0, 40.0, 55.0, 70.0])\nresult\
      \ = validate_pipeline(test_data)\nprint('Normalized Output:', result)\nprint('Mean\
      \ ~ 0:', np.isclose(np.mean(result), 0.0))\n"
    hint: Ensure you handle zero division by adding an epsilon (1e-7) and assert tensor
      shapes before running matrix operations.
  quizzes:
  - num_str: QUESTION 1 OF 2
    question: Why is feature scaling ABSOLUTELY MANDATORY before applying PCA?
    qid: q29_1
    options:
    - letter: A
      text: It speeds up the computation.
      is_correct: false
      id: a
    - letter: B
      text: PCA maximizes variance; unscaled large-magnitude features will dominate
        the components.
      is_correct: true
      id: b
    - letter: C
      text: PCA only works on negative numbers.
      is_correct: false
      id: c
    - letter: D
      text: It's not mandatory, just good practice.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! PCA looks for directions with the highest variance. If
      "Income" ranges from 10k to 100k, and "Age" ranges from 20 to 80, the raw variance
      of Income is massively larger. PCA will just pick Income as the first component.
      Scaling gives every feature an equal baseline.
    wrong_fb: ❌ PCA finds axes of maximum variance. If you don't scale, features with
      naturally large numbers (like house prices in millions) will have massive variance
      simply due to their scale, and PCA will mistakenly treat them as the most important.
    correct: b
  - num_str: QUESTION 2 OF 2
    question: What is the "Curse of Dimensionality"?
    qid: q29_2
    options:
    - letter: A
      text: Models train too slowly with lots of data.
      is_correct: false
      id: a
    - letter: B
      text: It's hard to visualize beyond 3 dimensions.
      is_correct: false
      id: b
    - letter: C
      text: As features increase, the volume of the feature space grows exponentially,
        making data sparse and causing overfitting.
      is_correct: true
      id: c
    - letter: D
      text: Deep learning requires too many dimensions.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! As dimensions increase, you need exponentially more data
      to maintain the same "density" of examples. Without it, the space is mostly
      empty, and models overfit to the sparse noise.
    wrong_fb: ❌ It refers to the exponential growth of the feature space volume as
      dimensions are added, making the data sparse. This makes it very easy for models
      to overfit (they essentially memorize the sparse points instead of learning
      a pattern).
    correct: c
  flashcards:
  - front: Curse of Dimensionality?
    back: As dimensions grow, data space volume grows exponentially, making data sparse
      and models overfit.
  - front: What does PCA do?
    back: Projects data onto new orthogonal axes (Principal Components) that maximize
      variance. This establishes the core invariant in Dimensionality Reduction —
      PCA, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: Mandatory PCA prep step?
    back: StandardScaler! Features must be scaled to mean 0, variance 1. This establishes
      the core invariant in Dimensionality Reduction — PCA, ensuring memory efficiency,
      numerical stability, and robust scaling.
  - front: pca.explained_variance_ratio_?
    back: Shows the percentage of original dataset variance captured by each new component.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Dimensionality
      Reduction — PCA in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation,
      resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Matrix Multiplications & Transpose Alignment'
    description: 'Always verify inner dimensions match before matrix multiplication:
      `(M, K) @ (K, N) -> (M, N)`.'
  takeaways:
    hinglish_line: Production mein Dimensionality Reduction — PCA ko use karte waqt
