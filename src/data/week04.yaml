    >\n       3. Central Limit Theorem — The Most Important Result in Statistics\n\
    \      </h3><p style=\"margin: 0.8rem 0; font-size: 13.5px; line-height: 1.6;\"\
    >The <strong>Central Limit Theorem (CLT)</strong> states that the normalized sum\
    \ or mean of a sufficiently large number of independent and identically distributed\
    \ (i.i.d.) random variables approaches a Gaussian normal distribution ($\\mathcal{N}(\\\
    mu, \\sigma^2/n)$), regardless of the underlying population distribution shape.</p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — central_limit_theorem.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span\
    \ class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"\
    kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\n<span\
    \ class=\"cm\"># CLT: The distribution of SAMPLE MEANS approaches Normal</span>\n\
    <span class=\"cm\"># regardless of the original distribution's shape — as n increases.</span>\n\
    <span class=\"cm\"># This is WHY we can make statistical inferences about any\
    \ distribution!</span>\n\nfig, axes = plt.<span class=\"fn\">subplots</span>(<span\
    \ class=\"num\">2</span>, <span class=\"num\">3</span>, figsize=(<span class=\"\
    num\">15</span>, <span class=\"num\">8</span>))\nnp.random.<span class=\"fn\"\
    >seed</span>(<span class=\"num\">42</span>)\n\n<span class=\"kw\">for</span> col,\
    \ n_samples <span class=\"kw\">in</span> <span class=\"fn\">enumerate</span>([<span\
    \ class=\"num\">1</span>, <span class=\"num\">10</span>, <span class=\"num\">100</span>]):\n\
    \    <span class=\"cm\"># Draw 10,000 sample means, each from n_samples uniform\
    \ draws</span>\n    sample_means = [np.random.<span class=\"fn\">uniform</span>(<span\
    \ class=\"num\">0</span>, <span class=\"num\">100</span>, n_samples).<span class=\"\
    fn\">mean</span>() <span class=\"kw\">for</span> _ <span class=\"kw\">in</span>\
    \ <span class=\"fn\">range</span>(<span class=\"num\">10000</span>)]\n\n    axes[<span\
    \ class=\"num\">0</span>, col].<span class=\"fn\">hist</span>(sample_means, bins=<span\
    \ class=\"num\">50</span>, color=<span class=\"str\">'#6c8cff'</span>, edgecolor=<span\
    \ class=\"str\">'#0d0f14'</span>)\n    axes[<span class=\"num\">0</span>, col].<span\
    \ class=\"fn\">set_title</span>(<span class=\"str\">f'Sample size n={n_samples}\\\
    nUniform distribution'</span>)\n\n    <span class=\"cm\"># Exponential (very skewed)\
    \ → CLT still works!</span>\n    sample_means_exp = [np.random.<span class=\"\
    fn\">exponential</span>(<span class=\"num\">10</span>, n_samples).<span class=\"\
    fn\">mean</span>() <span class=\"kw\">for</span> _ <span class=\"kw\">in</span>\
    \ <span class=\"fn\">range</span>(<span class=\"num\">10000</span>)]\n    axes[<span\
    \ class=\"num\">1</span>, col].<span class=\"fn\">hist</span>(sample_means_exp,\
    \ bins=<span class=\"num\">50</span>, color=<span class=\"str\">'#f7a94b'</span>,\
    \ edgecolor=<span class=\"str\">'#0d0f14'</span>)\n    axes[<span class=\"num\"\
    >1</span>, col].<span class=\"fn\">set_title</span>(<span class=\"str\">f'Sample\
    \ size n={n_samples}\\nExponential distribution'</span>)\n\nplt.<span class=\"\
    fn\">suptitle</span>(<span class=\"str\">'Central Limit Theorem: Sample Means\
    \ → Normal as n Increases'</span>, fontsize=<span class=\"num\">14</span>)\nplt.<span\
    \ class=\"fn\">tight_layout</span>(); plt.<span class=\"fn\">savefig</span>(<span\
    \ class=\"str\">'clt_demo.png'</span>, dpi=<span class=\"num\">150</span>)\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">\"Even an exponential distribution'</span>s\
    \ sample means become Normal at n≥<span class=\"num\">30</span>!\")</code></pre>\n\
