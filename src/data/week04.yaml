    time_minutes: 60
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: For a normal distribution with mean=100 and std=15 (IQ scores), approximately
      what percentage of people have IQ between 85 and 115?
    qid: q24_1
    options:
    - letter: A
      text: 50%
      is_correct: false
      id: a
    - letter: B
      text: 68%
      is_correct: true
      id: b
    - letter: C
      text: 95%
      is_correct: false
      id: c
    - letter: D
      text: 99.7%
      is_correct: false
      id: d
    correct_fb: '✅ Correct! 85 = 100 − 15 = μ − σ and 115 = 100 + 15 = μ + σ. The
      empirical rule: 68% of data falls within μ ± 1σ. This is the 68-95-99.7 rule.
      IQ: ~68% have IQ between 85-115, ~95% between 70-130, ~99.7% between 55-145.
      In ML, this rule helps you understand how many standard deviations away.'
    wrong_fb: '❌ The empirical rule: μ±1σ = 68%, μ±2σ = 95%, μ±3σ = 99.7%. 85 to 115
      = [μ-σ, μ+σ] = 1 sigma range = 68%. Memorise: 68-95-99.7. This comes up in outlier
      detection (Z-score method uses 3σ rule: &gt;3σ from mean ≈ 0.3% of data = outlier).'
    correct: b
  - num_str: QUESTION 2 OF 4
    question: For a Poisson distribution with λ = 5, what is the mean AND variance?
    qid: q24_2
    options:
    - letter: A
      text: Mean = 5, Variance = √5
      is_correct: false
      id: a
    - letter: B
      text: Mean = 5, Variance = 25
      is_correct: false
      id: b
    - letter: C
      text: Mean = 5, Variance = 5
      is_correct: true
      id: c
    - letter: D
      text: Mean = λ²/2, Variance = λ
      is_correct: false
      id: d
    correct_fb: '✅ Correct! The Poisson distribution''s most remarkable property:
      mean = variance = λ. This uniquely identifies the Poisson distribution among
      count distributions. Practical meaning: if a website gets 100 visitors/hour
      on average, the variance is ALSO 100, so std dev = √100 = 10. You''d expect.'
    wrong_fb: '❌ Poisson''s unique property: mean = variance = λ. For λ=5: mean=5,
      variance=5, std=√5≈2.24. This is a key identifying feature — if your count data
      has mean ≈ variance, it likely follows a Poisson distribution. Count data in
      ML (word frequencies, transaction counts) is often modelled as Poisson.'
    correct: c
  - num_str: QUESTION 3 OF 4
    question: 'The Central Limit Theorem states that as sample size n increases:'
    qid: q24_3
    options:
    - letter: A
      text: The original data distribution becomes normal
      is_correct: false
      id: a
    - letter: B
      text: The distribution of sample MEANS approaches a normal distribution
      is_correct: true
      id: b
    - letter: C
      text: The variance of the data approaches zero
      is_correct: false
      id: c
    - letter: D
      text: The sample mean equals the population mean exactly
      is_correct: false
      id: d
    correct_fb: '✅ Correct! CLT: the distribution of SAMPLE MEANS (not the original
      data) converges to Normal(μ, σ/√n) as n grows. The original data can be exponential,
      uniform, or any weird shape — but if you take many samples of size n≥30 and
      plot their means, those means will be normally distributed..'
    wrong_fb: '❌ CLT: the distribution of SAMPLE MEANS approaches Normal — NOT the
      original data. The original exponential/uniform data stays exponential/uniform.
      But take many samples of n=30 each and compute each sample''s mean — THOSE means
      will be normally distributed. This is what allows t-tests, confidence intervals,
      and hypothesis testing to work on non-normal data.'
    correct: b
  - num_str: QUESTION 4 OF 4
    question: What is the difference between a PDF (probability density function)
      and a CDF (cumulative distribution function)?
    qid: q24_4
    options:
    - letter: A
      text: PDF gives probability; CDF gives density. They are interchangeable.
      is_correct: false
      id: a
    - letter: B
      text: PDF gives the density at a point; CDF gives cumulative probability P(X
        ≤ x)
      is_correct: true
      id: b
    - letter: C
      text: PDF is for discrete; CDF is for continuous distributions
      is_correct: false
      id: c
    - letter: D
      text: PDF integrates to 0; CDF integrates to 1
      is_correct: false
      id: d
    correct_fb: '✅ Correct! PDF: the "height" of the curve at a point x — NOT a probability
      itself (can be &gt;1 for narrow distributions). CDF: P(X ≤ x) — the AREA under
      the PDF from −∞ to x. CDF always ranges from 0 to 1. To get P(a ≤ X ≤ b) = CDF(b)
      − CDF(a). In scipy: stats.norm.pdf() = height (not.'
    wrong_fb: '❌ PDF = density at a single point (not a probability — can exceed 1
      for narrow distributions). CDF = P(X ≤ x) = area under PDF from -∞ to x. CDF
      ranges 0→1. To find P(score between 60 and 80): CDF(80) − CDF(60). scipy: norm.pdf(x)
      = height; norm.cdf(x) = cumulative probability. Always use .cdf() for "P(X ≤
      value)" questions.'
    correct: b
