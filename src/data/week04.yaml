    solution_title: 📓 Complete Colab Code
    solution_code: '# Full A/B Test Simulation

      import numpy as np

      from scipy import stats

      np.random.seed(42)

      NA,NB=1000,1000

      a,b=np.random.binomial(1,0.08,NA),np.random.binomial(1,0.10,NB)

      print(f"Control: {a.mean()*100:.2f}% ({a.sum()}/{NA})")

      print(f"Variant: {b.mean()*100:.2f}% ({b.sum()}/{NB})")

      print(f"Lift: {(b.mean()/a.mean()-1)*100:.2f}%")

      pp=(a.sum()+b.sum())/(NA+NB)

      se=np.sqrt(pp*(1-pp)*(1/NA+1/NB))

      z=(b.mean()-a.mean())/se

      pv=1-stats.norm.cdf(z)

      print(f"Z={z:.3f} p={pv:.4f}")

      print(f"Result: {''Significant!'' if pv<0.05 else ''Not significant''}")

      assert pv is not None, "pv should not be None"'
