    solution_title: 📓 Complete Colab Code
    solution_code: "# BCE from Scratch\nimport numpy as np\ndef bce_loss(y_true, y_pred):\n\
      \    eps = 1e-15\n    y_pred = np.clip(y_pred, eps, 1-eps)\n    return -np.mean(y_true*np.log(y_pred)\
      \ + (1-y_true)*np.log(1-y_pred))\ndef bce_grad(y_true, y_pred):\n    eps = 1e-15\n\
      \    y_pred = np.clip(y_pred, eps, 1-eps)\n    return (y_pred - y_true) / (y_pred\
      \ * (1 - y_pred) + eps) / len(y_true)\ny_true = np.array([1, 0, 1, 0, 1])\n\
      print(\"BCE Loss for different predictions:\")\nfor pred in [0.99, 0.9, 0.7,\
      \ 0.5]:\n    y_pred = np.full_like(y_true, pred)\n    print(f\"  pred={pred:.2f}:\
      \ BCE={bce_loss(y_true, y_pred):.4f}\")\n# Logistic function\ndef sigmoid(z):\
      \ return 1/(1+np.exp(-z))\nz = np.linspace(-5, 5, 10)\nprint(f\"\\nLogistic\
      \ function values:\\n{np.column_stack([z, sigmoid(z)]).round(3)}\")\n# BCE for\
      \ logistic regression\nnp.random.seed(42)\nX = np.random.randn(20)\ny = (X >\
      \ 0).astype(float)\nw = 0.0\nlr = 0.1\nfor i in range(100):\n    y_pred = sigmoid(w*X)\n\
      \    w -= lr * np.mean((y_pred - y) * X)\nprint(f\"\\nLogistic Regression with\
      \ BCE: w={w:.4f}\")\nassert y_pred is not None, \"y_pred should not be None\""
