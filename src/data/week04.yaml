    \nx_test = <span class=\"num\">2.0</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"f1'</span>(<span class=\"num\">2</span>) = {<span class=\"\
    fn\">numerical_derivative</span>(f1, x_test):.4f}\")   <span class=\"cm\"># ≈\
