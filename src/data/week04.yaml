    <pre><code><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
    \ np\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span>\
    \ plt\n\n<span class=\"cm\"># Numerical derivative (finite difference approximation)</span>\n\
    <span class=\"cm\"># f'(x) ≈ [f(x+h) - f(x-h)] / (2h)  — central difference, more\
    \ accurate</span>\n\n<span class=\"kw\">def</span> <span class=\"fn\">numerical_derivative</span>(f,\
