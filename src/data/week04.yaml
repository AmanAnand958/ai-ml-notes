    solution_code: '<span class="cm"># CLT Demonstration Simulation</span>

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      <span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span>
      plt

      pop=np.random.<span class="fn">exponential</span>(scale=<span class="num">5</span>,size=<span
      class="num">100000</span>)

      sm=[np.<span class="fn">mean</span>(np.random.<span class="fn">choice</span>(pop,<span
