      \ k=5)\n            \n            to select top 5 numeric features by F-test\n\
      \           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n       \
      \      (2)\n            </strong>\n            Use\n            \n         \
      \    SelectKBest(chi2, k=5)\n            \n            on non-negative categorical\
      \ features\n           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n\
      \             (3)\n            </strong>\n            Train LogisticRegression\
      \ on all features vs only top-5 selected features — compare accuracy\n     \
      \      </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n            \
      \ (4)\n            </strong>\n            Visualise the F-statistics for each\
      \ feature as a bar chart. Does feature selection improve or hurt performance?\n\
      \           </li>\n</ul>"
    done_when: Accuracy comparison printed, F-statistic bar chart saved, and a written
      conclusion on whether statistical feature selection helped.
    git_cmd: 'git add . &amp;&amp; git commit -m "day25: statistical feature selection
      with f_classif and chi2"'
    sol_id: sol-w4d25t3
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Statistical Feature Selection</span>

      <span class="kw">import</span> pandas <span class="kw">as</span> pd

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      <span class="kw">from</span> sklearn.feature_selection <span class="kw">import</span>
      SelectKBest, f_classif, chi2

      <span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span>
      MinMaxScaler

      url = <span class="str">"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"</span>

      df = pd.<span class="fn">read_csv</span>(url).<span class="fn">drop</span>([<span
      class="str">"Cabin","Name","Ticket","PassengerId"</span>],axis=<span class="num">1</span>).<span
      class="fn">dropna</span>()

      y = df[<span class="str">"Survived"</span>]

      X = pd.<span class="fn">get_dummies</span>(df.<span class="fn">drop</span>(<span
      class="str">"Survived"</span>,axis=<span class="num">1</span>), drop_first=<span
      class="kw">True</span>)

      <span class="fn">print</span>(<span class="str">f"Features: {X.shape[1]}"</span>)

      selector = <span class="fn">SelectKBest</span>(score_func=f_classif, k=<span
      class="num">5</span>)

      selector.<span class="fn">fit</span>(X, y)

      scores = pd.<span class="fn">DataFrame</span>({<span class="str">"feature":X.columns,"score":selector.scores_}).sort_values("score"</span>,ascending=<span
      class="kw">False</span>)

      <span class="fn">print</span>(<span class="str">"Top 10 features by ANOVA F-score:"</span>)

      <span class="fn">print</span>(scores.<span class="fn">head</span>(<span class="num">10</span>).<span
      class="fn">to_string</span>(index=<span class="kw">False</span>))

      selected = X.columns[selector.<span class="fn">get_support</span>()]

      <span class="fn">print</span>(<span class="str">f"\nSelected features: {list(selected)}"</span>)

      chi_sel = <span class="fn">SelectKBest</span>(score_func=chi2, k=<span class="num">5</span>)

      X_pos = <span class="fn">MinMaxScaler</span>().<span class="fn">fit_transform</span>(X)

      chi_sel.<span class="fn">fit</span>(X_pos, y)

      chi_scores = pd.<span class="fn">DataFrame</span>({<span class="str">"feature":X.columns,"score":chi_sel.scores_}).sort_values("score"</span>,ascending=<span
      class="kw">False</span>)

      <span class="fn">print</span>(<span class="str">"\nTop 10 by Chi2:"</span>)

      <span class="fn">print</span>(chi_scores.<span class="fn">head</span>(<span
      class="num">10</span>).<span class="fn">to_string</span>(index=<span class="kw">False</span>))'
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: 'A p-value of 0.03 means:'
    qid: q25_1
    options:
    - letter: A
      text: There is a 3% probability that H₀ is true
      is_correct: false
    - letter: B
      text: There is a 97% probability that H₁ is true
      is_correct: false
    - letter: C
      text: If H₀ were true, there's only a 3% chance of observing this data (or more
        extreme)
      is_correct: true
    - letter: D
      text: The effect size is 3% larger than expected
      is_correct: false
    correct_fb: ✅ Correct! p-value = P(observed data | H₀ true). p=0.03 means "if
      H₀ is really true, getting this result would only happen 3% of the time by chance."
      Since 3% &lt; 5% (alpha), we say "this is unlikely to be random chance" and
      reject H₀. The p-value says NOTHING about the probability H₀ is true — that
      requires Bayesian analysis.
    wrong_fb: '❌ p-value = P(data as extreme as observed | H₀ is TRUE). It does NOT
      equal P(H₀ is true). p=0.03 means "if there were truly no effect, we''d see
      data this extreme only 3% of the time." Since 3% &lt; α=5%, we reject H₀. Common
      misconception: p=0.03 ≠ "3% probability null is true" — that''s a frequentist
      vs Bayesian distinction.'
  - num_str: QUESTION 2 OF 4
    question: When should you use a chi-square test instead of a t-test?
    qid: q25_2
    options:
    - letter: A
      text: When your sample size is less than 30
      is_correct: false
    - letter: B
      text: When testing the relationship between two categorical variables
      is_correct: true
    - letter: C
      text: When comparing means of two normally distributed groups
      is_correct: false
    - letter: D
      text: When data has high variance
      is_correct: false
    correct_fb: '✅ Correct! Chi-square is for categorical ↔ categorical relationships
      (contingency tables). t-test is for comparing numeric means (numeric ↔ binary
      category). Example: "Is gender related to survival?" → chi-square (both categorical).
      "Do men earn more than women?" → t-test (numeric salary vs categorical gender).
      In sklearn''s feature selection: chi2() is for categorical features with categorical
      target, f_classif() is for numeric features.'
    wrong_fb: ❌ Chi-square = categorical vs categorical. t-test = numeric means comparison.
      "Are two categorical variables associated?" → chi-square. "Are two group means
      different?" → t-test. "Is age different between survived and not survived?"
      → t-test. "Is gender related to survival?" → chi-square (contingency table).
  - num_str: QUESTION 3 OF 4
    question: 'Pearson correlation r = -0.85 between X and Y means:'
    qid: q25_3
    options:
    - letter: A
      text: X causes a decrease in Y
      is_correct: false
    - letter: B
      text: Knowing X is useless for predicting Y
      is_correct: false
    - letter: C
      text: Strong negative linear relationship — as X increases, Y tends to decrease
      is_correct: true
    - letter: D
      text: 85% of Y's values are negative
      is_correct: false
    correct_fb: '✅ Correct! r = -0.85 = strong negative linear correlation. As X goes
      up, Y tends to go down (and vice versa). "Tends to" — this is a statistical
      tendency, not a deterministic rule. IMPORTANT: this does NOT mean X causes Y
      to decrease. Both could be caused by a third variable. Classic: temperature
      (X) correlates negatively with hot drink sales (Y), but it''s not that heat
      "prevents" people from buying drinks — they just prefer cold drinks in summer.'
    wrong_fb: ❌ r = -0.85 = strong NEGATIVE linear relationship. High values of X
      tend to go with low values of Y. r = -1 = perfect inverse line. r = 0 = no linear
      relationship. But correlation is NOT causation! A third "confounding" variable
      might explain both. Always investigate before claiming causation.
  - num_str: QUESTION 4 OF 4
    question: In A/B testing, your p-value is 0.04 with α=0.05. What is the correct
      conclusion?
    qid: q25_4
    options:
    - letter: A
      text: Accept H₀ — the new design doesn't work
      is_correct: false
    - letter: B
      text: Reject H₀ — the new design shows a statistically significant effect
      is_correct: true
    - letter: C
      text: The result is 96% certain to be real
      is_correct: false
    - letter: D
      text: You need to collect more data before deciding
      is_correct: false
    correct_fb: '✅ Correct! p=0.04 &lt; α=0.05 → reject H₀. The new design shows a
      statistically significant difference. But IMPORTANT: statistical significance
      ≠ practical significance. The actual difference might be tiny (e.g., 0.1% more
      conversions). Always report effect size alongside p-values. Also: with α=0.05,
      5% of experiments will give false positives even when H₀ is true. Run multiple
      tests with Bonferroni correction if needed.'
    wrong_fb: '❌ p=0.04 &lt; α=0.05 → REJECT H₀. We have sufficient evidence that
      the new design has a different effect. CAUTION: (1) statistical significance
      ≠ practical importance — check effect size, (2) 5% false positive rate means
      1 in 20 "significant" results is a fluke even when H₀ is true, (3) we can''t
      "accept" H₀ when p≥0.05 — only "fail to reject".'
  flashcards:
  - front: p-value definition?
    back: "P(data this extreme | H₀ true)\n           <br/>\n           NOT P(H₀ is\
      \ true)\n           <br/>\n           p &lt; α → reject H₀"
  - front: t-test vs chi-square?
    back: "t-test: numeric means comparison\n           <br/>\n           chi-square:\
      \ categorical relationship\n           <br/>\n           contingency table test"
  - front: Pearson r range?
    back: "-1 to +1\n           <br/>\n           -1=perfect negative\n          \
      \ <br/>\n           0=no linear, +1=perfect positive"
  - front: '"Fail to reject H₀" means?'
    back: "NOT \"H₀ is true\"\n           <br/>\n           Just \"insufficient evidence\"\
      \n           <br/>\n           Absence ≠ evidence of absence"
  - front: Correlation ≠ ?
    back: "Causation!\n           <br/>\n           Confounding variables may explain\n\
      \           <br/>\n           both X and Y independently"
  gotcha:
    title: '⚠️ Gotcha: Matrix Multiplications & Transpose Alignment'
    description: 'Always verify inner dimensions match before matrix multiplication:
      `(M, K) @ (K, N) -> (M, N)`.'
  takeaways:
    hinglish_line: ''
    bullets:
    - p-value = P(data | H₀ true). p &lt; 0.05 → reject H₀. p ≥ 0.05 → fail to reject
      (≠ "accept H₀")
    - 't-test: compare numeric means. chi-square: categorical association. Both use
      scipy.stats.'
    - Pearson r ∈ [-1, +1]. Strong ≠ causal. Always look for confounders.
    - Statistical significance ≠ practical significance. Always check effect size
      too.
    - sklearn.feature_selection.SelectKBest with f_classif/chi2 automates statistical
      feature selection.
