    kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"\
    ># BUG: log(0) is undefined (-inf). When multiplied by 0, it becomes NaN.</span>\n\
    <span class=\"cm\"># FIX: Always clip probabilities away from absolute 0 or 1\
    \ in loss functions.</span>\n<span class=\"kw\">def</span> <span class=\"fn\"\
