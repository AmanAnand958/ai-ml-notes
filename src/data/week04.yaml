      equation - pure linear algebra"'
    sol_id: sol-w4d26t3
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Implement Linear Regression with Normal Equation</span>

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      np.random.<span class="fn">seed</span>(<span class="num">42</span>)

      X = np.random.<span class="fn">randn</span>(<span class="num">100</span>)

      y = <span class="num">3.0</span>*X + <span class="num">2.0</span> + np.random.<span
      class="fn">randn</span>(<span class="num">100</span>)*<span class="num">0.5</span>

      X_design = np.c_[np.<span class="fn">ones_like</span>(X), X]

      beta = np.linalg.<span class="fn">inv</span>(X_design.T @ X_design) @ X_design.T
      @ y

      <span class="fn">print</span>(<span class="str">f"Normal Equation: y = {beta[1]:.3f}x
      + {beta[0]:.3f}"</span>)

      <span class="fn">print</span>(<span class="str">f"True: y = 3.0x + 2.0"</span>)

      y_pred = X_design @ beta

      r2 = <span class="num">1</span> - np.<span class="fn">sum</span>((y - y_pred)**<span
      class="num">2</span>) / np.<span class="fn">sum</span>((y - np.<span class="fn">mean</span>(y))**<span
      class="num">2</span>)

      <span class="fn">print</span>(<span class="str">f"R^2 = {r2:.4f}"</span>)

      mse = np.<span class="fn">mean</span>((y - y_pred)**<span class="num">2</span>)

      <span class="fn">print</span>(<span class="str">f"MSE = {mse:.4f}"</span>)

      <span class="cm"># Multi-variate version</span>

      X2 = np.random.<span class="fn">randn</span>(<span class="num">100</span>, <span
      class="num">3</span>)

      true_beta = np.<span class="fn">array</span>([<span class="num">1.5</span>,
      -<span class="num">2.0</span>, <span class="num">0.5</span>])

      y2 = X2 @ true_beta + np.random.<span class="fn">randn</span>(<span class="num">100</span>)*<span
      class="num">0.3</span>

      X2d = np.c_[np.<span class="fn">ones</span>(<span class="num">100</span>), X2]

      beta2 = np.linalg.<span class="fn">inv</span>(X2d.T @ X2d) @ X2d.T @ y2

      <span class="fn">print</span>(<span class="str">f"\nMulti-variate: beta = {beta2}"</span>)'
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: 'What is the output shape of: (32, 784) @ (784, 256)?'
    qid: q26_1
    options:
    - letter: A
      text: (784, 784)
      is_correct: false
    - letter: B
      text: (32, 256)
      is_correct: true
    - letter: C
      text: (32, 784)
      is_correct: false
    - letter: D
      text: ValueError — incompatible shapes
      is_correct: false
    correct_fb: '✅ Correct! Matrix multiplication rule: (m×n) @ (n×p) = (m×p). Here
      m=32, n=784 (must match!), p=256. Output = (32, 256). This is a real neural
      network layer: 32 training examples × 784 input features (28×28 MNIST image),
      multiplied by weight matrix to produce 256 hidden units. The 784 "inner" dimensions
      cancel out — you multiply 32 rows of length 784 each against 256 columns of
      length 784.'
    wrong_fb: '❌ Rule: (m×n) @ (n×p) = (m×p). Here (32,784) @ (784,256): inner dims
      are both 784 ✓. Output = (32,256). The inner dims CANCEL. This is a neural layer:
      32 samples in → 32 transformed samples out, each now a 256-dimensional vector
      instead of 784-dimensional. Memorise: outer dims survive, inner dims must match
      and vanish.'
  - num_str: QUESTION 2 OF 4
    question: 'Cosine similarity between two word vectors measures:'
    qid: q26_2
    options:
    - letter: A
      text: The Euclidean distance between the words
      is_correct: false
    - letter: B
      text: The angle between the vectors — ignoring their magnitude
      is_correct: true
    - letter: C
      text: The dot product divided by the number of dimensions
      is_correct: false
    - letter: D
      text: The sum of all shared dimensions
      is_correct: false
    correct_fb: '✅ Correct! Cosine similarity = dot(a,b) / (|a| × |b|). By dividing
      by the magnitudes, we normalise to purely measure the ANGLE. cos=1 means same
      direction (similar), cos=0 means perpendicular (unrelated), cos=-1 means opposite.
      In NLP: "king" and "queen" have high cosine similarity because they appear in
      similar contexts — even though their raw magnitudes (word frequency) might differ.
      This is why cosine similarity is preferred over Euclidean distance for word
      embeddings.'
    wrong_fb: '❌ Cosine similarity = dot(a,b) / (|a|×|b|). It measures the ANGLE between
      vectors, not the distance. By dividing by magnitudes, we normalise — a rare
      word that appears once and a common word that appears 100 times in similar contexts
      will still have high cosine similarity. Range: -1 to 1. Used heavily in NLP/recommendation
      systems for semantic similarity.'
  - num_str: QUESTION 3 OF 4
    question: What do eigenvectors of a covariance matrix represent in the context
      of PCA?
    qid: q26_3
    options:
    - letter: A
      text: The means of each feature
      is_correct: false
    - letter: B
      text: The directions of maximum variance in the data (principal components)
      is_correct: true
    - letter: C
      text: The number of features to keep after PCA
      is_correct: false
    - letter: D
      text: The correlation coefficients between features
      is_correct: false
    correct_fb: ✅ Correct! The covariance matrix C captures how features vary together.
      Its eigenvectors are the "principal components" — directions in feature space
      along which the data varies the most. The corresponding eigenvalues tell you
      HOW MUCH variance each direction explains. PCA projects your data onto the top
      k eigenvectors (those with highest eigenvalues), keeping the directions of maximum
      information while discarding low-variance directions.
    wrong_fb: ❌ Eigenvectors of the covariance matrix = principal components = directions
      of maximum variance. Eigenvalues = how much variance each direction explains.
      PCA sorts eigenvectors by eigenvalue (descending), keeps top k. You're literally
      rotating your data to align with its natural directions of variation. Tomorrow
      (Day 29) you'll implement PCA using sklearn and see this in action on MNIST.
  - num_str: QUESTION 4 OF 4
    question: When is matrix multiplication NOT defined (will throw an error)?
    qid: q26_4
    options:
    - letter: A
      text: When both matrices are the same shape
      is_correct: false
    - letter: B
      text: When the number of columns in A ≠ number of rows in B
      is_correct: true
    - letter: C
      text: When either matrix contains negative numbers
      is_correct: false
    - letter: D
      text: When one matrix is larger than the other
      is_correct: false
    correct_fb: '✅ Correct! A @ B requires A.shape[1] == B.shape[0] — the inner dimensions
      must match. (3,4) @ (4,5) ✓ → (3,5). (3,4) @ (5,4) ✗ → ValueError. This is the
      most common error in deep learning code. When you get a shape mismatch error,
      print the shapes of both matrices and check that the "inner" numbers match.
      Often you need to transpose one matrix: A @ B.T.'
    wrong_fb: '❌ Matrix multiplication requires A.shape[1] == B.shape[0]. (m,n) @
      (n,p) works. (m,n) @ (k,p) where k≠n fails. Most common PyTorch/NumPy error.
      Debug by printing matrix shapes. Fix: transpose if needed (A @ B.T). Same shape
      matrices work IF they''re square (n×n matrices can multiply: (n,n)@(n,n)=(n,n)).'
  flashcards:
  - front: Matrix multiply shape rule?
    back: "(m×n) @ (n×p) = (m×p)\n           <br/>\n           Inner dims must match\n\
      \           <br/>\n           Output = outer dims"
  - front: Dot product formula?
    back: "a·b = Σ aᵢbᵢ\n           <br/>\n           = |a||b|cos(θ)\n           <br/>\n\
      \           np.dot(a, b) or a @ b"
  - front: Cosine similarity formula?
    back: "dot(a,b) / (|a| × |b|)\n           <br/>\n           Range [-1, 1]\n  \
      \         <br/>\n           Measures angle (not distance)"
  - front: Neural layer as matrix?
    back: "output = X @ W + b\n           <br/>\n           X: (batch, in_features)\n\
      \           <br/>\n           W: (in_features, out_neurons)"
  - front: Eigenvectors in PCA?
    back: "Directions of max variance\n           <br/>\n           Eigenvalue = variance\
      \ explained\n           <br/>\n           Sort by eigenvalue desc"
  gotcha:
    title: '⚠️ Gotcha: Matrix Multiplications & Transpose Alignment'
    description: 'Always verify inner dimensions match before matrix multiplication:
      `(M, K) @ (K, N) -> (M, N)`.'
  takeaways:
    hinglish_line: ''
    bullets:
    - 'Matrix multiply: (m×n) @ (n×p) = (m×p). Inner dims must match, output gets
      outer dims.'
    - Neural network layer = X @ W + b. Every forward pass is matrix multiplication.
    - Cosine similarity = dot(a,b)/(|a||b|). Measures angle — used in NLP for word
      similarity.
    - Eigenvectors of covariance matrix = principal components in PCA.
    - Use @ operator for matrix multiply in NumPy/PyTorch. np.linalg.solve() beats
      np.linalg.inv() for stability.
