      <span class=\"cm\"># Logistic function</span>\n<span class=\"kw\">def</span>\
      \ <span class=\"fn\">sigmoid</span>(z): <span class=\"kw\">return</span> <span\
      \ class=\"num\">1</span>/(<span class=\"num\">1</span>+np.<span class=\"fn\"\
      >exp</span>(-z))\nz = np.<span class=\"fn\">linspace</span>(-<span class=\"\
      num\">5</span>, <span class=\"num\">5</span>, <span class=\"num\">10</span>)\n\
      <span class=\"fn\">print</span>(<span class=\"str\">f\"\\nLogistic function\
      \ values:\\n{np.column_stack([z, sigmoid(z)]).round(3)}\"</span>)\n<span class=\"\
      cm\"># BCE for logistic regression</span>\nnp.random.<span class=\"fn\">seed</span>(<span\
      \ class=\"num\">42</span>)\nX = np.random.<span class=\"fn\">randn</span>(<span\
      \ class=\"num\">20</span>)\ny = (X &gt; <span class=\"num\">0</span>).<span\
      \ class=\"fn\">astype</span>(float)\nw = <span class=\"num\">0.0</span>\nlr\
      \ = <span class=\"num\">0.1</span>\n<span class=\"kw\">for</span> i <span class=\"\
      kw\">in</span> <span class=\"fn\">range</span>(<span class=\"num\">100</span>):\n\
      \    y_pred = <span class=\"fn\">sigmoid</span>(w*X)\n    w -= lr * np.<span\
      \ class=\"fn\">mean</span>((y_pred - y) * X)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"\\nLogistic Regression with BCE: w={w:.4f}\"</span>)"
