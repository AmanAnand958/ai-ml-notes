    sol_id: sol-w4d25t2
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Full A/B Test Simulation</span>

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      <span class="kw">from</span> scipy <span class="kw">import</span> stats

      np.random.<span class="fn">seed</span>(<span class="num">42</span>)

      NA,NB=<span class="num">1000</span>,<span class="num">1000</span>

      a,b=np.random.<span class="fn">binomial</span>(<span class="num">1</span>,<span
      class="num">0.08</span>,NA),np.random.<span class="fn">binomial</span>(<span
      class="num">1</span>,<span class="num">0.10</span>,NB)

      <span class="fn">print</span>(<span class="str">f"Control: {a.mean()*100:.2f}%
      ({a.sum()}/{NA})"</span>)

      <span class="fn">print</span>(<span class="str">f"Variant: {b.mean()*100:.2f}%
      ({b.sum()}/{NB})"</span>)

      <span class="fn">print</span>(<span class="str">f"Lift: {(b.mean()/a.mean()-1)*100:.2f}%"</span>)

      pp=(a.<span class="fn">sum</span>()+b.<span class="fn">sum</span>())/(NA+NB)

      se=np.<span class="fn">sqrt</span>(pp*(<span class="num">1</span>-pp)*(<span
      class="num">1</span>/NA+<span class="num">1</span>/NB))

      z=(b.<span class="fn">mean</span>()-a.<span class="fn">mean</span>())/se

      pv=<span class="num">1</span>-stats.norm.<span class="fn">cdf</span>(z)

      <span class="fn">print</span>(<span class="str">f"Z={z:.3f} p={pv:.4f}"</span>)

      <span class="fn">print</span>(<span class="str">f"Result: {''</span>Significant!<span
      class="str">'' if pv&lt;0.05 else ''</span>Not significant<span class="str">''}"</span>)'
    solution_lang: python
