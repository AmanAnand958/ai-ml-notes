  - 'Month 1 Capstone: Math &'
  hinglish: Hypothesis Testing mein hum Null Hypothesis ($H_0$) assume karte hain
    ki koi real effect nahi hai. Agar p-value significance level ($\alpha = 0.05$)
    se kam ho, to hum $H_0$ reject karte hain.
  analogy: "Court mein judge kehta hai: \"innocent until proven guilty.\" Hypothesis\
    \ testing mein: null hypothesis (H₀) kehta hai \"koi effect nahi\" — aur tum court\
    \ mein lawyer ki tarah try karte ho isko disprove karne ki.\n       <br/>\n<br/>\n\
    \       Agar evidence bahut strong hai (p-value &lt; 0.05), tab H₀ reject karo."
  theory_html: "<div class=\"mermaid\">\ngraph TD\n      Dist[\"Probability Distributions\"\
    ] --&gt; Disc[\"Discrete - PMF / CDF\"]\n      Dist --&gt; Cont[\"Continuous -\
    \ PDF / CDF\"]\n      Disc --&gt; Bin[\"Binomial - n trials, success prob p\"\
    ]\n      Disc --&gt; Pois[\"Poisson - count of events in interval\"]\n      Cont\
    \ --&gt; Norm[\"Normal / Gaussian - Bell curve, μ &amp; σ\"]\n      Cont --&gt;\
    \ Unif[\"Uniform - Equal probability everywhere\"]\n</div>\n<h3 class=\"sh3\"\
    >\n       1. Hypothesis Testing Framework\n      </h3>\n\n<p style=\"margin:0.8rem\
    \ 0 0.4rem;\">\n       Before coding, let's build the intuition.\n      </p>\n\
    <p style=\"margin:0.8rem 0 0.4rem;\">\n       A hypothesis test follows a rigid\
    \ logical pipeline — you always start with\n       <em>\n        no effect\n \
    \      </em>\n       , collect evidence, compute a test statistic, look up its\
    \ probability under the null, and only then decide:\n      </p>\n<!-- SVG: Hypothesis\
    \ Testing Flow -->\n<figure class=\"svg-diagram\">\n<svg aria-label=\"Hypothesis\
    \ testing pipeline\" height=\"160\" role=\"img\" viewbox=\"0 0 720 160\" width=\"\
    720\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<marker id=\"arrowHT_s\"\
    \ markerheight=\"8\" markerwidth=\"8\" orient=\"auto\" refx=\"6\" refy=\"3\">\n\
    <path d=\"M0,0 L0,6 L8,3 z\" fill=\"#6b7590\">\n</path>\n</marker>\n</defs>\n\
    <!-- Step boxes -->\n<!-- 1: Define H0 -->\n<rect fill=\"#1c2030\" height=\"50\"\
    \ rx=\"8\" stroke=\"#252a40\" stroke-width=\"1.2\" width=\"110\" x=\"10\" y=\"\
    55\">\n</rect>\n<text fill=\"#4fd1a5\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    10\" font-weight=\"700\" text-anchor=\"middle\" x=\"65\" y=\"77\">\n         STEP\
    \ 1\n        </text>\n<text fill=\"#dde2f0\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"9.5\" text-anchor=\"middle\" x=\"65\" y=\"92\">\n         Define\
    \ H₀ &amp; H₁\n        </text>\n<text fill=\"#6b7590\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"8.5\" text-anchor=\"middle\" x=\"65\" y=\"104\">\n         e.g.\
    \ H₀: μ_A = μ_B\n        </text>\n<!-- arrow -->\n<line marker-end=\"url(#arrowHT_s)\"\
    \ stroke=\"#6b7590\" stroke-width=\"1.3\" x1=\"120\" x2=\"148\" y1=\"80\" y2=\"\
    80\">\n</line>\n<!-- 2: Collect Data -->\n<rect fill=\"#1c2030\" height=\"50\"\
    \ rx=\"8\" stroke=\"#252a40\" stroke-width=\"1.2\" width=\"110\" x=\"150\" y=\"\
    55\">\n</rect>\n<text fill=\"#6c8cff\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    10\" font-weight=\"700\" text-anchor=\"middle\" x=\"205\" y=\"77\">\n        \
    \ STEP 2\n        </text>\n<text fill=\"#dde2f0\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"9.5\" text-anchor=\"middle\" x=\"205\" y=\"92\">\n         Collect\
    \ Data\n        </text>\n<text fill=\"#6b7590\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"8.5\" text-anchor=\"middle\" x=\"205\" y=\"104\">\n         n ≥\
    \ 30 preferred\n        </text>\n<!-- arrow -->\n<line marker-end=\"url(#arrowHT_s)\"\
    \ stroke=\"#6b7590\" stroke-width=\"1.3\" x1=\"260\" x2=\"288\" y1=\"80\" y2=\"\
    80\">\n</line>\n<!-- 3: Test Statistic -->\n<rect fill=\"#1c2030\" height=\"50\"\
    \ rx=\"8\" stroke=\"#252a40\" stroke-width=\"1.2\" width=\"120\" x=\"290\" y=\"\
    55\">\n</rect>\n<text fill=\"#f7a94b\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    10\" font-weight=\"700\" text-anchor=\"middle\" x=\"350\" y=\"77\">\n        \
    \ STEP 3\n        </text>\n<text fill=\"#dde2f0\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"9.5\" text-anchor=\"middle\" x=\"350\" y=\"92\">\n         Compute\
    \ t-stat / χ²\n        </text>\n<text fill=\"#6b7590\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"8.5\" text-anchor=\"middle\" x=\"350\" y=\"104\">\n         signal\
    \ / noise ratio\n        </text>\n<!-- arrow -->\n<line marker-end=\"url(#arrowHT_s)\"\
    \ stroke=\"#6b7590\" stroke-width=\"1.3\" x1=\"410\" x2=\"438\" y1=\"80\" y2=\"\
    80\">\n</line>\n<!-- 4: p-value -->\n<rect fill=\"#1c2030\" height=\"50\" rx=\"\
    8\" stroke=\"#252a40\" stroke-width=\"1.2\" width=\"110\" x=\"440\" y=\"55\">\n\
    </rect>\n<text fill=\"#b47cfc\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    10\" font-weight=\"700\" text-anchor=\"middle\" x=\"495\" y=\"77\">\n        \
    \ STEP 4\n        </text>\n<text fill=\"#dde2f0\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"9.5\" text-anchor=\"middle\" x=\"495\" y=\"92\">\n         Get p-value\n\
    \        </text>\n<text fill=\"#6b7590\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    8.5\" text-anchor=\"middle\" x=\"495\" y=\"104\">\n         P(data | H₀ true)\n\
    \        </text>\n<!-- arrow -->\n<line marker-end=\"url(#arrowHT_s)\" stroke=\"\
    #6b7590\" stroke-width=\"1.3\" x1=\"550\" x2=\"578\" y1=\"80\" y2=\"80\">\n</line>\n\
    <!-- 5: Decision -->\n<rect fill=\"#1c2030\" height=\"50\" rx=\"8\" stroke=\"\
    #252a40\" stroke-width=\"1.2\" width=\"130\" x=\"580\" y=\"55\">\n</rect>\n<text\
    \ fill=\"#e56b8c\" font-family=\"DM Sans,sans-serif\" font-size=\"10\" font-weight=\"\
    700\" text-anchor=\"middle\" x=\"645\" y=\"77\">\n         STEP 5\n        </text>\n\
    <text fill=\"#4fd1a5\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" text-anchor=\"\
    middle\" x=\"645\" y=\"89\">\n         p &lt; α → Reject H₀ ✓\n        </text>\n\
    <text fill=\"#e56b8c\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" text-anchor=\"\
    middle\" x=\"645\" y=\"101\">\n         p ≥ α → Fail to reject\n        </text>\n\
    <!-- Labels below -->\n<text fill=\"#4a5568\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"8\" text-anchor=\"middle\" x=\"65\" y=\"140\">\n         Null hypothesis\n\
    \        </text>\n<text fill=\"#4a5568\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    8\" text-anchor=\"middle\" x=\"205\" y=\"140\">\n         Sample / experiment\n\
    \        </text>\n<text fill=\"#4a5568\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    8\" text-anchor=\"middle\" x=\"350\" y=\"140\">\n         scipy.stats.*\n    \
    \    </text>\n<text fill=\"#4a5568\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    8\" text-anchor=\"middle\" x=\"495\" y=\"140\">\n         Conditional prob\n \
    \       </text>\n<text fill=\"#4a5568\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    8\" text-anchor=\"middle\" x=\"645\" y=\"140\">\n         α = 0.05 typically\n\
    \        </text>\n</svg>\n<figcaption>\n        The 5-step hypothesis testing\
    \ pipeline — from defining H₀ to making the decision. Every statistical test follows\
    \ this exact flow.\n       </figcaption>\n</figure>\n<div class=\"cb\">\n<div\
    \ class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — hypothesis_testing.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"run-btn\" onclick=\"\
    openRepl()\">\n          ▶ try online\n         </button>\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy\
    \ <span class=\"kw\">as</span> np\n<span class=\"kw\">from</span> scipy <span\
    \ class=\"kw\">import</span> stats\n\n<span class=\"cm\"># --- A/B Test: Does\
    \ new website button increase conversion? ---</span>\n<span class=\"cm\"># Group\
    \ A (control): 1000 visitors, 100 converted → rate = 10%</span>\n<span class=\"\
    cm\"># Group B (new button): 1000 visitors, 130 converted → rate = 13%</span>\n\
    <span class=\"cm\"># Question: Is this 3% difference REAL or just random noise?</span>\n\
    \n<span class=\"cm\"># H₀: Conversion rates are equal (no effect)</span>\n<span\
    \ class=\"cm\"># H₁: Conversion rates are different (button works)</span>\n<span\
    \ class=\"cm\"># α = 0.05 (5% significance level — standard)</span>\n\nconversions_A\
    \ = np.<span class=\"fn\">array</span>([<span class=\"num\">1</span>]*<span class=\"\
    num\">100</span> + [<span class=\"num\">0</span>]*<span class=\"num\">900</span>)\
    \  <span class=\"cm\"># 100 converted, 900 not</span>\nconversions_B = np.<span\
    \ class=\"fn\">array</span>([<span class=\"num\">1</span>]*<span class=\"num\"\
    >130</span> + [<span class=\"num\">0</span>]*<span class=\"num\">870</span>) \
    \ <span class=\"cm\"># 130 converted</span>\n\n<span class=\"cm\"># Two-sample\
    \ t-test (comparing two group means)</span>\nt_stat, p_value = stats.<span class=\"\
    fn\">ttest_ind</span>(conversions_A, conversions_B)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"t-statistic: {t_stat:.4f}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"p-value:     {p_value:.4f}\"</span>)\n\nalpha = <span class=\"\
    num\">0.05</span>\n<span class=\"kw\">if</span> p_value &lt; alpha:\n    <span\
    \ class=\"fn\">print</span>(<span class=\"str\">\"REJECT H₀: Significant difference!\
    \ Button B converts better.\"</span>)\n<span class=\"kw\">else</span>:\n    <span\
    \ class=\"fn\">print</span>(<span class=\"str\">\"FAIL TO REJECT H₀: No significant\
    \ difference.\"</span>)\n\n<span class=\"cm\"># --- One-sample t-test: Is the\
    \ mean significantly different from a value? ---</span>\n<span class=\"cm\">#\
    \ \"Is our model's accuracy significantly above 0.5 (random guessing)?\"</span>\n\
    accuracies = [<span class=\"num\">0.72</span>, <span class=\"num\">0.68</span>,\
    \ <span class=\"num\">0.75</span>, <span class=\"num\">0.71</span>, <span class=\"\
    num\">0.73</span>, <span class=\"num\">0.69</span>, <span class=\"num\">0.74</span>,\
    \ <span class=\"num\">0.70</span>]\nt_stat, p_val = stats.<span class=\"fn\">ttest_1samp</span>(accuracies,\
    \ popmean=<span class=\"num\">0.5</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"\\nModel vs random guessing: p={p_val:.6f}\"</span>)  <span\
    \ class=\"cm\"># very small → yes, it works!</span></pre>\n</div>\n<h3 class=\"\
    sh3\">\n       2. Chi-Square Test — For Categorical Variables\n      </h3>\n<p\
    \ style=\"margin:0.5rem 0 0.8rem;\">\n       The chi-square test answers:\n  \
    \     <em>\n        \"Are two categorical variables independent, or do they influence\
    \ each other?\"\n       </em>\n       It compares\n       <strong>\n        observed\
    \ counts\n       </strong>\n       in a contingency table to what you'd\n    \
    \   <strong>\n        expect if they were independent\n       </strong>\n    \
    \   .\n      </p>\n<p style=\"margin:0.5rem 0 0.8rem;\">\n       Large discrepancy\
    \ → small p-value → reject independence.\n      </p>\n<div class=\"cb\">\n<div\
    \ class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — chi_square.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy <span\
    \ class=\"kw\">as</span> np\n<span class=\"kw\">from</span> scipy <span class=\"\
    kw\">import</span> stats\n<span class=\"kw\">import</span> pandas <span class=\"\
    kw\">as</span> pd\n\n<span class=\"cm\"># Chi-square test: Is there a relationship\
    \ between two categorical variables?</span>\n<span class=\"cm\"># H₀: Gender and\
    \ Survival are INDEPENDENT</span>\n<span class=\"cm\"># H₁: Gender and Survival\
    \ are DEPENDENT (related)</span>\n\ndf = pd.<span class=\"fn\">read_csv</span>(<span\
    \ class=\"str\">\"titanic.csv\"</span>)\ncontingency_table = pd.<span class=\"\
    fn\">crosstab</span>(df[<span class=\"str\">'Sex'</span>], df[<span class=\"str\"\
    >'Survived'</span>])\n<span class=\"fn\">print</span>(contingency_table)\n<span\
    \ class=\"cm\"># Survived      0    1</span>\n<span class=\"cm\"># Sex</span>\n\
    <span class=\"cm\"># female       81  233   ← most females survived</span>\n<span\
    \ class=\"cm\"># male        468  109   ← most males did not survive</span>\n\n\
    chi2, p_value, dof, expected = stats.<span class=\"fn\">chi2_contingency</span>(contingency_table)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"\\nChi-square: {chi2:.2f}\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"p-value:    {p_value:.6f}\"\
    </span>)   <span class=\"cm\"># extremely small → reject H₀</span>\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"DoF:        {dof}\"</span>)\n<span class=\"\
    fn\">print</span>(<span class=\"str\">\"Conclusion: Gender and Survival ARE related\
    \ (as we expected!)\"</span>)\n\n<span class=\"cm\"># In Feature Selection: chi-square\
    \ test is used to select categorical</span>\n<span class=\"cm\"># features that\
    \ are most correlated with the target variable</span>\n<span class=\"cm\"># sklearn.feature_selection.chi2\
    \ does exactly this!</span></pre>\n</div>\n<h3 class=\"sh3\">\n       3. Pearson\
    \ Correlation Coefficient\n      </h3>\n<p style=\"margin:0.5rem 0 0.8rem;\">\n\
    \       Pearson r measures the\n       <em>\n        strength and direction\n\
    \       </em>\n       of the\n       <strong>\n        linear relationship\n \
    \      </strong>\n       between two continuous variables.\n      </p>\n<p style=\"\
    margin:0.5rem 0 0.8rem;\">\n       It's always between −1 and +1.\n      </p>\n\
    <p style=\"margin:0.5rem 0 0.8rem;\">\n       A common intuition failure: r =\
    \ 0 does NOT mean no relationship — it only means no\n       <em>\n        linear\n\
    \       </em>\n       relationship.\n      </p>\n<!-- SVG: Correlation Spectrum\
    \ -->\n<figure class=\"svg-diagram\">\n<svg aria-label=\"Pearson correlation spectrum\"\
    \ height=\"140\" role=\"img\" viewbox=\"0 0 680 140\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\"\
    >\n<!-- backgrounds for 5 panels -->\n<!-- r = -1 -->\n<rect fill=\"#1c2030\"\
    \ height=\"100\" rx=\"8\" stroke=\"#252a40\" stroke-width=\"1\" width=\"118\"\
    \ x=\"10\" y=\"10\">\n</rect>\n<text fill=\"#e56b8c\" font-family=\"IBM Plex Mono,monospace\"\
    \ font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" x=\"69\" y=\"28\"\
    >\n         r = −1\n        </text>\n<!-- dots: perfect negative line -->\n<circle\
    \ cx=\"25\" cy=\"95\" fill=\"#e56b8c\" opacity=\"0.8\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"40\" cy=\"85\" fill=\"#e56b8c\" opacity=\"0.8\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"55\" cy=\"75\" fill=\"#e56b8c\" opacity=\"0.8\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"70\" cy=\"65\" fill=\"#e56b8c\" opacity=\"0.8\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"85\" cy=\"55\" fill=\"#e56b8c\" opacity=\"0.8\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"100\" cy=\"45\" fill=\"#e56b8c\" opacity=\"0.8\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"115\" cy=\"35\" fill=\"#e56b8c\" opacity=\"0.8\" r=\"2.5\">\n</circle>\n\
    <line opacity=\"0.5\" stroke=\"#e56b8c\" stroke-dasharray=\"3,2\" stroke-width=\"\
    1\" x1=\"22\" x2=\"117\" y1=\"97\" y2=\"33\">\n</line>\n<text fill=\"#6b7590\"\
    \ font-family=\"DM Sans,sans-serif\" font-size=\"9\" text-anchor=\"middle\" x=\"\
    69\" y=\"118\">\n         Perfect negative\n        </text>\n<!-- r ≈ -0.7 -->\n\
    <rect fill=\"#1c2030\" height=\"100\" rx=\"8\" stroke=\"#252a40\" stroke-width=\"\
    1\" width=\"118\" x=\"138\" y=\"10\">\n</rect>\n<text fill=\"#f7a94b\" font-family=\"\
    IBM Plex Mono,monospace\" font-size=\"13\" font-weight=\"700\" text-anchor=\"\
    middle\" x=\"197\" y=\"28\">\n         r ≈ −0.7\n        </text>\n<circle cx=\"\
    150\" cy=\"90\" fill=\"#f7a94b\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n<circle\
    \ cx=\"162\" cy=\"78\" fill=\"#f7a94b\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"170\" cy=\"85\" fill=\"#f7a94b\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"182\" cy=\"72\" fill=\"#f7a94b\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"195\" cy=\"65\" fill=\"#f7a94b\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"205\" cy=\"60\" fill=\"#f7a94b\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"218\" cy=\"50\" fill=\"#f7a94b\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"230\" cy=\"45\" fill=\"#f7a94b\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"245\" cy=\"38\" fill=\"#f7a94b\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <text fill=\"#6b7590\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" text-anchor=\"\
    middle\" x=\"197\" y=\"118\">\n         Strong negative\n        </text>\n<!--\
    \ r ≈ 0 -->\n<rect fill=\"#1c2030\" height=\"100\" rx=\"8\" stroke=\"#252a40\"\
    \ stroke-width=\"1\" width=\"118\" x=\"266\" y=\"10\">\n</rect>\n<text fill=\"\
    #6b7590\" font-family=\"IBM Plex Mono,monospace\" font-size=\"13\" font-weight=\"\
    700\" text-anchor=\"middle\" x=\"325\" y=\"28\">\n         r ≈ 0\n        </text>\n\
    <circle cx=\"278\" cy=\"75\" fill=\"#6b7590\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"290\" cy=\"45\" fill=\"#6b7590\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"302\" cy=\"90\" fill=\"#6b7590\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"315\" cy=\"55\" fill=\"#6b7590\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
