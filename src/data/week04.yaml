      >\n<strong>\n             (2)\n            </strong>\n            Plot histogram\
      \ with fitted Normal PDF overlaid\n           </li>\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n<strong>\n             (3)\n            </strong>\n          \
      \  Use stats.kstest() (Kolmogorov-Smirnov test) to test if the data actually\
      \ follows Normal distribution\n           </li>\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n<strong>\n             (4)\n            </strong>\n          \
      \  Apply log transform to Fare and re-test normality. Does log-transforming\
