    git_cmd: 'git add . &amp;&amp; git commit -m "day26: word similarity with cosine
      distance on GloVe"'
    sol_id: sol-w4d26t2
    solution_title: 📓 Complete Colab Code
    solution_code: "<span class=\"cm\"># Word Similarity with Cosine</span>\n<span\
      \ class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"\
      kw\">from</span> sklearn.feature_extraction.text <span class=\"kw\">import</span>\
      \ CountVectorizer\n<span class=\"kw\">from</span> sklearn.metrics.pairwise <span\
      \ class=\"kw\">import</span> cosine_similarity\ndocs = [\n    <span class=\"\
      str\">\"machine learning is fun\"</span>,\n    <span class=\"str\">\"deep learning\
      \ is powerful\"</span>,\n    <span class=\"str\">\"natural language processing\
      \ with transformers\"</span>,\n    <span class=\"str\">\"I love Python programming\"\
      </span>,\n]\nvectorizer = <span class=\"fn\">CountVectorizer</span>()\nX = vectorizer.<span\
      \ class=\"fn\">fit_transform</span>(docs)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">\"Vocabulary:\"</span>, <span class=\"fn\">list</span>(vectorizer.vocabulary_.<span\
      \ class=\"fn\">keys</span>()))\n<span class=\"fn\">print</span>(<span class=\"\
      str\">\"Document-term matrix:\"</span>)\n<span class=\"fn\">print</span>(X.<span\
      \ class=\"fn\">toarray</span>())\nsim = <span class=\"fn\">cosine_similarity</span>(X)\n\
      <span class=\"fn\">print</span>(<span class=\"str\">\"\\nCosine Similarity Matrix:\"\
      </span>)\n<span class=\"fn\">print</span>(np.<span class=\"fn\">round</span>(sim,\
      \ <span class=\"num\">3</span>))\n<span class=\"fn\">print</span>(<span class=\"\
      str\">f\"\\nDoc1 vs Doc2: {sim[0,1]:.3f} (both about learning)\"</span>)\n<span\
      \ class=\"fn\">print</span>(<span class=\"str\">f\"Doc1 vs Doc4: {sim[0,3]:.3f}\
      \ (unrelated)\"</span>)\n\n<span class=\"kw\">def</span> <span class=\"fn\"\
      >word_sim</span>(word1, word2):\n    vocab = <span class=\"fn\">sorted</span>(<span\
      \ class=\"fn\">set</span>(word1.<span class=\"fn\">lower</span>().<span class=\"\
      fn\">split</span>() + word2.<span class=\"fn\">lower</span>().<span class=\"\
      fn\">split</span>()))\n    v1 = np.<span class=\"fn\">array</span>([word1.<span\
      \ class=\"fn\">lower</span>().<span class=\"fn\">split</span>().<span class=\"\
      fn\">count</span>(w) <span class=\"kw\">for</span> w <span class=\"kw\">in</span>\
      \ vocab])\n    v2 = np.<span class=\"fn\">array</span>([word2.<span class=\"\
      fn\">lower</span>().<span class=\"fn\">split</span>().<span class=\"fn\">count</span>(w)\
      \ <span class=\"kw\">for</span> w <span class=\"kw\">in</span> vocab])\n   \
      \ <span class=\"kw\">return</span> np.<span class=\"fn\">dot</span>(v1,v2)/(np.linalg.<span\
      \ class=\"fn\">norm</span>(v1)*np.linalg.<span class=\"fn\">norm</span>(v2)+<span\
      \ class=\"num\">1e-10</span>)\n<span class=\"fn\">print</span>(<span class=\"\
      str\">f\"\\n'</span>king<span class=\"str\">' vs '</span>queen<span class=\"\
      str\">': {word_sim('</span>king royal crown<span class=\"str\">', '</span>queen\
      \ royal crown<span class=\"str\">'):.3f}\"</span>)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"'</span>cat<span class=\"str\">' vs '</span>dog<span class=\"\
      str\">': {word_sim('</span>cat pet meow<span class=\"str\">', '</span>dog pet\
      \ bark<span class=\"str\">'):.3f}\"</span>)"
    solution_lang: python
  - title: Implement Linear Regression with Normal Equation
