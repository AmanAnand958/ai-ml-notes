    copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n           Run\n   \
    \       </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy\
    \ <span class=\"kw\">as</span> np\nX = np.random.<span class=\"fn\">randn</span>(<span\
    \ class=\"num\">100</span>, <span class=\"num\">5</span>)    <span class=\"cm\"\
    ># 100 samples, 5 features</span>\nW = np.random.<span class=\"fn\">randn</span>(<span\
    \ class=\"num\">10</span>, <span class=\"num\">5</span>)    <span class=\"cm\"\
    ># weight matrix for neural layer</span>\noutput = X @ W                 <span\
    \ class=\"cm\"># Bug! What's wrong?</span></pre>\n</div>\n<button class=\"solution-toggle\"\
    \ onclick=\"toggleSolution('debug26-sol')\">\n        \U0001F441 Show Fix\n  \
    \     </button>\n<div class=\"solution-box\" id=\"debug26-sol\">\n<div class=\"\
    sol-header\">\n         BUG EXPLAINED\n        </div>\n<div class=\"cb\">\n<div\
    \ class=\"cb-head\">\n<span class=\"cb-lang\">\n           python — fixed\n  \
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">copy</button><button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">Run</button></div>\n</div>\n<pre><span class=\"\
    kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"\
    ># Bug: (100, 5) @ (10, 5) — inner dimensions DON'T match (5 ≠ 10)!</span>\n<span\
    \ class=\"cm\"># For X @ W: X is (100, 5), W must have 5 as its FIRST dimension</span>\n\
    <span class=\"cm\"># Two fixes depending on intention:</span>\n\n<span class=\"\
    cm\"># Option 1: Transpose W so it's (5, 10) — standard neural layer format</span>\n\
    output = X @ W.T    <span class=\"cm\"># (100, 5) @ (5, 10) = (100, 10) ✓</span>\n\
    \n<span class=\"cm\"># Option 2: Redefine W with correct shape</span>\nW = np.random.<span\
    \ class=\"fn\">randn</span>(<span class=\"num\">5</span>, <span class=\"num\"\
    >10</span>)    <span class=\"cm\"># (5 in, 10 out)</span>\noutput = X @ W    \
    \           <span class=\"cm\"># (100, 5) @ (5, 10) = (100, 10) ✓</span></pre>\n\
    </div>\n</div>\n</div>\n<!-- /day-26-theory -->\n<!-- /day-26-quiz-section -->\n\
