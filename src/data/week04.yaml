      </ul>"
    done_when: When most_similar("king") returns reasonable similar words. King -
      man + woman returns a vector closest to "queen".
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day26: word similarity
      with cosine distance on GloVe"'
    sol_id: sol-w4d26t2
    solution_title: 📓 Complete Colab Code
    solution_code: "# Word Similarity with Cosine\nimport numpy as np\nfrom sklearn.feature_extraction.text\
      \ import CountVectorizer\nfrom sklearn.metrics.pairwise import cosine_similarity\n\
      docs = [\n    \"machine learning is fun\",\n    \"deep learning is powerful\"\
      ,\n    \"natural language processing with transformers\",\n    \"I love Python\
      \ programming\",\n]\nvectorizer = CountVectorizer()\nX = vectorizer.fit_transform(docs)\n\
      print(\"Vocabulary:\", list(vectorizer.vocabulary_.keys()))\nprint(\"Document-term\
      \ matrix:\")\nprint(X.toarray())\nsim = cosine_similarity(X)\nprint(\"\\nCosine\
      \ Similarity Matrix:\")\nprint(np.round(sim, 3))\nprint(f\"\\nDoc1 vs Doc2:\
      \ {sim[0,1]:.3f} (both about learning)\")\nprint(f\"Doc1 vs Doc4: {sim[0,3]:.3f}\
      \ (unrelated)\")\n\ndef word_sim(word1, word2):\n    vocab = sorted(set(word1.lower().split()\
      \ + word2.lower().split()))\n    v1 = np.array([word1.lower().split().count(w)\
      \ for w in vocab])\n    v2 = np.array([word2.lower().split().count(w) for w\
      \ in vocab])\n    return np.dot(v1,v2)/(np.linalg.norm(v1)*np.linalg.norm(v2)+1e-10)\n\
      print(f\"\\n'king' vs 'queen': {word_sim('king royal crown', 'queen royal crown'):.3f}\"\
      )\nprint(f\"'cat' vs 'dog': {word_sim('cat pet meow', 'dog pet bark'):.3f}\"\
      )\nassert v2 is not None, \"v2 should not be None\""
