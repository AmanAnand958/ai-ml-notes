  analogy: "GATE exam marks, heights of students, measurement errors — sab normal\
    \ distribution follow karte hain.\n       <br/>\n<br/>\n       Iska matlab hai\
    \ zyada log average ke paas hain, kam log extremes pe hain.\n       <br/>\n<br/>\n\
    \       Bell curve shape mein.\n       <br/>\n<br/>\n       Yahi distribution\
    \ Nature khud prefer karti hai kyunki CLT iska reason batata hai."
  theory_html: "<div class=\"mermaid\">graph TD\n  Prior[\"Prior: P(A) - Initial belief\"\
    ] --&gt; Posterior[\"Posterior: P(A|B) - Updated belief\"]\n  Likelihood[\"Likelihood:\
    \ P(B|A) - Evidence probability\"] --&gt; Posterior\n  Normalizer[\"Normalizer:\
    \ P(B) - Total probability\"] --&gt; Posterior</div>\n<h3 class=\"sh3\">\n   \
    \    1. The Normal (Gaussian) Distribution — Queen of Distributions\n      </h3>\n\
    \n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n    \
    \     python — normal_distribution.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"run-btn\" onclick=\"openRepl()\">\n          ▶ try online\n\
    \         </button>\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span>\
    \ plt\n<span class=\"kw\">from</span> scipy <span class=\"kw\">import</span> stats\n\
    \n<span class=\"cm\"># Normal distribution N(μ, σ) — parameterised by mean and\
    \ std dev</span>\nmu, sigma = <span class=\"num\">70</span>, <span class=\"num\"\
    >10</span>  <span class=\"cm\"># GATE exam: mean 70, std 10</span>\nx = np.<span\
    \ class=\"fn\">linspace</span>(mu - <span class=\"num\">4</span>*sigma, mu + <span\
    \ class=\"num\">4</span>*sigma, <span class=\"num\">1000</span>)\npdf = stats.norm.<span\
    \ class=\"fn\">pdf</span>(x, mu, sigma)   <span class=\"cm\"># probability density\
    \ function</span>\n\nfig, axes = plt.<span class=\"fn\">subplots</span>(<span\
    \ class=\"num\">1</span>, <span class=\"num\">2</span>, figsize=(<span class=\"\
    num\">12</span>, <span class=\"num\">4</span>))\n\naxes[<span class=\"num\">0</span>].<span\
    \ class=\"fn\">plot</span>(x, pdf, <span class=\"str\">'#6c8cff'</span>, linewidth=<span\
    \ class=\"num\">2</span>)\naxes[<span class=\"num\">0</span>].<span class=\"fn\"\
    >fill_between</span>(x, pdf, where=(x &gt;= mu-sigma) &amp; (x &lt;= mu+sigma),\n\
    \                     alpha=<span class=\"num\">0.3</span>, color=<span class=\"\
    str\">'#4fd1a5'</span>, label=<span class=\"str\">'μ ± 1σ = 68%'</span>)\naxes[<span\
    \ class=\"num\">0</span>].<span class=\"fn\">fill_between</span>(x, pdf, where=(x\
    \ &gt;= mu-<span class=\"num\">2</span>*sigma) &amp; (x &lt;= mu+<span class=\"\
    num\">2</span>*sigma),\n                     alpha=<span class=\"num\">0.15</span>,\
    \ color=<span class=\"str\">'#f7a94b'</span>, label=<span class=\"str\">'μ ± 2σ\
    \ = 95%'</span>)\naxes[<span class=\"num\">0</span>].<span class=\"fn\">set_title</span>(<span\
    \ class=\"str\">'Normal Distribution — Empirical Rule'</span>)\naxes[<span class=\"\
    num\">0</span>].<span class=\"fn\">legend</span>(); axes[<span class=\"num\">0</span>].<span\
    \ class=\"fn\">set_xlabel</span>(<span class=\"str\">'Score'</span>)\n\n<span\
    \ class=\"cm\"># --- Key probabilities (memorise these!) ---</span>\np_1sigma\
    \ = stats.norm.<span class=\"fn\">cdf</span>(mu+sigma, mu, sigma) - stats.norm.<span\
    \ class=\"fn\">cdf</span>(mu-sigma, mu, sigma)\np_2sigma = stats.norm.<span class=\"\
    fn\">cdf</span>(mu+<span class=\"num\">2</span>*sigma, mu, sigma) - stats.norm.<span\
    \ class=\"fn\">cdf</span>(mu-<span class=\"num\">2</span>*sigma, mu, sigma)\n\
    p_3sigma = stats.norm.<span class=\"fn\">cdf</span>(mu+<span class=\"num\">3</span>*sigma,\
    \ mu, sigma) - stats.norm.<span class=\"fn\">cdf</span>(mu-<span class=\"num\"\
    >3</span>*sigma, mu, sigma)\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"Within 1σ: {p_1sigma:.4f}\"</span>)   <span class=\"cm\"># 0.6827 = 68.27%</span>\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"Within 2σ: {p_2sigma:.4f}\"\
    </span>)   <span class=\"cm\"># 0.9545 = 95.45%</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Within 3σ: {p_3sigma:.4f}\"</span>)   <span class=\"cm\">#\
    \ 0.9973 = 99.73%</span>\n\n<span class=\"cm\"># What score is at the 90th percentile?</span>\n\
    p90 = stats.norm.<span class=\"fn\">ppf</span>(<span class=\"num\">0.90</span>,\
    \ mu, sigma)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"90th percentile\
    \ score: {p90:.1f}\"</span>)  <span class=\"cm\"># 82.8</span></pre>\n</div>\n\
    <h3 class=\"sh3\">\n       2. Binomial and Poisson Distributions\n      </h3><p\
    \ style=\"margin: 0.8rem 0; font-size: 13.5px; line-height: 1.6;\"><strong>Binomial\
    \ distributions</strong> model the discrete count of successes in $n$ independent\
    \ Bernoulli trials with fixed probability $p$, while the <strong>Poisson distribution</strong>\
    \ models the count of independent events occurring within a fixed interval of\
    \ time or space at a constant average rate $\\lambda$.</p>\n<div class=\"cb\"\
    >\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — other_distributions.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">from</span> scipy <span\
    \ class=\"kw\">import</span> stats\n<span class=\"kw\">import</span> numpy <span\
    \ class=\"kw\">as</span> np\n<span class=\"kw\">import</span> matplotlib.pyplot\
    \ <span class=\"kw\">as</span> plt\n\n<span class=\"cm\"># --- BINOMIAL: n trials,\
    \ p probability of success each trial ---</span>\n<span class=\"cm\"># Q: Toss\
    \ a coin 10 times. P(exactly 6 heads)?</span>\nn, p = <span class=\"num\">10</span>,\
    \ <span class=\"num\">0.5</span>\np_exactly_6 = stats.binom.<span class=\"fn\"\
    >pmf</span>(<span class=\"num\">6</span>, n, p)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"P(exactly 6 heads in 10 flips): {p_exactly_6:.4f}\"</span>)\
    \  <span class=\"cm\"># 0.2051</span>\n\n<span class=\"cm\"># In ML: Bernoulli\
    \ distribution (n=1 Binomial) is binary cross-entropy's foundation</span>\n<span\
    \ class=\"cm\"># Logistic regression output is a Bernoulli probability</span>\n\
    \n<span class=\"cm\"># --- POISSON: count of events in fixed time/space, given\
    \ avg rate λ ---</span>\n<span class=\"cm\"># Q: A website gets avg 100 visitors/hour.\
    \ P(exactly 120 in the next hour)?</span>\nlam = <span class=\"num\">100</span>\
    \   <span class=\"cm\"># lambda = average rate</span>\np_120 = stats.poisson.<span\
    \ class=\"fn\">pmf</span>(<span class=\"num\">120</span>, lam)\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"P(exactly 120 visitors): {p_120:.6f}\"\
    </span>)\n\n<span class=\"cm\"># Poisson is used for: fraud detection (unusual\
    \ transaction counts),</span>\n<span class=\"cm\"># defect detection in manufacturing,\
    \ NLP (word counts in documents)</span>\n\n<span class=\"cm\"># --- Plot all 3\
    \ distributions side by side ---</span>\nfig, axes = plt.<span class=\"fn\">subplots</span>(<span\
    \ class=\"num\">1</span>, <span class=\"num\">3</span>, figsize=(<span class=\"\
    num\">15</span>, <span class=\"num\">4</span>))\n\n<span class=\"cm\"># Normal</span>\n\
    x_n = np.<span class=\"fn\">linspace</span>(<span class=\"num\">40</span>, <span\
    \ class=\"num\">100</span>, <span class=\"num\">200</span>)\naxes[<span class=\"\
    num\">0</span>].<span class=\"fn\">plot</span>(x_n, stats.norm.<span class=\"\
    fn\">pdf</span>(x_n, <span class=\"num\">70</span>, <span class=\"num\">10</span>),\
    \ color=<span class=\"str\">'#6c8cff'</span>)\naxes[<span class=\"num\">0</span>].<span\
    \ class=\"fn\">set_title</span>(<span class=\"str\">'Normal N(70, 10)'</span>)\n\
    \n<span class=\"cm\"># Binomial</span>\nx_b = np.<span class=\"fn\">arange</span>(<span\
    \ class=\"num\">0</span>, <span class=\"num\">21</span>)\naxes[<span class=\"\
    num\">1</span>].<span class=\"fn\">bar</span>(x_b, stats.binom.<span class=\"\
    fn\">pmf</span>(x_b, <span class=\"num\">20</span>, <span class=\"num\">0.5</span>),\
    \ color=<span class=\"str\">'#4fd1a5'</span>)\naxes[<span class=\"num\">1</span>].<span\
    \ class=\"fn\">set_title</span>(<span class=\"str\">'Binomial B(20, 0.5)'</span>)\n\
    \n<span class=\"cm\"># Poisson</span>\nx_p = np.<span class=\"fn\">arange</span>(<span\
    \ class=\"num\">0</span>, <span class=\"num\">20</span>)\naxes[<span class=\"\
    num\">2</span>].<span class=\"fn\">bar</span>(x_p, stats.poisson.<span class=\"\
    fn\">pmf</span>(x_p, <span class=\"num\">5</span>), color=<span class=\"str\"\
    >'#f7a94b'</span>)\naxes[<span class=\"num\">2</span>].<span class=\"fn\">set_title</span>(<span\
    \ class=\"str\">'Poisson λ=5'</span>)\n\nplt.<span class=\"fn\">tight_layout</span>();\
    \ plt.<span class=\"fn\">savefig</span>(<span class=\"str\">'distributions.png'</span>,\
    \ dpi=<span class=\"num\">150</span>)</pre>\n</div>\n<h3 class=\"sh3\">\n    \
    \   3. Central Limit Theorem — The Most Important Result in Statistics\n     \
    \ </h3><p style=\"margin: 0.8rem 0; font-size: 13.5px; line-height: 1.6;\">The\
    \ <strong>Central Limit Theorem (CLT)</strong> states that the normalized sum\
    \ or mean of a sufficiently large number of independent and identically distributed\
    \ (i.i.d.) random variables approaches a Gaussian normal distribution ($\\mathcal{N}(\\\
    mu, \\sigma^2/n)$), regardless of the underlying population distribution shape.</p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — central_limit_theorem.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"\
    kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\n<span\
    \ class=\"cm\"># CLT: The distribution of SAMPLE MEANS approaches Normal</span>\n\
    <span class=\"cm\"># regardless of the original distribution's shape — as n increases.</span>\n\
    <span class=\"cm\"># This is WHY we can make statistical inferences about any\
    \ distribution!</span>\n\nfig, axes = plt.<span class=\"fn\">subplots</span>(<span\
    \ class=\"num\">2</span>, <span class=\"num\">3</span>, figsize=(<span class=\"\
    num\">15</span>, <span class=\"num\">8</span>))\nnp.random.<span class=\"fn\"\
    >seed</span>(<span class=\"num\">42</span>)\n\n<span class=\"kw\">for</span> col,\
    \ n_samples <span class=\"kw\">in</span> <span class=\"fn\">enumerate</span>([<span\
    \ class=\"num\">1</span>, <span class=\"num\">10</span>, <span class=\"num\">100</span>]):\n\
    \    <span class=\"cm\"># Draw 10,000 sample means, each from n_samples uniform\
    \ draws</span>\n    sample_means = [np.random.<span class=\"fn\">uniform</span>(<span\
    \ class=\"num\">0</span>, <span class=\"num\">100</span>, n_samples).<span class=\"\
    fn\">mean</span>() <span class=\"kw\">for</span> _ <span class=\"kw\">in</span>\
    \ <span class=\"fn\">range</span>(<span class=\"num\">10000</span>)]\n\n    axes[<span\
    \ class=\"num\">0</span>, col].<span class=\"fn\">hist</span>(sample_means, bins=<span\
    \ class=\"num\">50</span>, color=<span class=\"str\">'#6c8cff'</span>, edgecolor=<span\
    \ class=\"str\">'#0d0f14'</span>)\n    axes[<span class=\"num\">0</span>, col].<span\
    \ class=\"fn\">set_title</span>(<span class=\"str\">f'Sample size n={n_samples}\\\
    nUniform distribution'</span>)\n\n    <span class=\"cm\"># Exponential (very skewed)\
    \ → CLT still works!</span>\n    sample_means_exp = [np.random.<span class=\"\
    fn\">exponential</span>(<span class=\"num\">10</span>, n_samples).<span class=\"\
    fn\">mean</span>() <span class=\"kw\">for</span> _ <span class=\"kw\">in</span>\
    \ <span class=\"fn\">range</span>(<span class=\"num\">10000</span>)]\n    axes[<span\
    \ class=\"num\">1</span>, col].<span class=\"fn\">hist</span>(sample_means_exp,\
    \ bins=<span class=\"num\">50</span>, color=<span class=\"str\">'#f7a94b'</span>,\
    \ edgecolor=<span class=\"str\">'#0d0f14'</span>)\n    axes[<span class=\"num\"\
    >1</span>, col].<span class=\"fn\">set_title</span>(<span class=\"str\">f'Sample\
    \ size n={n_samples}\\nExponential distribution'</span>)\n\nplt.<span class=\"\
    fn\">suptitle</span>(<span class=\"str\">'Central Limit Theorem: Sample Means\
