    solution_title: 📓 Complete Colab Code
    solution_code: "<span class=\"cm\"># BCE from Scratch</span>\n<span class=\"kw\"\
      >import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">def</span>\
      \ <span class=\"fn\">bce_loss</span>(y_true, y_pred):\n    eps = <span class=\"\
      num\">1e-15</span>\n    y_pred = np.<span class=\"fn\">clip</span>(y_pred, eps,\
      \ <span class=\"num\">1</span>-eps)\n    <span class=\"kw\">return</span> -np.<span\
      \ class=\"fn\">mean</span>(y_true*np.<span class=\"fn\">log</span>(y_pred) +\
      \ (<span class=\"num\">1</span>-y_true)*np.<span class=\"fn\">log</span>(<span\
      \ class=\"num\">1</span>-y_pred))\n<span class=\"kw\">def</span> <span class=\"\
      fn\">bce_grad</span>(y_true, y_pred):\n    eps = <span class=\"num\">1e-15</span>\n\
