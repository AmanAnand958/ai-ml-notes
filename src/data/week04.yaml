    \ uses Bayes' Theorem for EVERY prediction.</span>\n<span class=\"cm\"># P(spam\
    \ | \"win money\") ∝ P(\"win money\" | spam) × P(spam)</span></code></pre>\n</div>\n\
    <div class=\"hinglish\">\n       \U0001F4A1 Bayes' Theorem ek \"belief update\"\
