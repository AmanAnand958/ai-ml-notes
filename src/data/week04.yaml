  quizzes:
  - num_str: QUESTION 1 OF 2
    question: Why is feature scaling ABSOLUTELY MANDATORY before applying PCA?
    qid: q29_1
    options:
    - letter: A
      text: It speeds up the computation.
      is_correct: false
    - letter: B
      text: PCA maximizes variance; unscaled large-magnitude features will dominate
        the components.
      is_correct: true
    - letter: C
      text: PCA only works on negative numbers.
      is_correct: false
    - letter: D
      text: It's not mandatory, just good practice.
      is_correct: false
    correct_fb: ✅ Correct! PCA looks for directions with the highest variance. If
      "Income" ranges from 10k to 100k, and "Age" ranges from 20 to 80, the raw variance
      of Income is massively larger. PCA will just pick Income as the first component.
      Scaling gives every feature an equal baseline.
    wrong_fb: ❌ PCA finds axes of maximum variance. If you don't scale, features with
      naturally large numbers (like house prices in millions) will have massive variance
      simply due to their scale, and PCA will mistakenly treat them as the most important.
  - num_str: QUESTION 2 OF 2
    question: What is the "Curse of Dimensionality"?
    qid: q29_2
    options:
    - letter: A
      text: Models train too slowly with lots of data.
      is_correct: false
    - letter: B
      text: It's hard to visualize beyond 3 dimensions.
      is_correct: false
    - letter: C
      text: As features increase, the volume of the feature space grows exponentially,
        making data sparse and causing overfitting.
      is_correct: true
    - letter: D
      text: Deep learning requires too many dimensions.
      is_correct: false
    correct_fb: ✅ Correct! As dimensions increase, you need exponentially more data
      to maintain the same "density" of examples. Without it, the space is mostly
      empty, and models overfit to the sparse noise.
    wrong_fb: ❌ It refers to the exponential growth of the feature space volume as
      dimensions are added, making the data sparse. This makes it very easy for models
      to overfit (they essentially memorize the sparse points instead of learning
      a pattern).
  flashcards:
  - front: Curse of Dimensionality?
    back: As dimensions grow, data space volume grows exponentially, making data sparse
      and models overfit.
  - front: What does PCA do?
    back: Projects data onto new orthogonal axes (Principal Components) that maximize
      variance.
  - front: Mandatory PCA prep step?
    back: StandardScaler! Features must be scaled to mean 0, variance 1.
  - front: pca.explained_variance_ratio_
    back: Shows the percentage of original dataset variance captured by each new component.
  gotcha:
    title: '⚠️ Gotcha: Matrix Multiplications & Transpose Alignment'
