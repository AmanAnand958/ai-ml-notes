    solution_title: 📓 Complete Colab Code
    solution_code: "# Gradient Descent for Linear Regression\nimport numpy as np\n\
      np.random.seed(42)\nX = np.random.randn(100)\ny = 2.5*X + 1.0 + np.random.randn(100)*0.3\n\
      X_d = np.c_[np.ones_like(X), X]\nbeta = np.zeros(2)\nlr, n_iter, n = 0.1, 200,\
      \ len(y)\nfor i in range(n_iter):\n    y_pred = X_d @ beta\n    grad = -(2/n)\
      \ * X_d.T @ (y - y_pred)\n    beta = beta - lr * grad\n    if i % 40 == 0:\n\
      \        mse = np.mean((y - y_pred)**2)\n        print(f\"  Iter {i:3d}: beta={beta.round(4)},\
      \ MSE={mse:.4f}\")\nprint(f\"\\nGD result: y = {beta[1]:.4f}x + {beta[0]:.4f}\"\
      )\nprint(f\"True:      y = 2.5x + 1.0\")\n# Compare with normal equation\nbeta_ne\
      \ = np.linalg.inv(X_d.T @ X_d) @ X_d.T @ y\nprint(f\"Normal Eq: y = {beta_ne[1]:.4f}x\
      \ + {beta_ne[0]:.4f}\")\nprint(f\"GD matches NE: {np.allclose(beta, beta_ne,\
      \ rtol=1e-2)}\")"
