  concept_flow:
  - Descriptive Statistics
  - Probability Fundamentals
  - Probability Distributions
  - Hypothesis Testing + Corr
  - Linear Algebra for ML
  - Calculus Essentials for M
  - Information Theory Basics
  - Dimensionality Reduction
  - 'Month 1 Capstone: Math &'
  hinglish: 'Central Limit Theorem kehta hai: sample means normal distribute hote
    hain chahe original distribution koi bhi ho. Statistical testing ka yahi foundation
    hai!'
  analogy: "Imagine ek cricket match — agar team A 100 matches mein se 60 jeeti hai,\
    \ toh P(A wins) = 60/100 = 0.6.\n       <br/>\n<br/>\n       Probability = favorable\
    \ outcomes / total outcomes.\n       <br/>\n<br/>\n       Simple!\n       <br/>\n\
    <br/>\n       Lekin jab conditions add hote hain — \"A wins given it's a day-night\
    \ match\" — tab conditional probability aata hai."
  theory_html: "<div class=\"mermaid\">graph LR\n  P[\"Probability P(A)\"] --&gt;\
    \ Value[\"Range: 0 to 1\"]\n  P --&gt; Cond[\"Conditional: P(A|B) = P(A ∩ B) /\
    \ P(B)\"]\n  P --&gt; Ind[\"Independent: P(A ∩ B) = P(A) × P(B)\"]\n  P --&gt;\
    \ Dep[\"Dependent: P(A ∩ B) = P(A) × P(B|A)\"]</div>\n<h3 class=\"sh3\">\n   \
    \    1. Probability Basics\n      </h3>\n\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — probability_basics.py\n       \
    \ </span>\n<div class=\"cb-btns\">\n<button class=\"run-btn\" onclick=\"openRepl()\"\
    >\n          ▶ try online\n         </button>\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy <span\
    \ class=\"kw\">as</span> np\n\n<span class=\"cm\"># --- Basic Probability Axioms\
    \ ---</span>\n<span class=\"cm\"># 1. 0 ≤ P(A) ≤ 1</span>\n<span class=\"cm\"\
    ># 2. P(sample space) = 1</span>\n<span class=\"cm\"># 3. P(A or B) = P(A) + P(B)\
    \ if A and B are mutually exclusive</span>\n\n<span class=\"cm\"># --- Simulation:\
    \ Law of Large Numbers ---</span>\n<span class=\"cm\"># Flip a fair coin 10, 100,\
    \ 1000, 10000 times</span>\n<span class=\"kw\">for</span> n <span class=\"kw\"\
    >in</span> [<span class=\"num\">10</span>, <span class=\"num\">100</span>, <span\
    \ class=\"num\">1000</span>, <span class=\"num\">10000</span>, <span class=\"\
    num\">100000</span>]:\n    flips = np.random.<span class=\"fn\">choice</span>([<span\
    \ class=\"num\">0</span>,<span class=\"num\">1</span>], size=n)  <span class=\"\
    cm\"># 0=tails, 1=heads</span>\n    prob_heads = flips.<span class=\"fn\">mean</span>()\n\
    \    <span class=\"fn\">print</span>(<span class=\"str\">f\"n={n:7d}: P(heads)\
    \ = {prob_heads:.4f}\"</span>)\n<span class=\"cm\"># As n→∞, P(heads) → 0.5. This\
    \ IS the Law of Large Numbers.</span>\n\n<span class=\"cm\"># --- Conditional\
    \ Probability P(A|B) ---</span>\n<span class=\"cm\"># P(A|B) = P(A ∩ B) / P(B)</span>\n\
    <span class=\"cm\"># \"Probability of A GIVEN that B has already occurred\"</span>\n\
    \n<span class=\"cm\"># Example: A card is drawn. Given it's red, what's P(it's\
    \ a heart)?</span>\n<span class=\"cm\"># P(heart ∩ red) = 13/52 (hearts are red)</span>\n\
    <span class=\"cm\"># P(red) = 26/52</span>\np_heart_given_red = (<span class=\"\
    num\">13</span>/<span class=\"num\">52</span>) / (<span class=\"num\">26</span>/<span\
    \ class=\"num\">52</span>)\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"P(heart | red card) = {p_heart_given_red}\"</span>)  <span class=\"cm\">#\
    \ 0.5</span>\n\n<span class=\"cm\"># --- Independence test ---</span>\n<span class=\"\
    cm\"># A and B are INDEPENDENT if P(A∩B) = P(A)×P(B)</span>\n<span class=\"cm\"\
    ># Two dice rolls: each is independent of the other</span>\n<span class=\"cm\"\
    ># Die 1 = 6 AND Die 2 = 6: P = 1/6 × 1/6 = 1/36</span></pre>\n</div>\n<h3 class=\"\
    sh3\">\n       2. Bayes' Theorem — The Core of Probabilistic ML\n      </h3>\n\
    <div class=\"math-box\">\n<strong>\n        Bayes' Theorem\n       </strong>\n\
    <div class=\"mb-formula\">\n        P(A | B) = [ P(B | A) × P(A) ] / P(B)\n  \
    \     </div>\n<div style=\"margin-top:0.7rem; margin-bottom:0.3rem; color:var(--muted);\
    \ font-size: 12.5px; letter-spacing:0.5px;\">\n        COMPONENTS\n       </div>\n\
    <div class=\"mb-rule\">\n<span class=\"mb-cond\">\n         P(A | B)\n       \
    \ </span>\n<span class=\"mb-arrow\">\n         →\n        </span>\n<span class=\"\
    mb-desc\">\n         Posterior probability (updated belief after seeing evidence\
    \ B)\n        </span>\n</div>\n<div class=\"mb-rule\">\n<span class=\"mb-cond\"\
    >\n         P(B | A)\n        </span>\n<span class=\"mb-arrow\">\n         →\n\
    \        </span>\n<span class=\"mb-desc\">\n         Likelihood (how likely is\
    \ evidence B given A is true)\n        </span>\n</div>\n<div class=\"mb-rule\"\
    >\n<span class=\"mb-cond\">\n         P(A)\n        </span>\n<span class=\"mb-arrow\"\
    >\n         →\n        </span>\n<span class=\"mb-desc\">\n         Prior probability\
    \ (our initial belief before seeing evidence B)\n        </span>\n</div>\n<div\
    \ class=\"mb-rule\">\n<span class=\"mb-cond\">\n         P(B)\n        </span>\n\
    <span class=\"mb-arrow\">\n         →\n        </span>\n<span class=\"mb-desc\"\
    >\n         Marginal probability (total probability of evidence B, normalizing\
    \ constant)\n        </span>\n</div>\n</div>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         python — bayes_theorem.py\n   \
    \     </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"cm\"># CLASSIC PROBLEM: Medical\
    \ Test</span>\n<span class=\"cm\"># Disease prevalence: 1% of population has disease\
    \ D</span>\n<span class=\"cm\"># Test accuracy: 99% true positive rate (sensitivity)</span>\n\
    <span class=\"cm\"># Test specificity: 95% true negative rate</span>\n<span class=\"\
    cm\"># QUESTION: Given a POSITIVE test, what's the probability of actually having\
    \ D?</span>\n\nP_D = <span class=\"num\">0.01</span>          <span class=\"cm\"\
    ># Prior: 1% chance of disease</span>\nP_no_D = <span class=\"num\">1</span> -\
    \ P_D    <span class=\"cm\"># 99% chance of no disease</span>\nP_pos_given_D =\
    \ <span class=\"num\">0.99</span>   <span class=\"cm\"># Sensitivity: 99% positive\
    \ if sick</span>\nP_pos_given_noD = <span class=\"num\">0.05</span> <span class=\"\
    cm\"># False positive rate: 5% positive if healthy</span>\n\n<span class=\"cm\"\
    ># Total probability of positive test</span>\nP_pos = P_pos_given_D * P_D + P_pos_given_noD\
    \ * P_no_D\n\n<span class=\"cm\"># Bayes' Theorem: P(D | positive test)</span>\n\
    P_D_given_pos = (P_pos_given_D * P_D) / P_pos\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"P(disease | positive test) = {P_D_given_pos:.3f}\"</span>)\n\
    <span class=\"cm\"># = 0.167 — only 16.7%! Surprising because 1% base rate dominates.</span>\n\
    <span class=\"cm\"># This is the BASE RATE FALLACY — ignoring prior probability.</span>\n\
    <span class=\"cm\"># Even with a 99% accurate test, low prevalence means most\
    \ positives are false!</span>\n\n<span class=\"cm\"># ML Connection: Naive Bayes\
    \ classifier uses Bayes' Theorem for EVERY prediction.</span>\n<span class=\"\
    cm\"># P(spam | \"win money\") ∝ P(\"win money\" | spam) × P(spam)</span></pre>\n\
    </div>\n<div class=\"hinglish\">\n       \U0001F4A1 Bayes' Theorem ek \"belief\
    \ update\" formula hai.\n       <br/>\n<br/>\n       Pehle kuch jaante the (prior),\
    \ phir evidence mili (likelihood), ab updated belief (posterior).\n       <br/>\n\
    <br/>\n       Yeh ML mein hamesha use hota hai — Naive Bayes, Bayesian optimization,\
    \ even reinforcement learning mein.\n       <br/>\n<br/>\n       Ek baar samajh\
    \ gaye toh kabhi nahi bhoolenge.\n      </div>\n<h2 class=\"sh2\">\n       \U0001F52E\
    \ Predict the Output\n      </h2>\n<h2 class=\"sh2\">\n       \U0001F41B Find\
    \ the Bug\n      </h2>\n<div class=\"debug-block\">\n<div class=\"debug-label\"\
    >\n        DEBUG CHALLENGE — Bayes calculation error\n       </div>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python — buggy\
    \ code\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n           Run\n\
    \          </button>\n</div>\n</div>\n<pre>P_A = <span class=\"num\">0.3</span>;\
    \ P_B_given_A = <span class=\"num\">0.7</span>; P_B = <span class=\"num\">0.4</span>\n\
    P_A_given_B = P_B_given_A / P_B   <span class=\"cm\"># Bug!</span></pre>\n</div>\n\
    <button class=\"solution-toggle\" onclick=\"toggleSolution('debug23-sol')\">\n\
    \        \U0001F441 Show Fix\n       </button>\n<div class=\"solution-box\" id=\"\
    debug23-sol\">\n<div class=\"sol-header\">\n         BUG EXPLAINED\n        </div>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \     python — fixed\n          </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">copy</button><button class=\"run-btn\" onclick=\"\
    runCode(this)\" style=\"margin-left: 4px;\">Run</button></div>\n</div>\n<pre><span\
    \ class=\"cm\"># Bug: missing P(A) term in numerator!</span>\n<span class=\"cm\"\
    ># Bayes: P(A|B) = P(B|A) × P(A) / P(B)</span>\nP_A_given_B = (P_B_given_A * P_A)\
    \ / P_B   <span class=\"cm\"># correct: 0.7 × 0.3 / 0.4 = 0.525</span></pre>\n\
    </div>\n</div>\n</div>\n<!-- /day-23-theory -->\n<!-- /day-23-quiz-section -->\n\
    <!-- /day-23-tasks-section -->\n<!-- /day-23-resources-section -->"
