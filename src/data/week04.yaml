      are both 784 ✓. Output = (32,256). The inner dims CANCEL. This is a neural layer:
      32 samples in → 32 transformed samples out, each now a 256-dimensional vector
      instead of 784-dimensional. Memorise: outer dims survive, inner dims must match
      and vanish.'
    correct: b
  - num_str: QUESTION 2 OF 4
    question: 'Cosine similarity between two word vectors measures:'
    qid: q26_2
    options:
    - letter: A
      text: The Euclidean distance between the words
      is_correct: false
      id: a
    - letter: B
      text: The angle between the vectors — ignoring their magnitude
      is_correct: true
      id: b
    - letter: C
      text: The dot product divided by the number of dimensions
      is_correct: false
      id: c
    - letter: D
      text: The sum of all shared dimensions
      is_correct: false
      id: d
    correct_fb: '✅ Correct! Cosine similarity = dot(a,b) / (|a| × |b|). By dividing
      by the magnitudes, we normalise to purely measure the ANGLE. cos=1 means same
      direction (similar), cos=0 means perpendicular (unrelated), cos=-1 means opposite.
      In NLP: "king" and "queen" have high cosine similarity because.'
    wrong_fb: '❌ Cosine similarity = dot(a,b) / (|a|×|b|). It measures the ANGLE between
      vectors, not the distance. By dividing by magnitudes, we normalise — a rare
      word that appears once and a common word that appears 100 times in similar contexts
      will still have high cosine similarity. Range: -1 to 1. Used heavily in NLP/recommendation
      systems for semantic similarity.'
    correct: b
  - num_str: QUESTION 3 OF 4
    question: What do eigenvectors of a covariance matrix represent in the context
      of PCA?
    qid: q26_3
    options:
    - letter: A
      text: The means of each feature
      is_correct: false
      id: a
    - letter: B
      text: The directions of maximum variance in the data (principal components)
      is_correct: true
      id: b
    - letter: C
      text: The number of features to keep after PCA
      is_correct: false
      id: c
    - letter: D
      text: The correlation coefficients between features
      is_correct: false
      id: d
    correct_fb: ✅ Correct! The covariance matrix C captures how features vary together.
      Its eigenvectors are the "principal components" — directions in feature space
      along which the data varies the most. The corresponding eigenvalues tell you
      HOW MUCH variance each direction explains. PCA projects your.
    wrong_fb: ❌ Eigenvectors of the covariance matrix = principal components = directions
      of maximum variance. Eigenvalues = how much variance each direction explains.
      PCA sorts eigenvectors by eigenvalue (descending), keeps top k. You're literally
      rotating your data to align with its natural directions of variation. Tomorrow
      (Day 29) you'll implement PCA using sklearn and see this in action on MNIST.
    correct: b
  - num_str: QUESTION 4 OF 4
    question: When is matrix multiplication NOT defined (will throw an error)?
    qid: q26_4
    options:
    - letter: A
      text: When both matrices are the same shape
      is_correct: false
      id: a
    - letter: B
      text: When the number of columns in A ≠ number of rows in B
      is_correct: true
      id: b
    - letter: C
      text: When either matrix contains negative numbers
      is_correct: false
      id: c
    - letter: D
      text: When one matrix is larger than the other
      is_correct: false
      id: d
    correct_fb: ✅ Correct! A @ B requires A.shape[1] == B.shape[0] — the inner dimensions
      must match. (3,4) @ (4,5) ✓ → (3,5). (3,4) @ (5,4) ✗ → ValueError. This is the
      most common error in deep learning code. When you get a shape mismatch error,
      print the shapes of both matrices and check that the "inner".
    wrong_fb: '❌ Matrix multiplication requires A.shape[1] == B.shape[0]. (m,n) @
      (n,p) works. (m,n) @ (k,p) where k≠n fails. Most common PyTorch/NumPy error.
      Debug by printing matrix shapes. Fix: transpose if needed (A @ B.T). Same shape
      matrices work IF they''re square (n×n matrices can multiply: (n,n)@(n,n)=(n,n)).'
    correct: b
