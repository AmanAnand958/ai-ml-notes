    sol_id: sol-w4d23t2
    solution_title: 📓 Complete Colab Code
    solution_code: "# Build a Naive Bayes Spam Classifier\nimport numpy as np\ndef\
      \ tk(t): return t.lower().split()\ndef train(emails,labels):\n    sp,hm=[],[]\n\
      \    for e,l in zip(emails,labels):\n        w=tk(e)\n        (sp if l else\
      \ hm).extend(w)\n    v=list(set(sp+hm))\n    return ({w:(sp.count(w)+1)/(len(sp)+len(v))\
      \ for w in v},\n            {w:(hm.count(w)+1)/(len(hm)+len(v)) for w in v},\n\
      \            sum(labels)/len(labels))\ndef clf(email,sp,hm,ps):\n    w=tk(email)\n\
      \    ls=np.log(ps)+sum(np.log(sp.get(w,1e-10)) for w in w)\n    lh=np.log(1-ps)+sum(np.log(hm.get(w,1e-10))\
      \ for w in w)\n    return \"SPAM\" if ls>lh else \"HAM\"\nems=[\"buy cheap pills\
      \ now\",\"meeting at 3pm\",\"win free money\",\"project deadline\",\"congrats\
      \ you won\",\"lunch at noon\"]\nlb=[1,0,1,0,1,0]\nsp,hm,ps=train(ems,lb)\nfor\
      \ t in [\"free money\",\"meeting tomorrow\",\"cheap pills\"]:\n    print(f\"\
      '{t}' -> {clf(t,sp,hm,ps)}\")\nassert lb is not None, \"lb should not be None\""
