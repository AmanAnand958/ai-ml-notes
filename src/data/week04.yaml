  quizzes:
  - num_str: QUESTION 1 OF 4
    question: In Bayes' Theorem P(A|B) = P(B|A)·P(A) / P(B), what is P(A) called?
    qid: q23_1
    options:
    - letter: A
      text: The likelihood
      is_correct: false
      id: a
    - letter: B
      text: The prior probability
      is_correct: true
      id: b
    - letter: C
      text: The posterior probability
      is_correct: false
      id: c
    - letter: D
      text: The marginal likelihood
      is_correct: false
      id: d
    correct_fb: '✅ Correct! P(A) = prior = our belief before seeing any evidence.
      P(B|A) = likelihood = how probable is evidence B given A is true. P(B) = marginal
      = normalising constant (makes it sum to 1). P(A|B) = posterior = updated belief
      after seeing evidence. The Bayesian learning loop: start with.'
    wrong_fb: '❌ P(A) = prior probability. P(B|A) = likelihood. P(B) = marginal/normalising
      constant. P(A|B) = posterior. In ML, this maps to: prior = your initial model
      guess, likelihood = how well the model explains the data, posterior = updated
      model after training. Naive Bayes explicitly uses all these terms.'
    correct: b
  - num_str: QUESTION 2 OF 4
    question: 'P(A ∩ B) = P(A) × P(B) holds when:'
    qid: q23_2
    options:
    - letter: A
      text: A and B are mutually exclusive
      is_correct: false
      id: a
    - letter: B
      text: A and B are complements
      is_correct: false
      id: b
    - letter: C
      text: A and B are independent events
      is_correct: true
      id: c
    - letter: D
      text: P(A) + P(B) = 1
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Independence means knowing B happened gives zero information
      about whether A happens. So P(A|B) = P(A), and P(A∩B) = P(A|B)×P(B) = P(A)×P(B).
      The "Naive" in Naive Bayes comes from assuming all features are independent
      given the class label — which is rarely true in practice but.
    wrong_fb: ❌ P(A∩B) = P(A)×P(B) when A and B are INDEPENDENT. Mutually exclusive
      means P(A∩B) = 0 (they can't both happen). Independent means P(A|B) = P(A) —
      knowing B tells you nothing about A. These are very different! The "Naive" assumption
      in Naive Bayes is that all features are independent given the class.
    correct: c
  - num_str: QUESTION 3 OF 4
    question: You flip a fair coin and it lands heads 8 times in a row. What is the
      probability of heads on the 9th flip?
    qid: q23_3
    options:
    - letter: A
      text: Less than 0.5 — it's "due" for tails
      is_correct: false
      id: a
    - letter: B
      text: More than 0.5 — the coin is on a hot streak
      is_correct: false
      id: b
    - letter: C
      text: Exactly 0.5 — each flip is independent
      is_correct: true
      id: c
    - letter: D
      text: 1/256 — considering all 9 flips together
      is_correct: false
      id: d
    correct_fb: '✅ Correct! Coin flips are independent — each flip has no memory of
      previous results. This is the "Gambler''s Fallacy" — believing past events influence
      future independent events. In ML: this matters for data splits. If your train/test
      split doesn''t randomise, sequential patterns could "leak".'
    wrong_fb: ❌ Exactly 0.5! Each flip is independent — the coin has no memory. The
      probability of 8 heads in a row was 1/256, but that already happened. For the
      NEXT flip, it's still 0.5. This is the Gambler's Fallacy — assuming past independent
      events affect future ones. Coins don't know their history.
    correct: c
  - num_str: QUESTION 4 OF 4
    question: 'The "Naive" in Naive Bayes refers to:'
    qid: q23_4
    options:
    - letter: A
      text: The model is simple and easy to implement
      is_correct: false
      id: a
    - letter: B
      text: The assumption that all features are independent given the class label
      is_correct: true
      id: b
    - letter: C
      text: The model only works for naive (untrained) users
      is_correct: false
      id: c
    - letter: D
      text: It uses naive prior probabilities of 0.5 for all classes
      is_correct: false
      id: d
    correct_fb: '✅ Correct! The naive independence assumption: P(x₁, x₂, ... xₙ |
      y) = P(x₁|y) × P(x₂|y) × ... P(xₙ|y). This assumption is almost never truly
      valid — word "money" and "win" in an email are NOT independent! But the simplification
      makes it computationally tractable and surprisingly effective.'
    wrong_fb: ❌ "Naive" = assumes all features are conditionally independent given
      the class. P(features|class) = product of P(each feature|class). This is almost
      never true in practice but massively simplifies computation and still works
      well for text. Without this assumption, computing joint probability of thousands
      of words would require astronomical amounts of data.
    correct: b
