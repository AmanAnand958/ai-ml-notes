    </div>\n<div class=\"mb-rule\">\n<span class=\"mb-cond\">\n         P(B)\n   \
    \     </span>\n<span class=\"mb-arrow\">\n         →\n        </span>\n<span class=\"\
    mb-desc\">\n         Marginal probability (total probability of evidence B, normalizing\
    \ constant)\n        </span>\n</div>\n</div>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         python — bayes_theorem.py\n   \
    \     </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><code><span class=\"cm\"># CLASSIC PROBLEM:\
    \ Medical Test</span>\n<span class=\"cm\"># Disease prevalence: 1% of population\
    \ has disease D</span>\n<span class=\"cm\"># Test accuracy: 99% true positive\
    \ rate (sensitivity)</span>\n<span class=\"cm\"># Test specificity: 95% true negative\
    \ rate</span>\n<span class=\"cm\"># QUESTION: Given a POSITIVE test, what's the\
    \ probability of actually having D?</span>\n\nP_D = <span class=\"num\">0.01</span>\
    \          <span class=\"cm\"># Prior: 1% chance of disease</span>\nP_no_D = <span\
    \ class=\"num\">1</span> - P_D    <span class=\"cm\"># 99% chance of no disease</span>\n\
    P_pos_given_D = <span class=\"num\">0.99</span>   <span class=\"cm\"># Sensitivity:\
    \ 99% positive if sick</span>\nP_pos_given_noD = <span class=\"num\">0.05</span>\
    \ <span class=\"cm\"># False positive rate: 5% positive if healthy</span>\n\n\
    <span class=\"cm\"># Total probability of positive test</span>\nP_pos = P_pos_given_D\
    \ * P_D + P_pos_given_noD * P_no_D\n\n<span class=\"cm\"># Bayes' Theorem: P(D\
    \ | positive test)</span>\nP_D_given_pos = (P_pos_given_D * P_D) / P_pos\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"P(disease | positive test)\
    \ = {P_D_given_pos:.3f}\"</span>)\n<span class=\"cm\"># = 0.167 — only 16.7%!\
    \ Surprising because 1% base rate dominates.</span>\n<span class=\"cm\"># This\
