week_number: 4
title: Math for AI/ML
description: ''
days:
- id: '22'
  day_num: 22
  title: Descriptive Statistics
  subtitle: Math se daroo mat — aaj hum stats ko ML lens se dekhenge.
  time_estimate: 4 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Calculate mean, median, mode and explain when each is appropriate
  - Compute variance and standard deviation from scratch in Python
  - Interpret percentiles, quartiles, and IQR — and link them to outlier detection
  - Understand skewness and kurtosis and what they mean for your data
  - Implement all statistics manually using only NumPy (no scipy)
  checklist:
  - id: chk_22_1
    text: Study the core mathematical and architectural principles of Descriptive
      Statistics
  - id: chk_22_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_22_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_22_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - Raw Data
  - Central Tendency
  - Dispersion
  - Shape (Skew/Kurtosis)
  - Outlier Detection
  - Standardization
  - ML Preprocessing
  hinglish: "\U0001F4A1 Ek simple rule: symmetric data (normal distribution) → mean\
    \ use karo.\n       <br/>\n<br/>\n       Skewed data ya outliers hain → median\
    \ use karo.\n       <br/>\n<br/>\n       Yeh rule salary, house prices, exam scores\
    \ pe bahut kaam aata hai.\n       <br/>\n<br/>\n       StandardScaler ke andar\
    \ yehi mean aur std use hota hai — ab tum samajhte ho exactly kya ho raha hai."
  analogy: "GATE exam mein agar class ke marks hain: zyada log 60–70 range mein hain,\
    \ lekin ek topper ne 99 score kiya.\n       <br/>\n<br/>\n       Mean toh 70 ho\
    \ gaya topper ki wajah se — lekin median 65 hai jo \"typical\" student represent\
    \ karta hai.\n       <br/>\n<br/>\n       Salary data mein bhi yahi hota hai —\
    \ median always better tells the \"typical\" story."
  theory_html: "<div class=\"mermaid\">\ngraph TD\n      Stats[\"Descriptive Statistics\"\
    ] --&gt; CT[\"Central Tendency\"]\n      Stats --&gt; Disp[\"Dispersion\"]\n \
    \     CT --&gt; Mean[\"Mean - Sensitive to Outliers\"]\n      CT --&gt; Median[\"\
    Median - Robust to Outliers\"]\n      CT --&gt; Mode[\"Mode\"]\n      Disp --&gt;\
    \ Var[\"Variance - σ²\"]\n      Disp --&gt; SD[\"Standard Deviation - σ\"]\n \
    \     Disp --&gt; IQR[\"Interquartile Range\"]\n</div>\n<h3 class=\"sh3\">\n \
    \      1. Measures of Central Tendency\n      </h3>\n\n<div class=\"cb\">\n<div\
    \ class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — central_tendency.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"run-btn\" onclick=\"\
    openRepl()\">\n          ▶ try online\n         </button>\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy\
    \ <span class=\"kw\">as</span> np\n<span class=\"kw\">from</span> collections\
    \ <span class=\"kw\">import</span> Counter\n\ndata = [<span class=\"num\">12</span>,\
    \ <span class=\"num\">15</span>, <span class=\"num\">14</span>, <span class=\"\
    num\">10</span>, <span class=\"num\">15</span>, <span class=\"num\">14</span>,\
    \ <span class=\"num\">15</span>, <span class=\"num\">13</span>, <span class=\"\
    num\">100</span>]  <span class=\"cm\"># 100 is an outlier</span>\n\n<span class=\"\
    cm\"># --- MEAN: sum / count (affected by outliers) ---</span>\nmean = <span class=\"\
    fn\">sum</span>(data) / <span class=\"fn\">len</span>(data)\n<span class=\"fn\"\
    >print</span>(<span class=\"str\">f\"Mean:   {mean:.2f}\"</span>)   <span class=\"\
    cm\"># 23.0 — pulled by 100!</span>\n\n<span class=\"cm\"># --- MEDIAN: middle\
    \ value (robust to outliers) ---</span>\nsorted_data = <span class=\"fn\">sorted</span>(data)\n\
    n = <span class=\"fn\">len</span>(sorted_data)\nmedian = sorted_data[n//<span\
    \ class=\"num\">2</span>] <span class=\"kw\">if</span> n % <span class=\"num\"\
    >2</span> != <span class=\"num\">0</span> <span class=\"kw\">else</span> (sorted_data[n//<span\
    \ class=\"num\">2</span>-<span class=\"num\">1</span>] + sorted_data[n//<span\
    \ class=\"num\">2</span>]) / <span class=\"num\">2</span>\n<span class=\"fn\"\
    >print</span>(<span class=\"str\">f\"Median: {median}\"</span>)     <span class=\"\
    cm\"># 14 — much more representative!</span>\n\n<span class=\"cm\"># --- MODE:\
    \ most frequent value ---</span>\ncounts = <span class=\"fn\">Counter</span>(data)\n\
    mode = counts.<span class=\"fn\">most_common</span>(<span class=\"num\">1</span>)[<span\
    \ class=\"num\">0</span>][<span class=\"num\">0</span>]\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Mode:   {mode}\"</span>)       <span class=\"cm\"># 15 — appears\
    \ 3 times</span>\n\n<span class=\"cm\"># --- Using NumPy ---</span>\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"\\nNumPy Mean:   {np.mean(data):.2f}\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"NumPy Median:\
    \ {np.median(data)}\"</span>)\n\n<span class=\"cm\"># KEY RULE: Use mean when\
    \ data is symmetric. Use median when data is skewed or has outliers.</span></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       2. Variance and Standard Deviation — From Scratch\n\
    \      </h3>\n<p style=\"margin:0.5rem 0 0.8rem;\">\n       Mean and median tell\
    \ you where the middle of your data is.\n      </p>\n<p style=\"margin:0.5rem\
    \ 0 0.8rem;\">\n       Variance (σ²) and Standard Deviation (σ) tell you how\n\
    \       <strong>\n        spread out\n       </strong>\n       the data is around\
    \ that middle.\n      </p>\n<p style=\"margin:0.5rem 0 0.8rem;\">\n       Variance\
    \ is calculated in squared units (to prevent negative distances from canceling\
    \ out); taking the square root gives us the standard deviation, returning the\
    \ metric to the original data's units.\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         python — variance_std.py\n    \
    \    </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n\
    scores = [<span class=\"num\">55</span>, <span class=\"num\">60</span>, <span\
    \ class=\"num\">65</span>, <span class=\"num\">70</span>, <span class=\"num\"\
    >75</span>, <span class=\"num\">80</span>, <span class=\"num\">85</span>]\n\n\
    <span class=\"cm\"># VARIANCE: average squared distance from the mean</span>\n\
    <span class=\"cm\"># Population variance (ddof=0): divide by N</span>\n<span class=\"\
    cm\"># Sample variance (ddof=1): divide by N-1 (more common in ML)</span>\nmean\
    \ = np.<span class=\"fn\">mean</span>(scores)\nsquared_diffs = [(x - mean)**2\
    \ for x in scores]\nvariance_pop = <span class=\"fn\">sum</span>(squared_diffs)\
    \ / <span class=\"fn\">len</span>(scores)        <span class=\"cm\"># N   → population</span>\n\
    variance_sample = <span class=\"fn\">sum</span>(squared_diffs) / (<span class=\"\
    fn\">len</span>(scores)-<span class=\"num\">1</span>) <span class=\"cm\"># N-1\
    \ → sample</span>\n\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Mean:\
    \             {mean:.2f}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"Variance (pop):   {variance_pop:.2f}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Variance (samp):  {variance_sample:.2f}\"</span>)\n\n<span\
    \ class=\"cm\"># STD DEV: sqrt of variance — brings units back to original</span>\n\
    std_pop = variance_pop ** 0.5\nstd_sample = variance_sample ** <span class=\"\
    num\">0.5</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Std Dev\
    \ (pop):    {std_pop:.2f}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"Std Dev (samp):   {std_sample:.2f}\"</span>)\n\n<span class=\"cm\">#\
    \ Verify with NumPy:</span>\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"np.std(ddof=0):   {np.std(scores, ddof=0):.2f}\"</span>)\n<span class=\"fn\"\
    >print</span>(<span class=\"str\">f\"np.std(ddof=1):   {np.std(scores, ddof=1):.2f}\"\
    </span>)\n\n<span class=\"cm\"># ML Link: StandardScaler uses (x - mean) / std\
    \ — now you know EXACTLY what it does!</span></pre>\n</div>\n<h3 class=\"sh3\"\
    >\n       3. Percentiles, Quartiles, IQR\n      </h3>\n<p style=\"margin:0.5rem\
    \ 0 0.8rem;\">\n       Percentiles divide your sorted data into 100 equal parts.\n\
    \      </p>\n<p style=\"margin:0.5rem 0 0.8rem;\">\n       Quartiles divide it\
    \ into four quarters (Q1 = 25th percentile, Q2 = 50th/median, Q3 = 75th).\n  \
    \    </p>\n<p style=\"margin:0.5rem 0 0.8rem;\">\n       The Interquartile Range\
    \ (IQR = Q3 − Q1) captures the middle 50% of your data and is the foundation of\
    \ robust outlier detection.\n      </p>\n<!-- SVG: Box Plot and IQR Outliers -->\n\
    <figure class=\"svg-diagram\">\n<svg aria-label=\"Box and whisker plot diagram\
    \ showing Q1, median, Q3, IQR and outlier bounds\" height=\"160\" role=\"img\"\
    \ viewbox=\"0 0 600 160\" width=\"600\" xmlns=\"http://www.w3.org/2000/svg\">\n\
    <!-- horizontal whisker line -->\n<line stroke=\"#6b7590\" stroke-width=\"1.5\"\
    \ x1=\"100\" x2=\"500\" y1=\"80\" y2=\"80\">\n</line>\n<!-- outlier point -->\n\
    <circle cx=\"540\" cy=\"80\" fill=\"#e56b8c\" r=\"4\" stroke=\"#dde2f0\" stroke-width=\"\
    1\">\n</circle>\n<text fill=\"#e56b8c\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    9\" text-anchor=\"middle\" x=\"540\" y=\"65\">\n         Outlier (&gt; Upper Fence)\n\
    \        </text>\n<!-- Q1 to Q3 box -->\n<rect fill=\"rgba(108,140,255,0.08)\"\
    \ height=\"80\" rx=\"4\" stroke=\"#6c8cff\" stroke-width=\"2\" width=\"200\" x=\"\
    200\" y=\"40\">\n</rect>\n<!-- Median line -->\n<line stroke=\"#4fd1a5\" stroke-width=\"\
    2\" x1=\"280\" x2=\"280\" y1=\"40\" y2=\"120\">\n</line>\n<!-- Whisker caps -->\n\
    <line stroke=\"#6b7590\" stroke-width=\"1.5\" x1=\"100\" x2=\"100\" y1=\"60\"\
    \ y2=\"100\">\n</line>\n<line stroke=\"#6b7590\" stroke-width=\"1.5\" x1=\"500\"\
    \ x2=\"500\" y1=\"60\" y2=\"100\">\n</line>\n<!-- Annotations -->\n<!-- Minimum\
    \ / Lower Fence cap -->\n<text fill=\"#6b7590\" font-family=\"IBM Plex Mono,monospace\"\
    \ font-size=\"9\" text-anchor=\"middle\" x=\"100\" y=\"135\">\n         Lower\
    \ Fence\n        </text>\n<text fill=\"#6b7590\" font-family=\"IBM Plex Mono,monospace\"\
    \ font-size=\"8.5\" text-anchor=\"middle\" x=\"100\" y=\"147\">\n         Q1 -\
    \ 1.5×IQR\n        </text>\n<!-- Q1 -->\n<text fill=\"#6c8cff\" font-family=\"\
    IBM Plex Mono,monospace\" font-size=\"9.5\" font-weight=\"600\" text-anchor=\"\
    end\" x=\"195\" y=\"35\">\n         Q1 (25th %)\n        </text>\n<!-- Median\
    \ -->\n<text fill=\"#4fd1a5\" font-family=\"IBM Plex Mono,monospace\" font-size=\"\
    9.5\" font-weight=\"600\" text-anchor=\"middle\" x=\"280\" y=\"135\">\n      \
    \   Median (50th %)\n        </text>\n<!-- Q3 -->\n<text fill=\"#6c8cff\" font-family=\"\
    IBM Plex Mono,monospace\" font-size=\"9.5\" font-weight=\"600\" text-anchor=\"\
    start\" x=\"405\" y=\"35\">\n         Q3 (75th %)\n        </text>\n<!-- Maximum\
    \ / Upper Fence cap -->\n<text fill=\"#6b7590\" font-family=\"IBM Plex Mono,monospace\"\
    \ font-size=\"9\" text-anchor=\"middle\" x=\"500\" y=\"135\">\n         Upper\
    \ Fence\n        </text>\n<text fill=\"#6b7590\" font-family=\"IBM Plex Mono,monospace\"\
    \ font-size=\"8.5\" text-anchor=\"middle\" x=\"500\" y=\"147\">\n         Q3 +\
    \ 1.5×IQR\n        </text>\n<!-- IQR bracket -->\n<path d=\"M200,45 L200,28 L400,28\
    \ L400,45\" fill=\"none\" stroke=\"#f7a94b\" stroke-width=\"1.2\">\n</path>\n\
    <text fill=\"#f7a94b\" font-family=\"DM Sans,sans-serif\" font-size=\"10\" font-weight=\"\
    600\" text-anchor=\"middle\" x=\"300\" y=\"20\">\n         Interquartile Range\
    \ (IQR = Q3 − Q1)\n        </text>\n</svg>\n<figcaption>\n        Standard box\
    \ plot and IQR outlier detection rule. Data points falling beyond the lower/upper\
    \ fences are flagged as anomalies.\n       </figcaption>\n</figure>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — percentiles_iqr.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy <span\
    \ class=\"kw\">as</span> np\n\nsalaries = np.<span class=\"fn\">array</span>([<span\
    \ class=\"num\">30</span>,<span class=\"num\">35</span>,<span class=\"num\">38</span>,<span\
    \ class=\"num\">40</span>,<span class=\"num\">42</span>,<span class=\"num\">45</span>,<span\
    \ class=\"num\">48</span>,<span class=\"num\">50</span>,<span class=\"num\">55</span>,<span\
    \ class=\"num\">200</span>])  <span class=\"cm\"># in thousands</span>\n\nQ1 \
    \ = np.<span class=\"fn\">percentile</span>(salaries, <span class=\"num\">25</span>)\
    \   <span class=\"cm\"># 25th percentile</span>\nQ2  = np.<span class=\"fn\">percentile</span>(salaries,\
    \ <span class=\"num\">50</span>)   <span class=\"cm\"># median</span>\nQ3  = np.<span\
    \ class=\"fn\">percentile</span>(salaries, <span class=\"num\">75</span>)   <span\
    \ class=\"cm\"># 75th percentile</span>\nIQR = Q3 - Q1\n\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Q1={Q1}, Q2(median)={Q2}, Q3={Q3}, IQR={IQR}\"</span>)\n\n\
    lower_fence = Q1 - <span class=\"num\">1.5</span> * IQR\nupper_fence = Q3 + <span\
    \ class=\"num\">1.5</span> * IQR\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"Outlier fences: [{lower_fence:.1f}, {upper_fence:.1f}]\"</span>)\noutliers\
    \ = salaries[(salaries &lt; lower_fence) | (salaries &gt; upper_fence)]\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"Outliers: {outliers}\"</span>)\
    \  <span class=\"cm\"># [200]</span>\n\n<span class=\"cm\"># Percentile intuition:\
    \ 75th percentile = 75% of data is BELOW this value.</span>\n<span class=\"cm\"\
    ># So if your salary is at the 90th percentile, you earn MORE than 90% of people.</span></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       4. Skewness and Kurtosis\n      </h3>\n<p style=\"\
    margin:0.5rem 0 0.8rem;\">\n       Real-world data is rarely symmetric.\n    \
    \  </p>\n<p style=\"margin:0.5rem 0 0.8rem;\">\n<strong>\n        Skewness\n \
    \      </strong>\n       measures the asymmetry of the distribution (positive/right-skewed\
    \ means a long tail to the right, negative/left-skewed means a long tail to the\
    \ left).\n      </p>\n<p style=\"margin:0.5rem 0 0.8rem;\">\n<strong>\n      \
    \  Kurtosis\n       </strong>\n       measures tail-heaviness or \"peakedness\"\
    \ — leptokurtic distributions have fat tails, meaning outliers are highly likely.\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — skewness_kurtosis.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"\
    kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\"\
    >import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\n<span class=\"\
    cm\"># --- Skewness: measures asymmetry ---</span>\nsymmetric = np.random.<span\
    \ class=\"fn\">normal</span>(<span class=\"num\">50</span>, <span class=\"num\"\
    >10</span>, <span class=\"num\">1000</span>)        <span class=\"cm\"># skew\
    \ ≈ 0</span>\nright_skewed = np.random.<span class=\"fn\">exponential</span>(<span\
    \ class=\"num\">10</span>, <span class=\"num\">1000</span>)       <span class=\"\
    cm\"># long right tail (salary, house price)</span>\nleft_skewed = -np.random.<span\
    \ class=\"fn\">exponential</span>(<span class=\"num\">10</span>, <span class=\"\
    num\">1000</span>) + <span class=\"num\">100</span>  <span class=\"cm\"># long\
    \ left tail</span>\n\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
    Symmetric skew:    {pd.Series(symmetric).skew():.3f}\"</span>)   <span class=\"\
    cm\"># ≈ 0</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Right-skewed\
    \ skew: {pd.Series(right_skewed).skew():.3f}\"</span>) <span class=\"cm\"># &gt;\
    \ 0</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Left-skewed\
    \ skew:  {pd.Series(left_skewed).skew():.3f}\"</span>)  <span class=\"cm\"># &lt;\
    \ 0</span>\n\n<span class=\"cm\"># Kurtosis: measures \"peakedness\" (how heavy\
    \ are the tails?)</span>\n<span class=\"cm\"># Normal = 0 (excess kurtosis). Leptokurtic\
    \ &gt; 0 (fat tails, more outliers)</span>\n<span class=\"cm\"># Platykurtic &lt;\
    \ 0 (thin tails, fewer extremes)</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Normal kurtosis:   {pd.Series(symmetric).kurt():.3f}\"</span>)\
    \    <span class=\"cm\"># ≈ 0</span>\n\n<span class=\"cm\"># ML Rule: |skew| &gt;\
    \ 1 → apply log transform before modeling</span></pre>\n</div>\n<div class=\"\
    math-box\">\n<strong>\n        Key Formulas — Memorise These\n       </strong>\n\
    <div class=\"mb-rule\">\n<span class=\"mb-cond\">\n         Mean\n        </span>\n\
    <span class=\"mb-arrow\">\n         μ =\n        </span>\n<span class=\"mb-desc\"\
    >\n         Σxᵢ / n\n        </span>\n</div>\n<div class=\"mb-rule\">\n<span class=\"\
    mb-cond\">\n         Variance (Pop)\n        </span>\n<span class=\"mb-arrow\"\
    >\n         σ² =\n        </span>\n<span class=\"mb-desc\">\n         Σ(xᵢ - μ)²\
    \ / n\n        </span>\n</div>\n<div class=\"mb-rule\">\n<span class=\"mb-cond\"\
    >\n         Variance (Sample)\n        </span>\n<span class=\"mb-arrow\">\n  \
    \       s² =\n        </span>\n<span class=\"mb-desc\">\n         Σ(xᵢ - x̄)²\
    \ / (n − 1)\n        </span>\n</div>\n<div class=\"mb-rule\">\n<span class=\"\
    mb-cond\">\n         Std Dev\n        </span>\n<span class=\"mb-arrow\">\n   \
    \      σ =\n        </span>\n<span class=\"mb-desc\">\n         √variance\n  \
    \      </span>\n</div>\n<div class=\"mb-rule\">\n<span class=\"mb-cond\">\n  \
    \       Z-score\n        </span>\n<span class=\"mb-arrow\">\n         z =\n  \
    \      </span>\n<span class=\"mb-desc\">\n         (x − μ) / σ\n         <span\
    \ style=\"color:var(--muted); font-size: 12.5px;\">\n          (standard deviations\
    \ from the mean)\n         </span>\n</span>\n</div>\n<div class=\"mb-rule\">\n\
    <span class=\"mb-cond\">\n         IQR / Fences\n        </span>\n<span class=\"\
    mb-arrow\">\n         IQR =\n        </span>\n<span class=\"mb-desc\">\n     \
    \    Q3 − Q1  ·  Outlier bounds: [Q1 − 1.5×IQR,  Q3 + 1.5×IQR]\n        </span>\n\
    </div>\n</div>\n<div class=\"ml-connect\">\n       StandardScaler literally computes\
    \ Z-score: (x − mean) / std. Understanding variance means you understand WHY features\
    \ with high variance aren't automatically better predictors — high variance can\
    \ also mean high noise.\n       <br/>\n<br/>\n       PCA selects directions of\
    \ maximum variance (Week 4, Day 29).\n       <br/>\n<br/>\n       All of ML is\
    \ built on these foundations.\n      </div>\n<div class=\"hinglish\">\n      \
    \ \U0001F4A1 Ek simple rule: symmetric data (normal distribution) → mean use karo.\n\
    \       <br/>\n<br/>\n       Skewed data ya outliers hain → median use karo.\n\
    \       <br/>\n<br/>\n       Yeh rule salary, house prices, exam scores pe bahut\
    \ kaam aata hai.\n       <br/>\n<br/>\n       StandardScaler ke andar yehi mean\
    \ aur std use hota hai — ab tum samajhte ho exactly kya ho raha hai.\n      </div>\n\
    <h2 class=\"sh2\">\n       \U0001F52E Predict the Output\n      </h2>\n<h2 class=\"\
    sh2\">\n       \U0001F41B Find the Bug\n      </h2>\n<div class=\"debug-block\"\
    >\n<div class=\"debug-label\">\n        DEBUG CHALLENGE — statistical calculation\
    \ error\n       </div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n          python — buggy code\n         </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n \
    \         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n           Run\n          </button>\n</div>\n</div>\n<pre>data\
