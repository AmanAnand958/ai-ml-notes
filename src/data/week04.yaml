      \  T-test: Did survivors have significantly different average fare than non-survivors?\n\
      \           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n       \
      \      (2)\n            </strong>\n            Chi-square: Is passenger class\
      \ (Pclass) related to survival?\n           </li>\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n<strong>\n             (3)\n            </strong>\n          \
      \  Pearson correlation: What is the correlation between Age and Fare?\n    \
      \       </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n           \
      \  (4)\n            </strong>\n            For each test, state the null hypothesis,\
      \ report the p-value, and write a one-sentence plain English conclusion\n  \
      \         </li>\n</ul>"
    done_when: 3 tests run, p-values printed, and clear English conclusions written
      for each.
    git_cmd: 'git add . &amp;&amp; git commit -m "day25: hypothesis tests on Titanic
      dataset"'
    sol_id: sol-w4d25t1
    solution_title: 📓 Complete Colab Code
    solution_code: '<span class="cm"># Statistical Tests on Titanic</span>

      <span class="kw">import</span> pandas <span class="kw">as</span> pd

      <span class="kw">import</span> numpy <span class="kw">as</span> np

      <span class="kw">from</span> scipy <span class="kw">import</span> stats

      url=<span class="str">"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"</span>

      df=pd.<span class="fn">read_csv</span>(url)

      sa,dia=df[df[<span class="str">"Survived"]==1]["Age"].dropna(),df[df["Survived"]==0]["Age"</span>].<span
      class="fn">dropna</span>()

      t,p=stats.<span class="fn">ttest_ind</span>(sa,dia)

      <span class="fn">print</span>(<span class="str">f"T-test Age: t={t:.3f} p={p:.4f}
      {''</span>Sig<span class="str">'' if p&lt;0.05 else ''</span>Not sig<span class="str">''}"</span>)

      ct=pd.<span class="fn">crosstab</span>(df[<span class="str">"Sex"],df["Survived"</span>])

      c2,pc,_,_=stats.<span class="fn">chi2_contingency</span>(ct)

      <span class="fn">print</span>(<span class="str">f"Chi2 Gender: chi2={c2:.3f}
      p={pc:.4f} {''</span>Sig<span class="str">'' if pc&lt;0.05 else ''</span>Not
      sig<span class="str">''}"</span>)

      f=stats.<span class="fn">f_oneway</span>(df[df[<span class="str">"Pclass"]==1]["Fare"],df[df["Pclass"]==2]["Fare"],df[df["Pclass"]==3]["Fare"</span>])

      <span class="fn">print</span>(<span class="str">f"ANOVA Fare: F={f.statistic:.1f}
      p={f.pvalue:.4f}"</span>)'
    solution_lang: python
