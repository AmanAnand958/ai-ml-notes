      class="num">0.7</span>,density=<span class="kw">True</span>,edgecolor=<span
      class="str">''black''</span>)

      ax[<span class="num">1</span>].<span class="fn">set_title</span>(<span class="str">"Sampling
      Dist of Mean (n=30)"</span>)

      plt.<span class="fn">tight_layout</span>()

      plt.<span class="fn">savefig</span>(<span class="str">"clt_demo.png"</span>)

