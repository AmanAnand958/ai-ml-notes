    solution_title: 📓 Complete Colab Code
    solution_code: "<span class=\"cm\"># Build a Stats Calculator from Scratch</span>\n\
      <span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span\
      \ class=\"kw\">def</span> <span class=\"fn\">describe_series</span>(data):\n\
      \    a = np.<span class=\"fn\">array</span>(data)\n    m = np.<span class=\"\
      fn\">mean</span>(a)\n    md = np.<span class=\"fn\">median</span>(a)\n    v\
      \ = np.<span class=\"fn\">var</span>(a,ddof=<span class=\"num\">1</span>)\n\
      \    s = np.<span class=\"fn\">std</span>(a,ddof=<span class=\"num\">1</span>)\n\
