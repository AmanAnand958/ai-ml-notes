    </span>)   <span class=\"cm\"># 0.9545 = 95.45%</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Within 3σ: {p_3sigma:.4f}\"</span>)   <span class=\"cm\">#\
    \ 0.9973 = 99.73%</span>\n\n<span class=\"cm\"># What score is at the 90th percentile?</span>\n\
    p90 = stats.norm.<span class=\"fn\">ppf</span>(<span class=\"num\">0.90</span>,\
