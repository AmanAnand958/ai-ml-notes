    solution_title: 📓 Complete Colab Code
    solution_code: "import numpy as np\nimport torch\nnp.random.seed(42)\ntorch.manual_seed(42)\n\
      # Build a Stats Calculator from Scratch\nimport numpy as np\ndef describe_series(data):\n\
      \    a = np.array(data)\n    m = np.mean(a)\n    md = np.median(a)\n    v =\
      \ np.var(a,ddof=1)\n    s = np.std(a,ddof=1)\n    q1,q3 = np.percentile(a,[25,75])\n\
      \    iqr=q3-q1\n    n=len(a)\n    sk = (n*np.sum((a-m)**3)/((n-1)*(n-2)*s**3))\
      \ if n>2 else 0\n    print(f\"{'Stat':<12} {'Value':<10}\")\n    print(\"-\"\
      *22)\n    for l,v in [(\"Mean\",m),(\"Median\",md),(\"Var\",v),(\"Std\",s),(\"\
      Min\",np.min(a)),\n                (\"Q1\",q1),(\"Q3\",q3),(\"Max\",np.max(a)),(\"\
      IQR\",iqr),(\"Skew\",sk)]:\n        print(f\"{l:<12} {v:<10.4f}\")\nfor name,d\
      \ in [(\"Uniform\",np.random.uniform(0,100,1000)),\n               (\"Normal\"\
      ,np.random.normal(50,10,1000)),\n               (\"Skewed\",np.random.exponential(10,1000))]:\n\
      \    print(f\"=== {name} ===\")\n    describe_series(d)"
