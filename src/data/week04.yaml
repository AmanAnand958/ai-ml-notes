    solution_code: '# Bayesian Medical Test Analysis

      pd_d, pd_gd, pg_nd = 0.01, 0.99, 0.05

      p_pos = pd_gd*pd_d + pg_nd*(1-pd_d)

      pd_gp = pd_gd*pd_d/p_pos

      print("=== Bayes: Medical Test ===")

      print(f"P(Disease)={pd_d}")

      print(f"P(Pos|Disease)={pd_gd}")

      print(f"P(Pos|NoDisease)={pg_nd}")

      print(f"P(Disease|Positive)={pd_gp:.4f} ({pd_gp*100:.1f}%)")

      print(f"Even with 99% accuracy, only {pd_gp*100:.1f}% probability")

      print("because disease is rare (1%). Most positives are false positives!")'
