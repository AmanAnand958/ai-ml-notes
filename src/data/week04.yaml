      class="num">0.7</span>,density=<span class="kw">True</span>,edgecolor=<span
      class="str">''black''</span>)

      ax[<span class="num">0</span>].<span class="fn">set_title</span>(<span class="str">"Population
      (Exponential)"</span>)

