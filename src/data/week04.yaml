  quizzes:
  - num_str: QUESTION 1 OF 4
    question: For salary data where most people earn ₹40,000–₹60,000 but a few earn
      ₹10,00,000+, which measure of central tendency best represents a "typical" salary?
    qid: q22_1
    options:
    - letter: A
      text: Mean — it uses all data points
      is_correct: false
    - letter: B
      text: Median — it is not affected by extreme outliers
      is_correct: true
    - letter: C
      text: Mode — it's the most common value
      is_correct: false
    - letter: D
      text: Standard deviation — it measures spread
      is_correct: false
    correct_fb: ✅ Correct! For right-skewed data (salary, house prices, population),
      the mean gets pulled toward the extreme values. If 9 people earn ₹50,000 and
      1 person earns ₹5,00,000, mean ≈ ₹95,000 which doesn't represent anyone. Median
      = ₹50,000 — much more representative. The Indian government reports median household
      income, not mean, for exactly this reason.
    wrong_fb: ❌ Median wins for skewed data. The mean is pulled by extreme salaries
      (outliers) — one ₹1 crore salary can push mean above what 90% of the dataset
      actually earns. Median is the value where 50% are above and 50% below — robust
      to extremes. Real-world reports like income inequality studies always use median.
  - num_str: QUESTION 2 OF 4
    question: What is the difference between population variance (ddof=0) and sample
      variance (ddof=1)?
    qid: q22_2
    options:
    - letter: A
      text: Population variance divides by N−1; sample divides by N
      is_correct: false
    - letter: B
      text: Population variance divides by N; sample variance divides by N−1 (Bessel's
        correction)
      is_correct: true
    - letter: C
      text: They always give identical results
      is_correct: false
    - letter: D
      text: Sample variance is always larger than population variance
      is_correct: false
    correct_fb: ✅ Correct! Bessel's correction (N−1 instead of N) corrects for the
      bias that arises when estimating population variance from a sample. Using N
      in a sample slightly underestimates the true variance because your sample mean
      is already optimized to be close to the sample data. In ML, you almost always
      have a sample (not the full population), so ddof=1 is standard — which is why
      Pandas' .std() defaults to ddof=1.
    wrong_fb: ❌ Population variance = Σ(xᵢ-μ)²/N (divide by N). Sample variance =
      Σ(xᵢ-x̄)²/(N-1) (divide by N-1, Bessel's correction). The N-1 corrects for bias
      in estimating population variance from a sample. In ML, use N-1 (sample) since
      your dataset is always a sample of the real world. np.std(ddof=0)=population;
      np.std(ddof=1) or pandas .std() = sample.
  - num_str: QUESTION 3 OF 4
    question: A dataset has skewness of +2.5. What does this indicate?
    qid: q22_3
    options:
    - letter: A
      text: The data is symmetric around the mean
      is_correct: false
    - letter: B
      text: The data has a long right tail (positive skew); most values cluster on
        the left
      is_correct: true
    - letter: C
      text: The data has a long left tail; most values cluster on the right
      is_correct: false
    - letter: D
      text: There are exactly 2.5 outliers in the data
      is_correct: false
    correct_fb: '✅ Correct! Positive skew (+) = right tail is longer. Most data is
      bunched on the left (low values) with a few extreme high values pulling the
      mean to the right. Classic examples: salary, house prices, website visit durations.
      In ML, |skew| &gt; 1 is a signal to apply log transformation to make the distribution
      more normal — which helps linear models and neural networks converge better.'
    wrong_fb: ❌ Positive skewness = right tail is longer. The bulk of data is on the
      left (low values) with a few extreme high outliers. Negative skewness = left
      tail is longer. |skew| &gt; 1 means "apply log transform" in preprocessing.
      Salary, house prices, age-of-death are classic positively skewed distributions.
  - num_str: QUESTION 4 OF 4
    question: A student scored at the 90th percentile on an exam. What does this mean?
    qid: q22_4
    options:
    - letter: A
      text: They scored 90% on the exam
      is_correct: false
    - letter: B
      text: They scored 90 marks out of 100
      is_correct: false
    - letter: C
      text: They scored higher than 90% of all students who took the exam
      is_correct: true
    - letter: D
      text: They are in the top 90% of students
      is_correct: false
    correct_fb: '✅ Correct! The Nth percentile = the value below which N% of observations
      fall. 90th percentile = you scored higher than 90% of students (only 10% scored
      higher than you). This is exactly what IQR uses: Q1=25th percentile, Q3=75th
      percentile. GATE rank lists use percentile this way — GATE percentile of 97
      means you''re better than 97% of all test-takers.'
    wrong_fb: '❌ Percentile = position, not score. 90th percentile = scored higher
      than 90% of all students. "Top 90%" would mean only beating 10% of students
      — opposite! GATE uses this: 97 percentile = better than 97% of test-takers,
      only 3% scored higher. Not to be confused with the raw score percentage.'
  flashcards:
  - front: When to use median over mean?
    back: "Skewed data or outliers present\n           <br/>\n           Salary, house\
      \ prices\n           <br/>\n           Mean gets pulled by extremes"
  - front: Variance formula (population)?
    back: "Σ(xᵢ - μ)² / N\n           <br/>\n           Average squared deviation\n\
      \           <br/>\n           from the mean"
  - front: What is a Z-score?
    back: "z = (x - μ) / σ\n           <br/>\n           How many std devs from mean\n\
      \           <br/>\n           StandardScaler uses this!"
  - front: Positive skew means?
    back: "Long RIGHT tail\n           <br/>\n           Mean &gt; Median &gt; Mode\n\
      \           <br/>\n           Apply log transform in ML"
  - front: np.std default ddof?
    back: "ddof=0 (population)\n           <br/>\n           pandas .std() = ddof=1\
      \ (sample)\n           <br/>\n           Use ddof=1 in ML!"
  gotcha:
    title: '⚠️ Gotcha: Matrix Multiplications & Transpose Alignment'
    description: 'Always verify inner dimensions match before matrix multiplication:
      `(M, K) @ (K, N) -> (M, N)`.'
  takeaways:
    hinglish_line: ''
    bullets:
    - Mean = affected by outliers. Median = robust to outliers. Use median for skewed
      data.
    - Variance = avg squared distance from mean. Std Dev = sqrt(variance), same units
      as data.
    - Z-score = (x − mean) / std. StandardScaler IS this formula — now you understand
      it.
    - Positive skew = right tail. |skew| &gt; 1 → apply log transform before ML modeling.
    - np.std() defaults to ddof=0 (population); always use ddof=1 for sample data
      in ML.
