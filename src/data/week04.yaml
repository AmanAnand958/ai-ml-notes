    - 'Normal distribution: 68-95-99.7 rule. μ±1σ=68%, μ±2σ=95%, μ±3σ=99.7%.'
    - Binomial = n success/fail trials. Poisson = count in fixed time; mean = variance
      = λ.
    - PDF = density at a point. CDF = P(X ≤ x). Always use CDF for probabilities!
    - 'CLT: sample MEANS approach Normal regardless of original shape when n ≥ 30.'
    - Use stats.norm.fit() to estimate parameters. stats.kstest() to test normality.
