      \ class=\"fn\">randn</span>(<span class=\"num\">100</span>)\ny = <span class=\"\
      num\">2.5</span>*X + <span class=\"num\">1.0</span> + np.random.<span class=\"\
      fn\">randn</span>(<span class=\"num\">100</span>)*<span class=\"num\">0.3</span>\n\
      X_d = np.c_[np.<span class=\"fn\">ones_like</span>(X), X]\nbeta = np.<span class=\"\
      fn\">zeros</span>(<span class=\"num\">2</span>)\nlr, n_iter, n = <span class=\"\
      num\">0.1</span>, <span class=\"num\">200</span>, <span class=\"fn\">len</span>(y)\n\
      <span class=\"kw\">for</span> i <span class=\"kw\">in</span> <span class=\"\
      fn\">range</span>(n_iter):\n    y_pred = X_d @ beta\n    grad = -(<span class=\"\
      num\">2</span>/n) * X_d.T @ (y - y_pred)\n    beta = beta - lr * grad\n    <span\
      \ class=\"kw\">if</span> i % <span class=\"num\">40</span> == <span class=\"\
      num\">0</span>:\n        mse = np.<span class=\"fn\">mean</span>((y - y_pred)**<span\
      \ class=\"num\">2</span>)\n        <span class=\"fn\">print</span>(<span class=\"\
      str\">f\"  Iter {i:3d}: beta={beta.round(4)}, MSE={mse:.4f}\"</span>)\n<span\
      \ class=\"fn\">print</span>(<span class=\"str\">f\"\\nGD result: y = {beta[1]:.4f}x\
      \ + {beta[0]:.4f}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
      str\">f\"True:      y = 2.5x + 1.0\"</span>)\n<span class=\"cm\"># Compare with\
      \ normal equation</span>\nbeta_ne = np.linalg.<span class=\"fn\">inv</span>(X_d.T\
      \ @ X_d) @ X_d.T @ y\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
      Normal Eq: y = {beta_ne[1]:.4f}x + {beta_ne[0]:.4f}\"</span>)\n<span class=\"\
      fn\">print</span>(<span class=\"str\">f\"GD matches NE: {np.allclose(beta, beta_ne,\
      \ rtol=1e-2)}\"</span>)"
