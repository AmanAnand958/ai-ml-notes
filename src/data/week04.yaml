    <circle cx=\"406\" cy=\"90\" fill=\"#f7a94b\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"418\" cy=\"85\" fill=\"#f7a94b\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"430\" cy=\"72\" fill=\"#f7a94b\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"443\" cy=\"65\" fill=\"#f7a94b\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"456\" cy=\"60\" fill=\"#f7a94b\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
