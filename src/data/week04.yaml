  hinglish: 'Loss surface visualization karo: SGD ka trajectory noisy hota hai, Adam
    ka smooth. Ye intuition samajhna bahut important hai hyperparameter tuning ke
    liye.'
  analogy: Imagine searching for a lost coin on a 1D line (10 meters long) — easy.
    Now search in a 2D square (10x10 = 100 sq meters) — harder. Now a 3D cube (10x10x10
    = 1000 cubic meters) — very hard! Every time you add a feature (dimension) to
    your ML dataset, the "volume" of the space grows exponentially, making your data
    points seem extremely sparse. Models struggle to find patterns in sparse high-dimensional
    space. (This mirrors how Dimensionality fundamentally operates.)
  theory_html: "<div class=\"mermaid\">\ngraph LR\n      High[\"High-Dim Data\"] --&gt;\
    \ Cov[\"Covariance Matrix\"]\n      Cov --&gt; Eigen[\"Eigenvalues / Eigenvectors\"\
    ]\n      Eigen --&gt; Proj[\"Project onto Top Components\"]\n      Proj --&gt;\
    \ Low[\"Low-Dim PCA Space\"]\n</div>\n<h3 class=\"sh3\">\n       1. The Curse\
    \ of Dimensionality\n      </h3>\n\n<h3 class=\"sh3\">\n       2. How PCA Works\n\
    \      </h3>\n<div class=\"ml-connect\">\n       PCA rotates the axes of your\
    \ dataset to align with the directions of maximum variance (spread).\n       <br/>\n\
    <br/>\n       The direction with the most spread is Principal Component 1 (PC1).\n\
    \       <br/>\n<br/>\n       The next most spread (orthogonal to PC1) is PC2.\n\
    \       <br/>\n<br/>\n       You then just drop PC3, PC4...\n       <br/>\n<br/>\n\
    \       PC100, keeping only PC1 and PC2.\n       <br/>\n<br/>\n       You've compressed\
    \ the data while keeping its essence!\n      </div>\n<!-- SVG: Principal Component\
    \ Analysis (PCA) -->\n<figure class=\"svg-diagram\">\n<svg aria-label=\"PCA dimensions\
    \ reduction showing PC1 of maximum variance and PC2 perpendicular to it\" height=\"\
    220\" role=\"img\" viewBox=\"0 0 540 220\" width=\"540\" xmlns=\"http://www.w3.org/2000/svg\"\
    style=\"max-width: 100%; height: auto;\">\n<defs>\n<!-- Arrow markers -->\n<marker\
    \ id=\"arrowPCA_s\" markerheight=\"8\" markerwidth=\"8\" orient=\"auto\" refx=\"\
    6\" refy=\"3\">\n<path d=\"M0,0 L0,6 L8,3 z\" fill=\"#4fd1a5\">\n</path>\n</marker>\n\
    <marker id=\"arrowPCA2_s\" markerheight=\"8\" markerwidth=\"8\" orient=\"auto\"\
    \ refx=\"6\" refy=\"3\">\n<path d=\"M0,0 L0,6 L8,3 z\" fill=\"#b47cfc\">\n</path>\n\
    </marker>\n</defs>\n<!-- Original axes -->\n<line stroke=\"#252a40\" stroke-width=\"\
    1\" x1=\"50\" x2=\"450\" y1=\"180\" y2=\"180\">\n</line>\n<text fill=\"#6b7590\"\
    \ font-family=\"DM Sans,sans-serif\" font-size=\"9\" x=\"455\" y=\"184\">\n  \
    \       Feature X₁\n        </text>\n<line stroke=\"#252a40\" stroke-width=\"\
    1\" x1=\"50\" x2=\"50\" y1=\"20\" y2=\"180\">\n</line>\n<text fill=\"#6b7590\"\
    \ font-family=\"DM Sans,sans-serif\" font-size=\"9\" text-anchor=\"end\" x=\"\
    42\" y=\"16\">\n         Feature X₂\n        </text>\n<!-- Rotated PC1 axis (direction\
    \ of maximum spread/variance) -->\n<line marker-end=\"url(#arrowPCA_s)\" stroke=\"\
    #4fd1a5\" stroke-width=\"2\" x1=\"100\" x2=\"380\" y1=\"150\" y2=\"50\">\n</line>\n\
