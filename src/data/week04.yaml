  - front: Chain rule formula?
    back: "d[f(g(x))]/dx\n           <br/>\n           = f'(g(x)) × g'(x)\n      \
      \     <br/>\n           Outer × inner derivative This establishes the core invariant\
      \ in Calculus Essentials for ML, ensuring memory efficiency, numerical stability,\
