    >in</span> history], <span class=\"str\">'--'</span>, color=<span class=\"str\"\
    >'#f7a94b'</span>, alpha=<span class=\"num\">0.7</span>)\nax1.<span class=\"fn\"\
    >set_title</span>(<span class=\"str\">'Gradient Descent Path on f(x)'</span>);\
    \ ax1.<span class=\"fn\">legend</span>()\nax2.<span class=\"fn\">plot</span>(<span\
    \ class=\"fn\">range</span>(<span class=\"fn\">len</span>(history)), [<span class=\"\
    fn\">f</span>(xh) <span class=\"kw\">for</span> xh <span class=\"kw\">in</span>\
    \ history], color=<span class=\"str\">'#4fd1a5'</span>)\nax2.<span class=\"fn\"\
    >set_title</span>(<span class=\"str\">'Loss over Iterations'</span>); ax2.<span\
    \ class=\"fn\">set_xlabel</span>(<span class=\"str\">'Iteration'</span>); ax2.<span\
    \ class=\"fn\">set_ylabel</span>(<span class=\"str\">'f(x)'</span>)\nplt.<span\
    \ class=\"fn\">tight_layout</span>(); plt.<span class=\"fn\">savefig</span>(<span\
    \ class=\"str\">'gradient_descent.png'</span>, dpi=<span class=\"num\">150</span>)</pre>\n\
    </div>\n<h3 class=\"sh3\">\n       3. Chain Rule — Why Backpropagation Works\n\
    \      </h3>\n<p style=\"margin:0.5rem 0 0.8rem;\">\n       A neural network is\
    \ a chain of operations (layers).\n      </p>\n<p style=\"margin:0.5rem 0 0.8rem;\"\
    >\n       To find how a change in early weights affects the final loss, we multiply\
    \ the local derivatives at each step.\n      </p>\n<p style=\"margin:0.5rem 0\
    \ 0.8rem;\">\n       This process of flowing derivatives backward using multiplication\
    \ is the\n       <strong>\n        chain rule in action\n       </strong>\n  \
    \     .\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         python — chain_rule.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"cm\"># Chain Rule: if y = f(g(x)), then dy/dx = f'(g(x)) × g'(x)</span>\n\
    <span class=\"cm\"># \"Outer derivative × inner derivative\"</span>\n<span class=\"\
    cm\"># Example: y = (3x + 2)⁵</span>\n<span class=\"cm\"># Let u = 3x + 2, y =\
    \ u⁵</span>\n<span class=\"cm\"># dy/dx = dy/du × du/dx = 5u⁴ × 3 = 15(3x+2)⁴</span>\n\
    \n<span class=\"cm\"># WHY IT MATTERS IN DEEP LEARNING:</span>\n<span class=\"\
    cm\"># loss = cross_entropy(softmax(W₂ × relu(W₁ × x + b₁) + b₂))</span>\n<span\
    \ class=\"cm\"># dL/dW₁ = dL/dsoftmax × dsoftmax/drelu × drelu/dW₁</span>\n<span\
    \ class=\"cm\"># This IS backpropagation — the chain rule applied repeatedly!</span>\n\
    \n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span\
    \ class=\"kw\">def</span> <span class=\"fn\">sigmoid</span>(x): <span class=\"\
    kw\">return</span> <span class=\"num\">1</span> / (<span class=\"num\">1</span>\
    \ + np.<span class=\"fn\">exp</span>(-x))\n<span class=\"kw\">def</span> <span\
    \ class=\"fn\">d_sigmoid</span>(x): <span class=\"kw\">return</span> <span class=\"\
    fn\">sigmoid</span>(x) * (<span class=\"num\">1</span> - <span class=\"fn\">sigmoid</span>(x))\
    \   <span class=\"cm\"># derivative of sigmoid</span>\n\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">relu</span>(x): <span class=\"kw\">return</span> np.<span\
    \ class=\"fn\">maximum</span>(<span class=\"num\">0</span>, x)\n<span class=\"\
    kw\">def</span> <span class=\"fn\">d_relu</span>(x): <span class=\"kw\">return</span>\
    \ (x &gt; <span class=\"num\">0</span>).<span class=\"fn\">astype</span>(float)\
    \               <span class=\"cm\"># 1 if x&gt;0, 0 otherwise</span>\n\n<span\
    \ class=\"cm\"># Mini forward/backward pass example</span>\nx = np.<span class=\"\
    fn\">array</span>([<span class=\"num\">0.5</span>, -<span class=\"num\">0.3</span>,\
    \ <span class=\"num\">0.8</span>])\nW = np.<span class=\"fn\">array</span>([[<span\
    \ class=\"num\">0.1</span>, -<span class=\"num\">0.2</span>, <span class=\"num\"\
    >0.3</span>],\n              [-<span class=\"num\">0.1</span>, <span class=\"\
    num\">0.4</span>, <span class=\"num\">0.2</span>]])\nb = np.<span class=\"fn\"\
    >array</span>([<span class=\"num\">0.0</span>, <span class=\"num\">0.0</span>])\n\
    \nz = W @ x + b           <span class=\"cm\"># linear: (2,3)@(3,) = (2,)</span>\n\
    a = <span class=\"fn\">sigmoid</span>(z)          <span class=\"cm\"># activation:\
    \ element-wise</span>\nloss = -np.<span class=\"fn\">log</span>(a[<span class=\"\
    num\">0</span>])    <span class=\"cm\"># simplified cross-entropy for first class</span>\n\
    \n<span class=\"cm\"># Backprop: dL/dz = dL/da × da/dz</span>\ndL_da = -<span\
    \ class=\"num\">1</span> / a[<span class=\"num\">0</span>]       <span class=\"\
    cm\"># derivative of -log(a[0])</span>\nda_dz = <span class=\"fn\">d_sigmoid</span>(z[<span\
    \ class=\"num\">0</span>]) <span class=\"cm\"># chain rule through sigmoid</span>\n\
    dL_dz = dL_da * da_dz\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
    Forward:  z={z}, a={a}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"Backward: dL/dz[0] = {dL_dz:.6f}\"</span>)</pre>\n</div>\n<div class=\"\
    math-box\">\n<strong>\n        Key Gradient Descent Concepts\n       </strong>\n\
    <div class=\"mb-rule\">\n<span class=\"mb-cond\">\n         Learning Rate (α)\n\
    \        </span>\n<span class=\"mb-arrow\">\n         →\n        </span>\n<span\
    \ class=\"mb-desc\">\n         Step size. Too large: overshoots/diverges. Too\
    \ small: takes forever.\n        </span>\n</div>\n<div class=\"mb-rule\">\n<span\
    \ class=\"mb-cond\">\n         Local Minimum\n        </span>\n<span class=\"\
    mb-arrow\">\n         →\n        </span>\n<span class=\"mb-desc\">\n         Valleys\
    \ where gradient is 0. Solution: Momentum, Adam optimiser.\n        </span>\n\
    </div>\n<div class=\"mb-rule\">\n<span class=\"mb-cond\">\n         Vanishing\
    \ Gradient\n        </span>\n<span class=\"mb-arrow\">\n         →\n        </span>\n\
    <span class=\"mb-desc\">\n         Gradients shrink to ~0 in deep networks. Solution:\
    \ ReLU, BatchNorm.\n        </span>\n</div>\n<div class=\"mb-rule\">\n<span class=\"\
    mb-cond\">\n         Exploding Gradient\n        </span>\n<span class=\"mb-arrow\"\
    >\n         →\n        </span>\n<span class=\"mb-desc\">\n         Gradients blow\
    \ up to ∞. Solution: Gradient Clipping.\n        </span>\n</div>\n<div class=\"\
    mb-rule\">\n<span class=\"mb-cond\">\n         Batch Gradient Descent\n      \
    \  </span>\n<span class=\"mb-arrow\">\n         →\n        </span>\n<span class=\"\
    mb-desc\">\n         Uses full dataset for one step — exact but slow.\n      \
    \  </span>\n</div>\n<div class=\"mb-rule\">\n<span class=\"mb-cond\">\n      \
    \   Stochastic GD (SGD)\n        </span>\n<span class=\"mb-arrow\">\n        \
    \ →\n        </span>\n<span class=\"mb-desc\">\n         Uses 1 sample per step\
    \ — fast but noisy.\n        </span>\n</div>\n<div class=\"mb-rule\">\n<span class=\"\
