    sol_id: sol-w4d24t3
    solution_title: 📓 Complete Colab Code
    solution_code: '# Fit Distributions to Real Data

      import numpy as np

      import pandas as pd

      import matplotlib.pyplot as plt

      from scipy import stats

      url="https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"

      d=pd.read_csv(url)["Fare"].dropna().values

      d=d[d<300]

      n_params=stats.norm.fit(d)

      ln_params=stats.lognorm.fit(d)

      print(f"Normal fit: mu={n_params[0]:.2f} sigma={n_params[1]:.2f}")

      print(f"Lognorm fit: shape={ln_params[0]:.3f} loc={ln_params[1]:.2f} scale={ln_params[2]:.2f}")

      x=np.linspace(d.min(),d.max(),100)

      fig,ax=plt.subplots(figsize=(10,5))

      ax.hist(d,bins=40,density=True,alpha=0.6,label="Observed")

      ax.plot(x,stats.norm.pdf(x,*n_params),''r-'',lw=2,label="Normal")

      ax.plot(x,stats.lognorm.pdf(x,*ln_params),''g-'',lw=2,label="Lognormal")

      ax.legend()

      ax.set_title("Fare Distribution Fit")

      plt.tight_layout()

      plt.savefig("distribution_fit.png")

      print("Saved distribution_fit.png")

      assert x is not None, "x should not be None"'
