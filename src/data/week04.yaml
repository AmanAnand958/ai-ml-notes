    \     </button>\n</div>\n</div>\n<pre><code><span class=\"kw\">from</span> scipy\
    \ <span class=\"kw\">import</span> stats\n<span class=\"kw\">import</span> numpy\
    \ <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span> matplotlib.pyplot\
    \ <span class=\"kw\">as</span> plt\n\n<span class=\"cm\"># --- BINOMIAL: n trials,\
    \ p probability of success each trial ---</span>\n<span class=\"cm\"># Q: Toss\
    \ a coin 10 times. P(exactly 6 heads)?</span>\nn, p = <span class=\"num\">10</span>,\
    \ <span class=\"num\">0.5</span>\np_exactly_6 = stats.binom.<span class=\"fn\"\
    >pmf</span>(<span class=\"num\">6</span>, n, p)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"P(exactly 6 heads in 10 flips): {p_exactly_6:.4f}\"</span>)\
    \  <span class=\"cm\"># 0.2051</span>\n\n<span class=\"cm\"># In ML: Bernoulli\
    \ distribution (n=1 Binomial) is binary cross-entropy's foundation</span>\n<span\
    \ class=\"cm\"># Logistic regression output is a Bernoulli probability</span>\n\
    \n<span class=\"cm\"># --- POISSON: count of events in fixed time/space, given\
    \ avg rate λ ---</span>\n<span class=\"cm\"># Q: A website gets avg 100 visitors/hour.\
    \ P(exactly 120 in the next hour)?</span>\nlam = <span class=\"num\">100</span>\
    \   <span class=\"cm\"># lambda = average rate</span>\np_120 = stats.poisson.<span\
    \ class=\"fn\">pmf</span>(<span class=\"num\">120</span>, lam)\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"P(exactly 120 visitors): {p_120:.6f}\"\
    </span>)\n\n<span class=\"cm\"># Poisson is used for: fraud detection (unusual\
