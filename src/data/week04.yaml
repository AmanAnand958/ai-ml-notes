    solution_title: 📓 Complete Colab Code
    solution_code: "# 2D Gradient Descent on a Loss Landscape\nimport numpy as np\n\
      def f(w): return w[0]**2 + 2*w[1]**2 + 3  # elliptical paraboloid\ndef grad(w):\
      \ return np.array([2*w[0], 4*w[1]])\nw = np.array([5.0, 4.0])\nlr, path = 0.05,\
      \ [w.copy()]\nfor i in range(50):\n    w = w - lr * grad(w)\n    path.append(w.copy())\n\
      print(\"2D Gradient Descent Path:\")\nfor i, p in enumerate(path[::5]):\n  \
      \  print(f\"  Step {i*5:2d}: w={p.round(4)}, f(w)={f(p):.4f}\")\nprint(f\"\\\
      nFinal: w={w.round(6)}, f(w)={f(w):.6f}\")\nprint(f\"Minimum: w=(0,0), f(w)=3\"\
      )\nfrom scipy.optimize import minimize\nres = minimize(f, [5.0, 4.0], method='BFGS')\n\
      print(f\"\\nScipy BFGS: w={res.x.round(6)}, f(w)={res.fun:.6f}\")\nprint(\"\
      Loss landscape: elliptical paraboloid with different curvatures\")\nassert res\
      \ is not None, \"res should not be None\""
