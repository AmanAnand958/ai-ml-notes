  tasks:
  - title: BCE from Scratch
    badge: 🟢 EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Write a function\
      \ that takes two lists: y_true (e.g., [1, 0, 1, 1]) and y_pred (e.g., [0.9,\
      \ 0.1, 0.8, 0.2]).\n          </p>\n<ul style=\"padding-left: 1.5rem; margin-top:\
      \ 0.4rem; margin-bottom: 1rem; list-style-type: disc;\">\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n            Compute the average Binary Cross Entropy loss across\
      \ the batch.\n           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n    \
      \        Then, use\n            \n             sklearn.metrics.log_loss\n  \
      \          \n            to compute the same thing.\n           </li>\n<li style=\"\
      margin-bottom: 0.4rem;\">\n            Ensure your answer matches sklearn exactly.\n\
      \           </li>\n</ul>"
