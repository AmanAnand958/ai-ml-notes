    solution_title: 📓 Complete Colab Code
    solution_code: "import numpy as np\nimport torch\nnp.random.seed(42)\ntorch.manual_seed(42)\n\
      # Statistics Visualization Dashboard\nimport numpy as np\nimport matplotlib.pyplot\
      \ as plt\nimport pandas as pd\ndef dash(data,title=\"Dist\"):\n    a=np.array(data)\n\
      \    m=np.mean(a)\n    md=np.median(a)\n    s=np.std(a,ddof=1)\n    q1,q3=np.percentile(a,[25,75])\n\
      \    fig,ax=plt.subplots(1,2,figsize=(14,5))\n    ax[0].hist(a,bins=30,alpha=0.6,color='steelblue',edgecolor='black')\n\
      \    ax[0].axvline(m,color='red',ls='--',lw=2,label=f'Mean={m:.2f}')\n    ax[0].axvline(md,color='green',ls='--',lw=2,label=f'Med={md:.2f}')\n\
      \    for i,si in enumerate([1,2]):\n        ax[0].axvspan(m-si*s,m+si*s,alpha=0.1,color='orange',label=['68%','95%'][i])\n\
      \    ax[0].legend(fontsize=8)\n    ax[0].set_title(f\"{title} mu={m:.2f} sigma={s:.2f}\"\
      )\n    ax[1].boxplot(a,vert=False,patch_artist=True,widths=0.5)\n    ax[1].set_title(f\"\
      Min={np.min(a):.1f} Q1={q1:.1f} Med={md:.1f} Q3={q3:.1f} Max={np.max(a):.1f}\"\
      )\n    plt.tight_layout()\n    return fig\nfor d,n in [(np.random.normal(50,10,1000),\"\
      Normal\"),\n            (np.random.exponential(10,1000),\"Exponential\"),\n\
      \            (np.random.uniform(0,100,1000),\"Uniform\")]:\n    dash(d,n).savefig(f\"\
      dash_{n.lower()}.png\")\n    print(f\"Saved dash_{n.lower()}.png\")\nassert\
      \ s is not None, \"s should not be None\""
