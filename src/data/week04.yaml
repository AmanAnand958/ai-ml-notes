- id: '28'
  day_num: 28
  title: Information Theory Basics
  subtitle: Cross-entropy IS the loss function for every classification model you
    will build.
  time_estimate: 3 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Compute entropy and explain it as "average surprise" or "uncertainty"
  - Implement binary cross-entropy loss from scratch and match PyTorch's output
  - Explain why cross-entropy is the standard classification loss
  - Understand KL divergence conceptually and where it appears in ML
  - Link information theory back to decision trees (entropy-based splits)
  checklist:
  - id: chk_28_1
    text: Study the core mathematical and architectural principles of Information
      Theory Basics
  - id: chk_28_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_28_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_28_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - Descriptive Statistics
  - Probability Fundamentals
  - Probability Distributions
  - Hypothesis Testing + Corr
  - Linear Algebra for ML
  - Calculus Essentials for M
  - Information Theory Basics
  - Dimensionality Reduction
  - 'Month 1 Capstone: Math &'
  hinglish: SVD (Singular Value Decomposition) generalized eigendecomposition hai
    jo non-square matrices par bhi kaam karta hai. Recommendation systems mein latent
    factor models isi par based hain.
  analogy: "Ek fair coin flip ka entropy maximum hai — pure uncertainty (head ya tail?\
    \ 50-50, you never know).\n       <br/>\n<br/>\n       Ek biased coin jo 99% time\
    \ head aata hai — almost no uncertainty — low entropy.\n       <br/>\n<br/>\n\
    \       Ek news headline jo hamesha \"Dog bites man\" hai (expected) — low entropy.\n\
    \       <br/>\n<br/>\n       \"Man bites dog!\" — high surprise = high information\
    \ = high entropy.\n       <br/>\n<br/>\n       Information = surprise."
  theory_html: "<div class=\"mermaid\">graph TD\n  Info[\"Information Metrics\"] --&gt;\
    \ Ent[\"Entropy H(X): Average uncertainty/surprise\"]\n  Info --&gt; CE[\"Cross-Entropy\
    \ H(P, Q): Surprise using model distribution Q\"]\n  Info --&gt; KL[\"KL Divergence\
    \ D_KL(P||Q): Extra bits wasted\"]\n  Ent --&gt; Formula1[\"Formula: -Σ P(x) log\
    \ P(x)\"]\n  CE --&gt; Formula2[\"Formula: -Σ P(x) log Q(x)\"]\n  KL --&gt; Formula3[\"\
    Formula: H(P, Q) - H(P)\"]</div>\n<h3 class=\"sh3\">\n       1. Entropy — Measuring\
    \ Uncertainty\n      </h3>\n\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n         python — entropy.py\n        </span>\n<div class=\"\
    cb-btns\">\n<button class=\"run-btn\" onclick=\"openRepl()\">\n          ▶ try\
    \ online\n         </button>\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span>\
    \ plt\n\n<span class=\"cm\"># Entropy H(p) = -Σ p(x) × log₂(p(x))</span>\n<span\
    \ class=\"cm\"># Measured in BITS. Maximum entropy = log₂(n) for n equally likely\
    \ outcomes.</span>\n\n<span class=\"kw\">def</span> <span class=\"fn\">entropy</span>(probs):\n\
    \    probs = np.<span class=\"fn\">array</span>(probs)\n    probs = probs[probs\
    \ &gt; <span class=\"num\">0</span>]  <span class=\"cm\"># avoid log(0)</span>\n\
    \    <span class=\"kw\">return</span> -np.<span class=\"fn\">sum</span>(probs\
    \ * np.<span class=\"fn\">log2</span>(probs))\n\n<span class=\"cm\"># Different\
    \ distributions:</span>\ncertain = [<span class=\"num\">1.0</span>, <span class=\"\
    num\">0.0</span>]             <span class=\"cm\"># certain outcome — H = 0 (no\
    \ surprise)</span>\nfair_coin = [<span class=\"num\">0.5</span>, <span class=\"\
    num\">0.5</span>]          <span class=\"cm\"># maximum uncertainty — H = 1 bit</span>\n\
    fair_die = [<span class=\"num\">1</span>/<span class=\"num\">6</span>]*<span class=\"\
    num\">6</span>               <span class=\"cm\"># fair die — H = log₂(6) ≈ 2.58\
    \ bits</span>\nbiased = [<span class=\"num\">0.9</span>, <span class=\"num\">0.1</span>]\
    \              <span class=\"cm\"># biased coin — low uncertainty</span>\n\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"Certain:    H = {entropy(certain):.4f}\
    \ bits\"</span>)    <span class=\"cm\"># 0.0</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Fair coin:  H = {entropy(fair_coin):.4f} bits\"</span>)  <span\
    \ class=\"cm\"># 1.0</span>\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"Fair die:   H = {entropy(fair_die):.4f} bits\"</span>)   <span class=\"cm\"\
    ># 2.58</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Biased:\
    \     H = {entropy(biased):.4f} bits\"</span>)     <span class=\"cm\"># 0.469</span>\n\
    </pre>\n</div>\n<h3 class=\"sh3\">\n       2. Cross-Entropy — The Loss Function\n\
    \      </h3>\n<div class=\"ml-connect\">\n       In ML classification, you have\
    \ the true labels (y) and model predictions (y_hat).\n       <br/>\n<br/>\n  \
    \     If true is [1, 0] (it's a cat) and model predicts [0.9, 0.1], the model\
    \ is doing well.\n       <br/>\n<br/>\n       Cross-entropy measures how many\
    \ bits we need to encode the truth using the model's probabilities.\n       <br/>\n\
    <br/>\n       If they match, cross-entropy = entropy of the truth.\n       <br/>\n\
    <br/>\n       If they don't, cross-entropy is higher!\n       <br/>\n<br/>\n \
    \      Formula: $\\text{CE} = -\\sum y \\times \\log(\\hat{y})$.\n      </div>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — bce.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n \
    \         Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span>\
    \ numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># Binary Cross Entropy\
    \ (BCE)</span>\n<span class=\"cm\"># BCE = - (y * log(p) + (1-y) * log(1-p))</span>\n\
    \n<span class=\"kw\">def</span> <span class=\"fn\">bce</span>(y_true, y_pred):\n\
    \    y_pred = np.<span class=\"fn\">clip</span>(y_pred, <span class=\"num\">1e-15</span>,\
    \ <span class=\"num\">1</span>-<span class=\"num\">1e-15</span>) <span class=\"\
    cm\"># prevent log(0)</span>\n    <span class=\"kw\">return</span> - (y_true *\
    \ np.<span class=\"fn\">log</span>(y_pred) + (<span class=\"num\">1</span>-y_true)\
    \ * np.<span class=\"fn\">log</span>(<span class=\"num\">1</span>-y_pred))\n\n\
    <span class=\"fn\">print</span>(<span class=\"str\">\"Perfect prediction:\"</span>,\
    \ <span class=\"fn\">bce</span>(<span class=\"num\">1</span>, <span class=\"num\"\
    >0.99</span>))  <span class=\"cm\"># ≈ 0.01</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Terrible prediction:\"</span>, <span class=\"fn\">bce</span>(<span\
    \ class=\"num\">1</span>, <span class=\"num\">0.01</span>)) <span class=\"cm\"\
    ># ≈ 4.60 (High loss!)</span></pre>\n</div>\n<h3 class=\"sh3\">\n       3. KL\
    \ Divergence\n      </h3>\n<p>\n       Kullback-Leibler (KL) Divergence measures\
    \ how one probability distribution differs from a second, reference probability\
    \ distribution.\n      </p>\n<p>\n       $D_{KL}(P||Q) = \\text{CrossEntropy}(P,\
    \ Q) - \\text{Entropy}(P)$.\n      </p>\n<p>\n       It's essentially the \"extra\"\
    \ surprise.\n      </p>\n<p>\n       It is not a true distance metric because\
    \ it is not symmetric ($KL(P||Q) \\neq KL(Q||P)$).\n      </p>\n<h2 class=\"sh2\"\
    >\n       \U0001F52E Predict the Output\n      </h2>\n<h2 class=\"sh2\">\n   \
    \    \U0001F41B Find the Bug\n      </h2>\n<div class=\"debug-block\">\n<div class=\"\
    debug-label\">\n        DEBUG CHALLENGE — Math Error\n       </div>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python — buggy\
    \ code\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n           Run\n\
    \          </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy\
    \ <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># My BCE loss function\
