  - title: Entropy in Decision Trees
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Imagine a dataset\
      \ of 10 apples (6 red, 4 green).\n          </p>\n<ul style=\"padding-left:\
      \ 1.5rem; margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;\"\
      >\n<li style=\"margin-bottom: 0.4rem;\">\n            Calculate the entropy.\n\
      \           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n            Now imagine\
      \ you split the data by size.\n           </li>\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n            The \"Big\" group has 5 red and 1 green.\n       \
      \    </li>\n<li style=\"margin-bottom: 0.4rem;\">\n            The \"Small\"\
      \ group has 1 red and 3 green.\n           </li>\n<li style=\"margin-bottom:\
      \ 0.4rem;\">\n            Write a script to calculate the Information Gain (Entropy_before\
      \ - Weighted_Entropy_after).\n           </li>\n<li style=\"margin-bottom: 0.4rem;\"\
      >\n            This is literally how Decision Trees work under the hood!.\n\
      \           </li>\n</ul>"
    done_when: You calculate Information Gain &gt; 0.1.
    git_cmd: 'git add . &amp;&amp; git commit -m "day28: information gain calculator"'
    sol_id: sol-w4d28t2
    solution_title: 📓 Complete Colab Code
    solution_code: "<span class=\"cm\"># Entropy in Decision Trees</span>\n<span class=\"\
      kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\"\
      >def</span> <span class=\"fn\">entropy</span>(labels):\n    _, counts = np.<span\
      \ class=\"fn\">unique</span>(labels, return_counts=<span class=\"kw\">True</span>)\n\
      \    probs = counts / <span class=\"fn\">len</span>(labels)\n    <span class=\"\
      kw\">return</span> -np.<span class=\"fn\">sum</span>(probs * np.<span class=\"\
      fn\">log2</span>(probs))\n<span class=\"kw\">def</span> <span class=\"fn\">gini</span>(labels):\n\
      \    _, counts = np.<span class=\"fn\">unique</span>(labels, return_counts=<span\
      \ class=\"kw\">True</span>)\n    probs = counts / <span class=\"fn\">len</span>(labels)\n\
      \    <span class=\"kw\">return</span> <span class=\"num\">1</span> - np.<span\
      \ class=\"fn\">sum</span>(probs**<span class=\"num\">2</span>)\n<span class=\"\
      kw\">def</span> <span class=\"fn\">info_gain</span>(data, labels, split_col):\n\
      \    parent_e = <span class=\"fn\">entropy</span>(labels)\n    values = np.<span\
      \ class=\"fn\">unique</span>(data[:, split_col])\n    child_e = <span class=\"\
      num\">0</span>\n    <span class=\"kw\">for</span> v <span class=\"kw\">in</span>\
      \ values:\n        mask = data[:, split_col] == v\n        child_e += (<span\
      \ class=\"fn\">sum</span>(mask)/<span class=\"fn\">len</span>(labels)) * <span\
      \ class=\"fn\">entropy</span>(labels[mask])\n    <span class=\"kw\">return</span>\
      \ parent_e - child_e\n<span class=\"fn\">print</span>(<span class=\"str\">\"\
      Entropy and Gini examples:\"</span>)\n<span class=\"kw\">for</span> dist, desc\
      \ <span class=\"kw\">in</span> [([<span class=\"num\">0</span>,<span class=\"\
      num\">0</span>,<span class=\"num\">0</span>,<span class=\"num\">0</span>,<span\
      \ class=\"num\">0</span>], <span class=\"str\">\"All same\"), ([0,0,0,0,1],\
      \ \"20%\"), ([0,0,0,1,1], \"40%\"</span>),\n                    ([<span class=\"\
      num\">0</span>,<span class=\"num\">0</span>,<span class=\"num\">1</span>,<span\
      \ class=\"num\">1</span>,<span class=\"num\">1</span>], <span class=\"str\"\
      >\"60%\"), ([0,1,1,1,1], \"80%\"), ([0,1,0,1,0], \"50/50\"</span>)]:\n    <span\
      \ class=\"fn\">print</span>(<span class=\"str\">f\"  {desc:8s}: H={entropy(np.array(dist)):.4f},\
      \ Gini={gini(np.array(dist)):.4f}\"</span>)\ndata = np.<span class=\"fn\">array</span>([[<span\
      \ class=\"num\">1</span>,<span class=\"num\">0</span>],[<span class=\"num\"\
      >1</span>,<span class=\"num\">1</span>],[<span class=\"num\">2</span>,<span\
      \ class=\"num\">0</span>],[<span class=\"num\">2</span>,<span class=\"num\"\
      >1</span>],[<span class=\"num\">2</span>,<span class=\"num\">0</span>],[<span\
      \ class=\"num\">1</span>,<span class=\"num\">0</span>],[<span class=\"num\"\
      >1</span>,<span class=\"num\">1</span>],[<span class=\"num\">2</span>,<span\
      \ class=\"num\">1</span>],[<span class=\"num\">2</span>,<span class=\"num\"\
      >0</span>],[<span class=\"num\">1</span>,<span class=\"num\">0</span>]])\nlabels\
      \ = np.<span class=\"fn\">array</span>([<span class=\"num\">0</span>,<span class=\"\
      num\">0</span>,<span class=\"num\">1</span>,<span class=\"num\">1</span>,<span\
      \ class=\"num\">1</span>,<span class=\"num\">0</span>,<span class=\"num\">1</span>,<span\
      \ class=\"num\">1</span>,<span class=\"num\">0</span>,<span class=\"num\">0</span>])\n\
      <span class=\"kw\">for</span> col <span class=\"kw\">in</span> [<span class=\"\
      num\">0</span>,<span class=\"num\">1</span>]:\n    ig = <span class=\"fn\">info_gain</span>(data,\
      \ labels, col)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"\
      Info Gain for column {col}: {ig:.4f}\"</span>)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Best split is column {'</span><span class=\"num\">0</span><span\
      \ class=\"str\">' if info_gain(data,labels,0)&gt;info_gain(data,labels,1) else\
      \ '</span><span class=\"num\">1</span><span class=\"str\">'}\"</span>)"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 3
    question: Which probability distribution has the HIGHEST entropy?
    qid: q28_1
    options:
    - letter: A
      text: '[0.99, 0.01]'
      is_correct: false
    - letter: B
      text: '[0.8, 0.2]'
      is_correct: false
    - letter: C
      text: '[0.5, 0.5]'
      is_correct: true
    - letter: D
      text: '[1.0, 0.0]'
      is_correct: false
    correct_fb: ✅ Correct! Maximum entropy occurs when all outcomes are equally likely
      (maximum uncertainty). A uniform distribution like [0.5, 0.5] gives 1 bit of
      entropy.
    wrong_fb: '❌ Entropy is a measure of uncertainty. If one outcome is highly likely
      (e.g., 0.99), uncertainty is low, so entropy is low. Maximum entropy happens
      when everything is a complete guess: [0.5, 0.5] (a fair coin).'
  - num_str: QUESTION 2 OF 3
    question: Why do we use Cross-Entropy as a loss function instead of Mean Squared
      Error (MSE) for classification?
    qid: q28_2
    options:
    - letter: A
      text: Because MSE is only for deep learning
      is_correct: false
    - letter: B
      text: Because Cross-Entropy is faster to compute
      is_correct: false
    - letter: C
      text: MSE with probabilities creates non-convex landscapes (local minima), CE
        creates convex landscapes.
      is_correct: true
    - letter: D
      text: Cross-entropy doesn't require gradients
      is_correct: false
    correct_fb: ✅ Correct! When you combine a sigmoid/softmax activation with MSE,
      the resulting loss landscape has flat regions (vanishing gradients) and local
      minima. Cross-Entropy combined with softmax creates a beautiful bowl shape (convex),
      so gradient descent easily finds the global minimum!
    wrong_fb: ❌ Using MSE for probabilities leads to a non-convex loss function with
      flat spots where gradients vanish. Cross-Entropy was mathematically designed
      to cancel out the flat spots of the sigmoid/softmax function, resulting in a
      smooth, convex bowl that is easy to optimize.
  - num_str: QUESTION 3 OF 3
    question: Is KL Divergence a true distance metric?
    qid: q28_3
    options:
    - letter: A
      text: Yes, because it measures the distance between two distributions.
      is_correct: false
    - letter: B
      text: 'No, because it is not symmetric: $KL(P||Q) \neq KL(Q||P)$.'
      is_correct: true
    - letter: C
      text: Yes, because it is always positive.
      is_correct: false
    - letter: D
      text: No, because it can be negative.
      is_correct: false
    correct_fb: ✅ Correct! A mathematical distance metric MUST be symmetric (distance
      from A to B must equal distance from B to A). KL Divergence is not symmetric,
      which is why it's a "divergence", not a "distance".
    wrong_fb: ❌ To be a true distance metric, a function must be symmetric (D(A,B)
      = D(B,A)). KL Divergence is asymmetrical. The "surprise" of experiencing P when
      you expected Q is different from experiencing Q when you expected P.
  flashcards:
  - front: What is Entropy?
    back: A measure of uncertainty or "average surprise" in a distribution. Max for
      uniform distribution.
  - front: Information-theoretic loss measuring the difference between predicted probability
      distributions and true categorical labels.
    back: "$\\text{CE} = -\\sum (y_{\\text{true}} \\times \\log(y_{\\text{pred}}))$\n\
      \           <br/>\n           Used for classification."
  - front: KL Divergence definition?
    back: How much one distribution diverges from a reference distribution. Not symmetric!
  - front: Why not MSE for classification?
    back: Causes non-convex loss landscapes (local minima) and vanishing gradients
      with sigmoid/softmax.
  gotcha:
    title: '⚠️ Gotcha: Matrix Multiplications & Transpose Alignment'
    description: 'Always verify inner dimensions match before matrix multiplication:
      `(M, K) @ (K, N) -> (M, N)`.'
  takeaways:
    hinglish_line: ''
    bullets:
    - Information = surprise. High certainty = low entropy. High uncertainty = high
      entropy.
    - Cross-Entropy is the standard loss for classification because it's convex when
      paired with softmax.
    - "Always clip probabilities\n          \n           np.clip(p, 1e-15, 1-1e-15)\n\
      \          \n          when taking logarithms to prevent NaN errors."
    - KL Divergence measures difference between distributions but is not a symmetric
      distance.
