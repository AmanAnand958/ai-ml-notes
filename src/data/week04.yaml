    middle\" x=\"453\" y=\"118\">\n         Strong positive\n        </text>\n<!--\
    \ r = +1 -->\n<rect fill=\"#1c2030\" height=\"100\" rx=\"8\" stroke=\"#252a40\"\
    \ stroke-width=\"1\" width=\"118\" x=\"522\" y=\"10\">\n</rect>\n<text fill=\"\
    #4fd1a5\" font-family=\"IBM Plex Mono,monospace\" font-size=\"13\" font-weight=\"\
    700\" text-anchor=\"middle\" x=\"581\" y=\"28\">\n         r = +1\n        </text>\n\
    <circle cx=\"534\" cy=\"95\" fill=\"#4fd1a5\" opacity=\"0.8\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"548\" cy=\"83\" fill=\"#4fd1a5\" opacity=\"0.8\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"562\" cy=\"71\" fill=\"#4fd1a5\" opacity=\"0.8\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"576\" cy=\"59\" fill=\"#4fd1a5\" opacity=\"0.8\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"590\" cy=\"47\" fill=\"#4fd1a5\" opacity=\"0.8\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"604\" cy=\"35\" fill=\"#4fd1a5\" opacity=\"0.8\" r=\"2.5\">\n</circle>\n\
    <line opacity=\"0.5\" stroke=\"#4fd1a5\" stroke-dasharray=\"3,2\" stroke-width=\"\
    1\" x1=\"532\" x2=\"607\" y1=\"97\" y2=\"33\">\n</line>\n<text fill=\"#6b7590\"\
    \ font-family=\"DM Sans,sans-serif\" font-size=\"9\" text-anchor=\"middle\" x=\"\
    581\" y=\"118\">\n         Perfect positive\n        </text>\n</svg>\n<figcaption>\n\
    \        Pearson correlation spectrum — from r = −1 (perfect inverse) through\
    \ r = 0 (no linear pattern) to r = +1 (perfect direct). Note: r = 0 can still\
    \ have a strong\n        <em>\n         nonlinear\n        </em>\n        relationship.\n\
    \       </figcaption>\n</figure>\n<div class=\"cb\">\n<div class=\"cb-head\">\n\
    <span class=\"cb-lang\">\n         python — correlation.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><code><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
    \ np\n<span class=\"kw\">from</span> scipy <span class=\"kw\">import</span> stats\n\
    \n<span class=\"cm\"># Pearson r: measures LINEAR relationship strength</span>\n\
    <span class=\"cm\"># Range: -1 (perfect negative) to +1 (perfect positive), 0\
    \ = no linear correlation</span>\n<span class=\"cm\"># Formula: r = Σ[(x-x̄)(y-ȳ)]\
    \ / [sqrt(Σ(x-x̄)²) × sqrt(Σ(y-ȳ)²)]</span>\n\nnp.random.<span class=\"fn\">seed</span>(<span\
    \ class=\"num\">42</span>)\nx = np.random.<span class=\"fn\">normal</span>(<span\
    \ class=\"num\">50</span>, <span class=\"num\">10</span>, <span class=\"num\"\
    >100</span>)\ny_corr = x * <span class=\"num\">2</span> + np.random.<span class=\"\
    fn\">normal</span>(<span class=\"num\">0</span>, <span class=\"num\">5</span>,\
    \ <span class=\"num\">100</span>)   <span class=\"cm\"># strongly correlated</span>\n\
    y_uncorr = np.random.<span class=\"fn\">normal</span>(<span class=\"num\">50</span>,\
    \ <span class=\"num\">20</span>, <span class=\"num\">100</span>)            <span\
    \ class=\"cm\"># uncorrelated</span>\n\nr_corr, p1 = stats.<span class=\"fn\"\
    >pearsonr</span>(x, y_corr)\nr_uncorr, p2 = stats.<span class=\"fn\">pearsonr</span>(x,\
    \ y_uncorr)\n\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Correlated:\
    \   r = {r_corr:.3f}, p = {p1:.6f}\"</span>)    <span class=\"cm\"># r ≈ 0.97,\
    \ p ≈ 0</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Uncorrelated:\
    \ r = {r_uncorr:.3f}, p = {p2:.4f}\"</span>)  <span class=\"cm\"># r ≈ 0.02, p\
    \ ≈ 0.8</span>\n\n<span class=\"cm\"># IMPORTANT: correlation ≠ causation!</span>\n\
    <span class=\"cm\"># \"Ice cream sales correlate with drowning rates\" — both\
    \ caused by summer heat.</span>\n<span class=\"cm\"># Always look for confounding\
    \ variables.</span></code></pre>\n</div>\n<!-- SVG: p-value visual on normal distribution\
    \ -->\n<figure class=\"svg-diagram\">\n<svg aria-label=\"P-value visualization\
