  - title: Implement Linear Regression with Normal Equation
    badge: 🔵 CHALLENGE
    badge_class: tb-proj
    time: 3 hours
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Linear regression\
      \ has a closed-form solution: $\\theta = (X^T X)^{-1} X^T y$ (Normal Equation\
      \ — pure linear algebra!).\n          </p>\n<p style=\"margin-bottom: 0.6rem;\"\
      >\n           Implement this from scratch using only numpy matrix operations:\n\
      \          </p>\n<ul style=\"padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom:\
      \ 1rem; list-style-type: disc;\">\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n\
      \             (1)\n            </strong>\n            Add bias column to X (column\
      \ of ones)\n           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n\
      \             (2)\n            </strong>\n            Compute Xᵀ (transpose)\n\
      \           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n       \
      \      (3)\n            </strong>\n            Compute XᵀX (matrix multiply)\n\
      \           </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n       \
      \      (4)\n            </strong>\n            Compute (XᵀX)⁻¹ (inverse)\n \
      \          </li>\n<li style=\"margin-bottom: 0.4rem;\">\n<strong>\n        \
      \     (5)\n            </strong>\n            Multiply everything together to\
      \ get θ. Compare your θ against sklearn's LinearRegression coefficients — they\
      \ should be identical!\n           </li>\n</ul>"
    done_when: Your normal equation coefficients match sklearn's to 6 decimal places.
      You can explain each matrix operation's role.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day26: linear regression
      via normal equation - pure linear algebra"'
    sol_id: sol-w4d26t3
    solution_title: 📓 Complete Colab Code
    solution_code: '# Implement Linear Regression with Normal Equation

      import numpy as np

      np.random.seed(42)

      X = np.random.randn(100)

      y = 3.0*X + 2.0 + np.random.randn(100)*0.5

      X_design = np.c_[np.ones_like(X), X]

      beta = np.linalg.inv(X_design.T @ X_design) @ X_design.T @ y

      print(f"Normal Equation: y = {beta[1]:.3f}x + {beta[0]:.3f}")

      print(f"True: y = 3.0x + 2.0")

      y_pred = X_design @ beta

      r2 = 1 - np.sum((y - y_pred)**2) / np.sum((y - np.mean(y))**2)

      print(f"R^2 = {r2:.4f}")

      mse = np.mean((y - y_pred)**2)

      print(f"MSE = {mse:.4f}")

      # Multi-variate version

      X2 = np.random.randn(100, 3)

      true_beta = np.array([1.5, -2.0, 0.5])

      y2 = X2 @ true_beta + np.random.randn(100)*0.3

      X2d = np.c_[np.ones(100), X2]

      beta2 = np.linalg.inv(X2d.T @ X2d) @ X2d.T @ y2

      print(f"\nMulti-variate: beta = {beta2}")

      assert beta2 is not None, "beta2 should not be None"'
    solution_lang: python
    time_minutes: 60
