    correct_fb: '✅ Correct! Matrix multiplication rule: (m×n) @ (n×p) = (m×p). Here
      m=32, n=784 (must match!), p=256. Output = (32, 256). This is a real neural
      network layer: 32 training examples × 784 input features (28×28 MNIST image),
