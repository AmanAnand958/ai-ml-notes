    <path d=\"M 80 140 A 40 40 0 0 0 68 112\" fill=\"none\" stroke=\"#b47cfc\" stroke-width=\"\
    1.5\">\n</path>\n<text fill=\"#b47cfc\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    11\" x=\"82\" y=\"125\">\n         θ\n        </text>\n<!-- Formulas on the side\
    \ -->\n<rect fill=\"#141720\" height=\"95\" rx=\"6\" stroke=\"#252a40\" stroke-width=\"\
    1\" width=\"220\" x=\"290\" y=\"20\">\n</rect>\n<text fill=\"#dde2f0\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"10.5\" font-weight=\"600\" x=\"305\" y=\"38\"\
    >\n         Vector Projection &amp; Dot Product\n        </text>\n<text fill=\"\
    #38bdf8\" font-family=\"IBM Plex Mono,monospace\" font-size=\"9.5\" x=\"305\"\
    \ y=\"58\">\n         a · b = |a| × |b| × cos(θ)\n        </text>\n<text fill=\"\
    #4fd1a5\" font-family=\"IBM Plex Mono,monospace\" font-size=\"9.5\" x=\"305\"\
    \ y=\"74\">\n         p = (|b| × cos(θ)) × (a / |a|)\n        </text>\n<text fill=\"\
    #6b7590\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" x=\"305\" y=\"90\"\
    >\n         a · b &gt; 0: same directions (θ &lt; 90°)\n        </text>\n<text\
    \ fill=\"#6b7590\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" x=\"305\"\
    \ y=\"103\">\n         a · b = 0: perpendicular (θ = 90°)\n        </text>\n</svg>\n\
    <figcaption>\n        Orthogonal projection of vector b onto vector a. The dot\
    \ product captures the directional alignment and magnitude scaling between the\
    \ two vectors.\n       </figcaption>\n</figure>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         python — vectors.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"run-btn\" onclick=\"openRepl()\">\n \
    \         ▶ try online\n         </button>\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy <span\
    \ class=\"kw\">as</span> np\n\na = np.<span class=\"fn\">array</span>([<span class=\"\
    num\">1</span>, <span class=\"num\">2</span>, <span class=\"num\">3</span>])\n\
    b = np.<span class=\"fn\">array</span>([<span class=\"num\">4</span>, <span class=\"\
    num\">5</span>, <span class=\"num\">6</span>])\n\n  <span class=\"cm\"># --- Dot\
    \ product: measures alignment / similarity ---</span>\n  <span class=\"cm\">#\
    \ a · b = a₁b₁ + a₂b₂ + a₃b₃</span>\ndot = np.<span class=\"fn\">dot</span>(a,\
    \ b)               <span class=\"cm\"># = 1×4 + 2×5 + 3×6 = 32</span>\ndot_alt\
    \ = a @ b                  <span class=\"cm\"># @ operator = matrix multiply /\
    \ dot product</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
    Dot product: {dot}\"</span>)\n\n<span class=\"cm\"># --- Magnitude (L2 norm):\
    \ length of the vector ---</span>\nmagnitude_a = np.linalg.<span class=\"fn\"\
    >norm</span>(a)  <span class=\"cm\"># sqrt(1² + 2² + 3²) = sqrt(14) ≈ 3.74</span>\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"Magnitude of a: {magnitude_a:.3f}\"\
    </span>)\n\n<span class=\"cm\"># --- Unit vector: vector with magnitude 1 ---</span>\n\
    unit_a = a / magnitude_a          <span class=\"cm\"># \"normalise\" to unit length</span>\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"Unit vector: {unit_a}\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Magnitude check:\
    \ {np.linalg.norm(unit_a):.4f}\"</span>)  <span class=\"cm\"># should be 1.0</span>\n\
    \n<span class=\"cm\"># --- Cosine Similarity: angle between vectors (not magnitude-dependent)\
    \ ---</span>\n<span class=\"cm\"># Used in NLP: how similar are two word embeddings?</span>\n\
    cos_sim = np.<span class=\"fn\">dot</span>(a, b) / (np.linalg.<span class=\"fn\"\
    >norm</span>(a) * np.linalg.<span class=\"fn\">norm</span>(b))\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"Cosine similarity: {cos_sim:.4f}\"</span>)\
    \  <span class=\"cm\"># 0.9746 (very similar direction)</span>\n<span class=\"\
    cm\"># cos_sim = 1: same direction. 0: perpendicular. -1: opposite direction.</span></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       2. Matrix Operations — The Heart of Deep Learning\n\
    \      </h3><p style=\"margin: 0.8rem 0; font-size: 13.5px; line-height: 1.6;\"\
    >Matrix multiplication ($C = AB$) forms the computational foundation of modern\
    \ neural network forward and backward passes, mapping input representations from\
    \ dimension $d_{in}$ into transformed latent manifolds of dimension $d_{out}$.</p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — matrix_operations.py\n        </span>\n<div class=\"cb-btns\">\n\
    <button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n     \
    \    </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left:\
    \ 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"\
    kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"\
    ># --- Matrix Multiplication: (m×n) × (n×p) = (m×p) ---</span>\n<span class=\"\
    cm\"># Inner dimensions MUST match. Output has outer dimensions.</span>\nA = np.<span\
    \ class=\"fn\">array</span>([[<span class=\"num\">1</span>, <span class=\"num\"\
    >2</span>],\n              [<span class=\"num\">3</span>, <span class=\"num\"\
    >4</span>],\n              [<span class=\"num\">5</span>, <span class=\"num\"\
    >6</span>]])  <span class=\"cm\"># shape (3, 2)</span>\n\nW = np.<span class=\"\
    fn\">array</span>([[<span class=\"num\">0.1</span>, <span class=\"num\">0.2</span>,\
    \ <span class=\"num\">0.3</span>],\n              [<span class=\"num\">0.4</span>,\
    \ <span class=\"num\">0.5</span>, <span class=\"num\">0.6</span>]])  <span class=\"\
    cm\"># shape (2, 3)</span>\n\nresult = A @ W   <span class=\"cm\"># (3,2) × (2,3)\
    \ = (3,3)</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"A shape:\
    \ {A.shape}, W shape: {W.shape}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Result shape: {result.shape}\"</span>)\n<span class=\"fn\"\
    >print</span>(result)\n\n<span class=\"cm\"># --- This IS what a neural network\
    \ layer does! ---</span>\n<span class=\"cm\"># X = input (batch_size × n_features)</span>\n\
    <span class=\"cm\"># W = weight matrix (n_features × n_neurons)</span>\n<span\
    \ class=\"cm\"># output = X @ W + b   ← this is the forward pass</span>\n\nbatch_size,\
    \ n_features, n_neurons = <span class=\"num\">32</span>, <span class=\"num\">784</span>,\
    \ <span class=\"num\">128</span>\nX = np.random.<span class=\"fn\">randn</span>(batch_size,\
    \ n_features)\nW = np.random.<span class=\"fn\">randn</span>(n_features, n_neurons)\
    \ * <span class=\"num\">0.01</span>  <span class=\"cm\"># small random weights</span>\n\
    b = np.<span class=\"fn\">zeros</span>(n_neurons)\nlayer_output = X @ W + b\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"\\nNeural layer: ({batch_size},{n_features})\
    \ @ ({n_features},{n_neurons}) = {layer_output.shape}\"</span>)\n\n<span class=\"\
    cm\"># --- Transpose: flip rows and columns ---</span>\nM = np.<span class=\"\
    fn\">array</span>([[<span class=\"num\">1</span>, <span class=\"num\">2</span>,\
    \ <span class=\"num\">3</span>],\n              [<span class=\"num\">4</span>,\
    \ <span class=\"num\">5</span>, <span class=\"num\">6</span>]])  <span class=\"\
    cm\"># (2, 3)</span>\nM_T = M.T              <span class=\"cm\"># (3, 2) — rows\
    \ become columns</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
    M: {M.shape} → M.T: {M_T.shape}\"</span>)\n\n<span class=\"cm\"># --- Matrix Inverse\
    \ and solving Ax = b ---</span>\nA = np.<span class=\"fn\">array</span>([[<span\
    \ class=\"num\">2</span>, <span class=\"num\">1</span>],\n              [<span\
    \ class=\"num\">5</span>, <span class=\"num\">3</span>]])\nb = np.<span class=\"\
    fn\">array</span>([<span class=\"num\">4</span>, <span class=\"num\">7</span>])\n\
    \nA_inv = np.linalg.<span class=\"fn\">inv</span>(A)\nx = A_inv @ b          \
    \ <span class=\"cm\"># or use: x = np.linalg.solve(A, b) — more stable</span>\n\
    x_solve = np.linalg.<span class=\"fn\">solve</span>(A, b)\n<span class=\"fn\"\
    >print</span>(<span class=\"str\">f\"\\nSolution x = {x_solve}\"</span>)   <span\
    \ class=\"cm\"># [5. -6.]</span>\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"Verify A@x: {A @ x_solve}\"</span>)  <span class=\"cm\"># should equal\
    \ b: [4. 7.]</span></pre>\n</div>\n<h3 class=\"sh3\">\n       3. Eigenvalues and\
    \ Eigenvectors — The Key to PCA\n      </h3><p style=\"margin: 0.8rem 0; font-size:\
    \ 13.5px; line-height: 1.6;\">An <strong>eigenvector</strong> $v$ of a square\
    \ matrix $A$ represents a direction that is only scaled (not rotated) by linear\
    \ transformation $A$, satisfying $Av = \\lambda v$. In Principal Component Analysis\
    \ (PCA), top eigenvectors of the covariance matrix point along directions of maximum\
    \ data variance.</p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         python — eigenvalues.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"\
    cm\"># An eigenvector v of matrix A satisfies: A·v = λ·v</span>\n<span class=\"\
    cm\"># λ (lambda) = eigenvalue: how much the vector is scaled</span>\n<span class=\"\
    cm\"># v = eigenvector: direction that is PRESERVED (only scaled, not rotated)</span>\n\
    \nA = np.<span class=\"fn\">array</span>([[<span class=\"num\">3</span>, <span\
    \ class=\"num\">1</span>],\n              [<span class=\"num\">0</span>, <span\
    \ class=\"num\">2</span>]])\n\neigenvalues, eigenvectors = np.linalg.<span class=\"\
    fn\">eig</span>(A)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Eigenvalues:\
    \  {eigenvalues}\"</span>)   <span class=\"cm\"># [3. 2.]</span>\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"Eigenvectors:\\n{eigenvectors}\"</span>)\
    \  <span class=\"cm\"># columns are eigenvectors</span>\n\n<span class=\"cm\"\
    ># Verify: A·v = λ·v for first eigenpair</span>\nv1 = eigenvectors[:, <span class=\"\
    num\">0</span>]   <span class=\"cm\"># first eigenvector (column 0)</span>\nlam1\
    \ = eigenvalues[<span class=\"num\">0</span>]      <span class=\"cm\"># first\
    \ eigenvalue</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\\\
    nA·v1 = {A @ v1}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"λ·v1 = {lam1 * v1}\"</span>)  <span class=\"cm\"># These are EQUAL — verified!</span>\n\
    \n<span class=\"cm\"># --- Why does PCA use eigenvectors? ---</span>\n<span class=\"\
    cm\"># PCA finds the covariance matrix of your features.</span>\n<span class=\"\
    cm\"># The eigenvectors of that covariance matrix are the PRINCIPAL COMPONENTS\
    \ —</span>\n<span class=\"cm\"># directions of maximum variance.</span>\n<span\
    \ class=\"cm\"># Eigenvalues tell you HOW MUCH variance each direction explains.</span>\n\
    <span class=\"cm\"># Sort by eigenvalue (descending) → most important directions\
    \ first.</span>\n\n<span class=\"cm\"># Quick PCA from scratch on 2D data:</span>\n\
    data = np.random.<span class=\"fn\">multivariate_normal</span>([<span class=\"\
    num\">0</span>,<span class=\"num\">0</span>], [[<span class=\"num\">3</span>,<span\
    \ class=\"num\">2</span>],[<span class=\"num\">2</span>,<span class=\"num\">2</span>]],\
    \ <span class=\"num\">200</span>)\ncov_matrix = np.<span class=\"fn\">cov</span>(data.T)\n\
    eigenvalues, eigenvectors = np.linalg.<span class=\"fn\">eig</span>(cov_matrix)\n\
    sorted_idx = np.<span class=\"fn\">argsort</span>(eigenvalues)[::-<span class=\"\
    num\">1</span>]  <span class=\"cm\"># sort descending</span>\nvariance_explained\
    \ = eigenvalues[sorted_idx] / eigenvalues.<span class=\"fn\">sum</span>()\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"\\nVariance explained by PC1:\
    \ {variance_explained[0]:.2%}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Variance explained by PC2: {variance_explained[1]:.2%}\"</span>)</pre>\n\
    </div>\n<div class=\"ml-connect\">\n       Every neural network forward pass is:\
    \ h = activation(W × X + b).\n       <br/>\n<br/>\n       The weights W and inputs\
    \ X are matrices.\n       <br/>\n<br/>\n       Backpropagation computes gradients\
    \ using the chain rule with matrix transposes.\n       <br/>\n<br/>\n       The\
    \ famous \"attention mechanism\" in transformers is Q×Kᵀ/√d where Q and K are\
    \ matrices.\n       <br/>\n<br/>\n       Understanding matrix shapes is how you\
    \ debug deep learning errors — 90% of dimension errors in PyTorch come from wrong\
    \ matrix shapes.\n      </div>\n<div class=\"hinglish\">\n       \U0001F4A1 Shape\
    \ rule: (m×n) @ (n×p) = (m×p).\n       <br/>\n<br/>\n       Inner dimensions must\
    \ match, output gets outer dimensions.\n       <br/>\n<br/>\n       Isko yaad\
    \ karo — yeh PyTorch mein har jagah kaam aata hai.\n       <br/>\n<br/>\n    \
    \   Jab bhi \"shape error\" aaye, check karo ki inner dimensions match kar rahe\
    \ hain ya nahi.\n       <br/>\n<br/>\n       Example: (32, 784) @ (784, 128) =\
    \ (32, 128). ✓\n      </div>\n<h2 class=\"sh2\">\n       \U0001F52E Predict the\
    \ Output\n      </h2>\n<h2 class=\"sh2\">\n       \U0001F41B Find the Bug\n  \
    \    </h2>\n<div class=\"debug-block\">\n<div class=\"debug-label\">\n       \
    \ DEBUG CHALLENGE — matrix shape error\n       </div>\n<div class=\"cb\">\n<div\
