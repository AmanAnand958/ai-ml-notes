    <circle cx=\"365\" cy=\"92\" fill=\"#6b7590\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <circle cx=\"375\" cy=\"50\" fill=\"#6b7590\" opacity=\"0.75\" r=\"2.5\">\n</circle>\n\
    <text fill=\"#6b7590\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" text-anchor=\"\
    middle\" x=\"325\" y=\"118\">\n         No linear relationship\n        </text>\n\
    <!-- r ≈ +0.7 -->\n<rect fill=\"#1c2030\" height=\"100\" rx=\"8\" stroke=\"#252a40\"\
    \ stroke-width=\"1\" width=\"118\" x=\"394\" y=\"10\">\n</rect>\n<text fill=\"\
