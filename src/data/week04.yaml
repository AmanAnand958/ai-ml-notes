    solution_code: "<span class=\"cm\"># Visualise Breast Cancer in 2D</span>\n<span\
      \ class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"\
      kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span\
      \ class=\"kw\">from</span> sklearn.datasets <span class=\"kw\">import</span>\
      \ load_breast_cancer\n<span class=\"kw\">from</span> sklearn.decomposition <span\
      \ class=\"kw\">import</span> PCA\n<span class=\"kw\">from</span> sklearn.preprocessing\
      \ <span class=\"kw\">import</span> StandardScaler\ndata = <span class=\"fn\"\
      >load_breast_cancer</span>()\nX, y = data.data, data.target\nscaler = <span\
      \ class=\"fn\">StandardScaler</span>()\nX_scaled = scaler.<span class=\"fn\"\
      >fit_transform</span>(X)\npca = <span class=\"fn\">PCA</span>(n_components=<span\
      \ class=\"num\">2</span>)\nX_pca = pca.<span class=\"fn\">fit_transform</span>(X_scaled)\n\
      <span class=\"fn\">print</span>(<span class=\"str\">f\"Original: {X.shape},\
      \ PCA: {X_pca.shape}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
      str\">f\"Explained variance: {pca.explained_variance_ratio_.round(4)}\"</span>)\n\
      <span class=\"fn\">print</span>(<span class=\"str\">f\"Total variance retained:\
      \ {sum(pca.explained_variance_ratio_):.3f}\"</span>)\nfig,ax = plt.<span class=\"\
      fn\">subplots</span>(figsize=(<span class=\"num\">10</span>,<span class=\"num\"\
      >7</span>))\n<span class=\"kw\">for</span> label, marker, color <span class=\"\
      kw\">in</span> [(<span class=\"num\">0</span>,<span class=\"str\">'o'</span>,<span\
      \ class=\"str\">'red'</span>),(<span class=\"num\">1</span>,<span class=\"str\"\
      >'^'</span>,<span class=\"str\">'blue'</span>)]:\n    mask = y == label\n  \
      \  ax.<span class=\"fn\">scatter</span>(X_pca[mask,<span class=\"num\">0</span>],\
      \ X_pca[mask,<span class=\"num\">1</span>], c=color, marker=marker,\n      \
      \         label=data.target_names[label], alpha=<span class=\"num\">0.7</span>,\
      \ s=<span class=\"num\">40</span>, edgecolors=<span class=\"str\">'black'</span>,\
      \ linewidth=<span class=\"num\">0.5</span>)\nax.<span class=\"fn\">set_xlabel</span>(<span\
      \ class=\"str\">f\"PC1 ({pca.explained_variance_ratio_[0]:.1%})\"</span>, fontsize=<span\
      \ class=\"num\">12</span>)\nax.<span class=\"fn\">set_ylabel</span>(<span class=\"\
      str\">f\"PC2 ({pca.explained_variance_ratio_[1]:.1%})\"</span>, fontsize=<span\
      \ class=\"num\">12</span>)\nax.<span class=\"fn\">set_title</span>(<span class=\"\
      str\">\"Breast Cancer Dataset in 2D (PCA)\"</span>, fontsize=<span class=\"\
      num\">13</span>)\nax.<span class=\"fn\">legend</span>()\nax.<span class=\"fn\"\
      >grid</span>(<span class=\"kw\">True</span>, alpha=<span class=\"num\">0.3</span>)\n\
      plt.<span class=\"fn\">tight_layout</span>()\nplt.<span class=\"fn\">savefig</span>(<span\
