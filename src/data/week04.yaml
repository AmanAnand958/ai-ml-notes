    >fill_between</span>(x, pdf, where=(x &gt;= mu-sigma) &amp; (x &lt;= mu+sigma),\n\
    \                     alpha=<span class=\"num\">0.3</span>, color=<span class=\"\
    str\">'#4fd1a5'</span>, label=<span class=\"str\">'μ ± 1σ = 68%'</span>)\naxes[<span\
    \ class=\"num\">0</span>].<span class=\"fn\">fill_between</span>(x, pdf, where=(x\
    \ &gt;= mu-<span class=\"num\">2</span>*sigma) &amp; (x &lt;= mu+<span class=\"\
    num\">2</span>*sigma),\n                     alpha=<span class=\"num\">0.15</span>,\
    \ color=<span class=\"str\">'#f7a94b'</span>, label=<span class=\"str\">'μ ± 2σ\
    \ = 95%'</span>)\naxes[<span class=\"num\">0</span>].<span class=\"fn\">set_title</span>(<span\
    \ class=\"str\">'Normal Distribution — Empirical Rule'</span>)\naxes[<span class=\"\
    num\">0</span>].<span class=\"fn\">legend</span>(); axes[<span class=\"num\">0</span>].<span\
    \ class=\"fn\">set_xlabel</span>(<span class=\"str\">'Score'</span>)\n\n<span\
    \ class=\"cm\"># --- Key probabilities (memorise these!) ---</span>\np_1sigma\
    \ = stats.norm.<span class=\"fn\">cdf</span>(mu+sigma, mu, sigma) - stats.norm.<span\
    \ class=\"fn\">cdf</span>(mu-sigma, mu, sigma)\np_2sigma = stats.norm.<span class=\"\
    fn\">cdf</span>(mu+<span class=\"num\">2</span>*sigma, mu, sigma) - stats.norm.<span\
