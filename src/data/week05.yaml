  concept_flow: *id001
  hinglish: 💡 Pipeline ke bina, beginners pehle scaler ko pure dataset par fit kar
    dete hain aur fir train/test split ya cross-validation chalate hain. Aisa karne
    se training data test set ka mean aur standard deviation pehle hi dekh leta hai
    (data leakage), jisse validation score real accuracy se jyada optimisitic aata
    hai. Always use pipelines!
  analogy: Hyperparameter tuning is like tuning a musical instrument (guitar). You
    adjust the tuning pegs (hyperparameters) before playing until the sound (output
    validation score) is perfect.
  theory_html: "<h3 class=\"sh3\">\n       1. Parameters vs Hyperparameters\n    \
    \  </h3>\n<p>\n<strong>\n        Parameters:\n       </strong>\n       Internal\
    \ variables learned by the model during training (e.g. weights $w$ and bias $b$\
    \ in regression, node splits in Decision Trees).\n      </p>\n<p>\n<strong>\n\
    \        Hyperparameters:\n       </strong>\n       External configurations specified\
    \ by the developer before training starts (e.g. learning rate, number of neighbors\
    \ $k$ in KNN, max depth of a Decision Tree).\n      </p>\n<h3 class=\"sh3\">\n\
    \       2. Cross-Validation (K-Fold vs Stratified K-Fold)\n      </h3>\n<p>\n\
    \       Simple train/test split has high variance depending on where the split\
    \ occurred. K-Fold splits the dataset into $K$ blocks, training on $K-1$ and validating\
    \ on the remaining block, repeating $K$ times. Stratified K-Fold ensures each\
    \ fold maintains the same percentage of target class labels as the complete dataset.\n\
    \      </p>\n<figure class=\"svg-diagram\">\n<svg aria-label=\"5-Fold Cross-Validation\
    \ showing rotating validation fold\" height=\"220\" role=\"img\" viewbox=\"0 0\
    \ 620 220\" width=\"620\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<lineargradient\
    \ id=\"kf-bg\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n<stop offset=\"0%\" stop-color=\"\
    #1a1e2e\">\n</stop>\n<stop offset=\"100%\" stop-color=\"var(--bg)\">\n</stop>\n\
    </lineargradient>\n</defs>\n<rect fill=\"url(#kf-bg)\" height=\"220\" rx=\"12\"\
    \ width=\"620\">\n</rect>\n<text fill=\"#e6edf3\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" x=\"310\" y=\"28\"\
    >\n         5-Fold Cross-Validation\n        </text>\n<!-- Labels -->\n<text fill=\"\
    var(--text)\" font-family=\"DM Sans,sans-serif\" font-size=\"11\" text-anchor=\"\
    middle\" x=\"52\" y=\"62\">\n         Fold 1\n        </text>\n<text fill=\"var(--text)\"\
    \ font-family=\"DM Sans,sans-serif\" font-size=\"11\" text-anchor=\"middle\" x=\"\
    52\" y=\"92\">\n         Fold 2\n        </text>\n<text fill=\"var(--text)\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"11\" text-anchor=\"middle\" x=\"52\" y=\"122\"\
    >\n         Fold 3\n        </text>\n<text fill=\"var(--text)\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"11\" text-anchor=\"middle\" x=\"52\" y=\"152\"\
    >\n         Fold 4\n        </text>\n<text fill=\"var(--text)\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"11\" text-anchor=\"middle\" x=\"52\" y=\"182\"\
    >\n         Fold 5\n        </text>\n<!-- Fold 1: Val is block 1 -->\n<rect fill=\"\
    #f97583\" height=\"20\" opacity=\"0.8\" rx=\"3\" width=\"90\" x=\"90\" y=\"48\"\
    >\n</rect>\n<rect fill=\"var(--blue, #82aaff)\" height=\"20\" opacity=\"0.5\"\
    \ rx=\"3\" width=\"90\" x=\"185\" y=\"48\">\n</rect>\n<rect fill=\"var(--blue,\
    \ #82aaff)\" height=\"20\" opacity=\"0.5\" rx=\"3\" width=\"90\" x=\"280\" y=\"\
    48\">\n</rect>\n<rect fill=\"var(--blue, #82aaff)\" height=\"20\" opacity=\"0.5\"\
    \ rx=\"3\" width=\"90\" x=\"375\" y=\"48\">\n</rect>\n<rect fill=\"var(--blue,\
    \ #82aaff)\" height=\"20\" opacity=\"0.5\" rx=\"3\" width=\"90\" x=\"470\" y=\"\
    48\">\n</rect>\n<!-- Fold 2: Val is block 2 -->\n<rect fill=\"var(--blue, #82aaff)\"\
    \ height=\"20\" opacity=\"0.5\" rx=\"3\" width=\"90\" x=\"90\" y=\"78\">\n</rect>\n\
    <rect fill=\"#f97583\" height=\"20\" opacity=\"0.8\" rx=\"3\" width=\"90\" x=\"\
    185\" y=\"78\">\n</rect>\n<rect fill=\"var(--blue, #82aaff)\" height=\"20\" opacity=\"\
    0.5\" rx=\"3\" width=\"90\" x=\"280\" y=\"78\">\n</rect>\n<rect fill=\"var(--blue,\
    \ #82aaff)\" height=\"20\" opacity=\"0.5\" rx=\"3\" width=\"90\" x=\"375\" y=\"\
    78\">\n</rect>\n<rect fill=\"var(--blue, #82aaff)\" height=\"20\" opacity=\"0.5\"\
    \ rx=\"3\" width=\"90\" x=\"470\" y=\"78\">\n</rect>\n<!-- Fold 3: Val is block\
    \ 3 -->\n<rect fill=\"var(--blue, #82aaff)\" height=\"20\" opacity=\"0.5\" rx=\"\
    3\" width=\"90\" x=\"90\" y=\"108\">\n</rect>\n<rect fill=\"var(--blue, #82aaff)\"\
    \ height=\"20\" opacity=\"0.5\" rx=\"3\" width=\"90\" x=\"185\" y=\"108\">\n</rect>\n\
    <rect fill=\"#f97583\" height=\"20\" opacity=\"0.8\" rx=\"3\" width=\"90\" x=\"\
    280\" y=\"108\">\n</rect>\n<rect fill=\"var(--blue, #82aaff)\" height=\"20\" opacity=\"\
    0.5\" rx=\"3\" width=\"90\" x=\"375\" y=\"108\">\n</rect>\n<rect fill=\"var(--blue,\
    \ #82aaff)\" height=\"20\" opacity=\"0.5\" rx=\"3\" width=\"90\" x=\"470\" y=\"\
    108\">\n</rect>\n<!-- Fold 4: Val is block 4 -->\n<rect fill=\"var(--blue, #82aaff)\"\
    \ height=\"20\" opacity=\"0.5\" rx=\"3\" width=\"90\" x=\"90\" y=\"138\">\n</rect>\n\
    <rect fill=\"var(--blue, #82aaff)\" height=\"20\" opacity=\"0.5\" rx=\"3\" width=\"\
    90\" x=\"185\" y=\"138\">\n</rect>\n<rect fill=\"var(--blue, #82aaff)\" height=\"\
    20\" opacity=\"0.5\" rx=\"3\" width=\"90\" x=\"280\" y=\"138\">\n</rect>\n<rect\
    \ fill=\"#f97583\" height=\"20\" opacity=\"0.8\" rx=\"3\" width=\"90\" x=\"375\"\
    \ y=\"138\">\n</rect>\n<rect fill=\"var(--blue, #82aaff)\" height=\"20\" opacity=\"\
    0.5\" rx=\"3\" width=\"90\" x=\"470\" y=\"138\">\n</rect>\n<!-- Fold 5: Val is\
    \ block 5 -->\n<rect fill=\"var(--blue, #82aaff)\" height=\"20\" opacity=\"0.5\"\
    \ rx=\"3\" width=\"90\" x=\"90\" y=\"168\">\n</rect>\n<rect fill=\"var(--blue,\
    \ #82aaff)\" height=\"20\" opacity=\"0.5\" rx=\"3\" width=\"90\" x=\"185\" y=\"\
    168\">\n</rect>\n<rect fill=\"var(--blue, #82aaff)\" height=\"20\" opacity=\"\
    0.5\" rx=\"3\" width=\"90\" x=\"280\" y=\"168\">\n</rect>\n<rect fill=\"var(--blue,\
    \ #82aaff)\" height=\"20\" opacity=\"0.5\" rx=\"3\" width=\"90\" x=\"375\" y=\"\
    168\">\n</rect>\n<rect fill=\"#f97583\" height=\"20\" opacity=\"0.8\" rx=\"3\"\
    \ width=\"90\" x=\"470\" y=\"168\">\n</rect>\n<!-- Legend -->\n<rect fill=\"var(--blue,\
    \ #82aaff)\" height=\"10\" opacity=\"0.5\" rx=\"2\" width=\"14\" x=\"200\" y=\"\
    200\">\n</rect>\n<text fill=\"var(--text)\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"10\" x=\"220\" y=\"209\">\n         Training\n        </text>\n\
    <rect fill=\"#f97583\" height=\"10\" opacity=\"0.8\" rx=\"2\" width=\"14\" x=\"\
    310\" y=\"200\">\n</rect>\n<text fill=\"var(--text)\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"10\" x=\"330\" y=\"209\">\n         Validation\n        </text>\n\
    <!-- Score labels -->\n<text fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"9\" text-anchor=\"middle\" x=\"585\" y=\"62\">\n         Score₁\n\
    \        </text>\n<text fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    9\" text-anchor=\"middle\" x=\"585\" y=\"92\">\n         Score₂\n        </text>\n\
    <text fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" text-anchor=\"\
    middle\" x=\"585\" y=\"122\">\n         Score₃\n        </text>\n<text fill=\"\
    #7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" text-anchor=\"middle\"\
    \ x=\"585\" y=\"152\">\n         Score₄\n        </text>\n<text fill=\"#7ee787\"\
    \ font-family=\"DM Sans,sans-serif\" font-size=\"9\" text-anchor=\"middle\" x=\"\
    585\" y=\"182\">\n         Score₅\n        </text>\n</svg>\n<figcaption>\n   \
    \     Each fold takes turns as the validation set. Final score = mean of all 5\
    \ scores. This eliminates evaluation bias from a single random split.\n      \
    \ </figcaption>\n</figure>\n<div class=\"mermaid\">\ngraph TD\n  F1[\"Fold 1\"\
    ] --&gt; V1[\"Val\"] &amp; T1[\"Train\"] &amp; T2[\"Train\"] &amp; T3[\"Train\"\
    ]\n  F2[\"Fold 2\"] --&gt; T4[\"Train\"] &amp; V2[\"Val\"] &amp; T5[\"Train\"\
    ] &amp; T6[\"Train\"]\n  F3[\"Fold 3\"] --&gt; T7[\"Train\"] &amp; T8[\"Train\"\
    ] &amp; V3[\"Val\"] &amp; T9[\"Train\"]\n  F4[\"Fold 4\"] --&gt; T10[\"Train\"\
    ] &amp; T11[\"Train\"] &amp; T12[\"Train\"] &amp; V4[\"Val\"]\n</div>\n<div class=\"\
    diagram-cap\">\n       4-Fold Cross Validation. We average validation scores across\
    \ all 4 iterations.\n      </div>\n<h3 class=\"sh3\">\n       3. GridSearchCV\
    \ vs RandomizedSearchCV\n      </h3>\n<ul>\n<li>\n<strong>\n         GridSearchCV:\n\
    \        </strong>\n        Exhaustively searches all possible combinations in\
    \ a given search space. Slow but guaranteed to find the best configuration in\
    \ the grid.\n       </li>\n<li>\n<strong>\n         RandomizedSearchCV:\n    \
    \    </strong>\n        Samples a fixed number of combinations randomly from statistical\
    \ distributions. Much faster and highly recommended when search space is large.\n\
    \       </li>\n</ul>\n<h3 class=\"sh3\">\n       4. Scikit-learn Pipelines\n \
    \     </h3>\n<p>\n       Pipelines prevent data leakage by ensuring that all transformations\
    \ (like scaling, imputing) are fitted ONLY on the training folds during cross-validation,\
    \ and never on validation folds.\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         python — pipeline_tuning.py\n \
    \       </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">from</span> sklearn.datasets\
    \ <span class=\"kw\">import</span> load_iris\n<span class=\"kw\">from</span> sklearn.model_selection\
    \ <span class=\"kw\">import</span> train_test_split, GridSearchCV\n<span class=\"\
    kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler\n\
    <span class=\"kw\">from</span> sklearn.neighbors <span class=\"kw\">import</span>\
    \ KNeighborsClassifier\n<span class=\"kw\">from</span> sklearn.pipeline <span\
    \ class=\"kw\">import</span> Pipeline\n\n<span class=\"cm\"># Load data</span>\n\
    iris = <span class=\"fn\">load_iris</span>()\nX, y = iris.data, iris.target\n\
    X_train, X_test, y_train, y_test = <span class=\"fn\">train_test_split</span>(X,\
    \ y, test_size=<span class=\"num\">0.2</span>, random_state=<span class=\"num\"\
    >42</span>)\n\n<span class=\"cm\"># Create Pipeline: Preprocessor + Model</span>\n\
    pipe = <span class=\"fn\">Pipeline</span>([\n<span class=\"cm\"># ('scaler', StandardScaler()),</span>\n\
    \    (<span class=\"str\">'knn'</span>, <span class=\"fn\">KNeighborsClassifier</span>()),\n\
    <span class=\"cm\"># ])</span>\n\n<span class=\"cm\"># Specify hyperparameter\
    \ grid (use prefix model_name__ to refer to parameters)</span>\nparam_grid = {\n\
    <span class=\"cm\"># 'knn__n_neighbors': [3, 5, 7, 9, 11],</span>\n    <span class=\"\
    str\">'knn__weights'</span>: [<span class=\"str\">'uniform'</span>, <span class=\"\
    str\">'distance'</span>],\n<span class=\"cm\"># 'knn__metric': ['euclidean', 'manhattan']</span>\n\
    <span class=\"cm\"># }</span>\n\n<span class=\"cm\"># Run GridSearchCV with 5-fold\
    \ Stratified CV</span>\ngrid_search = <span class=\"fn\">GridSearchCV</span>(pipe,\
    \ param_grid, cv=<span class=\"num\">5</span>, scoring=<span class=\"str\">'accuracy'</span>)\n\
    <span class=\"cm\"># grid_search.fit(X_train, y_train)</span>\n\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"Best Hyperparameters: {grid_search.best_params_}\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Best Cross-Validation\
    \ Score: {grid_search.best_score_:.4f}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Test Set Accuracy: {grid_search.score(X_test, y_test):.4f}\"\
    </span>)</pre>\n</div>\n<div class=\"hinglish\">\n       \U0001F4A1 Pipeline ke\
    \ bina, beginners pehle scaler ko pure dataset par fit kar dete hain aur fir train/test\
    \ split ya cross-validation chalate hain. Aisa karne se training data test set\
    \ ka mean aur standard deviation pehle hi dekh leta hai (data leakage), jisse\
    \ validation score real accuracy se jyada optimisitic aata hai. Always use pipelines!\n\
    \      </div>"
