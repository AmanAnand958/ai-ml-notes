- id: '37'
  day_num: 37
  title: Week 5 Capstone — End-to-End Scikit-learn Pipeline
  subtitle: Aapne ML foundations aur classical classification algorithms master kar
    liye hain! Aaj hum is week ki knowledge ko combine karenge. Hum ek complex customer
    dataset par column-specific preprocessing, hyperparameter search, and final evaluation
    build karenge pipeline ke andar.
  time_estimate: 6 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Integrate preprocessing, column transformers, and classifiers inside a single
    Pipeline
  - Optimize both categorical encodings and estimator parameters simultaneously using
    GridSearchCV
  - Evaluate classification models using class-weighted metrics to handle imbalanced
    targets
  - Save trained pipelines to disk and reload them for mock inference deployment
  checklist:
  - id: chk_37_1
    text: Study the core mathematical and architectural principles of Week 5 Capstone
      — End-to-End Scikit-learn Pipeline
  - id: chk_37_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_37_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_37_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow: *id001
  hinglish: 💡 Ek software engineer ki tarah code likho. Model weights ke sath preprocessing
    models (jaise Standard Scaler's mean/std) ko hamesha joblib karke single file
    mein deploy kiya jata hai, nahi toh train and inference time scale parameter mismatch
    hone se prediction skew aa jayega.
  analogy: A Scikit-learn Pipeline is like an assembly line in a car factory. Raw
    parts (raw features) enter on one side, undergo processing (scaling, encoding),
    and roll out as a complete car (model predictions) at the end.
  theory_html: "<h3 class=\"sh3\">\n       The Architecture of a Production ML Pipeline\n\
    \      </h3>\n<p>\n       Production environments require reproducibility. If\
    \ you scaling numbers or fill missing entries during data preprocessing, those\
    \ exact formulas and statistics must be packaged together with the model to prevent\
    \ train/serving skew.\n      </p>\n<div class=\"mermaid\">\ngraph TD\n  Raw[\"\
    Raw Input Row\"] --&gt; CT[\"ColumnTransformer\"]\n  CT --&gt; Num[\"Numerical\
    \ Features\"]\n  CT --&gt; Cat[\"Categorical Features\"]\n  Num --&gt; ImputeNum[\"\
    Imputer\"] --&gt; Scale[\"Scaler\"]\n  Cat --&gt; ImputeCat[\"Imputer\"] --&gt;\
    \ OHE[\"One-Hot Encoder\"]\n  Scale --&gt; Model[\"KNN / Naive Bayes Classifier\"\
    ]\n  OHE --&gt; Model\n  Model --&gt; Out[\"Class Probabilities / Predictions\"\
    ]\n</div>\n<div class=\"diagram-cap\">\n       End-to-End Pipeline architecture\
    \ encapsulating processing and model state.\n      </div>\n<div class=\"cb\">\n\
    <div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — production_pipeline.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> pandas\
    \ <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span\
    \ class=\"kw\">as</span> np\n<span class=\"kw\">from</span> sklearn.model_selection\
    \ <span class=\"kw\">import</span> train_test_split, GridSearchCV\n<span class=\"\
    kw\">from</span> sklearn.compose <span class=\"kw\">import</span> ColumnTransformer\n\
    <span class=\"kw\">from</span> sklearn.pipeline <span class=\"kw\">import</span>\
    \ Pipeline\n<span class=\"kw\">from</span> sklearn.impute <span class=\"kw\">import</span>\
    \ SimpleImputer\n<span class=\"kw\">from</span> sklearn.preprocessing <span class=\"\
    kw\">import</span> StandardScaler, OneHotEncoder\n<span class=\"kw\">from</span>\
    \ sklearn.neighbors <span class=\"kw\">import</span> KNeighborsClassifier\n<span\
    \ class=\"kw\">import</span> joblib\n\n<span class=\"cm\"># 1. Create a mock customer\
    \ database</span>\n<span class=\"cm\"># np.random.seed(42)</span>\nn = <span class=\"\
    num\">500</span>\ndata = pd.<span class=\"fn\">DataFrame</span>({\n    <span class=\"\
    str\">'Age'</span>: np.random.<span class=\"fn\">choice</span>([np.nan, <span\
    \ class=\"num\">25</span>, <span class=\"num\">35</span>, <span class=\"num\"\
    >45</span>, <span class=\"num\">55</span>], size=n),\n    <span class=\"str\"\
    >'Income'</span>: np.random.<span class=\"fn\">choice</span>([np.nan, <span class=\"\
    num\">30000</span>, <span class=\"num\">60000</span>, <span class=\"num\">90000</span>,\
    \ <span class=\"num\">120000</span>], size=n),\n    <span class=\"str\">'Subscription'</span>:\
    \ np.random.<span class=\"fn\">choice</span>([<span class=\"str\">'Basic'</span>,\
    \ <span class=\"str\">'Premium'</span>, <span class=\"str\">'Gold'</span>], size=n),\n\
    \    <span class=\"str\">'Churn'</span>: np.random.<span class=\"fn\">choice</span>([<span\
    \ class=\"num\">0</span>, <span class=\"num\">1</span>], p=[<span class=\"num\"\
    >0.8</span>, <span class=\"num\">0.2</span>], size=n)\n<span class=\"cm\"># })</span>\n\
    \nX = data.<span class=\"fn\">drop</span>(columns=[<span class=\"str\">'Churn'</span>])\n\
    y = data[<span class=\"str\">'Churn'</span>]\nX_train, X_test, y_train, y_test\
    \ = <span class=\"fn\">train_test_split</span>(X, y, test_size=<span class=\"\
    num\">0.2</span>, random_state=<span class=\"num\">42</span>)\n\n<span class=\"\
    cm\"># 2. Define pipelines for numerical and categorical columns separately</span>\n\
    num_cols = [<span class=\"str\">'Age'</span>, <span class=\"str\">'Income'</span>]\n\
    cat_cols = [<span class=\"str\">'Subscription'</span>]\n\nnum_transformer = <span\
    \ class=\"fn\">Pipeline</span>([\n    (<span class=\"str\">'imputer'</span>, <span\
    \ class=\"fn\">SimpleImputer</span>(strategy=<span class=\"str\">'median'</span>)),\n\
    <span class=\"cm\"># ('scaler', StandardScaler())</span>\n<span class=\"cm\">#\
    \ ])</span>\n\ncat_transformer = <span class=\"fn\">Pipeline</span>([\n    (<span\
    \ class=\"str\">'imputer'</span>, <span class=\"fn\">SimpleImputer</span>(strategy=<span\
    \ class=\"str\">'most_frequent'</span>)),\n    (<span class=\"str\">'ohe'</span>,\
    \ <span class=\"fn\">OneHotEncoder</span>(handle_unknown=<span class=\"str\">'ignore'</span>))\n\
    <span class=\"cm\"># ])</span>\n\n<span class=\"cm\"># 3. Combine using ColumnTransformer</span>\n\
    preprocessor = <span class=\"fn\">ColumnTransformer</span>(transformers=[\n  \
    \  (<span class=\"str\">'num'</span>, num_transformer, num_cols),\n    (<span\
    \ class=\"str\">'cat'</span>, cat_transformer, cat_cols)\n<span class=\"cm\">#\
    \ ])</span>\n\n<span class=\"cm\"># 4. Integrate Model in main Pipeline</span>\n\
    full_pipeline = <span class=\"fn\">Pipeline</span>([\n<span class=\"cm\"># ('prep',\
    \ preprocessor),</span>\n    (<span class=\"str\">'knn'</span>, <span class=\"\
    fn\">KNeighborsClassifier</span>()),\n<span class=\"cm\"># ])</span>\n\n<span\
    \ class=\"cm\"># 5. Tune hyperparameters over both model and encoders simultaneously</span>\n\
    param_grid = {\n<span class=\"cm\"># 'prep__num__imputer__strategy': ['mean',\
    \ 'median'],</span>\n<span class=\"cm\"># 'knn__n_neighbors': [3, 5, 10, 15],</span>\n\
    \    <span class=\"str\">'knn__weights'</span>: [<span class=\"str\">'uniform'</span>,\
    \ <span class=\"str\">'distance'</span>]\n<span class=\"cm\"># }</span>\n\ngrid\
    \ = <span class=\"fn\">GridSearchCV</span>(full_pipeline, param_grid, cv=<span\
    \ class=\"num\">5</span>, scoring=<span class=\"str\">'f1'</span>)\n<span class=\"\
    cm\"># grid.fit(X_train, y_train)</span>\n\n<span class=\"cm\"># 6. Save model\
    \ pipeline to disk</span>\n<span class=\"cm\"># joblib.dump(grid.best_estimator_,\
    \ 'churn_model_pipeline.joblib')</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Tuned pipeline successfully generated and saved!\"</span>)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"Best Grid Parameters: {grid.best_params_}\"\
    </span>)</pre>\n</div>\n<div class=\"hinglish\">\n       \U0001F4A1 Ek software\
    \ engineer ki tarah code likho. Model weights ke sath preprocessing models (jaise\
    \ Standard Scaler's mean/std) ko hamesha joblib karke single file mein deploy\
    \ kiya jata hai, nahi toh train and inference time scale parameter mismatch hone\
    \ se prediction skew aa jayega.\n      </div>"
