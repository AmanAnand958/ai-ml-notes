  tasks:
  - title: End-to-End Churn Prediction Pipeline
    badge: 🏆 CAPSTONE
    badge_class: tb-proj
    time: 3 hours
    prompt_html: "<p>\n            Build a fully operational production pipeline on\
      \ simulated churn data (containing Age, Salary, Country categorical values,\
      \ and some NaN inputs). Define ColumnTransformer for scaling numerical and One-Hot\
      \ Encoding categorical features. Add KNN classifier. Tune parameters using GridSearchCV.\
      \ Save the model as a joblib file. Write a mock inference script\n         \
      \   <code>predict_churn.py</code>\n            that loads the pipeline, accepts\
      \ mock customer variables, and prints churn probability.\n          </p>"
    done_when: Both build script and inference script run successfully. Model saved,
      reloaded, and produces correct output prediction formats.
    git_cmd: 'git add pipeline_capstone.py predict_churn.py &amp;&amp; git commit
      -m "day37: end-to-end classification pipeline capstone" &amp;&amp; git push'
    sol_id: sol-w5d37t1
    solution_title: ✅ COMPLETE SOLUTION — pipeline_capstone.py
    solution_code: "<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span>\
      \ pd\n<span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\"\
      >import</span> StandardScaler, OneHotEncoder\n<span class=\"kw\">from</span>\
      \ sklearn.compose <span class=\"kw\">import</span> ColumnTransformer\n<span\
      \ class=\"kw\">from</span> sklearn.pipeline <span class=\"kw\">import</span>\
      \ Pipeline\n<span class=\"kw\">from</span> sklearn.ensemble <span class=\"kw\"\
      >import</span> RandomForestClassifier\n<span class=\"kw\">import</span> joblib\n\
      \n<span class=\"kw\">def</span> <span class=\"fn\">build_churn_pipeline</span>(num_cols,\
      \ cat_cols):\n    preprocessor = <span class=\"fn\">ColumnTransformer</span>([\n\
      \        (<span class=\"str\">'num'</span>, <span class=\"fn\">StandardScaler</span>(),\
      \ num_cols),\n        (<span class=\"str\">'cat'</span>, <span class=\"fn\"\
      >OneHotEncoder</span>(handle_unknown=<span class=\"str\">'ignore'</span>), cat_cols)\n\
      \    ])\n    pipeline = <span class=\"fn\">Pipeline</span>([\n        (<span\
      \ class=\"str\">'preprocessor'</span>, preprocessor),\n        (<span class=\"\
      str\">'classifier'</span>, <span class=\"fn\">RandomForestClassifier</span>(n_estimators=<span\
      \ class=\"num\">100</span>, random_state=<span class=\"num\">42</span>))\n \
      \   ])\n    <span class=\"kw\">return</span> pipeline\n\n<span class=\"kw\"\
      >if</span> __name__ == <span class=\"str\">'__main__'</span>:\n    <span class=\"\
      fn\">print</span>(<span class=\"str\">\"✅ End-to-End Pipeline defined successfully.\"\
      </span>)"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 5
    question: What is the advantage of using joblib over standard pickle for saving
      models in Python?
    qid: q37-1
    options:
    - letter: A
      text: joblib encrypts the saved models automatically
      is_correct: false
    - letter: B
      text: joblib is much faster and more storage-efficient when saving large NumPy
        arrays
      is_correct: true
    - letter: C
      text: joblib allows cross-language model loading (e.g. in Java)
      is_correct: false
    - letter: D
      text: joblib models run twice as fast during predictions
      is_correct: false
    correct_fb: ✅ Correct! joblib is optimized specifically for heavy mathematical
      structures like large numpy arrays and matrices, compressing parameters much
      better than standard picklers.
    wrong_fb: ❌ Incorrect. joblib does not encrypt models or speed up predictions.
      Its main benefit is IO performance on objects containing large numerical arrays.
  - num_str: QUESTION 2 OF 5
    question: Why can OneHotEncoder raise errors on test/inference sets if not configured
      with handle_unknown='ignore'?
    qid: q37-2
    options:
    - letter: A
      text: Categorical variables must be standardized first
      is_correct: false
    - letter: B
      text: If a completely new category (unseen during fit) appears in test/production
        data, the encoder won't know how to map it
      is_correct: true
    - letter: C
      text: It scales variables to infinity
      is_correct: false
    - letter: D
      text: It requires numeric inputs only
      is_correct: false
    correct_fb: ✅ Correct! Unseen categories during fit cause mapping errors. Setting
      handle_unknown='ignore' forces the encoder to represent new categories as all
      zeros, avoiding server crashes.
    wrong_fb: ❌ Incorrect. Test data can contain new categories not seen in training.
      OneHotEncoder will error unless handle_unknown='ignore' is explicitly set.
  - num_str: QUESTION 3 OF 5
    question: You have a scikit-learn Pipeline([('scaler', StandardScaler()), ('pca',
      PCA(0.95)), ('clf', LogisticRegression())]). What does PCA(0.95) mean?
    qid: q37-3
    options:
    - letter: A
      text: Keep 95% of the original features
      is_correct: false
    - letter: B
      text: Keep enough components to explain 95% of the variance
      is_correct: true
    - letter: C
      text: Reduce to exactly 95 components
      is_correct: false
    - letter: D
      text: Keep features with 95% correlation to the target
      is_correct: false
    correct_fb: ✅ Correct!
    wrong_fb: ❌ Incorrect. Review the material and try again.
  - num_str: QUESTION 4 OF 5
    question: In an end-to-end ML pipeline, what is the purpose of the final step
      before model deployment?
    qid: q37-4
    options:
    - letter: A
      text: Feature engineering — creating new features
      is_correct: false
    - letter: B
