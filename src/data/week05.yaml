  quizzes:
  - num_str: QUESTION 1 OF 5
    question: Why is Stratified K-Fold cross validation preferred over standard K-Fold
      for classification tasks?
    qid: q35-1
    options:
    - letter: A
      text: It is computationally faster
      is_correct: false
    - letter: B
      text: It ensures each fold has the same class distributions as the main target
        variable
      is_correct: true
    - letter: C
      text: It automatically scales features inside the cross-validation loop
      is_correct: false
    - letter: D
      text: It handles continuous targets better
      is_correct: false
    correct_fb: ✅ Correct! If your dataset is imbalanced (e.g. 90% dogs, 10% cats),
      standard K-Fold might create a validation fold containing 100% dogs and 0% cats.
      Stratification guarantees each fold maintains the 90-10 ratio.
    wrong_fb: ❌ Incorrect. Stratification does not speed up calculations. It guarantees
      that the target label ratios are kept identical in each fold, preventing empty
      folds for minority classes.
  - num_str: QUESTION 2 OF 5
    question: How does a pipeline prevent data leakage during cross-validation?
    qid: q35-2
    options:
    - letter: A
      text: It only calls fit() on the training folds and transform() on validation
        folds in each iteration
      is_correct: true
    - letter: B
      text: It encrypts the validation set so the model cannot read it
      is_correct: false
    - letter: C
      text: It automatically drops all features that are highly correlated with the
        target
      is_correct: false
    - letter: D
      text: By using deep copy techniques internally
      is_correct: false
    correct_fb: ✅ Correct! When pipeline is integrated into CV (e.g. via GridSearchCV),
      the StandardScaler fits ONLY on the train folds. It never transforms the validation
      fold until the trained model is evaluated.
    wrong_fb: ❌ Incorrect. A pipeline doesn't encrypt or drop features automatically.
      It operates by fitting preprocessing steps exclusively on training folds, avoiding
      leaks.
