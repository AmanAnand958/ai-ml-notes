  quizzes:
  - num_str: QUESTION 1 OF 5
    question: If your model is suffering from High Variance, which of the following
      techniques will NOT help?
    qid: q34-1
    options:
    - letter: A
      text: Collecting more training data
      is_correct: false
    - letter: B
      text: Adding L2 regularization
      is_correct: false
    - letter: C
      text: Adding more polynomial features to the input data
      is_correct: true
    - letter: D
      text: Dropping non-essential features using feature selection
      is_correct: false
    correct_fb: ✅ Correct! Adding polynomial features increases model complexity and
      capacity, which will increase variance and make overfitting worse. This helps
      with high bias, not high variance.
    wrong_fb: ❌ Incorrect. Regularization, feature selection, and adding training
      data help with high variance. Adding polynomial features increases complexity,
      which actually worsens high variance.
  - num_str: QUESTION 2 OF 5
    question: What defines the "Irreducible Error" in prediction tasks?
    qid: q34-2
    options:
    - letter: A
      text: The error caused by poor hyperparameter selection
      is_correct: false
    - letter: B
      text: The computational error when using 32-bit floats instead of 64-bit
      is_correct: false
    - letter: C
      text: Inherit noise or unmeasured features in data generation itself
      is_correct: true
    - letter: D
      text: The error in the test split ratio
      is_correct: false
    correct_fb: ✅ Correct! Irreducible error represents the fundamental limit of predictability.
      Even a perfect model cannot predict noise or variables that are not captured
      in the feature space.
    wrong_fb: ❌ Incorrect. Irreducible error is independent of the model choice or
      float precision. It is the inherent noise in the system/data generation.
  - num_str: QUESTION 3 OF 5
    question: A 5th-degree polynomial regression fits training data perfectly but
      performs poorly on test data. What is this called?
    qid: q34-3
    options:
    - letter: A
      text: Underfitting — the model is too simple
      is_correct: false
    - letter: B
      text: Overfitting — the model memorized noise instead of signal
      is_correct: true
    - letter: C
      text: High bias — the model has strong assumptions
      is_correct: false
    - letter: D
      text: Data leakage — test data leaked into training
      is_correct: false
    correct_fb: ✅ Correct!
    wrong_fb: ❌ Incorrect. Review the material and try again.
  - num_str: QUESTION 4 OF 5
    question: Which technique directly helps diagnose whether a model suffers from
      high bias or high variance?
    qid: q34-4
    options:
    - letter: A
      text: Confusion matrix
      is_correct: false
    - letter: B
      text: Learning curves (training vs validation error over training size)
      is_correct: true
    - letter: C
      text: ROC-AUC score
      is_correct: false
    - letter: D
      text: Feature importance ranking
      is_correct: false
    correct_fb: ✅ Correct!
    wrong_fb: ❌ Incorrect. Review the material and try again.
  - num_str: QUESTION 5 OF 5
    question: 'If adding more training data does NOT improve validation performance,
      the model likely suffers from:'
    qid: q34-5
    options:
    - letter: A
      text: High variance — more data helps variance, so this suggests high bias
      is_correct: true
    - letter: B
      text: High variance — more data should always help
      is_correct: false
    - letter: C
      text: Data leakage — the training and validation sets overlap
      is_correct: false
    - letter: D
