      fn\">compute_regression_metrics</span>(y_true: np.ndarray, y_pred: np.ndarray) -&gt; dict:\n    errors = y_true - y_pred\n    mse = np.<span class=\"fn\">mean</span>(errors ** <span class=\"num\">2</span>)\n    rmse = np.<span class=\"fn\">sqrt</span>(mse)\n    mae = np.<span class=\"fn\">mean</span>(np.<span class=\"fn\">abs</span>(errors))\n    \n    ss_res = np.<span class=\"fn\">sum</span>(errors ** <span class=\"num\">2</span>)\n    ss_tot = np.<span class=\"fn\">sum</span>((y_true - np.<span class=\"fn\">mean</span>(y_true)) ** <span class=\"num\">2</span>)\n    r2 = <span class=\"num\">1</span> - (ss_res / (ss_tot + <span class=\"num\">1e-10</span>))\n    \n    <span class=\"kw\">return</span> {<span class=\"str\">\"MSE\": round(mse, 4), \"RMSE\": round(rmse, 4), \"MAE\": round(mae, 4), \"R2\"</span>: <span class=\"fn\">round</span>(r2, <span class=\"num\">4</span>)}\n\n<span class=\"cm\"># Verification</span>\ny_t = np.<span class=\"fn\">array</span>([<span class=\"num\">3.0</span>,\
