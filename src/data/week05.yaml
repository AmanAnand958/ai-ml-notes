  quizzes:
  - num_str: QUESTION 1 OF 5
    question: Why does RMSE have an advantage over MSE when communicating results
      to non-technical stakeholders?
    qid: q32-1
    options:
    - letter: A
      text: RMSE is immune to outliers compared to MSE
      is_correct: false
    - letter: B
      text: RMSE is in the same unit as the target variable y, making it directly
        interpretable
      is_correct: true
    - letter: C
      text: RMSE always stays between 0 and 1
      is_correct: false
    - letter: D
      text: RMSE is faster to calculate mathematically
      is_correct: false
    correct_fb: ✅ Correct! Since MSE squares the units (e.g., dollars squared), it's
      hard to visualize. Taking the square root restores the original unit scale (e.g.,
      dollars), allowing direct evaluation (e.g. "our predictions are off by +/- $15,000").
    wrong_fb: ❌ Incorrect. Taking the square root doesn't change the outlier sensitivity.
      It simply changes the scale of units back to the original y scale, making it
      much easier to interpret.
  - num_str: QUESTION 2 OF 5
    question: Can R² score be negative? If yes, what does it imply?
    qid: q32-2
    options:
    - letter: A
      text: No, because residuals are squared, R² is always positive
      is_correct: false
    - letter: B
      text: Yes, it means the model performs worse than a simple horizontal line predicting
        the mean value
      is_correct: true
    - letter: C
      text: Yes, but it only happens if your learning rate in gradient descent is
        too small
      is_correct: false
    - letter: D
      text: Yes, it indicates that the target variable has negative values
      is_correct: false
    correct_fb: ✅ Correct! When the residual sum of squares is larger than the total
      variance around the mean, R² = 1 - (SS_res/SS_tot) becomes negative. This indicates
      that your model is fit terribly.
    wrong_fb: ❌ Incorrect. R² can be negative if your model's predictions are worse
      than the baseline mean predictor, meaning the ratio SS_res/SS_tot is greater
      than 1.
  - num_str: QUESTION 3 OF 5
    question: Why do we split data into separate training and test sets in machine
      learning?
    qid: q32-3
    options:
    - letter: A
      text: To reduce the dimensionality of the dataset
      is_correct: false
    - letter: B
      text: To make training faster by using less data
      is_correct: false
    - letter: C
      text: To evaluate how well the model generalizes to unseen data
      is_correct: true
    - letter: D
      text: To increase the number of features for the model
      is_correct: false
    correct_fb: ✅ Correct! The test set simulates unseen real-world data. A model
      that performs well on training but poorly on test is overfitting — it memorized
      rather than learned.
    wrong_fb: ❌ Incorrect. The primary purpose of a train/test split is to measure
      generalization performance on data the model has never seen during training.
  - num_str: QUESTION 4 OF 5
    question: What does an R² score of exactly 0 mean?
    qid: q32-4
    options:
    - letter: A
      text: The model perfectly predicts every data point
      is_correct: false
    - letter: B
      text: The model performs no better than predicting the mean target value
      is_correct: true
    - letter: C
      text: The model has infinite variance in its predictions
      is_correct: false
    - letter: D
      text: The model predicts all values as negative numbers
      is_correct: false
    correct_fb: ✅ Correct! R² = 0 means SS_res = SS_tot, so your model explains zero
      additional variance beyond the baseline mean predictor. It is no better than
      always guessing the average.
    wrong_fb: ❌ Incorrect. R² = 0 means the model's residuals are equal to the total
      variance around the mean — it adds no predictive value over the naive mean baseline.
  - num_str: QUESTION 5 OF 5
    question: Your model predicts house prices and achieves MSE = 0 on the training
      set but MSE = 850,000 on the test set. What is the most likely issue?
    qid: q32-5
    options:
    - letter: A
      text: The model is overfitting the training data
      is_correct: true
    - letter: B
      text: The model has high bias (underfitting)
      is_correct: false
    - letter: C
      text: The model has too few features to learn from
      is_correct: false
    - letter: D
      text: The test set contains only outlier data points
      is_correct: false
    correct_fb: ✅ Correct! A perfect training score (MSE = 0) paired with a high test
      score is the classic signature of overfitting — the model memorized noise in
      the training data and cannot generalize.
    wrong_fb: ❌ Incorrect. This pattern — near-perfect training performance but poor
      test performance — is textbook overfitting, not underfitting or a data issue.
