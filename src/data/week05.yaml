  quizzes:
  - num_str: QUESTION 1 OF 5
    question: If your classification model has high precision but low recall, what
      behavior do you expect?
    qid: q33-1
    options:
    - letter: A
      text: The model makes many positive predictions, but most are wrong
      is_correct: false
    - letter: B
      text: The model is conservative; it rarely predicts positive, but when it does,
        it's almost always correct
      is_correct: true
    - letter: C
      text: The model is randomly guessing
      is_correct: false
    - letter: D
      text: The model has high false positive counts
      is_correct: false
    correct_fb: ✅ Correct! High precision means few False Positives (conservative,
      precise guesses). Low recall means high False Negatives (misses many actual
      positive cases).
    wrong_fb: ❌ Incorrect. High precision means when it flags something as positive,
      it's correct. Low recall means it missed a lot of positives. So it is conservative.
  - num_str: QUESTION 2 OF 5
    question: What does an ROC-AUC score of 0.5 represent?
    qid: q33-2
    options:
    - letter: A
      text: Performance equivalent to random coin tossing
      is_correct: true
    - letter: B
      text: Perfect classification rate
      is_correct: false
    - letter: C
      text: High precision but low F1-score
      is_correct: false
    - letter: D
      text: That the dataset classes are perfectly balanced
      is_correct: false
    correct_fb: ✅ Correct! AUC of 0.5 represents a model with zero discriminative
      capability. The diagonal line on the ROC curve signifies a random chance baseline.
    wrong_fb: ❌ Incorrect. AUC of 0.5 means the classifier cannot distinguish between
      classes and behaves like random guessing.
