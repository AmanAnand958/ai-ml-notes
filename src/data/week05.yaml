    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 5
    question: A hospital wants to group historical patient records based on medical
      symptom similarities to identify new disease sub-types. What type of ML task
      is this?
    qid: q31-1
    options:
    - letter: A
      text: Supervised Classification
      is_correct: false
    - letter: B
      text: Unsupervised Clustering
      is_correct: true
    - letter: C
      text: Reinforcement Learning
      is_correct: false
    - letter: D
      text: Regression Analysis
      is_correct: false
    correct_fb: ✅ Correct! Because there are no pre-existing labels (no known disease
      sub-types to map to), the model must discover the groups on its own using symptom
      similarity. This is clustering (Unsupervised).
    wrong_fb: ❌ Incorrect. Since we do not have pre-existing labels for the disease
      types, it cannot be supervised. The model needs to discover groups, which is
      Unsupervised Clustering.
  - num_str: QUESTION 2 OF 5
    question: What is the risk of selecting hyperparameters based on the test set
      performance?
    qid: q31-2
    options:
    - letter: A
      text: It will cause high bias in the final predictions
      is_correct: false
    - letter: B
      text: Information leakage (test set leakage) making the final accuracy estimate
        overly optimistic
      is_correct: true
    - letter: C
      text: Underfitting the model on training data
      is_correct: false
    - letter: D
      text: None, this is standard industry practice
      is_correct: false
    correct_fb: ✅ Correct! By tuning parameters to maximize test performance, your
      test set information leaks into model decisions. The test set is no longer "unseen,"
      rendering your final validation metrics biased and unreliable.
    wrong_fb: ❌ Incorrect. Selecting hyperparameters on test data is information leakage.
      The test score will be overly optimistic and will not reflect real-world generalization
      performance.
  - num_str: QUESTION 3 OF 5
    question: In a spam detection system, the model correctly classifies 90% of spam
      but marks 15% of legitimate emails as spam. Which metric suffers most?
    qid: q31-3
    options:
    - letter: A
      text: Recall — it missed 10% of spam
      is_correct: false
    - letter: B
      text: Precision — out of all flagged emails, many are false positives
      is_correct: true
    - letter: C
      text: Accuracy — 90% accuracy means the model is good
      is_correct: false
    - letter: D
      text: F1 Score — it is unaffected by false positives
      is_correct: false
    correct_fb: ✅ Correct! High FP rate (15% legitimate flagged) hurts Precision.
      False Positives directly lower Precision = TP/(TP+FP). Precision is critical
      when the cost of a False Positive is high (like spam filters, where we don't
      want legitimate emails sent to junk).
    wrong_fb: ❌ Incorrect. High FP rate (15% legitimate flagged hurts Precision).
      False Positives directly lower Precision = TP/(TP+FP). Precision is the ratio
      of true positives to total predicted positives.
  - num_str: QUESTION 4 OF 5
    question: What is the key difference between Parametric and Non-Parametric ML
      models?
    qid: q31-4
    options:
    - letter: A
      text: Parametric models make assumptions about data distribution; Non-Parametric
        do not
      is_correct: true
    - letter: B
      text: Parametric models are always more accurate
      is_correct: false
    - letter: C
      text: Non-Parametric models have a fixed number of parameters
      is_correct: false
    - letter: D
      text: Parametric models cannot handle categorical data
      is_correct: false
    correct_fb: ✅ Correct! Parametric models assume a specific functional form (distribution/shape)
      for the data (e.g., Linear Regression assumes a straight line). Non-Parametric
      models make no such distribution assumptions (e.g., KNN makes classification
      decisions purely on local neighborhoods).
    wrong_fb: ❌ Incorrect. Parametric models assume data distribution (e.g. Linear
      Regression assumes linearity). Non-Parametric models don't — KNN makes no distribution
      assumption.
  - num_str: QUESTION 5 OF 5
    question: Your model achieves 95% accuracy on held-out test data. What should
      you check before declaring success?
    qid: q31-5
    options:
    - letter: A
      text: Nothing — 95% accuracy means the project is complete
      is_correct: false
    - letter: B
      text: Class distribution — if 95% of samples are one class, the model may be
        useless
      is_correct: true
    - letter: C
      text: Whether the model has been deployed to production
      is_correct: false
    - letter: D
      text: Whether feature engineering was used
      is_correct: false
    correct_fb: ✅ Correct! Check class distribution. If 95% of data is class 0, a
      model predicting 0 every time scores 95% accuracy while being completely useless
      for the minority class. Check precision, recall, or confusion matrix in such
      imbalanced cases.
    wrong_fb: ❌ Incorrect. Check class distribution. If 95% of data is class 0, a
      model predicting 0 every time scores 95% accuracy while being completely useless
      for the minority class.
  flashcards:
  - front: Mathematical objective function measuring the discrepancy between model
      predictions ŷ and true labels y, optimized via gradient descent.
    back: 'Loss function for binary classification: L = -[y*log(p) + (1-y)*log(1-p)].
      Penalizes confident wrong predictions.'
  - front: Sigmoid Activation?
    back: 'Formula: 1 / (1 + e^-z). Maps any real value to the range (0, 1), representing
      probability output.'
  - front: Odds Ratio?
    back: 'The probability of an event occurring divided by the probability of it
      not occurring: p / (1 - p).'
  - front: Features vs Targets?
    back: Features (X) are the input variables; Targets (y) are the labels we wish
      to predict.
  - front: Train-Test Split?
    back: Partitioning data (e.g., 80/20) to train the model on one subset and evaluate
      it on unseen data.
  gotcha:
    title: '⚠️ Gotcha: Data Leakage in Preprocessing'
    description: Never fit scalers or encoders on the entire dataset. Always fit strictly
      on the training set, then transform test/validation sets.
  takeaways:
    hinglish_line: ''
    bullets:
    - "<strong>\n           ML Paradigm:\n          </strong>\n          We provide\
      \ inputs and outputs; the algorithm outputs the rules."
    - "<strong>\n           Pillars:\n          </strong>\n          Supervised (prediction),\
      \ Unsupervised (structure discovery), Reinforcement (rewards)."
    - "<strong>\n           Train/Test Split:\n          </strong>\n          Never\
      \ evaluate on the same data you trained on. Shuffling must be in unison."
