  hinglish: 💡 Agar target variable skewed hai (jaise incomes ya housing prices), toh RMSE MSE se control hokar outlier se dominate ho jayega. Aise datasets mein mean_absolute_percentage_error (MAPE) ya median_absolute_error dekhna behad zaroori hai.
  analogy: 'Think of it like this: Ghar ki price predict karte waqt, agar aap Rs. 10k off ho, toh normal baat hai. Par agar aap Rs. 10 Lakhs off ho, toh bohot bada failure hai. MSE is failure ko bohot heavy fine karta hai (squaring the 10 Lakhs error), jabki MAE simple proportion mein penalty lagata hai. (This mirrors how Evaluation fundamentally operates.)'
  theory_html: |-
    <h3 class="sh3">
           1. Mean Absolute Error (MAE) vs Mean Squared Error (MSE)
          </h3>
    <p>
           MAE calculates the average magnitude of absolute errors. MSE squares the errors before averaging them. Because of the squaring operation, MSE penalizes large errors disproportionately more than small errors.
          </p>

    <div class="math-block">
    <span class="formula">
            $$\text{MAE} = \frac{1}{n} \sum_{i=1}^n |y_i - \hat{y}_i|$$
           </span>
    <span class="desc">
            L1 Loss. Robust to outliers, but gradient is constant (not smooth at zero).
           </span>
    <span class="formula">
            $$\text{MSE} = \frac{1}{n} \sum_{i=1}^n (y_i - \hat{y}_i)^2$$
           </span>
    <span class="desc">
            L2 Loss. Penalizes larger errors heavily, smooth gradient, easy to differentiate.
           </span>
    <span class="formula">
            $$\text{RMSE} = \sqrt{\text{MSE}}$$
           </span>
    <span class="desc">
            Root Mean Squared Error. Converts units back to original y scale.
           </span>
    </div>
    <h3 class="sh3">
           2. Coefficient of Determination (R² Score)
          </h3>
    <p>
           R² compares your model's predictions to a baseline model that always predicts the mean of target variables (ŷ = mean(y)). It represents the proportion of variance in the dependent variable that is predictable from the independent variables.
          </p>
    <div class="math-block">
    <span class="formula">
            $$R^2 = 1 - \frac{SS_{\text{res}}}{SS_{\text{tot}}}$$
           </span>
    <span class="desc">
            Where $SS_{\text{res}} = \sum(y_i - \hat{y}_i)^2$ [sum of squared residuals], and $SS_{\text{tot}} = \sum(y_i - \bar{y})^2$ [total sum of squares]
           </span>
    </div>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — regression_metrics.py
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">from</span> sklearn.metrics <span class="kw">import</span> mean_squared_error, mean_absolute_error, r2_score

    <span class="cm"># Simulated ground truth and model predictions</span>
    y_true = np.<span class="fn">array</span>([<span class="num">100.0</span>, <span class="num">150.0</span>, <span class="num">200.0</span>, <span class="num">250.0</span>, <span class="num">500.0</span>])  <span class="cm"># Notice the outlier: 500</span>
    y_pred = np.<span class="fn">array</span>([<span class="num">90.0</span>, <span class="num">160.0</span>, <span class="num">210.0</span>, <span class="num">240.0</span>, <span class="num">350.0</span>])   <span class="cm"># Outlier prediction off by 150</span>

    <span class="cm"># Math calculations from scratch</span>
    mae_scratch = np.<span class="fn">mean</span>(np.<span class="fn">abs</span>(y_true - y_pred))
    mse_scratch = np.<span class="fn">mean</span>((y_true - y_pred)**<span class="num">2</span>)
    rmse_scratch = np.<span class="fn">sqrt</span>(mse_scratch)

    y_mean = np.<span class="fn">mean</span>(y_true)
    ss_res = np.<span class="fn">sum</span>((y_true - y_pred)**<span class="num">2</span>)
    ss_tot = np.<span class="fn">sum</span>((y_true - y_mean)**<span class="num">2</span>)
    r2_scratch = <span class="num">1.0</span> - (ss_res / ss_tot)

    <span class="fn">print</span>(<span class="str">"Scratch Results:"</span>)
    <span class="fn">print</span>(<span class="str">f"  MAE : {mae_scratch:.2f}, MSE : {mse_scratch:.2f}, RMSE: {rmse_scratch:.2f}, R2: {r2_scratch:.4f}"</span>)

    <span class="cm"># Verify with sklearn</span>
    <span class="fn">print</span>(<span class="str">f"\nSklearn Results:"</span>)
    <span class="fn">print</span>(<span class="str">f"  MAE : {mean_absolute_error(y_true, y_pred):.2f}"</span>)
    <span class="fn">print</span>(<span class="str">f"  MSE : {mean_squared_error(y_true, y_pred):.2f}"</span>)
    <span class="fn">print</span>(<span class="str">f"  R2  : {r2_score(y_true, y_pred):.4f}"</span>)</code></pre>
    </div>
