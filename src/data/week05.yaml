  theory_html: |2-

    <div class="diagram-container" style="background:var(--bg3); padding:1rem; border-radius:8px; margin:1rem 0; border:1px solid var(--border);">
    <p><strong>KNN Voronoi Space vs Naive Bayes Decision Probability:</strong></p>
    <div class="mermaid">
    graph LR
        subgraph KNN_Spatial["KNN Spatial Metric"]
            Q["Query Point x"] --> D1["Euclidean Distance: d(x, x_i)"]
            D1 --> K_sort["Sort & Pick K-Nearest Neighbors"]
            K_sort --> Maj["Majority Vote / Weighted Average"]
        end
        subgraph NB_Prob["Naive Bayes Probability"]
            X_feat["Features: x1, x2, ..., xn"] --> Cond["Conditional Independence: P(x|C) = prod P(x_i|C)"]
            Cond --> Bayes["Bayes Theorem: P(C|x) propto P(C) * P(x|C)"]
            Bayes --> Argmax["arg max_C P(C|x)"]
        end
    </div>
    </div>
    <h3 class="sh3">
           1. K-Nearest Neighbors (KNN) Classifier
          </h3>
    <p>
           KNN classifies a new data point based on the majority vote of its $k$ closest neighbors in the feature space. It is a lazy learner (no training phase; it stores the dataset in memory and does all calculations during prediction).
          </p>

    <div class="math-block">
    <span class="formula">
            $$\text{Euclidean Distance} = \sqrt{ \sum_{i=1}^n (x_i - y_i)^2 }$$
           </span>
    <span class="desc">
            Straight-line distance. Sensitive to variable scales (requires normalization!).
           </span>
    <span class="formula">
            $$\text{Manhattan Distance} = \sum_{i=1}^n |x_i - y_i|$$
           </span>
    <span class="desc">
            Grid-like taxi cab distance. Useful in high dimensional spaces.
           </span>
    </div>
    <h3 class="sh3">
           2. Naive Bayes Classifier
          </h3>
    <p>
           Naive Bayes uses probability formulas derived from Bayes' Theorem to classify instances. It calculates the conditional probability of each class given the input features, choosing the class with highest probability.
          </p>
    <div class="math-block">
    <span class="formula">
            $$P(C | X) = \frac{P(X | C) \times P(C)}{P(X)}$$
           </span>
    <span class="desc">
            Where C is class, X is features vector [x₁, x₂, ..., xₙ].
           </span>
    </div>
    <p>
           Why is it called
           <strong>
            "Naive"
           </strong>
           ? Because it assumes all input features are independent of each other given the class label. Even though this is almost never true in real life, the classifier performs surprisingly well on text classification (spam detection, sentiment analysis).
          </p>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — knn_naivebayes.py
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">from</span> sklearn.datasets <span class="kw">import</span> load_breast_cancer
    <span class="kw">from</span> sklearn.model_selection <span class="kw">import</span> train_test_split
    <span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span> StandardScaler
    <span class="kw">from</span> sklearn.neighbors <span class="kw">import</span> KNeighborsClassifier
    <span class="kw">from</span> sklearn.naive_bayes <span class="kw">import</span> GaussianNB
    <span class="kw">from</span> sklearn.metrics <span class="kw">import</span> classification_report

    <span class="cm"># Load breast cancer dataset</span>
    data = <span class="fn">load_breast_cancer</span>()
    X, y = data.data, data.target
    X_train, X_test, y_train, y_test = <span class="fn">train_test_split</span>(X, y, test_size=<span class="num">0.2</span>, random_state=<span class="num">42</span>)

    <span class="cm"># Scale features (mandatory for KNN distance metrics)</span>
    sc = <span class="fn">StandardScaler</span>()
    X_tr = sc.<span class="fn">fit_transform</span>(X_train)
    X_te = sc.<span class="fn">transform</span>(X_test)

    <span class="cm"># Fit KNN</span>
    knn = <span class="fn">KNeighborsClassifier</span>(n_neighbors=<span class="num">5</span>)
    <span class="cm"># knn.fit(X_tr, y_train)</span>

    <span class="cm"># Fit Naive Bayes</span>
    nb = <span class="fn">GaussianNB</span>()
    <span class="cm"># nb.fit(X_tr, y_train)</span>

    <span class="fn">print</span>(<span class="str">"KNN Classification Report:"</span>)
    <span class="fn">print</span>(<span class="fn">classification_report</span>(y_test, knn.<span class="fn">predict</span>(X_te)))

    <span class="fn">print</span>(<span class="str">f"\nNaive Bayes Classification Report:"</span>)
    <span class="fn">print</span>(<span class="fn">classification_report</span>(y_test, nb.<span class="fn">predict</span>(X_te)))</code></pre>
    </div>
    <div class="hinglish">
