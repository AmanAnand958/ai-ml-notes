  subtitle: 'Aaj hum do classical machine learning classifiers ko study karenge jo intuitive hain, par inka math behad powerful hai: K-Nearest Neighbors (KNN) — jo feature space similarity par base hai, aur Naive Bayes — jo probability aur conditional independence assumption par deploy hota hai.'
