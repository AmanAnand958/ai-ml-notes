                  Build a fully operational production pipeline on simulated churn data (containing Age, Salary, Country categorical values, and some NaN inputs). Define ColumnTransformer for scaling numerical and One-Hot Encoding categorical features. Add KNN classifier. Tune parameters using GridSearchCV. Save the model as a joblib file. Write a mock inference script
