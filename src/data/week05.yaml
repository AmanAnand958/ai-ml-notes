- id: '32'
  day_num: 32
  title: Evaluation Metrics — Regression
  subtitle: 'Model train karne ke baad sabse bada question hota hai: "Mera model kitna
    achha hai?" Aaj hum regression tasks ke evaluation metrics ko deeply samjhenge
    — MAE, MSE, RMSE, aur R² score — inke math, derivatives, aur behavior on outliers.'
  time_estimate: 4 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Calculate MAE, MSE, RMSE, and R² from scratch using pure NumPy
  - Explain the exact visual and mathematical difference between L1 (MAE) and L2 (MSE)
    errors
  - Explain why R² score can sometimes be negative and what that indicates
  - Select the best metric when dealing with datasets that contain heavy outliers
  checklist:
  - id: chk_32_1
    text: Study the core mathematical and architectural principles of Evaluation Metrics
      — Regression
  - id: chk_32_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_32_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_32_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow: &id001
  - Data Ingestion
  - Train/Test Split
  - Baseline Model
  - Evaluation Metrics
  - Error Analysis
  - Iterative Tuning
  - Production Thresholding
  hinglish: 💡 Agar target variable skewed hai (jaise incomes ya housing prices), toh
    RMSE MSE se control hokar outlier se dominate ho jayega. Aise datasets mein mean_absolute_percentage_error
    (MAPE) ya median_absolute_error dekhna behad zaroori hai.
  analogy: Ghar ki price predict karte waqt, agar aap Rs. 10k off ho, toh normal baat
    hai. Par agar aap Rs. 10 Lakhs off ho, toh bohot bada failure hai. MSE is failure
    ko bohot heavy fine karta hai (squaring the 10 Lakhs error), jabki MAE simple
    proportion mein penalty lagata hai.
  theory_html: "<h3 class=\"sh3\">\n       1. Mean Absolute Error (MAE) vs Mean Squared\
    \ Error (MSE)\n      </h3>\n<p>\n       MAE calculates the average magnitude of\
    \ absolute errors. MSE squares the errors before averaging them. Because of the\
    \ squaring operation, MSE penalizes large errors disproportionately more than\
    \ small errors.\n      </p>\n\n<div class=\"math-block\">\n<span class=\"formula\"\
    >\n        $$\\text{MAE} = \\frac{1}{n} \\sum_{i=1}^n |y_i - \\hat{y}_i|$$\n \
    \      </span>\n<span class=\"desc\">\n        L1 Loss. Robust to outliers, but\
    \ gradient is constant (not smooth at zero).\n       </span>\n<span class=\"formula\"\
    >\n        $$\\text{MSE} = \\frac{1}{n} \\sum_{i=1}^n (y_i - \\hat{y}_i)^2$$\n\
    \       </span>\n<span class=\"desc\">\n        L2 Loss. Penalizes larger errors\
    \ heavily, smooth gradient, easy to differentiate.\n       </span>\n<span class=\"\
    formula\">\n        $$\\text{RMSE} = \\sqrt{\\text{MSE}$$\n       </span>\n<span\
    \ class=\"desc\">\n        Root Mean Squared Error. Converts units back to original\
    \ y scale.\n       </span>\n</div>\n<h3 class=\"sh3\">\n       2. Coefficient\
    \ of Determination (R² Score)\n      </h3>\n<p>\n       R² compares your model's\
    \ predictions to a baseline model that always predicts the mean of target variables\
    \ (ŷ = mean(y)). It represents the proportion of variance in the dependent variable\
    \ that is predictable from the independent variables.\n      </p>\n<div class=\"\
    math-block\">\n<span class=\"formula\">\n        $$R^2 = 1 - \\frac{SS_{\\text{res}}{SS_{\\\
    text{tot}}$$\n       </span>\n<span class=\"desc\">\n        Where $SS_{\\text{res}\
    \ = \\sum(y_i - \\hat{y}_i)^2$ [sum of squared residuals], and $SS_{\\text{tot}\
    \ = \\sum(y_i - \\bar{y})^2$ [total sum of squares]\n       </span>\n</div>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — regression_metrics.py\n        </span>\n<div class=\"cb-btns\">\n\
    <button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n     \
    \    </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left:\
    \ 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"\
    kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">from</span>\
    \ sklearn.metrics <span class=\"kw\">import</span> mean_squared_error, mean_absolute_error,\
    \ r2_score\n\n<span class=\"cm\"># Simulated ground truth and model predictions</span>\n\
    y_true = np.<span class=\"fn\">array</span>([<span class=\"num\">100.0</span>,\
    \ <span class=\"num\">150.0</span>, <span class=\"num\">200.0</span>, <span class=\"\
    num\">250.0</span>, <span class=\"num\">500.0</span>])  <span class=\"cm\"># Notice\
    \ the outlier: 500</span>\ny_pred = np.<span class=\"fn\">array</span>([<span\
    \ class=\"num\">90.0</span>, <span class=\"num\">160.0</span>, <span class=\"\
    num\">210.0</span>, <span class=\"num\">240.0</span>, <span class=\"num\">350.0</span>])\
    \   <span class=\"cm\"># Outlier prediction off by 150</span>\n\n<span class=\"\
    cm\"># Math calculations from scratch</span>\nmae_scratch = np.<span class=\"\
    fn\">mean</span>(np.<span class=\"fn\">abs</span>(y_true - y_pred))\nmse_scratch\
    \ = np.<span class=\"fn\">mean</span>((y_true - y_pred)**<span class=\"num\">2</span>)\n\
    rmse_scratch = np.<span class=\"fn\">sqrt</span>(mse_scratch)\n\ny_mean = np.<span\
    \ class=\"fn\">mean</span>(y_true)\nss_res = np.<span class=\"fn\">sum</span>((y_true\
    \ - y_pred)**<span class=\"num\">2</span>)\nss_tot = np.<span class=\"fn\">sum</span>((y_true\
    \ - y_mean)**<span class=\"num\">2</span>)\nr2_scratch = <span class=\"num\">1.0</span>\
    \ - (ss_res / ss_tot)\n\n<span class=\"fn\">print</span>(<span class=\"str\">\"\
    Scratch Results:\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"  MAE : {mae_scratch:.2f}, MSE : {mse_scratch:.2f}, RMSE: {rmse_scratch:.2f},\
    \ R2: {r2_scratch:.4f}\"</span>)\n\n<span class=\"cm\"># Verify with sklearn</span>\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"\\nSklearn Results:\"</span>)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"  MAE : {mean_absolute_error(y_true,\
    \ y_pred):.2f}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"  MSE : {mean_squared_error(y_true, y_pred):.2f}\"</span>)\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"  R2  : {r2_score(y_true, y_pred):.4f}\"\
    </span>)</pre>\n</div>\n<div class=\"hinglish\">\n       \U0001F4A1 Agar target\
    \ variable skewed hai (jaise incomes ya housing prices), toh RMSE MSE se control\
    \ hokar outlier se dominate ho jayega. Aise datasets mein mean_absolute_percentage_error\
    \ (MAPE) ya median_absolute_error dekhna behad zaroori hai.\n      </div>\n<h2\
    \ class=\"sh2\">\n       \U0001F52E Predict the Output\n      </h2>\n<!-- /day-32-theory\
    \ -->\n<!-- /day-32-quiz-section -->\n<!-- /day-32-tasks-section -->\n<!-- /day-32-resources-section\
    \ -->"
