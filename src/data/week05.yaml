  theory_html: |-
    <h3 class="sh3">
           1. Traditional Programming vs Machine Learning
          </h3>
    <p>
           Traditional programming mein hum
           <strong>
            Rules
           </strong>
           aur
           <strong>
            Data
           </strong>
           dete hain, aur computer humein
           <strong>
            Answers
           </strong>
           deta hai. Machine Learning mein hum computer ko
           <strong>
            Data
           </strong>
           aur
           <strong>
            Answers (labels)
           </strong>
           dete hain, aur computer humein
           <strong>
            Rules (patterns)
           </strong>
           seekh kar deta hai.
          </p>

    <h3 class="sh3">
           2. The Three ML Pillars
          </h3>
    <div class="table-wrap" style="overflow-x: auto; margin: 1.2rem 0; width: 100%;"><table class="concept-table">
    <tr>
    <th>
             Pillar
            </th>
    <th>
             Core Concept
            </th>
    <th>
             Example Scenario
            </th>
    <th>
             Key Algorithms
            </th>
    </tr>
    <tr>
    <td>
    <strong>
              Supervised Learning
             </strong>
    </td>
    <td>
             Model learns from labeled data (inputs mapped to correct outputs).
            </td>
    <td>
             Predicting house prices or classifying emails as spam.
            </td>
    <td>
             Linear Regression, Decision Trees, SVM
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              Unsupervised Learning
             </strong>
    </td>
    <td>
             Model finds hidden patterns in unlabeled data.
            </td>
    <td>
             Grouping e-commerce customers based on buying behavior.
            </td>
    <td>
             K-Means, PCA, Hierarchical Clustering
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              Reinforcement Learning
             </strong>
    </td>
    <td>
             Model learns by interacting with environment to maximize rewards.
            </td>
    <td>
             Self-driving cars learning to navigate, chess-playing bots.
            </td>
    <td>
             Q-Learning, Deep Q-Networks (DQN)
            </td>
    </tr>
    </table></div>
    <h3 class="sh3">
           3. The Machine Learning Workflow
          </h3>
    <div class="mermaid">
    graph LR
      Raw["Raw Data"] --> Prep["Preprocessing"] --> Feat["Feature Eng"] --> Train["Model Training and Tuning"] --> Eval["Final Evaluation"] --> Deploy["Deploy / Monitor"]
      Deploy -->|Feedback Loop| Raw
    </div>
    <div class="diagram-cap">
           The iterative cycle of building and deploying ML models.
          </div>
    <h3 class="sh3">
           4. Train-Test Split: Why and How
          </h3>
    <p>
           Agar aap kisi student ka test usi questions se loge jo class mein solve karwaye the, toh ho sakta hai usne concepts samjhe na ho, sirf answers ratta maar liye ho. Generalization check karne ke liye, humesha test un-seen questions (test set) par hona chahiye.
          </p>
    <div class="math-block">
    <span class="formula">
            $$\text{Dataset} = \text{Train Set (80\%)} + \text{Test Set (20\%)}$$
           </span>
    <span class="desc">
            Train set is used to learn weights. Test set is strictly reserved for final evaluation.
           </span>
    </div>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — first_ml_model.py
            </span>
    <div class="cb-btns">
    <button class="run-btn" onclick="openRepl()">
              ▶ try online
             </button>
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">from</span> sklearn.datasets <span class="kw">import</span> fetch_california_housing
    <span class="kw">from</span> sklearn.model_selection <span class="kw">import</span> train_test_split
    <span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> LinearRegression

    <span class="cm"># 1. Ingest Data</span>
    california = <span class="fn">fetch_california_housing</span>()
    X, y = california.data, california.target

    <span class="cm"># 2. Split into Train &amp; Test sets (80-20 split)</span>
    X_train, X_test, y_train, y_test = <span class="fn">train_test_split</span>(
        X, y, test_size=<span class="num">0.2</span>, random_state=<span class="num">42</span>)
    <span class="cm"># )</span>

    <span class="fn">print</span>(<span class="str">f"Training Samples: {X_train.shape[0]}"</span>)
    <span class="fn">print</span>(<span class="str">f"Testing Samples: {X_test.shape[0]}"</span>)

    <span class="cm"># 3. Train a basic model</span>
    model = <span class="fn">LinearRegression</span>()
    <span class="cm"># model.fit(X_train, y_train)</span>

    <span class="cm"># 4. Predict on test set</span>
    y_pred = model.<span class="fn">predict</span>(X_test)
    <span class="fn">print</span>(<span class="str">f"First 3 predictions: {y_pred[:3]}"</span>)
    <span class="fn">print</span>(<span class="str">f"First 3 actual target values: {y_test[:3]}"</span>)</code></pre>
    </div>
    <div class="hinglish">
           💡 Hamesha yaad rakho: model fit karte waqt test set ka koi role nahi hona chahiye. Test data leakage is the most common mistake beginners make.
          </div>
    <h2 class="sh2">
           🔮 Predict the Output
          </h2>
    <!-- /day-31-theory -->
    <!-- /day-31-quiz-section -->
    <!-- /day-31-tasks-section -->
    <!-- /day-31-resources-section -->
    <div class="callout" style="background:rgba(79,209,165,.05); border:1px solid var(--green); padding:1.2rem; border-radius:8px; margin:1.5rem 0;">
    <h3>>
           🔍 Unsupervised Learning: K-Means, Silhouette Score &amp; DBSCAN Density Clustering
          </h3>
    <p>
           Unlike Supervised Learning,
           <strong>
            Unsupervised Learning
           </strong>
           discovers hidden patterns in unlabelled data $X$:
          </p>
    <ul>
    <li>
    <strong>
             K-Means Clustering:
            </strong>
            Minimizes Within-Cluster Sum of Squares (WCSS inertia) by iteratively updating $K$ cluster centroids.
           </li>
    <li>
    <strong>
             Silhouette Score $s(i)$:
            </strong>
            Measures cluster separation vs cohesion (range $-1$ to $+1$).
           </li>
    <li>
    <strong>
             DBSCAN:
            </strong>
            Density-based spatial clustering that groups dense regions and detects noise/outliers without pre-specifying $K$.
           </li>
    </ul>
    </div><div class="callout" style="background:rgba(167,139,250,.05); border:1px solid var(--purple); padding:1.2rem; border-radius:8px; margin:1.5rem 0;">
    <h3>>
           🎮 Reinforcement Learning Foundations: Q-Learning &amp; Bellman Equation
          </h3>
    <p>
           In
           <strong>
            Reinforcement Learning (RL)
           </strong>
           , an Agent interacts with an Environment to maximize cumulative reward:
          </p>
    <ul>
    <li>
    <strong>
             Bellman Optimality Equation:
            </strong>
            $Q^*(s,a) = \mathbb{E}[R_{t+1} + \gamma \max_{a'} Q^*(S_{t+1}, a') | S_t=s, A_t=a]$.
           </li>
    <li>
    <strong>
             Q-Learning Update Rule:
            </strong>
            $Q(s,a) \leftarrow Q(s,a) + \alpha [r + \gamma \max_{a'} Q(s',a') - Q(s,a)]$.
           </li>
    <li>
    <strong>
             Deep Q-Networks (DQN):
            </strong>
            Approximates $Q(s,a)$ using a Deep Neural Network with Experience Replay.
           </li>
    </ul>
    </div>
