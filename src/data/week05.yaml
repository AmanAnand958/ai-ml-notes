    badge: 🟢 EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n          Implement a manual grid search function using nested\
      \ Python loops. Test combinations of hyperparameters for a KNeighborsClassifier\
      \ (n_neighbors in [3,5,7], weights in ['uniform', 'distance']). Run a manual\
      \ 3-fold cross validation for each combination. Print the mean validation accuracy\
      \ for each grid point and verify that it matches scikit-learn's\n          \n\
      \           GridSearchCV\n          \n          result.\n         </p>\n\n\n\
      <div class=\"cb\" style=\"margin-top: 1rem;\">\n<div class=\"cb-head\">\n<span\
      \ class=\"cb-lang\">python</span>\n<div class=\"cb-btns\">\n<button class=\"\
      copy-btn\" onclick=\"copyCode(this)\">copy</button>\n<button class=\"run-btn\"\
      \ onclick=\"runCode(this)\">Run</button>\n<button class=\"run-btn\" onclick=\"\
      openInColab(this)\">⚡ Run on Colab</button>\n</div>\n</div>\n<pre><span class=\"\
      cm\"># Validated Reference Implementation</span>\n<span class=\"kw\">import</span>\
