  hinglish: '💡 Hamesha yaad rakho: model fit karte waqt test set ka koi role nahi
    hona chahiye. Test data leakage is the most common mistake beginners make.'
  analogy: Traditional approach matlab mummy ne recipe book de di (Rules) aur ingredients
    (Data) de diye, aapne khana bana diya (Answers). ML approach matlab mummy ne aapko
    10 alag-alag paneer tikka dishes khilaye (Data + Answers) aur aapne khud recipe
    (Rules) figure out kar li.
  theory_html: "<h3 class=\"sh3\">\n       1. Traditional Programming vs Machine Learning\n\
    \      </h3>\n<p>\n       Traditional programming mein hum\n       <strong>\n\
    \        Rules\n       </strong>\n       aur\n       <strong>\n        Data\n\
    \       </strong>\n       dete hain, aur computer humein\n       <strong>\n  \
    \      Answers\n       </strong>\n       deta hai. Machine Learning mein hum computer\
    \ ko\n       <strong>\n        Data\n       </strong>\n       aur\n       <strong>\n\
    \        Answers (labels)\n       </strong>\n       dete hain, aur computer humein\n\
    \       <strong>\n        Rules (patterns)\n       </strong>\n       seekh kar\
    \ deta hai.\n      </p>\n\n<h3 class=\"sh3\">\n       2. The Three ML Pillars\n\
    \      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem\
    \ 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Pillar\n\
    \        </th>\n<th>\n         Core Concept\n        </th>\n<th>\n         Example\
    \ Scenario\n        </th>\n<th>\n         Key Algorithms\n        </th>\n</tr>\n\
    <tr>\n<td>\n<strong>\n          Supervised Learning\n         </strong>\n</td>\n\
    <td>\n         Model learns from labeled data (inputs mapped to correct outputs).\n\
    \        </td>\n<td>\n         Predicting house prices or classifying emails as\
    \ spam.\n        </td>\n<td>\n         Linear Regression, Decision Trees, SVM\n\
    \        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          Unsupervised Learning\n\
    \         </strong>\n</td>\n<td>\n         Model finds hidden patterns in unlabeled\
    \ data.\n        </td>\n<td>\n         Grouping e-commerce customers based on\
    \ buying behavior.\n        </td>\n<td>\n         K-Means, PCA, Hierarchical Clustering\n\
    \        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          Reinforcement Learning\n\
    \         </strong>\n</td>\n<td>\n         Model learns by interacting with environment\
    \ to maximize rewards.\n        </td>\n<td>\n         Self-driving cars learning\
    \ to navigate, chess-playing bots.\n        </td>\n<td>\n         Q-Learning,\
    \ Deep Q-Networks (DQN)\n        </td>\n</tr>\n</table></div>\n<h3 class=\"sh3\"\
    >\n       3. The Machine Learning Workflow\n      </h3>\n<div class=\"mermaid\"\
    >\ngraph LR\n  Raw[\"Raw Data\"] --&gt; Prep[\"Preprocessing\"] --&gt; Feat[\"\
    Feature Eng\"] --&gt; Train[\"Model Training &amp; Tuning\"] --&gt; Eval[\"Final\
    \ Evaluation\"] --&gt; Deploy[\"Deploy / Monitor\"]\n  Deploy --&gt;|Feedback\
    \ Loop| Raw\n</div>\n<div class=\"diagram-cap\">\n       The iterative cycle of\
    \ building and deploying ML models.\n      </div>\n<h3 class=\"sh3\">\n      \
    \ 4. Train-Test Split: Why and How\n      </h3>\n<p>\n       Agar aap kisi student\
    \ ka test usi questions se loge jo class mein solve karwaye the, toh ho sakta\
    \ hai usne concepts samjhe na ho, sirf answers ratta maar liye ho. Generalization\
    \ check karne ke liye, humesha test un-seen questions (test set) par hona chahiye.\n\
    \      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$\\\
    text{Dataset} = \\text{Train Set (80\\%)} + \\text{Test Set (20\\%)}$$\n     \
    \  </span>\n<span class=\"desc\">\n        Train set is used to learn weights.\
    \ Test set is strictly reserved for final evaluation.\n       </span>\n</div>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — first_ml_model.py\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"run-btn\" onclick=\"openRepl()\">\n          ▶ try online\n        \
    \ </button>\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n        \
    \  copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">from</span> sklearn.datasets <span class=\"kw\">import</span>\
    \ fetch_california_housing\n<span class=\"kw\">from</span> sklearn.model_selection\
    \ <span class=\"kw\">import</span> train_test_split\n<span class=\"kw\">from</span>\
    \ sklearn.linear_model <span class=\"kw\">import</span> LinearRegression\n\n<span\
    \ class=\"cm\"># 1. Ingest Data</span>\ncalifornia = <span class=\"fn\">fetch_california_housing</span>()\n\
    X, y = california.data, california.target\n\n<span class=\"cm\"># 2. Split into\
    \ Train &amp; Test sets (80-20 split)</span>\nX_train, X_test, y_train, y_test\
    \ = <span class=\"fn\">train_test_split</span>(\n    X, y, test_size=<span class=\"\
    num\">0.2</span>, random_state=<span class=\"num\">42</span>)\n<span class=\"\
    cm\"># )</span>\n\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Training\
    \ Samples: {X_train.shape[0]}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Testing Samples: {X_test.shape[0]}\"</span>)\n\n<span class=\"\
    cm\"># 3. Train a basic model</span>\nmodel = <span class=\"fn\">LinearRegression</span>()\n\
    <span class=\"cm\"># model.fit(X_train, y_train)</span>\n\n<span class=\"cm\"\
    ># 4. Predict on test set</span>\ny_pred = model.<span class=\"fn\">predict</span>(X_test)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"First 3 predictions: {y_pred[:3]}\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"First 3 actual\
    \ target values: {y_test[:3]}\"</span>)</pre>\n</div>\n<div class=\"hinglish\"\
    >\n       \U0001F4A1 Hamesha yaad rakho: model fit karte waqt test set ka koi\
    \ role nahi hona chahiye. Test data leakage is the most common mistake beginners\
    \ make.\n      </div>\n<h2 class=\"sh2\">\n       \U0001F52E Predict the Output\n\
    \      </h2>\n<!-- /day-31-theory -->\n<!-- /day-31-quiz-section -->\n<!-- /day-31-tasks-section\
    \ -->\n<!-- /day-31-resources-section -->\n<div class=\"callout\" style=\"background:rgba(79,209,165,.05);\
    \ border:1px solid var(--green); padding:1.2rem; border-radius:8px; margin:1.5rem\
    \ 0;\">\n<h3>\n       \U0001F50D Unsupervised Learning: K-Means, Silhouette Score\
    \ &amp; DBSCAN Density Clustering\n      </h3>\n<p>\n       Unlike Supervised\
    \ Learning,\n       <strong>\n        Unsupervised Learning\n       </strong>\n\
    \       discovers hidden patterns in unlabelled data $X$:\n      </p>\n<ul>\n\
    <li>\n<strong>\n         K-Means Clustering:\n        </strong>\n        Minimizes\
    \ Within-Cluster Sum of Squares (WCSS inertia) by iteratively updating $K$ cluster\
    \ centroids.\n       </li>\n<li>\n<strong>\n         Silhouette Score $s(i)$:\n\
    \        </strong>\n        Measures cluster separation vs cohesion (range $-1$\
    \ to $+1$).\n       </li>\n<li>\n<strong>\n         DBSCAN:\n        </strong>\n\
    \        Density-based spatial clustering that groups dense regions and detects\
    \ noise/outliers without pre-specifying $K$.\n       </li>\n</ul>\n</div><div\
    \ class=\"callout\" style=\"background:rgba(167,139,250,.05); border:1px solid\
    \ var(--purple); padding:1.2rem; border-radius:8px; margin:1.5rem 0;\">\n<h3>\n\
    \       \U0001F3AE Reinforcement Learning Foundations: Q-Learning &amp; Bellman\
    \ Equation\n      </h3>\n<p>\n       In\n       <strong>\n        Reinforcement\
    \ Learning (RL)\n       </strong>\n       , an Agent interacts with an Environment\
    \ to maximize cumulative reward:\n      </p>\n<ul>\n<li>\n<strong>\n         Bellman\
    \ Optimality Equation:\n        </strong>\n        $Q^*(s,a) = \\mathbb{E}[R_{t+1}\
    \ + \\gamma \\max_{a'} Q^*(S_{t+1}, a') | S_t=s, A_t=a]$.\n       </li>\n<li>\n\
    <strong>\n         Q-Learning Update Rule:\n        </strong>\n        $Q(s,a)\
    \ \\leftarrow Q(s,a) + \\alpha [r + \\gamma \\max_{a'} Q(s',a') - Q(s,a)]$.\n\
    \       </li>\n<li>\n<strong>\n         Deep Q-Networks (DQN):\n        </strong>\n\
    \        Approximates $Q(s,a)$ using a Deep Neural Network with Experience Replay.\n\
    \       </li>\n</ul>\n</div>"
