  analogy: Hyperparameter tuning is like tuning a musical instrument (guitar). You adjust the tuning pegs (hyperparameters) before playing until the sound (output validation score) is perfect.
  theory_html: |-
    <h3 class="sh3">
           1. Parameters vs Hyperparameters
          </h3>
    <p>
    <strong>
            Parameters:
           </strong>
           Internal variables learned by the model during training (e.g. weights $w$ and bias $b$ in regression, node splits in Decision Trees).
          </p>
    <p>
    <strong>
            Hyperparameters:
           </strong>
           External configurations specified by the developer before training starts (e.g. learning rate, number of neighbors $k$ in KNN, max depth of a Decision Tree).
          </p>
    <h3 class="sh3">
           2. Cross-Validation (K-Fold vs Stratified K-Fold)
          </h3>
    <p>
           Simple train/test split has high variance depending on where the split occurred. K-Fold splits the dataset into $K$ blocks, training on $K-1$ and validating on the remaining block, repeating $K$ times. Stratified K-Fold ensures each fold maintains the same percentage of target class labels as the complete dataset.
          </p>
