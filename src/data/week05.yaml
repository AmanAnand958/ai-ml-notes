  hinglish: Classification models evaluate karte waqt sirf Accuracy kafi nahi hoti agar data imbalanced ho. Precision aur Recall ka harmonic mean (F1-score) real performance dikhata hai.
  analogy: '🏥 Malaria Detection (High Recall): Positive test means treatment. A false negative (missing malaria) can kill a patient. We want Recall near 100%, even if precision drops slightly. 🛡️ Fraud Alert (High Precision): If a bank blocks a UPI card on every false alarm, customer experience will be terrible. We want to be absolutely sure when marking a transaction as fraud (minimizing false positives/FP), so we prioritize High Precision. (This mirrors how Evaluation fundamentally operates.)'
  theory_html: |-
    <h3 class="sh3">
           1. The Confusion Matrix
          </h3>
    <p>
           Confusion Matrix is a tabular representation of the model's classification performance, comparing actual values with predicted values.
          </p>
    <div class="mermaid">
    graph TD
    subgraph "Actual Positive"
      P_TP["Predicted Positive: TP"]
      P_FN["Predicted Negative: FN"]
    end
    subgraph "Actual Negative"
      P_FP["Predicted Positive: FP"]
      P_TN["Predicted Negative: TN"]
    end
    </div>
    <div class="diagram-cap">
           TP: True Positive, TN: True Negative, FP: False Positive, FN: False Negative.
          </div>
    <h3 class="sh3">
           2. Precision vs Recall Trade-off
          </h3>
    <p>
    <strong>
            Precision:
           </strong>
           Out of all predicted positives, how many are actually positive? You care about minimizing False Positives.
          </p>
    <p>
    <strong>
            Recall (Sensitivity):
           </strong>
           Out of all actual positives, how many did we successfully find? You care about minimizing False Negatives.
          </p>

    <div class="math-block">
    <span class="formula">
            $$\text{Precision} = \frac{\text{TP}}{\text{TP} + \text{FP}}$$
           </span>
    <span class="desc">
            What fraction of predictions were correct?
           </span>
    <span class="formula">
            $$\text{Recall} = \frac{\text{TP}}{\text{TP} + \text{FN}}$$
           </span>
    <span class="desc">
            What fraction of positive cases did we capture?
           </span>
    <span class="formula">
            $$\text{F1-Score} = 2 \times \frac{\text{Precision} \times \text{Recall}}{\text{Precision} + \text{Recall}}$$
           </span>
    <span class="desc">
            Harmonic mean. Penalizes extreme values of either precision or recall.
           </span>
    </div>
    <h3 class="sh3">
           3. ROC Curve and AUC
          </h3>
    <p>
           The Receiver Operating Characteristic (ROC) curve plots True Positive Rate (Recall) vs False Positive Rate (FP / (FP + TN)) at various decision thresholds. AUC ranges from 0 to 1; a model with AUC = 0.5 is no better than random guessing.
          </p>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — classification_eval.py
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">from</span> sklearn.metrics <span class="kw">import</span> confusion_matrix, precision_score, recall_score, f1_score, roc_auc_score

    <span class="cm"># Binary classification simulation (Imbalanced classes)</span>
    y_true = np.<span class="fn">array</span>([<span class="num">0</span>, <span class="num">0</span>, <span class="num">0</span>, <span class="num">0</span>, <span class="num">0</span>, <span class="num">0</span>, <span class="num">1</span>, <span class="num">1</span>, <span class="num">1</span>, <span class="num">1</span>])
    y_pred = np.<span class="fn">array</span>([<span class="num">0</span>, <span class="num">0</span>, <span class="num">0</span>, <span class="num">0</span>, <span class="num">0</span>, <span class="num">1</span>, <span class="num">0</span>, <span class="num">1</span>, <span class="num">1</span>, <span class="num">1</span>])  <span class="cm"># FP=1, FN=1</span>

    tn, fp, fn, tp = <span class="fn">confusion_matrix</span>(y_true, y_pred).<span class="fn">ravel</span>()

    prec = <span class="fn">precision_score</span>(y_true, y_pred)
    rec = <span class="fn">recall_score</span>(y_true, y_pred)
    f1 = <span class="fn">f1_score</span>(y_true, y_pred)
    auc = <span class="fn">roc_auc_score</span>(y_true, y_pred)

    <span class="fn">print</span>(<span class="str">"Confusion Matrix Counts:"</span>)
    <span class="fn">print</span>(<span class="str">f"  TP: {tp}, FP: {fp}, TN: {tn}, FN: {fn}"</span>)
    <span class="fn">print</span>(<span class="str">f"\nMetrics:"</span>)
    <span class="fn">print</span>(<span class="str">f"  Precision : {prec:.4f}"</span>)
    <span class="fn">print</span>(<span class="str">f"  Recall    : {rec:.4f}"</span>)
    <span class="fn">print</span>(<span class="str">f"  F1 Score  : {f1:.4f}"</span>)
    <span class="fn">print</span>(<span class="str">f"  ROC AUC   : {auc:.4f}"</span>)</code></pre>
    </div>
    <div class="hinglish">
           💡 Interviewers often ask: "Why harmonic mean instead of arithmetic mean for F1?" If Precision is 100% and Recall is 0%, arithmetic mean is 50%, which hides the fatal flaw. Harmonic mean yields 0%, reflecting the complete failure.
