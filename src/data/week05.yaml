  concept_flow: *id001
  hinglish: 💡 KNN distance calculating algorithm hai, isliye features scale hona compulsory
    hai. Agar ek feature Age (20-60) aur dusra Income (50,000-5,00,000) hai, toh bina
    scaling ke income distance computation ko domainate kar lega aur model logic distort
    ho jayega. Standardize hamesha karein!
  analogy: '"Sangat ka asar." Agar aapke 5 sabse close friends software engineers
    hain, toh probability hai ki aap bhi tech/code mein interest rakhte hain. Yahi
    KNN hai.'
  theory_html: "<h3 class=\"sh3\">\n       1. K-Nearest Neighbors (KNN) Classifier\n\
    \      </h3>\n<p>\n       KNN classifies a new data point based on the majority\
    \ vote of its $k$ closest neighbors in the feature space. It is a lazy learner\
    \ (no training phase; it stores the dataset in memory and does all calculations\
    \ during prediction).\n      </p>\n\n<div class=\"math-block\">\n<span class=\"\
    formula\">\n        $$\\text{Euclidean Distance} = \\sqrt{ \\sum_{i=1}^n (x_i\
    \ - y_i)^2 }$$\n       </span>\n<span class=\"desc\">\n        Straight-line distance.\
    \ Sensitive to variable scales (requires normalization!).\n       </span>\n<span\
    \ class=\"formula\">\n        $$\\text{Manhattan Distance} = \\sum_{i=1}^n |x_i\
    \ - y_i|$$\n       </span>\n<span class=\"desc\">\n        Grid-like taxi cab\
    \ distance. Useful in high dimensional spaces.\n       </span>\n</div>\n<h3 class=\"\
    sh3\">\n       2. Naive Bayes Classifier\n      </h3>\n<p>\n       Naive Bayes\
    \ uses probability formulas derived from Bayes' Theorem to classify instances.\
    \ It calculates the conditional probability of each class given the input features,\
    \ choosing the class with highest probability.\n      </p>\n<div class=\"math-block\"\
    >\n<span class=\"formula\">\n        $$P(C | X) = \\frac{P(X | C) \\times P(C)}{P(X)}$$\n\
    \       </span>\n<span class=\"desc\">\n        Where C is class, X is features\
    \ vector [x₁, x₂, ..., xₙ].\n       </span>\n</div>\n<p>\n       Why is it called\n\
    \       <strong>\n        \"Naive\"\n       </strong>\n       ? Because it assumes\
    \ all input features are independent of each other given the class label. Even\
    \ though this is almost never true in real life, the classifier performs surprisingly\
    \ well on text classification (spam detection, sentiment analysis).\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — knn_naivebayes.py\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\"\
    >from</span> sklearn.datasets <span class=\"kw\">import</span> load_breast_cancer\n\
    <span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span>\
    \ train_test_split\n<span class=\"kw\">from</span> sklearn.preprocessing <span\
    \ class=\"kw\">import</span> StandardScaler\n<span class=\"kw\">from</span> sklearn.neighbors\
    \ <span class=\"kw\">import</span> KNeighborsClassifier\n<span class=\"kw\">from</span>\
    \ sklearn.naive_bayes <span class=\"kw\">import</span> GaussianNB\n<span class=\"\
    kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> classification_report\n\
    \n<span class=\"cm\"># Load breast cancer dataset</span>\ndata = <span class=\"\
    fn\">load_breast_cancer</span>()\nX, y = data.data, data.target\nX_train, X_test,\
    \ y_train, y_test = <span class=\"fn\">train_test_split</span>(X, y, test_size=<span\
    \ class=\"num\">0.2</span>, random_state=<span class=\"num\">42</span>)\n\n<span\
    \ class=\"cm\"># Scale features (mandatory for KNN distance metrics)</span>\n\
    sc = <span class=\"fn\">StandardScaler</span>()\nX_tr = sc.<span class=\"fn\"\
    >fit_transform</span>(X_train)\nX_te = sc.<span class=\"fn\">transform</span>(X_test)\n\
    \n<span class=\"cm\"># Fit KNN</span>\nknn = <span class=\"fn\">KNeighborsClassifier</span>(n_neighbors=<span\
    \ class=\"num\">5</span>)\n<span class=\"cm\"># knn.fit(X_tr, y_train)</span>\n\
    \n<span class=\"cm\"># Fit Naive Bayes</span>\nnb = <span class=\"fn\">GaussianNB</span>()\n\
    <span class=\"cm\"># nb.fit(X_tr, y_train)</span>\n\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"KNN Classification Report:\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"fn\">classification_report</span>(y_test, knn.<span class=\"fn\">predict</span>(X_te)))\n\
    \n<span class=\"fn\">print</span>(<span class=\"str\">f\"\\nNaive Bayes Classification\
    \ Report:\"</span>)\n<span class=\"fn\">print</span>(<span class=\"fn\">classification_report</span>(y_test,\
    \ nb.<span class=\"fn\">predict</span>(X_te)))</pre>\n</div>\n<div class=\"hinglish\"\
    >\n       \U0001F4A1 KNN distance calculating algorithm hai, isliye features scale\
    \ hona compulsory hai. Agar ek feature Age (20-60) aur dusra Income (50,000-5,00,000)\
    \ hai, toh bina scaling ke income distance computation ko domainate kar lega aur\
    \ model logic distort ho jayega. Standardize hamesha karein!\n      </div>"
