      \n<span class=\"kw\">def</span> <span class=\"fn\">train_test_split_scratch</span>(X: np.ndarray, y: np.ndarray, test_size: float = <span class=\"num\">0.2</span>, random_state: int = <span class=\"num\">42</span>):\n<span class=\"cm\"># np.random.seed(random_state)</span>\n    n_samples = <span class=\"fn\">len</span>(X)\n    shuffled_indices = np.random.<span class=\"fn\">permutation</span>(n_samples)\n    test_count = <span class=\"fn\">int</span>(n_samples * test_size)\n    \n    test_idx = shuffled_indices[:test_count]\n    train_idx = shuffled_indices[test_count:]\n    \n    <span class=\"kw\">return</span> X[train_idx], X[test_idx], y[train_idx], y[test_idx]\n\n<span class=\"cm\"># Verification</span>\nX_sample = np.<span class=\"fn\">arange</span>(<span class=\"num\">20</span>).<span class=\"fn\">reshape</span>(<span class=\"num\">10</span>, <span class=\"num\">2</span>)\ny_sample = np.<span class=\"fn\">arange</span>(<span class=\"num\">10</span>)\nX_tr, X_te, y_tr, y_te =\
