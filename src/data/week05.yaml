- id: '35'
  day_num: 35
  title: Hyperparameter Tuning & Pipelines
  subtitle: Model architecture select karne ke baad humein exact configuration (hyperparameters)
    select karni hoti hai. Par kya hum manually har configuration click karke try
    karein? Bilkul nahi. Aaj hum GridSearchCV, RandomizedSearchCV, K-Fold, aur scikit-learn
    Pipelines ka use karke process ko automate karenge.
  time_estimate: 5 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Differentiate between standard parameters (learned) and hyperparameters (set manually)
  - Apply K-Fold and Stratified K-Fold cross-validation correctly
  - Tune models programmatically using GridSearchCV and RandomizedSearchCV
  - Construct scikit-learn Pipelines to chain preprocessing and model training safely
  checklist:
  - id: chk_35_1
    text: Study the core mathematical and architectural principles of Hyperparameter
