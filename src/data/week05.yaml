    <span class="cm"># ])</span>

    <span class="cm"># Specify hyperparameter grid (use prefix model_name__ to refer to parameters)</span>
    param_grid = {
        "knn__n_neighbors": [3, 5, 7, 9, 11],
        "knn__weights": ["uniform", "distance"],
        "knn__metric": ["euclidean", "manhattan"]
    }

    <span class="cm"># Run GridSearchCV with 5-fold Stratified CV</span>
    grid_search = <span class="fn">GridSearchCV</span>(pipe, param_grid, cv=<span class="num">5</span>, scoring=<span class="str">'accuracy'</span>)
    <span class="cm"># grid_search.fit(X_train, y_train)</span>

    <span class="fn">print</span>(<span class="str">f"Best Hyperparameters: {grid_search.best_params_}"</span>)
    <span class="fn">print</span>(<span class="str">f"Best Cross-Validation Score: {grid_search.best_score_:.4f}"</span>)
    <span class="fn">print</span>(<span class="str">f"Test Set Accuracy: {grid_search.score(X_test, y_test):.4f}"</span>)</code></pre>
    </div>
    <div class="hinglish">
           💡 Pipeline ke bina, beginners pehle scaler ko pure dataset par fit kar dete hain aur fir train/test split ya cross-validation chalate hain. Aisa karne se training data test set ka mean aur standard deviation pehle hi dekh leta hai (data leakage), jisse validation score real accuracy se jyada optimisitic aata hai. Always use pipelines!
          </div>
