      is_correct: true
    - letter: C
      text: Hyperparameter tuning with test set accuracy
      is_correct: false
    - letter: D
      text: Converting the model to a JavaScript file
      is_correct: false
    correct_fb: ✅ Correct!
    wrong_fb: ❌ Incorrect. Review the material and try again.
  - num_str: QUESTION 5 OF 5
    question: What is the correct way to version your ML pipeline code for reproducibility?
    qid: q37-5
    options:
    - letter: A
      text: Save the pipeline object as pipeline_v1.pkl manually
      is_correct: false
    - letter: B
      text: Use Git for code, lock dependencies with requirements.txt, and log pipeline
        parameters
      is_correct: true
    - letter: C
      text: Copy the entire project folder with a new name each time
      is_correct: false
    - letter: D
      text: Print all parameter values to the console before training
      is_correct: false
    correct_fb: ✅ Correct!
    wrong_fb: ❌ Incorrect. Review the material and try again.
  flashcards:
  - front: Mathematical objective function measuring the discrepancy between model
      predictions ŷ and true labels y, optimized via gradient descent.
    back: 'Loss function for binary classification: L = -[y*log(p) + (1-y)*log(1-p)].
      Penalizes confident wrong predictions.'
  - front: Sigmoid Activation?
    back: 'Formula: 1 / (1 + e^-z). Maps any real value to the range (0, 1), representing
      probability output.'
  - front: Odds Ratio?
    back: 'The probability of an event occurring divided by the probability of it
      not occurring: p / (1 - p).'
  - front: Features vs Targets?
    back: Features (X) are the input variables; Targets (y) are the labels we wish
      to predict.
  - front: Train-Test Split?
    back: Partitioning data (e.g., 80/20) to train the model on one subset and evaluate
      it on unseen data.
