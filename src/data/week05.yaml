- id: '34'
  day_num: 34
  title: Bias-Variance Tradeoff & Overfitting
  subtitle: Machine learning models ka main core unka behavior par depend karta hai.
    Model agar bahot simple ho toh learn nahi kar pata (High Bias). Model agar bahot
    complicated ho toh training set ko ratta maar leta hai par test set par fail ho
    jata hai (High Variance). Aaj hum is tradeoff ko deep detail mein mathematically
    aur visually explore karenge.
  time_estimate: 5 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Explain the mathematical decomposition of prediction error into Bias, Variance,
    and Irreducible Error
  - Identify underfitting and overfitting states from learning curves
  - Diagnose model health from training error vs validation error gaps
  - Suggest appropriate steps to fix both high bias and high variance conditions
  checklist:
  - id: chk_34_1
    text: Study the core mathematical and architectural principles of Bias-Variance
      Tradeoff & Overfitting
  - id: chk_34_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_34_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_34_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow: *id001
  hinglish: 💡 Agar learning curve mein training data size badhane par validation curve
    decrease ho rahi hai aur flat nahi hui, iska matlab aapko more data collect karne
    se fayda hoga. Agar flat ho chuki hai, toh dataset size badhane ka koi fayda nahi
    hoga, model upgrade karna hoga.
  analogy: "<strong>\n        Underfitting (High Bias):\n       </strong>\n      \
    \ Ek student jo sirf formula sheet padh ke exam dene gaya. Clear concepts nahi\
    \ hain. Train aur test dono mein kam marks aayenge.\n       <br/>\n<strong>\n\
    \        Overfitting (High Variance):\n       </strong>\n       Ek student jisne\
    \ past 5 years ke papers ke exact numbers ratta maar liye. Exam mein naya question\
    \ aate hi fail. Train metrics excellent, test metrics terrible."
  theory_html: "<h3 class=\"sh3\">\n       1. Bias-Variance Decomposition\n      </h3>\n\
    <p>\n       The total expected prediction error of any ML model can be decomposed\
    \ into three mathematically separate parts:\n      </p>\n<figure class=\"svg-diagram\"\
    >\n<svg aria-label=\"Bias-Variance Tradeoff showing U-shaped total error curve\"\
    \ height=\"320\" role=\"img\" viewbox=\"0 0 650 320\" width=\"650\" xmlns=\"http://www.w3.org/2000/svg\"\
    >\n<defs>\n<lineargradient id=\"bv-bg\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n\
    <stop offset=\"0%\" stop-color=\"#1a1e2e\">\n</stop>\n<stop offset=\"100%\" stop-color=\"\
    var(--bg)\">\n</stop>\n</lineargradient>\n</defs>\n<rect fill=\"url(#bv-bg)\"\
    \ height=\"320\" rx=\"12\" width=\"650\">\n</rect>\n<!-- Axes -->\n<line stroke=\"\
    #6b7590\" stroke-width=\"1.5\" x1=\"80\" x2=\"600\" y1=\"260\" y2=\"260\">\n</line>\n\
    <line stroke=\"#6b7590\" stroke-width=\"1.5\" x1=\"80\" x2=\"80\" y1=\"260\" y2=\"\
    40\">\n</line>\n<text fill=\"var(--text)\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"13\" text-anchor=\"middle\" x=\"340\" y=\"295\">\n         Model\
    \ Complexity →\n        </text>\n<text fill=\"var(--text)\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"13\" text-anchor=\"middle\" transform=\"rotate(-90,30,150)\" x=\"\
    30\" y=\"150\">\n         Error\n        </text>\n<!-- Bias² curve (decreasing)\
    \ -->\n<path d=\"M100,80 Q200,85 300,140 Q400,200 580,240\" fill=\"none\" stroke=\"\
    var(--blue, #82aaff)\" stroke-dasharray=\"8,4\" stroke-width=\"2.5\">\n</path>\n\
    <text fill=\"var(--blue, #82aaff)\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    11\" font-weight=\"600\" x=\"520\" y=\"228\">\n         Bias²\n        </text>\n\
    <!-- Variance curve (increasing) -->\n<path d=\"M100,240 Q200,235 300,200 Q400,140\
    \ 560,60\" fill=\"none\" stroke=\"#f97583\" stroke-dasharray=\"8,4\" stroke-width=\"\
    2.5\">\n</path>\n<text fill=\"#f97583\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    11\" font-weight=\"600\" x=\"520\" y=\"65\">\n         Variance\n        </text>\n\
    <!-- Total Error curve (U-shaped) -->\n<path d=\"M100,100 Q200,85 280,95 Q340,105\
    \ 380,130 Q450,170 560,240\" fill=\"none\" stroke=\"#f0c846\" stroke-width=\"\
    3\">\n</path>\n<text fill=\"#f0c846\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    11\" font-weight=\"700\" x=\"520\" y=\"255\">\n         Total Error\n        </text>\n\
    <!-- Sweet spot marker -->\n<circle cx=\"260\" cy=\"92\" fill=\"none\" r=\"6\"\
    \ stroke=\"#7ee787\" stroke-width=\"2\">\n</circle>\n<line stroke=\"#7ee787\"\
    \ stroke-dasharray=\"4,4\" stroke-width=\"1\" x1=\"260\" x2=\"260\" y1=\"98\"\
    \ y2=\"260\">\n</line>\n<text fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" x=\"260\" y=\"30\"\
    >\n         ⬇ Optimal Complexity\n        </text>\n<!-- Underfitting / Overfitting\
    \ zones -->\n<rect fill=\"rgba(88,166,255,0.15)\" height=\"22\" rx=\"4\" width=\"\
    170\" x=\"85\" y=\"265\">\n</rect>\n<text fill=\"var(--blue, #82aaff)\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"10\" text-anchor=\"middle\" x=\"170\" y=\"280\"\
    >\n         Underfitting (High Bias)\n        </text>\n<rect fill=\"rgba(249,117,131,0.15)\"\
    \ height=\"22\" rx=\"4\" width=\"180\" x=\"410\" y=\"265\">\n</rect>\n<text fill=\"\
    #f97583\" font-family=\"DM Sans,sans-serif\" font-size=\"10\" text-anchor=\"middle\"\
    \ x=\"500\" y=\"280\">\n         Overfitting (High Variance)\n        </text>\n\
    <!-- Title -->\n<text fill=\"#e6edf3\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    14\" font-weight=\"700\" text-anchor=\"middle\" x=\"340\" y=\"25\">\n        \
    \ Bias-Variance Tradeoff\n        </text>\n</svg>\n<figcaption>\n        Total\
    \ error = Bias² + Variance + Irreducible Noise. The optimal model complexity minimizes\
    \ total error — not just training error.\n       </figcaption>\n</figure>\n<div\
    \ class=\"math-block\">\n<span class=\"formula\">\n        $$\\text{Total Error}\
    \ = \\text{Bias}^2 + \\text{Variance} + \\text{Irreducible Error}$$\n       </span>\n\
    <span class=\"desc\">\n<strong>\n         Bias:\n        </strong>\n        Error\
    \ from erroneous assumptions (e.g., fitting a line to circular data). High bias\
    \ → Underfitting.\n       </span>\n<span class=\"desc\">\n<strong>\n         Variance:\n\
    \        </strong>\n        Sensitivity to small fluctuations in training set.\
    \ High variance → Overfitting.\n       </span>\n<span class=\"desc\">\n<strong>\n\
    \         Irreducible Error (noise):\n        </strong>\n        Noise in data\
    \ generation. Cannot be reduced regardless of algorithm.\n       </span>\n</div>\n\
    \n<h3 class=\"sh3\">\n       2. Visualizing the Tradeoff\n      </h3>\n<div class=\"\
    mermaid\">\ngraph TD\n  Low[\"Low Complexity Underfitting / High Bias\"] --&gt;\
    \ Opt[\"Optimal Fit Low Generalization Error\"]\n  Opt --&gt; High[\"High Complexity\
    \ Overfitting / High Variance\"]\n</div>\n<div class=\"diagram-cap\">\n      \
    \ As model complexity increases, training error drops, but validation error curves\
    \ back up.\n      </div>\n<h3 class=\"sh3\">\n       3. Diagnostics: What to Do\n\
    \      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem\
    \ 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Condition\n\
    \        </th>\n<th>\n         Behavior\n        </th>\n<th>\n         Primary\
    \ Fixes\n        </th>\n</tr>\n<tr>\n<td>\n<strong>\n          High Bias (Underfitting)\n\
    \         </strong>\n</td>\n<td>\n         Both train and validation error are\
    \ high. Minimal gap.\n        </td>\n<td>\n         Increase complexity, add features,\
    \ reduce regularization.\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n       \
    \   High Variance (Overfitting)\n         </strong>\n</td>\n<td>\n         Low\
    \ training error, high validation error. Large gap.\n        </td>\n<td>\n   \
    \      Add more data, apply L1/L2 regularization, reduce features, prune trees.\n\
    \        </td>\n</tr>\n</table></div>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — learning_curves.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span>\
    \ plt\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\"\
    >import</span> learning_curve\n<span class=\"kw\">from</span> sklearn.linear_model\
    \ <span class=\"kw\">import</span> Ridge\n<span class=\"kw\">from</span> sklearn.datasets\
    \ <span class=\"kw\">import</span> make_regression\n\nX, y = <span class=\"fn\"\
    >make_regression</span>(n_samples=<span class=\"num\">200</span>, n_features=<span\
    \ class=\"num\">10</span>, noise=<span class=\"num\">5.0</span>, random_state=<span\
    \ class=\"num\">42</span>)\n\ntrain_sizes, train_scores, val_scores = <span class=\"\
    fn\">learning_curve</span>(model, X, y, cv=<span class=\"num\">5</span>)\n   \
    \ <span class=\"fn\">Ridge</span>(alpha=<span class=\"num\">1.0</span>), X, y,\
    \ cv=<span class=\"num\">5</span>, train_sizes=np.<span class=\"fn\">linspace</span>(<span\
    \ class=\"num\">0.1</span>, <span class=\"num\">1.0</span>, <span class=\"num\"\
    >10</span>),\n    scoring=<span class=\"str\">'neg_mean_squared_error'</span>\n\
    <span class=\"cm\"># )</span>\n\n<span class=\"cm\"># Convert back to positive\
    \ MSE</span>\ntrain_mse = -np.<span class=\"fn\">mean</span>(train_scores, axis=<span\
    \ class=\"num\">1</span>)\nval_mse = -np.<span class=\"fn\">mean</span>(val_scores,\
    \ axis=<span class=\"num\">1</span>)\n\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Data Points\\tTrain MSE\\tVal MSE\"</span>)\n<span class=\"\
    kw\">for</span> size, t_err, v_err <span class=\"kw\">in</span> <span class=\"\
    fn\">zip</span>(train_sizes, train_mse, val_mse):\n    <span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"{size}\\t\\t{t_err:.2f}\\t\\t{v_err:.2f}\"</span>)</pre>\n\
    </div>\n<div class=\"hinglish\">\n       \U0001F4A1 Agar learning curve mein training\
    \ data size badhane par validation curve decrease ho rahi hai aur flat nahi hui,\
    \ iska matlab aapko more data collect karne se fayda hoga. Agar flat ho chuki\
    \ hai, toh dataset size badhane ka koi fayda nahi hoga, model upgrade karna hoga.\n\
    \      </div>"
