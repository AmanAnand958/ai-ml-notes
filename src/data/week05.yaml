- id: '33'
  day_num: 33
  title: Evaluation Metrics — Classification
  subtitle: Classification tasks mein accurate checking karna thoda alag hai. Agar
    class balance imbalanced ho (99% normal transactions, 1% fraud), toh 99% accuracy
    wala model bilkul bekaar ho sakta hai. Aaj hum confusion matrix, Precision, Recall,
    F1-Score aur ROC-AUC score ke tradeoffs master karenge.
  time_estimate: 5 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Construct and analyze a Confusion Matrix (TP, TN, FP, FN)
  - Explain Precision vs Recall and their trade-offs in real-world situations
  - Calculate F1-Score as the harmonic mean and explain why it's better than arithmetic
    mean
  - Interpret ROC curves and calculate Area Under Curve (AUC) for model comparison
  checklist:
  - id: chk_33_1
    text: Study the core mathematical and architectural principles of Evaluation Metrics
      — Classification
  - id: chk_33_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_33_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_33_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow: *id001
  hinglish: Classification models evaluate karte waqt sirf Accuracy kafi nahi hoti
    agar data imbalanced ho. Precision aur Recall ka harmonic mean (F1-score) real
    performance dikhata hai.
  analogy: "<strong>\n        \U0001F3E5 Malaria Detection (High Recall):\n      \
    \ </strong>\n       Positive test means treatment. A false negative (missing malaria)\
    \ can kill a patient. We want Recall near 100%, even if precision drops slightly.\n\
    \       <br/>\n<strong>\n        \U0001F6E1️ Fraud Alert (High Precision):\n \
    \      </strong>\n       If a bank blocks a UPI card on every false alarm, customer\
    \ experience will be terrible. We want to be absolutely sure when marking a transaction\
    \ as fraud (minimizing false positives/FP), so we prioritize High Precision."
  theory_html: "<h3 class=\"sh3\">\n       1. The Confusion Matrix\n      </h3>\n\
    <p>\n       Confusion Matrix is a tabular representation of the model's classification\
    \ performance, comparing actual values with predicted values.\n      </p>\n<div\
    \ class=\"mermaid\">\ngraph TD\nsubgraph \"Actual Positive\"\n  P_TP[\"Predicted\
    \ Positive: TP\"]\n  P_FN[\"Predicted Negative: FN\"]\nend\nsubgraph \"Actual\
    \ Negative\"\n  P_FP[\"Predicted Positive: FP\"]\n  P_TN[\"Predicted Negative:\
    \ TN\"]\nend\n</div>\n<div class=\"diagram-cap\">\n       TP: True Positive, TN:\
    \ True Negative, FP: False Positive, FN: False Negative.\n      </div>\n<h3 class=\"\
    sh3\">\n       2. Precision vs Recall Trade-off\n      </h3>\n<p>\n<strong>\n\
    \        Precision:\n       </strong>\n       Out of all predicted positives,\
    \ how many are actually positive? You care about minimizing False Positives.\n\
    \      </p>\n<p>\n<strong>\n        Recall (Sensitivity):\n       </strong>\n\
    \       Out of all actual positives, how many did we successfully find? You care\
    \ about minimizing False Negatives.\n      </p>\n\n<div class=\"math-block\">\n\
    <span class=\"formula\">\n        $$\\text{Precision} = \\frac{\\text{TP}{\\text{TP}\
    \ + \\text{FP}$$\n       </span>\n<span class=\"desc\">\n        What fraction\
    \ of predictions were correct?\n       </span>\n<span class=\"formula\">\n   \
    \     $$\\text{Recall} = \\frac{\\text{TP}{\\text{TP} + \\text{FN}$$\n       </span>\n\
    <span class=\"desc\">\n        What fraction of positive cases did we capture?\n\
    \       </span>\n<span class=\"formula\">\n        $$\\text{F1-Score} = 2 \\times\
    \ \\frac{\\text{Precision} \\times \\text{Recall}{\\text{Precision} + \\text{Recall}$$\n\
    \       </span>\n<span class=\"desc\">\n        Harmonic mean. Penalizes extreme\
    \ values of either precision or recall.\n       </span>\n</div>\n<h3 class=\"\
    sh3\">\n       3. ROC Curve and AUC\n      </h3>\n<p>\n       The Receiver Operating\
    \ Characteristic (ROC) curve plots True Positive Rate (Recall) vs False Positive\
    \ Rate (FP / (FP + TN)) at various decision thresholds. AUC ranges from 0 to 1;\
    \ a model with AUC = 0.5 is no better than random guessing.\n      </p>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\
    \ — classification_eval.py\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\"\
    >import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">from</span>\
    \ sklearn.metrics <span class=\"kw\">import</span> confusion_matrix, precision_score,\
    \ recall_score, f1_score, roc_auc_score\n\n<span class=\"cm\"># Binary classification\
    \ simulation (Imbalanced classes)</span>\ny_true = np.<span class=\"fn\">array</span>([<span\
    \ class=\"num\">0</span>, <span class=\"num\">0</span>, <span class=\"num\">0</span>,\
    \ <span class=\"num\">0</span>, <span class=\"num\">0</span>, <span class=\"num\"\
    >0</span>, <span class=\"num\">1</span>, <span class=\"num\">1</span>, <span class=\"\
    num\">1</span>, <span class=\"num\">1</span>])\ny_pred = np.<span class=\"fn\"\
    >array</span>([<span class=\"num\">0</span>, <span class=\"num\">0</span>, <span\
    \ class=\"num\">0</span>, <span class=\"num\">0</span>, <span class=\"num\">0</span>,\
    \ <span class=\"num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\"\
    >1</span>, <span class=\"num\">1</span>, <span class=\"num\">1</span>])  <span\
    \ class=\"cm\"># FP=1, FN=1</span>\n\ntn, fp, fn, tp = <span class=\"fn\">confusion_matrix</span>(y_true,\
    \ y_pred).<span class=\"fn\">ravel</span>()\n\nprec = <span class=\"fn\">precision_score</span>(y_true,\
    \ y_pred)\nrec = <span class=\"fn\">recall_score</span>(y_true, y_pred)\nf1 =\
    \ <span class=\"fn\">f1_score</span>(y_true, y_pred)\nauc = <span class=\"fn\"\
    >roc_auc_score</span>(y_true, y_pred)\n\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Confusion Matrix Counts:\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"  TP: {tp}, FP: {fp}, TN: {tn}, FN: {fn}\"</span>)\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"\\nMetrics:\"</span>)\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"  Precision : {prec:.4f}\"</span>)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"  Recall    : {rec:.4f}\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"  F1 Score  :\
    \ {f1:.4f}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
    \  ROC AUC   : {auc:.4f}\"</span>)</pre>\n</div>\n<div class=\"hinglish\">\n \
    \      \U0001F4A1 Interviewers often ask: \"Why harmonic mean instead of arithmetic\
    \ mean for F1?\" If Precision is 100% and Recall is 0%, arithmetic mean is 50%,\
    \ which hides the fatal flaw. Harmonic mean yields 0%, reflecting the complete\
    \ failure.\n      </div>"
