    prompt_html: "<p>\n          Implement a KNN classifier class from scratch using\
      \ NumPy. Write custom functions for: (1) Euclidean distance calculation, (2)\
      \ Manhattan distance calculation, (3)\n          \n           fit(X, y)\n  \
      \        \n          (which just stores references), (4)\n          \n     \
      \      predict(X)\n          \n          (which calculates distance from all\
      \ train points, finds top $k$ neighbors, and gets majority vote). Test it against\
      \ scikit-learn's KNN on the Wine dataset.\n         </p>\n\n\n<div class=\"\
      cb\" style=\"margin-top: 1rem;\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
      >python</span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
      copyCode(this)\">copy</button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
      >Run</button>\n<button class=\"run-btn\" onclick=\"openInColab(this)\">⚡ Run\
      \ on Colab</button>\n</div>\n</div>\n<pre><span class=\"cm\"># Solution for\
      \ Task: KNN Classifier from Scratch</span>\n<span class=\"kw\">import</span>\
      \ numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">class</span> <span\
      \ class=\"cls\">KNNClassifierScratch</span>:\n    <span class=\"kw\">def</span>\
      \ <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, k: int\
      \ = <span class=\"num\">3</span>):\n        <span class=\"kw\">self</span>.k\
      \ = k\n        \n    <span class=\"kw\">def</span> <span class=\"fn\">fit</span>(<span\
      \ class=\"kw\">self</span>, X: np.ndarray, y: np.ndarray):\n        <span class=\"\
      kw\">self</span>.X_train = X\n        <span class=\"kw\">self</span>.y_train\
      \ = y\n        \n    <span class=\"kw\">def</span> <span class=\"fn\">predict</span>(<span\
      \ class=\"kw\">self</span>, X: np.ndarray) -&gt; np.ndarray:\n        predictions\
      \ = []\n        <span class=\"kw\">for</span> sample <span class=\"kw\">in</span>\
      \ X:\n            <span class=\"cm\"># Euclidean distances</span>\n        \
      \    distances = np.linalg.<span class=\"fn\">norm</span>(<span class=\"kw\"\
      >self</span>.X_train - sample, axis=<span class=\"num\">1</span>)\n        \
      \    <span class=\"cm\"># Top-k nearest neighbors</span>\n            k_indices\
      \ = np.<span class=\"fn\">argsort</span>(distances)[:<span class=\"kw\">self</span>.k]\n\
      \            k_labels = <span class=\"kw\">self</span>.y_train[k_indices]\n\
      \            <span class=\"cm\"># Majority vote</span>\n            majority_label\
      \ = np.<span class=\"fn\">bincount</span>(k_labels).<span class=\"fn\">argmax</span>()\n\
      <span class=\"cm\"># predictions.append(majority_label)</span>\n        <span\
      \ class=\"kw\">return</span> np.<span class=\"fn\">array</span>(predictions)\n\
      \n<span class=\"cm\"># Verification</span>\nX_tr = np.<span class=\"fn\">array</span>([[<span\
      \ class=\"num\">1</span>, <span class=\"num\">2</span>], [<span class=\"num\"\
      >2</span>, <span class=\"num\">3</span>], [<span class=\"num\">3</span>, <span\
      \ class=\"num\">1</span>], [<span class=\"num\">6</span>, <span class=\"num\"\
      >5</span>], [<span class=\"num\">7</span>, <span class=\"num\">7</span>], [<span\
      \ class=\"num\">8</span>, <span class=\"num\">6</span>]])\ny_tr = np.<span class=\"\
      fn\">array</span>([<span class=\"num\">0</span>, <span class=\"num\">0</span>,\
      \ <span class=\"num\">0</span>, <span class=\"num\">1</span>, <span class=\"\
      num\">1</span>, <span class=\"num\">1</span>])\nknn = <span class=\"fn\">KNNClassifierScratch</span>(k=<span\
      \ class=\"num\">3</span>)\n<span class=\"cm\"># knn.fit(X_tr, y_tr)</span>\n\
      <span class=\"fn\">print</span>(<span class=\"str\">\"Predicted labels for test\
      \ points:\"</span>, knn.<span class=\"fn\">predict</span>(np.<span class=\"\
      fn\">array</span>([[<span class=\"num\">2</span>, <span class=\"num\">2</span>],\
      \ [<span class=\"num\">7</span>, <span class=\"num\">6</span>]])))</pre>\n</div>"
    done_when: Custom class produces identical predictions to scikit-learn KNN for
