    <h3 class="sh3">
           3. GridSearchCV vs RandomizedSearchCV
          </h3>
    <ul>
    <li>
    <strong>
             GridSearchCV:
            </strong>
            Exhaustively searches all possible combinations in a given search space. Slow but guaranteed to find the best configuration in the grid.
           </li>
    <li>
    <strong>
             RandomizedSearchCV:
            </strong>
            Samples a fixed number of combinations randomly from statistical distributions. Much faster and highly recommended when search space is large.
           </li>
    </ul>
    <h3 class="sh3">
           4. Scikit-learn Pipelines
          </h3>
    <p>
           Pipelines prevent data leakage by ensuring that all transformations (like scaling, imputing) are fitted ONLY on the training folds during cross-validation, and never on validation folds.
          </p>
