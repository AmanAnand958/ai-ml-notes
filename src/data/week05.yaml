  tasks:
  - title: NumPy train_test_split from scratch
    badge: 🟢 EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n          Implement a function\n          \n           custom_train_test_split(X,\
      \ y, test_size=0.2, random_state=None)\n          \n          using NumPy's\
      \ random shuffling capability. Ensure it shuffles X and y in unison (so matches\
      \ are preserved). Train a linear regression on California housing using both\
      \ your split and sklearn's split and verify that the models produce different\
      \ but comparable test metrics.\n         </p>\n\n\n<div class=\"cb\" style=\"\
      margin-top: 1rem;\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">python</span>\n\
      <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
      >copy</button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">Run</button>\n\
      <button class=\"run-btn\" onclick=\"openInColab(this)\">⚡ Run on Colab</button>\n\
      </div>\n</div>\n<pre><span class=\"cm\"># Solution for Task: NumPy train_test_split\
      \ from scratch</span>\n<span class=\"kw\">import</span> numpy <span class=\"\
      kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\">train_test_split_scratch</span>(X:\
      \ np.ndarray, y: np.ndarray, test_size: float = <span class=\"num\">0.2</span>,\
      \ random_state: int = <span class=\"num\">42</span>):\n<span class=\"cm\">#\
      \ np.random.seed(random_state)</span>\n    n_samples = <span class=\"fn\">len</span>(X)\n\
      \    shuffled_indices = np.random.<span class=\"fn\">permutation</span>(n_samples)\n\
      \    test_count = <span class=\"fn\">int</span>(n_samples * test_size)\n   \
      \ \n    test_idx = shuffled_indices[:test_count]\n    train_idx = shuffled_indices[test_count:]\n\
      \    \n    <span class=\"kw\">return</span> X[train_idx], X[test_idx], y[train_idx],\
      \ y[test_idx]\n\n<span class=\"cm\"># Verification</span>\nX_sample = np.<span\
      \ class=\"fn\">arange</span>(<span class=\"num\">20</span>).<span class=\"fn\"\
      >reshape</span>(<span class=\"num\">10</span>, <span class=\"num\">2</span>)\n\
      y_sample = np.<span class=\"fn\">arange</span>(<span class=\"num\">10</span>)\n\
      X_tr, X_te, y_tr, y_te = <span class=\"fn\">train_test_split_scratch</span>(X_sample,\
      \ y_sample, test_size=<span class=\"num\">0.3</span>)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Train samples: {len(X_tr)}, Test samples: {len(X_te)}\"</span>)</pre>\n\
      </div>"
    done_when: Function is created, tested, and doesn't leak. Shuffling is verified
      to be in unison.
    git_cmd: 'git add split_scratch.py &amp;&amp; git commit -m "day31: numpy train
      test split from scratch"'
    sol_id: sol-w5d31t1
    solution_title: NumPy train_test_split from scratch Implementation
    solution_code: "# Verified Solution for Day 31 (What is Machine Learning? Core\
      \ Framework) - NumPy train_test_split from scratch\n\ndef execute_numpy_train_test_split_from_sc():\n\
      \    print(\"Executing NumPy train_test_split from scratch...\")\n    # Core\
