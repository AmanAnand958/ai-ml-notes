    time: 90 min
    prompt_html: "<p>\n          Implement a script that loads the Wine dataset or\
      \ iris dataset. Modify it to create a severe class imbalance (e.g. 95% Class\
      \ 0 and 5% Class 1). Train a logistic regression or decision tree classifier.\
      \ Write a custom function in NumPy that prints a detailed diagnostic summary:\
      \ (1) Confusion Matrix, (2) Precision, (3) Recall, (4) F1-score, (5) ROC-AUC.\
      \ Plot the ROC curve using Matplotlib and save the plot.\n         </p>\n\n\n\
      <div class=\"cb\" style=\"margin-top: 1rem;\">\n<div class=\"cb-head\">\n<span\
      \ class=\"cb-lang\">python</span>\n<div class=\"cb-btns\">\n<button class=\"\
      copy-btn\" onclick=\"copyCode(this)\">copy</button>\n<button class=\"run-btn\"\
      \ onclick=\"runCode(this)\">Run</button>\n<button class=\"run-btn\" onclick=\"\
      openInColab(this)\">⚡ Run on Colab</button>\n</div>\n</div>\n<pre><span class=\"\
      cm\"># Solution for Task: Imbalanced Classification Metrics Report</span>\n\
      <span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span\
      \ class=\"kw\">def</span> <span class=\"fn\">compute_classification_metrics</span>(y_true:\
      \ np.ndarray, y_pred: np.ndarray) -&gt; dict:\n    tp = np.<span class=\"fn\"\
      >sum</span>((y_true == <span class=\"num\">1</span>) &amp; (y_pred == <span\
      \ class=\"num\">1</span>))\n    tn = np.<span class=\"fn\">sum</span>((y_true\
      \ == <span class=\"num\">0</span>) &amp; (y_pred == <span class=\"num\">0</span>))\n\
      \    fp = np.<span class=\"fn\">sum</span>((y_true == <span class=\"num\">0</span>)\
      \ &amp; (y_pred == <span class=\"num\">1</span>))\n    fn = np.<span class=\"\
      fn\">sum</span>((y_true == <span class=\"num\">1</span>) &amp; (y_pred == <span\
      \ class=\"num\">0</span>))\n    \n    precision = tp / (tp + fp) <span class=\"\
      kw\">if</span> (tp + fp) &gt; <span class=\"num\">0</span> <span class=\"kw\"\
      >else</span> <span class=\"num\">0.0</span>\n    recall = tp / (tp + fn) <span\
      \ class=\"kw\">if</span> (tp + fn) &gt; <span class=\"num\">0</span> <span class=\"\
      kw\">else</span> <span class=\"num\">0.0</span>\n    f1 = <span class=\"num\"\
      >2</span> * (precision * recall) / (precision + recall) <span class=\"kw\">if</span>\
      \ (precision + recall) &gt; <span class=\"num\">0</span> <span class=\"kw\"\
      >else</span> <span class=\"num\">0.0</span>\n    accuracy = (tp + tn) / <span\
      \ class=\"fn\">len</span>(y_true)\n    \n    <span class=\"kw\">return</span>\
      \ {<span class=\"str\">\"Accuracy\": round(accuracy, 4), \"Precision\": round(precision,\
      \ 4), \"Recall\": round(recall, 4), \"F1\"</span>: <span class=\"fn\">round</span>(f1,\
      \ <span class=\"num\">4</span>)}\n\ny_t = np.<span class=\"fn\">array</span>([<span\
      \ class=\"num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\"\
      >1</span>, <span class=\"num\">1</span>, <span class=\"num\">0</span>, <span\
      \ class=\"num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\"\
      >0</span>, <span class=\"num\">1</span>, <span class=\"num\">0</span>])\ny_p\
      \ = np.<span class=\"fn\">array</span>([<span class=\"num\">1</span>, <span\
      \ class=\"num\">0</span>, <span class=\"num\">1</span>, <span class=\"num\"\
      >0</span>, <span class=\"num\">0</span>, <span class=\"num\">1</span>, <span\
      \ class=\"num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\"\
      >1</span>, <span class=\"num\">0</span>])\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">\"Classification Report:\"</span>, <span class=\"fn\">compute_classification_metrics</span>(y_t,\
      \ y_p))</pre>\n</div>"
    done_when: Visual classification metrics report printed to console, ROC curve
      plot saved as png. Calculations verified with sklearn.
