    \    app.<span class=\"fn\">run</span>(debug=<span class=\"kw\">True</span>, port=<span\
    \ class=\"num\">5000</span>)\n\n<span class=\"cm\"># Test: curl -X POST -F \"\
    file=@cat.jpg\" http://localhost:5000/predict</span></pre>\n</div>\n<div class=\"\
    debug-block\">\n<div class=\"debug-label\">\n        \U0001F6E0️ WEEKLY DEBUGGING\
    \ CHALLENGE\n       </div>\n<h3 style=\"font-family:var(--font-head); font-size:14px;\
    \ margin-bottom:0.5rem; color:var(--pink);\">\n        Debug: Accumulating Gradients\
    \ in PyTorch\n       </h3>\n<p style=\"font-size:13px; margin-bottom:0.8rem; line-height:1.6;\"\
    >\n        The PyTorch training loop loss stays high or converges to NaN because\
    \ the weights updates behave erratically.\n       </p>\n<div class=\"cb\">\n<div\
    \ class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >copy</button><button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left:\
    \ 4px;\">Run</button></div>\n</div>\n<pre><span class=\"cm\"># Step 1: Model Training\
    \ &amp; Evaluation Workflow</span>\n<span class=\"kw\">import</span> torch\n<span\
    \ class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n\n<span\
    \ class=\"kw\">import</span> torch\nX = torch.<span class=\"fn\">randn</span>(<span\
    \ class=\"num\">10</span>, <span class=\"num\">2</span>)\ny = torch.<span class=\"\
    fn\">randn</span>(<span class=\"num\">10</span>, <span class=\"num\">1</span>)\n\
    model = torch.nn.<span class=\"fn\">Linear</span>(<span class=\"num\">2</span>,\
    \ <span class=\"num\">1</span>)\noptimizer = torch.optim.<span class=\"fn\">SGD</span>(model.<span\
    \ class=\"fn\">parameters</span>(), lr=<span class=\"num\">0.01</span>)\n<span\
    \ class=\"kw\">for</span> epoch <span class=\"kw\">in</span> <span class=\"fn\"\
    >range</span>(<span class=\"num\">5</span>):\n    out = <span class=\"fn\">model</span>(X)\n\
    \    loss = torch.nn.functional.<span class=\"fn\">mse_loss</span>(out, y)\n \
    \   loss.<span class=\"fn\">backward</span>()\n    optimizer.<span class=\"fn\"\
    >step</span>()</pre>\n</div>\n<button class=\"solution-toggle\" onclick=\"toggleSolution('debug-sol-8')\"\
    >\n<span>\n         \U0001F50D Reveal Bug &amp; Fix\n        </span>\n</button>\n\
    <div class=\"solution-box\" id=\"debug-sol-8\">\n<div class=\"sol-header\">\n\
    \         SOLUTION &amp; EXPLANATION\n        </div>\n<div style=\"padding:1rem;\
    \ background:rgba(0,0,0,0.2); font-size:13px; line-height:1.6;\">\n<strong>\n\
    \          The Bug:\n         </strong>\n         In PyTorch, gradients are accumulated\
    \ in the .grad buffers of parameters whenever .backward() is called. If you do\
    \ not clear these gradients, they sum up across epochs/batches, leading to incorrect\
    \ updates. You must call optimizer.zero_grad() before computing gradients.\n \
    \        <br/>\n<br/>\n<strong>\n          The Fix:\n         </strong>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         \
    \   python\n           </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n             copy\n            </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\">\n             Run\n           \
    \ </button>\n</div>\n</div>\n<pre><span class=\"cm\"># Step 1: Model Training\
    \ &amp; Evaluation Workflow</span>\n<span class=\"kw\">import</span> torch\n<span\
    \ class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n\n<span\
    \ class=\"kw\">import</span> torch\nX = torch.<span class=\"fn\">randn</span>(<span\
    \ class=\"num\">10</span>, <span class=\"num\">2</span>)\ny = torch.<span class=\"\
    fn\">randn</span>(<span class=\"num\">10</span>, <span class=\"num\">1</span>)\n\
    model = torch.nn.<span class=\"fn\">Linear</span>(<span class=\"num\">2</span>,\
    \ <span class=\"num\">1</span>)\noptimizer = torch.optim.<span class=\"fn\">SGD</span>(model.<span\
    \ class=\"fn\">parameters</span>(), lr=<span class=\"num\">0.01</span>)\n<span\
    \ class=\"kw\">for</span> epoch <span class=\"kw\">in</span> <span class=\"fn\"\
    >range</span>(<span class=\"num\">5</span>):\n    optimizer.<span class=\"fn\"\
    >zero_grad</span>() <span class=\"cm\"># Clear gradients from previous iteration</span>\n\
    \    out = <span class=\"fn\">model</span>(X)\n    loss = torch.nn.functional.<span\
    \ class=\"fn\">mse_loss</span>(out, y)\n    loss.<span class=\"fn\">backward</span>()\n\
    \    optimizer.<span class=\"fn\">step</span>()</pre>\n</div>\n</div>\n</div>\n\
    </div>\n<!-- /day-58-theory -->\n<h2 class=\"sh2\">\n       \U0001F9EA Final Quiz\
    \ — Week 8 Synthesis\n      </h2>\n<h2 class=\"sh2\">\n        \U0001F0CF Revision\
