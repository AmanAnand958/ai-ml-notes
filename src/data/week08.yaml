  quizzes:
  - num_str: Q1 OF 3
    question: 'Adam uses bias correction: m̂ = m / (1 − β₁ᵗ). Why is this needed in
      early training (small t)?'
    qid: q57_1
    options:
    - letter: A
      text: To prevent the learning rate from growing too large
      is_correct: false
    - letter: B
      text: At t=1, m is initialised to 0, so without correction it's biased toward
        zero — correction rescales it to the true gradient estimate
      is_correct: true
    - letter: C
      text: To normalise gradients across layers
      is_correct: false
    - letter: D
      text: To make Adam equivalent to SGD in early training
      is_correct: false
    correct_fb: '✅ Correct! Both m and v are initialised to 0. At t=1 with β₁=0.9:
      m₁ = 0.9×0 + 0.1×g = 0.1g. But the true estimate should be g (the actual gradient).
      Dividing by (1−0.9¹) = 0.1 gives: m̂ = 0.1g/0.1 = g. The correction debiases
      the estimate. As t→∞, (1−β₁ᵗ)→1, so correction becomes negligible — Adam''s
      initialisation bias only matters in the first few steps.'
    wrong_fb: '❌ m and v start at 0. At step 1: m = 0.9×0 + 0.1×∇L = 0.1×∇L — biased
      low. Without correction, early steps take too-small updates because the "velocity"
      hasn''t built up. Dividing by (1−β₁ᵗ) debiases it back to the true gradient
      scale. This matters most in steps 1-10; after ~50 steps the correction approaches
      1 and becomes negligible.'
  - num_str: Q2 OF 3
    question: Your training loss curve oscillates wildly and doesn't decrease. What
      is the most likely learning rate setting?
    qid: q57_2
    options:
    - letter: A
      text: Learning rate too high — the optimizer is overshooting the minimum
      is_correct: true
    - letter: B
      text: Learning rate too low — the optimizer is taking too-small steps
      is_correct: false
    - letter: C
      text: Batch size too small — use larger batches
      is_correct: false
    - letter: D
      text: Too much regularization — reduce dropout rate
      is_correct: false
    correct_fb: '✅ Correct! Wild oscillation = LR too high. The optimizer is taking
      steps so large it keeps jumping over the minimum to the other side of the loss
      surface. Fix: reduce LR by 10×. If loss decreases slowly and smoothly → LR too
      low. Golden rule: start with Adam lr=1e-3, reduce by 10× if oscillating, increase
      by 10× if converging too slowly. The learning rate finder technique (fast.ai)
      plots loss vs LR to find the sweet spot.'
    wrong_fb: ❌ Wild oscillation = LR too high. Too-small LR causes slow, monotonic
      decrease. Too-large LR causes the optimizer to bounce back and forth across
      the minimum. Reduce your LR by 10x (e.g. from 0.01 to 0.001) and see if training
      stabilises.
  - num_str: Q3 OF 3
    question: Why is a learning rate warmup phase used at the start of training in
      large models like BERT and GPT?
    qid: q57_3
    options:
    - letter: A
      text: To prevent the loss from being too high initially
      is_correct: false
    - letter: B
      text: Early in training, gradient estimates are unreliable (few samples seen);
        a small LR prevents bad early updates from corrupting the initial random weights
      is_correct: true
    - letter: C
      text: To make the optimizer behave like SGD initially
      is_correct: false
    - letter: D
      text: GPU memory requires low LR during the first epoch
      is_correct: false
    correct_fb: ✅ Correct! At step 1, the model is randomly initialised and loss is
      very high. Gradients from early batches are high-variance estimates — the model
      has seen almost no data. A large LR would cause large, noisy weight updates
      that can destroy the initialisation. Warmup linearly increases LR from ~0 to
      peak over a few hundred steps, allowing the model to "stabilise" before taking
      large learning steps. Crucial for large transformers where bad initialisation
      is very hard to recover from.
    wrong_fb: ❌ Warmup exists because early gradient estimates are unreliable — with
      random initialisation and only a few mini-batches seen, gradients are high-variance.
      A large LR would amplify this noise. Warmup keeps LR tiny initially and ramps
      it up gradually as estimates stabilise. This is why LLM papers always specify
      warmup_steps as a key hyperparameter.
  flashcards:
  - front: Feedforward Networks?
    back: 'Information flows in one direction: input -&gt; hidden layers -&gt; output.
      No recurrent loops or backward cycles.'
  - front: Mathematical objective function measuring the discrepancy between model
      predictions ŷ and true labels y, optimized via gradient descent.
    back: Calculates loss function gradients w.r.t weights using the Chain Rule, propagating
      backward to update parameters.
  - front: ReLU Activation?
    back: f(x) = max(0, x). Solves vanishing gradient problem in deep networks; fast
      to compute and induces sparsity.
  - front: Vanishing Gradient?
    back: In deep networks, backpropagated gradients shrink exponentially in early
      layers, stopping weight updates.
  - front: Softmax Function?
    back: Converts raw score vectors (logits) into a probability distribution summing
      to 1. Used in multi-class output layers.
  gotcha:
    title: '⚠️ Gotcha: Cross-Entropy Loss Input Expectations'
    description: PyTorch's `nn.CrossEntropyLoss` expects raw logits as input and automatically
      applies Softmax. Do NOT pass Softmax outputs into it!
