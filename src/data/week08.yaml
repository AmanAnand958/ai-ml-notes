    \ Filters| Out[\"Output Activation 30x30x32\"]\n</div>\n<div class=\"diagram-cap\"\
    >\n       Convolution = sliding dot product. 896 params replaces 2.7M Dense params\n\
    \      </div>\n<h3 class=\"sh3\">\n       3. Full CNN Architecture &amp; Capstone\
    \ Code\n      </h3>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         python — cifar10_cnn_capstone.py\n        </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n         \
    \ copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> tensorflow <span class=\"kw\">as</span>\
    \ tf\n<span class=\"kw\">from</span> tensorflow.keras <span class=\"kw\">import</span>\
    \ layers, callbacks\n<span class=\"kw\">import</span> numpy <span class=\"kw\"\
    >as</span> np\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"\
    kw\">as</span> plt\n\n<span class=\"cm\"># ── 1. Load CIFAR-10 ──────────────────────────────────────</span>\n\
    (X_train, y_train), (X_test, y_test) = tf.keras.datasets.cifar10.<span class=\"\
    fn\">load_data</span>()\nCLASS_NAMES = [<span class=\"str\">'airplane'</span>,<span\
    \ class=\"str\">'automobile'</span>,<span class=\"str\">'bird'</span>,<span class=\"\
    str\">'cat'</span>,<span class=\"str\">'deer'</span>,\n               <span class=\"\
    str\">'dog'</span>,<span class=\"str\">'frog'</span>,<span class=\"str\">'horse'</span>,<span\
    \ class=\"str\">'ship'</span>,<span class=\"str\">'truck'</span>]\n\n<span class=\"\
    cm\"># Normalise + reshape labels</span>\nX_train = X_train.<span class=\"fn\"\
    >astype</span>(<span class=\"str\">'float32'</span>) / <span class=\"num\">255.0</span>\n\
    X_test  = X_test.<span class=\"fn\">astype</span>(<span class=\"str\">'float32'</span>)\
    \ / <span class=\"num\">255.0</span>\ny_train, y_test = y_train.<span class=\"\
    fn\">flatten</span>(), y_test.<span class=\"fn\">flatten</span>()\n\n<span class=\"\
    cm\"># ── 2. Data Augmentation (key for CIFAR-10 generalisation) ──</span>\ndata_augmentation\
    \ = tf.keras.<span class=\"fn\">Sequential</span>([\n    layers.<span class=\"\
    fn\">RandomFlip</span>(<span class=\"str\">'horizontal'</span>),\n    layers.<span\
    \ class=\"fn\">RandomRotation</span>(<span class=\"num\">0.1</span>),\n    layers.<span\
    \ class=\"fn\">RandomZoom</span>(<span class=\"num\">0.1</span>),\n    layers.<span\
    \ class=\"fn\">RandomTranslation</span>(<span class=\"num\">0.1</span>, <span\
    \ class=\"num\">0.1</span>),\n], name=<span class=\"str\">'augmentation'</span>)\n\
    \n<span class=\"cm\"># ── 3. CNN Architecture ──────────────────────────────────</span>\n\
    inputs = tf.keras.<span class=\"fn\">Input</span>(shape=(<span class=\"num\">32</span>,\
    \ <span class=\"num\">32</span>, <span class=\"num\">3</span>))\nx = <span class=\"\
    fn\">data_augmentation</span>(inputs)           <span class=\"cm\"># augmentation\
    \ only during training</span>\n\n<span class=\"cm\"># Block 1: 32 filters</span>\n\
    x = layers.<span class=\"fn\">Conv2D</span>(<span class=\"num\">32</span>, <span\
    \ class=\"num\">3</span>, padding=<span class=\"str\">'same'</span>)(x)\nx = layers.<span\
    \ class=\"fn\">BatchNormalization</span>()(x)\nx = layers.<span class=\"fn\">Activation</span>(<span\
    \ class=\"str\">'relu'</span>)(x)\nx = layers.<span class=\"fn\">Conv2D</span>(<span\
    \ class=\"num\">32</span>, <span class=\"num\">3</span>, padding=<span class=\"\
    str\">'same'</span>)(x)\nx = layers.<span class=\"fn\">BatchNormalization</span>()(x)\n\
    x = layers.<span class=\"fn\">Activation</span>(<span class=\"str\">'relu'</span>)(x)\n\
    x = layers.<span class=\"fn\">MaxPooling2D</span>(<span class=\"num\">2</span>)(x)\
    \            <span class=\"cm\"># 32×32 → 16×16</span>\nx = layers.<span class=\"\
    fn\">Dropout</span>(<span class=\"num\">0.25</span>)(x)\n\n<span class=\"cm\"\
    ># Block 2: 64 filters</span>\nx = layers.<span class=\"fn\">Conv2D</span>(<span\
    \ class=\"num\">64</span>, <span class=\"num\">3</span>, padding=<span class=\"\
    str\">'same'</span>)(x)\nx = layers.<span class=\"fn\">BatchNormalization</span>()(x)\n\
    x = layers.<span class=\"fn\">Activation</span>(<span class=\"str\">'relu'</span>)(x)\n\
    x = layers.<span class=\"fn\">Conv2D</span>(<span class=\"num\">64</span>, <span\
    \ class=\"num\">3</span>, padding=<span class=\"str\">'same'</span>)(x)\nx = layers.<span\
    \ class=\"fn\">BatchNormalization</span>()(x)\nx = layers.<span class=\"fn\">Activation</span>(<span\
    \ class=\"str\">'relu'</span>)(x)\nx = layers.<span class=\"fn\">MaxPooling2D</span>(<span\
    \ class=\"num\">2</span>)(x)            <span class=\"cm\"># 16×16 → 8×8</span>\n\
    x = layers.<span class=\"fn\">Dropout</span>(<span class=\"num\">0.25</span>)(x)\n\
    \n<span class=\"cm\"># Block 3: 128 filters</span>\nx = layers.<span class=\"\
    fn\">Conv2D</span>(<span class=\"num\">128</span>, <span class=\"num\">3</span>,\
    \ padding=<span class=\"str\">'same'</span>)(x)\nx = layers.<span class=\"fn\"\
    >BatchNormalization</span>()(x)\nx = layers.<span class=\"fn\">Activation</span>(<span\
    \ class=\"str\">'relu'</span>)(x)\nx = layers.<span class=\"fn\">MaxPooling2D</span>(<span\
    \ class=\"num\">2</span>)(x)            <span class=\"cm\"># 8×8 → 4×4</span>\n\
    x = layers.<span class=\"fn\">Dropout</span>(<span class=\"num\">0.25</span>)(x)\n\
    \n<span class=\"cm\"># Classifier head</span>\nx = layers.<span class=\"fn\">GlobalAveragePooling2D</span>()(x)\
    \   <span class=\"cm\"># 4×4×128 → 128 (no Flatten!)</span>\nx = layers.<span\
    \ class=\"fn\">Dense</span>(<span class=\"num\">256</span>, activation=<span class=\"\
    str\">'relu'</span>)(x)\nx = layers.<span class=\"fn\">Dropout</span>(<span class=\"\
    num\">0.5</span>)(x)\noutputs = layers.<span class=\"fn\">Dense</span>(<span class=\"\
    num\">10</span>, activation=<span class=\"str\">'softmax'</span>)(x)\n\nmodel\
    \ = tf.keras.<span class=\"fn\">Model</span>(inputs, outputs, name=<span class=\"\
    str\">'cifar10_cnn'</span>)\nmodel.<span class=\"fn\">summary</span>()\n\n<span\
    \ class=\"cm\"># ── 4. Compile ────────────────────────────────────────────</span>\n\
    lr_schedule = tf.keras.optimizers.schedules.<span class=\"fn\">CosineDecay</span>(\n\
    \    initial_learning_rate=<span class=\"num\">0.001</span>, decay_steps=<span\
    \ class=\"num\">50000</span>)\nmodel.<span class=\"fn\">compile</span>(\n    optimizer=tf.keras.optimizers.<span\
    \ class=\"fn\">Adam</span>(lr_schedule),\n    loss=<span class=\"str\">'sparse_categorical_crossentropy'</span>,\n\
    \    metrics=[<span class=\"str\">'accuracy'</span>]\n)\n\n<span class=\"cm\"\
    ># ── 5. Train ──────────────────────────────────────────────</span>\ncb_list\
    \ = [\n    callbacks.<span class=\"fn\">EarlyStopping</span>(monitor=<span class=\"\
    str\">'val_accuracy'</span>, patience=<span class=\"num\">10</span>,\n       \
    \                      restore_best_weights=<span class=\"kw\">True</span>),\n\
    \    callbacks.<span class=\"fn\">ModelCheckpoint</span>(<span class=\"str\">'best_cifar10.keras'</span>,\
    \ save_best_only=<span class=\"kw\">True</span>)\n]\nhistory = model.<span class=\"\
    fn\">fit</span>(X_train, y_train, epochs=<span class=\"num\">80</span>, batch_size=<span\
    \ class=\"num\">128</span>,\n                     validation_split=<span class=\"\
    num\">0.1</span>, callbacks=cb_list)\n\ntest_loss, test_acc = model.<span class=\"\
    fn\">evaluate</span>(X_test, y_test, verbose=<span class=\"num\">0</span>)\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"Test accuracy: {test_acc:.4f}\"\
    </span>)  <span class=\"cm\"># Target: ≥ 75%</span>\n\n<span class=\"cm\"># ──\
    \ 6. Visualise feature maps ────────────────────────────</span>\nfeature_extractor\
    \ = tf.keras.<span class=\"fn\">Model</span>(inputs=model.inputs,\n    outputs=model.<span\
    \ class=\"fn\">get_layer</span>(<span class=\"str\">'activation'</span>).output)\
    \  <span class=\"cm\"># first ReLU output</span>\nimg = X_test[<span class=\"\
    num\">0</span>:<span class=\"num\">1</span>]  <span class=\"cm\"># single image</span>\n\
    feature_maps = feature_extractor.<span class=\"fn\">predict</span>(img)  <span\
    \ class=\"cm\"># shape: (1, 32, 32, 32)</span>\n\nfig, axes = plt.<span class=\"\
    fn\">subplots</span>(<span class=\"num\">4</span>, <span class=\"num\">8</span>,\
    \ figsize=(<span class=\"num\">16</span>, <span class=\"num\">8</span>))\n<span\
    \ class=\"kw\">for</span> i, ax <span class=\"kw\">in</span> <span class=\"fn\"\
    >enumerate</span>(axes.flat):\n    ax.<span class=\"fn\">imshow</span>(feature_maps[<span\
    \ class=\"num\">0</span>, :, :, i], cmap=<span class=\"str\">'viridis'</span>)\n\
    \    ax.<span class=\"fn\">axis</span>(<span class=\"str\">'off'</span>)\nplt.<span\
    \ class=\"fn\">suptitle</span>(<span class=\"str\">'Conv Layer 1 — 32 Feature\
    \ Maps'</span>)\nplt.<span class=\"fn\">tight_layout</span>(); plt.<span class=\"\
    fn\">savefig</span>(<span class=\"str\">'feature_maps.png'</span>)</pre>\n</div>\n\
    <h3 class=\"sh3\">\n       4. Flask API — Serve Your Model\n      </h3>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\
    \ — app.py (Flask API)\n        </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n \
    \         Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">from</span>\
    \ flask <span class=\"kw\">import</span> Flask, request, jsonify\n<span class=\"\
    kw\">import</span> tensorflow <span class=\"kw\">as</span> tf\n<span class=\"\
    kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">from</span>\
    \ PIL <span class=\"kw\">import</span> Image\n<span class=\"kw\">import</span>\
    \ io\n\napp = <span class=\"fn\">Flask</span>(__name__)\nmodel = tf.keras.models.<span\
    \ class=\"fn\">load_model</span>(<span class=\"str\">'best_cifar10.keras'</span>)\n\
    CLASS_NAMES = [<span class=\"str\">'airplane'</span>,<span class=\"str\">'automobile'</span>,<span\
    \ class=\"str\">'bird'</span>,<span class=\"str\">'cat'</span>,<span class=\"\
    str\">'deer'</span>,\n               <span class=\"str\">'dog'</span>,<span class=\"\
    str\">'frog'</span>,<span class=\"str\">'horse'</span>,<span class=\"str\">'ship'</span>,<span\
    \ class=\"str\">'truck'</span>]\n\n@app.<span class=\"fn\">route</span>(<span\
    \ class=\"str\">'/predict'</span>, methods=[<span class=\"str\">'POST'</span>])\n\
    <span class=\"kw\">def</span> <span class=\"fn\">predict</span>():\n    <span\
    \ class=\"kw\">if</span> <span class=\"str\">'file'</span> <span class=\"kw\"\
    >not</span> <span class=\"kw\">in</span> request.files:\n        <span class=\"\
    kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"str\">'error'</span>:\
    \ <span class=\"str\">'No file'</span>}), <span class=\"num\">400</span>\n   \
    \ img = Image.<span class=\"fn\">open</span>(request.files[<span class=\"str\"\
    >'file'</span>]).<span class=\"fn\">convert</span>(<span class=\"str\">'RGB'</span>).\\\
    \n                <span class=\"fn\">resize</span>((<span class=\"num\">32</span>,\
    \ <span class=\"num\">32</span>))\n    arr = np.<span class=\"fn\">array</span>(img,\
    \ dtype=<span class=\"str\">'float32'</span>) / <span class=\"num\">255.0</span>\n\
    \    arr = np.<span class=\"fn\">expand_dims</span>(arr, axis=<span class=\"num\"\
    >0</span>)   <span class=\"cm\"># (1, 32, 32, 3)</span>\n    probs = model.<span\
    \ class=\"fn\">predict</span>(arr)[<span class=\"num\">0</span>]\n    top3 = np.<span\
    \ class=\"fn\">argsort</span>(probs)[::-<span class=\"num\">1</span>][:<span class=\"\
    num\">3</span>]\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({\n\
    \        <span class=\"str\">'prediction'</span>: CLASS_NAMES[top3[<span class=\"\
    num\">0</span>]],\n        <span class=\"str\">'confidence'</span>: <span class=\"\
    fn\">float</span>(probs[top3[<span class=\"num\">0</span>]]),\n        <span class=\"\
