- id: '56'
  day_num: 56
  title: Regularization in Deep Learning
  subtitle: Deep networks have millions of parameters and will overfit if you let
    them.Regularizationis the set of techniques that prevent a model from memorising
    training data. Today you master Dropout, Batch Normalisation, L1/L2 weight decay,
    and Early Stopping — the four pillars of generalisation in deep learning.
  time_estimate: 5 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Explain how Dropout works and why it prevents co-adaptation of neurons
  - Implement and interpret Batch Normalisation in a Keras model
  - Apply L1 and L2 regularization and describe their effect on weight distributions
  - Diagnose overfitting from training curves and choose the right regulariser
  - 'State the correct order: Dense → BatchNorm → Activation → Dropout'
  checklist:
  - id: chk_56_1
    text: Study the core mathematical and architectural principles of Regularization
      in Deep Learning
  - id: chk_56_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_56_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_56_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - The Perceptron & Biologic
  - Activation Functions & Fo
  - Backpropagation & Gradien
  - Keras & TensorFlow — Buil
  - Regularization in Deep Le
  - Optimizers & Learning Rat
  - Week 8 Capstone — From De
  hinglish: 'Batch Normalization: har layer ke output ko normalize karo. Ye higher
    learning rates allow karta hai, training stable banata hai, aur regularization
    bhi karta hai!'
  analogy: 'Socho ek cricket team hai jahan practice mein random random players ko
    rest dete hain. Isse kya hoga? Koi bhi ek player "star" nahi ban sakta jo team
    akele jeetaye — har player ko independent hona padega. Yahi karta hai Dropout:
    training mein randomly neurons ko "off" karta hai (p=0.2 means 20% neurons off),
    taaki baaki neurons independently useful features sikhein.'
  theory_html: "<h3 class=\"sh3\">\n       1. Dropout — Ensemble Learning for Free\n\
    \      </h3>\n\n<div class=\"math-block\">\n<span class=\"formula\">\n       \
    \ $$Dropout mask: rⁱ ~ Bernoulli(1−p) where p = dropout rate$$\n       </span>\n\
    <span class=\"desc\">\n        Each neuron is kept with probability (1−p). Dropped\
    \ neurons output 0 and receive no gradient.\n       </span>\n<span class=\"formula\"\
    >\n        $$Training: Ãˡ = (rˡ ⊙ Aˡ) / (1−p)$$\n       </span>\n<span class=\"\
    desc\">\n        Scale kept neurons up by 1/(1-p) to keep expected output the\
    \ same (inverted dropout).\n       </span>\n<span class=\"formula\">\n       \
    \ $$Inference: No dropout — all neurons active, no scaling needed$$\n       </span>\n\
    <span class=\"desc\">\n        The scaling during training ensures the inference\
    \ path requires no changes.\n       </span>\n</div>\n<h3 class=\"sh3\">\n    \
    \   2. Batch Normalisation — Fixing the \"Covariate Shift\" Problem\n      </h3>\n\
    <p>\n       As training progresses, the distribution of each layer's inputs changes\
    \ because the previous layer's weights change. This is called\n       <strong>\n\
    \        internal covariate shift\n       </strong>\n       . BatchNorm fixes\
    \ this by normalising the layer's input to zero mean and unit variance, then learning\
    \ a scale (γ) and shift (β).\n      </p>\n<div class=\"math-block\">\n<span class=\"\
    formula\">\n        $$\\mu_B = \\frac{1}{m} \\sum_{i=1}^{m} z_i, \\quad \\sigma^2_B\
    \ = \\frac{1}{m} \\sum_{i=1}^{m} (z_i - \\mu_B)^2$$\n       </span>\n<span class=\"\
    desc\">\n        Compute batch mean and variance for each feature\n       </span>\n\
    <span class=\"formula\">\n        $$\\hat{z}_i = \\frac{z_i - \\mu_B}{\\sqrt{\\\
    sigma^2_B + \\epsilon}}$$\n       </span>\n<span class=\"desc\">\n        Normalise.\
    \ ε=1e-5 for numerical stability.\n       </span>\n<span class=\"formula\">\n\
    \        $$yᵢ = γ ẑᵢ + β   (γ and β are learnable parameters)$$\n       </span>\n\
    <span class=\"desc\">\n        Scale and shift — the network can \"undo\" normalisation\
    \ if needed. γ and β are learned via backprop.\n       </span>\n</div>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — regularisation_comparison.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> tensorflow\
    \ <span class=\"kw\">as</span> tf\n<span class=\"kw\">from</span> tensorflow.keras\
    \ <span class=\"kw\">import</span> layers, regularizers\n\n<span class=\"kw\"\
    >def</span> <span class=\"fn\">build_model</span>(use_dropout=<span class=\"kw\"\
    >False</span>, use_batchnorm=<span class=\"kw\">False</span>,\n              \
    \ l2_reg=<span class=\"kw\">None</span>, dropout_rate=<span class=\"num\">0.3</span>):\n\
    \    model = tf.keras.<span class=\"fn\">Sequential</span>()\n    model.<span\
    \ class=\"fn\">add</span>(layers.<span class=\"fn\">Flatten</span>(input_shape=(<span\
    \ class=\"num\">28</span>,<span class=\"num\">28</span>)))\n\n    <span class=\"\
    kw\">for</span> units <span class=\"kw\">in</span> [<span class=\"num\">512</span>,\
    \ <span class=\"num\">256</span>, <span class=\"num\">128</span>]:\n        l2\
    \ = regularizers.<span class=\"fn\">l2</span>(<span class=\"num\">0.001</span>)\
    \ <span class=\"kw\">if</span> l2_reg <span class=\"kw\">else</span> <span class=\"\
    kw\">None</span>\n        model.<span class=\"fn\">add</span>(layers.<span class=\"\
    fn\">Dense</span>(units, kernel_regularizer=l2))\n\n        <span class=\"cm\"\
    ># Correct order: Dense → BatchNorm → Activation → Dropout</span>\n        <span\
    \ class=\"kw\">if</span> use_batchnorm:\n            model.<span class=\"fn\"\
    >add</span>(layers.<span class=\"fn\">BatchNormalization</span>())\n        model.<span\
    \ class=\"fn\">add</span>(layers.<span class=\"fn\">Activation</span>(<span class=\"\
    str\">'relu'</span>))\n        <span class=\"kw\">if</span> use_dropout:\n   \
    \         model.<span class=\"fn\">add</span>(layers.<span class=\"fn\">Dropout</span>(dropout_rate))\n\
    \n    model.<span class=\"fn\">add</span>(layers.<span class=\"fn\">Dense</span>(<span\
    \ class=\"num\">10</span>, activation=<span class=\"str\">'softmax'</span>))\n\
    \    model.<span class=\"fn\">compile</span>(optimizer=<span class=\"str\">'adam'</span>,\n\
    \                  loss=<span class=\"str\">'sparse_categorical_crossentropy'</span>,\n\
    \                  metrics=[<span class=\"str\">'accuracy'</span>])\n    <span\
    \ class=\"kw\">return</span> model\n\n<span class=\"cm\"># ── Compare 4 configurations\
    \ ──────────────────────────────</span>\nconfigs = {\n    <span class=\"str\"\
    >'Baseline'</span>:          <span class=\"fn\">build_model</span>(),\n    <span\
    \ class=\"str\">'Dropout(0.3)'</span>:      <span class=\"fn\">build_model</span>(use_dropout=<span\
    \ class=\"kw\">True</span>),\n    <span class=\"str\">'BatchNorm'</span>:    \
    \     <span class=\"fn\">build_model</span>(use_batchnorm=<span class=\"kw\">True</span>),\n\
    \    <span class=\"str\">'Dropout+BatchNorm'</span>: <span class=\"fn\">build_model</span>(use_dropout=<span\
    \ class=\"kw\">True</span>, use_batchnorm=<span class=\"kw\">True</span>),\n}\n\
    \n<span class=\"cm\"># Load Fashion-MNIST</span>\n(X_tr, y_tr), (X_te, y_te) =\
    \ tf.keras.datasets.fashion_mnist.<span class=\"fn\">load_data</span>()\nX_tr,\
    \ X_te = X_tr / <span class=\"num\">255.0</span>, X_te / <span class=\"num\">255.0</span>\n\
    \nresults = {}\n<span class=\"kw\">for</span> name, model <span class=\"kw\">in</span>\
    \ configs.<span class=\"fn\">items</span>():\n    <span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"\\nTraining: {name}\"</span>)\n    history = model.<span class=\"\
    fn\">fit</span>(X_tr, y_tr, epochs=<span class=\"num\">20</span>, batch_size=<span\
    \ class=\"num\">256</span>,\n                         validation_split=<span class=\"\
    num\">0.1</span>, verbose=<span class=\"num\">0</span>)\n    _, test_acc = model.<span\
    \ class=\"fn\">evaluate</span>(X_te, y_te, verbose=<span class=\"num\">0</span>)\n\
    \    train_acc = history.history[<span class=\"str\">'accuracy'</span>][-<span\
    \ class=\"num\">1</span>]\n    results[name] = {<span class=\"str\">'train'</span>:\
    \ train_acc, <span class=\"str\">'test'</span>: test_acc,\n                  \
    \   <span class=\"str\">'gap'</span>: train_acc - test_acc}\n    <span class=\"\
    fn\">print</span>(<span class=\"str\">f\"  Train: {train_acc:.4f} | Test: {test_acc:.4f}\
    \ | Gap: {train_acc-test_acc:.4f}\"</span>)\n\n<span class=\"cm\"># The model\
    \ with smallest train-test gap has best generalisation</span></pre>\n</div>\n\
    <div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"\
    ><table class=\"concept-table\">\n<tr>\n<th>\n         TECHNIQUE\n        </th>\n\
    <th>\n         WHAT IT DOES\n        </th>\n<th>\n         WHEN TO USE\n     \
    \   </th>\n<th>\n         TYPICAL SETTING\n        </th>\n</tr>\n<tr>\n<td>\n\
    <strong>\n          L2 (Weight Decay)\n         </strong>\n</td>\n<td>\n     \
    \    Penalises large weights → pushes them toward zero\n        </td>\n<td>\n\
    \         Always — safe default\n        </td>\n<td>\n         lambda=0.0001–0.001\n\
    \        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          L1\n         </strong>\n\
    </td>\n<td>\n         Produces sparse weights (many exactly zero)\n        </td>\n\
    <td>\n         Feature selection needed\n        </td>\n<td>\n         lambda=0.0001\n\
    \        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          Dropout\n         </strong>\n\
    </td>\n<td>\n         Randomly deactivates neurons → prevents co-adaptation\n\
    \        </td>\n<td>\n         Dense layers in large nets\n        </td>\n<td>\n\
    \         rate=0.2–0.5\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n         \
    \ BatchNorm\n         </strong>\n</td>\n<td>\n         Normalises layer inputs\
    \ → faster training, regularization\n        </td>\n<td>\n         Deep nets (≥4\
    \ layers)\n        </td>\n<td>\n         After Dense, before activation\n    \
    \    </td>\n</tr>\n<tr>\n<td>\n<strong>\n          Early Stopping\n         </strong>\n\
