  quizzes:
  - num_str: Q1 OF 3
    question: At inference time, you must turn off Dropout. In Keras, this is handled
      automatically. But why do you still need to scale neuron outputs if you're doing
      it manually?
    qid: q56_1
    options:
    - letter: A
      text: To compensate for the missing neurons
      is_correct: false
    - letter: B
      text: Inverted dropout already scales during training, so inference requires
        no change — Keras uses inverted dropout by default
      is_correct: true
    - letter: C
      text: To increase the effective learning rate
      is_correct: false
    - letter: D
      text: Scaling is needed because BatchNorm statistics change at inference
      is_correct: false
    correct_fb: '✅ Correct! Keras uses inverted dropout: during training, kept neuron
      outputs are divided by (1-p) to maintain the expected activation magnitude.
      Since training already compensates, the inference path uses all neurons with
      NO scaling — it''s just a pass-through. The alternative (non-inverted dropout)
      scales at inference instead, which is less clean because it requires modifying
      the inference graph.'
    wrong_fb: '❌ Keras uses inverted dropout. During training: activated outputs are
      divided by (1-p) to keep expected values correct. At inference: no dropout AND
      no scaling. The training-time scaling already accounts for the difference. This
      makes inference code identical whether dropout is used or not.'
  - num_str: Q2 OF 3
    question: What does L2 regularization do to the weight update rule? (λ is the
      regularization coefficient)
    qid: q56_2
    options:
    - letter: A
      text: It adds λ to the loss directly
      is_correct: false
    - letter: B
      text: It adds (λ × w) to the gradient, causing weights to decay toward zero
        each update
      is_correct: true
    - letter: C
      text: It clips gradients to a maximum value of λ
      is_correct: false
    - letter: D
      text: It multiplies all weights by (1-λ) after each epoch
      is_correct: false
    correct_fb: '✅ Correct! L2 adds (λ/2)Σwᵢ² to the loss. Taking the gradient: ∂L_total/∂w
      = ∂L/∂w + λw. The update becomes: w ← w − η(∂L/∂w + λw) = w(1 − ηλ) − η∂L/∂w.
      The (1−ηλ) factor is the "weight decay" — each step shrinks weights slightly
      toward zero. Large weights get penalised more, discouraging the network from
      relying heavily on any single feature.'
    wrong_fb: '❌ L2 regularization adds (λ/2)‖w‖² to the loss. The gradient of this
      term is λw. So the weight update becomes: w ← w − η(∂L/∂w) − ηλw = w(1−ηλ) −
      η∂L/∂w. This is called weight decay — each update shrinks the weight slightly,
      preventing any weight from growing very large.'
  - num_str: Q3 OF 3
    question: Why does Batch Normalisation act as a regulariser, even though that's
      not its primary purpose?
    qid: q56_3
    options:
    - letter: A
      text: Each mini-batch has different statistics, adding noise to the normalisation
        — this noise acts like regularization
      is_correct: true
    - letter: B
      text: It sets some weights to zero like Dropout
      is_correct: false
    - letter: C
      text: It adds an explicit L2 penalty term to the loss
      is_correct: false
    - letter: D
      text: It prevents the learning rate from increasing
      is_correct: false
    correct_fb: '✅ Correct! BatchNorm computes statistics (mean, variance) over each
      mini-batch. Different mini-batches have slightly different statistics, introducing
      noise into the normalisation. This stochasticity acts like a mild regulariser
      — the model can''t rely on exact activation values. This is why networks with
      BatchNorm sometimes don''t need Dropout. (Note: With very large batch sizes,
      this effect diminishes.)'
    wrong_fb: ❌ BatchNorm's regularization effect comes from the noise in per-mini-batch
      statistics. Each batch's mean and variance slightly differ, so the same sample
      is normalised differently depending on what batch it's in. This unpredictability
      prevents the model from memorising exact activation values.
  flashcards:
  - front: Feedforward Networks?
    back: 'Information flows in one direction: input -&gt; hidden layers -&gt; output.
      No recurrent loops or backward cycles.'
  - front: Mathematical objective function measuring the discrepancy between model
      predictions ŷ and true labels y, optimized via gradient descent.
    back: Calculates loss function gradients w.r.t weights using the Chain Rule, propagating
      backward to update parameters.
  - front: ReLU Activation?
    back: f(x) = max(0, x). Solves vanishing gradient problem in deep networks; fast
      to compute and induces sparsity.
  - front: Vanishing Gradient?
    back: In deep networks, backpropagated gradients shrink exponentially in early
      layers, stopping weight updates.
  - front: Softmax Function?
    back: Converts raw score vectors (logits) into a probability distribution summing
      to 1. Used in multi-class output layers.
  gotcha:
    title: '⚠️ Gotcha: Cross-Entropy Loss Input Expectations'
    description: PyTorch's `nn.CrossEntropyLoss` expects raw logits as input and automatically
      applies Softmax. Do NOT pass Softmax outputs into it!
