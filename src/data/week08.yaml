- id: '57'
  day_num: 57
  title: Optimizers & Learning Rate Schedules
  subtitle: Vanilla gradient descent is like descending a mountain with a fixed stride
    — too large and you overshoot, too small and you never arrive. Modern optimizers
    adaptively adjust the step size per parameter. Today you master Adam, RMSProp,
    SGD with momentum — and the learning rate schedule strategies that give the final
    1–2% accuracy boost.
  time_estimate: 4 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Explain how Adam combines momentum and RMSProp with bias correction
  - Implement SGD with momentum from scratch and contrast with Adam
  - Apply cosine annealing, step decay, and warmup schedules in Keras
  - State when to use Adam vs SGD with momentum and why
  - Diagnose learning rate problems from training loss curves
  checklist:
  - id: chk_57_1
    text: Study the core mathematical and architectural principles of Optimizers &
      Learning Rate Schedules
  - id: chk_57_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_57_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_57_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - The Perceptron & Biologic
  - Activation Functions & Fo
  - Backpropagation & Gradien
  - Keras & TensorFlow — Buil
  - Regularization in Deep Le
  - Optimizers & Learning Rat
  - Week 8 Capstone — From De
  hinglish: Vanishing gradient deep networks mein bada problem tha. Residual connections
    (ResNet) ne is problem ko solve kiya — direct path se gradient flow karta hai
    back through the network!
  analogy: 'Socho tum ek ball ko pahaad se neeche roll kar rahe ho (gradient descent).
    Vanilla SGD: har step mein tum ball ko push karte ho, chahe koi bhi direction
    ho. Momentum: ball apni velocity maintain karta hai — consistent direction mein
    tezi se jaata hai, fluctuating directions mein slow. Adam: ek smart ball jo har
    direction mein alag speed maintain karta hai — jo direction mein consistent gradient
    hai, wahan tez; jo mein noisy hai, wahan slow.'
  theory_html: "<h3 class=\"sh3\">\n       1. The Optimizer Zoo\n      </h3>\n<div\
    \ class=\"math-block\">\n<span class=\"formula\">\n        $$Vanilla SGD: w ←\
    \ w − η ∇L(w)$$\n       </span>\n<span class=\"desc\">\n        Same learning\
    \ rate for all parameters. No memory of previous gradients.\n       </span>\n\
    <span class=\"formula\">\n        $$SGD + Momentum: v ← β·v + (1−β)·∇L; w ← w\
    \ − η·v$$\n       </span>\n<span class=\"desc\">\n        β≈0.9. Accumulates velocity\
    \ in consistent gradient directions. Dampens oscillations.\n       </span>\n<span\
    \ class=\"formula\">\n        $$s \\leftarrow \\beta s + (1-\\beta)(\\nabla L)^2,\
    \ \\quad w \\leftarrow w - \\frac{\\eta \\nabla L}{\\sqrt{s} + \\epsilon}$$\n\
    \       </span>\n<span class=\"desc\">\n        Adapts LR per parameter — divides\
    \ by RMS of recent gradients. Good for non-stationary problems.\n       </span>\n\
    <span class=\"formula\">\n        $$Adam: m ← β₁m + (1−β₁)∇L; v ← β₂v + (1−β₂)(∇L)²$$\n\
    \       </span>\n<span class=\"desc\">\n        First moment (momentum) + second\
    \ moment (RMSProp). With bias correction: m̂=m/(1−β₁ᵗ), v̂=v/(1−β₂ᵗ)\n       </span>\n\
    <span class=\"formula\">\n        $$w \\leftarrow w - \\frac{\\eta \\hat{m}}{\\\
    sqrt{\\hat{v}} + \\epsilon}$$\n       </span>\n<span class=\"desc\">\n       \
    \ Defaults: β₁=0.9, β₂=0.999, ε=1e-8, η=0.001. Rarely needs tuning — the \"it\
    \ just works\" optimizer.\n       </span>\n</div>\n\n<div class=\"table-wrap\"\
    \ style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\"\
    >\n<tr>\n<th>\n         OPTIMIZER\n        </th>\n<th>\n         ADAPTIVE LR?\n\
    \        </th>\n<th>\n         MEMORY\n        </th>\n<th>\n         BEST FOR\n\
    \        </th>\n<th>\n         TYPICAL LR\n        </th>\n</tr>\n<tr>\n<td>\n\
    <strong>\n          SGD\n         </strong>\n</td>\n<td>\n         No\n      \
    \  </td>\n<td>\n         None\n        </td>\n<td>\n         Convex problems,\
    \ when you want full control\n        </td>\n<td>\n         0.01–0.1\n       \
    \ </td>\n</tr>\n<tr>\n<td>\n<strong>\n          SGD+Momentum\n         </strong>\n\
    </td>\n<td>\n         No\n        </td>\n<td>\n         1st moment\n        </td>\n\
    <td>\n         CNNs, training from scratch with tuned LR\n        </td>\n<td>\n\
    \         0.01, β=0.9\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          RMSProp\n\
    \         </strong>\n</td>\n<td>\n         Yes (2nd)\n        </td>\n<td>\n  \
    \       2nd moment\n        </td>\n<td>\n         RNNs, non-stationary problems\n\
    \        </td>\n<td>\n         0.001\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n\
    \          Adam\n         </strong>\n</td>\n<td>\n         Yes (both)\n      \
    \  </td>\n<td>\n         1st+2nd\n        </td>\n<td>\n         Default for most\
    \ tasks — dense nets, transformers\n        </td>\n<td>\n         0.001\n    \
    \    </td>\n</tr>\n<tr>\n<td>\n<strong>\n          AdamW\n         </strong>\n\
    </td>\n<td>\n         Yes (both)\n        </td>\n<td>\n         1st+2nd\n    \
    \    </td>\n<td>\n         Transformers, BERT/GPT fine-tuning\n        </td>\n\
    <td>\n         1e-4–5e-5\n        </td>\n</tr>\n</table></div>\n<h3 class=\"sh3\"\
    >\n       2. Learning Rate Schedules\n      </h3><p style=\"margin: 0.8rem 0;\
    \ font-size: 13.5px; line-height: 1.6;\">Dynamically adjusting the learning rate\
    \ $\\eta_t$ throughout training prevents premature convergence in local minima\
    \ and stabilizes late-stage parameter optimization. Standard strategies combine\
    \ linear warmup with cosine annealing or ReduceLROnPlateau decay.</p>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — lr_schedules.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> tensorflow\
    \ <span class=\"kw\">as</span> tf\n<span class=\"kw\">from</span> tensorflow.keras\
    \ <span class=\"kw\">import</span> callbacks\n\n<span class=\"cm\"># ── 1. Step\
    \ Decay ─────────────────────────────────────────</span>\n<span class=\"cm\">#\
    \ LR halves every 10 epochs</span>\nstep_decay = tf.keras.optimizers.schedules.<span\
    \ class=\"fn\">ExponentialDecay</span>(\n    initial_learning_rate=<span class=\"\
    num\">0.01</span>,\n    decay_steps=<span class=\"num\">10000</span>,\n    decay_rate=<span\
    \ class=\"num\">0.5</span>,\n    staircase=<span class=\"kw\">True</span>  <span\
    \ class=\"cm\"># staircase=True → step decay (not smooth)</span>\n)\n\n<span class=\"\
    cm\"># ── 2. Cosine Annealing ───────────────────────────────────</span>\n<span\
    \ class=\"cm\"># LR follows a cosine curve from max to min — best for final convergence</span>\n\
    cosine = tf.keras.optimizers.schedules.<span class=\"fn\">CosineDecay</span>(\n\
    \    initial_learning_rate=<span class=\"num\">0.001</span>,\n    decay_steps=<span\
    \ class=\"num\">50000</span>,\n    alpha=<span class=\"num\">1e-6</span>  <span\
    \ class=\"cm\"># minimum LR</span>\n)\n\n<span class=\"cm\"># ── 3. Warmup + Cosine\
    \ (used in BERT, ViT, GPT training) ─</span>\n<span class=\"kw\">class</span>\
    \ <span class=\"cls\">WarmupCosineSchedule</span>(tf.keras.optimizers.schedules.LearningRateSchedule):\n\
    \    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"\
    kw\">self</span>, peak_lr, warmup_steps, total_steps):\n        <span class=\"\
    kw\">self</span>.peak_lr = peak_lr\n        <span class=\"kw\">self</span>.warmup_steps\
    \ = warmup_steps\n        <span class=\"kw\">self</span>.total_steps = total_steps\n\
    \n    <span class=\"kw\">def</span> <span class=\"fn\">__call__</span>(<span class=\"\
    kw\">self</span>, step):\n        step = tf.<span class=\"fn\">cast</span>(step,\
    \ tf.float32)\n        warmup = <span class=\"kw\">self</span>.peak_lr * (step\
    \ / <span class=\"kw\">self</span>.warmup_steps)\n        cosine_steps = <span\
    \ class=\"kw\">self</span>.total_steps - <span class=\"kw\">self</span>.warmup_steps\n\
    \        cosine_progress = (step - <span class=\"kw\">self</span>.warmup_steps)\
    \ / cosine_steps\n        cos_lr = <span class=\"kw\">self</span>.peak_lr * <span\
    \ class=\"num\">0.5</span> * (<span class=\"num\">1</span> + tf.<span class=\"\
    fn\">cos</span>(tf.<span class=\"fn\">constant</span>(<span class=\"num\">3.14159</span>)\
    \ * cosine_progress))\n        <span class=\"kw\">return</span> tf.<span class=\"\
    fn\">where</span>(step &lt; <span class=\"kw\">self</span>.warmup_steps, warmup,\
    \ cos_lr)\n\n<span class=\"cm\"># ── 4. ReduceLROnPlateau (reactive, not scheduled)\
    \ ────────</span>\nreduce_lr = callbacks.<span class=\"fn\">ReduceLROnPlateau</span>(\n\
    \    monitor=<span class=\"str\">'val_loss'</span>,\n    factor=<span class=\"\
    num\">0.5</span>,         <span class=\"cm\"># multiply LR by 0.5 on plateau</span>\n\
    \    patience=<span class=\"num\">3</span>,         <span class=\"cm\"># wait\
    \ 3 epochs with no improvement</span>\n    min_lr=<span class=\"num\">1e-7</span>,\n\
    \    verbose=<span class=\"num\">1</span>\n)\n\n<span class=\"cm\"># ── Usage\
    \ ─────────────────────────────────────────────────</span>\noptimizer = tf.keras.optimizers.<span\
    \ class=\"fn\">Adam</span>(learning_rate=cosine)\nmodel.<span class=\"fn\">compile</span>(optimizer=optimizer,\
    \ loss=<span class=\"str\">'sparse_categorical_crossentropy'</span>,\n       \
    \       metrics=[<span class=\"str\">'accuracy'</span>])\n<span class=\"cm\">#\
    \ Or use ReduceLROnPlateau as a callback in model.fit()</span></pre>\n</div>\n\
    <div class=\"interview\">\n<strong>\n        Common interview question: \"Why\
    \ use Adam over SGD?\"\n       </strong>\n<br/>\n<br/>\n<strong>\n        Nuanced\
    \ answer:\n       </strong>\n       Adam converges faster with less LR tuning,\
    \ making it great for experimentation. However, some research shows that carefully\
    \ tuned SGD+Momentum can achieve slightly better generalisation than Adam, especially\
    \ for image classification with CNNs (see \"Closing the Generalisation Gap\" paper).\
    \ In practice: use Adam to get results fast, consider SGD+Momentum with cosine\
    \ annealing when squeezing out the last 0.5% accuracy. For transformers and LLMs,\
    \ AdamW is the standard — Adam with proper weight decay decoupled from the adaptive\
    \ update.\n      </div>\n<!-- /theory -->"
