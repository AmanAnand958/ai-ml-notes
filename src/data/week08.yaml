  quizzes:
  - num_str: Q1 OF 3
    question: A perceptron trained on a dataset fails to converge after 10,000 epochs.
      What is the most likely cause?
    qid: q52_1
    options:
    - letter: A
      text: The learning rate is too high
      is_correct: false
    - letter: B
      text: The data is not linearly separable
      is_correct: true
    - letter: C
      text: The weights were initialised to zero
      is_correct: false
    - letter: D
      text: The bias term is missing
      is_correct: false
    correct_fb: ✅ Correct! The Perceptron Convergence Theorem guarantees convergence
      IF and ONLY IF the data is linearly separable. If it doesn't converge, the most
      likely cause is non-linearly separable data — no straight line exists that separates
      the classes. The solution is a multi-layer network.
    wrong_fb: ❌ While learning rate and initialisation affect training speed, a perceptron
      that never converges after many epochs is almost certainly dealing with non-linearly
      separable data. The Perceptron Convergence Theorem is a mathematical proof —
      it will always converge on linearly separable data.
  - num_str: Q2 OF 3
    question: In the perceptron update rule wᵢ ← wᵢ + η(y − ŷ)xᵢ, what happens to
      the weights when the prediction is correct (y = ŷ)?
    qid: q52_2
    options:
    - letter: A
      text: Weights increase by ηxᵢ
      is_correct: false
    - letter: B
      text: Weights decrease by ηxᵢ
      is_correct: false
    - letter: C
      text: Weights don't change — the update is zero
      is_correct: true
    - letter: D
      text: Weights are reset to zero
      is_correct: false
    correct_fb: ✅ Correct! When y = ŷ, (y − ŷ) = 0, so the entire update term = 0.
      The perceptron only learns from mistakes. This is fundamentally different from
      gradient descent in modern neural networks, which computes updates over all
      samples (including correctly classified ones) using the loss function gradient.
    wrong_fb: '❌ When y = ŷ, (y − ŷ) = 0. Multiplying that by ηxᵢ gives zero — so
      weights are unchanged. The perceptron is an error-driven learner: it only updates
      when it makes a mistake.'
  - num_str: Q3 OF 3
    question: What fundamental architectural change allows a Multi-Layer Perceptron
      to solve XOR when a single perceptron cannot?
    qid: q52_3
    options:
    - letter: A
      text: Using a different learning rate
      is_correct: false
    - letter: B
      text: Using more training epochs
      is_correct: false
    - letter: C
      text: Hidden layers learn new feature representations that make the problem
        linearly separable
      is_correct: true
    - letter: D
      text: Replacing the step function with a smoother one
      is_correct: false
    correct_fb: '✅ Correct! Hidden layers transform the input space into a new representation.
      For XOR, the hidden layer effectively computes OR(x1,x2) and NAND(x1,x2) — two
      new features in which the problem IS linearly separable. This is the universal
      approximation theorem''s foundation: deep networks can represent arbitrarily
      complex functions by learning hierarchical features.'
    wrong_fb: ❌ The key insight is representation learning. Hidden layers don't just
      compute — they transform the feature space into a new one where the problem
      becomes linearly separable. The output layer then applies a simple linear separator
      in this learned space. This is the "deep" in deep learning.
  flashcards:
  - front: Feedforward Networks?
    back: 'Information flows in one direction: input -&gt; hidden layers -&gt; output.
      No recurrent loops or backward cycles.'
  - front: Mathematical objective function measuring the discrepancy between model
      predictions ŷ and true labels y, optimized via gradient descent.
    back: Calculates loss function gradients w.r.t weights using the Chain Rule, propagating
      backward to update parameters.
  - front: ReLU Activation?
    back: f(x) = max(0, x). Solves vanishing gradient problem in deep networks; fast
      to compute and induces sparsity.
  - front: Vanishing Gradient?
    back: In deep networks, backpropagated gradients shrink exponentially in early
      layers, stopping weight updates.
  - front: Softmax Function?
    back: Converts raw score vectors (logits) into a probability distribution summing
      to 1. Used in multi-class output layers.
  gotcha:
    title: '⚠️ Gotcha: Cross-Entropy Loss Input Expectations'
    description: PyTorch's `nn.CrossEntropyLoss` expects raw logits as input and automatically
      applies Softmax. Do NOT pass Softmax outputs into it!
  takeaways:
    hinglish_line: "<strong>\n         Ek line mein:\n        </strong>\n        Perceptron\
      \ ek artificial neuron hai jo weights ka weighted sum karke aur step function\
      \ lagakar binary prediction deta hai."
    bullets:
    - "A\n         <strong>\n          perceptron\n         </strong>\n         computes\
      \ w·x + b and outputs a binary decision via step function. It can only learn\
      \ linearly separable patterns."
    - "The\n         <strong>\n          XOR problem\n         </strong>\n       \
      \  proved single perceptrons are limited — motivating multi-layer networks with\
      \ non-linear activations."
    - "A\n         <strong>\n          multi-layer network\n         </strong>\n \
      \        stacks perceptrons: input → hidden → output. Each hidden layer learns\
      \ increasingly abstract features."
    - Every modern neural network (CNNs, RNNs, Transformers) is just a specialised
      multi-layer perceptron with different connectivity patterns.
