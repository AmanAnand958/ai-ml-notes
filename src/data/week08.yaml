- id: '53'
  day_num: 53
  title: Activation Functions & Forward Propagation
  subtitle: Activation functions are thenon-linearity injection systemof neural networks.
    Without them, stacking 100 layers is mathematically identical to one linear layer.
    Today you master why each activation exists, when to use it, and how data flows
    forward through a network layer by layer.
  time_estimate: 5 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Explain what "vanishing gradient" means and which activations cause it
  - Implement sigmoid, tanh, ReLU, Leaky ReLU, and GELU from scratch
  - Compute a full forward pass through a 3-layer network by hand and in NumPy
  - State the default activation recommendation for hidden layers in 2025
  - Explain "dying ReLU" and how Leaky ReLU and ELU fix it
  checklist:
  - id: chk_53_1
    text: Study the core mathematical and architectural principles of Activation Functions
      & Forward Propagation
  - id: chk_53_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_53_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_53_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - The Perceptron & Biologic
  - Activation Functions & Fo
  - Backpropagation & Gradien
  - Keras & TensorFlow — Buil
  - Regularization in Deep Le
  - Optimizers & Learning Rat
  - Week 8 Capstone — From De
  hinglish: 'Dying ReLU problem: agar neuron negative mein phase jaaye toh gradient
    always 0 ho jaata hai — neuron ''mar jaata hai''. Leaky ReLU ya ELU se fix ho
    sakta hai!'
  analogy: Activation functions are like threshold switches in neurons. If the incoming
    signal doesn't cross a certain level (like ReLU clipping negative inputs to 0),
    the neuron doesn't fire.
  theory_html: "<h3 class=\"sh3\">\n       1. Why Non-Linearity Is Non-Negotiable\n\
    \      </h3>\n<h3 class=\"sh3\">\n       2. The Activation Function Zoo\n    \
    \  </h3>\n<figure class=\"svg-diagram\">\n<svg aria-label=\"Comparison of ReLU,\
    \ Sigmoid, and Tanh activation functions\" height=\"240\" role=\"img\" viewbox=\"\
    0 0 680 240\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs>\n<lineargradient\
    \ id=\"af-bg_svg9\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n<stop offset=\"0%\"\
    \ stop-color=\"#1a1e2e\">\n</stop>\n<stop offset=\"100%\" stop-color=\"var(--bg)\"\
    >\n</stop>\n</lineargradient>\n</defs>\n<rect fill=\"url(#af-bg_svg9)\" height=\"\
    240\" rx=\"12\" width=\"680\">\n</rect>\n<text fill=\"#e6edf3\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\"\
    \ x=\"340\" y=\"22\">\n         Activation Functions Comparison\n        </text>\n\
    <!-- ReLU -->\n<text fill=\"var(--blue, #82aaff)\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"11\" font-weight=\"600\" text-anchor=\"middle\" x=\"120\" y=\"45\"\
    >\n         ReLU: max(0, x)\n        </text>\n<line stroke=\"#6b7590\" stroke-width=\"\
    0.8\" x1=\"30\" x2=\"210\" y1=\"150\" y2=\"150\">\n</line>\n<line stroke=\"#6b7590\"\
    \ stroke-width=\"0.8\" x1=\"120\" x2=\"120\" y1=\"60\" y2=\"200\">\n</line>\n\
    <path d=\"M30,150 L120,150 L200,70\" fill=\"none\" stroke=\"var(--blue, #82aaff)\"\
    \ stroke-width=\"2.5\">\n</path>\n<text fill=\"#7ee787\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"8\" text-anchor=\"middle\" x=\"120\" y=\"218\">\n         ✓ Fast,\
    \ no vanishing grad\n        </text>\n<text fill=\"#f97583\" font-family=\"DM\
    \ Sans,sans-serif\" font-size=\"8\" text-anchor=\"middle\" x=\"120\" y=\"230\"\
    >\n         ✗ Dying ReLU (grad=0 for x&lt;0)\n        </text>\n<!-- Sigmoid -->\n\
    <text fill=\"#f0c846\" font-family=\"DM Sans,sans-serif\" font-size=\"11\" font-weight=\"\
    600\" text-anchor=\"middle\" x=\"340\" y=\"45\">\n         Sigmoid: 1/(1+e⁻ˣ)\n\
    \        </text>\n<line stroke=\"#6b7590\" stroke-width=\"0.8\" x1=\"250\" x2=\"\
    430\" y1=\"150\" y2=\"150\">\n</line>\n<line stroke=\"#6b7590\" stroke-width=\"\
    0.8\" x1=\"340\" x2=\"340\" y1=\"60\" y2=\"200\">\n</line>\n<path d=\"M255,185\
    \ Q290,183 310,175 Q330,160 340,150 Q350,140 370,125 Q390,117 425,115\" fill=\"\
    none\" stroke=\"#f0c846\" stroke-width=\"2.5\">\n</path>\n<text fill=\"var(--text2)\"\
    \ font-family=\"DM Sans,sans-serif\" font-size=\"8\" x=\"260\" y=\"192\">\n  \
    \       0\n        </text>\n<text fill=\"var(--text2)\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"8\" x=\"420\" y=\"112\">\n         1\n        </text>\n<text fill=\"\
    #7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"8\" text-anchor=\"middle\"\
    \ x=\"340\" y=\"218\">\n         ✓ Output ∈ (0,1) for probabilities\n        </text>\n\
    <text fill=\"#f97583\" font-family=\"DM Sans,sans-serif\" font-size=\"8\" text-anchor=\"\
    middle\" x=\"340\" y=\"230\">\n         ✗ Vanishing gradients at extremes\n  \
    \      </text>\n<!-- Tanh -->\n<text fill=\"#d2a8ff\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"11\" font-weight=\"600\" text-anchor=\"middle\" x=\"560\" y=\"45\"\
    >\n         Tanh: (eˣ−e⁻ˣ)/(eˣ+e⁻ˣ)\n        </text>\n<line stroke=\"#6b7590\"\
    \ stroke-width=\"0.8\" x1=\"470\" x2=\"650\" y1=\"150\" y2=\"150\">\n</line>\n\
    <line stroke=\"#6b7590\" stroke-width=\"0.8\" x1=\"560\" x2=\"560\" y1=\"60\"\
    \ y2=\"200\">\n</line>\n<path d=\"M475,190 Q510,188 530,178 Q550,160 560,150 Q570,140\
    \ 590,122 Q610,112 645,110\" fill=\"none\" stroke=\"#d2a8ff\" stroke-width=\"\
    2.5\">\n</path>\n<text fill=\"var(--text2)\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"8\" x=\"478\" y=\"197\">\n         -1\n        </text>\n<text fill=\"\
    var(--text2)\" font-family=\"DM Sans,sans-serif\" font-size=\"8\" x=\"640\" y=\"\
    107\">\n         +1\n        </text>\n<text fill=\"#7ee787\" font-family=\"DM\
    \ Sans,sans-serif\" font-size=\"8\" text-anchor=\"middle\" x=\"560\" y=\"218\"\
    >\n         ✓ Zero-centered output\n        </text>\n<text fill=\"#f97583\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"8\" text-anchor=\"middle\" x=\"560\" y=\"230\"\
    >\n         ✗ Still saturates at extremes\n        </text>\n</svg>\n<figcaption>\n\
    \        ReLU is the default choice for hidden layers (fast, avoids vanishing\
    \ gradients). Sigmoid is used in the output layer for binary classification. Tanh\
    \ is used in RNNs and LSTMs.\n       </figcaption>\n</figure>\n<div class=\"table-wrap\"\
    \ style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\"\
    >\n<tr>\n<th>\n         FUNCTION\n        </th>\n<th>\n         FORMULA\n    \
    \    </th>\n<th>\n         RANGE\n        </th>\n<th>\n         VANISHING GRAD?\n\
    \        </th>\n<th>\n         BEST USE\n        </th>\n</tr>\n<tr>\n<td>\n<strong>\n\
    \          Sigmoid\n         </strong>\n</td>\n<td>\n         σ(z) = 1/(1+e⁻ᶻ)\n\
    \        </td>\n<td>\n         (0, 1)\n        </td>\n<td>\n         Yes — saturates\
    \ at 0 &amp; 1\n        </td>\n<td>\n         Output layer (binary classification)\n\
    \        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          Tanh\n         </strong>\n\
    </td>\n<td>\n         tanh(z) = (eᶻ−e⁻ᶻ)/(eᶻ+e⁻ᶻ)\n        </td>\n<td>\n     \
    \    (−1, 1)\n        </td>\n<td>\n         Yes — saturates at ±1\n        </td>\n\
    <td>\n         RNNs, hidden layers (legacy)\n        </td>\n</tr>\n<tr>\n<td>\n\
    <strong>\n          ReLU\n         </strong>\n</td>\n<td>\n         max(0, z)\n\
    \        </td>\n<td>\n         [0, ∞)\n        </td>\n<td>\n         No for z&gt;0,\
    \ dead for z&lt;0\n        </td>\n<td>\n         Hidden layers — default choice\n\
    \        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          Leaky ReLU\n         </strong>\n\
    </td>\n<td>\n         max(0.01z, z)\n        </td>\n<td>\n         (−∞, ∞)\n \
    \       </td>\n<td>\n         No — small gradient for z&lt;0\n        </td>\n\
    <td>\n         When dying ReLU is a concern\n        </td>\n</tr>\n<tr>\n<td>\n\
    <strong>\n          GELU\n         </strong>\n</td>\n<td>\n         z · Φ(z) (Gaussian\
    \ CDF)\n        </td>\n<td>\n         (−∞, ∞)\n        </td>\n<td>\n         Negligible\n\
    \        </td>\n<td>\n         Transformers, BERT, GPT\n        </td>\n</tr>\n\
    <tr>\n<td>\n<strong>\n          Softmax\n         </strong>\n</td>\n<td>\n   \
    \      eᶻⁱ / Σeᶻʲ\n        </td>\n<td>\n         (0,1), sums to 1\n        </td>\n\
    <td>\n         —\n        </td>\n<td>\n         Output layer (multi-class)\n \
    \       </td>\n</tr>\n</table></div>\n<h3 class=\"sh3\">\n       3. Forward Propagation\
    \ — Layer by Layer\n      </h3>\n<div class=\"math-block\">\n<span class=\"formula\"\
    >\n        $$Layer l: Zˡ = Wˡ Aˡ⁻¹ + bˡ$$\n       </span>\n<span class=\"desc\"\
    >\n        Linear transformation: weight matrix Wˡ (shape: [nˡ, nˡ⁻¹]) times previous\
    \ activations Aˡ⁻¹, plus bias bˡ\n       </span>\n<span class=\"formula\">\n \
    \       $$Aˡ = g(Zˡ)$$\n       </span>\n<span class=\"desc\">\n        Apply activation\
    \ function g element-wise to get layer l's activations\n       </span>\n<span\
    \ class=\"formula\">\n        $$Example (3-layer net): A⁰→Z¹=W¹A⁰+b¹→A¹=ReLU(Z¹)→Z²=W²A¹+b²→A²=σ(Z²)$$\n\
    \       </span>\n<span class=\"desc\">\n        Input → hidden layer (ReLU) →\
    \ output layer (sigmoid for binary classification)\n       </span>\n</div>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\
    \ — forward_pass.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n \
    \         Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span>\
    \ numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># ── Activation\
    \ functions ──────────────────────────────────</span>\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">sigmoid</span>(z): <span class=\"kw\">return</span> <span\
    \ class=\"num\">1</span> / (<span class=\"num\">1</span> + np.<span class=\"fn\"\
    >exp</span>(-np.<span class=\"fn\">clip</span>(z, -<span class=\"num\">500</span>,\
    \ <span class=\"num\">500</span>)))\n<span class=\"kw\">def</span> <span class=\"\
    fn\">tanh</span>(z): <span class=\"kw\">return</span> np.<span class=\"fn\">tanh</span>(z)\n\
    <span class=\"kw\">def</span> <span class=\"fn\">relu</span>(z): <span class=\"\
    kw\">return</span> np.<span class=\"fn\">maximum</span>(<span class=\"num\">0</span>,\
    \ z)\n<span class=\"kw\">def</span> <span class=\"fn\">leaky_relu</span>(z, alpha=<span\
    \ class=\"num\">0.01</span>): <span class=\"kw\">return</span> np.<span class=\"\
    fn\">where</span>(z &gt; <span class=\"num\">0</span>, z, alpha * z)\n<span class=\"\
    kw\">def</span> <span class=\"fn\">softmax</span>(z):\n    e = np.<span class=\"\
    fn\">exp</span>(z - np.<span class=\"fn\">max</span>(z, axis=<span class=\"num\"\
    >0</span>, keepdims=<span class=\"kw\">True</span>))  <span class=\"cm\"># numerically\
    \ stable</span>\n    <span class=\"kw\">return</span> e / e.<span class=\"fn\"\
    >sum</span>(axis=<span class=\"num\">0</span>, keepdims=<span class=\"kw\">True</span>)\n\
    \n<span class=\"cm\"># ── 3-layer MLP: forward pass from scratch ────────────────</span>\n\
    <span class=\"cm\"># Architecture: 2 inputs → 4 hidden (ReLU) → 3 hidden (ReLU)\
    \ → 1 output (sigmoid)</span>\nnp.random.<span class=\"fn\">seed</span>(<span\
    \ class=\"num\">42</span>)\n\n<span class=\"cm\"># Random initialisation — He\
    \ initialisation for ReLU layers</span>\nW1 = np.random.<span class=\"fn\">randn</span>(<span\
    \ class=\"num\">4</span>, <span class=\"num\">2</span>) * np.<span class=\"fn\"\
    >sqrt</span>(<span class=\"num\">2</span>/<span class=\"num\">2</span>)   <span\
    \ class=\"cm\"># [4, 2]</span>\nb1 = np.<span class=\"fn\">zeros</span>((<span\
    \ class=\"num\">4</span>, <span class=\"num\">1</span>))\nW2 = np.random.<span\
    \ class=\"fn\">randn</span>(<span class=\"num\">3</span>, <span class=\"num\"\
    >4</span>) * np.<span class=\"fn\">sqrt</span>(<span class=\"num\">2</span>/<span\
    \ class=\"num\">4</span>)   <span class=\"cm\"># [3, 4]</span>\nb2 = np.<span\
    \ class=\"fn\">zeros</span>((<span class=\"num\">3</span>, <span class=\"num\"\
    >1</span>))\nW3 = np.random.<span class=\"fn\">randn</span>(<span class=\"num\"\
    >1</span>, <span class=\"num\">3</span>) * np.<span class=\"fn\">sqrt</span>(<span\
    \ class=\"num\">2</span>/<span class=\"num\">3</span>)   <span class=\"cm\">#\
    \ [1, 3]</span>\nb3 = np.<span class=\"fn\">zeros</span>((<span class=\"num\"\
    >1</span>, <span class=\"num\">1</span>))\n\n<span class=\"kw\">def</span> <span\
    \ class=\"fn\">forward</span>(X):\n    <span class=\"str\">\"\"\"X shape: [2,\
    \ n_samples]\"\"\"</span>\n    cache = {}\n    cache[<span class=\"str\">'A0'</span>]\
    \ = X\n\n    Z1 = W1 @ X + b1;          A1 = <span class=\"fn\">relu</span>(Z1)\n\
    \    Z2 = W2 @ A1 + b2;         A2 = <span class=\"fn\">relu</span>(Z2)\n    Z3\
    \ = W3 @ A2 + b3;         A3 = <span class=\"fn\">sigmoid</span>(Z3)\n\n    cache.<span\
    \ class=\"fn\">update</span>({<span class=\"str\">'Z1'</span>:Z1,<span class=\"\
    str\">'A1'</span>:A1,<span class=\"str\">'Z2'</span>:Z2,<span class=\"str\">'A2'</span>:A2,<span\
    \ class=\"str\">'Z3'</span>:Z3,<span class=\"str\">'A3'</span>:A3})\n    <span\
    \ class=\"kw\">return</span> A3, cache   <span class=\"cm\"># return output +\
    \ cache (needed for backprop)</span>\n\n<span class=\"cm\"># ── Test with a batch\
    \ of 5 samples ───────────────────────</span>\nX_test = np.random.<span class=\"\
    fn\">randn</span>(<span class=\"num\">2</span>, <span class=\"num\">5</span>)\
    \   <span class=\"cm\"># 5 samples, 2 features</span>\noutput, cache = <span class=\"\
    fn\">forward</span>(X_test)\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"Output shape: {output.shape}\"</span>)  <span class=\"cm\"># (1, 5)</span>\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"Predictions:  {output.flatten().round(4)}\"\
    </span>)  <span class=\"cm\"># probabilities [0,1]</span>\n<span class=\"fn\"\
    >print</span>(<span class=\"str\">f\"A1 shape: {cache['</span>A1<span class=\"\
    str\">'].shape}\"</span>)  <span class=\"cm\"># (4, 5) — hidden layer activations</span></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       4. Weight Initialisation — Why It Matters\n\
    \      </h3>\n<!-- /theory -->"
