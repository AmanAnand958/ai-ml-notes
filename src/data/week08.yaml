  quizzes:
  - num_str: Q1 OF 3
    question: A Conv2D layer with 64 filters, kernel size 3×3, applied to an input
      with 32 channels. How many trainable parameters does it have?
    qid: q58_1
    options:
    - letter: A
      text: 64 × 3 × 3 = 576
      is_correct: false
    - letter: B
      text: 64 × 3 × 3 × 32 = 18,432
      is_correct: false
    - letter: C
      text: 64 × (3 × 3 × 32 + 1) = 18,496 (weights + one bias per filter)
      is_correct: true
    - letter: D
      text: 3 × 3 × 32 = 288
      is_correct: false
    correct_fb: '✅ Correct! Each of the 64 filters has shape (3, 3, 32) = 288 weights
      (3×3 kernel × 32 input channels) + 1 bias = 289 parameters per filter. Total:
      64 × 289 = 18,496. This is the power of CNNs: 18,496 params processes an entire
      image, regardless of image size — because the same filter slides across every
      position. A Dense layer from 32×32×32 = 32,768 inputs to 64 outputs would need
      32,768×64 + 64 = 2,097,216 params!'
    wrong_fb: '❌ Each Conv2D filter has shape (k, k, in_channels) + 1 bias = 3×3×32
      + 1 = 289 params. With 64 filters: 64 × 289 = 18,496. The key: each filter spans
      ALL input channels (that''s the "+32 dimension") but shares its weights across
      all spatial positions (that''s parameter sharing).'
  - num_str: Q2 OF 3
    question: Why does GlobalAveragePooling2D generally outperform Flatten + Dense
      when transitioning from conv layers to the classifier head?
    qid: q58_2
    options:
    - letter: A
      text: It uses fewer GPU memory
      is_correct: false
    - letter: B
      text: It dramatically reduces parameters and provides spatial-average features
        that are more translation-invariant, reducing overfitting
      is_correct: true
    - letter: C
      text: It works better with ReLU activations
      is_correct: false
    - letter: D
      text: It's required for models with BatchNorm
      is_correct: false
    correct_fb: '✅ Correct! Flatten + Dense: a 4×4×128 feature map → Flatten → 2048
      values → Dense(256) needs 2048×256 = 524,288 params. GlobalAveragePooling: takes
      the average across spatial dimensions → 128 values → Dense(256) needs only 128×256
      = 32,768 params. 16× fewer params. GAP also averages over spatial positions,
      providing an implicit translation-invariant representation. This is why ResNet,
      VGG, and most modern CNNs use GAP before the final Dense classifier.'
    wrong_fb: '❌ GlobalAveragePooling2D takes a spatial average: (H, W, C) → (C,).
      So a 4×4×128 map becomes 128 values instead of 4×4×128=2048. The Dense head
      after GAP has 16× fewer parameters — huge parameter reduction that prevents
      overfitting. Plus GAP provides translation invariance: the cat activates feature
      42 whether it''s in the top-left or bottom-right of the image.'
  - num_str: Q3 OF 3
    question: You train your CIFAR-10 CNN for 80 epochs with EarlyStopping(patience=10).
      Training stops at epoch 35 and restores weights from epoch 25. What was the
      best val_accuracy epoch?
    qid: q58_3
    options:
    - letter: A
      text: Epoch 35
      is_correct: false
    - letter: B
      text: Epoch 25 — EarlyStopping stopped 10 epochs after the best epoch
      is_correct: true
    - letter: C
      text: Epoch 80 — EarlyStopping always runs all epochs
      is_correct: false
    - letter: D
      text: Epoch 45 — it adds patience to the stopping epoch
      is_correct: false
    correct_fb: ✅ Correct! EarlyStopping with patience=10 stops training 10 epochs
      after the best monitored metric. If training stopped at epoch 35 and weights
      were restored, the best epoch was 35 − 10 = 25. restore_best_weights=True means
      your final model IS the epoch 25 weights, not epoch 35. Always use restore_best_weights=True
      — without it, you get the overfit epoch-35 weights.
    wrong_fb: ❌ Training stopped at epoch 35 = best epoch + patience = best epoch
      + 10. So best epoch = 35 − 10 = 25. With restore_best_weights=True, the model's
      weights are rolled back to epoch 25 — the epoch with best val_accuracy. This
      is why EarlyStopping is harmless to have — it can only help.
  flashcards:
  - front: Feedforward Networks?
    back: 'Information flows in one direction: input -&gt; hidden layers -&gt; output.
      No recurrent loops or backward cycles.'
  - front: Mathematical objective function measuring the discrepancy between model
      predictions ŷ and true labels y, optimized via gradient descent.
    back: Calculates loss function gradients w.r.t weights using the Chain Rule, propagating
      backward to update parameters.
  - front: ReLU Activation?
    back: f(x) = max(0, x). Solves vanishing gradient problem in deep networks; fast
      to compute and induces sparsity.
  - front: Vanishing Gradient?
    back: In deep networks, backpropagated gradients shrink exponentially in early
      layers, stopping weight updates.
  - front: Softmax Function?
    back: Converts raw score vectors (logits) into a probability distribution summing
      to 1. Used in multi-class output layers.
  gotcha:
    title: '⚠️ Gotcha: Cross-Entropy Loss Input Expectations'
    description: PyTorch's `nn.CrossEntropyLoss` expects raw logits as input and automatically
      applies Softmax. Do NOT pass Softmax outputs into it!
  takeaways:
    hinglish_line: "<strong>\n          Ek line mein:\n         </strong>\n      \
      \   PyTorch dynamic graph workflows design karke layers gradients flow aur weights\
      \ update ko training loop mein automated handle karte hain."
    bullets:
    - Neural networks solve non-linear problems by learning hierarchical feature representations
      across layers
    - Backpropagation applies the chain rule backwards through the computation graph
      — O(n) not O(n²)
    - ReLU is the default activation; sigmoid/softmax for output layers only
    - Keras Sequential for simple architectures; Functional API for everything else
    - Dropout prevents co-adaptation; BatchNorm stabilises training distributions;
      both regularise
    - Adam is the default optimizer; AdamW for transformers; SGD+Momentum+Cosine for
      squeezing SOTA
    - CNNs beat dense nets on images via parameter sharing, local connectivity, and
      translation invariance
