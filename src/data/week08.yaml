  quizzes:
  - num_str: Q1 OF 3
    question: In the backward pass, why do we need to store the cache (Z1, A1, Z2,
      etc.) from the forward pass?
    qid: q54_1
    options:
    - letter: A
      text: To compute the loss function
      is_correct: false
    - letter: B
      text: To compute the activation derivatives (dA/dZ) during backprop without
        repeating forward computations
      is_correct: true
    - letter: C
      text: To initialise weights for the next epoch
      is_correct: false
    - letter: D
      text: To save memory by not recomputing the input
      is_correct: false
    correct_fb: ✅ Correct! The chain rule requires the values of intermediate activations
      to compute derivatives. For example, the ReLU derivative is dA/dZ = 1 if Z &gt;
      0, else 0 — you need Z from the forward pass to compute this. Recomputing forward
      pass during backprop would double the computation cost. Storing the cache is
      what makes backprop O(n) efficient.
    wrong_fb: ❌ The cache stores forward pass values (Z1, A1, Z2...) needed to compute
      gradients during backprop. The ReLU derivative is 1 where Z &gt; 0 — you need
      Z to know which elements had positive pre-activation. Without the cache, you'd
      need to recompute the forward pass during backprop, doubling cost.
  - num_str: Q2 OF 3
    question: For a sigmoid output neuron computing binary cross-entropy loss, what
      is ∂L/∂Z (the gradient of the loss w.r.t. the pre-activation Z)?
    qid: q54_2
    options:
    - letter: A
      text: −y/ŷ + (1−y)/(1−ŷ)
      is_correct: false
    - letter: B
      text: ŷ − y (the prediction minus the true label)
      is_correct: true
    - letter: C
      text: ŷ(1−ŷ)
      is_correct: false
    - letter: D
      text: 2(ŷ − y)
      is_correct: false
    correct_fb: ✅ Correct! This is a beautiful result. ∂L/∂Z = ∂L/∂ŷ · ∂ŷ/∂Z = [−y/ŷ
      + (1−y)/(1−ŷ)] × [ŷ(1−ŷ)] = ŷ − y. The sigmoid and cross-entropy derivatives
      cancel elegantly to give (prediction − true label). This is why sigmoid + binary
      cross-entropy is such a natural pairing.
    wrong_fb: ❌ When you chain ∂(BCE)/∂ŷ and ∂ŷ/∂Z for sigmoid, the result simplifies
      beautifully to (ŷ − y). The BCE loss derivative has a 1/ŷ(1−ŷ) term that cancels
      with the sigmoid derivative ŷ(1−ŷ). This clean result is why sigmoid + BCE is
      preferred — no messy gradients.
  - num_str: Q3 OF 3
    question: Your neural network loss is decreasing on training data but increasing
      on validation data from epoch 50 onward. What is happening?
    qid: q54_3
    options:
    - letter: A
      text: The learning rate is too low
      is_correct: false
    - letter: B
      text: The network is underfitting
      is_correct: false
    - letter: C
      text: The network is overfitting — apply regularization or early stopping
      is_correct: true
    - letter: D
      text: The validation set is too small
      is_correct: false
    correct_fb: '✅ Correct! Classic overfitting signature: train loss ↓, val loss
      ↑. The model memorises training data and loses the ability to generalise. Solutions:
      (1) Early stopping — stop at the epoch where val loss was minimum; (2) Dropout
      — randomly deactivate neurons during training; (3) L2 regularization — penalise
      large weights; (4) More training data or data augmentation.'
    wrong_fb: '❌ Train loss down + val loss up = classic overfitting. The model has
      memorised the training set. Tomorrow (Day 56) covers the solutions: Dropout,
      BatchNorm, L2 regularization, and early stopping. Early stopping literally stops
      training at the epoch where val loss was minimum.'
  flashcards:
  - front: Feedforward Networks?
    back: 'Information flows in one direction: input -&gt; hidden layers -&gt; output.
      No recurrent loops or backward cycles.'
  - front: Mathematical objective function measuring the discrepancy between model
      predictions ŷ and true labels y, optimized via gradient descent.
    back: Calculates loss function gradients w.r.t weights using the Chain Rule, propagating
      backward to update parameters.
  - front: ReLU Activation?
    back: f(x) = max(0, x). Solves vanishing gradient problem in deep networks; fast
      to compute and induces sparsity.
  - front: Vanishing Gradient?
    back: In deep networks, backpropagated gradients shrink exponentially in early
      layers, stopping weight updates.
  - front: Softmax Function?
    back: Converts raw score vectors (logits) into a probability distribution summing
      to 1. Used in multi-class output layers.
  gotcha:
    title: '⚠️ Gotcha: Cross-Entropy Loss Input Expectations'
    description: PyTorch's `nn.CrossEntropyLoss` expects raw logits as input and automatically
      applies Softmax. Do NOT pass Softmax outputs into it!
  takeaways:
    hinglish_line: "<strong>\n         Ek line mein:\n        </strong>\n        Backpropagation\
      \ calculus ke chain rule se loss function ke derivatives ko output layer se\
      \ input layer tak peeche bhejta hai taaki gradients nikal sakein."
    bullets:
    - "<strong>\n          Backpropagation\n         </strong>\n         computes\
      \ gradients via the chain rule: error flows backward from output to input, calculating\
      \ each weight's contribution to the loss."
    - "<strong>\n          Gradient descent\n         </strong>\n         updates\
      \ weights in the opposite direction of the gradient: w = w - η·∂L/∂w. η (learning\
      \ rate) controls step size."
    - "<strong>\n          Learning rate tuning:\n         </strong>\n         Too\
      \ high → divergence. Too low → slow convergence. Use learning rate schedulers\
      \ or adaptive methods (Adam)."
    - "<strong>\n          Vanishing gradient:\n         </strong>\n         Deep\
      \ networks with sigmoid/tanh suffer as gradients shrink exponentially through\
      \ layers. ReLU + proper init mitigate this."
