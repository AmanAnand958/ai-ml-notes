    <!-- Formula -->\n<text fill=\"#f0c846\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    9\" text-anchor=\"middle\" x=\"340\" y=\"42\">\n         h = σ(Wx + b)  →  Each\
    \ neuron: weighted sum + bias + activation\n        </text>\n</svg>\n<figcaption>\n\
    \        A feedforward neural network passes inputs through layers of neurons.\
    \ Each connection has a learnable weight; each neuron applies an activation function\
    \ to its weighted sum.\n       </figcaption>\n</figure>\n<div class=\"math-block\"\
    >\n<span class=\"formula\">\n        $$z = w₁x₁ + w₂x₂ + ... + wₙxₙ + b = wᵀx\
    \ + b$$\n       </span>\n<span class=\"desc\">\n        Weighted sum of inputs\
    \ plus bias term\n       </span>\n<span class=\"formula\">\n        $$ŷ = step(z)\
    \ = 1 if z ≥ 0, else 0$$\n       </span>\n<span class=\"desc\">\n        Step\
    \ function activation — hard threshold\n       </span>\n<span class=\"formula\"\
