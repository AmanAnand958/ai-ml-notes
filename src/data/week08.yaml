- id: '54'
  day_num: 54
  title: Backpropagation & Gradient Descent
  subtitle: Backpropagation is the algorithm that makes deep learning work. It answers
    one question:by how much should each weight change to reduce the loss?Today you
    derive it from the chain rule, implement it from scratch, and understand why it
    is computationally efficient compared to naive gradient estimation.
  time_estimate: 6 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Derive the backpropagation equations using the chain rule step by step
  - Compute gradients of loss w.r.t. weights for a 2-layer network by hand
  - Implement a full training loop (forward + backward + update) in pure NumPy
  - Distinguish batch, mini-batch, and stochastic gradient descent
  - Explain the computational graph and why backprop is O(n) not O(n²)
  checklist:
  - id: chk_54_1
    text: Study the core mathematical and architectural principles of Backpropagation
      & Gradient Descent
  - id: chk_54_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_54_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_54_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - The Perceptron & Biologic
  - Activation Functions & Fo
  - Backpropagation & Gradien
  - Keras & TensorFlow — Buil
  - Regularization in Deep Le
  - Optimizers & Learning Rat
  - Week 8 Capstone — From De
  hinglish: 'Numerical gradient checking: analytical gradient aur numerical approximation
    compare karo. Debug karne ka ye best tarika hai jab backprop mein bug suspect
    ho!'
  analogy: 'Socho ek factory hai jahan input kaccha maal hai aur output final product.
    Agar output ki quality kharaab hai, toh factory manager puchega: "Kaun sa machine
    responsible hai?" Woh trace karta hai backwards — assembly se welding tak, welding
    se cutting tak. Yahi karta hai backprop: "Loss kyu hua?" — aur ek ek layer mein
    jaake samajhta hai kiske weights ne contribution diya. Chain rule is backwards
    tracing ka mathematical version hai.'
  theory_html: "<h3 class=\"sh3\">\n       1. Loss Functions First\n      </h3>\n\
    <div class=\"math-block\">\n<span class=\"formula\">\n        $$Binary Cross-Entropy:\
    \ L = −(y log(ŷ) + (1−y) log(1−ŷ))$$\n       </span>\n<span class=\"desc\">\n\
    \        Use with sigmoid output for binary classification. Penalises confident\
    \ wrong predictions heavily.\n       </span>\n<span class=\"formula\">\n     \
    \   $$\\text{Categorical Cross-Entropy: } L = - \\sum_{k} y_k \\log(\\hat{y}_k)$$\n\
    \       </span>\n<span class=\"desc\">\n        Use with softmax output for multi-class\
    \ classification.\n       </span>\n<span class=\"formula\">\n        $$\\text{MSE:\
    \ } L = \\frac{1}{n} \\sum (y - \\hat{y})^2$$\n       </span>\n<span class=\"\
    desc\">\n        Use for regression problems.\n       </span>\n</div>\n<h3 class=\"\
    sh3\">\n       2. The Chain Rule — Backprop's Foundation\n      </h3>\n\n<div\
    \ class=\"math-block\">\n<span class=\"formula\">\n        $$Chain rule: if L\
    \ = f(g(x)), then dL/dx = (dL/dg)(dg/dx)$$\n       </span>\n<span class=\"desc\"\
    >\n        The fundamental rule. Applied recursively through every layer.\n  \
    \     </span>\n<span class=\"formula\">\n        $$∂L/∂W³ = ∂L/∂A³ · ∂A³/∂Z³ ·\
    \ ∂Z³/∂W³$$\n       </span>\n<span class=\"desc\">\n        Gradient of loss w.r.t.\
    \ output layer weights = (dL/dA3) × (activation derivative) × A2\n       </span>\n\
    <span class=\"formula\">\n        $$∂L/∂W² = ∂L/∂A³ · ∂A³/∂Z³ · ∂Z³/∂A² · ∂A²/∂Z²\
    \ · ∂Z²/∂W²$$\n       </span>\n<span class=\"desc\">\n        Each layer adds\
    \ another chain rule term. Cached intermediate values make this O(n).\n      \
    \ </span>\n</div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         python — full_training_loop.py\n        </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n         \
    \ copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">from</span> sklearn.datasets <span class=\"kw\">import</span>\
    \ make_moons\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"\
    kw\">import</span> train_test_split\n<span class=\"kw\">from</span> sklearn.preprocessing\
    \ <span class=\"kw\">import</span> StandardScaler\n\n<span class=\"cm\"># ── Data\
    \ prep ─────────────────────────────────────────────</span>\nX, y = <span class=\"\
    fn\">make_moons</span>(n_samples=<span class=\"num\">1000</span>, noise=<span\
    \ class=\"num\">0.2</span>, random_state=<span class=\"num\">42</span>)\nX_tr,\
    \ X_te, y_tr, y_te = <span class=\"fn\">train_test_split</span>(X, y, test_size=<span\
    \ class=\"num\">0.2</span>, random_state=<span class=\"num\">42</span>)\nX_tr,\
    \ X_te = <span class=\"fn\">StandardScaler</span>().<span class=\"fn\">fit_transform</span>(X_tr),\
    \ <span class=\"fn\">StandardScaler</span>().<span class=\"fn\">fit_transform</span>(X_te)\n\
    X_tr, X_te = X_tr.T, X_te.T        <span class=\"cm\"># shape: [2, n_samples]</span>\n\
    y_tr, y_te = y_tr.<span class=\"fn\">reshape</span>(<span class=\"num\">1</span>,\
    \ -<span class=\"num\">1</span>), y_te.<span class=\"fn\">reshape</span>(<span\
    \ class=\"num\">1</span>, -<span class=\"num\">1</span>)\n\n<span class=\"cm\"\
    ># ── Network parameters ────────────────────────────────────</span>\nnp.random.<span\
    \ class=\"fn\">seed</span>(<span class=\"num\">1</span>)\nparams = {\n    <span\
    \ class=\"str\">'W1'</span>: np.random.<span class=\"fn\">randn</span>(<span class=\"\
    num\">8</span>, <span class=\"num\">2</span>) * np.<span class=\"fn\">sqrt</span>(<span\
    \ class=\"num\">2</span>/<span class=\"num\">2</span>),\n    <span class=\"str\"\
    >'b1'</span>: np.<span class=\"fn\">zeros</span>((<span class=\"num\">8</span>,\
    \ <span class=\"num\">1</span>)),\n    <span class=\"str\">'W2'</span>: np.random.<span\
    \ class=\"fn\">randn</span>(<span class=\"num\">1</span>, <span class=\"num\"\
    >8</span>) * np.<span class=\"fn\">sqrt</span>(<span class=\"num\">2</span>/<span\
    \ class=\"num\">8</span>),\n    <span class=\"str\">'b2'</span>: np.<span class=\"\
    fn\">zeros</span>((<span class=\"num\">1</span>, <span class=\"num\">1</span>)),\n\
    }\n\n<span class=\"kw\">def</span> <span class=\"fn\">sigmoid</span>(z): <span\
    \ class=\"kw\">return</span> <span class=\"num\">1</span> / (<span class=\"num\"\
    >1</span> + np.<span class=\"fn\">exp</span>(-np.<span class=\"fn\">clip</span>(z,\
    \ -<span class=\"num\">500</span>, <span class=\"num\">500</span>)))\n<span class=\"\
    kw\">def</span> <span class=\"fn\">relu</span>(z):    <span class=\"kw\">return</span>\
    \ np.<span class=\"fn\">maximum</span>(<span class=\"num\">0</span>, z)\n\n<span\
    \ class=\"kw\">def</span> <span class=\"fn\">forward</span>(X, params):\n    Z1\
    \ = params[<span class=\"str\">'W1'</span>] @ X  + params[<span class=\"str\"\
    >'b1'</span>]\n    A1 = <span class=\"fn\">relu</span>(Z1)\n    Z2 = params[<span\
    \ class=\"str\">'W2'</span>] @ A1 + params[<span class=\"str\">'b2'</span>]\n\
    \    A2 = <span class=\"fn\">sigmoid</span>(Z2)\n    cache = {<span class=\"str\"\
    >'Z1'</span>:Z1,<span class=\"str\">'A1'</span>:A1,<span class=\"str\">'Z2'</span>:Z2,<span\
    \ class=\"str\">'A2'</span>:A2,<span class=\"str\">'X'</span>:X}\n    <span class=\"\
    kw\">return</span> A2, cache\n\n<span class=\"kw\">def</span> <span class=\"fn\"\
    >compute_loss</span>(A2, y):\n    m = y.shape[<span class=\"num\">1</span>]\n\
    \    L = -np.<span class=\"fn\">mean</span>(y * np.<span class=\"fn\">log</span>(A2\
    \ + <span class=\"num\">1e-8</span>) + (<span class=\"num\">1</span>-y) * np.<span\
    \ class=\"fn\">log</span>(<span class=\"num\">1</span>-A2+<span class=\"num\"\
    >1e-8</span>))\n    <span class=\"kw\">return</span> L\n\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">backward</span>(cache, params, y):\n    m = y.shape[<span\
    \ class=\"num\">1</span>]\n    A2, A1, Z1, X = cache[<span class=\"str\">'A2'</span>],\
    \ cache[<span class=\"str\">'A1'</span>], cache[<span class=\"str\">'Z1'</span>],\
    \ cache[<span class=\"str\">'X'</span>]\n\n    <span class=\"cm\"># ── Output\
    \ layer gradients ────────────────────────────</span>\n    dZ2 = A2 - y      \
    \                        <span class=\"cm\"># d(BCE)/d(Z2) for sigmoid output</span>\n\
    \    dW2 = (dZ2 @ A1.T) / m\n    db2 = np.<span class=\"fn\">mean</span>(dZ2,\
    \ axis=<span class=\"num\">1</span>, keepdims=<span class=\"kw\">True</span>)\n\
    \n    <span class=\"cm\"># ── Hidden layer gradients ────────────────────────────</span>\n\
    \    dA1 = params[<span class=\"str\">'W2'</span>].T @ dZ2\n    dZ1 = dA1 * (Z1\
    \ &gt; <span class=\"num\">0</span>)                   <span class=\"cm\"># ReLU\
    \ derivative: 1 if z&gt;0, else 0</span>\n    dW1 = (dZ1 @ X.T) / m\n    db1 =\
    \ np.<span class=\"fn\">mean</span>(dZ1, axis=<span class=\"num\">1</span>, keepdims=<span\
    \ class=\"kw\">True</span>)\n\n    <span class=\"kw\">return</span> {<span class=\"\
    str\">'dW1'</span>:dW1,<span class=\"str\">'db1'</span>:db1,<span class=\"str\"\
    >'dW2'</span>:dW2,<span class=\"str\">'db2'</span>:db2}\n\n<span class=\"cm\"\
    ># ── Training loop ─────────────────────────────────────────</span>\nlr = <span\
    \ class=\"num\">0.01</span>\n<span class=\"kw\">for</span> epoch <span class=\"\
    kw\">in</span> <span class=\"fn\">range</span>(<span class=\"num\">2000</span>):\n\
    \    A2, cache  = <span class=\"fn\">forward</span>(X_tr, params)\n    loss  \
    \     = <span class=\"fn\">compute_loss</span>(A2, y_tr)\n    grads      = <span\
    \ class=\"fn\">backward</span>(cache, params, y_tr)\n\n    <span class=\"cm\"\
    ># Gradient descent update</span>\n    <span class=\"kw\">for</span> k <span class=\"\
    kw\">in</span> [<span class=\"str\">'W1'</span>,<span class=\"str\">'b1'</span>,<span\
    \ class=\"str\">'W2'</span>,<span class=\"str\">'b2'</span>]:\n        params[k]\
    \ -= lr * grads[<span class=\"str\">'d'</span>+k]\n\n    <span class=\"kw\">if</span>\
    \ epoch % <span class=\"num\">200</span> == <span class=\"num\">0</span>:\n  \
    \      preds = (A2 &gt; <span class=\"num\">0.5</span>).<span class=\"fn\">astype</span>(int)\n\
    \        acc = (preds == y_tr).<span class=\"fn\">mean</span>()\n        <span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"Epoch {epoch:4d} | Loss: {loss:.4f}\
    \ | Train acc: {acc:.4f}\"</span>)\n\n<span class=\"cm\"># ── Test accuracy ─────────────────────────────────────────</span>\n\
    A2_test, _ = <span class=\"fn\">forward</span>(X_te, params)\ntest_acc = ((A2_test\
    \ &gt; <span class=\"num\">0.5</span>) == y_te).<span class=\"fn\">mean</span>()\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"\\nTest accuracy: {test_acc:.4f}\"\
    </span>)  <span class=\"cm\"># Should be ~90%+</span></pre>\n</div>\n<h3 class=\"\
    sh3\">\n       3. Gradient Descent Variants\n      </h3>\n<div class=\"table-wrap\"\
    \ style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\"\
    >\n<tr>\n<th>\n         VARIANT\n        </th>\n<th>\n         UPDATE PER STEP\n\
    \        </th>\n<th>\n         PROS\n        </th>\n<th>\n         CONS\n    \
    \    </th>\n</tr>\n<tr>\n<td>\n<strong>\n          Batch GD\n         </strong>\n\
    </td>\n<td>\n         Entire dataset\n        </td>\n<td>\n         Stable, true\
    \ gradient\n        </td>\n<td>\n         Slow, needs full data in memory\n  \
    \      </td>\n</tr>\n<tr>\n<td>\n<strong>\n          Stochastic GD (SGD)\n   \
    \      </strong>\n</td>\n<td>\n         1 sample\n        </td>\n<td>\n      \
    \   Fast updates, escapes local minima\n        </td>\n<td>\n         Very noisy,\
    \ doesn't converge cleanly\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n     \
    \     Mini-batch GD\n         </strong>\n</td>\n<td>\n         32–256 samples\n\
    \        </td>\n<td>\n         Best of both — GPU-efficient, stable\n        </td>\n\
    <td>\n         Batch size is a hyperparameter\n        </td>\n</tr>\n</table></div>\n\
    <div class=\"interview\">\n<strong>\n        Classic question: \"Why do we use\
    \ mini-batch instead of full-batch gradient descent?\"\n       </strong>\n<br/>\n\
    <br/>\n<strong>\n        Answer:\n       </strong>\n       (1) Memory — full dataset\
    \ may not fit in GPU VRAM; (2) Speed — matrix ops on mini-batches are GPU-optimized;\
    \ (3) Regularization — the noise in mini-batch gradients acts like implicit regularization\
    \ and can help generalisation; (4) Convergence — mini-batch strikes the right\
    \ tradeoff between stability and speed.\n      </div>\n<!-- /theory -->\n<div\
    \ class=\"callout\" style=\"background:rgba(108,140,255,.03); border:1px solid\
    \ var(--blue); padding:1.2rem; border-radius:8px; margin:1.5rem 0;\">\n<h3>\n\
    \       \U0001F504 Computational Graph &amp; Chain Rule Backpropagation\n    \
    \  </h3>\n<div class=\"mermaid\">graph LR\n  X[\"Input X\"] --&gt;|Forward Pass:\
    \ z = w*x + b| Linear[\"Linear Neuron: z\"]\n  Linear --&gt;|Forward Pass: a =\
    \ sigma(z)| Activation[\"Activation: sigma(z)\"]\n  Activation --&gt;|Forward\
    \ Pass: L = Loss(a,y)| Loss[\"Loss Node: L\"]\n  Loss --&gt;|Backward Pass: dL/da|\
    \ Activation\n  Activation --&gt;|Backward Pass: dL/dz = dL/da * sigma_prime(z)|\
    \ Linear\n  Linear --&gt;|Backward Pass: dL/dw = dL/dz * x| Weights[\"Gradient\
    \ dL/dw\"]</div>\n</div>"
