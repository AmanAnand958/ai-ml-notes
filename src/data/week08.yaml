  - title: Train the MNIST model and reach 97%+ test accuracy
    badge: Easy · 1 hr
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p>\n          Run the Sequential model code above. Plot training\
      \ history. Inspect the model summary and manually verify the parameter count\
      \ for one Dense layer. Check what epoch EarlyStopping triggered. Save the model\
      \ and reload it.\n         </p>"
    done_when: Test accuracy ≥ 97.5%. Training plot shows no overfitting. You can
      explain where 200,960 parameters in the first Dense layer come from.
    git_cmd: 'git add . &amp;&amp; git commit -m "day55: complete day 55 tasks and
      coding exercises"'
    sol_id: sol-w8t10
    solution_title: ✅ COMPLETE SOLUTION — train_the_mnist_model_and_reach_97_test.py
    solution_code: "<span class=\"cm\"># train_the_mnist_model_and_reach_97_test.py\
      \ — Solution</span>\n<span class=\"cm\"># Complete solution for: Train the MNIST\
      \ model and reach 97%+ test accuracy</span>\n\n<span class=\"kw\">import</span>\
      \ numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span> <span\
      \ class=\"fn\">compute_classification_metrics</span>(y_true, y_pred_probs, threshold=<span\
      \ class=\"num\">0.5</span>):\n    y_pred = (y_pred_probs &gt;= threshold).<span\
      \ class=\"fn\">astype</span>(int)\n    tp = np.<span class=\"fn\">sum</span>((y_true\
      \ == <span class=\"num\">1</span>) &amp; (y_pred == <span class=\"num\">1</span>))\n\
      \    fp = np.<span class=\"fn\">sum</span>((y_true == <span class=\"num\">0</span>)\
      \ &amp; (y_pred == <span class=\"num\">1</span>))\n    fn = np.<span class=\"\
      fn\">sum</span>((y_true == <span class=\"num\">1</span>) &amp; (y_pred == <span\
      \ class=\"num\">0</span>))\n    tn = np.<span class=\"fn\">sum</span>((y_true\
      \ == <span class=\"num\">0</span>) &amp; (y_pred == <span class=\"num\">0</span>))\n\
      \    \n    accuracy = (tp + tn) / <span class=\"fn\">len</span>(y_true)\n  \
      \  precision = tp / (tp + fp) <span class=\"kw\">if</span> (tp + fp) &gt; <span\
      \ class=\"num\">0</span> <span class=\"kw\">else</span> <span class=\"num\"\
      >0</span>\n    recall = tp / (tp + fn) <span class=\"kw\">if</span> (tp + fn)\
      \ &gt; <span class=\"num\">0</span> <span class=\"kw\">else</span> <span class=\"\
      num\">0</span>\n    f1 = <span class=\"num\">2</span> * precision * recall /\
      \ (precision + recall) <span class=\"kw\">if</span> (precision + recall) &gt;\
      \ <span class=\"num\">0</span> <span class=\"kw\">else</span> <span class=\"\
      num\">0</span>\n    \n    <span class=\"kw\">return</span> {<span class=\"str\"\
      >\"accuracy\": accuracy, \"precision\": precision, \"recall\": recall, \"f1_score\"\
      </span>: f1}\n\ny_true = np.<span class=\"fn\">array</span>([<span class=\"\
      num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\">1</span>,\
      \ <span class=\"num\">1</span>, <span class=\"num\">0</span>, <span class=\"\
      num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\">0</span>])\n\
