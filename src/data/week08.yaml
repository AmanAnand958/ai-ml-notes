week_number: 8
title: Neural Networks & Deep Learning
description: ''
days:
- id: '52'
  day_num: 52
  title: The Perceptron & Biological Neurons
  subtitle: 'The deep learning revolution starts with a 1957 idea: what if a machine
    could learn by mimicking the neurons in your brain? Today you build intuition
    forwhy neural networks exist, how the perceptron works and — crucially — why it
    fails at XOR, which is the very problem that gave birth to multi-layer networks.'
  time_estimate: 4 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Map the biological neuron to its mathematical abstraction
  - Implement the Perceptron Learning Rule from scratch in NumPy
  - Prove mathematically why the perceptron cannot solve XOR
  - State what a multi-layer perceptron (MLP) adds to fix that limitation
  - Explain the historical significance of Minsky's XOR critique and the AI winter
  checklist:
  - id: chk_52_1
    text: Study the core mathematical and architectural principles of The Perceptron
      & Biological Neurons
  - id: chk_52_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_52_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_52_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - Perceptron Concept
  - Hidden Layers
  - Activation Functions
  - Forward Pass
  - Backprop Calculus
  - PyTorch Tensors
  hinglish: 'Perceptron learning rule: weight update sirf tab hota hai jab prediction
    wrong ho. Ye gradient descent ka special case hai — convergence guaranteed for
    linearly separable data!'
  analogy: 'Socho apne dimaag mein ek neuron hai — Sharma ji ki tarah. Sharma ji sirf
    tab react karte hain jab kaafi logon ne unhe bol diya ho (signals aayi ho threshold
    se zyada). Warna woh chup rehte hain. Yahi kaam karta hai ek artificial neuron:
    inputs le, unhe weights se multiply karo, sum karo, aur agar woh sum ek threshold
    cross kare toh "fire" karo (output = 1), warna chup raho (output = 0).'
