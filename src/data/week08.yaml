  theory_html: "<h3 class=\"sh3\">\n       1. Sequential API — For Straight-Line Architectures\n\
    \      </h3>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — mnist_sequential.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> tensorflow <span class=\"kw\">as</span> tf\n<span\
    \ class=\"kw\">from</span> tensorflow <span class=\"kw\">import</span> keras\n\
    <span class=\"kw\">from</span> tensorflow.keras <span class=\"kw\">import</span>\
    \ layers\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
    \ np\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span>\
    \ plt\n\n<span class=\"cm\"># ── 1. Load and preprocess MNIST ──────────────────────────</span>\n\
    (X_train, y_train), (X_test, y_test) = keras.datasets.mnist.<span class=\"fn\"\
    >load_data</span>()\nX_train = X_train.<span class=\"fn\">astype</span>(<span\
    \ class=\"str\">'float32'</span>) / <span class=\"num\">255.0</span>   <span class=\"\
    cm\"># normalise to [0,1]</span>\nX_test  = X_test.<span class=\"fn\">astype</span>(<span\
    \ class=\"str\">'float32'</span>) / <span class=\"num\">255.0</span>\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"Train: {X_train.shape}, Test: {X_test.shape}\"\
    </span>)  <span class=\"cm\"># (60000,28,28), (10000,28,28)</span>\n\n<span class=\"\
    cm\"># ── 2. Build the model ────────────────────────────────────</span>\nmodel\
    \ = keras.<span class=\"fn\">Sequential</span>([\n    layers.<span class=\"fn\"\
    >Flatten</span>(input_shape=(<span class=\"num\">28</span>, <span class=\"num\"\
    >28</span>)),      <span class=\"cm\"># 784 inputs</span>\n    layers.<span class=\"\
    fn\">Dense</span>(<span class=\"num\">256</span>, activation=<span class=\"str\"\
    >'relu'</span>),      <span class=\"cm\"># hidden layer 1</span>\n    layers.<span\
    \ class=\"fn\">Dense</span>(<span class=\"num\">128</span>, activation=<span class=\"\
    str\">'relu'</span>),      <span class=\"cm\"># hidden layer 2</span>\n    layers.<span\
    \ class=\"fn\">Dense</span>(<span class=\"num\">64</span>,  activation=<span class=\"\
    str\">'relu'</span>),      <span class=\"cm\"># hidden layer 3</span>\n    layers.<span\
    \ class=\"fn\">Dense</span>(<span class=\"num\">10</span>,  activation=<span class=\"\
    str\">'softmax'</span>),  <span class=\"cm\"># 10 digit classes</span>\n], name=<span\
    \ class=\"str\">'mnist_classifier'</span>)\n\nmodel.<span class=\"fn\">summary</span>()\
    \  <span class=\"cm\"># print architecture + param counts</span>\n\n<span class=\"\
    cm\"># ── 3. Compile ────────────────────────────────────────────</span>\nmodel.<span\
    \ class=\"fn\">compile</span>(\n    optimizer=keras.optimizers.<span class=\"\
    fn\">Adam</span>(learning_rate=<span class=\"num\">0.001</span>),\n    loss=<span\
    \ class=\"str\">'sparse_categorical_crossentropy'</span>,  <span class=\"cm\"\
    ># use integer labels</span>\n    metrics=[<span class=\"str\">'accuracy'</span>]\n\
    )\n\n<span class=\"cm\"># ── 4. Callbacks ──────────────────────────────────────────</span>\n\
    callbacks = [\n    keras.callbacks.<span class=\"fn\">EarlyStopping</span>(\n\
    \        monitor=<span class=\"str\">'val_loss'</span>, patience=<span class=\"\
    num\">5</span>, restore_best_weights=<span class=\"kw\">True</span>),\n    keras.callbacks.<span\
    \ class=\"fn\">ModelCheckpoint</span>(\n        <span class=\"str\">'best_mnist_model.keras'</span>,\
    \ save_best_only=<span class=\"kw\">True</span>, monitor=<span class=\"str\">'val_accuracy'</span>),\n\
    \    keras.callbacks.<span class=\"fn\">ReduceLROnPlateau</span>(\n        monitor=<span\
    \ class=\"str\">'val_loss'</span>, factor=<span class=\"num\">0.5</span>, patience=<span\
    \ class=\"num\">3</span>, min_lr=<span class=\"num\">1e-6</span>),\n]\n\n<span\
    \ class=\"cm\"># ── 5. Train ──────────────────────────────────────────────</span>\n\
    history = model.<span class=\"fn\">fit</span>(\n    X_train, y_train,\n    epochs=<span\
    \ class=\"num\">50</span>,             <span class=\"cm\"># EarlyStopping will\
    \ stop before this</span>\n    batch_size=<span class=\"num\">128</span>,\n  \
    \  validation_split=<span class=\"num\">0.15</span>,  <span class=\"cm\"># 15%\
    \ of train data as validation</span>\n    callbacks=callbacks,\n    verbose=<span\
    \ class=\"num\">1</span>\n)\n\n<span class=\"cm\"># ── 6. Evaluate ───────────────────────────────────────────</span>\n\
    test_loss, test_acc = model.<span class=\"fn\">evaluate</span>(X_test, y_test,\
    \ verbose=<span class=\"num\">0</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"\\nTest accuracy: {test_acc:.4f}\"</span>)  <span class=\"\
    cm\"># Should be ≥ 97.5%</span>\n\n<span class=\"cm\"># ── 7. Plot training history\
    \ ──────────────────────────────</span>\nfig, (ax1, ax2) = plt.<span class=\"\
    fn\">subplots</span>(<span class=\"num\">1</span>, <span class=\"num\">2</span>,\
    \ figsize=(<span class=\"num\">12</span>, <span class=\"num\">4</span>))\nax1.<span\
    \ class=\"fn\">plot</span>(history.history[<span class=\"str\">'loss'</span>],\
    \ label=<span class=\"str\">'Train'</span>)\nax1.<span class=\"fn\">plot</span>(history.history[<span\
    \ class=\"str\">'val_loss'</span>], label=<span class=\"str\">'Validation'</span>)\n\
    ax1.<span class=\"fn\">set_title</span>(<span class=\"str\">'Loss'</span>); ax1.<span\
    \ class=\"fn\">legend</span>()\nax2.<span class=\"fn\">plot</span>(history.history[<span\
    \ class=\"str\">'accuracy'</span>], label=<span class=\"str\">'Train'</span>)\n\
    ax2.<span class=\"fn\">plot</span>(history.history[<span class=\"str\">'val_accuracy'</span>],\
    \ label=<span class=\"str\">'Validation'</span>)\nax2.<span class=\"fn\">set_title</span>(<span\
    \ class=\"str\">'Accuracy'</span>); ax2.<span class=\"fn\">legend</span>()\nplt.<span\
    \ class=\"fn\">tight_layout</span>(); plt.<span class=\"fn\">show</span>()\n\n\
    <span class=\"cm\"># ── 8. Save and reload ───────────────────────────────────</span>\n\
    model.<span class=\"fn\">save</span>(<span class=\"str\">'mnist_model.keras'</span>)\n\
    loaded = keras.models.<span class=\"fn\">load_model</span>(<span class=\"str\"\
    >'mnist_model.keras'</span>)\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >\"Reloaded accuracy:\"</span>, loaded.<span class=\"fn\">evaluate</span>(X_test,\
    \ y_test, verbose=<span class=\"num\">0</span>)[<span class=\"num\">1</span>])</pre>\n\
    </div>\n<h3 class=\"sh3\">\n       2. Functional API — For Complex Architectures\n\
    \      </h3>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — functional_api_example.py\n        </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n         \
    \ copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"cm\"># Functional API: same MNIST network</span>\ninputs =\
    \ keras.<span class=\"fn\">Input</span>(shape=(<span class=\"num\">28</span>,\
    \ <span class=\"num\">28</span>), name=<span class=\"str\">'pixel_input'</span>)\n\
    x = layers.<span class=\"fn\">Flatten</span>()(inputs)\nx = layers.<span class=\"\
    fn\">Dense</span>(<span class=\"num\">256</span>, activation=<span class=\"str\"\
    >'relu'</span>)(x)\nx = layers.<span class=\"fn\">Dense</span>(<span class=\"\
    num\">128</span>, activation=<span class=\"str\">'relu'</span>)(x)\noutputs =\
    \ layers.<span class=\"fn\">Dense</span>(<span class=\"num\">10</span>, activation=<span\
    \ class=\"str\">'softmax'</span>, name=<span class=\"str\">'digit_prob'</span>)(x)\n\
    \nmodel = keras.<span class=\"fn\">Model</span>(inputs=inputs, outputs=outputs,\
    \ name=<span class=\"str\">'mnist_functional'</span>)\n\n<span class=\"cm\">#\
    \ Residual block example (skip connection)</span>\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">residual_block</span>(x, units):\n    skip = x\n    x = layers.<span\
    \ class=\"fn\">Dense</span>(units, activation=<span class=\"str\">'relu'</span>)(x)\n\
    \    x = layers.<span class=\"fn\">Dense</span>(units)(x)           <span class=\"\
    cm\"># no activation yet</span>\n    x = layers.<span class=\"fn\">Add</span>()([x,\
    \ skip])          <span class=\"cm\"># add skip connection</span>\n    x = layers.<span\
    \ class=\"fn\">Activation</span>(<span class=\"str\">'relu'</span>)(x)    <span\
    \ class=\"cm\"># activation after add</span>\n    <span class=\"kw\">return</span>\
    \ x</pre>\n</div>\n<h3 class=\"sh3\">\n       3. Understanding model.summary()\
