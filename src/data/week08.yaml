  quizzes:
  - num_str: Q1 OF 3
    question: You set EarlyStopping with patience=5. Training starts, and val_loss
      stops improving at epoch 12. At which epoch does training stop?
    qid: q55_1
    options:
    - letter: A
      text: Epoch 12
      is_correct: false
    - letter: B
      text: Epoch 17 (12 + 5 patience epochs)
      is_correct: true
    - letter: C
      text: Epoch 5
      is_correct: false
    - letter: D
      text: The maximum epochs specified in model.fit()
      is_correct: false
    correct_fb: "✅ Correct! EarlyStopping waits\n        \n         patience\n   \
      \     \n        epochs after the monitored metric stops improving. If val_loss\
      \ stops improving at epoch 12, it waits 5 more epochs (13, 14, 15, 16, 17) to\
      \ confirm the plateau, then stops at epoch 17. With restore_best_weights=True,\
      \ the weights from epoch 12 are restored — the final model is the best one,\
      \ not the last one."
    wrong_fb: "❌ EarlyStopping does NOT stop immediately when val_loss stagnates.\
      \ It waits\n        \n         patience\n        \n        more epochs. If patience=5\
      \ and best was at epoch 12, training stops at epoch 12+5=17. restore_best_weights=True\
      \ then reverts to epoch 12's weights."
  - num_str: Q2 OF 3
    question: A Dense layer has 512 input units and 256 output units. How many trainable
      parameters does it have?
    qid: q55_2
    options:
    - letter: A
      text: 512 × 256 = 131,072
      is_correct: false
    - letter: B
      text: 512 × 256 + 256 = 131,328 (weights + biases)
      is_correct: true
    - letter: C
      text: 256 (only output neurons have parameters)
      is_correct: false
    - letter: D
      text: (512 + 256) × 2 = 1,536
      is_correct: false
    correct_fb: ✅ Correct! A Dense layer has (n_in × n_out) weight parameters + n_out
      bias parameters = 512×256 + 256 = 131,072 + 256 = 131,328. Each output neuron
      has one bias, but each connection between input and output is a separate weight.
      Always check model.summary() — unexpected parameter counts reveal architecture
      bugs.
    wrong_fb: ❌ A Dense layer has (n_in × n_out) weights + n_out biases. 512×256 =
      131,072 weights, plus 256 bias terms = 131,328 total. The biases are easy to
      forget — every output neuron gets its own bias regardless of input size.
  - num_str: Q3 OF 3
    question: You want to build a model that takes two inputs (image + metadata) and
      produces two outputs (classification + regression). Which Keras API should you
      use?
    qid: q55_3
    options:
    - letter: A
      text: Sequential API — add more layers
      is_correct: false
    - letter: B
      text: Functional API — it supports multi-input and multi-output architectures
      is_correct: true
    - letter: C
      text: Subclassing API — it's the most flexible
      is_correct: false
    - letter: D
      text: Build two separate Sequential models and merge manually
      is_correct: false
    correct_fb: ✅ Correct! The Functional API is designed for non-linear model graphs
      — multiple inputs, multiple outputs, shared layers, and skip connections. Sequential
      is only for straight-line architectures. Subclassing (keras.Model subclass)
      is more flexible but less accessible — use Functional for 95% of non-sequential
      architectures.
    wrong_fb: ❌ Sequential can't handle multi-input or multi-output architectures.
      The Functional API lets you define inputs explicitly (keras.Input), pass them
      through layers, and combine multiple output tensors. This is the right tool
      for this job.
  flashcards:
  - front: Feedforward Networks?
    back: 'Information flows in one direction: input -&gt; hidden layers -&gt; output.
      No recurrent loops or backward cycles.'
  - front: Mathematical objective function measuring the discrepancy between model
      predictions ŷ and true labels y, optimized via gradient descent.
    back: Calculates loss function gradients w.r.t weights using the Chain Rule, propagating
      backward to update parameters.
  - front: ReLU Activation?
    back: f(x) = max(0, x). Solves vanishing gradient problem in deep networks; fast
      to compute and induces sparsity.
  - front: Vanishing Gradient?
    back: In deep networks, backpropagated gradients shrink exponentially in early
      layers, stopping weight updates.
  - front: Softmax Function?
    back: Converts raw score vectors (logits) into a probability distribution summing
      to 1. Used in multi-class output layers.
  gotcha:
    title: '⚠️ Gotcha: Cross-Entropy Loss Input Expectations'
    description: PyTorch's `nn.CrossEntropyLoss` expects raw logits as input and automatically
      applies Softmax. Do NOT pass Softmax outputs into it!
  takeaways:
