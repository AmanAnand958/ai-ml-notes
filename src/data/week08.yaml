  quizzes:
  - num_str: Q1 OF 3
    question: You are building a hidden layer in a deep neural network for image classification.
      Which activation function should you use by default in 2025?
    qid: q53_1
    options:
    - letter: A
      text: Sigmoid — it's smooth and maps to (0,1)
      is_correct: false
    - letter: B
      text: ReLU — computationally cheap, no vanishing gradient for positive inputs
      is_correct: true
    - letter: C
      text: Tanh — it's zero-centered, unlike sigmoid
      is_correct: false
    - letter: D
      text: Softmax — it gives probabilities
      is_correct: false
    correct_fb: ✅ Correct! ReLU (and its variants like Leaky ReLU, ELU) is the default
      for hidden layers. It doesn't saturate for positive inputs, is computationally
      trivial (max(0,z)), and enables training of very deep networks. Sigmoid and
      tanh both suffer from vanishing gradients in deep networks. Softmax is only
      for output layers in multi-class problems.
    wrong_fb: ❌ In modern deep learning, ReLU is the standard default for hidden layers.
      Sigmoid and tanh cause vanishing gradients in deep networks — their derivatives
      are ≤ 0.25 and ≤ 1 respectively, so multiplying them across 20 layers makes
      gradients vanish. ReLU's derivative is always exactly 1 for positive inputs.
  - num_str: Q2 OF 3
    question: What is the "dying ReLU" problem and which activation fixes it?
    qid: q53_2
    options:
    - letter: A
      text: ReLU outputs explode to infinity; fixed by sigmoid
      is_correct: false
    - letter: B
      text: Neurons with negative pre-activation always output 0 and receive zero
        gradient, permanently deactivating; fixed by Leaky ReLU
      is_correct: true
    - letter: C
      text: ReLU cannot handle negative inputs at all; fixed by tanh
      is_correct: false
    - letter: D
      text: ReLU causes vanishing gradients; fixed by sigmoid
      is_correct: false
    correct_fb: ✅ Correct! When a neuron's pre-activation is negative, ReLU outputs
      0. The gradient is also 0, so no weight updates flow back through that neuron.
      If this happens persistently (e.g. a large negative bias), the neuron "dies"
      permanently. Leaky ReLU uses α·z (e.g. 0.01z) for z &lt; 0, giving a small non-zero
      gradient that keeps the neuron alive.
    wrong_fb: '❌ Dying ReLU: when z &lt; 0, ReLU outputs 0 AND gradient = 0. The neuron
      receives no learning signal and stays dead. Leaky ReLU allows a small gradient
      (0.01z) for negative inputs, keeping neurons alive. This is a key reason Leaky
      ReLU and ELU are preferred in some architectures.'
  - num_str: Q3 OF 3
    question: In a forward pass, the input X has shape [784, 128] (784 features, 128
      samples). W1 has shape [256, 784]. What is the shape of Z1 = W1 @ X + b1?
    qid: q53_3
    options:
    - letter: A
      text: '[784, 128]'
      is_correct: false
    - letter: B
      text: '[256, 128]'
      is_correct: true
    - letter: C
      text: '[256, 784]'
      is_correct: false
    - letter: D
      text: '[128, 256]'
      is_correct: false
    correct_fb: '✅ Correct! Matrix multiplication: [256, 784] @ [784, 128] = [256,
      128]. The inner dimensions (784) must match and cancel; the outer dimensions
      (256 neurons, 128 samples) survive. Always check shapes — shape errors are the
      #1 bug in neural network code. The bias b1 has shape [256, 1] and broadcasts
      across all 128 samples.'
    wrong_fb: '❌ Matrix multiply rule: [m, k] @ [k, n] = [m, n]. So [256, 784] @ [784,
      128] = [256, 128]. The 784 (inner dims) cancel. Result: 256 neurons × 128 samples.
      Keeping track of shapes is the single most important debugging skill in deep
      learning.'
  flashcards:
  - front: Feedforward Networks?
    back: 'Information flows in one direction: input -&gt; hidden layers -&gt; output.
      No recurrent loops or backward cycles.'
  - front: Mathematical objective function measuring the discrepancy between model
      predictions ŷ and true labels y, optimized via gradient descent.
    back: Calculates loss function gradients w.r.t weights using the Chain Rule, propagating
      backward to update parameters.
  - front: ReLU Activation?
    back: f(x) = max(0, x). Solves vanishing gradient problem in deep networks; fast
      to compute and induces sparsity.
  - front: Vanishing Gradient?
    back: In deep networks, backpropagated gradients shrink exponentially in early
      layers, stopping weight updates.
  - front: Softmax Function?
    back: Converts raw score vectors (logits) into a probability distribution summing
      to 1. Used in multi-class output layers.
  gotcha:
    title: '⚠️ Gotcha: Cross-Entropy Loss Input Expectations'
    description: PyTorch's `nn.CrossEntropyLoss` expects raw logits as input and automatically
      applies Softmax. Do NOT pass Softmax outputs into it!
  takeaways:
    hinglish_line: "<strong>\n         Ek line mein:\n        </strong>\n        Activation\
      \ functions neural networks mein non-linearity add karte hain taaki complex\
      \ mapping aur patterns ko learn kiya ja sake."
    bullets:
    - "<strong>\n          Sigmoid\n         </strong>\n         squashes to (0,1)\
      \ — great for probability but saturates and kills gradients.\n         <strong>\n\
      \          Tanh\n         </strong>\n         is zero-centered, also saturates."
    - "<strong>\n          ReLU\n         </strong>\n         is the default hidden\
      \ activation: f(x)=max(0,x). Fast, non-saturating, but \"dead ReLU\" is a risk\
      \ (use Leaky ReLU)."
    - "<strong>\n          Weight initialisation matters:\n         </strong>\n  \
      \       He init for ReLU, Xavier/Glorot for tanh/sigmoid. Bad init → vanishing/exploding\
      \ gradients."
    - "<strong>\n          Forward propagation\n         </strong>\n         is Z\
      \ = W·X + b, A = activation(Z). Layers stack: input → hidden₁ → hidden₂ → ...\
      \ → output."
