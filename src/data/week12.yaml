- id: 85
  day_num: 85
  title: 'Capstone Part 4: Greedy vs. Beam Search Inference Decoding'
  subtitle: |-
    During sequence generation inference, a model outputs probability distributions over the vocabulary step-by-step. How we select tokens from these distributions dictates the quality of generated captions.
     Today, we master advancedInference Decoding Algorithms. We will compare standardGreedy Searchagainst the high-performanceBeam Searchalgorithm, analyzing path probabilities, vocabulary search spaces, and tracking cumulative log-probabilities to decode optimal captions.
  time_estimate: 5.5 hours
  difficulty: Medium
  badges:
