  tasks:
  - title: Implement Bahdanau Additive Attention
    badge: Hard · 3 hrs
    badge_class: tb-hard
    time: 90 min
    prompt_html: |-
      <p><strong>
                Build a custom PyTorch module for Bahdanau Additive Attention:
                <br/>
                1. Accept query of shape (Batch, 1, Hidden) and keys/values of shape (Batch, SeqLen, Hidden).
                <br/>
                2. Project query and keys using two linear layers: W_a and U_a.
                <br/>
                3. Compute raw scores: v_a^T * tanh(W_a(query) + U_a(keys)). Keep dimensions aligned!
                <br/>
                4. Apply Softmax to get attention weights.
                <br/>
                5. Compute context vector as batch matrix multiplication between weights and values.
               </strong></p>
    done_when: Your module inherits from nn.Module, instantiates without errors, runs a forward pass on query of shape (8, 1, 64) and keys of shape (8, 15, 64), and outputs a context vector of shape (8, 1, 64) along with attention weights of shape (8, 1, 15).
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day80: complete day 80 tasks and coding exercises"'
    sol_id: sol-w12d80t1
    solution_title: ✅ COMPLETE SOLUTION — implement_bahdanau_additive_attention.py
    solution_code: |-
      # Day 80 Task 1: Implement Bahdanau Additive Attention Mechanism
      import numpy as np

      class BahdanauAdditiveAttention:
          def __init__(self, hidden_dim: int):
              np.random.seed(42)
              self.W_enc = np.random.randn(hidden_dim, hidden_dim) * 0.05
              self.W_dec = np.random.randn(hidden_dim, hidden_dim) * 0.05
              self.v = np.random.randn(hidden_dim, 1) * 0.05

          def score(self, encoder_states: np.ndarray, decoder_state: np.ndarray) -> np.ndarray:
              """score = v^T tanh(W_enc * h_i + W_dec * s_t)"""
              # encoder_states: (seq_len, hidden_dim), decoder_state: (hidden_dim,)
              transformed_enc = encoder_states @ self.W_enc
              transformed_dec = decoder_state @ self.W_dec
              energy = np.tanh(transformed_enc + transformed_dec)
              scores = (energy @ self.v).squeeze(-1)
              # Softmax
              exp_scores = np.exp(scores - np.max(scores))
              weights = exp_scores / np.sum(exp_scores)
              context = weights @ encoder_states
              return context, weights

      hidden_dim = 16
      attn = BahdanauAdditiveAttention(hidden_dim=hidden_dim)
      enc_out = np.random.randn(8, hidden_dim)
      dec_s = np.random.randn(hidden_dim)
      ctx, weights = attn.score(enc_out, dec_s)

      print("Attention Context Vector Shape:", ctx.shape)
      print("Attention Weights Sum:", round(float(np.sum(weights)), 5))
      assert ctx.shape == (hidden_dim,)
      assert abs(np.sum(weights) - 1.0) < 1e-4
      print("✓ Bahdanau additive attention verified.")
    solution_lang: python
  - title: Compute BLEU-1 and BLEU-2 Manually
    badge: Medium · 1.5 hrs
    badge_class: tb-med
    time: 45 min
    prompt_html: |-
      <p>
                 Given the following sequences:
                 <br/>
                 -
                 <strong>
                  Reference:
                 </strong>
                 "the quick brown fox jumps over the lazy dog"
                 <br/>
                 -
                 <strong>
                  Candidate:
                 </strong>
                 "the quick brown fox jumps over lazy dog"
                 <br/>
      <br/>
                 Calculate:
                 <br/>
                 1. BLEU-1 (unigram precision) incorporating brevity penalty (BP) calculation.
                 <br/>
                 2. BLEU-2 (bigram precision) calculation.
                 <br/>
                 3. Validate your manual calculations using nltk.translate.bleu_score in a Python script.
                </p>
    done_when: Your manual calculation details matches Python NLTK output values precisely, highlighting how candidate length vs reference length scales the brevity penalty exponent.
    git_cmd: 'git add compute_bleu_1_and_bleu_2_manually.py &amp;&amp; git commit -m "feat(day): day80: compute-bleu-1-and-bleu-2-manually"'
    sol_id: sol-w12d80t2
    solution_title: Production Implementation — Compute BLEU-1 and BLEU-2 Manually
    solution_code: |-
      # Day 80 Task 2: Compute BLEU-1 and BLEU-2 Scores
      from collections import Counter
      import numpy as np

      def compute_bleu_n(reference: list, candidate: list, n: int = 2) -> float:
          def get_ngrams(seq, n_gram):
              return [tuple(seq[i:i + n_gram]) for i in range(len(seq) - n_gram + 1)]

          precisions = []
          for k in range(1, n + 1):
              ref_ngrams = Counter(get_ngrams(reference, k))
              cand_ngrams = Counter(get_ngrams(candidate, k))
              if not cand_ngrams: return 0.0
              clipped = sum(min(count, ref_ngrams[ng]) for ng, count in cand_ngrams.items())
              precisions.append(clipped / sum(cand_ngrams.values()))

          # Brevity penalty
          c, r = len(candidate), len(reference)
          bp = 1.0 if c > r else np.exp(1.0 - r / max(c, 1e-9))
          score = bp * np.exp(np.mean(np.log([max(p, 1e-9) for p in precisions])))
          return float(score)

      ref = "the fast cat jumped over the lazy dog".split()
      cand = "the fast cat jumped over lazy dog".split()
      bleu2 = compute_bleu_n(ref, cand, n=2)
      print(f"BLEU-2 Score: {bleu2:.4f}")
      assert 0.0 <= bleu2 <= 1.0
      print("✓ BLEU calculation verified.")
    solution_lang: python
