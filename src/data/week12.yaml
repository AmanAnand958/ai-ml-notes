  hinglish: '💡 Attention mechanism ka intuition: Pure sentence ko ek vector mein compress karne ke bajaye, decoder translation ke waqt har input word ko relevant weight deta hai. Bahdanau additive score use karta hai aur Luong multiplicative dot-product use karta hai.'
  analogy: 'Think of it like this: Traditional Seq2Seq ek bilkul aisi book summaries ki tarah hai jahan ek student ko puri kitab padh kar exam hall me sirf ek chhota sa paragraph (fixed context vector) likhne diya jata hai, jisse details bhool jati hain. Attention mechanism exam hall me student ko puri open-book library access (historical hidden states) deta hai jahan wo har sawaal (decoder step) likhte waqt specific lines par direct ungli (attention weights) rakh kar reference le sakta hai.'
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<div class=\"math-block\" style=\"background:var(--bg3); padding:1rem; border-radius:8px; margin:1rem 0; border:1px solid var(--border);\">\n<p><strong>Low-Rank Adaptation (LoRA) Weight Decomposition:</strong></p>\n$$W = W_0 + \\Delta W = W_0 + \\frac{\\alpha}{r} (B \\times A)$$\n<p style=\"font-size:13px; color:var(--muted); margin-top:0.5rem;\">\nWhere $W_0 \\in \\mathbb{R}^{d \\times k}$ is frozen, $A \\sim \\mathcal{N}(0, \\sigma^2) \\in \\mathbb{R}^{r \\times k}$, $B = 0 \\in \\mathbb{R}^{d \\times r}$, with rank $r \\ll \\min(d, k)$ and scaling constant $\\alpha$.\n</p>\n</div>\n<h3 class=\"sh3\">\n       1. The Seq2Seq Information Bottleneck\n      </h3>\n<p>\n       In classic Encoder-Decoder networks (like GRUs or LSTMs), the final hidden state of the Encoder $h_T$ serves as the sole context vector $c$ passed to initialize the Decoder:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n    \
    \    $$c = h_T$$\n       </span>\n<span class=\"desc\">\n        Where h_T summarizes the entire input sequence regardless of its length.\n       </span>\n</div>\n<p>\n       This acts as a severe compression bottleneck. When the input sequence has 30+ words, the early details are lost through the sequential recursive steps.\n    Attention introduces a dynamic context vector $c_t$ at each decoding step $t$, which is a weighted sum of all encoder hidden states $\\{h_1, h_2, \\dots, h_T\\}$.\n      </p>\n<h3 class=\"sh3\">\n       2. Bahdanau (Additive) vs. Luong (Dot-Product) Attention\n      </h3>\n<p>\n       The core of the attention mechanism is calculating an\n       <strong>\n        alignment score\n       </strong>\n       $e_{t,i}$ measuring how well the input at position $i$ aligns with the output at position $t$:\n      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         Bahdanau (Additive) Attention:\n        </strong>\n        Employs a single hidden-layer feedforward\
    \ network where the alignment score is calculated as:\n        <div class=\"math-block\">\n<span class=\"formula\">\n          $$e_{t,i} = v_a^{\\top} \\tanh(W_a s_{t-1} + U_a h_i)$$\n         </span>\n</div>\n        where $s_{t-1}$ is the previous decoder hidden state, $h_i$ is the $i$-th encoder hidden state, and $v_a, W_a, U_a$ are learnable projection weights.\n       </li>\n<li>\n<strong>\n         Luong (Dot-Product) Attention:\n        </strong>\n        Utilizes simpler, computationally efficient dot-product formulations:\n        <div class=\"math-block\">\n<span class=\"formula\">\n          $$e_{t,i} = s_t^{\\top} W_a h_i$$\n         </span>\n</div>\n        where $s_t$ is the current decoder hidden state. If $W_a = I$ (identity matrix), this simplifies to the basic dot-product: $e_{t,i} = s_t \\cdot h_i$.\n       </li>\n</ul>\n<h3 class=\"sh3\">\n       3. Deriving Attention Weights and Context Vectors\n      </h3>\n<p>\n       Once alignment scores $e_{t,i}$ are calculated,\
    \ we apply a softmax function over all input sequence positions to compute the\n       <strong>\n        attention weights\n       </strong>\n       $\\alpha_{t,i}$:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$\\alpha_{t,i} = \\frac{\\exp(e_{t,i})}{\\sum_{j=1}^T \\exp(e_{t,j})}$$\n       </span>\n<span class=\"desc\">\n        Softmax normalizes scores such that they form a valid probability distribution over input steps.\n       </span>\n</div>\n<p>\n       The dynamic context vector $c_t$ is then calculated as the weighted sum of encoder hidden states:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$c_t = \\sum_{i=1}^T \\alpha_{t,i} h_i$$\n       </span>\n</div>\n<p>\n       This context vector is concatenated with the decoder hidden state $s_t$ (or input) to produce the final attentional vector used to predict the next word token.\n      </p>\n<svg aria-label=\"Attention: softmax weights alpha over encoder hidden states\
    \ and the resulting weighted-sum context vector\" height=\"330\" role=\"img\" style=\"max-width: 100%; height: auto;\" viewbox=\"0 0 700 330\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\">\n<style>\n        svg .w12t{font-family:DM Sans,sans-serif} svg .w12m{font-family:IBM Plex Mono,monospace}\n       </style>\n<defs>\n<lineargradient id=\"w12-bg_s\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n<stop offset=\"0%\" stop-color=\"#1a1e2e\">\n</stop>\n<stop offset=\"100%\" stop-color=\"var(--bg)\">\n</stop>\n</lineargradient>\n</defs>\n<rect fill=\"url(#w12-bg_s)\" height=\"330\" rx=\"12\" width=\"700\">\n</rect>\n<text class=\"w12t\" fill=\"#e6edf3\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" x=\"350\" y=\"26\">\n        Attention weights — softmax turns scores into a spotlight over the source\n       </text>\n<rect fill=\"#6c8cff\" fill-opacity=\"0.15\" height=\"34\" rx=\"8\" stroke=\"#6c8cff\" stroke-width=\"1.5\" width=\"170\" x=\"80\" y=\"44\">\n</rect>\n<text class=\"\
    w12t\" fill=\"#6c8cff\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"165\" y=\"65\">\n        decoder query s_t = \"sat?\"\n       </text>\n<line stroke=\"#6c8cff\" stroke-opacity=\"0.7\" stroke-width=\"1.4\" x1=\"165\" x2=\"260\" y1=\"78\" y2=\"92\">\n</line>\n<g>\n<rect fill=\"var(--bg)\" fill-opacity=\"0.6\" height=\"36\" rx=\"6\" stroke=\"#2a3050\" stroke-width=\"1.2\" width=\"130\" x=\"80\" y=\"98\">\n</rect>\n<text class=\"w12t\" fill=\"#e6edf3\" font-size=\"11\" text-anchor=\"start\" x=\"92\" y=\"121\">\n         the · h₁\n        </text>\n<rect fill=\"var(--bg)\" fill-opacity=\"0.6\" height=\"36\" rx=\"6\" stroke=\"#2a3050\" stroke-width=\"1.2\" width=\"130\" x=\"80\" y=\"138\">\n</rect>\n<text class=\"w12t\" fill=\"#e6edf3\" font-size=\"11\" text-anchor=\"start\" x=\"92\" y=\"161\">\n         cat · h₂\n        </text>\n<rect fill=\"var(--bg)\" fill-opacity=\"0.6\" height=\"36\" rx=\"6\" stroke=\"#2a3050\" stroke-width=\"1.2\" width=\"130\" x=\"80\" y=\"178\"\
    >\n</rect>\n<text class=\"w12t\" fill=\"#e6edf3\" font-size=\"11\" text-anchor=\"start\" x=\"92\" y=\"201\">\n         sat · h₃\n        </text>\n<rect fill=\"var(--bg)\" fill-opacity=\"0.6\" height=\"36\" rx=\"6\" stroke=\"#2a3050\" stroke-width=\"1.2\" width=\"130\" x=\"80\" y=\"218\">\n</rect>\n<text class=\"w12t\" fill=\"#e6edf3\" font-size=\"11\" text-anchor=\"start\" x=\"92\" y=\"241\">\n         on · h₄\n        </text>\n</g>\n<rect fill=\"#6c8cff\" fill-opacity=\"0.12\" height=\"36\" rx=\"6\" stroke=\"#6c8cff\" stroke-width=\"1.2\" width=\"56\" x=\"250\" y=\"98\">\n</rect>\n<text class=\"w12m\" fill=\"#e6edf3\" font-size=\"11\" text-anchor=\"middle\" x=\"278\" y=\"121\">\n        0.02\n       </text>\n<rect fill=\"#e56b8c\" fill-opacity=\"0.92\" height=\"36\" rx=\"6\" stroke=\"#e56b8c\" stroke-width=\"1.2\" width=\"56\" x=\"250\" y=\"138\">\n</rect>\n<text class=\"w12m\" fill=\"var(--bg)\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"278\" y=\"161\">\n    \
    \    0.48\n       </text>\n<rect fill=\"#e56b8c\" fill-opacity=\"0.85\" height=\"36\" rx=\"6\" stroke=\"#e56b8c\" stroke-width=\"1.2\" width=\"56\" x=\"250\" y=\"178\">\n</rect>\n<text class=\"w12m\" fill=\"var(--bg)\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"278\" y=\"201\">\n        0.47\n       </text>\n<rect fill=\"#6c8cff\" fill-opacity=\"0.14\" height=\"36\" rx=\"6\" stroke=\"#6c8cff\" stroke-width=\"1.2\" width=\"56\" x=\"250\" y=\"218\">\n</rect>\n<text class=\"w12m\" fill=\"#e6edf3\" font-size=\"11\" text-anchor=\"middle\" x=\"278\" y=\"241\">\n        0.03\n       </text>\n<text class=\"w12t\" fill=\"var(--text2)\" font-size=\"9.5\" text-anchor=\"middle\" x=\"278\" y=\"274\">\n        αᵢ = softmax(eᵢ)\n       </text>\n<text class=\"w12m\" fill=\"var(--text2)\" font-size=\"9.5\" text-anchor=\"middle\" x=\"278\" y=\"288\">\n        Σαᵢ = 1.00\n       </text>\n<path d=\"M 306 120 L 520 190\" stroke=\"#e56b8c\" stroke-opacity=\"0.6\" stroke-width=\"1.6\"\
    >\n</path>\n<path d=\"M 306 160 L 520 190\" stroke=\"#e56b8c\" stroke-opacity=\"0.55\" stroke-width=\"1.6\">\n</path>\n<path d=\"M 306 200 L 520 190\" stroke=\"#b47cfc\" stroke-opacity=\"0.6\" stroke-width=\"1.6\">\n</path>\n<path d=\"M 306 240 L 520 190\" stroke=\"#6c8cff\" stroke-opacity=\"0.4\" stroke-width=\"1.2\">\n</path>\n<g>\n<rect fill=\"var(--bg)\" fill-opacity=\"0.6\" height=\"52\" rx=\"8\" stroke=\"#4fd1a5\" stroke-width=\"1.8\" width=\"130\" x=\"520\" y=\"164\">\n</rect>\n<text class=\"w12t\" fill=\"#4fd1a5\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"585\" y=\"188\">\n         c_t = Σ αᵢ hᵢ\n        </text>\n<text class=\"w12t\" fill=\"var(--text2)\" font-size=\"9.5\" text-anchor=\"middle\" x=\"585\" y=\"204\">\n         context vector\n        </text>\n</g>\n<text class=\"w12t\" fill=\"var(--text2)\" font-size=\"10\" text-anchor=\"middle\" x=\"350\" y=\"316\">\n        \"sat\" aligns with cat + sat (α ≈ 0.95) → context ≈ blend of those hidden states\n\
    \       </text>\n</svg>\n<h3 class=\"sh3\">\n       4. Step-by-Step Mathematical Matrix Trace of Additive Attention\n      </h3>\n<p>\n       Let's calculate the exact alignment scores and attention weights manually.\n    Suppose our decoder hidden state query is $s_{t-1} = [0.5, -0.2]^{\\top}$ and we have two encoder states $h_1 = [0.8, 0.1]^{\\top}$ and $h_2 = [-0.3, 0.9]^{\\top}$.\n    Our attention parameters are:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n       $$W_a = \\begin{pmatrix} 0.2 &amp; 0.4 \\\\ -0.1 &amp; 0.3 \\end{pmatrix}, \\quad U_a = \\begin{pmatrix} 0.5 &amp; -0.2 \\\\ 0.1 &amp; 0.6 \\end{pmatrix}, \\quad v_a = \\begin{pmatrix} 0.8 \\\\ 0.5 \\end{pmatrix}$$\n</span>\n</div>\n<p>\n<strong>\n        Step 4.1: Compute query projection $W_a s_{t-1}$:\n       </strong>\n</p>\n<div class=\"math-block\">\n<span class=\"formula\">\n       $$W_a s_{t-1} = \\begin{pmatrix} 0.2 &amp; 0.4 \\\\ -0.1 &amp; 0.3 \\end{pmatrix} \\begin{pmatrix} 0.5 \\\\ -0.2\
    \ \\end{pmatrix} = \\begin{pmatrix} (0.2)(0.5) + (0.4)(-0.2) \\\\ (-0.1)(0.5) + (0.3)(-0.2) \\end{pmatrix} = \\begin{pmatrix} 0.02 \\\\ -0.11 \\end{pmatrix}$$\n</span>\n</div>\n<p>\n<strong>\n        Step 4.2: Compute key projections $U_a h_i$:\n       </strong>\n</p>\n<div class=\"math-block\">\n<span class=\"formula\">\n       $$U_a h_1 = \\begin{pmatrix} 0.5 &amp; -0.2 \\\\ 0.1 &amp; 0.6 \\end{pmatrix} \\begin{pmatrix} 0.8 \\\\ 0.1 \\end{pmatrix} = \\begin{pmatrix} 0.4 - 0.02 \\\\ 0.08 + 0.06 \\end{pmatrix} = \\begin{pmatrix} 0.38 \\\\ 0.14 \\end{pmatrix}$$\n       $$U_a h_2 = \\begin{pmatrix} 0.5 &amp; -0.2 \\\\ 0.1 &amp; 0.6 \\end{pmatrix} \\begin{pmatrix} -0.3 \\\\ 0.9 \\end{pmatrix} = \\begin{pmatrix} -0.15 - 0.18 \\\\ -0.03 + 0.54 \\end{pmatrix} = \\begin{pmatrix} -0.33 \\\\ 0.51 \\end{pmatrix}$$\n</span>\n</div>\n<p>\n<strong>\n        Step 4.3: Compute raw score $e_{t,1}$ for $h_1$:\n       </strong>\n</p>\n<div class=\"math-block\">\n<span class=\"formula\">\n       $$\\text{Sum}_1\
    \ = W_a s_{t-1} + U_a h_1 = \\begin{pmatrix} 0.02 \\\\ -0.11 \\end{pmatrix} + \\begin{pmatrix} 0.38 \\\\ 0.14 \\end{pmatrix} = \\begin{pmatrix} 0.40 \\\\ 0.03 \\end{pmatrix}$$\n       $$\\tanh(\\text{Sum}_1) = \\begin{pmatrix} \\tanh(0.40) \\\\ \\tanh(0.03) \\end{pmatrix} \\approx \\begin{pmatrix} 0.3799 \\\\ 0.0300 \\end{pmatrix}$$\n       $$e_{t,1} = v_a^{\\top} \\tanh(\\text{Sum}_1) = \\begin{pmatrix} 0.8 &amp; 0.5 \\end{pmatrix} \\begin{pmatrix} 0.3799 \\\\ 0.0300 \\end{pmatrix} \\approx 0.3039 + 0.0150 = 0.3189$$\n</span>\n</div>\n<p>\n<strong>\n        Step 4.4: Compute raw score $e_{t,2}$ for $h_2$:\n       </strong>\n</p>\n<div class=\"math-block\">\n<span class=\"formula\">\n       $$\\text{Sum}_2 = W_a s_{t-1} + U_a h_2 = \\begin{pmatrix} 0.02 \\\\ -0.11 \\end{pmatrix} + \\begin{pmatrix} -0.33 \\\\ 0.51 \\end{pmatrix} = \\begin{pmatrix} -0.31 \\\\ 0.40 \\end{pmatrix}$$\n       $$\\tanh(\\text{Sum}_2) = \\begin{pmatrix} \\tanh(-0.31) \\\\ \\tanh(0.40) \\end{pmatrix} \\approx\
    \ \\begin{pmatrix} -0.3008 \\\\ 0.3799 \\end{pmatrix}$$\n       $$e_{t,2} = v_a^{\\top} \\tanh(\\text{Sum}_2) = \\begin{pmatrix} 0.8 &amp; 0.5 \\end{pmatrix} \\begin{pmatrix} -0.3008 \\\\ 0.3799 \\end{pmatrix} \\approx -0.2406 + 0.1900 = -0.0506$$\n</span>\n</div>\n<p>\n<strong>\n        Step 4.5: Calculate attention weights via softmax:\n       </strong>\n</p>\n<div class=\"math-block\">\n<span class=\"formula\">\n       $$\\exp(e_{t,1}) = \\exp(0.3189) \\approx 1.3756, \\quad \\exp(e_{t,2}) = \\exp(-0.0506) \\approx 0.9507$$\n       $$\\Sigma = 1.3756 + 0.9507 = 2.3263$$\n       $$\\alpha_{t,1} = \\frac{1.3756}{2.3263} \\approx 0.5913, \\quad \\alpha_{t,2} = \\frac{0.9507}{2.3263} \\approx 0.4087$$\n</span>\n</div>\n<p>\n<strong>\n        Step 4.6: Calculate context vector $c_t$:\n       </strong>\n</p>\n<div class=\"math-block\">\n<span class=\"formula\">\n       $$c_t = \\alpha_{t,1} h_1 + \\alpha_{t,2} h_2 = 0.5913 \\begin{pmatrix} 0.8 \\\\ 0.1 \\end{pmatrix} + 0.4087 \\begin{pmatrix}\
    \ -0.3 \\\\ 0.9 \\end{pmatrix}$$\n       $$c_t = \\begin{pmatrix} 0.4730 \\\\ 0.0591 \\end{pmatrix} + \\begin{pmatrix} -0.1226 \\\\ 0.3678 \\end{pmatrix} = \\begin{pmatrix} 0.3504 \\\\ 0.4269 \\end{pmatrix}$$\n</span>\n</div>\n<h3 class=\"sh3\">\n       5. Computational Trace of Attention Weights\n      </h3>\n<p>\n       Let's write a NumPy-based step-by-step trace simulating Luong General Dot-Product Attention for a single decoding step over an input sequence of length 3:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — luong_attention.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\">#\
    \ 1. Setup dimensions: Hidden Dimension = 4, Input Sequence Length = 3</span>\nnp.random.<span class=\"fn\">seed</span>(<span class=\"num\">42</span>)\nencoder_states = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">3</span>, <span class=\"num\">4</span>)  <span class=\"cm\"># 3 states of shape (4,)</span>\ndecoder_state = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">4</span>)      <span class=\"cm\"># 1 state of shape (4,)</span>\nW_a = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">4</span>, <span class=\"num\">4</span>)             <span class=\"cm\"># General attention weight matrix</span>\n\n<span class=\"fn\">print</span>(<span class=\"str\">\"Encoder States H:\\\\n\"</span>, encoder_states)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Decoder State s:\\\\n\"</span>, decoder_state)\n\n<span class=\"cm\"># 2. Calculate alignment scores: e_i = s^T * W_a * h_i</span>\nscores = []\n<span class=\"kw\">for</span> h_i <span class=\"\
    kw\">in</span> encoder_states:\n    score = decoder_state.<span class=\"fn\">dot</span>(W_a).<span class=\"fn\">dot</span>(h_i)\n    scores.<span class=\"fn\">append</span>(score)\nscores = np.<span class=\"fn\">array</span>(scores)\n<span class=\"fn\">print</span>(<span class=\"str\">\"\\\\nRaw Alignment Scores e:\"</span>, scores)\n\n<span class=\"cm\"># 3. Softmax activation to get Attention Weights alpha</span>\nexp_scores = np.<span class=\"fn\">exp</span>(scores)\nweights = exp_scores / np.<span class=\"fn\">sum</span>(exp_scores)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Attention Weights alpha:\"</span>, weights)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Sum of Weights:\"</span>, np.<span class=\"fn\">sum</span>(weights))\n\n<span class=\"cm\"># 4. Context vector as weighted sum</span>\ncontext = np.<span class=\"fn\">sum</span>([w * h <span class=\"kw\">for</span> w, h <span class=\"kw\">in</span> <span class=\"fn\">zip</span>(weights, encoder_states)],\
    \ axis=<span class=\"num\">0</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"\\\\nResulting Context Vector c_t:\"</span>, context)</code></pre>\n</div>\n<h2 class=\"sh2\">\n       \U0001F6E0 Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\">\n       \U0001F50D\n       <strong>\n        Search terms:\n       </strong>\n\n        attention mechanism bahdanau vs luong math, scaled dot product attention softmax saturation\n       \n</div>\n"
