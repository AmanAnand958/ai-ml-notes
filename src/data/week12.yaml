  day_num: 83
  title: 'Capstone Part 2: Attention-Augmented Decoder Module'
  subtitle: |-
    In Phase 2 of our Major Capstone, we implement the core engine of the multi-modal caption generator: theAttention-Augmented Decoder.
     Today, we construct the decoder network in PyTorch from scratch, integrating an additive attention module directly inside a sequentialLSTMCelldecoding loop.
     We will project visual features, map word tokens, calculate soft attention maps over spatial coordinates, concatenate context vectors with token embeddings, and program theTeacher Forcingdecision logic.
