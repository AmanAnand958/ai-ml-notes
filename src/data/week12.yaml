  hinglish: Flash Attention memory-efficient attention implementation hai — IO-aware algorithm use karta hai HBM visits minimize karne ke liye. 2-4x faster standard attention se!
  analogy: Greedy search bilkul ek aise short-sighted traveler ki tarah hai jo raste ke har crossroads par sirf sabse chhaon wali sadak (immediate highest probability token) pakad leta hai, bhale hi wo sadak aage chalkar band ho jaye. Beam search ek experienced guide ki tarah hai jo ek saath 3 alag-alag potential paths (beam width K=3) par nazar rakhta hai aur pure route ki total smoothness (cumulative log probability) calculate karke best path select karta hai.
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">\n       1. The Fallacy of Greedy Search\n      </h3>\n<p>\n       Greedy Search selects the word token with the highest absolute probability at the current step:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$w_t = \\arg\\max_{w \\in \\mathcal{V}} P(w \\mid w_{\n        <t}, <span=\"\" class=\"desc\" i)$$=\"\">\n         Where the model grabs the single best token immediately.\n        </t},>\n</span>\n</div>\n<p>\n       While computationally instantaneous, this is a mathematically short-sighted heuristic. A highly probable early word might lead to a dead-end with extremely low future probabilities. Greedy search cannot backtrack, forever trapping the model in sub-optimal local basins or highly repetitive phrase loops.\n      </p>\n<h3 class=\"sh3\">\n       2. Beam Search: Tracking Top-K Candidate Paths\n      </h3>\n<p>\n       Beam Search expands the search space\
    \ by retaining the $K$ most likely sequence paths (where $K$ is the \"beam width\").\n    At each sequence step, we expand all $K$ candidates into all possible vocabulary words (yielding $K \\times |\\mathcal{V}|$ total paths). We calculate their joint cumulative probabilities by adding log-likelihoods:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$\\log P(w_1, w_2, \\dots, w_t) = \\sum_{\\tau=1}^t \\log P(w_{\\tau} \\mid w_{\\lt \\tau})$$\n       </span>\n<span class=\"desc\">\n        Using logs preserves numerical stability and prevents floating point underflow.\n       </span>\n</div>\n<p>\n       We then prune the candidate pool, keeping only the top-$K$ paths with the highest cumulative log-probabilities, and repeat the step.\n      </p>\n<h3 class=\"sh3\">\n       3. Concrete Mathematical Example of a Beam Search Tree Trace\n      </h3>\n<p>\n       Let's calculate a real, step-by-step tree expansion with beam width $K=2$ over a vocabulary $\\mathcal{V}\
    \ = \\{ \\text{\"a\"}, \\text{\"dog\"}, \\text{\"cat\"}, \\text{\"jumps\"} \\}$ plus a start marker.\n    Recall that $\\log_{10}$ is used here for ease of manual checking.\n      </p>\n<p>\n<strong>\n        Step 1: Start token expansion (from $t=0$ to $t=1$)\n       </strong>\n</p>\n<p>\n       Starting from the sequence\n       \n        [&lt;start&gt;]\n       \n       (cumulative log prob = $0.0$), our decoder projects the vocabulary probabilities:\n       <br/>\n       - $P(\\text{\"a\"}) = 0.5 \\implies \\log P = -0.301$\n       <br/>\n       - $P(\\text{\"dog\"}) = 0.4 \\implies \\log P = -0.398$\n       <br/>\n       - $P(\\text{\"cat\"}) = 0.1 \\implies \\log P = -1.000$\n       <br/>\n       Since $K=2$, we select the two paths with the highest scores. Our active beams are:\n       <br/>\n       1.\n       \n        [&lt;start&gt;, \"a\"]\n       \n       (score = $-0.301$)\n       <br/>\n       2.\n       \n        [&lt;start&gt;, \"dog\"]\n       \n       (score = $-0.398$)\n\
    \      </p>\n<p>\n<strong>\n        Step 2: Dual expansion (from $t=1$ to $t=2$)\n       </strong>\n</p>\n<p>\n       We expand both active paths to all 4 vocabulary tokens, generating $2 \\times 4 = 8$ total candidates:\n      </p>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<thead>\n<tr>\n<th>\n          Parent Path (Score)\n         </th>\n<th>\n          Next Token Candidate\n         </th>\n<th>\n          Conditional Probability $P(w_2 \\mid w_1)$\n         </th>\n<th>\n          Path Log Prob Addition\n         </th>\n<th>\n          Cumulative Path Log Prob\n         </th>\n<th>\n          Pruning Status\n         </th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n\n           [\"a\"]\n          \n          (-0.301)\n         </td>\n<td>\n\n           \"dog\"\n          \n</td>\n<td>\n          0.60\n         </td>\n<td>\n          -0.222\n         </td>\n<td>\n          -0.523\n         </td>\n<td>\n<strong>\n\
    \           ✅ KEEP (Best Path)\n          </strong>\n</td>\n</tr>\n<tr>\n<td>\n\n           [\"a\"]\n          \n          (-0.301)\n         </td>\n<td>\n\n           \"cat\"\n          \n</td>\n<td>\n          0.30\n         </td>\n<td>\n          -0.523\n         </td>\n<td>\n          -0.824\n         </td>\n<td>\n<strong>\n           ✅ KEEP (Second Best)\n          </strong>\n</td>\n</tr>\n<tr>\n<td>\n\n           [\"a\"]\n          \n          (-0.301)\n         </td>\n<td>\n\n           \"jumps\"\n          \n</td>\n<td>\n          0.08\n         </td>\n<td>\n          -1.097\n         </td>\n<td>\n          -1.398\n         </td>\n<td>\n          ❌ PRUNED\n         </td>\n</tr>\n<tr>\n<td>\n\n           [\"a\"]\n          \n          (-0.301)\n         </td>\n<td>\n\n           \"a\"\n          \n</td>\n<td>\n          0.02\n         </td>\n<td>\n          -1.699\n         </td>\n<td>\n          -2.000\n         </td>\n<td>\n          ❌ PRUNED\n         </td>\n</tr>\n<tr>\n<td>\n\
    \n           [\"dog\"]\n          \n          (-0.398)\n         </td>\n<td>\n\n           \"jumps\"\n          \n</td>\n<td>\n          0.25\n         </td>\n<td>\n          -0.602\n         </td>\n<td>\n          -1.000\n         </td>\n<td>\n          ❌ PRUNED (Out of Top-2)\n         </td>\n</tr>\n<tr>\n<td>\n\n           [\"dog\"]\n          \n          (-0.398)\n         </td>\n<td>\n\n           \"runs\"\n          \n</td>\n<td>\n          0.20\n         </td>\n<td>\n          -0.699\n         </td>\n<td>\n          -1.097\n         </td>\n<td>\n          ❌ PRUNED\n         </td>\n</tr>\n<tr>\n<td>\n\n           [\"dog\"]\n          \n          (-0.398)\n         </td>\n<td>\n\n           \"a\"\n          \n</td>\n<td>\n          0.05\n         </td>\n<td>\n          -1.301\n         </td>\n<td>\n          -1.699\n         </td>\n<td>\n          ❌ PRUNED\n         </td>\n</tr>\n</tbody>\n</table></div>\n<p>\n       After sorting and pruning all 8 candidates to keep only the top-$K$,\
    \ our new active beams are:\n       <br/>\n       1.\n       \n        [&lt;start&gt;, \"a\", \"dog\"]\n       \n       (score = $-0.523$)\n       <br/>\n       2.\n       \n        [&lt;start&gt;, \"a\", \"cat\"]\n       \n       (score = $-0.824$)\n      </p>\n<h3 class=\"sh3\">\n       4. Production PyTorch Beam Search Decoder\n      </h3>\n<p>\n       Let's write a complete, robust PyTorch implementation of our sequential Beam Search decoding loop:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — beam_search_decoder.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n\
    \n<span class=\"kw\">def</span> <span class=\"fn\">beam_search_decoding</span>(decoder, features, h_0, c_0, beam_width=<span class=\"num\">3</span>, max_len=<span class=\"num\">20</span>, start_idx=<span class=\"num\">1</span>, end_idx=<span class=\"num\">2</span>):\n    device = features.device\n    <span class=\"cm\"># Keep track of active beams as a list of dictionaries:</span>\n    <span class=\"cm\"># [{\"tokens\": [start_idx], \"log_prob\": 0.0, \"state\": (h, c)}]</span>\n    beams = [{<span class=\"str\">\"tokens\": [start_idx], \"log_prob\": 0.0, \"state\"</span>: (h_0, c_0)}]\n    completed_beams = []\n    \n    <span class=\"kw\">for</span> step <span class=\"kw\">in</span> <span class=\"fn\">range</span>(max_len):\n        candidates = []\n        <span class=\"kw\">for</span> beam <span class=\"kw\">in</span> beams:\n            tokens = beam[<span class=\"str\">\"tokens\"</span>]\n            <span class=\"kw\">if</span> tokens[-<span class=\"num\">1</span>] == end_idx:\n\
    \                completed_beams.<span class=\"fn\">append</span>(beam)\n                <span class=\"kw\">continue</span>\n                \n            h, c = beam[<span class=\"str\">\"state\"</span>]\n            \n            <span class=\"cm\"># 1. Fetch previous token and calculate attention context</span>\n            prev_token = torch.<span class=\"fn\">tensor</span>([tokens[-<span class=\"num\">1</span>]]).<span class=\"fn\">to</span>(device)\n            context, _ = decoder.<span class=\"fn\">attention</span>(features, h)\n            \n            embedded = decoder.<span class=\"fn\">embed</span>(prev_token)\n            lstm_input = torch.<span class=\"fn\">cat</span>((embedded, context), dim=<span class=\"num\">1</span>)\n            \n            <span class=\"cm\"># 2. LSTM recurrent update</span>\n            new_h, new_c = decoder.<span class=\"fn\">lstm</span>(lstm_input, (h, c))\n            logits = decoder.<span class=\"fn\">fc_out</span>(new_h)\n          \
    \  log_probs = torch.<span class=\"fn\">log_softmax</span>(logits, dim=<span class=\"num\">1</span>).<span class=\"fn\">squeeze</span>(<span class=\"num\">0</span>)\n            \n            <span class=\"cm\"># 3. Expand candidate search pool</span>\n            top_val, top_idx = torch.<span class=\"fn\">topk</span>(log_probs, beam_width)\n            <span class=\"kw\">for</span> val, idx <span class=\"kw\">in</span> <span class=\"fn\">zip</span>(top_val, top_idx):\n                candidates.<span class=\"fn\">append</span>({\n                    <span class=\"str\">\"tokens\"</span>: tokens + [idx.<span class=\"fn\">item</span>()],\n                    <span class=\"str\">\"log_prob\": beam[\"log_prob\"</span>] + val.<span class=\"fn\">item</span>(),\n                    <span class=\"str\">\"state\"</span>: (new_h, new_c)\n                })\n                \n        <span class=\"kw\">if</span> <span class=\"kw\">not</span> candidates:\n            <span class=\"kw\">break</span>\n\
    \            \n        <span class=\"cm\"># 4. Prune candidate pool, keeping top-K beams</span>\n        candidates = <span class=\"fn\">sorted</span>(candidates, key=<span class=\"kw\">lambda</span> x: x[<span class=\"str\">\"log_prob\"</span>], reverse=<span class=\"kw\">True</span>)\n        beams = candidates[:beam_width]\n        \n    <span class=\"cm\"># Merge completed and active beams, select best path</span>\n    all_beams = completed_beams + beams\n    best_beam = <span class=\"fn\">sorted</span>(all_beams, key=<span class=\"kw\">lambda</span> x: x[<span class=\"str\">\"log_prob\"</span>], reverse=<span class=\"kw\">True</span>)[<span class=\"num\">0</span>]\n    <span class=\"kw\">return</span> best_beam[<span class=\"str\">\"tokens\"</span>]\n\n<span class=\"fn\">print</span>(<span class=\"str\">\"Beam Search decoder configured with log-likelihood expansions.\"</span>)</code></pre>\n</div>\n<h2 class=\"sh2\">\n       \U0001F6E0 Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size:\
    \ 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\">\n       \U0001F50D\n       <strong>\n        Search terms:\n       </strong>\n\n        multi head attention projection dimensions split, scaled dot product attention transpose shapes\n       \n</div>\n<div class=\"diagram-container\" style=\"background:var(--bg3); padding:1.2rem; border-radius:8px; margin:1.5rem auto; border:1px solid var(--border); text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center;\">\n<h4 style=\"color:var(--accent); margin-top:0; font-size:1.05rem;\">Architecture Blueprint: KV Cache Prefill vs Incremental Auto-Regressive Decoding</h4>\n<div class=\"mermaid\">\ngraph TD\n    subgraph Prefill[\"1. Prefill Phase (Compute-Bound)\"]\n        P_In[\"Prompt Tokens [t_1, t_2, t_3]\"] --&gt; P_Attn[\"Parallel Full Attention\"] --&gt; P_KV[\"Store Keys &amp; Values in KV Cache\"]\n    end\n    subgraph Decode[\"2. Generation Phase (Memory-Bandwidth Bound)\"\
    ]\n        D_In[\"New Token t_4\"] --&gt; D_Attn[\"Query t_4 Attends to [Cached KV 1..3 + New KV 4]\"]\n        D_Attn --&gt; D_Out[\"Sample t_5 -&gt; Append KV_4 -&gt; Repeat\"]\n    end\n</div>\n</div>\n"
