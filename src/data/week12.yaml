  hinglish: Bahdanau Additive Attention LSTM decoder ko har word predict karte waqt image ke relevant spatial patches par dynamic attention weights focus karne ki ability deta hai.
  analogy: 'Think of it like this: Attention decoder module bilkul ek high-speed translation engine ki tarah hai. Ye image feature tokens ko text inputs ke saath concatenate karke recurrent equations run karta hai, aur check karta hai ki generation flow path balance me rahe.'
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">\n       1. Attentional Decoder Math Flow\n      </h3>\n<p>\n       Our Decoder generates text captions token-by-token. At each step $t$, the decoder hidden state $h_t$ is used as a \"query\" to check where the model should look in the spatial visual grid \"keys\" $V_{\\text{proj}}$:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$e_{t,i} = v_a^{\\top} \\tanh(W_a h_{t-1} + U_a V_{\\text{proj},i})$$\n       </span>\n<span class=\"desc\">\n        Where alignment scores are calculated for each of the 49 visual region features.\n       </span>\n</div>\n<p>\n       The alignment scores are normalized to weights $\\alpha_{t,i}$ via softmax. The resulting weighted context vector $c_t = \\sum \\alpha_{t,i} V_{\\text{proj},i}$ represents the focused visual detail, which is concatenated with the current word token embedding vector and fed into the recurrent cell.\n      </p>\n<h3\
    \ class=\"sh3\">\n       2. PyTorch Sequential Decoding Loop\n      </h3>\n<p>\n       Standard recurrent networks like\n       \n        nn.LSTM\n       \n       process sequence tensors as a single black box. For attention-augmented decoders, we must process step-by-step manually using\n       \n        nn.LSTMCell\n       \n       , since the attention weights depend dynamically on the previous recurrent hidden states.\n      </p>\n<h3 class=\"sh3\">\n       3. Bidirectional Encoder Hidden States Combination\n      </h3>\n<p>\n       When extracting visual or textual features from a bidirectional sequential encoder, each encoder hidden state is a concatenation of the forward pass hidden state $\\vec{h}_i$ and the backward pass hidden state $\\overleftarrow{h}_i$:\n    $$h_i = \\left[ \\vec{h}_i ; \\overleftarrow{h}_i \\right]$$\n    This doubles the channel dimensions of the keys and values tensor passed to our decoder attention layer (e.g. from $d_h$ to $2d_h$).\n    To keep the\
    \ attention mathematics dimensionally valid and match the decoder hidden dimension $d_d$, we project these concatenated states using a trainable projection matrix $P_a$:\n    $$h_{i,\\text{proj}} = \\tanh\\left( P_a h_i + b_p \\right)$$\n    where $P_a \\in \\mathbb{R}^{d_d \\times 2d_h}$. This maps the spatial grid details into a unified decoder coordinate space before computing the additive Bahdanau alignment scores.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — bidirectional_projection.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n\n<span class=\"kw\">class</span>\
    \ <span class=\"cls\">BidirectionalProjection</span>(nn.Module):\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, encoder_dim=<span class=\"num\">512</span>, decoder_dim=<span class=\"num\">512</span>):\n        <span class=\"fn\">super</span>().<span class=\"fn\">__init__</span>()\n        <span class=\"cm\"># Encoder is bidirectional, so output dimension is 2 * encoder_dim</span>\n        <span class=\"kw\">self</span>.proj_layer = nn.<span class=\"fn\">Linear</span>(<span class=\"num\">2</span> * encoder_dim, decoder_dim)\n\n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\">self</span>, bidir_encoder_states):\n        <span class=\"cm\"># Input shape: (Batch, SeqLen, 2 * encoder_dim)</span>\n        projected = torch.<span class=\"fn\">tanh</span>(<span class=\"kw\">self</span>.<span class=\"fn\">proj_layer</span>(bidir_encoder_states))\n        <span class=\"cm\"># Output shape: (Batch, SeqLen,\
    \ decoder_dim)</span>\n        <span class=\"kw\">return</span> projected</code></pre>\n</div>\n<h3 class=\"sh3\">\n       4. Production PyTorch Attention Decoder Implementation\n      </h3>\n<p>\n       Let's write a complete, self-contained Attention Decoder subclassing\n       \n        nn.Module\n       \n       to demonstrate these sequential calculations:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — attention_decoder.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n<span class=\"kw\">import</span> random\n\n<span class=\"kw\">class</span> <span class=\"cls\"\
    >BahdanauAttention</span>(nn.Module):\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, features_dim, hidden_dim, attention_dim):\n        <span class=\"fn\">super</span>().<span class=\"fn\">__init__</span>()\n        <span class=\"kw\">self</span>.W = nn.<span class=\"fn\">Linear</span>(hidden_dim, attention_dim)\n        <span class=\"kw\">self</span>.U = nn.<span class=\"fn\">Linear</span>(features_dim, attention_dim)\n        <span class=\"kw\">self</span>.v = nn.<span class=\"fn\">Linear</span>(attention_dim, <span class=\"num\">1</span>)\n\n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\">self</span>, features, hidden_state):\n        <span class=\"cm\"># features shape: (Batch, 49, features_dim)</span>\n        <span class=\"cm\"># hidden_state shape: (Batch, hidden_dim)</span>\n        \n        <span class=\"cm\"># 1. Project inputs to attention dimension space</span>\n        proj_h =\
    \ <span class=\"kw\">self</span>.<span class=\"fn\">W</span>(hidden_state).<span class=\"fn\">unsqueeze</span>(<span class=\"num\">1</span>) <span class=\"cm\"># (Batch, 1, attention_dim)</span>\n        proj_f = <span class=\"kw\">self</span>.<span class=\"fn\">U</span>(features)                 <span class=\"cm\"># (Batch, 49, attention_dim)</span>\n        \n        <span class=\"cm\"># 2. Additive score through tanh layer</span>\n        scores = <span class=\"kw\">self</span>.<span class=\"fn\">v</span>(torch.<span class=\"fn\">tanh</span>(proj_h + proj_f)).<span class=\"fn\">squeeze</span>(<span class=\"num\">2</span>) <span class=\"cm\"># (Batch, 49)</span>\n        \n        <span class=\"cm\"># 3. Softmax weights</span>\n        weights = torch.<span class=\"fn\">softmax</span>(scores, dim=<span class=\"num\">1</span>) <span class=\"cm\"># (Batch, 49)</span>\n        \n        <span class=\"cm\"># 4. Context vector as batch matrix multiplication</span>\n        context = torch.<span\
    \ class=\"fn\">bmm</span>(weights.<span class=\"fn\">unsqueeze</span>(<span class=\"num\">1</span>), features).<span class=\"fn\">squeeze</span>(<span class=\"num\">1</span>) <span class=\"cm\"># (Batch, features_dim)</span>\n        <span class=\"kw\">return</span> context, weights\n\n<span class=\"kw\">class</span> <span class=\"cls\">AttentionDecoder</span>(nn.Module):\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, vocab_size, embed_dim, features_dim, hidden_dim, attention_dim):\n        <span class=\"fn\">super</span>().<span class=\"fn\">__init__</span>()\n        <span class=\"kw\">self</span>.vocab_size = vocab_size\n        <span class=\"kw\">self</span>.embed = nn.<span class=\"fn\">Embedding</span>(vocab_size, embed_dim)\n        <span class=\"kw\">self</span>.attention = <span class=\"fn\">BahdanauAttention</span>(features_dim, hidden_dim, attention_dim)\n        \n        <span class=\"cm\"># LSTM input includes projected\
    \ context and word embeddings</span>\n        <span class=\"kw\">self</span>.lstm = nn.<span class=\"fn\">LSTMCell</span>(embed_dim + features_dim, hidden_dim)\n        <span class=\"kw\">self</span>.fc_out = nn.<span class=\"fn\">Linear</span>(hidden_dim, vocab_size)\n\n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\">self</span>, features, captions, initial_states, teacher_forcing_ratio=<span class=\"num\">0.5</span>):\n        <span class=\"cm\"># features: (Batch, 49, features_dim) jahan features_dim=2048</span>\n        <span class=\"cm\"># captions: (Batch, SeqLen)</span>\n        batch_size = features.<span class=\"fn\">size</span>(<span class=\"num\">0</span>)\n        seq_len = captions.<span class=\"fn\">size</span>(<span class=\"num\">1</span>)\n        \n        h, c = initial_states <span class=\"cm\"># Shapes: (Batch, hidden_dim)</span>\n        outputs = torch.<span class=\"fn\">zeros</span>(batch_size, seq_len, <span class=\"kw\"\
    >self</span>.vocab_size).<span class=\"fn\">to</span>(features.device)\n        \n        <span class=\"cm\"># Step-by-step manual sequence decoding loop</span>\n        <span class=\"kw\">for</span> t <span class=\"kw\">in</span> <span class=\"fn\">range</span>(<span class=\"num\">1</span>, seq_len):\n            <span class=\"cm\"># Dynamic Attention calculation</span>\n            context, _ = <span class=\"kw\">self</span>.<span class=\"fn\">attention</span>(features, h)\n            \n            <span class=\"cm\"># Determine decoder input based on Teacher Forcing ratio schedule</span>\n            use_teacher_forcing = random.<span class=\"fn\">random</span>() &lt; teacher_forcing_ratio\n            <span class=\"kw\">if</span> t == <span class=\"num\">1</span> <span class=\"kw\">or</span> use_teacher_forcing:\n                input_token = captions[:, t-<span class=\"num\">1</span>] <span class=\"cm\"># Ground truth target token</span>\n            <span class=\"kw\">else</span>:\n\
    \                input_token = outputs[:, t-<span class=\"num\">1</span>].<span class=\"fn\">argmax</span>(dim=<span class=\"num\">1</span>) <span class=\"cm\"># Previous prediction</span>\n                \n            embedded = <span class=\"kw\">self</span>.<span class=\"fn\">embed</span>(input_token) <span class=\"cm\"># (Batch, embed_dim)</span>\n            \n            <span class=\"cm\"># Concatenate visual features with token embeddings</span>\n            lstm_input = torch.<span class=\"fn\">cat</span>((embedded, context), dim=<span class=\"num\">1</span>) <span class=\"cm\"># (Batch, embed_dim + features_dim)</span>\n            \n            h, c = <span class=\"kw\">self</span>.<span class=\"fn\">lstm</span>(lstm_input, (h, c))\n            outputs[:, t] = <span class=\"kw\">self</span>.<span class=\"fn\">fc_out</span>(h)\n            \n        <span class=\"kw\">return</span> outputs\n\n<span class=\"cm\"># Verify operation</span>\ndecoder = <span class=\"fn\">AttentionDecoder</span>(vocab_size=<span\
    \ class=\"num\">100</span>, embed_dim=<span class=\"num\">128</span>, features_dim=<span class=\"num\">256</span>, hidden_dim=<span class=\"num\">256</span>, attention_dim=<span class=\"num\">64</span>)\nmock_feats = torch.<span class=\"fn\">randn</span>(<span class=\"num\">4</span>, <span class=\"num\">49</span>, <span class=\"num\">256</span>)\nmock_caps = torch.<span class=\"fn\">randint</span>(<span class=\"num\">0</span>, <span class=\"num\">100</span>, (<span class=\"num\">4</span>, <span class=\"num\">10</span>))\ninit_states = (torch.<span class=\"fn\">randn</span>(<span class=\"num\">4</span>, <span class=\"num\">256</span>), torch.<span class=\"fn\">randn</span>(<span class=\"num\">4</span>, <span class=\"num\">256</span>))\n\nout = <span class=\"fn\">decoder</span>(mock_feats, mock_caps, init_states)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Decoder Raw Prediction Output Shape:\"</span>, out.shape)</code></pre>\n</div>\n<h2 class=\"sh2\">\n       \U0001F6E0 Tasks\n\
    \      </h2>\n<div style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\">\n       \U0001F50D\n       <strong>\n        Search terms:\n       </strong>\n\n        flashattention tiling sram algorithms paper, o(n^2) memory complexity self attention\n       \n</div>\n<h3 class=\"sh3\">3. Sparse Mixture of Experts (MoE) — DeepSeek &amp; Mixtral Architecture</h3>\n<p>\nModern frontier models (Mixtral 8x7B, DeepSeek-V3) replace standard dense Feed-Forward Networks with <strong>Sparse Mixture of Experts (MoE)</strong> layers. A learnable <em>Gating Router</em> computes Softmax affinity scores across $E$ expert networks and activates only the top-$K$ experts (typically $K=2$) per token, decoupling total parameter capacity from per-token active compute FLOPs.\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — sparse_moe_layer.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >copy</button><button class=\"run-btn\" onclick=\"runCode(this)\">Run</button></div></div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n\n<span class=\"kw\">class</span> <span class=\"cls\">SparseMoELayer</span>(nn.Module):\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(self, d_model: <span class=\"bi\">int</span> = <span class=\"num\">512</span>, num_experts: <span class=\"bi\">int</span> = <span class=\"num\">8</span>, top_k: <span class=\"bi\">int</span> = <span class=\"num\">2</span>):\n        <span class=\"bi\">super</span>().<span class=\"fn\">__init__</span>()\n        self.top_k = top_k\n        self.router = nn.<span class=\"fn\">Linear</span>(d_model, num_experts, bias=<span class=\"kw\">False</span>)\n        self.experts = nn.<span class=\"fn\">ModuleList</span>([\n            nn.<span class=\"fn\">Sequential</span>(nn.<span class=\"fn\">Linear</span>(d_model,\
    \ d_model * <span class=\"num\">4</span>), nn.<span class=\"fn\">SiLU</span>(), nn.<span class=\"fn\">Linear</span>(d_model * <span class=\"num\">4</span>, d_model))\n            <span class=\"kw\">for</span> _ <span class=\"kw\">in</span> <span class=\"bi\">range</span>(num_experts)\n        ])\n\n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(self, x: torch.Tensor) -&gt; torch.Tensor:\n        logits = self.<span class=\"fn\">router</span>(x)  <span class=\"cm\"># (B, S, num_experts)</span>\n        weights, indices = torch.<span class=\"fn\">topk</span>(torch.<span class=\"fn\">softmax</span>(logits, dim=-<span class=\"num\">1</span>), self.top_k, dim=-<span class=\"num\">1</span>)\n        weights = weights / weights.<span class=\"fn\">sum</span>(dim=-<span class=\"num\">1</span>, keepdim=<span class=\"kw\">True</span>)  <span class=\"cm\"># Re-normalize</span>\n        output = torch.<span class=\"fn\">zeros_like</span>(x)\n        <span class=\"kw\">for</span>\
    \ k <span class=\"kw\">in</span> <span class=\"bi\">range</span>(self.top_k):\n            <span class=\"kw\">for</span> e <span class=\"kw\">in</span> <span class=\"bi\">range</span>(<span class=\"bi\">len</span>(self.experts)):\n                mask = (indices[:, :, k] == e)\n                <span class=\"kw\">if</span> mask.<span class=\"fn\">any</span>():\n                    output[mask] += weights[:, :, k][mask].<span class=\"fn\">unsqueeze</span>(-<span class=\"num\">1</span>) * self.experts[e](x[mask])\n        <span class=\"kw\">return</span> output\n\nmoe = <span class=\"cls\">SparseMoELayer</span>()\nx = torch.<span class=\"fn\">randn</span>(<span class=\"num\">1</span>, <span class=\"num\">16</span>, <span class=\"num\">512</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"MoE Activated forward pass output shape: {list(moe(x).shape)}\"</span>)</code></pre>\n</div>\n"
