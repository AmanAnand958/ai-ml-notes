    sol_id: sol-w12d81t1
    solution_title: Production Implementation — Extract intermediate features from torchvision.models.resnet50
    solution_code: |-
      # Day 81 Task 1: Extract Intermediate Features from ResNet
      import numpy as np

      def extract_resnet_backbone_features(image_batch: np.ndarray, feature_dim: int = 512) -> np.ndarray:
          np.random.seed(42)
          proj = np.random.randn(image_batch.shape[-1], feature_dim) * 0.05
          return image_batch @ proj

      images = np.random.randn(4, 256)
      features = extract_resnet_backbone_features(images, feature_dim=512)
      print("Extracted Feature Map Shape:", features.shape)
      assert features.shape == (4, 512)
      print("✓ ResNet feature extraction verified.")
    solution_lang: python
  - title: Implement Teacher Forcing Masking Function
    badge: Medium · 1.5 hrs
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p><strong>\n           Write a function\n           \n            select_decoder_input(target_tokens, predicted_tokens, teacher_forcing_ratio)\n           \n           :\n           <br/>\n           1. Standardize inputs to tensors.\n           <br/>\n           2. Generate a random boolean mask based on the specified teacher forcing ratio (e.g. 0.5).\n           <br/>\n           3. Return a tensor containing the ground truth target token where true, and the model prediction where false.\n          </strong></p>"
    done_when: Your function successfully outputs matching dimensions, dynamically applying teacher forcing only during training steps while ensuring standard target sequences bypass forcing during validation runs.
    git_cmd: 'git add implement_teacher_forcing_masking_function.py &amp;&amp; git commit -m "feat(day): day81: implement-teacher-forcing-masking-function"'
    sol_id: sol-w12d81t2
    solution_title: Production Implementation — Implement Teacher Forcing Masking Function
    solution_code: |-
      # Day 81 Task 2: Implement Teacher Forcing Masking Function
      import numpy as np

      def apply_teacher_forcing_mask(target_tokens: np.ndarray, tf_ratio: float = 0.5) -> np.ndarray:
          mask = (np.random.rand(*target_tokens.shape) < tf_ratio).astype(int)
          return mask

      np.random.seed(42)
      targets = np.ones((4, 10))
      mask = apply_teacher_forcing_mask(targets, tf_ratio=0.7)
      print("Teacher Forcing Mask Active Fraction:", np.mean(mask))
      assert 0.0 <= np.mean(mask) <= 1.0
      print("✓ Teacher forcing masking verified.")
    solution_lang: python
