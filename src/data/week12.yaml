  quizzes:
  - num_str: QUESTION 1 OF 5
    question: Why does Greedy Search often result in repetitive, local-optima sentences during recurrent decoding?
    qid: q85_1
    options:
    - letter: A
      text: It calculates attention weights using random noise inputs.
      is_correct: false
      id: a
    - letter: B
      text: It only selects the single best token at each step and cannot backtrack, getting trapped in sub-optimal local probabi...
      is_correct: true
      id: b
    - letter: C
      text: It scales down visual channels.
      is_correct: false
      id: c
    - letter: D
      text: It skips calculating the start token.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Greedy search's short-sightedness prevents it from exploring alternative paths that might yield much higher cumulative probabilities downstream.
    wrong_fb: ❌ Think about what greedy search does. At any point, if it makes a choice, can it undo that choice later if a different choice would have worked better overall?
    correct: b
  - num_str: QUESTION 2 OF 5
    question: Why do we add log-probabilities instead of multiplying raw probabilities to evaluate sequence paths?
    qid: q85_2
    options:
    - letter: A
      text: To increase the learning rate values.
      is_correct: false
      id: a
    - letter: B
      text: Multiplying many fractional probabilities causes arithmetic floating-point underflow, which addition of log values co...
      is_correct: true
      id: b
    - letter: C
      text: To clip recurrent parameter updates.
      is_correct: false
      id: c
    - letter: D
      text: To speed up spatial convolution passes.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Multiplying decimal numbers (e.g. 0.01 * 0.05 * ...) quickly results in values too small for computer registers to represent. Logs map multiplication to stable addition.
    wrong_fb: ❌ Fractional probabilities are values between 0.0 and 1.0. If you multiply 20 fractional values together, what happens to the size of the resulting product?
    correct: b
  - num_str: QUESTION 3 OF 5
    question: What is the vocabulary search space size at each step when running Beam Search with width K?
    qid: q85_3
    options:
    - letter: A
      text: K * |V| (K times vocabulary size)
      is_correct: true
      id: a
    - letter: B
      text: '|V|^K (vocabulary size to the power of K)'
      is_correct: false
      id: b
    - letter: C
      text: K * K
      is_correct: false
      id: c
    - letter: D
      text: 49 * K
      is_correct: false
      id: d
    correct_fb: ✅ Correct! At each step, we expand all K active candidate paths into every possible vocabulary word, yielding a pool of K * |V| possibilities to score and prune.
    wrong_fb: ❌ For each of the K current candidate paths, we must evaluate the log-probability of predicting every single word in the vocabulary list (|V| words). How many options is that in total?
    correct: a
  - num_str: QUESTION 4 OF 5
    question: What is the primary function of a length normalization hyperparameter alpha in Beam Search?
    qid: q85_4
    options:
    - letter: A
      text: It limits the attention weights focus areas.
      is_correct: false
      id: a
    - letter: B
      text: It scales joint probabilities by sequence length to prevent Beam Search from heavily favoring shorter sequences.
      is_correct: true
      id: b
    - letter: C
      text: It prevents recurrent gradients from exploding.
      is_correct: false
      id: c
    - letter: D
      text: It standardizes the visual projection channel dimensions.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Because log-probabilities are negative, longer sequences accumulate more negative values, making them score lower than short sentences by default. Length normalization fixes this bias.
    wrong_fb: ❌ Think about what adding more words does to log probabilities. Since log(P) is negative, does a sentence of 20 words naturally have a higher or lower score than a sentence of 3 words?
    correct: b
  - num_str: QUESTION 5 OF 5
    question: How does the search execution behave when the beam width parameter K is set to exactly 1?
    qid: q85_5
    options:
    - letter: A
      text: It collapses precisely to standard Greedy Search.
      is_correct: true
      id: a
    - letter: B
      text: It results in an infinite recurrent loop.
      is_correct: false
      id: b
    - letter: C
      text: It scales up validation BLEU scores.
      is_correct: false
      id: c
    - letter: D
      text: It triggers teacher forcing on all token predictions.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Retaining only K=1 path means at each step we only expand and keep the single highest-probability token, which is the exact definition of Greedy Search.
    wrong_fb: ❌ If K=1, how many active candidate paths do we keep at each step? What does choosing the single best candidate at each step correspond to?
    correct: a
