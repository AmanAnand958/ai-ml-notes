  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">\n       1. Visualizing Spatial Attention Heatmaps\n      </h3>\n<p>\n       One of the greatest benefits of the Attention mechanism is its\n       <strong>\n        interpretability\n       </strong>\n       . Since the model calculates attention weights $\\alpha_{t,i}$ over the 49 visual grid locations for each word, we can reconstruct exactly what the model was looking at.\n    We take the weights tensor at step $t$ of shape (49,), reshape it to a $7 \\times 7$ grid, resize it back to the original image dimensions (e.g. $224 \\times 224$) using bilinear interpolation, and overlay it as a semi-transparent colored heatmap.\n      </p>\n<h3 class=\"sh3\">\n       2. Gradio Web Interface Engineering\n      </h3>\n<p>\n       Gradio allows us to wrap PyTorch functions inside lightweight web interfaces.\n    By using specialized dark CSS properties and custom HTML layout structures, we can ensure our\
    \ deployed web application looks premium and modern.\n      </p>\n<h3 class=\"sh3\">\n       3. Low-Latency Deployments: Dynamic INT8 Quantization\n      </h3>\n<p>\n       Deploying deep neural networks to production servers often encounters hardware resource limitations. If our web deployment runs on standard CPUs, standard 32-bit floating point calculations (FP32) can result in high user latencies.\n    To accelerate inference without degrading model precision, we utilize\n       <strong>\n        Dynamic INT8 Quantization\n       </strong>\n       .\n    This maps floating-point parameters to 8-bit integers (INT8) dynamically during execution:\n    $$q = \\text{round}\\left( \\frac{r}{S} \\right) + Z$$\n    where $r$ is the real value, $S$ is a scaling factor, and $Z$ is the zero-point integer offset.\n    Dynamic quantization shrinks model size by up to 4x, reduces CPU memory bandwidth constraints, and speeds up sequence generation by up to 2-3x:\n      </p>\n<div class=\"cb\">\n\
    <div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — model_quantization.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n\n<span class=\"kw\">import</span> torch\n\n<span class=\"kw\">def</span> <span class=\"fn\">apply_dynamic_quantization</span>(model_path, model_instance):\n    <span class=\"cm\"># 1. Load standard model floating-point weights state dictionary</span>\n    checkpoint = torch.<span class=\"fn\">load</span>(model_path, map_location=<span class=\"str\">\"cpu\"</span>)\n    model_instance.<span class=\"fn\">load_state_dict</span>(checkpoint[<span class=\"str\">\"decoder\"</span>])\n    \n\
    \    <span class=\"cm\"># 2. Apply PyTorch Dynamic Quantization mapping linear and recurrent layers to INT8</span>\n    <span class=\"cm\"># 3. Dynamic quantization keeps activations in FP32 but quantizes weights to INT8</span>\n    <span class=\"cm\"># 4. At execution, weights are converted dynamically to float for calculations</span>\n    quantized_model = torch.quantization.<span class=\"fn\">quantize_dynamic</span>(\n        model_instance,\n        {torch.nn.Linear, torch.nn.LSTMCell}, <span class=\"cm\"># Target layer types to compress</span>\n        dtype=torch.qint8\n    )\n    \n    <span class=\"cm\"># 5. Save both standard and quantized parameters to disk</span>\n    <span class=\"cm\"># 6. Compare file size reduction and calculate compression ratio</span>\n    torch.<span class=\"fn\">save</span>(model_instance.<span class=\"fn\">state_dict</span>(), <span class=\"str\">\"standard.pt\"</span>)\n    torch.<span class=\"fn\">save</span>(quantized_model.<span class=\"fn\">state_dict</span>(),\
    \ <span class=\"str\">\"quantized.pt\"</span>)\n    \n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Standard Model Size: {os.path.getsize('</span>standard.pt<span class=\"str\">') / 1e6:.2f} MB\"</span>)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Quantized Model Size: {os.path.getsize('</span>quantized.pt<span class=\"str\">') / 1e6:.2f} MB\"</span>)\n    \n    <span class=\"kw\">return</span> quantized_model</code></pre>\n</div>\n<h3 class=\"sh3\">\n       4. Structured Weight Pruning\n      </h3>\n<p>\n       Beyond quantization, we can further accelerate our sequential decoders on target edge devices by using\n       <strong>\n        Weight Pruning\n       </strong>\n       .\n    Pruning zeroes out model parameters that contribute least to the network's predictive capacity. We employ PyTorch's\n       \n        prune\n       \n       utility to apply L1-norm unstructured pruning to the LSTM recurrent parameter matrices. This zeroes out 30% of the recurrent\
    \ connection weights while keeping the validation BLEU score virtually intact:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — weight_pruning.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> torch.nn.utils.prune <span class=\"kw\">as</span> prune\n\n<span class=\"kw\">def</span> <span class=\"fn\">prune_lstm_decoder</span>(decoder_instance, amount=<span class=\"num\">0.3</span>):\n    <span class=\"cm\"># 1. Standard L1-norm unstructured pruning: select lowest absolute values</span>\n    <span class=\"cm\"># 2. PyTorch will generate a binary mask tensor named 'weight_hh_mask'</span>\n    <span class=\"cm\"># 3. The original weight tensor 'weight_hh'\
    \ is renamed to 'weight_hh_orig'</span>\n    <span class=\"cm\"># 4. At inference time, PyTorch dynamically multiplies the mask with original weights</span>\n    prune.<span class=\"fn\">l1_unstructured</span>(\n        decoder_instance.lstm,\n        name=<span class=\"str\">\"weight_hh\"</span>,\n        amount=amount\n    )\n    \n    <span class=\"cm\"># 5. Remove pruning hook markers to serialize and freeze the zeroed weights permanently</span>\n    <span class=\"cm\"># 6. This replaces 'weight_hh_orig' with the masked weights, deleting the mask tensor</span>\n    <span class=\"cm\"># 7. Doing so ensures standard state_dict serialization and backward compatibility</span>\n    prune.<span class=\"fn\">remove</span>(decoder_instance.lstm, <span class=\"str\">\"weight_hh\"</span>)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Successfully zeroed out {amount*100}% of LSTM recurrent weights!\"</span>)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       5. Production Gradio\
    \ and Attention Visualization Pipeline\n      </h3>\n<p>\n       Let's write a complete, self-contained Python script to load our models, perform inference, draw the attention heatmaps, and launch a Gradio interface:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — app.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torchvision.transforms <span class=\"kw\">as</span> transforms\n<span class=\"kw\">import</span> gradio <span class=\"kw\">as</span> gr\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> cv2\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\
    <span class=\"kw\">from</span> PIL <span class=\"kw\">import</span> Image\n\n<span class=\"kw\">def</span> <span class=\"fn\">generate_attention_heatmap</span>(image_path, weights_grid, word):\n    <span class=\"cm\"># 1. Load original image</span>\n    img = Image.<span class=\"fn\">open</span>(image_path).<span class=\"fn\">convert</span>(<span class=\"str\">\"RGB\"</span>)\n    img_np = cv2.<span class=\"fn\">resize</span>(cv2.<span class=\"fn\">imread</span>(image_path), (<span class=\"num\">224</span>, <span class=\"num\">224</span>))\n    \n    <span class=\"cm\"># 2. Reshape weights grid from 49 to 7x7</span>\n    attn_map = weights_grid.<span class=\"fn\">reshape</span>(<span class=\"num\">7</span>, <span class=\"num\">7</span>)\n    \n    <span class=\"cm\"># 3. Resize heatmap grid to match 224x224 image dimensions</span>\n    attn_map = cv2.<span class=\"fn\">resize</span>(attn_map, (<span class=\"num\">224</span>, <span class=\"num\">224</span>))\n    attn_map = (attn_map\
    \ - attn_map.<span class=\"fn\">min</span>()) / (attn_map.<span class=\"fn\">max</span>() - attn_map.<span class=\"fn\">min</span>() + <span class=\"num\">1e-8</span>)\n    attn_map = np.<span class=\"fn\">uint8</span>(<span class=\"num\">255</span> * attn_map)\n    \n    <span class=\"cm\"># 4. Create jet color heatmap and merge with image</span>\n    heatmap = cv2.<span class=\"fn\">applyColorMap</span>(attn_map, cv2.COLORMAP_JET)\n    overlay = cv2.<span class=\"fn\">addWeighted</span>(img_np, <span class=\"num\">0.6</span>, heatmap, <span class=\"num\">0.4</span>, <span class=\"num\">0</span>)\n    \n    <span class=\"kw\">return</span> cv2.<span class=\"fn\">cvtColor</span>(overlay, cv2.COLOR_BGR2RGB)\n\n<span class=\"kw\">def</span> <span class=\"fn\">predict_caption_interface</span>(image):\n    <span class=\"cm\"># Standard prediction </span>\n    <span class=\"cm\"># transform = transforms.Compose([transforms.Resize((224, 224)), transforms.ToTensor()])</span>\n    <span class=\"\
