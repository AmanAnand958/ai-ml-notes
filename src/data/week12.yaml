days:
- id: 80
  day_num: 80
  title: The Attention Mechanism
  subtitle: |-
    In Sequence-to-Sequence (Seq2Seq) architectures, the Encoder compresses the entire input sequence into a single, fixed-size context vector. For long sentences, this creates a severeinformational bottleneck, causing the model to forget early elements.
     Today, we master theAttention Mechanism, which solves this by allowing the Decoder to dynamically inspect all historical hidden states of the Encoder at each decoding step.
     We will dissect the mathematics ofAdditive (Bahdanau) vs. Dot-Product (Luong) Attention, calculate attention weights, derive context vectors, and understand theBLEUevaluation metric.
  time_estimate: 6 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Demonstrate the information bottleneck of traditional Seq2Seq models.
  - Formulate and calculate Additive (Bahdanau) and Dot-Product (Luong) Attention weights.
  - Derive the context vector as a weighted sum of encoder hidden states.
  - Calculate $n$-gram precision and the brevity penalty exponent for BLEU scores.
