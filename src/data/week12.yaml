  hinglish: 'Attention weights interpret kar sakte ho: heatmap dikhata hai decoder ne input ke kaunse parts par focus kiya. Ye built-in interpretability hai — black box nahi hai!'
  analogy: 'Think of it like this: CNN-RNN stitching bilkul ek live football commentator ki tarah kaam karta hai. CNN hamari eyes hai jo camera raw pixels ko lekar direct spatial landscape coordinates aur players positioning (spatial feature grid) me code karti hai. LSTM commentating brain hai jo spatial updates dekh kar (pooled hidden states) correct sequence labels aur sentences select karta hai, taaki final audience match ki kahani (captions) padh sake. (This mirrors how Multi fundamentally ...'
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">\n       1. Modality Stitching: Vision to Sequence\n      </h3>\n<p>\n       To generate description captions for a given image, we employ an\n       <strong>\n        Encoder-Decoder\n       </strong>\n       structure jahan vision encoder convolutional layers ko language decoder sequence layers se directly link kiya jata hai:\n      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         Encoder (CNN):\n        </strong>\n        A deep convolutional network (like ResNet, VGG, or EfficientNet) pre-trained on ImageNet. Instead of keeping the final dense layer (which outputs class probabilities), we remove the head to extract raw spatial feature grids of shape $H \\times W \\times C$ (e.g., $7 \\times 7 \\times 2048$ from ResNet-50).\n       </li>\n<li>\n<strong>\n         Decoder (RNN/LSTM):\n        </strong>\n        A sequence generator that predicts the next text token given the image context\
    \ and previous token predictions.\n       </li>\n</ul>\n<h3 class=\"sh3\">\n       2. Aligning Spatial Grids with Word Vector Dimensions\n      </h3>\n<p>\n       The visual features from deep layers reside in a spatial grid of shape $(B, H \\times W, C)$. To pass these as context into our text decoder, we must project their channels to match the word embedding dimensions $D_{\\text{embed}}$:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$V_{\\text{proj}} = \\text{Linear}(V_{\\text{raw}})$$\n       </span>\n<span class=\"desc\">\n        Where raw shape (Batch, 49, 2048) projects to aligned shape (Batch, 49, EmbedDim).\n       </span>\n</div>\n<p>\n       This projection allows the text decoder's attention layer to calculate alignment scores across all 49 localized image grid regions just like it would across input text words.\n      </p>\n<h3 class=\"sh3\">\n       3. LSTM Initialization &amp; Teacher Forcing\n      </h3>\n<p>\n       There are two primary\
    \ ways to guide the decoder with visual context:\n      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         State Initialization:\n        </strong>\n        We average the spatial features across grid dimensions (global average pooling) and pass the resulting vector through a linear layer to initialize the Decoder's hidden state $h_0$ and cell state $c_0$.\n       </li>\n<li>\n<strong>\n         Teacher Forcing:\n        </strong>\n        During training, sequential models suffer from slower convergence because early errors cascade, throwing off all subsequent step calculations.\n      Teacher Forcing solves this by feeding the *ground truth* token at step $t-1$ as input to prediction step $t$, instead of feeding the model's actual prediction.\n       </li>\n</ul>\n<h3 class=\"sh3\">\n       4. Scheduled Sampling Decay Mathematical Formulations\n      </h3>\n<p>\n       To resolve the mismatch of Exposure Bias (where the model is trained with perfect targets but evaluated on\
    \ its own previous predicted tokens), we use\n       <strong>\n        Scheduled Sampling\n       </strong>\n       .\n    Instead of a constant teacher forcing ratio, we decay the ratio $\\epsilon_i$ dynamically as the training epochs $i$ progress, transitioning the model from guided teaching to fully autonomous inference:\n      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         Linear Decay Schedule:\n        </strong>\n        We subtract a constant step value $k$ per epoch:\n      $$\\epsilon_i = \\max(\\epsilon_{\\min}, 1.0 - k \\cdot i)$$\n      where $k$ dictates the speed of the transition and $\\epsilon_{\\min}$ caps the minimum ratio.\n       </li>\n<li>\n<strong>\n         Exponential Decay Schedule:\n        </strong>\n        We scale the ratio exponentially using a decay base $k \\in (0, 1)$:\n      $$\\epsilon_i = k^i$$\n       </li>\n<li>\n<strong>\n         Inverse Sigmoid Decay Schedule:\n        </strong>\n        We use an inverse sigmoid curve to keep forcing\
    \ high early, decay it rapidly in the middle, and taper off at later epochs:\n      $$\\epsilon_i = \\frac{k}{k + \\exp(i / k)}$$\n      where $k \\ge 1$ controls the horizontal stretch of the transition curve.\n       </li>\n</ul>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — scheduled_sampling.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> math\n\n<span class=\"kw\">class</span> <span class=\"cls\">ScheduledSampling</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, mode=<span class=\"str\">\"inverse_sigmoid\"</span>, k=<span class=\"num\">10</span>, min_ratio=<span class=\"num\">0.05</span>):\n\
    \        <span class=\"kw\">self</span>.mode = mode\n        <span class=\"kw\">self</span>.k = k\n        <span class=\"kw\">self</span>.min_ratio = min_ratio\n\n    <span class=\"kw\">def</span> <span class=\"fn\">get_ratio</span>(<span class=\"kw\">self</span>, epoch):\n        <span class=\"kw\">if</span> <span class=\"kw\">self</span>.mode == <span class=\"str\">\"linear\"</span>:\n            ratio = <span class=\"num\">1.0</span> - <span class=\"kw\">self</span>.k * epoch\n        <span class=\"kw\">elif</span> <span class=\"kw\">self</span>.mode == <span class=\"str\">\"exponential\"</span>:\n            ratio = <span class=\"kw\">self</span>.k ** epoch\n        <span class=\"kw\">elif</span> <span class=\"kw\">self</span>.mode == <span class=\"str\">\"inverse_sigmoid\"</span>:\n            <span class=\"cm\"># Inverse sigmoid: k / (k + exp(epoch / k))</span>\n            ratio = <span class=\"kw\">self</span>.k / (<span class=\"kw\">self</span>.k + math.<span class=\"fn\">exp</span>(epoch\
    \ / <span class=\"kw\">self</span>.k))\n        <span class=\"kw\">else</span>:\n            ratio = <span class=\"num\">1.0</span>\n            \n        <span class=\"kw\">return</span> <span class=\"fn\">max</span>(<span class=\"kw\">self</span>.min_ratio, ratio)\n\n<span class=\"cm\"># Quick trace</span>\nscheduler = <span class=\"fn\">ScheduledSampling</span>(mode=<span class=\"str\">\"inverse_sigmoid\"</span>, k=<span class=\"num\">5</span>)\n<span class=\"kw\">for</span> epoch <span class=\"kw\">in</span> <span class=\"fn\">range</span>(<span class=\"num\">15</span>):\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Epoch {epoch}: Teacher Forcing Ratio = {scheduler.get_ratio(epoch):.4f}\"</span>)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       5. Dimensionality Walkthrough of Modality Stitching\n      </h3>\n<p>\n       Let's write a complete PyTorch diagnostic script illustrating how spatial vision features are projected, averaged, and passed to initialize LSTM hidden\
    \ states:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — cnn_rnn_stitching.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n\n<span class=\"kw\">class</span> <span class=\"cls\">ModalityStitcher</span>(nn.Module):\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, cnn_channels=<span class=\"num\">2048</span>, embed_dim=<span class=\"num\">256</span>, hidden_dim=<span class=\"num\">512</span>):\n        <span class=\"fn\">super</span>().<span class=\"fn\">__init__</span>()\n        <span class=\"cm\"># Projection layer\
    \ to align CNN features with text embeddings</span>\n        <span class=\"kw\">self</span>.proj = nn.<span class=\"fn\">Linear</span>(cnn_channels, embed_dim)\n        <span class=\"cm\"># Projection layers to initialize LSTM states from visual average</span>\n        <span class=\"kw\">self</span>.init_h = nn.<span class=\"fn\">Linear</span>(cnn_channels, hidden_dim)\n        <span class=\"kw\">self</span>.init_c = nn.<span class=\"fn\">Linear</span>(cnn_channels, hidden_dim)\n        <span class=\"kw\">self</span>.lstm_cell = nn.<span class=\"fn\">LSTMCell</span>(embed_dim, hidden_dim)\n\n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\">self</span>, cnn_features):\n        <span class=\"cm\"># Input cnn_features: (Batch, H*W, cnn_channels) e.g., (8, 49, 2048)</span>\n        batch_size = cnn_features.<span class=\"fn\">size</span>(<span class=\"num\">0</span>)\n        \n        <span class=\"cm\"># 1. Project grid features to embedding space</span>\n\
    \        proj_grid = <span class=\"kw\">self</span>.<span class=\"fn\">proj</span>(cnn_features) <span class=\"cm\"># Shape: (Batch, 49, embed_dim)</span>\n        \n        <span class=\"cm\"># 2. Global average pool features across grid positions to initialize states</span>\n        pooled = cnn_features.<span class=\"fn\">mean</span>(dim=<span class=\"num\">1</span>) <span class=\"cm\"># Shape: (Batch, cnn_channels)</span>\n        h_0 = torch.<span class=\"fn\">tanh</span>(<span class=\"kw\">self</span>.<span class=\"fn\">init_h</span>(pooled)) <span class=\"cm\"># Shape: (Batch, hidden_dim)</span>\n        c_0 = torch.<span class=\"fn\">tanh</span>(<span class=\"kw\">self</span>.<span class=\"fn\">init_c</span>(pooled)) <span class=\"cm\"># Shape: (Batch, hidden_dim)</span>\n        \n        <span class=\"kw\">return</span> proj_grid, (h_0, c_0)\n\n<span class=\"cm\"># Verify operation</span>\nmodel = <span class=\"fn\">ModalityStitcher</span>()\nmock_cnn_out = torch.<span class=\"\
    fn\">randn</span>(<span class=\"num\">8</span>, <span class=\"num\">49</span>, <span class=\"num\">2048</span>)\ngrid, (h, c) = <span class=\"fn\">model</span>(mock_cnn_out)\n\n<span class=\"fn\">print</span>(<span class=\"str\">\"CNN Grid Features Shape:\"</span>, mock_cnn_out.shape)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Projected Grid Shape:\"</span>, grid.shape)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Initialized Hidden State Shape:\"</span>, h.shape)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Initialized Cell State Shape:\"</span>, c.shape)</code></pre>\n</div>\n<h2 class=\"sh2\">\n       \U0001F6E0 Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\">\n       \U0001F50D\n       <strong>\n        Search terms:\n       </strong>\n\n        causal masked attention matrix lower triangular, self attention vs cross attention pytorch\n       \n</div>\n"
