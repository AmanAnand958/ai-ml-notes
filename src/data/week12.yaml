    variant: o
  xp: 150
  objectives:
  - Demonstrate why Greedy Search leads to sub-optimal, repetitive text predictions.
  - Formulate the search mechanics of Beam Search tracking top-$K$ active paths.
  - Calculate cumulative joint probabilities using log-likelihood additions.
  - Implement a robust, complete Beam Search decoder in PyTorch from scratch.
  checklist:
