  hinglish: CNN-RNN Image Captioning mein CNN (ResNet/EfficientNet) image ka visual feature grid extract karta hai, jo LSTM decoder ko initial context vector provide karta hai.
  analogy: Flickr8k dataset raw captions mapping aur tokenization bilkul ek naye dictionary system banaye jaane ki tarah hai. Hum raw language tokens ko standard numbered index identifiers (vocab mapping) me decode karte hain, taaki hum unhe visual feature arrays se stitch kar sakein.
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">\n       1. Custom Text Tokenization &amp; Vocabulary mapping\n      </h3>\n<p>\n       Text annotations must be mapped to discrete integer ids before entering neural networks.\n    Our vocabulary mapping needs specialized tracking for structural boundaries:\n      </p>\n<ul class=\"prose-list\">\n<li>\n\n         &lt;pad&gt;\n        \n        (0): Applied to pad variable-length sequences to uniform batches.\n       </li>\n<li>\n\n         &lt;start&gt;\n        \n        (1): Flags the beginning of sentence generation sequences.\n       </li>\n<li>\n\n         &lt;end&gt;\n        \n        (2): Signals sequence generation termination during decoding.\n       </li>\n<li>\n\n         &lt;unk&gt;\n        \n        (3): Maps out-of-vocabulary words observed in validation/inference.\n       </li>\n</ul>\n<h3 class=\"sh3\">\n       2. Visual Backbone: Bypassing Average Pooling\n      </h3>\n<p>\n   \
    \    Standard ResNet architectures end with an\n       \n        AdaptiveAvgPool2d\n       \n       layer followed by a single linear head containing 1000 nodes for ImageNet categories.\n    For localized image attention, we must preserve spatial details. By stripping these trailing layers, our backbone outputs raw convolutional features from\n       \n        layer4\n       \n       of shape $(B, 2048, 7, 7)$. We flatten the spatial dimensions to $(B, 49, 2048)$ where each of the 49 indices corresponds to a specific $32 \\times 32$ pixel region in the input image.\n      </p>\n<h3 class=\"sh3\">\n       3. Zipf's Law and Vocabulary Frequency Thresholds\n      </h3>\n<p>\n       Natural language tokens follow\n       <strong>\n        Zipf's Law\n       </strong>\n       , which states that the frequency of any word $f$ is inversely proportional to its rank $r$ in the frequency table:\n    $$f(w) \\propto \\frac{1}{r(w)^s}$$\n    where $s \\approx 1$.\n    In practice, a tiny fraction\
    \ of words (like \"the\", \"a\", \"is\") account for the vast majority of occurrences, while a massive tail of words (like \"unicycle\", \"somersault\") appear only once or twice in the entire Flickr8k corpus.\n    If we include these rare words, our vocabulary size bloats (causing massive memory overhead in the decoder linear projection layer), but the model will never see enough examples to learn their representations properly, leading to high gradient variance.\n    By enforcing a\n       <strong>\n        frequency threshold\n       </strong>\n       (e.g. 5 occurrences), we trim the tail of Zipf's distribution, mapping rare tokens to\n       \n        &lt;unk&gt;\n       \n       and stabilizing the classification gradients.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — zipf_distribution_analysis.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"kw\">from</span> collections <span class=\"kw\">import</span> Counter\n\n<span class=\"kw\">def</span> <span class=\"fn\">plot_zipf_law</span>(corpus_sentences):\n    words = []\n    <span class=\"kw\">for</span> s <span class=\"kw\">in</span> corpus_sentences:\n        words.<span class=\"fn\">extend</span>(s.<span class=\"fn\">lower</span>().<span class=\"fn\">split</span>())\n        \n    counts = <span class=\"fn\">Counter</span>(words)\n    sorted_counts = <span class=\"fn\">sorted</span>(counts.<span class=\"fn\">values</span>(), reverse=<span class=\"kw\">True</span>)\n    \n    <span class=\"cm\"># Output stats on Zipf tail</span>\n    total_words = <span class=\"fn\">len</span>(words)\n    unique_words = <span class=\"\
    fn\">len</span>(counts)\n    rare_words = <span class=\"fn\">sum</span>(<span class=\"num\">1</span> <span class=\"kw\">for</span> w, c <span class=\"kw\">in</span> counts.<span class=\"fn\">items</span>() <span class=\"kw\">if</span> c &lt; <span class=\"num\">5</span>)\n    \n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Total tokens in corpus: {total_words}\"</span>)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Unique vocabulary items: {unique_words}\"</span>)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Rare tokens (occurrence &lt; 5): {rare_words} ({rare_words/unique_words*100:.2f}%)\"</span>)\n    \n    plt.<span class=\"fn\">plot</span>(sorted_counts)\n    plt.<span class=\"fn\">title</span>(<span class=\"str\">\"Word Frequency Distribution Rank vs Occurrences\"</span>)\n    plt.<span class=\"fn\">xlabel</span>(<span class=\"str\">\"Word Rank\"</span>)\n    plt.<span class=\"fn\">ylabel</span>(<span class=\"str\">\"Occurrences\"</span>)\n\
    \    plt.<span class=\"fn\">yscale</span>(<span class=\"str\">\"log\"</span>)\n    plt.<span class=\"fn\">grid</span>(<span class=\"kw\">True</span>)\n    plt.<span class=\"fn\">show</span>()</code></pre>\n</div>\n<h3 class=\"sh3\">\n       4. Production PyTorch Vocabulary &amp; Feature Extractor\n      </h3>\n<p>\n       Let's write a complete, self-contained implementation of our custom Vocabulary class and our ResNet spatial feature extractor:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — vocabulary_and_encoder.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n\
    <span class=\"kw\">import</span> torchvision.models <span class=\"kw\">as</span> models\n<span class=\"kw\">from</span> collections <span class=\"kw\">import</span> Counter\n\n<span class=\"kw\">class</span> <span class=\"cls\">Vocabulary</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, freq_threshold):\n        <span class=\"kw\">self</span>.itos = {<span class=\"num\">0</span>: <span class=\"str\">\"&lt;pad&gt;\", 1: \"&lt;start&gt;\", 2: \"&lt;end&gt;\", 3: \"&lt;unk&gt;\"</span>}\n        <span class=\"kw\">self</span>.stoi = {v: k <span class=\"kw\">for</span> k, v <span class=\"kw\">in</span> <span class=\"kw\">self</span>.itos.<span class=\"fn\">items</span>()}\n        <span class=\"kw\">self</span>.freq_threshold = freq_threshold\n\n    <span class=\"kw\">def</span> <span class=\"fn\">__len__</span>(<span class=\"kw\">self</span>):\n        <span class=\"kw\">return</span> <span class=\"fn\">len</span>(<span class=\"\
    kw\">self</span>.itos)\n\n    <span class=\"kw\">def</span> <span class=\"fn\">build_vocabulary</span>(<span class=\"kw\">self</span>, sentence_list):\n        frequencies = <span class=\"fn\">Counter</span>()\n        idx = <span class=\"num\">4</span>\n        <span class=\"kw\">for</span> sentence <span class=\"kw\">in</span> sentence_list:\n            <span class=\"kw\">for</span> word <span class=\"kw\">in</span> sentence.<span class=\"fn\">lower</span>().<span class=\"fn\">split</span>():\n                frequencies[word] += <span class=\"num\">1</span>\n                <span class=\"kw\">if</span> frequencies[word] == <span class=\"kw\">self</span>.freq_threshold:\n                    <span class=\"kw\">self</span>.stoi[word] = idx\n                    <span class=\"kw\">self</span>.itos[idx] = word\n                    idx += <span class=\"num\">1</span>\n\n    <span class=\"kw\">def</span> <span class=\"fn\">numericalize</span>(<span class=\"kw\">self</span>, text):\n    \
    \    tokenized = text.<span class=\"fn\">lower</span>().<span class=\"fn\">split</span>()\n        <span class=\"kw\">return</span> [\n            <span class=\"kw\">self</span>.stoi[token] <span class=\"kw\">if</span> token <span class=\"kw\">in</span> <span class=\"kw\">self</span>.stoi <span class=\"kw\">else</span> <span class=\"kw\">self</span>.stoi[<span class=\"str\">\"&lt;unk&gt;\"</span>]\n            <span class=\"kw\">for</span> token <span class=\"kw\">in</span> tokenized\n        ]\n\n<span class=\"kw\">class</span> <span class=\"cls\">VisualEncoder</span>(nn.Module):\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>):\n        <span class=\"fn\">super</span>().<span class=\"fn\">__init__</span>()\n        <span class=\"cm\"># Load standard pre-trained ResNet-50</span>\n        resnet = models.<span class=\"fn\">resnet50</span>(weights=models.ResNet50_Weights.DEFAULT)\n        <span class=\"cm\"># Strip off classification\
    \ head and global average pooling</span>\n        modules = <span class=\"fn\">list</span>(resnet.<span class=\"fn\">children</span>())[:-<span class=\"num\">2</span>]\n        <span class=\"kw\">self</span>.resnet = nn.<span class=\"fn\">Sequential</span>(*modules)\n\n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\">self</span>, images):\n        <span class=\"cm\"># Input images: (Batch, 3, 224, 224)</span>\n        features = <span class=\"kw\">self</span>.<span class=\"fn\">resnet</span>(images) <span class=\"cm\"># Shape: (Batch, 2048, 7, 7)</span>\n        batch_size, channels, h, w = features.shape\n        <span class=\"cm\"># Flatten spatial grids: (Batch, channels, h*w)</span>\n        features = features.<span class=\"fn\">view</span>(batch_size, channels, h * w)\n        <span class=\"cm\"># Permute to fit sequence: (Batch, h*w, channels) -&gt; (Batch, 49, 2048)</span>\n        features = features.<span class=\"fn\">permute</span>(<span\
    \ class=\"num\">0</span>, <span class=\"num\">2</span>, <span class=\"num\">1</span>)\n        <span class=\"kw\">return</span> features\n\n<span class=\"cm\"># Quick Validation Trace</span>\nvocab = <span class=\"fn\">Vocabulary</span>(freq_threshold=<span class=\"num\">2</span>)\nsentences = [<span class=\"str\">\"a dog chases a ball\", \"the dog jumps high\"</span>]\nvocab.<span class=\"fn\">build_vocabulary</span>(sentences)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Numericalized '</span>dog jumps<span class=\"str\">':\", vocab.numericalize(\"dog jumps\"</span>))\n\nencoder = <span class=\"fn\">VisualEncoder</span>()\nmock_imgs = torch.<span class=\"fn\">randn</span>(<span class=\"num\">2</span>, <span class=\"num\">3</span>, <span class=\"num\">224</span>, <span class=\"num\">224</span>)\noutput_features = <span class=\"fn\">encoder</span>(mock_imgs)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Output Grid Spatial Features Shape:\"</span>, output_features.shape)</code></pre>\n\
    </div>\n<h2 class=\"sh2\">\n       \U0001F6E0 Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\">\n       \U0001F50D\n       <strong>\n        Search terms:\n       </strong>\n\n        kv caching decoder generation inference time, greedy search vs top p sampling temperature\n       \n</div>\n"
