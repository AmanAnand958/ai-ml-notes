  hinglish: Traditional LLM serving mein KV Cache continuous memory allocate karta
    hai, jisse 60-80% GPU memory waste hoti hai. vLLM ka PagedAttention OS virtual
    memory paging ki tarah non-contiguous blocks mein KV cache allocate karta hai,
    jisse throughput 4x-8x badh jata hai!
  analogy: 'PagedAttention is like dynamic cloud storage partitioning: instead of
    pre-allocating an entire 1TB disk for a 2MB file, it allocates exact 16-token
    memory pages on demand with zero waste.'
  theory_html: "<h3 class=\"sh3\">1. Memory Bottleneck in High-Throughput LLM Serving</h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\nDuring autoregressive token generation, Key-Value (KV) tensors for all prior\
    \ tokens must be cached in GPU memory (HBM). <strong>PagedAttention</strong> eliminates\
    \ internal and external memory fragmentation by partitioning the KV cache into\
    \ fixed-size physical memory blocks mapped via virtual block tables.\n</p>\n<div\
    \ class=\"mermaid\">\ngraph TD\n  subgraph \"PagedAttention Virtual-to-Physical\
    \ Block Mapping\"\n    Seq[\"Token Sequence: [t1, t2, ..., t32]\"] --> Virt[\"\
    Virtual Blocks: [Block 0, Block 1]\"]\n    Virt --> BTable[\"Block Table Router\"\
    ]\n    BTable --> PB1[\"Physical GPU Block 12\n(Tokens 1-16)\"]\n    BTable -->\
    \ PB2[\"Physical GPU Block 89\n(Tokens 17-32)\"]\n  end\n</div>\n<div class=\"\
    diagram-cap\">PagedAttention Block Mapping: Non-contiguous GPU memory pages managed\
    \ with zero fragmentation.</div>\n<h3 class=\"sh3\">2. Mathematical Formulation\
    \ of KV Cache VRAM Footprint</h3>\n<div class=\"math-block\">\n$$\\text{VRAM}_{\\\
    text{KVCache}} = 2 \\times P \\times L \\times H \\times d_{head} \\times B \\\
    times S$$\n</div>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\nWhere $P$ is precision bytes (FP16 = 2, FP8 = 1), $L$ is\
    \ layer depth, $H$ is head count, $d_{head}$ is head dimension, $B$ is concurrent\
    \ batch size, and $S$ is context sequence length.\n</p>\n<h3 class=\"sh3\">3.\
    \ Production Python KV Cache Sizing Calculator</h3>\n<div class=\"cb\">\n  <div\
    \ class=\"cb-head\"><span class=\"cb-lang\">python — vram_calculator.py</span><div\
    \ class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button><button\
    \ class=\"run-btn\" onclick=\"runCode(this)\">Run</button></div></div>\n  <pre><code>def\
    \ compute_vram_requirement(param_billions: float, precision_bytes: int = 2, kv_cache_gb:\
    \ float = 8.0) -> float:\n    weights_gb = (param_billions * 1e9 * precision_bytes)\
    \ / (1024 ** 3)\n    cuda_overhead_gb = 1.5\n    total_vram = weights_gb + kv_cache_gb\
    \ + cuda_overhead_gb\n    return round(total_vram, 2)\n\nvram_70b = compute_vram_requirement(70.0,\
    \ precision_bytes=2, kv_cache_gb=16.0)\nprint(f\"Total GPU VRAM Required for 70B\
    \ FP16 Model: {vram_70b} GB (e.g. 2x A100 80GB)\")</code></pre>\n</div>"
