    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: How does KEDA (Kubernetes Event-driven Autoscaling) differ from standard
      Kubernetes HPA (Horizontal Pod Autoscaler)?
    qid: q180_1
    options:
    - letter: A
      text: KEDA can scale pods based on custom external event metrics (e.g. vLLM
        queue length, Kafka lag, RabbitMQ depth) including scaling to and from zero.
      is_correct: true
    - letter: B
      text: KEDA only scales pods based on CPU percentage.
      is_correct: false
    - letter: C
      text: KEDA is a programming language.
      is_correct: false
    - letter: D
      text: KEDA deletes pods permanently when traffic spikes.
      is_correct: false
    correct_fb: ✅ Correct! KEDA brings rich event-driven scalers to Kubernetes, enabling
      reactive scaling based on AI inference queues and message brokers.
    wrong_fb: ❌ Incorrect. KEDA scales workloads based on custom operational event
      metrics, overcoming HPA's CPU/memory limitations.
  - num_str: QUESTION 2 OF 4
    question: Why is scaling LLM serving pods based on queue length (`num_requests_waiting`)
      superior to CPU utilization?
    qid: q180_2
    options:
    - letter: A
      text: LLM decoding is GPU-bound; CPU utilization remains low even when GPU request
        queues are heavily saturated and latency is degrading.
      is_correct: true
    - letter: B
      text: CPU metrics cannot be measured in Kubernetes.
      is_correct: false
    - letter: C
      text: Queue length is measured in megabytes.
      is_correct: false
    - letter: D
      text: GPU servers do not possess CPUs.
      is_correct: false
    correct_fb: ✅ Correct! Request queue backlog directly signals inference capacity
      saturation before latency SLA violations occur.
    wrong_fb: ❌ Incorrect. CPU utilization fails to reflect GPU VRAM and Tensor Core
      bottlenecks; queue length directly captures pending workload demand.
  - num_str: QUESTION 3 OF 4
    question: What is 'Scale-to-Zero' in serverless Kubernetes inference and why is
      it valuable for development environments?
    qid: q180_3
    options:
    - letter: A
      text: Terminating all replica pods when no requests are received, reducing cloud
        infrastructure idle costs to zero.
      is_correct: true
    - letter: B
      text: Deleting the entire Kubernetes cluster.
      is_correct: false
    - letter: C
      text: Running pods with zero memory.
      is_correct: false
    - letter: D
      text: Shutting down the company website.
      is_correct: false
    correct_fb: ✅ Correct! Scale-to-zero eliminates idle instance costs for intermittent
      internal tools and staging environments.
    wrong_fb: ❌ Incorrect. Scale-to-zero suspends pod allocations during idle periods,
      saving cloud compute budgets.
  - num_str: QUESTION 4 OF 4
    question: What setting in Kubernetes HPA prevents rapid flapping (thrashing) between
      scale-up and scale-down events?
    qid: q180_4
    options:
    - letter: A
      text: The `stabilizationWindowSeconds` behavior configuration, which delays
        scaling down until a cooldown window has elapsed.
      is_correct: true
    - letter: B
      text: Setting minimum replicas to 100.
      is_correct: false
    - letter: C
      text: Disabling all network connections.
      is_correct: false
    - letter: D
      text: Restarting the cluster hourly.
      is_correct: false
    correct_fb: ✅ Correct! Stabilization windows dampen erratic scaling oscillations
      caused by bursty, short-lived traffic spikes.
    wrong_fb: ❌ Incorrect. Stabilization windows enforce cooldown periods to prevent
      rapid pod creation and termination thrashing.
