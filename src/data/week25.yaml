  flashcards:
  - front: 'Core concept: What is the significance of Kubernetes Pod in Kubernetes Core Concepts?'
    back: • The smallest deployable unit in K8s.<br/>• Contains one or more tightly coupled containers sharing network and storage.
  - front: Resource Requests vs Limits?
    back: '• Requests: guaranteed resources for scheduling.<br/>• Limits: maximum allowed — container is killed if exceeded.'
  - front: K8s Service (LoadBalancer)?
    back: • Exposes pods to external traffic with a stable IP, routing to healthy pods automatically.
  - front: How is Kubernetes Core Concepts tested and validated in industrial ML pipelines (Day 178)?
