  gotcha:
    title: '⚠️ Gotcha: Out of Memory (OOM) on KV Cache Allocation'
    description: In vLLM, gpu_memory_utilization defaults to 0.90. If you load model
      weights that take 80% of VRAM and concurrently run PyTorch activations, the
      KV Cache allocator will crash the CUDA context. Set gpu_memory_utilization=0.85
      for high concurrency stability.
