    </div>'
  predict:
    question: "What happens to a Pod if it fails its\n       \n        livenessProbe\n\
      \       \n       ?"
    answer: Container restarts
    explanation: Kubernetes terminates the unresponsive container and restarts a fresh
      container according to the Pod's restartPolicy.
    code: "<span class=\"cm\"># Verification Script for Day 178</span>\n<span class=\"\
      kw\">def</span> <span class=\"fn\">k8s_liveness_action</span>(probe_healthy:\
      \ bool):\n    action = <span class=\"str\">\"RUNNING\" if probe_healthy else\
      \ \"CONTAINER_RESTART\"</span>\n<span class=\"fn\">print</span>(<span class=\"\
      str\">f\"Liveness Probe Health: {probe_healthy} - K8s Action: {action}\"</span>)\n\
      <span class=\"kw\">return</span> action\n\n<span class=\"kw\">if</span> __name__\
      \ == <span class=\"str\">\"__main__\"</span>:\n    <span class=\"kw\">assert</span>\
      \ <span class=\"fn\">k8s_liveness_action</span>(<span class=\"kw\">False</span>)\
      \ == <span class=\"str\">\"CONTAINER_RESTART\"</span>"
  tasks:
  - title: 'Task 1: Deploy to minikube'
    badge: MEDIUM
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p>\n        Create a Docker image of a simple FastAPI\n       \
      \ \n         /predict\n        \n        endpoint, push to a local registry,\
      \ and deploy using\n        \n         kubectl apply -f deployment.yaml\n  \
      \      \n        .\n        <strong>\n         Bonus Task: Secret for API Key\
      \ · MEDIUM · ⏱ 45 mins\n        </strong>\n        Create a Kubernetes Secret\
      \ for\n        \n         OPENAI_API_KEY\n        \n        and reference it\
      \ in the Deployment manifest.\n       </p>"
    done_when: Task completed successfully when output matches expected verification
      metrics and unit tests pass.
    git_cmd: 'git add . &amp;&amp; git commit -m "day178: complete hands-on task implementation"'
    sol_id: sol-w25d178t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "<span class=\"cm\"># Solution for Task: Deploy to minikube</span>\n\
      <span class=\"kw\">class</span> <span class=\"cls\">MinikubeVLLMDeployer</span>:\n\
      \    <span class=\"kw\">def</span> <span class=\"fn\">generate_manifest</span>(<span\
      \ class=\"kw\">self</span>) -&gt; str:\n        manifest_yaml = <span class=\"\
      str\">\"\"\"</span>\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name:\
      \ vllm-inference-service\nspec:\n  replicas: <span class=\"num\">2</span>\n\
      \  selector:\n    matchLabels:\n      app: vllm-serving\n  template:\n    metadata:\n\
      \      labels:\n        app: vllm-serving\n    spec:\n      containers:\n  \
      \    - name: vllm-container\n        image: vllm/vllm-openai:v0.<span class=\"\
      num\">6.3</span>\n        resources:\n          limits:\n            nvidia.com/gpu:\
      \ <span class=\"num\">1</span>\n<span class=\"str\">\"\"\"</span>\n<span class=\"\
      kw\">return</span> manifest_yaml.<span class=\"fn\">strip</span>()\n\ndeployer\
      \ = <span class=\"fn\">MinikubeVLLMDeployer</span>()\nyaml_out = deployer.<span\
      \ class=\"fn\">generate_manifest</span>()\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">\"=== Generated Kubernetes Manifest ===\"</span>)\n<span class=\"\
      fn\">print</span>(yaml_out[:<span class=\"num\">180</span>] + <span class=\"\
      str\">\"...\"</span>)"
    solution_lang: python
  - title: 'Task 2: Implement Kubernetes Core Concepts'
    badge: ''
    badge_class: tb-med
    time: ''
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\"\
      >\n        Simulate NVIDIA Data Center GPU Manager (DCGM) metric collection\
      \ for Prometheus scraping.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
      >\n<span class=\"cb-lang\">\n          pseudocode\n         </span>\n<div class=\"\
      cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n       \
      \    copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
      >\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"\
      kw\">def</span> <span class=\"fn\">collect_dcgm_metrics</span>(gpu_id: int =\
      \ <span class=\"num\">0</span>) - list:\n<span class=\"kw\">return</span> [\n\
      \        <span class=\"str\">f'DCGM_FI_DEV_GPU_UTIL{{gpu=\"{gpu_id}\"}} 84.5'</span>,\n\
      \        <span class=\"str\">f'DCGM_FI_DEV_FB_USED{{gpu=\"{gpu_id}\"}} 68719476736'</span>,\
      \ <span class=\"cm\"># 64GB in bytes</span>\n        <span class=\"str\">f'DCGM_FI_DEV_FB_FREE{{gpu=\"\
      {gpu_id}\"}} 17179869184'</span>, <span class=\"cm\"># 16GB in bytes</span>\n\
      \        <span class=\"str\">f'DCGM_FI_DEV_GPU_TEMP{{gpu=\"{gpu_id}\"}} 62.0'</span>\n\
      \    ]\n\n<span class=\"fn\">print</span>(<span class=\"str\">\"Prometheus DCGM\
      \ Exporter Output:\\n\" + \"\\n\"</span>.<span class=\"fn\">join</span>(<span\
      \ class=\"fn\">collect_dcgm_metrics</span>(gpu_id=<span class=\"num\">0</span>)))</pre>\n\
      </div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05);\
      \ border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono);\
      \ font-size:12px;\">\n<strong>\n         Expected Verification Output:\n   \
      \     </strong>\n<br/>\n\n         DCGM_FI_DEV_GPU_UTIL{gpu=\"0\"} 84.5 ...\n\
      \        \n</div>"
    done_when: ''
    git_cmd: ''
    sol_id: ''
    solution_title: ''
    solution_code: ''
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: In Kubernetes architecture, what is a Pod?
    qid: q178_1
    options:
    - letter: A
      text: The smallest deployable computing unit in Kubernetes, encapsulating one
        or more co-located containers sharing network and storage namespaces.
      is_correct: true
    - letter: B
      text: A physical server in a data center.
      is_correct: false
    - letter: C
      text: A Python package for numerical computing.
      is_correct: false
    - letter: D
      text: A brand of computer monitors.
      is_correct: false
    correct_fb: ✅ Correct! Pods represent running processes on your cluster, sharing
      IP addresses, port spaces, and mounted storage volumes.
    wrong_fb: ❌ Incorrect. Pods are the fundamental atomic execution unit in Kubernetes,
      grouping co-located containers together.
  - num_str: QUESTION 2 OF 4
    question: What is the role of the Kubernetes Control Plane (kube-apiserver, etcd,
      kube-scheduler)?
    qid: q178_2
    options:
    - letter: A
      text: Maintaining the desired state of the cluster, scheduling workloads to
        nodes, storing configuration, and handling cluster API requests.
      is_correct: true
    - letter: B
      text: Rendering CSS web pages.
      is_correct: false
    - letter: C
      text: Executing deep learning matrix multiplications directly.
      is_correct: false
    - letter: D
      text: Providing public Wi-Fi access.
      is_correct: false
    correct_fb: ✅ Correct! The Control Plane orchestrates cluster operations, tracks
      global state in etcd, and assigns pods to worker nodes.
    wrong_fb: ❌ Incorrect. The Control Plane manages cluster scheduling, global state
      persistence, and administrative APIs.
  - num_str: QUESTION 3 OF 4
    question: Why is setting both `requests` and `limits` for CPU/Memory critical
      in Kubernetes AI pod manifests?
    qid: q178_3
    options:
    - letter: A
      text: Requests guarantee minimum reserved compute for scheduling; limits prevent
        rogue workloads from consuming all host node resources and crashing neighboring
        pods.
      is_correct: true
    - letter: B
      text: Setting limits makes pods execute 10x faster.
      is_correct: false
    - letter: C
      text: Requests are required for git commits.
      is_correct: false
    - letter: D
      text: Limits delete pods every 5 minutes.
      is_correct: false
    correct_fb: ✅ Correct! Explicit resource requests and limits ensure deterministic
      scheduling and prevent Out-of-Memory (OOM) cascading node failures.
    wrong_fb: ❌ Incorrect. Resource specifications ensure fair scheduling and isolate
      containers against neighbor memory starvation.
  - num_str: QUESTION 4 OF 4
    question: What is a Kubernetes Namespace?
    qid: q178_4
    options:
    - letter: A
      text: A mechanism for isolating groups of resources and access controls within
        a single physical Kubernetes cluster (e.g. dev, staging, prod).
      is_correct: true
    - letter: B
      text: A domain name registered on the internet.
      is_correct: false
    - letter: C
      text: A Python variable name.
      is_correct: false
    - letter: D
      text: A physical room in an office.
      is_correct: false
    correct_fb: ✅ Correct! Namespaces partition cluster resources, enabling multi-tenant
      isolation, role-based access control, and scoped resource quotas.
    wrong_fb: ❌ Incorrect. Namespaces divide cluster resources logically between environments
      and teams.
  flashcards:
  - front: Kubernetes Pod
    back: The smallest deployable unit in K8s. Contains one or more tightly coupled
      containers sharing network and storage.
  - front: Resource Requests vs Limits
    back: 'Requests: guaranteed resources for scheduling. Limits: maximum allowed
      — container is killed if exceeded.'
  - front: K8s Service (LoadBalancer)
    back: Exposes pods to external traffic with a stable IP, routing to healthy pods
      automatically.
  gotcha:
    title: '⚠️ Gotcha: Day 178 Pitfall Warning'
    description: "<p style=\"margin-top:0.4rem; margin-bottom:0;\">\n       Kubernetes\
      \ pods without resource limits (requests and limits) cause single rogue inference\
      \ jobs to starve neighboring pods of memory.\n      </p>"
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       \"Docker\
      \ builds containers, K8s runs them at scale. Production teams need both concepts\
      \ and their operational trade-offs.\""
    bullets:
    - Always set resource requests/limits — prevents one pod from starving others.
    - Use livenessProbe and readinessProbe for automatic health checking.
    - Never store secrets in ConfigMaps — always use K8s Secrets or Vault.
  resources: &id001
  - type: DOCS
    title: Kubernetes HPA (Horizontal Pod Autoscaler) with Custom Metrics
    url: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
    desc: Prometheus-driven GPU autoscaling
  - type: DOCS
    title: 'KServe: Cloud Native Model Serving on Kubernetes'
    url: https://kserve.github.io/website/
    desc: Serverless ML inference with canary rollouts
  - type: GUIDE
    title: Helm Charts for Machine Learning Deployments
    url: https://helm.sh/docs/
    desc: Templating multi-service AI architectures
  - type: TUTORIAL
    title: Argo Workflows for Automated ML Pipelines
    url: https://argoproj.github.io/argo-workflows/
    desc: DAG-based continuous training loops
- id: '179'
  day_num: 179
  title: Deploying vLLM on Kubernetes
  subtitle: GPU-Enabled LLM Serving at Scale
  time_estimate: 45 mins
  difficulty: Medium
  badges: []
  xp: 150
  objectives:
  - Write a K8s Deployment manifest for vLLM with GPU requests.
  - Implement and evaluate how NVIDIA Device Plugin works.
  - K8s cluster with GPU nodes (or RunPod/Lambda Labs)
  checklist: []
  concept_flow:
  - Kubernetes Core Concepts
  - Deploying vLLM on Kubernetes
  - Horizontal Pod Autoscaling
  - Helm Charts for ML Stacks
  - GitHub Actions CI/CD for ML
  - Model Performance Regression Tests
  - 'Capstone: Production K8s LLM Deployment'
  hinglish: Minikube local K8s cluster setup hai. `kubectl apply -f vllm-deployment.yaml`
    se 2 vLLM serving pods local machine par containerized environment mein run hote
    hain.
  analogy: Minikube is like a miniature toy train set allowing you to test track layouts
    on your desk before building real railroad tracks.
  theory_html: '<div class="theory-prose" style="line-height:1.7; font-size:14.5px;
    color:var(--text);">

    <p>Analogy:

    Deploying vLLM on Kubernetes

    💡 Gotcha &amp; Common Pitfall Warning:

    Always double check tensor dimensions, verify data types before matrix operations,
    and ensure feature scaling is fitted strictly on the training set to prevent data
    leakage.</p>

    </div>'
  predict:
    question: Why do we use a PersistentVolumeClaim for the HuggingFace cache?
    answer: Persist model weights
    explanation: To persist large downloaded model weights (10GB-30GB) on disk across
      container restarts, avoiding re-downloading weights from HuggingFace on every
      pod boot.
    code: "<span class=\"cm\"># Verification Script for Day 179</span>\n<span class=\"\
      kw\">def</span> <span class=\"fn\">estimate_pod_startup_time</span>(has_pvc_cache:\
      \ bool, download_time_s=<span class=\"num\">300</span>, load_ram_s=<span class=\"\
      num\">25</span>):\n    total_startup = load_ram_s <span class=\"kw\">if</span>\
      \ has_pvc_cache <span class=\"kw\">else</span> (download_time_s + load_ram_s)\n\
      \    <span class=\"fn\">print</span>(<span class=\"str\">f\"PVC Cached: {has_pvc_cache}\
      \ - Pod Ready Time: {total_startup}s\"</span>)\n<span class=\"kw\">return</span>\
      \ total_startup\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\"\
      >\"__main__\"</span>:\n    <span class=\"kw\">assert</span> <span class=\"fn\"\
      >estimate_pod_startup_time</span>(<span class=\"kw\">True</span>) == <span class=\"\
      num\">25</span>"
  tasks:
  - title: 'Task 1: Test the vLLM K8s Endpoint · MEDIUM'
    badge: HARD
    badge_class: tb-hard
    time: 45 mins
    prompt_html: "<p>\n         After deploying, expose the service and test it with\
      \ the OpenAI Python client pointing to your K8s LoadBalancer IP.\n        </p>"
    done_when: Task completed successfully when output matches expected verification
      metrics and unit tests pass.
    git_cmd: 'git add . &amp;&amp; git commit -m "day179: complete hands-on task implementation"'
    sol_id: sol-w25d179t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "<span class=\"cm\"># Solution for Task: Test the vLLM K8s Endpoint</span>\n\
      <span class=\"kw\">import</span> time\n<span class=\"kw\">from</span> typing\
      \ <span class=\"kw\">import</span> Dict\n\n<span class=\"kw\">class</span> <span\
      \ class=\"cls\">K8svLLMBenchmarker</span>:\n    <span class=\"kw\">def</span>\
      \ <span class=\"fn\">benchmark_endpoint</span>(<span class=\"kw\">self</span>,\
      \ ingress_url: str, requests_count: int = <span class=\"num\">10</span>) -&gt;\
      \ Dict:\n        <span class=\"fn\">print</span>(<span class=\"str\">f\"Benchmarking\
      \ {ingress_url} with {requests_count} concurrent requests...\"</span>)\n   \
      \     t0 = time.<span class=\"fn\">time</span>()\n        time.<span class=\"\
      fn\">sleep</span>(<span class=\"num\">0.05</span>)\n        total_time = time.<span\
      \ class=\"fn\">time</span>() - t0\n        p95_latency_ms = (total_time / requests_count)\
      \ * <span class=\"num\">1000</span> * <span class=\"num\">25</span>\n<span class=\"\
      kw\">return</span> {<span class=\"str\">\"url\": ingress_url, \"p95_latency_ms\"\
      : p95_latency_ms, \"status\": \"HEALTHY\"</span>}\n\nbench = <span class=\"\
      fn\">K8svLLMBenchmarker</span>()\nresults = bench.<span class=\"fn\">benchmark_endpoint</span>(<span\
      \ class=\"str\">\"http://vllm.minikube.local/v1/completions\"</span>)\n<span\
      \ class=\"fn\">print</span>(<span class=\"str\">\"=== Benchmark Results ===\"\
      </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Ingress: {results['</span>url<span\
      \ class=\"str\">']} | P95 Latency: {results['</span>p95_latency_ms<span class=\"\
      str\">']:.2f}ms\"</span>)"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: How does the NVIDIA GPU Operator simplify GPU lifecycle management on
      Kubernetes?
    qid: q179_1
    options:
    - letter: A
      text: It automatically provisions NVIDIA container runtimes, GPU drivers, CUDA
        libraries, and monitoring daemons on worker nodes.
      is_correct: true
    - letter: B
      text: It builds custom GPU chips.
      is_correct: false
    - letter: C
      text: It makes GPUs run without electricity.
      is_correct: false
    - letter: D
      text: It replaces Kubernetes with Docker.
      is_correct: false
    correct_fb: ✅ Correct! The GPU Operator automates the complex installation of
      kernel drivers, container toolkits, and device plugins across GPU clusters.
    wrong_fb: ❌ Incorrect. The NVIDIA GPU Operator automates driver injection, device
      plugins, and metric exporters across Kubernetes worker nodes.
  - num_str: QUESTION 2 OF 4
    question: What is a Kubernetes Node Toleration and how does it interact with GPU
      Node Taints?
    qid: q179_2
    options:
    - letter: A
      text: Taints repel pods from scheduling on specialized GPU nodes; Tolerations
        allow specific GPU pods to schedule on those tainted nodes.
      is_correct: true
    - letter: B
      text: Tolerations delete all pods on the cluster.
      is_correct: false
    - letter: C
      text: Taints are hardware defects on memory chips.
      is_correct: false
    - letter: D
      text: They are used to format hard drives.
      is_correct: false
    correct_fb: ✅ Correct! Taints and Tolerations ensure expensive GPU compute nodes
      are reserved exclusively for workloads that explicitly require GPU accelerators.
    wrong_fb: ❌ Incorrect. Taints prevent unauthorized pods from scheduling on GPU
      nodes, while tolerations grant permission to dedicated ML workloads.
  - num_str: QUESTION 3 OF 4
    question: What is Kubernetes Node Affinity in GPU workload scheduling?
    qid: q179_3
    options:
    - letter: A
      text: 'A set of rules specifying matching node labels (e.g. `accelerator: nvidia-h100`)
        required for a pod to schedule on a specific hardware node pool.'
      is_correct: true
    - letter: B
      text: A method to connect pods using Bluetooth.
      is_correct: false
    - letter: C
      text: A tool that changes node passwords.
      is_correct: false
    - letter: D
      text: A Python function that calculates averages.
      is_correct: false
    correct_fb: ✅ Correct! Node Affinity directs AI pods to nodes equipped with the
      exact required GPU hardware architectures.
    wrong_fb: ❌ Incorrect. Node affinity ensures workloads target nodes with matching
      accelerator labels and hardware specifications.
  - num_str: QUESTION 4 OF 4
    question: What is MIG (Multi-Instance GPU) partitioning on NVIDIA A100/H100 GPUs
      in Kubernetes?
    qid: q179_4
    options:
    - letter: A
      text: Partitioning a single physical GPU into up to 7 isolated GPU instances
        with dedicated compute, memory, and cross-workload isolation.
      is_correct: true
    - letter: B
      text: Connecting 7 GPUs together with tape.
      is_correct: false
    - letter: C
      text: A tool to play video games in containers.
      is_correct: false
    - letter: D
      text: An algorithm that compresses text.
      is_correct: false
    correct_fb: ✅ Correct! MIG enables multiple lightweight inference pods to share
      an enterprise GPU safely without performance interference.
    wrong_fb: ❌ Incorrect. MIG divides high-end GPUs into isolated hardware slices
      for cost-efficient multi-tenant inference.
  flashcards:
  - front: What is the key principle behind Day 179 (Deploying vLLM on Kubernetes)?
    back: Optimizing throughput, numerical stability, and model convergence through
      standardized pipelines.
  - front: What is the most dangerous failure mode to watch for?
    back: Silent data leakage, unnormalized inputs, or uncalibrated inference parameters.
  - front: How is this verified in production?
    back: Automated unit assertions, end-to-end integration tests, and live telemetry
      metric tracking.
  gotcha:
    title: '⚠️ Gotcha: Day 179 Pitfall Warning'
    description: "<p style=\"margin-top:0.4rem; margin-bottom:0;\">\n       Missing\
      \ GPU node affinity and tolerations causes non-GPU CPU workloads to schedule\
      \ onto expensive GPU compute nodes.\n      </p>"
  takeaways:
    hinglish_line: Deploying vLLM on Kubernetes ko master karne ke liye theoretical
      math aur practical code dono align hona chahiye.
    bullets:
    - Always validate tensor shapes before forward passes
    - Instrument metrics early to catch drift in production
    - Write unit tests for custom operations and data transforms
  resources: *id001
- id: '180'
  day_num: 180
  title: Horizontal Pod Autoscaling
  subtitle: Scaling ML Services with Traffic
  time_estimate: 45 mins
  difficulty: Medium
  badges: []
  xp: 150
  objectives:
  - Configure HPA based on CPU and custom metrics.
  - Implement and evaluate KEDA for event-driven autoscaling.
  - Metrics Server installed in K8s cluster
  checklist: []
  concept_flow:
  - Kubernetes Core Concepts
  - Deploying vLLM on Kubernetes
  - Horizontal Pod Autoscaling
  - Helm Charts for ML Stacks
  - GitHub Actions CI/CD for ML
  - Model Performance Regression Tests
  - 'Capstone: Production K8s LLM Deployment'
  hinglish: Horizontal Pod Autoscaler (HPA) CPU/GPU utilization ya custom concurrency
    metrics scale hone par automatically pods count 2 se 10 tak increase/decrease
    karta hai.
  analogy: Horizontal Pod Autoscaler (HPA) is like opening extra checkout registers
    at a supermarket when customer lines get too long.
  theory_html: '<div class="theory-prose" style="line-height:1.7; font-size:14.5px;
    color:var(--text);">

    <p>Analogy:

    Horizontal Pod Autoscaling

    💡 Gotcha &amp; Common Pitfall Warning:

    Always double check tensor dimensions, verify data types before matrix operations,
    and ensure feature scaling is fitted strictly on the training set to prevent data
    leakage.</p>

    </div>'
  predict:
    question: "Why is\n       \n        stabilizationWindowSeconds\n       \n    \
      \   for scaleDown useful for LLM services?"
    answer: Prevents HPA flapping
    explanation: It prevents HPA flapping (rapid scaling up and down) caused by temporary
      dips in traffic, avoiding the severe overhead of killing and spinning up heavy
      LLM containers repeatedly.
    code: "# Verification Script for Day 180\ndef hpa_cooldown_check(current_qps:\
      \ int, cooldown_active: bool):\n    scale_down = (current_qps < 10) and (not\
      \ cooldown_active)\n    print(f\"QPS={current_qps}, Cooldown={cooldown_active}\
      \ - Scale Down Permitted: {scale_down}\")\n    return scale_down\n\nif __name__\
      \ == \"__main__\":\n    assert hpa_cooldown_check(5, True) is False\n    assert\
      \ hpa_cooldown_check(5, False) is True"
  tasks:
  - title: 'Task 1: Apply HPA'
    badge: MEDIUM
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p>\n         Apply the HPA to your ml-inference-api Deployment\
      \ and use\n         \n          kubectl get hpa -w\n         \n         to watch\
      \ it scale.\n        </p>"
    done_when: Task completed successfully when output matches expected verification
      metrics and unit tests pass.
    git_cmd: 'git add . &amp;&amp; git commit -m "day180: complete hands-on task implementation"'
    sol_id: sol-w25d180t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
