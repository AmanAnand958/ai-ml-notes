  quizzes:
  - num_str: QUESTION 1 OF 4
    question: What is the primary network bottleneck when running Distributed Training
      across multiple multi-GPU Kubernetes nodes?
    qid: q184_1
    options:
    - letter: A
      text: Inter-node All-Reduce communication bandwidth during gradient synchronization,
        requiring high-speed RDMA / InfiniBand fabrics.
      is_correct: true
    - letter: B
      text: Hard drive read speed on worker nodes.
      is_correct: false
    - letter: C
      text: The speed of the keyboard typing.
      is_correct: false
    - letter: D
      text: The internet download speed of the client browser.
      is_correct: false
    correct_fb: ✅ Correct! Synchronizing billion-parameter gradients across nodes
      requires dedicated high-bandwidth interconnects (RoCE / InfiniBand) to avoid
      compute stalling.
    wrong_fb: ❌ Incorrect. Inter-node gradient All-Reduce communication is the primary
      throughput bottleneck in multi-node distributed training.
  - num_str: QUESTION 2 OF 4
    question: In Distributed ML on Kubernetes, what role does PyTorch Distributed
      Elastic (TorchElastic / Torchrun) perform?
    qid: q184_2
    options:
    - letter: A
      text: Managing distributed process rendezvous, rank assignment, and handling
        node failure fault tolerance by dynamically re-adjusting world size.
      is_correct: true
    - letter: B
      text: Compressing model weights into ZIP files.
      is_correct: false
    - letter: C
      text: Formatting database tables.
      is_correct: false
    - letter: D
      text: Generating synthetic training data.
      is_correct: false
    correct_fb: ✅ Correct! TorchElastic enables resilient distributed training that
      can automatically restart and adjust when spot nodes are preempted.
    wrong_fb: ❌ Incorrect. TorchElastic handles cluster rendezvous, rank configuration,
      and automated recovery on node failures.
  - num_str: QUESTION 3 OF 4
    question: What is the Kubeflow Training Operator (TFJob / PyTorchJob) on Kubernetes?
    qid: q184_3
    options:
    - letter: A
      text: A Kubernetes Custom Resource Definition (CRD) controller that automates
        the orchestration of distributed training master and worker pods.
      is_correct: true
    - letter: B
      text: A human who monitors server screens.
      is_correct: false
    - letter: C
      text: A Python package for drawing plots.
      is_correct: false
    - letter: D
      text: A brand of server rack cables.
      is_correct: false
    correct_fb: ✅ Correct! The Training Operator manages the complex lifecycle of
      distributed worker pods, shared storage mounts, and network rendezvous.
    wrong_fb: ❌ Incorrect. Kubeflow Training Operator automates distributed multi-node
      master/worker pod lifecycles via custom Kubernetes resources.
  - num_str: QUESTION 4 OF 4
    question: Why is shared high-throughput storage (e.g. Lustre, GPFS, Amazon FSx)
      essential for large-scale distributed training on Kubernetes?
    qid: q184_4
    options:
    - letter: A
      text: To provide simultaneous, multi-gigabyte-per-second parallel read access
        to training dataset shards across hundreds of worker pods without I/O starvation.
      is_correct: true
    - letter: B
      text: To store user login passwords.
      is_correct: false
    - letter: C
      text: Because local SSDs cannot store images.
      is_correct: false
    - letter: D
      text: To make files publicly readable on the internet.
      is_correct: false
    correct_fb: ✅ Correct! Parallel file systems ensure thousands of GPU worker threads
      read data batches continuously without stalling on disk I/O.
    wrong_fb: ❌ Incorrect. High-performance parallel shared file systems prevent data
      loader I/O starvation across distributed training worker nodes.
  flashcards:
  - front: Rolling Update
    back: K8s gradually replaces old pods with new ones, maintaining availability
      throughout. Zero downtime deployment.
  - front: helm --wait
    back: Blocks until all pods are Running and ready. Fails if timeout expires, triggering
      CI failure and automatic rollback.
  - front: Production ML System
    back: Code → CI Tests → Docker Build → K8s Deploy → HPA → Monitoring → Drift →
      Retrain. The full loop.
  - front: nvidia.com/gpu limit
    back: K8s resource limit that requests N physical GPUs for a pod. Must match the
      number of GPUs the container needs.
  - front: PersistentVolumeClaim (PVC)
    back: A request for durable storage that persists across pod restarts. Essential
      for model weight caches.
  - front: nodeSelector
    back: "Constrains a pod to only be scheduled on nodes with matching labels (e.g.,\n\
      \         \n          accelerator: nvidia-a100\n         \n         )."
  - front: HPA (Horizontal Pod Autoscaler)
    back: Automatically adds/removes pod replicas based on CPU, memory, or custom
      metrics.
  - front: KEDA
    back: Kubernetes Event-Driven Autoscaling. Extends HPA to scale on external events
      like Kafka topics, SQS queues, Prometheus metrics.
  - front: Scale-to-Zero
    back: KEDA can scale to 0 replicas when a queue is empty, saving cost. Standard
      HPA minimum is 1.
  - front: Helm Chart
    back: "A package of templated K8s manifests. Install it with\n         \n    \
      \      helm install\n         \n         , upgrade with\n         \n       \
      \   helm upgrade\n         \n         , rollback with\n         \n         \
      \ helm rollback\n         \n         ."
  - front: values.yaml
    back: "Default configuration values for a Helm chart. Override per environment\
      \ with\n         \n          -f values-prod.yaml\n         \n         ."
  - front: helm rollback
    back: Instantly reverts a Helm release to a previous revision. Critical for safe
      production deployments.
  gotcha:
    title: '⚠️ Gotcha: Day 184 Pitfall Warning'
    description: "<p style=\"margin-top:0.4rem; margin-bottom:0;\">\n       Running\
      \ Kubernetes multi-GPU distributed training without RDMA or host network configurations\
      \ throttles inter-node all-reduce bandwidth.\n      </p>"
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       \"Ab\
      \ aap ek complete production ML system build aur operate kar sakte ho — yahi\
      \ observable production AI engineering competency ka evidence hai!\""
    bullets:
    - The eval gate in CI is the most valuable safety net you can add.
    - K8s rolling updates and Helm support controlled rollouts, but zero-downtime
      requires readiness probes, capacity headroom, rollback tests, and traffic monitoring.
    - This architecture handles millions of requests and auto-heals itself.
  resources: *id001
