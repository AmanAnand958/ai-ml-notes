      # Solution for Task: Test the vLLM K8s Endpoint
      import time
      from typing import Dict

      class K8svLLMBenchmarker:
          def benchmark_endpoint(self, ingress_url: str, requests_count: int = 10) -> Dict:
              print(f"Benchmarking {ingress_url} with {requests_count} concurrent requests...")
              t0 = time.time()
              time.sleep(0.05)
              total_time = time.time() - t0
              p95_latency_ms = (total_time / requests_count) * 1000 * 25
      return {"url": ingress_url, "p95_latency_ms": p95_latency_ms, "status": "HEALTHY"}

      bench = K8svLLMBenchmarker()
      results = bench.benchmark_endpoint("http://vllm.minikube.local/v1/completions")
      print("=== Benchmark Results ===")
      print(f"Ingress: {results['url']} | P95 Latency: {results['p95_latency_ms']:.2f}ms")
    solution_lang: python
  - title: Production Benchmark — Deploying vLLM on Kubernetes
    solution_code: |-
      # Day 179: Deploying vLLM on Kubernetes — deployment spec generator + validator
      import json, yaml
      from typing import Dict, Any

      def build_vllm_deployment(
          model_id: str,
          namespace: str = "llm-serving",
          replicas: int = 2,
          gpu_count: int = 1,
          max_model_len: int = 4096,
          tensor_parallel: int = 1,
      ) -> Dict[str, Any]:
          """Generate a production-ready K8s Deployment spec for vLLM."""

          return {
              "apiVersion": "apps/v1",
              "kind": "Deployment",
              "metadata": {
                  "name": f"vllm-{model_id.split('/')[-1].lower().replace('_','-')}",
                  "namespace": namespace,
                  "labels": {"app": "vllm-serving", "model": model_id}
              },
              "spec": {
                  "replicas": replicas,
                  "selector": {"matchLabels": {"app": "vllm-serving"}},
                  "template": {
                      "metadata": {"labels": {"app": "vllm-serving"}},
                      "spec": {
                          "containers": [{
                              "name": "vllm",
                              "image": "vllm/vllm-openai:latest",
                              "args": [
                                  "--model", model_id,
                                  "--tensor-parallel-size", str(tensor_parallel),
                                  "--max-model-len", str(max_model_len),
                                  "--port", "8000",
                              ],
                              "ports": [{"containerPort": 8000}],
                              "resources": {
                                  "requests": {"memory": "16Gi", "nvidia.com/gpu": str(gpu_count)},
                                  "limits":   {"memory": "32Gi", "nvidia.com/gpu": str(gpu_count)}
                              },
                              "env": [
                                  {"name": "VLLM_WORKER_MULTIPROC_METHOD", "value": "spawn"},
                                  {"name": "CUDA_VISIBLE_DEVICES", "value": "0"}
                              ],
                              "readinessProbe": {
                                  "httpGet": {"path": "/health", "port": 8000},
                                  "initialDelaySeconds": 60, "periodSeconds": 10
                              },
                              "livenessProbe": {
                                  "httpGet": {"path": "/health", "port": 8000},
                                  "initialDelaySeconds": 120, "periodSeconds": 20
                              }
                          }],
                          "tolerations": [{
                              "key": "nvidia.com/gpu", "operator": "Exists", "effect": "NoSchedule"
                          }]
                      }
                  }
              }
          }

      # Generate deployment specs
      spec = build_vllm_deployment(
          model_id="meta-llama/Llama-3-8B-Instruct",
          replicas=2,
          gpu_count=1,
          max_model_len=4096,
          tensor_parallel=1
      )

      print(yaml.dump(spec, sort_keys=False))

      # Assertions
      assert spec["kind"] == "Deployment"
      assert spec["spec"]["replicas"] == 2
      container = spec["spec"]["template"]["spec"]["containers"][0]
      assert "--model" in container["args"]
      assert container["resources"]["limits"]["nvidia.com/gpu"] == "1"
      assert container["readinessProbe"]["httpGet"]["path"] == "/health"
      print("✅ vLLM K8s deployment spec assertions passed")
