  flashcards:
  - front: 'Core concept: What is the significance of Kubernetes Pod in Kubernetes Core Concepts?'
    back: • The smallest deployable unit in K8s.<br/>• Contains one or more tightly coupled containers sharing network and
      storage.
  - front: Resource Requests vs Limits?
    back: '• Requests: guaranteed resources for scheduling.<br/>• Limits: maximum allowed — container is killed if exceeded.'
  - front: K8s Service (LoadBalancer)?
    back: • Exposes pods to external traffic with a stable IP, routing to healthy pods automatically.
  - front: How is Kubernetes Core Concepts tested and validated in industrial ML pipelines (Day 178)?
    back: • Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.<br/>• allclose at 1e-5),
      and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Kubernetes Core Concepts in distributed systems?'
    back: • Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: PyTorch DataLoader Crash without /dev/shm'
    description: 'By default, Docker and Kubernetes assign only 64MB to /dev/shm. Multi-worker PyTorch DataLoaders will crash
      with SIGBUS errors. Always mount an emptyDir with medium: Memory to /dev/shm. (Avoid anti-pattern: always validate with
      strict assertion checks e.g. `assert input_tensor.shape[-1] == expected_dim`).'
  takeaways:
    hinglish_line: |-
      <strong>
              Ek line mein:
             </strong>
             "Docker builds containers, K8s runs them at scale. Production teams need both concepts and their operational trade-offs."
    bullets:
    - Always set resource requests/limits — prevents one pod from starving others.
    - Use livenessProbe and readinessProbe for automatic health checking.
    - Never store secrets in ConfigMaps — always use K8s Secrets or Vault.
    - Kubernetes Control Plane components (kube-apiserver, scheduler, etcd) coordinate GPU container lifecycle across physical
      worker nodes.
