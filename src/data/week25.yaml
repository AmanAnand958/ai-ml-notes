    prompt_html: '<p>Run a <strong>load test</strong> against the deployed vLLM endpoint using <code>locust</code> or <code>k6</code>.
      Measure: p50/p95/p99 latency, tokens/second throughput, and observe HPA scaling behavior under load. Record results
      in a JSON report.</p>'
