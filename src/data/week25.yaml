  - 'Capstone: Production K8s LLM Deployment'
  hinglish: Kubernetes container orchestration model pods ko Nodes par schedule karta
    hai. Self-healing features agar pod crash ho toh automatic naya instance spin
    up kar dete hain.
  analogy: Kubernetes pods are like shipping containers on a cargo ship—standardized,
    isolated, and easy to stack and move.
  theory_html: '<div class="theory-prose" style="line-height:1.7; font-size:14.5px;
    color:var(--text);">

    <p>Analogy:

    Kubernetes Core Concepts

    💡 Gotcha &amp; Common Pitfall Warning:

    Always double check tensor dimensions, verify data types before matrix operations,
