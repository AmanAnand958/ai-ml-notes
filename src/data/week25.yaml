  flashcards:
  - front: 'Core concept: What is the significance of Rolling Update in Capstone: Production K8s LLM Deployment?'
    back: • K8s gradually replaces old pods with new ones, maintaining availability throughout.<br/>• Zero downtime deployment.
  - front: 'Core concept: What is the significance of helm --wait in Capstone: Production K8s LLM Deployment?'
    back: • Blocks until all pods are Running and ready.<br/>• Fails if timeout expires, triggering CI failure and automatic rollback.
  - front: Production ML System?
    back: • Code → CI Tests → Docker Build → K8s Deploy → HPA → Monitoring → Drift → Retrain.<br/>• The full loop.
  - front: nvidia.com/gpu limit?
    back: • K8s resource limit that requests N physical GPUs for a pod.<br/>• Must match the number of GPUs the container needs.
  - front: PersistentVolumeClaim (PVC)?
    back: • A request for durable storage that persists across pod restarts.<br/>• Essential for model weight caches.
  - front: 'Core concept: What is the significance of nodeSelector in Capstone: Production K8s LLM Deployment?'
    back: "Constrains a pod to only be scheduled on nodes with matching labels (e.g.,\n         \n          accelerator: nvidia-a100\n         \n         )."
  - front: HPA (Horizontal Pod Autoscaler)?
    back: '• Automatically adds/removes pod replicas based on CPU, memory, or custom metrics.<br/>• This establishes the core invariant in Capstone: Production K8s LLM Deployment, ensuring memory efficiency, numerical stability, and robust scaling.'
  - front: Kubernetes LLM Horizontal Pod Autoscaling with KEDA?
    back: • Scales inference pod replicas based on real-time metrics (vLLM pending request queue length and GPU duty cycle) rather than raw CPU usage.
  gotcha:
    title: '⚠️ Gotcha: Ingress Gateway Timeout on Long Autoregressive Streams'
    description: 'Standard NGINX Ingress controllers default to a 60-second proxy-read-timeout. Long generative responses that take >60 seconds will get abruptly severed with HTTP 504. Set `nginx.ingress.kubernetes.io/proxy-read-timeout: ''600''`.'
