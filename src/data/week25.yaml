      kind: HorizontalPodAutoscaler\nmetadata:\n  name: vllm-hpa\nspec:\n  scaleTargetRef:\n\
      \    apiVersion: apps/v1\n    kind: Deployment\n    name: vllm-inference-service\n\
      \  minReplicas: <span class=\"num\">2</span>\n  maxReplicas: <span class=\"\
