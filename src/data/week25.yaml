      """
      Production Implementation: Task 1: Build a Golden Dataset
      Module: Day 183 — Model Performance Regression Tests
      """

      # Solution for Task: Build a Golden Dataset
      from typing import List, Dict

      class GoldenDatasetGenerator:
          def create_triplets(self, sample_docs: List[str]) -> List[Dict]:
              dataset = []
              for idx, doc in enumerate(sample_docs, start=1):
                  dataset.append({
                      "id": f"gold_{idx}",
                      "question": f"What is discussed in context #{idx}?",
                      "context": doc,
                      "ground_truth": f"Ground truth answer extracted from context #{idx}"
                  })
      return dataset

      gen = GoldenDatasetGenerator()
