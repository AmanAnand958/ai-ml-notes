      \ <span class=\"num\">75</span>\n<span class=\"str\">\"\"\"</span>\n<span class=\"\
      kw\">return</span> hpa_yaml.<span class=\"fn\">strip</span>()\n\n<span class=\"\
      fn\">print</span>(<span class=\"str\">\"=== Kubernetes HPA Autoscaler YAML ===\"\
