  - front: 'Core concept: What is the significance of Flaky LLM Test in Model Performance
      Regression Tests?'
    back: A test that sometimes passes and sometimes fails due to LLM non-determinism.
      Fix with temperature=0 and threshold-based assertions.
  - front: How is Model Performance Regression Tests tested and validated in industrial
      ML pipelines (Day 183)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical
      tolerances (np.allclose at 1e-5), and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Model Performance
      Regression Tests in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation,
      resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
