      is_correct: false
      id: d
    correct_fb: ✅ Correct! Scale-to-zero eliminates idle instance costs for intermittent
      internal tools and staging environments.
    wrong_fb: ❌ Incorrect. Scale-to-zero suspends pod allocations during idle periods,
      saving cloud compute budgets.
    correct: a
  - num_str: QUESTION 4 OF 4
    question: What setting in Kubernetes HPA prevents rapid flapping (thrashing) between
      scale-up and scale-down events?
    qid: q180_4
    options:
    - letter: A
      text: The `stabilizationWindowSeconds` behavior configuration, which delays
        scaling down until a cooldown window has elapsed.
      is_correct: true
      id: a
    - letter: B
      text: Setting minimum replicas to 100.
      is_correct: false
      id: b
    - letter: C
      text: Disabling all network connections.
      is_correct: false
      id: c
    - letter: D
      text: Restarting the cluster hourly.
      is_correct: false
      id: d
