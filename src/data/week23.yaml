    url: https://www.youtube.com/watch?v=Wqmtf9SA_kk
  - type: PAPER
    title: 'FlashAttention-2: Faster Attention with Better Parallelism'
    url: https://arxiv.org/abs/2307.08691
    desc: Tri Dao's IO-aware exact attention acceleration
  - type: DOCS
    title: 'OpenAI Triton: GPU Programming for Neural Networks'
    url: https://triton-lang.org/main/index.html
    desc: Writing custom CUDA-grade kernels in Python
  - type: GUIDE
    title: NVIDIA TensorRT-LLM High-Performance Inference
    url: https://github.com/NVIDIA/TensorRT-LLM
    desc: Kernel fusion, FP8 GEMM, and In-Flight Batching
