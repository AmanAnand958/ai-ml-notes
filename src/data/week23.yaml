      active training I/O and compliance archival.
    wrong_fb: ❌ Incorrect. S3 Standard provides sub-millisecond retrieval for active
      workloads, while Glacier tiers minimize archival costs.
  - num_str: QUESTION 3 OF 4
    question: What is S3 Multi-Part Upload and why is it essential for 70B+ LLM weight
      files?
    qid: q165_3
    options:
    - letter: A
      text: It uploads large multi-gigabyte tensor files in parallel chunks, improving
        upload speed and enabling resume on network interruption.
      is_correct: true
    - letter: B
      text: It splits the text into multiple languages.
      is_correct: false
    - letter: C
      text: It converts PyTorch weights into TensorFlow automatically.
      is_correct: false
    - letter: D
      text: It compresses files using JPEG format.
      is_correct: false
    correct_fb: ✅ Correct! Multi-part uploads transfer large checkpoint shards concurrently,
      maximizing network utilization and resilience.
    wrong_fb: ❌ Incorrect. Multi-part uploads allow parallel chunk transmission and
      fault-tolerant resumes on multi-gigabyte tensor artifacts.
  - num_str: QUESTION 4 OF 4
    question: How does S3 Object Versioning protect ML production pipelines?
    qid: q165_4
    options:
    - letter: A
