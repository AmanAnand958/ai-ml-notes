  quizzes:
  - num_str: QUESTION 1 OF 4
    question: Why is VPC Peering or AWS PrivateLink used when connecting application
      servers to managed Vector Databases (e.g. Pinecone, Qdrant)?
    qid: q167_1
    options:
    - letter: A
      text: To route vector queries entirely over private AWS backbone networks, reducing
        latency and avoiding exposure to the public internet.
      is_correct: true
    - letter: B
      text: To make vector databases accessible to any random internet user.
      is_correct: false
    - letter: C
      text: Because vector databases cannot run on the internet.
      is_correct: false
    - letter: D
      text: To eliminate the need for vector embeddings.
      is_correct: false
    correct_fb: ✅ Correct! Private connectivity secures vector embeddings and minimizes
      network hops between application servers and vector indexes.
    wrong_fb: ❌ Incorrect. VPC peering and PrivateLink keep sensitive vector search
      queries within private network boundaries.
  - num_str: QUESTION 2 OF 4
    question: What is the difference between Public and Private Subnets in an enterprise
      Cloud AI architecture?
    qid: q167_2
    options:
    - letter: A
      text: Public subnets have direct internet routing via an Internet Gateway (e.g.
        for ALBs); private subnets host backend compute and databases without direct
        public IP access.
      is_correct: true
    - letter: B
      text: Public subnets are free; private subnets cost money.
      is_correct: false
    - letter: C
      text: Public subnets use IPv6; private subnets use IPv4.
      is_correct: false
    - letter: D
      text: There is no difference.
      is_correct: false
    correct_fb: ✅ Correct! Defense-in-depth network architecture places sensitive
      inference workloads and databases inside isolated private subnets.
    wrong_fb: ❌ Incorrect. Isolating database and inference instances in private subnets
      blocks direct external attack vectors.
  - num_str: QUESTION 3 OF 4
    question: What role does a NAT Gateway serve for compute instances in private
      subnets?
    qid: q167_3
    options:
    - letter: A
      text: Allowing private instances to initiate outbound connections (e.g. downloading
        HuggingFace weights or software patches) while blocking inbound internet traffic.
      is_correct: true
    - letter: B
      text: Hosting public websites.
      is_correct: false
    - letter: C
      text: Accelerating GPU matrix multiplication.
      is_correct: false
    - letter: D
      text: Compressing video files.
      is_correct: false
    correct_fb: ✅ Correct! NAT Gateways provide secure one-way outbound connectivity
      for package management and model downloading without exposing instances.
    wrong_fb: ❌ Incorrect. NAT Gateways enable private instances to access external
      resources securely while preventing unsolicited inbound traffic.
  - num_str: QUESTION 4 OF 4
    question: How do AWS Security Groups enforce the principle of least privilege
      in ML clusters?
    qid: q167_4
    options:
    - letter: A
      text: By acting as stateful virtual firewalls that explicitly permit traffic
        only on specific ports (e.g. port 8000) from designated source security groups.
      is_correct: true
    - letter: B
      text: By deleting unauthorized files from the server.
      is_correct: false
    - letter: C
      text: By scanning code for spelling errors.
      is_correct: false
    - letter: D
      text: By encrypting user passwords in plain text.
      is_correct: false
    correct_fb: ✅ Correct! Security Groups restrict ingress and egress network access
      strictly to authorized microservice dependencies.
    wrong_fb: ❌ Incorrect. Security Groups enforce fine-grained port and protocol
      firewall rules between interconnected infrastructure components.
