    question: If you switch from GPT-4o to GPT-4o-mini for 80% of requests and costs
      drop 70%, what is this strategy called?
    answer: Model Cascading
    explanation: Model Cascading / Tiered Routing (routing simple queries to lightweight,
      cheaper models and escalating complex queries to frontier models).
    code: "# Verification Script for Day 168\ndef compute_cost_savings(total_reqs=1000000,\
      \ gpt4_cost_per_k=0.03, mini_cost_per_k=0.0006):\n    baseline_cost = (total_reqs\
      \ / 1000) * gpt4_cost_per_k\n    cascaded_cost = (total_reqs * 0.8 / 1000) *\
      \ mini_cost_per_k + (total_reqs * 0.2 / 1000) * gpt4_cost_per_k\n    savings_pct\
      \ = ((baseline_cost - cascaded_cost) / baseline_cost) * 100\nprint(f\"Model\
      \ Cascade: Baseline=${baseline_cost:.2f} - Cascaded=${cascaded_cost:.2f} (Savings:\
      \ {savings_pct:.1f}%)\")\nreturn savings_pct\n\nif __name__ == \"__main__\"\
      :\n    assert compute_cost_savings() >= 70.0"
