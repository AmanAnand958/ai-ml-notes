    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "# Solution for Task: Token Counter\nimport tiktoken\nfrom typing\
      \ import Dict\n\ndef calculate_token_costs(text: str, model_name: str = \"gpt-4o\"\
      ) -> Dict:\n    \"\"\"Calculate exact token count and estimated cost for user\
      \ prompts.\"\"\"\n    encoding = tiktoken.get_encoding(\"cl100k_base\")\n  \
