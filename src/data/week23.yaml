  quizzes:
  - num_str: QUESTION 1 OF 4
    question: What is Infrastructure as Code (IaC) using Terraform or AWS CDK?
    qid: q170_1
    options:
    - letter: A
      text: Defining, provisioning, and version-controlling cloud infrastructure (VPCs,
        endpoints, clusters) declaratively via code files rather than manual console
        clicks.
      is_correct: true
    - letter: B
      text: Writing Python code on paper.
      is_correct: false
    - letter: C
      text: A tool that automatically deletes servers.
      is_correct: false
    - letter: D
      text: A method to replace all cloud providers with local servers.
      is_correct: false
    correct_fb: ✅ Correct! IaC enables repeatable, automated, and auditable cloud
      deployments across development, staging, and production environments.
    wrong_fb: ❌ Incorrect. IaC tools allow teams to manage entire cloud architectures
      through version-controlled, automated configuration files.
  - num_str: QUESTION 2 OF 4
    question: In Terraform, what does the `terraform plan` command do?
    qid: q170_2
    options:
    - letter: A
      text: It creates an execution plan, comparing current cloud state with desired
        code to show exactly which resources will be created, updated, or deleted.
      is_correct: true
    - letter: B
      text: It executes all Python tests.
      is_correct: false
    - letter: C
      text: It permanently deletes the cloud account.
      is_correct: false
    - letter: D
      text: It deploys code directly to production without confirmation.
      is_correct: false
    correct_fb: ✅ Correct! `terraform plan` allows engineers to review infrastructure
      diffs before applying changes to live environments.
    wrong_fb: ❌ Incorrect. Planning visualizes proposed infrastructure changes before
      committing them with `terraform apply`.
  - num_str: QUESTION 3 OF 4
    question: What is the purpose of the Terraform State file (`terraform.tfstate`)?
    qid: q170_3
    options:
    - letter: A
      text: It maps your declared configuration to real-world cloud resources, tracking
        metadata and resource IDs.
      is_correct: true
    - letter: B
      text: It stores user passwords in plain text.
      is_correct: false
    - letter: C
      text: It is a temporary cache that should be deleted after every command.
      is_correct: false
    - letter: D
      text: It records the model's training accuracy.
      is_correct: false
    correct_fb: ✅ Correct! The state file maintains the authoritative mapping between
      code definitions and active cloud infrastructure.
    wrong_fb: ❌ Incorrect. Terraform state tracks provisioned resources and dependencies,
      enabling precise diff calculations.
  - num_str: QUESTION 4 OF 4
    question: Why should Terraform state files be stored in a remote backend (e.g.
      S3 with DynamoDB locking) rather than on a local laptop?
    qid: q170_4
    options:
    - letter: A
      text: To enable collaborative team deployments, secure encryption at rest, and
        state locking to prevent concurrent conflicting modifications.
      is_correct: true
    - letter: B
      text: Because local hard drives cannot store text files.
      is_correct: false
    - letter: C
      text: To make state files public to the entire internet.
      is_correct: false
    - letter: D
      text: To increase Python compilation speed.
      is_correct: false
    correct_fb: ✅ Correct! Remote state locking with S3 and DynamoDB prevents multiple
      engineers from corrupting infrastructure state during concurrent runs.
    wrong_fb: ❌ Incorrect. Remote backends provide concurrency locking, encryption,
      and shared access control for team infrastructure management.
