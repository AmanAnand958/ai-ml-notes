    time_minutes: 45
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: What is the primary architectural difference between SageMaker Real-time
      Endpoints and Serverless Inference?
    qid: q164_1
    options:
    - letter: A
      text: Real-time endpoints run on persistent, dedicated EC2 instances with predictable
        latency; Serverless runs on on-demand...
      is_correct: true
      id: a
    - letter: B
      text: Serverless inference requires physical GPU servers in your home.
      is_correct: false
      id: b
    - letter: C
      text: Real-time endpoints cannot handle HTTPS traffic.
      is_correct: false
      id: c
    - letter: D
      text: Serverless inference only supports Python 2.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Real-time endpoints maintain warm provisioned compute for
      low-latency workloads, while Serverless inference scales compute automatically
      based on traffic bursts.
    wrong_fb: ❌ Incorrect. Serverless inference scales to zero for intermittent workloads,
      whereas real-time endpoints provide dedicated instance pools.
    correct: a
  - num_str: QUESTION 2 OF 4
    question: In SageMaker inference, what is the role of an Async Inference Endpoint?
    qid: q164_2
    options:
    - letter: A
      text: Handling large payloads (up to 1GB) and long-running requests (up to 1
        hour) via an integrated S3 bucket and Amazon S...
      is_correct: true
      id: a
    - letter: B
      text: Running model inference backwards.
      is_correct: false
      id: b
    - letter: C
      text: Deleting model artifacts after 5 minutes.
      is_correct: false
      id: c
    - letter: D
      text: Replacing all cloud compute with local laptops.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Async endpoints decouple long-running inference jobs from
      client connections, queuing requests in S3/SNS.
    wrong_fb: ❌ Incorrect. Async endpoints are designed for large payloads and high-latency
      processing jobs that exceed standard API Gateway timeout limits.
    correct: a
  - num_str: QUESTION 3 OF 4
    question: What configuration is mandatory to enable Autoscaling on SageMaker Real-time
      Endpoints?
    qid: q164_3
    options:
    - letter: A
      text: An Application Auto Scaling Target Tracking policy tracking `SageMakerVariantInvocationsPerInstance`
        or GPU memory ut...
      is_correct: true
      id: a
    - letter: B
      text: A cron job that restarts the server every 10 minutes.
      is_correct: false
      id: b
    - letter: C
      text: A manual email sent to AWS support.
      is_correct: false
      id: c
    - letter: D
      text: Setting minimum instances to zero on real-time endpoints.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Target tracking policies adjust instance counts automatically
      when request volume per instance exceeds target thresholds.
    wrong_fb: ❌ Incorrect. Application Auto Scaling relies on invocations-per-instance
      metrics to scale endpoint capacity up or down.
    correct: a
  - num_str: QUESTION 4 OF 4
    question: Why is SageMaker Multi-Model Endpoints (MME) cost-effective for hosting
      hundreds of fine-tuned models?
    qid: q164_4
    options:
    - letter: A
      text: It dynamically loads models into memory on a shared fleet of instances
        based on incoming request routing, sharing com...
      is_correct: true
      id: a
    - letter: B
      text: It makes all models completely free of charge.
      is_correct: false
      id: b
    - letter: C
      text: It deletes 90% of model weights automatically.
      is_correct: false
      id: c
    - letter: D
      text: It only runs on weekends.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! MME allows hosting thousands of models on a single endpoint
      fleet, loading models from S3 into memory on demand.
    wrong_fb: ❌ Incorrect. MME pools instance compute across many models, eliminating
      the need to provision dedicated endpoints for low-traffic models.
    correct: a
  flashcards:
  - front: SageMaker Training Job?
    back: Ephemeral compute that runs your training script, saves model to S3, then
      shuts down. You only pay for training duration.
  - front: 'Core concept: What is the significance of ml.g4dn.xlarge in AWS SageMaker
      — Training & Endpoints?'
    back: Entry-level AWS GPU instance with 1x NVIDIA T4 (16GB VRAM). Good for inference
      of 7B models.
  - front: SageMaker vs EC2?
    back: SageMaker is managed; EC2 is a raw VM. Relative cost depends on region,
      instance, utilization, storage, and operational overhead—compare current pricing
      before choosing.
  - front: How is AWS SageMaker — Training & Endpoints tested and validated in industrial
      ML pipelines (Day 164)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical
      tolerances (np.allclose at 1e-5), and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling AWS SageMaker
      — Training & Endpoints in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation,
      resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Production Edge Case in AWS SageMaker — Training & Endpoints'
    description: Always validate shape invariants, numerical tolerances (1e-5), and
      memory bounds when deploying AWS SageMaker — Training & Endpoints in distributed
      production pipelines.
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       \"SageMaker\
      \ aapko infrastructure manage karne ki tension se free karta hai — bas code,\
      \ data, aur instance type specify karo!\""
    bullets:
    - Training Jobs are ephemeral — no wasted compute cost.
    - Always delete endpoints after testing — they charge by the hour.
    - HuggingFace containers are first-class citizens in SageMaker.
