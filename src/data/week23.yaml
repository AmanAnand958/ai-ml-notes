  predict:
    question: If you switch from GPT-4o to GPT-4o-mini for 80% of requests and costs
      drop 70%, what is this strategy called?
    answer: Model Cascading
    explanation: Model Cascading / Tiered Routing (routing simple queries to lightweight,
      cheaper models and escalating complex queries to frontier models).
    code: "<span class=\"cm\"># Verification Script for Day 168</span>\n<span class=\"\
      kw\">def</span> <span class=\"fn\">compute_cost_savings</span>(total_reqs=<span\
      \ class=\"num\">1000000</span>, gpt4_cost_per_k=<span class=\"num\">0.03</span>,\
      \ mini_cost_per_k=<span class=\"num\">0.0006</span>):\n    baseline_cost = (total_reqs\
      \ / <span class=\"num\">1000</span>) * gpt4_cost_per_k\n    cascaded_cost =\
      \ (total_reqs * <span class=\"num\">0.8</span> / <span class=\"num\">1000</span>)\
      \ * mini_cost_per_k + (total_reqs * <span class=\"num\">0.2</span> / <span class=\"\
      num\">1000</span>) * gpt4_cost_per_k\n    savings_pct = ((baseline_cost - cascaded_cost)\
      \ / baseline_cost) * <span class=\"num\">100</span>\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Model Cascade: Baseline=${baseline_cost:.2f} - Cascaded=${cascaded_cost:.2f}\
      \ (Savings: {savings_pct:.1f}%)\"</span>)\n<span class=\"kw\">return</span>\
      \ savings_pct\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\"\
      >\"__main__\"</span>:\n    <span class=\"kw\">assert</span> <span class=\"fn\"\
      >compute_cost_savings</span>() &gt;= <span class=\"num\">70.0</span>"
