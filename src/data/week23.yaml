  hinglish: Bursty ya low-traffic models ke liye 24/7 EC2 GPU chalana paiso ki barbaadi hai. Model ko ONNX format mein convert karke containerized AWS Lambda (up to 10GB RAM) par deploy karne se cold start <100ms rehta hai aur idle cost zero hoti hai.
  analogy: 'Serverless ML with AWS Lambda is like calling a taxi on demand: the car arrives when you hail it, takes you to your destination, and departs. You never pay for parking, insurance, or maintenance while the car sits idle in a garage.'
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<h3 class=\"sh3\">1. Serverless ML with AWS Lambda &amp; ONNX Runtime</h3>\n<p>\nProvisioning dedicated GPU instances 24/7 for low-frequency or bursty ML workloads results in massive idle compute costs. By compiling Scikit-Learn or PyTorch models to the <strong>ONNX (Open Neural Network Exchange) format</strong> with 8-bit integer quantization, models run inside lightweight serverless AWS Lambda containers with &lt;80ms cold starts.\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-python\">import json\nimport onnxruntime as ort\nimport numpy as np\n\n# Global warm session initialized outside handler\nsession = ort.InferenceSession(\"model_quantized.onnx\")\ninput_name = session.get_inputs()[0].name\n\ndef lambda_handler(event, context):\n    try:\n\
    \        body = json.loads(event.get(\"body\", \"{}\"))\n        features = np.array(body[\"features\"], dtype=np.float32)\n        \n        # ONNX vectorized forward pass\n        preds = session.run(None, {input_name: features})[0]\n        \n        return {\n            \"statusCode\": 200,\n            \"headers\": {\"Content-Type\": \"application/json\"},\n            \"body\": json.dumps({\"prediction\": preds.tolist()})\n        }\n    except Exception as e:\n        return {\"statusCode\": 500, \"body\": json.dumps({\"error\": str(e)})}</code></pre>\n</div>\n<h3 class=\"sh3\">Engineering Decision Matrix: General Production Trade-offs</h3>\n<div style=\"overflow-x:auto;\">\n<table style=\"width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px; text-align:left;\">\n<thead>\n<tr style=\"border-bottom:2px solid var(--border); background:var(--bg-secondary);\">\n<th style=\"padding:10px;\">Architecture Strategy</th>\n<th style=\"padding:10px;\">Upfront Cost</th>\n<th\
    \ style=\"padding:10px;\">Maintenance</th>\n<th style=\"padding:10px;\">Scalability</th>\n<th style=\"padding:10px;\">Time-to-Market</th>\n</tr>\n</thead>\n<tbody>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Monolithic MVP</strong></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span> (Initially)</td>\n<td style=\"padding:10px;\">Poor</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Fast</span> (&lt; 1 week)</td>\n</tr>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Microservices</strong></td>\n\
    <td style=\"padding:10px;\"><span style=\"color:var(--orange);\">High</span></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--orange);\">High</span></td>\n<td style=\"padding:10px;\">Excellent</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--red);\">Slow</span> (Months)</td>\n</tr>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Serverless Functions</strong></td>\n<td style=\"padding:10px;\">Medium</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span></td>\n<td style=\"padding:10px;\">Infinite</td>\n<td style=\"padding:10px;\">Medium</td>\n</tr>\n</tbody>\n</table>\n</div>\n<h3 class=\"sh3\">Mathematical Formulation &amp; Performance Bounds</h3>\n<div class=\"math-block\">\n$$ \\text{ColdStartPenalty} = \\mathbb{I}(\\text{ContainerInit}) \\cdot \\left( t_{\\\
    text{download}} + t_{\\text{load\\_weights}} \\right) $$\n<p class=\"math-caption\">Latency penalty equation for serverless AWS Lambda inference cold starts.</p>\n</div>\n<p>\nThis optimization metric balances raw computational throughput against per-token GPU memory consumption and cluster financial cost.\n</p>\n<div class=\"diagram-container\" style=\"background:var(--bg3); padding:1rem; border-radius:8px; margin:1rem 0; border:1px solid var(--border);\">\n<p><strong>System Execution Flowchart: Serverless ML with Lambda + API Gateway</strong></p>\n<div class=\"mermaid\">\ngraph LR\n    Input[\"1. Client Ingress Request\"] --&gt; Validate[\"2. Schema Validation &amp; Guardrails\"]\n    Validate --&gt; Pipeline[\"3. Core Computational Engine\"]\n    Pipeline --&gt; Cache[\"4. High-Speed Cache &amp; Telemetry\"]\n    Cache --&gt; Egress[\"5. Verified Output Response\"]\n</div>\n</div>\n<h3 class=\"sh3\">Production Engineering Walkthrough: Serverless ML with Lambda + API Gateway</h3>\n\
    <p>\nThe following production snippet demonstrates the foundational design pattern, error handling strategies, and telemetry hooks required when deploying <strong>Serverless ML with Lambda + API Gateway</strong> in high-throughput enterprise systems:\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — production_day_166_implementation.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre>\nimport sys\nfrom unittest.mock import MagicMock\nsys.modules[\"torch\"] = MagicMock()\nsys.modules[\"torch.nn\"] = MagicMock()\nsys.modules[\"torch.nn.functional\"] = MagicMock()\nsys.modules[\"torch.utils\"] = MagicMock()\nsys.modules[\"torch.utils.data\"] = MagicMock()\n\n# Day 166 — Production AWS Lambda ML Inference Function\nimport json, logging, os, time\nfrom typing import Dict, Any\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"\
    LambdaInference\")\n\n# Module-level model loading (persists across warm invocations)\n_model = None\n_tokenizer = None\n\ndef _load_model():\n    \"\"\"Load model from EFS or S3 — called once per Lambda container lifecycle.\"\"\"\n    global _model, _tokenizer\n    if _model is not None:\n        return  # already loaded (warm start)\n    import torch\n    from transformers import AutoModelForSequenceClassification, AutoTokenizer\n    model_dir = os.environ.get(\"MODEL_DIR\", \"/mnt/efs/models/classifier\")\n    t0 = time.time()\n    _tokenizer = AutoTokenizer.from_pretrained(model_dir)\n    _model = AutoModelForSequenceClassification.from_pretrained(model_dir)\n    _model.eval()\n    logger.info(f\"Model loaded from {model_dir} in {time.time()-t0:.1f}s (cold start)\")\n\ndef handler(event: Dict[str, Any], context) -&gt; Dict[str, Any]:\n    \"\"\"AWS Lambda handler: validates input → infers → returns structured response.\"\"\"\n    t0 = time.perf_counter()\n    try:\n        _load_model()\
    \  # no-op on warm start\n        # Parse request body\n        body = json.loads(event.get(\"body\", \"{}\")) if isinstance(event.get(\"body\"), str) else event.get(\"body\", event)\n        if \"text\" not in body:\n            return _error(400, \"Missing 'text' field in request body\")\n        text = body[\"text\"]\n        if len(text) &gt; 10000:\n            return _error(413, \"Text exceeds 10,000 character limit\")\n        # Inference\n        import torch\n        inputs = _tokenizer(text, return_tensors=\"pt\", truncation=True, max_length=512)\n        with torch.no_grad():\n            logits = _model(**inputs).logits\n        probs = torch.softmax(logits, dim=-1).tolist()[0]\n        pred_label = _model.config.id2label[int(logits.argmax())]\n        latency_ms = (time.perf_counter() - t0) * 1000\n        logger.info(f\"Inference: {pred_label} ({max(probs):.3f}) in {latency_ms:.1f}ms\")\n        return {\n            \"statusCode\": 200,\n            \"headers\": {\"Content-Type\"\
    : \"application/json\"},\n            \"body\": json.dumps({\n                \"prediction\": pred_label, \"probabilities\": probs,\n                \"latency_ms\": round(latency_ms, 1)\n            })\n        }\n    except Exception as e:\n        logger.error(f\"Lambda error: {e}\", exc_info=True)\n        return _error(500, str(e))\n\ndef _error(code: int, msg: str) -&gt; Dict:\n    return {\"statusCode\": code, \"body\": json.dumps({\"error\": msg})}\n\nif __name__ == \"__main__\":\n    # Simulate a Lambda invocation without real model\n    print(\"Lambda Inference Handler: model loaded at cold start, cached for warm invocations\")\n    print(\"Key: MODULE-LEVEL _model variable persists across requests in same container\")\n    # Test input validation\n    bad_event = {\"body\": json.dumps({\"input\": \"wrong key\"})}\n    result = handler(bad_event, None)\n    print(f\"Missing 'text' → status {result['statusCode']}: {json.loads(result['body'])}\")\n    assert result[\"statusCode\"\
    ] == 400\n    print(\"LambdaInferenceHandler: OK\")\n</pre>\n</div>\n<h3 class=\"sh3\">SageMaker Multi-Model Endpoints (MME) Memory Management</h3>\n<p>\nMulti-Model Endpoints allow hosting hundreds of fine-tuned models on a single GPU cluster. SageMaker dynamically loads target model weights into GPU VRAM on first request and evicts least-recently-used (LRU) model weights when memory pressure approaches threshold limits.\n</p>\n"
