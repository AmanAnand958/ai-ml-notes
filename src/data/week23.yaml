  quizzes:
  - num_str: QUESTION 1 OF 4
    question: What is the primary architectural difference between SageMaker Real-time Endpoints and Serverless Inference?
    qid: q164_1
    options:
    - letter: A
      text: Real-time endpoints run on persistent, dedicated EC2 instances with predictable latency; Serverless runs on on-demand...
      is_correct: true
      id: a
    - letter: B
      text: Serverless inference requires physical GPU servers in your home.
      is_correct: false
      id: b
    - letter: C
      text: Real-time endpoints cannot handle HTTPS traffic.
      is_correct: false
      id: c
    - letter: D
      text: Serverless inference only supports Python 2.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Real-time endpoints maintain warm provisioned compute for low-latency workloads, while Serverless
      inference scales compute automatically based on traffic bursts.
    wrong_fb: ❌ Incorrect. Serverless inference scales to zero for intermittent workloads, whereas real-time endpoints provide
      dedicated instance pools.
    correct: a
  - num_str: QUESTION 2 OF 4
    question: In SageMaker inference, what is the role of an Async Inference Endpoint?
    qid: q164_2
    options:
    - letter: A
      text: Handling large payloads (up to 1GB) and long-running requests (up to 1 hour) via an integrated S3 bucket and Amazon
        S...
      is_correct: true
      id: a
    - letter: B
      text: Running model inference backwards.
      is_correct: false
      id: b
    - letter: C
      text: Deleting model artifacts after 5 minutes.
      is_correct: false
      id: c
    - letter: D
      text: Replacing all cloud compute with local laptops.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Async endpoints decouple long-running inference jobs from client connections, queuing requests
      in S3/SNS.
    wrong_fb: ❌ Incorrect. Async endpoints are designed for large payloads and high-latency processing jobs that exceed standard
      API Gateway timeout limits.
    correct: a
