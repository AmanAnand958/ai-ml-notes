      is_correct: false
      id: b
    - letter: C
      text: A manual email sent to AWS support.
      is_correct: false
      id: c
    - letter: D
      text: Setting minimum instances to zero on real-time endpoints.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Target tracking policies adjust instance counts automatically when request volume per instance
      exceeds target thresholds.
    wrong_fb: ❌ Incorrect. Application Auto Scaling relies on invocations-per-instance metrics to scale endpoint capacity
      up or down.
    correct: a
  - num_str: QUESTION 4 OF 4
    question: Why is SageMaker Multi-Model Endpoints (MME) cost-effective for hosting hundreds of fine-tuned models?
    qid: q164_4
    options:
    - letter: A
      text: It dynamically loads models into memory on a shared fleet of instances based on incoming request routing, sharing
        com...
      is_correct: true
      id: a
    - letter: B
      text: It makes all models completely free of charge.
      is_correct: false
      id: b
    - letter: C
      text: It deletes 90% of model weights automatically.
      is_correct: false
      id: c
    - letter: D
      text: It only runs on weekends.
      is_correct: false
