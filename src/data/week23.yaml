    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: |-
      # Solution for Task: Token Counter
      import tiktoken
      from typing import Dict

      def calculate_token_costs(text: str, model_name: str = "gpt-4o") -> Dict:
          """Calculate exact token count and estimated cost for user prompts."""
          encoding = tiktoken.get_encoding("cl100k_base")
          tokens = len(encoding.encode(text))
          cost_usd = (tokens / 1_000_000) * 2.50
      return {"model": model_name, "token_count": tokens, "cost_usd": cost_usd}

      text_corpus = "Enterprise MLOps deployment requires continuous experiment tracking, data versioning with DVC, and model registry management in MLflow."
      cost_info = calculate_token_costs(text_corpus)
      print(f"Tokens: {cost_info['token_count']} | Estimated API Cost: ${cost_info['cost_usd']:.8f}")
      assert cost_info is not None, "cost_info should not be None"
    solution_lang: python
