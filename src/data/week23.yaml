    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Invoke a live SageMaker real-time endpoint with JSON serialization and latency timer.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> json\n<span class=\"kw\">import</span> time\n\n<span class=\"kw\">class</span> <span class=\"cls\">MockBoto3SageMakerRuntime</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">invoke_endpoint</span>(<span class=\"kw\">self</span>, EndpointName: str, ContentType: str, Body: str):\n        time.<span class=\"fn\">sleep</span>(<span class=\"num\">0.02</span>)\n        payload = json.<span class=\"fn\">loads</span>(Body)\n    \
      \    <span class=\"cm\"># Mock inference calculation</span>\n        score = <span class=\"fn\">sum</span>(payload.<span class=\"fn\">get</span>(<span class=\"str\">\"features\", [0.5])) / max(1, len(payload.get(\"features\"</span>, [<span class=\"num\">1</span>])))\n<span class=\"kw\">return</span> {<span class=\"str\">\"Body\": json.dumps({\"prediction\": round(score, 4), \"endpoint\"</span>: EndpointName})}\n\nclient = <span class=\"fn\">MockBoto3SageMakerRuntime</span>()\nt0 = time.<span class=\"fn\">perf_counter</span>()\nres = client.<span class=\"fn\">invoke_endpoint</span>(\n    EndpointName=<span class=\"str\">\"fraud-detection-endpoint-prod\"</span>,\n    ContentType=<span class=\"str\">\"application/json\"</span>,\n    Body=json.<span class=\"fn\">dumps</span>({<span class=\"str\">\"features\"</span>: [<span class=\"num\">0.88</span>, <span class=\"num\">0.12</span>, <span class=\"num\">0.94</span>, <span class=\"num\">0.45</span>]})\n)\nlatency = (time.<span class=\"fn\"\
      >perf_counter</span>() - t0) * <span class=\"num\">1000</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"SageMaker Response in {latency:.2f}ms - {res['</span>Body<span class=\"str\">']}\"</span>)</pre>\n</div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono); font-size:12px;\">\n<strong>\n         Expected Verification Output:\n        </strong>\n<br/>\n\n         SageMaker Response in 20.xxms - {\"prediction\": 0.5975, \"endpoint\": \"fraud-detection-endpoint-prod\"}\n        \n</div>"
