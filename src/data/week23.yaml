      \ class=\"num\">42</span>):\n    <span class=\"kw\">import</span> random\n \
      \   random.<span class=\"fn\">seed</span>(random_seed)\n    sampled = random.<span\
      \ class=\"fn\">randint</span>(<span class=\"num\">1</span>, <span class=\"num\"\
      >100</span>)\n    routed = <span class=\"str\">\"Model B (Canary)\" if sampled\
      \ else \"Model A (Baseline)\"</span>\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Traffic Split ({model_a_pct}/{model_b_pct}) - Sample {sampled}\
      \ routed to: {routed}\"</span>)\n<span class=\"kw\">return</span> routed\n\n\
      <span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n\
      \    <span class=\"kw\">assert</span> <span class=\"str\">\"Model\"</span> <span\
      \ class=\"kw\">in</span> <span class=\"fn\">traffic_split_router</span>()"
