    correct_fb: ✅ Correct! MME allows hosting thousands of models on a single endpoint fleet, loading models from S3 into
      memory on demand.
    wrong_fb: ❌ Incorrect. MME pools instance compute across many models, eliminating the need to provision dedicated endpoints
      for low-traffic models.
    correct: a
  flashcards:
  - front: SageMaker Training Job?
    back: Ephemeral compute that runs your training script, saves model to S3, then shuts down. You only pay for training
      duration.
  - front: 'Core concept: What is the significance of ml.g4dn.xlarge in AWS SageMaker — Training & Endpoints?'
    back: Entry-level AWS GPU instance with 1x NVIDIA T4 (16GB VRAM). Good for inference of 7B models.
  - front: SageMaker vs EC2?
    back: SageMaker is managed; EC2 is a raw VM. Relative cost depends on region, instance, utilization, storage, and operational
      overhead—compare current pricing before choosing.
  - front: How is AWS SageMaker — Training & Endpoints tested and validated in industrial ML pipelines (Day 164)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.allclose at 1e-5), and unit
      tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling AWS SageMaker — Training & Endpoints in distributed
      systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: SageMaker Spot Instance SIGTERM Handling'
    description: When AWS reclaims a spot instance during SageMaker Managed Spot Training, it sends a SIGTERM signal exactly
      2 minutes before termination. Your training loop must catch SIGTERM and flush model checkpoints to S3 immediately.
  takeaways:
    hinglish_line: |-
      <strong>
              Ek line mein:
             </strong>
