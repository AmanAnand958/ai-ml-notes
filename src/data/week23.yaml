  - title: 'Task 1: Custom Training Script'
    badge: MEDIUM
    badge_class: tb-med
    time: 45 mins
    prompt_html: |-
      <p><strong>Scenario:</strong> You are setting up a cost-effective, automated deep learning training and real-time inference architecture on AWS SageMaker for an e-commerce recommendation model.</p>
      <p><strong>Requirements:</strong></p>
      <ul>
        <li>Configure a <strong>SageMaker PyTorch Estimator</strong> with Managed Spot Training (spot_instance=True) and automated S3 checkpoint saving.</li>
        <li>Deploy a <strong>Real-Time SageMaker Endpoint</strong> with multi-model hosting (MME) and target-tracking auto-scaling policies.</li>
        <li>Catch SIGTERM signals in training loops to guarantee zero loss of model weights upon spot instance reclamation.</li>
      </ul>
    done_when: 'Your Task 1: Custom Training Script implementation runs without errors. All assertions in the solution pass.
      You can explain the core algorithm and its time complexity.'
    git_cmd: 'git add . && git commit -m "feat(day164): task-1-custom-training-script"'
    sol_id: sol-w23d164t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: |-
      # Solution for Task: Custom Training Script
      from typing import Dict

      class SageMakerPyTorchEstimator:
          def __init__(self, entry_point: str, instance_type: str, hyperparameters: Dict):
              self.entry_point = entry_point
              self.instance_type = instance_type
              self.hyperparameters = hyperparameters

      def fit(self, inputs: str):
              print(f"[SageMaker] Launching training job on instance {self.instance_type}...")
              print(f"[SageMaker] Executing script: {self.entry_point} with params: {self.hyperparameters}")
              print("[SageMaker] Job Completed. Model Artifacts saved to s3://my-bucket/output/model.tar.gz")

      estimator = SageMakerPyTorchEstimator(
          entry_point="train_lora.py",
          instance_type="ml.p3.2xlarge",
          hyperparameters={"epochs": 5, "batch_size": 32, "lr": 2e-4}
      )
      estimator.fit("s3://my-bucket/training-data/")
      assert hyperparameters is not None, "hyperparameters should not be None"
    solution_lang: python
