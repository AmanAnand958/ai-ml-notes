    options:
    - letter: A
      text: To eliminate cross-region data transfer fees and minimize cold-start latency
        when downloading weights to inference instances.
      is_correct: true
    - letter: B
      text: Because AWS prohibits cross-region S3 transfers.
      is_correct: false
    - letter: C
      text: To make the files publicly readable.
      is_correct: false
    - letter: D
      text: Because model weights lose accuracy across regions.
      is_correct: false
    correct_fb: ✅ Correct! Co-locating S3 buckets with compute clusters provides maximum
      network throughput and zero cross-region transfer egress costs.
    wrong_fb: ❌ Incorrect. Regional co-location minimizes container initialization
      latency and eliminates inter-region bandwidth costs.
  - num_str: QUESTION 2 OF 4
    question: What S3 storage class is best suited for storing active model checkpoints
      during training vs historical backups?
    qid: q165_2
    options:
    - letter: A
      text: S3 Standard for active high-throughput training/inference; S3 Glacier
        / S3 One Zone-IA for archived model version snapshots.
      is_correct: true
    - letter: B
      text: S3 Glacier Deep Archive for live inference.
      is_correct: false
    - letter: C
      text: S3 Standard for everything forever.
      is_correct: false
    - letter: D
      text: Local floppy disks.
      is_correct: false
