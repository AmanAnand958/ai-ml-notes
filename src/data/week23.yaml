  hinglish: SageMaker machine learning lifecycle ko automate karta hai. Estimator ephemeral GPU instances spin-up karta hai, model train hone ke baad S3 mein artifact save karta hai aur instance shut down kar deta hai taaki idle compute cost na lage.
  analogy: 'AWS SageMaker is like an industrial smart factory: you provide the production blueprint (training script) and raw materials (S3 data), the factory automatically commissions the specialized machinery (GPU cluster), manufactures the goods (model binary), and packs down the line.'
  theory_html: "<h2 class=\"sh2\">\U0001F9E0 Theory &amp; Concepts</h2>\n<div style=\"margin: 1.5rem 0; text-align: center;\">\n<svg aria-label=\"AWS SageMaker Training and Real-Time Inference Architecture\" height=\"260\" style=\"max-width: 100%; height: auto; font-family: var(--font-mono, monospace);\" viewbox=\"0 0 700 260\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#09090b\" height=\"240\" rx=\"10\" stroke=\"#f59e0b\" stroke-width=\"2\" width=\"680\" x=\"10\" y=\"10\"></rect>\n<text fill=\"#fbbf24\" font-size=\"13\" font-weight=\"bold\" x=\"25\" y=\"35\">AWS SageMaker End-to-End Enterprise Architecture</text>\n<!-- Training Tier -->\n<rect fill=\"#18181b\" height=\"170\" rx=\"8\" stroke=\"#3f3f46\" width=\"200\" x=\"30\" y=\"60\"></rect>\n<text fill=\"#f59e0b\" font-size=\"11\" font-weight=\"bold\" x=\"45\" y=\"85\">1. Ephemeral Training</text>\n<rect fill=\"#27272a\" height=\"35\" rx=\"4\" stroke=\"#f59e0b\" width=\"180\" x=\"40\" y=\"100\"></rect>\n<text fill=\"\
    #fbbf24\" font-size=\"10\" x=\"50\" y=\"122\">EC2 GPU (ml.g5.12xlarge)</text>\n<text fill=\"#94a3b8\" font-size=\"9.5\" x=\"50\" y=\"155\">• Pulls Dataset from S3</text>\n<text fill=\"#94a3b8\" font-size=\"9.5\" x=\"50\" y=\"175\">• Executes PyTorch / ECR</text>\n<text fill=\"#ef4444\" font-size=\"9.5\" x=\"50\" y=\"195\">• Auto-Terminates on Finish</text>\n<path d=\"M 230 145 L 270 145\" stroke=\"#f59e0b\" stroke-width=\"2\"></path>\n<!-- Model Registry Tier -->\n<rect fill=\"#18181b\" height=\"170\" rx=\"8\" stroke=\"#38bdf8\" width=\"180\" x=\"270\" y=\"60\"></rect>\n<text fill=\"#38bdf8\" font-size=\"11\" font-weight=\"bold\" x=\"285\" y=\"85\">2. Model Registry</text>\n<rect fill=\"#0284c7\" height=\"35\" rx=\"4\" width=\"160\" x=\"280\" y=\"100\"></rect>\n<text fill=\"#ffffff\" font-size=\"10\" font-weight=\"bold\" x=\"290\" y=\"122\">Model Version Catalog</text>\n<text fill=\"#94a3b8\" font-size=\"9.5\" x=\"290\" y=\"155\">• S3 Artifact Lineage</text>\n<text fill=\"#94a3b8\" font-size=\"\
    9.5\" x=\"290\" y=\"175\">• Approval Gate @champion</text>\n<text fill=\"#94a3b8\" font-size=\"9.5\" x=\"290\" y=\"195\">• Metadata / Metrics Log</text>\n<path d=\"M 450 145 L 490 145\" stroke=\"#38bdf8\" stroke-width=\"2\"></path>\n<!-- Serving Tier -->\n<rect fill=\"#18181b\" height=\"170\" rx=\"8\" stroke=\"#10b981\" width=\"180\" x=\"490\" y=\"60\"></rect>\n<text fill=\"#10b981\" font-size=\"11\" font-weight=\"bold\" x=\"505\" y=\"85\">3. Multi-Model Endpoint</text>\n<rect fill=\"#065f46\" height=\"35\" rx=\"4\" width=\"160\" x=\"500\" y=\"100\"></rect>\n<text fill=\"#ffffff\" font-size=\"10\" font-weight=\"bold\" x=\"510\" y=\"122\">ALB + Auto-Scaling</text>\n<text fill=\"#94a3b8\" font-size=\"9.5\" x=\"510\" y=\"155\">• GPU Memory Pooling</text>\n<text fill=\"#94a3b8\" font-size=\"9.5\" x=\"510\" y=\"175\">• Dynamic Model Loading</text>\n<text fill=\"#10b981\" font-size=\"9.5\" x=\"510\" y=\"195\">• &lt;15ms p99 Latency</text>\n</svg>\n<div class=\"diagram-cap\">Figure 164.1: AWS\
    \ SageMaker Lifecycle: Ephemeral GPU Training $\\to$ Model Registry Lineage $\\to$ Multi-Model Endpoint Serving.</div>\n</div>\n<h3 class=\"sh3\">1. AWS SageMaker Architecture: Training Jobs &amp; Real-Time Endpoints</h3>\n<p>\nAWS SageMaker decouples ML model development into distinct infrastructure tiers:\n</p>\n<ol>\n<li><strong>SageMaker Training Jobs:</strong> Ephemeral EC2 GPU instances (e.g. <code>ml.g5.12xlarge</code>) that pull training data from S3, execute the training script inside an ECR Docker image, save weights to S3, and terminate immediately to eliminate idle costs.</li>\n<li><strong>SageMaker Model Registry:</strong> Versioned model catalog tracking lineage, accuracy metrics, and deployment approvals.</li>\n<li><strong>Real-Time Multi-Model Endpoints (MME):</strong> Dynamically loads multiple models into GPU memory on demand behind a single load-balanced endpoint.</li>\n</ol>\n<h3 class=\"sh3\">2. Production Python Implementation: SageMaker Inference Handler</h3>\n\
    <div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre><code class=\"language-html\"><span class=\"kw\">import</span> json\n<span class=\"kw\">import</span> torch\n<span class=\"kw\">from</span> transformers <span class=\"kw\">import</span> AutoTokenizer, AutoModelForCausalLM\n\n<span class=\"kw\">def</span> <span class=\"fn\">model_fn</span>(model_dir: str):\n    <span class=\"str\">\"\"\"Loads model weights into GPU VRAM upon SageMaker container startup.\"\"\"</span>\n    tokenizer = AutoTokenizer.from_pretrained(model_dir)\n    model = AutoModelForCausalLM.from_pretrained(\n        model_dir,\n        torch_dtype=torch.float16,\n        device_map=<span class=\"str\">\"auto\"</span>\n    )\n    <span class=\"kw\">return</span> {<span class=\"str\">\"model\"</span>: model, <span class=\"str\">\"tokenizer\"</span>: tokenizer}\n\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">transform_fn</span>(model_dict, data: bytes, content_type: str, accept: str):\n    <span class=\"str\">\"\"\"Executes real-time inference request and returns JSON response.\"\"\"</span>\n    payload = json.loads(data.decode(<span class=\"str\">\"utf-8\"</span>))\n    prompt = payload.get(<span class=\"str\">\"inputs\"</span>, <span class=\"str\">\"\"</span>)\n    \n    tokenizer = model_dict[<span class=\"str\">\"tokenizer\"</span>]\n    model = model_dict[<span class=\"str\">\"model\"</span>]\n    \n    inputs = tokenizer(prompt, return_tensors=<span class=\"str\">\"pt\"</span>).to(model.device)\n    <span class=\"kw\">with</span> torch.no_grad():\n        outputs = model.generate(**inputs, max_new_tokens=<span class=\"num\">128</span>)\n    \n    generated_text = tokenizer.decode(outputs[<span class=\"num\">0</span>], skip_special_tokens=<span class=\"kw\">True</span>)\n    <span class=\"kw\">return</span> json.dumps({<span class=\"str\">\"generated_text\"</span>:\
    \ generated_text}), accept</code></pre>\n</div>\n<h3 class=\"sh3\">Engineering Decision Matrix: General Production Trade-offs</h3>\n<div style=\"overflow-x:auto;\">\n<table style=\"width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px; text-align:left;\">\n<thead>\n<tr style=\"border-bottom:2px solid var(--border); background:var(--bg-secondary);\">\n<th style=\"padding:10px;\">Architecture Strategy</th>\n<th style=\"padding:10px;\">Upfront Cost</th>\n<th style=\"padding:10px;\">Maintenance</th>\n<th style=\"padding:10px;\">Scalability</th>\n<th style=\"padding:10px;\">Time-to-Market</th>\n</tr>\n</thead>\n<tbody>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Monolithic MVP</strong></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span></td>\n<td style=\"padding:10px;\"\
    ><span style=\"color:var(--green);\">Low</span> (Initially)</td>\n<td style=\"padding:10px;\">Poor</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Fast</span> (&lt; 1 week)</td>\n</tr>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Microservices</strong></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--orange);\">High</span></td>\n<td style=\"padding:10px;\"><span style=\"color:var(--orange);\">High</span></td>\n<td style=\"padding:10px;\">Excellent</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--red);\">Slow</span> (Months)</td>\n</tr>\n<tr onmouseout=\"this.style.background='transparent'\" onmouseover=\"this.style.background='var(--bg-secondary)'\" style=\"border-bottom:1px solid var(--border); transition: background 0.2s;\">\n<td style=\"padding:10px;\"><strong>Serverless\
    \ Functions</strong></td>\n<td style=\"padding:10px;\">Medium</td>\n<td style=\"padding:10px;\"><span style=\"color:var(--green);\">Low</span></td>\n<td style=\"padding:10px;\">Infinite</td>\n<td style=\"padding:10px;\">Medium</td>\n</tr>\n</tbody>\n</table>\n</div>\n<h3 class=\"sh3\">Mathematical Formulation &amp; Performance Bounds</h3>\n<div class=\"math-block\">\n$$ \\text{TCO} = \\text{ComputeHours} \\times \\text{InstanceRate} + \\text{StorageGB} \\times \\text{StorageRate} + \\text{DataEgress} $$\n<p class=\"math-caption\">Total Cost of Ownership (TCO) calculation for cloud-managed ML infrastructure.</p>\n</div>\n<p>\nThis optimization metric balances raw computational throughput against per-token GPU memory consumption and cluster financial cost.\n</p>\n<h3 class=\"sh3\">Production Engineering Walkthrough: AWS SageMaker — Training &amp; Endpoints</h3>\n<p>\nThe following production snippet demonstrates the foundational design pattern, error handling strategies, and telemetry\
    \ hooks required when deploying <strong>AWS SageMaker — Training &amp; Endpoints</strong> in high-throughput enterprise systems:\n</p>\n<div class=\"cb\">\n<div class=\"cb-head\"><span class=\"cb-lang\">python — production_sagemaker_handler.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n<pre>\nimport sys\nfrom unittest.mock import MagicMock\nsys.modules[\"torch\"] = MagicMock()\nsys.modules[\"torch.nn\"] = MagicMock()\nsys.modules[\"torch.nn.functional\"] = MagicMock()\nsys.modules[\"torch.utils\"] = MagicMock()\nsys.modules[\"torch.utils.data\"] = MagicMock()\n\n# Day 164 — Production SageMaker Inference Handler\nimport json, logging, time, os\nimport torch\nfrom typing import Dict, Any\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"SageMakerHandler\")\n\ndef model_fn(model_dir: str):\n    \"\"\"Load model artifacts from /opt/ml/model — called\
    \ ONCE at container startup.\"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model_path = os.path.join(model_dir, \"model.pt\")\n    # Load tokenizer and model (replace with your actual architecture)\n    from transformers import AutoModelForSequenceClassification, AutoTokenizer\n    tokenizer = AutoTokenizer.from_pretrained(model_dir)\n    model = AutoModelForSequenceClassification.from_pretrained(model_dir)\n    model.to(device).eval()\n    logger.info(f\"Model loaded from {model_dir} on {device}\")\n    return {\"model\": model, \"tokenizer\": tokenizer, \"device\": device}\n\ndef input_fn(request_body: str, content_type: str = \"application/json\") -&gt; Dict:\n    \"\"\"Deserialize request body — called per request.\"\"\"\n    if content_type != \"application/json\":\n        raise ValueError(f\"Unsupported content_type: {content_type}\")\n    data = json.loads(request_body)\n    if \"inputs\" not in data:\n        raise ValueError(\"Request\
    \ JSON must contain 'inputs' key\")\n    return data\n\ndef predict_fn(data: Dict, model_artifacts: Dict) -&gt; Dict:\n    \"\"\"Run inference — called per request.\"\"\"\n    t0 = time.perf_counter()\n    model = model_artifacts[\"model\"]\n    tokenizer = model_artifacts[\"tokenizer\"]\n    device = model_artifacts[\"device\"]\n    inputs = tokenizer(data[\"inputs\"], return_tensors=\"pt\", truncation=True,\n                        max_length=512, padding=True).to(device)\n    with torch.no_grad():\n        outputs = model(**inputs)\n    probs = torch.softmax(outputs.logits, dim=-1).cpu().tolist()\n    latency_ms = (time.perf_counter() - t0) * 1000\n    logger.info(f\"Inference: {latency_ms:.2f}ms, batch={len(data['inputs']) if isinstance(data['inputs'], list) else 1}\")\n    return {\"probabilities\": probs, \"latency_ms\": round(latency_ms, 2)}\n\ndef output_fn(prediction: Dict, accept: str = \"application/json\") -&gt; str:\n    \"\"\"Serialize prediction — called per request.\"\
    \"\"\n    if accept != \"application/json\":\n        raise ValueError(f\"Unsupported accept type: {accept}\")\n    return json.dumps(prediction)\n\nif __name__ == \"__main__\":\n    print(\"SageMaker Handler: model_fn → input_fn → predict_fn → output_fn\")\n    # Smoke test input/output serialisation\n    body = json.dumps({\"inputs\": \"SageMaker makes ML deployment straightforward\"})\n    parsed = input_fn(body)\n    print(f\"Parsed: {parsed}\")\n    fake_pred = {\"probabilities\": [[0.12, 0.88]], \"latency_ms\": 3.5}\n    out = output_fn(fake_pred)\n    print(f\"Serialised: {out}\")\n    assert \"probabilities\" in json.loads(out)\n    print(\"SageMakerHandler: OK\")\n</pre>\n</div>\n<h3 class=\"sh3\">AWS SageMaker Control Plane vs Data Plane Architecture</h3>\n<p>\nSageMaker strictly separates management from computation:\n- <strong>Control Plane:</strong> Manages endpoint configurations, auto-scaling policies, and IAM execution roles.\n- <strong>Data Plane:</strong> High-performance\
    \ NVMe-backed EC2 instances running Triton / TorchServe containers inside isolated VPC security groups.\n</p>\n"
