  flashcards:
  - front: t-SNE vs PCA?
    back: PCA is linear (preserves global structure); t-SNE is non-linear (preserves
      local neighborhoods/clusters).
  - front: Perplexity?
    back: Hyperparameter in t-SNE determining the number of effective nearest neighbors
      to consider.
  - front: t-SNE Crowding Problem?
    back: Points cluster too closely in 2D space. Solved by Student-t distribution
      heavy tails.
