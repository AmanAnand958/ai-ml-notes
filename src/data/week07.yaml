    10\" font-weight=\"700\" text-anchor=\"middle\" x=\"305\" y=\"82\">\n        MARGIN\n\
    \       </text>\n<g class=\"hov\" opacity=\"0.9\">\n<circle cx=\"120\" cy=\"90\"\
