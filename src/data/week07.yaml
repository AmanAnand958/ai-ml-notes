  flashcards:
  - front: Isolation Forest?
    back: Tree-based anomaly detection that isolates anomalies by randomly partitioning
      feature values.
  - front: Why Isolation works?
    back: Anomalies require fewer random splits to isolate, resulting in shorter path
      lengths in the trees.
  - front: Contamination?
    back: Hyperparameter defining the expected proportion of outliers in the dataset.
  gotcha:
    title: '⚠️ Gotcha: Learning Rate & Optimizer Overshooting'
    description: Too high learning rate leads to exploding loss (`NaN`). If loss explodes,
      reduce LR by 10x immediately.
