    >0</span>,<span class=\"num\">1</span>].<span class=\"fn\">round</span>(<span\
    \ class=\"num\">3</span>))\n\n<span class=\"cm\"># ── 5. Handle Class Imbalance\
    \ (27% churn — moderate imbalance) ─</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"\\nClass imbalance: use class_weight='</span>balanced<span class=\"\
