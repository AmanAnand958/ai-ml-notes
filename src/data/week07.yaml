    \         Class +1 sample point\n        </title>\n</g>\n<g class=\"hov\" opacity=\"\
    0.9\">\n<circle cx=\"500\" cy=\"140\" fill=\"#4fd1a5\" r=\"7\">\n</circle>\n<title>\n\
    \         Class +1 sample point\n        </title>\n</g>\n<g class=\"hov\" opacity=\"\
    0.9\">\n<circle cx=\"420\" cy=\"180\" fill=\"#4fd1a5\" r=\"7\">\n</circle>\n<title>\n\
    \         Class +1 sample point\n        </title>\n</g>\n<g class=\"hov\" opacity=\"\
    0.9\">\n<circle cx=\"480\" cy=\"230\" fill=\"#4fd1a5\" r=\"7\">\n</circle>\n<title>\n\
    \         Class +1 sample point\n        </title>\n</g>\n<g class=\"hov\" opacity=\"\
    0.9\">\n<circle cx=\"530\" cy=\"110\" fill=\"#4fd1a5\" r=\"7\">\n</circle>\n<title>\n\
    \         Class +1 sample point\n        </title>\n</g>\n<g class=\"hov\" opacity=\"\
    0.9\">\n<circle cx=\"450\" cy=\"260\" fill=\"#4fd1a5\" r=\"7\">\n</circle>\n<title>\n\
    \         Class +1 sample point\n        </title>\n</g>\n<g class=\"hov2\">\n\
    <circle cx=\"265\" cy=\"150\" fill=\"#e56b8c\" r=\"8\" stroke=\"#f5d76e\" stroke-width=\"\
    2.5\">\n</circle>\n<title>\n         Support vector (Class −1) — sits exactly\
    \ on the margin\n        </title>\n</g>\n<g class=\"hov2\">\n<circle cx=\"345\"\
    \ cy=\"140\" fill=\"#4fd1a5\" r=\"8\" stroke=\"#f5d76e\" stroke-width=\"2.5\"\
    >\n</circle>\n<title>\n         Support vector (Class +1) — sits exactly on the\
    \ margin\n        </title>\n</g>\n<text fill=\"var(--text2)\" font-family=\"DM\
    \ Sans,sans-serif\" font-size=\"10.5\" font-weight=\"400\" text-anchor=\"left\"\
    \ x=\"72\" y=\"340\">\n        maximise 2/‖w‖  ↔  minimise ½‖w‖²   ·   Support\
    \ vectors = the points ON the margin\n       </text>\n</svg>\n<div class=\"mermaid\"\
    >\ngraph TD\n  ClassA[\"Class -1 support vectors\"] --- MarginA[\"Margin Boundary\"\
    ]\n  MarginA --- DB[\"Decision Boundary: w.x + b = 0\"]\n  DB --- MarginB[\"Margin\
    \ Boundary\"]\n  MarginB --- ClassB[\"Class +1 support vectors\"]\n</div>\n<div\
    \ class=\"diagram-cap\">\n       SVM maximises the margin — the \"road width\"\
    \ between classes\n      </div>\n<h3 class=\"sh3\">\n       2. Soft-Margin SVM\
    \ — The C Parameter\n      </h3>\n<p>\n       Real data is never perfectly separable.\n\
    \       <strong>\n        Soft-margin SVM\n       </strong>\n       allows some\
    \ misclassifications by introducing\n       <em>\n        slack variables\n  \
    \     </em>\n       ξᵢ. The C parameter controls the tradeoff:\n      </p>\n<div\
    \ class=\"concept-table\" style=\"margin:1rem 0\">\n<div class=\"table-wrap\"\
    \ style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\"\
    >\n<tr>\n<th>\n          C VALUE\n         </th>\n<th>\n          EFFECT\n   \
    \      </th>\n<th>\n          BIAS-VARIANCE\n         </th>\n<th>\n          WHEN\
    \ TO USE\n         </th>\n</tr>\n<tr>\n<td>\n<strong>\n           High C (e.g.\
    \ 100)\n          </strong>\n</td>\n<td>\n          Penalises misclassifications\
    \ heavily → narrow margin, tries to classify all training points correctly\n \
    \        </td>\n<td>\n          Low Bias, High Variance (overfits)\n         </td>\n\
    <td>\n          Clean data, small noise\n         </td>\n</tr>\n<tr>\n<td>\n<strong>\n\
    \           Low C (e.g. 0.01)\n          </strong>\n</td>\n<td>\n          Allows\
    \ more misclassifications → wider margin, more regularised model\n         </td>\n\
    <td>\n          High Bias, Low Variance (underfits)\n         </td>\n<td>\n  \
    \        Noisy data, overlapping classes\n         </td>\n</tr>\n<tr>\n<td>\n\
    <strong>\n           C=1 (default)\n          </strong>\n</td>\n<td>\n       \
    \   Balanced tradeoff\n         </td>\n<td>\n          Middle ground\n       \
    \  </td>\n<td>\n          Good starting point\n         </td>\n</tr>\n</table></div>\n\
    </div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n\
    \         python — svm_classifier.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"run-btn\" onclick=\"openRepl()\">\n          ▶ try online\n\
    \         </button>\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">from</span> sklearn.datasets <span class=\"kw\">import</span>\
    \ make_classification\n<span class=\"kw\">from</span> sklearn.svm <span class=\"\
    kw\">import</span> SVC\n<span class=\"kw\">from</span> sklearn.model_selection\
    \ <span class=\"kw\">import</span> train_test_split\n<span class=\"kw\">from</span>\
    \ sklearn.metrics <span class=\"kw\">import</span> classification_report\n\n<span\
    \ class=\"cm\"># 1. Generate Non-linearly separable dataset</span>\nX, y = <span\
    \ class=\"fn\">make_classification</span>(n_samples=<span class=\"num\">500</span>,\
    \ n_features=<span class=\"num\">2</span>, n_redundant=<span class=\"num\">0</span>,\
    \ n_informative=<span class=\"num\">2</span>,\n                           n_clusters_per_class=<span\
    \ class=\"num\">2</span>, random_state=<span class=\"num\">42</span>)\nX_train,\
    \ X_test, y_train, y_test = <span class=\"fn\">train_test_split</span>(X, y, test_size=<span\
    \ class=\"num\">0.25</span>, random_state=<span class=\"num\">42</span>)\n\n<span\
    \ class=\"cm\"># 2. Compare Linear vs RBF Kernel SVM</span>\nkernels = [<span\
    \ class=\"str\">'linear'</span>, <span class=\"str\">'rbf'</span>]\n<span class=\"\
    kw\">for</span> k <span class=\"kw\">in</span> kernels:\n    clf = <span class=\"\
    fn\">SVC</span>(kernel=k, C=<span class=\"num\">1.0</span>, gamma=<span class=\"\
    str\">'scale'</span>, random_state=<span class=\"num\">42</span>)\n    clf.<span\
    \ class=\"fn\">fit</span>(X_train, y_train)\n    acc = clf.<span class=\"fn\"\
    >score</span>(X_test, y_test)\n    <span class=\"fn\">print</span>(<span class=\"\
    str\">f\"SVM (Kernel={k.upper()}): Test Accuracy = {acc:.4f}, Support Vectors\
    \ = {len(clf.support_)}\"</span>)</pre>\n</div>\n<h3 class=\"sh3\">\n       3.\
    \ The Kernel Trick — SVM's Superpower\n      </h3>\n<svg aria-label=\"Kernel trick:\
    \ concentric circle data not linearly separable in 2D is lifted by phi into 3D\
    \ where a plane separates it\" height=\"360\" role=\"img\" viewbox=\"0 0 700 360\"\
    \ width=\"700\" xmlns=\"http://www.w3.org/2000/svg\">\n<style>\n        svg .w7t{font-family:DM\
    \ Sans,sans-serif} svg .w7m{font-family:IBM Plex Mono,monospace}\n       </style>\n\
    <defs>\n<lineargradient id=\"w7-bg_s\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n\
    <stop offset=\"0%\" stop-color=\"#1a1e2e\">\n</stop>\n<stop offset=\"100%\" stop-color=\"\
    var(--bg)\">\n</stop>\n</lineargradient>\n</defs>\n<rect fill=\"url(#w7-bg_s)\"\
    \ height=\"360\" rx=\"12\" width=\"700\">\n</rect>\n<text class=\"w7t\" fill=\"\
    #e6edf3\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" x=\"350\"\
    \ y=\"26\">\n        The Kernel Trick — lift data where a line can't work, into\
    \ a space where a plane can\n       </text>\n<text class=\"w7t\" fill=\"#e56b8c\"\
    \ font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"160\" y=\"\
    50\">\n        INPUT SPACE (2D)\n       </text>\n<text class=\"w7m\" fill=\"var(--text2)\"\
    \ font-size=\"10\" text-anchor=\"middle\" x=\"160\" y=\"66\">\n        no straight\
    \ line separates them\n       </text>\n<text class=\"w7t\" fill=\"#4fd1a5\" font-size=\"\
    11.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"530\" y=\"50\">\n      \
    \  FEATURE SPACE (3D)\n       </text>\n<text class=\"w7m\" fill=\"var(--text2)\"\
    \ font-size=\"10\" text-anchor=\"middle\" x=\"530\" y=\"66\">\n        Φ(x) =\
    \ (x₁, x₂, x₁²+x₂²)\n       </text>\n<ellipse cx=\"160\" cy=\"215\" fill=\"none\"\
    \ rx=\"98\" ry=\"98\" stroke=\"#e56b8c\" stroke-width=\"1.8\">\n</ellipse>\n<ellipse\
    \ cx=\"160\" cy=\"215\" fill=\"none\" rx=\"55\" ry=\"55\" stroke=\"#4fd1a5\" stroke-width=\"\
