  hinglish: Gradient Boosting (XGBoost/LightGBM) sequential weak trees train karta
    hai jahan har naya decision tree pichhle trees ke pseudo-residuals (errors) par
    fit hota hai gradient descent ke through.
  analogy: Ek school mein 3 teachers hain. Pehla teacher basics padhata hai lekin
    kuch students ke marks galat hote hain. Doosra teacher sirf woh topics cover karta
    hai jahan pehle teacher galat tha. Teesra teacher phir bache hue mistakes fix
    karta hai. Final score = teeno teachers ka combined prediction. Yahi gradient
    boosting hai — har tree pichhle trees ki mistakes fix karta hai.
  theory_html: "<h3 class=\"sh3\">\n       1. Gradient Boosting — Learning from Mistakes\n\
    \      </h3>\n\n<div class=\"math-block\">\n<span class=\"formula\">\n       \
    \ $$F₀(x) = argmin_γ Σ L(yᵢ, γ)  (initial prediction: usually mean of y)$$\n \
    \      </span>\n<span class=\"desc\">\n        Step 1: Start with a constant prediction.\n\
    \       </span>\n<span class=\"formula\">\n        $$rᵢₘ = −[∂L(yᵢ, F(xᵢ)) / ∂F(xᵢ)]\
    \  (pseudo-residuals)$$\n       </span>\n<span class=\"desc\">\n        Step 2:\
    \ Compute \"pseudo-residuals\" — the negative gradient of loss w.r.t. predictions.\n\
    \       </span>\n<span class=\"formula\">\n        $$Fₘ(x) = Fₘ₋₁(x) + η · hₘ(x)$$\n\
    \       </span>\n<span class=\"desc\">\n        Step 3: Fit tree hₘ to pseudo-residuals.\
    \ Add to ensemble scaled by learning_rate η. Repeat M times.\n       </span>\n\
    </div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n\
    \         python — xgboost_full_guide.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"run-btn\" onclick=\"openRepl()\">\n          ▶ try online\n\
    \         </button>\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span\
    \ class=\"kw\">import</span> xgboost <span class=\"kw\">as</span> xgb\n<span class=\"\
    kw\">from</span> sklearn.datasets <span class=\"kw\">import</span> load_breast_cancer\n\
    <span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span>\
    \ train_test_split, RandomizedSearchCV\n<span class=\"kw\">from</span> sklearn.metrics\
    \ <span class=\"kw\">import</span> classification_report, roc_auc_score\n<span\
    \ class=\"kw\">from</span> sklearn.ensemble <span class=\"kw\">import</span> GradientBoostingClassifier\
    \  <span class=\"cm\"># sklearn version</span>\n\ndata = <span class=\"fn\">load_breast_cancer</span>()\n\
    X, y = data.data, data.target\nX_tr, X_te, y_tr, y_te = <span class=\"fn\">train_test_split</span>(X,\
    \ y, test_size=<span class=\"num\">0.2</span>, random_state=<span class=\"num\"\
    >42</span>)\nX_tr2, X_val, y_tr2, y_val = <span class=\"fn\">train_test_split</span>(X_tr,\
    \ y_tr, test_size=<span class=\"num\">0.15</span>, random_state=<span class=\"\
    num\">42</span>)\n\n<span class=\"cm\"># ── 1. sklearn GradientBoosting (understand\
    \ the concept) ─────</span>\ngb = <span class=\"fn\">GradientBoostingClassifier</span>(n_estimators=<span\
    \ class=\"num\">100</span>, learning_rate=<span class=\"num\">0.1</span>,\n  \
    \                               max_depth=<span class=\"num\">3</span>, random_state=<span\
    \ class=\"num\">42</span>)\ngb.<span class=\"fn\">fit</span>(X_tr, y_tr)\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"sklearn GradBoost accuracy:\
    \ {gb.score(X_te, y_te):.4f}\"</span>)\n\n<span class=\"cm\"># ── 2. XGBoost with\
    \ Early Stopping ───────────────────────────</span>\n<span class=\"cm\"># early_stopping_rounds:\
    \ stop if val metric doesn't improve for N rounds</span>\n<span class=\"cm\">#\
    \ This prevents overfitting WITHOUT manual n_estimators tuning!</span>\ndtrain\
    \ = xgb.<span class=\"fn\">DMatrix</span>(X_tr2, label=y_tr2)\ndval   = xgb.<span\
    \ class=\"fn\">DMatrix</span>(X_val, label=y_val)\ndtest  = xgb.<span class=\"\
    fn\">DMatrix</span>(X_te,  label=y_te)\n\nparams = {\n    <span class=\"str\"\
    >'objective'</span>: <span class=\"str\">'binary:logistic'</span>,\n    <span\
    \ class=\"str\">'eval_metric'</span>: <span class=\"str\">'auc'</span>,\n    <span\
    \ class=\"str\">'max_depth'</span>: <span class=\"num\">4</span>,\n    <span class=\"\
    str\">'learning_rate'</span>: <span class=\"num\">0.05</span>,    <span class=\"\
    cm\"># lower = more trees needed, but more robust</span>\n    <span class=\"str\"\
    >'subsample'</span>: <span class=\"num\">0.8</span>,           <span class=\"\
    cm\"># use 80% of rows per tree (reduces variance)</span>\n    <span class=\"\
    str\">'colsample_bytree'</span>: <span class=\"num\">0.8</span>,   <span class=\"\
    cm\"># use 80% of features per tree (like RF)</span>\n    <span class=\"str\"\
    >'min_child_weight'</span>: <span class=\"num\">1</span>,\n    <span class=\"\
    str\">'seed'</span>: <span class=\"num\">42</span>\n}\n\nevals_result = {}\nmodel\
    \ = xgb.<span class=\"fn\">train</span>(\n    params,\n    dtrain,\n    num_boost_round=<span\
    \ class=\"num\">1000</span>,          <span class=\"cm\"># max trees — early stopping\
    \ will cut this</span>\n    evals=[(dtrain, <span class=\"str\">'train'</span>),\
    \ (dval, <span class=\"str\">'val'</span>)],\n    early_stopping_rounds=<span\
    \ class=\"num\">30</span>,      <span class=\"cm\"># stop if val AUC doesn't improve\
    \ for 30 rounds</span>\n    evals_result=evals_result,\n    verbose_eval=<span\
    \ class=\"num\">44</span>\n)\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"\\nBest iteration: {model.best_iteration}\"</span>)\n\ny_prob = model.<span\
    \ class=\"fn\">predict</span>(dtest)\ny_pred = (y_prob &gt; <span class=\"num\"\
    >0.5</span>).<span class=\"fn\">astype</span>(int)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"XGBoost ROC-AUC: {roc_auc_score(y_te, y_prob):.4f}\"</span>)\n\
    <span class=\"fn\">print</span>(<span class=\"fn\">classification_report</span>(y_te,\
    \ y_pred, target_names=data.target_names))\n\n<span class=\"cm\"># ── 3. Feature\
    \ Importance (3 types in XGBoost) ───────────────</span>\nimp_types = [<span class=\"\
    str\">'weight'</span>, <span class=\"str\">'gain'</span>, <span class=\"str\"\
    >'cover'</span>]\n<span class=\"fn\">print</span>(<span class=\"str\">\"\\nFeature\
    \ Importance Comparison:\"</span>)\n<span class=\"kw\">for</span> imp_type <span\
    \ class=\"kw\">in</span> imp_types:\n    scores = model.<span class=\"fn\">get_score</span>(importance_type=imp_type)\n\
    \    top3 = <span class=\"fn\">sorted</span>(scores.<span class=\"fn\">items</span>(),\
    \ key=<span class=\"kw\">lambda</span> x: -x[<span class=\"num\">1</span>])[:<span\
    \ class=\"num\">3</span>]\n    <span class=\"fn\">print</span>(<span class=\"\
    str\">f\"  {imp_type:7s}: {top3}\"</span>)\n<span class=\"cm\"># 'gain' is most\
    \ informative (total gain from splits) — use this for feature selection</span></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       2. XGBoost Hyperparameter Cheat Sheet\n   \
    \   </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem\
    \ 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         PARAMETER\n\
    \        </th>\n<th>\n         WHAT IT CONTROLS\n        </th>\n<th>\n       \
    \  TUNING DIRECTION\n        </th>\n</tr>\n<tr>\n<td>\n\n          n_estimators\n\
    \         \n</td>\n<td>\n         Number of trees. Use early_stopping instead.\n\
    \        </td>\n<td>\n         Start high (1000), use early stopping\n       \
    \ </td>\n</tr>\n<tr>\n<td>\n\n          learning_rate\n         \n</td>\n<td>\n\
    \         Shrinkage of each tree's contribution. Lower = more trees needed but\
    \ better generalisation.\n        </td>\n<td>\n         0.01–0.3. Lower + more\
    \ trees often wins.\n        </td>\n</tr>\n<tr>\n<td>\n\n          max_depth\n\
    \         \n</td>\n<td>\n         Max depth of each tree. Deeper = more complex,\
    \ more overfit.\n        </td>\n<td>\n         3–8. Start at 4–6.\n        </td>\n\
    </tr>\n<tr>\n<td>\n\n          subsample\n         \n</td>\n<td>\n         Fraction\
    \ of rows per tree (stochastic gradient boosting).\n        </td>\n<td>\n    \
    \     0.6–0.9 reduces variance\n        </td>\n</tr>\n<tr>\n<td>\n\n         \
    \ colsample_bytree\n         \n</td>\n<td>\n         Fraction of features per\
    \ tree (like RF's max_features).\n        </td>\n<td>\n         0.5–0.9\n    \
    \    </td>\n</tr>\n<tr>\n<td>\n\n          reg_alpha / reg_lambda\n         \n\
    </td>\n<td>\n         L1/L2 regularization on leaf weights.\n        </td>\n<td>\n\
    \         Increase if overfitting\n        </td>\n</tr>\n<tr>\n<td>\n\n      \
    \    min_child_weight\n         \n</td>\n<td>\n         Minimum sum of instance\
    \ weights in a child. Higher = more conservative.\n        </td>\n<td>\n     \
    \    1–10\n        </td>\n</tr>\n</table></div>\n<!-- /theory -->"
