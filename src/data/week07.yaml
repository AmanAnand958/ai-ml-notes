    qid: q48_1
    options:
    - letter: A
      text: RF uses decision trees; Gradient Boosting uses linear models
      is_correct: false
    - letter: B
      text: RF trains trees in parallel independently; Gradient Boosting trains trees
        sequentially, each correcting previous errors
      is_correct: true
    - letter: C
      text: Gradient Boosting always outperforms Random Forest
      is_correct: false
    - letter: D
      text: RF is for regression only; GBM is for classification only
      is_correct: false
    correct_fb: ✅ Correct! RF = parallel ensemble (bagging, reduces variance). GBM
      = sequential ensemble (boosting, reduces both bias and variance). GBM is typically
      more accurate but more sensitive to hyperparameters and prone to overfitting
      if not tuned carefully. RF is more robust out of the box.
    wrong_fb: ❌ Both use decision trees (shallow ones in GBM). GBM doesn't always
      win — RF is often better on noisy data. The key difference is parallel vs sequential
      training. RF trees are independent; GBM trees each learn from the previous tree's
      residuals.
