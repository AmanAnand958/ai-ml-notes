    >1</span>].<span class=\"fn\">set_title</span>(<span class=\"str\">'Correlation\
    \ Matrix'</span>)\n\n<span class=\"cm\"># Stacked bar: churn by tech support</span>\n\
    pivot = df.<span class=\"fn\">groupby</span>([<span class=\"str\">'TechSupport'</span>,<span\
    \ class=\"str\">'Churn'</span>]).<span class=\"fn\">size</span>().<span class=\"\
    fn\">unstack</span>(fill_value=<span class=\"num\">0</span>)\npivot.<span class=\"\
    fn\">plot</span>(kind=<span class=\"str\">'bar'</span>, ax=axes[<span class=\"\
    num\">1</span>,<span class=\"num\">2</span>], color=[<span class=\"str\">'#4fd1a5'</span>,<span\
    \ class=\"str\">'#e56b8c'</span>], alpha=<span class=\"num\">0.8</span>)\naxes[<span\
    \ class=\"num\">1</span>,<span class=\"num\">2</span>].<span class=\"fn\">set_title</span>(<span\
    \ class=\"str\">'Churn by Tech Support'</span>)\n\nplt.<span class=\"fn\">tight_layout</span>()\n\
    plt.<span class=\"fn\">savefig</span>(<span class=\"str\">'churn_eda.png'</span>,\
    \ dpi=<span class=\"num\">150</span>)\nplt.<span class=\"fn\">show</span>()\n\n\
    <span class=\"cm\"># ── 4. Feature Engineering ────────────────────────────────────</span>\n\
    <span class=\"cm\"># 1. Charges per month of service</span>\ndf[<span class=\"\
    str\">'AvgMonthlySpend'</span>] = df[<span class=\"str\">'TotalCharges'</span>]\
    \ / (df[<span class=\"str\">'tenure'</span>] + <span class=\"num\">1</span>)\n\
    \n<span class=\"cm\"># 2. Service count (number of add-ons subscribed)</span>\n\
    service_cols = [<span class=\"str\">'PhoneService'</span>, <span class=\"str\"\
    >'InternetService'</span>, <span class=\"str\">'OnlineSecurity'</span>,\n    \
    \            <span class=\"str\">'OnlineBackup'</span>, <span class=\"str\">'DeviceProtection'</span>,\
    \ <span class=\"str\">'TechSupport'</span>,\n                <span class=\"str\"\
    >'StreamingTV'</span>, <span class=\"str\">'StreamingMovies'</span>]\ndf[<span\
    \ class=\"str\">'ServiceCount'</span>] = df[service_cols].<span class=\"fn\">apply</span>(\n\
    \    <span class=\"kw\">lambda</span> row: (row == <span class=\"str\">'Yes'</span>).<span\
    \ class=\"fn\">sum</span>(), axis=<span class=\"num\">1</span>)\n\n<span class=\"\
    cm\"># 3. Has_No_OnlineSecurity (churn risk indicator)</span>\ndf[<span class=\"\
    str\">'NoSecurity'</span>] = (df[<span class=\"str\">'OnlineSecurity'</span>]\
    \ == <span class=\"str\">'No'</span>).<span class=\"fn\">astype</span>(int)\n\n\
    <span class=\"cm\"># 4. Tenure bucket (loyalty tier)</span>\ndf[<span class=\"\
    str\">'TenureBucket'</span>] = pd.<span class=\"fn\">cut</span>(df[<span class=\"\
    str\">'tenure'</span>],\n    bins=[<span class=\"num\">0</span>,<span class=\"\
    num\">12</span>,<span class=\"num\">24</span>,<span class=\"num\">44</span>,<span\
    \ class=\"num\">72</span>],\n    labels=[<span class=\"str\">'New'</span>,<span\
    \ class=\"str\">'Growing'</span>,<span class=\"str\">'Loyal'</span>,<span class=\"\
    str\">'Champion'</span>])\n\n<span class=\"cm\"># 5. Month-to-month flag (highest\
    \ churn risk contract)</span>\ndf[<span class=\"str\">'IsMonthToMonth'</span>]\
    \ = (df[<span class=\"str\">'Contract'</span>] == <span class=\"str\">'Month-to-month'</span>).<span\
    \ class=\"fn\">astype</span>(int)\n\n<span class=\"fn\">print</span>(<span class=\"\
    str\">\"\\nNew features added. Shape:\"</span>, df.shape)\n<span class=\"fn\"\
    >print</span>(<span class=\"str\">\"AvgMonthlySpend correlation with Churn:\"\
