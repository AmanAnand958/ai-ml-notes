    text: Pass daily interactive quiz and review active recall flashcards
  concept_flow:
  - Support Vector Machines (
  - Decision Trees — Gini, En
  - Random Forests — Bagging
  - Gradient Boosting + XGBoo
  - Customer Churn Project —
  - Customer Churn — Modeling
  - Customer Churn — Flask AP
  hinglish: 'SHAP values model ko explain karte hain: har feature ne is specific prediction
    mein kitna contribute kiya. Global interpretability ke liye bar plots, local ke
    liye waterfall plots!'
  analogy: A classification pipeline is like a mail sorting center. Letters (raw features)
    are scanned, stamped (preprocessed), and sorted into bins (classification categories)
    on a single automated conveyor belt.
  theory_html: "<h2 class=\"sh2\">\n       \U0001F680 Deployment Pipeline\n      </h2>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — save_model.py\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\"\
    >import</span> joblib\n\n<span class=\"cm\"># Save the complete pipeline (preprocessing\
    \ + model)</span>\njoblib.<span class=\"fn\">dump</span>(best_pipe, <span class=\"\
    str\">'churn_pipeline.pkl'</span>)\n<span class=\"fn\">print</span>(<span class=\"\
    str\">\"Model saved as churn_pipeline.pkl\"</span>)\n\n<span class=\"cm\"># Load\
    \ and verify</span>\nloaded_pipe = joblib.<span class=\"fn\">load</span>(<span\
    \ class=\"str\">'churn_pipeline.pkl'</span>)\ntest_acc = loaded_pipe.<span class=\"\
    fn\">score</span>(X_te, y_te)\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"Loaded model test accuracy: {test_acc:.4f}\"</span>)</pre>\n</div>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — app.py (Flask API)\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\"\
    >from</span> flask <span class=\"kw\">import</span> Flask, request, jsonify\n\
    <span class=\"kw\">import</span> joblib\n<span class=\"kw\">import</span> pandas\
    \ <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span\
    \ class=\"kw\">as</span> np\n\napp = <span class=\"fn\">Flask</span>(__name__)\n\
    model = joblib.<span class=\"fn\">load</span>(<span class=\"str\">'churn_pipeline.pkl'</span>)\n\
    \n@app.<span class=\"fn\">route</span>(<span class=\"str\">'/'</span>)\n<span\
    \ class=\"kw\">def</span> <span class=\"fn\">home</span>():\n    <span class=\"\
    kw\">return</span> <span class=\"fn\">jsonify</span>({\n        <span class=\"\
    str\">'service'</span>: <span class=\"str\">'Customer Churn Predictor API'</span>,\n\
    \        <span class=\"str\">'version'</span>: <span class=\"str\">'1.0'</span>,\n\
    \        <span class=\"str\">'endpoints'</span>: [<span class=\"str\">'/predict'</span>,\
    \ <span class=\"str\">'/health'</span>]\n    })\n\n@app.<span class=\"fn\">route</span>(<span\
    \ class=\"str\">'/health'</span>)\n<span class=\"kw\">def</span> <span class=\"\
    fn\">health</span>():\n    <span class=\"kw\">return</span> <span class=\"fn\"\
    >jsonify</span>({<span class=\"str\">'status'</span>: <span class=\"str\">'healthy'</span>})\n\
    \n@app.<span class=\"fn\">route</span>(<span class=\"str\">'/predict'</span>,\
    \ methods=[<span class=\"str\">'POST'</span>])\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">predict</span>():\n    <span class=\"str\">\"\"\"\\n    POST\
    \ /predict\\n    Body: JSON with customer features\\n    Returns: { \"churn_probability\"\
    : 0.78, \"prediction\": \"WILL_CHURN\",\\n                \"risk_level\": \"HIGH\"\
    , \"top_reasons\": [...] }\\n    \"\"\"</span>\n    <span class=\"kw\">try</span>:\n\
    \        data = request.<span class=\"fn\">get_json</span>(force=<span class=\"\
    kw\">True</span>)\n        <span class=\"kw\">if</span> <span class=\"kw\">not</span>\
    \ data:\n            <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span\
    \ class=\"str\">'error'</span>: <span class=\"str\">'No JSON data provided'</span>}),\
    \ <span class=\"num\">400</span>\n\n        <span class=\"cm\"># Convert to DataFrame\
    \ (feature engineering applied inside pipeline)</span>\n        df_input = pd.<span\
    \ class=\"fn\">DataFrame</span>([data])\n\n        <span class=\"cm\"># Apply\
    \ same feature engineering as training</span>\n        df_input[<span class=\"\
    str\">'TotalCharges'</span>] = pd.<span class=\"fn\">to_numeric</span>(df_input[<span\
    \ class=\"str\">'TotalCharges'</span>], errors=<span class=\"str\">'coerce'</span>).<span\
    \ class=\"fn\">fillna</span>(<span class=\"num\">0</span>)\n        df_input[<span\
    \ class=\"str\">'AvgMonthlySpend'</span>] = df_input[<span class=\"str\">'TotalCharges'</span>]\
    \ / (df_input[<span class=\"str\">'tenure'</span>] + <span class=\"num\">1</span>)\n\
    \        service_cols = [<span class=\"str\">'PhoneService'</span>,<span class=\"\
    str\">'OnlineSecurity'</span>,<span class=\"str\">'OnlineBackup'</span>,\n   \
    \                     <span class=\"str\">'DeviceProtection'</span>,<span class=\"\
    str\">'TechSupport'</span>,<span class=\"str\">'StreamingTV'</span>,<span class=\"\
    str\">'StreamingMovies'</span>]\n        df_input[<span class=\"str\">'ServiceCount'</span>]\
    \ = df_input[service_cols].<span class=\"fn\">apply</span>(\n            <span\
    \ class=\"kw\">lambda</span> r: (r == <span class=\"str\">'Yes'</span>).<span\
    \ class=\"fn\">sum</span>(), axis=<span class=\"num\">1</span>)\n        df_input[<span\
    \ class=\"str\">'NoSecurity'</span>] = (df_input[<span class=\"str\">'OnlineSecurity'</span>]\
    \ == <span class=\"str\">'No'</span>).<span class=\"fn\">astype</span>(int)\n\
    \        df_input[<span class=\"str\">'TenureBucket'</span>] = pd.<span class=\"\
    fn\">cut</span>(df_input[<span class=\"str\">'tenure'</span>],\n            bins=[<span\
    \ class=\"num\">0</span>,<span class=\"num\">12</span>,<span class=\"num\">24</span>,<span\
    \ class=\"num\">44</span>,<span class=\"num\">72</span>], labels=[<span class=\"\
    str\">'New'</span>,<span class=\"str\">'Growing'</span>,<span class=\"str\">'Loyal'</span>,<span\
    \ class=\"str\">'Champion'</span>])\n        df_input[<span class=\"str\">'IsMonthToMonth'</span>]\
    \ = (df_input[<span class=\"str\">'Contract'</span>] == <span class=\"str\">'Month-to-month'</span>).<span\
    \ class=\"fn\">astype</span>(int)\n\n        <span class=\"cm\"># Predict</span>\n\
    \        churn_prob = model.<span class=\"fn\">predict_proba</span>(df_input)[<span\
    \ class=\"num\">0</span>, <span class=\"num\">1</span>]\n        prediction =\
    \ <span class=\"str\">'WILL_CHURN'</span> <span class=\"kw\">if</span> churn_prob\
    \ &gt; <span class=\"num\">0.5</span> <span class=\"kw\">else</span> <span class=\"\
    str\">'WILL_STAY'</span>\n\n        <span class=\"kw\">if</span> churn_prob &gt;\
    \ <span class=\"num\">0.75</span>: risk = <span class=\"str\">'HIGH'</span>\n\
    <span class=\"cm\"># elif churn_prob &gt; 0.5: risk = 'MEDIUM'</span>\n      \
    \  <span class=\"kw\">else</span>: risk = <span class=\"str\">'LOW'</span>\n\n\
    \        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({\n\
    \            <span class=\"str\">'churn_probability'</span>: <span class=\"fn\"\
    >round</span>(<span class=\"fn\">float</span>(churn_prob), <span class=\"num\"\
    >4</span>),\n            <span class=\"str\">'prediction'</span>: prediction,\n\
    \            <span class=\"str\">'risk_level'</span>: risk,\n            <span\
    \ class=\"str\">'recommendation'</span>: <span class=\"str\">'Offer retention\
    \ discount immediately'</span> <span class=\"kw\">if</span> risk == <span class=\"\
    str\">'HIGH'</span> <span class=\"kw\">else</span> <span class=\"str\">'Monitor\
    \ customer activity'</span>\n        })\n\n    <span class=\"kw\">except</span>\
    \ Exception <span class=\"kw\">as</span> e:\n        <span class=\"kw\">return</span>\
    \ <span class=\"fn\">jsonify</span>({<span class=\"str\">'error'</span>: <span\
    \ class=\"fn\">str</span>(e)}), <span class=\"num\">500</span>\n\n<span class=\"\
    kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n    app.<span\
    \ class=\"fn\">run</span>(debug=<span class=\"kw\">True</span>, port=<span class=\"\
    num\">5000</span>)</pre>\n</div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n\
    <span class=\"cb-lang\">\n         bash — test the API\n        </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"cm\"># Start the Flask server: python app.py</span>\n\n<span\
    \ class=\"cm\"># Test with curl</span>\ncurl -X POST http://localhost:<span class=\"\
    num\">5000</span>/predict \\\n  -H <span class=\"str\">\"Content-Type: application/json\"\
    </span> \\\n  -d <span class=\"str\">'{\\n    \"tenure\": 2,\\n    \"MonthlyCharges\"\
    : 89.5,\\n    \"TotalCharges\": \"179.0\",\\n    \"Contract\": \"Month-to-month\"\
    ,\\n    \"InternetService\": \"Fiber optic\",\\n    \"OnlineSecurity\": \"No\"\
    ,\\n    \"TechSupport\": \"No\",\\n    \"PaymentMethod\": \"Electronic check\"\
    ,\\n    \"gender\": \"Male\",\\n    \"SeniorCitizen\": 0,\\n    \"Partner\": \"\
    No\",\\n    \"Dependents\": \"No\",\\n    \"PhoneService\": \"Yes\",\\n    \"\
    PaperlessBilling\": \"Yes\"\\n  }'</span>\n<span class=\"cm\"># Expected: {\"\
    churn_probability\": 0.85+, \"prediction\": \"WILL_CHURN\", \"risk_level\": \"\
