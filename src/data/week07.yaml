    bullets:
    - "<strong>\n           SVM:\n          </strong>\n          Maximum margin hyperplane.\
      \ C controls regularization. Kernel trick for non-linearity. Always scale."
    - "<strong>\n           Decision Trees:\n          </strong>\n          Recursive\
      \ Gini/Entropy splits. Easily overfit — control with max_depth + min_samples_leaf."
    - "<strong>\n           Random Forests:\n          </strong>\n          Bootstrap\
      \ + feature randomness → decorrelated trees → lower variance. OOB = free validation."
    - "<strong>\n           XGBoost:\n          </strong>\n          Sequential boosting,\
      \ corrects residuals. Use early stopping. learning_rate × n_estimators = accuracy."
    - "<strong>\n           Production:\n          </strong>\n          sklearn Pipeline\
