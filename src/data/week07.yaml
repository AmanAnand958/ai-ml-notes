      5 outputs?
    answer: (10, 5)
    explanation: In PyTorch Linear(10, 5), the weight tensor stores (out_features,
      in_features) = (5, 10), multiplying input of shape (B, 10).
    code: "import numpy as np\ndef layer_shape(in_f=10, out_f=5):\n    return (in_f,\
      \ out_f)\n\nif __name__ == \"__main__\":\n    assert layer_shape(10, 5) == (10,\
      \ 5)"
