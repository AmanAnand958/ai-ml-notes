  theory_html: "<h2 class=\"sh2\">\n       \U0001F6E0 Modeling + SHAP\n      </h2>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — churn_modeling_shap.py\n        </span>\n<div class=\"cb-btns\">\n\
    <button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n     \
    \    </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left:\
    \ 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"\
    kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\"\
    >import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span>\
    \ shap\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\"\
    >as</span> plt\n<span class=\"kw\">from</span> sklearn.pipeline <span class=\"\
    kw\">import</span> Pipeline\n<span class=\"kw\">from</span> sklearn.compose <span\
    \ class=\"kw\">import</span> ColumnTransformer\n<span class=\"kw\">from</span>\
    \ sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler, OneHotEncoder,\
    \ LabelEncoder\n<span class=\"kw\">from</span> sklearn.impute <span class=\"kw\"\
    >import</span> SimpleImputer\n<span class=\"kw\">from</span> sklearn.model_selection\
    \ <span class=\"kw\">import</span> train_test_split, StratifiedKFold, cross_validate\n\
    <span class=\"kw\">from</span> sklearn.linear_model <span class=\"kw\">import</span>\
    \ LogisticRegression\n<span class=\"kw\">from</span> sklearn.ensemble <span class=\"\
    kw\">import</span> RandomForestClassifier, GradientBoostingClassifier\n<span class=\"\
    kw\">from</span> sklearn.svm <span class=\"kw\">import</span> SVC\n<span class=\"\
    kw\">from</span> xgboost <span class=\"kw\">import</span> XGBClassifier\n<span\
    \ class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> (classification_report,\
    \ roc_auc_score,\n                               precision_recall_curve, RocCurveDisplay)\n\
    \n<span class=\"cm\"># ── Assume df is loaded from Day 49 (with engineered features)\
    \ ─</span>\n<span class=\"cm\"># df = pd.read_csv(...) + feature engineering code\
    \ from Day 49</span>\n\n<span class=\"cm\"># ── Preprocessing Pipeline ────────────────────────────────────</span>\n\
    numeric_features = [<span class=\"str\">'tenure'</span>, <span class=\"str\">'MonthlyCharges'</span>,\
    \ <span class=\"str\">'TotalCharges'</span>,\n                    <span class=\"\
    str\">'AvgMonthlySpend'</span>, <span class=\"str\">'ServiceCount'</span>]\ncategorical_features\
    \ = [<span class=\"str\">'gender'</span>, <span class=\"str\">'Partner'</span>,\
    \ <span class=\"str\">'Dependents'</span>, <span class=\"str\">'Contract'</span>,\n\
    \                         <span class=\"str\">'PaymentMethod'</span>, <span class=\"\
    str\">'InternetService'</span>, <span class=\"str\">'TenureBucket'</span>]\nbinary_features\
    \ = [<span class=\"str\">'SeniorCitizen'</span>, <span class=\"str\">'PhoneService'</span>,\
    \ <span class=\"str\">'PaperlessBilling'</span>,\n                   <span class=\"\
    str\">'NoSecurity'</span>, <span class=\"str\">'IsMonthToMonth'</span>]\n\nnum_pipe\
    \ = <span class=\"fn\">Pipeline</span>([\n    (<span class=\"str\">'imputer'</span>,\
    \ <span class=\"fn\">SimpleImputer</span>(strategy=<span class=\"str\">'median'</span>)),\n\
    \    (<span class=\"str\">'scaler'</span>, <span class=\"fn\">StandardScaler</span>())\n\
    ])\ncat_pipe = <span class=\"fn\">Pipeline</span>([\n    (<span class=\"str\"\
    >'imputer'</span>, <span class=\"fn\">SimpleImputer</span>(strategy=<span class=\"\
    str\">'most_frequent'</span>)),\n    (<span class=\"str\">'encoder'</span>, <span\
    \ class=\"fn\">OneHotEncoder</span>(handle_unknown=<span class=\"str\">'ignore'</span>,\
    \ sparse_output=<span class=\"kw\">False</span>))\n])\npreprocessor = <span class=\"\
    fn\">ColumnTransformer</span>([\n    (<span class=\"str\">'num'</span>, num_pipe,\
    \ numeric_features),\n    (<span class=\"str\">'cat'</span>, cat_pipe, categorical_features),\n\
    \    (<span class=\"str\">'bin'</span>, <span class=\"str\">'passthrough'</span>,\
    \ binary_features)\n])\n\nX = df.<span class=\"fn\">drop</span>(<span class=\"\
    str\">'Churn'</span>, axis=<span class=\"num\">1</span>)\ny = df[<span class=\"\
    str\">'Churn'</span>]\nX_tr, X_te, y_tr, y_te = <span class=\"fn\">train_test_split</span>(X,\
    \ y, test_size=<span class=\"num\">0.2</span>,\n                             \
    \               random_state=<span class=\"num\">42</span>, stratify=y)\n\n<span\
    \ class=\"cm\"># ── Model Comparison ──────────────────────────────────────────</span>\n\
    models = {\n    <span class=\"str\">'Logistic Regression'</span>: <span class=\"\
    fn\">LogisticRegression</span>(class_weight=<span class=\"str\">'balanced'</span>,\
    \ max_iter=<span class=\"num\">500</span>),\n    <span class=\"str\">'Random Forest'</span>\
    \      : <span class=\"fn\">RandomForestClassifier</span>(n_estimators=<span class=\"\
    num\">200</span>, class_weight=<span class=\"str\">'balanced'</span>, random_state=<span\
    \ class=\"num\">42</span>),\n    <span class=\"str\">'Gradient Boosting'</span>\
    \  : <span class=\"fn\">GradientBoostingClassifier</span>(n_estimators=<span class=\"\
    num\">200</span>, learning_rate=<span class=\"num\">0.1</span>, random_state=<span\
    \ class=\"num\">42</span>),\n    <span class=\"str\">'XGBoost'</span>        \
    \    : <span class=\"fn\">XGBClassifier</span>(n_estimators=<span class=\"num\"\
    >200</span>, scale_pos_weight=<span class=\"num\">3</span>, eval_metric=<span\
    \ class=\"str\">'logloss'</span>, random_state=<span class=\"num\">42</span>),\n\
    \    <span class=\"str\">'SVM'</span>                : <span class=\"fn\">SVC</span>(kernel=<span\
    \ class=\"str\">'rbf'</span>, C=<span class=\"num\">1</span>, class_weight=<span\
    \ class=\"str\">'balanced'</span>, probability=<span class=\"kw\">True</span>),\n\
    }\n\ncv = <span class=\"fn\">StratifiedKFold</span>(n_splits=<span class=\"num\"\
    >5</span>, shuffle=<span class=\"kw\">True</span>, random_state=<span class=\"\
    num\">42</span>)\nresults = []\n<span class=\"kw\">for</span> name, clf <span\
    \ class=\"kw\">in</span> models.<span class=\"fn\">items</span>():\n    pipe =\
    \ <span class=\"fn\">Pipeline</span>([(<span class=\"str\">'prep'</span>, preprocessor),\
    \ (<span class=\"str\">'clf'</span>, clf)])\n    scores = <span class=\"fn\">cross_validate</span>(pipe,\
    \ X_tr, y_tr, cv=cv,\n                            scoring=[<span class=\"str\"\
    >'accuracy'</span>,<span class=\"str\">'precision'</span>,<span class=\"str\"\
    >'recall'</span>,<span class=\"str\">'f1'</span>,<span class=\"str\">'roc_auc'</span>],\n\
    \                            return_train_score=<span class=\"kw\">False</span>)\n\
    \    results.<span class=\"fn\">append</span>({\n        <span class=\"str\">'Model'</span>\
    \      : name,\n        <span class=\"str\">'Accuracy'</span>   : scores[<span\
    \ class=\"str\">'test_accuracy'</span>].<span class=\"fn\">mean</span>().<span\
    \ class=\"fn\">round</span>(<span class=\"num\">3</span>),\n        <span class=\"\
    str\">'Precision'</span>  : scores[<span class=\"str\">'test_precision'</span>].<span\
    \ class=\"fn\">mean</span>().<span class=\"fn\">round</span>(<span class=\"num\"\
    >3</span>),\n        <span class=\"str\">'Recall'</span>     : scores[<span class=\"\
    str\">'test_recall'</span>].<span class=\"fn\">mean</span>().<span class=\"fn\"\
    >round</span>(<span class=\"num\">3</span>),\n        <span class=\"str\">'F1'</span>\
    \         : scores[<span class=\"str\">'test_f1'</span>].<span class=\"fn\">mean</span>().<span\
    \ class=\"fn\">round</span>(<span class=\"num\">3</span>),\n        <span class=\"\
    str\">'ROC-AUC'</span>    : scores[<span class=\"str\">'test_roc_auc'</span>].<span\
    \ class=\"fn\">mean</span>().<span class=\"fn\">round</span>(<span class=\"num\"\
    >3</span>),\n    })\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"\
    ✓ {name} done\"</span>)\n\nresults_df = pd.<span class=\"fn\">DataFrame</span>(results).<span\
    \ class=\"fn\">sort_values</span>(<span class=\"str\">'ROC-AUC'</span>, ascending=<span\
    \ class=\"kw\">False</span>)\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >\"\\n\"</span> + results_df.<span class=\"fn\">to_string</span>(index=<span class=\"\
    kw\">False</span>))\n\n<span class=\"cm\"># ── SHAP — Model Explainability ───────────────────────────────</span>\n\
    <span class=\"cm\"># pip install shap</span>\n<span class=\"cm\"># SHAP = SHapley\
    \ Additive exPlanations: game-theory-based feature importance</span>\n\n<span\
    \ class=\"cm\"># Train best model (assume XGBoost or RF won) on preprocessed data</span>\n\
    best_pipe = <span class=\"fn\">Pipeline</span>([(<span class=\"str\">'prep'</span>,\
    \ preprocessor),\n                       (<span class=\"str\">'clf'</span>, <span\
    \ class=\"fn\">XGBClassifier</span>(n_estimators=<span class=\"num\">200</span>,\
    \ scale_pos_weight=<span class=\"num\">3</span>,\n                           \
    \                   eval_metric=<span class=\"str\">'logloss'</span>, random_state=<span\
    \ class=\"num\">42</span>))])\nbest_pipe.<span class=\"fn\">fit</span>(X_tr, y_tr)\n\
    \n<span class=\"cm\"># Get preprocessed feature names for SHAP</span>\nX_te_prep\
    \ = best_pipe.named_steps[<span class=\"str\">'prep'</span>].<span class=\"fn\"\
    >transform</span>(X_te)\nxgb_model = best_pipe.named_steps[<span class=\"str\"\
    >'clf'</span>]\n\n<span class=\"cm\"># TreeExplainer — fast for tree models</span>\n\
    explainer = shap.<span class=\"fn\">TreeExplainer</span>(xgb_model)\nshap_values\
    \ = explainer.<span class=\"fn\">shap_values</span>(X_te_prep)\n\n<span class=\"\
    cm\"># Global: which features matter most across ALL predictions?</span>\nshap.<span\
    \ class=\"fn\">summary_plot</span>(shap_values, X_te_prep, show=<span class=\"\
    kw\">True</span>)\n\n<span class=\"cm\"># Local: WHY did the model predict THIS\
    \ customer will churn?</span>\ncustomer_idx = <span class=\"num\">5</span>  <span\
    \ class=\"cm\"># pick a predicted churner</span>\nshap.<span class=\"fn\">waterfall_plot</span>(shap.<span\
    \ class=\"fn\">Explanation</span>(\n    values=shap_values[customer_idx],\n  \
    \  base_values=explainer.expected_value,\n    data=X_te_prep[customer_idx]\n))</pre>\n\
    </div>"
  predict:
