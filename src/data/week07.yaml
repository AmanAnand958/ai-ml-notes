- id: '47'
  day_num: 47
  title: Random Forests — Bagging + Feature Randomness
  subtitle: 'One tree overfits badly. A hundred trees — each trained on a different
    random sample of data and features — vote together and almost always win. This
    is Random Forest: the most reliable general-purpose ML algorithm ever built.'
  time_estimate: 5 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Explain Bootstrap Aggregating (Bagging) with a concrete example
  - Explain why combining many weak learners reduces variance without increasing bias
  - Tune n_estimators, max_features, max_depth, and min_samples_leaf for Random Forest
  - Use Out-of-Bag (OOB) error as a free validation estimate
  - Extract and interpret feature importances from a Random Forest
  checklist:
  - id: chk_47_1
    text: 'Master core theory: Explain Bootstrap Aggregating (Bagging) with a concrete
      example'
  - id: chk_47_2
