  quizzes:
  - num_str: Q1 OF 5
    question: You train an SVM on a dataset and get 99% training accuracy but 65%
      test accuracy. What should you try?
    qid: q45_1
    options:
    - letter: A
      text: Increase C to make the margin harder
      is_correct: false
    - letter: B
      text: Decrease C to allow a wider, more regularised margin
      is_correct: true
    - letter: C
      text: Switch to a linear kernel — it's simpler and won't overfit
      is_correct: false
    - letter: D
      text: Remove scaling — SVM doesn't need it
      is_correct: false
    correct_fb: ✅ Correct! High train / low test accuracy = overfitting. Decreasing
      C widens the margin (more regularization), trading some training accuracy for
      better generalisation. The kernel choice and scaling are separate issues.
    wrong_fb: ❌ Think about what 99% train and 65% test means — the model memorised
      the training data. C controls how strictly we penalise misclassifications. Increasing
      C will make it even more strict. You need to go the other direction.
  - num_str: Q2 OF 5
    question: Which SVM kernel is most appropriate for classifying 10,000-dimensional
      text data (e.g. TF-IDF features)?
    qid: q45_2
    options:
    - letter: A
      text: RBF — it always works best
      is_correct: false
    - letter: B
      text: Linear — efficient and effective in high-dimensional sparse spaces
      is_correct: true
    - letter: C
      text: Polynomial degree=5 — more expressive for complex text
      is_correct: false
    - letter: D
      text: Sigmoid — text is inherently sigmoidal
      is_correct: false
    correct_fb: ✅ Correct! In high-dimensional, sparse feature spaces (like TF-IDF),
      linear kernels work extremely well and are computationally far cheaper. RBF
      can actually perform worse here because with many dimensions, distance-based
      calculations become less meaningful (curse of dimensionality).
    wrong_fb: ❌ For high-dimensional sparse text data (TF-IDF), linear kernels are
      the industry standard. Liblinear-based SVMs are trained on millions of text
      documents this way. RBF can work but is expensive and often unnecessary in high-dim
      spaces.
  - num_str: Q3 OF 5
    question: What are "support vectors"?
    qid: q45_3
    options:
    - letter: A
      text: All training points used to train the SVM
      is_correct: false
    - letter: B
      text: The features selected by SVM for classification
      is_correct: false
    - letter: C
      text: The training points closest to the decision boundary that define the margin
      is_correct: true
    - letter: D
      text: The vectors representing the weights of the linear model
      is_correct: false
    correct_fb: ✅ Correct! Support vectors are the critical training points — the
      ones sitting on the margin boundaries (yᵢ(w·xᵢ + b) = 1). They are the only
      points that matter for defining the decision boundary. Remove all other points
      and you get the same model. This is why SVM is memory-efficient in inference.
    wrong_fb: ❌ Support vectors are NOT all training points. They are specifically
      the closest points to the decision boundary — the ones that "support" the margin.
      This is also why SVM can be slow to train (must solve QP over all n), but fast
      at inference (only n_sv support vectors matter).
  - num_str: QUESTION 4 OF 5
    question: What is a Support Vector in SVM?
    qid: q45_4
    options:
    - letter: A
      text: All the data points in the training set
      is_correct: false
    - letter: B
      text: The data points closest to the decision boundary that define the margin
      is_correct: true
    - letter: C
      text: The vector of feature weights learned by the model
      is_correct: false
    - letter: D
      text: The average of all training samples
      is_correct: false
    correct_fb: ✅ Correct! Support vectors are the data points closest to the decision
      boundary. They define the margin and dictate the orientation of the separating
      hyperplane.
    wrong_fb: ❌ Incorrect. Support vectors are specifically the data points lying
      on the margin boundaries. They are the only points that determine the SVM decision
      boundary.
  - num_str: QUESTION 5 OF 5
    question: The RBF kernel has a parameter gamma. If gamma is very large, what happens?
    qid: q45_5
    options:
    - letter: A
      text: The decision boundary becomes smoother and more generalized
      is_correct: false
    - letter: B
      text: Each support vector has influence only in a tiny radius, causing overfitting
      is_correct: true
    - letter: C
      text: Training time decreases significantly
      is_correct: false
    - letter: D
      text: The kernel becomes equivalent to a linear kernel
      is_correct: false
    correct_fb: ✅ Correct! A large gamma value means the similarity radius of support
      vectors is small. This causes the model to fit tightly around individual points,
      leading to high variance (overfitting).
    wrong_fb: ❌ Incorrect. Gamma defines how far the influence of a single training
      example reaches. A large gamma restricts influence to a small radius, leading
      to overfitting.
  flashcards:
  - front: K-Means Objective?
    back: Minimize within-cluster sum of squares (Inertia) by updating centroids iteratively.
  - front: Elbow Method?
    back: Plotting inertia vs K and picking the 'elbow' where the rate of decrease
      slows significantly.
  - front: Centroid?
    back: The mathematical center point of a cluster (mean coordinates of all points
      in the cluster).
