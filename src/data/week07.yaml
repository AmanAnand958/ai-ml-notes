    1.4\" x1=\"60\" x2=\"260\" y1=\"235\" y2=\"195\">\n</line>\n<text class=\"w7t\"\
    \ fill=\"var(--text2)\" font-size=\"9.5\" text-anchor=\"middle\" x=\"160\" y=\"\
    336\">\n        any line cuts through both classes ✗\n       </text>\n<path d=\"\
    M 285 230 L 395 150\" marker-end=\"url(#w7arr_s)\" stroke=\"#f5d76e\" stroke-width=\"\
    2\">\n</path>\n<defs>\n<marker id=\"w7arr_s\" markerheight=\"7\" markerwidth=\"\
    7\" orient=\"auto\" refx=\"6\" refy=\"3\">\n<path d=\"M0,0 L0,6 L7,3 z\" fill=\"\
    #f5d76e\">\n</path>\n</marker>\n</defs>\n<text class=\"w7m\" fill=\"#f5d76e\"\
    \ font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"322\" y=\"218\"\
    >\n        Φ\n       </text>\n<line stroke=\"#2a3050\" stroke-width=\"1\" x1=\"\
    420\" x2=\"660\" y1=\"290\" y2=\"290\">\n</line>\n<line stroke=\"#2a3050\" stroke-width=\"\
    1\" x1=\"420\" x2=\"420\" y1=\"70\" y2=\"290\">\n</line>\n<line stroke=\"#2a3050\"\
    \ stroke-width=\"1\" x1=\"420\" x2=\"620\" y1=\"70\" y2=\"150\">\n</line>\n<text\
    \ class=\"w7m\" fill=\"var(--text2)\" font-size=\"9\" text-anchor=\"middle\" x=\"\
    660\" y=\"305\">\n        x₁\n       </text>\n<text class=\"w7m\" fill=\"var(--text2)\"\
    \ font-size=\"9\" text-anchor=\"middle\" x=\"408\" y=\"304\">\n        x₂\n  \
    \     </text>\n<text class=\"w7m\" fill=\"var(--text2)\" font-size=\"9\" text-anchor=\"\
    middle\" x=\"612\" y=\"78\">\n        x₁²+x₂²\n       </text>\n<path d=\"M 420\
    \ 290 L 620 150 L 560 90 L 420 230 Z\" fill=\"#b47cfc\" fill-opacity=\"0.06\"\
    \ stroke=\"#b47cfc\" stroke-opacity=\"0.4\" stroke-width=\"1\">\n</path>\n<path\
    \ d=\"M 420 290 L 440 220 L 570 90 L 560 90 L 440 220 Z\" fill=\"#6c8cff\" fill-opacity=\"\
    0.05\" stroke=\"#6c8cff\" stroke-opacity=\"0.35\" stroke-width=\"1\">\n</path>\n\
    <g fill=\"#4fd1a5\">\n<circle cx=\"440\" cy=\"265\" r=\"5\">\n</circle>\n<circle\
    \ cx=\"470\" cy=\"240\" r=\"5\">\n</circle>\n<circle cx=\"500\" cy=\"225\" r=\"\
    5\">\n</circle>\n<circle cx=\"530\" cy=\"215\" r=\"5\">\n</circle>\n<circle cx=\"\
    455\" cy=\"200\" r=\"5\">\n</circle>\n</g>\n<g fill=\"#e56b8c\">\n<circle cx=\"\
    580\" cy=\"175\" r=\"5\">\n</circle>\n<circle cx=\"615\" cy=\"120\" r=\"5\">\n\
    </circle>\n<circle cx=\"545\" cy=\"120\" r=\"5\">\n</circle>\n<circle cx=\"510\"\
    \ cy=\"105\" r=\"5\">\n</circle>\n<circle cx=\"575\" cy=\"90\" r=\"5\">\n</circle>\n\
    </g>\n<rect fill=\"#f5d76e\" fill-opacity=\"0.16\" height=\"7\" rx=\"3\" stroke=\"\
    #f5d76e\" stroke-width=\"1.4\" transform=\"rotate(-18 520 155)\" width=\"150\"\
    \ x=\"445\" y=\"152\">\n</rect>\n<text class=\"w7t\" fill=\"#f5d76e\" font-size=\"\
    10.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"540\" y=\"140\">\n     \
    \   plane: green below · pink above ✓\n       </text>\n<text class=\"w7t\" fill=\"\
    var(--text2)\" font-size=\"10\" text-anchor=\"middle\" x=\"540\" y=\"322\">\n\
    \        same dot product, computed implicitly — K(x, x′) = Φ(x)·Φ(x′)\n     \
    \  </text>\n<text class=\"w7t\" fill=\"var(--text2)\" font-size=\"10\" text-anchor=\"\
    middle\" x=\"350\" y=\"346\">\n        RBF: K(x, x′) = exp(−γ‖x − x′‖²) — no need\
    \ to materialise Φ at all\n       </text>\n</svg>\n<div class=\"interview\">\n\
    \       SVM mein hamesha puchha jaata hai: \"When would you use SVM over Random\
    \ Forest?\" Answer: SVM works well when (1) features &gt; samples (e.g. text,\
    \ genomics), (2) data is not too large (&lt;100K rows — SVM is O(n²) to O(n³)),\
    \ (3) you need a clear margin interpretation. Random Forest is better for large\
    \ tabular data with many features of mixed importance.\n      </div>\n<!-- /theory\
    \ -->"
