  flashcards:
  - front: What are Support Vectors?
    back: 'Training points closest to the decision boundary — they alone define the
      SVM margin. Remove other points: same model.'
  - front: 'SVM: high C vs low C'
    back: High C = small margin, few mistakes allowed (overfit risk). Low C = wide
      margin, allows misclassification (underfit risk).
  - front: Gini Impurity formula
    back: G = 1 − Σpₖ². Max=0.5 (50/50 split). Min=0 (pure node). Tree picks split
      that minimises weighted Gini of children.
  - front: Random Forest vs Bagging
    back: 'Bagging: many trees on bootstrap samples. RF: Bagging + random feature
      subset at each split. This decorrelates trees, reducing variance more.'
  - front: What is OOB error?
    back: Each tree trains on ~63% of data. The remaining 37% (out-of-bag) are used
      as free validation. Unbiased estimate, no CV needed.
  - front: 'XGBoost: learning_rate effect'
    back: Lower learning_rate = each tree contributes less = need more trees. Often
      better generalisation. Use with early_stopping_rounds.
  - front: 'Proportion of true positive predictions among all samples predicted as
      positive: TP / (TP + FP).'
    back: 'When False Negatives are costly: cancer detection, fraud detection, churn
      prediction. Missing a real case is worse than a false alarm.'
  - front: What does SHAP explain?
    back: 'SHapley Additive exPlanations: how much each feature contributed to a specific
      prediction. Globally: feature ranking. Locally: WHY this prediction.'
  gotcha:
    title: '⚠️ Gotcha: Learning Rate & Optimizer Overshooting'
    description: Too high learning rate leads to exploding loss (`NaN`). If loss explodes,
      reduce LR by 10x immediately.
