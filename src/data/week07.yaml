- id: '51'
  day_num: 51
  title: Customer Churn — Flask API + Portfolio Polish
  subtitle: A model nobody can use is not complete. Today you wrap the churn model
    in a Flask API, deploy it, write a stellar README, and push a polished portfolio
    project to GitHub. This is what separates job-ready engineers from tutorial watchers.
  time_estimate: 6 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Save and load a sklearn Pipeline (model + preprocessing) using joblib
  - Build a Flask REST API with a /predict endpoint that returns JSON
  - Test the API with curl and Python requests
  - Write a complete GitHub README with problem statement, results, and how-to-run
  - Deploy the Flask app to Render.com (free tier)
