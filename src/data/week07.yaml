  quizzes:
  - num_str: QUESTION 1 OF 5
    question: 'A node has 10 samples: 5 Class A and 5 Class B. What is its Gini Impurity?'
    qid: q46_1
    options:
    - letter: A
      text: 0.0 — perfectly mixed
      is_correct: false
    - letter: B
      text: 0.5 — maximum impurity for binary classification
      is_correct: true
    - letter: C
      text: 1.0 — complete disorder
      is_correct: false
    - letter: D
      text: 0.25 — quarter impure
      is_correct: false
    correct_fb: ✅ Correct! G = 1 − (0.5² + 0.5²) = 1 − 0.5 = 0.5. A 50/50 split gives
      maximum Gini impurity of 0.5 for binary classification. A pure node (all one
      class) has G = 1 − (1² + 0²) = 0.
    wrong_fb: '❌ Use the formula: G = 1 − Σpₖ². Here p(A) = 0.5, p(B) = 0.5. So G
      = 1 − (0.25 + 0.25) = 1 − 0.5 = 0.5. Maximum impurity occurs at the 50/50 split.'
  - num_str: Q2 OF 2
    question: Which hyperparameter is MOST effective at preventing a Decision Tree
      from overfitting?
    qid: q46_2
    options:
    - letter: A
      text: criterion='entropy' instead of 'gini'
      is_correct: false
    - letter: B
      text: max_depth — limits tree growth directly
      is_correct: true
    - letter: C
      text: Increasing the training set size
      is_correct: false
    - letter: D
      text: random_state — ensures reproducibility
      is_correct: false
    correct_fb: ✅ Correct! max_depth is the most direct control. Limiting depth prevents
      the tree from growing deep enough to memorise individual training points. min_samples_leaf
      is equally powerful. Changing criterion (gini vs entropy) has almost no effect
      on overfitting.
    wrong_fb: ❌ The split criterion (gini/entropy) barely affects overfitting. random_state
      only affects reproducibility. While more data helps, max_depth and min_samples_leaf
      are the primary hyperparameters that directly control model complexity.
