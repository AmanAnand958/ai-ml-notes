  quizzes:
  - num_str: QUESTION 3 OF 5
    question: How does Random Forest reduce variance compared to a single decision
      tree?
    qid: q47_3
    options:
    - letter: A
      text: By training on less data to reduce complexity
      is_correct: false
    - letter: B
      text: By averaging many trees trained on different bootstrap samples with random
        features
      is_correct: true
    - letter: C
      text: By using a single deep tree with cross-validation
      is_correct: false
    - letter: D
      text: By applying L1 regularization to all leaf nodes
      is_correct: false
    correct_fb: ✅ Correct!
    wrong_fb: ❌ Incorrect. Review the material and try again.
  - num_str: QUESTION 4 OF 5
    question: What is the typical default for max_features in a Random Forest classifier?
    qid: q47_4
    options:
    - letter: A
      text: All features (max_features = n_features)
      is_correct: false
    - letter: B
      text: sqrt(n_features) — square root of total features
      is_correct: true
    - letter: C
      text: log2(n_features)
      is_correct: false
    - letter: D
      text: 1 — only one random feature at each split
      is_correct: false
    correct_fb: ✅ Correct!
    wrong_fb: ❌ Incorrect. Review the material and try again.
  - num_str: QUESTION 5 OF 5
    question: Which is NOT an advantage of Random Forest over Gradient Boosting?
    qid: q47_5
    options:
    - letter: A
      text: Easier to parallelize (trees are independent)
      is_correct: false
    - letter: B
      text: Fewer hyperparameters to tune
      is_correct: false
    - letter: C
      text: Often achieves lower bias on the training set
      is_correct: true
    - letter: D
      text: More robust to outliers and noisy data
      is_correct: false
    correct_fb: ✅ Correct!
    wrong_fb: ❌ Incorrect. Review the material and try again.
  - num_str: QUESTION 1 OF 5
    question: In a Random Forest with 30 features, how many features are typically
      considered at each split?
    qid: q47_1
    options:
    - letter: A
      text: All 30 — RF uses all features at every split
      is_correct: false
    - letter: B
      text: 15 — half the features by default
      is_correct: false
    - letter: C
      text: ~5-6 — √30 ≈ 5.5, rounded to 5
      is_correct: true
    - letter: D
      text: 1 — only one random feature per split
      is_correct: false
    correct_fb: '✅ Correct! max_features=''sqrt'' means √p features per split. For
      p=30: √30 ≈ 5.5 → sklearn uses 5. This is the key RF hyperparameter that decorrelates
      the trees. Without it (using all 30 features), you''d get Bagging, not Random
      Forest.'
    wrong_fb: '❌ Random Forest''s key innovation over Bagging is feature randomness
      at each split: only √p features (for classification) or p/3 (for regression)
      are considered. For p=30, that''s √30 ≈ 5 features.'
  - num_str: Q2 OF 2
    question: What is the Out-of-Bag (OOB) error in Random Forest?
    qid: q47_2
    options:
    - letter: A
      text: The error on the training set averaged across all trees
      is_correct: false
    - letter: B
      text: The error when the model fails to converge
      is_correct: false
    - letter: C
      text: The validation error estimated using each sample's trees that did NOT
        train on it
      is_correct: true
    - letter: D
      text: The error rate of the worst-performing tree in the forest
      is_correct: false
    correct_fb: ✅ Correct! Each tree trains on ~63% of samples. The remaining ~37%
      (not in the bootstrap sample) are "out-of-bag." For each training point, you
      can predict it using only the trees that were NOT trained on it — giving a nearly
      unbiased validation estimate. This is essentially free cross-validation!
    wrong_fb: ❌ OOB is the key free validation in RF. Since each tree trains on a
      bootstrap sample (~63% of data), ~37% of samples are never seen by each tree.
      Those "out-of-bag" samples can be used as validation — averaged across all trees
      to give an unbiased error estimate.
  flashcards:
  - front: Random Forest Feature Subsampling (m = sqrt(p))?
    back: Decorrelates individual trees by forcing each split to choose from a random
      subset of sqrt(p) features, reducing ensemble variance.
  - front: Eigenvectors?
    back: The direction vectors of the principal components representing the new axes
      in space.
  - front: Explained Variance?
    back: The amount of variance captured by each principal component (helps select
      number of components).
