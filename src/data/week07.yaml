    text: Pass daily interactive quiz and review active recall flashcards
  concept_flow:
  - Support Vector Machines (
  - Decision Trees — Gini, En
  - Random Forests — Bagging
  - Gradient Boosting + XGBoo
  - Customer Churn Project —
  - Customer Churn — Modeling
  - Customer Churn — Flask AP
  hinglish: "Feature importance tree models mein automatically milti hai:\n      \
    \ \n        model.feature_importances_\n       \n       . Ye quick feature selection\
    \ ke liye use kar sakte ho!"
  analogy: Imagine 100 election analysts. Each one studies a different random sample
    of 500 voters (with replacement). Each makes their own prediction. You aggregate
    all 100 predictions by majority vote. Even if each analyst is wrong 40% of the
    time, their collective vote is rarely wrong — because their errors are uncorrelated.
    Yahi bagging hai.
  theory_html: "<div class=\"mermaid\">\ngraph TD\n  Train[\"Training Dataset\"] --&gt;\
    \ Boot1[\"Bootstrap Sample 1 - w/ replacement\"]\n  Train --&gt; Boot2[\"Bootstrap\
    \ Sample 2 - w/ replacement\"]\n  Train --&gt; BootN[\"Bootstrap Sample N - w/\
    \ replacement\"]\n  Boot1 --&gt; Tree1[\"Decision Tree 1 - Random sqrt- d features\"\
    ]\n  Boot2 --&gt; Tree2[\"Decision Tree 2 - Random sqrt- d features\"]\n  BootN\
    \ --&gt; TreeN[\"Decision Tree N - Random sqrt- d features\"]\n  Tree1 --&gt;\
    \ Vote[\"Majority Voting / Soft Probability Average\"]\n  Tree2 --&gt; Vote\n\
    \  TreeN --&gt; Vote\n  Vote --&gt; Final[\"Final Robust Ensemble Prediction\"\
    ]\n</div>\n<h3 class=\"sh3\">\n       1. Bagging — Bootstrap Aggregating\n   \
    \   </h3>\n\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — random_forest_deep_dive.py\n        </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n         \
    \ copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">from</span> sklearn.datasets <span class=\"kw\">import</span>\
    \ load_breast_cancer\n<span class=\"kw\">from</span> sklearn.model_selection <span\
    \ class=\"kw\">import</span> train_test_split\n<span class=\"kw\">from</span>\
    \ sklearn.metrics <span class=\"kw\">import</span> roc_auc_score, log_loss\n<span\
    \ class=\"kw\">import</span> xgboost <span class=\"kw\">as</span> xgb\n\nX, y\
    \ = <span class=\"fn\">load_breast_cancer</span>(return_X_y=<span class=\"kw\"\
    >True</span>)\nX_train, X_val, y_train, y_val = <span class=\"fn\">train_test_split</span>(X,\
    \ y, test_size=<span class=\"num\">0.2</span>, random_state=<span class=\"num\"\
    >42</span>)\n\n<span class=\"cm\"># Configure XGBoost Classifier with Early Stopping</span>\n\
    model = xgb.<span class=\"fn\">XGBClassifier</span>(\n    n_estimators=<span class=\"\
    num\">300</span>,\n    learning_rate=<span class=\"num\">0.05</span>,\n    max_depth=<span\
    \ class=\"num\">4</span>,\n    subsample=<span class=\"num\">0.8</span>,\n   \
    \ colsample_bytree=<span class=\"num\">0.8</span>,\n    eval_metric=<span class=\"\
    str\">\"logloss\"</span>,\n    early_stopping_rounds=<span class=\"num\">15</span>,\n\
    \    random_state=<span class=\"num\">42</span>\n)\n\nmodel.<span class=\"fn\"\
    >fit</span>(\n    X_train, y_train,\n    eval_set=[(X_train, y_train), (X_val,\
    \ y_val)],\n    verbose=<span class=\"kw\">False</span>\n)\n\nval_preds_proba\
    \ = model.<span class=\"fn\">predict_proba</span>(X_val)[:, <span class=\"num\"\
    >1</span>]\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\U0001F3C6\
    \ Best Iteration: {model.best_iteration}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"ROC-AUC Score:   {roc_auc_score(y_val, val_preds_proba):.4f}\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Log Loss:   \
    \     {log_loss(y_val, val_preds_proba):.4f}\"</span>)</pre>\n</div>\n<div class=\"\
    interview\">\n       Interview favourite: \"Why does Random Forest reduce variance\
    \ compared to a single Decision Tree?\" Answer: Each tree is trained on a different\
    \ bootstrap sample (reduces correlation between trees) AND at each split only\
    \ √p features are considered (further decorrelates trees). Since errors are uncorrelated,\
    \ averaging many trees cancels out individual errors. Variance of the average\
    \ of n correlated predictions = ρσ² + (1-ρ)σ²/n. RF minimises ρ (correlation).\n\
    \      </div>\n<!-- /day-47-theory -->\n<!-- /day-47-tasks-section -->\n<!-- /day-47-quiz-section\
    \ -->\n<!-- /day-47-resources-section -->"
