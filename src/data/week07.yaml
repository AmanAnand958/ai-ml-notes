week_number: 7
title: Classification
description: ''
days:
- id: '45'
  day_num: 45
  title: Support Vector Machines (SVM)
  subtitle: Imagine drawing the widest possible street between two neighbourhoods.
    SVM finds the hyperplane thatmaximises the marginbetween classes — the widest
    possible "street" — making it one of the most geometrically elegant algorithms
    in ML.
  time_estimate: 5 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Explain the maximum-margin classifier and identify support vectors on a diagram
  - Explain the soft-margin SVM and the role of the C hyperparameter
  - Apply the kernel trick (RBF, polynomial, linear) and explain why it works
  - Train and tune an SVM classifier using sklearn, interpreting the C and gamma parameters
  - State when SVM outperforms tree-based models and when it doesn't
  checklist:
  - id: chk_45_1
    text: 'Master core theory: Explain the maximum-margin classifier and identify
      support vectors on a diagram'
  - id: chk_45_2
    text: 'Build hands-on pipeline: Explain the soft-margin SVM and the role of the
      C hyperparameter'
  - id: chk_45_3
    text: Complete Verify the scaling requirement and verify passing tests
  - id: chk_45_4
    text: Pass daily interactive quiz and review active recall flashcards
  concept_flow:
  - Logistic Classification
  - SVM Margins
  - Decision Trees
  - Ensemble Bagging
  - Gradient Boosting
  hinglish: "Multi-class classification mein One-vs-Rest ya Softmax use karo. Sklearn\
    \ automatically handle karta hai — bas\n       \n        multi_class='multinomial'\n\
    \       \n       set karo LogisticRegression mein."
  analogy: "Do localities ko separate karna hai — Sharma ji ki colony aur Verma ji\
    \ ki colony. Agar tum ek road banao jo dono colonies ke beech mein maximum distance\
    \ rakhti ho, toh woh road SVM ka\n       <em>\n        decision boundary\n   \
    \    </em>\n       hai. Aur us road ke sabse paas wale ghar — woh \"support vectors\"\
    \ hain. Sirf woh ghar decision boundary decide karte hain — baaki sab irrelevant\
    \ hain."
  theory_html: "<h3 class=\"sh3\">\n       1. The Maximum Margin Classifier\n    \
    \  </h3>\n\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$Decision\
    \ boundary: w·x + b = 0$$\n       </span>\n<span class=\"desc\">\n        w =\
    \ weight vector (perpendicular to boundary), b = bias. Points above boundary:\
    \ w·x + b &gt; 0 (class +1). Below: class -1.\n       </span>\n<span class=\"\
    formula\">\n        $$Margin = 2 / ||w||$$\n       </span>\n<span class=\"desc\"\
    >\n        We maximise margin ↔ minimise ||w||². Constrained: yᵢ(w·xᵢ + b) ≥ 1\
    \ for all points.\n       </span>\n<span class=\"formula\">\n        $$Objective:\
    \ min ½||w||² subject to yᵢ(w·xᵢ + b) ≥ 1$$\n       </span>\n<span class=\"desc\"\
    >\n        This is a quadratic programming problem. Solved via Lagrange duality\
    \ → support vectors are points where constraint is active (= 1).\n       </span>\n\
    </div>\n<svg aria-label=\"SVM binary classification with decision boundary, margin\
    \ band and support vectors\" height=\"350\" role=\"img\" viewbox=\"0 0 660 350\"\
    \ width=\"660\" xmlns=\"http://www.w3.org/2000/svg\">\n<style>\n        svg .hov{transition:opacity\
    \ .15s} svg .hov:hover{opacity:1} svg .hov2{transition:opacity .15s,stroke-width\
    \ .15s} svg .hov2:hover{opacity:1;stroke-width:3}\n       </style>\n<defs>\n<lineargradient\
    \ id=\"svgdiag2-bg_s\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n<stop offset=\"0%\"\
    \ stop-color=\"#1a1e2e\">\n</stop>\n<stop offset=\"100%\" stop-color=\"var(--bg)\"\
    >\n</stop>\n</lineargradient>\n</defs>\n<rect fill=\"url(#svgdiag2-bg_s)\" height=\"\
    350\" rx=\"12\" width=\"660\">\n</rect>\n<marker id=\"svmArr_s\" markerheight=\"\
    7\" markerwidth=\"7\" orient=\"auto\" refx=\"6\" refy=\"3\">\n<path d=\"M0,0 L0,6\
    \ L7,3 z\" fill=\"#f5d76e\">\n</path>\n</marker>\n<marker id=\"svmArr2_s\" markerheight=\"\
    7\" markerwidth=\"7\" orient=\"auto\" refx=\"6\" refy=\"3\">\n<path d=\"M0,0 L0,6\
    \ L7,3 z\" fill=\"#f5d76e\">\n</path>\n</marker>\n<text fill=\"#e6edf3\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\"\
    \ x=\"335\" y=\"26\">\n        SVM — Maximum Margin Classifier\n       </text>\n\
    <rect fill=\"var(--bg)\" fill-opacity=\"0.6\" height=\"250\" rx=\"8\" stroke=\"\
    #2a3050\" width=\"590\" x=\"40\" y=\"50\">\n</rect>\n<rect fill=\"#4fd1a5\" fill-opacity=\"\
    0.07\" height=\"250\" width=\"80\" x=\"265\" y=\"50\">\n</rect>\n<line stroke=\"\
    #e6edf3\" stroke-dasharray=\"10 6\" stroke-width=\"2\" x1=\"305\" x2=\"305\" y1=\"\
    50\" y2=\"300\">\n</line>\n<line stroke=\"#4fd1a5\" stroke-opacity=\"0.8\" stroke-width=\"\
    1.5\" x1=\"265\" x2=\"265\" y1=\"50\" y2=\"300\">\n</line>\n<line stroke=\"#e56b8c\"\
    \ stroke-opacity=\"0.8\" stroke-width=\"1.5\" x1=\"345\" x2=\"345\" y1=\"50\"\
    \ y2=\"300\">\n</line>\n<text fill=\"#e6edf3\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"10.5\" font-weight=\"400\" text-anchor=\"left\" x=\"72\" y=\"322\"\
    >\n        Decision boundary:  w·x + b = 0\n       </text>\n<text fill=\"#6c8cff\"\
    \ font-family=\"DM Sans,sans-serif\" font-size=\"18\" text-anchor=\"middle\" x=\"\
    305\" y=\"44\">\n        ✕\n       </text>\n<path d=\"M 265 92 L 345 92\" marker-end=\"\
    url(#svmArr_s)\" marker-start=\"url(#svmArr_s2)\" stroke=\"#f5d76e\" stroke-width=\"\
