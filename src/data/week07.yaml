- id: '46'
  day_num: 46
  title: Decision Trees — Gini, Entropy & Pruning
  subtitle: Decision Trees are the most human-interpretable ML model — you can literally
    draw the flowchart of the model's logic. But they overfit aggressively. Today
    you will master how they split, why they overfit, and how to control them.
  time_estimate: 5 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Calculate Gini Impurity and Information Gain by hand for a simple split
  - Explain recursive partitioning and how the best split is selected at each node
  - Identify and fix overfitting using max_depth, min_samples_leaf, and pruning
  - Visualise a trained decision tree and extract feature importances
  - Explain the difference between Gini impurity and Entropy and when to prefer each
  checklist:
  - id: chk_46_1
    text: 'Master core theory: Calculate Gini Impurity and Information Gain by hand
      for a simple split'
  - id: chk_46_2
    text: 'Build hands-on pipeline: Explain recursive partitioning and how the best
      split is selected at each node'
  - id: chk_46_3
    text: Complete Calculate Gini by hand on a toy dataset and verify passing tests
  - id: chk_46_4
    text: Pass daily interactive quiz and review active recall flashcards
  concept_flow:
  - Support Vector Machines (
  - Decision Trees — Gini, En
  - Random Forests — Bagging
  - Gradient Boosting + XGBoo
  - Customer Churn Project —
  - Customer Churn — Modeling
  - Customer Churn — Flask AP
  hinglish: Decision Trees recursive binary splits karke feature space ko partition
    karte hain. Gini Impurity measure karti hai ki split ke baad child nodes kitne
    pure hain.
  analogy: 'Ek doctor ko decide karna hai ki patient ko diabetes hai ya nahi. Woh
    puchhe: "Kya glucose &gt; 140?" Agar haan → ek branch. Agar nahi → dusra branch.
    Phir us branch mein: "Kya BMI &gt; 30?" — aur aise aage. Yahi decision tree hai:
    ek series of if-else questions jo data ko pure subsets mein divide karte hain.'
  theory_html: "<h3 class=\"sh3\">\n       1. How Trees Split — The Math\n      </h3>\n\
    \n<div class=\"math-block\">\n<span class=\"formula\">\n        $$Gini Impurity:\
    \ G = 1 − Σ pₖ²$$\n       </span>\n<span class=\"desc\">\n        pₖ = fraction\
    \ of class k in node. G=0 means perfectly pure (all one class). G=0.5 = maximum\
    \ impurity (50/50 split for binary classification).\n       </span>\n<span class=\"\
    formula\">\n        $$Information Gain (Entropy): H = −Σ pₖ log₂(pₖ)$$\n     \
    \  </span>\n<span class=\"desc\">\n        Entropy of a node. Split gain = H(parent)\
    \ − [weighted avg of H(children)]. Pick the split with highest gain.\n       </span>\n\
    <span class=\"formula\">\n        $$Best split = argmax over all features/thresholds\
    \ of Information Gain$$\n       </span>\n<span class=\"desc\">\n        For each\
    \ feature, try every unique value as a threshold. O(n log n) per feature per node.\
    \ Repeated recursively until stopping criteria.\n       </span>\n</div>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\
    \ — gini_from_scratch.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n \
    \         Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span>\
    \ numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span> <span\
    \ class=\"fn\">calculate_gini_impurity</span>(y: np.ndarray) -&gt; float:\n  \
    \  <span class=\"str\">\"\"\"Calculates Gini Impurity: Gini = 1 - sum(p_i^2)\"\
    \"\"</span>\n    <span class=\"kw\">if</span> <span class=\"fn\">len</span>(y)\
    \ == <span class=\"num\">0</span>:\n        <span class=\"kw\">return</span> <span\
    \ class=\"num\">0.0</span>\n    _, counts = np.<span class=\"fn\">unique</span>(y,\
    \ return_counts=<span class=\"kw\">True</span>)\n    probabilities = counts /\
    \ <span class=\"fn\">len</span>(y)\n    <span class=\"kw\">return</span> <span\
    \ class=\"num\">1.0</span> - <span class=\"fn\">float</span>(np.<span class=\"\
    fn\">sum</span>(probabilities ** <span class=\"num\">2</span>))\n\n<span class=\"\
    kw\">def</span> <span class=\"fn\">calculate_information_gain</span>(parent_y:\
    \ np.ndarray, left_y: np.ndarray, right_y: np.ndarray) -&gt; float:\n    <span\
    \ class=\"str\">\"\"\"Calculates Information Gain based on weighted Gini Impurity\
    \ reduction.\"\"\"</span>\n    parent_gini = <span class=\"fn\">calculate_gini_impurity</span>(parent_y)\n\
    \    n = <span class=\"fn\">len</span>(parent_y)\n    n_l, n_r = <span class=\"\
    fn\">len</span>(left_y), <span class=\"fn\">len</span>(right_y)\n    <span class=\"\
    kw\">if</span> n == <span class=\"num\">0</span>:\n        <span class=\"kw\"\
    >return</span> <span class=\"num\">0.0</span>\n    weighted_child_gini = (n_l\
    \ / n) * <span class=\"fn\">calculate_gini_impurity</span>(left_y) + (n_r / n)\
    \ * <span class=\"fn\">calculate_gini_impurity</span>(right_y)\n    <span class=\"\
    kw\">return</span> parent_gini - weighted_child_gini\n\n<span class=\"cm\"># Test\
    \ case</span>\nparent = np.<span class=\"fn\">array</span>([<span class=\"num\"\
    >1</span>, <span class=\"num\">1</span>, <span class=\"num\">1</span>, <span class=\"\
    num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\">0</span>, <span\
    \ class=\"num\">0</span>, <span class=\"num\">0</span>])\nleft = np.<span class=\"\
    fn\">array</span>([<span class=\"num\">1</span>, <span class=\"num\">1</span>,\
    \ <span class=\"num\">1</span>, <span class=\"num\">1</span>])\nright = np.<span\
    \ class=\"fn\">array</span>([<span class=\"num\">0</span>, <span class=\"num\"\
    >0</span>, <span class=\"num\">0</span>, <span class=\"num\">0</span>])\n\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"Parent Gini: {calculate_gini_impurity(parent):.4f}\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Left Child Gini:\
    \ {calculate_gini_impurity(left):.4f}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Information Gain: {calculate_information_gain(parent, left,\
    \ right):.4f}\"</span>)</pre>\n</div>\n<h3 class=\"sh3\">\n       2. Gini vs Entropy\
    \ — Practical Difference\n      </h3>\n<div class=\"table-wrap\" style=\"overflow-x:\
    \ auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n\
    <th>\n         METRIC\n        </th>\n<th>\n         FORMULA\n        </th>\n\
    <th>\n         RANGE\n        </th>\n<th>\n         SPEED\n        </th>\n<th>\n\
    \         WHEN TO PREFER\n        </th>\n</tr>\n<tr>\n<td>\n<strong>\n       \
    \   Gini Impurity\n         </strong>\n</td>\n<td>\n         1 − Σpₖ²\n      \
    \  </td>\n<td>\n         [0, 0.5] binary\n        </td>\n<td>\n         Faster\
    \ (no log)\n        </td>\n<td>\n         Default — slightly biased toward larger\
    \ partitions\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          Entropy (Info\
    \ Gain)\n         </strong>\n</td>\n<td>\n         −Σpₖlog₂(pₖ)\n        </td>\n\
    <td>\n         [0, log₂k]\n        </td>\n<td>\n         Slightly slower\n   \
    \     </td>\n<td>\n         When you want balanced splits; theoretically motivated\n\
    \        </td>\n</tr>\n</table></div>\n<div class=\"interview\">\n       Top interview\
    \ question: \"Why do Decision Trees tend to overfit, and how do you fix it?\"\
