  tasks:
  - title: Calculate Gini by hand on a toy dataset
    badge: Easy · 30 min
    badge_class: tb-easy
    time: ''
    prompt_html: "<p>\n          Create a numpy array: y = [0, 0, 0, 1, 1, 1, 1, 1].\
      \ Calculate the Gini of the full set, then calculate the weighted Gini after\
      \ splitting at index 3 (left: [0,0,0], right: [1,1,1,1,1]). Verify with your\
      \ gini_split() function.\n         </p>"
    done_when: Your hand calculation matches the numpy function output.
    git_cmd: 'git add . &amp;&amp; git commit -m "day46: Decision Tree Gini split
      and max depth regularization from scratch"'
    sol_id: sol-w7d46t1
    solution_title: ✅ COMPLETE SOLUTION — calculate_gini_by_hand_on_a_toy_dataset.py
    solution_code: "<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
      \ np\n\n<span class=\"kw\">def</span> <span class=\"fn\">calculate_gini_impurity</span>(y:\
      \ np.ndarray) -&gt; float:\n    <span class=\"str\">\"\"\"Calculates Gini Impurity:\
      \ Gini = 1 - sum(p_i^2)\"\"\"</span>\n    <span class=\"kw\">if</span> <span\
      \ class=\"fn\">len</span>(y) == <span class=\"num\">0</span>:\n        <span\
      \ class=\"kw\">return</span> <span class=\"num\">0.0</span>\n    _, counts =\
      \ np.<span class=\"fn\">unique</span>(y, return_counts=<span class=\"kw\">True</span>)\n\
      \    probabilities = counts / <span class=\"fn\">len</span>(y)\n    <span class=\"\
      kw\">return</span> <span class=\"num\">1.0</span> - <span class=\"fn\">float</span>(np.<span\
      \ class=\"fn\">sum</span>(probabilities ** <span class=\"num\">2</span>))\n\n\
      <span class=\"kw\">def</span> <span class=\"fn\">calculate_information_gain</span>(parent_y:\
      \ np.ndarray, left_y: np.ndarray, right_y: np.ndarray) -&gt; float:\n    <span\
      \ class=\"str\">\"\"\"Calculates Information Gain based on weighted Gini Impurity\
      \ reduction.\"\"\"</span>\n    parent_gini = <span class=\"fn\">calculate_gini_impurity</span>(parent_y)\n\
      \    n = <span class=\"fn\">len</span>(parent_y)\n    n_l, n_r = <span class=\"\
      fn\">len</span>(left_y), <span class=\"fn\">len</span>(right_y)\n    <span class=\"\
      kw\">if</span> n == <span class=\"num\">0</span>:\n        <span class=\"kw\"\
      >return</span> <span class=\"num\">0.0</span>\n    weighted_child_gini = (n_l\
      \ / n) * <span class=\"fn\">calculate_gini_impurity</span>(left_y) + (n_r /\
      \ n) * <span class=\"fn\">calculate_gini_impurity</span>(right_y)\n    <span\
      \ class=\"kw\">return</span> parent_gini - weighted_child_gini\n\n<span class=\"\
      cm\"># Test case</span>\nparent = np.<span class=\"fn\">array</span>([<span\
      \ class=\"num\">1</span>, <span class=\"num\">1</span>, <span class=\"num\"\
      >1</span>, <span class=\"num\">1</span>, <span class=\"num\">0</span>, <span\
      \ class=\"num\">0</span>, <span class=\"num\">0</span>, <span class=\"num\"\
      >0</span>])\nleft = np.<span class=\"fn\">array</span>([<span class=\"num\"\
      >1</span>, <span class=\"num\">1</span>, <span class=\"num\">1</span>, <span\
      \ class=\"num\">1</span>])\nright = np.<span class=\"fn\">array</span>([<span\
      \ class=\"num\">0</span>, <span class=\"num\">0</span>, <span class=\"num\"\
      >0</span>, <span class=\"num\">0</span>])\n\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Parent Gini: {calculate_gini_impurity(parent):.4f}\"</span>)\n\
      <span class=\"fn\">print</span>(<span class=\"str\">f\"Left Child Gini: {calculate_gini_impurity(left):.4f}\"\
      </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Information\
      \ Gain: {calculate_information_gain(parent, left, right):.4f}\"</span>)"
    solution_lang: python
