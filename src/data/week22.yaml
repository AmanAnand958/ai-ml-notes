    answer: '0.9'
    explanation: Harmonic mean of identical values 0.90 and 0.90 is exactly 0.90.
    code: 'f = 0.9

      r = 0.9

      h_mean = 2 * (f * r) / (f + r)

      print(round(h_mean, 1))'
