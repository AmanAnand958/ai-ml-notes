    question: If the user asks "How tall is the Eiffel Tower?" and the LLM answers
      "It is located in Paris", which metric will fail?
    answer: Answer Relevance
    explanation: Answer Relevance / Faithfulness (the response is factually true about
      Paris, but completely irrelevant to the question asking for height in meters).
    code: "# Verification Script for Day 157\ndef evaluate_answer_relevance(question:\
      \ str, answer: str):\n    has_height_units = any(u in answer.lower() for u in\
      \ [\"meter\", \"metre\", \"feet\", \"ft\", \"tall\"])\n    relevance_score =\
      \ 1.0 if has_height_units else 0.0\nprint(f\"Question: '{question}' | Answer:\
      \ '{answer}' - Relevance Score: {relevance_score}\")\nreturn relevance_score\n\
      \nif __name__ == \"__main__\":\n    assert evaluate_answer_relevance(\"How tall\
      \ is the Eiffel Tower?\", \"It is in Paris\") == 0.0"
