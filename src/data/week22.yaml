      </div>\n</div>\n<pre><span class=\"kw\">def</span> <span class=\"fn\">calculate_context_recall</span>(ground_truth_sentences:\
      \ list, retrieved_context: str) -&gt; float:\n    context_lower = retrieved_context.<span\
      \ class=\"fn\">lower</span>()\n    matched = <span class=\"num\">0</span>\n\
      <span class=\"kw\">for</span> s <span class=\"kw\">in</span> ground_truth_sentences:\n\
      \        words = s.<span class=\"fn\">lower</span>().<span class=\"fn\">split</span>()\n\
      \        <span class=\"cm\"># Sentence is supported if 60% key words present\
      \ in context</span>\n        present = <span class=\"fn\">sum</span>(<span class=\"\
      num\">1</span> <span class=\"kw\">for</span> w <span class=\"kw\">in</span>\
      \ words <span class=\"kw\">if</span> w <span class=\"kw\">in</span> context_lower)\n\
      \        <span class=\"kw\">if</span> present / <span class=\"fn\">max</span>(<span\
      \ class=\"num\">1</span>, <span class=\"fn\">len</span>(words)) &gt;= <span\
      \ class=\"num\">0.60</span>:\n            matched += <span class=\"num\">1</span>\n\
