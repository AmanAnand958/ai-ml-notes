      <span class=\"kw\">return</span> wrapper\n<span class=\"kw\">return</span> decorator\n\
      \n@<span class=\"fn\">trace_llm_span</span>(<span class=\"str\">\"OpenAI_ChatCompletion\"\
      </span>)\n<span class=\"kw\">def</span> <span class=\"fn\">call_mock_llm</span>(prompt:\
      \ str):\n    time.<span class=\"fn\">sleep</span>(<span class=\"num\">0.05</span>)\n\
