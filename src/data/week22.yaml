  - title: 'Task 2: Implement LLM Evaluation Metrics'
    badge: TASK 2
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\"\
      >\n        Implement algorithmic Context Recall measuring the proportion of\
      \ reference ground truth sentences matched by retrieved passages.\n       </p>\n\
      <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n    \
      \      python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
      \ onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button\
      \ class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n\
      </div>\n</div>\n<pre><span class=\"kw\">def</span> <span class=\"fn\">calculate_context_recall</span>(ground_truth_sentences:\
      \ list, retrieved_context: str) -&gt; float:\n    context_lower = retrieved_context.<span\
      \ class=\"fn\">lower</span>()\n    matched = <span class=\"num\">0</span>\n\
      <span class=\"kw\">for</span> s <span class=\"kw\">in</span> ground_truth_sentences:\n\
      \        words = s.<span class=\"fn\">lower</span>().<span class=\"fn\">split</span>()\n\
      \        <span class=\"cm\"># Sentence is supported if 60% key words present\
      \ in context</span>\n        present = <span class=\"fn\">sum</span>(<span class=\"\
      num\">1</span> <span class=\"kw\">for</span> w <span class=\"kw\">in</span>\
      \ words <span class=\"kw\">if</span> w <span class=\"kw\">in</span> context_lower)\n\
      \        <span class=\"kw\">if</span> present / <span class=\"fn\">max</span>(<span\
      \ class=\"num\">1</span>, <span class=\"fn\">len</span>(words)) >= <span class=\"\
      num\">0.60</span>:\n            matched += <span class=\"num\">1</span>\n<span\
      \ class=\"kw\">return</span> <span class=\"fn\">round</span>(matched / <span\
      \ class=\"fn\">max</span>(<span class=\"num\">1</span>, <span class=\"fn\">len</span>(ground_truth_sentences)),\
      \ <span class=\"num\">4</span>)\n\ngt = [\n    <span class=\"str\">\"LoRA freezes\
      \ pretrained model weights\"</span>,\n    <span class=\"str\">\"LoRA injects\
      \ rank decomposition matrices into Transformer layers\"</span>,\n    <span class=\"\
      str\">\"LoRA increases inference latency by 50%\"</span>\n]\nctx = <span class=\"\
      str\">\"LoRA freezes original pretrained weights and injects low-rank decomposition\
      \ matrices into attention layers without adding inference latency.\"</span>\n\
      <span class=\"fn\">print</span>(<span class=\"str\">\"Context Recall Score:\"\
      </span>, <span class=\"fn\">calculate_context_recall</span>(gt, ctx))</pre>\n\
      </div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05);\
      \ border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono);\
      \ font-size:12px;\">\n<strong>\n         Expected Verification Output:\n   \
      \     </strong>\n<br/>\n\n         Context Recall Score: 0.6667\n        \n\
      </div>"
