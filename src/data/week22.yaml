  hinglish: RAG evaluation ke liye RAGAS framework standard hai. Faithfulness dekhta hai ki answer context se grounded hai
    ya hallucinated. Answer Relevance dekhta hai ki user query ka seedha jawab mila ya nahi. Context Precision aur Recall
    retrieval quality measure karte hain.
  analogy: 'The RAGAS evaluation quadrant is like a medical board examination: Faithfulness tests if the diagnosis matches
    the lab results, Answer Relevance tests if the doctor answered the patient''s complaint, and Context Recall tests if all
    necessary medical history was gathered.'
  theory_html: |-
    <h3 class="sh3">Mathematical Formulation &amp; Performance Bounds</h3><div class="math-block">
    $$ \text{RagasScore} = \frac{2 \cdot \text{Faithfulness} \cdot \text{AnswerRelevancy}}{\text{Faithfulness} + \text{AnswerRelevancy}} $$
    <p class="math-caption">Harmonic mean of Ragas core metrics to evaluate RAG system quality.</p>
    </div><p>
    </p><h3 class="sh3">Production Engineering Walkthrough: LLM Evaluation Metrics</h3><p>
    The following production implementation demonstrates the core architecture, defensive error handling, and telemetry integration required for **LLM Evaluation Metrics** in enterprise production systems:
    </p><div class="cb">
    <div class="cb-head"><span class="cb-lang">python — production_llm_evaluator.py</span><div class="cb-btns"><button class="copy-btn" onclick="copyCode(this)">copy</button></div></div>
    <pre><code class="language-python"># Day 157 — Production RAGAS RAG Evaluation Pipeline
    import time, logging
    from typing import List, Dict, Any

    logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(message)s")
    logger = logging.getLogger("RAGASEvaluator")

    class RAGASEvaluationPipeline:
        """
        Evaluates RAG system quality using RAGAS metrics:
        faithfulness, answer_relevancy, context_precision, context_recall.
        """

        METRICS_NAMES = ["faithfulness", "answer_relevancy", "context_precision", "context_recall"]

        def __init__(self, judge_model: str = "gpt-4o", embedding_model: str = "text-embedding-3-small"):
            from ragas.metrics import faithfulness, answer_relevancy, context_precision, context_recall
            from ragas.llms import LangchainLLMWrapper
            from ragas.embeddings import LangchainEmbeddingsWrapper
            from langchain_openai import ChatOpenAI, OpenAIEmbeddings
            self.metrics = [faithfulness, answer_relevancy, context_precision, context_recall]
            for m in self.metrics:
                m.llm = LangchainLLMWrapper(ChatOpenAI(model=judge_model, temperature=0))
                if hasattr(m, "embeddings"):
                    m.embeddings = LangchainEmbeddingsWrapper(OpenAIEmbeddings(model=embedding_model))
            logger.info(f"RAGAS evaluator: judge={judge_model}, embed={embedding_model}")

        def evaluate(self, samples: List[Dict[str, Any]]) -&gt; Dict[str, float]:
            """
            samples: List of {"question": str, "answer": str, "contexts": List[str],
                               "ground_truth": str}
            """
            from ragas import evaluate
            from datasets import Dataset
            t0 = time.perf_counter()
            dataset = Dataset.from_list(samples)
            result = evaluate(dataset, metrics=self.metrics)
            scores = result.to_pandas().mean().to_dict()
            elapsed = time.perf_counter() - t0
            logger.info(f"RAGAS: {len(samples)} samples in {elapsed:.1f}s — {scores}")
            return scores

        def generate_report(self, scores: Dict[str, float]) -&gt; str:
            lines = ["=== RAGAS Evaluation Report ==="]
            for metric, score in scores.items():
                status = "✅" if score &gt;= 0.7 else ("⚠️" if score &gt;= 0.5 else "❌")
                lines.append(f"  {status} {metric}: {score:.3f}")
            overall = sum(scores.values()) / max(len(scores), 1)
            lines.append(f"
      Overall: {overall:.3f} {'PASS' if overall &gt;= 0.7 else 'FAIL'}")
            return "
    ".join(lines)

    if __name__ == "__main__":
        print("RAGASEvaluationPipeline: Requires ragas + openai packages")
        # Simulate scores (typical production values)
        simulated = {"faithfulness": 0.84, "answer_relevancy": 0.91, "context_precision": 0.76, "context_recall": 0.82}
        print(f"Simulated RAGAS scores: {simulated}")
        assert all(0 &lt;= v &lt;= 1 for v in simulated.values())
        overall = sum(simulated.values()) / len(simulated)
        print(f"Overall: {overall:.3f} ({'PASS' if overall &gt;= 0.7 else 'FAIL'})")
        print("RAGASEvaluationPipeline: OK")
    </code></pre>
    </div><h3 class="sh3">Deep Dive: RAG Triad Metric Calculations</h3><p>
    The RAG Triad consists of three orthogonal evaluation vectors:
    1. <strong>Context Precision:</strong> Measures whether retrieved chunks are relevant to the query without introducing noise. Calculated via Mean Reciprocal Rank (MRR) or NDCG@k against human relevance judgments.
    2. <strong>Faithfulness:</strong> Measures whether the generated answer relies exclusively on retrieved facts rather than parametric hallucinations.
    3. <strong>Answer Relevance:</strong> Evaluates whether the generated response directly answers the user prompt without tangent drift.
    </p>
