  predict:
    question: Why do we need session tracking in observability?
    answer: Session grouping
    explanation: To group multi-turn conversational traces under a single user session
      ID, allowing engineers to trace full multi-step agent reasoning, token costs,
      and latency over time.
    code: "# Verification Script for Day 158\ndef session_trace_aggregation(traces:\
      \ list):\n    total_tokens = sum(t[\"tokens\"] for t in traces)\n    total_latency_s\
      \ = sum(t[\"latency_s\"] for t in traces)\n    print(f\"Session {traces[0]['session_id']}:\
      \ {len(traces)} turns, {total_tokens} tokens, {total_latency_s:.2f}s total latency\"\
      )\nreturn total_tokens\n\nif __name__ == \"__main__\":\n    mock_traces = [{\"\
      session_id\": \"s1\", \"turn\": 1, \"tokens\": 120, \"latency_s\": 0.8}, {\"\
      session_id\": \"s1\", \"turn\": 2, \"tokens\": 250, \"latency_s\": 1.4}]\n \
      \   assert session_trace_aggregation(mock_traces) == 370"
  tasks:
  - title: 'Task 1: LangChain Callback Integration · MEDIUM'
    badge: EASY
    badge_class: tb-easy
    time: 45 mins
    prompt_html: "<p>\n        Write the code to add Langfuse tracing directly into\
      \ a LangChain execution.\n        <strong>\n         Bonus Task: Cost Tracking\
