  quizzes:
  - num_str: QUESTION 1 OF 4
    question: What is the primary vulnerability of LLM-as-a-Judge evaluation setups?
    qid: q157_1
    options:
    - letter: A
      text: Position bias, length bias (verbosity bias), and self-enhancement bias
        where judge models favor longer answers or options placed first.
      is_correct: true
    - letter: B
      text: Judge models refuse to evaluate code.
      is_correct: false
    - letter: C
      text: Judge models consume zero GPU memory.
      is_correct: false
    - letter: D
      text: Judge models always output identical 0 scores.
      is_correct: false
    correct_fb: ✅ Correct! LLM judges exhibit systematic biases (position preference,
      favoring verbose answers, and favoring outputs from their own model family).
    wrong_fb: ❌ Incorrect. LLM evaluation requires position swapping and length normalization
      to mitigate systematic judge biases.
  - num_str: QUESTION 2 OF 4
    question: How does Pairwise Evaluation with position swapping mitigate judge bias?
    qid: q157_2
    options:
    - letter: A
      text: By evaluating pairs as (A, B) and then as (B, A), averaging scores to
        cancel out positional preference.
      is_correct: true
    - letter: B
      text: By deleting all tie games from the dataset.
      is_correct: false
    - letter: C
      text: By using 100 different programming languages.
      is_correct: false
    - letter: D
      text: By running the judge in reverse alphabetical order.
      is_correct: false
    correct_fb: ✅ Correct! Swapping the presentation order ensures that position-dependent
      bias does not skew the win-rate benchmark.
    wrong_fb: ❌ Incorrect. Running evaluations in both candidate orders and averaging
      results is mandatory for unbiased pairwise judging.
  - num_str: QUESTION 3 OF 4
    question: What is G-Eval and how does it improve grading consistency over naive
      prompting?
    qid: q157_3
    options:
    - letter: A
      text: It uses Chain-of-Thought (CoT) with explicit, auto-generated scoring criteria
        and computes expected scores over token probabilities.
      is_correct: true
    - letter: B
      text: It grades answers using Google Search results only.
      is_correct: false
    - letter: C
      text: It limits grades to binary Pass/Fail only.
      is_correct: false
    - letter: D
      text: It eliminates prompt instructions completely.
      is_correct: false
    correct_fb: ✅ Correct! G-Eval (Liu et al.) generates structured evaluation rubrics
      and computes a continuous weighted probability score across numerical tokens.
    wrong_fb: ❌ Incorrect. G-Eval uses criteria-driven chain-of-thought and token
      probability weighting for reliable evaluation.
  - num_str: QUESTION 4 OF 4
    question: Why is calculating Cohen's Kappa ($\kappa$) or Spearman correlation
      with human annotations essential when benchmarking LLM judges?
    qid: q157_4
    options:
    - letter: A
      text: To quantify inter-annotator agreement and prove the automated judge correlates
        strongly with expert human ground-truth labels.
      is_correct: true
    - letter: B
      text: To measure the internet download speed of the judge server.
      is_correct: false
    - letter: C
      text: To calculate the electricity consumption of the evaluation run.
      is_correct: false
    - letter: D
      text: To encrypt the judge model weights.
      is_correct: false
    correct_fb: ✅ Correct! Measuring statistical correlation against human labels
      verifies that automated eval metrics reliably reflect real human judgment.
    wrong_fb: ❌ Incorrect. Correlation coefficients measure alignment between automated
      model rankings and expert human gold-standards.
  flashcards:
  - front: LLM-as-a-Judge
