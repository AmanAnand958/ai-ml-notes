  flashcards:
  - front: 'Core concept: What is the significance of Exact Cache in Semantic Caching?'
    back: Only hits if the string is identical. Useless for LLMs where users phrase
      things differently.
  - front: 'Core concept: What is the significance of Semantic Cache in Semantic Caching?'
    back: Uses a vector DB to find conceptually similar past queries, serving cached
      answers to save time and money.
  - front: 'Core concept: What is the significance of TTL (Cache) in Semantic Caching?'
    back: Time-to-Live. Semantic cache entries should expire (e.g. 24h) for time-sensitive
      questions. This establishes the core invariant in Semantic Caching, ensuring
      memory efficiency, numerical stability, and robust scaling.
  - front: How is Semantic Caching tested and validated in industrial ML pipelines
      (Day 160)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical
      tolerances (np.allclose at 1e-5), and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Semantic
      Caching in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation,
      resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
