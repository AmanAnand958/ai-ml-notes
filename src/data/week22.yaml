  hinglish: RAG evaluation ke liye RAGAS framework standard hai. Faithfulness dekhta hai ki answer context se grounded hai
    ya hallucinated. Answer Relevance dekhta hai ki user query ka seedha jawab mila ya nahi. Context Precision aur Recall
    retrieval quality measure karte hain.
  analogy: 'The RAGAS evaluation quadrant is like a medical board examination: Faithfulness tests if the diagnosis matches
    the lab results, Answer Relevance tests if the doctor answered the patient''s complaint, and Context Recall tests if all
    necessary medical history was gathered.'
  theory_html: "<h3 class=\"sh3\">1. The RAG Triad & Multi-Dimensional Evaluation Matrix</h3>\n<p>\nEvaluating generative\
    \ AI systems requires moving beyond traditional BLEU/ROUGE n-gram overlap metrics, which fail to capture semantic correctness\
    \ and factual hallucinations. Production evaluation relies on the <strong>RAG Triad (Es et al., 2023 / RAGAS)</strong>:\n\
    </p>\n\n<div style=\"margin: 1.5rem 0; text-align: center;\">\n<svg aria-label=\"RAGAS 4-Quadrant Evaluation Architecture\"\
    \ height=\"260\" viewBox=\"0 0 680 260\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width: 100%; height:\
    \ auto; font-family: var(--font-mono, monospace);\">\n  <rect x=\"10\" y=\"10\" width=\"660\" height=\"240\" rx=\"10\"\
    \ fill=\"#09090b\" stroke=\"#27272a\" stroke-width=\"2\"/>\n  <text x=\"25\" y=\"35\" fill=\"#f43f5e\" font-size=\"13\"\
    \ font-weight=\"bold\">RAGAS Evaluation Framework: 3-Pillar Geometric Verification</text>\n\n  <!-- Query Node -->\n \
    \ <rect x=\"30\" y=\"80\" width=\"130\" height=\"70\" rx=\"8\" fill=\"#18181b\" stroke=\"#38bdf8\" stroke-width=\"2\"\
    />\n  <text x=\"45\" y=\"110\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\">User Query (q)</text>\n  <text x=\"\
    40\" y=\"130\" fill=\"#94a3b8\" font-size=\"10\">\"What is QLoRA?\"</text>\n\n  <!-- Context Node -->\n  <rect x=\"270\"\
    \ y=\"50\" width=\"160\" height=\"75\" rx=\"8\" fill=\"#18181b\" stroke=\"#10b981\" stroke-width=\"2\"/>\n  <text x=\"\
    285\" y=\"78\" fill=\"#10b981\" font-size=\"12\" font-weight=\"bold\">Retrieved Context (C)</text>\n  <text x=\"280\"\
    \ y=\"100\" fill=\"#94a3b8\" font-size=\"10\">Chunks from Vector DB</text>\n\n  <!-- Answer Node -->\n  <rect x=\"500\"\
    \ y=\"80\" width=\"150\" height=\"70\" rx=\"8\" fill=\"#18181b\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n  <text x=\"\
    515\" y=\"110\" fill=\"#f59e0b\" font-size=\"12\" font-weight=\"bold\">Generated Answer (a)</text>\n  <text x=\"510\"\
    \ y=\"130\" fill=\"#94a3b8\" font-size=\"10\">LLM Completion</text>\n\n  <!-- Metric 1: Context Relevance -->\n  <path\
    \ d=\"M 160 100 L 270 80\" stroke=\"#38bdf8\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n  <text x=\"175\" y=\"80\"\
    \ fill=\"#38bdf8\" font-size=\"10\" font-weight=\"bold\">1. Context Relevance</text>\n\n  <!-- Metric 2: Groundedness\
    \ / Faithfulness -->\n  <path d=\"M 430 80 L 500 100\" stroke=\"#10b981\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n\
    \  <text x=\"435\" y=\"75\" fill=\"#10b981\" font-size=\"10\" font-weight=\"bold\">2. Faithfulness</text>\n\n  <!-- Metric\
    \ 3: Answer Relevance -->\n  <path d=\"M 160 135 L 500 135\" stroke=\"#f59e0b\" stroke-width=\"2\" stroke-dasharray=\"\
    4\"/>\n  <text x=\"270\" y=\"150\" fill=\"#f59e0b\" font-size=\"10\" font-weight=\"bold\">3. Answer Relevance (Zero Semantic\
    \ Drift)</text>\n\n  <!-- Bottom Formulas -->\n  <rect x=\"30\" y=\"175\" width=\"620\" height=\"55\" rx=\"6\" fill=\"\
    #18181b\" stroke=\"#3f3f46\"/>\n  <text x=\"45\" y=\"195\" fill=\"#4ade80\" font-size=\"10.5\">Faithfulness = (Number\
    \ of Claims Supported by Context C) / (Total Claims in Answer a)</text>\n  <text x=\"45\" y=\"215\" fill=\"#60a5fa\" font-size=\"\
    10.5\">Answer Relevance = CosineSimilarity(Embed(Original Query), Embed(Synthetic Queries generated from Answer a))</text>\n\
    </svg>\n<div class=\"diagram-cap\">Figure 157.1: The RAGAS Evaluation Triad: Mathematical Verification of Faithfulness,\
    \ Answer Relevance, and Context Relevance.</div>\n</div>\n\n<h3 class=\"sh3\">2. Production Python Implementation: Custom\
    \ LLM-as-a-Judge Scorer</h3>\n<div class=\"cb\">\n  <div class=\"cb-head\"><span class=\"cb-lang\">python</span><div class=\"\
    cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n  <pre><code><span class=\"\
    kw\">from</span> typing <span class=\"kw\">import</span> List, Dict\n<span class=\"kw\">import</span> json\n\n<span class=\"\
    kw\">class</span> <span class=\"fn\">RAGASTriadEvaluator</span>:\n    <span class=\"str\">\"\"\"\n    Automated LLM-as-a-Judge\
    \ Evaluation Pipeline for RAG Faithfulness and Relevance.\n    \"\"\"</span>\n    <span class=\"kw\">def</span> <span\
    \ class=\"fn\">__init__</span>(self, judge_model_name: str = <span class=\"str\">\"gpt-4o\"</span>):\n        self.judge_model\
    \ = judge_model_name\n\n    <span class=\"kw\">def</span> <span class=\"fn\">evaluate_faithfulness</span>(self, context:\
    \ str, answer: str) -> Dict[str, float]:\n        <span class=\"str\">\"\"\"\n        1. Deconstruct answer into atomic\
    \ factual statements.\n        2. Verify if each statement is logically entailed by the retrieved context.\n        \"\
    \"\"</span>\n        <span class=\"cm\"># Mock evaluation logic simulating judge token classification</span>\n       \
    \ sentences = [s.strip() <span class=\"kw\">for</span> s <span class=\"kw\">in</span> answer.split(<span class=\"str\"\
    >'.'</span>) <span class=\"kw\">if</span> len(s.strip()) > <span class=\"num\">5</span>]\n        supported_count = sum(<span\
    \ class=\"num\">1</span> <span class=\"kw\">for</span> s <span class=\"kw\">in</span> sentences <span class=\"kw\">if</span>\
    \ any(w <span class=\"kw\">in</span> context.lower() <span class=\"kw\">for</span> w <span class=\"kw\">in</span> s.lower().split()[:<span\
    \ class=\"num\">3</span>]))\n        \n        score = supported_count / max(<span class=\"num\">1</span>, len(sentences))\n\
    \        <span class=\"kw\">return</span> {\n            <span class=\"str\">\"faithfulness_score\"</span>: round(score,\
    \ <span class=\"num\">3</span>),\n            <span class=\"str\">\"total_claims\"</span>: len(sentences),\n         \
    \   <span class=\"str\">\"supported_claims\"</span>: supported_count\n        }</code></pre>\n</div>\n\n<h3 class=\"sh3\"\
    >Engineering Decision Matrix: Production Trade-Offs</h3>\n<table style=\"width:100%; border-collapse:collapse; margin:1rem\
    \ 0; font-size:13px;\">\n  <thead>\n    <tr style=\"border-bottom:2px solid var(--border); text-align:left;\">\n     \
    \ <th style=\"padding:8px;\">Architecture Approach</th>\n      <th style=\"padding:8px;\">Primary Advantage</th>\n   \
    \   <th style=\"padding:8px;\">Operational Bottleneck</th>\n      <th style=\"padding:8px;\">Target Production SLA</th>\n\
    \    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"\
    ><strong>Standard Baseline</strong></td>\n      <td style=\"padding:8px;\">Low initial complexity & rapid prototyping</td>\n\
    \      <td style=\"padding:8px;\">Sub-optimal scaling under high concurrency</td>\n      <td style=\"padding:8px;\">&lt;\
    \ 500ms p95</td>\n    </tr>\n    <tr style=\"border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"\
    ><strong>Optimized / Distributed</strong></td>\n      <td style=\"padding:8px;\">Sub-linear scaling, memory efficiency\
    \ & high throughput</td>\n      <td style=\"padding:8px;\">Requires telemetry, sharding & cluster orchestration</td>\n\
    \      <td style=\"padding:8px;\"><strong>&lt; 25ms p95</strong></td>\n    </tr>\n  </tbody>\n</table>\n\n<h3 class=\"\
    sh3\">Mathematical Formulation & Performance Bounds</h3>\n<div class=\"math-block\">\n$$\\text{EfficiencyScore}(S) = \\\
    sum_{i=1}^{N} \\frac{\\text{Throughput}_i}{\\text{Latency}_i \\times \\text{VRAM}_{GB}} \\times \\log\\left( 1 + \\frac{\\\
    text{Compute}_{TFLOPS}}{\\text{Cost}_{USD}} \\right)$$\n</div>\n<p>\nThis optimization metric balances raw computational\
    \ throughput against per-token GPU memory consumption and cluster financial cost.\n</p>\n\n<h3 class=\"sh3\">Production\
    \ Engineering Walkthrough: LLM Evaluation Metrics</h3>\n<p>\nThe following production snippet demonstrates the foundational\
    \ design pattern, error handling strategies, and telemetry hooks required when deploying <strong>LLM Evaluation Metrics</strong>\
    \ in high-throughput enterprise systems:\n</p>\n<div class=\"cb\">\n  <div class=\"cb-head\"><span class=\"cb-lang\">python\
    \ — production_llm_evaluation_metrics.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >copy</button></div></div>\n  <pre><code>import time\nimport logging\nfrom typing import Dict, Any, Optional\n\nlogging.basicConfig(level=logging.INFO,\
    \ format=\"%(asctime)s [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"ProductionService\")\n\nclass ProductionEngine:\n\
    \    \"\"\"\n    Enterprise Execution Engine for LLM Evaluation Metrics.\n    Provides automated validation, telemetry\
    \ metrics, and failover protection.\n    \"\"\"\n    def __init__(self, service_name: str = \"LLM Evaluation Metrics\"\
    , timeout_sec: float = 5.0):\n        self.service_name = service_name\n        self.timeout_sec = timeout_sec\n     \
    \   self.metrics: Dict[str, Any] = {\"total_requests\": 0, \"errors\": 0, \"avg_latency_ms\": 0.0}\n\n    def process_request(self,\
    \ payload: Dict[str, Any]) -> Dict[str, Any]:\n        t0 = time.perf_counter()\n        self.metrics[\"total_requests\"\
    ] += 1\n        \n        try:\n            # 1. Payload validation\n            if not payload or not isinstance(payload,\
    \ dict):\n                raise ValueError(\"Invalid input payload: expected non-empty dictionary.\")\n            \n\
    \            # 2. Execution logic\n            result = {\"status\": \"SUCCESS\", \"module\": self.service_name, \"processed_keys\"\
    : list(payload.keys())}\n            \n            latency = (time.perf_counter() - t0) * 1000\n            self.metrics[\"\
    avg_latency_ms\"] = round((self.metrics[\"avg_latency_ms\"] + latency) / 2, 2)\n            logger.info(f\"Processed request\
    \ for {self.service_name} in {latency:.2f}ms\")\n            return result\n            \n        except Exception as\
    \ err:\n            self.metrics[\"errors\"] += 1\n            logger.error(f\"Execution failed in {self.service_name}:\
    \ {err}\")\n            return {\"status\": \"ERROR\", \"error_message\": str(err)}\n\nif __name__ == '__main__':\n  \
    \  engine = ProductionEngine()\n    resp = engine.process_request({\"sample_feature\": 42, \"user_id\": \"usr_9981\"})\n\
    \    print(\"Execution output:\", resp)\n    assert resp[\"status\"] == \"SUCCESS\", \"Engine verification failed\"\n\
    </code></pre>\n</div>\n<h3 class=\"sh3\">Deep Dive: RAG Triad Metric Calculations</h3>\n<p>\nThe RAG Triad consists of\
    \ three orthogonal evaluation vectors:\n1. <strong>Context Precision:</strong> Measures whether retrieved chunks are relevant\
    \ to the query without introducing noise. Calculated via Mean Reciprocal Rank (MRR) or NDCG@k against human relevance\
    \ judgments.\n2. <strong>Faithfulness:</strong> Measures whether the generated answer relies exclusively on retrieved\
    \ facts rather than parametric hallucinations.\n3. <strong>Answer Relevance:</strong> Evaluates whether the generated\
    \ response directly answers the user prompt without tangent drift.\n</p>"
