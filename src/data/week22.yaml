    question: If a 7B model is quantized to 4-bit, how much VRAM do the weights take?
    answer: 3.5GB
    explanation: Approximately 3.5GB to 4GB VRAM for 4-bit weight tensors (7B * 0.5
      bytes = 3.5GB).
    code: "import math\n\ndef calculate_13b_vram_and_throughput(\n    params_billion:\
      \ float = 13.0,\n    bits_per_param: int = 16,        # FP16 = 16 bits (2 bytes)\n\
      \    context_window: int = 4096,\n    batch_size: int = 16,\n    num_layers:\
      \ int = 40,\n    num_heads: int = 40,\n    head_dim: int = 128\n):\n    # 1.\
      \ Model Weights Memory\n    bytes_per_param = bits_per_param / 8.0\n    weights_gb\
      \ = (params_billion * 10**9 * bytes_per_param) / (1024**3)\n    \n    # 2. KV\
      \ Cache Memory\n    bytes_per_kv_element = 2.0 # FP16 KV cache\n    kv_cache_bytes_per_token\
      \ = 2 * num_layers * num_heads * head_dim * bytes_per_kv_element\n    total_kv_bytes\
      \ = kv_cache_bytes_per_token * context_window * batch_size\n    kv_cache_gb\
      \ = total_kv_bytes / (1024**3)\n    \n    # 3. Activation Overhead & CUDA Context\
      \ (~20%)\n    overhead_gb = (weights_gb + kv_cache_gb) * 0.20\n    \n    total_vram_gb\
      \ = weights_gb + kv_cache_gb + overhead_gb\n    gpus_needed_80gb = math.ceil(total_vram_gb\
      \ / 80.0)\n    print(f\"Total VRAM Required: {total_vram_gb:.2f} GB (Recommend:\
      \ {gpus_needed_80gb}x 80GB GPU)\")\n    return total_vram_gb\n\nif __name__\
      \ == \"__main__\":\n    assert calculate_13b_vram_and_throughput() > 20.0"
