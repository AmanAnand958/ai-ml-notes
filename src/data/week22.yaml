    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Build an automated PII anonymization\
      \ pipeline masking credit cards, emails, and IPv4 addresses.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
      >\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
      \ onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
      >\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"cm\"># Step 1: Algorithmic Implementation\
      \ &amp; Core Transformations</span>\n<span class=\"kw\">import</span> re\n\n<span class=\"kw\">def</span> <span class=\"\
      fn\">anonymize_pii_payload</span>(text: str) -&gt; dict:\n    patterns = {\n        <span class=\"str\">\"EMAIL\": r'</span>[a-zA-Z0-9_.+-]+@[a-zA-Z0-<span\
      \ class=\"num\">9</span>-]+\\.[a-zA-Z0-<span class=\"num\">9</span>-.]+',\n        <span class=\"str\">\"CREDIT_CARD\"\
      : r'</span>(?:\\d{<span class=\"num\">4</span>}[ -]?){<span class=\"num\">3</span>}\\d{<span class=\"num\">4</span>}',\n\
      \        <span class=\"str\">\"IPV4\": r'</span>(?:\\d{<span class=\"num\">1</span>,<span class=\"num\">3</span>}\\\
      .){<span class=\"num\">3</span>}\\d{<span class=\"num\">1</span>,<span class=\"num\">3</span>}'\n    }\n    \n    anonymized\
      \ = text\n    entities_found = []\n    \n    <span class=\"kw\">for</span> entity_type, pattern <span class=\"kw\">in</span>\
      \ patterns.<span class=\"fn\">items</span>():\n        matches = <span class=\"fn\">list</span>(re.<span class=\"fn\"\
      >finditer</span>(pattern, anonymized))\n        <span class=\"kw\">for</span> m <span class=\"kw\">in</span> <span class=\"\
      fn\">reversed</span>(matches):\n            entities_found.<span class=\"fn\">append</span>({<span class=\"str\">\"\
      type\": entity_type, \"val\"</span>: m.<span class=\"fn\">group</span>(<span class=\"num\">0</span>)})\n           \
      \ anonymized = anonymized[:m.<span class=\"fn\">start</span>()] + <span class=\"str\">f\"\"</span> + anonymized[m.<span\
      \ class=\"fn\">end</span>():]\n            \n<span class=\"kw\">return</span> {<span class=\"str\">\"clean_text\": anonymized,\
      \ \"masked_entities\"</span>: entities_found}\n\nraw = <span class=\"str\">\"User john.doe@fintech.com with IP 192.168.1.55\
      \ requested refund on card 4532-8891-2384-9912.\"</span>\n<span class=\"fn\">print</span>(<span class=\"str\">\"Anonymized\
      \ Payload:\"</span>, <span class=\"fn\">anonymize_pii_payload</span>(raw))</pre>\n</div>\n<div style=\"margin-top:1rem;\
      \ padding:10px; background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono);\
      \ font-size:12px;\">\n<strong>\n         Expected Verification Output:\n        </strong>\n<br/>\n\n         Anonymized\
      \ Payload: {'clean_text': 'User\n         <email>\n          with IP\n          <ipv4>\n           ...', ...}\n    \
      \      </ipv4>\n</email>\n</div>"
    done_when: 'When code executes without errors, passes all unit assertions, and prints verified output metrics for Task
      2: Implement Output Guardrails.'
    git_cmd: 'git add . && git commit -m "feat(day159): implement task-2-implement-output-guardr"'
    sol_id: sol-w22d159t2
    solution_title: 'Production Implementation — Task 2: Implement Output Guardrails'
    solution_code: "# Day 159 Task 2: Multi-Layer Output Safety Guardrail Engine\nfrom typing import Dict, Any\nimport re\n\
      \nclass OutputSafetyGuardrail:\n    def __init__(self, blocked_keywords: list = None):\n        self.blocked = blocked_keywords\
      \ or [\"private_key\", \"ssn\", \"password\", \"drop table\"]\n\n    def validate_response(self, response_text: str,\
      \ context_chunks: list) -> Dict[str, Any]:\n        resp_lower = response_text.lower()\n        \n        # 1. PII /\
      \ Secret leak check\n        if any(b in resp_lower for b in self.blocked):\n            return {\"is_safe\": False,\
      \ \"reason\": \"SECURITY_VIOLATION_PII\", \"filtered_text\": \"[REDACTED]\"}\n\n        # 2. Hallucination check against\
      \ context\n        ctx_all = \" \".join(context_chunks).lower()\n        named_entities = re.findall(r'\b[A-Z][a-z]+\b\
      ', response_text)\n        ungrounded = [e for e in named_entities if e.lower() not in ctx_all]\n        \n        if\
      \ len(ungrounded) > 3:\n            return {\"is_safe\": False, \"reason\": \"POTENTIAL_HALLUCINATION\", \"ungrounded_entities\"\
      : ungrounded}\n\n        return {\"is_safe\": True, \"reason\": \"PASSED\", \"filtered_text\": response_text}\n\nguard\
      \ = OutputSafetyGuardrail()\nsafe_res = guard.validate_response(\"FlashAttention uses SRAM memory.\", [\"FlashAttention\
      \ is an SRAM tiling algorithm.\"])\nunsafe_res = guard.validate_response(\"Here is the secret password for admin.\"\
      , [\"Context\"])\n\nprint(f\"Safe Check: {safe_res['is_safe']} | Unsafe Check: {unsafe_res['is_safe']}\")\nassert safe_res[\"\
      is_safe\"] is True and unsafe_res[\"is_safe\"] is False\nprint(\"✓ Multi-layer output safety guardrail verified.\")"
    solution_lang: python
