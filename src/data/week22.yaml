      testing, and safe rollback mechanisms.
  - num_str: QUESTION 3 OF 4
    question: In automated LLM testing, what is a 'Fuzzy Match' or 'Semantic Assertion'?
    qid: q162_3
    options:
    - letter: A
      text: Asserting that the model output is semantically equivalent to expected
        ground truth (e.g. via embedding distance or LLM grading) rather than exact
        string equality.
      is_correct: true
    - letter: B
      text: Checking if a string has spelling errors.
      is_correct: false
    - letter: C
      text: Asserting that the code compiles without warnings.
      is_correct: false
    - letter: D
      text: Testing network ping latency.
      is_correct: false
    correct_fb: ✅ Correct! Because generative models use non-deterministic sampling,
      semantic assertions verify meaning rather than brittle character-by-character
      matches.
    wrong_fb: ❌ Incorrect. Semantic assertions test conceptual correctness and factual
      containment without requiring rigid exact string equality.
  - num_str: QUESTION 4 OF 4
    question: How does CI/CD integration prevent breaking prompt regressions from
      reaching production?
    qid: q162_4
    options:
    - letter: A
      text: By executing automated eval suites (evaluating accuracy, faithfulness,
        safety) as GitHub Actions build steps that block PR merges on score drops.
      is_correct: true
    - letter: B
      text: By disabling the merge button permanently.
      is_correct: false
    - letter: C
      text: By requiring all code to be written in assembly.
      is_correct: false
    - letter: D
      text: By shutting down the production server during tests.
      is_correct: false
    correct_fb: ✅ Correct! Automated evaluation gates block pull requests if accuracy
      or safety metrics drop below established production thresholds.
    wrong_fb: ❌ Incorrect. Automated CI evaluation steps enforce quantitative quality
      gates before code is deployed.
  flashcards:
  - front: FP16 Size
    back: 2 bytes per parameter (1B params = 2GB).
  - front: Total VRAM Formula
    back: VRAM = (Model Weights Size) + (KV Cache Size) + (Activations/Overhead)
  - front: Tensor Parallelism
    back: Sharding a model's weight matrices across multiple GPUs so one layer fits.
      Required for 70B+ models on <80GB GPUs.
