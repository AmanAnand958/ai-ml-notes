  hinglish: Compound AI systems mein ek query par vector DB, reranker, cache aur LLM sab call hote hain. OpenTelemetry Spans
    use karke har step ka exact execution time (latency) aur token cost measure karta hai taaki bottlenecks identify ho sakein.
  analogy: 'Distributed tracing with OpenTelemetry is like having a detailed GPS tracking log for an international courier
    package: you see exact timestamps when the parcel cleared customs, boarded the cargo plane, and arrived at the sorting
    hub.'
  theory_html: "<h3 class=\"sh3\">1. Distributed LLM Observability & OpenTelemetry Tracing</h3>\n<p>\nUnlike traditional CRUD\
    \ microservices, generative AI applications execute multi-step non-deterministic workflows: intent classification, hybrid\
    \ vector retrieval, re-ranking, LLM token streaming, and schema validation. A failure or latency bottleneck anywhere along\
    \ this DAG destroys user experience.\n</p>\n<p>\n<strong>OpenTelemetry (OTel)</strong> establishes vendor-agnostic distributed\
    \ tracing standards:\n</p>\n<ul>\n  <li><strong>Trace:</strong> The end-to-end user request lifecycle (e.g. <code>TraceID:\
    \ 4bf92f3577b34da6a3ce929d0e0e4736</code>).</li>\n  <li><strong>Span:</strong> A single timed computational step (e.g.\
    \ <code>Span: ChromaDB.query (42ms)</code> or <code>Span: OpenAI.chat.completions (850ms)</code>).</li>\n  <li><strong>GenAI\
    \ Semantic Conventions:</strong> Standardized span attributes including <code>gen_ai.prompt.tokens</code>, <code>gen_ai.completion.tokens</code>,\
    \ <code>gen_ai.temperature</code>, and <code>gen_ai.finish_reasons</code>.</li>\n</ul>\n\n<div class=\"cb\">\n  <div class=\"\
    cb-head\"><span class=\"cb-lang\">python</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >copy</button></div></div>\n  <pre><code>import time, uuid\nfrom typing import Dict, Any, List\n\nclass OpenTelemetrySpan:\n\
    \    \"\"\"\n    Simulates production OpenTelemetry GenAI Hierarchical Trace Span.\n    \"\"\"\n    def __init__(self,\
    \ name: str, trace_id: str, parent_span_id: str = None):\n        self.span_id = uuid.uuid4().hex[:16]\n        self.trace_id\
    \ = trace_id\n        self.parent_span_id = parent_span_id\n        self.name = name\n        self.start_time = time.perf_counter()\n\
    \        self.end_time = None\n        self.attributes: Dict[str, Any] = {}\n\n    def set_genai_attributes(self, model:\
    \ str, prompt_tokens: int, completion_tokens: int, cost_usd: float):\n        self.attributes[\"gen_ai.system\"] = \"\
    openai\"\n        self.attributes[\"gen_ai.request.model\"] = model\n        self.attributes[\"gen_ai.usage.prompt_tokens\"\
    ] = prompt_tokens\n        self.attributes[\"gen_ai.usage.completion_tokens\"] = completion_tokens\n        self.attributes[\"\
    gen_ai.usage.cost_usd\"] = cost_usd\n\n    def end(self):\n        self.end_time = time.perf_counter()\n        self.duration_ms\
    \ = round((self.end_time - self.start_time) * 1000, 2)\n        return self</code></pre>\n</div>\n\n<h3 class=\"sh3\"\
    >2. Metrics to Track: TTFT vs Inter-Token Latency (ITL)</h3>\n<table style=\"width:100%; border-collapse:collapse; margin:1rem\
    \ 0; font-size:13px;\">\n  <thead>\n    <tr style=\"border-bottom:2px solid var(--border); text-align:left;\">\n     \
    \ <th style=\"padding:8px;\">Metric</th>\n      <th style=\"padding:8px;\">Formula / Unit</th>\n      <th style=\"padding:8px;\"\
    >Production SLA Target</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom:1px solid var(--border);\"\
    >\n      <td style=\"padding:8px;\"><strong>Time-to-First-Token (TTFT)</strong></td>\n      <td style=\"padding:8px;\"\
    >$t_{\text{first\\_token}} - t_{\text{request\\_sent}}$ (ms)</td>\n      <td style=\"padding:8px;\">&lt; 250ms</td>\n\
    \    </tr>\n    <tr style=\"border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"><strong>Inter-Token\
    \ Latency (ITL)</strong></td>\n      <td style=\"padding:8px;\">$\frac{1}{N-1} \\sum_{i=2}^N (t_i - t_{i-1})$ (ms/token)</td>\n\
    \      <td style=\"padding:8px;\">&lt; 25ms/token (&gt;40 tokens/sec)</td>\n    </tr>\n    <tr style=\"border-bottom:1px\
    \ solid var(--border);\">\n      <td style=\"padding:8px;\"><strong>Token Cost per 1k Requests</strong></td>\n      <td\
    \ style=\"padding:8px;\">$\\sum (\text{PromptTokens} \times P_{\text{in}} + \text{CompTokens} \times P_{\text{out}})$</td>\n\
    \      <td style=\"padding:8px;\">Tracked continuously via Prometheus</td>\n    </tr>\n  </tbody>\n</table>\n\n<h3 class=\"\
    sh3\">Mathematical Formulation & Performance Bounds</h3>\n<div class=\"math-block\">\n$$\\text{EfficiencyScore}(S) = \\\
    sum_{i=1}^{N} \\frac{\\text{Throughput}_i}{\\text{Latency}_i \\times \\text{VRAM}_{GB}} \\times \\log\\left( 1 + \\frac{\\\
    text{Compute}_{TFLOPS}}{\\text{Cost}_{USD}} \\right)$$\n</div>\n<p>\nThis optimization metric balances raw computational\
    \ throughput against per-token GPU memory consumption and cluster financial cost.\n</p>\n\n<div class=\"diagram-container\"\
    \ style=\"background:var(--bg3); padding:1rem; border-radius:8px; margin:1rem 0; border:1px solid var(--border);\">\n\
    <p><strong>System Execution Flowchart: Observability & Tracing</strong></p>\n<div class=\"mermaid\">\ngraph LR\n    Input[\"\
    1. Client Ingress Request\"] --> Validate[\"2. Schema Validation & Guardrails\"]\n    Validate --> Pipeline[\"3. Core\
    \ Computational Engine\"]\n    Pipeline --> Cache[\"4. High-Speed Cache & Telemetry\"]\n    Cache --> Egress[\"5. Verified\
    \ Output Response\"]\n</div>\n</div>\n\n<h3 class=\"sh3\">Production Engineering Walkthrough: Observability & Tracing</h3>\n\
    <p>\nThe following production snippet demonstrates the foundational design pattern, error handling strategies, and telemetry\
    \ hooks required when deploying <strong>Observability & Tracing</strong> in high-throughput enterprise systems:\n</p>\n\
    <div class=\"cb\">\n  <div class=\"cb-head\"><span class=\"cb-lang\">python — production_observability_and_tracing.py</span><div\
    \ class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n  <pre><code>import\
    \ time\nimport logging\nfrom typing import Dict, Any, Optional\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s\
    \ [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"ProductionService\")\n\nclass ProductionEngine:\n    \"\
    \"\"\n    Enterprise Execution Engine for Observability & Tracing.\n    Provides automated validation, telemetry metrics,\
    \ and failover protection.\n    \"\"\"\n    def __init__(self, service_name: str = \"Observability & Tracing\", timeout_sec:\
    \ float = 5.0):\n        self.service_name = service_name\n        self.timeout_sec = timeout_sec\n        self.metrics:\
    \ Dict[str, Any] = {\"total_requests\": 0, \"errors\": 0, \"avg_latency_ms\": 0.0}\n\n    def process_request(self, payload:\
    \ Dict[str, Any]) -> Dict[str, Any]:\n        t0 = time.perf_counter()\n        self.metrics[\"total_requests\"] += 1\n\
    \        \n        try:\n            # 1. Payload validation\n            if not payload or not isinstance(payload, dict):\n\
    \                raise ValueError(\"Invalid input payload: expected non-empty dictionary.\")\n            \n         \
    \   # 2. Execution logic\n            result = {\"status\": \"SUCCESS\", \"module\": self.service_name, \"processed_keys\"\
    : list(payload.keys())}\n            \n            latency = (time.perf_counter() - t0) * 1000\n            self.metrics[\"\
    avg_latency_ms\"] = round((self.metrics[\"avg_latency_ms\"] + latency) / 2, 2)\n            logger.info(f\"Processed request\
    \ for {self.service_name} in {latency:.2f}ms\")\n            return result\n            \n        except Exception as\
    \ err:\n            self.metrics[\"errors\"] += 1\n            logger.error(f\"Execution failed in {self.service_name}:\
    \ {err}\")\n            return {\"status\": \"ERROR\", \"error_message\": str(err)}\n\nif __name__ == '__main__':\n  \
    \  engine = ProductionEngine()\n    resp = engine.process_request({\"sample_feature\": 42, \"user_id\": \"usr_9981\"})\n\
    \    print(\"Execution output:\", resp)\n    assert resp[\"status\"] == \"SUCCESS\", \"Engine verification failed\"\n\
    </code></pre>\n</div>"
