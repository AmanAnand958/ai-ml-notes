    back: • Time-to-Live.<br/>• Semantic cache entries should expire (e. g. 24h) for time-sensitive questions. This establishes
      the core invariant in Semantic Caching, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: How is Semantic Caching tested and validated in industrial ML pipelines (Day 160)?
    back: • Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.<br/>• allclose at 1e-5),
      and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Semantic Caching in distributed systems?'
    back: • Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
