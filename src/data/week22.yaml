    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Implement algorithmic Context\
      \ Recall measuring the proportion of reference ground truth sentences matched by retrieved passages.\n       </p>\n\
      <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"\
      cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"\
      run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\">def</span>\
      \ <span class=\"fn\">calculate_context_recall</span>(ground_truth_sentences: list, retrieved_context: str) -&gt; float:\n\
      \    context_lower = retrieved_context.<span class=\"fn\">lower</span>()\n    matched = <span class=\"num\">0</span>\n\
      <span class=\"kw\">for</span> s <span class=\"kw\">in</span> ground_truth_sentences:\n        words = s.<span class=\"\
      fn\">lower</span>().<span class=\"fn\">split</span>()\n        <span class=\"cm\"># Sentence is supported if 60% key\
      \ words present in context</span>\n        present = <span class=\"fn\">sum</span>(<span class=\"num\">1</span> <span\
      \ class=\"kw\">for</span> w <span class=\"kw\">in</span> words <span class=\"kw\">if</span> w <span class=\"kw\">in</span>\
      \ context_lower)\n        <span class=\"kw\">if</span> present / <span class=\"fn\">max</span>(<span class=\"num\">1</span>,\
      \ <span class=\"fn\">len</span>(words)) >= <span class=\"num\">0.60</span>:\n            matched += <span class=\"num\"\
      >1</span>\n<span class=\"kw\">return</span> <span class=\"fn\">round</span>(matched / <span class=\"fn\">max</span>(<span\
      \ class=\"num\">1</span>, <span class=\"fn\">len</span>(ground_truth_sentences)), <span class=\"num\">4</span>)\n\n\
      gt = [\n    <span class=\"str\">\"LoRA freezes pretrained model weights\"</span>,\n    <span class=\"str\">\"LoRA injects\
      \ rank decomposition matrices into Transformer layers\"</span>,\n    <span class=\"str\">\"LoRA increases inference\
      \ latency by 50%\"</span>\n]\nctx = <span class=\"str\">\"LoRA freezes original pretrained weights and injects low-rank\
      \ decomposition matrices into attention layers without adding inference latency.\"</span>\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">\"Context Recall Score:\"</span>, <span class=\"fn\">calculate_context_recall</span>(gt, ctx))</pre>\n\
      </div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05); border-left:3px solid var(--green);\
      \ border-radius:4px; font-family:var(--font-mono); font-size:12px;\">\n<strong>\n         Expected Verification Output:\n\
      \        </strong>\n<br/>\n\n         Context Recall Score: 0.6667\n        \n</div>"
    done_when: 'When code executes without errors, passes all unit assertions, and prints verified output metrics for Task
      2: Implement LLM Evaluation Metrics.'
    git_cmd: 'git add . && git commit -m "feat(day157): implement task-2-implement-llm-evaluatio"'
    sol_id: sol-w22d157t2
    solution_title: 'Production Implementation — Task 2: Implement LLM Evaluation Metrics'
    solution_code: "\"\"\"\nProduction Implementation: RAG Triad Evaluator (Relevance & Recall)\nModule: Day 157 — LLM Evaluation\
      \ Metrics & Benchmarks\n\"\"\"\n\nfrom typing import List\n\ndef compute_context_recall(ground_truth_points: List[str],\
      \ retrieved_context: str) -> float:\n    ctx_lower = retrieved_context.lower()\n    matched = sum(1 for p in ground_truth_points\
      \ if any(w in ctx_lower for w in p.lower().split() if len(w) > 3))\n    return round(matched / max(1, len(ground_truth_points)),\
      \ 4)\n\ndef compute_answer_relevance(query: str, answer: str) -> float:\n    q_words = set(w for w in query.lower().split()\
      \ if len(w) > 2)\n    a_words = set(w for w in answer.lower().split() if len(w) > 2)\n    intersection = q_words.intersection(a_words)\n\
      \    return round(len(intersection) / max(1, len(q_words)), 4)\n\nif __name__ == '__main__':\n    query = \"What is\
      \ the primary advantage of PagedAttention?\"\n    answer = \"PagedAttention eliminates external memory fragmentation\
      \ in GPU VRAM.\"\n    ground_truth = [\"eliminates fragmentation\", \"manages KV cache blocks\"]\n    context = \"PagedAttention\
      \ allocates non-contiguous physical memory blocks to eliminate GPU VRAM fragmentation.\"\n    \n    recall = compute_context_recall(ground_truth,\
      \ context)\n    relevance = compute_answer_relevance(query, answer)\n    print(f\"Context Recall: {recall} | Answer\
      \ Relevance: {relevance}\")\n    assert recall >= 0.5 and relevance >= 0.5\n    print(\"✓ RAG Triad metric evaluation\
      \ passed!\")\n"
    solution_lang: python
