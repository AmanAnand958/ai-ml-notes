    - Always profile memory footprint, latency bottlenecks, and numerical edge cases for System Design Math.
    - Validate downstream integration tests and establish automated performance benchmark gates.
    - Always calculate KV cache sizing ($2 \times L \times H \times d \times B \times S$) when sizing GPU VRAM for multi-user
      LLM serving.
