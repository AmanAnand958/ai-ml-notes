    git_cmd: 'git add . &amp;&amp; git commit -m "day158: complete hands-on task implementation"'
    sol_id: sol-w22d158t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "# Solution for Task: LangChain Callback Integration\nclass LangSmithTracingCallbackHandler:\n\
      \    def __init__(self, project_name: str = \"llm-eval-suite\"):\n        self.project\
      \ = project_name\n\ndef on_llm_start(self, prompt: str):\n        print(f\"\
      [LangSmith Trace: {self.project}] Execution started for prompt: '{prompt[:30]}...'\"\
      )\n\ndef on_llm_end(self, output: str, latency_ms: float):\n        print(f\"\
      [LangSmith Trace: {self.project}] Latency: {latency_ms:.2f}ms | Output generated.\"\
      )\n\ntracer = LangSmithTracingCallbackHandler()\ntracer.on_llm_start(\"Explain\
      \ LiteLLM Proxy routing\")\ntracer.on_llm_end(\"LiteLLM routes completions across\
      \ fallback models.\", latency_ms=145.2)"
    solution_lang: python
  - title: 'Task 2: Implement Observability & Tracing'
    badge: ''
    badge_class: tb-med
    time: ''
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\"\
      >\n        Write a Python decorator that captures execution latency, token counts,\
      \ and error metadata in standard OTel span format.\n       </p>\n<div class=\"\
      cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          pseudocode\n\
      \         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
      copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\"\
      \ onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n\
      </div>\n<pre><span class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core\
      \ Transformations</span>\n<span class=\"kw\">import</span> time\n<span class=\"\
      kw\">from</span> functools <span class=\"kw\">import</span> wraps\n\n<span class=\"\
      kw\">def</span> <span class=\"fn\">trace_llm_span</span>(span_name: str):\n\
      <span class=\"kw\">def</span> <span class=\"fn\">decorator</span>(func):\n \
      \       @<span class=\"fn\">wraps</span>(func)\n<span class=\"kw\">def</span>\
      \ <span class=\"fn\">wrapper</span>(*args, **kwargs):\n            start = time.<span\
      \ class=\"fn\">perf_counter</span>()\n            status = <span class=\"str\"\
      >\"OK\"</span>\n            error_msg = <span class=\"kw\">None</span>\n<span\
      \ class=\"kw\">try</span>:\n                result = <span class=\"fn\">func</span>(*args,\
      \ **kwargs)\n<span class=\"kw\">return</span> result\n            <span class=\"\
      kw\">except</span> Exception <span class=\"kw\">as</span> e:\n             \
      \   status = <span class=\"str\">\"ERROR\"</span>\n                error_msg\
      \ = <span class=\"fn\">str</span>(e)\n                <span class=\"kw\">raise</span>\n\
      <span class=\"kw\">finally</span>:\n                duration_ms = (time.<span\
      \ class=\"fn\">perf_counter</span>() - start) * <span class=\"num\">1000</span>\n\
      <span class=\"fn\">print</span>(<span class=\"str\">f\"[OTel Trace: {span_name}]\
      \ Status: {status} | Duration: {duration_ms:.2f}ms | Error: {error_msg}\"</span>)\n\
      <span class=\"kw\">return</span> wrapper\n<span class=\"kw\">return</span> decorator\n\
      \n@<span class=\"fn\">trace_llm_span</span>(<span class=\"str\">\"OpenAI_ChatCompletion\"\
      </span>)\n<span class=\"kw\">def</span> <span class=\"fn\">call_mock_llm</span>(prompt:\
      \ str):\n    time.<span class=\"fn\">sleep</span>(<span class=\"num\">0.05</span>)\n\
      <span class=\"kw\">return</span> <span class=\"str\">\"LLM Response Generated\"\
      </span>\n\n<span class=\"fn\">call_mock_llm</span>(<span class=\"str\">\"Summarize\
      \ quantum computing\"</span>)</pre>\n</div>\n<div style=\"margin-top:1rem; padding:10px;\
      \ background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px;\
      \ font-family:var(--font-mono); font-size:12px;\">\n<strong>\n         Expected\
      \ Verification Output:\n        </strong>\n<br/>\n\n         [OTel Trace: OpenAI_ChatCompletion]\
      \ Status: OK | Duration: 50.xxms | Error: None\n        \n</div>"
    done_when: 'Code executes without errors, passes all unit assertions, and prints
      verified output metrics for Task 2: Implement Observability & Tracing.'
    git_cmd: ''
    sol_id: sol-w22d158t2
    solution_title: 'Production Implementation — Task 2: Implement Observability &
      Tracing'
    solution_code: "# GenAI & Agent Workflow Pipeline for Day 158: Observability &\
      \ Tracing - Task 2: Implement Observability & Tracing\nimport json\nimport numpy\
      \ as np\n\ndef cosine_similarity(a, b):\n    return np.dot(a, b) / (np.linalg.norm(a)\
      \ * np.linalg.norm(b))\n\nclass VectorIndex:\n    def __init__(self):\n    \
      \    self.documents = []\n        self.vectors = []\n        \n    def add_document(self,\
      \ doc_id, text, vector):\n        self.documents.append({\"id\": doc_id, \"\
      text\": text})\n        self.vectors.append(np.array(vector))\n        \n  \
      \  def search(self, query_vec, top_k=2):\n        scores = [cosine_similarity(query_vec,\
      \ doc_vec) for doc_vec in self.vectors]\n        ranked_indices = np.argsort(scores)[::-1][:top_k]\n\
      \        return [{'doc': self.documents[i], 'score': float(scores[i])} for i\
      \ in ranked_indices]\n\ndef run_genai_workflow():\n    np.random.seed(42)\n\
      \    index = VectorIndex()\n    \n    # Ingest knowledge documents\n    docs\
      \ = [\n        \"LangGraph enables cyclic stateful multi-agent collaboration\
      \ with human-in-the-loop.\",\n        \"PagedAttention eliminates memory fragmentation\
      \ in vLLM by treating KV cache like virtual memory pages.\",\n        \"LoRA\
      \ freezes pretrained weights and injects trainable low-rank decomposition matrices.\"\
      \n    ]\n    for idx, d in enumerate(docs):\n        index.add_document(f\"\
      doc_{idx+1}\", d, np.random.randn(64))\n        \n    # Execute query retrieval\n\
      \    query_vec = np.random.randn(64)\n    results = index.search(query_vec,\
      \ top_k=2)\n    print(\"Retrieved Relevant Contexts:\")\n    print(json.dumps(results,\
      \ indent=2))\n    \n    assert len(results) == 2, \"Search must return top-k\
      \ matches!\"\n    print(\"✅ GenAI retrieval engine passed all operational benchmarks.\"\
      )\n    return results\n\nif __name__ == \"__main__\":\n    run_genai_workflow()"
    solution_lang: python
  quizzes:
  - question: In production LLM observability, what constitutes a 'Span' within an
      OpenTelemetry (OTel) distributed trace?
    options:
    - letter: A
      text: The entire server lifetime
      is_correct: false
    - letter: B
      text: A single contiguous unit of execution—such as a vector DB query, prompt
        template render, or model inference call—with start/end timestamps and metadata
      is_correct: true
    - letter: C
      text: A GPU CUDA thread index
      is_correct: false
    - letter: D
      text: A SQL database index
      is_correct: false
    correct_fb: ✅ Correct! Spans represent individual steps in a distributed execution
      trace.
    wrong_fb: ❌ Incorrect. A span represents a single timed operation inside a trace.
  - question: In the RAGAS evaluation framework, what does the 'Faithfulness' metric
      quantify?
    options:
    - letter: A
      text: How closely the LLM output follows the grammar of the prompt
      is_correct: false
    - letter: B
      text: The proportion of claims in the generated response that can be directly
        inferred from the retrieved context chunks (measuring hallucination rate)
      is_correct: true
    - letter: C
      text: The speed of the embedding model
      is_correct: false
    - letter: D
      text: The number of tokens generated per second
      is_correct: false
    correct_fb: ✅ Correct! Faithfulness measures whether the answer is strictly grounded
      in retrieved evidence.
    wrong_fb: ❌ Incorrect. Faithfulness assesses groundedness vs hallucination.
