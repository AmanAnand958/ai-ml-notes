  flashcards:
  - front: 'Core concept: What is the significance of FP16 Size in System Design Math?'
    back: '16-bit Floating Point: Exactly 2 bytes per parameter (e.g. 70B parameter
      model requires 140GB VRAM strictly for weights).'
  - front: Total VRAM Formula?
    back: VRAM = (Model Weights Size) + (KV Cache Size) + (Activations/Overhead) This
      establishes the core invariant in System Design Math, ensuring memory efficiency,
      numerical stability, and robust scaling.
  - front: Tensor Parallelism?
    back: Sharding a model's weight matrices across multiple GPUs so one layer fits.
      Required for 70B+ models on <80GB GPUs.
  - front: How is System Design Math tested and validated in industrial ML pipelines
      (Day 162)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical
      tolerances (np.allclose at 1e-5), and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling System
      Design Math in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation,
      resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
