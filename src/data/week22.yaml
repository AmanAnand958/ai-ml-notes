      and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Observability & Tracing in distributed systems?'
    back: • Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Unsampled Trace Flooding in High-QPS Endpoints'
    description: Generating 100% full distributed traces on production services processing thousands of requests per second
      creates massive network and storage overhead. Use probabilistic trace sampling (e.g. 5–10% sample rate) with 100% error
      capture..
