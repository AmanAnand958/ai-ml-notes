  gotchas:
  - 'Data Leakage & State Mutation Trap: Mutating preprocessing statistics on test
    splits produces overly optimistic evaluation metrics. Always fit transformations
    strictly on training partitions.'
  - 'Always ensure: Memory & Numerical Instability Trap: Unbounded batching or omitting
    float32 epsilon stabilization in denominators triggers silent NaN gradients and
    GPU Out-Of-Memory (OOM) crashes in production.'
