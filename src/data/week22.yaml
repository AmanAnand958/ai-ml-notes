  theory_html: "<div class=\"theory-prose\" style=\"line-height:1.7; font-size:14.5px;\
    \ color:var(--text);\">\n<h3 class=\"sh3\">1. End-to-End LLM Serving Architecture</h3>\n\
    <p>Building a high-throughput LLM inference microservice requires orchestrating\
    \ four critical systems: continuous batching with PagedAttention (vLLM), token-by-token\
    \ server-sent events (SSE) streaming over FastAPI, multi-tier semantic caching\
    \ in Redis, and Prometheus metric instrumentation.</p>\n<div class=\"cb\"><div\
    \ class=\"cb-head\"><span class=\"cb-lang\">python — production_serving_service.py</span><div\
    \ class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button><button\
    \ class=\"run-btn\" onclick=\"runCode(this)\">Run</button></div></div>\n<pre>from\
    \ fastapi import FastAPI, HTTPException\nfrom fastapi.responses import StreamingResponse\n\
    from vllm import AsyncLLMEngine, AsyncEngineArgs, SamplingParams\nimport asyncio\n\
    import json\n\napp = FastAPI(title=\"Production vLLM Microservice\")\nengine_args\
    \ = AsyncEngineArgs(model=\"meta-llama/Meta-Llama-3-8B-Instruct\", tensor_parallel_size=1,\
    \ max_model_len=4096)\nengine = AsyncLLMEngine.from_engine_args(engine_args)\n\
    \n@app.post(\"/v1/chat/completions\")\nasync def generate_stream(prompt: str,\
    \ max_tokens: int = 512):\n    sampling_params = SamplingParams(temperature=0.7,\
    \ max_tokens=max_tokens)\n    request_id = f\"req-{asyncio.get_event_loop().time()}\"\
    \n    results_generator = engine.generate(prompt, sampling_params, request_id)\n\
    \n    async def stream_tokens():\n        async for request_output in results_generator:\n\
    \            text = request_output.outputs[0].text\n            yield f\"data:\
    \ {json.dumps({'text': text})}\\n\\n\"\n        yield \"data: [DONE]\\n\\n\"\n\
    \n    return StreamingResponse(stream_tokens(), media_type=\"text/event-stream\"\
    )\n</pre></div>\n<h3 class=\"sh3\">2. Performance SLAs & Sizing Rules</h3>\n<p>A\
    \ production LLM cluster must guarantee two distinct SLA metrics: <strong>Time\
    \ To First Token (TTFT < 150ms)</strong> and <strong>Time Per Output Token (TPOT\
    \ < 25ms)</strong>. Using PagedAttention eliminates memory fragmentation, allowing\
    \ 4x higher batch sizes per GPU.</p>\n</div>"
