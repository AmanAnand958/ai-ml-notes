      \ context_lower)\n        <span class=\"kw\">if</span> present / <span class=\"fn\">max</span>(<span class=\"num\">1</span>,\
      \ <span class=\"fn\">len</span>(words)) >= <span class=\"num\">0.60</span>:\n            matched += <span class=\"num\"\
      >1</span>\n<span class=\"kw\">return</span> <span class=\"fn\">round</span>(matched / <span class=\"fn\">max</span>(<span\
      \ class=\"num\">1</span>, <span class=\"fn\">len</span>(ground_truth_sentences)), <span class=\"num\">4</span>)\n\n\
      gt = [\n    <span class=\"str\">\"LoRA freezes pretrained model weights\"</span>,\n    <span class=\"str\">\"LoRA injects\
