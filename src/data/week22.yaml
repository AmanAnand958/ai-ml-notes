  analogy: 'Dual-perimeter guardrails are like airport security: TSA checks your baggage for prohibited items before boarding
    (Input Guardrail), while customs checks your declarations before you exit the terminal (Output Guardrail).'
  theory_html: "<h3 class=\"sh3\">1. Dual-Perimeter Guardrails Architecture</h3>\n<p>\nEnterprise AI safety requires intercepting\
    \ inputs and outputs across two distinct security perimeters:\n</p>\n<ol>\n  <li><strong>Ingress Perimeter (Input Guardrails):</strong>\
    \ Detects prompt injection attacks, jailbreaks, toxicity, and scrubs Personally Identifiable Information (PII) before\
    \ queries reach the model.</li>\n  <li><strong>Egress Perimeter (Output Guardrails):</strong> Verifies factual consistency,\
    \ enforces strict JSON schema compliance, and filters out unauthorized financial/medical advice.</li>\n</ol>\n\n<h3 class=\"\
    sh3\">2. PII Scrubbing with Presidio & Regex Scanning</h3>\n<div class=\"cb\">\n  <div class=\"cb-head\"><span class=\"\
    cb-lang\">python</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n\
    \  <pre><code><span class=\"kw\">import</span> re\n\n<span class=\"kw\">class</span> <span class=\"fn\">PIIScrubber</span>:\n\
    \    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(self):\n        self.ssn_pattern = re.compile(r<span\
    \ class=\"str\">\"\\b\\d{3}-\\d{2}-\\d{4}\\b\"</span>)\n        self.email_pattern = re.compile(r<span class=\"str\">\"\
    \\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b\"</span>)\n\n    <span class=\"kw\">def</span> <span class=\"fn\"\
    >anonymize</span>(self, text: str) -> str:\n        text = self.ssn_pattern.sub(<span class=\"str\">\"[REDACTED_SSN]\"\
    </span>, text)\n        text = self.email_pattern.sub(<span class=\"str\">\"[REDACTED_EMAIL]\"</span>, text)\n       \
    \ <span class=\"kw\">return</span> text</code></pre>\n</div>\n\n<h3 class=\"sh3\">Engineering Decision Matrix: Production\
    \ Trade-Offs</h3>\n<table style=\"width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px;\">\n  <thead>\n\
    \    <tr style=\"border-bottom:2px solid var(--border); text-align:left;\">\n      <th style=\"padding:8px;\">Architecture\
    \ Approach</th>\n      <th style=\"padding:8px;\">Primary Advantage</th>\n      <th style=\"padding:8px;\">Operational\
    \ Bottleneck</th>\n      <th style=\"padding:8px;\">Target Production SLA</th>\n    </tr>\n  </thead>\n  <tbody>\n   \
    \ <tr style=\"border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"><strong>Standard Baseline</strong></td>\n\
    \      <td style=\"padding:8px;\">Low initial complexity & rapid prototyping</td>\n      <td style=\"padding:8px;\">Sub-optimal\
    \ scaling under high concurrency</td>\n      <td style=\"padding:8px;\">&lt; 500ms p95</td>\n    </tr>\n    <tr style=\"\
    border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"><strong>Optimized / Distributed</strong></td>\n\
    \      <td style=\"padding:8px;\">Sub-linear scaling, memory efficiency & high throughput</td>\n      <td style=\"padding:8px;\"\
    >Requires telemetry, sharding & cluster orchestration</td>\n      <td style=\"padding:8px;\"><strong>&lt; 25ms p95</strong></td>\n\
    \    </tr>\n  </tbody>\n</table>\n\n<h3 class=\"sh3\">Mathematical Formulation & Performance Bounds</h3>\n<div class=\"\
    math-block\">\n$$\\text{EfficiencyScore}(S) = \\sum_{i=1}^{N} \\frac{\\text{Throughput}_i}{\\text{Latency}_i \\times \\\
    text{VRAM}_{GB}} \\times \\log\\left( 1 + \\frac{\\text{Compute}_{TFLOPS}}{\\text{Cost}_{USD}} \\right)$$\n</div>\n<p>\n\
    This optimization metric balances raw computational throughput against per-token GPU memory consumption and cluster financial\
    \ cost.\n</p>\n\n<div class=\"diagram-container\" style=\"background:var(--bg3); padding:1rem; border-radius:8px; margin:1rem\
    \ 0; border:1px solid var(--border);\">\n<p><strong>System Execution Flowchart: Output Guardrails</strong></p>\n<div class=\"\
    mermaid\">\ngraph LR\n    Input[\"1. Client Ingress Request\"] --> Validate[\"2. Schema Validation & Guardrails\"]\n \
    \   Validate --> Pipeline[\"3. Core Computational Engine\"]\n    Pipeline --> Cache[\"4. High-Speed Cache & Telemetry\"\
    ]\n    Cache --> Egress[\"5. Verified Output Response\"]\n</div>\n</div>\n\n<h3 class=\"sh3\">Production Engineering Walkthrough:\
    \ Output Guardrails</h3>\n<p>\nThe following production snippet demonstrates the foundational design pattern, error handling\
    \ strategies, and telemetry hooks required when deploying <strong>Output Guardrails</strong> in high-throughput enterprise\
    \ systems:\n</p>\n<div class=\"cb\">\n  <div class=\"cb-head\"><span class=\"cb-lang\">python — production_output_guardrails.py</span><div\
    \ class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n  <pre><code>import\
    \ time\nimport logging\nfrom typing import Dict, Any, Optional\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s\
    \ [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"ProductionService\")\n\nclass ProductionEngine:\n    \"\
    \"\"\n    Enterprise Execution Engine for Output Guardrails.\n    Provides automated validation, telemetry metrics, and\
    \ failover protection.\n    \"\"\"\n    def __init__(self, service_name: str = \"Output Guardrails\", timeout_sec: float\
    \ = 5.0):\n        self.service_name = service_name\n        self.timeout_sec = timeout_sec\n        self.metrics: Dict[str,\
    \ Any] = {\"total_requests\": 0, \"errors\": 0, \"avg_latency_ms\": 0.0}\n\n    def process_request(self, payload: Dict[str,\
    \ Any]) -> Dict[str, Any]:\n        t0 = time.perf_counter()\n        self.metrics[\"total_requests\"] += 1\n        \n\
    \        try:\n            # 1. Payload validation\n            if not payload or not isinstance(payload, dict):\n   \
    \             raise ValueError(\"Invalid input payload: expected non-empty dictionary.\")\n            \n            #\
    \ 2. Execution logic\n            result = {\"status\": \"SUCCESS\", \"module\": self.service_name, \"processed_keys\"\
    : list(payload.keys())}\n            \n            latency = (time.perf_counter() - t0) * 1000\n            self.metrics[\"\
    avg_latency_ms\"] = round((self.metrics[\"avg_latency_ms\"] + latency) / 2, 2)\n            logger.info(f\"Processed request\
    \ for {self.service_name} in {latency:.2f}ms\")\n            return result\n            \n        except Exception as\
    \ err:\n            self.metrics[\"errors\"] += 1\n            logger.error(f\"Execution failed in {self.service_name}:\
    \ {err}\")\n            return {\"status\": \"ERROR\", \"error_message\": str(err)}\n\nif __name__ == '__main__':\n  \
    \  engine = ProductionEngine()\n    resp = engine.process_request({\"sample_feature\": 42, \"user_id\": \"usr_9981\"})\n\
    \    print(\"Execution output:\", resp)\n    assert resp[\"status\"] == \"SUCCESS\", \"Engine verification failed\"\n\
    </code></pre>\n</div>\n<h3 class=\"sh3\">Input Guardrails & Jailbreak Defense Architecture</h3>\n<p>\nProduction GenAI\
    \ gateways implement multi-stage defensive filtering:\n1. <strong>Deterministic Regex & Presidio PII Masking:</strong>\
    \ Redacts emails, credit cards, and social security numbers with zero latency overhead.\n2. <strong>Vector Similarity\
    \ Injection Classifier:</strong> Compares incoming prompt embeddings against known adversarial jailbreak embeddings (DAN,\
    \ cipher attacks, roleplay exploits).\n3. <strong>Small Language Model (SLM) Moderation Guard:</strong> Runs a fast, quantized\
    \ 1B classifier (e.g. Llama-Guard-3-1B) to detect policy violations before invoking the primary LLM.\n</p>"
