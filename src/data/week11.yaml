week_number: 11
title: GANs & PyTorch
description: ''
days:
- id: '73'
  day_num: 73
  title: Adversarial Game Theory & GANs
  subtitle: "Generative Modeling traditionally relies on maximizing pixel likelihoods.\n\
    \      In 2014, Ian Goodfellow revolutionized the field by framing generative\
    \ modeling as atwo-player Zero-Sum Game.\n      Today, we masterGenerative Adversarial\
    \ Networks (GANs).\n      We will dissect the mathematics of theMin-Max Game,\n\
    \      analyzeBinary Cross-Entropy (BCE)loss formulations,\n      address the\
    \ dangerous pitfall ofMode Collapse,\n      and study gradient unbalance mitigation\
    \ strategies."
  time_estimate: 5 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Explain the min-max objective function of GANs in game-theoretic terms.
  - Formulate the Binary Cross-Entropy (BCE) loss separately for Generator and Discriminator.
  - Identify the mathematical conditions leading to Mode Collapse.
  - Mitigate vanishing gradients in early Generator training using the non-saturating
    heuristic.
  checklist:
  - id: chk_73_1
    text: Study the core mathematical and architectural principles of Adversarial
      Game Theory & GANs
  - id: chk_73_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_73_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_73_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - Data Loaders
  - Discriminator
  - Generator
  - Minimax Training
  - DCGAN Transpose
  - Mode Collapse
  hinglish: 'Mode collapse: generator sirf kuch types ke samples banata hai — variety
    kho jaati hai. WGAN aur diversity loss jaisi techniques se is problem ko address
    kiya jaata hai!'
  analogy: GAN bilkul ek Chon (Art Forger) aur ek Museum Curator (Art Expert) ki competition
    jaisa hai. Forger (Generator) fake paintings banata hai aur museum expert (Discriminator)
    batata hai ki painting real hai ya copy. Shuruat mein, dono hi seekh rahe hote
    hain. Lekin agar Art Forger sirf ek specific style (mode collapse) seekh le, toh
    expert jaldi pakad leta hai, isliye forger ko dynamic rehna padta hai.
  theory_html: "<h3 class=\"sh3\">\n       1. The Min-Max Game Formulation\n     \
    \ </h3>\n<p>\n       GANs consist of two competing neural networks:\n      </p>\n\
    <ul class=\"prose-list\">\n<li>\n<strong>\n         The Generator ($G$):\n   \
    \     </strong>\n        Takes a random noise vector $z \\sim p_z(z)$ and maps\
    \ it to the synthetic data manifold $G(z)$. Its goal is to maximize the probability\
    \ that the Discriminator makes a mistake.\n       </li>\n<li>\n<strong>\n    \
    \     The Discriminator ($D$):\n        </strong>\n        Takes a real data sample\
    \ $x \\sim p_{\\text{data}}(x)$ or a generated sample $G(z)$ and outputs a scalar\
    \ probability $D(x) \\in [0, 1]$ representing the likelihood that the sample came\
    \ from the real data rather than $G$. Its goal is to correctly classify real vs.\
    \ synthetic inputs.\n       </li>\n</ul>\n<p>\n       This competition is mathematically\
    \ formulated as a zero-sum game with a value function $V(D, G)$:\n      </p>\n\
    <div class=\"math-block\">\n<span class=\"formula\">\n        $$\\min_G \\max_D\
    \ V(D, G) = \\mathbb{E}_{x \\sim p_{\\text{data}}}[ \\log D(x) ] + \\mathbb{E}_{z\
    \ \\sim p_z}[ \\log(1 - D(G(z))) ]$$\n       </span>\n<span class=\"desc\">\n\
    \        Where G tries to minimize the value function and D tries to maximize\
    \ it.\n       </span>\n</div>\n<h3 class=\"sh3\">\n       2. Binary Cross-Entropy\
    \ (BCE) Loss Synchronization\n      </h3>\n<p>\n       In training, we optimize\
    \ the network weights by performing alternating gradient updates:\n      </p>\n\
    <ul class=\"prose-list\">\n<li>\n<strong>\n         Discriminator Update:\n  \
    \      </strong>\n        We maximize the value function $V(D, G)$ by updating\
    \ $D$'s weights using the gradient of:\n        <div class=\"math-block\">\n<span\
    \ class=\"formula\">\n          $$\\mathcal{L}_D = - \\mathbb{E}_{x \\sim p_{\\\
    text{data}}}[ \\log D(x) ] - \\mathbb{E}_{z \\sim p_z}[ \\log(1 - D(G(z))) ]$$\n\
    \         </span>\n</div>\n</li>\n<li>\n<strong>\n         Generator Update (Heuristic):\n\
    \        </strong>\n        Minimizing $\\log(1 - D(G(z)))$ causes massive vanishing\
    \ gradients in early epochs when $G$ is weak and $D$ rejects synthetic images\
    \ with high confidence ($D(G(z)) \\approx 0$).\n      To bypass this, we maximize\
    \ the likelihood that the discriminator is fooled:\n        <div class=\"math-block\"\
    >\n<span class=\"formula\">\n          $$\\mathcal{L}_G = - \\mathbb{E}_{z \\\
    sim p_z}[ \\log D(G(z)) ]$$\n         </span>\n</div>\n        This is known as\
    \ the\n        <strong>\n         Non-Saturating Game (NS-GAN)\n        </strong>\n\
    \        , providing strong gradients to the Generator early in training.\n  \
    \     </li>\n</ul>\n<h3 class=\"sh3\">\n       3. Crucial Pitfalls: Mode Collapse\
    \ &amp; Vanishing Gradients\n      </h3>\n<svg aria-label=\"Healthy GAN producing\
    \ diverse outputs across all ten digits versus mode collapse concentrating on\
    \ a single digit\" height=\"340\" role=\"img\" viewbox=\"0 0 780 340\" width=\"\
    780\" xmlns=\"http://www.w3.org/2000/svg\">\n<style>\n        svg .w11t{font-family:DM\
    \ Sans,sans-serif} svg .w11m{font-family:IBM Plex Mono,monospace}\n       </style>\n\
    <defs>\n<lineargradient id=\"w11-bg_s\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n\
    <stop offset=\"0%\" stop-color=\"#1a1e2e\">\n</stop>\n<stop offset=\"100%\" stop-color=\"\
    var(--bg)\">\n</stop>\n</lineargradient>\n</defs>\n<rect fill=\"url(#w11-bg_s)\"\
    \ height=\"340\" rx=\"12\" width=\"780\">\n</rect>\n<text class=\"w11t\" fill=\"\
    #e6edf3\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" x=\"390\"\
    \ y=\"26\">\n        Mode collapse — G(z) output frequency per digit\n       </text>\n\
    <text class=\"w11t\" fill=\"#4fd1a5\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"\
    middle\" x=\"210\" y=\"50\">\n        HEALTHY GAN — covers all modes\n       </text>\n\
    <text class=\"w11t\" fill=\"#e56b8c\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"\
    middle\" x=\"555\" y=\"50\">\n        COLLAPSED GAN — one mode fooled D\n    \
