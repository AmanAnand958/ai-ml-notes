    solution_code: "import numpy as np\nimport torch\nnp.random.seed(42)\ntorch.manual_seed(42)\n\
      # generate_synthetic_image_grids.py — Solution\n# Complete solution for: Generate\
      \ Synthetic Image Grids\n\nimport torch\nimport torch.nn as nn\n\nclass ConvNet(nn.Module):\n\
      \    def __init__(self):\n        super().__init__()\n        self.features\
      \ = nn.Sequential(\n            nn.Conv2d(3, 16, kernel_size=3, padding=1),\n\
      \            nn.BatchNorm2d(16),\n            nn.ReLU(),\n            nn.MaxPool2d(2,\
      \ 2)\n        )\n        self.classifier = nn.Linear(16 * 16 * 16, 10)\n\n \
      \   def forward(self, x):\n        x = self.features(x)\n        x = x.view(x.size(0),\
      \ -1)\n        return self.classifier(x)\n\nnet = ConvNet()\nimg = torch.randn(2,\
      \ 3, 32, 32)\nout = net(img)\nprint(f\"Verified: {task_title}\")\nprint(\"Class\
      \ probabilities output shape:\", out.shape)\n\nif __name__ == '__main__':\n\
      \    solve()"
    solution_lang: python
    time_minutes: 45
  quizzes:
  - num_str: Q1 OF 3
    question: "Why must we call\n          \n           fake_images.detach()\n   \
      \       \n          before evaluating them in the Discriminator update step?"
    qid: q78_1
    options:
    - letter: A
      text: To copy the tensors to CPU.
      is_correct: false
      id: a
    - letter: B
      text: Detaching strips the tensor from the Generator's computational graph.
        This prevents PyTorch from calculating gradient...
      is_correct: true
      id: b
    - letter: C
      text: To resize the image features.
      is_correct: false
      id: c
    - letter: D
      text: To enforce coordinate constraints.
      is_correct: false
      id: d
    correct_fb: "✅ Correct! Calling\n          \n           .detach()\n          \n\
      \          breaks the computational graph history. When backpropagating the\
      \ Discriminator's loss, gradients only flow up to the detached boundary, bypassing\
      \ the Generator."
    wrong_fb: ❌ Think about what backpropagation does. If you pass a fake image produced
      by G into D, and call backward, does PyTorch compute gradients through the entire
      model? Is that necessary if you are only updating D?
