- id: '78'
  day_num: 78
  title: 'DCGAN Project: Min-Max Training Loop'
  subtitle: "Defining our network architectures is only the beginning.\n      The\
    \ core engineering of a GAN lies in theadversarial training loop.\n      Today\
    \ (Phase 2), we implement the alternating gradient update schedules,\n      synchronize\
    \ loss targets using Binary Cross-Entropy,\n      train theDiscriminatorto separate\
    \ real vs. synthetic images,\n      train theGeneratorusing the Non-Saturating\
    \ game heuristic,\n      and write code to output generated image progression\
    \ grids across epochs."
  time_estimate: 6 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Write an alternating training step that separates Generator and Discriminator
    updates.
  - Compute separate real and fake forward passes for the Discriminator to prevent
    computational graph decay.
  - Fool the Discriminator using real labels as targets for Generator updates.
  - Create an image logging utility to track epoch-by-epoch generative quality.
  checklist:
  - id: chk_78_1
    text: 'Study the core mathematical and architectural principles of DCGAN Project:
      Min-Max Training Loop'
  - id: chk_78_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_78_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_78_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - Adversarial Game Theory &
  - 'DCGAN: Deep Convolutional'
  - PyTorch Foundations
  - Custom Modules & Data Pip
  - 'DCGAN Project: Dataset Lo'
  - 'DCGAN Project: Min-Max Tr'
  - 'DCGAN Project: Persistenc'
  hinglish: 'Evaluation metrics: FID (Frechet Inception Distance) — generated aur
    real image distributions ka distance measure karta hai. Kam FID = better quality
    generations. 10 se kam excellent hai!'
  analogy: Alternating training loops in GANs are like a chess match. The generator
    makes a move (creates an image) while the discriminator sits still. Then the discriminator
    analyzes the board while the generator freezes.
  theory_html: "<h3 class=\"sh3\">\n       1. Alternating Mini-batch Updates\n   \
    \   </h3>\n<p>\n       In training, we optimize the Discriminator and Generator\
    \ sequentially:\n      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n     \
    \    Step 1: Train the Discriminator ($D$).\n        </strong>\n<br/>\n      \
    \  - First, compute the loss on real training images: pass $x$ through $D$ with\
    \ targets set to\n        <strong>\n         1\n        </strong>\n        (real\
    \ labels). Backpropagate the gradients.\n        <br/>\n        - Next, generate\
    \ fake images $G(z)$ using a noise vector $z$. Pass $G(z)$ through $D$ with targets\
    \ set to\n        <strong>\n         0\n        </strong>\n        (fake labels).\n\
    \        <strong>\n         Detach\n        </strong>\n        the fake images\
    \ ($G(z).\\text{detach()}$) before passing them to the Discriminator.\n      \
    \  <br/>\n        - Backpropagate gradients for the fake batch, and update the\
    \ Discriminator weights. Detaching prevents PyTorch from calculating gradients\
    \ through the Generator during the Discriminator's update step.\n       </li>\n\
    <li>\n<strong>\n         Step 2: Train the Generator ($G$).\n        </strong>\n\
    <br/>\n        - Pass the same fake images $G(z)$ (without detaching!) through\
    \ the updated Discriminator.\n        <br/>\n        - Calculate the loss with\
    \ targets set to\n        <strong>\n         1\n        </strong>\n        (real\
    \ labels). This is the Non-Saturating game heuristic, which penalizes the Generator\
    \ if the Discriminator correctly identifies the images as fake.\n        <br/>\n\
    \        - Backpropagate gradients through both $D$ and $G$, and update the Generator\
    \ weights.\n       </li>\n</ul>\n<h3 class=\"sh3\">\n       2. Detailed Training\
    \ Flow diagram\n      </h3>\n<div class=\"mermaid\">\ngraph TD\n  z[\"Noise Vector\
    \ z\"] --&gt; G[\"Generator G\"] --&gt; Gz[\"Synthetic Image G_z\"]\n  x[\"Real\
    \ Image x\"] --&gt; D[\"Discriminator D\"]\n  Gz --&gt; D\n  D --&gt;|Step 1|\
    \ UpD[\"Update Discriminator Loss: Real=1, Fake=0\"]\n  Gz --&gt;|Step 2| UpG[\"\
    Update Generator Loss: Fake=1\"]\n</div>\n<div class=\"diagram-cap\">\n      \
    \ Alternating training sequence: Step 1 updates the Discriminator, Step 2 updates\
    \ the Generator using updated Discriminator evaluations.\n      </div>\n<h3 class=\"\
    sh3\">\n       3. Complete Executable DCGAN Training Loop\n      </h3>\n<p>\n\
    \       Here is a complete, self-contained Python script implementing the alternating\
    \ training sequence:\n      </p>\n<figure class=\"svg-diagram\">\n<svg aria-label=\"\
    GAN architecture showing generator and discriminator training loop\" height=\"\
    250\" role=\"img\" viewbox=\"0 0 680 250\" width=\"680\" xmlns=\"http://www.w3.org/2000/svg\"\
    >\n<defs>\n<lineargradient id=\"ga-bg_s\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\"\
    >\n<stop offset=\"0%\" stop-color=\"#1a1e2e\">\n</stop>\n<stop offset=\"100%\"\
    \ stop-color=\"var(--bg)\">\n</stop>\n</lineargradient>\n</defs>\n<rect fill=\"\
    url(#ga-bg_s)\" height=\"250\" rx=\"12\" width=\"680\">\n</rect>\n<text fill=\"\
    #e6edf3\" font-family=\"DM Sans,sans-serif\" font-size=\"14\" font-weight=\"700\"\
    \ text-anchor=\"middle\" x=\"340\" y=\"22\">\n         GAN — Generative Adversarial\
    \ Network\n        </text>\n<!-- Noise input -->\n<rect fill=\"#1c2333\" height=\"\
    40\" rx=\"6\" stroke=\"#d2a8ff\" stroke-width=\"1.5\" width=\"80\" x=\"20\" y=\"\
    85\">\n</rect>\n<text fill=\"#d2a8ff\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    9\" font-weight=\"600\" text-anchor=\"middle\" x=\"60\" y=\"102\">\n         Random\n\
    \        </text>\n<text fill=\"var(--text2)\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"8\" text-anchor=\"middle\" x=\"60\" y=\"115\">\n         Noise z\n\
    \        </text>\n<!-- Arrow -->\n<line stroke=\"#6b7590\" stroke-width=\"1.5\"\
    \ x1=\"102\" x2=\"130\" y1=\"105\" y2=\"105\">\n</line>\n<!-- Generator -->\n\
    <rect fill=\"#1c2333\" height=\"70\" rx=\"8\" stroke=\"var(--blue, #82aaff)\"\
    \ stroke-width=\"2.5\" width=\"120\" x=\"132\" y=\"70\">\n</rect>\n<text fill=\"\
    var(--blue, #82aaff)\" font-family=\"DM Sans,sans-serif\" font-size=\"12\" font-weight=\"\
    700\" text-anchor=\"middle\" x=\"192\" y=\"98\">\n         Generator\n       \
    \ </text>\n<text fill=\"var(--text2)\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    8\" text-anchor=\"middle\" x=\"192\" y=\"115\">\n         G(z) → fake image\n\
    \        </text>\n<!-- Arrow to fake -->\n<line stroke=\"var(--blue, #82aaff)\"\
    \ stroke-width=\"1.5\" x1=\"254\" x2=\"310\" y1=\"105\" y2=\"105\">\n</line>\n\
    <text fill=\"var(--blue, #82aaff)\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    8\" text-anchor=\"middle\" x=\"282\" y=\"98\">\n         fake\n        </text>\n\
    <!-- Real data -->\n<rect fill=\"#0d4429\" height=\"35\" rx=\"6\" stroke=\"#7ee787\"\
    \ stroke-width=\"1.5\" width=\"90\" x=\"280\" y=\"170\">\n</rect>\n<text fill=\"\
    #7ee787\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" font-weight=\"600\"\
    \ text-anchor=\"middle\" x=\"325\" y=\"191\">\n         Real Images\n        </text>\n\
    <!-- Arrow from real -->\n<line stroke=\"#7ee787\" stroke-width=\"1.5\" x1=\"\
    370\" x2=\"405\" y1=\"180\" y2=\"140\">\n</line>\n<text fill=\"#7ee787\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"8\" x=\"400\" y=\"168\">\n         real\n   \
    \     </text>\n<!-- Discriminator -->\n<rect fill=\"#1c2333\" height=\"70\" rx=\"\
    8\" stroke=\"#f97583\" stroke-width=\"2.5\" width=\"140\" x=\"310\" y=\"70\">\n\
    </rect>\n<text fill=\"#f97583\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    12\" font-weight=\"700\" text-anchor=\"middle\" x=\"380\" y=\"98\">\n        \
    \ Discriminator\n        </text>\n<text fill=\"var(--text2)\" font-family=\"DM\
    \ Sans,sans-serif\" font-size=\"8\" text-anchor=\"middle\" x=\"380\" y=\"115\"\
    >\n         D(x) → real or fake?\n        </text>\n<!-- Output -->\n<line stroke=\"\
    #6b7590\" stroke-width=\"1.5\" x1=\"452\" x2=\"490\" y1=\"105\" y2=\"105\">\n\
    </line>\n<rect fill=\"#1c2333\" height=\"40\" rx=\"6\" stroke=\"#f0c846\" stroke-width=\"\
    2\" width=\"80\" x=\"492\" y=\"85\">\n</rect>\n<text fill=\"#f0c846\" font-family=\"\
    DM Sans,sans-serif\" font-size=\"9\" font-weight=\"600\" text-anchor=\"middle\"\
    \ x=\"532\" y=\"102\">\n         Real?\n        </text>\n<text fill=\"var(--text2)\"\
    \ font-family=\"DM Sans,sans-serif\" font-size=\"8\" text-anchor=\"middle\" x=\"\
    532\" y=\"115\">\n         P(real)\n        </text>\n<!-- Loss feedback arrows\
    \ -->\n<path d=\"M532,127 L532,220 L192,220 L192,142\" fill=\"none\" stroke=\"\
    #f0c846\" stroke-dasharray=\"6,3\" stroke-width=\"1.5\">\n</path>\n<text fill=\"\
    #f0c846\" font-family=\"DM Sans,sans-serif\" font-size=\"9\" font-weight=\"600\"\
    \ text-anchor=\"middle\" x=\"360\" y=\"238\">\n         ↻ Adversarial Loss — G\
    \ tries to fool D, D tries to catch G\n        </text>\n<!-- Gradient arrows -->\n\
    <text fill=\"#f97583\" font-family=\"DM Sans,sans-serif\" font-size=\"8\" x=\"\
    600\" y=\"80\">\n         ∇D: maximize\n        </text>\n<text fill=\"#f97583\"\
    \ font-family=\"DM Sans,sans-serif\" font-size=\"8\" x=\"600\" y=\"93\">\n   \
    \      log D(x) +\n        </text>\n<text fill=\"#f97583\" font-family=\"DM Sans,sans-serif\"\
    \ font-size=\"8\" x=\"600\" y=\"106\">\n         log(1−D(G(z)))\n        </text>\n\
    <text fill=\"var(--blue, #82aaff)\" font-family=\"DM Sans,sans-serif\" font-size=\"\
    8\" x=\"600\" y=\"130\">\n         ∇G: minimize\n        </text>\n<text fill=\"\
    var(--blue, #82aaff)\" font-family=\"DM Sans,sans-serif\" font-size=\"8\" x=\"\
    600\" y=\"143\">\n         log(1−D(G(z)))\n        </text>\n</svg>\n<figcaption>\n\
    \        The Generator creates fake images from noise; the Discriminator classifies\
    \ real vs fake. They train adversarially until the Generator produces indistinguishable\
    \ fakes.\n       </figcaption>\n</figure>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — dcgan_training_loop.py\n      \
    \  </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span>\
    \ torch.nn <span class=\"kw\">as</span> nn\n<span class=\"kw\">import</span> torch.optim\
    \ <span class=\"kw\">as</span> optim\n\n<span class=\"cm\"># 1. Dummy Model Definitions\
    \ (For demonstration purposes)</span>\nnetG = nn.<span class=\"fn\">Sequential</span>(nn.<span\
    \ class=\"fn\">Linear</span>(<span class=\"num\">100</span>, <span class=\"num\"\
    >3</span> * <span class=\"num\">64</span> * <span class=\"num\">64</span>), nn.<span\
    \ class=\"fn\">Tanh</span>())\nnetD = nn.<span class=\"fn\">Sequential</span>(nn.<span\
    \ class=\"fn\">Linear</span>(<span class=\"num\">3</span> * <span class=\"num\"\
    >64</span> * <span class=\"num\">64</span>, <span class=\"num\">1</span>), nn.<span\
    \ class=\"fn\">Sigmoid</span>())\n\n<span class=\"cm\"># 2. Setup Optimizers &amp;\
    \ Binary Cross Entropy Loss</span>\noptimizerD = optim.<span class=\"fn\">Adam</span>(netD.<span\
    \ class=\"fn\">parameters</span>(), lr=<span class=\"num\">0.0002</span>, betas=(<span\
    \ class=\"num\">0.5</span>, <span class=\"num\">0.999</span>))\noptimizerG = optim.<span\
    \ class=\"fn\">Adam</span>(netG.<span class=\"fn\">parameters</span>(), lr=<span\
    \ class=\"num\">0.0002</span>, betas=(<span class=\"num\">0.5</span>, <span class=\"\
    num\">0.999</span>))\ncriterion = nn.<span class=\"fn\">BCELoss</span>()\n\n<span\
    \ class=\"cm\"># 3. Dummy Inputs (Batch size = 4)</span>\nreal_images = torch.<span\
    \ class=\"fn\">randn</span>(<span class=\"num\">4</span>, <span class=\"num\"\
    >3</span> * <span class=\"num\">64</span> * <span class=\"num\">64</span>)\nreal_label\
    \ = torch.<span class=\"fn\">ones</span>(<span class=\"num\">4</span>, <span class=\"\
    num\">1</span>)\nfake_label = torch.<span class=\"fn\">zeros</span>(<span class=\"\
    num\">4</span>, <span class=\"num\">1</span>)\n\n<span class=\"cm\"># 4. A single\
    \ training iteration</span>\n<span class=\"cm\"># --- STEP 1: Update Discriminator\
    \ ---</span>\nnetD.<span class=\"fn\">zero_grad</span>()\n\n<span class=\"cm\"\
    ># Train with Real Images</span>\noutput_real = <span class=\"fn\">netD</span>(real_images)\n\
    lossD_real = <span class=\"fn\">criterion</span>(output_real, real_label)\nlossD_real.<span\
    \ class=\"fn\">backward</span>()\n\n<span class=\"cm\"># Train with Fake Images</span>\n\
    noise = torch.<span class=\"fn\">randn</span>(<span class=\"num\">4</span>, <span\
    \ class=\"num\">100</span>)\nfake_images = <span class=\"fn\">netG</span>(noise)\n\
    <span class=\"cm\"># Detach fake images so gradients do not flow back through\
    \ G</span>\noutput_fake = <span class=\"fn\">netD</span>(fake_images.<span class=\"\
    fn\">detach</span>())\nlossD_fake = <span class=\"fn\">criterion</span>(output_fake,\
    \ fake_label)\nlossD_fake.<span class=\"fn\">backward</span>()\n\n<span class=\"\
    cm\"># Update D parameters</span>\noptimizerD.<span class=\"fn\">step</span>()\n\
    \n<span class=\"cm\"># --- STEP 2: Update Generator ---</span>\nnetG.<span class=\"\
    fn\">zero_grad</span>()\n\n<span class=\"cm\"># We want the Generator outputs\
    \ to be classified as real (Label = 1)</span>\noutput_g = <span class=\"fn\">netD</span>(fake_images)\n\
    lossG = <span class=\"fn\">criterion</span>(output_g, real_label)\nlossG.<span\
    \ class=\"fn\">backward</span>()\n\n<span class=\"cm\"># Update G parameters</span>\n\
    optimizerG.<span class=\"fn\">step</span>()\n\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Iteration completed!\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"D Loss Real: {lossD_real.item():.4f} | D Loss Fake: {lossD_fake.item():.4f}\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"G Loss (NS):\
    \ {lossG.item():.4f}\"</span>)</pre>\n</div>\n<h2 class=\"sh2\">\n       \U0001F6E0\
    \ Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\"\
    >\n        \U0001F50D\n        <strong>\n         Search terms:\n        </strong>\n\
    \n         spectral normalization discriminator weights PyTorch, adversarial training\
    \ loss optimization\n        \n</div>\n<!-- /day-78-theory -->\n<!-- /day-78-resources-section\
    \ -->"
