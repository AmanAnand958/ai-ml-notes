  analogy: A custom dataset dataloader is like a kitchen assistant. They wash, cut,
    and portion vegetables (load and transform images) into containers (batches) so
    the head chef (GPU) can cook without waiting.
  theory_html: "<h3 class=\"sh3\">\n       1. Custom Image Normalization for Generative\
    \ Targets\n      </h3>\n<p>\n       Standard images loaded by PIL or OpenCV store\
    \ pixels as integers in $[0, 255]$, which standard deep networks scale to $[0,\
    \ 1]$.\n    However, the final activation layer of a DCGAN Generator is a\n  \
    \     <strong>\n        Tanh\n       </strong>\n       function, which outputs\
    \ values in $[-1, 1]$.\n    To ensure the Discriminator evaluates images on the\
    \ same scale, we must normalize real input images to $[-1, 1]$:\n      </p>\n\
    <div class=\"math-block\">\n<span class=\"formula\">\n        $$x_{\\text{norm}}\
    \ = \\frac{x - 0.5}{0.5} = 2x - 1$$\n       </span>\n<span class=\"desc\">\n \
    \       Scaling real input pixels from $[0, 1]$ to $[-1, 1]$.\n       </span>\n\
    </div>\n<h3 class=\"sh3\">\n       2. DCGAN Structural Blueprint ($64 \\times\
    \ 64 \\times 3$)\n      </h3>\n<p>\n       Let's examine the layer blueprints\
    \ for our Generator and Discriminator:\n      </p>\n<ul class=\"prose-list\">\n\
    <li>\n<strong>\n         Generator Blueprint:\n        </strong>\n        Takes\
    \ latent noise vector $z \\in \\mathbb{R}^{100}$ and expands it:\n        <br/>\n\
    \        - Project &amp; Reshape: $100 \\to 512 \\times 4 \\times 4$\n       \
    \ <br/>\n        - ConvTranspose2D (stride=2): $512 \\times 4 \\times 4 \\to 256\
    \ \\times 8 \\times 8$\n        <br/>\n        - ConvTranspose2D (stride=2): $256\
    \ \\times 8 \\times 8 \\to 128 \\times 16 \\times 16$\n        <br/>\n       \
    \ - ConvTranspose2D (stride=2): $128 \\times 16 \\times 16 \\to 64 \\times 32\
    \ \\times 32$\n        <br/>\n        - ConvTranspose2D (stride=2): $64 \\times\
    \ 32 \\times 32 \\to 3 \\times 64 \\times 64$ (Tanh activation, no Batch Norm!)\n\
    \       </li>\n<li>\n<strong>\n         Discriminator Blueprint:\n        </strong>\n\
    \        Takes spatial image of size $64 \\times 64 \\times 3$ and downsamples\
    \ it:\n        <br/>\n        - Convolution (stride=2): $3 \\times 64 \\times\
    \ 64 \\to 64 \\times 32 \\times 32$ (LeakyReLU, no Batch Norm!)\n        <br/>\n\
    \        - Convolution (stride=2): $64 \\times 32 \\times 32 \\to 128 \\times\
    \ 16 \\times 16$ (Batch Norm + LeakyReLU)\n        <br/>\n        - Convolution\
    \ (stride=2): $128 \\times 16 \\times 16 \\to 256 \\times 8 \\times 8$ (Batch\
    \ Norm + LeakyReLU)\n        <br/>\n        - Convolution (stride=2): $256 \\\
    times 8 \\times 8 \\to 512 \\times 4 \\times 4$ (Batch Norm + LeakyReLU)\n   \
    \     <br/>\n        - Convolution (stride=1): $512 \\times 4 \\times 4 \\to 1\
    \ \\times 1 \\times 1$ (Flatten to scalar prediction, Sigmoid optional)\n    \
    \   </li>\n</ul>\n<h3 class=\"sh3\">\n       3. Weight Initialization Rules\n\
    \      </h3>\n<p>\n       The DCGAN paper states that all model weights must be\
    \ initialized from a zero-mean normal distribution with a standard deviation of\
    \ $0.02$:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n\
    \        $$w \\sim \\mathcal{N}(0, 0.02^2), \\quad b = 0$$\n       </span>\n<span\
    \ class=\"desc\">\n        Where biases are initialized to 0, and Batch Normalization\
    \ weights are set to $\\gamma \\sim \\mathcal{N}(1, 0.02^2)$.\n       </span>\n\
    </div>\n<h3 class=\"sh3\">\n       4. Custom Networks and Weight Initialization\
    \ Script\n      </h3>\n<p>\n       Let's write a complete, self-contained PyTorch\
    \ module implementing both the Generator and Discriminator networks, along with\
    \ the weight initialization function:\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         python — dcgan_models.py\n    \
    \    </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><code><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span>\
    \ torch.nn <span class=\"kw\">as</span> nn\n\n<span class=\"cm\"># 1. Custom Weight\
    \ Initialization</span>\n<span class=\"kw\">def</span> <span class=\"fn\">weights_init</span>(m):\n\
    \    classname = m.__class__.__name__\n    <span class=\"kw\">if</span> classname.<span\
    \ class=\"fn\">find</span>(<span class=\"str\">'Conv'</span>) != -<span class=\"\
    num\">1</span>:\n        nn.init.<span class=\"fn\">normal_</span>(m.weight.data,\
    \ <span class=\"num\">0.0</span>, <span class=\"num\">0.02</span>)\n    <span\
    \ class=\"kw\">elif</span> classname.<span class=\"fn\">find</span>(<span class=\"\
    str\">'BatchNorm'</span>) != -<span class=\"num\">1</span>:\n        nn.init.<span\
    \ class=\"fn\">normal_</span>(m.weight.data, <span class=\"num\">1.0</span>, <span\
    \ class=\"num\">0.02</span>)\n        nn.init.<span class=\"fn\">constant_</span>(m.bias.data,\
    \ <span class=\"num\">0</span>)\n\n<span class=\"cm\"># 2. Generator Network for\
    \ 64x64 output</span>\n<span class=\"kw\">class</span> <span class=\"cls\">Generator</span>(nn.Module):\n\
    \    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"\
    kw\">self</span>, latent_dim=<span class=\"num\">100</span>, ngf=<span class=\"\
    num\">64</span>):\n        <span class=\"fn\">super</span>().<span class=\"fn\"\
    >__init__</span>()\n        <span class=\"kw\">self</span>.main = nn.<span class=\"\
    fn\">Sequential</span>(\n            <span class=\"cm\"># input is Z, going into\
    \ a convolution</span>\n            nn.<span class=\"fn\">ConvTranspose2d</span>(latent_dim,\
    \ ngf * <span class=\"num\">8</span>, <span class=\"num\">4</span>, <span class=\"\
    num\">1</span>, <span class=\"num\">0</span>, bias=<span class=\"kw\">False</span>),\n\
    \            nn.<span class=\"fn\">BatchNorm2d</span>(ngf * <span class=\"num\"\
    >8</span>),\n            nn.<span class=\"fn\">ReLU</span>(<span class=\"kw\"\
    >True</span>),\n            <span class=\"cm\"># state size: (ngf*8) x 4 x 4</span>\n\
    \            nn.<span class=\"fn\">ConvTranspose2d</span>(ngf * <span class=\"\
    num\">8</span>, ngf * <span class=\"num\">4</span>, <span class=\"num\">4</span>,\
    \ <span class=\"num\">2</span>, <span class=\"num\">1</span>, bias=<span class=\"\
    kw\">False</span>),\n            nn.<span class=\"fn\">BatchNorm2d</span>(ngf\
    \ * <span class=\"num\">4</span>),\n            nn.<span class=\"fn\">ReLU</span>(<span\
    \ class=\"kw\">True</span>),\n            <span class=\"cm\"># state size: (ngf*4)\
    \ x 8 x 8</span>\n            nn.<span class=\"fn\">ConvTranspose2d</span>(ngf\
    \ * <span class=\"num\">4</span>, ngf * <span class=\"num\">2</span>, <span class=\"\
    num\">4</span>, <span class=\"num\">2</span>, <span class=\"num\">1</span>, bias=<span\
    \ class=\"kw\">False</span>),\n            nn.<span class=\"fn\">BatchNorm2d</span>(ngf\
    \ * <span class=\"num\">2</span>),\n            nn.<span class=\"fn\">ReLU</span>(<span\
    \ class=\"kw\">True</span>),\n            <span class=\"cm\"># state size: (ngf*2)\
    \ x 16 x 16</span>\n            nn.<span class=\"fn\">ConvTranspose2d</span>(ngf\
    \ * <span class=\"num\">2</span>, ngf, <span class=\"num\">4</span>, <span class=\"\
    num\">2</span>, <span class=\"num\">1</span>, bias=<span class=\"kw\">False</span>),\n\
    \            nn.<span class=\"fn\">BatchNorm2d</span>(ngf),\n            nn.<span\
    \ class=\"fn\">ReLU</span>(<span class=\"kw\">True</span>),\n            <span\
    \ class=\"cm\"># state size: (ngf) x 32 x 32</span>\n            nn.<span class=\"\
    fn\">ConvTranspose2d</span>(ngf, <span class=\"num\">3</span>, <span class=\"\
    num\">4</span>, <span class=\"num\">2</span>, <span class=\"num\">1</span>, bias=<span\
    \ class=\"kw\">False</span>),\n            nn.<span class=\"fn\">Tanh</span>()\n\
    \            <span class=\"cm\"># state size: 3 x 64 x 64</span>\n        )\n\n\
    \    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"\
    kw\">self</span>, x):\n        <span class=\"kw\">return</span> <span class=\"\
    kw\">self</span>.<span class=\"fn\">main</span>(x)\n\n<span class=\"cm\"># 3.\
    \ Discriminator Network for 64x64 input</span>\n<span class=\"kw\">class</span>\
    \ <span class=\"cls\">Discriminator</span>(nn.Module):\n    <span class=\"kw\"\
    >def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>,\
    \ ndf=<span class=\"num\">64</span>):\n        <span class=\"fn\">super</span>().<span\
    \ class=\"fn\">__init__</span>()\n        <span class=\"kw\">self</span>.main\
    \ = nn.<span class=\"fn\">Sequential</span>(\n            <span class=\"cm\">#\
    \ input is 3 x 64 x 64</span>\n            nn.<span class=\"fn\">Conv2d</span>(<span\
    \ class=\"num\">3</span>, ndf, <span class=\"num\">4</span>, <span class=\"num\"\
    >2</span>, <span class=\"num\">1</span>, bias=<span class=\"kw\">False</span>),\n\
    \            nn.<span class=\"fn\">LeakyReLU</span>(<span class=\"num\">0.2</span>,\
    \ inplace=<span class=\"kw\">True</span>),\n            <span class=\"cm\"># state\
    \ size: ndf x 32 x 32</span>\n            nn.<span class=\"fn\">Conv2d</span>(ndf,\
    \ ndf * <span class=\"num\">2</span>, <span class=\"num\">4</span>, <span class=\"\
    num\">2</span>, <span class=\"num\">1</span>, bias=<span class=\"kw\">False</span>),\n\
    \            nn.<span class=\"fn\">BatchNorm2d</span>(ndf * <span class=\"num\"\
    >2</span>),\n            nn.<span class=\"fn\">LeakyReLU</span>(<span class=\"\
    num\">0.2</span>, inplace=<span class=\"kw\">True</span>),\n            <span\
    \ class=\"cm\"># state size: (ndf*2) x 16 x 16</span>\n            nn.<span class=\"\
    fn\">Conv2d</span>(ndf * <span class=\"num\">2</span>, ndf * <span class=\"num\"\
    >4</span>, <span class=\"num\">4</span>, <span class=\"num\">2</span>, <span class=\"\
    num\">1</span>, bias=<span class=\"kw\">False</span>),\n            nn.<span class=\"\
    fn\">BatchNorm2d</span>(ndf * <span class=\"num\">4</span>),\n            nn.<span\
    \ class=\"fn\">LeakyReLU</span>(<span class=\"num\">0.2</span>, inplace=<span\
    \ class=\"kw\">True</span>),\n            <span class=\"cm\"># state size: (ndf*4)\
    \ x 8 x 8</span>\n            nn.<span class=\"fn\">Conv2d</span>(ndf * <span\
    \ class=\"num\">4</span>, ndf * <span class=\"num\">8</span>, <span class=\"num\"\
    >4</span>, <span class=\"num\">2</span>, <span class=\"num\">1</span>, bias=<span\
    \ class=\"kw\">False</span>),\n            nn.<span class=\"fn\">BatchNorm2d</span>(ndf\
    \ * <span class=\"num\">8</span>),\n            nn.<span class=\"fn\">LeakyReLU</span>(<span\
    \ class=\"num\">0.2</span>, inplace=<span class=\"kw\">True</span>),\n       \
    \     <span class=\"cm\"># state size: (ndf*8) x 4 x 4</span>\n            nn.<span\
    \ class=\"fn\">Conv2d</span>(ndf * <span class=\"num\">8</span>, <span class=\"\
    num\">1</span>, <span class=\"num\">4</span>, <span class=\"num\">1</span>, <span\
    \ class=\"num\">0</span>, bias=<span class=\"kw\">False</span>),\n           \
    \ nn.<span class=\"fn\">Sigmoid</span>()\n        )\n\n    <span class=\"kw\"\
    >def</span> <span class=\"fn\">forward</span>(<span class=\"kw\">self</span>,\
    \ x):\n        <span class=\"kw\">return</span> <span class=\"kw\">self</span>.<span\
    \ class=\"fn\">main</span>(x).<span class=\"fn\">view</span>(-<span class=\"num\"\
    >1</span>, <span class=\"num\">1</span>)\n\n<span class=\"cm\"># Verify Architecture\
    \ Design</span>\nnetG = <span class=\"fn\">Generator</span>()\nnetG.<span class=\"\
    fn\">apply</span>(weights_init)\nnetD = <span class=\"fn\">Discriminator</span>()\n\
    netD.<span class=\"fn\">apply</span>(weights_init)\n\nz = torch.<span class=\"\
    fn\">randn</span>(<span class=\"num\">4</span>, <span class=\"num\">100</span>,\
    \ <span class=\"num\">1</span>, <span class=\"num\">1</span>)\nfake_img = <span\
    \ class=\"fn\">netG</span>(z)\npreds = <span class=\"fn\">netD</span>(fake_img)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">\"Fake Image Batch Shape:\"\
    </span>, fake_img.shape)\n<span class=\"fn\">print</span>(<span class=\"str\"\
