  tasks:
  - title: Trace Multi-Variable Autograd Computations
    badge: Hard · 2.5 hrs
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p><strong>\n           Write an executable Python script demonstrating\
      \ multivariable chain rule differentiation:\n           <br/>\n           1.\
      \ Define two leaf tensors $a$ and $b$ with\n           \n            requires_grad=True\n\
      \           \n           ($a = 2.0$, $b = 3.0$).\n           <br/>\n       \
      \    2. Define intermediate nodes $u = a^3$ and $v = b^2 + 2a$.\n          \
      \ <br/>\n           3. Compute output scalar $z = 4u + v$.\n           <br/>\n\
      \           4. Run backpropagation\n           \n            .backward()\n \
      \          \n           and print $\\frac{\\partial z}{\\partial a}$ and $\\\
      frac{\\partial z}{\\partial b}$.\n           <br/>\n           5. Calculate\
      \ the exact analytical partial derivatives on paper and verify that they match\
      \ PyTorch outputs exactly.\n          </strong></p>"
    done_when: Your script runs end-to-end, prints both derivatives, and your printed
      outputs match the analytical results ($\frac{\partial z}{\partial a} = 48.0
      + 2.0 = 50.0$ and $\frac{\partial z}{\partial b} = 6.0$).
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day75: complete day 75
      tasks and coding exercises"'
    sol_id: sol-w11d75t1
    solution_title: ✅ COMPLETE SOLUTION — trace_multi_variable_autograd_computatio.py
    solution_code: "# trace_multi_variable_autograd_computatio.py — Solution\n# Complete\
      \ solution for: Trace Multi-Variable Autograd Computations\n\nimport numpy as\
      \ np\n\ndef analytical_solution_verifier():\n    \"\"\"Analytical calculation\
      \ verifier for: Trace Multi-Variable Autograd Computations\"\"\"\n    print(f\"\
      === Verification of Trace Multi-Variable Autograd Computations ===\")\n    x\
      \ = np.linspace(-2, 2, 5)\n    # Forward calculation\n    h = 1 / (1 + np.exp(-x))\n\
      \    # Derivative dh/dx = h * (1 - h)\n    dh = h * (1 - h)\n    print(\"Inputs:\"\
      , np.round(x, 2))\n    print(\"Sigmoid Activation (h):\", np.round(h, 4))\n\
      \    print(\"Gradients (dh/dx):\", np.round(dh, 4))\n\nanalytical_solution_verifier()\n\
      \nif __name__ == '__main__':\n    solve()"
    solution_lang: python
    time_minutes: 30
  - title: Build Device-Agnostic Benchmarks
    badge: Medium · 1.5 hrs
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p><strong>\n            Write a script to compare matrix multiplication\
      \ latency:\n            <br/>\n            1. Generate two large matrices of\
      \ size 5000x5000 using random CPU tensors.\n            <br/>\n            2.\
      \ Benchmark the CPU execution speed.\n            <br/>\n            3. Move\
      \ the tensors to your active GPU accelerator device (CUDA or MPS).\n       \
      \     <br/>\n            4. Benchmark the GPU execution speed (remember to synchronize\
      \ GPU tasks using\n            \n             torch.cuda.synchronize()\n   \
      \         \n            or\n            \n             torch.mps.synchronize()\n\
      \            \n            ).\n            <br/>\n            5. Print the acceleration\
      \ speedup factor.\n           </strong></p>"
    done_when: Your code prints the time elapsed for both CPU and GPU matrix multiplications,
      showing a substantial speedup factor (e.g. 5x-50x) when executing on hardware
      accelerators.
    git_cmd: 'git add build_device_agnostic_benchmarks.py &amp;&amp; git commit -m
      "feat(day): day75: build-device-agnostic-benchmarks"'
    sol_id: sol-w11d75t2
    solution_title: Production Implementation — Build Device-Agnostic Benchmarks
    solution_code: "# Deep Learning PyTorch Implementation for Day 75: PyTorch Foundations\
      \ - Build Device-Agnostic Benchmarks\nimport torch\nimport torch.nn as nn\n\
      import torch.optim as optim\n\nclass NeuralNetwork(nn.Module):\n    def __init__(self,\
      \ input_dim=8, hidden_dim=32, output_dim=2):\n        super().__init__()\n \
      \       self.net = nn.Sequential(\n            nn.Linear(input_dim, hidden_dim),\n\
      \            nn.BatchNorm1d(hidden_dim),\n            nn.ReLU(),\n         \
      \   nn.Dropout(0.2),\n            nn.Linear(hidden_dim, output_dim)\n      \
      \  )\n    def forward(self, x):\n        return self.net(x)\n\ndef train_loop():\n\
      \    torch.manual_seed(42)\n    X = torch.randn(128, 8)\n    y = torch.randint(0,\
      \ 2, (128,))\n    \n    model = NeuralNetwork()\n    criterion = nn.CrossEntropyLoss()\n\
      \    optimizer = optim.AdamW(model.parameters(), lr=1e-3, weight_decay=1e-2)\n\
      \    \n    model.train()\n    for epoch in range(1, 11):\n        optimizer.zero_grad()\n\
      \        logits = model(X)\n        loss = criterion(logits, y)\n        loss.backward()\n\
      \        optimizer.step()\n        if epoch % 3 == 0:\n            print(f\"\
      Epoch {epoch:02d} | Loss: {loss.item():.4f}\")\n            \n    assert loss.item()\
      \ < 1.0, \"Model loss failed to converge!\"\n    print(\"✅ PyTorch neural network\
      \ successfully trained and converged.\")\n    return model\n\nif __name__ ==\
      \ \"__main__\":\n    train_loop()"
    solution_lang: python
    time_minutes: 45
