      Computations
  - id: chk_75_4
    text: Evaluate conceptual mastery via interactive flashcards and quiz challenges
  concept_flow:
  - Adversarial Game Theory & GANs
  - 'DCGAN: Deep Convolutional GANs'
  - PyTorch Foundations
  - Custom Modules & Data Pipelines in PyTorch
  - 'DCGAN Project: Dataset Loading & Network Design'
  - 'DCGAN Project: Min-Max Training Loop'
  - 'DCGAN Project: Persistence & Optimization'
  hinglish: 'VAE ka smooth latent space interpolation allow karta hai: do images ke
    beech ke latent vectors interpolate karo aur smooth transition milta hai. GAN
    mein ye guaranteed nahi hota!'
  analogy: Dynamic Graph bilkul ek Google Docs document ki tarah hai jo likhte hi
    real-time mein change hota hai. Static Graph ek book compile karne jaisa hai,
    jise likhne ke baad publish (compile) kiya jata hai aur compile hone ke baad usme
    change karna bahut mushkil hota hai. PyTorch is dynamic, making debugging as easy
    as editing a live document.
  theory_html: "<div id=\"wgan-gp-enriched\" style=\"margin:1.5rem 0;\">\n<h3 class=\"\
    sh3\">WGAN-GP: Gradient Penalty Formulation</h3>\n<div class=\"math-block\" style=\"\
    margin:1rem 0; padding:12px; background:var(--bg2); border-left:3px solid var(--accent);\
    \ border-radius:6px; font-size:14px;\">\n    $$L = \\mathbb{E}_{\\tilde{x}}[D(\\\
    tilde{x})] - \\mathbb{E}_{x}[D(x)] + \\lambda \\mathbb{E}_{\\hat{x}}\\left[\\\
    left(\\|\\nabla_{\\hat{x}} D(\\hat{x})\\|_2 - 1\\right)^2\\right]$$\n</div>\n\
    <p>Instead of hard weight clipping (which cripples network capacity), Gradient\
    \ Penalty enforces the 1-Lipschitz continuity condition by penalizing Critic gradients\
    \ that diverge from unit norm along random interpolations $\\hat{x} = \\epsilon\
    \ x + (1-\\epsilon)\\tilde{x}$.</p>\n</div>\n<h3 class=\"sh3\">\n       1. Dynamic\
    \ vs. Static Computation Graphs\n      </h3>\n<p>\n       Deep learning frameworks\
    \ represent operations as directed acyclic graphs (DAGs):\n      </p>\n<ul class=\"\
    prose-list\">\n<li>\n<strong>\n         Static Graphs (Define-and-Run):\n    \
    \    </strong>\n        The structure of the graph is fully compiled and optimized\
    \ before running any training loop. While fast, debugging is challenging because\
    \ the graph is separated from runtime variables.\n       </li>\n<li>\n<strong>\n\
    \         Dynamic Graphs (Define-by-Run):\n        </strong>\n        PyTorch\
    \ builds a fresh graph on the fly during each forward pass. This allows standard\
    \ Python debugging (using\n        \n         pdb\n        \n        or print\
    \ statements), dynamic loops, conditional branching (varying paths based on image\
    \ content), and easier code execution.\n       </li>\n</ul>\n<h3 class=\"sh3\"\
    >\n       2. Device Migration: A Device-Agnostic Setup\n      </h3>\n<p>\n   \
    \    To train deep learning models on specialized accelerators, we must migrate\
    \ our tensors from the CPU system RAM to dedicated hardware memory.\n    Modern\
    \ PyTorch utilizes\n       <strong>\n        Apple Silicon MPS (Metal Performance\
    \ Shaders)\n       </strong>\n       or\n       <strong>\n        NVIDIA CUDA\n\
    \       </strong>\n       :\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — device_selection.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><code><span class=\"kw\">import</span> torch\n\ndevice = <span class=\"str\"\
    >\"cuda\" if torch.cuda.is_available() else (\"mps\" if torch.backends.mps.is_available()\
    \ else \"cpu\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
    Selected accelerator backend: {device}\"</span>)\nx = torch.<span class=\"fn\"\
    >randn</span>(<span class=\"num\">3</span>, <span class=\"num\">3</span>).<span\
    \ class=\"fn\">to</span>(device)  <span class=\"cm\"># Clean, device-agnostic\
    \ migration!</span></code></pre>\n</div>\n<h3 class=\"sh3\">\n       3. Autograd:\
    \ The Mathematical Engine\n      </h3>\n<p>\n       When a tensor has\n      \
    \ \n        requires_grad=True\n       \n       , PyTorch tracks every operation\
    \ performed on it.\n    It builds a computational graph using\n       \n     \
    \   Function\n       \n       objects that point back to each other.\n    When\
    \ we call\n       \n        .backward()\n       \n       , the\n       <strong>\n\
    \        Autograd engine\n       </strong>\n       computes the gradients of the\
    \ scalar output with respect to all leaf variables using the multi-variable chain\
    \ rule.\n      </p>\n<p>\n       Mathematically, instead of calculating a massive\
    \ Jacobian matrix $J$ from scratch, PyTorch computes a\n       <strong>\n    \
    \    Jacobian-Vector Product (JVP)\n       </strong>\n       :\n      </p>\n<div\
    \ class=\"math-block\">\n<span class=\"formula\">\n        $$v^T \\cdot J = \\\
    left[ \\frac{\\partial l}{\\partial y_1}, \\dots, \\frac{\\partial l}{\\partial\
    \ y_m} \\right] \\cdot \\begin{bmatrix} \\frac{\\partial y_1}{\\partial x_1} &\
    \ \\dots & \\frac{\\partial y_1}{\\partial x_n} \\\\ \\vdots & \\ddots\
    \ & \\vdots \\\\ \\frac{\\partial y_m}{\\partial x_1} & \\dots & \\\
    frac{\\partial y_m}{\\partial x_n} \\end{bmatrix}$$\n       </span>\n<span class=\"\
    desc\">\n        Where $v$ is the vector of incoming gradients, avoiding direct\
    \ calculation of massive intermediate Jacobian matrices.\n       </span>\n</div>\n\
    <h3 class=\"sh3\">\n       4. Seamless NumPy Pipeline Integration\n      </h3>\n\
    <p>\n       To convert between NumPy arrays and PyTorch tensors, we must prevent\
    \ redundant memory copies (which slow down data loaders).\n    Using\n       \n\
    \        torch.from_numpy()\n       \n       creates a\n       <strong>\n    \
    \    shared-memory view\n       </strong>\n       (a pointer to the same memory\
    \ block).\n    Changes in the PyTorch tensor will reflect instantly in the NumPy\
    \ array, and vice-versa!\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — numpy_zero_copy.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><code><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
    \ np\n<span class=\"kw\">import</span> torch\n\n<span class=\"cm\"># 1. Create\
    \ a NumPy array</span>\nnp_arr = np.<span class=\"fn\">array</span>([<span class=\"\
    num\">1.0</span>, <span class=\"num\">2.0</span>, <span class=\"num\">3.0</span>])\n\
    \n<span class=\"cm\"># 2. Convert to PyTorch Tensor (Zero-copy shared memory!)</span>\n\
    tensor = torch.<span class=\"fn\">from_numpy</span>(np_arr)\n<span class=\"fn\"\
    >print</span>(<span class=\"str\">\"Initial Tensor:\"</span>, tensor)\n\n<span\
    \ class=\"cm\"># 3. Mutate the raw NumPy array</span>\nnp_arr[<span class=\"num\"\
    >0</span>] = <span class=\"num\">99.0</span>\n\n<span class=\"cm\"># 4. Check\
    \ if the PyTorch Tensor changed (It did!)</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Mutated Tensor (Shared memory):\"</span>, tensor)\n<span class=\"\
    kw\">assert</span> tensor[<span class=\"num\">0</span>] == <span class=\"num\"\
    >99.0</span>, <span class=\"str\">\"Shared memory view failed!\"</span>\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">\"Success! Seamless zero-copy\
    \ memory verified!\"</span>)</code></pre>\n</div>\n<h3 class=\"sh3\">\n      \
    \ 5. GPU Diagnostics &amp; Memory Management\n      </h3>\n<p>\n       When scaling\
    \ training runs to massive deep models, GPU memory overflow (Out-of-Memory, or\
    \ OOM) is the most frequent runtime bottleneck.\n    PyTorch provides specialized\
    \ GPU profiling APIs to monitor allocation states.\n    We track active memory\
    \ footprints via\n       \n        torch.cuda.memory_allocated()\n       \n  \
    \     and trigger cache sweeps using\n       \n        torch.cuda.empty_cache()\n\
    \       \n       to clean up dangling computational graph allocations:\n     \
    \ </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n\
    \         python — cuda_diagnostics.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span\
    \ class=\"kw\">import</span> torch\n\n<span class=\"kw\">if</span> torch.cuda.<span\
    \ class=\"fn\">is_available</span>():\n    <span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Device Name:\"</span>, torch.cuda.<span class=\"fn\">get_device_name</span>(<span\
    \ class=\"num\">0</span>))\n    <span class=\"fn\">print</span>(<span class=\"\
    str\">f\"Initial Allocated Memory:\", torch.cuda.memory_allocated(0) / 1e6, \"\
    MB\"</span>)\n    \n    <span class=\"cm\"># Allocate large tensor on GPU</span>\n\
    \    dummy_gpu_tensor = torch.<span class=\"fn\">randn</span>(<span class=\"num\"\
    >10000</span>, <span class=\"num\">10000</span>, device=<span class=\"str\">\"\
    cuda\"</span>)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Allocated\
    \ Memory after allocation:\", torch.cuda.memory_allocated(0) / 1e6, \"MB\"</span>)\n\
    \    \n    <span class=\"cm\"># Free the reference and flush the cache</span>\n\
    \    del dummy_gpu_tensor\n    torch.cuda.<span class=\"fn\">empty_cache</span>()\n\
    \    <span class=\"fn\">print</span>(<span class=\"str\">f\"Allocated Memory after\
    \ cache flush:\", torch.cuda.memory_allocated(0) / 1e6, \"MB\"</span>)\n<span\
    \ class=\"kw\">else</span>:\n    <span class=\"fn\">print</span>(<span class=\"\
    str\">\"CUDA device not active; skipping hardware benchmark.\"</span>)</code></pre>\n\
