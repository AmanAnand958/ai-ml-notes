  - title: Apply Spectral Normalization to Layers
    badge: Medium · 1.5 hrs
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p><strong>\n            Implement Spectral Normalization:\n   \
      \         <br/>\n            1. Create a custom 2D Convolutional layer using\n\
      \            \n             torch.nn.Conv2d\n            \n            .\n \
      \           <br/>\n            2. Wrap this layer in PyTorch's\n           \
      \ \n             torch.nn.utils.parametrizations.spectral_norm\n           \
      \ \n            .\n            <br/>\n            3. Print the resulting module\
      \ attributes to locate the registered spectral weights (\n            \n   \
      \          weight_u\n            \n            and\n            \n         \
      \    weight_v\n            \n            ).\n            <br/>\n           \
      \ 4. Run a forward pass on a mock tensor and verify output shapes.\n       \
      \    </strong></p>"
    done_when: Your script executes successfully, displays the registered spectral
      weight parameters in the print trace, and executes the forward pass without
      error.
    git_cmd: 'git add apply_spectral_normalization_to_layers.py &amp;&amp; git commit
      -m "feat(day): day79: apply-spectral-normalization-to-layers"'
    sol_id: sol-w11d79t2
    solution_title: Production Implementation — Apply Spectral Normalization to Layers
    solution_code: "# Deep Learning PyTorch Implementation for Day 79: DCGAN Project:\
      \ Persistence & Optimization - Apply Spectral Normalization to Layers\nimport\
      \ torch\nimport torch.nn as nn\nimport torch.optim as optim\n\nclass NeuralNetwork(nn.Module):\n\
      \    def __init__(self, input_dim=8, hidden_dim=32, output_dim=2):\n       \
      \ super().__init__()\n        self.net = nn.Sequential(\n            nn.Linear(input_dim,\
      \ hidden_dim),\n            nn.BatchNorm1d(hidden_dim),\n            nn.ReLU(),\n\
      \            nn.Dropout(0.2),\n            nn.Linear(hidden_dim, output_dim)\n\
      \        )\n    def forward(self, x):\n        return self.net(x)\n\ndef train_loop():\n\
      \    torch.manual_seed(42)\n    X = torch.randn(128, 8)\n    y = torch.randint(0,\
      \ 2, (128,))\n    \n    model = NeuralNetwork()\n    criterion = nn.CrossEntropyLoss()\n\
      \    optimizer = optim.AdamW(model.parameters(), lr=1e-3, weight_decay=1e-2)\n\
      \    \n    model.train()\n    for epoch in range(1, 11):\n        optimizer.zero_grad()\n\
      \        logits = model(X)\n        loss = criterion(logits, y)\n        loss.backward()\n\
      \        optimizer.step()\n        if epoch % 3 == 0:\n            print(f\"\
      Epoch {epoch:02d} | Loss: {loss.item():.4f}\")\n            \n    assert loss.item()\
      \ < 1.0, \"Model loss failed to converge!\"\n    print(\"✅ PyTorch neural network\
      \ successfully trained and converged.\")\n    return model\n\nif __name__ ==\
      \ \"__main__\":\n    train_loop()"
    solution_lang: python
    time_minutes: 45
