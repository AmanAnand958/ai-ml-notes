    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p><strong>\n           Write an executable Python script using\
      \ PyTorch:\n           <br/>\n           1. Define a simple 1D Linear Generator\
      \ and a 1D Linear Discriminator.\n           <br/>\n           2. Set up separate\
      \ optimizers for $G$ and $D$.\n           <br/>\n           3. Write a single\
      \ training step where $D$ is updated once on real/fake inputs, and then $G$\
      \ is updated once using the Non-Saturating loss.\n           <br/>\n       \
      \    4. Print the gradients of $G$'s input weights before and after the update\
      \ step.\n          </strong></p>"
    done_when: Your script runs end-to-end, prints both gradient tensors, and demonstrates
      that the optimizer update alters parameter weights without throwing runtime
      graph-disposal exceptions.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day73: GAN minimax game
      and discriminator training loop"'
