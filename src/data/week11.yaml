    \ \\times 1 \\times 1$ (Flatten to scalar prediction, Sigmoid optional)\n    \
    \   </li>\n</ul>\n<h3 class=\"sh3\">\n       3. Weight Initialization Rules\n\
    \      </h3>\n<p>\n       The DCGAN paper states that all model weights must be\
