  - title: Compute Non-Saturating Loss Math
    badge: Medium · 1.5 hrs
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n            Given:\n            <br/>\n            - A generated\
      \ sample gets a discriminator score D(G(z)) = 0.05.\n            <br/>\n   \
      \         1. Calculate the minimax generator objective: $\\log(1 - D(G(z)))$.\n\
      \            <br/>\n            2. Calculate the non-saturating generator objective:\
      \ $-\\log D(G(z))$.\n            <br/>\n            Show your step-by-step arithmetic\
      \ steps using natural log approximations.\n           </p>"
    done_when: Your calculations correctly prove that minimax loss is $\log(0.95)
      \approx -0.051$ (very flat gradient), while non-saturating loss is $-\log(0.05)
      \approx 2.996$ (strong gradient scaling), proving why the NS-GAN heuristic is
      vital.
    git_cmd: 'git add compute_non_saturating_loss_math.py &amp;&amp; git commit -m
      "day73: compute-non-saturating-loss-math"'
    sol_id: sol-w11t2
    solution_title: ✅ COMPLETE SOLUTION — compute_non_saturating_loss_math.py
    solution_code: "<span class=\"cm\"># compute_non_saturating_loss_math.py — Solution</span>\n\
      <span class=\"cm\"># Complete solution for: Compute Non-Saturating Loss Math</span>\n\
      \n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n\
      <span class=\"kw\">def</span> <span class=\"fn\">compute_classification_metrics</span>(y_true,\
      \ y_pred_probs, threshold=<span class=\"num\">0.5</span>):\n    y_pred = (y_pred_probs\
      \ &gt;= threshold).<span class=\"fn\">astype</span>(int)\n    tp = np.<span\
      \ class=\"fn\">sum</span>((y_true == <span class=\"num\">1</span>) &amp; (y_pred\
      \ == <span class=\"num\">1</span>))\n    fp = np.<span class=\"fn\">sum</span>((y_true\
      \ == <span class=\"num\">0</span>) &amp; (y_pred == <span class=\"num\">1</span>))\n\
      \    fn = np.<span class=\"fn\">sum</span>((y_true == <span class=\"num\">1</span>)\
      \ &amp; (y_pred == <span class=\"num\">0</span>))\n    tn = np.<span class=\"\
      fn\">sum</span>((y_true == <span class=\"num\">0</span>) &amp; (y_pred == <span\
      \ class=\"num\">0</span>))\n    \n    accuracy = (tp + tn) / <span class=\"\
      fn\">len</span>(y_true)\n    precision = tp / (tp + fp) <span class=\"kw\">if</span>\
      \ (tp + fp) &gt; <span class=\"num\">0</span> <span class=\"kw\">else</span>\
      \ <span class=\"num\">0</span>\n    recall = tp / (tp + fn) <span class=\"kw\"\
      >if</span> (tp + fn) &gt; <span class=\"num\">0</span> <span class=\"kw\">else</span>\
      \ <span class=\"num\">0</span>\n    f1 = <span class=\"num\">2</span> * precision\
      \ * recall / (precision + recall) <span class=\"kw\">if</span> (precision +\
      \ recall) &gt; <span class=\"num\">0</span> <span class=\"kw\">else</span> <span\
      \ class=\"num\">0</span>\n    \n    <span class=\"kw\">return</span> {<span\
      \ class=\"str\">\"accuracy\": accuracy, \"precision\": precision, \"recall\"\
      : recall, \"f1_score\"</span>: f1}\n\ny_true = np.<span class=\"fn\">array</span>([<span\
      \ class=\"num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\"\
      >1</span>, <span class=\"num\">1</span>, <span class=\"num\">0</span>, <span\
      \ class=\"num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\"\
      >0</span>])\ny_probs = np.<span class=\"fn\">array</span>([<span class=\"num\"\
      >0.9</span>, <span class=\"num\">0.1</span>, <span class=\"num\">0.8</span>,\
      \ <span class=\"num\">0.4</span>, <span class=\"num\">0.2</span>, <span class=\"\
      num\">0.7</span>, <span class=\"num\">0.6</span>, <span class=\"num\">0.3</span>])\n\
      metrics = <span class=\"fn\">compute_classification_metrics</span>(y_true, y_probs)\n\
      <span class=\"fn\">print</span>(<span class=\"str\">f\"Evaluation for {task_title}:\"\
      </span>)\n<span class=\"kw\">for</span> k, v <span class=\"kw\">in</span> metrics.<span\
      \ class=\"fn\">items</span>():\n    <span class=\"fn\">print</span>(<span class=\"\
      str\">f\"  {k}: {v:.4f}\"</span>)\n\n<span class=\"kw\">if</span> __name__ ==\
      \ <span class=\"str\">'__main__'</span>:\n    <span class=\"fn\">solve</span>()"
    solution_lang: python
  quizzes:
  - num_str: Q1 OF 3
    question: Why does the standard minimax generator loss $\log(1 - D(G(z)))$ struggle
      in early training phases?
    qid: q73_1
    options:
    - letter: A
      text: Because it requires positive activations.
      is_correct: false
    - letter: B
      text: Because when the Generator is weak, the Discriminator easily rejects fake
        samples, making D(G(z)) close to 0. The derivative of $\log(1-x)$ at $x=0$
        is extremely small, causing vanishing gradients.
      is_correct: true
    - letter: C
      text: Because it decreases training parameter bounds.
      is_correct: false
    - letter: D
      text: To enforce positive definite weights.
      is_correct: false
    correct_fb: ✅ Correct! In early epochs, the discriminator easily classifies fake
      samples as 0, which makes the slope of the loss function $\log(1-x)$ extremely
      flat, causing learning to stall. NS-GAN solves this.
    wrong_fb: ❌ Think about what value D(G(z)) has when the Generator is completely
      random. If it is 0.05, what is the value and slope of $\log(1-x)$ compared to
      $-\log(x)$? Which one has a steeper slope near 0?
  - num_str: Q2 OF 3
    question: What is the defining characteristic of Mode Collapse in GAN training?
    qid: q73_2
    options:
    - letter: A
      text: The Discriminator gradients explode to NaN.
      is_correct: false
    - letter: B
      text: The Generator collapses to outputting samples from only a single or a
        small subset of modes in the training distribution, ignoring diverse target
        characteristics.
      is_correct: true
    - letter: C
      text: The training dataset runs out of samples.
      is_correct: false
    - letter: D
      text: To speed up the batch pipeline.
      is_correct: false
    correct_fb: ✅ Correct! Mode Collapse is a major GAN pitfall where the generator
      limits itself to producing a single reliable output type that fools the discriminator,
      failing to represent the entire distribution (e.g. generating only '1's instead
      of digits 0-9).
    wrong_fb: ❌ Remember that mode collapse is a generative diversity failure. Does
      it refer to the loss functions going to infinity, or does it refer to the generator
      producing repetitive, non-diverse outputs?
  - num_str: Q3 OF 3
    question: In a standard zero-sum game framework, what does a value function V(D,
      G) represent?
    qid: q73_3
    options:
    - letter: A
      text: The payout metric where the Discriminator tries to maximize its accuracy
        (positive contribution) while the Generator tries to minimize the Discriminator's
        success.
      is_correct: true
    - letter: B
      text: The learning rate decay factor.
      is_correct: false
    - letter: C
      text: The classification accuracy.
      is_correct: false
    - letter: D
      text: To measure the parameter sparsity limit.
      is_correct: false
    correct_fb: ✅ Correct! The value function measures the binary classification accuracy.
      The discriminator attempts to maximize this, while the generator attempts to
      minimize it, establishing the classic min-max game dynamics.
    wrong_fb: ❌ Think about the term minimax. If one player (D) wants to maximize
      a score, and another (G) wants to minimize that same score, what does the value
      function measure? Does it measure the parameters, or the game's competitive
      outcome?
  flashcards:
  - front: GAN Architecture?
    back: 'Two networks training minimax style: Generator makes fake data; Discriminator
      tries to distinguish fake from real.'
  - front: Generator Loss?
    back: 'Minimizes the probability of Discriminator detecting fakes: $\log(1 - D(G(z)))$,
      or maximizes $\log(D(G(z)))$.'
  - front: Discriminator Loss?
    back: 'Maximizes the probability of correct classification: log(D(x)) [reals]
      + log(1 - D(G(z))) [fakes].'
  - front: Mode Collapse?
    back: GAN failure where Generator learns to produce samples from only a few output
      modes, ignoring overall dataset diversity.
  - front: Wasserstein GAN?
    back: Uses Earth Mover's Distance to provide smooth gradients even when probability
      distributions do not overlap.
  gotcha:
    title: '⚠️ Gotcha: Multi-Head Attention Scale Factor'
    description: Dividing by `sqrt(d_k)` prevents dot-product values from growing
      huge and pushing Softmax into near-zero gradient regions.
  takeaways:
    hinglish_line: "<strong>\n          Ek line mein:\n         </strong>\n      \
      \   GANs generator aur discriminator networks ko aapas mein minimax game ki\
      \ tarah train karke synthetic distributions generate karte hain."
    bullets:
    - GANs frame generative learning as a min-max game between a Generator and a Discriminator.
    - Standard Minimax loss suffers from vanishing gradients in early epochs when
      G is weak.
    - Non-Saturating GAN loss replaces minimax for G updates, providing steep early
      gradient updates.
    - Mode Collapse occurs when G limits output diversity to fool D, producing repetitive
      samples.
