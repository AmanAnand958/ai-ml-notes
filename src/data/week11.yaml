    solution_title: ✅ COMPLETE SOLUTION — generate_synthetic_image_grids.py
    solution_code: "<span class=\"cm\"># generate_synthetic_image_grids.py — Solution</span>\n\
      <span class=\"cm\"># Complete solution for: Generate Synthetic Image Grids</span>\n\
      \n<span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn\
      \ <span class=\"kw\">as</span> nn\n\n<span class=\"kw\">class</span> <span class=\"\
      cls\">ConvNet</span>(nn.Module):\n    <span class=\"kw\">def</span> <span class=\"\
      fn\">__init__</span>(<span class=\"kw\">self</span>):\n        <span class=\"\
      fn\">super</span>().<span class=\"fn\">__init__</span>()\n        <span class=\"\
      kw\">self</span>.features = nn.<span class=\"fn\">Sequential</span>(\n     \
      \       nn.<span class=\"fn\">Conv2d</span>(<span class=\"num\">3</span>, <span\
      \ class=\"num\">16</span>, kernel_size=<span class=\"num\">3</span>, padding=<span\
      \ class=\"num\">1</span>),\n            nn.<span class=\"fn\">BatchNorm2d</span>(<span\
      \ class=\"num\">16</span>),\n            nn.<span class=\"fn\">ReLU</span>(),\n\
      \            nn.<span class=\"fn\">MaxPool2d</span>(<span class=\"num\">2</span>,\
      \ <span class=\"num\">2</span>)\n        )\n        <span class=\"kw\">self</span>.classifier\
      \ = nn.<span class=\"fn\">Linear</span>(<span class=\"num\">16</span> * <span\
      \ class=\"num\">16</span> * <span class=\"num\">16</span>, <span class=\"num\"\
      >10</span>)\n\n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span\
      \ class=\"kw\">self</span>, x):\n        x = <span class=\"kw\">self</span>.<span\
      \ class=\"fn\">features</span>(x)\n        x = x.<span class=\"fn\">view</span>(x.<span\
      \ class=\"fn\">size</span>(<span class=\"num\">0</span>), -<span class=\"num\"\
      >1</span>)\n        <span class=\"kw\">return</span> <span class=\"kw\">self</span>.<span\
      \ class=\"fn\">classifier</span>(x)\n\nnet = <span class=\"fn\">ConvNet</span>()\n\
      img = torch.<span class=\"fn\">randn</span>(<span class=\"num\">2</span>, <span\
      \ class=\"num\">3</span>, <span class=\"num\">32</span>, <span class=\"num\"\
      >32</span>)\nout = <span class=\"fn\">net</span>(img)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Verified: {task_title}\"</span>)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">\"Class probabilities output shape:\"</span>, out.shape)\n\n\
      <span class=\"kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n\
      \    <span class=\"fn\">solve</span>()"
    solution_lang: python
  quizzes:
  - num_str: Q1 OF 3
    question: "Why must we call\n          \n           fake_images.detach()\n   \
      \       \n          before evaluating them in the Discriminator update step?"
    qid: q78_1
    options:
    - letter: A
      text: To copy the tensors to CPU.
      is_correct: false
    - letter: B
      text: Detaching strips the tensor from the Generator's computational graph.
        This prevents PyTorch from calculating gradients through the Generator and
        consuming unnecessary GPU memory during the Discriminator's update step.
      is_correct: true
    - letter: C
      text: To resize the image features.
      is_correct: false
    - letter: D
      text: To enforce coordinate constraints.
      is_correct: false
    correct_fb: "✅ Correct! Calling\n          \n           .detach()\n          \n\
      \          breaks the computational graph history. When backpropagating the\
      \ Discriminator's loss, gradients only flow up to the detached boundary, bypassing\
      \ the Generator."
    wrong_fb: ❌ Think about what backpropagation does. If you pass a fake image produced
      by G into D, and call backward, does PyTorch compute gradients through the entire
      model? Is that necessary if you are only updating D?
  - num_str: Q2 OF 3
    question: What targets are passed to the loss function when updating the Generator?
    qid: q78_2
    options:
    - letter: A
      text: Fake Labels (0), because the images are synthetic.
      is_correct: false
    - letter: B
      text: Real Labels (1), because the Generator's goal is to produce images that
        the Discriminator classifies as real.
      is_correct: true
    - letter: C
      text: A mixture of random indices.
      is_correct: false
    - letter: D
      text: A zero-vector tensor.
      is_correct: false
    correct_fb: ✅ Correct! Although the images are fake, the Generator's objective
      is to "fool" the Discriminator into classifying them as real. We calculate the
      loss with real labels (1) as the target.
    wrong_fb: ❌ Remember the game dynamics. The Generator wants to fool the Discriminator.
      If it wants the Discriminator to output D(G(z)) = 1 (real), what target should
      we pass to the BCE loss to calculate the gradient?
  - num_str: Q3 OF 3
    question: "Why does DCGAN utilize the Adam optimizer with beta parameters set\
      \ to\n          \n           (0.5, 0.999)\n          \n          rather than\
      \ the default\n          \n           (0.9, 0.999)\n          \n          ?"
    qid: q78_3
    options:
    - letter: A
      text: Reducing the first momentum beta to 0.5 decreases historical gradient
        smoothing, stabilizing training and preventing model collapse in highly dynamic
        environments.
      is_correct: true
    - letter: B
      text: To double the learning rate.
      is_correct: false
    - letter: C
      text: To bypass GPU execution loops.
      is_correct: false
    - letter: D
      text: To enforce convolutional filter limits.
      is_correct: false
    correct_fb: ✅ Correct! Lowering the beta momentum parameter makes optimizer updates
      highly sensitive to the current gradient step, preventing historical bias and
      stabilizing adversarial training.
    wrong_fb: ❌ Think about what the first beta parameter in Adam does. It controls
      gradient smoothing (momentum). If it is set to 0.9, how much weight does historical
      gradient direction hold? Does lowering it to 0.5 make the optimizer adapt faster
      to changes in the competition?
  flashcards:
  - front: GAN Architecture?
    back: 'Two networks training minimax style: Generator makes fake data; Discriminator
      tries to distinguish fake from real.'
  - front: Generator Loss?
    back: 'Minimizes the probability of Discriminator detecting fakes: $\log(1 - D(G(z)))$,
      or maximizes $\log(D(G(z)))$.'
  - front: Discriminator Loss?
    back: 'Maximizes the probability of correct classification: log(D(x)) [reals]
      + log(1 - D(G(z))) [fakes].'
  - front: Mode Collapse?
    back: GAN failure where Generator learns to produce samples from only a few output
      modes, ignoring overall dataset diversity.
  - front: Wasserstein GAN?
    back: Uses Earth Mover's Distance to provide smooth gradients even when probability
      distributions do not overlap.
  gotcha:
    title: '⚠️ Gotcha: Multi-Head Attention Scale Factor'
    description: Dividing by `sqrt(d_k)` prevents dot-product values from growing
      huge and pushing Softmax into near-zero gradient regions.
  takeaways:
    hinglish_line: "<strong>\n          Ek line mein:\n         </strong>\n      \
      \   Alternating training loops discriminator aur generator parameters steps\
      \ updates ko separate optimizers updates se handle karte hain."
    bullets:
    - Training GANs requires alternating gradient updates for the Generator and Discriminator.
    - "Calling\n          \n           fake_images.detach()\n          \n        \
      \  prevents gradient tracking through the Generator during Discriminator updates."
    - The Generator updates parameters using real labels (1) as the target to fool
      the Discriminator.
    - "Tuning the Adam momentum parameter to\n          \n           beta1 = 0.5\n\
      \          \n          stabilizes training dynamics."
