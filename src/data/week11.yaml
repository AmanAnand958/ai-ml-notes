  - title: Compute Non-Saturating Loss Math
    badge: Medium · 1.5 hrs
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p><strong>\n            Given:\n            <br/>\n           \
      \ - A generated sample gets a discriminator score D(G(z)) = 0.05.\n        \
      \    <br/>\n            1. Calculate the minimax generator objective: $\\log(1\
      \ - D(G(z)))$.\n            <br/>\n            2. Calculate the non-saturating\
      \ generator objective: $-\\log D(G(z))$.\n            <br/>\n            Show\
      \ your step-by-step arithmetic steps using natural log approximations.\n   \
      \        </strong></p>"
    done_when: Your calculations correctly prove that minimax loss is $\log(0.95)
      \approx -0.051$ (very flat gradient), while non-saturating loss is $-\log(0.05)
      \approx 2.996$ (strong gradient scaling), proving why the NS-GAN heuristic is
      vital.
    git_cmd: 'git add compute_non_saturating_loss_math.py &amp;&amp; git commit -m
      "feat(day): day73: compute-non-saturating-loss-math"'
    sol_id: sol-w11d73t2
    solution_title: ✅ COMPLETE SOLUTION — compute_non_saturating_loss_math.py
    solution_code: "# compute_non_saturating_loss_math.py — Solution\n# Complete solution\
      \ for: Compute Non-Saturating Loss Math\n\nimport numpy as np\n\ndef compute_classification_metrics(y_true,\
      \ y_pred_probs, threshold=0.5):\n    y_pred = (y_pred_probs >= threshold).astype(int)\n\
      \    tp = np.sum((y_true == 1) & (y_pred == 1))\n    fp = np.sum((y_true ==\
      \ 0) & (y_pred == 1))\n    fn = np.sum((y_true == 1) & (y_pred == 0))\n    tn\
      \ = np.sum((y_true == 0) & (y_pred == 0))\n    \n    accuracy = (tp + tn) /\
      \ len(y_true)\n    precision = tp / (tp + fp) if (tp + fp) > 0 else 0\n    recall\
      \ = tp / (tp + fn) if (tp + fn) > 0 else 0\n    f1 = 2 * precision * recall\
      \ / (precision + recall) if (precision + recall) > 0 else 0\n    \n    return\
      \ {\"accuracy\": accuracy, \"precision\": precision, \"recall\": recall, \"\
      f1_score\": f1}\n\ny_true = np.array([1, 0, 1, 1, 0, 1, 0, 0])\ny_probs = np.array([0.9,\
      \ 0.1, 0.8, 0.4, 0.2, 0.7, 0.6, 0.3])\nmetrics = compute_classification_metrics(y_true,\
      \ y_probs)\nprint(f\"Evaluation for {task_title}:\")\nfor k, v in metrics.items():\n\
      \    print(f\"  {k}: {v:.4f}\")\n\nif __name__ == '__main__':\n    solve()"
