  quizzes:
  - num_str: Q1 OF 3
    question: What mathematical metric does WGAN use instead of Binary Cross-Entropy
      to measure training stability?
    qid: q79_1
    options:
    - letter: A
      text: The Euclidean L2 distance.
      is_correct: false
    - letter: B
      text: The Wasserstein distance (Earth Mover's Distance), which provides smooth,
        continuous gradients everywhere, even when the data distributions do not overlap.
      is_correct: true
    - letter: C
      text: The cosine similarity score.
      is_correct: false
    - letter: D
      text: To enforce coordinate constraints.
      is_correct: false
    correct_fb: ✅ Correct! The Earth Mover's Distance provides a smooth metric everywhere,
      solving the vanishing gradient issue that affects traditional BCE-based GANs.
    wrong_fb: ❌ Think about what the W in WGAN stands for. What specific distance
      metric did Arjovsky introduce to replace JS Divergence?
  - num_str: Q2 OF 3
    question: "Why must we call\n          \n           netG.eval()\n          \n\
      \          before running inference on a trained Generator?"
    qid: q79_2
    options:
    - letter: A
      text: To automatically release GPU threads.
      is_correct: false
    - letter: B
      text: To lock the Batch Normalization layers to use running historical statistics
        instead of batch statistics, ensuring predictions are stable and consistent.
      is_correct: true
    - letter: C
      text: To increase numeric precision to FP64.
      is_correct: false
    - letter: D
      text: To delete intermediate weights.
      is_correct: false
    correct_fb: "✅ Correct! In evaluation mode (\n          \n           .eval()\n\
      \          \n          ), layers like Batch Normalization and Dropout lock their\
      \ active states, preventing test-batch statistics from affecting the model's\
      \ predictions."
    wrong_fb: "❌ Think about layers that behave differently during training vs. evaluation.\
      \ Does Batch Normalization continue to update its moving averages when running\
      \ inference? What happens to your predictions if you omit\n          \n    \
      \       .eval()\n          \n          ?"
  - num_str: Q3 OF 3
    question: What is the advantage of Spectral Normalization over Gradient Penalty
      (GP) in stabilized GAN training?
    qid: q79_3
    options:
    - letter: A
      text: Spectral normalization is computationally cheaper. It scales weight matrices
        directly, avoiding the need for expensive second-order gradient calculations
        (like the interpolations required by GP).
      is_correct: true
    - letter: B
      text: It doubles the latent vector size.
      is_correct: false
    - letter: C
      text: It requires no training updates.
      is_correct: false
    - letter: D
      text: To enforce convolutional filter limits.
      is_correct: false
    correct_fb: ✅ Correct! Spectral normalization is a simple, elegant weight constraint
      that avoids the heavy computational overhead of second-order backpropagation
      required by Gradient Penalty.
    wrong_fb: ❌ Think about the math behind Gradient Penalty. It requires creating
      random image interpolations, performing a forward pass, computing gradients,
      and calculating their norm. Is this more or less computationally expensive than
      directly scaling the weights of each layer?
  flashcards:
  - front: GAN Architecture?
    back: 'Two networks training minimax style: Generator makes fake data; Discriminator
      tries to distinguish fake from real.'
  - front: Generator Loss?
    back: 'Minimizes the probability of Discriminator detecting fakes: $\log(1 - D(G(z)))$,
      or maximizes $\log(D(G(z)))$.'
  - front: Discriminator Loss?
    back: 'Maximizes the probability of correct classification: log(D(x)) [reals]
      + log(1 - D(G(z))) [fakes].'
  - front: Mode Collapse?
    back: GAN failure where Generator learns to produce samples from only a few output
      modes, ignoring overall dataset diversity.
  - front: Wasserstein GAN?
    back: Uses Earth Mover's Distance to provide smooth gradients even when probability
      distributions do not overlap.
