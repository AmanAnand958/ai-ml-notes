  quizzes:
  - num_str: Q1 OF 3
    question: "What does the\n          \n           requires_grad=True\n        \
      \  \n          attribute tell the PyTorch compilation engine?"
    qid: q75_1
    options:
    - letter: A
      text: To convert the tensor to FP16.
      is_correct: false
    - letter: B
      text: To track every operation performed on this tensor, building a dynamic
        graph to compute derivatives automatically during backpropagation.
      is_correct: true
    - letter: C
      text: To copy the values to the local GPU thread.
      is_correct: false
    - letter: D
      text: To enforce tensor row constraints.
      is_correct: false
    correct_fb: "✅ Correct! Setting\n          \n           requires_grad=True\n \
      \         \n          acts as a signal for the Autograd engine to begin tracking\
      \ structural operations to build a dynamic computation graph on the fly."
    wrong_fb: '❌ Think about what the name implies: "requires gradient". Does this
      tell the engine to compile to float, or does it trigger tracking operations
      to calculate gradients later?'
  - num_str: Q2 OF 3
    question: Which command creates a zero-copy PyTorch tensor that shares memory
      with an underlying NumPy array?
    qid: q75_2
    options:
    - letter: A
      text: torch.tensor(numpy_array)
      is_correct: false
    - letter: B
      text: torch.from_numpy(numpy_array)
      is_correct: true
    - letter: C
      text: torch.copy(numpy_array)
      is_correct: false
    - letter: D
      text: torch.as_tensor(numpy_array).copy()
      is_correct: false
    correct_fb: "✅ Correct!\n          \n           torch.from_numpy\n          \n\
      \          returns a shared-memory view, meaning mutations to either the numpy\
      \ array or tensor reflect instantly on the other, bypassing expensive RAM copying."
    wrong_fb: "❌ Remember that\n          \n           torch.tensor()\n          \n\
      \          copies the array data by default. Which specific function says it\
      \ creates the tensor directly \"from\" the numpy array without making a redundant\
      \ copy?"
  - num_str: Q3 OF 3
    question: Why does PyTorch Autograd calculate a Jacobian-Vector Product (JVP)
      rather than a complete Jacobian matrix?
    qid: q75_3
    options:
    - letter: A
      text: Calculating and storing a complete Jacobian matrix for millions of parameters
        requires massive memory and compute. A JVP scales linearly with parameters,
        returning only the needed gradients.
      is_correct: true
    - letter: B
      text: Because JVP limits the learning rate.
      is_correct: false
    - letter: C
      text: To bypass GPU execution loops.
      is_correct: false
    - letter: D
      text: To enforce convolutional filter limits.
      is_correct: false
    correct_fb: ✅ Correct! Evaluating a complete Jacobian matrix for deep models with
      millions of weights is computationally impractical. Autograd evaluates JVP,
      which is much faster and memory-efficient.
    wrong_fb: ❌ Think about the dimensions. If a model has 10 million parameters and
      10 outputs, what is the size of the Jacobian matrix? Is it memory-efficient
      to compute that full matrix, or is it better to directly compute the vector
      product?
  flashcards:
  - front: GAN Architecture?
    back: 'Two networks training minimax style: Generator makes fake data; Discriminator
      tries to distinguish fake from real.'
  - front: Generator Loss?
    back: 'Minimizes the probability of Discriminator detecting fakes: $\log(1 - D(G(z)))$,
      or maximizes $\log(D(G(z)))$.'
  - front: Discriminator Loss?
    back: 'Maximizes the probability of correct classification: log(D(x)) [reals]
      + log(1 - D(G(z))) [fakes].'
  - front: Mode Collapse?
    back: GAN failure where Generator learns to produce samples from only a few output
      modes, ignoring overall dataset diversity.
  - front: Wasserstein GAN?
    back: Uses Earth Mover's Distance to provide smooth gradients even when probability
      distributions do not overlap.
