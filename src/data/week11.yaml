  - num_str: Q2 OF 3
    question: "Why must manual model parameter updates be executed inside a\n    \
      \      \n           with torch.no_grad():\n          \n          block?"
    qid: q76_2
    options:
    - letter: A
      text: To copy the values to CUDA.
      is_correct: false
    - letter: B
      text: To double the precision of tensors.
      is_correct: false
    - letter: C
      text: To temporarily disable Autograd's tracking mechanism. Without it, PyTorch
        would track the update calculations in the computational graph, leading to
        a memory-consuming recursive loop.
      is_correct: true
    - letter: D
      text: To enforce positive weight boundaries.
      is_correct: false
    correct_fb: "✅ Correct! The\n          \n           torch.no_grad()\n        \
      \  \n          block tells PyTorch not to build graph nodes for these basic\
      \ operations, keeping memory usage stable during gradient updates."
    wrong_fb: ❌ Think about graph construction. If PyTorch tracks every operation,
      and you perform subtraction on parameters, does it track that subtraction as
      a node in the graph? What happens to memory if you do this over thousands of
      steps?
  - num_str: Q3 OF 3
    question: "What is the functional difference between\n          \n           param.data.sub_(x)\n\
      \          \n          and\n          \n           param.sub_(x)\n         \
      \ \n          ?"
    qid: q76_3
    options:
    - letter: A
      text: "param.data\n          \n          copies the tensor values."
      is_correct: false
    - letter: B
      text: "Modifying\n          \n           param.data\n          \n          updates\
        \ the raw tensor values directly without Autograd tracking, whereas modifying\n\
        \          \n           param\n          \n          requires running inside\
        \ a\n          \n           torch.no_grad()\n          \n          block to\
        \ avoid graph updates. Modifying\n          \n           .data\n         \
        \ \n          is deprecated in modern PyTorch."
      is_correct: true
    - letter: C
      text: They are identical.
      is_correct: false
    - letter: D
      text: To speed up structural filters.
      is_correct: false
    correct_fb: "✅ Correct! Modifying\n          \n           .data\n          \n\
      \          bypasses Autograd safety checks entirely, which can lead to silent\
      \ bugs during complex gradient calculations. Modern PyTorch requires using\n\
      \          \n           torch.no_grad()\n          \n          on standard tensors\
      \ instead."
    wrong_fb: "❌ Remember that accessing\n          \n           .data\n         \
      \ \n          directly strips the Autograd wrapper, while working with the raw\
      \ parameter preserves safety checks. Which approach is modern and recommended\
      \ under\n          \n           torch.no_grad()\n          \n          ?"
  flashcards:
  - front: GAN Architecture?
    back: 'Two networks training minimax style: Generator makes fake data; Discriminator
      tries to distinguish fake from real.'
  - front: Generator Loss?
    back: 'Minimizes the probability of Discriminator detecting fakes: $\log(1 - D(G(z)))$,
      or maximizes $\log(D(G(z)))$.'
  - front: Discriminator Loss?
    back: 'Maximizes the probability of correct classification: log(D(x)) [reals]
      + log(1 - D(G(z))) [fakes].'
  - front: Mode Collapse?
    back: GAN failure where Generator learns to produce samples from only a few output
      modes, ignoring overall dataset diversity.
  - front: Wasserstein GAN?
    back: Uses Earth Mover's Distance to provide smooth gradients even when probability
      distributions do not overlap.
