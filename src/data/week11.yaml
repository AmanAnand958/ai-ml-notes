- id: '76'
  day_num: 76
  title: Custom Modules & Data Pipelines in PyTorch
  subtitle: "Writing production-ready deep learning models requires structured abstraction.\n\
    \      PyTorch organizes model architectures, data flow, and training loops using\
    \ modular OOP classes.\n      Today, we master subclassingnn.Moduleto design neural\
    \ networks,\n      build robust data-streaming pipelines usingDatasetandDataLoader,\n\
    \      dissect the inner workings of an optimizer by writing amanual parameter\
    \ update step,\n      and build a fully-functional regularized FNN class from\
    \ scratch in PyTorch."
  time_estimate: 5 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - "Subclass\n        \n         nn.Module\n        \n        and define parameters,\
    \ layers, and custom forward hooks."
  - "Create custom\n        \n         Dataset\n        \n        classes implementing\n\
    \        \n         __len__\n        \n        and\n        \n         __getitem__\n\
    \        \n        ."
  - "Explain the exact mathematical reason why manual weight updates must run in a\n\
    \        \n         torch.no_grad()\n        \n        block."
  - Build a batch training loop with custom learning rate decay in PyTorch.
  checklist:
  - id: chk_76_1
    text: Study the core mathematical and architectural principles of Custom Modules
      & Data Pipelines in PyTorch
  - id: chk_76_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_76_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_76_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - Adversarial Game Theory &
  - 'DCGAN: Deep Convolutional'
  - PyTorch Foundations
  - Custom Modules & Data Pip
  - 'DCGAN Project: Dataset Lo'
  - 'DCGAN Project: Min-Max Tr'
  - 'DCGAN Project: Persistenc'
  hinglish: 'CycleGAN bina paired data ke style transfer karta hai: horse ko zebra
    mein convert karo, summer ko winter mein. Cycle consistency loss ensure karta
    hai ki content preserve ho!'
  analogy: Dataset aur DataLoader bilkul ek kitchen team ki tarah kaam karte hain.
    Dataset ek prep cook hai jo raw vegetable rack (storage disk) se ek ek item nikal
    ke clean aur cut karta hai (__getitem__). DataLoader head chef hai jo prep cook
    se continuous cut chopped items lekar unhe ideal plates (batches) mein arrange
    karke main stove (GPU model training) par bhejta hai.
  theory_html: "<h3 class=\"sh3\">\n       1. Subclassing\n       \n        nn.Module\n\
    \       \n       for Custom Networks\n      </h3>\n<p>\n       In PyTorch, all\
    \ network structures inherit from the base\n       \n        torch.nn.Module\n\
    \       \n       .\n    When subclassing, we define the trainable layers in the\n\
    \       \n        __init__\n       \n       constructor and lay out the execution\
    \ flow in the\n       \n        forward\n       \n       pass.\n       \n    \
    \    nn.Module\n       \n       handles structural overhead, such as parameter\
    \ registration, weight initialization hooks, and device migration (\n       \n\
    \        .to(device)\n       \n       recursively moves all internal layer parameters!).\n\
    \      </p>\n<h3 class=\"sh3\">\n       2. PyTorch Data Pipelines: Dataset &amp;\
    \ DataLoader\n      </h3>\n<p>\n       To stream data without running out of RAM,\
    \ PyTorch separates data loading from model execution:\n      </p>\n<ul class=\"\
    prose-list\">\n<li>\n<strong>\n         Dataset:\n        </strong>\n        A\
    \ map-style indexer subclassing\n        \n         torch.utils.data.Dataset\n\
    \        \n        . It requires overriding exactly three functions:\n       \
    \ <br/>\n        -\n        \n         __init__(self)\n        \n        : Instantiates\
    \ raw arrays or file paths.\n        <br/>\n        -\n        \n         __len__(self)\n\
    \        \n        : Returns total sample counts.\n        <br/>\n        -\n\
    \        \n         __getitem__(self, idx)\n        \n        : Loads and returns\
    \ a single sample pair\n        \n         (features, label)\n        \n     \
    \   at index\n        \n         idx\n        \n        (crucial for lazy-loading\
    \ images from disk!).\n       </li>\n<li>\n<strong>\n         DataLoader:\n  \
    \      </strong>\n        Takes a\n        \n         Dataset\n        \n    \
    \    and handles multi-process batching, shuffling, and drop-last alignments.\
    \ It yields clean mini-batches automatically.\n       </li>\n</ul>\n<h3 class=\"\
    sh3\">\n       3. Writing a Manual Weight Update Step\n      </h3>\n<p>\n    \
    \   To truly understand how optimizers like SGD operate, we can manually update\
    \ model weights.\n    We must modify weights inside a\n       <strong>\n\n   \
    \      torch.no_grad()\n        \n</strong>\n       context manager, using\n \
    \      <strong>\n        in-place subtraction (\n        \n         sub_\n   \
    \     \n        )\n       </strong>\n       :\n      </p>\n<div class=\"math-block\"\
    >\n<span class=\"formula\">\n        $$w \\leftarrow w - \\eta \\cdot \\nabla_w\
    \ \\mathcal{L}$$\n       </span>\n<span class=\"desc\">\n        Where $\\eta$\
    \ is the learning rate, and updates must be in-place to avoid building dynamic\
    \ graph nodes on the update itself.\n       </span>\n</div>\n<p>\n       If we\
    \ omit\n       \n        torch.no_grad()\n       \n       , PyTorch will attempt\
    \ to track the gradient descent step itself in the computational graph.\n    This\
    \ creates an infinite recursion of computational graphs, rapidly consuming system\
    \ memory and triggering out-of-memory crashes!\n      </p>\n<h3 class=\"sh3\"\
    >\n       4. Executable PyTorch Pipeline with Manual SGD\n      </h3>\n<p>\n \
    \      Let's write a complete, self-contained Python script implementing a custom\
    \ dataset, custom neural network, and a manual gradient descent update loop:\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — custom_pytorch_pipeline.py\n        </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n         \
    \ copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span>\
    \ torch.nn <span class=\"kw\">as</span> nn\n<span class=\"kw\">from</span> torch.utils.data\
    \ <span class=\"kw\">import</span> Dataset, DataLoader\n\n<span class=\"cm\">#\
    \ 1. Custom Toy Dataset subclass</span>\n<span class=\"kw\">class</span> <span\
    \ class=\"cls\">SyntheticDataset</span>(Dataset):\n    <span class=\"kw\">def</span>\
    \ <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>):\n      \
    \  <span class=\"kw\">self</span>.x = torch.<span class=\"fn\">randn</span>(<span\
    \ class=\"num\">100</span>, <span class=\"num\">10</span>)\n        <span class=\"\
    kw\">self</span>.y = torch.<span class=\"fn\">randint</span>(<span class=\"num\"\
    >0</span>, <span class=\"num\">2</span>, (<span class=\"num\">100</span>, <span\
    \ class=\"num\">1</span>)).<span class=\"fn\">float</span>()\n    <span class=\"\
    kw\">def</span> <span class=\"fn\">__len__</span>(<span class=\"kw\">self</span>):\n\
    \        <span class=\"kw\">return</span> <span class=\"fn\">len</span>(<span\
    \ class=\"kw\">self</span>.x)\n    <span class=\"kw\">def</span> <span class=\"\
    fn\">__getitem__</span>(<span class=\"kw\">self</span>, idx):\n        <span class=\"\
    kw\">return</span> <span class=\"kw\">self</span>.x[idx], <span class=\"kw\">self</span>.y[idx]\n\
    \n<span class=\"cm\"># 2. Custom FNN subclassing nn.Module</span>\n<span class=\"\
    kw\">class</span> <span class=\"cls\">BinaryClassifier</span>(nn.Module):\n  \
    \  <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"\
    kw\">self</span>):\n        <span class=\"fn\">super</span>().<span class=\"fn\"\
    >__init__</span>()\n        <span class=\"kw\">self</span>.layer1 = nn.<span class=\"\
    fn\">Linear</span>(<span class=\"num\">10</span>, <span class=\"num\">8</span>)\n\
    \        <span class=\"kw\">self</span>.layer2 = nn.<span class=\"fn\">Linear</span>(<span\
    \ class=\"num\">8</span>, <span class=\"num\">1</span>)\n        <span class=\"\
    kw\">self</span>.relu = nn.<span class=\"fn\">ReLU</span>()\n        <span class=\"\
    kw\">self</span>.sigmoid = nn.<span class=\"fn\">Sigmoid</span>()\n\n    <span\
    \ class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\"\
    >self</span>, x):\n        x = <span class=\"kw\">self</span>.<span class=\"fn\"\
    >relu</span>(<span class=\"kw\">self</span>.<span class=\"fn\">layer1</span>(x))\n\
    \        x = <span class=\"kw\">self</span>.<span class=\"fn\">sigmoid</span>(<span\
    \ class=\"kw\">self</span>.<span class=\"fn\">layer2</span>(x))\n        <span\
    \ class=\"kw\">return</span> x\n\n<span class=\"cm\"># 3. Instantiate Pipeline</span>\n\
    dataset = <span class=\"fn\">SyntheticDataset</span>()\ndataloader = <span class=\"\
    fn\">DataLoader</span>(dataset, batch_size=<span class=\"num\">20</span>, shuffle=<span\
    \ class=\"kw\">True</span>)\nmodel = <span class=\"fn\">BinaryClassifier</span>()\n\
    criterion = nn.<span class=\"fn\">BCELoss</span>()\nlr = <span class=\"num\">0.1</span>\n\
    \n<span class=\"cm\"># 4. Single manual training epoch</span>\n<span class=\"\
    kw\">for</span> batch_x, batch_y <span class=\"kw\">in</span> dataloader:\n  \
    \  <span class=\"cm\"># Forward Pass</span>\n    preds = <span class=\"fn\">model</span>(batch_x)\n\
    \    loss = <span class=\"fn\">criterion</span>(preds, batch_y)\n    \n    <span\
    \ class=\"cm\"># Reset existing gradients</span>\n    model.<span class=\"fn\"\
    >zero_grad</span>()\n    \n    <span class=\"cm\"># Backpropagation</span>\n \
    \   loss.<span class=\"fn\">backward</span>()\n    \n    <span class=\"cm\">#\
    \ Manual weight update (Simulating custom SGD!)</span>\n    <span class=\"kw\"\
    >with</span> torch.<span class=\"fn\">no_grad</span>():\n        <span class=\"\
    kw\">for</span> param <span class=\"kw\">in</span> model.<span class=\"fn\">parameters</span>():\n\
    \            param.<span class=\"fn\">sub_</span>(lr * param.grad)\n\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"Final batch loss: {loss.item():.4f}\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Success! Manual\
    \ backpropagation step ran smoothly!\"</span>)</pre>\n</div>\n<h3 class=\"sh3\"\
    >\n       5. Writing a Custom Learning Rate Scheduler\n      </h3>\n<p>\n    \
    \   While PyTorch provides standard schedulers (like\n       \n        StepLR\n\
    \       \n       or\n       \n        CosineAnnealingLR\n       \n       ), advanced\
    \ research often requires custom learning rate schedules (e.g. warming up the\
    \ learning rate during the first few epochs followed by cosine decay).\n    We\
    \ can implement this by subclassing PyTorch's internal\n       \n        _LRScheduler\n\
    \       \n       class and overriding the\n       \n        get_lr(self)\n   \
    \    \n       method:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — custom_scheduler.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span>\
    \ torch.nn <span class=\"kw\">as</span> nn\n<span class=\"kw\">from</span> torch.optim.lr_scheduler\
    \ <span class=\"kw\">import</span> _LRScheduler\n\n<span class=\"kw\">class</span>\
    \ <span class=\"cls\">WarmupCosineDecayLR</span>(_LRScheduler):\n    <span class=\"\
    kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>,\
    \ optimizer, warmup_epochs, max_epochs, last_epoch=-<span class=\"num\">1</span>):\n\
    \        <span class=\"kw\">self</span>.warmup_epochs = warmup_epochs\n      \
    \  <span class=\"kw\">self</span>.max_epochs = max_epochs\n        <span class=\"\
    fn\">super</span>().<span class=\"fn\">__init__</span>(optimizer, last_epoch)\n\
    \n    <span class=\"kw\">def</span> <span class=\"fn\">get_lr</span>(<span class=\"\
    kw\">self</span>):\n        epoch = <span class=\"kw\">self</span>.last_epoch\n\
    \        <span class=\"kw\">if</span> epoch &lt; <span class=\"kw\">self</span>.warmup_epochs:\n\
    \            <span class=\"cm\"># Linear warmup</span>\n            <span class=\"\
    kw\">return</span> [base_lr * (epoch + <span class=\"num\">1</span>) / <span class=\"\
    kw\">self</span>.warmup_epochs <span class=\"kw\">for</span> base_lr <span class=\"\
    kw\">in</span> <span class=\"kw\">self</span>.base_lrs]\n        <span class=\"\
    kw\">else</span>:\n            <span class=\"cm\"># Cosine decay</span>\n    \
    \        progress = (epoch - <span class=\"kw\">self</span>.warmup_epochs) / (<span\
    \ class=\"kw\">self</span>.max_epochs - <span class=\"kw\">self</span>.warmup_epochs)\n\
    \            factor = <span class=\"num\">0.5</span> * (<span class=\"num\">1.0</span>\
    \ + torch.<span class=\"fn\">cos</span>(torch.<span class=\"fn\">tensor</span>(progress\
    \ * torch.pi)).<span class=\"fn\">item</span>())\n            <span class=\"kw\"\
    >return</span> [base_lr * factor <span class=\"kw\">for</span> base_lr <span class=\"\
    kw\">in</span> <span class=\"kw\">self</span>.base_lrs]\n\n<span class=\"cm\"\
    ># Verify operation</span>\nmodel = nn.<span class=\"fn\">Linear</span>(<span\
    \ class=\"num\">10</span>, <span class=\"num\">1</span>)\noptimizer = torch.optim.<span\
    \ class=\"fn\">SGD</span>(model.<span class=\"fn\">parameters</span>(), lr=<span\
    \ class=\"num\">0.1</span>)\nscheduler = <span class=\"fn\">WarmupCosineDecayLR</span>(optimizer,\
    \ warmup_epochs=<span class=\"num\">5</span>, max_epochs=<span class=\"num\">10</span>)\n\
    \n<span class=\"kw\">for</span> epoch <span class=\"kw\">in</span> <span class=\"\
    fn\">range</span>(<span class=\"num\">10</span>):\n    <span class=\"cm\"># Simulate\
    \ training step...</span>\n    optimizer.<span class=\"fn\">step</span>()\n  \
    \  scheduler.<span class=\"fn\">step</span>()\n    <span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Epoch {epoch+1}: Learning Rate = {scheduler.get_last_lr()[0]:.4f}\"\
    </span>)</pre>\n</div>\n\n<h2 class=\"sh2\">\n       \U0001F6E0 Tasks\n      </h2>\n\
    <div style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\"\
    >\n        \U0001F50D\n        <strong>\n         Search terms:\n        </strong>\n\
    \n         frechet inception distance fid calculation evaluation, gan metrics\
    \ inception score\n        \n</div>\n<!-- /day-76-theory -->\n<!-- /day-76-resources-section\
    \ -->"
