  - num_str: Q2 OF 3
    question: What targets are passed to the loss function when updating the Generator?
    qid: q78_2
    options:
    - letter: A
      text: Fake Labels (0), because the images are synthetic.
      is_correct: false
      id: a
    - letter: B
      text: Real Labels (1), because the Generator's goal is to produce images that
        the Discriminator classifies as real.
      is_correct: true
      id: b
    - letter: C
      text: A mixture of random indices.
      is_correct: false
      id: c
    - letter: D
      text: A zero-vector tensor.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Although the images are fake, the Generator's objective
      is to "fool" the Discriminator into classifying them as real. We calculate the
      loss with real labels (1) as the target.
    wrong_fb: ❌ Remember the game dynamics. The Generator wants to fool the Discriminator.
      If it wants the Discriminator to output D(G(z)) = 1 (real), what target should
      we pass to the BCE loss to calculate the gradient?
    correct: b
  - num_str: Q3 OF 3
    question: "Why does DCGAN utilize the Adam optimizer with beta parameters set\
      \ to\n          \n           (0.5, 0.999)\n          \n          rather than\
      \ the default\n          \n           (0.9, 0.999)\n      ...?"
    qid: q78_3
    options:
    - letter: A
      text: Reducing the first momentum beta to 0.5 decreases historical gradient
        smoothing, stabilizing training and preventing ...
      is_correct: true
      id: a
    - letter: B
      text: To double the learning rate.
      is_correct: false
      id: b
    - letter: C
      text: To bypass GPU execution loops.
      is_correct: false
      id: c
    - letter: D
      text: To enforce convolutional filter limits.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Lowering the beta momentum parameter makes optimizer updates
      highly sensitive to the current gradient step, preventing historical bias and
      stabilizing adversarial training.
    wrong_fb: ❌ Think about what the first beta parameter in Adam does. It controls
      gradient smoothing (momentum). If it is set to 0.9, how much weight does historical
      gradient direction hold? Does lowering it to 0.5 make the optimizer adapt faster
      to changes in the competition?
    correct: a
  flashcards:
