      \            <br/>\n            2. Implement standard strided convolutions to\
      \ downsample: 28x28 -&gt; 14x14 -&gt; 7x7.\n            <br/>\n            3.\
      \ Apply Batch Normalization ONLY to the second convolutional layer (not the\
      \ first, adhering to DCGAN rules!).\n            <br/>\n            4. Apply\
      \ LeakyReLU activations with negative_slope = 0.2.\n            <br/>\n    \
      \        5. Flatten and output a single logit.\n           </strong></p>"
    done_when: Your model code instantiates correctly, executes a forward pass on
      a batch of shape (8, 1, 28, 28) without error, and outputs predictions of shape
