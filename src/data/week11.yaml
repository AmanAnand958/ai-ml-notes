  quizzes:
  - num_str: Q1 OF 3
    question: Which layer is an exception to the Batch Normalization rule in the Generator
      under the DCGAN guidelines?
    qid: q74_1
    options:
    - letter: A
      text: The first projection layer.
      is_correct: false
    - letter: B
      text: The final output layer.
      is_correct: true
    - letter: C
      text: All upsampling blocks.
      is_correct: false
    - letter: D
      text: To enforce coordinate transforms.
      is_correct: false
    correct_fb: ✅ Correct! In the Generator, applying Batch Normalization to the output
      layer scales the pixel activations across the batch, introducing dependencies
      between images and skewing final values, which destabilizes convergence.
    wrong_fb: ❌ Review the DCGAN design table carefully. Does Batch Norm get omitted
      at the very beginning of the Generator, or at the final layer where actual pixel
      values are output?
  - num_str: Q2 OF 3
    question: Calculate the output height H_out of ConvTranspose2d with H_in = 7,
      S = 2, P = 1, K = 4, and OP = 0.
    qid: q74_2
    options:
    - letter: A
      text: '12'
      is_correct: false
    - letter: B
      text: '16'
      is_correct: false
    - letter: C
      text: '14'
      is_correct: true
    - letter: D
      text: '18'
      is_correct: false
    correct_fb: ✅ Correct! H_out = (7 - 1) * 2 - 2(1) + 4 + 0 = 6 * 2 - 2 + 4 = 12
      - 2 + 4 = 14. This is the exact size mapping used to scale features in Generator
      blocks.
    wrong_fb: '❌ Plug the values into the formula: H_out = (H_in - 1) * S - 2P + K
      + OP. Here H_in = 7, S = 2, P = 1, K = 4, and OP = 0. Calculate step-by-step.'
  - num_str: Q3 OF 3
    question: Why does DCGAN utilize LeakyReLU rather than standard ReLU in the Discriminator?
    qid: q74_3
    options:
    - letter: A
      text: To speed up parameters.
      is_correct: false
    - letter: B
      text: To normalize intermediate layers.
      is_correct: false
    - letter: C
      text: To prevent dying gradient paths. If the Discriminator rejects fake inputs,
        ReLU would zero out negative regions completely, leading to zero backpropagating
        gradients to update the Generator.
      is_correct: true
    - letter: D
      text: To enforce positive definite inputs.
      is_correct: false
    correct_fb: ✅ Correct! LeakyReLU guarantees that a small fractional gradient (usually
      0.2) is preserved even for negative inputs, keeping the backpropagation channels
      active to train the Generator.
    wrong_fb: ❌ Think about what happens when the input to ReLU is negative. The gradient
      becomes 0. If the Discriminator classifies something as fake (highly negative
      region), how can gradients flow back to update the Generator?
  flashcards:
  - front: GAN Architecture?
    back: 'Two networks training minimax style: Generator makes fake data; Discriminator
      tries to distinguish fake from real.'
  - front: Generator Loss?
    back: 'Minimizes the probability of Discriminator detecting fakes: $\log(1 - D(G(z)))$,
      or maximizes $\log(D(G(z)))$.'
  - front: Discriminator Loss?
    back: 'Maximizes the probability of correct classification: log(D(x)) [reals]
      + log(1 - D(G(z))) [fakes].'
  - front: Mode Collapse?
    back: GAN failure where Generator learns to produce samples from only a few output
      modes, ignoring overall dataset diversity.
  - front: Wasserstein GAN?
    back: Uses Earth Mover's Distance to provide smooth gradients even when probability
      distributions do not overlap.
