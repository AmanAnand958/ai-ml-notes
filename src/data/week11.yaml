  hinglish: Score matching aur DDPM — diffusion model frameworks hain. Training stable
    hai GAN se, quality GAN se better ho sakti hai, lekin inference slow hai — multiple
    denoising steps chahiye!
  analogy: A Capstone GAN project is like an art forge. An apprentice (generator)
    prints replicas while an art critic (discriminator) spots details, refining the
    style over epochs.
  theory_html: "<h3 class=\"sh3\">\n       1. Advanced GAN Optimization: WGAN and\
    \ Gradient Penalty\n      </h3>\n<p>\n       Standard GANs minimize Binary Cross-Entropy\
    \ loss, which mathematically approximates the\n       <strong>\n        Jensen-Shannon\
    \ (JS) Divergence\n       </strong>\n       between training and synthetic data.\n\
    \    When the data distributions do not overlap (e.g. early in training), the\
    \ JS divergence is a constant ($\\log 2$), resulting in zero gradients.\n    \
    \  </p>\n<p>\n       To resolve this, Arjovsky et al. introduced\n       <strong>\n\
    \        Wasserstein GAN (WGAN)\n       </strong>\n       , which utilizes the\n\
    \       <strong>\n        Earth Mover's Distance (EMD)\n       </strong>\n   \
    \    .\n    The EMD provides smooth gradients everywhere, even when distributions\
    \ do not overlap.\n    To satisfy the Lipschitz continuity condition required\
    \ by EMD, we add a\n       <strong>\n        Gradient Penalty (WGAN-GP)\n    \
    \   </strong>\n       constraint:\n      </p>\n<div class=\"math-block\">\n<span\
    \ class=\"formula\">\n        $$\\mathcal{L}_{\\text{GP}} = \\mathbb{E}_{\\hat{x}\
    \ \\sim p_{\\hat{x}}}[ (||\\nabla_{\\hat{x}} D(\\hat{x})||_2 - 1)^2 ]$$\n    \
    \   </span>\n<span class=\"desc\">\n        Where $\\hat{x}$ is a random interpolation\
    \ between real and fake images, penalizing the Discriminator if the gradient norm\
    \ of its outputs deviates from 1.\n       </span>\n</div>\n<h3 class=\"sh3\">\n\
    \       2. Spectral Normalization: An Alternative Path\n      </h3>\n<p>\n   \
    \    Instead of calculating a complex gradient penalty, modern architectures often\
    \ apply\n       <strong>\n        Spectral Normalization\n       </strong>\n \
    \      directly to convolutional weights.\n    Spectral normalization scales the\
    \ weight matrices by their largest singular value (spectral norm $\\sigma(W)$),\
    \ guaranteeing that the Lipschitz constant of each layer is at most 1:\n     \
    \ </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$W_{\\\
    text{spec}} = \\frac{W}{\\sigma(W)}$$\n       </span>\n<span class=\"desc\">\n\
    \        Ensuring stable gradients during training. In PyTorch, this is implemented\
    \ using\n        \n         nn.utils.spectral_norm\n        \n        .\n    \
    \   </span>\n</div>\n<h3 class=\"sh3\">\n       3. Model Checkpointing: The Production\
    \ Standard\n      </h3>\n<p>\n       When saving models, we must preserve more\
    \ than just raw parameter weights.\n    To resume training seamlessly, we save\
    \ a single dictionary containing the model weight dictionaries, optimizer state\
    \ dictionaries, current epoch count, and final loss value:\n      </p>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — checkpoint_save.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"cm\"># Step 1: Model Training\
    \ &amp; Evaluation Workflow</span>\n<span class=\"kw\">import</span> torch\n\n\
    checkpoint = {{\n    <span class=\"str\">'epoch'</span>: epoch,\n    <span class=\"\
    str\">'generator_state'</span>: netG.<span class=\"fn\">state_dict</span>(),\n\
    \    <span class=\"str\">'discriminator_state'</span>: netD.<span class=\"fn\"\
    >state_dict</span>(),\n    <span class=\"str\">'optimizerG_state'</span>: optimizerG.<span\
    \ class=\"fn\">state_dict</span>(),\n    <span class=\"str\">'optimizerD_state'</span>:\
    \ optimizerD.<span class=\"fn\">state_dict</span>(),\n    <span class=\"str\"\
    >'loss'</span>: current_loss\n}}\ntorch.<span class=\"fn\">save</span>(checkpoint,\
    \ <span class=\"str\">'dcgan_checkpoint.pth'</span>)</pre>\n</div>\n<h3 class=\"\
    sh3\">\n       4. Custom Standalone Inference Script\n      </h3>\n<p>\n     \
    \  Let's write a complete, self-contained Python script to load a saved Generator\
    \ model and perform raw inference to synthesize novel outputs:\n      </p>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\
    \ — dcgan_inference.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n \
    \         Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span>\
    \ torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span>\
    \ nn\n<span class=\"kw\">import</span> torchvision.utils <span class=\"kw\">as</span>\
    \ vutils\n\n<span class=\"cm\"># 1. Re-declare Generator structure (Matching target\
    \ weights)</span>\n<span class=\"kw\">class</span> <span class=\"cls\">Generator</span>(nn.Module):\n\
    \    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"\
    kw\">self</span>):\n        <span class=\"fn\">super</span>().<span class=\"fn\"\
    >__init__</span>()\n        <span class=\"kw\">self</span>.main = nn.<span class=\"\
    fn\">Sequential</span>(\n            nn.<span class=\"fn\">ConvTranspose2d</span>(<span\
    \ class=\"num\">100</span>, <span class=\"num\">512</span>, <span class=\"num\"\
    >4</span>, <span class=\"num\">1</span>, <span class=\"num\">0</span>, bias=<span\
    \ class=\"kw\">False</span>),\n            nn.<span class=\"fn\">BatchNorm2d</span>(<span\
    \ class=\"num\">512</span>),\n            nn.<span class=\"fn\">ReLU</span>(<span\
    \ class=\"kw\">True</span>),\n            nn.<span class=\"fn\">ConvTranspose2d</span>(<span\
    \ class=\"num\">512</span>, <span class=\"num\">256</span>, <span class=\"num\"\
    >4</span>, <span class=\"num\">2</span>, <span class=\"num\">1</span>, bias=<span\
    \ class=\"kw\">False</span>),\n            nn.<span class=\"fn\">BatchNorm2d</span>(<span\
    \ class=\"num\">256</span>),\n            nn.<span class=\"fn\">ReLU</span>(<span\
    \ class=\"kw\">True</span>),\n            nn.<span class=\"fn\">ConvTranspose2d</span>(<span\
    \ class=\"num\">256</span>, <span class=\"num\">128</span>, <span class=\"num\"\
    >4</span>, <span class=\"num\">2</span>, <span class=\"num\">1</span>, bias=<span\
    \ class=\"kw\">False</span>),\n            nn.<span class=\"fn\">BatchNorm2d</span>(<span\
    \ class=\"num\">128</span>),\n            nn.<span class=\"fn\">ReLU</span>(<span\
    \ class=\"kw\">True</span>),\n            nn.<span class=\"fn\">ConvTranspose2d</span>(<span\
    \ class=\"num\">128</span>, <span class=\"num\">64</span>, <span class=\"num\"\
    >4</span>, <span class=\"num\">2</span>, <span class=\"num\">1</span>, bias=<span\
    \ class=\"kw\">False</span>),\n            nn.<span class=\"fn\">BatchNorm2d</span>(<span\
    \ class=\"num\">64</span>),\n            nn.<span class=\"fn\">ReLU</span>(<span\
    \ class=\"kw\">True</span>),\n            nn.<span class=\"fn\">ConvTranspose2d</span>(<span\
    \ class=\"num\">64</span>, <span class=\"num\">3</span>, <span class=\"num\">4</span>,\
    \ <span class=\"num\">2</span>, <span class=\"num\">1</span>, bias=<span class=\"\
    kw\">False</span>),\n            nn.<span class=\"fn\">Tanh</span>()\n       \
    \ )\n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span\
    \ class=\"kw\">self</span>, x): <span class=\"kw\">return</span> <span class=\"\
    kw\">self</span>.<span class=\"fn\">main</span>(x)\n\n<span class=\"cm\"># 2.\
    \ Instantiate and load weights (Simulating saved model load)</span>\nnetG = <span\
    \ class=\"fn\">Generator</span>()\n<span class=\"cm\"># In production: netG.load_state_dict(torch.load('generator.pth',\
    \ map_location='cpu'))</span>\nnetG.<span class=\"fn\">eval</span>()  <span class=\"\
    cm\"># Disable Batch Normalization learning trackers!</span>\n\n<span class=\"\
    cm\"># 3. Generate synthetic outputs from latent noise</span>\n<span class=\"\
    kw\">with</span> torch.<span class=\"fn\">no_grad</span>():\n    noise = torch.<span\
    \ class=\"fn\">randn</span>(<span class=\"num\">8</span>, <span class=\"num\"\
    >100</span>, <span class=\"num\">1</span>, <span class=\"num\">1</span>)\n   \
    \ fake_images = <span class=\"fn\">netG</span>(noise)\n    \n    <span class=\"\
    cm\"># Scale pixels back from [-1, 1] to [0, 1]</span>\n    fake_images = (fake_images\
    \ + <span class=\"num\">1</span>) / <span class=\"num\">2.0</span>\n    \n   \
    \ <span class=\"cm\"># Save the generated grid</span>\n    vutils.<span class=\"\
    fn\">save_image</span>(fake_images, <span class=\"str\">'inference_outputs.png'</span>)\n\
    \n<span class=\"fn\">print</span>(<span class=\"str\">\"Saved standalone inference\
    \ output grid to '</span>inference_outputs.png<span class=\"str\">'!\"</span>)\n\
    <span class=\"kw\">assert</span> fake_images.shape == (<span class=\"num\">8</span>,\
    \ <span class=\"num\">3</span>, <span class=\"num\">64</span>, <span class=\"\
    num\">64</span>), <span class=\"str\">\"Inference shape mismatch!\"</span></pre>\n\
    </div>\n<h2 class=\"sh2\">\n       \U0001F6E0 Tasks\n      </h2>\n<div class=\"\
    debug-block\">\n<div class=\"debug-label\">\n         \U0001F6E0️ WEEKLY DEBUGGING\
    \ CHALLENGE\n        </div>\n<h3 style=\"font-family:var(--font-head); font-size:14px;\
    \ margin-bottom:0.5rem; color:var(--pink);\">\n         Debug: Shared GAN Optimizers\n\
    \        </h3>\n<p style=\"font-size:13px; margin-bottom:0.8rem; line-height:1.6;\"\
    >\n         The Generative Adversarial Network fails to learn, and both generator\
    \ and discriminator losses stay completely flat.\n        </p>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n           python\n\
    \          </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">copy</button><button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">Run</button></div>\n</div>\n<pre><span class=\"\
    kw\">import</span> torch\n<span class=\"cm\"># Instantiating a single optimizer\
    \ for both models</span>\noptimizer = torch.optim.<span class=\"fn\">Adam</span>(\n\
    \    <span class=\"fn\">list</span>(generator.<span class=\"fn\">parameters</span>())\
    \ + <span class=\"fn\">list</span>(discriminator.<span class=\"fn\">parameters</span>()),\n\
    \    lr=<span class=\"num\">0.001</span>\n)</pre>\n</div>\n<button class=\"solution-toggle\"\
    \ onclick=\"toggleSolution('debug-sol-11')\">\n<span>\n          \U0001F50D Reveal\
    \ Bug &amp; Fix\n         </span>\n</button>\n<div class=\"solution-box\" id=\"\
    debug-sol-11\">\n<div class=\"sol-header\">\n          SOLUTION &amp; EXPLANATION\n\
    \         </div>\n<div style=\"padding:1rem; background:rgba(0,0,0,0.2); font-size:13px;\
    \ line-height:1.6;\">\n<strong>\n           The Bug:\n          </strong>\n  \
    \        In GAN training, the Generator and Discriminator compete. Their loss\
    \ functions push them in opposite directions. Training them with a single shared\
    \ optimizer updates both models in lockstep, breaking the minimax optimization\
    \ dynamics. They must have separate optimizers.\n          <br/>\n<br/>\n<strong>\n\
    \           The Fix:\n          </strong>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n             python\n            </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n         \
    \     copy\n             </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    >\n              Run\n             </button>\n</div>\n</div>\n<pre><span class=\"\
    kw\">import</span> torch\n<span class=\"cm\"># Declare separate optimizers to\
    \ allow independent updates</span>\nopt_g = torch.optim.<span class=\"fn\">Adam</span>(generator.<span\
    \ class=\"fn\">parameters</span>(), lr=<span class=\"num\">0.0002</span>, betas=(<span\
    \ class=\"num\">0.5</span>, <span class=\"num\">0.999</span>))\nopt_d = torch.optim.<span\
    \ class=\"fn\">Adam</span>(discriminator.<span class=\"fn\">parameters</span>(),\
    \ lr=<span class=\"num\">0.0002</span>, betas=(<span class=\"num\">0.5</span>,\
    \ <span class=\"num\">0.999</span>))</pre>\n</div>\n</div>\n</div>\n</div><div\
    \ style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\"\
    >\n        \U0001F50D\n        <strong>\n         Search terms:\n        </strong>\n\
    \n         deploying generative models serving flask latency, pytorch model evaluation\
    \ inference mode\n        \n</div>\n<!-- /day-79-theory -->\n<div class=\"callout\"\
    \ style=\"background:rgba(108,140,255,.05); border:1px solid var(--blue); padding:1.2rem;\
    \ border-radius:8px; margin:1.5rem 0;\">\n<h3>\n       \U0001F3A8 Deep Dive: Denoising\
    \ Diffusion Probabilistic Models (DDPM) &amp; Latent Diffusion\n      </h3>\n\
    <p>\n       While GANs optimize an adversarial minimax game,\n       <strong>\n\
    \        Diffusion Models\n       </strong>\n       generate samples through a\
    \ two-phase Markov chain process:\n      </p>\n<ul>\n<li>\n<strong>\n        \
    \ Forward Noise Process $q(x_t|x_{t-1})$:\n        </strong>\n        Gradually\
    \ adds Gaussian noise to input $x_0$ over $T$ steps until $x_T$ becomes pure noise:\
    \ $q(x_t|x_0) = \\mathcal{N}(x_t; \\sqrt{\\bar{\\alpha}_t}x_0, (1-\\bar{\\alpha}_t)I)$.\n\
    \       </li>\n<li>\n<strong>\n         Reverse Denoising Process $p_\\theta(x_{t-1}|x_t)$:\n\
    \        </strong>\n        A neural network (UNet with Attention) learns to predict\
    \ and remove noise $\\epsilon_\\theta(x_t, t)$ at step $t$.\n       </li>\n<li>\n\
    <strong>\n         Latent Diffusion (Stable Diffusion):\n        </strong>\n \
    \       Performs diffusion in lower-dimensional VAE latent space $z = \\mathcal{E}(x)$\
    \ to drastically reduce compute costs.\n       </li>\n</ul>\n</div>"
