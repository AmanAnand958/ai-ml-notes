    wrong_fb: ❌ Think about what apply does. Does it only affect the top-level layers,
      or does it walk down the graph recursively, applying the initialization function
      to every convolutional and batchnorm block?
  flashcards:
  - front: GAN Architecture?
    back: 'Two networks training minimax style: Generator makes fake data; Discriminator
      tries to distinguish fake from real.'
  - front: Generator Loss?
    back: 'Minimizes the probability of Discriminator detecting fakes: $\log(1 - D(G(z)))$,
      or maximizes $\log(D(G(z)))$.'
  - front: Discriminator Loss?
    back: 'Maximizes the probability of correct classification: log(D(x)) [reals]
      + log(1 - D(G(z))) [fakes].'
  - front: Mode Collapse?
    back: GAN failure where Generator learns to produce samples from only a few output
      modes, ignoring overall dataset diversity.
  - front: Wasserstein GAN?
    back: Uses Earth Mover's Distance to provide smooth gradients even when probability
      distributions do not overlap.
  gotcha:
    title: '⚠️ Gotcha: Multi-Head Attention Scale Factor'
    description: Dividing by `sqrt(d_k)` prevents dot-product values from growing
      huge and pushing Softmax into near-zero gradient regions.
  takeaways:
    hinglish_line: "<strong>\n          Ek line mein:\n         </strong>\n      \
      \   Custom dataset mapping dataloader batch collation aur multi-threading generators\
      \ se inputs prepare karta hai."
    bullets:
    - DCGAN inputs must be normalized to $[-1, 1]$ to match the Generator's Tanh outputs.
    - The Generator scales the latent vector $100 \times 1 \times 1$ to $3 \times
      64 \times 64$ using Transpose Convolutions.
    - The Discriminator acts as a binary classifier, downsampling spatial inputs to
      scalar predictions.
    - "We apply weight initializations from a zero-mean normal distribution ($\\mathcal{N}(0,\
      \ 0.02^2)$) using\n          \n           .apply(fn)\n          \n         \
      \ ."
