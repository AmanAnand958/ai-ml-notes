      \          </strong></p>"
    done_when: "Your script runs successfully, verifies that loaded parameters match\
      \ the original weights down to the float precision limit, and cleans up the\
      \ temporary\n           \n            .pth\n           \n           files."
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day79: dcgan model checkpointing
      and generation capstone"'
    sol_id: sol-w11d79t1
    solution_title: ✅ COMPLETE SOLUTION — code_custom_checkpoint_save_and_resume_p.py
    solution_code: "import numpy as np\nimport torch\nnp.random.seed(42)\ntorch.manual_seed(42)\n\
      # code_custom_checkpoint_save_and_resume_p.py — Solution\n# Complete solution\
      \ for: Code Custom Checkpoint Save and Resume Pipeline\n\nimport torch\nfrom\
      \ torch.utils.data import Dataset, DataLoader\nimport numpy as np\n\nclass CustomDataset(Dataset):\n\
      \    def __init__(self, size=100, feature_dim=10):\n        self.data = np.random.randn(size,\
      \ feature_dim).astype(np.float32)\n        self.labels = np.random.randint(0,\
      \ 2, size=size).astype(np.int64)\n\n    def __len__(self):\n        return len(self.data)\n\
      \n    def __getitem__(self, idx):\n        return torch.from_numpy(self.data[idx]),\
      \ torch.tensor(self.labels[idx])\n\ndataset = CustomDataset()\nloader = DataLoader(dataset,\
      \ batch_size=16, shuffle=True)\nsample_x, sample_y = next(iter(loader))\nprint(f\"\
      Dataset Pipeline Executed for: {task_title}\")\nprint(f\"Batch X: {sample_x.shape},\
      \ Batch Y: {sample_y.shape}\")\n\nif __name__ == '__main__':\n    solve()"
