    #e56b8c\" font-size=\"10\" text-anchor=\"middle\" x=\"555\" y=\"284\">\n     \
    \   G found digits {1,4,7} alone fool D — generator variety dies\n       </text>\n\
    <text class=\"w11t\" fill=\"var(--text2)\" font-size=\"10\" text-anchor=\"middle\"\
    \ x=\"390\" y=\"310\">\n        why? G optimizes only against D(z), never against\
    \ the full data distribution\n       </text>\n<text class=\"w11t\" fill=\"#f5d76e\"\
    \ font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"390\" y=\"\
    328\">\n        Fixes: mini-batch discrimination · unrolled GANs · Wasserstein\
    \ loss with gradient penalty\n       </text>\n</svg>\n<h3 class=\"sh3\">\n   \
    \    4. Alternating Numpy GAN Forward Pass Trace\n      </h3>\n<p>\n       Let's\
    \ write a complete, self-contained Python script to demonstrate the forward pass\
    \ calculations and BCE loss formulations for a batch of synthetic samples:\n \
    \     </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — gan_game_theory.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"\
    kw\">def</span> <span class=\"fn\">sigmoid</span>(x):\n    <span class=\"kw\"\
    >return</span> <span class=\"num\">1</span> / (<span class=\"num\">1</span> +\
    \ np.<span class=\"fn\">exp</span>(-x))\n\n<span class=\"cm\"># 1. Simulate data\
    \ batch (Batch size = 4)</span>\nnp.random.<span class=\"fn\">seed</span>(<span\
    \ class=\"num\">42</span>)\nreal_scores = <span class=\"fn\">sigmoid</span>(np.random.<span\
    \ class=\"fn\">randn</span>(<span class=\"num\">4</span>))      <span class=\"\
    cm\"># D(x) for real samples</span>\nfake_logits = np.random.<span class=\"fn\"\
    >randn</span>(<span class=\"num\">4</span>)                <span class=\"cm\"\
    ># Raw G outputs</span>\nfake_scores = <span class=\"fn\">sigmoid</span>(fake_logits)\
    \              <span class=\"cm\"># D(G(z)) for fake samples</span>\n\n<span class=\"\
    fn\">print</span>(<span class=\"str\">\"Discriminator Real Outputs D(x):\"</span>,\
    \ real_scores)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Discriminator\
    \ Fake Outputs D(G(z)):\"</span>, fake_scores)\n\n<span class=\"cm\"># 2. Compute\
    \ Discriminator Loss (BCE)</span>\nd_loss_real = -np.<span class=\"fn\">mean</span>(np.<span\
    \ class=\"fn\">log</span>(real_scores))\nd_loss_fake = -np.<span class=\"fn\"\
    >mean</span>(np.<span class=\"fn\">log</span>(<span class=\"num\">1</span> - fake_scores))\n\
    d_loss = d_loss_real + d_loss_fake\n\n<span class=\"cm\"># 3. Compute Generator\
    \ Loss (Standard Minimax vs. Non-Saturating)</span>\ng_loss_minimax = np.<span\
    \ class=\"fn\">mean</span>(np.<span class=\"fn\">log</span>(<span class=\"num\"\
    >1</span> - fake_scores))\ng_loss_ns = -np.<span class=\"fn\">mean</span>(np.<span\
    \ class=\"fn\">log</span>(fake_scores))  <span class=\"cm\"># Non-Saturating gradient\
    \ heuristic</span>\n\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
    D Loss: {d_loss:.4f} (Real: {d_loss_real:.4f}, Fake: {d_loss_fake:.4f})\"</span>)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"G Standard Minimax Loss:\
    \ {g_loss_minimax:.4f}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"G Non-Saturating Loss: {g_loss_ns:.4f} (Stronger early gradient!)\"</span>)</pre>\n\
    </div>\n<h3 class=\"sh3\">\n       5. Mathematical Alternating Game Simulation\n\
    \      </h3>\n<p>\n       To understand how the min-max competition behaves over\
    \ multiple steps, we can simulate an alternating gradient optimization of a simplified\
    \ game between a single-weight Generator $g$ and a single-weight Discriminator\
    \ $d$:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         python — minimax_game_simulation.py\n        </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n\
    <span class=\"cm\"># Initial weights</span>\nw_d = <span class=\"num\">0.5</span>\n\
    w_g = -<span class=\"num\">0.5</span>\nlr = <span class=\"num\">0.1</span>\n\n\
    <span class=\"fn\">print</span>(<span class=\"str\">\"Initial game state: D_weight\
    \ =\", w_d, \"| G_weight =\"</span>, w_g)\n\n<span class=\"cm\"># Simulate 5 steps\
    \ of competitive updates</span>\n<span class=\"kw\">for</span> step <span class=\"\
    kw\">in</span> <span class=\"fn\">range</span>(<span class=\"num\">5</span>):\n\
    \    <span class=\"cm\"># Discriminator objective: maximize d*g + d*(1-g)</span>\n\
    \    <span class=\"cm\"># Gradient of V with respect to w_d</span>\n    grad_d\
    \ = w_g + (<span class=\"num\">1.0</span> - w_g)\n    w_d += lr * grad_d  <span\
    \ class=\"cm\"># Gradient ascent for D!</span>\n    \n    <span class=\"cm\">#\
    \ Generator objective: minimize w_d * w_g</span>\n    <span class=\"cm\"># Gradient\
    \ of V with respect to w_g</span>\n    grad_g = w_d\n    w_g -= lr * grad_g  <span\
    \ class=\"cm\"># Gradient descent for G!</span>\n    \n    <span class=\"fn\"\
    >print</span>(<span class=\"str\">f\"Step {step+1}: D_weight = {w_d:.4f} | G_weight\
    \ = {w_g:.4f}\"</span>)</pre>\n</div>\n\n<h2 class=\"sh2\">\n       \U0001F6E0\
    \ Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\"\
    >\n        \U0001F50D\n        <strong>\n         Search terms:\n        </strong>\n\
    \n         gan minimax loss mode collapse explain, generator discriminator game\
    \ theory nash equilibrium\n        \n</div>\n<!-- /day-73-theory -->\n<!-- /day-73-resources-section\
    \ -->"
