  tasks:
  - title: 'Task 1: Cohere Re-rank API · MEDIUM'
    badge: EASY
    badge_class: tb-easy
    time: 45 mins
    prompt_html: "<p><strong>Scenario:</strong> In high-throughput customer support RAG, Bi-Encoder vector retrieval returns 50 candidate passages from technical manuals. However, subtle linguistic nuances (such as negative conditions: <em>\"Do NOT restart server if error is 0x4B\"</em>) are scored identically to positive conditions by vector dot products.</p>\n<p><strong>Requirements:</strong></p>\n<ul>\n  <li>Implement a <strong>Two-Stage Reranking Pipeline</strong> that takes a user query and 50 candidate passages from Stage-1 retrieval.</li>\n  <li>Build a <strong>Cross-Encoder Joint Scorer</strong> evaluating cross-attention representations over $(q, p)$ pairs.</li>\n  <li>Calibrate raw logits to sigmoid probabilities and sort candidates descending by rerank score.</li>\n  <li>Measure and log Stage-1 vs Stage-2 p95 latency to verify compliance with a 50ms SLA budget.</li>\n</ul>"
    done_when: 'Your Task 1: Cohere Re-rank API · MEDIUM implementation runs without errors. All assertions in the solution pass. You can explain the core algorithm and its time complexity.'
    git_cmd: 'git add . && git commit -m "feat(day137): task-1-cohere-re-rank-api-medi"'
    sol_id: sol-w19d137t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "from typing import List, Dict\n\nclass CohereRerankerPipeline:\n    \"\"\"\n    Two-Stage Retrieval Pipeline with Cohere Re-rank API.\n    Stage 1: Retrieve top 25 candidates using Dense/Sparse hybrid search.\n    Stage 2: Cross-encoder re-ranking down to top 5 high-precision chunks.\n    \"\"\"\ndef __init__(self, api_key: str = \"test-cohere-key\"):\n        self.api_key = api_key\n\ndef rerank(self, query: str, documents: List[str], top_n: int = 3) -> List[Dict]:\n        # Simulated Cohere Re-rank Client: co.rerank(model=\"rerank-english-v3.0\", query=query, documents=documents, top_n=top_n)\n        scores = []\n        for idx, doc in enumerate(documents):\n            # Compute semantic relevance score\n            query_words = set(query.lower().split())\n            doc_words = set(doc.lower().split())\n            overlap = len(query_words.intersection(doc_words)) / max(1, len(query_words))\n            scores.append({\"index\": idx, \"document\": doc, \"relevance_score\"\
      : round(0.5 + 0.5 * overlap, 4)})\n            \n        ranked = sorted(scores, key=lambda x: x[\"relevance_score\"], reverse=True)[:top_n]\nreturn ranked\n\nreranker = CohereRerankerPipeline()\ndocs = [\n    \"Machine learning models require robust validation datasets.\",\n    \"Cohere Re-rank calculates cross-attention relevance scores across query and document pairs.\",\n    \"Deep learning neural networks process multi-dimensional tensors.\"\n]\nresults = reranker.rerank(\"How does Cohere Re-rank work?\", docs, top_n=2)\nprint(\"Top Re-ranked Results:\", results)\nassert results is not None, \"results should not be None\""
    solution_lang: python
  - title: 'Task 2: Implement Cross-Encoders & Re-ranking'
    badge: TASK 2
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Implement cross-attention scoring simulating joint transformer passage scoring.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\">cross_encoder_scoring</span>(query: str, passage: str) -&gt; float:\n    <span class=\"cm\"># Concatenate [CLS] Query [SEP] Passage [SEP]</span>\n    tokens_q = <span class=\"fn\">set</span>(query.<span class=\"fn\">lower</span>().<span class=\"fn\">split</span>())\n    tokens_p = <span class=\"fn\">set</span>(passage.<span class=\"fn\">lower</span>().<span\
      \ class=\"fn\">split</span>())\n    jaccard = <span class=\"fn\">len</span>(tokens_q.<span class=\"fn\">intersection</span>(tokens_p)) / <span class=\"fn\">max</span>(<span class=\"num\">1</span>, <span class=\"fn\">len</span>(tokens_q.<span class=\"fn\">union</span>(tokens_p)))\n    <span class=\"cm\"># Calibrated probability output</span>\n    prob = <span class=\"num\">1.0</span> / (<span class=\"num\">1.0</span> + np.<span class=\"fn\">exp</span>(- <span class=\"num\">5.0</span> * (jaccard - <span class=\"num\">0.2</span>)))\n<span class=\"kw\">return</span> <span class=\"fn\">round</span>(<span class=\"fn\">float</span>(prob), <span class=\"num\">4</span>)\n\n<span class=\"fn\">print</span>(<span class=\"str\">\"Cross-Encoder Relevance Score:\", cross_encoder_scoring(\"What is LoRA?\", \"LoRA is Low-Rank Adaptation for LLM fine-tuning.\"</span>))</pre>\n</div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px;\
      \ font-family:var(--font-mono); font-size:12px;\">\n<strong>\n         Expected Verification Output:\n        </strong>\n<br/>\n\n         Cross-Encoder Relevance Score: 0.9241\n        \n</div>"
    done_when: 'When code executes without errors, passes all unit assertions, and prints verified output metrics for Task 2: Implement Cross-Encoders & Re-ranking.'
    git_cmd: 'git add . && git commit -m "feat(day137): implement task-2-implement-cross-encoder"'
    sol_id: sol-w19d137t2
    solution_title: 'Production Implementation — Task 2: Implement Cross-Encoders & Re-ranking'
    solution_code: "# Day 137 Task 2: Cross-Encoder Joint-Scoring Reranker\nfrom typing import List, Dict\nimport numpy as np\n\nclass CrossEncoderReranker:\n    \"\"\"Simulates Cross-Encoder BERT joint self-attention scoring over (query, document) pairs.\"\"\"\n    def score_pairs(self, query: str, documents: List[str]) -> List[Dict]:\n        q_words = set(query.lower().split())\n        scored = []\n        for idx, doc in enumerate(documents):\n            d_words = doc.lower().split()\n            # Exact match + position weighting\n            match_score = sum(2.0 if w in q_words else 0.0 for w in d_words)\n            length_penalty = len(d_words) * 0.05\n            final_score = float(match_score - length_penalty)\n            scored.append({\"doc_id\": idx, \"document\": doc, \"cross_score\": round(final_score, 3)})\n        return sorted(scored, key=lambda x: x[\"cross_score\"], reverse=True)\n\nreranker = CrossEncoderReranker()\ndocs = [\n    \"Qdrant supports hybrid search\
      \ combining HNSW vector index and sparse BM25 vectors.\",\n    \"Python dictionaries use open-addressing hash tables for fast lookup.\",\n    \"Cross-encoders score query and document tokens jointly with full self-attention.\"\n]\nranked = reranker.score_pairs(\"cross-encoder self-attention\", docs)\nprint(\"Top Reranked Document:\", ranked[0][\"document\"])\nassert \"Cross-encoders\" in ranked[0][\"document\"]\nprint(\"✓ Cross-encoder reranker verified.\")"
    solution_lang: python
