    solution_code: "# Solution for Task: Step-Back Prompt\nfrom openai import OpenAI\n\nclass StepBackPromptingEngine:\n    def __init__(self):\n        self.client = OpenAI()\n        \ndef generate_step_back_question(self, specific_query: str) -> str:\n        prompt = f\"\"\"You are an expert prompt engineer. Given a specific user question, derive a higher-level 'step-back' question that addresses the underlying core principles and background theory.\n\nSpecific Question: {specific_query}\nStep-Back Question:\"\"\"\n\n        res = self.client.chat.completions.create(\n            model=\"gpt-4o-mini\",\n            messages=[{\"role\": \"user\", \"content\": prompt}],\n            temperature=0.0\n        )\nreturn res.choices[0].message.content.strip()\n\nengine = StepBackPromptingEngine()\nuser_q = \"Why does PyTorch throw a CUDA out of memory error during the backward pass of a 70B parameter model?\"\nstep_back_q = engine.generate_step_back_question(user_q)\nprint(f\"Original Query:\
