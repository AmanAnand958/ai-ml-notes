    wrong_fb: ❌ Incorrect. Faithfulness specifically measures context adherence and hallucination rate. Answer Relevance measures whether the response actually answers the user's question. In enterprise systems, selecting this alternative introduces subtle edge-case failures, unhandled memory overhead, or degraded precision.
