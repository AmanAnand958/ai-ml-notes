    time: 45 mins
    prompt_html: |-
      <p><strong>Scenario:</strong> Deploy an end-to-end production RAG microservice on FastAPI combining all Week 19 technologies under strict performance and reliability SLAs.</p>
      <p><strong>Requirements:</strong></p>
      <ul>
        <li>Integrate Redis semantic vector caching (&lt;5ms cache hit latency).</li>
        <li>Implement Qdrant hybrid search (HNSW dense + BM25 sparse) with Reciprocal Rank Fusion ($k=60$).</li>
        <li>Add Cross-Encoder candidate reranking and Presidio PII data masking.</li>
        <li>Instrument full OpenTelemetry distributed tracing recording prompt/completion token consumption and p95 latency.</li>
      </ul>
    done_when: 'Your Task 1: Assemble the Pipeline · MEDIUM implementation runs without errors. All assertions in the solution
      pass. You can explain the core algorithm and its time complexity.'
    git_cmd: 'git add . && git commit -m "feat(day142): task-1-assemble-the-pipeline-m"'
    sol_id: sol-w19d142t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "\"\"\"\nProduction Implementation: End-to-End Enterprise RAG Pipeline\nModule: Day 142 — Capstone: Production\
      \ RAG System\n\"\"\"\n\nimport numpy as np\nfrom typing import List, Dict, Any\n\nclass ProductionRAGPipeline:\n   \
      \ def __init__(self, corpus: List[str], embeddings: np.ndarray):\n        self.corpus = corpus\n        self.embeddings\
      \ = embeddings\n\n    def retrieve(self, query_vec: np.ndarray, top_k: int = 2) -> List[Dict[str, Any]]:\n        #\
      \ Compute cosine similarities across vector index\n        norms = np.linalg.norm(self.embeddings, axis=1) * np.linalg.norm(query_vec)\
      \ + 1e-9\n        scores = np.dot(self.embeddings, query_vec) / norms\n        ranked_indices = np.argsort(scores)[::-1][:top_k]\n\
      \        \n        return [{\"doc\": self.corpus[i], \"score\": float(scores[i])} for i in ranked_indices]\n\n    def\
      \ generate_context(self, query: str, query_vec: np.ndarray) -> str:\n        results = self.retrieve(query_vec)\n  \
      \      formatted_context = \"\\n---\\n\".join([f\"[{r['score']:.3f}] {r['doc']}\" for r in results])\n        return\
      \ f\"Query: {query}\\nRetrieved Context:\\n{formatted_context}\"\n\nif __name__ == '__main__':\n    corpus = [\n   \
      \     \"vLLM employs PagedAttention to eliminate memory fragmentation in GPU KV caches.\",\n        \"Docker multi-stage\
      \ builds produce compact distroless production container images.\",\n        \"LoRA freezes base weights and trains\
      \ rank decomposition matrices A and B.\"\n    ]\n    vecs = np.array([\n        [0.9, 0.2, 0.1],\n        [0.1, 0.9,\
      \ 0.2],\n        [0.85, 0.3, 0.15]\n    ])\n    pipeline = ProductionRAGPipeline(corpus, vecs)\n    q_vec = np.array([0.92,\
      \ 0.18, 0.08])\n    prompt = pipeline.generate_context(\"How does PagedAttention optimize GPU RAM?\", q_vec)\n    print(prompt)\n\
      \    assert \"vLLM employs PagedAttention\" in prompt\n    print(\"✓ Full production RAG pipeline validated!\")\n"
    solution_lang: python
