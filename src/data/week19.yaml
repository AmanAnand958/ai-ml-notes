      \ <span class=\"fn\">round</span>(<span class=\"fn\">float</span>(prob), <span class=\"num\">4</span>)\n\n<span class=\"\
      fn\">print</span>(<span class=\"str\">\"Cross-Encoder Relevance Score:\", cross_encoder_scoring(\"What is LoRA?\", \"\
      LoRA is Low-Rank Adaptation for LLM fine-tuning.\"</span>))</pre>\n</div>\n<div style=\"margin-top:1rem; padding:10px;\
      \ background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono);\
