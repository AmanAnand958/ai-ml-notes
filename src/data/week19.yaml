    time: ''
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\"\
      >\n        Implement cross-attention scoring simulating joint transformer passage\
      \ scoring.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
      \ class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\"\
      >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n\
      \          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n\
      \           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\"\
      >import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span>\
      \ <span class=\"fn\">cross_encoder_scoring</span>(query: str, passage: str)\
      \ -&gt; float:\n    <span class=\"cm\"># Concatenate [CLS] Query [SEP] Passage\
      \ [SEP]</span>\n    tokens_q = <span class=\"fn\">set</span>(query.<span class=\"\
      fn\">lower</span>().<span class=\"fn\">split</span>())\n    tokens_p = <span\
      \ class=\"fn\">set</span>(passage.<span class=\"fn\">lower</span>().<span class=\"\
      fn\">split</span>())\n    jaccard = <span class=\"fn\">len</span>(tokens_q.<span\
      \ class=\"fn\">intersection</span>(tokens_p)) / <span class=\"fn\">max</span>(<span\
      \ class=\"num\">1</span>, <span class=\"fn\">len</span>(tokens_q.<span class=\"\
      fn\">union</span>(tokens_p)))\n    <span class=\"cm\"># Calibrated probability\
      \ output</span>\n    prob = <span class=\"num\">1.0</span> / (<span class=\"\
      num\">1.0</span> + np.<span class=\"fn\">exp</span>(- <span class=\"num\">5.0</span>\
      \ * (jaccard - <span class=\"num\">0.2</span>)))\n<span class=\"kw\">return</span>\
      \ <span class=\"fn\">round</span>(<span class=\"fn\">float</span>(prob), <span\
      \ class=\"num\">4</span>)\n\n<span class=\"fn\">print</span>(<span class=\"\
      str\">\"Cross-Encoder Relevance Score:\", cross_encoder_scoring(\"What is LoRA?\"\
      , \"LoRA is Low-Rank Adaptation for LLM fine-tuning.\"</span>))</pre>\n</div>\n\
      <div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05);\
      \ border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono);\
      \ font-size:12px;\">\n<strong>\n         Expected Verification Output:\n   \
      \     </strong>\n<br/>\n\n         Cross-Encoder Relevance Score: 0.9241\n \
      \       \n</div>"
    done_when: 'Code executes without errors, passes all unit assertions, and prints
      verified output metrics for Task 2: Implement Cross-Encoders & Re-ranking.'
    git_cmd: 'git add . && git commit -m "feat(day137): implement task-2-implement-cross-encoder"'
    sol_id: sol-w19d137t2
    solution_title: 'Production Implementation — Task 2: Implement Cross-Encoders
      & Re-ranking'
    solution_code: "# GenAI & Agent Workflow Pipeline for Day 137: Cross-Encoders\
      \ & Re-ranking - Task 2: Implement Cross-Encoders & Re-ranking\nimport json\n\
      import numpy as np\n\ndef cosine_similarity(a, b):\n    return np.dot(a, b)\
      \ / (np.linalg.norm(a) * np.linalg.norm(b))\n\nclass VectorIndex:\n    def __init__(self):\n\
      \        self.documents = []\n        self.vectors = []\n        \n    def add_document(self,\
      \ doc_id, text, vector):\n        self.documents.append({\"id\": doc_id, \"\
      text\": text})\n        self.vectors.append(np.array(vector))\n        \n  \
      \  def search(self, query_vec, top_k=2):\n        scores = [cosine_similarity(query_vec,\
      \ doc_vec) for doc_vec in self.vectors]\n        ranked_indices = np.argsort(scores)[::-1][:top_k]\n\
      \        return [{'doc': self.documents[i], 'score': float(scores[i])} for i\
      \ in ranked_indices]\n\ndef run_genai_workflow():\n    np.random.seed(42)\n\
      \    index = VectorIndex()\n    \n    # Ingest knowledge documents\n    docs\
      \ = [\n        \"LangGraph enables cyclic stateful multi-agent collaboration\
      \ with human-in-the-loop.\",\n        \"PagedAttention eliminates memory fragmentation\
      \ in vLLM by treating KV cache like virtual memory pages.\",\n        \"LoRA\
      \ freezes pretrained weights and injects trainable low-rank decomposition matrices.\"\
      \n    ]\n    for idx, d in enumerate(docs):\n        index.add_document(f\"\
      doc_{idx+1}\", d, np.random.randn(64))\n        \n    # Execute query retrieval\n\
      \    query_vec = np.random.randn(64)\n    results = index.search(query_vec,\
      \ top_k=2)\n    print(\"Retrieved Relevant Contexts:\")\n    print(json.dumps(results,\
      \ indent=2))\n    \n    assert len(results) == 2, \"Search must return top-k\
      \ matches!\"\n    print(\"✅ GenAI retrieval engine passed all operational benchmarks.\"\
      )\n    return results\n\nif __name__ == \"__main__\":\n    run_genai_workflow()"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: What is the architectural difference between Bi-Encoders and Cross-Encoders
      in RAG?
    qid: q137_1
    options:
    - letter: A
      text: Bi-Encoders encode query and document independently (fast O(N+M)); Cross-Encoders
        pass query and document jointly into full self-attention (accurate O(N×M)).
      is_correct: true
    - letter: B
      text: Bi-Encoders use two LLMs, while Cross-Encoders use zero neural networks.
      is_correct: false
    - letter: C
      text: Bi-Encoders can only run on GPUs; Cross-Encoders only run on CPUs.
      is_correct: false
    - letter: D
      text: Cross-Encoders pre-compute vectors and store them in vector databases.
      is_correct: false
    correct_fb: ✅ Correct! Bi-Encoders compute query and document embeddings in isolation,
      allowing instant vector search. Cross-Encoders allow every query token to attend
      to every document token via full cross-attention for maximum precision.
    wrong_fb: ❌ Incorrect. Bi-Encoders produce independent fixed vectors for fast
      similarity indexing. Cross-Encoders jointly attend across query-document pairs,
      providing superior reranking accuracy at higher latency.
  - num_str: QUESTION 2 OF 4
    question: Why don't production search engines use Cross-Encoders for initial billion-document
      retrieval?
    qid: q137_2
    options:
    - letter: A
      text: Joint cross-attention is computationally expensive and cannot be pre-indexed
        into approximate nearest neighbor (ANN) vector indices.
      is_correct: true
    - letter: B
      text: Cross-Encoders have lower accuracy than BM25.
      is_correct: false
    - letter: C
      text: Cross-Encoders can only process single words.
      is_correct: false
    - letter: D
      text: Vector databases do not support Cross-Encoder licenses.
      is_correct: false
    correct_fb: ✅ Correct! Evaluating 1,000,000 documents with a Cross-Encoder would
      require 1,000,000 transformer forward passes per query. Two-stage retrieval
      (Bi-Encoder top-50 - Cross-Encoder rerank) is the industry standard.
    wrong_fb: ❌ Incorrect. Cross-Encoders require joint forward passes for every (query,
      document) pair at search time, making large-scale index traversal impossible
      without a fast first-stage retriever.
  - num_str: QUESTION 3 OF 4
    question: What is the recommended number of candidate documents to send to a Cross-Encoder
      (e.g. BGE-Reranker-Large)?
    qid: q137_3
    options:
    - letter: A
      text: Top 25 to 100 candidate documents.
      is_correct: true
    - letter: B
      text: Top 10,000 to 50,000 documents.
      is_correct: false
    - letter: C
      text: Only 1 document.
      is_correct: false
    - letter: D
      text: All documents in the corpus.
      is_correct: false
    correct_fb: ✅ Correct! Reranking 25–100 candidate passages keeps end-to-end inference
      latency under 50–150ms while capturing 95%+ of recall gains.
    wrong_fb: ❌ Incorrect. Passing thousands of documents to a Cross-Encoder introduces
      seconds of serving latency. The sweet spot for production RAG is reranking the
      top 25 to 100 first-stage candidates.
  - num_str: QUESTION 4 OF 4
    question: Which loss function is standard when training a Cross-Encoder reranker?
    qid: q137_4
    options:
    - letter: A
      text: Binary Cross-Entropy (BCE) Loss on positive/negative passage pairs or
        Margin Mean Squared Error.
      is_correct: true
    - letter: B
      text: Mean Squared Error on raw document lengths.
      is_correct: false
    - letter: C
      text: Cosine Proximity on independent embedding vectors.
      is_correct: false
    - letter: D
      text: Poisson Regression Loss.
      is_correct: false
    correct_fb: ✅ Correct! Cross-Encoders output a single relevance logit for the
      concatenated pair, trained using BCE loss against binary relevance labels or
      margin MSE distillation.
    wrong_fb: ❌ Incorrect. Cross-Encoders are sequence classification models outputting
      a relevance score for the pair (query, doc), typically optimized with Binary
      Cross-Entropy (BCE) or ranking loss.
  flashcards:
  - front: Bi-Encoder vs Cross-Encoder
    back: 'Bi: Separate embeddings (fast). Cross: Joint processing (accurate).'
  - front: When to use Reranking?
    back: After initial retrieval (Top-K) to reorder the candidate list.
  - front: Why are Cross-Encoders slow?
    back: They process query+doc together in full attention, so complexity is O(N)
      per query, not pre-computable.
  gotcha:
    title: '⚠️ Gotcha: Day 137 Pitfall Warning'
    description: "<p style=\"margin-top:0.4rem; margin-bottom:0;\">\n       Passing\
      \ more than 50-100 candidate documents to a Cross-Encoder reranker creates severe\
