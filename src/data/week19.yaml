      is_correct: false
    correct_fb: ✅ Correct! Research by Liu et al. proves LLM recall degrades significantly
      when relevant context is positioned in the middle of long input prompts.
    wrong_fb: ❌ Incorrect. 'Lost in the Middle' refers to the U-shaped attention curve
      in transformer decoders, where models recall information at the start and end
      of prompts much better than in the middle.
  - num_str: QUESTION 2 OF 4
    question: How does Semantic Chunking differ from Fixed-Size Token Chunking?
    qid: q138_2
    options:
    - letter: A
      text: Semantic Chunking splits text based on cosine distance spikes between
        adjacent sentences, preserving complete thoughts.
      is_correct: true
    - letter: B
      text: Semantic Chunking cuts every document at exactly 512 tokens.
      is_correct: false
    - letter: C
      text: Semantic Chunking uses regular expression whitespace splitting only.
      is_correct: false
    - letter: D
      text: Semantic Chunking converts text to audio waveforms before splitting.
      is_correct: false
    correct_fb: ✅ Correct! Semantic Chunking computes embeddings for consecutive sentences
      and inserts split boundaries when the semantic distance exceeds a threshold
      (e.g. 95th percentile).
    wrong_fb: ❌ Incorrect. Fixed-size chunking splits arbitrarily by token counts,
      frequently severing thoughts. Semantic chunking dynamically calculates embedding
      variance across sentence boundaries.
  - num_str: QUESTION 3 OF 4
    question: What is the purpose of chunk overlap (e.g., 500-token chunk with 50-token
      overlap)?
    qid: q138_3
    options:
    - letter: A
      text: To prevent semantic context and entity relationships from being severed
        at chunk boundaries.
      is_correct: true
    - letter: B
      text: To double the total storage size in the database.
      is_correct: false
    - letter: C
      text: To slow down the embedding model.
      is_correct: false
    - letter: D
      text: To satisfy vector index token limits.
      is_correct: false
    correct_fb: ✅ Correct! Chunk overlap ensures that multi-sentence facts crossing
      boundary lines are preserved in at least one retrieved chunk.
    wrong_fb: ❌ Incorrect. Chunk overlap ensures continuous context across boundaries,
      preventing vital facts from being split across two separate chunks.
  - num_str: QUESTION 4 OF 4
    question: When chunking structured Markdown tables for RAG, what is the best practice?
    qid: q138_4
    options:
    - letter: A
      text: Preserve table row headers or convert rows into key-value JSON strings
        rather than splitting raw Markdown lines arbitrarily.
      is_correct: true
    - letter: B
      text: Split the table strictly at 256 tokens regardless of row boundaries.
      is_correct: false
    - letter: C
      text: Delete all tables because LLMs cannot understand tabular data.
      is_correct: false
    - letter: D
      text: Replace all table numbers with random placeholders.
      is_correct: false
    correct_fb: ✅ Correct! Splitting tables mid-row strips column headers. Preprocessing
      tables into self-contained row representations ensures each chunk retains full
      tabular context.
    wrong_fb: ❌ Incorrect. Arbitrary token splitting breaks table columns from their
      headers. Best practice is keeping tables intact or converting rows into semantic
      key-value strings.
