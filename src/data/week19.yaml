      fn\">len</span>(tokens_q.<span class=\"fn\">union</span>(tokens_p)))\n    <span class=\"cm\"># Calibrated probability\
      \ output</span>\n    prob = <span class=\"num\">1.0</span> / (<span class=\"num\">1.0</span> + np.<span class=\"fn\"\
