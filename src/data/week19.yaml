  theory_html: '<div class="theory-prose" style="line-height:1.7; font-size:14.5px;
    color:var(--text);">

    <p>Analogy:

    Cross-Encoders &amp; Re-ranking

    💡 Gotcha &amp; Common Pitfall Warning:

    Always double check tensor dimensions, verify data types before matrix operations,
    and ensure feature scaling is fitted strictly on the training set to prevent data
    leakage.

    A Bi-Encoder embeds query and document separately. A Cross-Encoder processes them
    together, allowing self-attention across query and doc tokens.

    python</p>

    <div class="cb"><div class="cb-head"><span class="cb-lang">python</span><div class="cb-btns"><button
    class="copy-btn" onclick="copyCode(this)">copy</button><button class="run-btn"
    onclick="runCode(this)">Run</button></div></div><pre># Real usage of sentence-transformers
    CrossEncoder

    from sentence_transformers import CrossEncoder


    # Load BGE Reranker

    model = CrossEncoder(''BAAI/bge-reranker-v2-m3'')


    query = "how to setup reranker"

    docs = ["Use cross-encoders for reranking", "Vector search is fast", "BM25 is
    keyword based"]


    # Calculate scores

    pairs = [[query, doc] for doc in docs]

    scores = model.predict(pairs)


    # Combine and sort

    ranked = sorted(zip(scores, docs), reverse=True)

    print(ranked[0]) # Highest scoring document

    </pre></div>

    </div>'
  predict:
    question: Why don't we use Cross-Encoders for the entire database search?
    answer: Latency
    explanation: Cross-Encoders evaluate query and document pairs jointly through
      full self-attention (O(N) forward passes), which is computationally unfeasible
      for millions of documents. We use Bi-encoders for fast O(1) top-100 vector retrieval,
      and Cross-encoders for precise top-5 reranking.
    code: "from typing import List, Dict\n\nclass CohereRerankerPipeline:\n    \"\"\
      \"\n    Two-Stage Retrieval Pipeline with Cohere Re-rank API.\n    Stage 1:\
      \ Retrieve top 25 candidates using Dense/Sparse hybrid search.\n    Stage 2:\
      \ Cross-encoder re-ranking down to top 5 high-precision chunks.\n    \"\"\"\n\
      def __init__(self, api_key: str = \"test-cohere-key\"):\n        self.api_key\
      \ = api_key\n\ndef rerank(self, query: str, documents: List[str], top_n: int\
      \ = 3) -> List[Dict]:\n        # Simulated Cohere Re-rank Client: co.rerank(model=\"\
      rerank-english-v3.0\", query=query, documents=documents, top_n=top_n)\n    \
      \    scores = []\n        for idx, doc in enumerate(documents):\n          \
      \  # Compute semantic relevance score\n            query_words = set(query.lower().split())\n\
      \            doc_words = set(doc.lower().split())\n            overlap = len(query_words.intersection(doc_words))\
      \ / max(1, len(query_words))\n            scores.append({\"index\": idx, \"\
      document\": doc, \"relevance_score\": round(0.5 + 0.5 * overlap, 4)})\n    \
      \        \n        ranked = sorted(scores, key=lambda x: x[\"relevance_score\"\
      ], reverse=True)[:top_n]\nreturn ranked\n\nreranker = CohereRerankerPipeline()\n\
      docs = [\n    \"Machine learning models require robust validation datasets.\"\
      ,\n    \"Cohere Re-rank calculates cross-attention relevance scores across query\
      \ and document pairs.\",\n    \"Deep learning neural networks process multi-dimensional\
      \ tensors.\"\n]\nresults = reranker.rerank(\"How does Cohere Re-rank work?\"\
      , docs, top_n=2)\nprint(\"Top Re-ranked Results:\", results)"
