    question: How does Hierarchical Navigable Small World (HNSW) indexing achieve sub-linear O(log N) vector search?
    qid: q139_1
    options:
    - letter: A
      text: By organizing vectors into multi-layer proximity graphs with long-range skip connections at top layers and dense loca...
      is_correct: true
      id: a
    - letter: B
      text: By computing exact brute-force Euclidean distance across every vector.
      is_correct: false
      id: b
    - letter: C
      text: By converting vectors into SQLite tables with B-Tree indexes.
      is_correct: false
      id: c
    - letter: D
      text: By sorting vectors in alphabetical order.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! HNSW builds a hierarchical skip-list of graphs. Top layers allow fast long-distance hops across the vector space; lower layers fine-tune local nearest neighbors. This pattern ensures mathematical consistency, minimizes runtime latency, and adheres to production-grade engineering standards.
    wrong_fb: ❌ Incorrect. HNSW uses multi-layer proximity graphs with skip-list dynamics, allowing logarithmic search complexity without scanning the entire dataset. In enterprise systems, selecting this alternative introduces subtle edge-case failures, unhandled memory overhead, or degraded precision.
    correct: a
  - num_str: QUESTION 2 OF 4
    question: What is the trade-off of Product Quantization (IVFPQ) compared to Flat HNSW?
    qid: q139_2
    options:
    - letter: A
      text: IVFPQ drastically reduces RAM consumption (by 80-95%) but suffers a slight loss in recall accuracy and higher latency...
      is_correct: true
      id: a
    - letter: B
      text: IVFPQ uses 10x more memory than Flat indices.
      is_correct: false
      id: b
    - letter: C
      text: IVFPQ guarantees 100% exact mathematical nearest neighbors with zero loss.
      is_correct: false
      id: c
    - letter: D
      text: IVFPQ is only compatible with keyword search.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Product Quantization compresses high-dimensional vectors (e.g. 1536 floats - 64 bytes) by clustering subspaces into codebooks, saving massive RAM at the cost of slight recall degradation.
    wrong_fb: ❌ Incorrect. IVFPQ is designed for memory compression, reducing RAM requirements by 4x–20x by storing compressed centroid IDs instead of raw 32-bit floats. In enterprise systems, selecting this alternative introduces subtle edge-case failures, unhandled memory overhead, or degraded precision.
    correct: a
