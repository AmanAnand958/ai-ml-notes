  quizzes:
  - num_str: QUESTION 1 OF 4
    question: What is the 'Lost in the Middle' phenomenon in LLM retrieval contexts?
    qid: q138_1
    options:
    - letter: A
      text: LLMs attend heavily to tokens at the beginning and end of long prompts,
        but frequently overlook key facts placed in the middle.
      is_correct: true
    - letter: B
      text: Vector databases lose vector coordinates near the center of the index.
      is_correct: false
    - letter: C
      text: Cross-Encoders drop middle tokens due to context window limits.
      is_correct: false
    - letter: D
