      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Incompatible Raw Score Distributions in Hybrid Search'
    description: 'Never add raw BM25 scores (unbounded [0, ∞)) directly to cosine similarity scores (bounded [-1, 1]). Score
      normalization is highly sensitive to query variations. Always use rank-based Reciprocal Rank Fusion (RRF) with k=60
      to merge candidate lists safely. (Avoid anti-pattern: always validate with strict assertion checks e.g. `assert input_tensor.shape[-1]
      == expected_dim`).'
