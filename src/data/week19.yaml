  flashcards:
  - front: LangChain CompressionRetriever?
    back: • A wrapper that takes a base retriever and applies a transformation/reranking (compression) step to the outputs.
  - front: Production RAG Latency Target?
    back: • Typically < 1 second for retrieval, with LLM streaming for perceived speed.
  - front: Contextual Compression?
    back: • After retrieval, an LLM extracts only the sentences from a doc that are relevant to the query.
  - front: 'How is Capstone: Production RAG tested and validated in industrial ML pipelines (Day 142)?'
    back: • Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.<br/>• allclose at 1e-5),
      and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Capstone: Production RAG in distributed systems?'
    back: • Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Silent Failures in Unchecked RAG Pipelines'
    description: 'A RAG system can return high-confidence text that is 100% hallucinated if retrieved chunks are empty or
      irrelevant. Always implement a hard fallback when the cross-encoder top score falls below the relevance threshold (e.g.
      score < 0.25). (Avoid anti-pattern: always validate with strict assertion checks e.g. `assert input_tensor.shape[-1]
      == expected_dim`).'
