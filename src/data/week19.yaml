    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: How does Hierarchical Navigable Small World (HNSW) indexing achieve
      sub-linear O(log N) vector search?
    qid: q139_1
    options:
    - letter: A
      text: By organizing vectors into multi-layer proximity graphs with long-range
        skip connections at top layers and dense local connections at the bottom.
      is_correct: true
    - letter: B
      text: By computing exact brute-force Euclidean distance across every vector.
      is_correct: false
    - letter: C
      text: By converting vectors into SQLite tables with B-Tree indexes.
      is_correct: false
    - letter: D
      text: By sorting vectors in alphabetical order.
      is_correct: false
    correct_fb: ✅ Correct! HNSW builds a hierarchical skip-list of graphs. Top layers
      allow fast long-distance hops across the vector space; lower layers fine-tune
      local nearest neighbors.
    wrong_fb: ❌ Incorrect. HNSW uses multi-layer proximity graphs with skip-list dynamics,
      allowing logarithmic search complexity without scanning the entire dataset.
  - num_str: QUESTION 2 OF 4
    question: What is the trade-off of Product Quantization (IVFPQ) compared to Flat
      HNSW?
    qid: q139_2
    options:
    - letter: A
      text: IVFPQ drastically reduces RAM consumption (by 80-95%) but suffers a slight
        loss in recall accuracy and higher latency overhead during decompression.
      is_correct: true
    - letter: B
      text: IVFPQ uses 10x more memory than Flat indices.
      is_correct: false
    - letter: C
      text: IVFPQ guarantees 100% exact mathematical nearest neighbors with zero loss.
      is_correct: false
    - letter: D
      text: IVFPQ is only compatible with keyword search.
      is_correct: false
    correct_fb: ✅ Correct! Product Quantization compresses high-dimensional vectors
      (e.g. 1536 floats - 64 bytes) by clustering subspaces into codebooks, saving
      massive RAM at the cost of slight recall degradation.
    wrong_fb: ❌ Incorrect. IVFPQ is designed for memory compression, reducing RAM
      requirements by 4x–20x by storing compressed centroid IDs instead of raw 32-bit
      floats.
  - num_str: QUESTION 3 OF 4
    question: In HNSW, what does the parameter ef_search control?
    qid: q139_3
    options:
    - letter: A
      text: The size of the dynamic candidate list evaluated during query time (higher
        ef = higher recall, higher latency).
      is_correct: true
    - letter: B
      text: The number of CPU threads used during index creation.
      is_correct: false
    - letter: C
      text: The maximum dimensionality of the vector embeddings.
      is_correct: false
    - letter: D
      text: The number of GPUs required for training.
      is_correct: false
    correct_fb: ✅ Correct! Increasing ef_search expands the priority queue during
      traversal, exploring more graph paths to increase recall at the expense of query
      execution time.
    wrong_fb: ❌ Incorrect. ef_search specifies how many nearest neighbor candidates
      to explore during query traversal. Increasing it improves recall accuracy at
      the cost of search latency.
  - num_str: QUESTION 4 OF 4
    question: When should you use cosine similarity versus dot product (Inner Product)
      in vector databases?
    qid: q139_4
    options:
    - letter: A
      text: Dot product is mathematically identical to cosine similarity when embeddings
        are unit-normalized (length=1), but computes faster on hardware.
      is_correct: true
    - letter: B
      text: Cosine similarity only works for 2D vectors.
      is_correct: false
    - letter: C
      text: Dot product cannot handle negative numbers.
      is_correct: false
    - letter: D
      text: Cosine similarity requires no mathematical calculations.
      is_correct: false
    correct_fb: ✅ Correct! When embeddings are L2 normalized to unit length ($\|v\|=1$),
      cosine distance is equivalent to inner product ($a \cdot b$), saving expensive
      square-root norm computations.
    wrong_fb: ❌ Incorrect. For L2 normalized vectors, the cosine formula simplifies
      to the dot product. This allows SIMD/GPU hardware to compute similarities without
      normalization division.
  flashcards:
  - front: What is HNSW?
    back: A multi-layered graph where upper layers have long links (fast skip), lower
      have short links.
  - front: What does nprobe do?
    back: Number of clusters (Voronoi cells) to check during IVF search.
  - front: efSearch (HNSW Search Parameter)
    back: Exploration factor during search. Higher efSearch = slower but higher recall.
