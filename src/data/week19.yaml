      is_correct: false
      id: c
    - letter: D
      text: An invalid configuration that throws an API exception.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! In hybrid search APIs, alpha is the dense weight (0.0 = pure sparse keyword search, 0.5 = balanced hybrid, 1.0 = pure dense vector search). This pattern ensures mathematical consistency, minimizes runtime latency, and adheres to production-grade engineering standards.
    wrong_fb: '❌ Incorrect. In Pinecone''s hybrid search API: alpha = 1.0 is pure dense, alpha = 0.0 is pure sparse BM25 keyword search, and alpha = 0.5 is balanced 50/50 hybrid. In enterprise systems, selecting this alternative introduces subtle edge-case failures, unhandled memory overhead, or degraded precision.'
