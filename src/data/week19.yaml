    prompt_html: "<p><strong>Scenario:</strong> You are processing 500-page enterprise financial annual reports (10-K filings) containing dense text paragraphs, nested Markdown tables, and structured header hierarchies. Naive 500-character chunking breaks tables mid-row and severs footnote definitions.</p>\n<p><strong>Requirements:</strong></p>\n<ul>\n  <li>Implement a <strong>Parent-Child (Small-to-Big) Chunker</strong> that splits documents into 1024-token parent context blocks and subdivides each into 256-token searchable child chunks.</li>\n  <li>Implement a <strong>Semantic Boundary Chunker</strong> that computes sentence-level embeddings and splits chunks dynamically when consecutive sentence cosine similarity drops below threshold $\tau = 0.75$.</li>\n  <li>Verify that child chunks maintain immutable foreign key references to parent chunks.</li>\n</ul>"
    done_when: 'Your Task 1: Semantic Chunking implementation runs without errors. All assertions in the solution pass. You can explain the core algorithm and its time complexity.'
    git_cmd: 'git add . && git commit -m "feat(day138): task-1-semantic-chunking"'
    sol_id: sol-w19d138t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "\"\"\"\nProduction Implementation: Semantic Chunking via Embedding Distance\nModule: Day 138 — Document Chunking & Ingestion Strategies\n\"\"\"\n\nimport numpy as np\nfrom typing import List\n\ndef cosine_similarity(v1: np.ndarray, v2: np.ndarray) -> float:\n    return float(np.dot(v1, v2) / (np.linalg.norm(v1) * np.linalg.norm(v2) + 1e-9))\n\nclass SemanticChunker:\n    \"\"\"\n    Splits text dynamically based on cosine distance thresholds between adjacent sentence embeddings.\n    \"\"\"\n    def __init__(self, distance_threshold: float = 0.35):\n        self.distance_threshold = distance_threshold\n\n    def chunk_sentences(self, sentences: List[str], embeddings: List[np.ndarray]) -> List[List[str]]:\n        if not sentences:\n            return []\n        \n        chunks = []\n        current_chunk = [sentences[0]]\n        \n        for i in range(len(embeddings) - 1):\n            sim = cosine_similarity(embeddings[i], embeddings[i + 1])\n            distance\
      \ = 1.0 - sim\n            \n            # If distance exceeds threshold, boundary is detected\n            if distance > self.distance_threshold:\n                chunks.append(current_chunk)\n                current_chunk = [sentences[i + 1]]\n            else:\n                current_chunk.append(sentences[i + 1])\n                \n        if current_chunk:\n            chunks.append(current_chunk)\n            \n        return chunks\n\nif __name__ == '__main__':\n    # Test with 4 synthetic sentences\n    sents = [\n        \"PyTorch is an open source deep learning framework.\",\n        \"It provides flexible tensor computations on GPUs.\",\n        \"The Italian restaurant serves authentic wood-fired pizza.\",\n        \"Pasta and risotto are popular Italian delicacies.\"\n    ]\n    # Two distinct topic clusters in 4D space\n    embs = [\n        np.array([0.9, 0.8, 0.1, 0.0]),\n        np.array([0.85, 0.82, 0.12, 0.05]),\n        np.array([0.05, 0.1, 0.95, 0.88]),\n    \
      \    np.array([0.02, 0.08, 0.91, 0.92])\n    ]\n    chunker = SemanticChunker(distance_threshold=0.35)\n    result_chunks = chunker.chunk_sentences(sents, embs)\n    print(f\"Generated {len(result_chunks)} semantic chunks:\")\n    for idx, c in enumerate(result_chunks, 1):\n        print(f\"  Chunk {idx}: {c}\")\n    assert len(result_chunks) == 2, \"Semantic boundary detection failed\"\n    print(\"✓ All semantic chunking assertions passed!\")\n"
    solution_lang: python
  - title: Production Benchmark — Advanced Chunking Strategies
    solution_code: "# Day 138 Task 2: Production Benchmark — Advanced Chunking Strategies\nfrom typing import List\nimport re\n\ndef semantic_boundary_chunk(text: str, markers: List[str] = None) -> List[str]:\n    if not markers:\n        markers = [\"\\n## \", \"\\n### \", \"\\n\\n\"]\n    pattern = \"|\".join(re.escape(m) for m in markers)\n    chunks = [c.strip() for c in re.split(pattern, text) if len(c.strip()) > 0]\n    return chunks\n\ndoc = \"\"\"## Section 1: Ingestion\nData is streamed via Kafka.\n\n## Section 2: Storage\nEmbeddings stored in Qdrant.\n\n## Section 3: Serving\nEndpoints deployed on Kubernetes.\"\"\"\n\nchunks = semantic_boundary_chunk(doc)\nprint(f\"Extracted {len(chunks)} semantic chunks:\")\nfor i, ch in enumerate(chunks, 1):\n    print(f\"  Chunk {i}: {ch[:40]}...\")\nassert len(chunks) == 3\nprint(\"✓ Semantic boundary chunking verified.\")"
