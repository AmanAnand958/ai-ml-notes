  theory_html: "<h3 class=\"sh3\">1. Deep Technical Principles: GraphRAG & Knowledge Graphs</h3>\n<p>\nTraditional vector\
    \ search treats text chunks as isolated semantic points in vector space. When answering complex, global queries across\
    \ thousands of documents (e.g. <em>\"What are the overarching corporate risks across all subsidiaries?\"</em>), pure vector\
    \ search fails because no single chunk contains the answer.\n</p>\n<p>\n<strong>GraphRAG (Edge et al., Microsoft Research)</strong>\
    \ builds an interconnected Knowledge Graph from raw text corpus:\n</p>\n<ol>\n  <li><strong>Entity & Relationship Extraction:</strong>\
    \ LLM extracts structured $(u, v, e)$ triples (e.g. <code>(EntityA)-[SUPPLIES]->(EntityB)</code>).</li>\n  <li><strong>Leiden\
    \ Community Detection:</strong> Hierarchical graph clustering groups densely connected entity subgraphs into modular communities.</li>\n\
    \  <li><strong>Community Summarization:</strong> Pre-generates comprehensive narrative summaries for each cluster at multiple\
    \ resolution tiers.</li>\n</ol>\n\n<h3 class=\"sh3\">2. Production Python Implementation: Knowledge Graph Triple Extractor</h3>\n\
    <div class=\"cb\">\n  <div class=\"cb-head\"><span class=\"cb-lang\">python</span><div class=\"cb-btns\"><button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n  <pre><code><span class=\"kw\">from</span> typing <span\
    \ class=\"kw\">import</span> List, Dict, Tuple\n<span class=\"kw\">import</span> json\n\n<span class=\"kw\">class</span>\
    \ <span class=\"fn\">KnowledgeGraphStore</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(self):\n\
    \        self.nodes: Dict[str, Dict] = {}\n        self.edges: List[Tuple[str, str, str]] = []\n\n    <span class=\"kw\"\
    >def</span> <span class=\"fn\">add_entity</span>(self, entity_id: str, entity_type: str, description: str):\n        self.nodes[entity_id]\
    \ = {\n            <span class=\"str\">\"type\"</span>: entity_type,\n            <span class=\"str\">\"description\"\
    </span>: description\n        }\n\n    <span class=\"kw\">def</span> <span class=\"fn\">add_relationship</span>(self,\
    \ src: str, dst: str, rel_type: str):\n        self.edges.append((src, dst, rel_type))\n\n    <span class=\"kw\">def</span>\
    \ <span class=\"fn\">get_subgraph</span>(self, entity_id: str, depth: int = <span class=\"num\">2</span>) -> List[Tuple[str,\
    \ str, str]]:\n        <span class=\"cm\"># BFS traversal to extract local knowledge neighborhood</span>\n        visited\
    \ = set([entity_id])\n        queue = [(entity_id, <span class=\"num\">0</span>)]\n        matched_edges = []\n\n    \
    \    <span class=\"kw\">while</span> queue:\n            curr, d = queue.pop(<span class=\"num\">0</span>)\n         \
    \   <span class=\"kw\">if</span> d >= depth: <span class=\"kw\">continue</span>\n            <span class=\"kw\">for</span>\
    \ s, tgt, r <span class=\"kw\">in</span> self.edges:\n                <span class=\"kw\">if</span> s == curr <span class=\"\
    kw\">and</span> tgt <span class=\"kw\">not</span> <span class=\"kw\">in</span> visited:\n                    visited.add(tgt)\n\
    \                    matched_edges.append((s, tgt, r))\n                    queue.append((tgt, d + <span class=\"num\"\
    >1</span>))\n        <span class=\"kw\">return</span> matched_edges</code></pre>\n</div>\n\n<h3 class=\"sh3\">Engineering\
    \ Decision Matrix: Production Trade-Offs</h3>\n<table style=\"width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px;\"\
    >\n  <thead>\n    <tr style=\"border-bottom:2px solid var(--border); text-align:left;\">\n      <th style=\"padding:8px;\"\
    >Architecture Approach</th>\n      <th style=\"padding:8px;\">Primary Advantage</th>\n      <th style=\"padding:8px;\"\
    >Operational Bottleneck</th>\n      <th style=\"padding:8px;\">Target Production SLA</th>\n    </tr>\n  </thead>\n  <tbody>\n\
    \    <tr style=\"border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"><strong>Standard Baseline</strong></td>\n\
    \      <td style=\"padding:8px;\">Low initial complexity & rapid prototyping</td>\n      <td style=\"padding:8px;\">Sub-optimal\
    \ scaling under high concurrency</td>\n      <td style=\"padding:8px;\">&lt; 500ms p95</td>\n    </tr>\n    <tr style=\"\
