    time: 45 mins
    prompt_html: "<p><strong>Scenario:</strong> Your vector database cluster is consuming 128GB of RAM hosting 10,000,000 1536-dimensional embeddings. Cloud infrastructure costs must be reduced by 70% while maintaining search latency under 15ms.</p>\n<p><strong>Requirements:</strong></p>\n<ul>\n  <li>Implement an <strong>Inverted File Index (IVF) with K-Means Centroid Clustering</strong> partitioning the vector space into $C = 16$ Voronoi cells.</li>\n  <li>Implement <strong>Scalar Quantization (SQ8)</strong> compressing 32-bit floating-point coordinates into 8-bit unsigned integers with dynamic min/max scale reconstruction.</li>\n  <li>Benchmark FlatL2 vs IVF-Flat vs IVF-SQ8 across recall@10 and memory consumption.</li>\n</ul>"
    done_when: 'Your Task 1: HNSW in FAISS implementation runs without errors. All assertions in the solution pass. You can explain the core algorithm and its time complexity.'
    git_cmd: 'git add . && git commit -m "feat(day139): task-1-hnsw-in-faiss"'
    sol_id: sol-w19d139t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "# Solution for Task: HNSW in FAISS\nimport faiss\nimport numpy as np\n\ndef build_faiss_hnsw_index(dim: int = 128, num_vectors: int = 10000, M: int = 32):\n    \"\"\"Build and query an HNSW (Hierarchical Navigable Small World) index in FAISS.\"\"\"\n    index = faiss.IndexHNSWFlat(dim, M)\n    index.hnsw.efConstruction = 40\n    index.hnsw.efSearch = 64\n    \n    np.random.seed(42)\n    embeddings = np.random.random((num_vectors, dim)).astype(\"float32\")\n    index.add(embeddings)\n    \n    query_vector = np.random.random((1, dim)).astype(\"float32\")\n    distances, indices = index.search(query_vector, k=3)\n    \nreturn index.ntotal, indices[0], distances[0]\n\ntotal, top_indices, top_distances = build_faiss_hnsw_index()\nprint(f\"HNSW Index built with {total} vectors.\")\nprint(\"Top 3 Nearest Neighbor Vector IDs:\", top_indices)\nprint(\"Top 3 L2 Distance Metrics:        \", np.round(top_distances, 4))\nassert query_vector is not None, \"query_vector should not\
      \ be None\""
    solution_lang: python
  - title: Production Benchmark — Vector Indexing Deep Dive
    solution_code: "# Day 139: Vector Indexing Deep Dive — HNSW, IVF, and flat index simulation\nimport numpy as np\nimport math\nfrom typing import List, Tuple, Dict\n\nclass FlatL2Index:\n    \"\"\"Exact L2 nearest neighbor (brute force) — O(n*d) per query.\"\"\"\n    def __init__(self, dim: int):\n        self.dim = dim\n        self.vectors: List[np.ndarray] = []\n        self.ids: List[int] = []\n\n    def add(self, vector: np.ndarray, vid: int):\n        self.vectors.append(vector / (np.linalg.norm(vector) + 1e-9))\n        self.ids.append(vid)\n\n    def search(self, query: np.ndarray, k: int) -> List[Tuple[int, float]]:\n        q = query / (np.linalg.norm(query) + 1e-9)\n        distances = [np.linalg.norm(v - q) for v in self.vectors]\n        sorted_indices = np.argsort(distances)[:k]\n        return [(self.ids[i], distances[i]) for i in sorted_indices]\n\nclass IVFFlatIndex:\n    \"\"\"IVF (Inverted File) Flat index — clusters vectors for ANN search.\"\"\"\n    def __init__(self,\
      \ dim: int, n_clusters: int = 8):\n        self.dim = dim\n        self.n_clusters = n_clusters\n        self.centroids: np.ndarray = None\n        self.inverted_lists: Dict[int, List[Tuple[int, np.ndarray]]] = {}\n        self.is_trained = False\n\n    def train(self, vectors: np.ndarray):\n        \"\"\"K-means clustering to find centroids.\"\"\"\n        from sklearn.cluster import MiniBatchKMeans\n        km = MiniBatchKMeans(n_clusters=self.n_clusters, random_state=42, n_init='auto')\n        km.fit(vectors)\n        self.centroids = km.cluster_centers_\n        self.is_trained = True\n\n    def add(self, vector: np.ndarray, vid: int):\n        if not self.is_trained:\n            raise RuntimeError(\"Train index first\")\n        dists = np.linalg.norm(self.centroids - vector, axis=1)\n        cluster_id = int(np.argmin(dists))\n        if cluster_id not in self.inverted_lists:\n            self.inverted_lists[cluster_id] = []\n        self.inverted_lists[cluster_id].append((vid,\
      \ vector))\n\n    def search(self, query: np.ndarray, k: int, n_probe: int = 2) -> List[Tuple[int, float]]:\n        \"\"\"Search n_probe nearest clusters.\"\"\"\n        dists_to_centroids = np.linalg.norm(self.centroids - query, axis=1)\n        probe_clusters = np.argsort(dists_to_centroids)[:n_probe]\n\n        candidates = []\n        for cid in probe_clusters:\n            for vid, vec in self.inverted_lists.get(int(cid), []):\n                candidates.append((vid, float(np.linalg.norm(vec - query))))\n\n        candidates.sort(key=lambda x: x[1])\n        return candidates[:k]\n\n# Benchmark both indexes\nnp.random.seed(42)\ndim, n, k = 64, 1000, 5\ncorpus = np.random.randn(n, dim).astype(np.float32)\nqueries = np.random.randn(10, dim).astype(np.float32)\n\n# Build FlatL2\nflat = FlatL2Index(dim)\nfor i, v in enumerate(corpus): flat.add(v, i)\n\n# Build IVF\nivf = IVFFlatIndex(dim, n_clusters=16)\nivf.train(corpus)\nfor i, v in enumerate(corpus): ivf.add(v, i)\n\n# Run queries\
      \ and compare recall\ntotal_recall = 0\nfor q in queries:\n    flat_results = {vid for vid, _ in flat.search(q, k)}\n    ivf_results  = {vid for vid, _ in ivf.search(q, k, n_probe=4)}\n    recall = len(flat_results & ivf_results) / k\n    total_recall += recall\n\navg_recall = total_recall / len(queries)\nprint(f\"Flat index: exact search over {n} vectors\")\nprint(f\"IVF index:  approximate search, recall@{k} = {avg_recall:.2%}\")\n\nassert avg_recall > 0.5, f\"IVF recall too low: {avg_recall:.2%}\"\nassert len(flat.vectors) == n, \"Flat index count mismatch\"\nassert ivf.is_trained, \"IVF must be trained\"\nprint(\"✅ Vector indexing assertions passed\")"
