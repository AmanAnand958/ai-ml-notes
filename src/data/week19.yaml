      \ class=\"kw\">def</span> <span class=\"fn\">cross_encoder_scoring</span>(query: str, passage: str) -&gt; float:\n \
      \   <span class=\"cm\"># Concatenate [CLS] Query [SEP] Passage [SEP]</span>\n    tokens_q = <span class=\"fn\">set</span>(query.<span\
      \ class=\"fn\">lower</span>().<span class=\"fn\">split</span>())\n    tokens_p = <span class=\"fn\">set</span>(passage.<span\
      \ class=\"fn\">lower</span>().<span class=\"fn\">split</span>())\n    jaccard = <span class=\"fn\">len</span>(tokens_q.<span\
