    git_cmd: 'git add . && git commit -m "feat(day139): task-1-hnsw-in-faiss"'
    sol_id: sol-w19d139t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "# Solution for Task: HNSW in FAISS\nimport faiss\nimport numpy as np\n\ndef build_faiss_hnsw_index(dim:\
      \ int = 128, num_vectors: int = 10000, M: int = 32):\n    \"\"\"Build and query an HNSW (Hierarchical Navigable Small\
      \ World) index in FAISS.\"\"\"\n    index = faiss.IndexHNSWFlat(dim, M)\n    index.hnsw.efConstruction = 40\n    index.hnsw.efSearch\
      \ = 64\n    \n    np.random.seed(42)\n    embeddings = np.random.random((num_vectors, dim)).astype(\"float32\")\n  \
      \  index.add(embeddings)\n    \n    query_vector = np.random.random((1, dim)).astype(\"float32\")\n    distances, indices\
      \ = index.search(query_vector, k=3)\n    \nreturn index.ntotal, indices[0], distances[0]\n\ntotal, top_indices, top_distances\
      \ = build_faiss_hnsw_index()\nprint(f\"HNSW Index built with {total} vectors.\")\nprint(\"Top 3 Nearest Neighbor Vector\
      \ IDs:\", top_indices)\nprint(\"Top 3 L2 Distance Metrics:        \", np.round(top_distances, 4))\nassert query_vector\
