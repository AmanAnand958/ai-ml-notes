      \ Transformations</span>\n<span class=\"kw\">import</span> math\n<span class=\"\
      kw\">from</span> collections <span class=\"kw\">import</span> Counter\n<span\
      \ class=\"kw\">from</span> typing <span class=\"kw\">import</span> List, Dict\n\
      \n<span class=\"kw\">class</span> <span class=\"cls\">OkapiBM25Index</span>:\n\
      <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"\
      kw\">self</span>, corpus: List[str], k1: float = <span class=\"num\">1.5</span>,\
      \ b: float = <span class=\"num\">0.75</span>):\n        <span class=\"kw\">self</span>.k1\
      \ = k1\n        <span class=\"kw\">self</span>.b = b\n        <span class=\"\
      kw\">self</span>.corpus = [doc.<span class=\"fn\">lower</span>().<span class=\"\
      fn\">split</span>() <span class=\"kw\">for</span> doc <span class=\"kw\">in</span>\
      \ corpus]\n        <span class=\"kw\">self</span>.doc_lens = [<span class=\"\
      fn\">len</span>(d) <span class=\"kw\">for</span> d <span class=\"kw\">in</span>\
      \ <span class=\"kw\">self</span>.corpus]\n        <span class=\"kw\">self</span>.avg_dl\
      \ = <span class=\"fn\">sum</span>(<span class=\"kw\">self</span>.doc_lens) /\
      \ <span class=\"fn\">max</span>(<span class=\"num\">1</span>, <span class=\"\
      fn\">len</span>(<span class=\"kw\">self</span>.corpus))\n        <span class=\"\
      kw\">self</span>.doc_freqs = <span class=\"fn\">Counter</span>()\n        <span\
      \ class=\"kw\">for</span> d <span class=\"kw\">in</span> <span class=\"kw\"\
      >self</span>.corpus:\n            <span class=\"kw\">self</span>.doc_freqs.<span\
      \ class=\"fn\">update</span>(<span class=\"fn\">set</span>(d))\n        <span\
      \ class=\"kw\">self</span>.N = <span class=\"fn\">len</span>(<span class=\"\
      kw\">self</span>.corpus)\n\n<span class=\"kw\">def</span> <span class=\"fn\"\
      >compute_idf</span>(<span class=\"kw\">self</span>, word: str) - float:\n  \
      \      df = <span class=\"kw\">self</span>.doc_freqs.<span class=\"fn\">get</span>(word,\
      \ <span class=\"num\">0</span>)\n<span class=\"kw\">return</span> math.<span\
      \ class=\"fn\">log</span>(<span class=\"num\">1.0</span> + (<span class=\"kw\"\
      >self</span>.N - df + <span class=\"num\">0.5</span>) / (df + <span class=\"\
      num\">0.5</span>))\n\n<span class=\"kw\">def</span> <span class=\"fn\">score</span>(<span\
      \ class=\"kw\">self</span>, query: str) - List[Dict]:\n        q_words = query.<span\
      \ class=\"fn\">lower</span>().<span class=\"fn\">split</span>()\n        scores\
      \ = []\n        <span class=\"kw\">for</span> idx, doc <span class=\"kw\">in</span>\
      \ <span class=\"fn\">enumerate</span>(<span class=\"kw\">self</span>.corpus):\n\
      \            doc_len = <span class=\"kw\">self</span>.doc_lens[idx]\n      \
      \      counts = <span class=\"fn\">Counter</span>(doc)\n            score =\
      \ <span class=\"num\">0.0</span>\n<span class=\"kw\">for</span> w <span class=\"\
      kw\">in</span> q_words:\n                <span class=\"kw\">if</span> w <span\
      \ class=\"kw\">in</span> counts:\n                    idf = <span class=\"kw\"\
      >self</span>.<span class=\"fn\">compute_idf</span>(w)\n                    tf\
      \ = counts[w]\n                    tf_norm = (tf * (<span class=\"kw\">self</span>.k1\
      \ + <span class=\"num\">1.0</span>)) / (tf + <span class=\"kw\">self</span>.k1\
      \ * (<span class=\"num\">1.0</span> - <span class=\"kw\">self</span>.b + <span\
      \ class=\"kw\">self</span>.b * (doc_len / <span class=\"kw\">self</span>.avg_dl)))\n\
      \                    score += idf * tf_norm\n            scores.<span class=\"\
      fn\">append</span>({<span class=\"str\">\"doc_id\": idx, \"score\"</span>: <span\
      \ class=\"fn\">round</span>(score, <span class=\"num\">4</span>)})\n<span class=\"\
      kw\">return</span> <span class=\"fn\">sorted</span>(scores, key=&gt;<span class=\"\
      kw\">lambda</span> x: x[<span class=\"str\">\"score\"</span>], reverse=<span\
      \ class=\"kw\">True</span>)\n\nbm25 = <span class=\"fn\">OkapiBM25Index</span>([<span\
      \ class=\"str\">\"Transformer self attention complexity\", \"BM25 keyword search\
      \ algorithm\", \"Dense vector embeddings in vector db\"</span>])\n<span class=\"\
      fn\">print</span>(<span class=\"str\">\"BM25 Top Matches:\", bm25.score(\"BM25\
      \ algorithm\"</span>))</pre>\n</div>\n<div style=\"margin-top:1rem; padding:10px;\
      \ background:rgba(79,209,165,.05); border-left:3px solid var(--green); border-radius:4px;\
      \ font-family:var(--font-mono); font-size:12px;\">\n<strong>\n         Expected\
