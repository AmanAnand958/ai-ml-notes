    question: Why is Reciprocal Rank Fusion (RRF) preferred over raw score combination when merging BM25 and vector search results?
    qid: q136_2
    options:
    - letter: A
      text: BM25 scores are unbounded [0, ∞) while cosine vector similarities are bounded [-1, 1], making raw addition scale-inco...
      is_correct: true
      id: a
    - letter: B
      text: Vector search doesn't generate numerical scores.
      is_correct: false
      id: b
    - letter: C
      text: BM25 is an AI neural network that requires backpropagation.
      is_correct: false
      id: c
    - letter: D
      text: Raw score addition is computationally impossible on modern CPUs.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! BM25 and dense cosine distances exist on fundamentally different, incompatible mathematical scales. RRF converts both to ordinal rank positions ($1, 2, 3...$), achieving scale-invariant fusion.
    wrong_fb: ❌ Incorrect. BM25 scores depend on term frequency and document length with no upper bound, whereas cosine similarity is bounded. Combining them directly without rank normalization leads to score distortion.
    correct: a
  - num_str: QUESTION 3 OF 4
    question: When hybrid search returns irrelevant results despite high dense similarity scores, what is the primary diagnosis?
    qid: q136_3
    options:
    - letter: A
      text: Dense embedding models suffer from semantic drift on domain-specific acronyms and part numbers that sparse BM25 handl...
      is_correct: true
      id: a
    - letter: B
      text: The vector database index has corrupted all embeddings.
      is_correct: false
      id: b
    - letter: C
      text: Cosine similarity cannot be computed on floating point numbers.
      is_correct: false
      id: c
    - letter: D
      text: The LLM prompt temperature is set too low.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Dense vector models project inputs into smooth semantic spaces where rare alphanumeric IDs (e.g., error codes or serial numbers) get mapped to noisy neighbors. BM25 solves this via exact token matching.
    wrong_fb: ❌ Incorrect. Dense models struggle with rare out-of-vocabulary terms and exact identifiers. Hybrid search fixes this by combining dense conceptual understanding with BM25's exact token matching.
    correct: a
  - num_str: QUESTION 4 OF 4
    question: In Pinecone Hybrid Search, what does setting the alpha parameter to 0.0 represent?
