      \ Question: {specific_query}\nStep-Back Question:\"\"\"\n\n        res = self.client.chat.completions.create(\n\
      \            model=\"gpt-4o-mini\",\n            messages=[{\"role\": \"user\"\
      , \"content\": prompt}],\n            temperature=0.0\n        )\nreturn res.choices[0].message.content.strip()\n\
      \nengine = StepBackPromptingEngine()\nuser_q = \"Why does PyTorch throw a CUDA\
      \ out of memory error during the backward pass of a 70B parameter model?\"\n\
      step_back_q = engine.generate_step_back_question(user_q)\nprint(f\"Original\
      \ Query:  {user_q}\")\nprint(f\"Step-Back Query: {step_back_q}\")"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: How does Hypothetical Document Embeddings (HyDE) work in query transformation?
    qid: q141_1
    options:
    - letter: A
      text: An LLM generates a hypothetical answer to the user's query, and the embedding
        of that hypothetical text is used to search the vector database.
      is_correct: true
    - letter: B
      text: The user is required to write a 500-word answer before searching.
      is_correct: false
    - letter: C
      text: The database randomly deletes 50% of the documents.
      is_correct: false
    - letter: D
      text: It translates the query into binary machine code.
      is_correct: false
    correct_fb: ✅ Correct! HyDE leverages the fact that a generated hypothetical document
      (even with hallucinations) shares more vector space similarity with the real
      answer documents than a short, vague user query does.
    wrong_fb: ❌ Incorrect. HyDE (Gao et al.) generates a hypothetical answer via LLM,
      then embeds that synthetic document to retrieve real passages with matching
      conceptual structures.
  - num_str: QUESTION 2 OF 4
    question: What is Multi-Query Expansion in RAG pipelines?
    qid: q141_2
    options:
    - letter: A
      text: Using an LLM to generate 3-5 alternative phrasings/sub-queries from different
        perspectives, retrieving documents for all of them, and fusing the results.
      is_correct: true
    - letter: B
      text: Querying 5 different vector databases with identical text.
      is_correct: false
    - letter: C
      text: Sending the query to 5 different human annotators.
      is_correct: false
    - letter: D
      text: Multiplying the query string length by 5.
      is_correct: false
    correct_fb: ✅ Correct! Multi-query generation overcomes user query vocabulary
      mismatch by approaching the topic from multiple linguistic angles and deduplicating
      results via RRF.
    wrong_fb: ❌ Incorrect. Multi-query generation uses an LLM to rephrase and decompose
      a user's prompt into multiple targeted sub-queries, broadening retrieval recall.
  - num_str: QUESTION 3 OF 4
    question: When is Sub-Query Decomposition most beneficial in RAG?
    qid: q141_3
    options:
    - letter: A
      text: For complex multi-part questions (e.g. 'Compare the revenue of Apple and
        Microsoft in 2023') that require retrieving disparate documents for each entity.
      is_correct: true
    - letter: B
      text: For simple single-fact lookups (e.g. 'What is the capital of France?').
      is_correct: false
    - letter: C
      text: When the vector database is completely empty.
      is_correct: false
    - letter: D
      text: When running on low-battery mobile devices.
      is_correct: false
    correct_fb: ✅ Correct! Sub-query decomposition splits compound questions into
      independent sub-tasks ('What was Apple 2023 revenue?' and 'What was Microsoft
      2023 revenue?'), retrieving precise context for each.
    wrong_fb: ❌ Incorrect. Sub-query decomposition is designed for complex comparative
      questions that cannot be answered with a single embedding retrieval pass.
  - num_str: QUESTION 4 OF 4
    question: What is Step-Back Prompting in RAG query transformation?
    qid: q141_4
    options:
    - letter: A
      text: Abstracting the specific query into a broader, foundational concept question
        to retrieve high-level principles before solving the specific instance.
      is_correct: true
    - letter: B
      text: Deleting the last word of the query.
      is_correct: false
    - letter: C
      text: Reversing the words in the query backwards.
      is_correct: false
    - letter: D
      text: Asking the user to repeat their question.
      is_correct: false
    correct_fb: ✅ Correct! Step-back prompting (developed by Google DeepMind) derives
      high-level concepts (e.g., 'What are the physics laws governing thermodynamics?')
      to ground detailed reasoning.
    wrong_fb: ❌ Incorrect. Step-back prompting prompts the LLM to identify high-level
      principles governing the problem, retrieving macro-context to guide the answer.
  flashcards:
  - front: What does HyDE stand for?
    back: Hypothetical Document Embeddings
  - front: What is Step-Back Prompting?
