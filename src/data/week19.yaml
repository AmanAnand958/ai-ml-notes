  - num_str: QUESTION 1 OF 4
    question: Why is k typically set to 60 in Reciprocal Rank Fusion (RRF)?
    qid: q136_1
    options:
    - letter: A
      text: It balances high-ranked and low-ranked items effectively, preventing the top item from dominating.
      is_correct: true
      id: a
    - letter: B
      text: It maximizes sparse keyword impact while ignoring dense embeddings.
      is_correct: false
      id: b
    - letter: C
      text: It is the maximum 64-bit integer limit in search databases.
      is_correct: false
      id: c
    - letter: D
      text: It restricts the search engine to returning exactly 60 documents.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! In RRF, $k=60$ (introduced by Cormack et al.) acts as a smoothing factor that prevents top-ranked documents from completely eclipsing items ranked slightly lower by another retriever.
    wrong_fb: '❌ Incorrect. The constant $k=60$ dampens the penalty difference between high and lower ranks, ensuring a document ranked #1 by one engine doesn''t unfairly overwhelm a document ranked #2 by both engines.'
    correct: a
