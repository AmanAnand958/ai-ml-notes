    - letter: B
      text: The number of CPU threads used during index creation.
      is_correct: false
      id: b
    - letter: C
      text: The maximum dimensionality of the vector embeddings.
      is_correct: false
      id: c
    - letter: D
      text: The number of GPUs required for training.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Increasing ef_search expands the priority queue during traversal, exploring more graph paths to increase recall at the expense of query execution time. This pattern ensures mathematical consistency, minimizes runtime latency, and adheres to production-grade engineering standards.
    wrong_fb: ❌ Incorrect. ef_search specifies how many nearest neighbor candidates to explore during query traversal. Increasing it improves recall accuracy at the cost of search latency. In enterprise systems, selecting this alternative introduces subtle edge-case failures, unhandled memory overhead, or degraded precision.
    correct: a
  - num_str: QUESTION 4 OF 4
    question: When should you use cosine similarity versus dot product (Inner Product) in vector databases?
    qid: q139_4
    options:
    - letter: A
      text: Dot product is mathematically identical to cosine similarity when embeddings are unit-normalized (length=1), but comp...
      is_correct: true
      id: a
    - letter: B
      text: Cosine similarity only works for 2D vectors.
      is_correct: false
      id: b
    - letter: C
      text: Dot product cannot handle negative numbers.
      is_correct: false
      id: c
    - letter: D
      text: Cosine similarity requires no mathematical calculations.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! When embeddings are L2 normalized to unit length ($\|v\|=1$), cosine distance is equivalent to inner product ($a \cdot b$), saving expensive square-root norm computations.
    wrong_fb: ❌ Incorrect. For L2 normalized vectors, the cosine formula simplifies to the dot product. This allows SIMD/GPU hardware to compute similarities without normalization division. In enterprise systems, selecting this alternative introduces subtle edge-case failures, unhandled memory overhead, or degraded precision.
    correct: a
