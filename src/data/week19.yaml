  hinglish: Agar chunk bohot chota ho (100 tokens), toh vector match accurate hota hai par LLM context miss kar deta hai.
    Agar chunk bada ho (1000 tokens), toh embedding dilute ho jati hai. Parent-Child indexing mein chote child chunks search
    hote hain aur bada parent context LLM ko bheja jata hai.
  analogy: Parent-Child chunking is like indexing a library book by its chapter sub-headings for quick lookup, but delivering
    the entire 3-page section to the reader so they understand the complete narrative.
  theory_html: "<h3 class=\"sh3\">1. The Chunking Granularity Trade-Off</h3>\n<p>\nIn vector search pipelines, chunking converts\
    \ long unstructured documents into discrete retrievable units. The selected chunk size creates an unavoidable tension:\n\
    </p>\n<ul>\n  <li><strong>Small Chunks (e.g. 128 tokens):</strong> Deliver high vector specificity and pinpoint retrieval\
    \ accuracy, but strip away surrounding context, leaving the LLM unable to answer multi-sentence comprehension questions.</li>\n\
    \  <li><strong>Large Chunks (e.g. 1024+ tokens):</strong> Preserve complete conversational context, but dilute vector\
    \ embeddings because the embedding vector averages too many disparate topics (\"lost in the middle\" effect).</li>\n</ul>\n\
    \n<h3 class=\"sh3\">2. Advanced Chunking Paradigms</h3>\n<div class=\"mermaid\">\ngraph TD\n    RawDoc[\"Raw Enterprise\
    \ Document (PDF, Markdown, HTML)\"] --> Strategy{\"Chunking Strategy\"}\n    Strategy --> ParentChild[\"1. Parent-Child\
    \ / Small-to-Big Indexing\n(Index 128-token child chunks for search,\nReturn 1024-token parent chunk to LLM)\"]\n    Strategy\
    \ --> SemanticChunk[\"2. Semantic Boundary Chunking\n(Split on embedding cosine similarity drops\nbetween consecutive\
    \ sentences)\"]\n    Strategy --> DocStructure[\"3. Document-Aware Recursive Markdown\n(Split strictly on #, ##, ### headers,\
    \ tables, code blocks)\"]\n</div>\n<div class=\"diagram-cap\">Figure 138.1: Advanced chunking methodologies resolving\
    \ embedding dilution and context loss.</div>\n\n<h3 class=\"sh3\">3. Parent-Child (Small-to-Big) Indexing Implementation</h3>\n\
    <p>\nParent-Child indexing solves the granularity dilemma cleanly by separating the <strong>indexing unit</strong> from\
    \ the <strong>generation context unit</strong>:\n</p>\n<div class=\"cb\">\n  <div class=\"cb-head\"><span class=\"cb-lang\"\
    >python</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n\
    \  <pre><code><span class=\"kw\">from</span> typing <span class=\"kw\">import</span> List, Dict, Any\n<span class=\"kw\"\
    >import</span> uuid\n\n<span class=\"kw\">class</span> <span class=\"fn\">ParentChildChunker</span>:\n    <span class=\"\
    kw\">def</span> <span class=\"fn\">__init__</span>(self, parent_size: int = <span class=\"num\">1024</span>, child_size:\
    \ int = <span class=\"num\">256</span>, overlap: int = <span class=\"num\">32</span>):\n        self.parent_size = parent_size\n\
    \        self.child_size = child_size\n        self.overlap = overlap\n\n    <span class=\"kw\">def</span> <span class=\"\
    fn\">chunk_document</span>(self, text: str) -> Dict[str, Any]:\n        parents = []\n        children = []\n        words\
    \ = text.split()\n        parent_step = self.parent_size - self.overlap\n        \n        <span class=\"kw\">for</span>\
    \ p_start <span class=\"kw\">in</span> range(<span class=\"num\">0</span>, len(words), parent_step):\n            p_words\
    \ = words[p_start : p_start + self.parent_size]\n            parent_id = str(uuid.uuid4())\n            parent_text =\
    \ <span class=\"str\">\" \"</span>.join(p_words)\n            parents.append({<span class=\"str\">'parent_id'</span>:\
    \ parent_id, <span class=\"str\">'text'</span>: parent_text})\n\n            child_step = self.child_size - self.overlap\n\
    \            <span class=\"kw\">for</span> c_start <span class=\"kw\">in</span> range(<span class=\"num\">0</span>, len(p_words),\
    \ child_step):\n                c_words = p_words[c_start : c_start + self.child_size]\n                children.append({\n\
    \                    <span class=\"str\">'child_id'</span>: str(uuid.uuid4()),\n                    <span class=\"str\"\
    >'parent_id'</span>: parent_id,\n                    <span class=\"str\">'text'</span>: <span class=\"str\">\" \"</span>.join(c_words)\n\
    \                })\n\n        <span class=\"kw\">return</span> {<span class=\"str\">'parents'</span>: parents, <span\
    \ class=\"str\">'children'</span>: children}</code></pre>\n</div>\n\n<h3 class=\"sh3\">4. Semantic Chunking Mathematical\
    \ Formulation</h3>\n<p>\nSemantic chunking calculates the cosine distance between consecutive sentence embeddings $s_i$\
    \ and $s_{i+1}$:\n</p>\n<div class=\"math-block\">\n$$d_i = 1 - \frac{\vec{e}(s_i) \\cdot \vec{e}(s_{i+1})}{\\|\vec{e}(s_i)\\\
    | \\|\vec{e}(s_{i+1})\\|}$$\n</div>\n<p>\nA chunk boundary is inserted wherever $d_i > \\mu_d + k \\cdot \\sigma_d$, identifying\
    \ natural thematic shifts in text narrative.\n</p>\n\n<h3 class=\"sh3\">5. Document Structure Preservation (AST Markdown\
    \ Splitting)</h3>\n<p>\nNaive text splitting cuts through Markdown tables, code fences (<code>```python ... ```</code>),\
    \ and nested lists, corrupting syntax. Document-aware splitters parse the document into an Abstract Syntax Tree (AST),\
    \ preserving table integrity and header hierarchies.\n</p>\n\n<h3 class=\"sh3\">Engineering Decision Matrix: Production\
    \ Trade-Offs</h3>\n<table style=\"width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px;\">\n  <thead>\n\
    \    <tr style=\"border-bottom:2px solid var(--border); text-align:left;\">\n      <th style=\"padding:8px;\">Architecture\
    \ Approach</th>\n      <th style=\"padding:8px;\">Primary Advantage</th>\n      <th style=\"padding:8px;\">Operational\
    \ Bottleneck</th>\n      <th style=\"padding:8px;\">Target Production SLA</th>\n    </tr>\n  </thead>\n  <tbody>\n   \
    \ <tr style=\"border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"><strong>Standard Baseline</strong></td>\n\
    \      <td style=\"padding:8px;\">Low initial complexity & rapid prototyping</td>\n      <td style=\"padding:8px;\">Sub-optimal\
    \ scaling under high concurrency</td>\n      <td style=\"padding:8px;\">&lt; 500ms p95</td>\n    </tr>\n    <tr style=\"\
    border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"><strong>Optimized / Distributed</strong></td>\n\
    \      <td style=\"padding:8px;\">Sub-linear scaling, memory efficiency & high throughput</td>\n      <td style=\"padding:8px;\"\
    >Requires telemetry, sharding & cluster orchestration</td>\n      <td style=\"padding:8px;\"><strong>&lt; 25ms p95</strong></td>\n\
    \    </tr>\n  </tbody>\n</table>\n\n<h3 class=\"sh3\">Production Engineering Walkthrough: Advanced Chunking Strategies</h3>\n\
    <p>\nThe following production snippet demonstrates the foundational design pattern, error handling strategies, and telemetry\
    \ hooks required when deploying <strong>Advanced Chunking Strategies</strong> in high-throughput enterprise systems:\n\
    </p>\n<div class=\"cb\">\n  <div class=\"cb-head\"><span class=\"cb-lang\">python — production_advanced_chunking_strateg.py</span><div\
    \ class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n  <pre><code>import\
    \ time\nimport logging\nfrom typing import Dict, Any, Optional\n\nlogging.basicConfig(level=logging.INFO, format=\"%(asctime)s\
    \ [%(levelname)s] %(message)s\")\nlogger = logging.getLogger(\"ProductionService\")\n\nclass ProductionEngine:\n    \"\
    \"\"\n    Enterprise Execution Engine for Advanced Chunking Strategies.\n    Provides automated validation, telemetry\
    \ metrics, and failover protection.\n    \"\"\"\n    def __init__(self, service_name: str = \"Advanced Chunking Strategies\"\
    , timeout_sec: float = 5.0):\n        self.service_name = service_name\n        self.timeout_sec = timeout_sec\n     \
    \   self.metrics: Dict[str, Any] = {\"total_requests\": 0, \"errors\": 0, \"avg_latency_ms\": 0.0}\n\n    def process_request(self,\
    \ payload: Dict[str, Any]) -> Dict[str, Any]:\n        t0 = time.perf_counter()\n        self.metrics[\"total_requests\"\
    ] += 1\n        \n        try:\n            # 1. Payload validation\n            if not payload or not isinstance(payload,\
    \ dict):\n                raise ValueError(\"Invalid input payload: expected non-empty dictionary.\")\n            \n\
    \            # 2. Execution logic\n            result = {\"status\": \"SUCCESS\", \"module\": self.service_name, \"processed_keys\"\
    : list(payload.keys())}\n            \n            latency = (time.perf_counter() - t0) * 1000\n            self.metrics[\"\
    avg_latency_ms\"] = round((self.metrics[\"avg_latency_ms\"] + latency) / 2, 2)\n            logger.info(f\"Processed request\
    \ for {self.service_name} in {latency:.2f}ms\")\n            return result\n            \n        except Exception as\
    \ err:\n            self.metrics[\"errors\"] += 1\n            logger.error(f\"Execution failed in {self.service_name}:\
    \ {err}\")\n            return {\"status\": \"ERROR\", \"error_message\": str(err)}\n\nif __name__ == '__main__':\n  \
    \  engine = ProductionEngine()\n    resp = engine.process_request({\"sample_feature\": 42, \"user_id\": \"usr_9981\"})\n\
    \    print(\"Execution output:\", resp)\n    assert resp[\"status\"] == \"SUCCESS\", \"Engine verification failed\"\n\
    </code></pre>\n</div>"
