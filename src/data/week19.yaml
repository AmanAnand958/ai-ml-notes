    correct_fb: ✅ Correct! Bi-Encoders compute query and document embeddings in isolation, allowing instant vector search. Cross-Encoders allow every query token to attend to every document token via full cross-attention for maximum precision.
    wrong_fb: ❌ Incorrect. Bi-Encoders produce independent fixed vectors for fast similarity indexing. Cross-Encoders jointly attend across query-document pairs, providing superior reranking accuracy at higher latency.
    correct: a
