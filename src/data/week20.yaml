    time: 45 mins
    prompt_html: "<p><strong>Scenario:</strong> Build a persistent long-term episodic memory system for a personal AI executive assistant that maintains context across multi-week conversational sessions.</p>\n<p><strong>Requirements:</strong></p>\n<ul>\n  <li>Implement <strong>Coreference Resolution</strong>: rewrite ambiguous conversational turns (<em>\"Send it to him tomorrow\"</em> $\to$ <em>\"Send the quarterly audit report to John tomorrow\"</em>) prior to vector storage.</li>\n  <li>Implement <strong>Exponential Temporal Decay Scoring</strong>: $\text{Score}(m) = \\cos(\vec{q}, \vec{v}_m) \t\times e^{-\\lambda \\Delta t}$.</li>\n  <li>Benchmark retrieval accuracy against raw un-decayed vector search on a 30-day conversational timeline.</li>\n</ul>"
