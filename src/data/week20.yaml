  analogy: 'Multi-Agent Systems are like a high-performing film production crew: the Director (Supervisor) coordinates the
    Scriptwriter (Researcher), Camera Operator (Coder), and Film Editor (Critic), ensuring each specialist focuses on their
    craft.'
  theory_html: "<h3 class=\"sh3\">1. Multi-Agent Systems: Architectural Topologies</h3>\n<p>\nEquipping a single monolith\
    \ agent with dozens of disparate tools causes severe context dilution and tool hallucination. Partitioning responsibilities\
    \ across specialized, single-responsibility agents dramatically increases reliability:\n</p>\n<ul>\n  <li><strong>Hierarchical\
    \ Supervisor Topology:</strong> A central router agent decomposes goals and delegates sub-tasks to specialized domain\
    \ agents (Researcher, Coder, Reviewer).</li>\n  <li><strong>Peer-to-Peer Network / Swarm:</strong> Agents pass execution\
    \ control directly to peer agents dynamically based on intermediate state.</li>\n  <li><strong>Actor-Critic / Debate Topology:</strong>\
    \ A Generator Agent proposes candidate solutions while an Adversarial Auditor Agent tests them against security constraints.</li>\n\
    </ul>\n\n<div class=\"cb\">\n  <div class=\"cb-head\"><span class=\"cb-lang\">python — multi_agent_supervisor.py</span><div\
    \ class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n  <pre><code>from\
    \ typing import Dict, List, Any\nimport json\n\nclass WorkerAgent:\n    def __init__(self, name: str, role_prompt: str):\n\
    \        self.name = name\n        self.role_prompt = role_prompt\n\n    def execute(self, task: str) -> str:\n      \
    \  # Simulates specialized agent execution\n        return f\"[{self.name}] Completed: '{task}' according to role requirements.\"\
    \n\nclass MultiAgentSupervisor:\n    def __init__(self):\n        self.workers: Dict[str, WorkerAgent] = {\n         \
    \   \"researcher\": WorkerAgent(\"Researcher\", \"Find technical specifications\"),\n            \"coder\": WorkerAgent(\"\
    Coder\", \"Write clean Python implementations\"),\n            \"auditor\": WorkerAgent(\"Auditor\", \"Verify security\
    \ and test coverage\")\n        }\n\n    def process_goal(self, goal: str) -> Dict[str, Any]:\n        # 1. Supervisor\
    \ delegates sub-tasks sequentially\n        research = self.workers[\"researcher\"].execute(f\"Research requirements for\
    \ {goal}\")\n        code = self.workers[\"coder\"].execute(f\"Write code using research: {research}\")\n        audit\
    \ = self.workers[\"auditor\"].execute(f\"Audit code safety: {code}\")\n        \n        return {\n            \"status\"\
