  gotcha:
    title: '⚠️ Gotcha: Infinite Execution Loops in ReAct Agents'
    description: When a tool returns an unexpected error or empty string, ReAct agents often repeat the identical tool call
      indefinitely. Always enforce a hard max_iterations limit (e.g. max_steps=8) and inject error handling reflections..
