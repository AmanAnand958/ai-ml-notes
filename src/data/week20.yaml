week_number: 20
title: LLM Agents & Workflows
description: ''
days:
- id: '143'
  day_num: 143
  title: ReAct & Plan-and-Solve
  subtitle: Reasoning and Acting Frameworks
  time_estimate: 45 mins
  difficulty: Medium
  badges: []
  xp: 150
  objectives:
  - Implement a ReAct loop using LangChain.
  - Implement and evaluate when to use Plan-and-Solve.
  - LangChain installed
  checklist: []
  concept_flow:
  - ReAct & Plan-and-Solve
  - Structured Output via Instructor
  - LangGraph StateGraph
  - Multi-Agent Systems
  - Vector Memory & Coreference
  - Human-in-the-loop (HITL)
  - 'Capstone: Multi-Agent System'
  hinglish: ReAct ka matlab hai 'Reason' + 'Act'. Agent pehle sochta hai (Thought),
    fir tool use karta hai (Action), fir result dekhta hai (Observation). Plan-and-Solve
    pehle pura roadmap banata hai fir execute karta hai!
  analogy: ReAct pattern is like a detective thinking out loud, looking at evidence,
    and taking notes step-by-step.
  theory_html: '<div class="theory-prose" style="line-height:1.7; font-size:14.5px;
    color:var(--text);">

    <p>Analogy:

    ReAct &amp; Plan-and-Solve

    💡 Gotcha &amp; Common Pitfall Warning:

    Always double check tensor dimensions, verify data types before matrix operations,
    and ensure feature scaling is fitted strictly on the training set to prevent data
    leakage.</p>

    </div>'
  predict:
    question: What happens if the Action fails (e.g., API is down) in a ReAct loop?
    answer: Observation error
    explanation: The agent receives the error message in the Observation step, reasons
      through it in the next Thought step, and tries an alternative tool, parameters,
      or fallback action.
    code: "<span class=\"cm\"># Task 1: ReAct Agent with Tool Execution</span>\n<span\
      \ class=\"kw\">def</span> <span class=\"fn\">run_react_agent</span>(query: str):\n\
      \    llm = <span class=\"fn\">ChatOpenAI</span>(model=<span class=\"str\">\"\
      gpt-4o\"</span>, temperature=<span class=\"num\">0</span>)\n    agent = <span\
      \ class=\"fn\">create_react_agent</span>(llm, tools=[calculate_vat, lookup_stock])\n\
      \    <span class=\"kw\">return</span> agent.<span class=\"fn\">invoke</span>({<span\
      \ class=\"str\">\"messages\": [(\"user\"</span>, query)]})"
  tasks:
  - title: 'Task 1: Plan-and-Solve Agent'
    badge: MEDIUM
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p>\n        Write the setup for an experimental\n        \n   \
      \      PlanAndExecute\n        \n        agent in LangChain.\n       </p>"
    done_when: Task completed successfully when output matches expected verification
      metrics and unit tests pass.
    git_cmd: 'git add . &amp;&amp; git commit -m "day143: complete hands-on task implementation"'
    sol_id: sol-w20d143t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "<span class=\"cm\"># Task 2: Plan-and-Solve Decomposition Loop</span>\n\
      <span class=\"kw\">def</span> <span class=\"fn\">plan_and_solve</span>(objective:\
      \ str):\n    planner = <span class=\"fn\">ChatOpenAI</span>(model=<span class=\"\
      str\">\"gpt-4o\"</span>, temperature=<span class=\"num\">0</span>)\n    plan_prompt\
      \ = <span class=\"str\">f\"Decompose objective into discrete execution steps:\
      \ {objective}\"</span>\n    steps = planner.<span class=\"fn\">invoke</span>(plan_prompt).content.<span\
      \ class=\"fn\">split</span>(<span class=\"str\">\"\\n\"</span>)\n    <span class=\"\
      kw\">return</span> [s <span class=\"kw\">for</span> s <span class=\"kw\">in</span>\
      \ steps <span class=\"kw\">if</span> s.<span class=\"fn\">strip</span>()]"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: When is Plan-and-Solve better suited than ReAct in autonomous agent
      architectures?
    qid: q143_1
    options:
    - letter: A
      text: For long-horizon multi-step reasoning tasks where sub-goal dependencies
        can be planned upfront to reduce token thrashing.
      is_correct: true
    - letter: B
      text: For single-turn calculator operations.
      is_correct: false
    - letter: C
      text: When using small sub-1B parameter models with no reasoning capacity.
      is_correct: false
    - letter: D
      text: When tools execute in zero milliseconds.
      is_correct: false
    correct_fb: ✅ Correct! Plan-and-Solve decomposes complex, long-horizon objectives
      into an explicit DAG of sub-tasks first, avoiding the greedy trial-and-error
      loops of pure ReAct.
    wrong_fb: ❌ Incorrect. Plan-and-Solve works best when multi-step problem decomposition
      prevents redundant re-evaluations during execution.
  - num_str: QUESTION 2 OF 4
    question: In the ReAct (Reasoning + Acting) loop, why must the model generate
      a 'Thought' before invoking a 'Tool Action'?
    qid: q143_2
    options:
    - letter: A
      text: It conditions the action selection on explicit chain-of-thought logic
        and past environmental feedback, drastically reducing hallucinated tool calls.
      is_correct: true
    - letter: B
      text: It slows down the CPU to prevent memory overheating.
      is_correct: false
    - letter: C
      text: It converts Python code into binary assembly.
      is_correct: false
    - letter: D
      text: It encrypts user prompts for cloud compliance.
      is_correct: false
    correct_fb: ✅ Correct! Generating intermediate thoughts allows the model to synthesize
      observations from previous iterations before deciding the next tool invocation.
    wrong_fb: ❌ Incorrect. Generating thoughts grounds the model's trajectory in environmental
      feedback, preventing blind action repetitions.
  - num_str: QUESTION 3 OF 4
    question: What safety mechanism is mandatory to prevent an autonomous ReAct agent
      from entering an infinite execution loop?
    qid: q143_3
    options:
    - letter: A
      text: A hard maximum iteration limit (e.g., max_iterations=10) and trajectory
        cycle detection.
      is_correct: true
    - letter: B
      text: Removing all internet access from the host server.
      is_correct: false
    - letter: C
      text: Setting LLM temperature to 2.0.
      is_correct: false
    - letter: D
      text: Disabling all Python exception handlers.
      is_correct: false
    correct_fb: ✅ Correct! Production agent loops must enforce a max iteration cap
      and timeout safeguard so ambiguous tool outputs don't exhaust API budgets.
    wrong_fb: ❌ Incorrect. Without hard iteration limits, an agent that fails to interpret
      a tool's observation can cycle infinitely.
  - num_str: QUESTION 4 OF 4
    question: How should an agent handle a transient 500 API error returned by an
      external tool observation?
    qid: q143_4
    options:
    - letter: A
      text: The observation string should report the error to the LLM so it can retry
        with exponential backoff or choose an alternate fallback tool.
      is_correct: true
    - letter: B
      text: The Python runtime should immediately crash and terminate.
      is_correct: false
    - letter: C
      text: The agent should ignore the error and report fabricated success.
      is_correct: false
    - letter: D
      text: The agent should delete its memory state.
      is_correct: false
    correct_fb: ✅ Correct! Passing error messages back into the observation context
      allows LLMs to reason about failures and select alternative execution pathways.
    wrong_fb: ❌ Incorrect. In ReAct loops, tool errors become observations that inform
      the agent's next self-correcting thought.
  flashcards:
  - front: ReAct Loop
    back: Thought - Action (Tool) - Observation - Repeat until Answer.
  - front: Plan-and-Solve
    back: Creates a full step-by-step plan first, then executes it sequentially.
  - front: ReAct Observation
    back: The output of an Action (tool call) returned back to the agent to inform
      its next Thought.
  gotcha:
    title: '⚠️ Gotcha: Day 143 Pitfall Warning'
    description: "<p style=\"margin-top:0.4rem; margin-bottom:0;\">\n       ReAct\
      \ loops without max_iterations limits can enter infinite loops when tools return\
      \ ambiguous observations; always set max_iterations=5-10.\n      </p>"
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       \"ReAct\
      \ is great for dynamic problems. Plan-and-Solve is better when the path to the\
      \ solution is long but predictable.\""
    bullets:
    - ReAct integrates reasoning with taking action.
    - "Agents can enter infinite loops if not capped (\n        \n         max_iterations\n\
      \        \n        )."
  resources: &id001
  - type: PAPER
    title: 'ReAct: Synergizing Reasoning and Acting in Language Models'
    url: https://arxiv.org/abs/2210.03629
    desc: The seminal ReAct framework paper by Yao et al.
  - type: DOCS
    title: LangGraph Multi-Agent Workflows & Cyclic State Machines
    url: https://langchain-ai.github.io/langgraph/
    desc: Building stateful, multi-actor LLM applications
  - type: FRAMEWORK
    title: 'CrewAI: Framework for Orchestrating Role-Playing AI Agents'
    url: https://docs.crewai.com/
    desc: Production multi-agent collaboration
  - type: GUIDE
    title: Human-in-the-Loop Agent Interruption Patterns
    url: https://langchain-ai.github.io/langgraph/how-tos/human-in-the-loop/
    desc: Safe tool execution with approval breakpoints
- id: '144'
  day_num: 144
  title: Structured Output via Instructor
  subtitle: Enforcing JSON with Pydantic
  time_estimate: 45 mins
  difficulty: Medium
  badges: []
  xp: 150
  objectives:
  - "Use\n        \n         instructor\n        \n        to extract structured data."
  - Define schemas using Pydantic.
  - Basic knowledge of Python Pydantic
  checklist: []
  concept_flow:
  - ReAct & Plan-and-Solve
  - Structured Output via Instructor
  - LangGraph StateGraph
  - Multi-Agent Systems
  - Vector Memory & Coreference
  - Human-in-the-loop (HITL)
  - 'Capstone: Multi-Agent System'
  hinglish: LLMs unstructured text dete hain. Instructor library Pydantic ka use karti
    hai guarantee karne ke liye ki output exact JSON structure (fields, types) mein
    hi aaye.
  analogy: Instructor Pydantic schema is like a cookie-cutter mold enforcing exact
    shape and structure on liquid output.
  theory_html: '<div class="theory-prose" style="line-height:1.7; font-size:14.5px;
    color:var(--text);">

    <p>Analogy:

    Structured Output via Instructor

    💡 Gotcha &amp; Common Pitfall Warning:

    Always double check tensor dimensions, verify data types before matrix operations,
    and ensure feature scaling is fitted strictly on the training set to prevent data
    leakage.</p>

    </div>'
  predict:
    question: What happens if the LLM forgets a required field in the JSON?
    answer: ValidationError
    explanation: Pydantic raises a ValidationError, triggering Instructor/LangChain
      to automatically feedback the error to the LLM and re-prompt for the missing
      field.
    code: "<span class=\"cm\"># Task 1: Pydantic Schema Extraction</span>\n<span class=\"\
      kw\">def</span> <span class=\"fn\">extract_invoice_data</span>(text: str) -&gt;\
      \ Invoice:\n    client = instructor.<span class=\"fn\">from_openai</span>(<span\
      \ class=\"fn\">OpenAI</span>())\n    <span class=\"kw\">return</span> client.chat.completions.<span\
      \ class=\"fn\">create</span>(\n        model=<span class=\"str\">\"gpt-4o-mini\"\
      </span>,\n        response_model=Invoice,\n        max_retries=<span class=\"\
      num\">3</span>,\n        messages=[{<span class=\"str\">\"role\": \"user\",\
      \ \"content\"</span>: text}]\n    )"
  tasks:
  - title: 'Task 1: Extractor Schema'
    badge: EASY
    badge_class: tb-easy
    time: 45 mins
    prompt_html: "<p>\n        Create a Pydantic schema for extracting a Receipt (Store\
      \ name, total amount, list of items with price).\n        <strong>\n       \
      \  Bonus Task: Nested Pydantic · MEDIUM · ⏱ 45 mins\n        </strong>\n   \
      \     Create an Instructor schema for a research paper (title, authors list,\
      \ abstract, list of citations with DOI).\n       </p>"
    done_when: Task completed successfully when output matches expected verification
      metrics and unit tests pass.
    git_cmd: 'git add . &amp;&amp; git commit -m "day144: complete hands-on task implementation"'
    sol_id: sol-w20d144t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "<span class=\"cm\"># Task 2: Retry Handler on Validation Failure</span>\n\
      <span class=\"kw\">def</span> <span class=\"fn\">robust_extraction</span>(raw_ocr:\
      \ str):\n    <span class=\"kw\">try</span>:\n        <span class=\"kw\">return</span>\
      \ <span class=\"fn\">extract_invoice_data</span>(raw_ocr)\n    <span class=\"\
      kw\">except</span> Exception <span class=\"kw\">as</span> e:\n        <span\
      \ class=\"fn\">print</span>(<span class=\"str\">f\"Extraction failed after 3\
      \ retries: {e}\"</span>)\n        <span class=\"kw\">return</span> <span class=\"\
      kw\">None</span>"
    solution_lang: python
  - title: 'Task 2: Implement Structured Output via Instructor'
    badge: ''
    badge_class: tb-med
    time: ''
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\"\
      >\n        Enforce strict schema validation on LLM JSON output with automatic\
      \ regex retry parsing.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
      >\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"\
      cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n       \
      \    copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
      >\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"\
      cm\"># Step 1: Model Training &amp; Evaluation Workflow</span>\n<span class=\"\
      kw\">from</span> pydantic <span class=\"kw\">import</span> BaseModel, Field,\
      \ ValidationError\n<span class=\"kw\">from</span> typing <span class=\"kw\"\
      >import</span> List\n\n<span class=\"kw\">class</span> <span class=\"cls\">ExtractedInvoice</span>(BaseModel):\n\
      \    invoice_id: str = <span class=\"fn\">Field</span>(description=<span class=\"\
      str\">\"Format: INV-XXXXX\"</span>)\n    total_usd: float = <span class=\"fn\"\
      >Field</span>(gt=<span class=\"num\">0</span>, description=<span class=\"str\"\
      >\"Positive transaction amount\"</span>)\n    items: List[str]\n\nraw_json =\
      \ <span class=\"str\">'{\"invoice_id\": \"INV-88291\", \"total_usd\": 1250.50,\
      \ \"items\": [\"Cloud GPU Compute\", \"Storage\"]}'</span>\n<span class=\"kw\"\
      >try</span>:\n    invoice = ExtractedInvoice.<span class=\"fn\">model_validate_json</span>(raw_json)\n\
      \    <span class=\"fn\">print</span>(<span class=\"str\">f\"Validated Invoice\
      \ {invoice.invoice_id}: Total ${invoice.total_usd:.2f}\"</span>)\n<span class=\"\
      kw\">except</span> ValidationError <span class=\"kw\">as</span> e:\n    <span\
      \ class=\"fn\">print</span>(<span class=\"str\">\"Schema error:\"</span>, e)</pre>\n\
      </div>\n<div style=\"margin-top:1rem; padding:10px; background:rgba(79,209,165,.05);\
      \ border-left:3px solid var(--green); border-radius:4px; font-family:var(--font-mono);\
      \ font-size:12px;\">\n<strong>\n         Expected Verification Output:\n   \
      \     </strong>\n<br/>\n\n         Validated Invoice INV-88291: Total $1250.50\n\
      \        \n</div>"
    done_when: ''
    git_cmd: ''
    sol_id: ''
    solution_title: ''
    solution_code: ''
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: How does the Instructor library enforce strict structured outputs from
      LLMs?
    qid: q144_1
    options:
    - letter: A
      text: By wrapping Pydantic schemas into OpenAI/Anthropic tool-calling definitions
        and handling automatic validation retries with error feedback.
      is_correct: true
    - letter: B
      text: By fine-tuning custom PyTorch model weights on every request.
      is_correct: false
    - letter: C
      text: By restricting the model to single-character outputs.
      is_correct: false
    - letter: D
      text: By compiling Python code into C++ binaries.
      is_correct: false
    correct_fb: ✅ Correct! Instructor converts Pydantic models into JSON schemas and
      automatically feeds schema validation errors back to the LLM for self-correction.
    wrong_fb: ❌ Incorrect. Instructor uses tool-calling schemas and Pydantic validation
      loops to guarantee type-safe structured outputs.
  - num_str: QUESTION 2 OF 4
    question: What is the advantage of using Pydantic Field(description='...') parameters
      in structured extraction?
    qid: q144_2
    options:
    - letter: A
      text: The description string is injected directly into the LLM schema prompt,
        guiding the model on extraction semantics and formatting rules.
      is_correct: true
    - letter: B
      text: It speeds up JSON parsing in the Python runtime.
      is_correct: false
    - letter: C
      text: It encrypts extracted fields in memory.
      is_correct: false
    - letter: D
      text: It forces the model to output uppercase text.
      is_correct: false
    correct_fb: ✅ Correct! LLMs read JSON Schema descriptions to understand the precise
      semantic meaning of every requested property.
    wrong_fb: ❌ Incorrect. Schema descriptions provide runtime semantic guidance to
      the LLM during generation.
  - num_str: QUESTION 3 OF 4
    question: What happens when an LLM returns a JSON payload with a missing required
      Pydantic field under Instructor?
    qid: q144_3
    options:
    - letter: A
      text: A ValidationError is raised, and Instructor automatically re-prompts the
        LLM with the exact validation failure message.
      is_correct: true
    - letter: B
      text: The application crashes with a fatal segmentation fault.
      is_correct: false
    - letter: C
      text: Instructor silently fills the missing field with random numbers.
      is_correct: false
    - letter: D
      text: The LLM API permanently revokes access.
      is_correct: false
    correct_fb: ✅ Correct! Instructor's re-ask mechanism sends the ValidationError
      back into the conversation context for deterministic self-correction.
    wrong_fb: ❌ Incorrect. Instructor catches Pydantic validation errors and initiates
      an automated retry prompt.
  - num_str: QUESTION 4 OF 4
    question: Why is JSON mode alone insufficient for guaranteed type safety without
      Pydantic validation?
    qid: q144_4
    options:
    - letter: A
      text: JSON mode guarantees valid JSON syntax, but does not enforce field types,
        enum constraints, or nested schema rules.
      is_correct: true
    - letter: B
      text: JSON mode only outputs XML data.
      is_correct: false
    - letter: C
      text: JSON mode disables all LLM attention layers.
      is_correct: false
    - letter: D
      text: JSON mode cannot handle strings.
      is_correct: false
    correct_fb: ✅ Correct! JSON mode guarantees syntactically valid JSON, but models
      can still hallucinate keys or violate type constraints without schema validation.
    wrong_fb: ❌ Incorrect. Syntactic validity does not guarantee semantic or schema
      correctness; schema validators like Pydantic are required.
  flashcards:
  - front: Instructor Library
    back: A Python library that patches LLM clients to return validated Pydantic objects.
  - front: Pydantic
    back: Data validation and settings management using Python type annotations.
  - front: Instructor Retry
    back: If Pydantic validation fails, Instructor auto-retries the LLM call with
      the validation error in the prompt.
  gotcha:
    title: '⚠️ Gotcha: Pydantic Validation Retries on Schema Deviation'
    description: "<p style=\"margin-top:0.4rem; margin-bottom:0;\">\n       LLMs frequently\
      \ omit required fields or produce malformed JSON under complex schemas; failing\
      \ to configure `max_retries=3` in Instructor results in unhandled runtime ValidationErrors.\n\
      \      </p>"
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       \"Never\
      \ parse LLM text manually. Always use Pydantic/Instructor to enforce JSON schemas!\""
    bullets:
    - Instructor automatically retries if validation fails.
    - It leverages function calling under the hood.
  resources: *id001
- id: '145'
  day_num: 145
  title: LangGraph StateGraph
  subtitle: Stateful Multi-Actor Applications
  time_estimate: 45 mins
  difficulty: Medium
  badges: []
  xp: 150
  objectives:
  - Implement and evaluate LangGraph's cyclic architecture.
  - "Build a\n        \n         StateGraph\n        \n        ."
  - Knowledge of Directed Cyclic Graphs
  checklist: []
  concept_flow:
  - ReAct & Plan-and-Solve
  - Structured Output via Instructor
  - LangGraph StateGraph
  - Multi-Agent Systems
  - Vector Memory & Coreference
  - Human-in-the-loop (HITL)
  - 'Capstone: Multi-Agent System'
  hinglish: LangChain ka standard agent linear hota hai. LangGraph cycles allow karta
    hai, jisme ek 'State' object graph ke har node (function) se pass hota hai aur
    update hota hai.
  analogy: LangGraph is like an assembly line conveyor belt where car parts stop at
    specific worker stations before moving to the next.
  theory_html: '<div class="theory-prose" style="line-height:1.7; font-size:14.5px;
    color:var(--text);">

    <p>Analogy:

    LangGraph StateGraph

    💡 Gotcha &amp; Common Pitfall Warning:

    Always double check tensor dimensions, verify data types before matrix operations,
    and ensure feature scaling is fitted strictly on the training set to prevent data
    leakage.</p>

    </div>'
  predict:
    question: "What does\n       \n        operator.add\n       \n       do in the\n\
      \       \n        Annotated[list, operator.add]\n       \n       state definition?"
    answer: Appends messages
    explanation: It acts as a state Reducer that appends new message objects to the
      existing message list instead of overwriting the entire list.
    code: "<span class=\"cm\"># Task 1: Conditional Routing Graph</span>\n<span class=\"\
      kw\">def</span> <span class=\"fn\">build_conditional_graph</span>():\n    wf\
      \ = <span class=\"fn\">StateGraph</span>(AgentState)\n    wf.<span class=\"\
      fn\">add_node</span>(<span class=\"str\">\"triage\"</span>, triage_node)\n \
      \   wf.<span class=\"fn\">add_node</span>(<span class=\"str\">\"debugger\"</span>,\
      \ debugger_node)\n    wf.<span class=\"fn\">add_node</span>(<span class=\"str\"\
      >\"responder\"</span>, responder_node)\n    wf.<span class=\"fn\">add_edge</span>(START,\
      \ <span class=\"str\">\"triage\"</span>)\n    wf.<span class=\"fn\">add_conditional_edges</span>(<span\
      \ class=\"str\">\"triage\", lambda s: s[\"next_step\"], {\"debugger\": \"debugger\"\
      , \"responder\": \"responder\"</span>})\n    wf.<span class=\"fn\">add_edge</span>(<span\
      \ class=\"str\">\"debugger\", \"responder\"</span>)\n    wf.<span class=\"fn\"\
      >add_edge</span>(<span class=\"str\">\"responder\"</span>, END)\n    <span class=\"\
      kw\">return</span> wf.<span class=\"fn\">compile</span>()"
  tasks:
  - title: 'Task 1: Conditional Edges'
    badge: MEDIUM
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p>\n        Write a LangGraph snippet that uses a conditional edge\n\
      \        \n         add_conditional_edges()\n        \n        to route to \"\
      tools\" or \"end\".\n        <strong>\n         Bonus Task: Interrupt &amp;\
      \ Resume · MEDIUM · HARD · ⏱ 45 mins\n        </strong>\n        Build a LangGraph\
      \ with a tool node and add an interrupt. Test pausing execution and resuming\
      \ with app.invoke(None, thread).\n       </p>"
    done_when: Task completed successfully when output matches expected verification
      metrics and unit tests pass.
    git_cmd: 'git add . &amp;&amp; git commit -m "day145: complete hands-on task implementation"'
    sol_id: sol-w20d145t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "<span class=\"cm\"># Task 2: Graph Reducer State Accumulation</span>\n\
      <span class=\"kw\">def</span> <span class=\"fn\">test_state_accumulation</span>():\n\
      \    graph = <span class=\"fn\">build_conditional_graph</span>()\n    <span\
      \ class=\"kw\">return</span> graph.<span class=\"fn\">invoke</span>({<span class=\"\
      str\">\"messages\": [\"Initial query\"], \"retry_count\"</span>: <span class=\"\
      num\">0</span>})"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: What is the primary security vulnerability when allowing LLM agents
      to execute code or tools?
    qid: q145_1
    options:
    - letter: A
      text: Prompt injection leading to Remote Code Execution (RCE) or unauthorized
        privilege escalation via unfiltered shell commands.
      is_correct: true
    - letter: B
      text: Excessive CPU cooling fan noise.
      is_correct: false
    - letter: C
      text: Loss of Wi-Fi connection.
      is_correct: false
    - letter: D
      text: Inability to parse Markdown tables.
      is_correct: false
    correct_fb: ✅ Correct! If an agent has access to raw shell or SQL execution, malicious
      user prompts can trick the LLM into executing dangerous system commands.
    wrong_fb: ❌ Incorrect. Unconstrained tool execution exposes systems to prompt
      injection and arbitrary command execution.
