    badge: 'Task 3: Safety Guardrails'
    badge_class: tb-hard
    time: 30 mins
    prompt_html: |-
      <p><strong>Scenario:</strong> In cyclic multi-agent topologies, agents can become trapped in infinite debate loops if they fail to converge on an agreement. You must implement a circuit breaker that monitors graph execution depth.</p>
      <ul>
        <li>Track the count of node transitions in the shared agent state.</li>
        <li>If transitions exceed <code>max_hops = 10</code>, force state eviction to a human fallback handler.</li>
        <li>Export an alert trace for security review.</li>
      </ul>
    done_when: Circuit breaker trips and gracefully returns human fallback state upon exceeding max hops.
    git_cmd: 'git add agents/circuit_breaker.py && git commit -m "feat(safety): add multi-agent deadlock circuit breaker"'
    sol_id: sol_d149_t3
    solution_title: Multi-Agent Execution Circuit Breaker
    solution_lang: python
    solution_code: "from typing import Dict, Any\n\nclass AgentCircuitBreaker:\n    def __init__(self, max_hops: int = 10):\n\
      \        self.max_hops = max_hops\n\n    def check_and_increment(self, state: Dict[str, Any]) -> Dict[str, Any]:\n \
      \       hops = state.get(\"execution_hops\", 0) + 1\n        state[\"execution_hops\"] = hops\n        \n        if\
      \ hops > self.max_hops:\n            state[\"status\"] = \"CIRCUIT_BREAKER_TRIPPED\"\n            state[\"next_step\"\
      ] = \"human_operator_fallback\"\n            print(f\"⚠️ Circuit Breaker: Execution hops ({hops}) exceeded limit ({self.max_hops}).\
      \ Tripping to human review.\")\n        return state\n\n# Test circuit breaker execution\nstate = {\"execution_hops\"\
      : 9, \"status\": \"RUNNING\"}\nbreaker = AgentCircuitBreaker(max_hops=10)\nstate = breaker.check_and_increment(state)\n\
      state = breaker.check_and_increment(state)\nassert state[\"status\"] == \"CIRCUIT_BREAKER_TRIPPED\"\nprint(\"✓ Circuit\
      \ breaker verified!\")"
