    question: What integer step count did this ReAct agent execute before reaching the finish condition?
    answer: '2'
    explanation: 'The ReAct loop history contains 2 action events (''Action: db_query()'' and ''Action: Final Answer''), so steps equals 2.'
    code: 'history = [''Thought: Search DB'', ''Action: db_query()'', ''Observation: Found $100'', ''Thought: Finish'', ''Action: Final Answer'']

      steps = sum(1 for h in history if ''Action:'' in h)

      print(steps)'
  tasks:
  - title: 'Task 1: Plan-and-Solve Agent'
    badge: MEDIUM
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p><strong>Scenario:</strong> Implement an autonomous diagnostic IT support agent that troubleshoots production server incidents by querying Prometheus metrics, inspecting Linux system logs, and querying SQL incident databases.</p>\n<p><strong>Requirements:</strong></p>\n<ul>\n  <li>Implement the full cyclic <strong>ReAct State Machine</strong>: $\text{Thought}_t \to \text{Action}_t \to \text{Observation}_t \to \text{Thought}_{t+1}$.</li>\n  <li>Register three deterministic tools: <code>query_prometheus_cpu(node_id)</code>, <code>tail_system_log(service)</code>, and <code>restart_service(service)</code>.</li>\n  <li>Enforce strict maximum execution limits (<code>max_steps = 8</code>) and error handling reflection loops.</li>\n</ul>"
    done_when: 'Your Task 1: Plan-and-Solve Agent implementation runs without errors. All assertions in the solution pass. You can explain the core algorithm and its time complexity.'
    git_cmd: 'git add . && git commit -m "feat(day143): task-1-plan-and-solve-agent"'
    sol_id: sol-w20d143t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: 'query_prometheus_cpu(node_id)

      '
    solution_lang: python
  - title: Production Benchmark — ReAct & Plan-and-Solve
    solution_code: "# Day 143: ReAct & Plan-and-Solve Prompting Framework\nfrom typing import List, Dict, Any, Callable\nimport re\n\nclass ReActAgent:\n    \"\"\"\n    ReAct (Reason+Act) agent simulator.\n    In production, replace execute_tool with real LLM API calls.\n    \"\"\"\n\n    def __init__(self, tools: Dict[str, Callable]):\n        self.tools = tools\n        self.max_steps = 8\n\n    def run(self, question: str) -> str:\n        \"\"\"Execute ReAct loop: Thought → Action → Observation.\"\"\"\n        trajectory = []\n        context = question\n\n        for step in range(1, self.max_steps + 1):\n            # Simulate LLM generating Thought + Action\n            thought, action, action_input = self._simulate_reasoning(question, step, trajectory)\n            trajectory.append({'step': step, 'thought': thought, 'action': action, 'input': action_input})\n\n            if action == \"Finish\":\n                return action_input\n\n            # Execute tool\n            if\
      \ action in self.tools:\n                obs = self.tools[action](action_input)\n            else:\n                obs = f\"Tool '{action}' not found.\"\n\n            trajectory[-1]['observation'] = obs\n\n        return \"Max steps reached without conclusion.\"\n\n    def _simulate_reasoning(self, question: str, step: int, trajectory: list):\n        \"\"\"Simulate LLM reasoning (replace with real LLM in production).\"\"\"\n        if step == 1:\n            return (\n                f\"I need to answer: '{question}'. Let me start by searching.\",\n                \"Search\", question\n            )\n        elif step == 2:\n            last_obs = trajectory[-1].get('observation', '')\n            return (\n                f\"Got info: {last_obs[:50]}. Let me calculate.\",\n                \"Calculate\", \"sum based on search result\"\n            )\n        else:\n            return (\n                \"I have enough information to answer.\",\n                \"Finish\", f\"Answer\
      \ to '{question}' derived after {step-1} reasoning steps.\"\n            )\n\n# Define tools\ntools = {\n    \"Search\": lambda q: f\"Wikipedia result for '{q}': [mock data: value=42, context=AI research]\",\n    \"Calculate\": lambda expr: f\"Calculation result: 42 (from {expr})\",\n    \"Lookup\": lambda k: f\"Lookup '{k}': found in knowledge base.\",\n}\n\nagent = ReActAgent(tools)\nresult = agent.run(\"What is the impact of attention mechanisms on transformer performance?\")\nprint(f\"Final answer: {result}\")\n\n# Plan-and-Solve verification\nassert \"Answer to\" in result or \"steps\" in result\nassert len(result) > 10\nprint(\"✅ ReAct agent assertions passed\")"
    badge: HARD
    time: 45 mins
    badge_class: tb-hard
    prompt_html: '<p>Write a <strong>production-grade implementation</strong> of <strong>ReAct & Plan-and-Solve</strong> with full error handling and assertions. Your solution must: (1) implement the core algorithm/workflow for this topic, (2) include input validation, (3) run end-to-end without errors, (4) pass the provided assertions.</p><p><em>See the solution below for a complete reference implementation.</em></p>'
    done_when: Your ReAct & Plan-and-Solve implementation runs without errors, all assertions pass, and you can explain each component.
    git_cmd: 'git add src/day143_benchmark.py && git commit -m "feat(day143): production benchmark — ReAct & Plan-and-Solve"'
    sol_id: sol-w20d143t-bench
    solution_title: ✅ Production Implementation — ReAct & Plan-and-Solve
    solution_lang: python
  quizzes:
  - question: In the ReAct (Reasoning + Acting) loop, why must the model generate a 'Thought' before taking an 'Action'?
    options:
    - letter: A
      text: To log reasoning traces for debugging
      is_correct: false
      id: a
    - letter: B
      text: To decompose the problem, track state, and choose the correct tool and arguments
      is_correct: true
      id: b
    - letter: C
      text: To reduce token costs by skipping tool invocations
      is_correct: false
      id: c
    - letter: D
      text: To enforce strict JSON schema outputs without Pydantic
      is_correct: false
      id: d
    correct_fb: ✅ Correct! The Thought step lets the LLM reason about observations and synthesize next actions. This pattern ensures mathematical consistency, minimizes runtime latency, and adheres to production-grade engineering standards.
    wrong_fb: ❌ Incorrect. Thought tokens enable dynamic problem decomposition and grounded tool selection. In enterprise systems, selecting this alternative introduces subtle edge-case failures, unhandled memory overhead, or degraded precision.
    correct: b
  - question: What safety mechanism is mandatory to prevent an autonomous ReAct agent from entering an infinite loop?
    options:
    - letter: A
      text: A hard recursion limit / max_iterations threshold and tool timeout safeguards
      is_correct: true
      id: a
    - letter: B
      text: Lowering model temperature to exactly 0.0
      is_correct: false
      id: b
    - letter: C
      text: Disabling the Thought step
      is_correct: false
      id: c
    - letter: D
      text: Using only single-turn tool calls
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Max iterations and execution timeouts prevent runaway execution and unbounded API costs. This pattern ensures mathematical consistency, minimizes runtime latency, and adheres to production-grade engineering standards.
    wrong_fb: ❌ Incorrect. Autonomous loops must have deterministic iteration and time boundaries. In enterprise systems, selecting this alternative introduces subtle edge-case failures, unhandled memory overhead, or degraded precision.
    correct: a
  - num_str: '3'
    qid: w20d143_q3
    question: Why does standard Chain-of-Thought (CoT) prompting struggle with dynamic real-world tasks compared to ReAct?
    options:
    - letter: A
      text: CoT has a fixed context window limit of 512 tokens
      is_correct: false
    - letter: B
      text: CoT cannot execute external tools or incorporate environmental observations into its reasoning trace
      is_correct: true
    - letter: C
      text: CoT only works on mathematical reasoning tasks
      is_correct: false
    - letter: D
      text: CoT requires fine-tuning the base LLM weights
      is_correct: false
    correct_fb: ✅ Correct! Correct! CoT is purely internal mental reasoning and cannot interact with APIs, databases, or execution environments. This pattern ensures mathematical consistency, minimizes runtime latency, and adheres to production-grade engineering standards.
    wrong_fb: ❌ Incorrect. Incorrect. CoT works on general prompts, but lacks external action and observation feedback loops. In enterprise systems, selecting this alternative introduces subtle edge-case failures, unhandled memory overhead, or degraded precision.
  - num_str: '4'
    qid: w20d143_q4
    question: What is the primary benefit of Plan-and-Solve prompting over greedy step-by-step ReAct?
    options:
    - letter: A
      text: It eliminates the need for tool execution
      is_correct: false
    - letter: B
      text: It generates a global multi-step plan first, reducing reasoning drift on long-horizon tasks
      is_correct: true
    - letter: C
      text: It reduces token costs to zero
      is_correct: false
    - letter: D
      text: It replaces Python code execution with SQL queries
      is_correct: false
    correct_fb: ✅ Correct! Correct! Plan-and-Solve creates a comprehensive task roadmap upfront, preventing agents from wandering off-course. This pattern ensures mathematical consistency, minimizes runtime latency, and adheres to production-grade engineering standards.
    wrong_fb: ❌ Incorrect. Incorrect. Plan-and-Solve structures complex multi-step planning before execution. In enterprise systems, selecting this alternative introduces subtle edge-case failures, unhandled memory overhead, or degraded precision.
  flashcards:
  - front: 'Core concept: What is the significance of ReAct Loop in ReAct & Plan-and-Solve?'
    back: • Thought - Action (Tool) - Observation - Repeat until Answer.<br/>• This establishes the core invariant in ReAct & Plan-and-Solve, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: 'Core concept: What is the significance of Plan-and-Solve in ReAct & Plan-and-Solve?'
    back: • Creates a full step-by-step plan first, then executes it sequentially.<br/>• This establishes the core invariant in ReAct & Plan-and-Solve, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: ReAct Observation?
    back: • The output of an Action (tool call) returned back to the agent to inform its next Thought.
  - front: How is ReAct & Plan-and-Solve tested and validated in industrial ML pipelines (Day 143)?
    back: • Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.<br/>• allclose at 1e-5), and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling ReAct & Plan-and-Solve in distributed systems?'
    back: • Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Infinite Execution Loops in ReAct Agents'
    description: When a tool returns an unexpected error or empty string, ReAct agents often repeat the identical tool call indefinitely. Always enforce a hard max_iterations limit (e.g. max_steps=8) and inject error handling reflections..
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       \"ReAct is great for dynamic problems. Plan-and-Solve is better when the path to the solution is long but predictable.\""
    bullets:
    - ReAct integrates reasoning with taking action.
    - "Agents can enter infinite loops if not capped (\n        \n         max_iterations\n        \n        )."
    - Master the core mathematical and algorithmic foundations of ReAct & Plan-and-Solve in production.
    - Always profile memory footprint, latency bottlenecks, and numerical edge cases for ReAct & Plan-and-Solve.
    - Validate downstream integration tests and establish automated performance benchmark gates.
    - Implement strict loop detection and step recursion limits ($N \le 8$) in ReAct agents to prevent unbounded execution on tool errors.
