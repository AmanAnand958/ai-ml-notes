      past context even when user query vocabulary diverges.
    wrong_fb: ❌ Incorrect. Semantic memory indexing enables associative, conceptual
      recall across historical sessions.
  - num_str: QUESTION 4 OF 4
    question: What is the memory decay / eviction strategy in long-term agent memory
