  flashcards:
  - front: 'Core concept: What is the significance of ReAct Loop in ReAct & Plan-and-Solve?'
    back: • Thought - Action (Tool) - Observation - Repeat until Answer.<br/>• This establishes the core invariant in ReAct
      & Plan-and-Solve, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: 'Core concept: What is the significance of Plan-and-Solve in ReAct & Plan-and-Solve?'
    back: • Creates a full step-by-step plan first, then executes it sequentially.<br/>• This establishes the core invariant
      in ReAct & Plan-and-Solve, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: ReAct Observation?
    back: • The output of an Action (tool call) returned back to the agent to inform its next Thought.
  - front: How is ReAct & Plan-and-Solve tested and validated in industrial ML pipelines (Day 143)?
    back: • Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.<br/>• allclose at 1e-5),
      and unit tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling ReAct & Plan-and-Solve in distributed systems?'
    back: • Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Infinite Execution Loops in ReAct Agents'
    description: 'When a tool returns an unexpected error or empty string, ReAct agents often repeat the identical tool call
      indefinitely. Always enforce a hard max_iterations limit (e.g. max_steps=8) and inject error handling reflections. (Avoid
      anti-pattern: always validate with strict assertion checks e.g. `assert input_tensor.shape[-1] == expected_dim`).'
