  flashcards:
  - front: interrupt_before
    back: Pauses the LangGraph execution right before a specified node runs.
  - front: update_state
    back: Allows a human to modify the graph's state manually while it is paused.
  - front: interrupt_after
    back: Pauses the graph AFTER a node runs, useful for reviewing outputs before
      they feed to the next step.
  gotcha:
    title: '⚠️ Gotcha: Unchecked Destructive Tool Invocations'
    description: "<p style=\"margin-top:0.4rem; margin-bottom:0;\">\n       Allowing\
      \ autonomous agents to execute irreversible actions (e.g. database deletions,\
      \ payment transfers) without a persistent `interrupt_before` HITL approval gate\
      \ creates severe production compliance and safety risks.\n      </p>"
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       \"HITL\
      \ ensures safety. Always interrupt before destructive actions (writes, emails,\
      \ payments).\""
    bullets:
    - LangGraph handles state persistence automatically via Checkpointers.
    - You can 'time travel' by resuming from older thread states.
  resources: *id001
