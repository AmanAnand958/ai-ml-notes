  analogy: 'Episodic agent memory with temporal decay is like human memory: you vividly recall the conversation you had 10
    minutes ago, vaguely remember details from last week, and only recall major milestone memories from a year ago unless
    specifically reminded.'
  theory_html: "<h3 class=\"sh3\">1. Dual-Tier Memory Systems: Short-Term vs Episodic Vector Storage</h3>\n<p>\nAutonomous\
    \ agents require distinct memory systems to maintain coherent multi-session personas:\n</p>\n<ol>\n  <li><strong>Short-Term\
    \ Working Memory:</strong> Active prompt context window holding current conversational turns.</li>\n  <li><strong>Long-Term\
    \ Episodic Memory:</strong> Vector database holding historical interaction transcripts, queried via semantic similarity\
    \ and temporal decay weighting.</li>\n</ol>\n\n<h3 class=\"sh3\">2. Coreference Resolution & Temporal Decay Formulation</h3>\n\
    <p>\nRaw conversational turns contain unresolved pronouns (<em>\"Deploy it tomorrow\"</em>). Before embedding into long-term\
    \ memory, an LLM rewrites the utterance into a standalone factual assertion (<em>\"Deploy the fraud detection microservice\
    \ on October 24\"</em>). Memory relevance is then scored as:\n</p>\n<div class=\"math-block\">\n$$\text{MemoryScore}(m)\
    \ = \alpha \\cdot \text{CosineSimilarity}(\vec{q}, \vec{v}_m) + \beta \\cdot e^{-\\lambda \\Delta t} + \\gamma \\cdot\
    \ \text{ImportanceScore}(m)$$\n</div>\n\n<div class=\"cb\">\n  <div class=\"cb-head\"><span class=\"cb-lang\">python —\
    \ episodic_memory.py</span><div class=\"cb-btns\"><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div></div>\n\
    \  <pre><code>import numpy as np\nimport time\n\nclass EpisodicMemoryStore:\n    def __init__(self, decay_rate: float\
    \ = 0.05):\n        self.decay_rate = decay_rate\n        self.memories: List[dict] = []\n\n    def add_memory(self, resolved_text:\
    \ str, vector: np.ndarray, importance: float):\n        self.memories.append({\n            \"text\": resolved_text,\n\
    \            \"vector\": vector / np.linalg.norm(vector),\n            \"timestamp\": time.time(),\n            \"importance\"\
    : importance\n        })\n\n    def query(self, query_vec: np.ndarray, top_k: int = 3) -> List[dict]:\n        query_norm\
    \ = query_vec / np.linalg.norm(query_vec)\n        now = time.time()\n        \n        scored = []\n        for m in\
    \ self.memories:\n            sim = np.dot(m[\"vector\"], query_norm)\n            dt_hours = (now - m[\"timestamp\"])\
    \ / 3600.0\n            decay = np.exp(-self.decay_rate * dt_hours)\n            total_score = (0.6 * sim) + (0.2 * decay)\
    \ + (0.2 * m[\"importance\"])\n            scored.append((total_score, m))\n            \n        scored.sort(key=lambda\
    \ x: x[0], reverse=True)\n        return [item[1] for item in scored[:top_k]]</code></pre>\n</div>\n\n<h3 class=\"sh3\"\
    >Engineering Decision Matrix: Production Trade-Offs</h3>\n<table style=\"width:100%; border-collapse:collapse; margin:1rem\
    \ 0; font-size:13px;\">\n  <thead>\n    <tr style=\"border-bottom:2px solid var(--border); text-align:left;\">\n     \
