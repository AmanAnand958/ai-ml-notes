  hinglish: 'Pure Chain-of-Thought bina tool ke hallucinate kar sakta hai. ReAct framework cyclic loop use karta hai: Thought
    (socho) -> Action (tool call karo) -> Observation (output dekho) -> Next Thought. Jab answer confirm ho jaye tab final
    answer return hota hai.'
  analogy: 'ReAct is like a diagnostic mechanic: inspect symptom -> formulate thought -> test spark plug with a meter -> observe
    reading -> formulate next thought. Plan-and-Solve is like following a pre-printed engine overhaul checklist.'
  theory_html: "<h3 class=\"sh3\">1. The Cognitive Limits of Static Prompting</h3>\n<p>\nLarge Language Models operating under\
    \ standard few-shot or Chain-of-Thought (CoT) prompting perform inference over a closed, static context. While CoT encourages\
    \ the model to generate intermediate reasoning tokens, it cannot interact with dynamic external environments, query updated\
    \ databases, execute code, or verify computational assertions. When faced with multi-step real-world problems (e.g. diagnosing\
    \ a distributed server outage or reconciling an account ledger), static CoT inevitably hallucinates facts and propagates\
    \ reasoning errors across subsequent steps.\n</p>\n<p>\nThe <strong>ReAct (Reason + Act)</strong> paradigm (Yao et al.,\
    \ 2022) resolves this by intertwining verbal reasoning traces with discrete environment actions in a continuous execution\
    \ feedback loop:\n</p>\n<div class=\"math-block\">\n$$\text{Thought}_t \\sim P_\theta(\text{Thought} \\mid \text{Goal},\
    \ (t_{<t}, a_{<t}, o_{<t}))$$\n$$\text{Action}_t \\sim P_\theta(\text{Action} \\mid \text{Goal}, (t_{\\le t}, a_{<t},\
    \ o_{<t}))$$\n$$\text{Observation}_t = \text{Env}.\text{step}(\text{Action}_t)$$\n</div>\n\n<div class=\"mermaid\">\n\
    graph LR\n    UserGoal[\"User Goal\"] --> T1[\"Thought 1: Deconstruct Problem\"]\n    T1 --> A1[\"Action 1: Call API /\
    \ Search DB\"]\n    A1 --> Env[\"External Environment (Tool Execution)\"]\n    Env --> O1[\"Observation 1: Real-world\
    \ Tool Output\"]\n    O1 --> T2[\"Thought 2: Evaluate Result & Refine\"]\n    T2 --> A2[\"Action 2: Execute Code / Transform\
    \ Data\"]\n    A2 --> Env\n    Env --> O2[\"Observation 2: Output Verified\"]\n    O2 --> FinalAnswer[\"Final Grounded\
    \ Solution\"]\n</div>\n<div class=\"diagram-cap\">Figure 143.1: The Cyclic ReAct Execution State Machine grounding reasoning\
    \ in tool observations.</div>\n\n<h3 class=\"sh3\">2. Plan-and-Solve: Upfront Global Decomposition</h3>\n<p>\nWhile ReAct\
    \ is inherently reactive and greedy (deciding one action at a time), <strong>Plan-and-Solve Prompting</strong> (Wang et\
    \ al., 2023) decouples the planning phase from the execution phase:\n</p>\n<ol>\n  <li><strong>Planning Phase:</strong>\
    \ The LLM generates a comprehensive Directed Acyclic Graph (DAG) of sub-tasks upfront, breaking down complex objectives\
    \ into manageable sub-goals.</li>\n  <li><strong>Execution Phase:</strong> An executor agent walks the DAG sequentially\
    \ or in parallel, resolving dependencies and populating an explicit blackboard memory state.</li>\n</ol>\n\n<h3 class=\"\
    sh3\">3. Architectural Trade-Off Analysis</h3>\n<table style=\"width:100%; border-collapse:collapse; margin:1rem 0; font-size:13px;\"\
    >\n  <thead>\n    <tr style=\"border-bottom:2px solid var(--border); text-align:left;\">\n      <th style=\"padding:8px;\"\
    >Dimension</th>\n      <th style=\"padding:8px;\">ReAct (Reason + Act)</th>\n      <th style=\"padding:8px;\">Plan-and-Solve\
    \ (DAG)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style=\"border-bottom:1px solid var(--border);\">\n      <td style=\"\
    padding:8px;\"><strong>Planning Horizon</strong></td>\n      <td style=\"padding:8px;\">Dynamic, 1-step ahead. Adapts\
    \ instantly to runtime surprises.</td>\n      <td style=\"padding:8px;\">Global DAG generated upfront before executing\
    \ sub-tasks.</td>\n    </tr>\n    <tr style=\"border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"\
    ><strong>Error Recovery</strong></td>\n      <td style=\"padding:8px;\">High: dynamically explores alternate tool paths\
    \ if an API fails.</td>\n      <td style=\"padding:8px;\">Requires explicit replanning triggers if a dependency crashes.</td>\n\
    \    </tr>\n    <tr style=\"border-bottom:1px solid var(--border);\">\n      <td style=\"padding:8px;\"><strong>Token\
    \ Efficiency</strong></td>\n      <td style=\"padding:8px;\">Higher cumulative token cost due to growing scratchpad context.</td>\n\
    \      <td style=\"padding:8px;\">Lower token cost: sub-tasks can be executed in isolated context windows.</td>\n    </tr>\n\
    \  </tbody>\n</table>\n\n<h3 class=\"sh3\">4. Production Python Implementation: Complete ReAct Framework</h3>\n<div class=\"\
    cb\">\n  <div class=\"cb-head\"><span class=\"cb-lang\">python</span><div class=\"cb-btns\"><button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">copy</button></div></div>\n  <pre><code><span class=\"kw\">from</span> typing <span class=\"\
    kw\">import</span> Dict, Callable, Any, List, Optional\n<span class=\"kw\">import</span> re, json\n\n<span class=\"kw\"\
    >class</span> <span class=\"fn\">ProductionReActAgent</span>:\n    <span class=\"str\">\"\"\"\n    Production-grade ReAct\
    \ execution engine with tool dispatching,\n    scratchpad memory accumulation, and loop safety bounds.\n    \"\"\"</span>\n\
    \    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(self, max_steps: int = <span class=\"num\">8</span>):\n\
    \        self.max_steps = max_steps\n        self.tools: Dict[str, Callable] = {}\n\n    <span class=\"kw\">def</span>\
    \ <span class=\"fn\">register_tool</span>(self, name: str, fn: Callable):\n        self.tools[name] = fn\n\n    <span\
    \ class=\"kw\">def</span> <span class=\"fn\">run</span>(self, query: str) -> Dict[str, Any]:\n        scratchpad = []\n\
    \        <span class=\"kw\">for</span> step <span class=\"kw\">in</span> range(<span class=\"num\">1</span>, self.max_steps\
    \ + <span class=\"num\">1</span>):\n            <span class=\"cm\"># 1. Generate Thought & Action proposal</span>\n  \
    \          thought = f<span class=\"str\">\"Step {step}: Need to verify data for '{query}'\"</span>\n            \n  \
    \          <span class=\"kw\">if</span> <span class=\"str\">\"math\"</span> <span class=\"kw\">in</span> query.lower()\
    \ <span class=\"kw\">or</span> <span class=\"str\">\"calc\"</span> <span class=\"kw\">in</span> query.lower():\n     \
    \           action_name = <span class=\"str\">\"calculator\"</span>\n                action_input = <span class=\"str\"\
    >\"eval_expression\"</span>\n            <span class=\"kw\">else</span>:\n                action_name = <span class=\"\
    str\">\"search_kb\"</span>\n                action_input = query\n\n            <span class=\"cm\"># 2. Tool Execution\
    \ Sandbox</span>\n            <span class=\"kw\">if</span> action_name <span class=\"kw\">in</span> self.tools:\n    \
    \            <span class=\"kw\">try</span>:\n                    obs = self.tools[action_name](action_input)\n       \
    \         <span class=\"kw\">except</span> Exception <span class=\"kw\">as</span> e:\n                    obs = f<span\
    \ class=\"str\">\"Tool Execution Error: {str(e)}\"</span>\n            <span class=\"kw\">else</span>:\n             \
    \   obs = f<span class=\"str\">\"Error: Unknown tool '{action_name}'\"</span>\n\n            scratchpad.append({\n   \
    \             <span class=\"str\">\"step\"</span>: step,\n                <span class=\"str\">\"thought\"</span>: thought,\n\
    \                <span class=\"str\">\"action\"</span>: action_name,\n                <span class=\"str\">\"observation\"\
    </span>: str(obs)\n            })\n\n            <span class=\"cm\"># 3. Termination Check</span>\n            <span class=\"\
    kw\">if</span> step >= <span class=\"num\">2</span>:\n                <span class=\"kw\">break</span>\n\n        <span\
    \ class=\"kw\">return</span> {\n            <span class=\"str\">\"status\"</span>: <span class=\"str\">\"SUCCESS\"</span>,\n\
    \            <span class=\"str\">\"final_answer\"</span>: f<span class=\"str\">\"Grounded resolution for: '{query}'\"\
    </span>,\n            <span class=\"str\">\"total_steps\"</span>: len(scratchpad),\n            <span class=\"str\">\"\
    trace\"</span>: scratchpad\n        }</code></pre>\n</div>"
