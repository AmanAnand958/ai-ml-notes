    solution_code: |
      # Day 147 Task 1: Vector Memory Engine with Temporal Recency Decay
      import numpy as np
      import time
      from typing import List, Dict

      class RecencyMemoryEngine:
          """Vector Memory with Exponential Temporal Decay."""
          def __init__(self, decay_rate: float = 0.01):
              self.decay_rate = decay_rate
              self.memories = []

          def add_memory(self, text: str, vector: np.ndarray):
              self.memories.append({"text": text, "vector": vector, "timestamp": time.time()})

          def retrieve(self, query_vec: np.ndarray, top_k: int = 2) -> List[Dict]:
              now = time.time()
              scored = []
              for m in self.memories:
                  sim = float(np.dot(m["vector"], query_vec))
                  dt = now - m["timestamp"]
                  temporal_score = sim * np.exp(-self.decay_rate * dt)
                  scored.append({"text": m["text"], "score": round(temporal_score, 4)})
              scored.sort(key=lambda x: x["score"], reverse=True)
              return scored[:top_k]

      mem = RecencyMemoryEngine()
      mem.add_memory("User likes Python", np.array([1.0, 0.0]))
      results = mem.retrieve(np.array([1.0, 0.0]))
      assert len(results) > 0
      print("Memory Retrieval:", results)
    solution_lang: python
  - title: Production Benchmark — Vector Memory & Coreference
    solution_code: |
      # Day 147 Task 2: Vector Memory Engine with Temporal Recency Decay
      import numpy as np
      import time
      from typing import List, Dict

      class VectorEpisodicMemory:
          def __init__(self, decay_rate: float = 0.05):
              self.decay_rate = decay_rate
              self.memories: List[Dict] = []

          def store_memory(self, text: str, embedding: np.ndarray):
              norm_emb = embedding / (np.linalg.norm(embedding) + 1e-9)
              self.memories.append({
                  "text": text,
                  "embedding": norm_emb,
                  "timestamp": time.time()
              })

          def retrieve(self, query_emb: np.ndarray, top_k: int = 2) -> List[Dict]:
              if not self.memories: return []
              norm_q = query_emb / (np.linalg.norm(query_emb) + 1e-9)
              now = time.time()
              results = []
              for mem in self.memories:
                  sim = float(np.dot(norm_q, mem["embedding"]))
                  age_hours = (now - mem["timestamp"]) / 3600.0
                  time_weight = np.exp(-self.decay_rate * age_hours)
                  final_score = sim * time_weight
                  results.append({"text": mem["text"], "score": round(final_score, 4)})
              return sorted(results, key=lambda x: x["score"], reverse=True)[:top_k]

      mem_store = VectorEpisodicMemory()
      mem_store.store_memory("User lives in San Francisco", np.array([1.0, 0.0, 0.0]))
      mem_store.store_memory("User loves Python programming", np.array([0.0, 1.0, 0.0]))

      hits = mem_store.retrieve(np.array([1.0, 0.0, 0.0]), top_k=1)
      print("Retrieved Episodic Memory:", hits[0]["text"])
      assert "San Francisco" in hits[0]["text"]
      print("✓ Episodic vector memory verified.")
