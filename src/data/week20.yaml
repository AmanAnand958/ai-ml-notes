    time: 45 mins
    prompt_html: "<p><strong>Scenario:</strong> Build an automated medical invoice information extraction service that parses unstructured clinical discharge summaries into strictly validated Pydantic models.</p>\n<p><strong>Requirements:</strong></p>\n<ul>\n  <li>Define nested Pydantic models for <code>PatientRecord</code>, <code>DiagnosisCode</code> (ICD-10 enum), and <code>BillingItem</code>.</li>\n  <li>Implement Instructor automated self-healing retry loops that catch validation errors and feed error diffs back to the LLM for instant correction.</li>\n  <li>Assert 100% type conformance with zero JSON parsing exceptions on edge-case noisy input strings.</li>\n</ul>"
    done_when: 'Your Task 1: Extractor Schema implementation runs without errors. All assertions in the solution pass. You can explain the core algorithm and its time complexity.'
    git_cmd: 'git add . && git commit -m "feat(day144): task-1-extractor-schema"'
    sol_id: sol-w20d144t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
