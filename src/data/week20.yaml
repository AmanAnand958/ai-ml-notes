    \ financial wire transfers $> \\$10,000$, or emailing external clients) without human authorization.\n</p>\n<p>\n<strong>Human-in-the-Loop\
    \ (HITL)</strong> introduces deterministic pause and approval breakpoints into stateful execution graphs:\n</p>\n\n<div\
    \ class=\"mermaid\">\ngraph LR\n    AgentPlan[\"Agent Formulates Action Plan\"] --> CheckRisk{\"Risk Classifier\"}\n \
    \   CheckRisk -->|Low Risk: Read-only query| AutoExec[\"Autonomous Tool Execution\"]\n    CheckRisk -->|High Risk: Wire\
