  analogy: 'LangGraph StateGraph is like a circuit board with microcontrollers and conditional logic gates: current flows
    through discrete processing nodes, branching dynamically based on sensory inputs, with battery-backed memory preserving
    the exact state.'
  theory_html: "<h3 class=\"sh3\">1. Why StateGraphs? Moving Beyond Linear Chains</h3>\n<p>\nTraditional orchestration frameworks\
    \ (e.g. early LangChain linear chains) modeled workflows as strict <strong>Directed Acyclic Graphs (DAGs)</strong> where\
    \ execution moves strictly forward in one direction ($A \to B \to C$).\n</p>\n<p>\nHowever, real-world agentic behavior\
    \ is inherently <strong>cyclical and stateful</strong>. An agent must evaluate code output, catch runtime exceptions,\
    \ loop back to rewrite the code, ask for human clarification, or branch dynamically based on tool responses. <strong>LangGraph</strong>\
    \ models these systems as a <strong>Cyclic StateGraph</strong>:\n</p>\n\n<div style=\"margin: 1.5rem 0; text-align: center;\"\
    >\n<svg aria-label=\"LangGraph Cyclic StateGraph Architecture\" height=\"240\" viewBox=\"0 0 700 240\" width=\"700\" xmlns=\"\
    http://www.w3.org/2000/svg\" style=\"max-width: 100%; height: auto; font-family: var(--font-mono, monospace);\">\n  <defs>\n\
