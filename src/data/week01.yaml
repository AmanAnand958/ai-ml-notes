      fn\">print</span>(<span class=\"str\">\"No records. Adding sample...\"</span>)\n\
      \    students.<span class=\"fn\">append</span>({<span class=\"str\">\"name\"\
      : \"Test\", \"age\": 20, \"score\": 85.5, \"city\": \"Mumbai\"</span>})\n  \
