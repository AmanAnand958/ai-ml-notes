      }\n\n# Compute averages — list comprehension to get all marks\naverages = {}\n\
      for name, marks in students.items():\n    averages[name] = round(sum(marks)\
      \ / len(marks), 2)\n\n# Assign grade — list of all averages for display\navg_list\
      \ = [averages[n] for n in students]  # list\ngrade_set = set()  # unique grades\
      \ earned\n\nprint(f\"{'Name':10} {'Average':10} {'Grade':8}\")\nprint(\"─\"\
      \ * 30)\n\nfor name, avg in averages.items():\n    grade = \"A\" if avg >= 85\
      \ else \"B\" if avg >= 70 else \"C\" if avg >= 60 else \"F\"\n    grade_set.add(grade)\n\
      \    print(f\"{name:10} {avg:10} {grade:8}\")\n\nprint(f\"\\nGrades awarded\
      \ this batch: {grade_set}\")  # set\nprint(f\"Top scorer: {max(averages, key=averages.get)}\"\
      )"
