    \        }\n        <span class=\"kw\">return</span> courses.<span class=\"fn\">get</span>(<span class=\"kw\">self</span>.spec,\
    \ [<span class=\"str\">\"Python\", \"Statistics\"</span>])\n\narjun = <span class=\"fn\">MLStudent</span>(<span class=\"\
    str\">\"Arjun\", 23, 9.0, \"NLP\"</span>)\n<span class=\"fn\">print</span>(arjun)\n<span class=\"fn\">print</span>(arjun.<span\
    \ class=\"fn\">recommend_courses</span>())    <span class=\"cm\"># [\"NLTK\", \"HuggingFace\"]</span>\n<span class=\"\
    fn\">print</span>(arjun.<span class=\"fn\">is_eligible</span>())          <span class=\"cm\"># inherited from Student!</span></code></pre>\n\
    </div>\n<div class=\"ml-connect\">\n       Every sklearn model follows this pattern:\n       \n        class LinearRegression(BaseEstimator,\
    \ RegressorMixin)\n       \n       — inheriting from base classes that provide fit(), predict(), score() contracts.\n\
    \       <br/>\n<br/>\n       PyTorch:\n       \n        class MyNet(nn.Module)\n       \n       — you inherit from nn.Module\
