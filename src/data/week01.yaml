    \ {lat}\"</span>)   <span class=\"cm\"># 28.6139</span>\n\n<span class=\"cm\"># Functions often return tuples</span>\n\
    <span class=\"kw\">def</span> <span class=\"fn\">min_max</span>(nums):\n    <span class=\"kw\">return</span> <span class=\"\
    fn\">min</span>(nums), <span class=\"fn\">max</span>(nums)  <span class=\"cm\"># implicitly a tuple</span>\n\nlow, high\
    \ = <span class=\"fn\">min_max</span>([<span class=\"num\">4</span>, <span class=\"num\">7</span>, <span class=\"num\"\
    >1</span>, <span class=\"num\">9</span>])\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Range: {low} to {high}\"\
    </span>)\n\n<span class=\"cm\"># This crashes — tuples are immutable</span>\n<span class=\"cm\"># delhi_coords[0] = 0\
    \   → TypeError: 'tuple' object does not support item assignment</span></code></pre>\n</div>\n<h3 class=\"sh3\">\n   \
    \    3. Sets — Unique Values, Fast Membership\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       Sets are unordered collections of unique elements, highly optimized for $O(1)$ fast membership\
    \ testing and mathematical operations.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — sets.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span class=\"cm\"># Sets store only UNIQUE values —\
    \ auto-removes duplicates</span>\nstudents_a = {<span class=\"str\">\"Raj\", \"Priya\", \"Amit\", \"Raj\"</span>}\n<span\
    \ class=\"fn\">print</span>(students_a)   <span class=\"cm\"># {\"Raj\", \"Priya\", \"Amit\"} — no duplicate Raj</span>\n\
    \n<span class=\"cm\"># Remove duplicates from a list (classic trick)</span>\nmarks = [<span class=\"num\">85</span>, <span\
    \ class=\"num\">92</span>, <span class=\"num\">85</span>, <span class=\"num\">78</span>, <span class=\"num\">92</span>]\n\
    unique = <span class=\"fn\">list</span>(<span class=\"fn\">set</span>(marks))   <span class=\"cm\"># [85, 92, 78]</span>\n\
    \n<span class=\"cm\"># Set operations — very useful in data analysis</span>\npython_devs = {<span class=\"str\">\"Raj\"\
    , \"Priya\", \"Amit\"</span>}\nml_devs = {<span class=\"str\">\"Priya\", \"Sara\", \"Amit\"</span>}\n\n<span class=\"\
