    <span class=\"fn\">print</span>(Student.school)        <span class=\"cm\"># IIT Delhi — class variable</span></code></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       2. Inheritance — Extend Without Rewriting\n      </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       Inheritance allows a subclass to adopt all the methods\
    \ and attributes of a parent class, enabling developers to extend functionality and reduce duplicate code.\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\n        </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
