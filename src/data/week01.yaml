  theory_html: "<h3 class=\"sh3\">\n       1. Defining and Calling Functions\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       Functions are reusable blocks of code that organize logic into modular\
    \ units.\n      </p>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n     \
    \  They take inputs (arguments), perform operations, and return outputs.\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         python\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span class=\"kw\">def</span>\
    \ <span class=\"fn\">greet</span>(name, greeting=<span class=\"str\">\"Namaste\"</span>):   <span class=\"cm\"># default\
    \ parameter</span>\n    <span class=\"str\">\"\"\"Greets a person. Docstring explains what function does.\"\"\"</span>\n\
    \    <span class=\"kw\">return</span> <span class=\"str\">f\"{greeting}, {name}! \U0001F64F\"</span>\n\n<span class=\"\
    fn\">print</span>(<span class=\"fn\">greet</span>(<span class=\"str\">\"Priya\"</span>))              <span class=\"cm\"\
    ># Namaste, Priya! \U0001F64F</span>\n<span class=\"fn\">print</span>(<span class=\"fn\">greet</span>(<span class=\"str\"\
    >\"Raj\", \"Hello\"</span>))      <span class=\"cm\"># Hello, Raj! \U0001F64F</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"fn\">greet</span>(greeting=<span class=\"str\">\"Hi\", name=\"Arjun\"</span>))  <span class=\"cm\"># keyword\
    \ args — order doesn't matter</span>\n\n<span class=\"cm\"># Multiple return values (returns tuple)</span>\n<span class=\"\
    kw\">def</span> <span class=\"fn\">stats</span>(numbers):\n    <span class=\"kw\">return</span> <span class=\"fn\">min</span>(numbers),\
    \ <span class=\"fn\">max</span>(numbers), <span class=\"fn\">sum</span>(numbers)/<span class=\"fn\">len</span>(numbers)\n\
    \nlo, hi, avg = <span class=\"fn\">stats</span>([<span class=\"num\">10</span>, <span class=\"num\">20</span>, <span class=\"\
    num\">30</span>, <span class=\"num\">40</span>])\n<span class=\"fn\">print</span>(<span class=\"str\">f\"min={lo}, max={hi},\
    \ avg={avg}\"</span>)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       2. *args and **kwargs\n      </h3>\n<p style=\"\
    margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       Python uses\n       \n        *args\n\
    \       \n       and\n       \n        **kwargs\n       \n       in function signatures to accept an arbitrary number\
    \ of positional and keyword arguments, offering extreme flexibility for wrapping APIs.\n      </p>\n<div class=\"cb\"\
    >\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"\
    runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span class=\"\
    cm\"># *args — accept any number of positional arguments</span>\n<span class=\"kw\">def</span> <span class=\"fn\">total</span>(*args):\n\
    \    <span class=\"fn\">print</span>(<span class=\"fn\">type</span>(args))    <span class=\"cm\"># tuple</span>\n    <span\
    \ class=\"kw\">return</span> <span class=\"fn\">sum</span>(args)\n\n<span class=\"fn\">print</span>(<span class=\"fn\"\
    >total</span>(<span class=\"num\">10</span>, <span class=\"num\">20</span>))           <span class=\"cm\"># 30</span>\n\
    <span class=\"fn\">print</span>(<span class=\"fn\">total</span>(<span class=\"num\">1</span>, <span class=\"num\">2</span>,\
    \ <span class=\"num\">3</span>, <span class=\"num\">4</span>, <span class=\"num\">5</span>))    <span class=\"cm\"># 15</span>\n\
    \n<span class=\"cm\"># kwargs — accept any number of keyword arguments</span>\n<span class=\"kw\">def</span> <span class=\"\
    fn\">create_profile</span>(kwargs):\n    <span class=\"fn\">print</span>(<span class=\"fn\">type</span>(kwargs))    <span\
    \ class=\"cm\"># dict</span>\n    <span class=\"kw\">for</span> k, v <span class=\"kw\">in</span> kwargs.<span class=\"\
    fn\">items</span>():\n        <span class=\"fn\">print</span>(<span class=\"str\">f\"  {k}: {v}\"</span>)\n\n<span class=\"\
    fn\">create_profile</span>(name=<span class=\"str\">\"Raj\", age=22, city=\"Delhi\"</span>)\n<span class=\"cm\"># This\
    \ is EXACTLY how sklearn models accept hyperparameters!</span>\n<span class=\"cm\"># RandomForestClassifier(n_estimators=100,\
    \ max_depth=5) uses kwargs</span></code></pre>\n</div>\n<h3 class=\"sh3\">\n       3. Lambda Functions\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       Lambda functions are\
    \ small, anonymous, single-expression functions that are defined inline without the standard\n       \n        def\n \
    \      \n       keyword.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n        \
    \ python\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n         \
    \ copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n       \
    \   Run\n         </button>\n</div>\n</div>\n<pre><code><span class=\"cm\"># lambda args: expression — anonymous one-liner\
    \ function</span>\nsquare = <span class=\"kw\">lambda</span> x: x ** <span class=\"num\">2</span>\nadd = <span class=\"\
    kw\">lambda</span> x, y: x + y\n\n<span class=\"fn\">print</span>(<span class=\"fn\">square</span>(<span class=\"num\"\
    >5</span>))    <span class=\"cm\"># 25</span>\n<span class=\"fn\">print</span>(<span class=\"fn\">add</span>(<span class=\"\
    num\">3</span>, <span class=\"num\">7</span>))   <span class=\"cm\"># 10</span>\n\n<span class=\"cm\"># Most common use:\
    \ as key in sort/sorted</span>\nstudents = [(<span class=\"str\">\"Raj\", 88), (\"Priya\", 95), (\"Amit\"</span>, <span\
    \ class=\"num\">72</span>)]\nstudents.<span class=\"fn\">sort</span>(key=<span class=\"kw\">lambda</span> x: x[<span class=\"\
    num\">1</span>], reverse=<span class=\"kw\">True</span>)   <span class=\"cm\"># sort by score</span>\n<span class=\"fn\"\
    >print</span>(students)   <span class=\"cm\"># [(\"Priya\", 95), (\"Raj\", 88), (\"Amit\", 72)]</span></code></pre>\n\
    </div>\n<div class=\"ml-connect\">\n       In ML:\n       \n        model.fit(X_train, y_train)\n       \n       ,\n \
    \      \n        model.predict(X_test)\n       \n       ,\n       \n        accuracy_score(y_true, y_pred)\n       \n\
    \       — every single ML operation is a function call.\n       <br/>\n<br/>\n       Understanding how functions work,\
    \ including *args and **kwargs, lets you read and write ML library code with confidence.\n      </div>\n<!-- PREDICT THE\
    \ OUTPUT -->\n<h2 class=\"sh2\">\n       \U0001F52E Predict the Output\n      </h2>\n<h2 class=\"sh2\">\n       ✅ Quick\
    \ Quiz\n      </h2>\n<h2 class=\"sh2\">\n       \U0001F0CF Flashcards\n      </h2>\n<!-- /day-4-theory -->"
