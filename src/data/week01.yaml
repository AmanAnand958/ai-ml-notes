  analogy: "File reading bilkul ek library kitaab ki tarah hai.\n       <br/>\n<br/>\n\
    \       Pehle shelf se kitaab uthao (file open), pado (read), phir wapas rakh\
    \ do (close). with open() ensures kitaab automatically wapas shelf pe jaayegi\
    \ — chahe kuch bhi ho."
  theory_html: "<h3 class=\"sh3\">\n       1. Reading and Writing Files\n      </h3>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><span class=\"cm\"># ALWAYS use 'with\
    \ open()' — auto-closes file even if error occurs</span>\n\n<span class=\"cm\"\
    ># Writing to a file</span>\n<span class=\"kw\">with</span> <span class=\"fn\"\
    >open</span>(<span class=\"str\">\"notes.txt\", \"w\"</span>) <span class=\"kw\"\
    >as</span> f:    <span class=\"cm\"># \"w\" = write (overwrites existing)</span>\n\
    \    f.<span class=\"fn\">write</span>(<span class=\"str\">\"Line 1: Python is\
    \ awesome\\n\"</span>)\n    f.<span class=\"fn\">write</span>(<span class=\"str\"\
    >\"Line 2: AI/ML is the future\\n\"</span>)\n\n<span class=\"cm\"># Reading entire\
    \ file</span>\n<span class=\"kw\">with</span> <span class=\"fn\">open</span>(<span\
    \ class=\"str\">\"notes.txt\", \"r\"</span>) <span class=\"kw\">as</span> f: \
    \   <span class=\"cm\"># \"r\" = read</span>\n    content = f.<span class=\"fn\"\
    >read</span>()\n    <span class=\"fn\">print</span>(content)\n\n<span class=\"\
    cm\"># Reading line by line (memory efficient for large files)</span>\n<span class=\"\
    kw\">with</span> <span class=\"fn\">open</span>(<span class=\"str\">\"notes.txt\"\
    , \"r\"</span>) <span class=\"kw\">as</span> f:\n    <span class=\"kw\">for</span>\
    \ line <span class=\"kw\">in</span> f:\n        <span class=\"fn\">print</span>(line.<span\
    \ class=\"fn\">strip</span>())            <span class=\"cm\"># strip() removes\
    \ trailing </span>\n\n\n<span class=\"cm\"># Appending to existing file</span>\n\
    <span class=\"kw\">with</span> <span class=\"fn\">open</span>(<span class=\"str\"\
    >\"notes.txt\", \"a\"</span>) <span class=\"kw\">as</span> f:    <span class=\"\
    cm\"># \"a\" = append</span>\n    f.<span class=\"fn\">write</span>(<span class=\"\
    str\">\"Line 3: File I/O mastered!\\n\"</span>)</pre>\n</div>\n<h3 class=\"sh3\"\
    >\n       2. CSV Files — The Most Common ML Data Format\n      </h3>\n<p style=\"\
    margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n\
    \       CSV (Comma-Separated Values) files are the standard format for tabular\
    \ datasets.\n      </p>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       Python's built-in\n       \n        csv\n      \
    \ \n       module allows reading and writing rows efficiently.\n      </p>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> csv\n\n\
    <span class=\"cm\"># Write CSV</span>\nstudents = [\n    [<span class=\"str\"\
    >\"Name\", \"Age\", \"Score\"</span>],\n    [<span class=\"str\">\"Raj\"</span>,\
    \ <span class=\"num\">21</span>, <span class=\"num\">88</span>],\n    [<span class=\"\
    str\">\"Priya\"</span>, <span class=\"num\">22</span>, <span class=\"num\">95</span>],\n\
    ]\n<span class=\"kw\">with</span> <span class=\"fn\">open</span>(<span class=\"\
    str\">\"students.csv\", \"w\", newline=\"\"</span>) <span class=\"kw\">as</span>\
    \ f:\n    writer = csv.<span class=\"fn\">writer</span>(f)\n    writer.<span class=\"\
    fn\">writerows</span>(students)\n\n<span class=\"cm\"># Read CSV as dict rows\
    \ — most useful for ML data</span>\n<span class=\"kw\">with</span> <span class=\"\
    fn\">open</span>(<span class=\"str\">\"students.csv\", \"r\"</span>) <span class=\"\
    kw\">as</span> f:\n    reader = csv.<span class=\"fn\">DictReader</span>(f)\n\
    \    <span class=\"kw\">for</span> row <span class=\"kw\">in</span> reader:\n\
    \        <span class=\"fn\">print</span>(<span class=\"str\">f\"{row['</span>Name<span\
    \ class=\"str\">']}: {row['</span>Score<span class=\"str\">']}\"</span>)</pre>\n\
    </div>\n<h3 class=\"sh3\">\n       3. Exception Handling — Never Let Your Program\
    \ Crash\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       Exception handling blocks (\n       \n        try\
    \ / except / finally\n       \n       ) intercept runtime errors gracefully, allowing\
    \ programs to log issues or run cleanup tasks without crashing.\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><span class=\"cm\"># try: attempt the\
    \ code | except: catch errors | finally: always runs</span>\n<span class=\"kw\"\
    >def</span> <span class=\"fn\">safe_divide</span>(a, b):\n    <span class=\"kw\"\
    >try</span>:\n        result = a / b\n        <span class=\"kw\">return</span>\
    \ result\n    <span class=\"kw\">except</span> ZeroDivisionError:\n        <span\
    \ class=\"fn\">print</span>(<span class=\"str\">\"Error: cannot divide by zero\"\
    </span>)\n        <span class=\"kw\">return</span> <span class=\"kw\">None</span>\n\
    \    <span class=\"kw\">except</span> TypeError <span class=\"kw\">as</span> e:\n\
    \        <span class=\"fn\">print</span>(<span class=\"str\">f\"Error: {e}\"</span>)\n\
    \        <span class=\"kw\">return</span> <span class=\"kw\">None</span>\n   \
    \ <span class=\"kw\">finally</span>:\n        <span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"safe_divide called.\"</span>)   <span class=\"cm\"># always\
    \ runs</span>\n\n<span class=\"cm\"># File that may not exist</span>\n<span class=\"\
    kw\">try</span>:\n    <span class=\"kw\">with</span> <span class=\"fn\">open</span>(<span\
    \ class=\"str\">\"data.csv\"</span>) <span class=\"kw\">as</span> f:\n       \
    \ data = f.<span class=\"fn\">read</span>()\n<span class=\"kw\">except</span>\
    \ FileNotFoundError:\n    <span class=\"fn\">print</span>(<span class=\"str\"\
    >\"File not found! Creating empty dataset...\"</span>)\n    data = <span class=\"\
    str\">\"\"</span></pre>\n</div>\n<div class=\"ml-connect\">\n       In ML, you\
    \ load datasets from CSV/JSON constantly.\n       <br/>\n<br/>\n       If a file\
    \ doesn't exist, if a column is missing, if data is corrupted — your training\
    \ script should handle it gracefully, not crash.\n       <br/>\n<br/>\n      \
    \ Production ML pipelines have try/except everywhere.\n      </div>\n<!-- PREDICT\
    \ THE OUTPUT -->\n<h2 class=\"sh2\">\n       \U0001F52E Predict the Output\n \
    \     </h2>\n<!-- /day-5-theory -->\n<!-- /day-5-quiz-section -->"
