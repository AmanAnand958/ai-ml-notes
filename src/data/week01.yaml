  gotcha:
    title: '⚠️ Gotcha: Indentation & Variable References'
    description: Python does not copy lists on assignment `b = a`; it references the
      same memory address. Use `b = a.copy()` to avoid accidental mutations.
  takeaways:
    hinglish_line: Production mein Python Setup + Variables + Data Types ko use karte
      waqt edge cases aur mathematical constraints ko pehle validate karo, taaki downstream
      deployment bilkul rock-solid rahe!
    bullets:
    - "<strong>\n           = is assignment, == is comparison.\n          </strong>\n\
      \n           x = 5\n          \n          stores.\n          \n           x\
      \ == 5\n          \n          checks. Getting these mixed causes the most common\
      \ Day-1 crash."
    - "<strong>\n           input() always returns a string.\n          </strong>\n\
      \          Wrap it in int() or float() before any math. Forgetting this is the\
      \ #2 most common beginner error."
    - "<strong>\n           True/False are capitalized.\n          </strong>\n   \
      \       Python is case-sensitive.\n          \n           true\n          \n\
      \          is a NameError.\n          \n           True\n          \n      \
      \    is correct."
    - "<strong>\n           f-strings are the modern standard.\n          </strong>\n\
      \          Use\n          \n           f\"Hello {name}\"\n          \n     \
      \     — never use + concatenation for printing."
    - "<strong>\n           Every variable is typed in ML too.\n          </strong>\n\
      \          When you later write\n          \n           learning_rate = 0.001\n\
      \          \n          or\n          \n           num_classes = 10\n       \
