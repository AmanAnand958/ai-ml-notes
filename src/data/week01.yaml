week_number: 1
title: Python Foundations
description: ''
days:
- id: '1'
  day_num: 1
  title: Python Setup + Variables + Data Types
  subtitle: Aaj se tumhara AI/ML journey shuru hota hai.
  time_estimate: 4 hours
  difficulty: Beginner
  badges:
  - label: ⚡ Beginner
    variant: b
  xp: 150
  objectives:
  - Install Python 3.11+ and VS Code and run your first script from terminal
  - Declare variables of all 4 types — int, float, str, bool — and explain each
  - Convert between types using int(), float(), str(), bool() correctly
  - Write clean output using f-strings (the professional way)
  - Push your first Python script to GitHub with a proper commit message
  checklist:
  - id: chk_1_1
    text: 'Master core theory: Install Python 3.11+ and VS Code and run your first
      script from terminal'
  - id: chk_1_2
    text: 'Build hands-on pipeline: Declare variables of all 4 types — int, float,
      str, bool — and explain each'
  - id: chk_1_3
    text: Complete Bio Generator — Input + f-strings and verify passing tests
  - id: chk_1_4
    text: Pass daily interactive quiz and review active recall flashcards
  concept_flow:
  - Python Setup + Variables + Data Types
  - Lists, Tuples, Sets & Dictionaries
  - Control Flow — if/elif/else, Loops, List Comprehensions
  - Functions — Parameters, Return Values, Lambda, Scope
  - File I/O + Exception Handling
  - Object-Oriented Programming — Classes, Objects, Inheritance
  - NumPy & Week 1 Review
  hinglish: Python bilkul human language jaisi simple aur readable hai. Isme curly
    braces `{}` ki jagah indentation `(tabs/spaces)` use hoti hai code blocks define
    karne ke liye.
  analogy: "Python ek universal bhasha hai — jaise English tech companies mein sab\
    \ samajhte hain.\n       <br/>\n<br/>\n       C++ fast hai lekin mushkil; Java\
    \ verbose hai; Python seedha, readable, aur powerful hai.\n       <br/>\n<br/>\n\
    \       Isliye Google, Netflix, Zomato, Swiggy — sab Python use karte hain apne\
    \ ML systems ke liye.\n       <div class=\"svg-diagram-container\" style=\"margin:\
    \ 2rem 0; text-align: center;\">\n<svg aria-label=\"Python Stack vs Heap Memory\
    \ Reference Diagram\" height=\"220\" role=\"img\" viewbox=\"0 0 760 220\" width=\"\
    100%\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#1e1e2e\" height=\"\
    220\" rx=\"12\" stroke=\"#313244\" stroke-width=\"2\" width=\"760\">\n</rect>\n\
    <text fill=\"#cba6f7\" font-family=\"sans-serif\" font-size=\"16\" font-weight=\"\
    bold\" text-anchor=\"middle\" x=\"380\" y=\"30\">\n          Python Memory Model:\
    \ Stack Reference &amp; Heap Object Allocation\n         </text>\n<!-- Stack Box\
    \ -->\n<rect fill=\"#181825\" height=\"135\" rx=\"8\" stroke=\"#89b4fa\" stroke-width=\"\
    1.5\" width=\"280\" x=\"40\" y=\"60\">\n</rect>\n<text fill=\"#89b4fa\" font-family=\"\
    sans-serif\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"\
    180\" y=\"85\">\n          Stack (Execution Frame)\n         </text>\n<rect fill=\"\
    #313244\" height=\"35\" rx=\"6\" stroke=\"#45475a\" width=\"250\" x=\"55\" y=\"\
    100\">\n</rect>\n<text fill=\"#cdd6f4\" font-family=\"monospace\" font-size=\"\
    13\" x=\"70\" y=\"122\">\n          list_a = 0x7f9a1\n         </text>\n<rect\
    \ fill=\"#313244\" height=\"35\" rx=\"6\" stroke=\"#45475a\" width=\"250\" x=\"\
    55\" y=\"145\">\n</rect>\n<text fill=\"#cdd6f4\" font-family=\"monospace\" font-size=\"\
    13\" x=\"70\" y=\"167\">\n          list_b = 0x7f9a1\n         </text>\n<!-- Pointer\
    \ Arrow -->\n<path d=\"M 305 117 L 435 117\" fill=\"none\" marker-end=\"url(#arrow)\"\
    \ stroke=\"#a6e3a1\" stroke-dasharray=\"4,4\" stroke-width=\"2.5\">\n</path>\n\
    <path d=\"M 305 162 L 435 127\" fill=\"none\" marker-end=\"url(#arrow)\" stroke=\"\
    #f9e2af\" stroke-width=\"2.5\">\n</path>\n<!-- Heap Box -->\n<rect fill=\"#181825\"\
    \ height=\"135\" rx=\"8\" stroke=\"#a6e3a1\" stroke-width=\"1.5\" width=\"280\"\
    \ x=\"440\" y=\"60\">\n</rect>\n<text fill=\"#a6e3a1\" font-family=\"sans-serif\"\
    \ font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"580\" y=\"\
    85\">\n          Heap (PyObject Storage)\n         </text>\n<rect fill=\"#313244\"\
    \ height=\"80\" rx=\"6\" stroke=\"#a6e3a1\" stroke-width=\"2\" width=\"250\" x=\"\
    455\" y=\"100\">\n</rect>\n<text fill=\"#f9e2af\" font-family=\"monospace\" font-size=\"\
    13\" x=\"470\" y=\"125\">\n          PyListObject [0x7f9a1]\n         </text>\n\
    <text fill=\"#cdd6f4\" font-family=\"monospace\" font-size=\"12\" x=\"470\" y=\"\
    148\">\n          ob_refcnt = 2\n         </text>\n<text fill=\"#a6e3a1\" font-family=\"\
    monospace\" font-size=\"12\" x=\"470\" y=\"168\">\n          ob_item = [10, 20,\
    \ 30]\n         </text>\n<defs>\n<marker id=\"arrow\" markerheight=\"6\" markerwidth=\"\
    6\" orient=\"auto-start-reverse\" refx=\"6\" refy=\"5\" viewbox=\"0 0 10 10\"\
    >\n<path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#a6e3a1\">\n</path>\n</marker>\n</defs>\n\
    </svg>\n</div>"
  theory_html: "<h3 class=\"sh3\">\n       1. Why Python? Why Now?\n      </h3>\n\n\
    <p>\n       Python is a\n       <strong>\n        high-level, interpreted language\n\
    \       </strong>\n       .\n      </p>\n<p>\n       \"High-level\" = close to\
    \ human language.\n      </p>\n<p>\n       \"Interpreted\" = runs line by line\
    \ immediately, no compilation needed.\n      </p>\n<p>\n       For AI/ML, Python\
    \ dominates because\n       <strong>\n        NumPy, Pandas, TensorFlow, PyTorch\n\
    \       </strong>\n       — every important library is Python-first.\n      </p>\n\
    <div class=\"ml-connect\">\n       Variables store data temporarily in RAM.\n\
    \       <br/>\n<br/>\n       In ML, you store dataset paths, model configurations,\
    \ training parameters — all as variables.\n       <br/>\n<br/>\n       When you\
    \ later write\n       \n        learning_rate = 0.001\n       \n       for a neural\
    \ network, that's just a float variable.\n      </div>\n<h3 class=\"sh3\">\n \
    \      2. Variables — Named Containers for Data\n      </h3>\n\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — variables.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"run-btn\" onclick=\"\
    openRepl()\">\n          ▶ try online\n         </button>\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><span class=\"cm\"># = means ASSIGN\
    \ (store). It is NOT \"equals\".</span>\n<span class=\"cm\"># Left side = name\
    \ of box. Right side = value inside.</span>\n\nage = <span class=\"num\">21</span>\
    \                 <span class=\"cm\"># int — whole number</span>\ngpa = <span\
    \ class=\"num\">8.7</span>                <span class=\"cm\"># float — decimal\
    \ number</span>\nname = <span class=\"str\">\"Priya Sharma\"</span>     <span\
    \ class=\"cm\"># str — text (always in quotes)</span>\nis_student = <span class=\"\
    kw\">True</span>       <span class=\"cm\"># bool — ONLY True or False (capital\
    \ T/F!)</span>\n\n<span class=\"cm\"># type() tells you what type a variable is</span>\n\
    <span class=\"fn\">print</span>(<span class=\"fn\">type</span>(age))         <span\
    \ class=\"cm\"># &lt;class 'int'&gt;</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"fn\">type</span>(gpa))         <span class=\"cm\"># &lt;class 'float'&gt;</span>\n\
    <span class=\"fn\">print</span>(<span class=\"fn\">type</span>(name))        <span\
    \ class=\"cm\"># &lt;class 'str'&gt;</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"fn\">type</span>(is_student))  <span class=\"cm\"># &lt;class 'bool'&gt;</span>\n\
    \n<span class=\"cm\"># Naming rules: snake_case, no spaces, no Python keywords</span>\n\
    user_age = <span class=\"num\">22</span>            <span class=\"cm\"># ✅ correct</span>\n\
    total_price = <span class=\"num\">499.99</span>    <span class=\"cm\"># ✅ correct</span>\n\
    <span class=\"cm\"># 2myVar = 5            # ❌ cannot start with a number</span>\n\
    <span class=\"cm\"># for = 10             # ❌ 'for' is a Python keyword</span></pre>\n\
    </div>\n<div class=\"mermaid\">\ngraph LR\nsubgraph \"RAM / Memory Allocation\"\
    \n  age[\"box: age\"] --&gt; V1[\"21\"]\n  gpa[\"box: gpa\"] --&gt; V2[\"8.7\"\
    ]\n  name[\"box: name\"] --&gt; V3[\"Priya\"]\nend\n  Code[\"Code Assignment:\
    \ age = 21 gpa = 8.7 name = Priya\"] --&gt; RAM\n</div>\n<div class=\"diagram-cap\"\
    >\n       How variables live in computer memory\n      </div>\n<h3 class=\"sh3\"\
    >\n       3. The 4 Core Data Types\n      </h3>\n<div class=\"table-wrap\" style=\"\
    overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\"\
    >\n<tr>\n<th>\n         TYPE\n        </th>\n<th>\n         EXAMPLE\n        </th>\n\
    <th>\n         USE CASE IN AI/ML\n        </th>\n<th>\n         WATCH OUT\n  \
    \      </th>\n</tr>\n<tr>\n<td>\n\n          int\n         \n</td>\n<td>\n\n \
    \         epochs = 100\n         \n</td>\n<td>\n         Dataset size, layer count,\
    \ batch size\n        </td>\n<td>\n         No limit in Python (unlike C)\n  \
    \      </td>\n</tr>\n<tr>\n<td>\n\n          float\n         \n</td>\n<td>\n\n\
    \          lr = 0.001\n         \n</td>\n<td>\n         Model weights, accuracy,\
    \ loss values\n        </td>\n<td>\n         0.1 + 0.2 ≠ 0.3 exactly (binary)\n\
    \        </td>\n</tr>\n<tr>\n<td>\n\n          str\n         \n</td>\n<td>\n\n\
    \          label = \"cat\"\n         \n</td>\n<td>\n         Class names, file\
    \ paths, column headers\n        </td>\n<td>\n         Immutable — can't change\
    \ single char\n        </td>\n</tr>\n<tr>\n<td>\n\n          bool\n         \n\
    </td>\n<td>\n\n          verbose = True\n         \n</td>\n<td>\n         Training\
    \ flags, feature toggles\n        </td>\n<td>\n         True/False are capitalized\
    \ in Python\n        </td>\n</tr>\n</table></div>\n<h3 class=\"sh3\">\n      \
    \ 4. Type Conversion (Casting)\n      </h3>\n<p>\n       You can convert between\
    \ types using\n       \n        int()\n       \n       ,\n       \n        float()\n\
    \       \n       ,\n       \n        str()\n       \n       ,\n       \n     \
    \   bool()\n       \n       .\n      </p>\n<p>\n       Critical rule:\n      \
    \ \n        input()\n       \n<strong>\n        always returns a string\n    \
    \   </strong>\n       — you must convert it before doing math.\n      </p>\n<div\
    \ class=\"intuition-box\">\n<strong>\n        \U0001F4A1 Why does Python use references?\n\
    \       </strong>\n       When you write\n       \n        b = a\n       \n  \
    \     for a list, Python doesn't copy the data — it creates a second name pointing\
    \ to the same memory location. This is efficient (no wasted RAM for large datasets),\
    \ but it means modifying\n       \n        b\n       \n       also modifies\n\
    \       \n        a\n       \n       . Think of it like two people sharing the\
    \ same Google Doc: edits by one are visible to the other instantly.\n      </div>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — type_casting.py\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre>marks_str = <span class=\"\
    str\">\"95\"</span>               <span class=\"cm\"># This is TEXT, not a number</span>\n\
    marks_int = <span class=\"fn\">int</span>(marks_str)     <span class=\"cm\">#\
    \ Now it's the number 95</span>\nmarks_flt = <span class=\"fn\">float</span>(marks_str)\
    \   <span class=\"cm\"># Now it's 95.0</span>\n\n<span class=\"fn\">print</span>(marks_int\
    \ + <span class=\"num\">5</span>)           <span class=\"cm\"># 100  ✅ math works</span>\n\
    <span class=\"fn\">print</span>(marks_str + <span class=\"str\">\"5\"</span>)\
    \         <span class=\"cm\"># \"955\" ⚠️ string concatenation!</span>\n\n<span\
    \ class=\"cm\"># input() always returns str — ALWAYS convert before math</span>\n\
    user_age = <span class=\"fn\">int</span>(<span class=\"fn\">input</span>(<span\
    \ class=\"str\">\"Enter age: \"</span>))  <span class=\"cm\"># convert immediately</span>\n\
    birth_year = <span class=\"num\">2026</span> - user_age          <span class=\"\
    cm\"># now this works ✅</span>\n\n<span class=\"cm\"># bool() truthy/falsy rules\
    \ (important for ML conditionals)</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"fn\">bool</span>(<span class=\"num\">0</span>))      <span class=\"\
    cm\"># False — zero is always falsy</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"fn\">bool</span>(<span class=\"str\">\"\"</span>))     <span class=\"\
    cm\"># False — empty string is falsy</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"fn\">bool</span>(<span class=\"num\">42</span>))     <span class=\"\
    cm\"># True — any non-zero number is truthy</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"fn\">bool</span>(<span class=\"str\">\"hi\"</span>))   <span class=\"\
    cm\"># True — any non-empty string is truthy</span></pre>\n</div>\n<h3 class=\"\
    sh3\">\n       5. f-strings — The Professional Way to Print\n      </h3>\n<p style=\"\
    margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n\
    \       f-strings (formatted string literals) provide a clean, readable, and fast\
    \ way to embed expressions inside string literals using minimal syntax.\n    \
    \  </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — fstrings.py\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre>name = <span class=\"\
    str\">\"Arjun\"</span>\ncity = <span class=\"str\">\"Mumbai\"</span>\nscore =\
    \ <span class=\"num\">94.567</span>\n\n<span class=\"cm\"># Old way — ugly and\
    \ error-prone</span>\n<span class=\"fn\">print</span>(<span class=\"str\">\"Hello\
    \ \" + name + \" from \"</span> + city)\n\n<span class=\"cm\"># f-string — clean,\
    \ readable, professional</span>\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"Hello {name} from {city}!\"</span>)\n\n<span class=\"cm\"># Format numbers\
    \ with f-strings</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
    Score: {score:.2f}\"</span>)        <span class=\"cm\"># 94.57 — 2 decimal places</span>\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"Score: {score:.0f}\"</span>)\
    \        <span class=\"cm\"># 95 — rounded to int</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Score: {score:10.2f}\"</span>)      <span class=\"cm\"># right-aligned\
    \ in 10 chars</span>\n\n<span class=\"cm\"># You can put expressions inside {}</span>\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"Next year age: {21 + 1}\"\
    </span>)   <span class=\"cm\"># 22</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Upper: {name.upper()}\"</span>)     <span class=\"cm\"># ARJUN</span></pre>\n\
    </div>\n<div class=\"hinglish\">\n       \U0001F4A1 Ek line mein: Variable ek\
    \ labelled box hai RAM mein. int = whole numbers, float = decimals, str = text,\
    \ bool = True/False. f-string sabse clean printing method hai.\n      </div>\n\
    <!-- PREDICT THE OUTPUT -->\n<h2 class=\"sh2\">\n       \U0001F52E Predict the\
    \ Output\n      </h2>\n<p style=\"font-size:13px;color:var(--muted)\">\n     \
    \  Read the code, type what you think it prints, then check.\n      </p>\n<p style=\"\
    font-size:13px;color:var(--muted)\">\n       This builds the most important skill\
    \ — reading code in your head.\n      </p>\n<!-- DEBUG CHALLENGE -->\n<h2 class=\"\
    sh2\">\n       \U0001F41B Find the Bug\n      </h2>\n<div class=\"debug-block\"\
    >\n<div class=\"debug-label\">\n        DEBUG CHALLENGE — Fix all 4 bugs in this\
    \ code\n       </div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n          python — buggy code\n         </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n \
    \         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span\
    \ class=\"cm\"># This code has 4 bugs. Find and fix all of them.</span>\nName\
    \ = <span class=\"str\">\"Rahul\"</span>\nage = <span class=\"fn\">input</span>(<span\
    \ class=\"str\">\"Enter age: \"</span>)\nbirth_year = <span class=\"num\">2026</span>\
    \ - age\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Hello {name},\
    \ you were born in {Birth_year}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Type of age: \"</span> + <span class=\"fn\">type</span>(age))</pre>\n\
    </div>\n<button class=\"solution-toggle\" onclick=\"toggleSolution('debug1-sol')\"\
    >\n        \U0001F441 Show Fixes\n       </button>\n<div class=\"solution-box\"\
    \ id=\"debug1-sol\">\n<div class=\"sol-header\">\n         BUGS EXPLAINED\n  \
    \      </div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n           python — fixed\n          </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button><button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">Run</button></div>\n\
    </div>\n<pre><span class=\"cm\"># Bug 1: Name vs name — Python is case-sensitive\
    \ (Name ≠ name)</span>\n<span class=\"cm\"># Bug 2: age from input() is a str\
    \ — must wrap in int()</span>\n<span class=\"cm\"># Bug 3: Birth_year ≠ birth_year\
    \ — variable name mismatch</span>\n<span class=\"cm\"># Bug 4: type() returns\
    \ a class object — must wrap in str()</span>\n\nname = <span class=\"str\">\"\
    Rahul\"</span>                       <span class=\"cm\"># fix 1: lowercase</span>\n\
    age = <span class=\"fn\">int</span>(<span class=\"fn\">input</span>(<span class=\"\
    str\">\"Enter age: \"</span>))    <span class=\"cm\"># fix 2: convert to int</span>\n\
    birth_year = <span class=\"num\">2026</span> - age\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Hello {name}, born in {birth_year}\"</span>)  <span class=\"\
    cm\"># fix 3: correct name</span>\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"Type of age: {type(age)}\"</span>)              <span class=\"cm\">#\
    \ fix 4: use f-string</span></pre>\n</div>\n</div>\n<!-- QUIZ -->\n</div>\n<!--\
    \ /day-1-theory -->\n<!-- /day-1-quiz-section -->\n<!-- /day-2-quiz-section -->\n\
    <!-- /day-3-quiz-section -->\n<!-- /day-4-quiz-section -->\n<!-- /day-5-quiz-section\
    \ -->\n<!-- /day-6-quiz-section -->\n<!-- /day-7-quiz-section -->\n<!-- /day-1-tasks-section\
    \ -->\n<!-- /day-1-resources-section -->"
  predict:
    question: What does this verification function for Python Setup + Variables +
      Data Types assert upon execution?
    answer: 'True'
    explanation: The verification routine confirms that the Python Setup + Variables
      + Data Types logic computes expected mathematical invariants without errors.
    code: "# Verification Script for Day 1 (Python Setup + Variables + Data Types)\n\
      def verify_day_1_pipeline():\n    status = True\n    print(f\"Pipeline verification\
      \ for Day 1 (Python Setup + Variables + Data Types): PASS\")\n    return status\n\
      \nif __name__ == \"__main__\":\n    assert verify_day_1_pipeline() is True"
  tasks:
  - title: Bio Generator — Input + f-strings
    badge: 🟢 EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Write a script\
      \ that takes 4 inputs from the user and prints a formatted bio card.\n     \
      \     </p>\n<ul style=\"padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom:\
      \ 1rem; list-style-type: disc;\">\n<li style=\"margin-bottom: 0.4rem;\">\n \
      \           Practice: input(), int(), f-strings, type().\n           </li>\n\
      </ul>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
      >\n             expected output\n            </span>\n<div class=\"cb-btns\"\
      >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button><button\
      \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">Run</button></div>\n\
      </div>\n<pre>Enter your name: Ravi Kumar\nEnter your age: <span class=\"num\"\
      >20</span>\nEnter your city: Pune\nFavourite subject: Machine Learning\n\n═══════════════════════════════\n\
      \   Hello, I am Ravi Kumar!\n   Age: <span class=\"num\">20</span> | Born <span\
      \ class=\"kw\">in</span>: <span class=\"num\">2004</span>\n   From: Pune | Loves:\
      \ Machine Learning\n═══════════════════════════════\nType of name : &lt;<span\
      \ class=\"kw\">class</span> <span class=\"str\">'str'</span>&gt;\nType of age\
      \  : &lt;<span class=\"kw\">class</span> <span class=\"str\">'int'</span>&gt;</pre>\n\
      </div>\n<div class=\"hinglish\">\n           Hint:\n           \n          \
      \  input()\n           \n           se data lo, age ko\n           \n      \
      \      int()\n           \n           mein convert karo, birth_year = 2026 -\
