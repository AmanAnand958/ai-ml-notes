- id: '3'
  day_num: 3
  title: Control Flow — if/elif/else, Loops, List Comprehensions
  subtitle: Programs ko decisions lene aur repeat karne ki power — ye concepts ML
    training loops, data filtering, aur model evaluation mein har jagah use hote hain.
  time_estimate: 4 hours
  difficulty: Beginner
  badges:
  - label: ⚡ Beginner
    variant: b
  xp: 150
  objectives:
  - Write if/elif/else chains for multi-branch decisions
  - Use for loops with range(), enumerate(), zip() professionally
  - Control loops with break, continue, else
  - Write list comprehensions — the most Pythonic ML pattern
  - Build a number guessing game and a grade distribution analyzer
  checklist:
  - id: chk_3_1
    text: 'Master core theory: Write if/elif/else chains for multi-branch decisions'
  - id: chk_3_2
    text: 'Build hands-on pipeline: Use for loops with range(), enumerate(), zip()
      professionally'
  - id: chk_3_3
    text: Complete FizzBuzz AI Gatekeeper — Conditionals & Modulo and verify passing
      tests
