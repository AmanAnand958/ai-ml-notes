      \ <span class=\"str\">'int'</span>&gt;</pre>\n</div>\n<div class=\"hinglish\">\n           Hint:\n           \n    \
      \        input()\n           \n           se data lo, age ko\n           \n            int()\n           \n        \
      \   mein convert karo, birth_year = 2026 - age calculate karo, phir f-string se print karo.\n          </div>\n\n\n\
      <button class=\"solution-toggle\" onclick=\"toggleSolution(\"sol-w1d1t1\")\">\n           \U0001F4D3 Show Complete Colab\
      \ Code\n          </button>\n<div class=\"solution-box\" id=\"sol-w1d1t1\">\n<div class=\"sol-header\">\n          \
      \  \U0001F4D3 Complete Colab Code\n           </div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
      >\n              python\n             </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
      >\n               copy\n              </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left:4px;\"\
      >\n               Run\n              </button>\n</div>\n</div>\n<pre><span class=\"cm\"># Bio Generator - Input + f-strings</span>\n\
      name = <span class=\"fn\">input</span>(<span class=\"str\">\"Enter your name: \"</span>)\nage = <span class=\"fn\">int</span>(<span\
      \ class=\"fn\">input</span>(<span class=\"str\">\"Enter your age: \"</span>))\ncity = <span class=\"fn\">input</span>(<span\
