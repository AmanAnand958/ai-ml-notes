  hinglish: "Inheritance se code reuse hota hai:\n       \n        class MLModel(BaseModel)\n\
    \       \n       — sklearn ke sare models is pattern ko follow karte hain. Aaj\
    \ ye samajh lo toh sklearn ka code samajhna asaan ho jaayega."
  analogy: "Python list ek market bag hai — kuch bhi daal sako, lekin heavy lifting\
    \ ke liye efficient nahi.\n       <br/>\n<br/>\n       NumPy array ek industrial\
    \ conveyor belt hai — sirf ek type ka data, lekin millions of items per second.\n\
    \       <br/>\n<br/>\n       ML mein lakhs of data points milliseconds mein process\
    \ — NumPy ke bina impossible."
  theory_html: "<h3 class=\"sh3\">\n       1. Creating Arrays\n      </h3>\n<p style=\"\
    margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n\
    \       NumPy arrays (\n       \n        ndarray\n       \n       ) are homogeneous,\
    \ multi-dimensional grids that store numerical values of the same data type, forming\
    \ the basis of all ML data representations.\n      </p>\n<div class=\"cb\">\n\
    <div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np  \
    \ <span class=\"cm\"># ALWAYS import as np — universal convention</span>\n\n<span\
    \ class=\"cm\"># Creating arrays</span>\na = np.<span class=\"fn\">array</span>([<span\
    \ class=\"num\">1</span>, <span class=\"num\">2</span>, <span class=\"num\">3</span>,\
    \ <span class=\"num\">4</span>, <span class=\"num\">5</span>])               <span\
    \ class=\"cm\"># 1D array</span>\nb = np.<span class=\"fn\">array</span>([[<span\
    \ class=\"num\">1</span>, <span class=\"num\">2</span>, <span class=\"num\">3</span>],\
    \ [<span class=\"num\">4</span>, <span class=\"num\">5</span>, <span class=\"\
    num\">6</span>]])         <span class=\"cm\"># 2D array (matrix)</span>\nc = np.<span\
    \ class=\"fn\">zeros</span>((<span class=\"num\">3</span>, <span class=\"num\"\
    >3</span>))                        <span class=\"cm\"># 3x3 zeros</span>\nd =\
    \ np.<span class=\"fn\">ones</span>((<span class=\"num\">2</span>, <span class=\"\
    num\">4</span>))                         <span class=\"cm\"># 2x4 ones</span>\n\
    e = np.<span class=\"fn\">arange</span>(<span class=\"num\">0</span>, <span class=\"\
    num\">10</span>, <span class=\"num\">2</span>)                    <span class=\"\
    cm\"># [0, 2, 4, 6, 8]</span>\nf = np.<span class=\"fn\">linspace</span>(<span\
    \ class=\"num\">0</span>, <span class=\"num\">1</span>, <span class=\"num\">5</span>)\
    \                  <span class=\"cm\"># [0, 0.25, 0.5, 0.75, 1.0] evenly spaced</span>\n\
    g = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">3</span>, <span\
    \ class=\"num\">3</span>)                  <span class=\"cm\"># 3x3 random normal\
    \ — used for model weights</span>\n\n<span class=\"cm\"># Array properties — you'll\
    \ read these THOUSANDS of times in ML</span>\n<span class=\"fn\">print</span>(b.shape)\
    \    <span class=\"cm\"># (2, 3) — 2 rows, 3 cols</span>\n<span class=\"fn\">print</span>(b.ndim)\
    \     <span class=\"cm\"># 2 — number of dimensions</span>\n<span class=\"fn\"\
    >print</span>(b.dtype)    <span class=\"cm\"># int64 — data type</span>\n<span\
    \ class=\"fn\">print</span>(b.size)     <span class=\"cm\"># 6 — total elements</span></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       2. Vectorized Operations — Why NumPy is 100x\
    \ Faster\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       Vectorization bypasses slow Python loop operations\
    \ by executing math calculations in parallel compiled C code, drastically accelerating\
    \ numerical computations.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\nscores =\
    \ np.<span class=\"fn\">array</span>([<span class=\"num\">85</span>, <span class=\"\
    num\">92</span>, <span class=\"num\">78</span>, <span class=\"num\">95</span>,\
    \ <span class=\"num\">88</span>])\n\n<span class=\"cm\"># Operations apply to\
    \ EVERY element — no for loop needed</span>\n<span class=\"fn\">print</span>(scores\
    \ + <span class=\"num\">5</span>)             <span class=\"cm\"># [90, 97, 83,\
    \ 100, 93]</span>\n<span class=\"fn\">print</span>(scores * <span class=\"num\"\
    >1.1</span>)           <span class=\"cm\"># [93.5, 101.2, 85.8, 104.5, 96.8]</span>\n\
    <span class=\"fn\">print</span>(scores ** <span class=\"num\">2</span>)      \
    \      <span class=\"cm\"># [7225, 8464, 6084, 9025, 7744]</span>\n\n<span class=\"\
    cm\"># Boolean indexing — filter without loops</span>\n<span class=\"fn\">print</span>(scores[scores\
