    correct_fb: ✅ Correct! 3.14 has a decimal point, so Python stores it as a float.
      Python has no "double" type like Java/C — float covers all decimals.
    wrong_fb: ❌ Not quite. 3.14 has a decimal point so it's a float, not int. Python
      uses 'float' (not 'double' or 'number') for all decimal numbers. Try B.
  - num_str: QUESTION 2 OF 4
    question: "What is the output of:\n         \n          print(\"5\" + \"3\")\n\
      \         \n         ?"
    qid: q1_2
    options:
    - letter: A
      text: '8'
      is_correct: false
    - letter: B
      text: '53'
      is_correct: true
    - letter: C
      text: '"8"'
      is_correct: false
    - letter: D
      text: Error
      is_correct: false
    correct_fb: '✅ Correct! "5" and "3" are strings (in quotes). + on strings means
      concatenation (join), not addition. So "5" + "3" = "53". To add them as numbers:
      int("5") + int("3") = 8.'
    wrong_fb: ❌ Wrong. Both "5" and "3" are strings — they're in quotes. In Python,
      + on strings means join (concatenate), not add. Result is "53". Answer is B.
  - num_str: QUESTION 3 OF 4
    question: Which variable name follows Python conventions correctly?
    qid: q1_3
    options:
    - letter: A
      text: UserAge
      is_correct: false
    - letter: B
      text: user-age
      is_correct: false
    - letter: C
      text: user_age
      is_correct: true
    - letter: D
      text: 2user_age
      is_correct: false
    correct_fb: ✅ Correct! Python convention is snake_case — all lowercase with underscores.
      UserAge is PascalCase (used for class names). user-age uses a hyphen which Python
      reads as minus. 2user_age starts with a number which is illegal.
    wrong_fb: ❌ Python uses snake_case (C is correct). UserAge = PascalCase (for classes).
      user-age = hyphen means subtraction. 2user_age = can't start with a digit.
