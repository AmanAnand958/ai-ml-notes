  analogy: "Ek school ka example: List = attendance register (ordered, can add/remove\
    \ names, duplicates allowed).\n       <br/>\n<br/>\n       Tuple = exam timetable\
    \ (fixed, nobody changes it).\n       <br/>\n<br/>\n       Set = unique toppers\
    \ across all classes (no duplicates).\n       <br/>\n<br/>\n       Dictionary\
    \ = student ID card system (roll number → student details, instant lookup)."
  theory_html: "<div class=\"mermaid\">\ngraph TD\n  Q1[\"Key-Value lookup needed?\"\
    ] --&gt;|Yes| Dict[\"Dictionary O1 constant lookup\"]\n  Q1 --&gt;|No| Q2[\"Unique\
    \ values only?\"]\n  Q2 --&gt;|Yes| Set[\"Set O1 membership check\"]\n  Q2 --&gt;|No|\
    \ Q3[\"Mutable / Can change?\"]\n  Q3 --&gt;|Yes| List[\"List On linear lookup\"\
    ]\n  Q3 --&gt;|No| Tuple[\"Tuple On lookup / Immutable\"]\n</div>\n<div class=\"\
    diagram-cap\">\n       Use this decision tree every time you pick a data structure\n\
    \      </div>\n<h3 class=\"sh3\">\n       1. Lists — Ordered, Mutable Collections\n\
    \      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       Lists are the most versatile built-in sequence type\
    \ in Python, allowing you to store an ordered collection of items that can be\
    \ dynamically modified.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — lists.py\n        </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"cm\"># Create lists with square brackets</span>\nipl_teams\
    \ = [<span class=\"str\">\"MI\", \"CSK\", \"RCB\", \"KKR\"</span>]\nscores = [<span\
    \ class=\"num\">89</span>, <span class=\"num\">76</span>, <span class=\"num\"\
    >94</span>, <span class=\"num\">61</span>]\n\n<span class=\"cm\"># Indexing: 0\
    \ = first, -1 = last</span>\n<span class=\"fn\">print</span>(ipl_teams[<span class=\"\
    num\">0</span>])      <span class=\"cm\"># \"MI\"</span>\n<span class=\"fn\">print</span>(ipl_teams[-<span\
    \ class=\"num\">1</span>])     <span class=\"cm\"># \"KKR\"</span>\n<span class=\"\
    fn\">print</span>(ipl_teams[<span class=\"num\">1</span>:<span class=\"num\">3</span>])\
    \    <span class=\"cm\"># [\"CSK\", \"RCB\"] — stop index NOT included!</span>\n\
    \n<span class=\"cm\"># Modifying lists</span>\nipl_teams.<span class=\"fn\">append</span>(<span\
    \ class=\"str\">\"SRH\"</span>)        <span class=\"cm\"># add to end</span>\n\
    ipl_teams.<span class=\"fn\">insert</span>(<span class=\"num\">1</span>, <span\
    \ class=\"str\">\"PBKS\"</span>)    <span class=\"cm\"># insert at index 1</span>\n\
    ipl_teams.<span class=\"fn\">remove</span>(<span class=\"str\">\"RCB\"</span>)\
    \        <span class=\"cm\"># remove first occurrence of value</span>\nlast =\
    \ ipl_teams.<span class=\"fn\">pop</span>()          <span class=\"cm\"># remove\
    \ &amp; return last item</span>\nipl_teams.<span class=\"fn\">sort</span>()  \
    \              <span class=\"cm\"># sort alphabetically IN-PLACE (changes original)</span>\n\
    copy_sorted = <span class=\"fn\">sorted</span>(ipl_teams) <span class=\"cm\">#\
    \ sort and return NEW list (original unchanged)</span>\n\n<span class=\"cm\">#\
    \ Useful operations</span>\n<span class=\"fn\">print</span>(<span class=\"fn\"\
    >len</span>(ipl_teams))    <span class=\"cm\"># count of items</span>\n<span class=\"\
    fn\">print</span>(<span class=\"str\">\"MI\"</span> <span class=\"kw\">in</span>\
    \ ipl_teams) <span class=\"cm\"># True — membership check</span>\n<span class=\"\
    fn\">print</span>(scores.<span class=\"fn\">index</span>(<span class=\"num\">94</span>))\
    \ <span class=\"cm\"># 2 — position of value 94</span>\n\n<span class=\"cm\">#\
    \ List comprehension — most important Python pattern for ML</span>\npassed = [s\
    \ <span class=\"kw\">for</span> s <span class=\"kw\">in</span> scores <span class=\"\
    kw\">if</span> s &gt;= <span class=\"num\">75</span>]   <span class=\"cm\"># [89,\
    \ 76, 94] filter</span>\ndoubled = [s * <span class=\"num\">2</span> <span class=\"\
    kw\">for</span> s <span class=\"kw\">in</span> scores]         <span class=\"\
    cm\"># transform every item</span></pre>\n</div>\n<div class=\"ml-connect\">\n\
    \       In ML, your entire training dataset is a list of lists (or NumPy array,\
    \ which IS a list underneath). list comprehensions are used to filter data, normalize\
    \ values, and transform labels — you'll write dozens of these in Pandas and scikit-learn.\n\
    \      </div>\n<h3 class=\"sh3\">\n       2. Tuples — Immutable, Fixed Collections\n\
    \      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       Tuples are ordered collections that cannot be modified\
    \ after creation, making them ideal for representing fixed read-only data structures.\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — tuples.py\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"cm\"\
    ># Tuples use () — cannot be changed after creation</span>\ndelhi_coords = (<span\
    \ class=\"num\">28.6139</span>, <span class=\"num\">77.2090</span>)   <span class=\"\
    cm\"># lat, lng — fixed forever</span>\nrgb_saffron = (<span class=\"num\">255</span>,\
    \ <span class=\"num\">153</span>, <span class=\"num\">51</span>)\n\n<span class=\"\
    cm\"># Tuple unpacking — extremely useful</span>\nlat, lng = delhi_coords\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"Latitude: {lat}\"</span>) \
    \  <span class=\"cm\"># 28.6139</span>\n\n<span class=\"cm\"># Functions often\
    \ return tuples</span>\n<span class=\"kw\">def</span> <span class=\"fn\">min_max</span>(nums):\n\
    \    <span class=\"kw\">return</span> <span class=\"fn\">min</span>(nums), <span\
    \ class=\"fn\">max</span>(nums)  <span class=\"cm\"># implicitly a tuple</span>\n\
    \nlow, high = <span class=\"fn\">min_max</span>([<span class=\"num\">4</span>,\
    \ <span class=\"num\">7</span>, <span class=\"num\">1</span>, <span class=\"num\"\
    >9</span>])\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Range: {low}\
    \ to {high}\"</span>)\n\n<span class=\"cm\"># This crashes — tuples are immutable</span>\n\
    <span class=\"cm\"># delhi_coords[0] = 0   → TypeError: 'tuple' object does not\
    \ support item assignment</span></pre>\n</div>\n<h3 class=\"sh3\">\n       3.\
    \ Sets — Unique Values, Fast Membership\n      </h3>\n<p style=\"margin-top:0.4rem;\
    \ margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n       Sets are\
    \ unordered collections of unique elements, highly optimized for $O(1)$ fast membership\
    \ testing and mathematical operations.\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         python — sets.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"cm\"># Sets store only UNIQUE values — auto-removes duplicates</span>\n\
    students_a = {<span class=\"str\">\"Raj\", \"Priya\", \"Amit\", \"Raj\"</span>}\n\
    <span class=\"fn\">print</span>(students_a)   <span class=\"cm\"># {\"Raj\", \"\
    Priya\", \"Amit\"} — no duplicate Raj</span>\n\n<span class=\"cm\"># Remove duplicates\
    \ from a list (classic trick)</span>\nmarks = [<span class=\"num\">85</span>,\
    \ <span class=\"num\">92</span>, <span class=\"num\">85</span>, <span class=\"\
    num\">78</span>, <span class=\"num\">92</span>]\nunique = <span class=\"fn\">list</span>(<span\
    \ class=\"fn\">set</span>(marks))   <span class=\"cm\"># [85, 92, 78]</span>\n\
    \n<span class=\"cm\"># Set operations — very useful in data analysis</span>\n\
    python_devs = {<span class=\"str\">\"Raj\", \"Priya\", \"Amit\"</span>}\nml_devs\
    \ = {<span class=\"str\">\"Priya\", \"Sara\", \"Amit\"</span>}\n\n<span class=\"\
    fn\">print</span>(python_devs | ml_devs)   <span class=\"cm\"># union — all unique\
    \ names</span>\n<span class=\"fn\">print</span>(python_devs &amp; ml_devs)   <span\
    \ class=\"cm\"># intersection — know BOTH Python + ML</span>\n<span class=\"fn\"\
    >print</span>(python_devs - ml_devs)   <span class=\"cm\"># difference — Python\
    \ only, not ML</span>\n\n<span class=\"cm\"># Membership check is O(1) — instant\
    \ even for 1 million items</span>\n<span class=\"fn\">print</span>(<span class=\"\
    str\">\"Priya\"</span> <span class=\"kw\">in</span> python_devs)  <span class=\"\
    cm\"># True</span></pre>\n</div>\n<h3 class=\"sh3\">\n       4. Dictionaries —\
    \ The Most Important Structure in ML\n      </h3>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">\n         python — dicts.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"cm\"># Dicts store key:value pairs — like a real dictionary</span>\n\
    student = {\n    <span class=\"str\">\"name\": \"Arjun Mehta\"</span>,\n    <span\
    \ class=\"str\">\"age\"</span>: <span class=\"num\">21</span>,\n    <span class=\"\
    str\">\"gpa\"</span>: <span class=\"num\">8.9</span>,\n    <span class=\"str\"\
    >\"subjects\": [\"Python\", \"ML\", \"Stats\"</span>]  <span class=\"cm\"># list\
    \ as a value!</span>\n}\n\n<span class=\"cm\"># Access values by key</span>\n\
    <span class=\"fn\">print</span>(student[<span class=\"str\">\"name\"</span>])\
    \              <span class=\"cm\"># \"Arjun Mehta\"</span>\n<span class=\"fn\"\
    >print</span>(student.<span class=\"fn\">get</span>(<span class=\"str\">\"city\"\
    , \"N/A\"</span>))   <span class=\"cm\"># \"N/A\" — safe, no crash if key missing</span>\n\
    \n<span class=\"cm\"># Add / update / delete</span>\nstudent[<span class=\"str\"\
    >\"city\"] = \"Bangalore\"</span>         <span class=\"cm\"># add new key</span>\n\
    student[<span class=\"str\">\"gpa\"</span>] = <span class=\"num\">9.1</span> \
    \                <span class=\"cm\"># update existing key</span>\ndel student[<span\
    \ class=\"str\">\"age\"</span>]                   <span class=\"cm\"># remove\
    \ key</span>\n\n<span class=\"cm\"># Iterate over dict</span>\n<span class=\"\
    kw\">for</span> key, value <span class=\"kw\">in</span> student.<span class=\"\
    fn\">items</span>():\n    <span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"{key}: {value}\"</span>)\n\n<span class=\"cm\"># Dict comprehension — builds\
    \ a dict from a sequence</span>\ngrades = {<span class=\"str\">\"Raj\": 88, \"\
    Priya\": 92, \"Amit\"</span>: <span class=\"num\">75</span>}\npassed = {name:\
    \ g <span class=\"kw\">for</span> name, g <span class=\"kw\">in</span> grades.<span\
    \ class=\"fn\">items</span>() <span class=\"kw\">if</span> g &gt;= <span class=\"\
    num\">80</span>}</pre>\n</div>\n<div class=\"ml-connect\">\n       In scikit-learn,\
    \ you call models like this:\n       \n        model = RandomForestClassifier(n_estimators=100,\
    \ max_depth=5)\n       \n       .\n       <br/>\n<br/>\n       Those keyword arguments\
    \ are a dict.\n       <br/>\n<br/>\n       Model hyperparameters, dataset metadata,\
    \ training config — ALL dicts.\n       <br/>\n<br/>\n       Mastering dicts =\
    \ mastering ML APIs.\n      </div>\n<h3 class=\"sh3\">\n       5. The\n      \
    \ \n        collections\n       \n       Module (Advanced Data Structures)\n \
    \     </h3>\n<div class=\"ml-connect\">\n       In ML (especially NLP and graphs),\
    \ built-in dictionaries and lists are sometimes too basic.\n       <br/>\n<br/>\n\
    \       Python's\n       \n        collections\n       \n       module provides\
    \ specialized, high-performance data structures.\n      </div>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — collections_demo.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">from</span> collections\
    \ <span class=\"kw\">import</span> Counter, defaultdict, deque\n\n<span class=\"\
    cm\"># 1. Counter: Automatically counts frequencies (great for NLP token counts)</span>\n\
    words = [<span class=\"str\">\"apple\", \"banana\", \"apple\", \"orange\", \"\
    banana\", \"apple\"</span>]\nword_counts = <span class=\"fn\">Counter</span>(words)\n\
    <span class=\"fn\">print</span>(word_counts)  <span class=\"cm\"># Counter({'apple':\
    \ 3, 'banana': 2, 'orange': 1})</span>\n\n<span class=\"cm\"># 2. defaultdict:\
    \ A dict that doesn't throw KeyError if key is missing</span>\ngraph = <span class=\"\
    fn\">defaultdict</span>(list)\ngraph[<span class=\"str\">'node1'</span>].<span\
    \ class=\"fn\">append</span>(<span class=\"str\">'node2'</span>)  <span class=\"\
    cm\"># 'node1' automatically created as empty list first!</span>\n\n<span class=\"\
    cm\"># 3. deque: Double-ended queue. Super fast O(1) appends/pops from BOTH ends</span>\n\
    <span class=\"cm\"># Standard lists are O(n) for popping from the front.</span>\n\
    queue = <span class=\"fn\">deque</span>([<span class=\"num\">1</span>, <span class=\"\
    num\">2</span>, <span class=\"num\">3</span>])\nqueue.<span class=\"fn\">appendleft</span>(<span\
    \ class=\"num\">0</span>)  <span class=\"cm\"># Fast insertion at the beginning</span></pre>\n\
    </div>\n<!-- PREDICT -->\n<h2 class=\"sh2\">\n       \U0001F52E Predict the Output\n\
    \      </h2>\n<!-- QUIZ -->\n<h2 class=\"sh2\">\n       ✅ Day 2 Quiz\n      </h2>\n\
    <!-- FLASHCARDS -->\n<h2 class=\"sh2\">\n       \U0001F0CF Day 2 Flashcards\n\
    \      </h2>\n<p class=\"flashcard-hint\">\n       CLICK TO FLIP ↓\n      </p>\n\
    <!-- /day-2-theory -->\n<!-- /day-2-tasks-section -->\n<!-- /day-2-resources-section\
    \ -->"
