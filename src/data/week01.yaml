    done_when: When script runs, prints formatted bio with correct born-in year, shows correct types for name and age.
    git_cmd: |-
      git add bio_generator.py
      git commit -m "feat(day): Day 1: bio generator — input, int conversion, f-strings"
    sol_id: sol-w1d1t1
    solution_title: ✅ COMPLETE SOLUTION — bio_generator.py
    solution_code: |-
      # bio_generator.py — Day 1 Task 1

      name = input("Enter your name: ")
      age = int(input("Enter your age: "))      # convert to int immediately!
      city = input("Enter your city: ")
      subject = input("Favourite subject: ")

      birth_year = 2026 - age

      print()
      print("═" * 31)
      print(f"   Hello, I am {name}!")
      print(f"   Age: {age} | Born in: {birth_year}")
      print(f"   From: {city} | Loves: {subject}")
      print("═" * 31)
      print()
      print(f"Type of name : {type(name)}")
      print(f"Type of age  : {type(age)}")
      assert birth_year is not None, "birth_year should not be None"
    solution_lang: python
  - title: IPL Stats Calculator — Variables + Math + Formatting
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: |-
      <p><strong>
                 Using only variables, arithmetic, and f-strings (no lists/functions yet), compute cricket stats and print a formatted table for 3 IPL players.
                </strong></p>
      <div class="cb">
      <div class="cb-head">
      <span class="cb-lang">
                   python — starter code
                  </span>
      <div class="cb-btns">
      <button class="copy-btn" onclick="copyCode(this)">
                    copy
                   </button>
      <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
                    Run
                   </button>
      </div>
      </div>
