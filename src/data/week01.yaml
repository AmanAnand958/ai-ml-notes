      <pre><span class="cm"># Word Frequency Counter - NLP Foundation</span>
      text = <span class="str">"""</span>Python <span class="kw">is</span> amazing. Python <span class="kw">is</span> powerful <span class="kw">and</span> Python <span class="kw">is</span> easy.
      Machine learning <span class="kw">with</span> Python <span class="kw">is</span> fun <span class="kw">and</span> exciting.<span class="str">"""</span>
      <span class="kw">for</span> p <span class="kw">in</span> <span class="str">".,!?;:'</span>\<span class="str">""</span>:
          text = text.<span class="fn">replace</span>(p, <span class="str">""</span>)
      words = text.<span class="fn">lower</span>().<span class="fn">split</span>()
      freq = {}
      <span class="kw">for</span> word <span class="kw">in</span> <span class="fn">set</span>(words):
          freq[word] = words.<span class="fn">count</span>(word)
      sorted_words = <span class="fn">sorted</span>(freq.<span class="fn">items</span>(), key=<span class="kw">lambda</span> x: x[<span class="num">1</span>], reverse=<span class="kw">True</span>)
      <span class="fn">print</span>(<span class="str">f"{'</span>Word<span class="str">':&lt;15} {'</span>Count<span class="str">':&lt;6}"</span>)
      <span class="fn">print</span>(<span class="str">"-"</span> * <span class="num">21</span>)
      <span class="kw">for</span> word, count <span class="kw">in</span> sorted_words:
          <span class="fn">print</span>(<span class="str">f"{word:&lt;15} {count:&lt;6}"</span>)
      <span class="fn">print</span>(<span class="str">f"\nTotal unique words: {len(freq)}"</span>)
      <span class="fn">print</span>(<span class="str">f"Most common: '</span>{sorted_words[<span class="num">0</span>][<span class="num">0</span>]}<span class="str">' ({sorted_words[0][1]} times)"</span>)</pre>
      </div>
      </div>
    done_when: When word frequencies computed, top 10 printed with visual bars, unique vs total word counts shown.
    git_cmd: 'git add word_frequency_counter_nlp_foundation.py &amp;&amp; git commit -m "feat(day): day2: word-frequency-counter-nlp-foundation"'
    sol_id: sol-w1d2t3
    solution_title: ✅ SOLUTION — word_counter.py
    solution_code: |-
      # word_counter.py — Word frequency using dict (core NLP concept)

      text = """\nIndia is a land of diversity. India has a rich culture and heritage.\nThe people of India are hardworking and the youth of India is ambitious.\nMachine learning and AI are transforming India's tech industry rapidly.\n"""

      # Clean and split
      words = text.lower().replace("\n", " ").split()

      # Remove punctuation from each word
      clean_words = [w.strip(".,!?;:\'\"()") for w in words if w.strip(".,!?;:\'\"()")]

      # Count frequency using dict
      freq = {}
      for word in clean_words:
          freq[word] = freq.get(word, 0) + 1  # get returns 0 if missing, then +1

      # Sort by frequency (most common first)
      sorted_freq = sorted(freq.items(), key=lambda x: x[1], reverse=True)

      print("Top 10 most frequent words:")
      print("─" * 30)
      for word, count in sorted_freq[:10]:
          bar = "█" * count
          print(f"{word:15} {count:2d} {bar}")

      print(f"\nTotal unique words: {len(freq)}")
      print(f"Total words: {len(clean_words)}")
      assert bar is not None, "bar should not be None"
    solution_lang: python
