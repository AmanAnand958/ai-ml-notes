      ># Student Grade Tracker - All 4 Structures</span>\nstudents = {\n    <span\
      \ class=\"str\">\"Raj\"</span>:   (<span class=\"num\">88</span>, <span class=\"\
      num\">92</span>, <span class=\"num\">79</span>),\n    <span class=\"str\">\"\
      Priya\"</span>: (<span class=\"num\">95</span>, <span class=\"num\">87</span>,\
      \ <span class=\"num\">91</span>),\n    <span class=\"str\">\"Amit\"</span>:\
      \  (<span class=\"num\">72</span>, <span class=\"num\">68</span>, <span class=\"\
      num\">74</span>),\n    <span class=\"str\">\"Sara\"</span>:  (<span class=\"\
