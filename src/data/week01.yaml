      \ margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;\">\n<li>\n            For multiples of 3, print\n\
      \            \n             \"Fizz\"\n            \n            (e.g. feature trigger A).\n           </li>\n<li>\n\
      \            For multiples of 5, print\n            \n             \"Buzz\"\n            \n            (e.g. feature\
      \ trigger B).\n           </li>\n<li>\n            For multiples of both 3 and 5, print\n            \n            \
      \ \"FizzBuzz\"\n            \n            (both triggered).\n           </li>\n<li>\n            Otherwise, print the\
      \ number itself.\n           </li>\n</ul>\n<div class=\"hinglish\">\n           Hint: Sabse pehle\n           \n   \
      \         i % 15 == 0\n           \n           (ya\n           \n            i % 3 == 0 and i % 5 == 0\n           \n\
      \           ) check karna zaroori hai, varna pehle if mein hi 3 ya 5 match ho jayega.\n          </div>"
    done_when: When prints 1 to 50 replacing multiples of 3/5 with Fizz/Buzz/FizzBuzz correctly.
    git_cmd: 'git add fizzbuzz.py &amp;&amp; git commit -m "feat(day): Day 3: FizzBuzz control flow implementation"'
    sol_id: sol-w1d3t1
    solution_title: ✅ COMPLETE SOLUTION — fizzbuzz.py
    solution_code: |-
      for i in range(1, 51):
          if i % 3 == 0 and i % 5 == 0:
              print("FizzBuzz")
          elif i % 3 == 0:
              print("Fizz")
          elif i % 5 == 0:
              print("Buzz")
          else:
              print(i)
    solution_lang: python
  - title: Dataset Outlier Filter & Normalizer — List Comprehension
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 35 min
    prompt_html: |-
      <strong><p style="margin-bottom: 0.6rem;">
                 Give</strong> <p style="margin-bottom: 0.6rem;">
                 Given a list of sensor reading floats, apply conditional transformation using list comprehensions:
                </p>
      <ul style="padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;">
      <li>
                  Filter out noise readings &lt; 0.0 or &gt; 100.0.
                 </li>
      <li>
                  Multiply valid readings by 1.15 (calibration factor) and round to 2 decimal places.
                 </li>
      <li>
                  Return the cleaned dataset and its average score.
                 </li>
      </ul>
    done_when: When outliers negative and &gt; 100 removed, scaled by 1.15 and average displayed accurately.
    git_cmd: 'git add sensor_cleaner.py &amp;&amp; git commit -m "feat(day): Day 3: Sensor dataset list comprehension cleaner"'
    sol_id: sol-w1d3t2
    solution_title: ✅ COMPLETE SOLUTION — sensor_cleaner.py
    solution_code: |-
      raw_readings = [12.5, -4.2, 45.8, 102.1, 88.4, 0.0, 72.1, -1.0, 99.5]

      # List comprehension with filtering and transformation
      cleaned = [round(x * 1.15, 2) for x in raw_readings if 0.0 <= x <= 100.0]
      avg_val = round(sum(cleaned) / len(cleaned), 2) if cleaned else 0

      print(f"Raw Count   : {len(raw_readings)}")
      print(f"Cleaned Data: {cleaned}")
      print(f"Average     : {avg_val}")
      assert avg_val is not None, "avg_val should not be None"
    solution_lang: python
