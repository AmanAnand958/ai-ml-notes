  gotcha:
    title: '⚠️ Gotcha: Indentation & Variable References'
    description: Python does not copy lists on assignment `b = a`; it references the
      same memory address. Use `b = a.copy()` to avoid accidental mutations.
  takeaways:
    hinglish_line: Production mein File I/O + Exception Handling ko use karte waqt
