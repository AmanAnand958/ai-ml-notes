      Jhoothi","Gadar 2","OMG 2","Sam Bahadur"]


      print("Top 3:", movies[:3])           # first 3

      print("Last 2:", movies[-2:])         # last 2

      print("Middle:", movies[3:7])          # index 3 to 6

      print("Every 2nd:", movies[::2])       # every other movie

