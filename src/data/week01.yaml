    git_cmd: 'git add word_frequency_counter_nlp_foundation.py &amp;&amp; git commit
      -m "day2: word-frequency-counter-nlp-foundation"'
    sol_id: sol-w1d2t3
    solution_title: ✅ SOLUTION — word_counter.py
    solution_code: "# word_counter.py — Word frequency using dict (core NLP concept)\n\
      \ntext = \"\"\"\\nIndia is a land of diversity. India has a rich culture and\
      \ heritage.\\nThe people of India are hardworking and the youth of India is\
      \ ambitious.\\nMachine learning and AI are transforming India's tech industry\
      \ rapidly.\\n\"\"\"\n\n# Clean and split\nwords = text.lower().replace(\"\\\
      n\", \" \").split()\n\n# Remove punctuation from each word\nclean_words = [w.strip(\"\
      .,!?;:\\'\\\"()\") for w in words if w.strip(\".,!?;:\\'\\\"()\")]\n\n# Count\
      \ frequency using dict\nfreq = {}\nfor word in clean_words:\n    freq[word]\
      \ = freq.get(word, 0) + 1  # get returns 0 if missing, then +1\n\n# Sort by\
      \ frequency (most common first)\nsorted_freq = sorted(freq.items(), key=lambda\
      \ x: x[1], reverse=True)\n\nprint(\"Top 10 most frequent words:\")\nprint(\"\
      ─\" * 30)\nfor word, count in sorted_freq[:10]:\n    bar = \"█\" * count\n \
      \   print(f\"{word:15} {count:2d} {bar}\")\n\nprint(f\"\\nTotal unique words:\
      \ {len(freq)}\")\nprint(f\"Total words: {len(clean_words)}\")"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 3
    question: "What is the output of\n        \n         print([1,2,3][1:3])\n   \
      \     \n        ?"
    qid: q2_1
    options:
    - letter: A
      text: '[1, 2]'
      is_correct: false
    - letter: B
      text: '[2, 3]'
      is_correct: true
    - letter: C
      text: '[1, 2, 3]'
      is_correct: false
    - letter: D
      text: '[2, 3, 4]'
      is_correct: false
    correct_fb: ✅ Correct! [start:stop] slicing — index 1 to 3, but stop (3) is NEVER
      included. So you get indices 1 and 2 → values 2 and 3.
    wrong_fb: ❌ Slicing [1:3] means start=1, stop=3. Stop is NEVER included. You get
      indices 1,2 → values 2,3. Answer is B.
  - num_str: QUESTION 2 OF 3
    question: How do you safely get a value from a dict WITHOUT crashing if the key
      doesn't exist?
    qid: q2_2
    options:
    - letter: A
      text: d["key"]
      is_correct: false
    - letter: B
      text: d.get("key", default)
      is_correct: true
    - letter: C
      text: d.find("key")
      is_correct: false
    - letter: D
      text: d.fetch("key")
      is_correct: false
    correct_fb: ✅ Correct! dict.get(key, default) returns the value if key exists,
      or the default value if it doesn't — no KeyError. d["key"] crashes if key is
      missing. find() and fetch() don't exist on dicts.
    wrong_fb: ❌ d["key"] raises KeyError if the key doesn't exist. Use d.get("key",
      default) — returns default instead of crashing. Answer is B.
  - num_str: QUESTION 3 OF 3
    question: "What does\n        \n         {}\n        \n        create in Python?"
    qid: q2_3
    options:
    - letter: A
      text: An empty set
      is_correct: false
    - letter: B
      text: An empty dict
      is_correct: true
    - letter: C
      text: An empty list
      is_correct: false
    - letter: D
      text: A syntax error
      is_correct: false
    correct_fb: ✅ Correct! {} creates an empty DICT, not an empty set. To create an
      empty set, you must use set() — not {}, which makes an empty dict. This is a
      famous Python gotcha that trips up beginners constantly.
    wrong_fb: ❌ Tricky! {} creates an empty DICT. To create an empty set, you must
      use set() — not {}, which makes an empty dict (because {} is ambiguous and Python
      default-assigned it to dict). Answer is B.
  flashcards:
  - front: List vs Tuple — key difference?
    back: "List = mutable (can change)\n          <br/>\n          Tuple = immutable\
      \ (fixed)\n          <br/>\n          Use tuple for fixed data like coordinates"
  - front: How to get a dict value safely?
    back: "d.get(\"key\", default)\n          <br/>\n          Returns default if\
      \ key missing\n          <br/>\n          d[\"key\"] crashes with KeyError"
  - front: How to remove duplicates from a list?
    back: "list(set(my_list))\n          <br/>\n          Converts to set (unique),\
      \ then back to list"
  - front: List comprehension syntax?
    back: "[expr for item in iterable if condition]\n          <br/>\n          e.g.\
      \ [x*2 for x in nums if x > 0]"
  - front: How to create an empty set?
    back: "set() — not {}\n          <br/>\n          {} creates an empty dict!\n\
      \          <br/>\n          This is a classic Python gotcha"
  gotcha:
    title: '⚠️ Gotcha: Shallow vs Deep Copy'
    description: "Assignment (\n       \n        b = a\n       \n       ) creates\
      \ a\n       <em>\n        reference\n       </em>\n       , not a copy.\n  \
      \     \n        b = a.copy()\n       \n       creates a shallow copy (nested\
      \ objects still share references). Use\n       \n        import copy; b = copy.deepcopy(a)\n\
      \       \n       for fully independent nested copies. This is a top Python interview\
      \ pitfall."
  takeaways:
    hinglish_line: Production mein Lists, Tuples, Sets & Dictionaries ko use karte
      waqt edge cases aur mathematical constraints ko pehle validate karo, taaki downstream
      deployment bilkul rock-solid rahe!
    bullets:
    - "<strong>\n           Use dicts when you need key→value lookup.\n          </strong>\n\
      \          O(1) speed — instant regardless of size. This is how ML model configs\
      \ work."
    - "<strong>\n           List slice [start:stop:step]\n          </strong>\n  \
      \        — stop index is NEVER included. Negative index counts from end. [::−1]\
      \ reverses."
    - "<strong>\n           {} is empty dict, not empty set.\n          </strong>\n\
      \          Use set() for empty set. Classic Python gotcha."
    - "<strong>\n           d.get(key, default)\n          </strong>\n          is\
      \ always safer than d[key]. In ML code, configs may have missing keys — .get()\
      \ prevents crashes."
    - "<strong>\n           Dicts are the backbone of ML APIs.\n          </strong>\n\
      \          Every sklearn model accepts hyperparameters as keyword args (which\
      \ are dicts under the hood)."
