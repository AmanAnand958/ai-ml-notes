    sol_id: sol-w1d1t3
    solution_title: ✅ COMPLETE SOLUTION — emi_calculator.py
    solution_code: '# emi_calculator.py — Smart EMI Calculator

      # Skills: input(), float(), int(), arithmetic operators, ** (power), round(),
      f-strings


      print("═" * 40)

      print("   🏦 SMART EMI CALCULATOR")

      print("═" * 40)


      principal = float(input("Loan Amount (₹): "))

      annual_rate = float(input("Annual Interest Rate (%): "))

      tenure_months = int(input("Loan Tenure (months): "))


      # Convert annual rate to monthly rate

      monthly_rate = annual_rate / 12 / 100


      # EMI formula: P * r * (1+r)^n / ((1+r)^n - 1)

      numerator = principal * monthly_rate * (1 + monthly_rate) ** tenure_months

      denominator = (1 + monthly_rate) ** tenure_months - 1

      emi = numerator / denominator


      total_payment = emi * tenure_months

      total_interest = total_payment - principal


      print()

      print("─" * 40)

      print(f"  Monthly EMI      : ₹{emi:,.2f}")

      print(f"  Total Payment    : ₹{total_payment:,.2f}")

      print(f"  Principal        : ₹{principal:,.2f}")

      print(f"  Total Interest   : ₹{total_interest:,.2f}")

      print(f"  Interest Rate    : {annual_rate}% per year")

      print("─" * 40)


      # Resume description:

      # "Built a financial EMI calculator in Python computing compound interest

      #  using the standard amortization formula with formatted tabular output."'
    solution_lang: python
