  gotcha:
    title: '⚠️ Gotcha: Mutable Default Arguments'
    description: "Never use a mutable object (list, dict, set) as a default function argument. Python evaluates default arguments\n\
      \       <em>\n        once\n       </em>\n       at function definition, not at each call. So\n       \n        def\
      \ append_to(item, lst=[])\n       \n       will share the same list across all calls. Always use\n       \n        None\n\
      \       \n       as the default and create the list inside the function body."
