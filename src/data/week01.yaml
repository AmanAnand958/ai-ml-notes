  - num_str: QUESTION 2 OF 2
    question: "What does\n        \n<strong>\n          kwargs\n         </strong>\n\
      \n        collect inside a function?"
    qid: q4_2
    options:
    - letter: A
      text: All positional arguments as a tuple
      is_correct: false
    - letter: B
      text: All keyword arguments as a dict
      is_correct: true
    - letter: C
      text: Only the first two arguments
      is_correct: false
    - letter: D
      text: Nothing — it's just a naming convention
      is_correct: false
    correct_fb: ✅ kwargs collects all keyword arguments (name=value pairs) into a
      dict. *args collects positional arguments into a tuple. sklearn uses this pattern
      for all model hyperparameters.
    wrong_fb: ❌ **kwargs = keyword arguments → dict. *args = positional arguments
      → tuple. Answer is B.
