  tasks:
  - title: Neuron Simulator Class — OOP Encapsulation
    badge: 🟢 EASY
    badge_class: tb-easy
    time: 30 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Build an artificial\n\
      \           \n            Neuron\n           \n           class in Python:\n\
      \          </p>\n<ul style=\"padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom:\
      \ 1rem; list-style-type: disc;\">\n<li>\n\n             __init__(self, weights,\
      \ bias)\n            \n            : Initializes weights list and scalar bias.\n\
      \           </li>\n<li>\n\n             forward(self, inputs)\n            \n\
      \            : Computes linear dot product $\\sum (w_i \\cdot x_i) + b$ followed\
      \ by a ReLU activation $\\max(0, z)$.\n           </li>\n<li>\n\n          \
      \   __str__(self)\n            \n            : Formatted representation of weights\
      \ and bias.\n           </li>\n</ul>"
    done_when: Neuron instance computes forward pass with ReLU correctly.
    git_cmd: 'git add neuron_oop.py &amp;&amp; git commit -m "Day 6: Neuron class
      with OOP encapsulation"'
    sol_id: sol-w1d6t1
    solution_title: ✅ COMPLETE SOLUTION — neuron_oop.py
    solution_code: "class Neuron:\n    def __init__(self, weights, bias):\n      \
      \  self.weights = weights\n        self.bias = bias\n        \n    def forward(self,\
      \ inputs):\n        if len(inputs) != len(self.weights):\n            raise\
      \ ValueError(\"Input dimension must match weights dimension\")\n        # Dot\
      \ product + bias\n        z = sum(w * x for w, x in zip(self.weights, inputs))\
      \ + self.bias\n        # ReLU activation\n        return max(0.0, z)\n     \
      \   \n    def __str__(self):\n        return f\"Neuron(weights={self.weights},\
      \ bias={self.bias})\"\n\n# Test the neuron\nn1 = Neuron(weights=[0.5, -0.2,\
      \ 0.8], bias=0.1)\noutput = n1.forward([1.0, 2.0, 3.0])\nprint(n1)\nprint(f\"\
      Forward Output (ReLU): {output:.3f}\")"
    solution_lang: python
  - title: Dataset Preprocessor Hierarchy — Inheritance & Polymorphism
    badge: 🔴 CHALLENGE
    badge_class: tb-hard
    time: 50 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Construct an object-oriented\
      \ preprocessing pipeline hierarchy mirroring Scikit-Learn:\n          </p>\n\
      <ul style=\"padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom: 1rem; list-style-type:\
      \ disc;\">\n<li>\n            Base class\n            \n             BaseTransformer\n\
      \            \n            with abstract\n            \n             fit(data)\n\
      \            \n            and\n            \n             transform(data)\n\
      \            \n            methods.\n           </li>\n<li>\n            Subclass\n\
      \            \n             StandardScalerTransformer\n            \n      \
      \      : calculates mean and std in\n            \n             fit()\n    \
      \        \n            , and returns $z = (x - \\mu) / \\sigma$ in\n       \
      \     \n             transform()\n            \n            .\n           </li>\n\
      <li>\n            Subclass\n            \n             MinMaxScalerTransformer\n\
      \            \n            : calculates min and max in\n            \n     \
      \        fit()\n            \n            , and returns $(x - \\text{min}) /\
      \ (\\text{max} - \\text{min})$ in\n            \n             transform()\n\
      \            \n            .\n           </li>\n</ul>"
    done_when: Inheritance hierarchy implements polymorphism matching Scikit-Learn
      transformer API.
    git_cmd: 'git add transformer_hierarchy.py &amp;&amp; git commit -m "Day 6: Object-oriented
      Scikit-Learn style transformers"'
    sol_id: sol-w1d6t2
    solution_title: ✅ COMPLETE SOLUTION — transformer_hierarchy.py
    solution_code: "# Step 1: Algorithmic Implementation & Core Transformations\n\
      import math\n\nclass BaseTransformer:\n    def fit(self, data):\n        raise\
      \ NotImplementedError(\"Subclasses must implement fit()\")\n    def transform(self,\
      \ data):\n        raise NotImplementedError(\"Subclasses must implement transform()\"\
      )\n    def fit_transform(self, data):\n        self.fit(data)\n        return\
      \ self.transform(data)\n\nclass StandardScalerTransformer(BaseTransformer):\n\
      \    def fit(self, data):\n        self.mean = sum(data) / len(data)\n     \
      \   variance = sum((x - self.mean) ** 2 for x in data) / len(data)\n       \
      \ self.std = math.sqrt(variance) if variance > 0 else 1.0\n        return self\n\
      \        \n    def transform(self, data):\n        return [round((x - self.mean)\
      \ / self.std, 3) for x in data]\n\nclass MinMaxScalerTransformer(BaseTransformer):\n\
      \    def fit(self, data):\n        self.min_val = min(data)\n        self.max_val\
      \ = max(data)\n        return self\n        \n    def transform(self, data):\n\
      \        denom = (self.max_val - self.min_val) if self.max_val != self.min_val\
      \ else 1.0\n        return [round((x - self.min_val) / denom, 3) for x in data]\n\
      \ndata = [10.0, 20.0, 30.0, 40.0, 50.0]\nstd_scaler = StandardScalerTransformer()\n\
      print(\"Standardized:\", std_scaler.fit_transform(data))\n\nminmax_scaler =\
      \ MinMaxScalerTransformer()\nprint(\"MinMax Scaled:\", minmax_scaler.fit_transform(data))"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 2
    question: "What is\n        \n         self\n        \n        in a class method?"
    qid: q6_1
    options:
    - letter: A
      text: A keyword that refers to the class itself
      is_correct: false
    - letter: B
      text: A reference to the specific instance calling the method
      is_correct: true
    - letter: C
      text: A required string argument
      is_correct: false
    - letter: D
      text: A global variable
      is_correct: false
    correct_fb: ✅ self refers to the specific instance. When raj.upgrade_gpa(0.3)
      is called, self IS raj — so self.gpa updates RAJ's gpa, not Priya's. Each object
      has its own self.
    wrong_fb: ❌ self is the instance — the specific object. raj.method() passes raj
      as self automatically. So self.name inside the method = raj.name. Answer B.
  - num_str: QUESTION 2 OF 2
    question: "What does\n        \n         super().__init__()\n        \n      \
      \  do?"
    qid: q6_2
    options:
    - letter: A
      text: Creates a superuser
      is_correct: false
    - letter: B
      text: Calls the parent class constructor to initialize inherited attributes
      is_correct: true
    - letter: C
      text: Deletes the parent class
      is_correct: false
    - letter: D
      text: Makes the class abstract
      is_correct: false
    correct_fb: ✅ super() gives access to the parent class. super().__init__() calls
      the parent's constructor so you don't have to rewrite all that initialization
      code. This is how MLStudent gets name, age, gpa from Student.
    wrong_fb: ❌ super().__init__() calls the parent class constructor. Without it,
      the child class won't have the parent's attributes. Answer B.
