    \ 2, 'orange': 1})</span>\n\n<span class=\"cm\"># 2. defaultdict: A dict that doesn't throw KeyError if key is missing</span>\n\
    graph = <span class=\"fn\">defaultdict</span>(list)\ngraph[<span class=\"str\">'node1'</span>].<span class=\"fn\">append</span>(<span\
