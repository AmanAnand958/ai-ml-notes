  theory_html: "<h3 class=\"sh3\">\n       1. if / elif / else\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       Conditional statements control the execution flow of a program by running\
    \ specific code blocks only when their corresponding Boolean expressions evaluate to true.\n      </p>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\n        </span>\n<div class=\"cb-btns\">\n\
    <button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code>score\
    \ = <span class=\"num\">78</span>\n<span class=\"kw\">if</span> score >= <span class=\"num\">90</span>:   grade = <span\
    \ class=\"str\">\"A\"</span>\n<span class=\"kw\">elif</span> score >= <span class=\"num\">75</span>: grade = <span class=\"\
    str\">\"B\"</span>\n<span class=\"kw\">elif</span> score >= <span class=\"num\">60</span>: grade = <span class=\"str\"\
    >\"C\"</span>\n<span class=\"kw\">else</span>:             grade = <span class=\"str\">\"F\"</span>\n\n<span class=\"\
    cm\"># Ternary — one-liner</span>\nstatus = <span class=\"str\">\"Pass\" if score >= 60 else \"Fail\"</span>\n\n<span\
    \ class=\"cm\"># Logical operators</span>\nage, has_id = <span class=\"num\">20</span>, <span class=\"kw\">True</span>\n\
    <span class=\"kw\">if</span> age >= <span class=\"num\">18</span> <span class=\"kw\">and</span> has_id:\n    <span class=\"\
    fn\">print</span>(<span class=\"str\">\"Entry allowed\"</span>)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       2. for\
    \ Loops\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n     \
    \  for loops iterate over a sequence (such as a list, tuple, or string), executing the block of code repeatedly for each\
    \ item in the sequence.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n \
    \        </button>\n</div>\n</div>\n<pre><code>cities = [<span class=\"str\">\"Delhi\", \"Mumbai\", \"Bangalore\"</span>]\n\
    \n<span class=\"kw\">for</span> city <span class=\"kw\">in</span> cities:\n    <span class=\"fn\">print</span>(city)\n\
    \n<span class=\"kw\">for</span> i <span class=\"kw\">in</span> <span class=\"fn\">range</span>(<span class=\"num\">1</span>,\
    \ <span class=\"num\">6</span>):      <span class=\"cm\"># 1,2,3,4,5 — stop EXCLUDED</span>\n    <span class=\"fn\">print</span>(i)\n\
    \n<span class=\"cm\"># enumerate — get index AND value</span>\n<span class=\"kw\">for</span> i, city <span class=\"kw\"\
    >in</span> <span class=\"fn\">enumerate</span>(cities, <span class=\"num\">1</span>):\n    <span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"{i}. {city}\"</span>)\n\n<span class=\"cm\"># zip — loop two lists together</span>\ntemps = [<span\
    \ class=\"num\">35</span>, <span class=\"num\">38</span>, <span class=\"num\">42</span>]\n<span class=\"kw\">for</span>\
    \ city, temp <span class=\"kw\">in</span> <span class=\"fn\">zip</span>(cities, temps):\n    <span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"{city}: {temp}°C\"</span>)\n\n<span class=\"cm\"># break and continue</span>\n<span class=\"kw\">for</span>\
    \ n <span class=\"kw\">in</span> <span class=\"fn\">range</span>(<span class=\"num\">10</span>):\n    <span class=\"kw\"\
    >if</span> n == <span class=\"num\">3</span>: <span class=\"kw\">continue</span>   <span class=\"cm\"># skip 3</span>\n\
    \    <span class=\"kw\">if</span> n == <span class=\"num\">7</span>: <span class=\"kw\">break</span>      <span class=\"\
    cm\"># stop at 7</span>\n    <span class=\"fn\">print</span>(n)</code></pre>\n</div>\n<h3 class=\"sh3\">\n       3. List\
    \ Comprehensions — THE ML Pattern\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       List comprehensions offer a concise syntax to create new lists from existing iterables, serving as a clean alternative\
    \ to standard loop structures.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n  \
    \       python\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n   \
    \       copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n \
    \         Run\n         </button>\n</div>\n</div>\n<pre><code>scores = [<span class=\"num\">45</span>, <span class=\"\
    num\">78</span>, <span class=\"num\">92</span>, <span class=\"num\">55</span>, <span class=\"num\">88</span>, <span class=\"\
    num\">34</span>, <span class=\"num\">91</span>]\n\n<span class=\"cm\"># [expression for item in iterable if condition]</span>\n\
    passed = [s <span class=\"kw\">for</span> s <span class=\"kw\">in</span> scores <span class=\"kw\">if</span> s >= <span\
    \ class=\"num\">60</span>]         <span class=\"cm\"># filter</span>\ndoubled = [s * <span class=\"num\">2</span> <span\
    \ class=\"kw\">for</span> s <span class=\"kw\">in</span> scores]              <span class=\"cm\"># transform</span>\n\
    grades = [<span class=\"str\">\"A\" if s>=90 else \"B\" if s>=75 else \"C\"</span> <span class=\"kw\">for</span> s <span\
    \ class=\"kw\">in</span> scores]\n\n<span class=\"cm\"># Normalize to 0-1 (you do this EVERY time before training ML models!)</span>\n\
    max_s = <span class=\"fn\">max</span>(scores)\nnormalized = [<span class=\"fn\">round</span>(s / max_s, <span class=\"\
    num\">3</span>) <span class=\"kw\">for</span> s <span class=\"kw\">in</span> scores]</code></pre>\n</div>\n<div class=\"\
    ml-connect\">\n       Training loops in ML:\n       \n        for epoch in range(100): train_step()\n       \n       .\n\
    \       <br/>\n<br/>\n       Dataset loops:\n       \n        for X, y in dataloader: predict(X)\n       \n       .\n\
    \       <br/>\n<br/>\n       List comprehensions: feature engineering, label encoding, data normalization.\n       <br/>\n\
    <br/>\n       Control flow is literally the skeleton of every ML training script.\n      </div>\n<!-- PREDICT THE OUTPUT\
    \ -->\n<h2 class=\"sh2\">\n       \U0001F52E Predict the Output\n      </h2>\n<h2 class=\"sh2\">\n       ✅ Day 3 Quiz\n\
    \      </h2>\n<h2 class=\"sh2\">\n       \U0001F0CF Flashcards\n      </h2>\n<!-- /day-3-theory -->"
