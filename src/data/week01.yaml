    solution_code: |-
      # Step 1: Algorithmic Implementation & Core Transformations
      import csv, os

      FILENAME = "students.csv"
      FIELDS = ["name", "age", "score", "city"]

      def load_students():
          if not os.path.exists(FILENAME):
              return []
          try:
              with open(FILENAME, "r") as f:
                  return list(csv.DictReader(f))
          except Exception as e:
              print(f"Error loading: {e}")
              return []

      def save_students(students):
          with open(FILENAME, "w", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=FIELDS)
              writer.writeheader()
              writer.writerows(students)
          print(f"Saved {len(students)} records.")

      def add_student(students):
          try:
              name = input("Name: ")
              age = int(input("Age: "))
              score = float(input("Score: "))
              city = input("City: ")
              students.append({"name": name, "age": age, "score": score, "city": city})
              print("✅ Student added!")
          except ValueError:
              print("❌ Invalid input!")

      students = load_students()
      print(f"Loaded {len(students)} existing records.")
      add_student(students)
      save_students(students)
      assert students is not None, "students should not be None"
