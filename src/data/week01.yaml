    \ &amp; ml_devs)   <span class=\"cm\"># intersection — know BOTH Python + ML</span>\n<span class=\"fn\">print</span>(python_devs\
    \ - ml_devs)   <span class=\"cm\"># difference — Python only, not ML</span>\n\n<span class=\"cm\"># Membership check is\
    \ O(1) — instant even for 1 million items</span>\n<span class=\"fn\">print</span>(<span class=\"str\">\"Priya\"</span>\
    \ <span class=\"kw\">in</span> python_devs)  <span class=\"cm\"># True</span></code></pre>\n</div>\n<h3 class=\"sh3\"\
    >\n       4. Dictionaries — The Most Important Structure in ML\n      </h3>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — dicts.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
