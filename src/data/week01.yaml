    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Count word frequency\
      \ in a paragraph using a dict.\n          </p>\n<ul style=\"padding-left: 1.5rem;\
      \ margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;\">\n<li style=\"\
      margin-bottom: 0.4rem;\">\n            This is literally how text preprocessing\
      \ works in NLP (Natural Language Processing).\n           </li>\n<li style=\"\
      margin-bottom: 0.4rem;\">\n            Clean the text, split into words, count\
      \ each word.\n           </li>\n</ul>\n\n\n<button class=\"solution-toggle\"\
      \ onclick=\"toggleSolution('sol-w1-t06')\">\n           \U0001F4D3 Show Complete\
