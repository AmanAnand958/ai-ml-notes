    solution_title: ✅ SOLUTION — numpy_practice.py
    solution_code: 'import numpy as np


      # 1. Create 3x3 matrix

      matrix = np.arange(1, 10).reshape(3, 3)

      print("Matrix:\n", matrix)


      # 2. Print attributes

      print("Shape:", matrix.shape)

      print("Dimensions:", matrix.ndim)

      print("Size:", matrix.size)


      # 3. Slicing

      center_element = matrix[1, 1]

      third_row = matrix[2, :]

      print("Center Element:", center_element)

      print("Third Row:", third_row)


      # 4. Math

      new_matrix = matrix * 2 + 10

      print("Modified Matrix:\n", new_matrix)

      print("Sum of elements:", np.sum(new_matrix))'
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 2
    question: "What does\n         \n          arr.reshape(-1, 1)\n         \n   \
      \      do?"
    qid: q7_1
    options:
    - letter: A
      text: Reverses the array
      is_correct: false
    - letter: B
      text: Reshapes to a single column — any number of rows
      is_correct: true
    - letter: C
      text: Deletes the array
      is_correct: false
    - letter: D
      text: Makes all values -1
      is_correct: false
    correct_fb: ✅ -1 means "infer this dimension". reshape(-1, 1) = make 1 column,
      figure out the rows. [1,2,3,4,5] becomes [[1],[2],[3],[4],[5]] — shape (5,1).
      This is one of the most common ML operations.
    wrong_fb: ❌ reshape(-1, 1) makes a column vector. -1 = let numpy figure out the
      row count. Answer B.
  - num_str: QUESTION 2 OF 2
    question: Why is NumPy faster than Python lists for math operations?
    qid: q7_2
    options:
    - letter: A
      text: NumPy is written in Java
      is_correct: false
    - letter: B
      text: Data is stored contiguously in C, enabling SIMD CPU processing
      is_correct: true
    - letter: C
      text: NumPy uses GPU by default
      is_correct: false
    - letter: D
      text: NumPy skips error checking
      is_correct: false
    correct_fb: ✅ NumPy stores data as contiguous C arrays in memory. The CPU can
      process them with SIMD (parallel) instructions. Python lists scatter objects
      in memory — each element access is a separate memory jump. Contiguous = fast.
    wrong_fb: ❌ NumPy is C-backed with contiguous memory storage → SIMD CPU instructions
      can process batches. Python lists are scattered in memory. Answer B.
