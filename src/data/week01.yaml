  theory_html: "<h3 class=\"sh3\">\n       1. Reading and Writing Files\n      </h3>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left:\
    \ 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span class=\"cm\"># ALWAYS use 'with open()'\
    \ — auto-closes file even if error occurs</span>\n\n<span class=\"cm\"># Writing to a file</span>\n<span class=\"kw\"\
    >with</span> <span class=\"fn\">open</span>(<span class=\"str\">\"notes.txt\", \"w\"</span>) <span class=\"kw\">as</span>\
    \ f:    <span class=\"cm\"># \"w\" = write (overwrites existing)</span>\n    f.<span class=\"fn\">write</span>(<span class=\"\
    str\">\"Line 1: Python is awesome\\n\"</span>)\n    f.<span class=\"fn\">write</span>(<span class=\"str\">\"Line 2: AI/ML\
    \ is the future\\n\"</span>)\n\n<span class=\"cm\"># Reading entire file</span>\n<span class=\"kw\">with</span> <span\
