      \ Loves: {subject}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"=\"</span> * <span class=\"num\"\
      >31</span>)\n<span class=\"fn\">print</span>()\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Type of name\
