    done_when: Program loads existing CSV on start, adds a student, saves back. Run
      it twice — second run should show the student from first run.
    git_cmd: 'git add *.py &amp;&amp; git commit -m "Day 5: file I/O, CSV read/write,
      exception handling" &amp;&amp; git push'
    sol_id: sol-w1d5t1
    solution_title: ✅ SOLUTION
    solution_code: "# Step 1: Algorithmic Implementation & Core Transformations\n\
      import csv, os\n\nFILENAME = \"students.csv\"\nFIELDS = [\"name\", \"age\",\
      \ \"score\", \"city\"]\n\ndef load_students():\n    if not os.path.exists(FILENAME):\n\
      \        return []\n    try:\n        with open(FILENAME, \"r\") as f:\n   \
      \         return list(csv.DictReader(f))\n    except Exception as e:\n     \
      \   print(f\"Error loading: {e}\")\n        return []\n\ndef save_students(students):\n\
      \    with open(FILENAME, \"w\", newline=\"\") as f:\n        writer = csv.DictWriter(f,\
      \ fieldnames=FIELDS)\n        writer.writeheader()\n        writer.writerows(students)\n\
      \    print(f\"Saved {len(students)} records.\")\n\ndef add_student(students):\n\
      \    try:\n        name = input(\"Name: \")\n        age = int(input(\"Age:\
      \ \"))\n        score = float(input(\"Score: \"))\n        city = input(\"City:\
      \ \")\n        students.append({\"name\": name, \"age\": age, \"score\": score,\
      \ \"city\": city})\n        print(\"✅ Student added!\")\n    except ValueError:\n\
      \        print(\"❌ Invalid input!\")\n\nstudents = load_students()\nprint(f\"\
      Loaded {len(students)} existing records.\")\nadd_student(students)\nsave_students(students)"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 2
    question: "Why should you always use\n         \n          with open()\n     \
      \    \n         instead of just\n         \n          open()\n         \n  \
      \       ?"
    qid: q5_1
    options:
    - letter: A
      text: It reads files faster
      is_correct: false
    - letter: B
      text: It automatically closes the file even if an error occurs
      is_correct: true
    - letter: C
      text: It creates the file if it doesn't exist
      is_correct: false
    - letter: D
      text: It reads the file line by line
      is_correct: false
    correct_fb: ✅ with open() is a context manager — it guarantees file.close() is
      called even if an exception occurs inside the block. Unclosed files can cause
      data corruption and resource leaks.
    wrong_fb: ❌ with open() auto-closes the file via context manager protocol, even
      if an exception occurs. This prevents resource leaks. Answer B.
  - num_str: QUESTION 2 OF 2
