      \              </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
      \ style=\"margin-left:4px;\">\n               Run\n              </button>\n\
      </div>\n</div>\n<pre><span class=\"cm\"># Word Frequency Counter - NLP Foundation</span>\n\
      text = <span class=\"str\">\"\"\"</span>Python <span class=\"kw\">is</span>\
      \ amazing. Python <span class=\"kw\">is</span> powerful <span class=\"kw\">and</span>\
      \ Python <span class=\"kw\">is</span> easy.\nMachine learning <span class=\"\
      kw\">with</span> Python <span class=\"kw\">is</span> fun <span class=\"kw\"\
      >and</span> exciting.<span class=\"str\">\"\"\"</span>\n<span class=\"kw\">for</span>\
      \ p <span class=\"kw\">in</span> <span class=\"str\">\".,!?;:'</span>\\<span\
      \ class=\"str\">\"\"</span>:\n    text = text.<span class=\"fn\">replace</span>(p,\
      \ <span class=\"str\">\"\"</span>)\nwords = text.<span class=\"fn\">lower</span>().<span\
      \ class=\"fn\">split</span>()\nfreq = {}\n<span class=\"kw\">for</span> word\
      \ <span class=\"kw\">in</span> <span class=\"fn\">set</span>(words):\n    freq[word]\
      \ = words.<span class=\"fn\">count</span>(word)\nsorted_words = <span class=\"\
      fn\">sorted</span>(freq.<span class=\"fn\">items</span>(), key=<span class=\"\
      kw\">lambda</span> x: x[<span class=\"num\">1</span>], reverse=<span class=\"\
      kw\">True</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"{'</span>Word<span\
      \ class=\"str\">':&lt;15} {'</span>Count<span class=\"str\">':&lt;6}\"</span>)\n\
      <span class=\"fn\">print</span>(<span class=\"str\">\"-\"</span> * <span class=\"\
      num\">21</span>)\n<span class=\"kw\">for</span> word, count <span class=\"kw\"\
      >in</span> sorted_words:\n    <span class=\"fn\">print</span>(<span class=\"\
      str\">f\"{word:&lt;15} {count:&lt;6}\"</span>)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"\\nTotal unique words: {len(freq)}\"</span>)\n<span class=\"\
      fn\">print</span>(<span class=\"str\">f\"Most common: '</span>{sorted_words[<span\
      \ class=\"num\">0</span>][<span class=\"num\">0</span>]}<span class=\"str\"\
      >' ({sorted_words[0][1]} times)\"</span>)</pre>\n</div>\n</div>"
    done_when: Word frequencies computed, top 10 printed with visual bars, unique
