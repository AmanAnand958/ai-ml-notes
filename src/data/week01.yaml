    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span class=\"cm\"># Dicts\
    \ store key:value pairs — like a real dictionary</span>\nstudent = {\n    <span class=\"str\">\"name\": \"Arjun Mehta\"\
    </span>,\n    <span class=\"str\">\"age\"</span>: <span class=\"num\">21</span>,\n    <span class=\"str\">\"gpa\"</span>:\
    \ <span class=\"num\">8.9</span>,\n    <span class=\"str\">\"subjects\": [\"Python\", \"ML\", \"Stats\"</span>]  <span\
    \ class=\"cm\"># list as a value!</span>\n}\n\n<span class=\"cm\"># Access values by key</span>\n<span class=\"fn\">print</span>(student[<span\
    \ class=\"str\">\"name\"</span>])              <span class=\"cm\"># \"Arjun Mehta\"</span>\n<span class=\"fn\">print</span>(student.<span\
    \ class=\"fn\">get</span>(<span class=\"str\">\"city\", \"N/A\"</span>))   <span class=\"cm\"># \"N/A\" — safe, no crash\
    \ if key missing</span>\n\n<span class=\"cm\"># Add / update / delete</span>\nstudent[<span class=\"str\">\"city\"] =\
    \ \"Bangalore\"</span>         <span class=\"cm\"># add new key</span>\nstudent[<span class=\"str\">\"gpa\"</span>] =\
    \ <span class=\"num\">9.1</span>                 <span class=\"cm\"># update existing key</span>\ndel student[<span class=\"\
    str\">\"age\"</span>]                   <span class=\"cm\"># remove key</span>\n\n<span class=\"cm\"># Iterate over dict</span>\n\
    <span class=\"kw\">for</span> key, value <span class=\"kw\">in</span> student.<span class=\"fn\">items</span>():\n   \
    \ <span class=\"fn\">print</span>(<span class=\"str\">f\"{key}: {value}\"</span>)\n\n<span class=\"cm\"># Dict comprehension\
    \ — builds a dict from a sequence</span>\ngrades = {<span class=\"str\">\"Raj\": 88, \"Priya\": 92, \"Amit\"</span>: <span\
    \ class=\"num\">75</span>}\npassed = {name: g <span class=\"kw\">for</span> name, g <span class=\"kw\">in</span> grades.<span\
    \ class=\"fn\">items</span>() <span class=\"kw\">if</span> g >= <span class=\"num\">80</span>}</code></pre>\n</div>\n\
    <div class=\"ml-connect\">\n       In scikit-learn, you call models like this:\n       \n        model = RandomForestClassifier(n_estimators=100,\
