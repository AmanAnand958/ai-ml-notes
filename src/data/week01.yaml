- id: '4'
  day_num: 4
  title: Functions — Parameters, Return Values, Lambda, Scope
  subtitle: Functions = reusable code blocks.
  time_estimate: 4 hours
  difficulty: Beginner
  badges:
  - label: ⚡ Beginner
    variant: b
  xp: 150
  objectives:
