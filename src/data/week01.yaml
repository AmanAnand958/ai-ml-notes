      is_correct: false
    - letter: C
      text: FileNotFoundError
      is_correct: true
    - letter: D
      text: NameError
      is_correct: false
    correct_fb: ✅ FileNotFoundError is the specific exception for missing files. Always
      catch this when loading ML datasets — the file path might be wrong or the dataset
      not downloaded yet.
    wrong_fb: ❌ It's FileNotFoundError. Catch this in ML code when loading datasets
      — paths can be wrong or dataset not downloaded. Answer C.
