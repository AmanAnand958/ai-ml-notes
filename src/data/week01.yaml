    <pre><code><span class=\"kw\">from</span> collections <span class=\"kw\">import</span> Counter, defaultdict, deque\n\n\
    <span class=\"cm\"># 1. Counter: Automatically counts frequencies (great for NLP token counts)</span>\nwords = [<span\
    \ class=\"str\">\"apple\", \"banana\", \"apple\", \"orange\", \"banana\", \"apple\"</span>]\nword_counts = <span class=\"\
