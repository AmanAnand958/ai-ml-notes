  analogy: "Class ek blueprint hai, object ek ghar hai.\n       <br/>\n<br/>\n   \
    \    Blueprint se hazaron ghar ban sakte hain — sab ka structure same, lekin andar\
    \ ka saman alag.\n       <br/>\n<br/>\n\n        class Student\n       \n    \
    \   blueprint hai.\n       <br/>\n<br/>\n\n        raj = Student(\"Raj\", 21)\n\
    \       \n       ek actual student object hai RAM mein."
  theory_html: "<h3 class=\"sh3\">\n       1. Classes and Objects\n      </h3>\n<p\
    \ style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       Object-Oriented Programming (OOP) structures code by grouping data (attributes)\
    \ and behavior (methods) into reusable blueprints called classes.\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><span class=\"kw\">class</span> <span\
    \ class=\"cls\">Student</span>:\n    school = <span class=\"str\">\"IIT Delhi\"\
    </span>    <span class=\"cm\"># class variable — shared by ALL students</span>\n\
    \n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"\
    kw\">self</span>, name, age, gpa):    <span class=\"cm\"># constructor — called\
    \ on creation</span>\n        <span class=\"kw\">self</span>.name = name    <span\
    \ class=\"cm\"># instance variable — unique to each student</span>\n        <span\
    \ class=\"kw\">self</span>.age = age\n        <span class=\"kw\">self</span>.gpa\
    \ = gpa\n\n    <span class=\"kw\">def</span> <span class=\"fn\">__str__</span>(<span\
    \ class=\"kw\">self</span>):        <span class=\"cm\"># called by print()</span>\n\
    \        <span class=\"kw\">return</span> <span class=\"str\">f\"Student({self.name},\
    \ GPA={self.gpa})\"</span>\n\n    <span class=\"kw\">def</span> <span class=\"\
    fn\">is_eligible</span>(<span class=\"kw\">self</span>, min_gpa=<span class=\"\
    num\">8.0</span>):\n        <span class=\"kw\">return</span> <span class=\"kw\"\
    >self</span>.gpa &gt;= min_gpa\n\n    <span class=\"kw\">def</span> <span class=\"\
    fn\">upgrade_gpa</span>(<span class=\"kw\">self</span>, bonus):\n        <span\
    \ class=\"kw\">self</span>.gpa = <span class=\"fn\">round</span>(<span class=\"\
    kw\">self</span>.gpa + bonus, <span class=\"num\">1</span>)\n\n<span class=\"\
    cm\"># Create objects</span>\nraj = <span class=\"fn\">Student</span>(<span class=\"\
    str\">\"Raj\"</span>, <span class=\"num\">21</span>, <span class=\"num\">8.7</span>)\n\
    priya = <span class=\"fn\">Student</span>(<span class=\"str\">\"Priya\"</span>,\
    \ <span class=\"num\">22</span>, <span class=\"num\">9.1</span>)\n\n<span class=\"\
    fn\">print</span>(raj)                   <span class=\"cm\"># Student(Raj, GPA=8.7)</span>\n\
    <span class=\"fn\">print</span>(raj.<span class=\"fn\">is_eligible</span>()) \
    \    <span class=\"cm\"># True</span>\nraj.<span class=\"fn\">upgrade_gpa</span>(<span\
    \ class=\"num\">0.3</span>)\n<span class=\"fn\">print</span>(raj.gpa)        \
    \       <span class=\"cm\"># 9.0</span>\n<span class=\"fn\">print</span>(Student.school)\
    \        <span class=\"cm\"># IIT Delhi — class variable</span></pre>\n</div>\n\
    <h3 class=\"sh3\">\n       2. Inheritance — Extend Without Rewriting\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       Inheritance allows a subclass to adopt all the methods and attributes\
    \ of a parent class, enabling developers to extend functionality and reduce duplicate\
    \ code.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         python\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"cm\"\
    ># Step 1: Algorithmic Implementation &amp; Core Transformations</span>\n<span\
    \ class=\"kw\">class</span> <span class=\"cls\">MLStudent</span>(Student):   \
    \ <span class=\"cm\"># inherits from Student</span>\n    <span class=\"kw\">def</span>\
    \ <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, name, age,\
    \ gpa, specialization):\n        <span class=\"fn\">super</span>().<span class=\"\
    fn\">__init__</span>(name, age, gpa)   <span class=\"cm\"># call parent __init__</span>\n\
    \        <span class=\"kw\">self</span>.spec = specialization\n\n    <span class=\"\
    kw\">def</span> <span class=\"fn\">__str__</span>(<span class=\"kw\">self</span>):\
    \    <span class=\"cm\"># override parent method</span>\n        <span class=\"\
    kw\">return</span> <span class=\"str\">f\"MLStudent({self.name}, {self.spec},\
    \ GPA={self.gpa})\"</span>\n\n    <span class=\"kw\">def</span> <span class=\"\
    fn\">recommend_courses</span>(<span class=\"kw\">self</span>):\n        courses\
    \ = {\n            <span class=\"str\">\"CV\": [\"OpenCV\", \"PyTorch\"</span>],\n\
    \            <span class=\"str\">\"NLP\": [\"NLTK\", \"HuggingFace\"</span>],\n\
    \            <span class=\"str\">\"Data\": [\"Pandas\", \"SQL\"</span>],\n   \
    \     }\n        <span class=\"kw\">return</span> courses.<span class=\"fn\">get</span>(<span\
    \ class=\"kw\">self</span>.spec, [<span class=\"str\">\"Python\", \"Statistics\"\
    </span>])\n\narjun = <span class=\"fn\">MLStudent</span>(<span class=\"str\">\"\
    Arjun\", 23, 9.0, \"NLP\"</span>)\n<span class=\"fn\">print</span>(arjun)\n<span\
    \ class=\"fn\">print</span>(arjun.<span class=\"fn\">recommend_courses</span>())\
    \    <span class=\"cm\"># [\"NLTK\", \"HuggingFace\"]</span>\n<span class=\"fn\"\
    >print</span>(arjun.<span class=\"fn\">is_eligible</span>())          <span class=\"\
    cm\"># inherited from Student!</span></pre>\n</div>\n<div class=\"ml-connect\"\
    >\n       Every sklearn model follows this pattern:\n       \n        class LinearRegression(BaseEstimator,\
    \ RegressorMixin)\n       \n       — inheriting from base classes that provide\
    \ fit(), predict(), score() contracts.\n       <br/>\n<br/>\n       PyTorch:\n\
    \       \n        class MyNet(nn.Module)\n       \n       — you inherit from nn.Module\
    \ and override forward().\n       <br/>\n<br/>\n       Understanding OOP = understanding\
    \ how to build ML models from scratch.\n      </div>\n<div class=\"mermaid\">\n\
    graph TD\n  Base[\"BaseModel fit X, y predict X score X, y\"]\n  Base --&gt; LR[\"\
    LinearRegression\"]\n  Base --&gt; RF[\"RandomForest\"]\n  Base --&gt; SVM[\"\
    SVM\"]\n  Base --&gt; NN[\"NeuralNet\"]\n</div>\n<div class=\"diagram-cap\">\n\
    \       This is the exact sklearn inheritance pattern you'll use from Week 5 onwards\n\
    \      </div>"
