    sol_id: sol-w1d2t2
    solution_title: ✅ SOLUTION — grade_tracker.py
    solution_code: |-
      # grade_tracker.py — Using all 4 data structures

      # DICT of name → (tuple of marks) — tuple because marks shouldn't change
      students = {
          "Raj":   (88, 92, 79),
          "Priya": (95, 87, 91),
          "Amit":  (72, 68, 74),
          "Sara":  (61, 55, 63),
          "Karan": (84, 89, 82),
      }

      # Compute averages — list comprehension to get all marks
      averages = {}
      for name, marks in students.items():
          averages[name] = round(sum(marks) / len(marks), 2)

      # Assign grade — list of all averages for display
      avg_list = [averages[n] for n in students]  # list
      grade_set = set()  # unique grades earned

      print(f"{'Name':10} {'Average':10} {'Grade':8}")
      print("─" * 30)

      for name, avg in averages.items():
          grade = "A" if avg >= 85 else "B" if avg >= 70 else "C" if avg >= 60 else "F"
          grade_set.add(grade)
          print(f"{name:10} {avg:10} {grade:8}")

      print(f"\nGrades awarded this batch: {grade_set}")  # set
      print(f"Top scorer: {max(averages, key=averages.get)}")
      assert grade is not None, "grade should not be None"
    solution_lang: python
