  flashcards:
  - front: List vs Tuple — key difference?
    back: |-
      List = mutable (can change)
                <br/>
                Tuple = immutable (fixed)
                <br/>
                Use tuple for fixed data like coordinates
  - front: How to get a dict value safely?
    back: |-
      d.get("key", default)
                <br/>
                Returns default if key missing
                <br/>
                d["key"] crashes with KeyError
  - front: How to remove duplicates from a list?
    back: |-
      list(set(my_list))
                <br/>
                Converts to set (unique), then back to list This establishes the core invariant in Lists, Tuples, Sets & Dictionaries, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: List comprehension syntax?
    back: |-
      [expr for item in iterable if condition]
                <br/>
                e.g. [x*2 for x in nums if x > 0]
  - front: How to create an empty set?
    back: |-
      set() — not {}
                <br/>
                {} creates an empty dict!
                <br/>
                This is a classic Python gotcha
  gotcha:
    title: '⚠️ Gotcha: Shallow vs Deep Copy'
    description: "Assignment (\n       \n        b = a\n       \n       ) creates a\n       <em>\n        reference\n    \
      \   </em>\n       , not a copy.\n       \n        b = a.copy()\n       \n       creates a shallow copy (nested objects\
      \ still share references). Use\n       \n        import copy; b = copy.deepcopy(a)\n       \n       for fully independent\
      \ nested copies. This is a top Python interview pitfall."
  takeaways:
    hinglish_line: Production mein Lists, Tuples, Sets & Dictionaries ko use karte waqt edge cases aur mathematical constraints
      ko pehle validate karo, taaki downstream deployment bilkul rock-solid rahe!
    bullets:
    - |-
      <strong>
                 Use dicts when you need key→value lookup.
                </strong>
                O(1) speed — instant regardless of size. This is how ML model configs work.
    - |-
      <strong>
                 List slice [start:stop:step]
                </strong>
                — stop index is NEVER included. Negative index counts from end. [::−1] reverses.
    - |-
      <strong>
                 {} is empty dict, not empty set.
                </strong>
                Use set() for empty set. Classic Python gotcha.
    - |-
      <strong>
                 d.get(key, default)
                </strong>
                is always safer than d[key]. In ML code, configs may have missing keys — .get() prevents crashes.
    - |-
      <strong>
                 Dicts are the backbone of ML APIs.
                </strong>
                Every sklearn model accepts hyperparameters as keyword args (which are dicts under the hood).
