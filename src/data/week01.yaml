  - title: Dataset Preprocessor Hierarchy — Inheritance & Polymorphism
    badge: 🔴 CHALLENGE
    badge_class: tb-hard
    time: 50 min
    prompt_html: "<strong><p style=\"margin-bottom: 0.6rem;\">\n           Cons</strong> <p style=\"margin-bottom: 0.6rem;\"\
      >\n           Construct an object-oriented preprocessing pipeline hierarchy mirroring Scikit-Learn:\n          </p>\n\
      <ul style=\"padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;\">\n<li>\n       \
      \     Base class\n            \n             BaseTransformer\n            \n            with abstract\n            \n\
      \             fit(data)\n            \n            and\n            \n             transform(data)\n            \n \
      \           methods.\n           </li>\n<li>\n            Subclass\n            \n             StandardScalerTransformer\n\
      \            \n            : calculates mean and std in\n            \n             fit()\n            \n          \
      \  , and returns $z = (x - \\mu) / \\sigma$ in\n            \n             transform()\n            \n            .\n\
      \           </li>\n<li>\n            Subclass\n            \n             MinMaxScalerTransformer\n            \n  \
      \          : calculates min and max in\n            \n             fit()\n            \n            , and returns $(x\
      \ - \\text{min}) / (\\text{max} - \\text{min})$ in\n            \n             transform()\n            \n         \
      \   .\n           </li>\n</ul>"
    done_when: When inheritance hierarchy implements polymorphism matching Scikit-Learn transformer API.
    git_cmd: 'git add transformer_hierarchy.py &amp;&amp; git commit -m "feat(day): Day 6: Object-oriented Scikit-Learn style
      transformers"'
    sol_id: sol-w1d6t2
    solution_title: ✅ COMPLETE SOLUTION — transformer_hierarchy.py
    solution_code: |-
      # Day 6 Task 2: Dataset Preprocessor Hierarchy — OOP Inheritance
      from abc import ABC, abstractmethod
      from typing import List, Dict, Any
      import numpy as np

      class BasePreprocessor(ABC):
          """Abstract base class for data preprocessors."""
          def __init__(self, name: str):
              self.name = name
              self.is_fitted = False

          @abstractmethod
          def fit(self, data: Any) -> 'BasePreprocessor':
              pass

          @abstractmethod
          def transform(self, data: Any) -> Any:
              pass

          def fit_transform(self, data: Any) -> Any:
              return self.fit(data).transform(data)

      class TabularPreprocessor(BasePreprocessor):
          """Standardizes numeric tabular features."""
          def __init__(self):
              super().__init__("TabularPreprocessor")
              self.means: np.ndarray = None
              self.stds: np.ndarray = None

          def fit(self, data: np.ndarray) -> 'TabularPreprocessor':
              self.means = np.mean(data, axis=0)
              self.stds = np.std(data, axis=0) + 1e-8
              self.is_fitted = True
              return self

          def transform(self, data: np.ndarray) -> np.ndarray:
              if not self.is_fitted:
                  raise RuntimeError("Preprocessor must be fitted before transform")
              return (data - self.means) / self.stds

      class TextPreprocessor(BasePreprocessor):
          """Cleans and tokenizes raw text streams."""
          def __init__(self, lowercase: bool = True):
              super().__init__("TextPreprocessor")
              self.lowercase = lowercase
              self.vocab: Dict[str, int] = {}

          def fit(self, data: List[str]) -> 'TextPreprocessor':
              unique_tokens = set()
              for text in data:
                  tokens = text.lower().split() if self.lowercase else text.split()
                  unique_tokens.update(tokens)
              self.vocab = {tok: idx for idx, tok in enumerate(sorted(unique_tokens))}
              self.is_fitted = True
              return self

          def transform(self, data: List[str]) -> List[List[int]]:
              if not self.is_fitted:
                  raise RuntimeError("Preprocessor must be fitted before transform")
              result = []
              for text in data:
                  tokens = text.lower().split() if self.lowercase else text.split()
                  result.append([self.vocab.get(tok, -1) for tok in tokens])
              return result

      # Verification
      tab = TabularPreprocessor()
      X = np.array([[10.0, 200.0], [20.0, 400.0], [30.0, 600.0]])
      X_norm = tab.fit_transform(X)
      print("Tabular Normalized:\n", X_norm)
      assert np.allclose(np.mean(X_norm, axis=0), [0.0, 0.0], atol=1e-5)

      txt = TextPreprocessor()
      texts = ["hello world", "world of AI", "hello AI engineer"]
      indices = txt.fit_transform(texts)
      print("Text Vocab Size:", len(txt.vocab))
      assert len(txt.vocab) == 5
      print("✓ Dataset preprocessor hierarchy verified.")
