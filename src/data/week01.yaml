    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span\
    \ class=\"cm\"># Tuples use () — cannot be changed after creation</span>\ndelhi_coords = (<span class=\"num\">28.6139</span>,\
