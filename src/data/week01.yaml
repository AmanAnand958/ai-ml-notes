      ># Student Records to CSV - Persistent Storage</span>\n<span class=\"kw\">import</span>\
      \ csv\n<span class=\"kw\">import</span> os\nFILENAME = <span class=\"str\">\"\
      students.csv\"</span>\nFIELDS = [<span class=\"str\">\"name\", \"age\", \"score\"\
      , \"city\"</span>]\n<span class=\"kw\">def</span> <span class=\"fn\">load_students</span>():\n\
