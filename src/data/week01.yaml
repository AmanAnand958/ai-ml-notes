  tasks:
  - title: Metric Converter Function — *args & Defaults
    badge: 🟢 EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Create a reusable\
      \ function\n           \n            convert_temperatures(*celsius_temps, unit=\"\
      F\")\n           \n           :\n          </p>\n<ul style=\"padding-left: 1.5rem;\
      \ margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;\">\n<li>\n\
      \            Converts variable number of Celsius values to Fahrenheit (\n  \
      \          \n             F = C * 9/5 + 32\n            \n            ) or Kelvin\
      \ (\n            \n             K = C + 273.15\n            \n            )\
      \ based on\n            \n             unit\n            \n            .\n \
      \          </li>\n<li>\n            Returns a list of converted floats rounded\
      \ to 2 decimals.\n           </li>\n</ul>"
    done_when: Function accepts arbitrary number of positional arguments and outputs
      converted temperatures.
    git_cmd: 'git add temp_converter.py &amp;&amp; git commit -m "Day 4: Metric converter
      function with *args"'
    sol_id: sol-w1d4t1
    solution_title: ✅ COMPLETE SOLUTION — temp_converter.py
    solution_code: "# Step 1: Algorithmic Implementation & Core Transformations\n\
      def convert_temperatures(*celsius_temps, unit=\"F\"):\n    converted = []\n\
      \    for c in celsius_temps:\n        if unit == \"F\":\n            converted.append(round(c\
      \ * 9/5 + 32, 2))\n        elif unit == \"K\":\n            converted.append(round(c\
      \ + 273.15, 2))\n        else:\n            raise ValueError(f\"Unknown unit:\
      \ {unit}\")\n    return converted\n\nprint(\"Fahrenheit:\", convert_temperatures(0,\
      \ 25, 37, 100, unit=\"F\"))\nprint(\"Kelvin    :\", convert_temperatures(0,\
      \ 25, 37, 100, unit=\"K\"))"
    solution_lang: python
  - title: ML Loss Calculator Function — Keyword Arguments & Lambda
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 35 min
    prompt_html: "<p style=\"margin-bottom: 0.6rem;\">\n           Build a loss evaluation\
      \ helper\n           \n            compute_loss(y_true, y_pred, loss_type=\"\
      mse\")\n           \n           :\n          </p>\n<ul style=\"padding-left:\
      \ 1.5rem; margin-top: 0.4rem; margin-bottom: 1rem; list-style-type: disc;\"\
      >\n<li>\n            Supports\n            \n             \"mse\"\n        \
      \    \n            : Mean Squared Error $\frac{1}{n} \\sum (y - \\hat{y})^2$.\n\
      \           </li>\n<li>\n            Supports\n            \n             \"\
      mae\"\n            \n            : Mean Absolute Error $\frac{1}{n} \\sum |y\
      \ - \\hat{y}|$.\n           </li>\n<li>\n            Uses lambda functions internally\
      \ for the per-element error calculations.\n           </li>\n</ul>"
    done_when: Computes exact MSE and MAE metrics with clean error handling and lambdas.
    git_cmd: 'git add ml_loss.py &amp;&amp; git commit -m "Day 4: ML loss calculator
      with lambda &amp; zip"'
    sol_id: sol-w1d4t2
    solution_title: ✅ COMPLETE SOLUTION — ml_loss.py
    solution_code: "# Step 1: Algorithmic Implementation & Core Transformations\n\
      def compute_loss(y_true, y_pred, loss_type=\"mse\"):\n    if len(y_true) !=\
      \ len(y_pred):\n        raise ValueError(\"y_true and y_pred must have equal\
      \ lengths\")\n    \n    n = len(y_true)\n    if loss_type == \"mse\":\n    \
      \    calc = lambda yt, yp: (yt - yp) ** 2\n    elif loss_type == \"mae\":\n\
      \        calc = lambda yt, yp: abs(yt - yp)\n    else:\n        raise ValueError(f\"\
      Unsupported loss: {loss_type}\")\n    \n    total = sum(calc(yt, yp) for yt,\
      \ yp in zip(y_true, y_pred))\n    return round(total / n, 4)\n\ny_actual = [10.5,\
      \ 20.0, 30.5, 40.0]\ny_predicted = [11.0, 19.5, 32.0, 39.0]\n\nprint(\"MSE Loss:\"\
      , compute_loss(y_actual, y_predicted, loss_type=\"mse\"))\nprint(\"MAE Loss:\"\
      , compute_loss(y_actual, y_predicted, loss_type=\"mae\"))"
    solution_lang: python
