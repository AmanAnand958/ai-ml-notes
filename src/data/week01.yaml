                Stop (10) is NEVER included This establishes the core invariant in Control Flow — if/elif/else, Loops, List Comprehensions, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: enumerate() gives you what?
    back: |-
      Both index AND value as tuples
                <br/>
                for i, item in enumerate(list):
  - front: break vs continue?
    back: |-
