      \ 1rem; list-style-type: disc;\">\n<li style=\"margin-bottom: 0.4rem;\">\n \
      \           This is exactly how ML data pipelines work.\n           </li>\n\
      </ul>\n\n\n<button class=\"solution-toggle\" onclick=\"toggleSolution('sol-w1-t10')\"\
      >\n           \U0001F4D3 Show Complete Colab Code\n          </button>\n<div\
      \ class=\"solution-box\" id=\"sol-w1-t10\">\n<div class=\"sol-header\">\n  \
      \          \U0001F4D3 Complete Colab Code\n           </div>\n<div class=\"\
      cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n              python\n\
      \             </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
      copyCode(this)\">\n               copy\n              </button>\n<button class=\"\
      run-btn\" onclick=\"runCode(this)\" style=\"margin-left:4px;\">\n          \
