  hinglish: "List comprehension ek powerful shortcut hai:\n       \n        [x2 for x in range(10)]\n       \n       — normal\
    \ loop se 3 guna fast aur readable. Iska use karna seekho!"
  analogy: 'Ek chai ki dukaan ka example: tumhara chai banana ka process ek function hai — same steps, same output, lekin
    different type of milk/sugar as inputs. Function ek recipe hai — write once, use many times with different ingredients.
