      \ = csv.<span class=\"fn\">DictWriter</span>(f, fieldnames=FIELDS)\n       \
      \ writer.<span class=\"fn\">writeheader</span>()\n        writer.<span class=\"\
      fn\">writerows</span>(students)\n    <span class=\"fn\">print</span>(<span class=\"\
      str\">f\"Saved {len(students)} records.\"</span>)\nstudents = <span class=\"\
      fn\">load_students</span>()\n<span class=\"fn\">print</span>(<span class=\"\
