    \ class=\"kw\">def</span> <span class=\"fn\">upgrade_gpa</span>(<span class=\"kw\">self</span>, bonus):\n        <span\
    \ class=\"kw\">self</span>.gpa = <span class=\"fn\">round</span>(<span class=\"kw\">self</span>.gpa + bonus, <span class=\"\
    num\">1</span>)\n\n<span class=\"cm\"># Create objects</span>\nraj = <span class=\"fn\">Student</span>(<span class=\"\
    str\">\"Raj\"</span>, <span class=\"num\">21</span>, <span class=\"num\">8.7</span>)\npriya = <span class=\"fn\">Student</span>(<span\
