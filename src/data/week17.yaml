    prompt_html: "<p><strong>\n         Build the full 3-container stack: Flask ML\
      \ API + Redis + Nginx. Requirements: docker-compose.yml with all 3 services,\
      \ health checks on Flask and Redis, flask depends_on Redis (healthy), nginx.conf\
      \ that proxies /api/ to Flask, prediction caching with Redis (return cache:\
