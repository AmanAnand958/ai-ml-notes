      \n<span class=\"cm\"># Build and run</span>\n<span class=\"kw\">import</span>\
      \ subprocess\n<span class=\"fn\">print</span>(<span class=\"str\">\"To build\
      \ and run:\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"\
      \  1. docker build -t rag-app .\"</span>)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">\"  2. docker run -p 8000:8000 --env-file .env rag-app\"</span>)\n\
      <span class=\"fn\">print</span>(<span class=\"str\">\"  3. Visit http://localhost:8000/docs\
