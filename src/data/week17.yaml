    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day123: complete day
      123 tasks and coding exercises"'
    sol_id: sol-w17d123t1
    solution_title: ✅ COMPLETE SOLUTION — full_ml_stack_with_compose.py
    solution_code: "# full_ml_stack_with_compose.py — Solution\n# Complete solution\
      \ for: Full ML Stack with Compose\n\n# FastAPI RAG Application with ChromaDB\n\
      # pip install fastapi uvicorn chromadb sentence-transformers openai\n\nfrom\
      \ fastapi import FastAPI, HTTPException\nfrom pydantic import BaseModel\nimport\
      \ chromadb\nfrom chromadb.utils.embedding_functions import SentenceTransformerEmbeddingFunction\n\
      from openai import OpenAI\nimport os\n\napp = FastAPI(title=\"RAG API\", version=\"\
      1.0\")\nclient = OpenAI()\n\n# 1. Initialize ChromaDB with embeddings\nembed_fn\
      \ = SentenceTransformerEmbeddingFunction(model_name=\"all-MiniLM-L6-v2\")\n\
      chroma = chromadb.PersistentClient(path=\"./chroma_db\")\ncollection = chroma.get_or_create_collection(\"\
      knowledge_base\", embedding_function=embed_fn)\n\n# 2. Models\nclass Document(BaseModel):\n\
      \    text: str\n    metadata: dict = {}\n\nclass Query(BaseModel):\n    question:\
      \ str\n    top_k: int = 3\n\nclass Answer(BaseModel):\n    answer: str\n   \
      \ sources: list[str]\n\n# 3. Endpoints\n@app.post(\"/ingest\")\nasync def ingest_document(doc:\
      \ Document):\n    \"\"\"Add a document to the knowledge base.\"\"\"\n    doc_id\
      \ = f\"doc_{collection.count()}\"\n    collection.add(\n        documents=[doc.text],\n\
      \        metadatas=[doc.metadata],\n        ids=[doc_id],\n    )\n    return\
      \ {\"status\": \"ingested\", \"id\": doc_id, \"total_docs\": collection.count()}\n\
      \n@app.post(\"/query\", response_model=Answer)\nasync def query_rag(query: Query):\n\
      \    \"\"\"Query the RAG pipeline: retrieve + generate.\"\"\"\n    if collection.count()\
      \ == 0:\n        raise HTTPException(400, \"No documents ingested yet\")\n \
      \   \n    # Retrieve\n    results = collection.query(query_texts=[query.question],\
      \ n_results=query.top_k)\n    chunks = results[\"documents\"][0]\n    \n   \
      \ # Generate\n    context = \"\\n\\n\".join(f\"[Source {i+1}]: {c}\" for i,\
      \ c in enumerate(chunks))\n    response = client.chat.completions.create(\n\
      \        model=\"gpt-4o-mini\",\n        messages=[\n            {\"role\":\
      \ \"system\", \"content\": \"Answer using ONLY the provided context. Cite sources\
      \ as [Source N].\"},\n            {\"role\": \"user\", \"content\": f\"Context:\\\
      n{context}\\n\\nQuestion: {query.question}\"},\n        ],\n        temperature=0,\n\
      \    )\n    \n    return Answer(answer=response.choices[0].message.content,\
      \ sources=chunks)\n\n@app.get(\"/health\")\nasync def health():\n    return\
      \ {\"status\": \"ok\", \"documents\": collection.count()}\n\n# Run: uvicorn\
      \ main:app --reload\n\nif True:\n        pass # Task Complete"
    solution_lang: python
    time_minutes: 30
