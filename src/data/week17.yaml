- id: '124'
  day_num: 124
  title: Week 17 Capstone — Deploy a Full ML System to Production
  subtitle: Ab sab kuch ek saath jodne ka waqt. Flask API + Docker + Compose + CI/CD-ready
    structure — ek complete, production-deployable ML system. Ye week ka final project
    hai aur ek real portfolio piece bhi.
  time_estimate: 8 hours
  difficulty: +300 XP
  badges:
  - label: 🏆 Capstone
    variant: o
  - label: Full Deploy
    variant: t
  xp: 150
  objectives:
  - A trained ML model (any dataset, scikit-learn Pipeline serialised with joblib).
  - Flask REST API (factory pattern, blueprints, error handlers, request logging).
  - Multi-stage Dockerfile with non-root user, layer-optimized, .dockerignore.
  - 'docker-compose.yml: Flask + Redis + Nginx with health checks and dependencies.'
