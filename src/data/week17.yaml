  quizzes:
  - num_str: Q1 OF 2
    question: What is the primary difference between a Docker Image and a Docker Container?
    qid: q121_1
    options:
    - letter: A
      text: Images run on GPUs; Containers run on CPUs
      is_correct: false
    - letter: B
      text: An image is a static read-only blueprint template; a container is a running,
        writable instance of that image
      is_correct: true
    - letter: C
      text: Containers are stored on Docker Hub; images only exist locally
      is_correct: false
    correct_fb: ✅ Correct! A Docker Image is the static, read-only template that packages
      your code and dependencies. A Docker Container is the active, live runtime environment
      created by running the image.
    wrong_fb: ❌ Incorrect. Images and containers are not hardware-specific (both can
      run on CPU or GPU), and images are published to Docker Hub, not containers.
      A Docker Image is a static blueprint, whereas a container is a running instance.
      Try B.
  - num_str: QUESTION 4 OF 4
    question: What is the primary operational advantage of multi-stage Docker builds
      in production ML deployment?
    qid: q_day-121_3
    options:
    - letter: A
      text: It separates compilation dependencies from the minimal runtime image,
        reducing attack surface and shrinking image size by up to 80%.
      is_correct: true
    - letter: B
      text: It automatically fine-tunes model weights during the docker build phase.
      is_correct: false
    - letter: C
      text: It converts Python code to native assembly for 10x faster execution without
        libraries.
      is_correct: false
    - letter: D
      text: It forces all inference requests to execute synchronously in single-threaded
        mode.
      is_correct: false
    correct_fb: ✓ Correct! Multi-stage builds compile wheels in a throwaway stage
      and copy only binaries to a lean runtime image.
    wrong_fb: ✗ Incorrect. Multi-stage builds are designed to drastically reduce production
      container image size and eliminate build tool security vulnerabilities.
  flashcards:
  - front: What is a Docker Image?
    back: A read-only, executable template containing instructions to build a Docker
      container, structured in layers.
  - front: What is a Docker Container?
    back: A runnable, isolated instance of a Docker Image that executes in sandboxed
      user-space on the host kernel.
  - front: What is the role of a Docker Registry?
    back: A storage and distribution system for Docker Images (like Docker Hub or
      AWS ECR), allowing sharing across teams and deployment environments.
  - front: What is the difference between a virtual machine (VM) and a Docker container?
    back: A VM includes a full guest OS and hypervisor (virtualized hardware), while
      a Docker container shares the host OS kernel and runs as isolated processes.
  gotcha:
    title: '⚠️ Gotcha: Docker Container GPU Runtime Passthrough'
    description: Always pass `--gpus all` and verify NVIDIA Container Toolkit is initialized
      in production Docker daemon.
  takeaways:
    hinglish_line: "<strong>\n         Ek line mein:\n        </strong>\n        Prometheus\
      \ scraper configs model inference metrics time series databases dashboards alert\
      \ karte hain."
    bullets:
    - Image = blueprint (read-only). Container = running instance. Registry = storage
      &amp; distribution.
    - Containers are ephemeral — data written inside is lost when container is removed.
      Use volumes for persistence.
    - "docker logs -f\n         \n         and\n         \n          docker exec -it\
      \ bash\n         \n         are your primary debugging tools."
    - Containers on the same Docker network can communicate by container name (built-in
      DNS).
    - "docker stop\n         \n         sends SIGTERM (graceful).\n         \n   \
      \       docker kill\n         \n         sends SIGKILL (immediate). Always prefer\
      \ stop for ML workloads."
