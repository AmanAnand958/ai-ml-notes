  quizzes:
  - num_str: Q1 OF 5
    question: In a Flask + Gunicorn setup with 4 workers, where should you load your
      ML model to avoid loading it on every request?
    qid: q124_1
    options:
    - letter: A
      text: Inside the view function, using a local variable
      is_correct: false
      id: a
    - letter: B
      text: At module level or in create_app() — loaded once per worker process when
        Gunicorn forks, then reused across all reque...
      is_correct: true
      id: b
    - letter: C
      text: In a before_request hook so it loads fresh each time
      is_correct: false
      id: c
    - letter: D
      text: In a separate thread that shares the model via a global queue
      is_correct: false
      id: d
    correct_fb: ✅ Correct. With Gunicorn -w 4, there are 4 worker processes. Each
      loads the model once at startup. All requests to that worker reuse the loaded
      model. Loading in the view function would load the model on every single request
      — potentially seconds of latency each time.
    wrong_fb: ❌ Load the model at module level or in create_app(). Gunicorn workers
      are forked after app initialisation, so each worker inherits the loaded model.
      Loading per-request = O(seconds) latency overhead = unacceptable in production.
    correct: b
  - num_str: Q2 OF 5
    question: Why does the Flask app in docker-compose NOT expose port 5000 to the
      host, while Nginx DOES expose port 80?
    qid: q124_2
    options:
    - letter: A
      text: Defence in depth — Flask should only be accessible through Nginx, not
        directly from the internet. Nginx handles SSL, ...
      is_correct: true
      id: a
    - letter: B
      text: Docker requires one container to own each port
      is_correct: false
      id: b
    - letter: C
      text: Flask can't bind to external interfaces
      is_correct: false
      id: c
    - letter: D
      text: Port 5000 is reserved by the OS
      is_correct: false
      id: d
    correct_fb: '✅ Exactly. The pattern is: expose only the reverse proxy (Nginx on
      80/443), keep app servers (Gunicorn) and data stores (Redis) internal to the
      Docker network. This is the standard "proxy + app + data" separation used in
      production. Only Nginx needs to be internet-facing.'
    wrong_fb: ❌ It's a security architecture decision. Only Nginx should be internet-accessible.
      Flask runs on the internal Docker network — Nginx proxies to it by container
      name. This prevents clients from bypassing Nginx (and its rate limiting, SSL
      termination, etc.) by hitting Flask directly.
    correct: a
  - num_str: Q3 OF 5
    question: You changed one line in app.py. With proper Dockerfile layer ordering,
      which layers need to be rebuilt?
    qid: q124_3
    options:
    - letter: A
      text: All layers from scratch including pip install
      is_correct: false
      id: a
    - letter: B
      text: Only the "COPY . ." layer and everything after it. The base image, apt-get,
        and pip install layers are cached and reu...
      is_correct: true
      id: b
    - letter: C
      text: Only the CMD layer changes
      is_correct: false
      id: c
    - letter: D
      text: The entire image is always rebuilt from scratch
      is_correct: false
      id: d
    correct_fb: '✅ Right. Order: FROM (cache hit) → RUN apt-get (cache hit) → COPY
      requirements.txt (cache hit) → RUN pip install (cache hit) → COPY models/ (cache
      hit) → COPY . . (CACHE MISS — app.py changed) → USER/EXPOSE/CMD (rebuilt). Result:
      rebuild in ~5 seconds instead of ~3 minutes.'
    wrong_fb: ❌ With correct layer ordering (requirements first, source last), changing
      app.py only invalidates the COPY . . layer and everything after. Base image,
      apt-get, pip install all hit the cache. That's why layer ordering is so important
      — it determines rebuild time.
    correct: b
  - num_str: Q4 OF 5
    question: 'Your Flask /predict endpoint receives {"features": "5.1,3.5,1.4,0.2"}
      (a string, not a list). What HTTP status code and response should you return?'
    qid: q124_4
    options:
    - letter: A
      text: 200 OK — try to parse the string automatically
      is_correct: false
      id: a
    - letter: B
      text: '422 Unprocessable Entity — valid JSON but wrong type for the features
        field; return field-level error: {"error": "Val...'
      is_correct: true
      id: b
    - letter: C
      text: 400 Bad Request — the JSON is malformed
      is_correct: false
      id: c
    - letter: D
      text: 500 Internal Server Error — let numpy handle the bad input
      is_correct: false
      id: d
    correct_fb: ✅ Correct. The JSON is syntactically valid (a string is legal JSON).
      The problem is semantic — the field type is wrong. 422 is the correct code for
      semantic validation failures. Never let bad input reach numpy/sklearn — always
      validate input types and shapes at the API boundary.
    wrong_fb: '❌ The JSON is valid — it''s {"features": "5.1,3.5,1.4,0.2"} which parses
      fine. But the value is a string, not a list. That''s a 422 (semantic error).
      400 = syntax/parse error. 500 = never intentionally return this from bad user
      input. Always validate at the API boundary.'
    correct: b
  - num_str: Q5 OF 5
    question: "What is the purpose of\n         \n          depends_on: condition:\
      \ service_healthy\n         \n         in docker-compose, and what must you\
      \ define on the dependency for it to work?"
    qid: q124_5
    options:
    - letter: A
      text: It's the same as depends_on with no condition — just a newer syntax
      is_correct: false
      id: a
    - letter: B
      text: It delays the dependent service from starting until the dependency passes
        its healthcheck. The dependency service mus...
      is_correct: true
      id: b
    - letter: C
      text: It automatically restarts the dependent service if the dependency crashes
      is_correct: false
      id: c
    - letter: D
      text: It requires Docker Swarm mode to work
      is_correct: false
      id: d
    correct_fb: "✅ Exactly. Without\n         \n          condition: service_healthy\n\
      \         \n         , depends_on only waits for the container to START (not\
      \ to be ready). Redis might be starting but not ready to accept connections\
      \ when Flask boots. The healthcheck block (test: redis-cli ping) defines what."
    wrong_fb: "❌ depends_on without condition only waits for the container process\
      \ to start — not for the service inside to be ready. Redis takes ~1 second to\
      \ initialise.\n         \n          condition: service_healthy\n         \n\
      \         polls the healthcheck (redis-cli ping) until it returns exit 0, then\
      \ starts the dependent service. Requires a healthcheck block on the dependency."
    correct: b
  flashcards:
  - front: Containerized Deploy?
    back: Pushing a packaged Docker container to platforms like Render, Railway, or
      Cloud Run.
  - front: How is Day 124 structured?
    back: It combines theory, hands-on coding tasks, and quizzes. This establishes
      the core invariant in Week 17 Capstone — Deploy a Full ML System to Production,
      ensuring memory efficiency, numerical stability, and robust scaling.
  - front: Where does Day 124 fit in Week 17?
    back: It is a key day in Week 17 (Advanced Production Project, Deployment, Final
      Portfolio Polish).
  - front: Why should ML model weights be loaded in FastAPI/Flask during application
      startup rather than inside the request e...
    back: Loading weights during startup loads the model into RAM/VRAM once; loading
      inside the handler repeats expensive disk I/O on every request and destroys
      latency.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Week 17
      Capstone — Deploy a Full ML System to Production in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation,
      resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Docker Container GPU Runtime Passthrough'
    description: Always pass `--gpus all` and verify NVIDIA Container Toolkit is initialized
      in production Docker daemon.
  takeaways:
    hinglish_line: "<strong>\n         Ek line mein:\n        </strong>\n        Capstone\
      \ production project metrics model health, docker scale checks complete deploy\
      \ show karta hai."
    bullets:
    - 'Flask: factory pattern + blueprints + consistent JSON envelope = production-grade
      API.'
    - Load models at startup (once per Gunicorn worker), not per-request. Return 503
      if model isn't ready.
    - 'Dockerfile golden rules: smallest base, deps before code, non-root user, multi-stage,
      .dockerignore.'
    - Docker Compose orchestrates multi-container stacks. Health checks + depends_on
      ensure correct startup order.
    - Only expose the reverse proxy (Nginx) publicly. Flask + Redis stay internal
      to the Docker network.
    - Redis caching on identical predictions = massive latency reduction + cost savings
      at scale.
