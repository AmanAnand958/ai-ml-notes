  - Image pushed to Docker Hub — anyone can run your ML API in one command.
  checklist: []
  concept_flow:
  - Flask Fundamentals — Rout
  - REST API Design — JSON, S
  - Serving ML Models with Fl
  - Docker Fundamentals — Con
  - Writing Dockerfiles — Mul
  - Docker Compose — Multi-Co
  - Week 17 Capstone — Deploy
  hinglish: 'Service mesh (Istio): microservices ke beech traffic management, security,
    observability add karo without code changes. Production-grade ML systems mein
    ye increasingly common hai!'
  analogy: A Capstone production project is like launching a commercial rocket. You
    configure booster weights (model files), check telemetry (monitoring), and scale
    engines (docker clusters) for launch.
  theory_html: "<div id=\"capstone17-theory-deep-dive\" style=\"margin: 1.2rem 0;\
    \ line-height: 1.7; font-size: 14px;\">\n<p><strong>Production ML Deployment Capstone\
    \ Architecture:</strong> Building a resilient, enterprise-grade model inference\
    \ service requires orchestrating five decoupled layers:</p>\n<div style=\"background:\
    \ var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 14px;\
    \ margin: 1rem 0;\">\n<h4 style=\"color: var(--accent); margin-top: 0; margin-bottom:\
    \ 8px; font-size: 14px;\">\U0001F3D7️ End-to-End System Specifications:</h4>\n\
    <ul style=\"margin: 0; padding-left: 20px; font-size: 13.5px; color: var(--text);\"\
    >\n<li><strong>Inference Engine (FastAPI):</strong> Asynchronous, non-blocking\
    \ HTTP REST/gRPC API with Pydantic request/response schema validation, automated\
    \ Swagger OpenAPI documentation, and batch inference support.</li>\n<li><strong>Containerization\
    \ (Docker Multi-Stage Build):</strong> Minimal alpine/distroless production image\
    \ (&lt;250MB) with non-root security user and pre-warmed model weight cache.</li>\n\
    <li><strong>Telemetry &amp; Observability (Prometheus &amp; Grafana):</strong>\
    \ Custom middleware exporting real-time p50/p95/p99 inference latency, requests\
    \ per second (RPS), error rates, and GPU memory utilization metrics.</li>\n<li><strong>Service\
    \ Orchestration (Docker Compose):</strong> Multi-container bridge network orchestrating\
    \ API server replicas behind an NGINX reverse proxy with TLS termination.</li>\n\
    </ul>\n</div>\n</div>\n<h2 class=\"sh2\">\n       \U0001F3D7️ Architecture Overview\n\
    \      </h2>\n<div class=\"mermaid\">\ngraph LR\n  Client[\"Client - curl / browser\"\
    ]\n  Nginx[\"Nginx - port 80\"]\n  Flask[\"Flask + Gunicorn - port 5000\"]\n \
    \ Redis[\"Redis - port 6379\"]\n  Model[\"ML Model - joblib pipeline\"]\n  DockerHub[\"\
    Docker Hub Registry\"]\n  Client --&gt;|HTTP| Nginx\n  Nginx --&gt;|proxy_pass|\
    \ Flask\n  Flask --&gt;|cache| Redis\n  Flask --&gt;|predict| Model\n  Flask -.-&gt;|push|\
    \ DockerHub\nstyle Nginx fill:#2a3050,stroke:#6c8cff\nstyle Flask fill:#2a3050,stroke:#4fd1a5\n\
    style Redis fill:#2a3050,stroke:#f7a94b\nstyle Model fill:#2a3050,stroke:#b47cfc\n\
    style DockerHub fill:#2a3050,stroke:#38bdf8\n</div>\n<h3 class=\"sh3\">\n    \
    \   Capstone Requirements Checklist\n      </h3>\n<div class=\"table-wrap\" style=\"\
    overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\"\
    >\n<tr>\n<th>\n         Component\n        </th>\n<th>\n         Requirement\n\
    \        </th>\n<th>\n         Verify With\n        </th>\n</tr>\n<tr>\n<td>\n\
    \         ML Model\n        </td>\n<td>\n         Trained sklearn Pipeline, saved\
    \ with joblib, metadata file\n        </td>\n<td>\n         python -c \"import\
    \ joblib; print(joblib.load('model.joblib'))\"\n        </td>\n</tr>\n<tr>\n<td>\n\
    \         Flask API\n        </td>\n<td>\n         Factory pattern, 2+ blueprints,\
    \ consistent JSON envelope, 422 validation\n        </td>\n<td>\n         pytest\
    \ tests/test_api.py\n        </td>\n</tr>\n<tr>\n<td>\n         Dockerfile\n \
    \       </td>\n<td>\n         Multi-stage, non-root, .dockerignore, &lt; 500MB\
    \ final image\n        </td>\n<td>\n         docker image ls\n        </td>\n\
    </tr>\n<tr>\n<td>\n         Compose\n        </td>\n<td>\n         3 services\
    \ (Flask+Redis+Nginx), health checks, depends_on healthy\n        </td>\n<td>\n\
    \         docker compose ps (all Healthy)\n        </td>\n</tr>\n<tr>\n<td>\n\
    \         Caching\n        </td>\n<td>\n         Redis caching on /predict, cache\
    \ key from features hash\n        </td>\n<td>\n         curl twice with same features\
    \ → 2nd has cache: hit\n        </td>\n</tr>\n<tr>\n<td>\n         Docker Hub\n\
    \        </td>\n<td>\n         Image pushed, README with pull command\n      \
    \  </td>\n<td>\n         docker pull youruser/image:v1\n        </td>\n</tr>\n\
    </table></div>\n<h3 class=\"sh3\">\n       Quick Deployment Reference\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       This reference table summarizes the essential bash commands needed for\
    \ fast container building, stack starting, and log monitoring in staging.\n  \
    \    </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         BASH — FULL DEPLOY COMMANDS\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"cm\"># 1. Build and tag</span>\ndocker build --target runtime -t youruser/ml-api:v1\
    \ .\n\n<span class=\"cm\"># 2. Test locally</span>\ndocker run --rm -p <span class=\"\
    num\">5000</span>:<span class=\"num\">5000</span> \\\n  -v $(pwd)/models:/app/models:ro\
    \ \\\n  -e MODEL_PATH=/app/models/iris_pipeline_v1.joblib \\\n  youruser/ml-api:v1\n\
    \n<span class=\"cm\"># 3. Test API</span>\ncurl http://localhost:<span class=\"\
    num\">5000</span>/health/ready\ncurl -X POST http://localhost:<span class=\"num\"\
    >5000</span>/api/v1/predict \\\n  -H <span class=\"str\">\"Content-Type: application/json\"\
    </span> \\\n  -d <span class=\"str\">'{\"features\": [5.1, 3.5, 1.4, 0.2]}'</span>\n\
    \n<span class=\"cm\"># 4. Push to Docker Hub</span>\ndocker login\ndocker push\
    \ youruser/ml-api:v1\n\n<span class=\"cm\"># 5. Start full stack with Compose</span>\n\
    docker compose up -d\ndocker compose ps              <span class=\"cm\"># verify\
    \ all Healthy</span>\n\n<span class=\"cm\"># 6. Test through Nginx (port 80)</span>\n\
    curl http://localhost/api/v1/predict \\\n  -X POST -H <span class=\"str\">\"Content-Type:\
    \ application/json\"</span> \\\n  -d <span class=\"str\">'{\"features\": [5.1,\
    \ 3.5, 1.4, 0.2]}'</span>\n\n<span class=\"cm\"># 7. Verify Redis caching</span>\n\
    curl -X POST http://localhost/api/v1/predict \\\n  -H <span class=\"str\">\"Content-Type:\
    \ application/json\"</span> \\\n  -d <span class=\"str\">'{\"features\": [5.1,\
    \ 3.5, 1.4, 0.2]}'</span>   <span class=\"cm\"># → cache: \"hit\"</span>\n\n<span\
    \ class=\"cm\"># 8. Clean up</span>\ndocker compose down -v         <span class=\"\
    cm\"># --volumes removes redis-data volume too</span></pre>\n</div>\n<h2 class=\"\
    sh2\">\n       ⚡ Capstone Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size:\
    \ 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\">\n       \U0001F50D\
    \n       <strong>\n        Search terms:\n       </strong>\n\n        low latency\
    \ machine learning serving docker clusters, model serving performance benchmarks\
    \ container\n       \n</div>\n<div class=\"debug-block\">\n<div class=\"debug-label\"\
    >\n        \U0001F6E0️ WEEKLY DEBUGGING CHALLENGE\n       </div>\n<h3 style=\"\
    font-family:var(--font-head); font-size:14px; margin-bottom:0.5rem; color:var(--pink);\"\
    >\n        Debug: Database Connection Refused in Compose Container\n       </h3>\n\
    <p style=\"font-size:13px; margin-bottom:0.8rem; line-height:1.6;\">\n       \
    \ A containerized API fails to connect to the database container, throwing a connection\
    \ refused exception.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button><button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">Run</button></div>\n\
    </div>\n<pre><span class=\"cm\"># Configuration inside compose container trying\
    \ to reach database service</span>\nDB_URL = <span class=\"str\">\"postgresql://user:pass@127.0.0.1:5432/dbname\"\
    </span></pre>\n</div>\n<button class=\"solution-toggle\" onclick=\"toggleSolution('debug-sol-17')\"\
    >\n<span>\n         \U0001F50D Reveal Bug &amp; Fix\n        </span>\n</button>\n\
    <div class=\"solution-box\" id=\"debug-sol-17\">\n<div class=\"sol-header\">\n\
    \         SOLUTION &amp; EXPLANATION\n        </div>\n<div style=\"padding:1rem;\
    \ background:rgba(0,0,0,0.2); font-size:13px; line-height:1.6;\">\n<strong>\n\
    \          The Bug:\n         </strong>\n         Each container in Docker runs\
    \ on its own isolated loopback network. Using 127.0.0.1 inside a container resolves\
    \ to that container itself, not the host machine or other containers. In Docker\
    \ Compose networks, containers communicate using service names as hostname aliases.\n\
    \         <br/>\n<br/>\n<strong>\n          The Fix:\n         </strong>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         \
    \   python\n           </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n             copy\n            </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\">\n             Run\n           \
    \ </button>\n</div>\n</div>\n<pre><span class=\"cm\"># Connect using the compose\
    \ service name ('db') instead of localhost</span>\nDB_URL = <span class=\"str\"\
    >\"postgresql://user:pass@db:5432/dbname\"</span></pre>\n</div>\n</div>\n</div>\n\
    </div><h2 class=\"sh2\">\n        \U0001F0CF Revision Flashcards — Day 124\n \
    \      </h2><p class=\"flashcard-hint\" style=\"font-size: 12px; font-family:var(--font-mono);\
    \ color:var(--muted); text-transform:uppercase; margin-bottom:8px;\">\n      \
    \  CLICK EACH CARD TO FLIP ↓\n       </p>\n<div class=\"resource-section\" style=\"\
    margin-top:1.5rem;\">\n<h3 style=\"font-size:14px; font-weight:700; color:var(--text);\
    \ margin-bottom:10px;\">\n        \U0001F4DA Recommended Resources\n       </h3>\n\
    <div --=\"\" <!--=\"\" day-124=\"\">\n<!-- /day-section -->\n</div>\n</div>"
