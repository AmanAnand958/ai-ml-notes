  tasks:
  - title: ML API with Full REST Design
    badge: MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n         Build a complete REST API for a scikit-learn model\
      \ (use any model from weeks 5-7 or a fresh Iris classifier). Implement: consistent\
      \ JSON envelope on all responses, request logging middleware with request IDs,\
      \ rate limiting (20/min on /predict, 100/hour global), API versioning at /api/v1/,\
      \ and a /health/ready endpoint that returns 503 if the model isn't loaded. Write\
      \ 5 curl commands in a test.sh file covering: happy path, 400 error, 422 error,\
      \ rate limit hit, health check.\n        </p>"
    done_when: All curl commands produce expected status codes. Logs show request
      ID and timing for every request.
    git_cmd: 'git add . &amp;&amp; git commit -m "day119: complete day 119 tasks and
      coding exercises"'
    sol_id: sol-w17t4
    solution_title: ✅ COMPLETE SOLUTION — ml_api_with_full_rest_design.py
    solution_code: "<span class=\"cm\">#!/usr/bin/env bash</span>\n<span class=\"\
      cm\"># Production Gunicorn Multi-Worker Process Deployment</span>\n<span class=\"\
      cm\"># Formula for worker processes: (2 x $NUM_CORES) + 1</span>\n\nNUM_CORES=$(nproc)\n\
      WORKERS=$(( (<span class=\"num\">2</span> * NUM_CORES) + <span class=\"num\"\
      >1</span> ))\nTHREADS_PER_WORKER=<span class=\"num\">4</span>\nBIND_ADDRESS=<span\
      \ class=\"str\">\"0.0.0.0:5000\"</span>\nTIMEOUT=<span class=\"num\">60</span>\n\
      \necho <span class=\"str\">\"\U0001F680 Starting Gunicorn WSGI Server with ${WORKERS}\
      \ workers and ${THREADS_PER_WORKER} threads/worker...\"</span>\n\nexec gunicorn\
      \ \\\n    --workers=${WORKERS} \\\n    --threads=${THREADS_PER_WORKER} \\\n\
      \    --bind=${BIND_ADDRESS} \\\n    --timeout=${TIMEOUT} \\\n    --worker-<span\
      \ class=\"kw\">class</span>=gthread \\\n    --access-logfile=- \\\n    --error-logfile=-\
      \ \\\n    --log-level=info \\\n    app:app"
    solution_lang: bash
  quizzes:
  - num_str: Q1 OF 2
    question: Why should REST APIs use plural nouns (e.g., /predictions) rather than
      verbs in endpoints?
    qid: q119_1
    options:
    - letter: A
      text: Verbs cause network failures on client-side requests
      is_correct: false
    - letter: B
      text: REST is resources-centric; actions are represented by HTTP methods (GET,
        POST), not endpoint paths
      is_correct: true
    - letter: C
      text: It is a routing requirement enforced by Gunicorn and nginx
      is_correct: false
    correct_fb: ✅ Correct! REST endpoints represent resources (nouns). The action
      is defined by HTTP verbs (like GET, POST, DELETE). For example, creating a prediction
      is POST /predictions, not POST /predict.
    wrong_fb: ❌ Incorrect. The choice of nouns over verbs is a REST architectural
      convention (resources represent nouns, while HTTP methods represent verbs).
      It is not enforced by servers or networks. Try B.
  - num_str: QUESTION 4 OF 4
    question: What is the primary operational advantage of multi-stage Docker builds
      in production ML deployment?
    qid: q_day-119_3
    options:
    - letter: A
      text: It separates compilation dependencies from the minimal runtime image,
        reducing attack surface and shrinking image size by up to 80%.
      is_correct: true
    - letter: B
      text: It automatically fine-tunes model weights during the docker build phase.
      is_correct: false
    - letter: C
      text: It converts Python code to native assembly for 10x faster execution without
        libraries.
      is_correct: false
    - letter: D
      text: It forces all inference requests to execute synchronously in single-threaded
        mode.
      is_correct: false
    correct_fb: ✓ Correct! Multi-stage builds compile wheels in a throwaway stage
      and copy only binaries to a lean runtime image.
    wrong_fb: ✗ Incorrect. Multi-stage builds are designed to drastically reduce production
      container image size and eliminate build tool security vulnerabilities.
  flashcards:
  - front: What is a REST API?
    back: An architectural style for designing networked applications using HTTP requests
      to GET, POST, PUT, or DELETE resources.
  - front: What is HTTP Status Code 201?
    back: Created, indicating that the request succeeded and a new resource was successfully
      created on the server.
  - front: What is the importance of API versioning?
    back: It allows developers to release breaking changes to endpoints without breaking
      existing client integrations (e.g., /api/v1/ vs /api/v2/).
  - front: Why is JSON the standard data format for REST APIs?
    back: Because it is lightweight, human-readable, and supported natively by JavaScript
      and almost all backend programming languages.
  gotcha:
    title: '⚠️ Gotcha: Docker Container GPU Runtime Passthrough'
    description: Always pass `--gpus all` and verify NVIDIA Container Toolkit is initialized
      in production Docker daemon.
  takeaways:
    hinglish_line: "<strong>\n         Ek line mein:\n        </strong>\n        Kubernetes\
      \ clusters pod allocations load balancing services serving systems scale up\
      \ karte hain."
    bullets:
    - REST URLs are nouns (resources), not verbs. POST /predict, not POST /run-prediction.
    - 'Use a consistent JSON envelope: {success, data, error, request_id, timestamp}
      on every response.'
    - before_request / after_request hooks are Flask's middleware — use for logging,
      auth, timing.
    - Attach X-Request-ID to every response for distributed tracing and debugging.
    - Rate-limit expensive ML endpoints (inference can be costly) — flask-limiter
      makes this trivial.
