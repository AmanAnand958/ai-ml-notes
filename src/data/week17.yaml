  tasks:
  - title: Full ML Stack with Compose
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n         Build the full 3-container stack: Flask ML API + Redis\
      \ + Nginx. Requirements: docker-compose.yml with all 3 services, health checks\
      \ on Flask and Redis, flask depends_on Redis (healthy), nginx.conf that proxies\
      \ /api/ to Flask, prediction caching with Redis (return cache: \"hit\" or \"\
      miss\" in response), .env file for secrets. Verify:\n         \n          docker\
      \ compose up -d\n         \n         brings all services healthy, curl to port\
      \ 80 works, second identical prediction returns cache: \"hit\",\n         \n\
      \          docker compose down -v\n         \n         cleans everything.\n\
      \        </p>"
    done_when: All 3 containers show Healthy. Cache hit on repeated identical predictions.
      Nginx access log shows requests proxied correctly.
    git_cmd: 'git add . &amp;&amp; git commit -m "day123: complete day 123 tasks and
      coding exercises"'
    sol_id: sol-w17t10
    solution_title: ✅ COMPLETE SOLUTION — full_ml_stack_with_compose.py
    solution_code: "<span class=\"cm\"># full_ml_stack_with_compose.py — Solution</span>\n\
      <span class=\"cm\"># Complete solution for: Full ML Stack with Compose</span>\n\
      \n<span class=\"cm\"># FastAPI RAG Application with ChromaDB</span>\n<span class=\"\
      cm\"># pip install fastapi uvicorn chromadb sentence-transformers openai</span>\n\
      \n<span class=\"kw\">from</span> fastapi <span class=\"kw\">import</span> FastAPI,\
      \ HTTPException\n<span class=\"kw\">from</span> pydantic <span class=\"kw\"\
      >import</span> BaseModel\n<span class=\"kw\">import</span> chromadb\n<span class=\"\
      kw\">from</span> chromadb.utils.embedding_functions <span class=\"kw\">import</span>\
      \ SentenceTransformerEmbeddingFunction\n<span class=\"kw\">from</span> openai\
      \ <span class=\"kw\">import</span> OpenAI\n<span class=\"kw\">import</span>\
      \ os\n\napp = <span class=\"fn\">FastAPI</span>(title=<span class=\"str\">\"\
      RAG API\", version=\"1.0\"</span>)\nclient = <span class=\"fn\">OpenAI</span>()\n\
      \n<span class=\"cm\"># 1. Initialize ChromaDB with embeddings</span>\nembed_fn\
      \ = <span class=\"fn\">SentenceTransformerEmbeddingFunction</span>(model_name=<span\
      \ class=\"str\">\"all-MiniLM-L6-v2\"</span>)\nchroma = chromadb.<span class=\"\
      fn\">PersistentClient</span>(path=<span class=\"str\">\"./chroma_db\"</span>)\n\
      collection = chroma.<span class=\"fn\">get_or_create_collection</span>(<span\
      \ class=\"str\">\"knowledge_base\"</span>, embedding_function=embed_fn)\n\n\
      <span class=\"cm\"># 2. Models</span>\n<span class=\"kw\">class</span> <span\
      \ class=\"cls\">Document</span>(BaseModel):\n    text: str\n    metadata: dict\
      \ = {}\n\n<span class=\"kw\">class</span> <span class=\"cls\">Query</span>(BaseModel):\n\
      \    question: str\n    top_k: int = <span class=\"num\">3</span>\n\n<span class=\"\
      kw\">class</span> <span class=\"cls\">Answer</span>(BaseModel):\n    answer:\
      \ str\n    sources: list[str]\n\n<span class=\"cm\"># 3. Endpoints</span>\n\
      @app.<span class=\"fn\">post</span>(<span class=\"str\">\"/ingest\"</span>)\n\
      <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"\
      fn\">ingest_document</span>(doc: Document):\n    <span class=\"str\">\"\"\"\
      Add a document to the knowledge base.\"\"\"</span>\n    doc_id = <span class=\"\
      str\">f\"doc_{collection.count()}\"</span>\n    collection.<span class=\"fn\"\
      >add</span>(\n        documents=[doc.text],\n        metadatas=[doc.metadata],\n\
      \        ids=[doc_id],\n    )\n    <span class=\"kw\">return</span> {<span class=\"\
      str\">\"status\": \"ingested\", \"id\": doc_id, \"total_docs\"</span>: collection.<span\
      \ class=\"fn\">count</span>()}\n\n@app.<span class=\"fn\">post</span>(<span\
      \ class=\"str\">\"/query\"</span>, response_model=Answer)\n<span class=\"kw\"\
      >async</span> <span class=\"kw\">def</span> <span class=\"fn\">query_rag</span>(query:\
      \ Query):\n    <span class=\"str\">\"\"\"Query the RAG pipeline: retrieve +\
      \ generate.\"\"\"</span>\n    <span class=\"kw\">if</span> collection.<span\
      \ class=\"fn\">count</span>() == <span class=\"num\">0</span>:\n        <span\
      \ class=\"kw\">raise</span> <span class=\"fn\">HTTPException</span>(<span class=\"\
      num\">400</span>, <span class=\"str\">\"No documents ingested yet\"</span>)\n\
      \    \n    <span class=\"cm\"># Retrieve</span>\n    results = collection.<span\
      \ class=\"fn\">query</span>(query_texts=[query.question], n_results=query.top_k)\n\
      \    chunks = results[<span class=\"str\">\"documents\"</span>][<span class=\"\
      num\">0</span>]\n    \n    <span class=\"cm\"># Generate</span>\n    context\
      \ = <span class=\"str\">\"\\n\\n\".join(f\"[Source {i+1}]: {c}\"</span> <span\
      \ class=\"kw\">for</span> i, c <span class=\"kw\">in</span> <span class=\"fn\"\
      >enumerate</span>(chunks))\n    response = client.chat.completions.<span class=\"\
      fn\">create</span>(\n        model=<span class=\"str\">\"gpt-4o-mini\"</span>,\n\
      \        messages=[\n            {<span class=\"str\">\"role\": \"system\",\
      \ \"content\": \"Answer using ONLY the provided context. Cite sources as [Source\
      \ N].\"</span>},\n            {<span class=\"str\">\"role\": \"user\", \"content\"\
      : f\"Context:\\n{context}\\n\\nQuestion: {query.question}\"</span>},\n     \
      \   ],\n        temperature=<span class=\"num\">0</span>,\n    )\n    \n   \
      \ <span class=\"kw\">return</span> <span class=\"fn\">Answer</span>(answer=response.choices[<span\
      \ class=\"num\">0</span>].message.content, sources=chunks)\n\n@app.<span class=\"\
      fn\">get</span>(<span class=\"str\">\"/health\"</span>)\n<span class=\"kw\"\
      >async</span> <span class=\"kw\">def</span> <span class=\"fn\">health</span>():\n\
      \    <span class=\"kw\">return</span> {<span class=\"str\">\"status\": \"ok\"\
      , \"documents\"</span>: collection.<span class=\"fn\">count</span>()}\n\n<span\
      \ class=\"cm\"># Run: uvicorn main:app --reload</span>\n\n<span class=\"kw\"\
      >if</span> <span class=\"kw\">True</span>:\n        <span class=\"kw\">pass</span>\
      \ <span class=\"cm\"># Task Complete</span>"
    solution_lang: python
  quizzes:
  - num_str: Q1 OF 2
    question: "What does\n         \n          depends_on\n         \n         do\
      \ in a docker-compose.yml configuration?"
    qid: q123_1
    options:
    - letter: A
      text: It bridges virtual network adapters between remote hosts
      is_correct: false
    - letter: B
      text: It defines dependency boot order, starting specified containers before
        launching the current container
      is_correct: true
    - letter: C
      text: It mounts local host paths inside database containers
      is_correct: false
    correct_fb: '✅ Correct! The depends_on property defines startup order: Gunicorn/FastAPI
      depends_on Redis and PostgreSQL, ensuring the databases boot up first before
      the ML web server starts.'
    wrong_fb: ❌ Incorrect. depends_on only controls startup and shutdown order, not
      mounting local paths or bridging adapters. It ensures required dependency containers
      are booted up first. Try B.
  - num_str: QUESTION 4 OF 4
    question: What is the primary operational advantage of multi-stage Docker builds
      in production ML deployment?
    qid: q_day-123_3
    options:
    - letter: A
      text: It separates compilation dependencies from the minimal runtime image,
        reducing attack surface and shrinking image size by up to 80%.
      is_correct: true
    - letter: B
      text: It automatically fine-tunes model weights during the docker build phase.
      is_correct: false
    - letter: C
      text: It converts Python code to native assembly for 10x faster execution without
        libraries.
      is_correct: false
    - letter: D
      text: It forces all inference requests to execute synchronously in single-threaded
        mode.
      is_correct: false
    correct_fb: ✓ Correct! Multi-stage builds compile wheels in a throwaway stage
      and copy only binaries to a lean runtime image.
    wrong_fb: ✗ Incorrect. Multi-stage builds are designed to drastically reduce production
      container image size and eliminate build tool security vulnerabilities.
  flashcards:
  - front: What is Docker Compose?
    back: A tool for defining and running multi-container Docker applications, configured
      using a docker-compose.yml file.
  - front: Why is Docker Compose useful for ML stacks?
    back: It lets you launch the web app, vector database, and cache database (e.g.,
      Redis) simultaneously with single-command orchestration and pre-defined network
      routing.
  - front: What is a Volume in Docker Compose?
    back: A mechanism to persist data generated and used by Docker containers, mapping
      container directories to host machine directories.
  - front: How do containers communicate with each other in Docker Compose?
    back: Through a shared bridge network, allowing containers to resolve each other
      by service name (e.g., http://vector-db:8000).
  gotcha:
    title: '⚠️ Gotcha: Docker Container GPU Runtime Passthrough'
    description: Always pass `--gpus all` and verify NVIDIA Container Toolkit is initialized
      in production Docker daemon.
  takeaways:
    hinglish_line: "<strong>\n         Ek line mein:\n        </strong>\n        CI/CD\
      \ workflows test suites models quality assertions checks automated execute karte\
      \ hain."
    bullets:
    - Docker Compose is infrastructure as code — your entire stack in one YAML file,
      reproducible anywhere.
    - Use container names as hostnames for inter-service communication (flask-app
      → redis by name).
    - 'Health checks + depends_on: condition: service_healthy ensure correct startup
      order.'
    - Only expose the nginx port publicly (80/443) — Flask port stays internal to
      the Docker network.
    - Redis caching for identical ML predictions can reduce compute cost by 90%+ for
      repetitive inputs.
