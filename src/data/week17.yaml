    fn\">jsonify</span>({<span class=\"str\">\"error\"</span>: <span class=\"fn\"\
    >str</span>(e)}), <span class=\"num\">500</span>\n\n<span class=\"kw\">if</span>\
    \ __name__ == <span class=\"str\">'__main__'</span>:\n    app.<span class=\"fn\"\
    >run</span>(host=<span class=\"str\">'0.0.0.0'</span>, port=<span class=\"num\"\
    >5000</span>, debug=<span class=\"kw\">False</span>)</pre>\n</div>\n\n<h3 class=\"\
    sh3\">\n       2. Application Factory Pattern\n      </h3>\n<p>\n       Production\
