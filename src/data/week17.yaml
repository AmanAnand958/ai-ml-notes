      if model isn't ready.
    - 'Dockerfile golden rules: smallest base, deps before code, non-root user, multi-stage,
      .dockerignore.'
    - Docker Compose orchestrates multi-container stacks. Health checks + depends_on
      ensure correct startup order.
    - Only expose the reverse proxy (Nginx) publicly. Flask + Redis stay internal
      to the Docker network.
    - Redis caching on identical predictions = massive latency reduction + cost savings
      at scale.
