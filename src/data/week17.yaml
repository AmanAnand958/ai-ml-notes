  flashcards:
  - front: What is Docker Compose?
    back: A tool for defining and running multi-container Docker applications, configured
      using a docker-compose.yml file.
  - front: Why is Docker Compose useful for ML stacks?
    back: It lets you launch the web app, vector database, and cache database (e.g.,
      Redis) simultaneously with single-command orchestration and pre-defined network
      routing.
  - front: What is a Volume in Docker Compose?
    back: A mechanism to persist data generated and used by Docker containers, mapping
      container directories to host machine directories.
  - front: How do containers communicate with each other in Docker Compose?
    back: Through a shared bridge network, allowing containers to resolve each other
      by service name (e.g., http://vector-db:8000).
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Docker
      Compose — Multi-Container ML Stacks in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation,
      resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
