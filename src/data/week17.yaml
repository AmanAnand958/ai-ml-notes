    question: How does Docker layer caching optimize container builds?
    qid: q122_1
    options:
    - letter: A
      text: It skips execution of layers that have no code changes since the last
        build
      is_correct: true
      id: a
    - letter: B
      text: It compresses libraries to reduce network usage
      is_correct: false
      id: b
    - letter: C
