  hinglish: 'Alerting setup karo: agar latency &gt; 200ms ho, accuracy drop ho, ya
    error rate spike kare toh team ko alert jaaye. PagerDuty ya Opsgenie se on-call
    rotation manage karo!'
  analogy: Concept drift is like trying to sell winter coats in a hot summer. Your
    store catalog (model weights) is perfect, but customer behavior (input data distribution)
    has shifted completely. (This mirrors how Writing fundamentally operates.)
  theory_html: "<h3 class=\"sh3\">\n       1. Layer Caching — The Key to Fast Builds\n\
    \      </h3>\n<p>\n       Docker caches each layer. If a layer hasn't changed,\
    \ Docker reuses the cache for that layer AND all subsequent layers. The trick:\n\
    \       <strong>\n        put things that change rarely (dependencies) before\
    \ things that change often (source code)\n       </strong>\n       .\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   DOCKERFILE — BAD (no caching optimization)\n        </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n         \
    \ copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><code><span class=\"cm\"># ❌ BAD: COPY . . before pip install means every\
    \ code change</span>\n<span class=\"cm\"># forces re-installing ALL packages —\
    \ even if requirements.txt didn't change</span>\nFROM python:<span class=\"num\"\
    >3.11</span>-slim\nWORKDIR /app\nCOPY . .                         <span class=\"\
    cm\"># copies everything first</span>\nRUN pip install -r requirements.txt  <span\
    \ class=\"cm\"># cache invalidated on ANY file change!</span>\nCMD [<span class=\"\
    str\">\"gunicorn\", \"app:create_app()\"</span>]</code></pre>\n</div>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         DOCKERFILE\
    \ — GOOD (layer cache optimized)\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span class=\"\
    cm\"># ✅ GOOD: requirements.txt first → pip install cached unless deps change</span>\n\
    FROM python:<span class=\"num\">3.11</span>-slim\n\n<span class=\"cm\"># Install\
    \ system deps (rarely changes → cached almost always)</span>\nRUN apt-get update\
    \ &amp;&amp; apt-get install -y --no-install-recommends \\\n    libgomp1 \\  \
    \                <span class=\"cm\"># needed by scikit-learn</span>\n    &amp;&amp;\
    \ rm -rf /var/lib/apt/lists/*\n\nWORKDIR /app\n\n<span class=\"cm\"># Copy ONLY\
    \ requirements first (changes rarely)</span>\nCOPY requirements.txt .\nRUN pip\
    \ install --no-cache-dir -r requirements.txt\n\n<span class=\"cm\"># Copy model\
    \ artifacts (changes occasionally)</span>\nCOPY models/ ./models/\n\n<span class=\"\
    cm\"># Copy source code LAST (changes most often)</span>\nCOPY . .\n\n<span class=\"\
    cm\"># Security: run as non-root user</span>\nRUN useradd --create-home --shell\
    \ /bin/bash appuser\nUSER appuser\n\nEXPOSE <span class=\"num\">5000</span>\n\
    CMD [<span class=\"str\">\"gunicorn\", \"--workers\", \"4\", \"--bind\", \"0.0.0.0:5000\"\
    , \"--timeout\", \"120\", \"app:create_app()\"</span>]</code></pre>\n</div>\n\
    <h3 class=\"sh3\">\n       2. Multi-Stage Builds for ML Images\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       Multi-stage configurations build CUDA/C++ libraries in dedicated stages,\
    \ copying only the final build binaries to keep runtime images compact.\n    \
    \  </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         DOCKERFILE — MULTI-STAGE (small prod image)\n        </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><code><span class=\"cm\"># Stage 1: Builder — install deps + compile anything\
    \ needed</span>\nFROM python:<span class=\"num\">3.11</span>-slim AS builder\n\
    WORKDIR /build\nCOPY requirements.txt .\nRUN pip install --no-cache-dir --user\
    \ -r requirements.txt\n<span class=\"cm\"># --user installs to ~/.local, easy\
    \ to copy to runtime stage</span>\n\n<span class=\"cm\"># Stage 2: Runtime — only\
    \ what's needed to run</span>\nFROM python:<span class=\"num\">3.11</span>-slim\
    \ AS runtime\nWORKDIR /app\n\n<span class=\"cm\"># Copy installed packages from\
    \ builder stage</span>\nCOPY --<span class=\"kw\">from</span>=builder /root/.local\
    \ /root/.local\n\n<span class=\"cm\"># Copy app source and model</span>\nCOPY\
    \ app/ ./app/\nCOPY models/ ./models/\n\n<span class=\"cm\"># Non-root user</span>\n\
    RUN useradd -m appuser &amp;&amp; chown -R appuser:appuser /app\nUSER appuser\n\
    \n<span class=\"cm\"># Put user packages on PATH</span>\nENV PATH=/root/.local/bin:$PATH\n\
    \nEXPOSE <span class=\"num\">5000</span>\nCMD [<span class=\"str\">\"gunicorn\"\
    , \"-w\", \"4\", \"-b\", \"0.0.0.0:5000\", \"app:create_app()\"</span>]\n\n<span\
    \ class=\"cm\"># Build: docker build --target runtime -t my-ml-app:v1 .</span>\n\
    <span class=\"cm\"># Result: ~200MB instead of ~800MB for the same app</span></code></pre>\n\
    </div>\n<h3 class=\"sh3\">\n       3. .dockerignore\n      </h3>\n<p style=\"\
    margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\">\n\
    \       The\n       \n        .dockerignore\n       \n       file prevents massive\
    \ dataset files, git histories, and local virtual environments from bloat-copying\
    \ to the Docker build context.\n      </p>\n<div class=\"cb\">\n<div class=\"\
    cb-head\">\n<span class=\"cb-lang\">gitignore</span>\n<div class=\"cb-btns\">\n\
    <button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n     \
    \    </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left:\
    \ 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code>__pycache__\n\
    *.pyc\n*.pyo\n.git\n.gitignore\n.env                    <span class=\"cm\"># NEVER\
    \ include secrets in image!</span>\n*.env\n.venv\nvenv/\n.pytest_cache\ntests/\n\
    notebooks/\n*.ipynb\nREADME.md\ndocs/\n<span class=\"cm\"># Large experiment files\
    \ (keep only production model)</span>\nexperiments/\ncheckpoints/\nmlruns/</code></pre>\n\
    </div>\n<!-- /theory -->\n<h2 class=\"sh2\">\n       ⚡ Tasks\n      </h2>\n<div\
    \ style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\"\
    >\n       \U0001F50D\n       <strong>\n        Search terms:\n       </strong>\n\
    \n        population stability index calculations python math, data drift metrics\
    \ monitoring dashboard\n       \n</div>\n<h2 class=\"sh2\">\n       \U0001F0CF\
    \ Revision Flashcards — Day 122\n      </h2>\n<p class=\"flashcard-hint\" style=\"\
    font-size: 12px; font-family:var(--font-mono); color:var(--muted); text-transform:uppercase;\
    \ margin-bottom:8px;\">\n       CLICK EACH CARD TO FLIP ↓\n      </p>"
