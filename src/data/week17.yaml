week_number: 17
title: Deploy + Flask + Docker
description: 'MLOps containerization & packaging: Dockerizing ML inference servers,
  multi-stage builds, and FastAPI microservices.'
days:
- id: 118
  day_num: 118
  title: Flask Fundamentals — Routes, Views & Blueprints
  subtitle: Ab tak tumne ML models banaye, tune kiye, aur evaluate kiya. Ab unhe duniya
    ke saamne laane ka waqt aa gaya hai. Flask ek micro web framework hai — chhota,
    fast, aur Python-native — jo tumhare model ko ek real HTTP API mein badal deta
    hai.
  time_estimate: 6 hours
  difficulty: Hard
  badges:
  - label: ⚡ Hard
    variant: p
  xp: 150
  objectives:
  - Analyze Flask's request-response cycle and WSGI fundamentals.
  - Create routes with path parameters, query strings, and HTTP methods.
  - Apply Jinja2 templates and return JSON responses.
  - 'Apply: Organise a Flask app using Blueprints for production structure.'
  - Apply Flask's application factory pattern for testable, scalable apps.
  checklist:
  - id: chk_118_1
    text: Derive and analyze mathematical and architectural principles for Flask Fundamentals
      — Routes, Views & Blueprints
  - id: chk_118_2
    text: Build and benchmark production coding pipelines for Flask Fundamentals —
      Routes, Views & Blueprints
  - id: chk_118_3
    text: Execute and validate test verification suite for Flask Route Explorer
  - id: chk_118_4
    text: Evaluate conceptual mastery via interactive flashcards and quiz challenges
  concept_flow:
  - Flask Fundamentals — Routes, Views & Blueprints
  - REST API Design — JSON, Status Codes & Versioning
  - Serving ML Models with Flask — Pickle, Joblib & Gunicorn
  - Docker Fundamentals — Containers, Images & Registry
  - Writing Dockerfiles — Multi-Stage Builds & Best Practices
  - Docker Compose — Multi-Container ML Stacks
  - Week 17 Capstone — Deploy a Full ML System to Production
  hinglish: Pydantic validation ensures ki API correct data receive karta hai. Wrong
    input par clear error messages milte hain. Ye debugging production issues kaafi
    asan karta hai!
  analogy: Flask ko samjho jaise ek post office counter. Ek request aata hai (customer),
    route (@app.route) decide karta hai kaun serve karega (kaunsa clerk), view function
    (clerk) kaam karta hai, aur response wapas jata hai (parcel deliver). Bina route
    ke, request lost ho jaata hai.
