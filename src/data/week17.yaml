  analogy: Docker image is like a Python class — khud kuch nahi karta. Container is
    like us class ka object (instance) — actual kaam karta hai. Registry (Docker Hub)
    is like PyPI — images store karo aur share karo. Ek hi image se hazaro containers
    bana sakte ho simultaneously.
  theory_html: "<div class=\"mermaid\">\ngraph TD\n  PyTorch[\"PyTorch PyFunc Model\
    \ - .pt\"] --&gt; Export[\"Export to ONNX Computational Graph\"]\n  Export --&gt;\
    \ Opt[\"ONNX Graph Optimizations - Layer Fusion &amp; Constant Folding\"]\n  Opt\
    \ --&gt; Quant[\"8-bit Integer Quantization - INT8 Dynamic\"]\n  Quant --&gt;\
    \ Engine[\"ONNX Runtime Engine - CPU AVX-512 / GPU TensorRT\"]\n  Engine --&gt;\
    \ Fast[\"3x–5x Lower Latency &amp; 75% VRAM Reduction\"]\n</div>\n<h3 class=\"\
    sh3\">\n       1. Images vs Containers vs Registry\n      </h3>\n<div class=\"\
    table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table\
    \ class=\"concept-table\">\n<tr>\n<th>\n         Concept\n        </th>\n<th>\n\
    \         Analogy\n        </th>\n<th>\n         Technical Definition\n      \
    \  </th>\n</tr>\n<tr>\n<td>\n<strong>\n          Image\n         </strong>\n</td>\n\
    <td>\n         A blueprint/class in OOP\n        </td>\n<td>\n         Read-only\
    \ layered filesystem snapshot. Built from a Dockerfile.\n        </td>\n</tr>\n\
    <tr>\n<td>\n<strong>\n          Container\n         </strong>\n</td>\n<td>\n \
    \        An instance/object from a class\n        </td>\n<td>\n         A running\
    \ process with its own namespace, isolated from the host.\n        </td>\n</tr>\n\
    <tr>\n<td>\n<strong>\n          Registry\n         </strong>\n</td>\n<td>\n  \
    \       GitHub for images\n        </td>\n<td>\n         A server storing Docker\
    \ images. Docker Hub is public; ECR/GCR are cloud registries.\n        </td>\n\
    </tr>\n<tr>\n<td>\n<strong>\n          Layer\n         </strong>\n</td>\n<td>\n\
    \         Git commit\n        </td>\n<td>\n         Each Dockerfile instruction\
    \ creates an immutable layer. Layers are cached and reused.\n        </td>\n</tr>\n\
    </table></div>\n\n<div class=\"intuition-box\">\n<strong>\n        \U0001F4A1\
    \ Intuition: Why Docker Layer Caching Matters\n       </strong>\n       Docker\
    \ builds images as stacked layers — each\n       \n        RUN\n       \n    \
    \   ,\n       \n        COPY\n       \n       , or\n       \n        ADD\n   \
    \    \n       command creates a new layer. Docker caches each layer and only rebuilds\
    \ from the first changed layer downward. This means: put things that change rarely\
    \ (like\n       \n        pip install requirements.txt\n       \n       ) BEFORE\
    \ things that change often (like\n       \n        COPY . .\n       \n       ).\
    \ A well-ordered Dockerfile rebuilds in seconds; a poorly-ordered one rebuilds\
    \ everything from scratch every time.\n      </div>\n<h3 class=\"sh3\">\n    \
    \   2. Essential Docker CLI\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       Docker CLI commands manage image\
    \ construction, container initialization, network routing, and volume bindings\
    \ across hosts.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n         yaml\n        </span>\n<div class=\"cb-btns\">\n\
    <button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n     \
    \    </button>\n</div>\n</div>\n<pre><code>version: <span class=\"str\">'3.8'</span>\n\
    \nservices:\n  flask-ml-api:\n    build:\n      context: .\n      dockerfile:\
    \ Dockerfile\n    container_name: production-flask-ml\n    restart: always\n \
    \   ports:\n      - <span class=\"str\">\"5000:5000\"</span>\n    environment:\n\
    \      - ENVIRONMENT=production\n      - LOG_LEVEL=info\n      - REDIS_HOST=redis\n\
    \      - REDIS_PORT=<span class=\"num\">6379</span>\n    depends_on:\n      -\
    \ redis\n    networks:\n      - ml-net\n\n  redis:\n    image: redis:<span class=\"\
    num\">7.0</span>-alpine\n    container_name: ml-cache-redis\n    restart: always\n\
    \    ports:\n      - <span class=\"str\">\"6379:6379\"</span>\n    volumes:\n\
    \      - redis-data:/data\n    networks:\n      - ml-net\n\nnetworks:\n  ml-net:\n\
    \    driver: bridge\n\nvolumes:\n  redis-data:</code></pre>\n</div>\n<h3 class=\"\
    sh3\">\n       3. Volumes &amp; Networking\n      </h3>\n<p style=\"margin-top:0.4rem;\
