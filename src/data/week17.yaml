  - front: Why should ML model weights be loaded in FastAPI/Flask during application
      startup rather than inside the request endpoint handler?
    back: Loading weights during startup loads the model into RAM/VRAM once; loading
      inside the handler repeats expensive disk I/O on every request and destroys
      latency.
