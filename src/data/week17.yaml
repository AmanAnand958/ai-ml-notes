    hai!'
  analogy: Database migrations are like updating a city blueprint. You write changes
    to water pipes (schema columns) step-by-step so active buildings don't lose utility
    services. (This mirrors how Serving fundamentally operates.)
  theory_html: "<div class=\"mermaid\">\ngraph TD\n  FastAPI[\"FastAPI ML Service\
    \ - /metrics endpoint\"] --&gt;|Scrape every 15s| Prom[\"Prometheus Time-Series\
    \ Database\"]\n  Prom --&gt; Alert[\"AlertManager - p99 latency over 100ms or\
    \ 5xx over 1%\"]\n  Prom --&gt; Grafana[\"Grafana Real-Time Dashboard - RPS, VRAM,\
    \ Error Rate\"]\n  Alert --&gt; Slack[\"PagerDuty / Slack On-Call Alert\"]\n</div>\n\
    <h3 class=\"sh3\">\n       1. Serializing &amp; Loading Models\n      </h3>\n\
    <p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text); line-height:1.6;\"\
    >\n       Production environments serialize weights using optimized formats (like\
    \ Joblib or ONNX) to ensure secure, cross-platform compatibility.\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   dockerfile\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n</div>\n</div>\n\
    <pre><code><span class=\"cm\"># Multi-Stage Dockerfile for Production Flask ML\
    \ API</span>\n<span class=\"cm\"># Stage 1: Build &amp; Dependencies</span>\n\
    FROM python:<span class=\"num\">3.11</span>-slim <span class=\"kw\">as</span>\
    \ builder\n\nWORKDIR /app\nRUN apt-get update &amp;&amp; apt-get install -y --no-install-recommends\
    \ gcc build-essential &amp;&amp; rm -rf /var/lib/apt/lists/*\n\nCOPY requirements.txt\
    \ .\nRUN pip install --no-cache-dir --user -r requirements.txt\n\n<span class=\"\
    cm\"># Stage 2: Minimal Distroless Production Runtime</span>\nFROM python:<span\
    \ class=\"num\">3.11</span>-slim <span class=\"kw\">as</span> runtime\n\nWORKDIR\
    \ /app\n<span class=\"cm\"># Copy installed dependencies from builder</span>\n\
    COPY --<span class=\"kw\">from</span>=builder /root/.local /root/.local\nENV PATH=/root/.local/bin:$PATH\n\
    \n<span class=\"cm\"># Non-root security user</span>\nRUN useradd -m -u <span\
