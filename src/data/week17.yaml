  - title: Containerise Flask ML App End-to-End
    badge: HARD
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n          Containerise your Day 120 Flask ML app using the\
      \ multi-stage Dockerfile. Requirements: non-root user, .dockerignore, MODEL_PATH\
      \ as ENV variable (not hardcoded), Gunicorn as CMD with 4 workers. Test: (1)\n\
      \          \n           docker build\n          \n          succeeds, (2)\n\
      \          \n           docker run -e MODEL_PATH=/app/models/iris_pipeline_v1.joblib\n\
      \          \n          starts correctly, (3) curl to /health/ready returns 200,\
      \ (4) curl to /api/v1/predict returns a valid prediction, (5) push the image\
      \ to Docker Hub.\n         </p>"
    done_when: "Image is on Docker Hub. Anyone running\n          \n           docker\
      \ run -p 5000:5000 youruser/iris-api:v1\n          \n          gets a working\
      \ ML API (assuming they mount the model file)."
    git_cmd: 'git add containerise_flask_ml_app_end_to_end.py &amp;&amp; git commit
      -m "day122: containerise-flask-ml-app-end-to-end"'
    sol_id: sol-w17t9
    solution_title: ✅ COMPLETE SOLUTION — containerise_flask_ml_app_end_to_end.py
    solution_code: "<span class=\"cm\"># containerise_flask_ml_app_end_to_end.py —\
      \ Solution</span>\n<span class=\"cm\"># Complete solution for: Containerise\
      \ Flask ML App End-to-End</span>\n\n<span class=\"cm\"># Redis Semantic Cache\
      \ + Rate Limiting for FastAPI</span>\n<span class=\"cm\"># pip install fastapi\
      \ redis aioredis slowapi sentence-transformers numpy</span>\n\n<span class=\"\
      kw\">from</span> fastapi <span class=\"kw\">import</span> FastAPI, Request,\
      \ HTTPException\n<span class=\"kw\">from</span> slowapi <span class=\"kw\">import</span>\
      \ Limiter, _rate_limit_exceeded_handler\n<span class=\"kw\">from</span> slowapi.util\
      \ <span class=\"kw\">import</span> get_remote_address\n<span class=\"kw\">from</span>\
      \ slowapi.errors <span class=\"kw\">import</span> RateLimitExceeded\n<span class=\"\
      kw\">import</span> redis\n<span class=\"kw\">import</span> json\n<span class=\"\
      kw\">import</span> hashlib\n<span class=\"kw\">import</span> numpy <span class=\"\
      kw\">as</span> np\n<span class=\"kw\">from</span> sentence_transformers <span\
      \ class=\"kw\">import</span> SentenceTransformer\n\n<span class=\"cm\"># 1.\
      \ Initialize high-performance asynchronous API application</span>\napp = <span\
      \ class=\"fn\">FastAPI</span>()\n\n<span class=\"cm\"># 1. Rate Limiting with\
      \ SlowAPI</span>\nlimiter = <span class=\"fn\">Limiter</span>(key_func=get_remote_address)\n\
      app.state.limiter = limiter\napp.<span class=\"fn\">add_exception_handler</span>(RateLimitExceeded,\
      \ _rate_limit_exceeded_handler)\n\n<span class=\"cm\"># 2. Redis connection</span>\n\
      r = redis.<span class=\"fn\">Redis</span>(host=<span class=\"str\">\"localhost\"\
      </span>, port=<span class=\"num\">6379</span>, decode_responses=<span class=\"\
      kw\">True</span>)\nembed_model = <span class=\"fn\">SentenceTransformer</span>(<span\
      \ class=\"str\">\"all-MiniLM-L6-v2\"</span>)\n\nCACHE_TTL = <span class=\"num\"\
      >3600</span>  <span class=\"cm\"># 1 hour</span>\nSIMILARITY_THRESHOLD = <span\
      \ class=\"num\">0.92</span>\n\n<span class=\"kw\">def</span> <span class=\"\
      fn\">get_cache_key</span>(query: str) -&gt; str:\n    <span class=\"str\">\"\
      \"\"Generate deterministic cache key.\"\"\"</span>\n    <span class=\"kw\">return</span>\
      \ <span class=\"str\">f\"cache:{hashlib.md5(query.encode()).hexdigest()}\"</span>\n\
      \n<span class=\"kw\">def</span> <span class=\"fn\">semantic_cache_lookup</span>(query:\
      \ str) -&gt; str | <span class=\"kw\">None</span>:\n    <span class=\"str\"\
      >\"\"\"Check if a semantically similar query was already answered.\"\"\"</span>\n\
      \    query_embedding = embed_model.<span class=\"fn\">encode</span>(query)\n\
      \    \n    <span class=\"cm\"># Check recent cache entries</span>\n    <span\
      \ class=\"kw\">for</span> key <span class=\"kw\">in</span> r.<span class=\"\
      fn\">scan_iter</span>(<span class=\"str\">\"cache:*\"</span>):\n        cached\
      \ = json.<span class=\"fn\">loads</span>(r.<span class=\"fn\">get</span>(key)\
      \ <span class=\"kw\">or</span> <span class=\"str\">\"{}\"</span>)\n        <span\
      \ class=\"kw\">if</span> <span class=\"str\">\"embedding\"</span> <span class=\"\
      kw\">in</span> cached:\n            cached_emb = np.<span class=\"fn\">array</span>(cached[<span\
      \ class=\"str\">\"embedding\"</span>])\n            similarity = np.<span class=\"\
      fn\">dot</span>(query_embedding, cached_emb) / (\n                np.linalg.<span\
      \ class=\"fn\">norm</span>(query_embedding) * np.linalg.<span class=\"fn\">norm</span>(cached_emb)\n\
      \            )\n            <span class=\"kw\">if</span> similarity &gt; SIMILARITY_THRESHOLD:\n\
      \                <span class=\"kw\">return</span> cached.<span class=\"fn\"\
      >get</span>(<span class=\"str\">\"answer\"</span>)\n    <span class=\"kw\">return</span>\
      \ <span class=\"kw\">None</span>\n\n<span class=\"kw\">def</span> <span class=\"\
      fn\">cache_response</span>(query: str, answer: str):\n    <span class=\"str\"\
      >\"\"\"Store query + answer + embedding in Redis.\"\"\"</span>\n    embedding\
      \ = embed_model.<span class=\"fn\">encode</span>(query).<span class=\"fn\">tolist</span>()\n\
      \    r.<span class=\"fn\">setex</span>(\n        <span class=\"fn\">get_cache_key</span>(query),\n\
      \        CACHE_TTL,\n        json.<span class=\"fn\">dumps</span>({<span class=\"\
      str\">\"query\": query, \"answer\": answer, \"embedding\"</span>: embedding}),\n\
      \    )\n\n<span class=\"cm\"># 3. Rate-limited + cached endpoint</span>\n<span\
      \ class=\"cm\"># 2. Define prediction endpoint with Pydantic schema validation</span>\n\
      @app.<span class=\"fn\">post</span>(<span class=\"str\">\"/query\"</span>)\n\
      @limiter.<span class=\"fn\">limit</span>(<span class=\"str\">\"10/minute\"</span>)\n\
      <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"\
      fn\">query_with_cache</span>(request: Request, question: str):\n    <span class=\"\
      cm\"># Check semantic cache first</span>\n    cached = <span class=\"fn\">semantic_cache_lookup</span>(question)\n\
      \    <span class=\"kw\">if</span> cached:\n        <span class=\"kw\">return</span>\
      \ {<span class=\"str\">\"answer\": cached, \"cached\"</span>: <span class=\"\
      kw\">True</span>}\n    \n    <span class=\"cm\"># Generate answer (replace with\
      \ actual LLM call)</span>\n    answer = <span class=\"str\">f\"Answer to: {question}\"\
      </span>\n    \n    <span class=\"cm\"># Cache the response</span>\n    <span\
      \ class=\"fn\">cache_response</span>(question, answer)\n    <span class=\"kw\"\
      >return</span> {<span class=\"str\">\"answer\": answer, \"cached\"</span>: <span\
      \ class=\"kw\">False</span>}\n\n@app.<span class=\"fn\">get</span>(<span class=\"\
      str\">\"/cache/stats\"</span>)\n<span class=\"kw\">async</span> <span class=\"\
      kw\">def</span> <span class=\"fn\">cache_stats</span>():\n    keys = <span class=\"\
      fn\">list</span>(r.<span class=\"fn\">scan_iter</span>(<span class=\"str\">\"\
      cache:*\"</span>))\n    <span class=\"kw\">return</span> {<span class=\"str\"\
      >\"cached_queries\": len(keys), \"ttl_seconds\"</span>: CACHE_TTL}\n\n<span\
      \ class=\"kw\">if</span> <span class=\"kw\">True</span>:\n        <span class=\"\
      kw\">pass</span> <span class=\"cm\"># Task Complete</span>"
    solution_lang: python
  quizzes:
  - num_str: Q1 OF 2
    question: How does Docker layer caching optimize container builds?
    qid: q122_1
    options:
    - letter: A
      text: It skips execution of layers that have no code changes since the last
        build
      is_correct: true
    - letter: B
      text: It compresses libraries to reduce network usage
      is_correct: false
    - letter: C
      text: It runs multi-stage builds in parallel across multiple machines
      is_correct: false
    correct_fb: ✅ Correct! Docker caches the result of each instruction (like COPY
      or RUN) in a layer. If the input files or command haven't changed, Docker reuses
      the cached layer, saving substantial build time (especially for slow steps like
      pip installs).
    wrong_fb: ❌ Incorrect. Docker layer caching doesn't perform compression or distribute
      builds. It reuses layers from the cache when the build context and instructions
      are unchanged. Try A.
  - num_str: QUESTION 4 OF 4
    question: What is the primary operational advantage of multi-stage Docker builds
      in production ML deployment?
    qid: q_day-122_3
    options:
    - letter: A
      text: It separates compilation dependencies from the minimal runtime image,
        reducing attack surface and shrinking image size by up to 80%.
      is_correct: true
    - letter: B
      text: It automatically fine-tunes model weights during the docker build phase.
      is_correct: false
    - letter: C
      text: It converts Python code to native assembly for 10x faster execution without
        libraries.
      is_correct: false
    - letter: D
      text: It forces all inference requests to execute synchronously in single-threaded
        mode.
      is_correct: false
    correct_fb: ✓ Correct! Multi-stage builds compile wheels in a throwaway stage
      and copy only binaries to a lean runtime image.
    wrong_fb: ✗ Incorrect. Multi-stage builds are designed to drastically reduce production
      container image size and eliminate build tool security vulnerabilities.
  flashcards:
  - front: What is a Dockerfile?
    back: A text file containing a list of CLI instructions that Docker uses to build
      a container image.
  - front: What is a Multi-Stage Build in Docker?
    back: A technique that uses multiple FROM statements in a Dockerfile, allowing
      you to build assets in temporary stages and copy only the final binaries to
      the production image, minimizing container size.
  - front: Why should you put pip install before copying your code in a Dockerfile?
    back: To leverage Docker's build cache; if your code changes but dependencies
      do not, Docker will skip reinstalling dependencies.
  - front: What is the USER instruction in a Dockerfile?
    back: An instruction that sets the non-root username or UID to run the container,
      improving security.
  gotcha:
    title: '⚠️ Gotcha: Docker Container GPU Runtime Passthrough'
    description: Always pass `--gpus all` and verify NVIDIA Container Toolkit is initialized
      in production Docker daemon.
  takeaways:
    hinglish_line: "<strong>\n         Ek line mein:\n        </strong>\n        PSI\
      \ thresholds check checks input statistical drift distributions alerts show\
      \ karte hain."
    bullets:
    - 'Layer caching rule: least-changing layers first. Copy requirements.txt → pip
      install → copy source code.'
    - 'Multi-stage builds separate build dependencies from runtime — typical savings:
      50-80% image size reduction.'
    - .dockerignore prevents secrets, notebooks, and large experiment files from bloating
      the build context.
    - Always run as non-root user in production containers. Root inside a container
      is root if the container escapes.
    - Never bake secrets into images — use runtime environment variables or Docker
      secrets.
