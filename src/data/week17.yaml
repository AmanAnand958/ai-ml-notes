    prompt_html: "<p><strong>\n          Containerise your Day 120 Flask ML app using\
      \ the multi-stage Dockerfile. Requirements: non-root user, .dockerignore, MODEL_PATH\
      \ as ENV variable (not hardcoded), Gunicorn as CMD with 4 workers. Test: (1)\n\
