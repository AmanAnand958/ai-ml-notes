    solution_code: "<span class=\"cm\"># end_to_end_ml_deployment.py — Solution</span>\n\
      <span class=\"cm\"># Complete solution for: End-to-End ML Deployment</span>\n\
      \n<span class=\"cm\"># Dockerfile for RAG Application</span>\n<span class=\"\
      cm\"># Build: docker build -t rag-app .</span>\n<span class=\"cm\"># Run:  \
      \ docker run -p 8000:8000 --env-file .env rag-app</span>\n\n<span class=\"cm\"\
      ># --- Dockerfile ---</span>\n<span class=\"cm\"># FROM python:3.11-slim</span>\n\
      <span class=\"cm\"># WORKDIR /app</span>\n<span class=\"cm\"># </span>\n<span\
      \ class=\"cm\"># # Install dependencies first (Docker cache optimization)</span>\n\
      <span class=\"cm\"># COPY requirements.txt .</span>\n<span class=\"cm\"># RUN\
      \ pip install --no-cache-dir -r requirements.txt</span>\n<span class=\"cm\"\
      ># </span>\n<span class=\"cm\"># # Copy application code</span>\n<span class=\"\
      cm\"># COPY . .</span>\n<span class=\"cm\"># </span>\n<span class=\"cm\"># #\
      \ Create volume for persistent ChromaDB data</span>\n<span class=\"cm\"># VOLUME\
      \ /app/chroma_db</span>\n<span class=\"cm\"># </span>\n<span class=\"cm\">#\
      \ EXPOSE 8000</span>\n<span class=\"cm\"># </span>\n<span class=\"cm\"># # Health\
      \ check</span>\n<span class=\"cm\"># HEALTHCHECK --interval=30s --timeout=5s\
      \ \\</span>\n<span class=\"cm\">#   CMD curl -f http://localhost:8000/health\
      \ || exit 1</span>\n<span class=\"cm\"># </span>\n<span class=\"cm\"># CMD [\"\
      uvicorn\", \"main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]</span>\n\
      \n<span class=\"cm\"># --- docker-compose.yml ---</span>\n<span class=\"cm\"\
      ># version: \"3.9\"</span>\n<span class=\"cm\"># services:</span>\n<span class=\"\
      cm\">#   rag-api:</span>\n<span class=\"cm\">#     build: .</span>\n<span class=\"\
      cm\">#     ports:</span>\n<span class=\"cm\">#       - \"8000:8000\"</span>\n\
      <span class=\"cm\">#     env_file: .env</span>\n<span class=\"cm\">#     volumes:</span>\n\
      <span class=\"cm\">#       - chroma_data:/app/chroma_db</span>\n<span class=\"\
      cm\">#     restart: unless-stopped</span>\n<span class=\"cm\">#     healthcheck:</span>\n\
      <span class=\"cm\">#       test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8000/health\"\
      ]</span>\n<span class=\"cm\">#       interval: 30s</span>\n<span class=\"cm\"\
      >#       timeout: 5s</span>\n<span class=\"cm\">#       retries: 3</span>\n\
      <span class=\"cm\"># </span>\n<span class=\"cm\"># volumes:</span>\n<span class=\"\
      cm\">#   chroma_data:</span>\n\n<span class=\"cm\"># --- requirements.txt ---</span>\n\
      <span class=\"cm\"># fastapi==0.111.0</span>\n<span class=\"cm\"># uvicorn[standard]==0.30.0</span>\n\
