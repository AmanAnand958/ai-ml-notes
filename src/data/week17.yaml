  hinglish: 'Secrets management: API keys, database passwords code mein mat hardcode
    karo! Environment variables, AWS Secrets Manager, HashiCorp Vault use karo. Git
    history check karo!'
  analogy: CI/CD MLOps pipelines are like automated airport security checks. Baggage
    (code changes) passes through scanners (unit tests) and passenger identities are
    verified before anyone boards the plane.
  theory_html: "<h3 class=\"sh3\">\n       1. docker-compose.yml Structure\n     \
    \ </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       The Compose file structures container dependencies,\
    \ network bridging, volume linkages, and environment configurations in declarative\
    \ YAML.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">gitignore</span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre>version: <span class=\"str\">\"3.9\"\
    </span>\n\nservices:\n\n  flask-app:\n    build:\n      context: .\n      dockerfile:\
    \ Dockerfile\n      target: runtime                      <span class=\"cm\">#\
    \ multi-stage: use runtime stage</span>\n    image: myuser/iris-api:latest\n \
    \   container_name: flask-app\n    restart: unless-stopped                <span\
    \ class=\"cm\"># restart on crash, but not manual stops</span>\n    environment:\n\
    \      - FLASK_ENV=production\n      - MODEL_PATH=/app/models/iris_pipeline_v1.joblib\n\
    \      - REDIS_URL=redis://redis:<span class=\"num\">6379</span>/<span class=\"\
    num\">0</span>     <span class=\"cm\"># use container name as hostname!</span>\n\
    \    env_file:\n      - .env.production                    <span class=\"cm\"\
    ># secrets go here, NOT in docker-compose</span>\n    volumes:\n      - ./models:/app/models:ro\
    \            <span class=\"cm\"># :ro = read-only inside container</span>\n  \
    \  depends_on:\n      redis:\n        condition: service_healthy         <span\
    \ class=\"cm\"># wait until Redis is actually ready</span>\n    healthcheck:\n\
    \      test: [<span class=\"str\">\"CMD\", \"curl\", \"-f\", \"http://localhost:5000/health/ready\"\
    </span>]\n      interval: 30s\n      timeout: 10s\n      retries: <span class=\"\
    num\">3</span>\n      start_period: 40s                    <span class=\"cm\"\
    ># grace period for model loading</span>\n    networks:\n      - ml-network\n\
    \    expose:\n      - <span class=\"str\">\"5000\"</span>                    \
    \         <span class=\"cm\"># internal only — nginx proxies externally</span>\n\
    \n  redis:\n    image: redis:<span class=\"num\">7</span>-alpine\n    container_name:\
    \ redis\n    restart: unless-stopped\n    command: redis-server --maxmemory 256mb\
    \ --maxmemory-policy allkeys-lru\n    volumes:\n      - redis-data:/data     \
    \              <span class=\"cm\"># named volume for Redis persistence</span>\n\
    \    healthcheck:\n      test: [<span class=\"str\">\"CMD\", \"redis-cli\", \"\
    ping\"</span>]\n      interval: 10s\n      timeout: 5s\n      retries: <span class=\"\
    num\">5</span>\n    networks:\n      - ml-network\n\n  nginx:\n    image: nginx:alpine\n\
    \    container_name: nginx\n    restart: unless-stopped\n    ports:\n      - <span\
    \ class=\"str\">\"80:80\"</span>                            <span class=\"cm\"\
    ># only nginx is exposed to host</span>\n    volumes:\n      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro\n\
    \    depends_on:\n      flask-app:\n        condition: service_healthy\n    networks:\n\
    \      - ml-network\n\nvolumes:\n  redis-data:                              <span\
    \ class=\"cm\"># named volume persists after rm</span>\n\nnetworks:\n  ml-network:\n\
    \    driver: bridge</pre>\n</div>\n<h3 class=\"sh3\">\n       2. Prediction Caching\
    \ with Redis\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       Caching prediction responses in Redis avoids redundant\
    \ inference loops on identical inputs, reducing latencies from 200ms to under\
    \ 5ms.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">gitignore</span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n\
    \         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy\
    \ <span class=\"kw\">as</span> np\n\n<span class=\"kw\">import</span> redis, json,\
    \ hashlib, os, numpy <span class=\"kw\">as</span> np\n\nredis_client = redis.<span\
    \ class=\"fn\">from_url</span>(\n    os.environ.<span class=\"fn\">get</span>(<span\
    \ class=\"str\">'REDIS_URL'</span>, <span class=\"str\">'redis://localhost:6379/0'</span>),\n\
    \    decode_responses=<span class=\"kw\">True</span>\n)\n\n<span class=\"kw\"\
    >def</span> <span class=\"fn\">cache_key</span>(features: list) -&gt; str:\n \
    \   <span class=\"str\">\"\"\"Create deterministic cache key from feature vector.\"\
    \"\"</span>\n    payload = json.<span class=\"fn\">dumps</span>(<span class=\"\
    fn\">sorted</span>(features), separators=(<span class=\"str\">\",\", \":\"</span>))\n\
    \    <span class=\"kw\">return</span> <span class=\"str\">f\"pred:{hashlib.sha256(payload.encode()).hexdigest()[:16]}\"\
    </span>\n\n@predict_bp.<span class=\"fn\">route</span>(<span class=\"str\">'/predict'</span>,\
    \ methods=[<span class=\"str\">'POST'</span>])\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">predict</span>():\n    data = request.<span class=\"fn\"\
    >get_json</span>(force=<span class=\"kw\">True</span>, silent=<span class=\"kw\"\
    >True</span>)\n    <span class=\"kw\">if</span> <span class=\"kw\">not</span>\
    \ data:\n        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span\
    \ class=\"str\">'error'</span>: <span class=\"str\">'Invalid JSON'</span>}), <span\
    \ class=\"num\">400</span>\n\n    features = data.<span class=\"fn\">get</span>(<span\
    \ class=\"str\">'features'</span>, [])\n    key = <span class=\"fn\">cache_key</span>(features)\n\
    \n    <span class=\"cm\"># Cache hit: return immediately without running model</span>\n\
    \    cached = redis_client.<span class=\"fn\">get</span>(key)\n    <span class=\"\
    kw\">if</span> cached:\n        result = json.<span class=\"fn\">loads</span>(cached)\n\
    \        result[<span class=\"str\">\"'</span>cache<span class=\"str\">'\"] =\
    \ '</span>hit'\n        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(result)\n\
    \n    <span class=\"cm\"># Cache miss: run model inference</span>\n    X = np.<span\
    \ class=\"fn\">array</span>(features).<span class=\"fn\">reshape</span>(<span\
    \ class=\"num\">1</span>, -<span class=\"num\">1</span>)\n    pred  = pipeline.<span\
    \ class=\"fn\">predict</span>(X)[<span class=\"num\">0</span>]\n    proba = pipeline.<span\
    \ class=\"fn\">predict_proba</span>(X)[<span class=\"num\">0</span>].<span class=\"\
    fn\">tolist</span>()\n    result = {\n        <span class=\"str\">'prediction'</span>:\
    \ <span class=\"fn\">int</span>(pred),\n        <span class=\"str\">'class_name'</span>:\
    \ metadata[<span class=\"str\">\"'</span>classes<span class=\"str\">'\"</span>][pred],\n\
    \        <span class=\"str\">'probabilities'</span>: proba,\n        <span class=\"\
    str\">'cache'</span>: <span class=\"str\">'miss'</span>\n    }\n\n    <span class=\"\
    cm\"># Store in cache for 1 hour (TTL=3600)</span>\n    redis_client.<span class=\"\
    fn\">setex</span>(key, <span class=\"num\">3600</span>, json.<span class=\"fn\"\
    >dumps</span>(result))\n    <span class=\"kw\">return</span> <span class=\"fn\"\
    >jsonify</span>(result)</pre>\n</div>\n<!-- /theory -->\n<h2 class=\"sh2\">\n\
    \       ⚡ Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size:\
    \ 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\">\n       \U0001F50D\
    \n       <strong>\n        Search terms:\n       </strong>\n\n        mlops ci\
    \ cd pipelines github actions deployment, blue green deployment strategy containers\n\
    \       \n</div>\n<h2 class=\"sh2\">\n       \U0001F0CF Revision Flashcards —\
    \ Day 123\n      </h2>\n<p class=\"flashcard-hint\" style=\"font-size: 12px; font-family:var(--font-mono);\
    \ color:var(--muted); text-transform:uppercase; margin-bottom:8px;\">\n      \
    \ CLICK EACH CARD TO FLIP ↓\n      </p>"
