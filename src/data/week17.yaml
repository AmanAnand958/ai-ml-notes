  quizzes:
  - num_str: Q1 OF 2
    question: Why should ML models be loaded at server startup rather than inside
      the request route?
    qid: q120_1
    options:
    - letter: A
      text: Loading inside the route will cause huge latency spikes on every prediction
        request
      is_correct: true
    - letter: B
      text: FastAPI/Flask will crash if a model file is read inside a route function
      is_correct: false
    - letter: C
      text: Production networks block external disk operations inside endpoints
      is_correct: false
    correct_fb: ✅ Correct! Reading model weights from disk and loading them into memory
      (RAM/VRAM) can take seconds or even minutes. Doing this inside the request route
      means every user request experiences this delay. Loading at startup ensures
      this happens only once.
    wrong_fb: ❌ Incorrect. While loading inside the route doesn't throw a crash or
      get blocked by production networks automatically, it degrades performance. Reading
      weights from disk takes a long time, causing unacceptable latency for predictions.
      Try A.
  - num_str: QUESTION 4 OF 4
    question: What is the primary operational advantage of multi-stage Docker builds
      in production ML deployment?
    qid: q_day-120_3
    options:
    - letter: A
      text: It separates compilation dependencies from the minimal runtime image,
        reducing attack surface and shrinking image size by up to 80%.
      is_correct: true
    - letter: B
      text: It automatically fine-tunes model weights during the docker build phase.
      is_correct: false
    - letter: C
      text: It converts Python code to native assembly for 10x faster execution without
        libraries.
      is_correct: false
    - letter: D
      text: It forces all inference requests to execute synchronously in single-threaded
        mode.
      is_correct: false
    correct_fb: ✓ Correct! Multi-stage builds compile wheels in a throwaway stage
      and copy only binaries to a lean runtime image.
    wrong_fb: ✗ Incorrect. Multi-stage builds are designed to drastically reduce production
      container image size and eliminate build tool security vulnerabilities.
  flashcards:
  - front: How do you serve a serialized model in Python?
    back: By saving the trained model object using pickle or joblib, and loading it
      into memory on Flask application startup to predict on incoming request payloads.
  - front: What is Gunicorn?
    back: A Python WSGI HTTP Server for UNIX, used to run Flask/Django apps in production
      by handling concurrent requests using multiple worker processes.
  - front: Why shouldn't you run a Flask app in production using app.run()?
    back: Because the built-in development server is single-threaded, not secure,
      and does not handle high loads or concurrent connections.
  - front: How does batching inference improve production performance?
    back: It aggregates individual incoming requests into a single batch, allowing
      the model to make predictions simultaneously and reducing overhead.
  gotcha:
    title: '⚠️ Gotcha: Docker Container GPU Runtime Passthrough'
    description: Always pass `--gpus all` and verify NVIDIA Container Toolkit is initialized
      in production Docker daemon.
  takeaways:
    hinglish_line: "<strong>\n         Ek line mein:\n        </strong>\n        Local\
      \ database container data migrations steps persistent storage volumes synchronize\
      \ karte hain."
    bullets:
    - Always save sklearn model and preprocessing as a single Pipeline — avoids train/serve
      skew.
    - Load models at app startup (module level or in create_app), not inside the view
      function.
    - Gunicorn workers = (2 × CPU cores) + 1. Each worker loads the model independently.
    - Return 503 when model isn't loaded — this lets Kubernetes health checks fail
      gracefully.
    - PyTorch models need thread safety — use a lock or move to an async architecture
      for production.
