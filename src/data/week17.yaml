  quizzes:
  - num_str: Q1 OF 5
    question: "What does Flask's\n         \n          debug=True\n         \n   \
      \      mode do, and why must you NEVER use it in production?"
    qid: q118_1
    options:
    - letter: A
      text: It disables all logging to speed up responses
      is_correct: false
      id: a
    - letter: B
      text: It enables auto-reload on code changes AND exposes an interactive debugger
        in the browser — which gives anyone who ca...
      is_correct: true
      id: b
    - letter: C
      text: It only enables auto-reload with no security implications
      is_correct: false
      id: c
    - letter: D
      text: It enables HTTPS automatically
      is_correct: false
      id: d
    correct_fb: "✅ Correct! The Werkzeug debugger is a full Python REPL accessible\
      \ in the browser when an exception occurs. In production, anyone who can trigger\
      \ an error gets code execution on your server. Always set\n         \n     \
      \     debug=False\n         \n         and use\n         \n         ."
    wrong_fb: '❌ debug=True enables two things: (1) auto-reloader on file changes,
      (2) the Werkzeug interactive debugger shown in browser on errors. The debugger
      is effectively a Python shell — a critical security vulnerability if exposed
      publicly.'
    correct: b
  - num_str: Q2 OF 5
    question: "You call\n         \n          request.get_json()\n         \n    \
      \     and get\n         \n          None\n         \n         back. What are\
      \ the two most likely causes?"
    qid: q118_2
    options:
    - letter: A
      text: The request body is empty AND the server is in debug mode
      is_correct: false
      id: a
    - letter: B
      text: The Content-Type header is not set to application/json, OR the body is
        malformed JSON (not valid JSON syntax)
      is_correct: true
      id: b
    - letter: C
      text: The route method is GET, not POST
      is_correct: false
      id: c
    - letter: D
      text: Flask version is outdated
      is_correct: false
      id: d
    correct_fb: "✅ Exactly. Use\n         \n          get_json(force=True)\n     \
      \    \n         to skip Content-Type check, and\n         \n          get_json(silent=True)\n\
      \         \n         to suppress parse errors (returns None instead of 400).\
      \ In production, always handle None explicitly rather than relying on."
    wrong_fb: "❌ get_json() returns None when: (1) Content-Type != application/json\
      \ (unless force=True), (2) the body is not valid JSON. Fix with:\n         \n\
      \          request.get_json(force=True, silent=True)\n         \n         and\
      \ check for None explicitly."
    correct: b
  - num_str: Q3 OF 5
    question: "What is the main benefit of using Blueprints over putting all routes\
      \ in a single\n         \n          app.py\n         \n         ?"
    qid: q118_3
    options:
    - letter: A
      text: Blueprints make Flask run faster by pre-compiling routes
      is_correct: false
      id: a
    - letter: B
      text: Blueprints allow modular code organisation — each feature has its own
        file with its own URL prefix, and can be regist...
      is_correct: true
      id: b
    - letter: C
      text: Blueprints add automatic authentication to routes
      is_correct: false
      id: c
    - letter: D
      text: Blueprints are mandatory for any Flask app with more than 5 routes
      is_correct: false
      id: d
    correct_fb: ✅ Right. Blueprints are Flask's module system. Each blueprint has
      its own routes, error handlers, templates, and static files. You can mount the
      same blueprint at different URL prefixes, enabling API versioning (register
      predict_bp at /api/v1 and /api/v2 with different handlers).
    wrong_fb: ❌ Blueprints are about code organisation and maintainability. They let
      you split a large app into smaller, self-contained modules. Each blueprint can
      have its own routes, templates, and URL prefix — crucial for team development
      and API versioning.
    correct: b
  - num_str: Q4 OF 5
    question: "What HTTP status code should a POST /predict endpoint return when the\
      \ request body is syntactically valid JSON but the\n         \n          features\n\
      \         \n         field contains strings...?"
    qid: q118_4
    options:
    - letter: A
      text: 400 Bad Request
      is_correct: false
      id: a
    - letter: B
      text: 422 Unprocessable Entity — the JSON is syntactically valid but semantically
        wrong (wrong field type)
      is_correct: true
      id: b
    - letter: C
      text: 500 Internal Server Error
      is_correct: false
      id: c
    - letter: D
      text: 200 OK with an error field in the response body
      is_correct: false
      id: d
    correct_fb: '✅ Correct. 400 = malformed request (can''t parse). 422 = well-formed
      but semantically invalid (correct JSON, wrong values). For ML APIs: 400 when
      JSON can''t be parsed, 422 when JSON is valid but field types/values fail schema
      validation.'
    wrong_fb: '❌ The distinction: 400 Bad Request = JSON syntax error (can''t parse
      at all). 422 Unprocessable Entity = JSON parsed fine but field validation failed
      (wrong type, out-of-range value). FastAPI and modern REST APIs use 422 for schema
      violations.'
    correct: b
  - num_str: Q5 OF 5
    question: "Why is Flask's built-in development server (\n         \n         \
      \ flask run\n         \n         ) not suitable for production?"
    qid: q118_5
    options:
    - letter: A
      text: It doesn't support Python 3
      is_correct: false
      id: a
    - letter: B
      text: It's single-threaded (one request at a time), not designed for load, has
        no graceful shutdown, and Werkzeug's warning...
      is_correct: true
      id: b
    - letter: C
      text: It can't serve JSON responses
      is_correct: false
      id: c
    - letter: D
      text: It requires root privileges
      is_correct: false
      id: d
    correct_fb: "✅ Exactly. Use Gunicorn (\n         \n          gunicorn -w 4 \"\
      myapp:create_app()\"\n         \n         ) or uWSGI in production. Gunicorn\
      \ spawns multiple worker processes, handles graceful restarts, and can sit behind\
      \ nginx for SSL termination and static file serving."
    wrong_fb: "❌ Flask's dev server is single-threaded and not optimized for concurrency\
      \ or production load. The fix:\n         \n          pip install gunicorn\n\
      \         \n         and run\n         \n          gunicorn -w 4 -b 0.0.0.0:5000\
      \ \"myapp:create_app()\"\n         \n         — 4 worker processes, each handling\
      \ requests independently."
    correct: b
  flashcards:
  - front: 'Core concept: What is the significance of What is Flask? in Flask Fundamentals
      — Routes, Views & Blueprints?'
    back: A lightweight, micro WSGI web application framework in Python designed to
      be simple, extensible, and easy to deploy.
  - front: What is a Blueprint in Flask?
    back: A way to organize a group of related views, templates, and static files
      to modularize large Flask applications.
  - front: What is a Route in Flask?
    back: A URL pattern mapped to a specific Python function (view function) that
      executes when that URL is accessed.
  - front: What is the difference between Flask and Django?
    back: Flask is a micro-framework (no built-in database, authentication, or admin
      panel), while Django is a batteries-included framework with everything pre-configured.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Flask Fundamentals
      — Routes, Views & Blueprints in distributed systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation,
      resolved using overlap of computation and communication (ZeRO / DDP Ring-AllReduce).
