    <figcaption>\n        FastAPI + Uvicorn Architecture: Request Validation, Service\
    \ Layer, and Inference\n       </figcaption>\n</figure>\n<h3 class=\"sh3\">\n\
    \       1. Flask Architecture — WSGI &amp; the Request-Response Cycle\n      </h3>\n\
    <p>\n       Flask is a WSGI (Web Server Gateway Interface) application. Every\
    \ HTTP request flows:\n       <strong>\n        Browser → Web Server (nginx/gunicorn)\
    \ → WSGI App (Flask) → Your code → Response\n       </strong>\n       . Flask\
    \ wraps this complexity into a clean decorator-based API.\n      </p>\n<div class=\"\
    table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table\
    \ class=\"concept-table\">\n<tr>\n<th>\n         Concept\n        </th>\n<th>\n\
    \         What It Is\n        </th>\n<th>\n         Flask Object\n        </th>\n\
    </tr>\n<tr>\n<td>\n<strong>\n          Route\n         </strong>\n</td>\n<td>\n\
    \         URL pattern mapped to a Python function\n        </td>\n<td>\n\n   \
    \       @app.route('/path')\n         \n</td>\n</tr>\n<tr>\n<td>\n<strong>\n \
    \         View Function\n         </strong>\n</td>\n<td>\n         Python function\
    \ that handles a request\n        </td>\n<td>\n         Any function under\n \
    \        \n          @app.route\n         \n</td>\n</tr>\n<tr>\n<td>\n<strong>\n\
    \          Request Context\n         </strong>\n</td>\n<td>\n         Thread-local\
    \ object holding current request data\n        </td>\n<td>\n\n          flask.request\n\
    \         \n</td>\n</tr>\n<tr>\n<td>\n<strong>\n          Application Context\n\
    \         </strong>\n</td>\n<td>\n         Holds app-level data (config, db connections)\n\
    \        </td>\n<td>\n\n          flask.g\n         \n         ,\n         \n\
    \          flask.current_app\n         \n</td>\n</tr>\n<tr>\n<td>\n<strong>\n\
    \          Response\n         </strong>\n</td>\n<td>\n         What Flask returns\
    \ to the client\n        </td>\n<td>\n\n          flask.Response\n         \n\
    \         ,\n         \n          jsonify()\n         \n         , string\n  \
    \      </td>\n</tr>\n</table></div>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><code><span\
    \ class=\"kw\">from</span> flask <span class=\"kw\">import</span> Flask, request,\
    \ jsonify\n<span class=\"kw\">import</span> joblib\n<span class=\"kw\">import</span>\
    \ numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span> threading\n\
    \napp = <span class=\"fn\">Flask</span>(__name__)\n\n<span class=\"cm\"># Simulated\
    \ Model Loader with Thread Safety</span>\n<span class=\"kw\">class</span> <span\
    \ class=\"cls\">ThreadSafeModelWrapper</span>:\n    <span class=\"kw\">def</span>\
    \ <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>):\n      \
    \  <span class=\"kw\">self</span>.lock = threading.<span class=\"fn\">Lock</span>()\n\
    \        <span class=\"cm\"># In production: self.model = joblib.load(\"model.joblib\"\
    )</span>\n        \n    <span class=\"kw\">def</span> <span class=\"fn\">predict</span>(<span\
    \ class=\"kw\">self</span>, features: np.ndarray) -&gt; np.ndarray:\n        <span\
    \ class=\"kw\">with</span> <span class=\"kw\">self</span>.lock:\n            <span\
    \ class=\"cm\"># Thread-safe forward pass</span>\n            <span class=\"kw\"\
    >return</span> np.<span class=\"fn\">array</span>([<span class=\"num\">1</span>\
    \ <span class=\"kw\">if</span> np.<span class=\"fn\">sum</span>(f) &gt; <span\
    \ class=\"num\">0</span> <span class=\"kw\">else</span> <span class=\"num\">0</span>\
    \ <span class=\"kw\">for</span> f <span class=\"kw\">in</span> features])\n\n\
    model_wrapper = <span class=\"fn\">ThreadSafeModelWrapper</span>()\n\n@app.<span\
    \ class=\"fn\">route</span>(<span class=\"str\">'/health'</span>, methods=[<span\
    \ class=\"str\">'GET'</span>])\n<span class=\"kw\">def</span> <span class=\"fn\"\
    >health_check</span>():\n    <span class=\"kw\">return</span> <span class=\"fn\"\
    >jsonify</span>({<span class=\"str\">\"status\": \"healthy\", \"service\": \"\
    flask-ml-serving\", \"version\": \"1.0.0\"</span>}), <span class=\"num\">200</span>\n\
    \n@app.<span class=\"fn\">route</span>(<span class=\"str\">'/predict'</span>,\
    \ methods=[<span class=\"str\">'POST'</span>])\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">predict_endpoint</span>():\n    data = request.<span class=\"\
    fn\">get_json</span>(force=<span class=\"kw\">True</span>)\n    <span class=\"\
    kw\">if</span> <span class=\"kw\">not</span> data <span class=\"kw\">or</span>\
    \ <span class=\"str\">'features'</span> <span class=\"kw\">not</span> <span class=\"\
    kw\">in</span> data:\n        <span class=\"kw\">return</span> <span class=\"\
    fn\">jsonify</span>({<span class=\"str\">\"error\": \"Missing '</span>features<span\
    \ class=\"str\">' field in JSON payload\"</span>}), <span class=\"num\">400</span>\n\
    \    \n    <span class=\"kw\">try</span>:\n        features = np.<span class=\"\
    fn\">array</span>(data[<span class=\"str\">'features'</span>], dtype=np.float32)\n\
    \        <span class=\"kw\">if</span> features.ndim == <span class=\"num\">1</span>:\n\
    \            features = features.<span class=\"fn\">reshape</span>(<span class=\"\
    num\">1</span>, -<span class=\"num\">1</span>)\n            \n        predictions\
    \ = model_wrapper.<span class=\"fn\">predict</span>(features)\n        <span class=\"\
    kw\">return</span> <span class=\"fn\">jsonify</span>({\n            <span class=\"\
    str\">\"predictions\"</span>: predictions.<span class=\"fn\">tolist</span>(),\n\
    \            <span class=\"str\">\"count\"</span>: <span class=\"fn\">len</span>(predictions),\n\
    \            <span class=\"str\">\"status\": \"success\"</span>\n        }), <span\
    \ class=\"num\">200</span>\n    <span class=\"kw\">except</span> Exception <span\
    \ class=\"kw\">as</span> e:\n        <span class=\"kw\">return</span> <span class=\"\
    fn\">jsonify</span>({<span class=\"str\">\"error\"</span>: <span class=\"fn\"\
    >str</span>(e)}), <span class=\"num\">500</span>\n\n<span class=\"kw\">if</span>\
    \ __name__ == <span class=\"str\">'__main__'</span>:\n    app.<span class=\"fn\"\
    >run</span>(host=<span class=\"str\">'0.0.0.0'</span>, port=<span class=\"num\"\
    >5000</span>, debug=<span class=\"kw\">False</span>)</code></pre>\n</div>\n\n\
    <h3 class=\"sh3\">\n       2. Application Factory Pattern\n      </h3>\n<p>\n\
    \       Production apps never create the Flask app at module level — instead they\
