      \          \n           docker run -e MODEL_PATH=/app/models/iris_pipeline_v1.joblib\n\
      \          \n          starts correctly, (3) curl to /health/ready returns 200,\
      \ (4) curl to /api/v1/predict returns a valid prediction, (5) push the image\
      \ to Docker Hub.\n         </strong></p>"
    done_when: "When image is on Docker Hub. Anyone running\n          \n        \
      \   docker run -p 5000:5000 youruser/iris-api:v1\n          \n          gets\
      \ a working ML API (assuming they mount the model file)."
    git_cmd: 'git add containerise_flask_ml_app_end_to_end.py &amp;&amp; git commit
      -m "feat(day): day122: containerise-flask-ml-app-end-to-end"'
    sol_id: sol-w17d122t2
    solution_title: ✅ COMPLETE SOLUTION — containerise_flask_ml_app_end_to_end.py
    solution_code: "# containerise_flask_ml_app_end_to_end.py — Solution\n# Complete\
      \ solution for: Containerise Flask ML App End-to-End\n\n# Redis Semantic Cache\
      \ + Rate Limiting for FastAPI\n# pip install fastapi redis aioredis slowapi\
      \ sentence-transformers numpy\n\nfrom fastapi import FastAPI, Request, HTTPException\n\
      from slowapi import Limiter, _rate_limit_exceeded_handler\nfrom slowapi.util\
      \ import get_remote_address\nfrom slowapi.errors import RateLimitExceeded\n\
      import redis\nimport json\nimport hashlib\nimport numpy as np\nfrom sentence_transformers\
      \ import SentenceTransformer\n\n# 1. Initialize high-performance asynchronous\
      \ API application\napp = FastAPI()\n\n# 1. Rate Limiting with SlowAPI\nlimiter\
      \ = Limiter(key_func=get_remote_address)\napp.state.limiter = limiter\napp.add_exception_handler(RateLimitExceeded,\
      \ _rate_limit_exceeded_handler)\n\n# 2. Redis connection\nr = redis.Redis(host=\"\
      localhost\", port=6379, decode_responses=True)\nembed_model = SentenceTransformer(\"\
      all-MiniLM-L6-v2\")\n\nCACHE_TTL = 3600  # 1 hour\nSIMILARITY_THRESHOLD = 0.92\n\
      \ndef get_cache_key(query: str) -> str:\n    \"\"\"Generate deterministic cache\
      \ key.\"\"\"\n    return f\"cache:{hashlib.md5(query.encode()).hexdigest()}\"\
      \n\ndef semantic_cache_lookup(query: str) -> str | None:\n    \"\"\"Check if\
      \ a semantically similar query was already answered.\"\"\"\n    query_embedding\
      \ = embed_model.encode(query)\n    \n    # Check recent cache entries\n    for\
      \ key in r.scan_iter(\"cache:*\"):\n        cached = json.loads(r.get(key) or\
      \ \"{}\")\n        if \"embedding\" in cached:\n            cached_emb = np.array(cached[\"\
      embedding\"])\n            similarity = np.dot(query_embedding, cached_emb)\
      \ / (\n                np.linalg.norm(query_embedding) * np.linalg.norm(cached_emb)\n\
      \            )\n            if similarity > SIMILARITY_THRESHOLD:\n        \
      \        return cached.get(\"answer\")\n    return None\n\ndef cache_response(query:\
      \ str, answer: str):\n    \"\"\"Store query + answer + embedding in Redis.\"\
      \"\"\n    embedding = embed_model.encode(query).tolist()\n    r.setex(\n   \
      \     get_cache_key(query),\n        CACHE_TTL,\n        json.dumps({\"query\"\
      : query, \"answer\": answer, \"embedding\": embedding}),\n    )\n\n# 3. Rate-limited\
      \ + cached endpoint\n# 2. Define prediction endpoint with Pydantic schema validation\n\
      @app.post(\"/query\")\n@limiter.limit(\"10/minute\")\nasync def query_with_cache(request:\
      \ Request, question: str):\n    # Check semantic cache first\n    cached = semantic_cache_lookup(question)\n\
      \    if cached:\n        return {\"answer\": cached, \"cached\": True}\n   \
      \ \n    # Generate answer (replace with actual LLM call)\n    answer = f\"Answer\
      \ to: {question}\"\n    \n    # Cache the response\n    cache_response(question,\
      \ answer)\n    return {\"answer\": answer, \"cached\": False}\n\n@app.get(\"\
      /cache/stats\")\nasync def cache_stats():\n    keys = list(r.scan_iter(\"cache:*\"\
      ))\n    return {\"cached_queries\": len(keys), \"ttl_seconds\": CACHE_TTL}\n\
      \nif True:\n        pass # Task Complete\nassert keys is not None, \"keys should\
      \ not be None\""
