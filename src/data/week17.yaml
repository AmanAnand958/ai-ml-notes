  tasks:
  - title: Flask Route Explorer
    badge: EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: "<p><strong>\n         Create a Flask app with 5 different routes\
      \ demonstrating: (1) plain GET returning HTML string, (2) GET with URL parameter\
      \ returning JSON, (3) GET with query string, (4) POST reading JSON body, (5)\
      \ a custom 404 error handler. Test all 5 with\n         \n          curl\n \
      \        \n         or a REST client like Thunder Client.\n        </strong></p>"
    done_when: All 5 routes return correct responses. Custom 404 returns JSON, not
      HTML.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day118: complete day
      118 tasks and coding exercises"'
    sol_id: sol-w17d118t1
    solution_title: ✅ COMPLETE SOLUTION — flask_route_explorer.py
    solution_code: "from flask import Flask, request, jsonify\nimport joblib\nimport\
      \ numpy as np\nimport threading\n\napp = Flask(__name__)\n\n# Simulated Model\
      \ Loader with Thread Safety\nclass ThreadSafeModelWrapper:\n    def __init__(self):\n\
      \        self.lock = threading.Lock()\n        # In production: self.model =\
      \ joblib.load(\"model.joblib\")\n        \n    def predict(self, features: np.ndarray)\
      \ -> np.ndarray:\n        with self.lock:\n            # Thread-safe forward\
      \ pass\n            return np.array([1 if np.sum(f) > 0 else 0 for f in features])\n\
      \nmodel_wrapper = ThreadSafeModelWrapper()\n\n@app.route('/health', methods=['GET'])\n\
      def health_check():\n    return jsonify({\"status\": \"healthy\", \"service\"\
      : \"flask-ml-serving\", \"version\": \"1.0.0\"}), 200\n\n@app.route('/predict',\
      \ methods=['POST'])\ndef predict_endpoint():\n    data = request.get_json(force=True)\n\
      \    if not data or 'features' not in data:\n        return jsonify({\"error\"\
      : \"Missing 'features' field in JSON payload\"}), 400\n    \n    try:\n    \
      \    features = np.array(data['features'], dtype=np.float32)\n        if features.ndim\
      \ == 1:\n            features = features.reshape(1, -1)\n            \n    \
      \    predictions = model_wrapper.predict(features)\n        return jsonify({\n\
      \            \"predictions\": predictions.tolist(),\n            \"count\":\
      \ len(predictions),\n            \"status\": \"success\"\n        }), 200\n\
      \    except Exception as e:\n        return jsonify({\"error\": str(e)}), 500\n\
      \nif __name__ == '__main__':\n    app.run(host='0.0.0.0', port=5000, debug=False)"
    solution_lang: python
    time_minutes: 30
