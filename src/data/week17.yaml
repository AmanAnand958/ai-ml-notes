- id: '119'
  day_num: 119
  title: REST API Design — JSON, Status Codes & Versioning
  subtitle: Ek clean REST API design karna ek art form hai. Sahi status codes, consistent
    JSON structure, aur proper versioning — ye sab milke ek aise API banaate hain
    jise dusre developers love karte hain aur maintain karna easy hota hai.
  time_estimate: 6 hours
  difficulty: +150 XP
  badges:
  - label: 📈 Intermediate
    variant: b
  - label: REST
    variant: t
  xp: 150
  objectives:
  - Apply REST principles (stateless, uniform interface, resource-based URLs) to ML
    APIs.
  - Design a consistent JSON response envelope used across all endpoints.
  - Implement API versioning with URL prefixes and Blueprints.
  - "Add request/response logging middleware using Flask's\n        \n         before_request\n\
    \        \n        /\n        \n         after_request\n        \n        hooks."
  - "Use\n        \n         flask-limiter\n        \n        to add rate limiting\
    \ to protect your endpoints."
  checklist: []
  concept_flow:
  - Flask Fundamentals — Rout
  - REST API Design — JSON, S
  - Serving ML Models with Fl
  - Docker Fundamentals — Con
  - Writing Dockerfiles — Mul
  - Docker Compose — Multi-Co
  - Week 17 Capstone — Deploy
  hinglish: 'CI/CD pipeline: code push karo, tests automatically run hon, agar pass
    hain toh automatically deploy ho. GitHub Actions se easily set up kar sakte ho
    free mein!'
  analogy: Jaise kitchen mein alag-alag recipes ke liye ingredients ka preparation
    zaroori hota hai, vaise hi Kubernetes deployments ke liye data preprocessing aur
    parameter check sabse basic step hai.
  theory_html: "<div class=\"mermaid\">\ngraph LR\n  Client[\"Client HTTP Request\"\
    ] --&gt; Uvicorn[\"Uvicorn Async Worker Pool\"]\n  Uvicorn --&gt; Pydantic[\"\
    Pydantic Payload Validation\"]\n  Pydantic --&gt; Batch[\"Dynamic Request Batching\
    \ Queue\"]\n  Batch --&gt; Model[\"Model Forward Inference - Torch / ONNX\"]\n\
    \  Model --&gt; Resp[\"JSON Response Stream - under 15ms\"]\n</div>\n<h3 class=\"\
    sh3\">\n       1. REST Resource Design for ML APIs\n      </h3>\n<p>\n       REST\
    \ treats every \"thing\" as a resource with a URL. For ML APIs, your resources\
    \ are typically:\n       <em>\n        predictions\n       </em>\n       ,\n \
    \      <em>\n        models\n       </em>\n       , and\n       <em>\n       \
    \ jobs\n       </em>\n       (async tasks). URLs should be nouns, not verbs.\n\
    \      </p>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem\
    \ 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         Endpoint\n\
    \        </th>\n<th>\n         Method\n        </th>\n<th>\n         Description\n\
    \        </th>\n<th>\n         Success Code\n        </th>\n</tr>\n<tr>\n<td>\n\
    \n          /api/v1/predict\n         \n</td>\n<td>\n         POST\n        </td>\n\
    <td>\n         Synchronous prediction\n        </td>\n<td>\n         200\n   \
    \     </td>\n</tr>\n<tr>\n<td>\n\n          /api/v1/models\n         \n</td>\n\
    <td>\n         GET\n        </td>\n<td>\n         List all available models\n\
    \        </td>\n<td>\n         200\n        </td>\n</tr>\n<tr>\n<td>\n\n     \
    \     /api/v1/models/{name}\n         \n</td>\n<td>\n         GET\n        </td>\n\
    <td>\n         Get model metadata\n        </td>\n<td>\n         200\n       \
    \ </td>\n</tr>\n<tr>\n<td>\n\n          /api/v1/jobs\n         \n</td>\n<td>\n\
    \         POST\n        </td>\n<td>\n         Submit async prediction job\n  \
    \      </td>\n<td>\n         202 Accepted\n        </td>\n</tr>\n<tr>\n<td>\n\n\
    \          /api/v1/jobs/{id}\n         \n</td>\n<td>\n         GET\n        </td>\n\
    <td>\n         Poll async job status/result\n        </td>\n<td>\n         200\n\
    \        </td>\n</tr>\n<tr>\n<td>\n\n          /health\n         \n</td>\n<td>\n\
    \         GET\n        </td>\n<td>\n         Liveness check\n        </td>\n<td>\n\
    \         200\n        </td>\n</tr>\n<tr>\n<td>\n\n          /health/ready\n \
    \        \n</td>\n<td>\n         GET\n        </td>\n<td>\n         Readiness\
    \ check (model loaded?)\n        </td>\n<td>\n         200 or 503\n        </td>\n\
    </tr>\n</table></div>\n<h3 class=\"sh3\">\n       2. Consistent JSON Response\
    \ Envelope\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem; color:var(--text);\
    \ line-height:1.6;\">\n       Standardizing API output structures ensures clients\
    \ receive consistent success, error, and metadata envelopes across endpoints.\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         bash\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n          copy\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"cm\">#!/usr/bin/env bash</span>\n<span class=\"cm\"># Production\
    \ Gunicorn Multi-Worker Process Deployment</span>\n<span class=\"cm\"># Formula\
    \ for worker processes: (2 x $NUM_CORES) + 1</span>\n\nNUM_CORES=$(nproc)\nWORKERS=$((\
    \ (<span class=\"num\">2</span> * NUM_CORES) + <span class=\"num\">1</span> ))\n\
    THREADS_PER_WORKER=<span class=\"num\">4</span>\nBIND_ADDRESS=<span class=\"str\"\
    >\"0.0.0.0:5000\"</span>\nTIMEOUT=<span class=\"num\">60</span>\n\necho <span\
    \ class=\"str\">\"\U0001F680 Starting Gunicorn WSGI Server with ${WORKERS} workers\
    \ and ${THREADS_PER_WORKER} threads/worker...\"</span>\n\nexec gunicorn \\\n \
    \   --workers=${WORKERS} \\\n    --threads=${THREADS_PER_WORKER} \\\n    --bind=${BIND_ADDRESS}\
    \ \\\n    --timeout=${TIMEOUT} \\\n    --worker-<span class=\"kw\">class</span>=gthread\
    \ \\\n    --access-logfile=- \\\n    --error-logfile=- \\\n    --log-level=info\
    \ \\\n    app:app</pre>\n</div>\n<h3 class=\"sh3\">\n       3. Logging Middleware\
    \ &amp; Rate Limiting\n      </h3>\n<p style=\"margin-top:0.4rem; margin-bottom:1rem;\
    \ color:var(--text); line-height:1.6;\">\n       FastAPI middleware intercepts\
    \ requests to log latency and block abusive traffic before reaching business logic\
    \ controllers.\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n         bash\n        </span>\n<div class=\"cb-btns\">\n\
    <button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n     \
    \    </button>\n</div>\n</div>\n<pre><span class=\"cm\">#!/usr/bin/env bash</span>\n\
    <span class=\"cm\"># Production Gunicorn Multi-Worker Process Deployment</span>\n\
    <span class=\"cm\"># Formula for worker processes: (2 x $NUM_CORES) + 1</span>\n\
    \nNUM_CORES=$(nproc)\nWORKERS=$(( (<span class=\"num\">2</span> * NUM_CORES) +\
    \ <span class=\"num\">1</span> ))\nTHREADS_PER_WORKER=<span class=\"num\">4</span>\n\
    BIND_ADDRESS=<span class=\"str\">\"0.0.0.0:5000\"</span>\nTIMEOUT=<span class=\"\
    num\">60</span>\n\necho <span class=\"str\">\"\U0001F680 Starting Gunicorn WSGI\
    \ Server with ${WORKERS} workers and ${THREADS_PER_WORKER} threads/worker...\"\
    </span>\n\nexec gunicorn \\\n    --workers=${WORKERS} \\\n    --threads=${THREADS_PER_WORKER}\
    \ \\\n    --bind=${BIND_ADDRESS} \\\n    --timeout=${TIMEOUT} \\\n    --worker-<span\
    \ class=\"kw\">class</span>=gthread \\\n    --access-logfile=- \\\n    --error-logfile=-\
    \ \\\n    --log-level=info \\\n    app:app</pre>\n</div>\n<!-- /theory -->\n<h2\
    \ class=\"sh2\">\n       ⚡ Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size:\
    \ 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\">\n       \U0001F50D\
    \n       <strong>\n        Search terms:\n       </strong>\n\n        deploy ml\
    \ model to kubernetes deployment service yaml, docker file sizes multi stage build\n\
    \       \n</div>\n<h2 class=\"sh2\">\n       \U0001F0CF Revision Flashcards —\
    \ Day 119\n      </h2>\n<p class=\"flashcard-hint\" style=\"font-size: 12px; font-family:var(--font-mono);\
    \ color:var(--muted); text-transform:uppercase; margin-bottom:8px;\">\n      \
    \ CLICK EACH CARD TO FLIP ↓\n      </p>"
