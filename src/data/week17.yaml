  title: Flask Fundamentals — Routes, Views & Blueprints
  subtitle: Ab tak tumne ML models banaye, tune kiye, aur evaluate kiya. Ab unhe duniya
    ke saamne laane ka waqt aa gaya hai. Flask ek micro web framework hai — chhota,
    fast, aur Python-native — jo tumhare model ko ek real HTTP API mein badal deta
    hai.
  time_estimate: 6 hours
  difficulty: +150 XP
  badges:
  - label: 📈 Intermediate
    variant: b
  - label: Flask
    variant: t
  xp: 150
  objectives:
  - Understand Flask's request-response cycle and WSGI fundamentals.
  - Create routes with path parameters, query strings, and HTTP methods.
  - Use Jinja2 templates and return JSON responses.
  - Organise a Flask app using Blueprints for production structure.
  - Apply Flask's application factory pattern for testable, scalable apps.
  checklist: []
  concept_flow:
  - Flask Routes
  - View Functions
  - Jinja2 Templates
  - Blueprints
  - WSGI & Gunicorn
  - API Deployments
  hinglish: Pydantic validation ensures ki API correct data receive karta hai. Wrong
    input par clear error messages milte hain. Ye debugging production issues kaafi
    asan karta hai!
  analogy: Flask ko samjho jaise ek post office counter. Ek request aata hai (customer),
    route (@app.route) decide karta hai kaun serve karega (kaunsa clerk), view function
    (clerk) kaam karta hai, aur response wapas jata hai (parcel deliver). Bina route
    ke, request lost ho jaata hai.
