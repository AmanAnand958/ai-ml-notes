- id: '123'
  day_num: 123
  title: Docker Compose — Multi-Container ML Stacks
  subtitle: Real ML systems kabhi single container nahi hote. Flask API + Redis cache
    + PostgreSQL + Nginx — sab milke ek stack banta hai. Docker Compose is stack ko
    ek file mein define karta hai aur ek command se start karta hai.
  time_estimate: 7 hours
  difficulty: +200 XP
  badges:
  - label: 📈 Intermediate
    variant: b
  - label: Docker Compose
    variant: t
  xp: 150
  objectives:
  - Write a docker-compose.yml for a Flask ML API with Redis caching.
  - Use environment variables and .env files with Compose.
  - Configure health checks, restart policies, and dependency ordering.
