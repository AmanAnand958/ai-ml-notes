    - Layer Normalization computes statistics across the feature dimension, making it ideal for variable-length sequences.
    - Production inference pipelines must cleanly parse, map, and pad raw text strings on the fly.
    - Benchmarking requires tracking p95/p99 latency percentiles to measure real-world performance accurately.
