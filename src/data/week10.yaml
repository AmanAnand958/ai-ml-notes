  - front: Long Short-Term Memory network utilizing input, forget, and output gates with a memory cell state to prevent vanishing gradients.
    back: It is a key day in Week 10 (Recurrent Networks, LSTMs, GRUs, Sequence Models).
  - front: Why is PyTorch pack_padded_sequence used during batch RNN training?
    back: It compresses variable-length sequences by omitting padding tokens, skipping redundant computations and accelerating GPU throughput.
