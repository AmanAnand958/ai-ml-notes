    \ font-size=\"11\" font-weight=\"700\" text-anchor=\"start\" x=\"440\" y=\"92\">\n        tanh — ∏(1−h²)·Wᵀ\n       </text>\n\
    <path d=\"M 70.0 235.0 L 74.8 229.2 L 79.7 223.4 L 84.5 217.6 L 89.3 211.8 L 94.2 206.1 L 99.0 200.3 L 103.8 194.5 L 108.7\
