    \ git commit -m \"day-toolkit: when-global-average-pooling-gap-fails\"\n        </div>\n</div>\n</div><div class=\"task-block\">\n<div aria-expanded=\"false\" class=\"task-header\" onclick=\"toggleTask(this)\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\" role=\"button\" style=\"background:rgba(79,209,165,.05);border-left:3px solid var(--green)\" tabindex=\"0\">\n<span class=\"task-badge tb-hard\">\n         Scenario Q4\n        </span>\n<span class=\"task-title\">\n         Receptive Field Bottleneck &amp; Vision Transformers (ViTs)\n        </span>\n</div>\n<div class=\"task-body\" style=\"display:block\">\n<p>\n<strong>\n          Question:\n         </strong>\n         What is the \"receptive field bottleneck\" in deep CNNs? How do modern Vision Transformers (ViTs) resolve this bottleneck, and what are the trade-offs involved?\n        </p>\n<p>\n<strong>\n          Answer:\n         </strong>\n<br/>\n         1.\n         <strong>\n          The Bottleneck:\n\
    \         </strong>\n         In CNNs, the receptive field grows linearly with depth. In early layers, neurons only see tiny, highly localized patches. If the network needs to capture global context (e.g. relation between objects on opposite sides of an image), it must go extremely deep, losing spatial resolution and suffering from gradient dilution.\n         <br/>\n         2.\n         <strong>\n          ViTs Resolution:\n         </strong>\n         Vision Transformers divide the image into patches (e.g. 16x16) and treat them as sequence tokens. By applying\n         <strong>\n          Self-Attention\n         </strong>\n         across all tokens, every pixel patch can communicate with *every other pixel patch* immediately in the very first layer. Receptive field size is effectively infinite from layer 1!\n         <br/>\n         3.\n         <strong>\n          Trade-offs:\n         </strong>\n         ViTs lack the \"inductive bias\" of CNNs (translation invariance and local\
    \ connectivity). Therefore, ViTs require massive datasets (e.g. JFT-300M) or heavy data augmentation to converge, and have quadratic computational complexity with respect to image resolution.\n        </p>\n<button class=\"solution-toggle\" onclick=\"toggleSolution('sol-w10t18', this)\" style=\"margin-top: 0.8rem; background: rgba(108,140,255,0.1); color: var(--blue); border: 1px solid var(--blue); padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600;\">\n         \U0001F4A1 Show Solution\n        </button>\n<div class=\"solution-box\" id=\"sol-w10t18\" style=\"margin-top: 1rem;\">\n<div class=\"sol-header\">\n          ✅ COMPLETE SOLUTION — receptive_field_bottleneck_vision_transf.py\n         </div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n            python\n           </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n             copy\n            </button>\n<button class=\"\
