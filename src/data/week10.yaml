  - title: Build a Vanilla RNN Neuron from scratch
    badge: Hard · 2.5 hrs
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p><strong>\n           Write an executable Python script:\n           <br/>\n           1. Implement a\
      \ custom\n           \n            VanillaRNNCell\n           \n           class using only numpy.\n           <br/>\n\
