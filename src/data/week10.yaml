  tasks:
  - title: Build a Stacked LSTM Classifier
    badge: Hard · 2 hrs
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p><strong>\n           Write an executable Python script using Keras:\n           <br/>\n           1.\
      \ Synthesize a sequence dataset of shape (100, 50, 8).\n           <br/>\n           2. Develop a 3-layer Deep Stacked\
      \ Bidirectional LSTM.\n           <br/>\n           3. Verify that the first two layers use\n           \n         \
      \   return_sequences=True\n           \n           , and the final layer collapses to 2D using\n           \n      \
      \      return_sequences=False\n           \n           .\n           <br/>\n           4. Print the model summary and\
      \ verify the tensor shape output of each layer matches your mathematical projections.\n          </strong></p>"
    done_when: Your script runs end-to-end, prints the model summary, and matches the layer shapes exactly with no dimension
      mismatch runtime warnings.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day68: complete day 68 tasks and coding exercises"'
    sol_id: sol-w10d68t1
    solution_title: ✅ COMPLETE SOLUTION — build_a_stacked_lstm_classifier.py
    solution_code: |-
      # Day 68 Task 1: Build a Stacked LSTM Network
      import numpy as np

      class LSTMCell:
          def __init__(self, in_dim: int, hid_dim: int):
              self.W = np.random.randn(in_dim + hid_dim, 4 * hid_dim) * 0.05
              self.hid_dim = hid_dim

          def step(self, x: np.ndarray, state: tuple) -> tuple:
              h, c = state
              xh = np.concatenate([x, h], axis=-1)
              gates = xh @ self.W
              f, i, o, g = np.split(gates, 4, axis=-1)
              f = 1 / (1 + np.exp(-f))  # Forget
              i = 1 / (1 + np.exp(-i))  # Input
              o = 1 / (1 + np.exp(-o))  # Output
              g = np.tanh(g)            # Candidate
              c_new = f * c + i * g
              h_new = o * np.tanh(c_new)
              return h_new, c_new

      cell1 = LSTMCell(in_dim=32, hid_dim=64)
      cell2 = LSTMCell(in_dim=64, hid_dim=64)
      x = np.random.randn(2, 32)
      s1 = cell1.step(x, (np.zeros((2, 64)), np.zeros((2, 64))))
      s2 = cell2.step(s1[0], (np.zeros((2, 64)), np.zeros((2, 64))))

      print("Stacked LSTM Layer 2 Output:", s2[0].shape)
      assert s2[0].shape == (2, 64)
      print("✓ Stacked LSTM verified.")
    solution_lang: python
  - title: Trace Stacked Parameter Counts
    badge: Medium · 1 hr
    badge_class: tb-med
    time: 45 min
    prompt_html: |-
      <p><strong>
                  Calculate the total trainable parameters of:
                  <br/>
                  - An LSTM layer with Hidden dimension H = 32 and Input dimension F = 10.
                  <br/>
                  - Recall that the LSTM parameter formula is: Parameter Count = 4 * (H * (H + F + 1)).
                  <br/>
                  Show your step-by-step arithmetic.
                 </strong></p>
    done_when: Your calculations correctly prove that the layer parameter size is 4 * (32 * (32 + 10 + 1)) = 4 * (32 * 43)
      = 4 * 1376 = exactly 5,504 parameters.
    git_cmd: 'git add trace_stacked_parameter_counts.py &amp;&amp; git commit -m "feat(day): day68: trace-stacked-parameter-counts"'
    sol_id: sol-w10d68t2
    solution_title: ✅ COMPLETE SOLUTION — trace_stacked_parameter_counts.py
    solution_code: |-
      # Day 68 Task 2: Trace Stacked LSTM Parameter Calculation
      def lstm_parameter_count(in_dim: int, hid_dim: int, num_layers: int = 2) -> int:
          total = 0
          for l in range(num_layers):
              dim_in = in_dim if l == 0 else hid_dim
              # 4 gates (input, forget, cell, output)
              total += 4 * ((dim_in + hid_dim + 1) * hid_dim)
          return total

      params = lstm_parameter_count(in_dim=64, hid_dim=128, num_layers=2)
      print("2-Layer Stacked LSTM Total Parameters:", params)
      assert params == 4 * ((64 + 128 + 1) * 128) + 4 * ((128 + 128 + 1) * 128)
      print("✓ Stacked LSTM parameter formula verified.")
    solution_lang: python
