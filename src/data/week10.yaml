  quizzes:
  - num_str: Q1 OF 3
    question: What is the advantage of Spatial Dropout 1D over standard Dropout for regularizing sequence embeddings?
    qid: q71_1
    options:
    - letter: A
      text: It speeds up training times by 50%.
      is_correct: false
    - letter: B
      text: It zeroes out entire 1D feature channels instead of individual elements, preventing adjacent words from leaking active channel values and rendering dropout ineffective.
      is_correct: true
    - letter: C
      text: It acts as a trainable bias array.
      is_correct: false
    - letter: D
      text: It deletes infrequent vocabulary words.
      is_correct: false
    correct_fb: ✅ Correct! In sequential embedding dimensions, adjacent features are highly correlated. Standard dropout is easily bypassed because nearby words leak the missing values. Spatial Dropout 1D drops the entire feature dimension across all timesteps, forcing robust feature learning.
    wrong_fb: ❌ Think about correlation. If words are highly correlated, can standard dropout be easily bypassed by looking at neighbor tokens? How does dropping the entire column across time solve this leakage?
  - num_str: Q2 OF 3
    question: Why does Keras load_data restrict vocabulary with the parameter num_words=10000?
    qid: q71_2
    options:
    - letter: A
      text: Because only 10,000 words exist in the English language.
      is_correct: false
    - letter: B
      text: To keep the vocabulary size manageable, ignoring highly infrequent, noisy words and drastically reducing the parameter count of the Embedding Layer.
      is_correct: true
    - letter: C
      text: To speed up sequential text loading.
      is_correct: false
    - letter: D
      text: To enforce positive activation constraints.
      is_correct: false
    correct_fb: ✅ Correct! The IMDB corpus contains hundreds of thousands of rare typos or names. Restricting the vocabulary to the top 10,000 most frequent words filters out noise and keeps the embedding layer parameter counts from inflating.
    wrong_fb: ❌ What would happen to the Embedding matrix E if we had to allocate a row vector for every rare spelling mistake or user username in the corpus? Does num_words keep this vocabulary compact?
  - num_str: Q3 OF 3
    question: What is the functional difference between the callbacks EarlyStopping and ModelCheckpoint?
    qid: q71_3
    options:
    - letter: A
      text: EarlyStopping halts training when validation loss stops improving, while ModelCheckpoint saves the optimal set of weights during the training loop.
      is_correct: true
    - letter: B
      text: EarlyStopping updates the learning rate, while ModelCheckpoint updates weight biases.
      is_correct: false
    - letter: C
      text: EarlyStopping tracks training loss, while ModelCheckpoint tracks validation recall.
      is_correct: false
    - letter: D
      text: There is no difference; they are synonymous callbacks.
      is_correct: false
    correct_fb: ✅ Correct! EarlyStopping acts as an automatic brake to save training cycles when validation loss degrades, while ModelCheckpoint acts as a continuous safety net, saving the absolute best model weights to disk.
    wrong_fb: ❌ Think about the names. EarlyStopping stops early — what does this do to training cycles? ModelCheckpoint saves a checkpoint — what does it write to disk?
  flashcards:
  - front: Teacher Forcing?
    back: Feeding ground-truth tokens from target set as next step input during sequence training.
  - front: Sequence-to-Sequence?
    back: Architecture utilizing Encoder to summarize input and Decoder to emit target sequences.
  - front: Long Short-Term Memory network utilizing input, forget, and output gates with a memory cell state to prevent vanishing gradients.
    back: It is a key day in Week 10 (Recurrent Networks, LSTMs, GRUs, Sequence Models).
  - front: What is the difference between Word2Vec Skip-gram and Continuous Bag of Words (CBOW)?
    back: CBOW predicts a target word from surrounding context words; Skip-gram predicts the surrounding context words given a target word (better for rare words).
