- id: 68
  day_num: 68
  title: Deep Stacked LSTMs & Overfitting
  subtitle: "Single-layer LSTMs can struggle to extract complex hierarchical abstractions from raw sequences.\n To capture\
    \ deeper patterns, we buildStacked Recurrent Networksby placing multiple recurrent layers on top of one another.\n Today,\
    \ we master the architecture ofDeep Stacked LSTMs,\n analyze sequence dimension contraction mathematically,\n dissect\
    \ Keras's crucial\n \n return_sequences\n \n parameter,\n and formulate effective regularization strategies (Dropout,\
    \ Recurrent Dropout) to prevent deep models from overfitting."
  time_estimate: 5 hours
  difficulty: Medium
  badges:
