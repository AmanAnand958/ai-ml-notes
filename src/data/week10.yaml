    prompt_html: "<p>\n           Write an executable Python script:\n           <br/>\n           1. Implement a custom\n           \n            VanillaRNNCell\n           \n           class using only numpy.\n           <br/>\n           2. Build a forward pass method accepting inputs of shape (Batch, Timesteps, Features).\n           <br/>\n           3. Propagate the hidden states across exactly 10 timesteps.\n           <br/>\n           4. Print the final hidden vectors for a batch of 4 samples.\n          </p>"
