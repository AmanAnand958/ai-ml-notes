  quizzes:
  - num_str: Q1 OF 3
    question: What is the functional purpose of the Forget Gate in an LSTM cell?
    qid: q67_1
    options:
    - letter: A
      text: It resets all weights in the hidden layers to zero.
      is_correct: false
    - letter: B
      text: It outputs a sigmoid value between 0 and 1, regulating exactly what percentage of historical memory (Cell State) is discarded or preserved.
      is_correct: true
    - letter: C
      text: It speeds up the backpropagation step by 10 epochs.
      is_correct: false
    - letter: D
      text: It deletes low-frequency text tokens.
      is_correct: false
    correct_fb: ✅ Correct! The Forget gate applies a sigmoid function to the combined input and past hidden state. A result near 0 discards that memory dimension, while a result near 1 preserves it perfectly.
    wrong_fb: ❌ Remember that forget gates regulate long-term memory (Cell State). If it outputs 0.0, what does element-wise multiplication do to that part of the past Cell State? Does it erase it?
  - num_str: Q2 OF 3
    question: Which gates are utilized in a Gated Recurrent Unit (GRU) cell?
    qid: q67_2
    options:
    - letter: A
      text: Forget, Input, and Output gates.
      is_correct: false
    - letter: B
      text: Update and Reset gates, combining the cell and hidden states into a single unified track.
      is_correct: true
    - letter: C
      text: Activation and Loss gates.
      is_correct: false
    - letter: D
      text: Pooling and Convolution gates.
      is_correct: false
    correct_fb: '✅ Correct! GRUs simplify the LSTM structure by merging the cell state and hidden state, and utilizing only two gates: Update (determines retention) and Reset (determines forgetting). This reduces parameter size by ~25%.'
    wrong_fb: ❌ GRUs are a more compact variant of LSTMs. They do not have a separate Cell State. What are the names of the two gates that replace the three LSTM gates?
  - num_str: Q3 OF 3
    question: What is the advantage of the Constant Error Carousel (CEC) in LSTM cells?
    qid: q67_3
    options:
    - letter: A
      text: It allows error gradients to flow backward through the cell state without decaying exponentially, effectively solving the vanishing gradient problem.
      is_correct: true
    - letter: B
      text: It makes training recurrent cells 5x faster.
      is_correct: false
    - letter: C
      text: It reduces the embedding layers to one dimension.
      is_correct: false
    - letter: D
      text: It deletes outlier values.
      is_correct: false
    correct_fb: ✅ Correct! The CEC is the linear update channel of the cell state. Because the derivative of the cell state with respect to the past cell state is approximately 1.0 (when the forget gate is open), gradients can flow back infinitely without vanishing.
    wrong_fb: ❌ Think about BPTT. In normal RNNs, gradients vanish due to repeated matrix multiplications. How does the cell state update equation bypass these multiplications when the forget gate is open?
