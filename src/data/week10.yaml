  tasks:
  - title: Build a Custom GRU Classifier Network
    badge: Hard · 2 hrs
    badge_class: tb-hard
    time: 90 min
    prompt_html: |-
      <p><strong>
                 Write an executable Python script using Keras:
                 <br/>
                 1. Synthesize a 3D sequential dataset of shape (128, 30, 4).
                 <br/>
                 2. Build a Gated Recurrent Unit (GRU) classification network.
                 <br/>
                 3. Compile the network and execute training over 3 complete epochs.
                 <br/>
                 4. Print the final classification loss and accuracy trends.
                </strong></p>
    done_when: Your script runs end-to-end, displays the training progression logs, and compiles the model without warning
      flags.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day67: LSTM cell state sigmoid gate forward pass in NumPy"'
    sol_id: sol-w10d67t1
    solution_title: ✅ COMPLETE SOLUTION — build_a_custom_gru_classifier_network.py
    solution_code: |-
      # Day 67 Task 1: Build a Custom GRU Cell from Scratch
      import numpy as np

      class CustomGRUCell:
          def __init__(self, input_dim: int, hidden_dim: int):
              np.random.seed(42)
              # Update gate (z), Reset gate (r), Candidate hidden (h_tilde)
              self.Wz = np.random.randn(input_dim + hidden_dim, hidden_dim) * 0.1
              self.Wr = np.random.randn(input_dim + hidden_dim, hidden_dim) * 0.1
              self.Wh = np.random.randn(input_dim + hidden_dim, hidden_dim) * 0.1

          def forward(self, x: np.ndarray, h_prev: np.ndarray) -> np.ndarray:
              xh = np.concatenate([x, h_prev], axis=-1)
              z = 1.0 / (1.0 + np.exp(-xh @ self.Wz))  # update gate
              r = 1.0 / (1.0 + np.exp(-xh @ self.Wr))  # reset gate
              xh_r = np.concatenate([x, r * h_prev], axis=-1)
              h_tilde = np.tanh(xh_r @ self.Wh)       # candidate hidden
              h = (1 - z) * h_prev + z * h_tilde      # new hidden state
              return h

      cell = CustomGRUCell(input_dim=10, hidden_dim=20)
      x = np.random.randn(4, 10)
      h_prev = np.zeros((4, 20))
      h_next = cell.forward(x, h_prev)

      print("GRU Output Hidden State Shape:", h_next.shape)
      assert h_next.shape == (4, 20)
      print("✓ Custom GRU forward step verified.")
    solution_lang: python
  - title: Trace GRU Parameter Calculations
    badge: Medium · 1 hr
    badge_class: tb-med
    time: 45 min
    prompt_html: |-
      <p><strong>
                  Calculate the total trainable parameters of:
                  <br/>
                  - A GRU layer with Hidden dimension H = 32 and Input dimension F = 8.
                  <br/>
                  - Recall that the GRU parameter formula is: Parameter Count = 3 * (H * (H + F + 1)).
                  <br/>
                  Show your step-by-step arithmetic.
                 </strong></p>
    done_when: Your calculations correctly prove that the layer parameter size is 3 * (32 * (32 + 8 + 1)) = 3 * (32 * 41)
      = 3 * 1312 = exactly 3,936 parameters.
    git_cmd: 'git add trace_gru_parameter_calculations.py &amp;&amp; git commit -m "feat(day): day67: trace-gru-parameter-calculations"'
    sol_id: sol-w10d67t2
    solution_title: ✅ COMPLETE SOLUTION — trace_gru_parameter_calculations.py
    solution_code: |-
      # Day 67 Task 2: Trace GRU Parameter Count Calculation
      def gru_parameter_count(input_dim: int, hidden_dim: int) -> dict:
          # GRU has 3 sets of gates (reset, update, candidate)
          # Each gate has weights for input (input_dim * hidden_dim), hidden (hidden_dim * hidden_dim), and bias (hidden_dim)
          params_per_gate = (input_dim + hidden_dim + 1) * hidden_dim
          total_params = 3 * params_per_gate
          return {"per_gate": params_per_gate, "total": total_params}

      p = gru_parameter_count(input_dim=128, hidden_dim=256)
      print(f"GRU (d_in=128, d_hid=256) -> Total Parameters: {p['total']:,}")
      assert p["total"] == 3 * (128 + 256 + 1) * 256
      print("✓ GRU parameter formula verified.")
    solution_lang: python
