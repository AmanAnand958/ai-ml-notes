  predict:
    question: What is the MSE loss value for target [3, 5] and prediction [2, 5]?
    answer: '0.5'
    explanation: MSE = ((3-2)^2 + (5-5)^2)/2 = (1 + 0)/2 = 0.5.
    code: |-
      import numpy as np
      y_true = np.array([3.0, 5.0])
      y_pred = np.array([2.0, 5.0])
      mse = np.mean((y_true - y_pred)**2)
      print(f'{mse:.1f}')
