    \ dict = {}\n\n<span class=\"kw\">class</span> <span class=\"cls\">Query</span>(BaseModel):\n    question: str\n    top_k: int = <span class=\"num\">3</span>\n\n<span class=\"kw\">class</span> <span class=\"cls\">Answer</span>(BaseModel):\n    answer: str\n    sources: list[str]\n\n<span class=\"cm\"># 3. Endpoints</span>\n@app.<span class=\"fn\">post</span>(<span class=\"str\">\"/ingest\"</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">ingest_document</span>(doc: Document):\n    <span class=\"str\">\"\"\"Add a document to the knowledge base.\"\"\"</span>\n    doc_id = <span class=\"str\">f\"doc_{collection.count()}\"</span>\n    collection.<span class=\"fn\">add</span>(\n        documents=[doc.text],\n        metadatas=[doc.metadata],\n        ids=[doc_id],\n    )\n    <span class=\"kw\">return</span> {<span class=\"str\">\"status\": \"ingested\", \"id\": doc_id, \"total_docs\"</span>: collection.<span class=\"fn\">count</span>()}\n\n@app.<span\
