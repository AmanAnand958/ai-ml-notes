- id: 70
  day_num: 70
  title: Tokenization & Word Embeddings
  subtitle: |-
    Computers do not understand raw words or text.
     Before feeding text to an RNN, we must map it into mathematical representations.
     Today, we masterNatural Language Processing (NLP) PreprocessingandWord Embeddings.
     We will dissect text normalization and vocabulary mapping,
     analyze why One-Hot encodings fail on language modeling,
     and formulate how atrainable Embedding Layeracts as a projection matrix to represent semantic relationships.
  time_estimate: 5 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Execute clean text normalization, tokenization, and integer vocabulary mapping.
  - Demonstrate why one-hot encoding fails on high-vocabulary NLP tasks.
  - Formulate the mathematical operations of a trainable Word Embedding Layer as a projection matrix.
  - Configure padding and truncation sequence alignments (pre-padding vs. post-padding) in Keras.
  checklist:
  - id: chk_70_1
    text: Derive and analyze mathematical and architectural principles for Tokenization & Word Embeddings
  - id: chk_70_2
    text: Build and benchmark production coding pipelines for Tokenization & Word Embeddings
  - id: chk_70_3
    text: Execute and validate test verification suite for Build a Custom Tokenization Pipeline
  - id: chk_70_4
    text: Evaluate conceptual mastery via interactive flashcards and quiz challenges
  concept_flow:
  - RNN Hidden States & Vanishing Gradients
  - LSTM & GRU Cells
  - Deep Stacked LSTMs & Overfitting
  - Time Series Forecasting with LSTMs
  - Tokenization & Word Embeddings
  - 'Project: Movie Review Sentiment Classifier'
  - Capstone Validation & Edge Deployment
  hinglish: 'Stacked RNNs: multiple RNN layers ek ke upar ek. Pehli layer basic patterns seekhti hai, upar ki layers complex
    patterns. Dropout use karo layers ke beech regularization ke liye!'
  analogy: One-Hot Encoding bilkul ek aise dictionary lookup map ki tarah hai jisme har word ko represent karne ke liye pure
    page par sirf ek '1' likha ho aur baaki sab empty (0) ho. Trainable Embeddings bilkul ek premium index coordinates map
    ki tarah hain, jahan har city (word) ko latitude aur longitude (embedding vectors) diye jate hain. Isse similar regions
    (similar words) ke beech ka spatial distance nikalna aasan ho jata hai!
  theory_html: "<h3 class=\"sh3\">\n       1. The Text Preprocessing Pipeline\n      </h3>\n<p>\n       Converting raw text\
    \ into sequential tensors involves three distinct operations:\n      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n\
    \         Text Normalization:\n        </strong>\n        Converting all characters to lowercase and stripping out punctuation\
    \ or special symbols.\n      This prevents \"DeepLearning!\" and \"deeplearning\" from being registered as separate vocabulary\
    \ words.\n       </li>\n<li>\n<strong>\n         Tokenization:\n        </strong>\n        Splitting continuous text strings\
    \ into individual discrete units called\n        <strong>\n         tokens\n        </strong>\n        (typically words\
    \ or sub-words).\n       </li>\n<li>\n<strong>\n         Vocabulary Indexing:\n        </strong>\n        Assigning a\
    \ unique integer index to each unique token in the dataset, creating a dictionary lookup map.\n      For example, the\
    \ sentence\n        <em>\n         \"I love neural networks\"\n        </em>\n        becomes\n        \n         [12,\
    \ 45, 9, 312]\n        \n        .\n       </li>\n</ul>\n<h3 class=\"sh3\">\n       2. The Failure of One-Hot Encodings\n\
    \      </h3>\n<p>\n       If we have a vocabulary of $V = 20,000$ unique words,\n    we could represent each word as a\
    \ one-hot vector of size 20,000 (where only the word's index is 1, and all others are 0).\n    This classical approach\
    \ has two crippling disadvantages:\n      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         Dimensionality Explosion:\n\
    \        </strong>\n        Representing a 100-word review requires a matrix of $100 \\times 20,000 = 2,000,000$ integers,\
    \ causing severe GPU RAM bottlenecks.\n       </li>\n<li>\n<strong>\n         Zero Semantic Distance:\n        </strong>\n\
    \        The dot product between any two distinct one-hot vectors is\n        <strong>\n         0\n        </strong>\n\
    \        . In this vector space, \"cat\" is mathematically as distant from \"dog\" as it is from \"car\". There is no\
    \ encoding of meaning or semantic similarity.\n       </li>\n</ul>\n<h3 class=\"sh3\">\n       3. Trainable Embeddings\
    \ as Projection Matrices\n      </h3>\n<p>\n       A\n       <strong>\n        Word Embedding\n       </strong>\n    \
    \   maps each word to a dense, continuous vector of small dimension $D$ (typically 64, 128, or 300).\n    Instead of hardcoding\
    \ these values, we initialize a\n       <strong>\n        trainable embedding matrix\n       </strong>\n       $E$:\n\
    \      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$E \\in \\mathbb{R}^{V \\times D}$$\n    \
    \   </span>\n<span class=\"desc\">\n        Where V is the vocabulary size and D is the embedding dimension. Each row\
    \ represents a learnable vector for a specific word.\n       </span>\n</div>\n<p>\n       When a word index $i$ passes\
    \ through the embedding layer,\n    it performs a lookup operation.\n    Mathematically, this is equivalent to multiplying\
    \ the one-hot vector $v_i \\in \\mathbb{R}^{1 \\times V}$ by the embedding projection matrix $E$:\n      </p>\n<div class=\"\
    math-block\">\n<span class=\"formula\">\n        $$e_i = v_i \\cdot E$$\n       </span>\n</div>\n<p>\n       During training,\
    \ the weights of $E$ are updated via backpropagation.\n    Words that appear in similar contexts (like \"king\" and \"\
    queen\", or \"delightful\" and \"excellent\") are pushed together, developing high cosine similarity values.\n      </p>\n\
    <h3 class=\"sh3\">\n       4. Sequence Padding &amp; Alignment Mechanics\n      </h3>\n<p>\n       RNNs process data in\
    \ batches, which requires all sequence tensors in a batch to share the exact same temporal length.\n    We resolve this\
    \ by setting a maximum sequence length ($T$) and using\n       <strong>\n        padding\n       </strong>\n       :\n\
    \       <ul style=\"margin-left:1.2rem; line-height:1.7; margin-top:0.5rem; margin-bottom:0.8rem;\">\n<li>\n<strong>Pre-padding:</strong>\
    \ Adding zeros at the <em>start</em> of short sequences.\n</li>\n<li>\n<strong>Post-padding:</strong> Adding zeros at\
    \ the <em>end</em> of short sequences.\n</li>\n</ul>\n</p>\n<h3 class=\"sh3\">\n       5. Mathematical Derivation of Hidden\
    \ State Dilution\n      </h3>\n<p>\n       Let's mathematically prove why post-padding dilutes the recurrent network memory.\n\
    \    Suppose a sequence of length 3 is padded to length 6 using post-padding.\n    At timestep $t \\ge 4$, the input vector\
    \ $x_t = \\mathbf{0}$.\n    The hidden state recurrent step equation simplifies to:\n      </p>\n<div class=\"math-block\"\
    >\n<span class=\"formula\">\n        $$h_t = \\tanh(W_{hh} h_{t-1} + W_{xh} \\mathbf{0} + b_h) = \\tanh(W_{hh} h_{t-1}\
    \ + b_h)$$\n       </span>\n</div>\n<p>\n       Since $\\tanh$ is a contracting mapping (with a derivative $\\le 1.0$),\n\
    \    applying this step repeatedly over $M$ padding steps causes the hidden state to decay exponentially towards the activation\
    \ of the bias vector:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$\\lim_{M \\to \\infty}\
    \ h_{t+M} = \\tanh(b_h)$$\n       </span>\n</div>\n<p>\n       Let's trace this decay with a concrete decimal matrix dry-run.\n\
    \    Suppose the actual sentence ends at step 3, and is followed by 3 padding steps:\n      </p>\n<div class=\"cb\">\n\
    <div class=\"cb-head\">\n<span class=\"cb-lang\">\n         dryrun — hidden_decay.txt\n        </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button><button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">Run</button></div>\n</div>\n<pre><code><span class=\"kw\">from</span> typing <span class=\"\
    kw\">import</span> List, Dict\n\n<span class=\"kw\">class</span> <span class=\"cls\">CustomVocabularyTokenizer</span>:\n\
    \    <span class=\"str\">\"\"\"</span>\n    Production Text Tokenizer <span class=\"kw\">for</span> Sequence Models:\n\
    \    Handles special <span class=\"fn\">tokens</span> (&lt;PAD&gt;, &lt;UNK&gt;, &lt;SOS&gt;, &lt;EOS&gt;), frequency\
    \ pruning, <span class=\"kw\">and</span> sequence padding.\n    <span class=\"str\">\"\"\"</span>\n    <span class=\"\
    kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, min_freq: int = <span class=\"num\"\
    >2</span>):\n        <span class=\"kw\">self</span>.min_freq = min_freq\n        <span class=\"kw\">self</span>.pad_token\
    \ = <span class=\"str\">\"&lt;PAD&gt;\"</span>\n        <span class=\"kw\">self</span>.unk_token = <span class=\"str\"\
    >\"&lt;UNK&gt;\"</span>\n        <span class=\"kw\">self</span>.word2idx: Dict[str, int] = {<span class=\"kw\">self</span>.pad_token:\
    \ <span class=\"num\">0</span>, <span class=\"kw\">self</span>.unk_token: <span class=\"num\">1</span>}\n        <span\
    \ class=\"kw\">self</span>.idx2word: Dict[int, str] = {<span class=\"num\">0</span>: <span class=\"kw\">self</span>.pad_token,\
    \ <span class=\"num\">1</span>: <span class=\"kw\">self</span>.unk_token}\n\n    <span class=\"kw\">def</span> <span class=\"\
    fn\">build_vocab</span>(<span class=\"kw\">self</span>, texts: List[str]):\n        freqs = {}\n        <span class=\"\
    kw\">for</span> text <span class=\"kw\">in</span> texts:\n            <span class=\"kw\">for</span> word <span class=\"\
    kw\">in</span> text.<span class=\"fn\">lower</span>().<span class=\"fn\">split</span>():\n                freqs[word]\
    \ = freqs.<span class=\"fn\">get</span>(word, <span class=\"num\">0</span>) + <span class=\"num\">1</span>\n         \
    \       \n        <span class=\"kw\">for</span> word, count <span class=\"kw\">in</span> freqs.<span class=\"fn\">items</span>():\n\
    \            <span class=\"kw\">if</span> count >= <span class=\"kw\">self</span>.min_freq <span class=\"kw\">and</span>\
