  - front: BLEU Score (N-Gram Metric)?
    back: N-gram precision comparison between predicted and reference target sequences. This establishes the core invariant
      in Capstone Validation & Edge Deployment, ensuring memory efficiency, numerical stability, and robust scaling.
  - front: 'Core concept: What is the significance of Beam Search? in Capstone Validation & Edge Deployment?'
    back: Decoding method tracking top-k likelihood paths at each step instead of greedy sampling.
  - front: Long Short-Term Memory network utilizing input, forget, and output gates with a memory cell state to prevent v
      (D72)?
    back: It is a key day in Week 10 (Recurrent Networks, LSTMs, GRUs, Sequence Models).
  - front: Why is PyTorch pack_padded_sequence used during batch RNN training?
    back: It compresses variable-length sequences by omitting padding tokens, skipping redundant computations and accelerating
      GPU throughput.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling Capstone Validation & Edge Deployment in distributed
      systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: RNN Hidden State Retention'
    description: Always detach hidden states when backpropagating through time across batches to prevent memory explosions.
