  quizzes:
  - num_str: Q1 OF 3
    question: Why do vanilla RNNs suffer from the Vanishing Gradient problem during Backpropagation Through Time (BPTT)?
    qid: q66_1
    options:
    - letter: A
      text: Because they only use ReLU activation functions.
      is_correct: false
    - letter: B
      text: Because backpropagating through many steps requires multiplying intermediate Jacobian matrices, causing the gradients to decay exponentially if eigenvalues are less than 1.0.
      is_correct: true
    - letter: C
      text: Because weights are not shared across timesteps.
      is_correct: false
    - letter: D
      text: To enforce L1 normalization constraints.
      is_correct: false
    correct_fb: ✅ Correct! Backpropagating over dozens of timesteps requires repeated multiplication by the transpose of the recurrent weight matrix. If the eigenvalues are less than 1.0, this repeated contraction drives the gradient down to absolute zero.
    wrong_fb: ❌ Think about the chain rule. In an unrolled RNN, how do gradients at step 10 reach step 1? Do they pass through multiple step matrix multiplications? What happens when you repeatedly multiply small numbers?
  - num_str: Q2 OF 3
    question: What is the shape of the recurrent weight matrix W_hh in a vanilla recurrent cell with 32 hidden units?
    qid: q66_2
    options:
    - letter: A
      text: (32, 1)
      is_correct: false
    - letter: B
      text: (32, 32), because it maps the previous 32-dimensional hidden state vector to the next 32-dimensional hidden state.
      is_correct: true
    - letter: C
      text: (1, 32)
      is_correct: false
    - letter: D
      text: (64, 32)
      is_correct: false
    correct_fb: ✅ Correct! The recurrent matrix W_hh transforms the previous hidden state vector h_{t-1} into the next hidden state context vector. Since both share the hidden dimension H = 32, the matrix must be square of shape (32, 32).
    wrong_fb: ❌ W_hh is multiplied by the previous hidden state vector of size [H, 1], and the resulting vector is added to the input projection of size [H, 1]. What size must W_hh be to multiply [H, 1] and output [H, 1]?
  - num_str: Q3 OF 3
    question: Why is the tanh activation function preferred over sigmoid in the recurrent cell state calculation?
    qid: q66_3
    options:
    - letter: A
      text: Because tanh has a range of (-1, 1) and zero-centered outputs, which helps control activation drift, and its derivative is larger than sigmoid's, reducing gradient decay.
      is_correct: true
    - letter: B
      text: Because tanh trains 5x faster than sigmoid on GPUs.
      is_correct: false
    - letter: C
      text: Because tanh is linear.
      is_correct: false
    - letter: D
      text: To enforce parameter sparsity.
      is_correct: false
    correct_fb: ✅ Correct! Tanh has a zero-mean output which centers activations and keeps values from drifting. Additionally, its maximum derivative is 1.0 (at x=0), which is four times larger than sigmoid's max derivative of 0.25, significantly mitigating vanishing gradients.
    wrong_fb: ❌ Think about centering and output ranges. Sigmoid's range is (0, 1) while tanh is (-1, 1). Why does a zero-centered activation prevent bias drifting over hundreds of recurrent time updates?
  flashcards:
  - front: Recurrent Neural Network maintaining an internal hidden state vector across sequential time steps for time-series and NLP.
    back: h_t = tanh(W_hh h_t-1 + W_xh x_t + b)
  - front: Long Short-Term Memory network utilizing input, forget, and output gates with a memory cell state to prevent vanishing gradients.
    back: It is a key day in Week 10 (Recurrent Networks, LSTMs, GRUs, Sequence Models).
  - front: What causes the vanishing gradient problem during Backpropagation Through Time (BPTT) in vanilla RNNs?
    back: Repeated matrix multiplications by weight matrices with eigenvalues &lt; 1 over long sequence timesteps exponentially shrink gradients to zero.
  gotcha:
    title: '⚠️ Gotcha: Variable-Length Sequence Padding'
    description: "When batching sequences of different lengths, you must pad shorter sequences to the maximum length and create an\n      \n       attention_mask\n      \n      to tell the model to ignore padding tokens. Forgetting the attention mask means the model treats padding as real tokens, corrupting embeddings and attention weights."
  takeaways:
    hinglish_line: "<strong>\n          Ek line mein:\n         </strong>\n         RNNs sequential steps sequence processing ke liye current state memory ko hidden variables ke form mein maintain karte hain."
    bullets:
    - Vanilla RNNs process sequential data using shared weights and a hidden state memory track.
    - BPTT unrolls the network through time to compute parameter updates backpropagated across steps.
    - Vanishing gradients occur because repeated Jacobian multiplications exponentially shrink error signals.
    - Tanh activation is zero-centered with a higher maximum derivative than sigmoid, mitigating early gradient decay.
