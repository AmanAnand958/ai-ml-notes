    solution_code: "<span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n\n<span class=\"kw\">class</span> <span class=\"cls\">TimeSeriesForecasterLSTM</span>(nn.Module):\n    <span class=\"str\">\"\"\"</span>\n    Multi-Step Time Series Forecasting LSTM Model.\n    Predicts next K future time steps given past N observation points.\n    <span class=\"str\">\"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, num_features=<span class=\"num\">1</span>, hidden_dim=<span class=\"num\">64</span>, num_layers=<span class=\"num\">2</span>, forecast_horizon=<span class=\"num\">7</span>):\n        <span class=\"fn\">super</span>().<span class=\"fn\">__init__</span>()\n        <span class=\"kw\">self</span>.lstm = nn.<span class=\"fn\">LSTM</span>(\n            input_size=num_features,\n            hidden_size=hidden_dim,\n            num_layers=num_layers,\n            batch_first=<span\
      \ class=\"kw\">True</span>,\n            dropout=<span class=\"num\">0.2</span>\n        )\n        <span class=\"kw\">self</span>.fc = nn.<span class=\"fn\">Sequential</span>(\n            nn.<span class=\"fn\">Linear</span>(hidden_dim, <span class=\"num\">32</span>),\n            nn.<span class=\"fn\">ReLU</span>(),\n            nn.<span class=\"fn\">Linear</span>(<span class=\"num\">32</span>, forecast_horizon)\n        )\n        \n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\">self</span>, x):\n        <span class=\"cm\"># x shape: (batch_size, seq_len, num_features)</span>\n        lstm_out, (h_n, c_n) = <span class=\"kw\">self</span>.<span class=\"fn\">lstm</span>(x)\n        <span class=\"cm\"># Use final hidden state from top LSTM layer</span>\n        last_hidden = lstm_out[:, -<span class=\"num\">1</span>, :]\n        predictions = <span class=\"kw\">self</span>.<span class=\"fn\">fc</span>(last_hidden)\n        <span class=\"kw\"\
      >return</span> predictions\n\nmodel = <span class=\"fn\">TimeSeriesForecasterLSTM</span>(num_features=<span class=\"num\">1</span>, hidden_dim=<span class=\"num\">64</span>, num_layers=<span class=\"num\">2</span>, forecast_horizon=<span class=\"num\">7</span>)\nsample_input = torch.<span class=\"fn\">randn</span>(<span class=\"num\">16</span>, <span class=\"num\">30</span>, <span class=\"num\">1</span>) <span class=\"cm\"># 16 batches, 30 days history, 1 metric</span>\nforecast = <span class=\"fn\">model</span>(sample_input)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Input shape: {sample_input.shape} -&gt; Forecast shape: {forecast.shape}\"</span>)"
