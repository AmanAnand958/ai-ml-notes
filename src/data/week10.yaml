    qid: q72_2
    options:
    - letter: A
      text: Because Layer Normalization can only be computed on CPU.
      is_correct: false
    - letter: B
      text: Because Layer Normalization calculates statistics across the features of a single input step, avoiding memory overhead and handling variable-length sequences beautifully.
      is_correct: true
    - letter: C
      text: Because Batch Normalization deletes temporal embeddings.
      is_correct: false
    - letter: D
      text: To enforce sparsity constraints on model weight matrices.
      is_correct: false
    correct_fb: ✅ Correct! Batch Normalization requires calculating stats across the batch dimension, which fails for variable-length sequences. Layer Normalization normalizes inputs across the feature dimension for each step individually, making it highly robust for sequential tasks.
    wrong_fb: ❌ Think about variable-length sequences. If some sequences in a batch are 10 words and others are 50 words, how would you compute consistent batch stats at step 30? How does Layer Normalization solve this?
  - num_str: Q3 OF 3
    question: What is the advantage of measuring p99 latency over mean latency for production NLP applications?
    qid: q72_3
    options:
    - letter: A
      text: p99 represents the worst-case scenario (99th percentile), indicating the slowest latency experienced by users and providing a reliable metric for service level agreements.
      is_correct: true
    - letter: B
      text: p99 measures the parameter counts of sequence networks.
      is_correct: false
    - letter: C
      text: p99 latency is always 10x faster than mean latency.
      is_correct: false
    - letter: D
      text: To trace model accuracy metrics.
      is_correct: false
    correct_fb: ✅ Correct! Mean latency can hide massive latency spikes caused by long sequences or system delays. The p99 latency tracks the worst-case scenario, guaranteeing that 99% of requests are resolved within that time limit.
    wrong_fb: ❌ Think about distribution tails. If a user inputs a very long sequence that takes 2 seconds to run, but 99 users input short sequences taking 10ms, how does the mean look? Does the mean highlight the slow experience?
