    correct_fb: ✅ Correct! In sequential embedding dimensions, adjacent features are highly correlated. Standard dropout is
      easily bypassed because nearby words leak the missing values. Spatial Dropout 1D drops the entire feature dimension
      across all timesteps, forcing robust feature learning.
    wrong_fb: ❌ Think about correlation. If words are highly correlated, can standard dropout be easily bypassed by looking
      at neighbor tokens? How does dropping the entire column across time solve this leakage?
