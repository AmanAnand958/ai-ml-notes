  tasks:
  - title: Build the Sentiment Classifier Pipeline
    badge: Hard · 2.5 hrs
    badge_class: tb-hard
    time: 90 min
    prompt_html: |-
      <p><strong>
                 Write an executable Python script using Keras:
                 <br/>
                 1. Load the IMDB dataset and pad inputs to exactly 100 timesteps.
                 <br/>
                 2. Build a Bidirectional LSTM classifier with SpatialDropout1D and recurrent dropout.
                 <br/>
                 3. Compile using binary cross-entropy and train for 3 epochs.
                 <br/>
                 4. Plot accuracy and loss curves for training and validation splits and save as an image.
                </strong></p>
    done_when: Your script runs end-to-end without errors, trains the model successfully, evaluates accuracy on the test partition,
      and saves the learning progression plots to disk.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day71: complete day 71 tasks and coding exercises"'
    sol_id: sol-w10d71t1
    solution_title: ✅ COMPLETE SOLUTION — build_the_sentiment_classifier_pipeline.py
    solution_code: |-
      # Day 71 Task 1: Build a Sentiment Classifier
      import numpy as np

      class SentimentClassifier:
          def __init__(self, in_features: int):
              np.random.seed(42)
              self.w = np.random.randn(in_features) * 0.05
              self.b = 0.0

          def predict_proba(self, X: np.ndarray) -> np.ndarray:
              logits = X @ self.w + self.b
              return 1.0 / (1.0 + np.exp(-logits))

          def predict(self, X: np.ndarray) -> np.ndarray:
              return (self.predict_proba(X) >= 0.5).astype(int)

      X_test = np.array([[0.8, -0.2, 0.5], [-0.5, 0.9, -0.4]])
      model = SentimentClassifier(in_features=3)
      preds = model.predict(X_test)
      print("Sentiment Predictions:", preds)
      assert len(preds) == 2
      print("✓ Sentiment classifier verified.")
    solution_lang: python
  - title: Trace Binary Cross Entropy Mathematics
    badge: Medium · 1.5 hrs
    badge_class: tb-med
    time: 45 min
    prompt_html: |-
      <p><strong>
                  Given:
                  <br/>
                  - Actual sentiment target label y = 1.0 (Positive review).
                  <br/>
                  - Model prediction output probability $\hat{y} = 0.85$.
                  <br/>
                  Calculate the exact analytical Binary Cross-Entropy loss by hand.
                  <br/>
                  Show your step-by-step math arithmetic using natural logarithms.
                 </strong></p>
    done_when: Your calculations correctly show that the loss is calculated via - (y * ln($\hat{y}$) + (1 - y) * ln(1 - \hat{y}))
      = - ln(0.85) = approximately 0.1625, showing correct comprehension of loss mechanics.
    git_cmd: 'git add trace_binary_cross_entropy_mathematics.py &amp;&amp; git commit -m "feat(day): day71: trace-binary-cross-entropy-mathematics"'
    sol_id: sol-w10d71t2
    solution_title: ✅ COMPLETE SOLUTION — trace_binary_cross_entropy_mathematics.py
    solution_code: |-
      # Day 71 Task 2: Trace Binary Cross Entropy Loss & Gradients
      import numpy as np

      def bce_with_gradients(y_true: np.ndarray, y_pred_prob: np.ndarray, X: np.ndarray) -> tuple:
          eps = 1e-9
          y_pred_prob = np.clip(y_pred_prob, eps, 1 - eps)
          loss = -np.mean(y_true * np.log(y_pred_prob) + (1 - y_true) * np.log(1 - y_pred_prob))
          grad = (1.0 / len(y_true)) * (X.T @ (y_pred_prob - y_true))
          return float(loss), grad

      y = np.array([1, 0, 1, 1])
      p = np.array([0.9, 0.2, 0.8, 0.7])
      X = np.random.randn(4, 3)

      loss, grad = bce_with_gradients(y, p, X)
      print(f"BCE Loss: {loss:.5f}")
      print("Gradients shape:", grad.shape)
      assert loss > 0.0 and grad.shape == (3,)
      print("✓ BCE loss and gradient trace verified.")
    solution_lang: python
