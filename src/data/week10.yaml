    \ Answer:\n         </strong>\n<br/>\n         1.\n         <strong>\n          Translation Equivariance:\n         </strong>\n\
    \         If you shift the input image, the output of the layer shifts by the same amount: $f(Shift(x)) = Shift(f(x))$.\n\
    \         <strong>\n          Convolutional layers\n         </strong>\n         are equivariant. If an edge detector\
