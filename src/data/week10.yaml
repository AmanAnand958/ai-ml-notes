  quizzes:
  - num_str: Q1 OF 3
    question: What is the advantage of Single-Shot Multi-Step forecasting over Autoregressive forecasting for long-range sequence predictions?
    qid: q69_1
    options:
    - letter: A
      text: It decreases model parameter size.
      is_correct: false
    - letter: B
      text: It outputs all future steps simultaneously in a single forward pass, completely avoiding recursive feedback loops and preventing error cascading.
      is_correct: true
    - letter: C
      text: It uses less validation data.
      is_correct: false
    - letter: D
      text: To enforce positive activation constraints on model weights.
      is_correct: false
    correct_fb: ✅ Correct! In single-shot forecasting, the output layer directly projects H future steps. This avoids feeding model predictions back recursively, completely bypassing error compounding over long horizons.
    wrong_fb: ❌ Think about the recursive feedback loop. If you feed the predicted step t+1 back to predict step t+2, what happens to any minor error in the first step? Does it grow? How does predicting all steps together prevent this feedback loop?
  - num_str: Q2 OF 3
    question: What shape does an LSTM layer expect for input sequences in a Keras time-series model?
    qid: q69_2
    options:
    - letter: A
      text: (Batch, Features)
      is_correct: false
    - letter: B
      text: (Batch, Timesteps, Features)
      is_correct: true
    - letter: C
      text: (Batch, Timesteps)
      is_correct: false
    - letter: D
      text: (Batch, Dimensions, Channels)
      is_correct: false
    correct_fb: ✅ Correct! All Keras recurrent layers expect a 3D tensor of shape (Batch, Timesteps, Features). Even if we have a single 1D feature, we must expand dimensions to match this standard format.
    wrong_fb: '❌ Think about the structural variables of sequence data. We need to know: how many samples in the batch, how many steps through time in each sequence, and how many features at each step. How are these ordered?'
  - num_str: Q3 OF 3
    question: Why is Mean Squared Error (MSE) preferred over Binary Cross-Entropy when training LSTMs for time-series forecasting?
    qid: q69_3
    options:
    - letter: A
      text: Because time-series forecasting is a regression task predicting continuous numerical values, making continuous MSE mathematically appropriate, whereas binary cross-entropy is restricted to binary classification.
      is_correct: true
    - letter: B
      text: Because MSE trains 2x faster.
      is_correct: false
    - letter: C
      text: Because MSE deletes positive activations.
      is_correct: false
    - letter: D
      text: To enforce sparsity constraints on model weight parameters.
      is_correct: false
    correct_fb: ✅ Correct! Temperature or stock forecasting deals with continuous targets. We must measure continuous distance (MSE) rather than category probabilities (Cross-Entropy).
    wrong_fb: ❌ Think about the target variable. Is stock price or temperature a category index (0 or 1), or is it a continuous numerical value like 15.4? Which loss function measures numeric distances?
