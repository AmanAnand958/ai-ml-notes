  quizzes:
  - num_str: Q1 OF 3
    question: Why is Pre-padding preferred over Post-padding when feeding sequences to recurrent architectures?
    qid: q70_1
    options:
    - letter: A
      text: Because pre-padding consumes less GPU memory.
      is_correct: false
    - letter: B
      text: Because pre-padding places all zeroes at the start, preventing the recurrent cell from diluting its final hidden state memory with long meaningless trailing zero vectors.
      is_correct: true
    - letter: C
      text: Because pre-padding speeds up the tokenization step.
      is_correct: false
    - letter: D
      text: To enforce L2 regularization constraints on activations.
      is_correct: false
    correct_fb: ✅ Correct! In an RNN, inputs at the end of the sequence have a heavy influence on the final hidden state. In post-padding, trailing zeroes are processed last, which dilutes the memory of actual words. Pre-padding processes zeroes first, keeping actual text memory fresh for prediction.
    wrong_fb: ❌ Think about the temporal flow of recurrent cells. If the final 20 steps of a sequence are all 0 vectors, how does this affect the hidden state output at the last timestep? Where is the actual word context stored?
  - num_str: Q2 OF 3
    question: What does the dot product between two distinct one-hot encoded word vectors mathematically equal?
    qid: q70_2
    options:
    - letter: A
      text: '1.0'
      is_correct: false
    - letter: B
      text: Exactly 0.0, illustrating that one-hot representations completely fail to encode semantic relationships or word similarities.
      is_correct: true
    - letter: C
      text: It varies based on vocabulary length.
      is_correct: false
    - letter: D
      text: The index value of the larger word.
      is_correct: false
    correct_fb: ✅ Correct! Since one-hot vectors contain a single '1' at different indices, they are orthogonal. The dot product is exactly 0.0, meaning the model starts with zero understanding of text relationships ("cat" is as different from "kitten" as it is from "concrete").
    wrong_fb: ❌ In a one-hot vector for index A, value is 1 at index A and 0 everywhere else. In a vector for index B (not equal to A), value is 1 at index B and 0 everywhere else. What is the sum of element-wise products?
  - num_str: Q3 OF 3
    question: How does an Embedding Layer perform word index lookup under the hood?
    qid: q70_3
    options:
    - letter: A
      text: It extracts the row corresponding to the input index from the embedding weight matrix E, which is mathematically identical to multiplying a one-hot vector by E.
      is_correct: true
    - letter: B
      text: It performs a linear binary search through the vocabulary list.
      is_correct: false
    - letter: C
      text: It hashes the string using SHA-256 signatures.
      is_correct: false
    - letter: D
      text: It deletes all zero columns from inputs.
      is_correct: false
    correct_fb: ✅ Correct! The Embedding layer is simply a lookup table of weights. Passing an integer index selects that specific row from the matrix, acting as an extremely fast lookup that bypasses expensive sparse matrix multiplications.
    wrong_fb: ❌ Think about the math. If you multiply a row vector of size [1, V] containing a 1 at index i, by a matrix of size [V, D], which row of the matrix is returned? Is it row i?
