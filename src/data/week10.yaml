    <span class=\"cm\"># fastapi==0.111.0</span>\n<span class=\"cm\"># uvicorn[standard]==0.30.0</span>\n<span class=\"cm\"\
    ># chromadb==0.5.0</span>\n<span class=\"cm\"># sentence-transformers==3.0.0</span>\n<span class=\"cm\"># openai==1.35.0</span>\n\
    <span class=\"cm\"># pydantic==2.7.0</span>\n\n<span class=\"cm\"># --- .env.example ---</span>\n<span class=\"cm\">#\
    \ OPENAI_API_KEY=sk-...</span>\n\n<span class=\"cm\"># Build and run</span>\n<span class=\"kw\">import</span> subprocess\n\
    <span class=\"fn\">print</span>(<span class=\"str\">\"To build and run:\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"  1. docker build -t rag-app .\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"  2.\
    \ docker run -p 8000:8000 --env-file .env rag-app\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"  3.\
    \ Visit http://localhost:8000/docs for Swagger UI\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"  4.\
    \ POST /ingest to add documents\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"  5. POST /query to ask\
    \ questions\"</span>)\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n    <span class=\"\
    fn\">solve</span>()</pre>\n</div>\n</div>\n<div class=\"done-when\">\n        Script runs end-to-end without errors and\
    \ produces the expected console output or artifact.\n       </div>\n<div class=\"git-block\">\n        git add he_normal_vs_glorot_initialization_mechanics.py\
    \ &amp;&amp; git commit -m \"day-toolkit: he-normal-vs-glorot-initialization-mechanics\"\n       </div>\n</div>\n<div\
    \ style=\"background:rgba(255,255,255,0.03);padding:1.5rem;border-radius:8px;border:1px solid rgba(255,255,255,0.05)\"\
    >\n<p>\n<strong>\n         1. Receptive Field:\n        </strong>\n        The localized spatial pixel window of the input\
    \ image that directly influences the activation of a specific deep network neuron.\n       </p>\n<p>\n<strong>\n     \
    \    2. Translation Invariance:\n        </strong>\n        A property where shifting the input image does not affect\
    \ the final output prediction of the model (e.g. classifying a cat correctly regardless of its position).\n       </p>\n\
    <p>\n<strong>\n         3. Translation Equivariance:\n        </strong>\n        A property where shifting the input image\
    \ shifts the localized activations in the resulting convolutional feature map by an identical spatial offset.\n      \
    \ </p>\n<p>\n<strong>\n         4. Spatial Collapse:\n        </strong>\n        The structural compression of a multi-dimensional\
    \ spatial grid (e.g., $7 \\times 7 \\times 512$) into a flat vector (e.g., $1 \\times 1 \\times 512$) using Global Pooling.\n\
    \       </p>\n<p>\n<strong>\n         5. Skip Connection:\n        </strong>\n        An additive bypass route that skips\
    \ one or more weight layers to propagate activations forward and error gradients backward completely untouched.\n    \
    \   </p>\n<p>\n<strong>\n         6. Projection Shortcut:\n        </strong>\n        A bypass route using a 1x1 Convolution\
    \ to downsample or channel-expand an input tensor so it can be added to the main residual block output.\n       </p>\n\
    <p>\n<strong>\n         7. Identity Block:\n        </strong>\n        A standard ResNet block where the skip connection\
    \ directly adds the block input to the output without any convolutional modification.\n       </p>\n<p>\n<strong>\n  \
    \       8. Depthwise Convolution:\n        </strong>\n        A lightweight convolution stage that filters each input\
    \ channel independently using distinct spatial kernels without channel mixing.\n       </p>\n<p>\n<strong>\n         9.\
    \ Pointwise Convolution:\n        </strong>\n        A $1 \\times 1$ convolution that mixes channel information across\
    \ a spatial feature grid, serving as the second stage of depthwise separable convolutions.\n       </p>\n<p>\n<strong>\n\
    \         10. Squeeze-and-Excitation:\n        </strong>\n        A channel-attention mechanism that globally squeezes\
    \ spatial grids to excite and recalibrate relevant channel features dynamically.\n       </p>\n<p>\n<strong>\n       \
    \  11. Inverted Residual Block:\n        </strong>\n        A MobileNetV2 block that projects features to a high-dimensional\
    \ space first, applies depthwise convolution, and projects back to a linear bottleneck.\n       </p>\n<p>\n<strong>\n\
    \         12. Batch Normalization:\n        </strong>\n        A technique that normalizes activation distributions within\
    \ a mini-batch during training to stabilize convergence and accelerate speeds.\n       </p>\n<p>\n<strong>\n         13.\
    \ Group Normalization:\n        </strong>\n        An alternative normalization that calculates statistics within grouped\
    \ subsets of channels per image, making it completely independent of batch size.\n       </p>\n<p>\n<strong>\n       \
    \  14. Layer Normalization:\n        </strong>\n        A normalization technique that computes statistics across all\
    \ channels of a single input sample, heavily used in recurrent nets and Transformers.\n       </p>\n<p>\n<strong>\n  \
    \       15. Global Average Pooling:\n        </strong>\n        An operation that averages all spatial pixels of each\
    \ channel, reducing feature maps to a single vector of channel size.\n       </p>\n<p>\n<strong>\n         16. Global\
    \ Max Pooling:\n        </strong>\n        An operation that selects the single maximum pixel activation from each channel,\
    \ highlighting highly prominent local visual indicators.\n       </p>\n<p>\n<strong>\n         17. Focal Loss:\n     \
    \   </strong>\n        A dynamically scaled cross-entropy loss that dampens the loss assigned to easy-to-classify background\
    \ pixels, forcing focus on hard, sparse objects.\n       </p>\n<p>\n<strong>\n         18. Sobel Filter:\n        </strong>\n\
    \        A handcrafted 3x3 convolution operator that computes first-order spatial derivatives to extract horizontal or\
    \ vertical edge boundaries.\n       </p>\n<p>\n<strong>\n         19. Gabor Filter:\n        </strong>\n        A linear\
    \ electronic filter whose impulse response is defined by a harmonic function multiplied by a Gaussian, widely used to\
    \ model early biological edges.\n       </p>\n<p>\n<strong>\n         20. Catastrophic Forgetting:\n        </strong>\n\
    \        The phenomenon where a pre-trained model completely overwrites its previously learned knowledge when trained\
    \ immediately on a new target task.\n       </p>\n<p>\n<strong>\n         21. Feature Extraction:\n        </strong>\n\
    \        A transfer learning strategy where a pre-trained core is frozen, and only a newly initialized linear classification\
    \ head is trained on target data.\n       </p>\n<p>\n<strong>\n         22. Fine-Tuning:\n        </strong>\n        A\
    \ transfer learning strategy where early base layers are kept frozen while late convolutional layers are unfrozen and\
    \ trained using micro learning rates.\n       </p>\n<p>\n<strong>\n         23. Online Data Augmentation:\n        </strong>\n\
    \        Random synthetic transformations applied dynamically to training batches on-the-fly, generating endless variations\
    \ with no disk usage.\n       </p>\n<p>\n<strong>\n         24. Offline Data Augmentation:\n        </strong>\n      \
    \  Pre-saved visual alterations applied to a static dataset, multiplying storage overhead without generating dynamic training\
    \ variation.\n       </p>\n<p>\n<strong>\n         25. Semantic Safety:\n        </strong>\n        The requirement that\
    \ an applied data augmentation transformation must not alter the underlying classification label of the image.\n     \
    \  </p>\n</div>\n<p>\n       To deploy computer vision systems in highly regulated domains (e.g. finance, medical diagnostics,\
    \ or autonomous vehicles), explaining *why* a model made a prediction is crucial.\n       <strong>\n        Grad-CAM (Gradient-weighted\
    \ Class Activation Mapping)\n       </strong>\n       uses the gradients of any target class flowing into the final convolutional\
    \ layer to produce a coarse 2D heatmap highlighting the exact discriminative regions in the image. Here is the production\
    \ utility script:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\
    \ — gradcam.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n   \
    \       copy\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> tensorflow <span class=\"kw\"\
    >as</span> tf\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span>\
    \ cv2\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">generate_gradcam_heatmap</span>(model, img_array, last_conv_layer_name, pred_index=<span class=\"\
    kw\">None</span>):\n    <span class=\"cm\"># 1. Create a model that outputs the activations of the target conv layer</span>\n\
    \    <span class=\"cm\"># and the final softmax predictions</span>\n    grad_model = tf.keras.models.<span class=\"fn\"\
    >Model</span>(\n        inputs=[model.inputs],\n        outputs=[model.<span class=\"fn\">get_layer</span>(last_conv_layer_name).output,\
    \ model.output]\n    )\n    \n    <span class=\"cm\"># 2. Record operations using GradientTape</span>\n    <span class=\"\
    kw\">with</span> tf.<span class=\"fn\">GradientTape</span>() <span class=\"kw\">as</span> tape:\n        conv_outputs,\
    \ predictions = <span class=\"fn\">grad_model</span>(img_array)\n        <span class=\"kw\">if</span> pred_index <span\
    \ class=\"kw\">is</span> <span class=\"kw\">None</span>:\n            pred_index = tf.<span class=\"fn\">argmax</span>(predictions[<span\
    \ class=\"num\">0</span>])\n        class_channel = predictions[:, pred_index]\n        \n    <span class=\"cm\"># 3.\
    \ Calculate gradients of the target class with respect to target conv activations</span>\n    grads = tape.<span class=\"\
    fn\">gradient</span>(class_channel, conv_outputs)\n    \n    <span class=\"cm\"># 4. Compute channel-wise average of gradients\
    \ (Global Average Pooling)</span>\n    pooled_grads = tf.<span class=\"fn\">reduce_mean</span>(grads, axis=(<span class=\"\
    num\">0</span>, <span class=\"num\">1</span>, <span class=\"num\">2</span>))\n    \n    <span class=\"cm\"># 5. Multiply\
    \ conv activations by their corresponding gradient weights</span>\n    conv_outputs = conv_outputs[<span class=\"num\"\
    >0</span>]\n    heatmap = conv_outputs @ pooled_grads[..., tf.newaxis]\n    heatmap = tf.<span class=\"fn\">squeeze</span>(heatmap)\n\
    \    \n    <span class=\"cm\"># 6. Apply ReLU to isolate positively contributing features, then normalize</span>\n   \
    \ heatmap = tf.<span class=\"fn\">maximum</span>(heatmap, <span class=\"num\">0</span>) / tf.<span class=\"fn\">reduce_max</span>(heatmap)\n\
    \    <span class=\"kw\">return</span> heatmap.<span class=\"fn\">numpy</span>()\n\n<span class=\"kw\">def</span> <span\
    \ class=\"fn\">overlay_gradcam</span>(img_path, heatmap, alpha=<span class=\"num\">0.4</span>, colormap=cv2.COLORMAP_JET):\n\
    \    <span class=\"cm\"># Load original image</span>\n    img = cv2.<span class=\"fn\">imread</span>(img_path)\n    img\
    \ = cv2.<span class=\"fn\">cvtColor</span>(img, cv2.COLOR_BGR2RGB)\n    \n    <span class=\"cm\"># Resize heatmap to match\
    \ image dimensions</span>\n    heatmap = cv2.<span class=\"fn\">resize</span>(heatmap, (img.shape[<span class=\"num\"\
    >1</span>], img.shape[<span class=\"num\">0</span>]))\n    \n    <span class=\"cm\"># Convert heatmap to uint8 and apply\
    \ colormap</span>\n    heatmap = np.<span class=\"fn\">uint8</span>(<span class=\"num\">255</span> * heatmap)\n    heatmap_colored\
    \ = cv2.<span class=\"fn\">applyColorMap</span>(heatmap, colormap)\n    heatmap_colored = cv2.<span class=\"fn\">cvtColor</span>(heatmap_colored,\
    \ cv2.COLOR_BGR2RGB)\n    \n    <span class=\"cm\"># Superimpose the colored heatmap onto the original image</span>\n\
    \    overlayed = cv2.<span class=\"fn\">addWeighted</span>(heatmap_colored, alpha, img, <span class=\"num\">1</span> -\
    \ alpha, <span class=\"num\">0</span>)\n    <span class=\"kw\">return</span> overlayed</pre>\n</div>\n<!-- /day-toolkit\
    \ -->\n<div>\n</div>\n<!-- /layout -->\n<!-- /layout -->\n<script>\n  const WEEK = 10;\n  const DAYS = [66,67,68,69,70,71,72,'toolkit'];\n\
    \n  function goDay(n) {\n    document.querySelectorAll('.day-section').forEach(s => {\n      s.classList.remove('active');\n\
    \      s.style.removeProperty('display');\n    });\n    document.querySelectorAll('.sb-item').forEach(i => i.classList.remove('active'));\n\
    \    document.querySelectorAll('.day-pill').forEach(p => {\n      p.classList.remove('active');\n      p.setAttribute('aria-selected',\
    \ 'false');\n    });\n    \n    const section = document.getElementById('day-' + n) || document.getElementById(n);\n \
    \   if (section) {\n      section.classList.add('active');\n      section.style.display = 'block';\n    }\n    \n    const\
    \ sbItem = document.getElementById('sb-' + n) || Array.from(document.querySelectorAll('.sb-item')).find(el => el.getAttribute('onclick')\
    \ && el.getAttribute('onclick').includes('goDay(' + n + ')'));\n    if (sbItem) { sbItem.classList.add('active'); }\n\
    \    \n    const pill = document.getElementById('pill-' + n) || document.querySelector(`.day-pill[data-day=\"${n}\"]`);\n\
    \    if (pill) {\n      pill.classList.add('active');\n      pill.setAttribute('aria-selected', 'true');\n    }\n    \n\
    \    window.scrollTo({ top: 0, behavior: 'smooth' });\n    document.documentElement.scrollTop = 0;\n    document.body.scrollTop\
    \ = 0;\n    \n    if (typeof renderMermaid === 'function') {\n      // Small delay ensures section is visible before rendering\n\
    \      setTimeout(() => renderMermaid('day-' + n), 50);\n    }\n  }\n\n  function closeSidebar() {\n    const sb = document.getElementById('sidebar');\n\
    \    if (sb) sb.classList.remove('open');\n  }\n\n  function toggleSidebar() {\n    const sb = document.getElementById('sidebar');\n\
    \    if (sb) sb.classList.toggle('open');\n  }\n\n  document.addEventListener('DOMContentLoaded', () => {\n    if (Array.isArray(DAYS)\
    \ && DAYS.length > 0) {\n      goDay(DAYS[0]);\n    }\n  });\n</script>\n</div><div class=\"task-block\">\n<div aria-expanded=\"\
    false\" class=\"task-header\" onclick=\"toggleTask(this)\" onkeydown=\"if(event.key==='Enter'||event.key===' ')this.click()\"\
    \ role=\"button\" style=\"background:rgba(247,169,75,.05);border-left:3px solid var(--orange)\" tabindex=\"0\">\n<span\
    \ class=\"task-badge tb-hard\">\n         Scenario Q2\n        </span>\n<span class=\"task-title\">\n         FLOPs &amp;\
    \ Parameter Math: Depthwise Separable Convolutions\n        </span>\n</div>\n<div class=\"task-body\" style=\"display:block\"\
    >\n<p>\n<strong>\n          Question:\n         </strong>\n         Derive the exact parameter count and computational\
    \ complexity (FLOPs) comparison between a standard 2D convolution and a Depthwise Separable Convolution (as used in MobileNets)\
    \ for an input of shape $H \\times W \\times C$ and $N$ filters of size $K \\times K$.\n        </p>\n<p>\n<strong>\n\
    \          Answer:\n         </strong>\n<br/>\n         1.\n         <strong>\n          Standard Convolution:\n     \
    \    </strong>\n<br/>\n         -\n         <strong>\n          Parameters:\n         </strong>\n         $K^2 \\times\
    \ C \\times N$ (plus $N$ biases).\n         <br/>\n         -\n         <strong>\n          Complexity (FLOPs):\n    \
    \     </strong>\n         $H \\times W \\times K^2 \\times C \\times N$.\n         <br/>\n         2.\n         <strong>\n\
    \          Depthwise Separable Convolution:\n         </strong>\n         Consists of a Depthwise Conv (one $K \\times\
    \ K$ filter per input channel) followed by a Pointwise Conv ($1 \\times 1$ conv to mix channels):\n         <br/>\n  \
    \       -\n         <strong>\n          Parameters:\n         </strong>\n         $(K^2 \\times C) + (1 \\times 1 \\times\
    \ C \\times N) = C(K^2 + N)$.\n         <br/>\n         -\n         <strong>\n          Complexity (FLOPs):\n        \
    \ </strong>\n         $(H \\times W \\times K^2 \\times C) + (H \\times W \\times C \\times N) = H \\times W \\times C(K^2\
