    >\n         Batch Normalization vs. Group Normalization\n        </span>\n</div>\n<div class=\"task-body\" style=\"display:block\">\n<p>\n<strong>\n          Question:\n         </strong>\n         What are the limitations of Batch Normalization when training under extremely small batch sizes (e.g., batch size = 2 for high-resolution segmentation)? How does Group Normalization (GN) solve this?\n        </p>\n<p>\n<strong>\n          Answer:\n         </strong>\n         Batch Normalization calculates running mean and variance statistics across the batch dimension. If batch size is tiny, these statistical estimates are highly inaccurate and noisy. This results in unstable gradient directions, destroying performance.\n         <br/>\n<strong>\n          Group Normalization (GN)\n         </strong>\n         divides the channels of a single input tensor into $G$ groups, and calculates mean and variance statistics *within* each channel group across the spatial dimensions. Because GN's calculations\
