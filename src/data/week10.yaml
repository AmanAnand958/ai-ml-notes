week_number: 10
title: RNNs & Sequential Data
description: 'Sequential Modeling & NLP: Recurrent Neural Networks (RNNs), LSTMs, GRUs, Word2Vec, and Sequence-to-Sequence
  models.'
days:
- id: 66
  day_num: 66
  title: RNN Hidden States & Vanishing Gradients
  subtitle: |-
    Traditional feedforward neural networks operate under a major limitation: they assume all inputs and outputs are independent of one another.
     This fails for sequential data like text, audio, or time-series.
     Today, we launchMonth 3 (Sequence Modeling).
     We will dissect the mathematics ofRecurrent Neural Networks (RNNs),
     formulate recurrent hidden state propagation,
     and mathematically trace why theVanishing Gradient Problemcripples vanilla RNNs when backpropagating through time.
  time_estimate: 6 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Formulate recurrent step equations for hidden state transitions.
  - Execute a manual numpy forward pass of a vanilla recurrent neuron.
  - Derive the Backpropagation Through Time (BPTT) chain rule in matrix form.
  - Identify the eigenvalue conditions that trigger vanishing and exploding gradients.
  checklist:
  - id: chk_66_1
    text: Derive and analyze mathematical and architectural principles for RNN Hidden States & Vanishing Gradients
  - id: chk_66_2
    text: Build and benchmark production coding pipelines for RNN Hidden States & Vanishing Gradients
  - id: chk_66_3
    text: Execute and validate test verification suite for Build a Vanilla RNN Neuron from scratch
  - id: chk_66_4
    text: Evaluate conceptual mastery via interactive flashcards and quiz challenges
  concept_flow:
  - RNN Hidden States & Vanishing Gradients
  - LSTM & GRU Cells
  - Deep Stacked LSTMs & Overfitting
  - Time Series Forecasting with LSTMs
  - Tokenization & Word Embeddings
  - 'Project: Movie Review Sentiment Classifier'
  - Capstone Validation & Edge Deployment
  hinglish: 💡 RNN mein vanishing gradient ka matlab hai ki network purane words bhool jata hai. LSTM ne isko solve kiya ek
    'cell state' information highway banakar, jisme Forget Gate decide karta hai kya bhoolna hai aur Input Gate decide karta
    hai kya yaad rakhna hai.
  analogy: 'Think of it like this: Recurrent Neural Network bilkul ek traditional accounts register ya ledger ki tarah hai.
    Har saal ke end mein balance (hidden state) forward carry kiya jata hai. Lekin agar accounting matrix mein minor calculations
    values ko zero ki taraf push karein (vanishing gradient), toh purane entries ke updates clear ho jate hain aur bookkeeper
    ko sirf aakhri few steps ka hi transaction yaad rehta hai!'
  theory_html: "<h3 class=\"sh3\">\n       1. Why Sequential Data Needs Memory\n      </h3>\n<p>\n       Consider the sentence:\n\
    \       <em>\n        \"The clouds are in the sky.\"\n       </em>\n       To predict the final word \"sky\", a model\
    \ must remember the context word \"clouds\".\n    Traditional dense networks process each word individually, losing all\
    \ temporal relationships.\n       <br/>\n       RNNs solve this by incorporating a\n       <strong>\n        recurrent\
    \ hidden state\n       </strong>\n       ($h_t$) that acts as a memory track, passing information forward through time:\n\
    \      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$h_t = \\tanh(W_{hh} h_{t-1} + W_{xh} x_t\
    \ + b_h)$$\n       </span>\n<span class=\"desc\">\n        Where h_t is the hidden state at step t, W_{hh} is the recurrent\
    \ weight matrix, and W_{xh} is the input weight matrix.\n       </span>\n</div>\n<p>\n       The output projection at\
    \ each step is calculated as:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$\\hat{y}_t\
    \ = \\text{softmax}(W_{hy} h_t + b_y)$$\n       </span>\n</div>\n<h3 class=\"sh3\">\n       2. Recurrent Unrolling through\
    \ Time\n      </h3>\n<p>\n       To understand how information propagates, we can unroll the recurrent connections over\
    \ $T$ timesteps.\n    This exposes a deep feedforward-like chain where weights are shared across all steps:\n      </p>\n\
    <div class=\"mermaid\">\ngraph TD\n  x1[\"x_1\"] --> h1[\"h_1\"] --> y1[\"y_1\"]\n  x2[\"x_2\"] --> h2[\"h_2\"] --> y2[\"\
    y_2\"]\n  x3[\"x_3\"] --> h3[\"h_3\"] --> y3[\"y_3\"]\n  x4[\"x_4\"] --> h4[\"h_4\"] --> y4[\"y_4\"]\n  h1 --> h2 -->\
    \ h3 --> h4\n  h4 -.->|BPTT Gradient Flow| h1\n</div>\n<div class=\"diagram-cap\">\n       Recurrent Neural Network unrolled\
    \ over 4 discrete temporal timesteps, tracing BPTT gradient flows.\n      </div>\n<h3 class=\"sh3\">\n       3. The Mathematics\
    \ of Vanishing Gradients\n      </h3>\n<p>\n       During training, we calculate the gradient of the loss $L$ with respect\
    \ to the recurrent weight matrix $W_{hh}$.\n    Using the chain rule across $T$ steps:\n      </p>\n<div class=\"math-block\"\
    >\n<span class=\"formula\">\n        $$\\frac{\\partial L}{\\partial W_{hh}} = \\sum_{t=1}^T \\frac{\\partial L_t}{\\\
    partial W_{hh}}$$\n       </span>\n</div>\n<p>\n       For any step $t$, the derivative depends on the historical hidden\
    \ state transitions:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$\\frac{\\partial L_t}{\\\
    partial W_{hh}} = \\sum_{k=1}^t \\frac{\\partial L_t}{\\partial h_t} \\frac{\\partial h_t}{\\partial h_k} \\frac{\\partial\
    \ h_k}{\\partial W_{hh}}$$\n       </span>\n</div>\n<p>\n       The middle term $\\frac{\\partial h_t}{\\partial h_k}$\
    \ is computed as a chain of single-step Jacobian matrices:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\"\
    >\n        $$\\frac{\\partial h_t}{\\partial h_k} = \\prod_{j=k+1}^t \\frac{\\partial h_j}{\\partial h_{j-1}} = \\prod_{j=k+1}^t\
    \ \\text{diag}(1 - h_j^2) \\cdot W_{hh}^T$$\n       </span>\n</div>\n<svg aria-label=\"Gradient magnitude decaying exponentially\
    \ with timestep distance for tanh and sigmoid versus flat ReLU\" height=\"340\" role=\"img\" viewBox=\"0 0 700 340\" width=\"\
    700\" xmlns=\"http://www.w3.org/2000/svg\"style=\"max-width: 100%; height: auto;\">\n<style>\n        svg .w10t{font-family:DM\
    \ Sans,sans-serif} svg .w10m{font-family:IBM Plex Mono,monospace}\n       </style>\n<defs>\n<lineargradient id=\"w10-bg_s\"\
    \ x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n<stop offset=\"0%\" stop-color=\"#1a1e2e\">\n</stop>\n<stop offset=\"100%\" stop-color=\"\
    var(--bg)\">\n</stop>\n</lineargradient>\n</defs>\n<rect fill=\"url(#w10-bg_s)\" height=\"340\" rx=\"12\" width=\"700\"\
    >\n</rect>\n<text class=\"w10t\" fill=\"#e6edf3\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" x=\"350\"\
    \ y=\"26\">\n        Vanishing gradients — ‖∂L/∂h_t‖ vs timestep distance (t − k)\n       </text>\n<rect fill=\"#e56b8c\"\
