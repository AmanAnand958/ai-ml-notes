    \ text-anchor=\"middle\" x=\"350\" y=\"312\">\n        Fix: ReLU + LSTM gates + residual connections keep the gradient\
    \ highway open\n       </text>\n</svg>\n<h3 class=\"sh3\">\n       4. Numpy Manual Forward Pass Trace\n      </h3>\n<p>\n\
    \       Let's write a complete, self-contained Python script to trace this hidden state propagation mathematically using\
    \ numpy:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — rnn_forward.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
