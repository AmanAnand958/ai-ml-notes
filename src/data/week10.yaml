  tasks:
  - title: Build a Multi-Step Forecast Model
    badge: Hard · 2.5 hrs
    badge_class: tb-hard
    time: 90 min
    prompt_html: |-
      <p><strong>
                 Write an executable Python script using Keras:
                 <br/>
                 1. Synthesize a 1D sequence dataset of shape (1000, 1).
                 <br/>
                 2. Build a sliding window pipeline returning inputs X of length 30 and multi-step targets y of length 5 (predicting 5 future steps directly).
                 <br/>
                 3. Train a model with a Dense(5) output layer.
                 <br/>
                 4. Compare its performance on a validation split against a baseline single-step model evaluated autoregressively across 5 steps.
                </strong></p>
    done_when: Your script runs end-to-end, evaluates both methods, prints comparison Mean Squared Errors, and demonstrates
      that single-shot multi-step out-performs autoregressive forecasting due to error cascading prevention.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day69: complete day 69 tasks and coding exercises"'
    sol_id: sol-w10d69t1
    solution_title: ✅ COMPLETE SOLUTION — build_a_multi_step_forecast_model.py
    solution_code: |-
      # Day 69 Task 1: Multi-Step Time Series Forecasting
      import numpy as np

      def multi_step_forecast(series: np.ndarray, window_size: int = 10, forecast_steps: int = 3) -> np.ndarray:
          """Autoregressive multi-step rolling forecaster."""
          history = list(series)
          predictions = []
          for _ in range(forecast_steps):
              # Linear AR forecast from last window
              window = np.array(history[-window_size:])
              next_val = float(np.mean(window) + 0.5 * (window[-1] - window[0]) / window_size)
              predictions.append(next_val)
              history.append(next_val)
          return np.array(predictions)

      time_series = np.sin(np.linspace(0, 20, 100))
      forecast = multi_step_forecast(time_series, window_size=10, forecast_steps=5)
      print("5-Step Forecast Output:", np.round(forecast, 4))
      assert len(forecast) == 5
      print("✓ Multi-step forecasting verified.")
    solution_lang: python
  - title: Trace Mean Squared Error Math
    badge: Medium · 1.5 hrs
    badge_class: tb-med
    time: 45 min
    prompt_html: |-
      <p><strong>
                  Given:
                  <br/>
                  - Actual stock price target value y = 15.0.
                  <br/>
                  - Model regression prediction $\hat{y} = 14.2$.
                  <br/>
                  Calculate the exact analytical Squared Error.
                  <br/>
                  Show your step-by-step math arithmetic calculations.
                 </strong></p>
    done_when: Your calculations correctly prove that the Squared Error is calculated via (y - $\hat{y}$)^2 = (15.0 - 14.2)^2
      = 0.8^2 = exactly 0.64.
    git_cmd: 'git add trace_mean_squared_error_math.py &amp;&amp; git commit -m "feat(day): day69: trace-mean-squared-error-math"'
    sol_id: sol-w10d69t2
    solution_title: ✅ COMPLETE SOLUTION — trace_mean_squared_error_math.py
    solution_code: |-
      # Day 69 Task 2: Trace Mean Squared Error & MAE Across Forecasting Horizons
      import numpy as np

      def evaluate_horizon_metrics(y_true: np.ndarray, y_pred: np.ndarray) -> dict:
          mse = np.mean((y_true - y_pred) ** 2)
          mae = np.mean(np.abs(y_true - y_pred))
          mape = np.mean(np.abs((y_true - y_pred) / (y_true + 1e-8))) * 100
          return {"mse": round(float(mse), 5), "mae": round(float(mae), 5), "mape_pct": round(float(mape), 2)}

      y_t = np.array([1.2, 1.5, 1.8, 2.1, 2.4])
      y_p = np.array([1.1, 1.6, 1.7, 2.3, 2.5])
      metrics = evaluate_horizon_metrics(y_t, y_p)
      print("Forecast Horizon Metrics:", metrics)
      assert metrics["mse"] < 0.1
      print("✓ Horizon evaluation metrics verified.")
    solution_lang: python
