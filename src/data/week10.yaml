    \ <span class=\"fn\">Analysis</span> (IMDB).\n    Uses Embedding layer, BiLSTM, Attention Pooling, <span class=\"kw\"\
    >and</span> Binary Classification head.\n    <span class=\"str\">\"\"\"</span>\n    <span class=\"kw\">def</span> <span\
    \ class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, vocab_size=<span class=\"num\">10000</span>, embed_dim=<span\
    \ class=\"num\">128</span>, hidden_dim=<span class=\"num\">64</span>, num_classes=<span class=\"num\">1</span>):\n   \
    \     <span class=\"fn\">super</span>().<span class=\"fn\">__init__</span>()\n        <span class=\"kw\">self</span>.embedding\
    \ = nn.<span class=\"fn\">Embedding</span>(vocab_size, embed_dim, padding_idx=<span class=\"num\">0</span>)\n        <span\
    \ class=\"kw\">self</span>.lstm = nn.<span class=\"fn\">LSTM</span>(\n            input_size=embed_dim,\n            hidden_size=hidden_dim,\n\
    \            batch_first=<span class=\"kw\">True</span>,\n            bidirectional=<span class=\"kw\">True</span>\n \
    \       )\n        <span class=\"cm\"># BiLSTM outputs 2 * hidden_dim</span>\n        <span class=\"kw\">self</span>.fc\
    \ = nn.<span class=\"fn\">Sequential</span>(\n            nn.<span class=\"fn\">Linear</span>(hidden_dim * <span class=\"\
    num\">2</span>, <span class=\"num\">32</span>),\n            nn.<span class=\"fn\">ReLU</span>(),\n            nn.<span\
    \ class=\"fn\">Dropout</span>(<span class=\"num\">0.3</span>),\n            nn.<span class=\"fn\">Linear</span>(<span\
    \ class=\"num\">32</span>, num_classes)\n        )\n        \n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span\
    \ class=\"kw\">self</span>, x):\n        <span class=\"cm\"># x shape: (batch_size, seq_len)</span>\n        embedded\
    \ = <span class=\"kw\">self</span>.<span class=\"fn\">embedding</span>(x)\n        lstm_out, _ = <span class=\"kw\">self</span>.<span\
    \ class=\"fn\">lstm</span>(embedded)\n        <span class=\"cm\"># Global max pooling over time dimension</span>\n   \
    \     pooled, _ = torch.<span class=\"fn\">max</span>(lstm_out, dim=<span class=\"num\">1</span>)\n        logits = <span\
