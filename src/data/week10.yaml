  quizzes:
  - num_str: Q1 OF 3
    question: What occurs if you set return_sequences=False on the first layer of a multi-layer stacked LSTM network?
    qid: q68_1
    options:
    - letter: A
      text: The model training speed doubles.
      is_correct: false
    - letter: B
      text: The first layer returns a 2D tensor, causing the downstream LSTM layer to throw a ValueError because it expects a 3D sequential tensor.
      is_correct: true
    - letter: C
      text: The classification accuracy decreases by 10%.
      is_correct: false
    - letter: D
      text: It deletes all positive activations.
      is_correct: false
    correct_fb: ✅ Correct! In Keras, recurrent layers require a 3D input of shape (Batch, Time, Features). Setting return_sequences=False makes the layer return only the final vector, outputting a 2D tensor. The next LSTM layer cannot process this, triggering a compilation crash.
    wrong_fb: ❌ Think about dimension matching. If a downstream LSTM layer expects a sequence input of shape (Batch, Time, Features), what does return_sequences=False return? Does it return a single 2D vector?
  - num_str: Q2 OF 3
    question: Why is standard dropout problematic when applied directly to recurrent connections?
    qid: q68_2
    options:
    - letter: A
      text: Because it makes model gradients equal to 0.
      is_correct: false
    - letter: B
      text: Because generating a fresh random dropout mask at each timestep disrupts the long-term temporal memory carousel, degrading memory preservation.
      is_correct: true
    - letter: C
      text: Because it increases the parameter counts.
      is_correct: false
    - letter: D
      text: It deletes infrequent vocabulary words.
      is_correct: false
    correct_fb: ✅ Correct! Standard dropout changes the active connections randomly at each timestep, creating severe noise in the hidden state trajectory. Recurrent dropout solves this by keeping the dropout mask constant across all timesteps of a sequence.
    wrong_fb: ❌ In a recurrent loop, information travels through time step-by-step. If you drop different random neurons at step 1, step 2, and step 3, how does that affect the cell state memory track? Does it create massive temporal noise?
  - num_str: Q3 OF 3
    question: What is the output shape of a Bidirectional LSTM layer with return_sequences=True and 64 hidden units?
    qid: q68_3
    options:
    - letter: A
      text: (Batch, Time, 128), because it concatenates the forward and backward hidden states (64 + 64 = 128) for every timestep.
      is_correct: true
    - letter: B
      text: (Batch, 64)
      is_correct: false
    - letter: C
      text: (Batch, Time, 64)
      is_correct: false
    - letter: D
      text: (Batch, 1)
      is_correct: false
    correct_fb: ✅ Correct! A Bidirectional LSTM layer concatenates the output of its forward and backward LSTM cells. Since each has 64 units, the total feature size is 128. Because return_sequences=True, it keeps the time dimension, outputting (Batch, Time, 128).
    wrong_fb: '❌ A Bidirectional layer merges two independent LSTM layers: one running forwards, and one running backwards. What does Keras do to their outputs? Does it concatenate them? How does return_sequences=True affect the shape?'
