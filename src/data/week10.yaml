- id: '71'
  day_num: 71
  title: 'Project: Movie Review Sentiment Classifier'
  subtitle: "Today, we apply our cumulative sequential deep learning knowledge to a classic, real-world benchmark task:\n      building an end-to-endSentiment Classifieron theIMDB Dataset.\n      We will load and process 50,000 highly polar movie reviews,\n      develop a deepBidirectional LSTM architecturewith trainable Word Embeddings in Keras,\n      integrate critical regularization techniques (Spatial Dropout 1D, Recurrent Dropout),\n      and train the system using callbacks like EarlyStopping and ModelCheckpoint."
  time_estimate: 6 hours
  difficulty: +200 XP
  badges:
  - label: 🧠 Advanced
    variant: o
  - label: 💻 End-to-End Project
    variant: b
  xp: 150
  objectives:
  - Load, clean, and pad the IMDB sequence dataset for training.
  - Incorporate Spatial Dropout 1D to prevent feature co-adaptation in embedding channels.
  - Build a deep, regularized Bidirectional LSTM classifier using Keras Functional API.
  - Train the model safely with EarlyStopping to avoid overfitting.
  - Plot accuracy and loss trends and interpret validation metrics.
  checklist: []
  concept_flow:
  - RNN Hidden States & Vanis
  - LSTM & GRU Cells
  - Deep Stacked LSTMs & Over
  - Time Series Forecasting w
  - Tokenization & Word Embed
  - 'Project: Movie Review Sen'
  - Capstone Validation & Edg
  hinglish: 'Stateful RNN: batches ke beech hidden state preserve karo. Long time series ke liye useful hai jab sequence ek batch mein fit nahi hoti. Careful initialization chahiye!'
  analogy: Spatial Dropout 1D bilkul us teacher ki tarah hai jo class mein sirf specific desks ke bacchon ko quiet (standard dropout) nahi karti, balki pure columns (entire features) ke bacchon ko stand-up kara deti hai. Isse baaki rows mein baithe bacchon ko copy karne ka chance nahi milta aur unhe khud answers seekhne padte hain!
  theory_html: "<h3 class=\"sh3\">\n       1. Sequence Regularization: Spatial Dropout 1D\n      </h3>\n<p>\n       Standard dropout randomly zeroes out individual elements in a tensor.\n    If applied to an embedding output tensor of shape $(Batch, Time, D)$,\n    it might drop individual features across the embedding dimension of a word.\n    However, because adjacent words are strongly correlated, the network can easily infer the dropped values, rendering the dropout ineffective.\n       <br/>\n       To resolve this, we use\n       <strong>\n        Spatial Dropout 1D\n       </strong>\n       .\n    Instead of dropping individual elements, it zeroes out\n       <strong>\n        entire 1D feature channels\n       </strong>\n       (entire columns across the time axis).\n    If a channel is dropped, it is dropped for all words in that sequence.\n    This forces the embedding layer to learn robust, uncorrelated semantic features across all projection dimensions:\n      </p>\n<div class=\"\
    mermaid\">\ngraph TD\nsubgraph \"Standard Dropout\"\n  S1[\"Drop individual random elements in sequence embedding tensor\"]\nend\nsubgraph \"Spatial Dropout 1D\"\n  S2[\"Drop entire channels/feature columns across all timesteps\"]\nend\n</div>\n<div class=\"diagram-cap\">\n       Visual comparison between standard dropout and Spatial Dropout 1D across sequential word embeddings.\n      </div>\n<h3 class=\"sh3\">\n       2. Early Stopping &amp; Checkpointing Mechanics\n      </h3>\n<p>\n       Deep sequence models overfit very quickly because they can memorize vocabulary patterns in the training split.\n    To prevent this, we monitor the\n       <strong>\n        validation loss\n       </strong>\n       during training using two essential callbacks:\n      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         EarlyStopping:\n        </strong>\n        Stops training immediately when the validation loss stops improving for a specified number of epochs (called\n        \n        \
    \ patience\n        \n        ).\n      This saves computation time and prevents model degradation.\n       </li>\n<li>\n<strong>\n         ModelCheckpoint:\n        </strong>\n        Saves the best-performing set of weights encountered during training, ensuring we don't lose the optimal model parameters.\n       </li>\n</ul>\n<h3 class=\"sh3\">\n       3. Step-by-Step Architecture Deep Dive\n      </h3>\n<p>\n       Let's break down the mathematical role of every layer in our classification network:\n      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         Input Layer:\n        </strong>\n        Accepts sequence batches of shape\n        \n         (Batch, 150)\n        \n        containing integer vocabulary indices.\n       </li>\n<li>\n<strong>\n         Embedding Layer:\n        </strong>\n        Projects 10,000 sparse indices to 128 dense dimensions, yielding shape\n        \n         (Batch, 150, 128)\n        \n        .\n       </li>\n<li>\n<strong>\n         SpatialDropout1D\
    \ (0.2):\n        </strong>\n        Randomly drops 20% of the 128 embedding columns across the entire sequence. This prevents individual feature channels from becoming co-dependent.\n       </li>\n<li>\n<strong>\n         Layer 1 Bidirectional LSTM (H=64):\n        </strong>\n        Processes sequence vectors forwards and backwards, generating 3D sequential output shape\n        \n         (Batch, 150, 128)\n        \n        because\n        \n         return_sequences=True\n        \n        and hidden states concatenate ($64 \\times 2 = 128$).\n       </li>\n<li>\n<strong>\n         Layer 2 Bidirectional LSTM (H=64):\n        </strong>\n        Collapses the time dimension, returning a single merged 2D context vector of shape\n        \n         (Batch, 128)\n        \n        since\n        \n         return_sequences=False\n        \n        .\n       </li>\n<li>\n<strong>\n         Dense Classification Head:\n        </strong>\n        Projects the 128-dimensional context vector\
    \ through a 32-node ReLU hidden layer, applies standard Dropout (0.3), and outputs a single Sigmoid classification probability between 0.0 and 1.0.\n       </li>\n</ul>\n<h3 class=\"sh3\">\n       4. Production-Grade IMDB Sentiment Classifier in Keras\n      </h3>\n<p>\n       Let's write a complete, self-contained Keras script that loads the IMDB dataset, builds the regularized sequence model, and executes the training loop:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">python</span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n\n<span class=\"kw\">class</span> <span class=\"cls\">LSTMSentimentClassifier</span>(nn.Module):\n  \
    \  <span class=\"str\">\"\"\"</span>\n    Bidirectional LSTM Classifier <span class=\"kw\">for</span> Text Sentiment <span class=\"fn\">Analysis</span> (IMDB).\n    Uses Embedding layer, BiLSTM, Attention Pooling, <span class=\"kw\">and</span> Binary Classification head.\n    <span class=\"str\">\"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, vocab_size=<span class=\"num\">10000</span>, embed_dim=<span class=\"num\">128</span>, hidden_dim=<span class=\"num\">64</span>, num_classes=<span class=\"num\">1</span>):\n        <span class=\"fn\">super</span>().<span class=\"fn\">__init__</span>()\n        <span class=\"kw\">self</span>.embedding = nn.<span class=\"fn\">Embedding</span>(vocab_size, embed_dim, padding_idx=<span class=\"num\">0</span>)\n        <span class=\"kw\">self</span>.lstm = nn.<span class=\"fn\">LSTM</span>(\n            input_size=embed_dim,\n            hidden_size=hidden_dim,\n            batch_first=<span\
    \ class=\"kw\">True</span>,\n            bidirectional=<span class=\"kw\">True</span>\n        )\n        <span class=\"cm\"># BiLSTM outputs 2 * hidden_dim</span>\n        <span class=\"kw\">self</span>.fc = nn.<span class=\"fn\">Sequential</span>(\n            nn.<span class=\"fn\">Linear</span>(hidden_dim * <span class=\"num\">2</span>, <span class=\"num\">32</span>),\n            nn.<span class=\"fn\">ReLU</span>(),\n            nn.<span class=\"fn\">Dropout</span>(<span class=\"num\">0.3</span>),\n            nn.<span class=\"fn\">Linear</span>(<span class=\"num\">32</span>, num_classes)\n        )\n        \n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\">self</span>, x):\n        <span class=\"cm\"># x shape: (batch_size, seq_len)</span>\n        embedded = <span class=\"kw\">self</span>.<span class=\"fn\">embedding</span>(x)\n        lstm_out, _ = <span class=\"kw\">self</span>.<span class=\"fn\">lstm</span>(embedded)\n        <span class=\"\
    cm\"># Global max pooling over time dimension</span>\n        pooled, _ = torch.<span class=\"fn\">max</span>(lstm_out, dim=<span class=\"num\">1</span>)\n        logits = <span class=\"kw\">self</span>.<span class=\"fn\">fc</span>(pooled)\n        <span class=\"kw\">return</span> logits\n\nmodel = <span class=\"fn\">LSTMSentimentClassifier</span>(vocab_size=<span class=\"num\">5000</span>, embed_dim=<span class=\"num\">64</span>, hidden_dim=<span class=\"num\">32</span>)\nsample_tokens = torch.<span class=\"fn\">randint</span>(<span class=\"num\">0</span>, <span class=\"num\">5000</span>, (<span class=\"num\">8</span>, <span class=\"num\">50</span>)) <span class=\"cm\"># 8 reviews, 50 words each</span>\noutput_logits = <span class=\"fn\">model</span>(sample_tokens)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Sentiment Logits Output: {output_logits.shape} -&gt; Probabilities: {torch.sigmoid(output_logits).squeeze().tolist()[:4]}\"</span>)</pre>\n</div>\n<h3 class=\"sh3\"\
    >\n       5. Expected Training Log Analytics\n      </h3>\n<p>\n       When running this code, Keras prints structural training logs. Let's trace how to analyze them to assess convergence and determine when EarlyStopping halts operations:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">python</span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button><button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">Run</button></div>\n</div>\n<pre><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n\n<span class=\"kw\">class</span> <span class=\"cls\">LSTMSentimentClassifier</span>(nn.Module):\n    <span class=\"str\">\"\"\"</span>\n    Bidirectional LSTM Classifier <span class=\"kw\">for</span> Text Sentiment <span class=\"fn\">Analysis</span> (IMDB).\n    Uses Embedding layer, BiLSTM, Attention Pooling, <span class=\"kw\">and</span>\
    \ Binary Classification head.\n    <span class=\"str\">\"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, vocab_size=<span class=\"num\">10000</span>, embed_dim=<span class=\"num\">128</span>, hidden_dim=<span class=\"num\">64</span>, num_classes=<span class=\"num\">1</span>):\n        <span class=\"fn\">super</span>().<span class=\"fn\">__init__</span>()\n        <span class=\"kw\">self</span>.embedding = nn.<span class=\"fn\">Embedding</span>(vocab_size, embed_dim, padding_idx=<span class=\"num\">0</span>)\n        <span class=\"kw\">self</span>.lstm = nn.<span class=\"fn\">LSTM</span>(\n            input_size=embed_dim,\n            hidden_size=hidden_dim,\n            batch_first=<span class=\"kw\">True</span>,\n            bidirectional=<span class=\"kw\">True</span>\n        )\n        <span class=\"cm\"># BiLSTM outputs 2 * hidden_dim</span>\n        <span class=\"kw\">self</span>.fc = nn.<span class=\"fn\">Sequential</span>(\n\
    \            nn.<span class=\"fn\">Linear</span>(hidden_dim * <span class=\"num\">2</span>, <span class=\"num\">32</span>),\n            nn.<span class=\"fn\">ReLU</span>(),\n            nn.<span class=\"fn\">Dropout</span>(<span class=\"num\">0.3</span>),\n            nn.<span class=\"fn\">Linear</span>(<span class=\"num\">32</span>, num_classes)\n        )\n        \n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\">self</span>, x):\n        <span class=\"cm\"># x shape: (batch_size, seq_len)</span>\n        embedded = <span class=\"kw\">self</span>.<span class=\"fn\">embedding</span>(x)\n        lstm_out, _ = <span class=\"kw\">self</span>.<span class=\"fn\">lstm</span>(embedded)\n        <span class=\"cm\"># Global max pooling over time dimension</span>\n        pooled, _ = torch.<span class=\"fn\">max</span>(lstm_out, dim=<span class=\"num\">1</span>)\n        logits = <span class=\"kw\">self</span>.<span class=\"fn\">fc</span>(pooled)\n    \
    \    <span class=\"kw\">return</span> logits\n\nmodel = <span class=\"fn\">LSTMSentimentClassifier</span>(vocab_size=<span class=\"num\">5000</span>, embed_dim=<span class=\"num\">64</span>, hidden_dim=<span class=\"num\">32</span>)\nsample_tokens = torch.<span class=\"fn\">randint</span>(<span class=\"num\">0</span>, <span class=\"num\">5000</span>, (<span class=\"num\">8</span>, <span class=\"num\">50</span>)) <span class=\"cm\"># 8 reviews, 50 words each</span>\noutput_logits = <span class=\"fn\">model</span>(sample_tokens)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Sentiment Logits Output: {output_logits.shape} -&gt; Probabilities: {torch.sigmoid(output_logits).squeeze().tolist()[:4]}\"</span>)</pre>\n</div>\n<p>\n<em>\n        Engineering Analysis:\n       </em>\n       During Epoch 1, the model learns basic sentiment indicators, achieving 73.2% accuracy.\n    In Epoch 2, the validation loss reaches its absolute minimum:\n       <strong>\n        0.3184\n       </strong>\n\
    \       , with a high validation accuracy of 86.8%.\n    By Epoch 3 and 4, the training loss continues to drop ($0.20 \\to 0.14$), but the validation loss rebounds upwards ($0.31 \\to 0.33 \\to 0.38$).\n    This is the signature of\n       <strong>\n        overfitting\n       </strong>\n       .\n    Because we configured\n       \n        patience=2\n       \n       , the EarlyStopping callback halts training at Epoch 4 and automatically restores the optimal weights from Epoch 2.\n      </p>\n\n<h2 class=\"sh2\">\n       \U0001F6E0 Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\">\n        \U0001F50D\n        <strong>\n         Search terms:\n        </strong>\n\n         word2vec skip gram negative sampling math, nn.Embedding vocab index out of bounds\n        \n</div>\n<!-- /day-71-theory -->\n<!-- /day-71-resources-section -->"
