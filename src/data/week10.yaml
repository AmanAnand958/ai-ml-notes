    </div>\n<div class=\"task-body\" style=\"display:block\">\n<p>\n<strong>\n          Question:\n         </strong>\n         Define the difference between Translation Invariance and Translation Equivariance in CNNs. Which layers introduce each property?\n        </p>\n<p>\n<strong>\n          Answer:\n         </strong>\n<br/>\n         1.\n         <strong>\n          Translation Equivariance:\n         </strong>\n         If you shift the input image, the output of the layer shifts by the same amount: $f(Shift(x)) = Shift(f(x))$.\n         <strong>\n          Convolutional layers\n         </strong>\n         are equivariant. If an edge detector slides over an image, moving the edge 2 pixels to the right shifts the high activation coordinate in the feature map 2 pixels to the right.\n         <br/>\n         2.\n         <strong>\n          Translation Invariance:\n         </strong>\n         If you shift the input image, the output remains completely unchanged: $f(Shift(x)) = f(x)$.\n\
    \         <strong>\n          Pooling layers (especially Global Average Pooling)\n         </strong>\n         and final classification heads introduce invariance. By pooling activations (taking the max or mean over a window), the network doesn't care *where* the activation occurred, only *that* it occurred somewhere in the image.\n        </p>\n<button class=\"solution-toggle\" onclick=\"toggleSolution('sol-w10t19', this)\" style=\"margin-top: 0.8rem; background: rgba(108,140,255,0.1); color: var(--blue); border: 1px solid var(--blue); padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600;\">\n         \U0001F4A1 Show Solution\n        </button>\n<div class=\"solution-box\" id=\"sol-w10t19\" style=\"margin-top: 1rem;\">\n<div class=\"sol-header\">\n          ✅ COMPLETE SOLUTION — translation_invariance_vs_equivariance.py\n         </div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n            python\n           </span>\n\
