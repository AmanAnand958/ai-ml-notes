  tasks:
  - title: Build a Custom Tokenization Pipeline
    badge: Hard · 2.5 hrs
    badge_class: tb-hard
    time: 90 min
    prompt_html: |-
      <p><strong>
                 Write an executable Python script using raw string methods (no NLTK/Spacy):
                 <br/>
                 1. Normalize and split 5 paragraphs of raw text into word tokens.
                 <br/>
                 2. Build a custom vocabulary index dictionary mapping words to integers (sorted by frequency).
                 <br/>
                 3. Pad these integer lists to a uniform size using a manual Python post-padding and pre-padding routine.
                 <br/>
                 4. Display the resulting matrices and explain the trade-offs.
                </strong></p>
    done_when: Your script runs without frameworks, correctly compiles the vocabulary frequency map, handles pre-padding zeroes
      manually in list arrays, and cleanly prints the final coordinate sequence structures.
    git_cmd: 'git add . &amp;&amp; git commit -m "feat(day): day70: complete day 70 tasks and coding exercises"'
    sol_id: sol-w10d70t1
    solution_title: ✅ COMPLETE SOLUTION — build_a_custom_tokenization_pipeline.py
    solution_code: |-
      # Day 70 Task 1: Custom Character & Word Tokenization Pipeline
      import re
      from collections import Counter

      class SimpleTokenizer:
          def __init__(self, vocab_size: int = 500):
              self.vocab_size = vocab_size
              self.word2idx = {"<PAD>": 0, "<UNK>": 1, "<BOS>": 2, "<EOS>": 3}
              self.idx2word = {}

          def fit(self, texts: list):
              words = []
              for t in texts:
                  words.extend(re.findall(r'\w+', t.lower()))
              counts = Counter(words).most_common(self.vocab_size - 4)
              for idx, (word, _) in enumerate(counts, start=4):
                  self.word2idx[word] = idx
              self.idx2word = {i: w for w, i in self.word2idx.items()}

          def encode(self, text: str) -> list:
              tokens = [self.word2idx.get(w, 1) for w in re.findall(r'\w+', text.lower())]
              return [2] + tokens + [3]

      tok = SimpleTokenizer(vocab_size=50)
      tok.fit(["Machine learning models process natural language text."])
      enc = tok.encode("Natural language processing is fun")
      print("Tokenized Sequence:", enc)
      assert enc[0] == 2 and enc[-1] == 3
      print("✓ Custom tokenizer verified.")
    solution_lang: python
  - title: Trace Word Embedding Embedding Dimensions
    badge: Medium · 1.5 hrs
    badge_class: tb-med
    time: 45 min
    prompt_html: |-
      <p><strong>
                  Given:
                  <br/>
                  - A vocabulary size V = 50,000 words.
                  <br/>
                  - An embedding dimension D = 300.
                  <br/>
                  1. Calculate the exact parameter size of the embedding projection matrix.
                  <br/>
                  2. Compare this to the parameter count required if we passed one-hot vectors directly through a dense layer of size 300.
                 </strong></p>
    done_when: Your calculations correctly prove that both methods require exactly 15,000,000 parameters, illustrating that
      the embedding layer acts as an identical projection but saves massive execution time by bypassing sparse vector multiplications.
    git_cmd: 'git add trace_word_embedding_embedding_dimensions.py &amp;&amp; git commit -m "feat(day): day70: trace-word-embedding-embedding-dimensions"'
    sol_id: sol-w10d70t2
    solution_title: ✅ COMPLETE SOLUTION — trace_word_embedding_embedding_dimension.py
    solution_code: |-
      # Day 70 Task 2: Trace Word Embedding Lookup & Cosine Projection
      import numpy as np

      class EmbeddingLayer:
          def __init__(self, vocab_size: int, embed_dim: int):
              np.random.seed(42)
              self.weights = np.random.randn(vocab_size, embed_dim) * 0.1

          def lookup(self, token_indices: list) -> np.ndarray:
              return self.weights[token_indices]

          def similarity(self, idx1: int, idx2: int) -> float:
              v1, v2 = self.weights[idx1], self.weights[idx2]
              return float(np.dot(v1, v2) / (np.linalg.norm(v1) * np.linalg.norm(v2) + 1e-9))

      emb = EmbeddingLayer(vocab_size=100, embed_dim=16)
      vectors = emb.lookup([2, 5, 8])
      sim = emb.similarity(5, 8)
      print("Embedded Vector Batch Shape:", vectors.shape)
      print("Cosine Sim between Token 5 and 8:", round(sim, 4))
      assert vectors.shape == (3, 16)
      assert -1.0 <= sim <= 1.0
      print("✓ Embedding lookup verified.")
    solution_lang: python
