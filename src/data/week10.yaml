    solution_code: "<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\">compute_tanh_derivative</span>(x: float) -&gt; float:\n    <span class=\"str\">\"\"\"</span>\n    Computes analytical derivative of Tanh activation function:\n    dh/dx = <span class=\"fn\">d</span>(<span class=\"fn\">tanh</span>(x))/dx = <span class=\"num\">1</span> - <span class=\"fn\">tanh</span>(x)^<span class=\"num\">2</span> = <span class=\"num\">1</span> - h^<span class=\"num\">2</span>\n    <span class=\"str\">\"\"\"</span>\n    h = np.<span class=\"fn\">tanh</span>(x)\n    dh = <span class=\"num\">1.0</span> - h2\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Input x: {x} -&gt; Tanh(x): {h:.4f} -&gt; Analytical Derivative: {dh:.4f}\"</span>)\n    <span class=\"kw\">return</span> dh\n\n<span class=\"cm\"># Test with x = 0.5: tanh(0.5) = 0.4621 -&gt; derivative = 1 - 0.4621^2 = 0.7864</span>\nderiv = <span class=\"fn\">compute_tanh_derivative</span>(<span\
      \ class=\"num\">0.5</span>)"
    solution_lang: python
  - title: Trace the Tanh Derivative
    badge: Medium · 1.5 hrs
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n            Given:\n            <br/>\n            - Recurrent activation value a_t = 0.5.\n            <br/>\n            - Compute the exact analytical derivative of tanh(a_t) with respect to a_t.\n            <br/>\n            Show your step-by-step arithmetic steps.\n           </p>"
    done_when: Your calculations correctly prove that the derivative is 1 - tanh^2(0.5) = 1 - 0.4621^2 = 1 - 0.2135 = exactly 0.7865, illustrating how recurrent activations decay even at low input values.
    git_cmd: 'git add trace_the_tanh_derivative.py &amp;&amp; git commit -m "day66: trace-the-tanh-derivative"'
    sol_id: sol-w10t2
    solution_title: ✅ COMPLETE SOLUTION — trace_the_tanh_derivative.py
    solution_code: "<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">class</span> <span class=\"cls\">VanillaRNNScratch</span>:\n    <span class=\"str\">\"\"\"</span>\n    Vanilla Recurrent Neural Network forward step <span class=\"kw\">and</span> sequence processor.\n    Recurrence formula: h_t = <span class=\"fn\">tanh</span>(W_hh @ h_{t-<span class=\"num\">1</span>} + W_xh @ x_t + b_h)\n    Output formula:     y_t = W_hy @ h_t + b_y\n    <span class=\"str\">\"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, input_dim: int, hidden_dim: int, output_dim: int):\n        <span class=\"kw\">self</span>.input_dim = input_dim\n        <span class=\"kw\">self</span>.hidden_dim = hidden_dim\n        <span class=\"kw\">self</span>.output_dim = output_dim\n        \n        <span class=\"cm\"># Initialize weights with Xavier/Glorot scaling</span>\n        <span class=\"kw\">self</span>.W_xh\
      \ = np.random.<span class=\"fn\">randn</span>(hidden_dim, input_dim) * np.<span class=\"fn\">sqrt</span>(<span class=\"num\">2.0</span> / (input_dim + hidden_dim))\n        <span class=\"kw\">self</span>.W_hh = np.random.<span class=\"fn\">randn</span>(hidden_dim, hidden_dim) * np.<span class=\"fn\">sqrt</span>(<span class=\"num\">2.0</span> / (<span class=\"num\">2</span> * hidden_dim))\n        <span class=\"kw\">self</span>.W_hy = np.random.<span class=\"fn\">randn</span>(output_dim, hidden_dim) * np.<span class=\"fn\">sqrt</span>(<span class=\"num\">2.0</span> / (hidden_dim + output_dim))\n        <span class=\"kw\">self</span>.b_h = np.<span class=\"fn\">zeros</span>((hidden_dim, <span class=\"num\">1</span>))\n        <span class=\"kw\">self</span>.b_y = np.<span class=\"fn\">zeros</span>((output_dim, <span class=\"num\">1</span>))\n\n    <span class=\"kw\">def</span> <span class=\"fn\">forward_step</span>(<span class=\"kw\">self</span>, x_t: np.ndarray, h_prev: np.ndarray):\n\
      \        <span class=\"str\">\"\"\"Single time-step recurrent forward pass.\"\"\"</span>\n        h_next = np.<span class=\"fn\">tanh</span>(np.<span class=\"fn\">dot</span>(<span class=\"kw\">self</span>.W_xh, x_t) + np.<span class=\"fn\">dot</span>(<span class=\"kw\">self</span>.W_hh, h_prev) + <span class=\"kw\">self</span>.b_h)\n        y_t = np.<span class=\"fn\">dot</span>(<span class=\"kw\">self</span>.W_hy, h_next) + <span class=\"kw\">self</span>.b_y\n        <span class=\"kw\">return</span> h_next, y_t\n\n    <span class=\"kw\">def</span> <span class=\"fn\">forward_sequence</span>(<span class=\"kw\">self</span>, X_seq: np.ndarray):\n        <span class=\"str\">\"\"\"Process full sequence of shape (seq_len, input_dim, 1).\"\"\"</span>\n        seq_len = X_seq.shape[<span class=\"num\">0</span>]\n        h_t = np.<span class=\"fn\">zeros</span>((<span class=\"kw\">self</span>.hidden_dim, <span class=\"num\">1</span>))\n        h_states, outputs = [], []\n        \n        <span\
      \ class=\"kw\">for</span> t <span class=\"kw\">in</span> <span class=\"fn\">range</span>(seq_len):\n            h_t, y_t = <span class=\"kw\">self</span>.<span class=\"fn\">forward_step</span>(X_seq[t], h_t)\n            h_states.<span class=\"fn\">append</span>(h_t)\n            outputs.<span class=\"fn\">append</span>(y_t)\n            \n        <span class=\"kw\">return</span> np.<span class=\"fn\">array</span>(h_states), np.<span class=\"fn\">array</span>(outputs)\n\n<span class=\"cm\"># Test run</span>\nrnn = <span class=\"fn\">VanillaRNNScratch</span>(input_dim=<span class=\"num\">4</span>, hidden_dim=<span class=\"num\">8</span>, output_dim=<span class=\"num\">2</span>)\nmock_seq = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">5</span>, <span class=\"num\">4</span>, <span class=\"num\">1</span>)  <span class=\"cm\"># 5 time-steps, 4 features</span>\nh_states, outputs = rnn.<span class=\"fn\">forward_sequence</span>(mock_seq)\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Processed Sequence: {len(outputs)} steps. Final output shape: {outputs[-1].shape}\"</span>)"
