  content_html: "<h2 class=\"sh2\">\U0001F6E0 Tasks</h2><div id=\"tasks-section-toolkit\"><div class=\"task-block\">\n<div\
    \ aria-expanded=\"false\" class=\"task-header\" onclick=\"toggleTask(this)\" onkeydown=\"if(event.key==='Enter'||event.key==='\
    \ ')this.click()\" role=\"button\" style=\"background:rgba(79,209,165,.05);border-left:3px solid var(--green)\" tabindex=\"\
    0\">\n<span class=\"task-badge tb-hard\">\n        Scenario Q1\n       </span>\n<span class=\"task-title\">\n        He\
    \ Normal vs. Glorot Initialization Mechanics\n       </span>\n</div>\n<div class=\"task-body\" style=\"display:block\"\
    >\n<p>\n<strong>\n         Question:\n        </strong>\n        Why do standard Deep Learning networks use He (Kaiming)\
    \ initialization for ReLU layers and Glorot (Xavier) initialization for Tanh layers? What happens mathematically if you\
    \ swap them?\n       </p>\n<p>\n<strong>\n         Answer:\n        </strong>\n<br/>\n        1.\n        <strong>\n \
    \        Glorot (Xavier) Initialization:\n        </strong>\n        Designed under the assumption of linear activation\
    \ functions. It scales weights to maintain variance across layers: $Var(W) = \\frac{2}{n_{in} + n_{out}}$. For a Tanh\
    \ activation (which is symmetric and active around zero), this prevents activations from saturating or collapsing.\n \
    \       <br/>\n        2.\n        <strong>\n         He (Kaiming) Initialization:\n        </strong>\n        ReLU activations\
    \ clip all negative values to zero, effectively silencing half of the neurons at any step. This halves the variance of\
    \ outputs. To compensate and keep variance constant, He initialization doubles the variance of the initial weights: $Var(W)\
    \ = \\frac{2}{n_{in}}$.\n        <br/>\n        3.\n        <strong>\n         Swapping:\n        </strong>\n        If\
    \ you use Glorot on ReLU layers, the variance of activations will shrink by half at each layer, leading to vanishing activations\
    \ in deep networks. If you use He on Tanh layers, variance grows, causing gradients to saturate (explode) at extreme values.\n\
    \       </p>\n<button class=\"solution-toggle\" onclick=\"toggleSolution('sol-w10t15', this)\" style=\"margin-top: 0.8rem;\
    \ background: rgba(108,140,255,0.1); color: var(--blue); border: 1px solid var(--blue); padding: 5px 12px; border-radius:\
    \ 6px; font-size: 12px; cursor: pointer; font-weight: 600;\">\n        \U0001F4A1 Show Solution\n       </button>\n<div\
    \ class=\"solution-box\" id=\"sol-w10t15\" style=\"margin-top: 1rem;\">\n<div class=\"sol-header\">\n         ✅ COMPLETE\
    \ SOLUTION — he_normal_vs_glorot_initialization_mecha.py\n        </div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n\
    <span class=\"cb-lang\">gitignore</span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n            copy\n           </button>\n<button class=\"run-btn\" onclick=\"openInColab(this)\" style=\"margin-left:\
    \ 6px; background: var(--orange); color: var(--text); border: none; padding: 2px 8px; border-radius: 4px; font-size: 12.5px;\
    \ cursor: pointer;\">\n            ⚡ Run on Colab\n           </button>\n</div>\n</div>\n<pre><span class=\"cm\"># he_normal_vs_glorot_initialization_mecha.py\
    \ — Solution</span>\n<span class=\"cm\"># Complete solution for: He Normal vs. Glorot Initialization Mechanics</span>\n\
    \n<span class=\"cm\"># Dockerfile for RAG Application</span>\n<span class=\"cm\"># Build: docker build -t rag-app .</span>\n\
    <span class=\"cm\"># Run:   docker run -p 8000:8000 --env-file .env rag-app</span>\n\n<span class=\"cm\"># --- Dockerfile\
