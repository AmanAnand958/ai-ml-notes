- id: 69
  day_num: 69
  title: Time Series Forecasting with LSTMs
  subtitle: |-
    Time-series data is sequential but differs fundamentally from natural language.
     Unlike words which are discrete, time-series measurements are continuous numerical values with strong trends, seasonality, and noise.
     Today, we masterTime Series Forecasting using LSTMs.
     We will dissect the mathematics ofSliding Window Preprocessing,
     compareSingle-step vs. Multi-step Forecast Horizons,
     analyzeError Cascadingin autoregressive sequence loops,
     and build a production-grade Keras model to predict simulated stock price sequences.
  time_estimate: 6 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Implement a custom Sliding Window generator in numpy to structure 1D arrays into sequence pairs.
  - Formulate the difference between Single-step and Multi-step forecasting architectures.
  - Demonstrate the mathematical trade-offs of Autoregressive vs. Single-shot forecasting.
  - Build and train a robust LSTM regression model in Keras to predict continuous trends.
  checklist:
  - id: chk_69_1
    text: Derive and analyze mathematical and architectural principles for Time Series Forecasting with LSTMs
  - id: chk_69_2
    text: Build and benchmark production coding pipelines for Time Series Forecasting with LSTMs
  - id: chk_69_3
    text: Execute and validate test verification suite for Build a Multi-Step Forecast Model
  - id: chk_69_4
    text: Evaluate conceptual mastery via interactive flashcards and quiz challenges
  concept_flow:
  - RNN Hidden States & Vanishing Gradients
  - LSTM & GRU Cells
  - Deep Stacked LSTMs & Overfitting
  - Time Series Forecasting with LSTMs
  - Tokenization & Word Embeddings
  - 'Project: Movie Review Sentiment Classifier'
  - Capstone Validation & Edge Deployment
  hinglish: 'Many-to-one RNN: sentiment analysis ke liye — pura sentence ek sentiment predict karta hai. Sirf last timestep
    ka output use hota hai classification ke liye!'
  analogy: Sliding Window bilkul ek continuous railway track (time series) par train chalane jaisa hai. Train ke compartment
    ka size (window size) fix hai. Jaise-jaise train aage badhti hai (slides), compartment ke andar ke coordinates change
    hote hain aur jo agla engine pole aane wala hai, train use predict karti hai. Autoregressive prediction bilkul ankh band
    karke track par aage badhne jaisa hai — agar ek step par path miss ho gaya (error), toh aage ke saare steps par crash
    pakka hai!
  theory_html: "<h3 class=\"sh3\">\n       1. The Sliding Window Transformation\n      </h3>\n<p>\n       LSTMs require input\
    \ tensors of shape\n       \n        (Batch, Timesteps, Features)\n       \n       .\n    To feed a standard 1D continuous\
    \ sequence (like daily temperatures or stock closing prices),\n    we must structure it using a\n       <strong>\n   \
    \     Sliding Window\n       </strong>\n       .\n    Given a sequence of values $S = [s_1, s_2, s_3, \\dots, s_N]$ and\
    \ a window size $W$,\n    we extract overlapping segments of size $W$ as our input sequences ($X$),\n    and the subsequent\
    \ value $s_{t+W}$ as our target ($y$):\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$X_t\
    \ = [s_t, s_{t+1}, \\dots, s_{t+W-1}], \\quad y_t = s_{t+W}$$\n       </span>\n</div>\n<p>\n       For a window size $W=4$,\
    \ the sequence $S = [10, 11, 12, 13, 14, 15]$ is transformed into:\n      </p>\n<ul class=\"prose-list\">\n<li>\n    \
    \    $X_1 = [10, 11, 12, 13] \\implies y_1 = 14$\n       </li>\n<li>\n        $X_2 = [11, 12, 13, 14] \\implies y_2 =\
    \ 15$\n       </li>\n</ul>\n<h3 class=\"sh3\">\n       2. Single-Step vs. Multi-Step Forecasting Horizons\n      </h3>\n\
    <p>\n       When modeling future sequences, we must choose between two output strategies based on our business objectives:\n\
    \      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         Single-Step Forecasting:\n        </strong>\n       \
    \ The model outputs a single value predicting exactly one step into the future ($y_{t+1}$).\n      This is highly accurate\
    \ but has a short horizon.\n       </li>\n<li>\n<strong>\n         Multi-Step Forecasting:\n        </strong>\n      \
    \  The model outputs a vector of values representing $H$ future steps ($[y_{t+1}, y_{t+2}, \\dots, y_{t+H}]$).\n     \
    \ This is used to forecast long-range trends.\n       </li>\n</ul>\n<h3 class=\"sh3\">\n       3. Autoregressive Forecasting\
    \ &amp; Error Cascading\n      </h3>\n<p>\n       To forecast multiple steps ahead, we can use an\n       <strong>\n \
    \       Autoregressive approach\n       </strong>\n       :\n    predict step $t+1$, append this prediction to the input\
    \ sequence, and feed it back into the model to predict step $t+2$.\n       <br/>\n       While intuitive, this method\
    \ suffers from\n       <strong>\n        Error Cascading\n       </strong>\n       .\n    Any minor prediction error at\
    \ step $t+1$ is treated as absolute ground-truth fact during the next step, causing errors to compound exponentially over\
    \ the forecast horizon:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$e_{t+H} \\propto\
    \ (1 + \\lambda)^H \\cdot e_{t+1}$$\n       </span>\n<span class=\"desc\">\n        Where $\\lambda$ is the error propagation\
    \ constant. Error increases exponentially over the horizon.\n       </span>\n</div>\n<p>\n       Let's trace this decay\
    \ with a concrete decimal matrix dry-run.\n    Suppose the model makes a small error of 0.2 at step 1:\n      </p>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         dryrun — autoregressive_error.txt\n     \
    \   </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button><button class=\"\
    run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">Run</button></div>\n</div>\n<pre><code><span class=\"\
    kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n\n<span class=\"\
    kw\">class</span> <span class=\"cls\">TimeSeriesForecasterLSTM</span>(nn.Module):\n    <span class=\"str\">\"\"\"</span>\n\
    \    Multi-Step Time Series Forecasting LSTM Model.\n    Predicts next K future time steps given past N observation points.\n\
    \    <span class=\"str\">\"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"\
    kw\">self</span>, num_features=<span class=\"num\">1</span>, hidden_dim=<span class=\"num\">64</span>, num_layers=<span\
    \ class=\"num\">2</span>, forecast_horizon=<span class=\"num\">7</span>):\n        <span class=\"fn\">super</span>().<span\
    \ class=\"fn\">__init__</span>()\n        <span class=\"kw\">self</span>.lstm = nn.<span class=\"fn\">LSTM</span>(\n \
    \           input_size=num_features,\n            hidden_size=hidden_dim,\n            num_layers=num_layers,\n      \
    \      batch_first=<span class=\"kw\">True</span>,\n            dropout=<span class=\"num\">0.2</span>\n        )\n  \
    \      <span class=\"kw\">self</span>.fc = nn.<span class=\"fn\">Sequential</span>(\n            nn.<span class=\"fn\"\
    >Linear</span>(hidden_dim, <span class=\"num\">32</span>),\n            nn.<span class=\"fn\">ReLU</span>(),\n       \
    \     nn.<span class=\"fn\">Linear</span>(<span class=\"num\">32</span>, forecast_horizon)\n        )\n        \n    <span\
    \ class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\">self</span>, x):\n        <span class=\"\
    cm\"># x shape: (batch_size, seq_len, num_features)</span>\n        lstm_out, (h_n, c_n) = <span class=\"kw\">self</span>.<span\
    \ class=\"fn\">lstm</span>(x)\n        <span class=\"cm\"># Use final hidden state from top LSTM layer</span>\n      \
    \  last_hidden = lstm_out[:, -<span class=\"num\">1</span>, :]\n        predictions = <span class=\"kw\">self</span>.<span\
    \ class=\"fn\">fc</span>(last_hidden)\n        <span class=\"kw\">return</span> predictions\n\nmodel = <span class=\"\
    fn\">TimeSeriesForecasterLSTM</span>(num_features=<span class=\"num\">1</span>, hidden_dim=<span class=\"num\">64</span>,\
    \ num_layers=<span class=\"num\">2</span>, forecast_horizon=<span class=\"num\">7</span>)\nsample_input = torch.<span\
    \ class=\"fn\">randn</span>(<span class=\"num\">16</span>, <span class=\"num\">30</span>, <span class=\"num\">1</span>)\
    \ <span class=\"cm\"># 16 batches, 30 days history, 1 metric</span>\nforecast = <span class=\"fn\">model</span>(sample_input)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"Input shape: {sample_input.shape} -&gt; Forecast shape: {forecast.shape}\"\
    </span>)</code></pre>\n</div>\n<p>\n       By step 5, the compound interest effect of sequence errors has completely ruined\
    \ the forecast!\n    To avoid this on long horizons, we use\n       <strong>\n        Single-Shot Multi-Step Forecasting\n\
    \       </strong>\n       ,\n    configuring the Dense output layer of the LSTM to directly predict all $H$ steps simultaneously\
    \ (e.g.\n       \n        Dense(5)\n       \n       ).\n    This avoids recursive feedback loops entirely, preventing\
    \ error cascading.\n      </p>\n<h3 class=\"sh3\">\n       4. Production Time Series LSTM in Keras\n      </h3>\n<p>\n\
    \       Let's write a complete, self-contained Keras script that synthesizes a continuous sine wave stock trend,\n   \
    \ converts it using a sliding window, trains an LSTM regression network, and forecasts future prices:\n      </p>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — time_series_lstm.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n\
    </div>\n</div>\n<pre><code><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span> torch.nn <span class=\"\
    kw\">as</span> nn\n\n<span class=\"kw\">class</span> <span class=\"cls\">TimeSeriesForecasterLSTM</span>(nn.Module):\n\
    \    <span class=\"str\">\"\"\"</span>\n    Multi-Step Time Series Forecasting LSTM Model.\n    Predicts next K future\
    \ time steps given past N observation points.\n    <span class=\"str\">\"\"\"</span>\n    <span class=\"kw\">def</span>\
    \ <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, num_features=<span class=\"num\">1</span>, hidden_dim=<span\
    \ class=\"num\">64</span>, num_layers=<span class=\"num\">2</span>, forecast_horizon=<span class=\"num\">7</span>):\n\
    \        <span class=\"fn\">super</span>().<span class=\"fn\">__init__</span>()\n        <span class=\"kw\">self</span>.lstm\
    \ = nn.<span class=\"fn\">LSTM</span>(\n            input_size=num_features,\n            hidden_size=hidden_dim,\n  \
    \          num_layers=num_layers,\n            batch_first=<span class=\"kw\">True</span>,\n            dropout=<span\
    \ class=\"num\">0.2</span>\n        )\n        <span class=\"kw\">self</span>.fc = nn.<span class=\"fn\">Sequential</span>(\n\
    \            nn.<span class=\"fn\">Linear</span>(hidden_dim, <span class=\"num\">32</span>),\n            nn.<span class=\"\
    fn\">ReLU</span>(),\n            nn.<span class=\"fn\">Linear</span>(<span class=\"num\">32</span>, forecast_horizon)\n\
    \        )\n        \n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\">self</span>,\
    \ x):\n        <span class=\"cm\"># x shape: (batch_size, seq_len, num_features)</span>\n        lstm_out, (h_n, c_n)\
    \ = <span class=\"kw\">self</span>.<span class=\"fn\">lstm</span>(x)\n        <span class=\"cm\"># Use final hidden state\
    \ from top LSTM layer</span>\n        last_hidden = lstm_out[:, -<span class=\"num\">1</span>, :]\n        predictions\
    \ = <span class=\"kw\">self</span>.<span class=\"fn\">fc</span>(last_hidden)\n        <span class=\"kw\">return</span>\
    \ predictions\n\nmodel = <span class=\"fn\">TimeSeriesForecasterLSTM</span>(num_features=<span class=\"num\">1</span>,\
    \ hidden_dim=<span class=\"num\">64</span>, num_layers=<span class=\"num\">2</span>, forecast_horizon=<span class=\"num\"\
    >7</span>)\nsample_input = torch.<span class=\"fn\">randn</span>(<span class=\"num\">16</span>, <span class=\"num\">30</span>,\
    \ <span class=\"num\">1</span>) <span class=\"cm\"># 16 batches, 30 days history, 1 metric</span>\nforecast = <span class=\"\
    fn\">model</span>(sample_input)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Input shape: {sample_input.shape}\
    \ -&gt; Forecast shape: {forecast.shape}\"</span>)</code></pre>\n</div>\n\n<h2 class=\"sh2\">\n       \U0001F6E0 Tasks\n\
    \      </h2>\n<div style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\"\
    >\n        \U0001F50D\n        <strong>\n         Search terms:\n        </strong>\n\n         gru vs lstm cell math complexity\
    \ differences, gated recurrent unit gate update reset\n        \n</div>\n<!-- /day-69-theory -->\n<!-- /day-69-resources-section\
    \ -->\n<div class=\"callout\" style=\"background:rgba(247,169,75,.05); border:1px solid var(--orange); padding:1.2rem;\
    \ border-radius:8px; margin:1.5rem 0;\">\n<h3>>\n       \U0001F4C8 Classical Time Series Foundations: STL Decomposition\
    \ &amp; ARIMA(p,d,q)\n      </h3>\n<p>\n       Before applying deep learning sequence models (LSTMs), classical time series\
    \ analysis provides fast baseline models:\n      </p>\n<ul>\n<li>\n<strong>\n         Decomposition:\n        </strong>\n\
    \        $Y_t = \\text{Trend}_t + \\text{Seasonal}_t + \\text{Residual}_t$.\n       </li>\n<li>\n<strong>\n         Stationarity:\n\
    \        </strong>\n        Augmented Dickey-Fuller (ADF) test checks if mean and variance are constant over time.\n \
    \      </li>\n<li>\n<strong>\n         ARIMA(p,d,q):\n        </strong>\n        AutoRegressive ($p$), Differencing ($d$\
    \ for stationarity), Moving Average ($q$).\n       </li>\n</ul>\n</div>"
