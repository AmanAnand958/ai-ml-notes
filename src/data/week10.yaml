week_number: 10
title: RNNs & Sequential Data
description: ''
days:
- id: '66'
  day_num: 66
  title: RNN Hidden States & Vanishing Gradients
  subtitle: "Traditional feedforward neural networks operate under a major limitation: they assume all inputs and outputs are independent of one another.\n      This fails for sequential data like text, audio, or time-series.\n      Today, we launchMonth 3 (Sequence Modeling).\n      We will dissect the mathematics ofRecurrent Neural Networks (RNNs),\n      formulate recurrent hidden state propagation,\n      and mathematically trace why theVanishing Gradient Problemcripples vanilla RNNs when backpropagating through time."
  time_estimate: 6 hours
  difficulty: +150 XP
  badges:
  - label: 🧠 Graduate Math
    variant: o
  - label: 🔬 Math Heavy
    variant: b
  xp: 150
  objectives:
  - Formulate recurrent step equations for hidden state transitions.
  - Perform a manual numpy forward pass of a vanilla recurrent neuron.
  - Derive the Backpropagation Through Time (BPTT) chain rule in matrix form.
  - Identify the eigenvalue conditions that trigger vanishing and exploding gradients.
  checklist: []
  concept_flow:
  - Sequence Data
  - Recurrent Memory
  - Vanishing Gradients
  - LSTM Gates
  - GRU Optimizations
  - Encoder-Decoder
  hinglish: 'LSTM ne is problem solve kiya cell state ke through: information highway jo long distances travel kar sakta hai. Forget gate, input gate, output gate — teen gates milke control karte hain!'
  analogy: Recurrent Neural Network bilkul ek traditional accounts register ya ledger ki tarah hai. Har saal ke end mein balance (hidden state) forward carry kiya jata hai. Lekin agar accounting matrix mein minor calculations values ko zero ki taraf push karein (vanishing gradient), toh purane entries ke updates clear ho jate hain aur bookkeeper ko sirf aakhri few steps ka hi transaction yaad rehta hai!
  theory_html: "<h3 class=\"sh3\">\n       1. Why Sequential Data Needs Memory\n      </h3>\n<p>\n       Consider the sentence:\n       <em>\n        \"The clouds are in the sky.\"\n       </em>\n       To predict the final word \"sky\", a model must remember the context word \"clouds\".\n    Traditional dense networks process each word individually, losing all temporal relationships.\n       <br/>\n       RNNs solve this by incorporating a\n       <strong>\n        recurrent hidden state\n       </strong>\n       ($h_t$) that acts as a memory track, passing information forward through time:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$h_t = \\tanh(W_{hh} h_{t-1} + W_{xh} x_t + b_h)$$\n       </span>\n<span class=\"desc\">\n        Where h_t is the hidden state at step t, W_{hh} is the recurrent weight matrix, and W_{xh} is the input weight matrix.\n       </span>\n</div>\n<p>\n       The output projection at each step is calculated as:\n      </p>\n<div class=\"\
    math-block\">\n<span class=\"formula\">\n        $$\\hat{y}_t = \\text{softmax}(W_{hy} h_t + b_y)$$\n       </span>\n</div>\n<h3 class=\"sh3\">\n       2. Recurrent Unrolling through Time\n      </h3>\n<p>\n       To understand how information propagates, we can unroll the recurrent connections over $T$ timesteps.\n    This exposes a deep feedforward-like chain where weights are shared across all steps:\n      </p>\n<div class=\"mermaid\">\ngraph TD\n  x1[\"x_1\"] --&gt; h1[\"h_1\"] --&gt; y1[\"y_1\"]\n  x2[\"x_2\"] --&gt; h2[\"h_2\"] --&gt; y2[\"y_2\"]\n  x3[\"x_3\"] --&gt; h3[\"h_3\"] --&gt; y3[\"y_3\"]\n  x4[\"x_4\"] --&gt; h4[\"h_4\"] --&gt; y4[\"y_4\"]\n  h1 --&gt; h2 --&gt; h3 --&gt; h4\n  h4 -.-&gt;|BPTT Gradient Flow| h1\n</div>\n<div class=\"diagram-cap\">\n       Recurrent Neural Network unrolled over 4 discrete temporal timesteps, tracing BPTT gradient flows.\n      </div>\n<h3 class=\"sh3\">\n       3. The Mathematics of Vanishing Gradients\n      </h3>\n<p>\n       During\
    \ training, we calculate the gradient of the loss $L$ with respect to the recurrent weight matrix $W_{hh}$.\n    Using the chain rule across $T$ steps:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$\\frac{\\partial L}{\\partial W_{hh}} = \\sum_{t=1}^T \\frac{\\partial L_t}{\\partial W_{hh}}$$\n       </span>\n</div>\n<p>\n       For any step $t$, the derivative depends on the historical hidden state transitions:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$\\frac{\\partial L_t}{\\partial W_{hh}} = \\sum_{k=1}^t \\frac{\\partial L_t}{\\partial h_t} \\frac{\\partial h_t}{\\partial h_k} \\frac{\\partial h_k}{\\partial W_{hh}}$$\n       </span>\n</div>\n<p>\n       The middle term $\\frac{\\partial h_t}{\\partial h_k}$ is computed as a chain of single-step Jacobian matrices:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$\\frac{\\partial h_t}{\\partial h_k} = \\prod_{j=k+1}^t \\frac{\\partial h_j}{\\\
    partial h_{j-1}} = \\prod_{j=k+1}^t \\text{diag}(1 - h_j^2) \\cdot W_{hh}^T$$\n       </span>\n</div>\n<svg aria-label=\"Gradient magnitude decaying exponentially with timestep distance for tanh and sigmoid versus flat ReLU\" height=\"340\" role=\"img\" viewbox=\"0 0 700 340\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\">\n<style>\n        svg .w10t{font-family:DM Sans,sans-serif} svg .w10m{font-family:IBM Plex Mono,monospace}\n       </style>\n<defs>\n<lineargradient id=\"w10-bg_s\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n<stop offset=\"0%\" stop-color=\"#1a1e2e\">\n</stop>\n<stop offset=\"100%\" stop-color=\"var(--bg)\">\n</stop>\n</lineargradient>\n</defs>\n<rect fill=\"url(#w10-bg_s)\" height=\"340\" rx=\"12\" width=\"700\">\n</rect>\n<text class=\"w10t\" fill=\"#e6edf3\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" x=\"350\" y=\"26\">\n        Vanishing gradients — ‖∂L/∂h_t‖ vs timestep distance (t − k)\n       </text>\n<rect fill=\"#e56b8c\" fill-opacity=\"0.07\"\
    \ height=\"120\" width=\"580\" x=\"70\" y=\"115\">\n</rect>\n<text class=\"w10t\" fill=\"#e56b8c\" font-size=\"10\" font-weight=\"700\" text-anchor=\"start\" x=\"80\" y=\"130\">\n        BLIND ZONE — gradient &lt; 10⁻²: network cannot learn distant steps\n       </text>\n<line stroke=\"#2a3050\" stroke-width=\"1\" x1=\"70\" x2=\"650\" y1=\"235\" y2=\"235\">\n</line>\n<line stroke=\"#2a3050\" stroke-width=\"1\" x1=\"70\" x2=\"70\" y1=\"60\" y2=\"235\">\n</line>\n<text class=\"w10m\" fill=\"var(--text2)\" font-size=\"9.5\" text-anchor=\"middle\" x=\"360\" y=\"256\">\n        timestep distance (t − k) →\n       </text>\n<text class=\"w10m\" fill=\"var(--text2)\" font-size=\"9.5\" text-anchor=\"end\" x=\"62\" y=\"240\">\n        10⁰\n       </text>\n<text class=\"w10m\" fill=\"var(--text2)\" font-size=\"9.5\" text-anchor=\"end\" x=\"62\" y=\"200\">\n        10⁻¹\n       </text>\n<text class=\"w10m\" fill=\"var(--text2)\" font-size=\"9.5\" text-anchor=\"end\" x=\"62\" y=\"160\">\n       \
    \ 10⁻²\n       </text>\n<text class=\"w10m\" fill=\"var(--text2)\" font-size=\"9.5\" text-anchor=\"end\" x=\"62\" y=\"120\">\n        10⁻³\n       </text>\n<text class=\"w10m\" fill=\"var(--text2)\" font-size=\"9\" text-anchor=\"middle\" x=\"70\" y=\"248\">\n        0\n       </text>\n<text class=\"w10m\" fill=\"var(--text2)\" font-size=\"9\" text-anchor=\"middle\" x=\"215\" y=\"248\">\n        10\n       </text>\n<text class=\"w10m\" fill=\"var(--text2)\" font-size=\"9\" text-anchor=\"middle\" x=\"360\" y=\"248\">\n        20\n       </text>\n<text class=\"w10m\" fill=\"var(--text2)\" font-size=\"9\" text-anchor=\"middle\" x=\"505\" y=\"248\">\n        30\n       </text>\n<text class=\"w10m\" fill=\"var(--text2)\" font-size=\"9\" text-anchor=\"middle\" x=\"650\" y=\"248\">\n        40\n       </text>\n<line stroke=\"#e56b8c\" stroke-dasharray=\"5 4\" stroke-opacity=\"0.8\" stroke-width=\"1.2\" x1=\"70\" x2=\"650\" y1=\"155\" y2=\"155\">\n</line>\n<line stroke=\"#4fd1a5\" stroke-width=\"\
    3\" x1=\"70\" x2=\"650\" y1=\"235\" y2=\"235\">\n</line>\n<text class=\"w10t\" fill=\"#4fd1a5\" font-size=\"11\" font-weight=\"700\" text-anchor=\"start\" x=\"560\" y=\"228\">\n        ReLU\n       </text>\n<path d=\"M 70.0 235.0 L 82.1 229.2 L 94.2 223.4 L 106.2 217.6 L 118.3 211.8 L 130.4 206.1 L 142.5 200.3 L 154.6 194.5 L 166.7 188.7 L 178.8 182.9 L 190.8 177.1 L 202.9 171.3 L 215.0 165.5 L 227.1 159.7 L 239.2 153.9 L 251.2 148.1 L 263.3 142.4 L 275.4 136.6 L 287.5 130.8 L 299.6 125.0 L 311.7 119.2 L 323.8 113.4 L 335.8 107.6 L 347.9 101.8 L 360.0 96.0 L 372.1 90.2 L 384.2 84.5 L 396.2 78.7 L 408.3 72.9 L 420.4 67.1 L 432.5 61.3\" fill=\"none\" stroke=\"#f5d76e\" stroke-width=\"2.6\">\n</path>\n<text class=\"w10t\" fill=\"#f5d76e\" font-size=\"11\" font-weight=\"700\" text-anchor=\"start\" x=\"440\" y=\"92\">\n        tanh — ∏(1−h²)·Wᵀ\n       </text>\n<path d=\"M 70.0 235.0 L 74.8 229.2 L 79.7 223.4 L 84.5 217.6 L 89.3 211.8 L 94.2 206.1 L 99.0 200.3 L 103.8 194.5 L 108.7 188.7\
    \ L 113.5 182.9 L 118.3 177.1 L 123.2 171.3 L 128.0 165.5 L 132.8 159.7 L 137.7 153.9 L 142.5 148.1 L 147.3 142.4 L 152.2 136.6 L 157.0 130.8 L 161.8 125.0 L 166.7 119.2 L 171.5 113.4 L 176.3 107.6 L 181.2 101.8 L 186.0 96.0 L 190.8 90.2 L 195.7 84.5 L 200.5 78.7 L 205.3 72.9 L 210.2 67.1 L 215.0 61.3\" fill=\"none\" stroke=\"#6c8cff\" stroke-width=\"2.6\">\n</path>\n<text class=\"w10t\" fill=\"#6c8cff\" font-size=\"11\" font-weight=\"700\" text-anchor=\"start\" x=\"225\" y=\"105\">\n        sigmoid — even faster decay\n       </text>\n<text class=\"w10t\" fill=\"var(--text2)\" font-size=\"10\" text-anchor=\"middle\" x=\"350\" y=\"286\">\n        gradient = ∏ⱼ diag(1 − hⱼ²) · W_hhᵀ — eigenvalues &lt; 1 ⇒ exponential decay (log-scale y-axis)\n       </text>\n<text class=\"w10t\" fill=\"#f5d76e\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"350\" y=\"312\">\n        Fix: ReLU + LSTM gates + residual connections keep the gradient highway open\n       </text>\n</svg>\n\
    <h3 class=\"sh3\">\n       4. Numpy Manual Forward Pass Trace\n      </h3>\n<p>\n       Let's write a complete, self-contained Python script to trace this hidden state propagation mathematically using numpy:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — rnn_forward.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">class</span> <span class=\"cls\">VanillaRNNScratch</span>:\n    <span class=\"str\">\"\"\"</span>\n    Vanilla Recurrent Neural Network forward step <span class=\"kw\">and</span> sequence processor.\n    Recurrence formula: h_t = <span class=\"fn\">tanh</span>(W_hh @ h_{t-<span class=\"num\">1</span>} + W_xh\
    \ @ x_t + b_h)\n    Output formula:     y_t = W_hy @ h_t + b_y\n    <span class=\"str\">\"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, input_dim: int, hidden_dim: int, output_dim: int):\n        <span class=\"kw\">self</span>.input_dim = input_dim\n        <span class=\"kw\">self</span>.hidden_dim = hidden_dim\n        <span class=\"kw\">self</span>.output_dim = output_dim\n        \n        <span class=\"cm\"># Initialize weights with Xavier/Glorot scaling</span>\n        <span class=\"kw\">self</span>.W_xh = np.random.<span class=\"fn\">randn</span>(hidden_dim, input_dim) * np.<span class=\"fn\">sqrt</span>(<span class=\"num\">2.0</span> / (input_dim + hidden_dim))\n        <span class=\"kw\">self</span>.W_hh = np.random.<span class=\"fn\">randn</span>(hidden_dim, hidden_dim) * np.<span class=\"fn\">sqrt</span>(<span class=\"num\">2.0</span> / (<span class=\"num\">2</span> * hidden_dim))\n        <span class=\"kw\"\
    >self</span>.W_hy = np.random.<span class=\"fn\">randn</span>(output_dim, hidden_dim) * np.<span class=\"fn\">sqrt</span>(<span class=\"num\">2.0</span> / (hidden_dim + output_dim))\n        <span class=\"kw\">self</span>.b_h = np.<span class=\"fn\">zeros</span>((hidden_dim, <span class=\"num\">1</span>))\n        <span class=\"kw\">self</span>.b_y = np.<span class=\"fn\">zeros</span>((output_dim, <span class=\"num\">1</span>))\n\n    <span class=\"kw\">def</span> <span class=\"fn\">forward_step</span>(<span class=\"kw\">self</span>, x_t: np.ndarray, h_prev: np.ndarray):\n        <span class=\"str\">\"\"\"Single time-step recurrent forward pass.\"\"\"</span>\n        h_next = np.<span class=\"fn\">tanh</span>(np.<span class=\"fn\">dot</span>(<span class=\"kw\">self</span>.W_xh, x_t) + np.<span class=\"fn\">dot</span>(<span class=\"kw\">self</span>.W_hh, h_prev) + <span class=\"kw\">self</span>.b_h)\n        y_t = np.<span class=\"fn\">dot</span>(<span class=\"kw\">self</span>.W_hy, h_next)\
    \ + <span class=\"kw\">self</span>.b_y\n        <span class=\"kw\">return</span> h_next, y_t\n\n    <span class=\"kw\">def</span> <span class=\"fn\">forward_sequence</span>(<span class=\"kw\">self</span>, X_seq: np.ndarray):\n        <span class=\"str\">\"\"\"Process full sequence of shape (seq_len, input_dim, 1).\"\"\"</span>\n        seq_len = X_seq.shape[<span class=\"num\">0</span>]\n        h_t = np.<span class=\"fn\">zeros</span>((<span class=\"kw\">self</span>.hidden_dim, <span class=\"num\">1</span>))\n        h_states, outputs = [], []\n        \n        <span class=\"kw\">for</span> t <span class=\"kw\">in</span> <span class=\"fn\">range</span>(seq_len):\n            h_t, y_t = <span class=\"kw\">self</span>.<span class=\"fn\">forward_step</span>(X_seq[t], h_t)\n            h_states.<span class=\"fn\">append</span>(h_t)\n            outputs.<span class=\"fn\">append</span>(y_t)\n            \n        <span class=\"kw\">return</span> np.<span class=\"fn\">array</span>(h_states),\
    \ np.<span class=\"fn\">array</span>(outputs)\n\n<span class=\"cm\"># Test run</span>\nrnn = <span class=\"fn\">VanillaRNNScratch</span>(input_dim=<span class=\"num\">4</span>, hidden_dim=<span class=\"num\">8</span>, output_dim=<span class=\"num\">2</span>)\nmock_seq = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">5</span>, <span class=\"num\">4</span>, <span class=\"num\">1</span>)  <span class=\"cm\"># 5 time-steps, 4 features</span>\nh_states, outputs = rnn.<span class=\"fn\">forward_sequence</span>(mock_seq)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Processed Sequence: {len(outputs)} steps. Final output shape: {outputs[-1].shape}\"</span>)</pre>\n</div>\n\n<h2 class=\"sh2\">\n       \U0001F6E0 Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\">\n        \U0001F50D\n        <strong>\n         Search terms:\n        </strong>\n\n         rnn backpropagation through\
    \ time vanishing gradients, sequence modeling input shape mismatch\n        \n</div>\n<!-- /day-66-theory -->\n<!-- /day-66-resources-section -->"
