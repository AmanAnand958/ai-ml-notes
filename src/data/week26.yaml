      \    clf.fit(X_train_scaled, y_train)\n    \n    # 4. Evaluate performance\n\
      \    y_pred = clf.predict(X_test_scaled)\n    acc = accuracy_score(y_test, y_pred)\n\
      \    print(f\"Model Test Accuracy: {acc * 100:.2f}%\")\n    print(\"\\nClassification\
