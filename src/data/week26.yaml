    description: "<div class=\"callout-title\" style=\"font-weight:700; color:var(--red);\">\n       ⚠️ Gotcha: Whisper Hallucination on Silent Audio\n      </div>\n<p style=\"margin:0.4rem 0 0; font-size:13px; line-height:1.6;\">\n       Passing long unvoiced silent segments to Whisper causes the autoregressive decoder to loop and hallucinate repetitive phrases. Always apply Voice Activity Detection (VAD) before transcription.\n      </p>"
