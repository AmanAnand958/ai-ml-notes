      <ul>\n  <li>Convert PDF document pages to screenshots and generate multi-vector visual patch embeddings.</li>\n  <li>Implement\
      \ Late-Interaction MaxSim scoring: $\text{Score}(Q, D) = \\sum_{i=1}^{|Q|} \\max_{j=1}^{|D|} (\\mathbf{q}_i \\cdot \\\
      mathbf{d}_j)$.</li>\n  <li>Benchmark retrieval accuracy against traditional OCR + text vector search on a visual document\
