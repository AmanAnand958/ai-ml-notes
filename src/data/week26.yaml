    - letter: A
      text: 44.1 kHz raw WAV PCM audio in stereo.
      is_correct: false
    - letter: B
      text: 16 kHz mono audio converted into 80-channel (or 128-channel in v3) Log-Mel Spectrograms in 30-second chunks.
      is_correct: true
    - letter: C
      text: MIDI musical event sequences.
      is_correct: false
