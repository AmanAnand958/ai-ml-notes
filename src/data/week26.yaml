    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Project visual token features from CLIP image space into LLaMA text embedding space.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">class</span> <span class=\"cls\">LLaVAProjectionLayer</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"kw\">self</span>, visual_dim: int = <span class=\"num\">1024</span>, text_dim: int = <span class=\"num\">4096</span>):\n        <span class=\"kw\">self</span>.W_proj = np.random.<span class=\"fn\">randn</span>(visual_dim, text_dim) *\
      \ <span class=\"num\">0.02</span>\n        <span class=\"kw\">self</span>.bias = np.<span class=\"fn\">zeros</span>(text_dim)\n\n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\">self</span>, visual_tokens: np.ndarray) -&gt; np.ndarray:\n        <span class=\"cm\"># visual_tokens: (batch, num_patches=576, visual_dim=1024)</span>\n        <span class=\"kw\">return</span> np.<span class=\"fn\">matmul</span>(visual_tokens, <span class=\"kw\">self</span>.W_proj) + <span class=\"kw\">self</span>.bias\n\nproj = <span class=\"fn\">LLaVAProjectionLayer</span>()\ndummy_patches = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">1</span>, <span class=\"num\">576</span>, <span class=\"num\">1024</span>)\nprojected_text_tokens = proj.<span class=\"fn\">forward</span>(dummy_patches)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Projected Visual Tokens Shape: {projected_text_tokens.shape} (Ready for LLM Decoder Transformer)\"</span>)</pre>\n\
      </div>"
