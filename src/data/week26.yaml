    - letter: B
      text: It increases audio pitch to compress bandwidth.
      is_correct: false
    - letter: C
      text: It converts speech into encrypted hashes.
      is_correct: false
    - letter: D
      text: It reduces GPU memory usage to zero.
      is_correct: false
    correct_fb: ✅ Correct! Silero-VAD strips silent gaps, eliminating Whisper's known failure mode of hallucinating on silence.
    wrong_fb: ❌ Incorrect. Feeding long silent audio chunks into Whisper causes autoregressive hallucination loops.
  - num_str: QUESTION 4 OF 4
    question: How does Whisper achieve word-level timestamp alignment for audio subtitles and search?
    qid: quiz-section-187-4
    options:
    - letter: A
      text: By inspecting cross-attention weight matrices between decoder text tokens and encoder audio frames (or using Dynamic Time Warping).
