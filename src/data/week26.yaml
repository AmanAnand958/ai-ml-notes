  - front: Diarization
    back: The process of identifying "who spoke when" in an audio recording. Whisper doesn't do this natively; requires external tools like Pyannote.
  - front: 25MB Limit
    back: The maximum file size allowed by the OpenAI Whisper API. Larger files must be compressed or chunked.
  gotcha:
