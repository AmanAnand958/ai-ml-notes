  flashcards:
  - front: 'Core concept: What is the significance of Sharding in ML System Design
      — Semantic Search?'
    back: Distributing data across multiple physical machines to scale horizontally
      when data exceeds one machine's RAM.
  - front: Scalar Quantization (SQ)?
    back: Converting 32-bit floats to 8-bit integers (int8). Provides 4x memory reduction
      with negligible accuracy loss.
  - front: 'Core concept: What is the significance of Scatter-Gather in ML System
      Design — Semantic Search?'
    back: 'Search pattern for sharded DBs: send query to all shards concurrently,
      collect local Top-K results, merge and sort globally.'
