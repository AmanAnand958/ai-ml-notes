    correct_fb: ✅ Correct! 1D convolutional layers downsample the 80-channel log-Mel spectrogram before the Transformer encoder.
    wrong_fb: ❌ Incorrect. Whisper passes log-Mel spectrograms through two conv1d layers with stride 2 into the encoder.
  - num_str: QUESTION 3 OF 4
    question: Why is Voice Activity Detection (VAD) critical before running long-form audio through Whisper in production?
    qid: quiz-section-187-3
