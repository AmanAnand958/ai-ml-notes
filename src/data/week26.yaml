    </div><h3 class="sh3">High-Concurrency Generative Search Architecture</h3><p>
    Architecting an enterprise AI search engine capable of handling 10,000 QPS requires a 4-tier funnel:
    1. <strong>Tier 1 (Filter &amp; Lexical):</strong> BM25 / Sparse index narrows 100M documents $\to$ 10,000 candidates ($\lt 2\text{ms}$).
    2. <strong>Tier 2 (Vector Search):</strong> HNSW dense retrieval narrows 10,000 $\to$ 200 candidates ($\lt 8\text{ms}$).
    3. <strong>Tier 3 (Cross-Encoder Re-Ranker):</strong> MiniLM re-ranks 200 $\to$ 10 high-precision chunks ($\lt 15\text{ms}$).
    4. <strong>Tier 4 (LLM Generation):</strong> vLLM streaming synthesizer produces cited response ($\lt 250\text{ms}$ TTFT).
    </p>
