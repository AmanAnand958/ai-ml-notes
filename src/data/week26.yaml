    badge: TASK 1
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<strong><p style=\"margin-top:0; color:var(--muted); font-s</strong>\
      \ <p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n      \
