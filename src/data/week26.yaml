  quizzes:
  - num_str: QUESTION 1 OF 4
    question: When scaling a vector search database to 100M+ vectors, which vector indexing technique provides sub-10ms latency with low RAM footprint?
    qid: quiz-section-190-1
    options:
    - letter: A
      text: Exact Flat L2 Euclidean distance search across all uncompressed vectors.
      is_correct: false
    - letter: B
      text: HNSW (Hierarchical Navigable Small World) graph combined with Product Quantization (IVF-PQ) or Scalar Quantization (SQ8).
      is_correct: true
    - letter: C
      text: Linear file scans using grep on CSV files.
      is_correct: false
    - letter: D
      text: Storing vectors in browser LocalStorage.
      is_correct: false
    correct_fb: ✅ Correct! HNSW with Product Quantization (PQ) compresses vectors 4x-16x and delivers sub-10ms nearest neighbor search.
    wrong_fb: ❌ Incorrect. Exact Flat search scales linearly O(N), whereas HNSW + PQ provides logarithmic O(log N) approximate nearest neighbor lookup.
  - num_str: QUESTION 2 OF 4
    question: When designing an enterprise search engine, how should Dense Vector Search and Lexical BM25 Search be combined?
    qid: quiz-section-190-2
    options:
    - letter: A
      text: Using Hybrid Search with Reciprocal Rank Fusion (RRF) or a cross-encoder re-ranker to combine semantic recall with exact keyword precision.
      is_correct: true
    - letter: B
      text: By alternating between vector search on odd days and keyword search on even days.
      is_correct: false
    - letter: C
      text: By discarding keyword search entirely because neural vectors solve all search problems.
      is_correct: false
    - letter: D
      text: By concatenating search strings with vector float numbers.
      is_correct: false
    correct_fb: ✅ Correct! Hybrid Search with RRF merges dense semantic recall (conceptual similarity) with sparse BM25 (exact SKU/product code match).
    wrong_fb: ❌ Incorrect. Hybrid search with RRF combines the semantic understanding of dense embeddings with exact keyword precision of BM25.
  - num_str: QUESTION 3 OF 4
    question: What is the primary benefit of deploying a Cross-Encoder Re-Ranker (e.g. BGE-Reranker or Cohere Rerank) in a search pipeline?
    qid: quiz-section-190-3
    options:
    - letter: A
      text: It performs full cross-attention between query and retrieved candidates, capturing fine-grained token interactions that dual-encoders miss.
      is_correct: true
    - letter: B
      text: It reduces vector database memory consumption by 90%.
      is_correct: false
    - letter: C
      text: It translates text into audio waveforms.
      is_correct: false
    - letter: D
      text: It bypasses the need for index sharding.
      is_correct: false
    correct_fb: ✅ Correct! Cross-encoders perform joint cross-attention across query and candidate text, significantly boosting precision on top-50 candidates.
    wrong_fb: ❌ Incorrect. Cross-encoders attend across query and document jointly, providing superior ranking accuracy over bi-encoder embeddings.
  - num_str: QUESTION 4 OF 4
    question: How does Vector Index Sharding with Scatter-Gather architecture handle search traffic scaling?
    qid: quiz-section-190-4
    options:
    - letter: A
      text: The query is scattered across N index shards in parallel, and a coordinator gathers top-K candidates from each shard before global re-ranking.
      is_correct: true
    - letter: B
      text: Every query is routed to only one random shard and results are returned directly without merging.
      is_correct: false
    - letter: C
      text: Sharding duplicates the entire database on every single CPU core.
      is_correct: false
    - letter: D
      text: Sharding disables vector compression to maximize accuracy.
      is_correct: false
    correct_fb: ✅ Correct! Scatter-gather queries vector shards concurrently and aggregates top candidates at the API gateway layer.
    wrong_fb: ❌ Incorrect. Scatter-gather broadcasts search queries to independent shards and merges the top-K results.
  flashcards:
  - front: Sharding
    back: Distributing data across multiple physical machines to scale horizontally when data exceeds one machine's RAM.
  - front: Scalar Quantization (SQ)
    back: Converting 32-bit floats to 8-bit integers (int8). Provides 4x memory reduction with negligible accuracy loss.
  - front: Scatter-Gather
