      is_correct: false
    - letter: C
      text: By asking the user to manually type timestamps.
      is_correct: false
    - letter: D
      text: By measuring network packet round-trip times.
      is_correct: false
    correct_fb: ✅ Correct! Cross-attention alignment tracks which audio frames contributed most to each decoded token.
    wrong_fb: ❌ Incorrect. Whisper uses cross-attention weights and DTW alignment to match acoustic frames to generated tokens.
  flashcards:
