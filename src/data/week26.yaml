    explanation: large-v3 requires ~10GB VRAM and runs significantly slower on local consumer hardware compared to base (~1GB VRAM, 5x faster inference).
    code: "&lt;code <span class=\"kw\">class</span>=<span class=\"str\">\"language-python\"</span>&gt;<span class=\"cm\"># Verification Script for Day 187</span>\n<span class=\"kw\">def</span> <span class=\"fn\">compare_whisper_vram</span>(model=<span class=\"str\">\"large-v3\"</span>):\n    vram_map = {<span class=\"str\">\"tiny\": 0.5, \"base\": 1.0, \"small\": 2.0, \"medium\": 5.0, \"large-v3\"</span>: <span class=\"num\">10.0</span>}\n    vram = vram_map.<span class=\"fn\">get</span>(model, <span class=\"num\">1.0</span>)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Whisper Model '</span>{model}<span class=\"str\">' VRAM Footprint: {vram} GB\"</span>)\n    <span class=\"kw\">return</span> vram\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n    <span class=\"kw\">assert</span> <span class=\"fn\">compare_whisper_vram</span>(<span class=\"str\">\"large-v3\"</span>) == <span class=\"num\">10.0</span>"
