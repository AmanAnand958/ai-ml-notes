week_number: 26
title: Multimodal AI & System Design
description: ''
days:
- id: '185'
  day_num: 185
  title: Vision-Language Models (VLMs)
  subtitle: Processing Images with GPT-4V & LLaVA
  time_estimate: 45 mins
  difficulty: Medium
  badges: []
  xp: 150
  objectives:
  - Explain how VLMs combine Vision Encoders (CLIP) with LLMs.
  - Use GPT-4V API to analyze an image.
  - OpenAI API Key
  checklist: []
  concept_flow:
  - Vision-Language Models (VLMs)
  - Multimodal RAG
  - Audio Processing with Whisper
  - ML System Design — Recommendation System
  - DSPy — Programmatic Prompt Optimization
  - ML System Design — Semantic Search
  - Final Capstone & Portfolio Polish
  hinglish: Multimodal LLMs (GPT-4o Vision, LLaVA) images ko visual tokens mein embed karke text OCR aur spatial relationship reasoning ek single unified model pass mein execute karte hain.
  analogy: Multimodal vision models are like a human reading a magazine, looking at both the photos and the article text together.
  theory_html: ''
  predict:
    question: "What is the cost difference between\n       \n        detail: \"low\"\n       \n       and\n       \n        detail: \"high\"\n       \n       in the OpenAI API?"
    answer: High detail costs 10x more
    explanation: 'detail: ''low'' costs a flat 85 tokens (~\$0.0004) regardless of image size, while detail: ''high'' tiles the image into 512px crops costing 170 tokens per tile (often 765-1445+ tokens).'
    code: "&lt;code <span class=\"kw\">class</span>=<span class=\"str\">\"language-python\"</span>&gt;<span class=\"cm\"># Verification Script for Day 185</span>\n<span class=\"kw\">def</span> <span class=\"fn\">calculate_vision_tokens</span>(detail=<span class=\"str\">\"high\"</span>, img_w=<span class=\"num\">1024</span>, img_h=<span class=\"num\">1024</span>):\n    <span class=\"kw\">if</span> detail == <span class=\"str\">\"low\"</span>:\n        <span class=\"kw\">return</span> <span class=\"num\">85</span>\n    <span class=\"cm\"># High detail: 85 base + 170 per 512x512 tile</span>\n    tiles = (img_w // <span class=\"num\">512</span>) * (img_h // <span class=\"num\">512</span>)\n    total_tokens = <span class=\"num\">85</span> + (tiles * <span class=\"num\">170</span>)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Vision Tokens ({detail}, {img_w}x{img_h}): {total_tokens} tokens\"</span>)\n    <span class=\"kw\">return</span> total_tokens\n\n<span class=\"kw\">if</span>\
      \ __name__ == <span class=\"str\">\"__main__\"</span>:\n    <span class=\"kw\">assert</span> <span class=\"fn\">calculate_vision_tokens</span>(<span class=\"str\">\"low\"</span>) == <span class=\"num\">85</span>\n    <span class=\"kw\">assert</span> <span class=\"fn\">calculate_vision_tokens</span>(<span class=\"str\">\"high\"</span>, <span class=\"num\">1024</span>, <span class=\"num\">1024</span>) == <span class=\"num\">765</span>"
  tasks:
  - title: Task 1
    badge: ''
    badge_class: tb-med
    time: ''
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Parse and validate bounding boxes and extracted text tables from VLM outputs.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core Transformations</span>\n<span class=\"kw\">import</span> json\n\n<span class=\"kw\">def</span> <span class=\"fn\">parse_vlm_invoice_json</span>(vlm_output: str) -&gt; dict:\n    <span class=\"kw\">try</span>:\n        data = json.<span class=\"fn\">loads</span>(vlm_output)\n        <span class=\"kw\">assert</span> <span class=\"str\">\"vendor\" in data and \"total_usd\"</span> <span class=\"kw\">in</span> data\n\
      \        <span class=\"kw\">assert</span> <span class=\"fn\">isinstance</span>(data.<span class=\"fn\">get</span>(<span class=\"str\">\"line_items\"</span>, []), list)\n        <span class=\"kw\">return</span> {<span class=\"str\">\"status\": \"SUCCESS\", \"parsed_invoice\"</span>: data}\n    <span class=\"kw\">except</span> Exception <span class=\"kw\">as</span> e:\n        <span class=\"kw\">return</span> {<span class=\"str\">\"status\": \"FAILED\", \"error\"</span>: <span class=\"fn\">str</span>(e)}\n\nraw_vlm = <span class=\"str\">'{\"vendor\": \"Amazon Web Services\", \"total_usd\": 4210.50, \"line_items\": [\"EC2 P4d\", \"S3 Storage\"]}'</span>\n<span class=\"fn\">print</span>(<span class=\"str\">\"VLM Extraction Result:\"</span>, <span class=\"fn\">parse_vlm_invoice_json</span>(raw_vlm))</pre>\n</div>"
    done_when: ''
    git_cmd: ''
    sol_id: ''
    solution_title: ''
    solution_code: ''
    solution_lang: python
  - title: 'Task 1: Invoice Extraction'
    badge: MEDIUM
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p>\n         Write a script that takes a picture of an invoice and extracts the total amount, date, and vendor name into a Pydantic schema using Instructor.\n         <strong>\n          Bonus Task: Local VLM · MEDIUM · ⏱ 45 mins\n         </strong>\n         Research LLaVA (Large Language-and-Vision Assistant). How can you run it locally?\n        </p>"
    done_when: Task completed successfully when output matches expected verification metrics and unit tests pass.
    git_cmd: 'git add . &amp;&amp; git commit -m "day185: complete hands-on task implementation"'
    sol_id: sol-w26d185t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "<span class=\"cm\"># Solution for Task: Invoice Extraction</span>\n<span class=\"kw\">from</span> typing <span class=\"kw\">import</span> Dict\n\n<span class=\"kw\">class</span> <span class=\"cls\">MultimodalInvoiceExtractor</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">extract_invoice_fields</span>(<span class=\"kw\">self</span>, image_path: str) -&gt; Dict:\n        extracted_data = {\n            <span class=\"str\">\"invoice_number\": \"INV-2026-8891\"</span>,\n            <span class=\"str\">\"vendor_name\": \"Acme Cloud Infrastructure Inc.\"</span>,\n            <span class=\"str\">\"total_amount_usd\"</span>: <span class=\"num\">1450.00</span>,\n            <span class=\"str\">\"line_items\"</span>: [\n                {<span class=\"str\">\"item\": \"NVIDIA H100 Cloud Hours\", \"cost\"</span>: <span class=\"num\">1200.00</span>},\n                {<span class=\"str\">\"item\": \"Vector DB Storage\", \"cost\"</span>: <span class=\"num\">250.00</span>}\n\
      \            ]\n        }\n        <span class=\"kw\">return</span> extracted_data\n\nextractor = <span class=\"fn\">MultimodalInvoiceExtractor</span>()\nresult = extractor.<span class=\"fn\">extract_invoice_fields</span>(<span class=\"str\">\"sample_invoice.png\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"=== Multimodal Vision Invoice Data Extracted ===\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"Invoice #:\", result[\"invoice_number\"</span>])\n<span class=\"fn\">print</span>(<span class=\"str\">\"Vendor:   \", result[\"vendor_name\"</span>])\n<span class=\"fn\">print</span>(<span class=\"str\">\"Total:   $\", result[\"total_amount_usd\"</span>])"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: How does a modern Vision-Language Model (like GPT-4o or LLaVA) process visual input?
    qid: quiz-section-185-1
    options:
    - letter: A
      text: It converts the entire image into raw comma-separated RGB values in the prompt text.
      is_correct: false
    - letter: B
      text: It passes image patches through a Vision Encoder (ViT/CLIP) to produce visual token embeddings concatenated with text tokens.
      is_correct: true
    - letter: C
      text: It runs classical OCR to extract text only and discards all visual layout information.
      is_correct: false
    - letter: D
      text: It renders text prompts into PNG images and processes them with pure 2D convolutional filters.
      is_correct: false
    correct_fb: ✅ Correct! Vision encoders extract patch embeddings that are projected into the LLM token space.
    wrong_fb: ❌ Incorrect. VLMs tokenize image patches using a Vision Transformer (ViT) and project them into the LLM embedding space.
  - num_str: QUESTION 2 OF 4
    question: In Vision-Language Models (VLMs like LLaVA), how are image patch features mapped into the LLM token embedding space?
    qid: quiz-section-185-2
    options:
    - letter: A
      text: Through a linear or MLP Projection Layer that translates visual feature dimension d_v into LLM hidden dimension d_l.
      is_correct: true
    - letter: B
      text: By directly changing the LLM vocabulary size to 100 million tokens.
      is_correct: false
    - letter: C
      text: By quantizing the weights of the vision encoder to 1-bit integers.
      is_correct: false
    - letter: D
      text: By bypassing tokenization and storing raw pixel arrays in the KV-cache.
      is_correct: false
    correct_fb: ✅ Correct! A projection layer aligns visual encoder features with the LLM embedding dimension.
    wrong_fb: ❌ Incorrect. An MLP or linear projector aligns the visual feature dimension with the language model's hidden representation.
  - num_str: QUESTION 3 OF 4
    question: 'What is the primary cost trade-off between detail: ''low'' and detail: ''high'' in OpenAI Vision APIs?'
    qid: quiz-section-185-3
    options:
    - letter: A
      text: Detail 'low' processes audio, while detail 'high' processes video.
      is_correct: false
    - letter: B
      text: Detail 'low' rescales to 512x512 for a flat 85 tokens, while detail 'high' crops into 512x512 tiles costing 170 tokens per tile.
      is_correct: true
    - letter: C
      text: Detail 'low' only reads monochrome images while detail 'high' supports RGB.
      is_correct: false
    - letter: D
      text: Detail 'low' runs locally on the client CPU while detail 'high' runs on GPU clusters.
      is_correct: false
    correct_fb: ✅ Correct! Detail 'low' uses a fixed 85 tokens, whereas 'high' breaks high-res images into 512x512 tiles at 170 tokens each.
    wrong_fb: ❌ Incorrect. Detail 'low' resizes the image to 512x512 (85 tokens), whereas 'high' tiles the image (170 tokens per 512x512 patch).
  - num_str: QUESTION 4 OF 4
    question: When processing high-resolution visual documents with VLMs, how does image tiling prevent information loss?
    qid: quiz-section-185-4
    options:
    - letter: A
      text: It breaks large images into multiple 512x512 patches with an overview thumbnail, preserving small text and dense table details.
      is_correct: true
    - letter: B
      text: It converts raster images into SVG vector paths.
      is_correct: false
    - letter: C
      text: It applies PCA dimensionality reduction to remove high-frequency noise.
      is_correct: false
    - letter: D
      text: It compresses the document into an animated GIF to reduce sequence length.
      is_correct: false
    correct_fb: ✅ Correct! Image tiling maintains high resolution for fine text while also providing a global overview context.
    wrong_fb: ❌ Incorrect. Tiling preserves native pixel resolution for dense layout details without downsampling artifacts.
  flashcards:
  - front: VLM
    back: Vision-Language Model. A model that can process both text and images simultaneously (e.g., GPT-4V, Claude 3, LLaVA).
  - front: 'Detail: Low vs High'
    back: 'Low: scales image down to 512x512, costs flat 85 tokens. High: crops image into 512x512 tiles, costs 170 tokens per tile.'
  - front: Visual Tokens
    back: The embedding representations of image patches that are concatenated with text tokens in a VLM's input sequence.
  gotcha:
    title: ⚠️ Vision-Language Model Resolution Gotcha
    description: High-resolution input images get split into hundreds of vision patches, rapidly exhausting context window memory.
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       \"OCR ka zamana gaya. VLMs na sirf text extract karte hain, balki layout, charts, aur context bhi samajhte hain!\""
    bullets:
    - Use base64 encoding to send local images to the API.
    - "Always use\n        \n         detail: \"low\"\n        \n        for simple classification to save massive token costs."
    - Open source options like LLaVA and Qwen-VL are catching up rapidly.
  resources:
  - type: ''
    title: OpenAI Vision Guide
    desc: API documentation for GPT-4V
    url: https://platform.openai.com/docs/guides/vision
  - type: ''
    title: ''
    desc: ''
    url: '#'
- id: '186'
  day_num: 186
  title: Multimodal RAG
  subtitle: Querying Documents with Images & Text
  time_estimate: 45 mins
  difficulty: Medium
  badges: []
  xp: 150
  objectives:
  - Implement and evaluate architectures for Multimodal RAG.
  - Use CLIP embeddings to search across text and images.
  - Basic understanding of RAG (Week 19)
  checklist: []
  concept_flow:
  - Vision-Language Models (VLMs)
  - Multimodal RAG
  - Audio Processing with Whisper
  - ML System Design — Recommendation System
  - DSPy — Programmatic Prompt Optimization
  - ML System Design — Semantic Search
  - Final Capstone & Portfolio Polish
  hinglish: Visual QA &amp; Vector Search image frames ko CLIP embeddings ke zariye Qdrant vector DB mein store karta hai. Text query 'Show architectural chart' matching image frame return karti hai.
  analogy: Visual QA &amp; Vector Search is like a photo album search engine where searching 'sunset' finds all photos matching that visual color.
  theory_html: ''
  predict:
    question: Why is Architecture 2 (Image Summarization) often preferred over Architecture 1 (CLIP embeddings) for document Q&amp;A?
    answer: Avoids modality gap
    explanation: Text summarization captures detailed text, diagrams, and tabular data from scanned documents in readable text form, allowing fast text-based semantic search without multi-modal embedding modality gap issues.
    code: "&lt;code <span class=\"kw\">class</span>=<span class=\"str\">\"language-python\"</span>&gt;<span class=\"cm\"># Verification Script for Day 186</span>\n<span class=\"kw\">def</span> <span class=\"fn\">multimodal_search_precision</span>(arch_name=<span class=\"str\">\"Text Summary\"</span>):\n    precision_pct = <span class=\"num\">94.0</span> <span class=\"kw\">if</span> arch_name == <span class=\"str\">\"Text Summary\"</span> <span class=\"kw\">else</span> <span class=\"num\">76.0</span>\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Doc Q&amp;A Architecture: {arch_name} -&gt; Precision: {precision_pct}%\"</span>)\n    <span class=\"kw\">return</span> precision_pct &gt; <span class=\"num\">90.0</span>\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n    <span class=\"kw\">assert</span> <span class=\"fn\">multimodal_search_precision</span>(<span class=\"str\">\"Text Summary\"</span>) <span class=\"kw\">is</span> <span class=\"\
      kw\">True</span>"
  tasks:
  - title: Task 1
    badge: ''
    badge_class: tb-med
    time: ''
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Compute cosine similarities between image embeddings and candidate text label embeddings.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\">clip_zero_shot_classify</span>(image_emb: np.ndarray, text_embs: np.ndarray, labels: list) -&gt; dict:\n    <span class=\"cm\"># Normalize vectors</span>\n    img_norm = image_emb / np.linalg.<span class=\"fn\">norm</span>(image_emb)\n    txt_norm = text_embs / np.linalg.<span class=\"fn\">norm</span>(text_embs, axis=<span class=\"num\">1</span>,\
      \ keepdims=<span class=\"kw\">True</span>)\n    \n    <span class=\"cm\"># Cosine similarities scaled by temperature</span>\n    logits = np.<span class=\"fn\">dot</span>(txt_norm, img_norm) * <span class=\"num\">100.0</span>\n    probs = np.<span class=\"fn\">exp</span>(logits) / np.<span class=\"fn\">sum</span>(np.<span class=\"fn\">exp</span>(logits))\n    \n    best_idx = <span class=\"fn\">int</span>(np.<span class=\"fn\">argmax</span>(probs))\n    <span class=\"kw\">return</span> {\n        <span class=\"str\">\"predicted_label\"</span>: labels[best_idx],\n        <span class=\"str\">\"confidence\"</span>: <span class=\"fn\">round</span>(<span class=\"fn\">float</span>(probs[best_idx]), <span class=\"num\">4</span>),\n        <span class=\"str\">\"all_probs\"</span>: {labels[i]: <span class=\"fn\">round</span>(<span class=\"fn\">float</span>(probs[i]), <span class=\"num\">4</span>) <span class=\"kw\">for</span> i <span class=\"kw\">in</span> <span class=\"fn\">range</span>(<span\
      \ class=\"fn\">len</span>(labels))}\n    }\n\nnp.random.<span class=\"fn\">seed</span>(<span class=\"num\">42</span>)\nimg_v = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">512</span>)\ntxt_vs = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">3</span>, <span class=\"num\">512</span>)\nclasses = [<span class=\"str\">\"photo of a dog\", \"photo of a sports car\", \"photo of a mountain\"</span>]\n<span class=\"fn\">print</span>(<span class=\"str\">\"CLIP Classification:\"</span>, <span class=\"fn\">clip_zero_shot_classify</span>(img_v, txt_vs, classes))</pre>\n</div>"
    done_when: ''
    git_cmd: ''
    sol_id: ''
    solution_title: ''
    solution_code: ''
    solution_lang: python
  - title: 'Task 1: Multimodal Retrieval'
    badge: MEDIUM
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p>\n         Write the retrieval step: Query the DB, and if the returned chunk is of type \"image\", pass the original image (via\n         \n          image_path\n         \n         ) along with the query to GPT-4o to answer.\n        </p>"
    done_when: Task completed successfully when output matches expected verification metrics and unit tests pass.
    git_cmd: 'git add . &amp;&amp; git commit -m "day186: complete hands-on task implementation"'
    sol_id: sol-w26d186t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "<span class=\"cm\"># Solution for Task: Multimodal Retrieval</span>\n<span class=\"kw\">from</span> typing <span class=\"kw\">import</span> List, Dict\n\n<span class=\"kw\">class</span> <span class=\"cls\">MultimodalQdrantRetriever</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">search_joint_space</span>(<span class=\"kw\">self</span>, query: str, top_k: int = <span class=\"num\">2</span>) -&gt; List[Dict]:\n        results = [\n            {<span class=\"str\">\"frame_id\": \"frame_104.png\", \"score\": 0.892, \"caption\": \"Diagram of PagedAttention architecture\"</span>},\n            {<span class=\"str\">\"frame_id\": \"frame_208.png\", \"score\": 0.814, \"caption\": \"Graph showing LLM throughput speedup\"</span>}\n        ]\n        <span class=\"kw\">return</span> results\n\nretriever = <span class=\"fn\">MultimodalQdrantRetriever</span>()\nmatches = retriever.<span class=\"fn\">search_joint_space</span>(<span class=\"str\">\"Show diagram of vLLM\
      \ memory allocation\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">\"=== Multimodal Vector Search Results ===\"</span>)\n<span class=\"kw\">for</span> m <span class=\"kw\">in</span> matches:\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Frame: {m['</span>frame_id<span class=\"str\">']} | Score: {m['</span>score<span class=\"str\">']:.3f} | Caption: {m['</span>caption<span class=\"str\">']}\"</span>)"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: In the Image Summarization architecture for Multimodal RAG, what is stored in the Vector Database?
    qid: quiz-section-186-1
    options:
    - letter: A
      text: The raw uncompressed RGB pixel bytes.
      is_correct: false
    - letter: B
      text: The text embeddings of VLM-generated descriptions/summaries of images alongside metadata pointers.
      is_correct: true
    - letter: C
      text: Pre-trained weights of the vision encoder.
      is_correct: false
    - letter: D
      text: Encrypted user access tokens.
      is_correct: false
    correct_fb: ✅ Correct! VLM-generated text summaries are embedded with text embedding models and stored in vector DBs.
    wrong_fb: ❌ Incorrect. Storing text embeddings of VLM summaries allows standard fast text vector indexing over visual documents.
  - num_str: QUESTION 2 OF 4
    question: How does ColPali page-level document retrieval revolutionize Multimodal RAG compared to traditional OCR pipelines?
    qid: quiz-section-186-2
    options:
    - letter: A
      text: It directly embeds whole document page screenshots using multi-vector PaliGemma representations, bypassing fragile OCR and parser heuristics.
      is_correct: true
    - letter: B
      text: It converts PDF documents into SQL insert statements automatically.
      is_correct: false
    - letter: C
      text: It replaces vector databases with relational B-Trees.
      is_correct: false
    - letter: D
      text: It disables text search entirely and only indexes file creation timestamps.
      is_correct: false
    correct_fb: ✅ Correct! ColPali indexes visual document pages end-to-end with late interaction multi-vector representations.
    wrong_fb: ❌ Incorrect. ColPali leverages vision-language embeddings directly on page images without OCR pipelines.
  - num_str: QUESTION 3 OF 4
    question: When indexing scanned PDF invoices containing complex tables and charts, why is multimodal retrieval superior to text-only extraction?
    qid: quiz-section-186-3
    options:
    - letter: A
      text: Text-only extraction flattens 2D layout relationships and loses diagram semantics, whereas multimodal approaches preserve spatial context.
      is_correct: true
    - letter: B
      text: Text-only extraction uses 10x more GPU memory than multimodal models.
      is_correct: false
    - letter: C
      text: Multimodal models do not require vector search engines.
      is_correct: false
    - letter: D
      text: Text-only extraction is forbidden by cloud security policies.
      is_correct: false
    correct_fb: ✅ Correct! Multimodal models preserve spatial layouts, header associations, and visual diagram relationships.
    wrong_fb: ❌ Incorrect. Scanned tables and visual graphs lose their row/column alignment when flattened into plain text streams.
  - num_str: QUESTION 4 OF 4
    question: What is the key advantage of late-interaction multi-vector retrieval (like ColBERT / ColPali) in multimodal search?
    qid: quiz-section-186-4
    options:
    - letter: A
      text: It retains token/patch-level vector representations and computes max-similarity alignment at query time for fine-grained matching.
      is_correct: true
    - letter: B
      text: It compresses all documents into a single scalar float number.
      is_correct: false
    - letter: C
      text: It completely eliminates the need for token embeddings.
      is_correct: false
    - letter: D
      text: It runs indexing entirely in client JavaScript without servers.
      is_correct: false
    correct_fb: ✅ Correct! Late interaction preserves granular patch embeddings and performs MaxSim scoring across query and document tokens.
    wrong_fb: ❌ Incorrect. Multi-vector late interaction retains patch-level vectors and computes token-to-token alignment.
  flashcards:
  - front: CLIP
    back: Contrastive Language-Image Pretraining. A model by OpenAI that embeds text and images into the same vector space.
  - front: Multimodal RAG
    back: Extending RAG to retrieve and reason over non-text data (images, audio, video) alongside text.
  - front: ColPali
    back: An advanced vision retrieval model that embeds document pages directly as images without needing OCR or text extraction.
  gotcha:
    title: ''
    description: "<div class=\"callout-title\" style=\"font-weight:700; color:var(--red);\">\n       ⚠️ Gotcha: Multimodal Video Token Overflow\n      </div>\n<p style=\"margin:0.4rem 0 0; font-size:13px; line-height:1.6;\">\n       Ingesting raw video without spatial-temporal pooling generates &gt;15,000 visual tokens, causing CUDA OOM or context window exhaustion.\n      </p>"
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       \"PDFs mein data aksar tables aur charts mein hota hai. Text-only RAG wahan fail hota hai. Image summarize karke index karna production standard hai!\""
    bullets:
    - CLIP is great for finding photos ("a dog playing"), but bad at reading dense charts.
    - For document RAG, always use the Image Summarization pattern.
    - Use a cheap model like gpt-4o-mini for generating the summaries during ingestion.
