    correct_fb: ✅ Correct! Whisper computes 80/128-channel Log-Mel spectrograms from 16 kHz mono audio in 30s windows.
    wrong_fb: ❌ Incorrect. Whisper processes 16 kHz mono audio converted into Log-Mel filterbank spectrograms.
  - num_str: QUESTION 2 OF 4
    question: In OpenAI Whisper speech-to-text processing, what acoustic representation is fed into the Transformer encoder?
    qid: quiz-section-187-2
    options:
    - letter: A
      text: A 2D time-frequency Log-Mel Spectrogram matrix passed through 1D convolutional downsampling layers.
      is_correct: true
    - letter: B
      text: A 1D array of phoneme dictionary integers.
