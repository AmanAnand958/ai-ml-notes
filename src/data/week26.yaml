  content_html: "<div class=\"toolkit-grid\" style=\"display:grid; grid-template-columns:repeat(auto-fit,\
    \ minmax(300px, 1fr)); gap:1.5rem; margin:1.5rem 0;\">\n  <div class=\"toolkit-card\"\
    \ style=\"background:var(--bg2); border:1px solid var(--border); padding:1.25rem;\
    \ border-radius:8px;\">\n    <h3 style=\"color:var(--accent); margin-top:0;\"\
    >\U0001F3DB️ Principal ML System Design Framework</h3>\n    <ul style=\"line-height:1.7;\
    \ padding-left:1.2rem; color:var(--text);\">\n      <li><strong>1. Scope & Requirements:</strong>\
    \ Scale (100M users, 50k QPS), Latency SLA (p99 &lt; 50ms), Freshness.</li>\n\
    \      <li><strong>2. Candidate Generation:</strong> Fast dual-tower embedding\
    \ retrieval (100M -> 1000 items).</li>\n      <li><strong>3. Heavy Ranking:</strong>\
    \ DeepFM / DLRM multi-task prediction (1000 -> 50 items).</li>\n      <li><strong>4.\
    \ Re-ranking:</strong> Business logic, diversity, deduplication, content safety\
    \ (50 -> 10 items).</li>\n      <li><strong>5. Telemetry & Feedback:</strong>\
    \ Click-through rate (CTR), conversion, online continuous training.</li>\n   \
    \ </ul>\n  </div>\n  <div class=\"toolkit-card\" style=\"background:var(--bg2);\
    \ border:1px solid var(--border); padding:1.25rem; border-radius:8px;\">\n   \
    \ <h3 style=\"color:var(--accent); margin-top:0;\">\U0001F9E0 DSPy & Multimodal\
    \ Cheatsheet</h3>\n    <ul style=\"line-height:1.7; padding-left:1.2rem; color:var(--text);\"\
    >\n      <li><strong>CLIP Vision Tokenizer:</strong> $N_{patches} = \\frac{H \\\
    cdot W}{P^2}$ (336x336 with 14x14 = 576 tokens).</li>\n      <li><strong>Whisper\
    \ Audio ASR:</strong> 80-channel log-Mel spectrogram audio encoding at 16kHz.</li>\n\
    \      <li><strong>DSPy MIPRO:</strong> Automated joint prompt-instruction and\
    \ few-shot demonstration optimization.</li>\n      <li><strong>ColPali Multi-Vector\
    \ RAG:</strong> Late-interaction token embeddings on document screenshots.</li>\n\
    \    </ul>\n  </div>\n</div>"
