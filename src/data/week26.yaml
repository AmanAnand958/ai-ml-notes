- id: '188'
  day_num: 188
  title: ML System Design — Recommendation System
  subtitle: 'Interview Prep: Two-Tower Models'
  time_estimate: 45 mins
  difficulty: Medium
  badges: []
  xp: 150
  objectives:
  - Implement and evaluate the Two-Stage Recommendation Architecture.
  - Construct and apply the Two-Tower Neural Network design.
  - Basic understanding of Vector Databases
  checklist: []
  concept_flow:
  - Vision-Language Models (VLMs)
  - Multimodal RAG
  - Audio Processing with Whisper
  - ML System Design — Recommendation System
  - DSPy — Programmatic Prompt Optimization
  - ML System Design — Semantic Search
  - Final Capstone & Portfolio Polish
  hinglish: DSPy Prompt Optimization manual prompt engineering ke bajaye declarative signatures use karta hai. Teleprompters automatically few-shot examples aur instructions optimize karte hain.
  analogy: DSPy prompt optimization is like an automated compiler tuning C++ code assembly instructions for peak performance.
  theory_html: ''
  predict:
    question: Why can't we use the heavy Ranking model directly on all 10 million items?
    answer: O(N) search latency
    explanation: Running heavy ranking transformers on 10 million items for every query is computationally impossible in real-time. We use Two-Tower models for fast top-100 candidate retrieval, and heavy ranking only on those 100 items.
    code: "&lt;code <span class=\"kw\">class</span>=<span class=\"str\">\"language-python\"</span>&gt;<span class=\"cm\"># Verification Script for Day 188</span>\n<span class=\"kw\">def</span> <span class=\"fn\">recsys_two_stage_latency</span>(n_candidates=<span class=\"num\">10000000</span>, two_tower_top_k=<span class=\"num\">100</span>):\n    two_tower_ms = <span class=\"num\">8.0</span> <span class=\"cm\"># ANN vector lookup</span>\n    ranking_model_ms = two_tower_top_k * <span class=\"num\">0.4</span> <span class=\"cm\"># 40ms on 100 candidates</span>\n    total_ms = two_tower_ms + ranking_model_ms\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"2-Stage RecSys Latency: {total_ms:.1f}ms for {n_candidates:,} candidates\"</span>)\n    <span class=\"kw\">return</span> total_ms &lt; <span class=\"num\">50.0</span>\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n    <span class=\"kw\">assert</span> <span class=\"fn\">recsys_two_stage_latency</span>()\
      \ <span class=\"kw\">is</span> <span class=\"kw\">True</span>"
  tasks:
  - title: Task 1
    badge: ''
    badge_class: tb-med
    time: ''
    prompt_html: "<p style=\"margin-top:0; color:var(--muted); font-size:13.5px;\">\n        Extract 80-channel log-Mel spectrogram features from raw 16kHz audio waveforms.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\">extract_log_mel_spectrogram</span>(audio_waveform: np.ndarray, num_mels: int = <span class=\"num\">80</span>) -&gt; np.ndarray:\n    <span class=\"cm\"># Simulated STFT + Mel Filterbank</span>\n    n_frames = <span class=\"fn\">len</span>(audio_waveform) // <span class=\"num\">160</span>\n    mel_spec = np.random.<span class=\"fn\">randn</span>(num_mels,\
      \ n_frames)\n    <span class=\"cm\"># Log compression</span>\n    <span class=\"kw\">return</span> np.<span class=\"fn\">log</span>(np.<span class=\"fn\">maximum</span>(<span class=\"num\">1e-5</span>, np.<span class=\"fn\">abs</span>(mel_spec)))\n\naudio_1s = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">16000</span>) <span class=\"cm\"># 1 second of 16kHz audio</span>\nmel = <span class=\"fn\">extract_log_mel_spectrogram</span>(audio_1s)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Whisper Mel-Spectrogram Shape: {mel.shape} (80 channels x {mel.shape[1]} time frames)\"</span>)</pre>\n</div>"
    done_when: ''
    git_cmd: ''
    sol_id: ''
    solution_title: ''
    solution_code: ''
    solution_lang: python
  - title: 'Task 1: Draw the Architecture'
    badge: MEDIUM
    badge_class: tb-med
    time: 45 mins
    prompt_html: "<p>\n         On a piece of paper, draw the end-to-end architecture including the offline training pipeline, the vector database, the user tower, and the ranking model.\n        </p>"
    done_when: Task completed successfully when output matches expected verification metrics and unit tests pass.
    git_cmd: 'git add . &amp;&amp; git commit -m "day188: complete hands-on task implementation"'
    sol_id: sol-w26d188t1
    solution_title: ✅ COMPLETE SOLUTION — task_1_solution.py
    solution_code: "<span class=\"cm\"># Solution for Task: Draw the Architecture</span>\n<span class=\"kw\">class</span> <span class=\"cls\">ArchitecturalRFCSpecification</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">generate_rfc_document</span>(<span class=\"kw\">self</span>) -&gt; str:\n        rfc = <span class=\"str\">\"\"\"</span>\n<span class=\"cm\"># System RFC: End-to-End Multimodal AI Enterprise Platform</span>\n- Ingress Gateway: LiteLLM Proxy + Rate Limiter\n- Vector Engine: Qdrant Multimodal Index\n- Serving Layer: vLLM Cluster <span class=\"kw\">with</span> PagedAttention\n- Monitoring: Prometheus + Evidently AI Drift Detection\n<span class=\"str\">\"\"\"</span>\n        <span class=\"kw\">return</span> rfc.<span class=\"fn\">strip</span>()\n\nspec = <span class=\"fn\">ArchitecturalRFCSpecification</span>()\n<span class=\"fn\">print</span>(<span class=\"str\">\"=== System RFC Specification Generated ===\"</span>)\n<span class=\"fn\">print</span>(spec.<span class=\"\
      fn\">generate_rfc_document</span>()[:<span class=\"num\">150</span>] + <span class=\"str\">\"...\"</span>)"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: In enterprise recommendation system design (e.g. YouTube/Netflix), why is a Two-Stage (Candidate Generation + Ranking) architecture used?
    qid: quiz-section-188-1
    options:
    - letter: A
      text: Because single-stage models are not supported on Linux operating systems.
      is_correct: false
    - letter: B
      text: Candidate generation efficiently filters millions of items to ~1,000 using fast ANN search, allowing heavy ranking models to score the top candidates within latency SLAs.
      is_correct: true
    - letter: C
      text: Because neural networks cannot process more than 100 items at a time.
      is_correct: false
    - letter: D
      text: To duplicate database queries across multiple availability zones.
      is_correct: false
    correct_fb: ✅ Correct! Fast vector retrieval narrows 10M+ items to 1000, which are then precision-ranked with deep feature cross models.
    wrong_fb: ❌ Incorrect. Scoring 10M items with a deep neural network would exceed real-time 50ms latency budgets.
  - num_str: QUESTION 2 OF 4
    question: In large-scale recommender system design, what is the 'Two-Tower' (User Tower + Item Tower) DSSM architecture?
    qid: quiz-section-188-2
    options:
    - letter: A
      text: Separate neural networks compute user embeddings and item embeddings independently, enabling real-time dot-product / cosine scoring over pre-computed item indices.
      is_correct: true
    - letter: B
      text: A backup server architecture with two physical data center towers.
      is_correct: false
    - letter: C
      text: A dual-GPU setup where one GPU trains and the second GPU validates.
      is_correct: false
    - letter: D
      text: An ensemble of two random forest classifiers.
      is_correct: false
    correct_fb: ✅ Correct! User and Item towers map features into a shared embedding space for O(1) ANN vector search.
    wrong_fb: ❌ Incorrect. Two-tower models isolate query features and candidate features into decoupled embedding spaces.
  - num_str: QUESTION 3 OF 4
    question: Why can item embeddings in a Two-Tower model be pre-computed offline, while user embeddings must often be computed online?
    qid: quiz-section-188-3
    options:
    - letter: A
      text: Item catalog attributes update infrequently and can be indexed in Vector DBs, whereas user state depends on immediate real-time session context.
      is_correct: true
    - letter: B
      text: Item vectors are always smaller in dimension than user vectors.
      is_correct: false
    - letter: C
      text: Item vectors use floating-point numbers while user vectors use strings.
      is_correct: false
    - letter: D
      text: Offline computation is only allowed on candidate models.
      is_correct: false
    correct_fb: ✅ Correct! Static item embeddings are indexed offline, while dynamic user embeddings are computed at query time.
    wrong_fb: ❌ Incorrect. Items change slowly so their embeddings can be indexed in Milvus/Faiss offline, but user session intent is real-time.
  - num_str: QUESTION 4 OF 4
    question: What loss function is standard for training Two-Tower retrieval models with in-batch negatives?
    qid: quiz-section-188-4
    options:
    - letter: A
      text: Sampled Softmax or InfoNCE / Cross-Entropy Loss where other items in the mini-batch serve as negative candidates.
      is_correct: true
    - letter: B
      text: Mean Squared Error (MSE) on user ID strings.
      is_correct: false
    - letter: C
      text: L1 Absolute Error on catalog timestamps.
      is_correct: false
    - letter: D
      text: Categorical Hinge Loss with zero temperature.
      is_correct: false
    correct_fb: ✅ Correct! In-batch negative InfoNCE loss treats batch items as negatives, scaling training efficiency without explicit negative sampling.
    wrong_fb: ❌ Incorrect. Sampled Softmax / InfoNCE with in-batch negatives is standard for dual-encoder retrieval systems.
  flashcards:
  - front: Candidate Generation
    back: 'Stage 1: A fast, lightweight method (like Vector Search) to narrow millions of items down to ~1000 relevant candidates.'
  - front: Ranking
    back: 'Stage 2: A heavier model (XGBoost) that scores the 1000 candidates precisely to select the final Top 10.'
  - front: Two-Tower Model
    back: Neural net architecture where User and Item features are processed independently into embeddings. Fast retrieval via dot product.
  gotcha:
    title: ''
    description: "<div class=\"callout-title\" style=\"font-weight:700; color:var(--red);\">\n       ⚠️ Gotcha: RecSys Popularity Bias &amp; Feedback Loops\n      </div>\n<p style=\"margin:0.4rem 0 0; font-size:13px; line-height:1.6;\">\n       Training candidate ranking models purely on user clicks creates severe popularity bias and feedback loops. Enforce exploration bandits (ε-greedy or Thompson Sampling) on 5% of traffic.\n      </p>"
  takeaways:
    hinglish_line: "<strong>\n        Ek line mein:\n       </strong>\n       \"System design is all about trade-offs. You trade off precision in Candidate Generation for latency, and trade latency in Ranking for precision!\""
    bullets:
    - 'Always structure rec-sys interviews in two stages: Gen and Rank.'
    - Mention FAISS/Pinecone for the generation stage.
    - Mention Cold Start problem (how to recommend to new users/items).
  resources:
  - type: ''
    title: Google ML Course
    desc: Two-Tower Models
    url: https://developers.google.com/machine-learning/recommendation
  - type: ''
    title: ''
    desc: ''
    url: '#'
