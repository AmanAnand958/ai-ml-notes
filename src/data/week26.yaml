  - ML System Design — Recommendation System
  - DSPy — Programmatic Prompt Optimization
  - ML System Design — Semantic Search
  - Final Capstone & Portfolio Polish
  hinglish: System RFC Architecture Document enterprise engineering team ke liye clear specification defining ingress latency, VRAM budgets, fallback mechanisms, aur failover SLAs publish karta hai.
  analogy: Architectural RFCs are like blueprint construction plans approved by structural engineers before breaking ground on a building.
  theory_html: ''
  predict:
    question: If you switch from GPT-4 to Llama-3, do you need to manually rewrite all your prompts in DSPy?
    answer: No manual rewrites
    explanation: No. DSPy separates program logic from prompt weights; you simply change the LM configuration (dspy.settings.configure(lm=llama3)) and re-compile to automatically optimize prompts for the new model.
    code: "&lt;code <span class=\"kw\">class</span>=<span class=\"str\">\"language-python\"</span>&gt;<span class=\"cm\"># Verification Script for Day 189</span>\n<span class=\"kw\">def</span> <span class=\"fn\">dspy_prompt_compilation</span>(target_model=<span class=\"str\">\"llama-3-8b\"</span>):\n    compiled_prompt = <span class=\"str\">f\"Auto-compiled few-shot prompt optimized for {target_model} instruction format\"</span>\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"DSPy Pipeline: {compiled_prompt}\"</span>)\n    <span class=\"kw\">return</span> <span class=\"str\">\"optimized\"</span> <span class=\"kw\">in</span> compiled_prompt\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n    <span class=\"kw\">assert</span> <span class=\"fn\">dspy_prompt_compilation</span>(<span class=\"str\">\"llama-3-8b\"</span>) <span class=\"kw\">is</span> <span class=\"kw\">True</span>"
  tasks:
  - title: Task 1
    badge: ''
