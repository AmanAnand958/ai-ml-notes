    question: If you use int8 quantization instead of float32, how much RAM does a 1536-d vector take?
    answer: 1536 bytes
    explanation: 1,536 bytes (1.5 KB) in INT8 (1 byte per dimension), compared to 6,144 bytes (6 KB) in FLOAT32 (4 bytes per dimension) — a 75% RAM savings.
    code: "&lt;code <span class=\"kw\">class</span>=<span class=\"str\">\"language-python\"</span>&gt;<span class=\"cm\"># Verification Script for Day 190</span>\n<span class=\"kw\">def</span> <span class=\"fn\">compute_vector_memory</span>(dim=<span class=\"num\">1536</span>, dtype=<span class=\"str\">\"int8\"</span>):\n    bytes_per_dim = <span class=\"num\">1</span> <span class=\"kw\">if</span> dtype == <span class=\"str\">\"int8\"</span> <span class=\"kw\">else</span> <span class=\"num\">4</span>\n    total_bytes = dim * bytes_per_dim\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"{dim}-d Vector in {dtype}: {total_bytes} bytes ({total_bytes/1024:.2f} KB)\"</span>)\n    <span class=\"kw\">return</span> total_bytes\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">\"__main__\"</span>:\n    <span class=\"kw\">assert</span> <span class=\"fn\">compute_vector_memory</span>(<span class=\"num\">1536</span>, <span class=\"str\">\"int8\"</span>) == <span class=\"num\"\
      >1536</span>\n    <span class=\"kw\">assert</span> <span class=\"fn\">compute_vector_memory</span>(<span class=\"num\">1536</span>, <span class=\"str\">\"float32\"</span>) == <span class=\"num\">6144</span>"
