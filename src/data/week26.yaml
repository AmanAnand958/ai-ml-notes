      text: The query is scattered across N index shards in parallel, and a coordinator gathers top-K candidates from each
        shard ...
      is_correct: true
      id: a
    - letter: B
      text: Every query is routed to only one random shard and results are returned directly without merging.
      is_correct: false
      id: b
    - letter: C
      text: Sharding duplicates the entire database on every single CPU core.
      is_correct: false
      id: c
    - letter: D
      text: Sharding disables vector compression to maximize accuracy.
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Scatter-gather queries vector shards concurrently and aggregates top candidates at the API gateway
      layer.
    wrong_fb: ❌ Incorrect. Scatter-gather broadcasts search queries to independent shards and merges the top-K results.
    correct: a
  flashcards:
  - front: 'Core concept: What is the significance of Sharding in ML System Design — Semantic Search?'
    back: Distributing data across multiple physical machines to scale horizontally when data exceeds one machine's RAM.
  - front: Scalar Quantization (SQ)?
    back: Converting 32-bit floats to 8-bit integers (int8). Provides 4x memory reduction with negligible accuracy loss.
  - front: 'Core concept: What is the significance of Scatter-Gather in ML System Design — Semantic Search?'
    back: 'Search pattern for sharded DBs: send query to all shards concurrently, collect local Top-K results, merge and sort
      globally.'
  - front: How is ML System Design — Semantic Search tested and validated in industrial ML pipelines (Day 190)?
    back: Automated pytest suites assert strict tensor shape invariants, numerical tolerances (np.allclose at 1e-5), and unit
      tests checking for data leakage.
  - front: 'Senior Interview Deep Dive: What trade-off occurs when scaling ML System Design — Semantic Search in distributed
      systems?'
    back: Trade-off balances inter-node communication latency vs compute saturation, resolved using overlap of computation
      and communication (ZeRO / DDP Ring-AllReduce).
  gotcha:
    title: '⚠️ Gotcha: Shard Hot-Spotting in Distributed Vector Clusters'
    description: Partitioning vector shards based on user IDs or timestamps causes severe traffic skew where hot shards crash
      under load. Use consistent hashing or spherical k-means clustering to balance vector distributions evenly across cluster
      nodes.
  takeaways:
    hinglish_line: |-
      <strong>
              Ek line mein:
             </strong>
             "Vector DBs memory-bound hote hain. Compression (PQ/SQ) aur Sharding ke bina millions of vectors scale nahi hote."
