      \ class=\"cb-lang\">\n          python\n         </span>\n<div class=\"cb-btns\"\
      >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n           copy\n\
      \          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\">\n\
      \           Run\n          </button>\n</div>\n</div>\n<pre><span class=\"kw\"\
      >import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span>\
      \ <span class=\"fn\">clip_zero_shot_classify</span>(image_emb: np.ndarray, text_embs:\
      \ np.ndarray, labels: list) -&gt; dict:\n    <span class=\"cm\"># Normalize\
      \ vectors</span>\n    img_norm = image_emb / np.linalg.<span class=\"fn\">norm</span>(image_emb)\n\
      \    txt_norm = text_embs / np.linalg.<span class=\"fn\">norm</span>(text_embs,\
      \ axis=<span class=\"num\">1</span>, keepdims=<span class=\"kw\">True</span>)\n\
      \    \n    <span class=\"cm\"># Cosine similarities scaled by temperature</span>\n\
      \    logits = np.<span class=\"fn\">dot</span>(txt_norm, img_norm) * <span class=\"\
      num\">100.0</span>\n    probs = np.<span class=\"fn\">exp</span>(logits) / np.<span\
      \ class=\"fn\">sum</span>(np.<span class=\"fn\">exp</span>(logits))\n    \n\
      \    best_idx = <span class=\"fn\">int</span>(np.<span class=\"fn\">argmax</span>(probs))\n\
      \    <span class=\"kw\">return</span> {\n        <span class=\"str\">\"predicted_label\"\
      </span>: labels[best_idx],\n        <span class=\"str\">\"confidence\"</span>:\
      \ <span class=\"fn\">round</span>(<span class=\"fn\">float</span>(probs[best_idx]),\
      \ <span class=\"num\">4</span>),\n        <span class=\"str\">\"all_probs\"\
      </span>: {labels[i]: <span class=\"fn\">round</span>(<span class=\"fn\">float</span>(probs[i]),\
      \ <span class=\"num\">4</span>) <span class=\"kw\">for</span> i <span class=\"\
      kw\">in</span> <span class=\"fn\">range</span>(<span class=\"fn\">len</span>(labels))}\n\
      \    }\n\nnp.random.<span class=\"fn\">seed</span>(<span class=\"num\">42</span>)\n\
      img_v = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">512</span>)\n\
      txt_vs = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">3</span>,\
      \ <span class=\"num\">512</span>)\nclasses = [<span class=\"str\">\"photo of\
      \ a dog\", \"photo of a sports car\", \"photo of a mountain\"</span>]\n<span\
      \ class=\"fn\">print</span>(<span class=\"str\">\"CLIP Classification:\"</span>,\
      \ <span class=\"fn\">clip_zero_shot_classify</span>(img_v, txt_vs, classes))</pre>\n\
      </div>"
