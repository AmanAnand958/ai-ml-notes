    correct_fb: ✅ Correct! UPOS defines universal tags (NOUN, VERB), while XPOS defines
      language-specific details (NNP, VBG) based on corporate corpora standard rules.
    wrong_fb: ❌ Think about verb tenses. UPOS tags "run", "ran", and "running" simply
      as VERB. Which system tags "running" specifically as present-participle (VBG)?
  - num_str: Q4 OF 5
    question: What is the advantage of using spaCy's pipe-based decoration components?
