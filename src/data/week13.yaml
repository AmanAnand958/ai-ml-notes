- id: '90'
  day_num: 90
  title: Named Entity Recognition & POS Tagging
  subtitle: "Extracting meaning from text requires understanding syntax structures\
    \ and identifying specific real-world objects.\n      Today, we masterPart-of-Speech\
    \ (POS) Tagging,Named Entity Recognition (NER), andDependency Parsing.\n     \
    \ We will study how these syntactic properties are modeled, how multi-task neural\
    \ networks label tokens, and construct a production-ready information extraction\
    \ pipeline using spaCy."
  time_estimate: 5 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Explain the linguistic difference between coarse POS tagging (nouns, verbs) and
    fine-grained POS tags.
  - Formulate entity boundaries and map tokens using standard Named Entity labels
    (PERSON, ORG, GPE).
  - Deconstruct sentences into syntactic dependency trees, identifying subjects, objects,
    and modifiers.
  - Develop a custom spaCy pipeline component to extract stock market ticker codes
    and merge locations.
  - Utilise spaCy's pattern-matching Matcher engine to extract custom multi-word product
    spans.
  checklist:
