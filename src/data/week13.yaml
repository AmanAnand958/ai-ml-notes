    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">Run</button></div>\n\
    </div>\n<pre><span class=\"kw\">from</span> sklearn.feature_extraction.text <span\
    \ class=\"kw\">import</span> TfidfVectorizer\n<span class=\"cm\"># Documents tokenized\
    \ into lists of words</span>\ndocs = [[<span class=\"str\">\"machine\", \"learning\"\
    , \"is\", \"cool\"], [\"i\", \"love\", \"python\"</span>]]\nvectorizer = <span\
    \ class=\"fn\">TfidfVectorizer</span>()\nX = vectorizer.<span class=\"fn\">fit_transform</span>(docs)</pre>\n\
    </div>\n<button class=\"solution-toggle\" onclick=\"toggleSolution('debug-sol-13')\"\
    >\n<span>\n         \U0001F50D Reveal Bug &amp; Fix\n        </span>\n</button>\n\
    <div class=\"solution-box\" id=\"debug-sol-13\">\n<div class=\"sol-header\">\n\
    \         SOLUTION &amp; EXPLANATION\n        </div>\n<div style=\"padding:1rem;\
    \ background:rgba(0,0,0,0.2); font-size:13px; line-height:1.6;\">\n<strong>\n\
    \          The Bug:\n         </strong>\n         By default, TfidfVectorizer\
    \ expects raw string documents because its internal analyzer handles lowercasing\
    \ and tokenization. Passing a list of word lists causes it to fail. You must either\
    \ join the tokens into sentences or pass a dummy function for analyzer/tokenizer.\n\
    \         <br/>\n<br/>\n<strong>\n          The Fix:\n         </strong>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         \
    \   python\n           </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\"\
    \ onclick=\"copyCode(this)\">\n             copy\n            </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\">\n             Run\n           \
    \ </button>\n</div>\n</div>\n<pre><span class=\"kw\">from</span> sklearn.feature_extraction.text\
    \ <span class=\"kw\">import</span> TfidfVectorizer\ndocs = [[<span class=\"str\"\
    >\"machine\", \"learning\", \"is\", \"cool\"], [\"i\", \"love\", \"python\"</span>]]\n\
    <span class=\"cm\"># Join tokens into space-separated string sentences</span>\n\
    docs_joined = [<span class=\"str\">\" \"</span>.<span class=\"fn\">join</span>(doc)\
    \ <span class=\"kw\">for</span> doc <span class=\"kw\">in</span> docs]\nvectorizer\
    \ = <span class=\"fn\">TfidfVectorizer</span>()\nX = vectorizer.<span class=\"\
    fn\">fit_transform</span>(docs_joined)</pre>\n</div>\n</div>\n</div>\n</div>"
