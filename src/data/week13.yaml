  quizzes:
  - num_str: Q1 OF 5
    question: What is the mathematical purpose of adding 1 to the numerator and denominator
      inside the IDF formula?
    qid: q88_1
    options:
    - letter: A
      text: To enforce binary weight scaling ranges.
      is_correct: false
    - letter: B
      text: To prevent division-by-zero errors when a query term is missing from all
        training documents.
      is_correct: true
    - letter: C
      text: To bypass logarithmic calculations.
      is_correct: false
    - letter: D
      text: To speed up vector calculations.
      is_correct: false
    correct_fb: ✅ Correct! Adding 1 to both sides acts as "smoothing" (Laplace style),
      ensuring that if document frequency is 0, the numerator doesn't crash from division-by-zero.
    wrong_fb: ❌ Consider what happens if a word like "antigravity" does not occur
      in any of the collected documents. What is DF(t)? What is total documents divided
      by 0? How do we fix this?
  - num_str: Q2 OF 5
    question: Why does Bag of Words suffer from the "Curse of Dimensionality"?
    qid: q88_2
    options:
    - letter: A
      text: It drops rare tokens completely.
      is_correct: false
    - letter: B
      text: As vocabulary grows to 100k+ words, sparse vectors become massive, causing
        computation to become extremely slow and memory-intensive.
      is_correct: true
    - letter: C
      text: It requires GPUs to compile sparse matrices.
      is_correct: false
    - letter: D
      text: It conflicts with regularised classifiers.
      is_correct: false
    correct_fb: ✅ Correct! Vocabulary size is the dimension. A large corpus leads
      to massive sparse arrays with millions of zero entries, causing heavy RAM use
      and data over-dispersion.
    wrong_fb: ❌ Think about vocabulary size. If we add new training articles with
      unique words, what happens to the vector length of every single document in
      our corpus?
  - num_str: Q3 OF 5
    question: Under what condition would a word have a high TF-IDF score inside a
      specific document?
    qid: q88_3
    options:
    - letter: A
      text: When the word appears frequently in this specific document but is highly
        rare across the rest of the corpus.
      is_correct: true
    - letter: B
      text: When the word is present in every single document of the corpus.
      is_correct: false
    - letter: D
      text: When it is a short 2-character stopword.
      is_correct: false
    correct_fb: ✅ Correct! High local frequency (TF) multiplied by a high global rarity
      (IDF) scales up the weight, flagging specific key identifiers of the document.
    wrong_fb: '❌ Look at the multiplication: TF * IDF. If a word is extremely common
      everywhere (like "the"), its IDF is zero. If it''s rare everywhere but frequent
      in this document, what happens?'
  - num_str: Q4 OF 5
    question: What is the advantage of using sublinear term frequency (sublinear_tf=True)
      scaling?
    qid: q88_4
    options:
    - letter: A
      text: It forces output values to sum to one.
      is_correct: false
    - letter: B
      text: It compresses term frequency logarithmically (1 + log(TF)) so that a word
        occurring 20 times isn't weighed 20 times more than a word occurring once.
      is_correct: true
    - letter: C
      text: It acts as an elastic-net regularization layer.
      is_correct: false
    - letter: D
      text: It deletes stop words dynamically.
      is_correct: false
    correct_fb: ✅ Correct! Sublinear scaling uses log-frequencies because semantic
      importance doesn't scale linearly with occurrences. It stops keyword repetition
      from dominating document embeddings.
    wrong_fb: ❌ Think about a spam article repeating the word "buy" 100 times. Does
      it contain 100 times more semantic importance than an article containing "buy"
      once? How does log compress this?
  - num_str: Q5 OF 5
    question: Why does using N-grams capture sequential context?
    qid: q88_5
    options:
    - letter: A
      text: By grouping adjacent sequences of N items, it models local phrases instead
        of single isolated terms.
      is_correct: true
    - letter: B
      text: It automatically extracts root lemmas.
      is_correct: false
    - letter: C
      text: It reduces vocabulary dimensionality.
      is_correct: false
    - letter: D
      text: It matches weights against stop words.
      is_correct: false
    correct_fb: ✅ Correct! N-grams capture word pairs and groups, helping the vector
      model multi-word phrases and idioms (e.g. "not happy" vs "happy").
    wrong_fb: ❌ Review standard unigram limitations. "not guilty" consists of two
      words. Unigram evaluates "not" and "guilty" independently, losing the critical
      negation. How do n-grams fix this?
  flashcards:
  - front: Neural architecture relying entirely on multi-head self-attention and positional
      encodings, eliminating sequential recurrence.
    back: Sequence transduction model based entirely on attention mechanisms, eliminating
      recurrent steps for full parallelization.
  - front: Self-Attention?
    back: Calculates dynamic correlation weights between all positions in a sequence
      to capture direct context dependencies.
  - front: Multi-Head Attention?
    back: Computes self-attention multiple times in parallel with different weight
      projections to capture diverse relationships.
  - front: Positional Encoding?
    back: Injects sinusoidal or learned position vectors into inputs to preserve sequence
      order information.
  - front: Layer Normalization?
    back: Normalizes activations across features within a single training example,
      stabilizing network training.
