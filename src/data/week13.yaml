      text: It signifies that a token is unimportant.
      is_correct: false
    - letter: B
      text: It indicates that a token lies "Inside" a multi-token entity span (not
        the first token).
      is_correct: true
    - letter: C
      text: It scales gradient learning steps.
      is_correct: false
    - letter: D
      text: It identifies irregular verb inflections.
      is_correct: false
    correct_fb: ✅ Correct! The prefix "B-" starts the entity, while "I-" marks any
      additional tokens inside the entity boundary (e.g. "New" [B-GPE] "York" [I-GPE]).
