  analogy: Continuous space embeddings bilkul ek digital 3D space ki tarah hain. Agar
    hum alag alag cheezo ko unke coordinates pe rakhein, to sabhi raaja, rani aur
    mahal ek specific sector (royal zone) me milenge, aur sabhi seb, kela aur santra
