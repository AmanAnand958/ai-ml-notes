  quizzes:
  - num_str: Q1 OF 5
    question: Why is a CRF layer preferred over a standard independent Softmax layer
      in sequence labeling tasks like NER?
    qid: q91_1
    options:
    - letter: A
      text: Softmax is computationally slower on GPUs.
      is_correct: false
    - letter: B
      text: Softmax classifies tokens independently, ignoring adjacent label context
        dependencies (like I-ORG following B-PER), whereas CRF models transition probabilities
        globally.
      is_correct: true
    - letter: C
      text: CRF automatically drops stop words.
      is_correct: false
    - letter: D
      text: Softmax cannot process negative inputs.
      is_correct: false
    correct_fb: ✅ Correct! CRF layers score the entire sequence globally by incorporating
      transition parameters, ensuring grammatical rules and structure boundaries remain
      valid.
    wrong_fb: ❌ Think about syntactic constraints in BIO tagging. Can an "I-GPE" tag
      occur right after an "O" tag? Softmax doesn't know this; it makes decisions
      token by token. Which layer fixes this constraint problem?
  - num_str: Q2 OF 5
    question: What does the parameter transition matrix inside the CRF layer?
    qid: q91_2
    options:
    - letter: A
      text: The linear mappings of embeddings.
      is_correct: false
    - letter: B
      text: The statistical probability of transitioning from tag i to tag j across
        adjacent sequence steps.
      is_correct: true
    - letter: C
      text: The learning rate decay values.
      is_correct: false
    - letter: D
      text: The tokenization splits.
      is_correct: false
    correct_fb: ✅ Correct! The transition matrix maps the scores of moving from any
      tag $y_{t-1}$ to $y_t$, helping the model learn sequence grammar boundaries.
    wrong_fb: '❌ Look at the CRF score equation: sum of A_{y_i, y_{i+1}}. What does
      "A" represent when stepping from tag coordinate i to i+1?'
  - num_str: Q3 OF 5
    question: Which dynamic programming algorithm is used to find the highest-scoring
      tag sequence during CRF inference?
    qid: q91_3
    options:
    - letter: A
      text: Dijkstra Shortest Path.
      is_correct: false
    - letter: B
      text: Viterbi Decoding Algorithm.
      is_correct: true
    - letter: C
      text: Bellman-Ford.
      is_correct: false
    - letter: D
      text: A* Search.
      is_correct: false
    correct_fb: ✅ Correct! The Viterbi algorithm uses dynamic programming to efficiently
      search the exponential tag pathway space in O(T * |Tagset|^2) complexity.
    wrong_fb: ❌ Think about classical hidden Markov models and sequential inference
      algorithms. Which dynamic programming solver is widely used to decode state
      sequences?
  - num_str: Q4 OF 5
    question: When evaluating a class-imbalanced sequence dataset, why is Macro F1
      a more rigorous check than Micro F1?
    qid: q91_4
    options:
    - letter: A
      text: Macro F1 computes scores for each class independently and averages them,
        treating rare classes equally, whereas Micro F1 aggregates globally and is
        dominated by common classes.
      is_correct: true
    - letter: B
      text: Macro F1 runs faster.
      is_correct: false
    - letter: C
      text: Micro F1 ignores true positives.
      is_correct: false
    - letter: D
      text: Macro F1 only counts negative predictions.
      is_correct: false
    correct_fb: ✅ Correct! Macro F1 exposes poor performance on rare categories, while
      Micro F1 can hide failure on minor classes under a high common-class accuracy.
    wrong_fb: ❌ Imagine a dataset with 99% "O" tags and 1% "B-PER" tags. If a model
      predicts "O" for everything, what happens to Micro F1? Which metric treats the
      "B-PER" class with equal weight?
  - num_str: Q5 OF 5
    question: What is the input token features mapping called that represents target
      word scores prior to CRF layer transition checks?
    qid: q91_5
    options:
    - letter: A
      text: Transitions.
      is_correct: false
    - letter: B
      text: Emissions.
      is_correct: true
    - letter: C
      text: Embeddings.
      is_correct: false
    - letter: D
      text: Losses.
      is_correct: false
    correct_fb: ✅ Correct! The score output by the linear/LSTM layer for each token
      is the "Emission Score" (denoting the probability of the token emitting that
      tag).
    wrong_fb: '❌ Think about the two scores in CRF: transition score (tag-to-tag)
