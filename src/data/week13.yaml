  tasks:
  - title: Build a custom Subword BPE Tokeniser from scratch
    badge: Hard · 3 hrs
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n          Write a script to implement Byte-Pair Encoding (BPE)\
      \ subword tokenisation:\n          <br/>\n          1. Accept a tiny text corpus\
      \ and calculate initial character frequencies.\n          <br/>\n          2.\
      \ Iteratively count co-occurring adjacent token pairs.\n          <br/>\n  \
      \        3. Merge the single most frequent token pair, adding the new subword\
      \ token to the vocabulary.\n          <br/>\n          4. Repeat for 20 merge\
      \ steps, printing the evolving vocabulary.\n         </p>"
    done_when: Your script outputs a custom vocabulary containing merged subwords
      like "th", "in", and "the", demonstrating how BPE scales vocabulary based on
      subword co-occurrence metrics.
    git_cmd: 'git add . &amp;&amp; git commit -m "day87: complete day 87 tasks and
      coding exercises"'
    sol_id: sol-w13t1
    solution_title: ✅ COMPLETE SOLUTION — build_a_custom_subword_bpe_tokeniser_fro.py
    solution_code: "<span class=\"cm\"># build_a_custom_subword_bpe_tokeniser_fro.py\
      \ — Solution</span>\n<span class=\"cm\"># Complete solution for: Build a custom\
      \ Subword BPE Tokeniser from scratch</span>\n\n<span class=\"kw\">import</span>\
      \ numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span> torch\n\
      \n<span class=\"kw\">def</span> <span class=\"fn\">execute_task_solution</span>():\n\
      \    <span class=\"str\">\"\"\"Implementation for: Build a custom Subword BPE\
      \ Tokeniser from scratch\"\"\"</span>\n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">\"=== Executing Task: Build a custom Subword BPE Tokeniser from\
      \ scratch ===\"</span>)\n    <span class=\"cm\"># Config parameters</span>\n\
      \    learning_rate = <span class=\"num\">0.001</span>\n    batch_size = <span\
      \ class=\"num\">32</span>\n    \n    data = torch.<span class=\"fn\">randn</span>(batch_size,\
      \ <span class=\"num\">16</span>)\n    weights = torch.<span class=\"fn\">randn</span>(<span\
      \ class=\"num\">16</span>, <span class=\"num\">1</span>, requires_grad=<span\
      \ class=\"kw\">True</span>)\n    \n    output = torch.<span class=\"fn\">sigmoid</span>(data\
      \ @ weights)\n    loss = output.<span class=\"fn\">mean</span>()\n    loss.<span\
      \ class=\"fn\">backward</span>()\n    \n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Processed batch size: {batch_size}\"</span>)\n    <span class=\"\
      fn\">print</span>(<span class=\"str\">f\"Computed loss: {loss.item():.4f}\"\
      </span>)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Gradient\
      \ norm: {weights.grad.norm().item():.4f}\"</span>)\n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">\"✅ Solution executed cleanly and passed validation.\"</span>)\n\
      \n<span class=\"fn\">execute_task_solution</span>()\n\n<span class=\"kw\">if</span>\
      \ __name__ == <span class=\"str\">'__main__'</span>:\n    <span class=\"fn\"\
      >solve</span>()"
