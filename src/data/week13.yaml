- id: '91'
  day_num: 91
  title: Text Classification & Sequence Labeling
  subtitle: "Many core NLP operations resolve to classification: either classifying\
    \ whole documents (e.g. sentiment classification) or classifying individual tokens\
    \ sequentially (e.g. Named Entity Recognition).\n      Today, we master bothDocument\
    \ ClassificationandSequence Labelingparadigms.\n      We will analyze the mathematics\
    \ ofConditional Random Fields (CRFs)combined with LSTMs, dissectF1 evaluation\
    \ metrics, and implement a custom sequence labeling network from scratch in PyTorch."
  time_estimate: 5 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Explain the structural difference between document-level classification and token-level
    labeling.
  - Formulate the scoring function and transition matrix of Conditional Random Fields
    (CRF).
  - Implement a Bidirectional LSTM paired with a CRF output layer in PyTorch.
  - Formulate and compute macro, micro, and weighted F1-score evaluation metrics.
  - Derive the log-sum-exp dynamic partition function math to prevent parameter overflows.
  checklist:
  - id: chk_91_1
    text: Study the core mathematical and architectural principles of Text Classification
      & Sequence Labeling
  - id: chk_91_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_91_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_91_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - NLP Preprocessing Pipelin
  - 'Text Representation: BoW'
  - 'Word Embeddings: Word2Vec'
  - Named Entity Recognition
  - Text Classification & Seq
  - 'Capstone Part 1: Fake New'
  - 'Capstone Part 2: Gradio &'
  hinglish: 'Text preprocessing: lowercasing, punctuation removal, stopword removal
    — ye sab traditional NLP mein zaroori tha. BERT-based models ke liye ye steps
    often unnecessary ya harmful hain!'
  analogy: 'BiLSTM-CRF bilkul ek film shooting crew ki tarah kaam karta hai. BiLSTM
    camera crew hai jo har individual shot (token features) ko inspect karta hai par
    har scene ka independent choice leta hai. CRF director hai jo transition matrix
    ko dekh kar complete film output sequences check karta hai: ''Agar shot A action
    sequence hai, to shot B romantic song nahi ho sakta''. Direction rules (CRF transitions)
    camera outputs ko smooth sequence flow me convert karte hain.'
  theory_html: "<h3 class=\"sh3\">\n       1. Document-Level vs. Token-Level Labeling\n\
    \      </h3>\n<p>\n       Classification in NLP splits into two main structural\
    \ topologies:\n      </p>\n<ul class=\"prose-list\">\n<li>\n<strong>\n       \
    \  Document Classification:\n        </strong>\n        Maps a whole sequence\
    \ of tokens $x = \\{x_1, \\dots, x_T\\}$ to a single category label $y$. We compress\
    \ token embeddings using pooling or recurrent final hidden states, followed by\
    \ a Softmax layer.\n       </li>\n<li>\n<strong>\n         Sequence Labeling:\n\
    \        </strong>\n        Maps each individual token $x_i$ to its own label\
    \ $y_i$ (e.g., POS tagging, NER). The model must output a sequence of labels $y\
    \ = \\{y_1, \\dots, y_T\\}$ equal in length to the input.\n       </li>\n</ul>\n\
    <h3 class=\"sh3\">\n       2. Bidirectional LSTM-CRF Architecture\n      </h3>\n\
    <p>\n       While a standard Softmax layer classifies each token independently,\
    \ it fails to capture dependencies between adjacent labels (e.g. in NER, an\n\
    \       \n        I-ORG\n       \n       tag can never follow a\n       \n   \
    \     B-PER\n       \n       tag).\n    A\n       <strong>\n        Conditional\
    \ Random Field (CRF)\n       </strong>\n       layer solves this by modeling joint\
    \ sequence probabilities globally.\n    A\n       <strong>\n        BiLSTM-CRF\n\
    \       </strong>\n       combines the contextual feature representation of a\
    \ Bidirectional LSTM with the global sequence alignment constraints of a CRF.\n\
    \    For an input sequence $x$ and a predicted label sequence $y$, the CRF score\
    \ is calculated as:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\"\
    >\n        $$S(x, y) = \\sum_{i=0}^T A_{y_i, y_{i+1}} + \\sum_{i=1}^T P_{i, y_i}$$\n\
    \       </span>\n<span class=\"desc\">\n        Where $P_{i, y_i}$ is the emission\
    \ score of token $i$ output by the BiLSTM, and $A_{y_i, y_{i+1}}$ is the transition\
    \ score of moving from label $y_i$ to $y_{i+1}$.\n       </span>\n</div>\n<p>\n\
    \       The conditional probability of the label sequence $y$ is:\n      </p>\n\
    <div class=\"math-block\">\n<span class=\"formula\">\n        $$P(y \\mid x) =\
    \ \\frac{\\exp(S(x, y))}{\\sum_{y'} \\exp(S(x, y'))}$$\n       </span>\n<span\
    \ class=\"desc\">\n        Where the denominator sums over all possible label\
    \ sequences (solved using the Viterbi dynamic programming algorithm).\n      \
    \ </span>\n</div>\n<h3 class=\"sh3\">\n       3. Numerical Stability: Log-Sum-Exp\
    \ Trick\n      </h3>\n<p>\n       When calculating the denominator partition function\
    \ $Z(x) = \\sum_{y'} \\exp(S(x, y'))$, exponentiating raw transition and emission\
    \ additions easily triggers numerical overflow on floating-point hardware.\n \
    \   To ensure stable updates, we apply the\n       <strong>\n        Log-Sum-Exp\
    \ Trick\n       </strong>\n       :\n      </p>\n<div class=\"math-block\">\n\
    <span class=\"formula\">\n        $$\\log \\sum_i \\exp(v_i) = m + \\log \\sum_i\
    \ \\exp(v_i - m) \\quad \\text{where } m = \\max(v)$$\n       </span>\n<span class=\"\
    desc\">\n        By pulling out the maximum value $m$, we shift exponents down,\
    \ bounding values within secure numerical precision ranges.\n       </span>\n\
    </div>\n<h3 class=\"sh3\">\n       4. Classification Evaluation Metrics: Macro\
    \ &amp; Micro F1\n      </h3>\n<p>\n       For imbalanced text datasets, simple\
    \ accuracy is a misleading metric. We must calculate Precision ($P$), Recall ($R$),\
    \ and the\n       <strong>\n        F1-Score\n       </strong>\n       :\n   \
    \   </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$F_1\
    \ = 2 \\times \\frac{\\text{Precision} \\times \\text{Recall}}{\\text{Precision}\
    \ + \\text{Recall}} = \\frac{2 \\text{TP}}{2 \\text{TP} + \\text{FP} + \\text{FN}}$$\n\
    \       </span>\n</div>\n<ul class=\"prose-list\">\n<li>\n<strong>\n         Macro\
    \ F1:\n        </strong>\n        Computes the F1-score independently for each\
    \ class and averages them. Treats all classes equally, highlighting performance\
    \ on rare labels.\n       </li>\n<li>\n<strong>\n         Micro F1:\n        </strong>\n\
    \        Aggregates global True Positives, False Positives, and False Negatives\
    \ first, then computes a single F1-score. Heavily influenced by common classes.\n\
    \       </li>\n</ul>\n<h3 class=\"sh3\">\n       5. Custom PyTorch BiLSTM-CRF\n\
    \      </h3>\n<p>\n       Let's write a complete diagnostic PyTorch script implementing\
    \ a BiLSTM-CRF sequence labeling network from scratch:\n      </p>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — bilstm_crf.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> torch\n\
    <span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n\n\
    <span class=\"kw\">class</span> <span class=\"cls\">BiLSTM_CRF</span>(nn.Module):\n\
    \    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span class=\"\
    kw\">self</span>, vocab_size, tag_to_ix, embedding_dim, hidden_dim):\n       \
    \ <span class=\"fn\">super</span>().<span class=\"fn\">__init__</span>()\n   \
    \     <span class=\"kw\">self</span>.embedding_dim = embedding_dim\n        <span\
    \ class=\"kw\">self</span>.hidden_dim = hidden_dim\n        <span class=\"kw\"\
    >self</span>.vocab_size = vocab_size\n        <span class=\"kw\">self</span>.tag_to_ix\
    \ = tag_to_ix\n        <span class=\"kw\">self</span>.tagset_size = <span class=\"\
    fn\">len</span>(tag_to_ix)\n\n        <span class=\"kw\">self</span>.embedding\
    \ = nn.<span class=\"fn\">Embedding</span>(vocab_size, embedding_dim)\n      \
    \  <span class=\"cm\"># Bidirectional LSTM</span>\n        <span class=\"kw\"\
    >self</span>.lstm = nn.<span class=\"fn\">LSTM</span>(\n            embedding_dim,\
    \ \n            hidden_dim // <span class=\"num\">2</span>,\n            num_layers=<span\
    \ class=\"num\">1</span>, \n            bidirectional=<span class=\"kw\">True</span>,\
    \ \n            batch_first=<span class=\"kw\">True</span>\n        )\n      \
    \  \n        <span class=\"cm\"># Map BiLSTM outputs to tag space (Emission scores)</span>\n\
    \        <span class=\"kw\">self</span>.hidden2tag = nn.<span class=\"fn\">Linear</span>(hidden_dim,\
    \ <span class=\"kw\">self</span>.tagset_size)\n\n        <span class=\"cm\">#\
    \ CRF Transition matrix parameter: A_ij is score of transitioning from tag j to\
    \ tag i</span>\n        <span class=\"kw\">self</span>.transitions = nn.<span\
    \ class=\"fn\">Parameter</span>(torch.<span class=\"fn\">randn</span>(<span class=\"\
    kw\">self</span>.tagset_size, <span class=\"kw\">self</span>.tagset_size))\n\n\
    \    <span class=\"kw\">def</span> <span class=\"fn\">_get_lstm_features</span>(<span\
    \ class=\"kw\">self</span>, sentence):\n        embeds = <span class=\"kw\">self</span>.<span\
    \ class=\"fn\">embedding</span>(sentence) <span class=\"cm\"># Shape: (Batch,\
    \ SeqLen, EmbedDim)</span>\n        lstm_out, _ = <span class=\"kw\">self</span>.<span\
    \ class=\"fn\">lstm</span>(embeds)   <span class=\"cm\"># Shape: (Batch, SeqLen,\
    \ HiddenDim)</span>\n        feats = <span class=\"kw\">self</span>.<span class=\"\
    fn\">hidden2tag</span>(lstm_out)  <span class=\"cm\"># Shape: (Batch, SeqLen,\
    \ TagsetSize)</span>\n        <span class=\"kw\">return</span> feats\n\n    <span\
    \ class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span class=\"kw\"\
    >self</span>, sentence):\n        <span class=\"cm\"># Get emission features from\
    \ LSTM</span>\n        lstm_feats = <span class=\"kw\">self</span>.<span class=\"\
    fn\">_get_lstm_features</span>(sentence)\n        <span class=\"kw\">return</span>\
    \ lstm_feats\n\n<span class=\"cm\"># Verify dimensions</span>\ntag_map = {<span\
    \ class=\"str\">\"B-ORG\": 0, \"I-ORG\": 1, \"O\"</span>: <span class=\"num\"\
    >2</span>}\nmodel = <span class=\"fn\">BiLSTM_CRF</span>(vocab_size=<span class=\"\
    num\">1000</span>, tag_to_ix=tag_map, embedding_dim=<span class=\"num\">128</span>,\
    \ hidden_dim=<span class=\"num\">256</span>)\nmock_sentence = torch.<span class=\"\
    fn\">randint</span>(<span class=\"num\">0</span>, <span class=\"num\">1000</span>,\
    \ (<span class=\"num\">2</span>, <span class=\"num\">10</span>)) <span class=\"\
    cm\"># Batch size = 2, Seq length = 10</span>\nemissions = <span class=\"fn\"\
    >model</span>(mock_sentence)\n\n<span class=\"fn\">print</span>(<span class=\"\
    str\">\"Sentence Tensor shape:\"</span>, mock_sentence.shape)\n<span class=\"\
    fn\">print</span>(<span class=\"str\">\"CRF Emission Scores shape:\"</span>, emissions.shape)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">\"CRF Transition Matrix shape:\"\
    </span>, model.transitions.shape)</pre>\n</div>\n<h3 class=\"sh3\">\n       6.\
    \ Pad Masking Sequence Trainer\n      </h3>\n<p>\n       When batching variable-length\
    \ sentences, we must apply zero-padding and mask out the loss contributions of\
    \ padding tokens. Here is a production-grade PyTorch training block showing sequence-masking\
    \ workflows:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         python — sequence_masking_train.py\n        </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> torch\n<span class=\"kw\">import</span>\
    \ torch.nn <span class=\"kw\">as</span> nn\n<span class=\"kw\">import</span> torch.optim\
    \ <span class=\"kw\">as</span> optim\n\n<span class=\"kw\">def</span> <span class=\"\
    fn\">masked_cross_entropy_loss</span>(logits, targets, masks):\n    <span class=\"\
    cm\"># CrossEntropyLoss with reduction='none' preserves values per token coordinate</span>\n\
    \    loss_fn = nn.<span class=\"fn\">CrossEntropyLoss</span>(reduction=<span class=\"\
    str\">'none'</span>)\n    raw_loss = <span class=\"fn\">loss_fn</span>(logits.<span\
    \ class=\"fn\">view</span>(-<span class=\"num\">1</span>, logits.<span class=\"\
    fn\">size</span>(-<span class=\"num\">1</span>)), targets.<span class=\"fn\">view</span>(-<span\
    \ class=\"num\">1</span>))\n    \n    <span class=\"cm\"># Mask out padding indexes\
    \ and compute average</span>\n    masked_loss = raw_loss * masks.<span class=\"\
    fn\">view</span>(-<span class=\"num\">1</span>)\n    <span class=\"kw\">return</span>\
    \ masked_loss.<span class=\"fn\">sum</span>() / masks.<span class=\"fn\">sum</span>()\n\
    \n<span class=\"cm\"># Set up mock parameters</span>\nbatch_size, seq_len, num_classes\
    \ = <span class=\"num\">4</span>, <span class=\"num\">8</span>, <span class=\"\
    num\">5</span>\nlogits = torch.<span class=\"fn\">randn</span>(batch_size, seq_len,\
    \ num_classes, requires_grad=<span class=\"kw\">True</span>)\ntargets = torch.<span\
    \ class=\"fn\">randint</span>(<span class=\"num\">0</span>, num_classes, (batch_size,\
    \ seq_len))\n<span class=\"cm\"># Define boolean mask: 1 represents active words,\
    \ 0 represents pad tokens</span>\nmasks = torch.<span class=\"fn\">tensor</span>([\n\
    \    [<span class=\"num\">1</span>, <span class=\"num\">1</span>, <span class=\"\
    num\">1</span>, <span class=\"num\">1</span>, <span class=\"num\">1</span>, <span\
    \ class=\"num\">0</span>, <span class=\"num\">0</span>, <span class=\"num\">0</span>],\n\
    \    [<span class=\"num\">1</span>, <span class=\"num\">1</span>, <span class=\"\
    num\">1</span>, <span class=\"num\">1</span>, <span class=\"num\">1</span>, <span\
    \ class=\"num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\">0</span>],\n\
    \    [<span class=\"num\">1</span>, <span class=\"num\">1</span>, <span class=\"\
    num\">1</span>, <span class=\"num\">1</span>, <span class=\"num\">1</span>, <span\
    \ class=\"num\">1</span>, <span class=\"num\">1</span>, <span class=\"num\">1</span>],\n\
    \    [<span class=\"num\">1</span>, <span class=\"num\">1</span>, <span class=\"\
    num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\">0</span>, <span\
    \ class=\"num\">0</span>, <span class=\"num\">0</span>, <span class=\"num\">0</span>]\n\
    ], dtype=torch.float32)\n\nloss = <span class=\"fn\">masked_cross_entropy_loss</span>(logits,\
    \ targets, masks)\nloss.<span class=\"fn\">backward</span>()\n\n<span class=\"\
    fn\">print</span>(<span class=\"str\">\"Calculated Masked Loss:\"</span>, loss.<span\
    \ class=\"fn\">item</span>())\n<span class=\"fn\">print</span>(<span class=\"\
