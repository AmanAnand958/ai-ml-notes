    done_when: Your script outputs a clean performance summary, showing that dense
      models achieve over 85% accuracy on standard semantic analogy datasets.
    git_cmd: 'git add gensim_analogy_evaluator.py &amp;&amp; git commit -m "day89:
      gensim-analogy-evaluator"'
    sol_id: sol-w13t6
    solution_title: ✅ COMPLETE SOLUTION — gensim_analogy_evaluator.py
    solution_code: "<span class=\"cm\"># gensim_analogy_evaluator.py — Solution</span>\n\
      <span class=\"cm\"># Complete solution for: Gensim Analogy evaluator</span>\n\
      \n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n\
      <span class=\"kw\">def</span> <span class=\"fn\">compute_classification_metrics</span>(y_true,\
      \ y_pred_probs, threshold=<span class=\"num\">0.5</span>):\n    y_pred = (y_pred_probs\
      \ &gt;= threshold).<span class=\"fn\">astype</span>(int)\n    tp = np.<span\
      \ class=\"fn\">sum</span>((y_true == <span class=\"num\">1</span>) &amp; (y_pred\
      \ == <span class=\"num\">1</span>))\n    fp = np.<span class=\"fn\">sum</span>((y_true\
      \ == <span class=\"num\">0</span>) &amp; (y_pred == <span class=\"num\">1</span>))\n\
      \    fn = np.<span class=\"fn\">sum</span>((y_true == <span class=\"num\">1</span>)\
      \ &amp; (y_pred == <span class=\"num\">0</span>))\n    tn = np.<span class=\"\
      fn\">sum</span>((y_true == <span class=\"num\">0</span>) &amp; (y_pred == <span\
      \ class=\"num\">0</span>))\n    \n    accuracy = (tp + tn) / <span class=\"\
      fn\">len</span>(y_true)\n    precision = tp / (tp + fp) <span class=\"kw\">if</span>\
      \ (tp + fp) &gt; <span class=\"num\">0</span> <span class=\"kw\">else</span>\
      \ <span class=\"num\">0</span>\n    recall = tp / (tp + fn) <span class=\"kw\"\
      >if</span> (tp + fn) &gt; <span class=\"num\">0</span> <span class=\"kw\">else</span>\
      \ <span class=\"num\">0</span>\n    f1 = <span class=\"num\">2</span> * precision\
      \ * recall / (precision + recall) <span class=\"kw\">if</span> (precision +\
      \ recall) &gt; <span class=\"num\">0</span> <span class=\"kw\">else</span> <span\
      \ class=\"num\">0</span>\n    \n    <span class=\"kw\">return</span> {<span\
      \ class=\"str\">\"accuracy\": accuracy, \"precision\": precision, \"recall\"\
      : recall, \"f1_score\"</span>: f1}\n\ny_true = np.<span class=\"fn\">array</span>([<span\
      \ class=\"num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\"\
      >1</span>, <span class=\"num\">1</span>, <span class=\"num\">0</span>, <span\
      \ class=\"num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\"\
      >0</span>])\ny_probs = np.<span class=\"fn\">array</span>([<span class=\"num\"\
      >0.9</span>, <span class=\"num\">0.1</span>, <span class=\"num\">0.8</span>,\
      \ <span class=\"num\">0.4</span>, <span class=\"num\">0.2</span>, <span class=\"\
      num\">0.7</span>, <span class=\"num\">0.6</span>, <span class=\"num\">0.3</span>])\n\
      metrics = <span class=\"fn\">compute_classification_metrics</span>(y_true, y_probs)\n\
      <span class=\"fn\">print</span>(<span class=\"str\">f\"Evaluation for {task_title}:\"\
      </span>)\n<span class=\"kw\">for</span> k, v <span class=\"kw\">in</span> metrics.<span\
      \ class=\"fn\">items</span>():\n    <span class=\"fn\">print</span>(<span class=\"\
      str\">f\"  {k}: {v:.4f}\"</span>)\n\n<span class=\"kw\">if</span> __name__ ==\
      \ <span class=\"str\">'__main__'</span>:\n    <span class=\"fn\">solve</span>()"
    solution_lang: python
  quizzes:
  - num_str: Q1 OF 5
    question: What is the computational benefit of using Negative Sampling in Skip-Gram?
    qid: q89_1
    options:
    - letter: A
      text: It drops rare words completely to save memory.
      is_correct: false
    - letter: B
      text: It avoids computing the full Softmax denominator over the entire vocabulary
        by updating only the target word and a few randomly selected negative words.
      is_correct: true
    - letter: C
      text: It enforces weights regularization automatically.
      is_correct: false
    - letter: D
      text: It deletes stop words dynamically.
      is_correct: false
    correct_fb: ✅ Correct! The standard Softmax requires summing weights over all
      vocabulary words V (which is slow). Negative sampling simplifies this to a binary
      classification problem for only K negative words.
    wrong_fb: '❌ Think about the denominator in standard Softmax: sum over exp(u_w
      * v_c) for all words in the vocabulary. If vocabulary has 100,000 words, how
      slow is this? How does negative sampling avoid this sum?'
  - num_str: Q2 OF 5
    question: Why is vocabulary frequency raised to the power of 3/4 inside the Negative
      Sampling noise distribution?
    qid: q89_2
    options:
    - letter: A
      text: To normalise cosine parameters to sum to 1.
      is_correct: false
    - letter: B
      text: To relatively boost the sampling probability of rare words compared to
        highly common words, ensuring the model trains on all terms.
      is_correct: true
    - letter: C
      text: To speed up matrix dot products.
      is_correct: false
    - letter: D
      text: To enforce L1 regularization constraints.
      is_correct: false
    correct_fb: ✅ Correct! Raising frequencies to the power of 3/4 flattens the distribution,
      giving rare words a relatively higher chance of being drawn as negative samples.
    wrong_fb: ❌ What happens to the sampling probability of a rare word if we use
      unmodified raw frequencies? It almost never gets sampled. What mathematical
      exponent increases rare word probabilities?
  - num_str: Q3 OF 5
    question: Which statement describes the difference between Word2Vec and GloVe?
    qid: q89_3
    options:
    - letter: A
      text: Word2Vec learns context locally from sliding windows, whereas GloVe optimizes
        embeddings globally over the entire corpus co-occurrence matrix.
      is_correct: true
    - letter: B
      text: Word2Vec is a sparse vector model, while GloVe is dense.
      is_correct: false
    - letter: C
      text: GloVe requires recurrent layers.
      is_correct: false
    - letter: D
      text: Word2Vec can only run on GPUs.
      is_correct: false
    correct_fb: ✅ Correct! Word2Vec is a predictive model that trains step-by-step
      on local context windows. GloVe is a count-based model that fits log-bilinear
      models directly to global corpus statistics.
    wrong_fb: ❌ Look at the objective formulations. Word2Vec trains iteratively by
      moving through the raw text corpus with a sliding window. What matrix does GloVe
      pre-compute globally?
  - num_str: Q4 OF 5
    question: What does the Word2Vec Skip-gram model predict?
    qid: q89_4
    options:
    - letter: A
      text: The center word given the surrounding context words.
      is_correct: false
    - letter: B
      text: Surrounding context words given a single center target word.
      is_correct: true
    - letter: C
      text: The next sentence in the document.
      is_correct: false
    - letter: D
      text: The sentiment of the text block.
      is_correct: false
    correct_fb: ✅ Correct! The Skip-gram model inputs a single center word $w_t$ and
      outputs predictions for words in its local context window $\{w_{t-C}, \dots,
      w_{t+C}\}$.
    wrong_fb: ❌ Review Continuous Bag of Words (CBOW) and Skip-gram setups. CBOW averages
      context inputs to find the center target. What is the exact inverse setup used
      by Skip-gram?
  - num_str: Q5 OF 5
    question: What value does Cosine Similarity have if two vectors are completely
      orthogonal to each other?
    qid: q89_5
    options:
    - letter: A
      text: '0.0'
      is_correct: true
    - letter: B
      text: '1.0'
      is_correct: false
    - letter: C
      text: '-1.0'
      is_correct: false
    - letter: D
      text: '0.5'
      is_correct: false
    correct_fb: ✅ Correct! Complete orthogonal orientation corresponds to an angle
      of 90 degrees, yielding a cosine score of 0.0 (indicating no shared semantic
      overlap).
    wrong_fb: ❌ Think of basic geometry. Cosine of 90 degrees is equal to what number?
  flashcards:
  - front: Neural architecture relying entirely on multi-head self-attention and positional
      encodings, eliminating sequential recurrence.
    back: Sequence transduction model based entirely on attention mechanisms, eliminating
      recurrent steps for full parallelization.
  - front: Self-Attention?
    back: Calculates dynamic correlation weights between all positions in a sequence
      to capture direct context dependencies.
  - front: Multi-Head Attention?
    back: Computes self-attention multiple times in parallel with different weight
      projections to capture diverse relationships.
  - front: Positional Encoding?
    back: Injects sinusoidal or learned position vectors into inputs to preserve sequence
      order information.
  - front: Layer Normalization?
    back: Normalizes activations across features within a single training example,
      stabilizing network training.
