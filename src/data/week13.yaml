  theory_html: "<h3 class=\"sh3\">\n       1. Continuous Bag of Words (CBOW) vs. Skip-gram\n\
    \      </h3>\n<p>\n       Word2Vec uses shallow two-layer neural networks to learn\
    \ dense embeddings:\n      </p>\n<svg aria-label=\"2D word embedding space showing\
    \ semantic clusters and the king minus man plus woman equals queen analogy\" height=\"\
    360\" role=\"img\" viewbox=\"0 0 700 360\" width=\"700\" xmlns=\"http://www.w3.org/2000/svg\"\
    >\n<style>\n        svg .w13t{font-family:DM Sans,sans-serif}\n       </style>\n\
    <defs>\n<lineargradient id=\"w13-bg_s\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\n\
    <stop offset=\"0%\" stop-color=\"#1a1e2e\">\n</stop>\n<stop offset=\"100%\" stop-color=\"\
    var(--bg)\">\n</stop>\n</lineargradient>\n</defs>\n<rect fill=\"url(#w13-bg_s)\"\
    \ height=\"360\" rx=\"12\" width=\"700\">\n</rect>\n<text class=\"w13t\" fill=\"\
    #e6edf3\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" x=\"350\"\
    \ y=\"26\">\n        Word Embedding Space (2D projection of 100-dim vectors)\n\
    \       </text>\n<line stroke=\"#2a3050\" stroke-width=\"1\" x1=\"60\" x2=\"660\"\
    \ y1=\"290\" y2=\"290\">\n</line>\n<line stroke=\"#2a3050\" stroke-width=\"1\"\
    \ x1=\"60\" x2=\"60\" y1=\"60\" y2=\"290\">\n</line>\n<text class=\"w13t\" fill=\"\
    var(--text2)\" font-size=\"10\" text-anchor=\"middle\" x=\"360\" y=\"306\">\n\
    \        dimension 1\n       </text>\n<text class=\"w13t\" fill=\"var(--text2)\"\
    \ font-size=\"10\" text-anchor=\"middle\" x=\"44\" y=\"180\">\n        dimension\
    \ 2\n       </text>\n<g fill=\"#6c8cff\" fill-opacity=\"0.25\" stroke=\"#6c8cff\"\
    \ stroke-opacity=\"0.8\" stroke-width=\"1\">\n<ellipse cx=\"480\" cy=\"170\" rx=\"\
    95\" ry=\"60\">\n</ellipse>\n<ellipse cx=\"210\" cy=\"130\" rx=\"75\" ry=\"50\"\
    >\n</ellipse>\n<ellipse cx=\"230\" cy=\"220\" rx=\"70\" ry=\"45\">\n</ellipse>\n\
    </g>\n<text class=\"w13t\" fill=\"#6c8cff\" font-size=\"10\" font-weight=\"700\"\
    \ text-anchor=\"middle\" x=\"480\" y=\"90\">\n        ROYALTY\n       </text>\n\
    <text class=\"w13t\" fill=\"#6c8cff\" font-size=\"10\" font-weight=\"700\" text-anchor=\"\
    middle\" x=\"210\" y=\"70\">\n        FRUITS\n       </text>\n<text class=\"w13t\"\
    \ fill=\"#6c8cff\" font-size=\"10\" font-weight=\"700\" text-anchor=\"middle\"\
    \ x=\"230\" y=\"286\">\n        ANIMALS\n       </text>\n<circle cx=\"530\" cy=\"\
    150\" fill=\"#f5d76e\" r=\"6\">\n</circle>\n<text class=\"w13t\" fill=\"#f5d76e\"\
    \ font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"530\" y=\"140\"\
    >\n        king\n       </text>\n<circle cx=\"505\" cy=\"185\" fill=\"#f5d76e\"\
    \ r=\"6\">\n</circle>\n<text class=\"w13t\" fill=\"#f5d76e\" font-size=\"11\"\
    \ font-weight=\"700\" text-anchor=\"middle\" x=\"505\" y=\"205\">\n        queen\n\
    \       </text>\n<circle cx=\"450\" cy=\"140\" fill=\"#4fd1a5\" r=\"6\">\n</circle>\n\
    <text class=\"w13t\" fill=\"#4fd1a5\" font-size=\"11\" font-weight=\"700\" text-anchor=\"\
    middle\" x=\"450\" y=\"130\">\n        man\n       </text>\n<circle cx=\"430\"\
    \ cy=\"185\" fill=\"#4fd1a5\" r=\"6\">\n</circle>\n<text class=\"w13t\" fill=\"\
    #4fd1a5\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" x=\"428\"\
    \ y=\"203\">\n        woman\n       </text>\n<circle cx=\"150\" cy=\"120\" fill=\"\
    #e56b8c\" r=\"6\">\n</circle>\n<text class=\"w13t\" fill=\"#e56b8c\" font-size=\"\
    11\" text-anchor=\"middle\" x=\"150\" y=\"108\">\n        apple\n       </text>\n\
    <circle cx=\"180\" cy=\"150\" fill=\"#e56b8c\" r=\"6\">\n</circle>\n<text class=\"\
    w13t\" fill=\"#e56b8c\" font-size=\"11\" text-anchor=\"middle\" x=\"196\" y=\"\
    162\">\n        banana\n       </text>\n<circle cx=\"200\" cy=\"210\" fill=\"\
    #b47cfc\" r=\"6\">\n</circle>\n<text class=\"w13t\" fill=\"#b47cfc\" font-size=\"\
    11\" text-anchor=\"middle\" x=\"200\" y=\"238\">\n        dog\n       </text>\n\
    <circle cx=\"240\" cy=\"230\" fill=\"#b47cfc\" r=\"6\">\n</circle>\n<text class=\"\
    w13t\" fill=\"#b47cfc\" font-size=\"11\" text-anchor=\"middle\" x=\"258\" y=\"\
    244\">\n        cat\n       </text>\n<path d=\"M 450 140 L 530 150\" fill=\"none\"\
    \ marker-end=\"url(#w13arr_s)\" stroke=\"var(--text2)\" stroke-dasharray=\"4 3\"\
    \ stroke-width=\"1.4\">\n</path>\n<path d=\"M 505 185 L 430 185\" fill=\"none\"\
    \ stroke=\"var(--text2)\" stroke-dasharray=\"4 3\" stroke-width=\"1.4\">\n</path>\n\
    <defs>\n<marker id=\"w13arr_s\" markerheight=\"6\" markerwidth=\"6\" orient=\"\
    auto\" refx=\"5\" refy=\"3\">\n<path d=\"M0,0 L0,6 L6,3 z\" fill=\"var(--text2)\"\
    >\n</path>\n</marker>\n</defs>\n<line stroke=\"#f5d76e\" stroke-opacity=\"0.9\"\
    \ stroke-width=\"2\" x1=\"470\" x2=\"525\" y1=\"130\" y2=\"168\">\n</line>\n<line\
    \ stroke=\"#4fd1a5\" stroke-opacity=\"0.9\" stroke-width=\"2\" x1=\"440\" x2=\"\
    462\" y1=\"172\" y2=\"148\">\n</line>\n<text class=\"w13t\" fill=\"#f5d76e\" font-size=\"\
    11\" font-weight=\"700\" text-anchor=\"middle\" x=\"348\" y=\"120\">\n       \
    \ king − man + woman ≈ queen\n       </text>\n<text class=\"w13t\" fill=\"var(--text2)\"\
    \ font-size=\"10\" text-anchor=\"middle\" x=\"350\" y=\"330\">\n        Same offset\
    \ between (king − man) and (queen − woman) — the model learns \"royalty\" as a\
    \ direction\n       </text>\n</svg>\n<ul class=\"prose-list\">\n<li>\n<strong>\n\
    \         CBOW (Continuous Bag of Words):\n        </strong>\n        Predicts\
    \ a target center word $w_t$ from surrounding context words within window size\
    \ $C$:\n        <br/>\n        $\\text{Input Context: } \\{w_{t-C}, \\dots, w_{t+C}\\\
    } \\rightarrow \\text{Output Center: } w_t$\n        <br/>\n        Faster to\
    \ train, represents frequent words slightly better.\n       </li>\n<li>\n<strong>\n\
    \         Skip-gram:\n        </strong>\n        Predicts context words from the\
    \ single center word $w_t$:\n        <br/>\n        $\\text{Input Center: } w_t\
    \ \\rightarrow \\text{Output Context: } \\{w_{t-C}, \\dots, w_{t+C}\\}$\n    \
    \    <br/>\n        Slower, but represents rare words and semantic analogies significantly\
    \ better.\n       </li>\n</ul>\n<h3 class=\"sh3\">\n       2. Skip-gram with Negative\
    \ Sampling (SGNS) Formulation\n      </h3>\n<p>\n       Calculating full Softmax\
    \ denominators over vocabulary $V$ (often 100k+ words) is computationally prohibitive.\n\
    \       <strong>\n        Negative Sampling\n       </strong>\n       solves this\
    \ by converting the multi-class problem into binary logistic classification.\n\
    \    For a center word $w$ and context word $c$, the positive label is 1; for\
    \ $k$ randomly sampled \"negative\" words $w_i$, the label is 0.\n    The SGNS\
    \ loss function is formulated as:\n      </p>\n<div class=\"math-block\">\n<span\
    \ class=\"formula\">\n        $$\\mathcal{L}_{\\text{SGNS}} = -\\log \\sigma(v'_{w_O}^\\\
    top v_{w_I}) - \\sum_{i=1}^k \\mathbb{E}_{w_i \\sim P_n(w)} \\left[ \\log \\sigma(-v'_{w_i}^\\\
    top v_{w_I}) \\right]$$\n       </span>\n<span class=\"desc\">\n        Where\
    \ $v_{w_I}$ is the input vector of center word $w_I$, $v'$ is the output representation,\
    \ and $P_n(w)$ is the noise distribution (vocabulary frequencies raised to the\
    \ power of $\\frac{3}{4}$ to boost rare word selection).\n       </span>\n</div>\n\
    <h3 class=\"sh3\">\n       3. Hierarchical Softmax Huffman Coding Tree\n     \
    \ </h3>\n<p>\n       Hierarchical Softmax structures vocabulary as a leaf-node\
    \ binary\n       <strong>\n        Huffman Tree\n       </strong>\n       , where\
    \ frequent words reside near the root and rare words deeper down. The probability\
    \ of choosing a word $w$ is defined as path traversal multiplications:\n     \
    \ </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$P(w \\\
    mid w_I) = \\prod_{j=1}^{L(w)-1} \\sigma\\left( \\text{ch}(n(w, j)) \\cdot \\\
    theta_{n(w, j)}^\\top v_{w_I} \\right)$$\n       </span>\n<span class=\"desc\"\
    >\n        Where $L(w)$ is path length, $n(w, j)$ is node $j$ on the path, and\
    \ $\\text{ch}(n)$ maps left (+1) or right (-1) tree step choices. This scales\
    \ search time logarithmically to $O(\\log_2 V)$.\n       </span>\n</div>\n<h3\
    \ class=\"sh3\">\n       4. GloVe: Global Vectors Formulation\n      </h3>\n<p>\n\
    \       While Word2Vec trains on local sliding windows (ignoring global co-occurrences),\n\
    \       <strong>\n        GloVe\n       </strong>\n       trains directly on the\
    \ global co-occurrence matrix $X$, where $X_{i,j}$ is the count of word $j$ appearing\
    \ in the context of word $i$.\n    The GloVe loss function is defined as:\n  \
    \    </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$\\\
    mathcal{L}_{\\text{GloVe}} = \\sum_{i,j=1}^V f(X_{i,j}) \\left( w_i^\\top \\tilde{w}_j\
    \ + b_i + \\tilde{b}_j - \\log X_{i,j} \\right)^2$$\n       </span>\n<span class=\"\
    desc\">\n        Where $w_i, \\tilde{w}_j$ are word vectors, $b_i, \\tilde{b}_j$\
    \ are biases, and $f(x)$ is a weighted scaling function limiting the impact of\
    \ extremely common co-occurrences.\n       </span>\n</div>\n<h3 class=\"sh3\"\
    >\n       5. Training Word2Vec using Gensim\n      </h3>\n<p>\n       Let's write\
    \ a complete, high-fidelity script using the\n       \n        gensim\n      \
    \ \n       library to train and analyze custom word embeddings:\n      </p>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — train_word2vec.py\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\"\
    >from</span> gensim.models <span class=\"kw\">import</span> Word2Vec\n<span class=\"\
    kw\">import</span> string\n\n<span class=\"cm\"># 1. Prepare raw corpus</span>\n\
    corpus = [\n    <span class=\"str\">\"The stock market experienced a huge surge\
    \ in major tech shares.\"</span>,\n    <span class=\"str\">\"Technology companies\
    \ are investing heavily in machine learning embeddings.\"</span>,\n    <span class=\"\
    str\">\"Central banks are planning to hike interest rates this fiscal quarter.\"\
    </span>,\n    <span class=\"str\">\"Deep learning models require dense word representation\
    \ vectors.\"</span>\n]\n\n<span class=\"cm\"># 2. Tokenise and clean sentences</span>\n\
    processed_corpus = []\n<span class=\"kw\">for</span> sentence <span class=\"kw\"\
    >in</span> corpus:\n    tokens = sentence.<span class=\"fn\">lower</span>().<span\
    \ class=\"fn\">translate</span>(str.<span class=\"fn\">maketrans</span>(<span\
    \ class=\"str\">\"\", \"\"</span>, string.punctuation)).<span class=\"fn\">split</span>()\n\
    \    processed_corpus.<span class=\"fn\">append</span>(tokens)\n\n<span class=\"\
    cm\"># 3. Initialize and train Word2Vec Skip-Gram model</span>\nmodel = <span\
    \ class=\"fn\">Word2Vec</span>(\n    sentences=processed_corpus,\n    vector_size=<span\
    \ class=\"num\">100</span>,      <span class=\"cm\"># Dense embedding dimensions\
    \ size</span>\n    window=<span class=\"num\">3</span>,             <span class=\"\
    cm\"># Context search sliding window size</span>\n    min_count=<span class=\"\
    num\">1</span>,          <span class=\"cm\"># Ignore words with lower occurrences</span>\n\
    \    sg=<span class=\"num\">1</span>,                 <span class=\"cm\"># Use\
    \ 1 for Skip-gram, 0 for CBOW</span>\n    negative=<span class=\"num\">5</span>,\
    \           <span class=\"cm\"># Number of negative samples to draw</span>\n \
    \   epochs=<span class=\"num\">50</span>             <span class=\"cm\"># Iteration\
    \ steps</span>\n)\n\n<span class=\"cm\"># 4. Perform vector queries and analogy\
    \ evaluations</span>\nvector = model.wv[<span class=\"str\">\"learning\"</span>]\n\
    similar_words = model.wv.<span class=\"fn\">most_similar</span>(<span class=\"\
    str\">\"learning\"</span>, topn=<span class=\"num\">3</span>)\n\n<span class=\"\
    fn\">print</span>(<span class=\"str\">\"Embedding Vector for '</span>learning<span\
    \ class=\"str\">' (truncated to 5 dimensions):\\\\n\"</span>, vector[:<span class=\"\
    num\">5</span>])\n<span class=\"fn\">print</span>(<span class=\"str\">\"Words\
    \ most similar to '</span>learning<span class=\"str\">':\"</span>, similar_words)</pre>\n\
    </div>\n<h3 class=\"sh3\">\n       6. Embedding Similarity Calculations in pure\
    \ NumPy\n      </h3>\n<p>\n       Below is a pure-NumPy demonstration calculating\
    \ cosine similarity and analogy checks (e.g. $King - Man + Woman \\approx Queen$)\
    \ on custom word vectors:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — vector_similarity_analogy.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy <span\
    \ class=\"kw\">as</span> np\n\n<span class=\"kw\">def</span> <span class=\"fn\"\
    >cosine_similarity</span>(v1, v2):\n    dot_prod = np.<span class=\"fn\">dot</span>(v1,\
    \ v2)\n    norm_v1 = np.linalg.<span class=\"fn\">norm</span>(v1)\n    norm_v2\
    \ = np.linalg.<span class=\"fn\">norm</span>(v2)\n    <span class=\"kw\">if</span>\
    \ norm_v1 == <span class=\"num\">0</span> <span class=\"kw\">or</span> norm_v2\
    \ == <span class=\"num\">0</span>:\n        <span class=\"kw\">return</span> <span\
    \ class=\"num\">0.0</span>\n    <span class=\"kw\">return</span> dot_prod / (norm_v1\
    \ * norm_v2)\n\n<span class=\"cm\"># Setup mock embeddings map of size 300 dimensions</span>\n\
    np.random.<span class=\"fn\">seed</span>(<span class=\"num\">42</span>)\nembeddings\
    \ = {\n    <span class=\"str\">\"king\"</span>: np.random.<span class=\"fn\">randn</span>(<span\
    \ class=\"num\">300</span>),\n    <span class=\"str\">\"man\"</span>: np.random.<span\
    \ class=\"fn\">randn</span>(<span class=\"num\">300</span>),\n    <span class=\"\
    str\">\"woman\"</span>: np.random.<span class=\"fn\">randn</span>(<span class=\"\
    num\">300</span>),\n    <span class=\"str\">\"queen\"</span>: np.random.<span\
    \ class=\"fn\">randn</span>(<span class=\"num\">300</span>),\n    <span class=\"\
    str\">\"apple\"</span>: np.random.<span class=\"fn\">randn</span>(<span class=\"\
    num\">300</span>)\n}\n\n<span class=\"fn\">print</span>(<span class=\"str\">\"\
    Similarity (king, queen):\", cosine_similarity(embeddings[\"king\"], embeddings[\"\
    queen\"</span>]))\n<span class=\"fn\">print</span>(<span class=\"str\">\"Similarity\
    \ (king, apple):\", cosine_similarity(embeddings[\"king\"], embeddings[\"apple\"\
    </span>]))\n\n<span class=\"cm\"># Analogy vector: target = king - man + woman</span>\n\
    target = embeddings[<span class=\"str\">\"king\"] - embeddings[\"man\"] + embeddings[\"\
    woman\"</span>]\n\n<span class=\"cm\"># Query closest vectors</span>\nbest_word,\
    \ best_sim = <span class=\"kw\">None</span>, -<span class=\"num\">1.0</span>\n\
    <span class=\"kw\">for</span> word, vec <span class=\"kw\">in</span> embeddings.<span\
    \ class=\"fn\">items</span>():\n    <span class=\"kw\">if</span> word <span class=\"\
    kw\">in</span> [<span class=\"str\">\"king\", \"man\", \"woman\"</span>]:\n  \
    \      <span class=\"kw\">continue</span>\n    sim = <span class=\"fn\">cosine_similarity</span>(target,\
    \ vec)\n    <span class=\"kw\">if</span> sim &gt; best_sim:\n        best_sim\
    \ = sim\n        best_word = word\n\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"Closest word matching analogy '</span>king - man + woman<span class=\"\
    str\">': {best_word} (similarity: {best_sim:.4f})\"</span>)</pre>\n</div>\n\n\
    <h2 class=\"sh2\">\n       \U0001F6E0 Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size:\
