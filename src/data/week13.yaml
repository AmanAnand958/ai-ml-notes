  tasks:
  - title: Build a TF-IDF vectoriser from scratch in NumPy
    badge: Hard · 3 hrs
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n          Build a raw TF-IDF vectoriser using NumPy:\n    \
      \      <br/>\n          1. Process a mock list of 5 text strings, tokenise them,\
      \ and build the full vocabulary.\n          <br/>\n          2. Calculate local\
      \ Term Frequencies (TF) for each document.\n          <br/>\n          3. Compute\
      \ Global Document Frequencies (DF) and Inverse Document Frequencies (IDF) incorporating\
      \ smoothing.\n          <br/>\n          4. Generate the final sparse representations\
      \ matrix. Compare your NumPy matrix against Scikit-Learn's output.\n       \
      \  </p>"
    done_when: Your numpy matrix outputs exact numeric values corresponding directly
      to Scikit-Learn TfidfVectorizer default formulas without relying on sklearn
      imports.
    git_cmd: 'git add . &amp;&amp; git commit -m "day88: complete day 88 tasks and
      coding exercises"'
    sol_id: sol-w13t3
    solution_title: ✅ COMPLETE SOLUTION — build_a_tf_idf_vectoriser_from_scratch_i.py
    solution_code: "<span class=\"cm\"># build_a_tf_idf_vectoriser_from_scratch_i.py\
      \ — Solution</span>\n<span class=\"cm\"># Complete solution for: Build a TF-IDF\
      \ vectoriser from scratch in NumPy</span>\n\n<span class=\"kw\">import</span>\
      \ numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">from</span> collections\
      \ <span class=\"kw\">import</span> Counter\n<span class=\"kw\">import</span>\
      \ math\n\n<span class=\"kw\">class</span> <span class=\"cls\">TFIDFVectorizer</span>:\n\
      \    <span class=\"str\">\"\"\"TF-IDF Vectorizer from scratch using NumPy.\"\
      \"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span\
      \ class=\"kw\">self</span>):\n        <span class=\"kw\">self</span>.vocabulary_\
      \ = {}\n        <span class=\"kw\">self</span>.idf_ = <span class=\"kw\">None</span>\n\
      \    \n    <span class=\"kw\">def</span> <span class=\"fn\">_tokenize</span>(<span\
      \ class=\"kw\">self</span>, text):\n        <span class=\"str\">\"\"\"Simple\
      \ whitespace + lowercase tokenization.\"\"\"</span>\n        <span class=\"\
      kw\">return</span> text.<span class=\"fn\">lower</span>().<span class=\"fn\"\
      >split</span>()\n    \n    <span class=\"kw\">def</span> <span class=\"fn\"\
      >fit</span>(<span class=\"kw\">self</span>, documents):\n        <span class=\"\
      str\">\"\"\"Build vocabulary and compute IDF.\"\"\"</span>\n        <span class=\"\
      cm\"># Build vocabulary</span>\n        vocab = <span class=\"fn\">set</span>()\n\
      \        <span class=\"kw\">for</span> doc <span class=\"kw\">in</span> documents:\n\
      \            vocab.<span class=\"fn\">update</span>(<span class=\"kw\">self</span>.<span\
      \ class=\"fn\">_tokenize</span>(doc))\n        <span class=\"kw\">self</span>.vocabulary_\
      \ = {word: i <span class=\"kw\">for</span> i, word <span class=\"kw\">in</span>\
      \ <span class=\"fn\">enumerate</span>(<span class=\"fn\">sorted</span>(vocab))}\n\
      \        \n        <span class=\"cm\"># Compute IDF: log(N / df(t)) + 1 (smooth\
      \ IDF)</span>\n        N = <span class=\"fn\">len</span>(documents)\n      \
      \  df = np.<span class=\"fn\">zeros</span>(<span class=\"fn\">len</span>(<span\
      \ class=\"kw\">self</span>.vocabulary_))\n        <span class=\"kw\">for</span>\
      \ doc <span class=\"kw\">in</span> documents:\n            seen = <span class=\"\
      fn\">set</span>(<span class=\"kw\">self</span>.<span class=\"fn\">_tokenize</span>(doc))\n\
      \            <span class=\"kw\">for</span> word <span class=\"kw\">in</span>\
      \ seen:\n                <span class=\"kw\">if</span> word <span class=\"kw\"\
      >in</span> <span class=\"kw\">self</span>.vocabulary_:\n                   \
      \ df[<span class=\"kw\">self</span>.vocabulary_[word]] += <span class=\"num\"\
      >1</span>\n        \n        <span class=\"kw\">self</span>.idf_ = np.<span\
      \ class=\"fn\">log</span>(N / (df + <span class=\"num\">1</span>)) + <span class=\"\
      num\">1</span>  <span class=\"cm\"># Smooth IDF</span>\n        <span class=\"\
      kw\">return</span> <span class=\"kw\">self</span>\n    \n    <span class=\"\
      kw\">def</span> <span class=\"fn\">transform</span>(<span class=\"kw\">self</span>,\
      \ documents):\n        <span class=\"str\">\"\"\"Convert documents to TF-IDF\
      \ matrix.\"\"\"</span>\n        matrix = np.<span class=\"fn\">zeros</span>((<span\
      \ class=\"fn\">len</span>(documents), <span class=\"fn\">len</span>(<span class=\"\
      kw\">self</span>.vocabulary_)))\n        \n        <span class=\"kw\">for</span>\
      \ i, doc <span class=\"kw\">in</span> <span class=\"fn\">enumerate</span>(documents):\n\
      \            tokens = <span class=\"kw\">self</span>.<span class=\"fn\">_tokenize</span>(doc)\n\
      \            tf = <span class=\"fn\">Counter</span>(tokens)\n            <span\
      \ class=\"kw\">for</span> word, count <span class=\"kw\">in</span> tf.<span\
      \ class=\"fn\">items</span>():\n                <span class=\"kw\">if</span>\
      \ word <span class=\"kw\">in</span> <span class=\"kw\">self</span>.vocabulary_:\n\
      \                    j = <span class=\"kw\">self</span>.vocabulary_[word]\n\
      \                    matrix[i, j] = (count / <span class=\"fn\">len</span>(tokens))\
      \ * <span class=\"kw\">self</span>.idf_[j]\n        \n        <span class=\"\
      cm\"># L2 normalize</span>\n        norms = np.linalg.<span class=\"fn\">norm</span>(matrix,\
      \ axis=<span class=\"num\">1</span>, keepdims=<span class=\"kw\">True</span>)\n\
      \        norms[norms == <span class=\"num\">0</span>] = <span class=\"num\"\
      >1</span>\n        matrix /= norms\n        \n        <span class=\"kw\">return</span>\
      \ matrix\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">fit_transform</span>(<span\
      \ class=\"kw\">self</span>, documents):\n        <span class=\"kw\">return</span>\
      \ <span class=\"kw\">self</span>.<span class=\"fn\">fit</span>(documents).<span\
      \ class=\"fn\">transform</span>(documents)\n\n<span class=\"cm\"># Test</span>\n\
      docs = [\n    <span class=\"str\">\"the cat sat on the mat\"</span>,\n    <span\
      \ class=\"str\">\"the dog sat on the log\"</span>,\n    <span class=\"str\"\
      >\"cats and dogs are friends\"</span>,\n]\nvectorizer = <span class=\"fn\">TFIDFVectorizer</span>()\n\
      tfidf = vectorizer.<span class=\"fn\">fit_transform</span>(docs)\n<span class=\"\
      fn\">print</span>(<span class=\"str\">f\"Shape: {tfidf.shape}\"</span>)\n<span\
      \ class=\"fn\">print</span>(<span class=\"str\">f\"Vocab size: {len(vectorizer.vocabulary_)}\"\
      </span>)\n\n<span class=\"cm\"># Cosine similarity between doc 0 and doc 1</span>\n\
      sim = np.<span class=\"fn\">dot</span>(tfidf[<span class=\"num\">0</span>],\
      \ tfidf[<span class=\"num\">1</span>])\n<span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Similarity(doc0, doc1): {sim:.4f}\"</span>)  <span class=\"\
      cm\"># High (both about animals sitting)</span>\nsim2 = np.<span class=\"fn\"\
      >dot</span>(tfidf[<span class=\"num\">0</span>], tfidf[<span class=\"num\">2</span>])\n\
      <span class=\"fn\">print</span>(<span class=\"str\">f\"Similarity(doc0, doc2):\
      \ {sim2:.4f}\"</span>)  <span class=\"cm\"># Lower</span>\n\n<span class=\"\
      kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n    <span\
      \ class=\"fn\">solve</span>()"
