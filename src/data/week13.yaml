- id: '92'
  day_num: 92
  title: 'Capstone Part 1: Fake News & TextRank'
  subtitle: "Today, we launch the massiveMonth 4 NLP Capstone Project: Advanced News\
    \ Analytics Engine.\n      This major engineering project is split into two phases:\
    \ text verification (Fake News Detection) and semantic extraction (Extractive\
    \ Summarisation).\n      We will analyze the mathematics of theTextRank Graph\
    \ Centrality Algorithm, build a sentence cosine-similarity adjacency matrix from\
    \ scratch in NumPy, and construct a fake news classifier pipeline."
  time_estimate: 6 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Implement a TF-IDF text preprocessing and classification pipeline for fake news
    verification.
  - Deconstruct the PageRank-based TextRank algorithm for sentence score convergence.
  - Formulate and build a sentence similarity adjacency matrix using overlap and cosine
    statistics.
  - Program a complete, self-contained Extractive Summariser from scratch in Python
    using pure NumPy.
  checklist:
  - id: chk_92_1
    text: 'Study the core mathematical and architectural principles of Capstone Part
      1: Fake News & TextRank'
  - id: chk_92_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_92_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_92_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - NLP Preprocessing Pipelin
  - 'Text Representation: BoW'
  - 'Word Embeddings: Word2Vec'
  - Named Entity Recognition
  - Text Classification & Seq
  - 'Capstone Part 1: Fake New'
  - 'Capstone Part 2: Gradio &'
  hinglish: 'Summarization: extractive (important sentences select karo) ya abstractive
    (naye sentences generate karo). GPT models abstractive summarization bahut achhi
    karte hain!'
  analogy: TextRank extractive summariser bilkul ek group meeting me leaders chunne
    ki tarah hai. Har sentence ek employee hai. Agar sentence A aur sentence B ke
    beech aapas me ideas match karte hain (high overlap similarity), to wo ek dusre
    ko appreciate (vote) karte hain. PageRank centrality loop chala kar hum ye dekhte
    hain ki kis worker ko sabse zyada authoritative votes (idea overlap points) mile
    hain, aur usi popular lead worker (top ranked sentence) ko hum pure discussion
    ka summary head ghoshit kar dete hain.
  theory_html: "<h3 class=\"sh3\">\n       1. Fake News Detection Pipeline\n     \
    \ </h3>\n<p>\n       The first pillar of our News Analytics Engine verifies text\
    \ authenticity.\n    Fake news articles often exhibit high emotional bias, specific\
    \ vocabulary distributions, and repetitive punctuation.\n    We convert the raw\
    \ article body into structural features using\n       \n        TfidfVectorizer\n\
    \       \n       (capturing bigrams and tuning parameters) and train a regularised\
    \ linear classifier.\n    This establishes our baseline validation accuracy prior\
    \ to deep sequential modeling.\n      </p>\n<h3 class=\"sh3\">\n       2. TextRank:\
    \ Graph Centrality for Sentences\n      </h3>\n<p>\n       Unlike abstractive\
    \ summarisation (which generates new text),\n       <strong>\n        Extractive\
    \ Summarisation\n       </strong>\n       ranks existing sentences and extracts\
    \ the top candidates.\n       <strong>\n        TextRank\n       </strong>\n \
    \      (Mihalcea &amp; Tarau, 2004) frames a document as a graph where each sentence\
    \ $S_i$ is a vertex.\n    An edge's weight represents the semantic\n       <strong>\n\
    \        similarity\n       </strong>\n       between sentences $S_i$ and $S_j$.\n\
    \    The dynamic PageRank centrality score for sentence $S_i$ is iteratively computed\
    \ as:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n    \
    \    $$\\text{Score}(S_i) = (1 - d) + d \\sum_{j \\in \\text{In}(S_i)} \\frac{\\\
    text{Similarity}(S_i, S_j)}{\\sum_{k \\in \\text{Out}(S_j)} \\text{Similarity}(S_k,\
    \ S_j)}$$\n       </span>\n<span class=\"desc\">\n        Where $d$ is the damping\
    \ factor (typically set to 0.85) representing the probability of a reader randomly\
    \ jumping to another sentence, and $\\text{Similarity}(S_i, S_j)$ is the edge\
    \ weight.\n       </span>\n</div>\n<h3 class=\"sh3\">\n       3. Sentence Similarity\
    \ Adjacency Formulation\n      </h3>\n<p>\n       The similarity score between\
    \ two sentences $S_i$ and $S_j$ is calculated based on the overlap of their token\
    \ vocabularies, normalized by length to prevent bias toward long sentences:\n\
    \      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$\\\
    text{Similarity}(S_i, S_j) = \\frac{|\\{w \\mid w \\in S_i \\ \\&amp; \\ w \\\
    in S_j\\}|}{\\log(|S_i|) + \\log(|S_j|)}$$\n       </span>\n<span class=\"desc\"\
    >\n        Word overlap similarity. Alternatively, we can use the cosine similarity\
    \ of their dense sentence embeddings.\n       </span>\n</div>\n<h3 class=\"sh3\"\
    >\n       4. TextRank Summariser from Scratch\n      </h3>\n<p>\n       Let's\
    \ write a complete, self-contained Python script implementing the entire TextRank\
    \ Extractive Summarisation engine from scratch using NumPy:\n      </p>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\
    \ — textrank_summarizer.py\n        </span>\n<div class=\"cb-btns\">\n<button\
    \ class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n\
    <button class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\"\
    >\n          Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\"\
    >import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span>\
    \ re\n\n<span class=\"kw\">def</span> <span class=\"fn\">sentence_similarity</span>(sent1,\
    \ sent2):\n    <span class=\"cm\"># Tokenise words by splitting on non-alphanumeric\
    \ characters</span>\n    words1 = <span class=\"fn\">set</span>(re.<span class=\"\
    fn\">findall</span>(r<span class=\"str\">\"\\w+\"</span>, sent1.<span class=\"\
    fn\">lower</span>()))\n    words2 = <span class=\"fn\">set</span>(re.<span class=\"\
    fn\">findall</span>(r<span class=\"str\">\"\\w+\"</span>, sent2.<span class=\"\
    fn\">lower</span>()))\n    \n    <span class=\"kw\">if</span> <span class=\"fn\"\
    >len</span>(words1) == <span class=\"num\">0</span> <span class=\"kw\">or</span>\
    \ <span class=\"fn\">len</span>(words2) == <span class=\"num\">0</span>:\n   \
    \     <span class=\"kw\">return</span> <span class=\"num\">0.0</span>\n      \
    \  \n    overlap = <span class=\"fn\">len</span>(words1.<span class=\"fn\">intersection</span>(words2))\n\
    \    <span class=\"cm\"># Symmetric log normalisation</span>\n    denominator\
    \ = np.<span class=\"fn\">log</span>(<span class=\"fn\">len</span>(words1) + <span\
    \ class=\"num\">1e-5</span>) + np.<span class=\"fn\">log</span>(<span class=\"\
    fn\">len</span>(words2) + <span class=\"num\">1e-5</span>)\n    <span class=\"\
    kw\">return</span> overlap / (denominator + <span class=\"num\">1e-5</span>)\n\
    \n<span class=\"kw\">def</span> <span class=\"fn\">extract_summary</span>(text,\
    \ num_sentences=<span class=\"num\">2</span>, max_iter=<span class=\"num\">50</span>,\
    \ d=<span class=\"num\">0.85</span>):\n    <span class=\"cm\"># 1. Split text\
    \ into clean sentences</span>\n    sentences = [s.<span class=\"fn\">strip</span>()\
    \ <span class=\"kw\">for</span> s <span class=\"kw\">in</span> re.<span class=\"\
    fn\">split</span>(r<span class=\"str\">\"[.!?]\", text) if s.strip() != \"\"</span>]\n\
    \    n = <span class=\"fn\">len</span>(sentences)\n    <span class=\"kw\">if</span>\
    \ n &lt;= num_sentences:\n        <span class=\"kw\">return</span> text\n    \
    \    \n    <span class=\"cm\"># 2. Build similarity adjacency matrix</span>\n\
    \    similarity_matrix = np.<span class=\"fn\">zeros</span>((n, n))\n    <span\
    \ class=\"kw\">for</span> i <span class=\"kw\">in</span> <span class=\"fn\">range</span>(n):\n\
    \        <span class=\"kw\">for</span> j <span class=\"kw\">in</span> <span class=\"\
    fn\">range</span>(n):\n            <span class=\"kw\">if</span> i != j:\n    \
    \            similarity_matrix[i][j] = <span class=\"fn\">sentence_similarity</span>(sentences[i],\
    \ sentences[j])\n                \n    <span class=\"cm\"># 3. Normalise row transitions\
    \ to represent Markov jump dynamics</span>\n    <span class=\"kw\">for</span>\
    \ i <span class=\"kw\">in</span> <span class=\"fn\">range</span>(n):\n       \
    \ row_sum = np.<span class=\"fn\">sum</span>(similarity_matrix[i])\n        <span\
    \ class=\"kw\">if</span> row_sum &gt; <span class=\"num\">0</span>:\n        \
    \    similarity_matrix[i] /= row_sum\n\n    <span class=\"cm\"># 4. Power iteration\
    \ convergence loop</span>\n    scores = np.<span class=\"fn\">ones</span>(n) /\
    \ n\n    <span class=\"kw\">for</span> _ <span class=\"kw\">in</span> <span class=\"\
    fn\">range</span>(max_iter):\n        new_scores = (num_sentences - d) + d * similarity_matrix.T.<span\
    \ class=\"fn\">dot</span>(scores)\n        <span class=\"kw\">if</span> np.<span\
    \ class=\"fn\">allclose</span>(scores, new_scores, atol=<span class=\"num\">1e-5</span>):\n\
    \            <span class=\"kw\">break</span>\n        scores = new_scores\n\n\
    \    <span class=\"cm\"># 5. Extract top ranked sentences</span>\n    ranked_indices\
    \ = np.<span class=\"fn\">argsort</span>(scores)[::-<span class=\"num\">1</span>]\n\
    \    top_indices = <span class=\"fn\">sorted</span>(ranked_indices[:num_sentences])\n\
    \    summary = <span class=\"str\">\". \".join([sentences[idx] for idx in top_indices])\
    \ + \".\"</span>\n    <span class=\"kw\">return</span> summary\n\n<span class=\"\
    cm\"># Test our from-scratch summariser</span>\ndocument = <span class=\"str\"\
    >\"The stock market experienced a huge surge in major tech shares. Tech earnings\
    \ beat all Wall Street projections, and stock options climb. The Federal Reserve\
    \ decided to hike interest rates by 25 basis points because of rising inflation\
    \ metrics. Central banks are planning to implement stricter fiscal controls. Stricter\
    \ regulation slows down small business expansion.\"</span>\nsummary_text = <span\
