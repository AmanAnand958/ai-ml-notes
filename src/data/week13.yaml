- id: '88'
  day_num: 88
  title: 'Text Representation: BoW & TF-IDF'
  subtitle: "Machine learning models cannot directly process text tokens; they require\
    \ numerical vectors.\n      Today, we master two fundamental text vectorisation\
    \ methodologies:Bag of Words (BoW)andTerm Frequency-Inverse Document Frequency\
    \ (TF-IDF).\n      We will study their mathematical formulations, analyze the\
    \ curse of dimensionality in sparse representations, and implement an industrial-grade\
    \ news classifier using Scikit-Learn."
  time_estimate: 5 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Explain the Bag of Words matrix formulation and how vocabulary size impacts sparseness.
  - Formulate and calculate the exact Term Frequency (TF) and Inverse Document Frequency
    (IDF) scaling equations.
  - Analyze the computational limitations of sparse bag-of-words vectors compared
    to dense word vectors.
  - Construct and benchmark a text news classifier using TF-IDF and L2-regularised
    Logistic Regression.
  - Formulate and execute Latent Semantic Analysis (LSA) using Singular Value Decomposition
    (SVD).
  checklist:
  - id: chk_88_1
