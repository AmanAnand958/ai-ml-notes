  theory_html: "<h3 class=\"sh3\">\n       1. Web Architecture: Gradio Blocks API\n\
    \      </h3>\n<p>\n       Standard Gradio interfaces are highly rigid, offering\
    \ simple input-output layouts.\n       <strong>\n        Gradio Blocks\n     \
    \  </strong>\n       allows us to write structured web applications using layout\
    \ components like\n       \n        gr.Tab\n       \n       ,\n       \n     \
    \   gr.Row\n       \n       , and\n       \n        gr.Column\n       \n     \
    \  .\n    This lets us manage state, trigger complex callbacks, and apply custom\
    \ styling properties to individual elements.\n      </p>\n<h3 class=\"sh3\">\n\
    \       2. Execution Latency vs. Model Size Tradeoffs\n      </h3>\n<p>\n    \
    \   Deploying NLP pipelines requires balancing accuracy against inference latency:\n\
    \      </p>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem\
    \ 0; width: 100%;\"><table class=\"concept-table\">\n<thead>\n<tr>\n<th>\n   \
    \       Model Architecture\n         </th>\n<th>\n          Parameter Size\n \
    \        </th>\n<th>\n          Inference Latency (per document)\n         </th>\n\
    <th>\n          Classification F1-Score\n         </th>\n</tr>\n</thead>\n<tbody>\n\
    <tr>\n<td>\n<strong>\n           TF-IDF + Logistic Regression\n          </strong>\n\
    </td>\n<td>\n          ~10k weights\n         </td>\n<td>\n          ~0.8 milliseconds\
    \ (CPU)\n         </td>\n<td>\n          ~86.2%\n         </td>\n</tr>\n<tr>\n\
    <td>\n<strong>\n           Word2Vec + Bidirectional LSTM\n          </strong>\n\
    </td>\n<td>\n          ~2.5 million weights\n         </td>\n<td>\n          ~12.4\
    \ milliseconds (CPU) / ~1.5ms (GPU)\n         </td>\n<td>\n          ~91.8%\n\
    \         </td>\n</tr>\n<tr>\n<td>\n<strong>\n           Pre-trained BERT-Base\
    \ Transformer\n          </strong>\n</td>\n<td>\n          ~110 million weights\n\
    \         </td>\n<td>\n          ~142.1 milliseconds (CPU) / ~8.2ms (GPU)\n  \
    \       </td>\n<td>\n          ~96.5%\n         </td>\n</tr>\n</tbody>\n</table></div>\n\
    <p>\n       For news agencies processing millions of feeds, TF-IDF + Logistic\
    \ baseline models are often preferred due to lower CPU memory footprints and fast\
    \ execution speeds, keeping compute costs low.\n      </p>\n<h3 class=\"sh3\"\
    >\n       3. Production Gradio Application\n      </h3>\n<p>\n       Let's write\
    \ a complete, self-contained python script implementing the entire Gradio web\
    \ dashboard:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         python — app.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> gradio <span class=\"kw\">as</span> gr\n<span class=\"\
    kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span>\
    \ re\n\n<span class=\"cm\"># 1. From-scratch TextRank Extractive Summariser</span>\n\
    <span class=\"kw\">def</span> <span class=\"fn\">sentence_similarity</span>(sent1,\
    \ sent2):\n    words1 = <span class=\"fn\">set</span>(re.<span class=\"fn\">findall</span>(r<span\
    \ class=\"str\">\"\\w+\"</span>, sent1.<span class=\"fn\">lower</span>()))\n \
    \   words2 = <span class=\"fn\">set</span>(re.<span class=\"fn\">findall</span>(r<span\
    \ class=\"str\">\"\\w+\"</span>, sent2.<span class=\"fn\">lower</span>()))\n \
    \   <span class=\"kw\">if</span> <span class=\"fn\">len</span>(words1) == <span\
    \ class=\"num\">0</span> <span class=\"kw\">or</span> <span class=\"fn\">len</span>(words2)\
    \ == <span class=\"num\">0</span>:\n        <span class=\"kw\">return</span> <span\
    \ class=\"num\">0.0</span>\n    overlap = <span class=\"fn\">len</span>(words1.<span\
    \ class=\"fn\">intersection</span>(words2))\n    denominator = np.<span class=\"\
    fn\">log</span>(<span class=\"fn\">len</span>(words1) + <span class=\"num\">1e-5</span>)\
    \ + np.<span class=\"fn\">log</span>(<span class=\"fn\">len</span>(words2) + <span\
    \ class=\"num\">1e-5</span>)\n    <span class=\"kw\">return</span> overlap / (denominator\
    \ + <span class=\"num\">1e-5</span>)\n\n<span class=\"kw\">def</span> <span class=\"\
    fn\">textrank_summarize</span>(text, num_sentences):\n    sentences = [s.<span\
    \ class=\"fn\">strip</span>() <span class=\"kw\">for</span> s <span class=\"kw\"\
    >in</span> re.<span class=\"fn\">split</span>(r<span class=\"str\">\"[.!?]\",\
    \ text) if s.strip() != \"\"</span>]\n    n = <span class=\"fn\">len</span>(sentences)\n\
    \    <span class=\"kw\">if</span> n &lt;= num_sentences:\n        <span class=\"\
    kw\">return</span> text\n        \n    similarity_matrix = np.<span class=\"fn\"\
    >zeros</span>((n, n))\n    <span class=\"kw\">for</span> i <span class=\"kw\"\
    >in</span> <span class=\"fn\">range</span>(n):\n        <span class=\"kw\">for</span>\
    \ j <span class=\"kw\">in</span> <span class=\"fn\">range</span>(n):\n       \
    \     <span class=\"kw\">if</span> i != j:\n                similarity_matrix[i][j]\
    \ = <span class=\"fn\">sentence_similarity</span>(sentences[i], sentences[j])\n\
    \                \n    <span class=\"kw\">for</span> i <span class=\"kw\">in</span>\
    \ <span class=\"fn\">range</span>(n):\n        row_sum = np.<span class=\"fn\"\
    >sum</span>(similarity_matrix[i])\n        <span class=\"kw\">if</span> row_sum\
    \ &gt; <span class=\"num\">0</span>:\n            similarity_matrix[i] /= row_sum\n\
    \n    scores = np.<span class=\"fn\">ones</span>(n) / n\n    <span class=\"kw\"\
    >for</span> _ <span class=\"kw\">in</span> <span class=\"fn\">range</span>(<span\
    \ class=\"num\">50</span>):\n        new_scores = (<span class=\"num\">1</span>\
    \ - <span class=\"num\">0.85</span>) + <span class=\"num\">0.85</span> * similarity_matrix.T.<span\
    \ class=\"fn\">dot</span>(scores)\n        <span class=\"kw\">if</span> np.<span\
    \ class=\"fn\">allclose</span>(scores, new_scores, atol=<span class=\"num\">1e-5</span>):\n\
    \            <span class=\"kw\">break</span>\n        scores = new_scores\n\n\
    \    ranked_indices = np.<span class=\"fn\">argsort</span>(scores)[::-<span class=\"\
    num\">1</span>]\n    top_indices = <span class=\"fn\">sorted</span>(ranked_indices[:num_sentences])\n\
    \    <span class=\"kw\">return</span> <span class=\"str\">\". \".join([sentences[idx]\
    \ for idx in top_indices]) + \" .\"</span>\n\n<span class=\"cm\"># 2. Mock Fake\
    \ News Detector (Linear model simulation)</span>\n<span class=\"kw\">def</span>\
    \ <span class=\"fn\">detect_fake_news</span>(text):\n    words = text.<span class=\"\
    fn\">lower</span>().<span class=\"fn\">split</span>()\n    <span class=\"kw\"\
    >if</span> <span class=\"fn\">len</span>(words) &lt; <span class=\"num\">5</span>:\n\
    \        <span class=\"kw\">return</span> <span class=\"str\">\"Invalid text length\"\
    </span>, <span class=\"num\">0.0</span>\n        \n    <span class=\"cm\"># Simple\
    \ rules-based scoring proxy simulating linear coefficients</span>\n    clickbait_words\
    \ = [<span class=\"str\">\"shocking\", \"unbelievable\", \"secret\", \"conspiracy\"\
    , \"scam\"</span>]\n    count = <span class=\"fn\">sum</span>(<span class=\"num\"\
