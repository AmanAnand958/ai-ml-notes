    \    </div>\n<h3 style=\"font-family:var(--font-head); font-size:14px; margin-bottom:0.5rem;\
    \ color:var(--pink);\">\n        Debug: TF-IDF Input Type Mismatch\n       </h3>\n\
    <p style=\"font-size:13px; margin-bottom:0.8rem; line-height:1.6;\">\n       \
    \ The Scikit-learn TF-IDF Vectorizer throws an attribute error when passing pre-tokenized\
    \ documents during fitting.\n       </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n          python\n         </span>\n<div class=\"\
