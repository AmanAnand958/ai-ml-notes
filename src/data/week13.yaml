  hinglish: 'Sequence labeling mein BIO tagging scheme common hai: B-PER (beginning
    of person), I-PER (inside), O (outside entity). CRF layer sequence dependencies
    capture karta hai transitions mein!'
  analogy: Named Entity Recognition (NER) bilkul ek digital security checker ki tarah
    hai jo kisi boarding pass se details extract karta hai. Jab aap pass dekhte hain,
    to poore text me se security checker ka focus sirf 'PERSON' (yaani passenger ka
    naam), 'GPE' (yaani flight ki destination), aur 'DATE' (yaani departure time)
    par hota hai. Poori context string me se aisi valuable elements ko filter karke
    unka data sheet banana hi NER ka asly kaam hai.
  theory_html: "<h3 class=\"sh3\">\n       1. Syntactic Foundations: POS Tagging\n\
    \      </h3>\n<p>\n<strong>\n        Part-of-Speech (POS) Tagging\n       </strong>\n\
    \       labels each token with its grammatical category based on context.\n  \
    \  Modern systems employ two layer granularities:\n      </p>\n<ul class=\"prose-list\"\
    >\n<li>\n<strong>\n         Universal POS (UPOS):\n        </strong>\n       \
    \ Broad categories (e.g.\n        \n         NOUN\n        \n        ,\n     \
    \   \n         VERB\n        \n        ,\n        \n         ADJ\n        \n \
    \       ,\n        \n         ADV\n        \n        ).\n       </li>\n<li>\n\
    <strong>\n         Penn Treebank Tags (XPOS):\n        </strong>\n        Detailed\
    \ features (e.g.\n        \n         VBD\n        \n        for past tense verbs,\n\
    \        \n         VBG\n        \n        for present participle gerunds).\n\
    \       </li>\n</ul>\n<p>\n       This allows models to disambiguate homonyms.\
    \ For example, in\n       \n        \"She will bank the check\"\n       \n   \
    \    ,\n       \n        \"bank\"\n       \n       is labeled as a\n       \n\
    \        VERB\n       \n       , whereas in\n       \n        \"She walked to\
    \ the bank\"\n       \n       , it is labeled as a\n       \n        NOUN\n  \
    \     \n       .\n      </p>\n<h3 class=\"sh3\">\n       2. Named Entity Recognition\
    \ (NER) &amp; BIO Formatting\n      </h3>\n<p>\n<strong>\n        Named Entity\
    \ Recognition (NER)\n       </strong>\n       identifies and classifies spans\
    \ of text representing real-world entities.\n    Because entities can consist\
    \ of multiple tokens (e.g.,\n       \n        \"Google Inc.\"\n       \n     \
    \  ), models represent boundaries using\n       <strong>\n        BIO Tagging\n\
    \       </strong>\n       (Begin, Inside, Outside):\n      </p>\n<div class=\"\
    table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table\
    \ class=\"concept-table\">\n<thead>\n<tr>\n<th>\n          Token\n         </th>\n\
    <th>\n          BIO Tag\n         </th>\n<th>\n          Entity Type\n       \
    \  </th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n          Google\n         </td>\n\
    <td>\n          B-ORG\n         </td>\n<td>\n          Organisation (Start)\n\
    \         </td>\n</tr>\n<tr>\n<td>\n          Inc.\n         </td>\n<td>\n   \
    \       I-ORG\n         </td>\n<td>\n          Organisation (Continue)\n     \
    \    </td>\n</tr>\n<tr>\n<td>\n          announced\n         </td>\n<td>\n   \
    \       O\n         </td>\n<td>\n          Outside entity boundaries\n       \
    \  </td>\n</tr>\n<tr>\n<td>\n          new\n         </td>\n<td>\n          O\n\
    \         </td>\n<td>\n          Outside entity boundaries\n         </td>\n</tr>\n\
    <tr>\n<td>\n          AI\n         </td>\n<td>\n          O\n         </td>\n\
    <td>\n          Outside entity boundaries\n         </td>\n</tr>\n<tr>\n<td>\n\
    \          chips\n         </td>\n<td>\n          O\n         </td>\n<td>\n  \
    \        Outside entity boundaries\n         </td>\n</tr>\n<tr>\n<td>\n      \
    \    in\n         </td>\n<td>\n          O\n         </td>\n<td>\n          Outside\
    \ entity boundaries\n         </td>\n</tr>\n<tr>\n<td>\n          California\n\
    \         </td>\n<td>\n          B-GPE\n         </td>\n<td>\n          Geo-Political\
    \ Entity (Start)\n         </td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"\
    sh3\">\n       3. Dependency Parsing Structures\n      </h3>\n<p>\n<strong>\n\
    \        Dependency Parsing\n       </strong>\n       maps the structural relationships\
    \ between words to capture how information flows.\n    A root verb acts as the\
    \ head, and other tokens attach via typed links like\n       \n        nsubj\n\
    \       \n       (nominal subject),\n       \n        dobj\n       \n       (direct\
    \ object), and\n       \n        amod\n       \n       (adjectival modifier).\n\
    \    This lets us extract exact actions: who did what to whom.\n      </p>\n<p>\n\
    \       Let's inspect the visual topological dependency tree for the sentence:\n\
    \       <em>\n        \"The developer acquires a startup in India.\"\n       </em>\n\
    </p>\n<div class=\"math-block\" style=\"font-family:var(--font-mono); font-size:12px;\
    \ line-height:1.5; color:var(--green); background:#080a0e;\">\n<pre>\n       +-----------&gt;\
    \ [acquires] (VERB - ROOT) &lt;---------+\n       |                  |       \
    \                      |\n       | (nsubj)          | (dobj)                 \
    \     | (prep)\n       |                  v                             v\n  [developer]\
    \         [startup]                      [<span class=\"kw\">in</span>] (ADP)\n\
    \  (NOUN)              (NOUN)                            |\n       |         \
    \         |                             | (pobj)\n       | (det)            |\
    \ (det)                       v\n       v                  v                 \
    \         [India] (PROPN)\n     [The]               [a]\n</pre>\n</div>\n<h3 class=\"\
    sh3\">\n       4. Custom Pipeline Components in spaCy\n      </h3>\n<p>\n    \
    \   Let's write a python script implementing a custom spaCy extension component\
    \ to extract stock market symbols (tickers) and tag them as custom\n       \n\
    \        TICKER\n       \n       entities:\n      </p>\n<div class=\"cb\">\n<div\
    \ class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — custom_ner_pipeline.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> spacy\n\
    <span class=\"kw\">from</span> spacy.language <span class=\"kw\">import</span>\
    \ Language\n<span class=\"kw\">from</span> spacy.tokens <span class=\"kw\">import</span>\
    \ Span\n\n<span class=\"cm\"># 1. Load standard pre-trained NLP pipeline</span>\n\
    nlp = spacy.<span class=\"fn\">load</span>(<span class=\"str\">\"en_core_web_sm\"\
    </span>)\n\n<span class=\"cm\"># 2. Define custom entity extractor component</span>\n\
    @Language.<span class=\"fn\">component</span>(<span class=\"str\">\"ticker_extractor\"\
    </span>)\n<span class=\"kw\">def</span> <span class=\"fn\">extract_tickers</span>(doc):\n\
    \    words = [t.text <span class=\"kw\">for</span> t <span class=\"kw\">in</span>\
    \ doc]\n    new_ents = []\n    <span class=\"kw\">for</span> i, token <span class=\"\
    kw\">in</span> <span class=\"fn\">enumerate</span>(doc):\n        <span class=\"\
    kw\">if</span> token.text.<span class=\"fn\">startswith</span>(<span class=\"\
    str\">\"$\"</span>) <span class=\"kw\">and</span> token.text[<span class=\"num\"\
    >1</span>:].<span class=\"fn\">isupper</span>() <span class=\"kw\">and</span>\
    \ <span class=\"fn\">len</span>(token.text) &gt; <span class=\"num\">2</span>:\n\
    \            <span class=\"cm\"># Construct a new custom Entity Span</span>\n\
    \            ticker_span = <span class=\"fn\">Span</span>(doc, i, i + <span class=\"\
    num\">1</span>, label=<span class=\"str\">\"TICKER\"</span>)\n            new_ents.<span\
    \ class=\"fn\">append</span>(ticker_span)\n    \n    doc.ents = <span class=\"\
    fn\">list</span>(doc.ents) + new_ents\n    <span class=\"kw\">return</span> doc\n\
    \n<span class=\"cm\"># 3. Add custom component to the pipeline BEFORE the final\
    \ output step</span>\nnlp.<span class=\"fn\">add_pipe</span>(<span class=\"str\"\
    >\"ticker_extractor\"</span>, last=<span class=\"kw\">True</span>)\n\n<span class=\"\
    cm\"># 4. Infer and verify</span>\ntext = <span class=\"str\">\"We are planning\
    \ to invest in $AAPL and $TSLA stock options, situated in California.\"</span>\n\
    doc = <span class=\"fn\">nlp</span>(text)\n\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Entities detected:\"</span>)\n<span class=\"kw\">for</span>\
    \ ent <span class=\"kw\">in</span> doc.ents:\n    <span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Entity: '</span>{ent.text}<span class=\"str\">' | Label: {ent.label_}\"\
    </span>)\n\n<span class=\"fn\">print</span>(<span class=\"str\">\"\\\\nPOS &amp;\
    \ Dependency parse trees:\"</span>)\n<span class=\"kw\">for</span> token <span\
    \ class=\"kw\">in</span> doc:\n    <span class=\"fn\">print</span>(<span class=\"\
    str\">f\"Word: {token.text:&lt;12} | UPOS: {token.pos_:&lt;6} | Dep: {token.dep_:&lt;8}\
    \ | Head: {token.head.text}\"</span>)</pre>\n</div>\n<h3 class=\"sh3\">\n    \
    \   5. Rules-based Phrase Matching using spaCy Matcher\n      </h3>\n<p>\n   \
    \    When Named Entity statistical models fail on highly proprietary terms, we\
    \ leverage spaCy's token-based\n       <strong>\n        Matcher\n       </strong>\n\
    \       engine to build deterministic phrase filters:\n      </p>\n<div class=\"\
    cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — spacy_matcher.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> spacy\n\
    <span class=\"kw\">from</span> spacy.matcher <span class=\"kw\">import</span>\
    \ Matcher\n\nnlp = spacy.<span class=\"fn\">load</span>(<span class=\"str\">\"\
    en_core_web_sm\"</span>)\nmatcher = <span class=\"fn\">Matcher</span>(nlp.vocab)\n\
    \n<span class=\"cm\"># Define a token pattern to match compound entity shapes:\
    \ e.g. \"Gemini Advanced Agentic Coding\"</span>\n<span class=\"cm\"># Rule: Word\
    \ 1 is 'Gemini', Word 2 is optional 'Advanced', Word 3 is 'Agentic', Word 4 is\
    \ 'Coding'</span>\npattern = [\n    {<span class=\"str\">\"LOWER\": \"gemini\"\
    </span>},\n    {<span class=\"str\">\"LOWER\": \"advanced\", \"OP\": \"?\"</span>},\
    \ <span class=\"cm\"># Optional operator \"?\"</span>\n    {<span class=\"str\"\
    >\"LOWER\": \"agentic\"</span>},\n    {<span class=\"str\">\"LOWER\": \"coding\"\
    </span>}\n]\n\nmatcher.<span class=\"fn\">add</span>(<span class=\"str\">\"AI_PRODUCT\"\
    </span>, [pattern])\n\ndoc = <span class=\"fn\">nlp</span>(<span class=\"str\"\
    >\"The team operates under Gemini Advanced Agentic Coding environment successfully.\"\
    </span>)\nmatches = <span class=\"fn\">matcher</span>(doc)\n\n<span class=\"fn\"\
    >print</span>(<span class=\"str\">\"Matcher patterns found:\"</span>)\n<span class=\"\
    kw\">for</span> match_id, start, end <span class=\"kw\">in</span> matches:\n \
    \   string_id = nlp.vocab.strings[match_id]\n    span = doc[start:end]\n    <span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"Match ID: {string_id} | Token\
    \ span indices: ({start}, {end}) | Text: '</span>{span.text}<span class=\"str\"\
    >'\"</span>)</pre>\n</div>\n\n<h2 class=\"sh2\">\n       \U0001F6E0 Tasks\n  \
    \    </h2>\n<div style=\"font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\"\
    >\n       \U0001F50D\n       <strong>\n        Search terms:\n       </strong>\n\
    \n        dependency parsing tree visualization spacy, sentence dependency tree\
    \ extraction python\n       \n</div>"
