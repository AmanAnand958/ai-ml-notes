- id: '89'
  day_num: 89
  title: 'Word Embeddings: Word2Vec & GloVe'
  subtitle: "Sparse representations treat words as isolated points, ignoring semantic\
    \ overlap (e.g. mapping \"run\" and \"running\" orthogonally).\n      Today, we\
    \ masterDense Word Embeddings.\n      We will dissect the mathematical architectures\
    \ ofWord2Vec (CBOW vs Skip-gram), learnNegative Samplingoptimizations, examine\
    \ the global matrix formulations ofGloVe (Global Vectors), and implement custom\
    \ cosine similarity checks."
