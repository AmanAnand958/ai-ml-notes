  quizzes:
  - num_str: Q1 OF 5
    question: What is a primary advantage of Subword Tokenisation over Word Tokenisation?
    qid: q87_1
    options:
    - letter: A
      text: It speeds up forward feedforward layers.
      is_correct: false
    - letter: B
      text: It handles Out-of-Vocabulary (OOV) words by breaking them down into known
        sub-components, preventing null representations.
      is_correct: true
    - letter: C
      text: It limits recursive gradient explosions.
      is_correct: false
    - letter: D
      text: It drops grammatical syntax representations.
      is_correct: false
    correct_fb: ✅ Correct! By breaking rare words into frequent subwords (e.g. "unhappy"
      to ["un", "happy"]), subword tokenisers can model any word, keeping the overall
      vocabulary small and OOV-free.
    wrong_fb: "❌ Think about what happens when a model trained on standard words sees\
      \ a new word like \"PyTorchify\". Word tokenisation marks it as\n         <unk>\n\
      \          . How does subword tokenisation treat it?\n         </unk>"
