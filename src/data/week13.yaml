week_number: 13
title: Natural Language Processing
description: ''
days:
- id: '87'
  day_num: 87
  title: NLP Preprocessing Pipeline
  subtitle: "Natural language text is messy, highly unstructured, and contains infinite\
    \ semantic variations. Before feeding text into mathematical deep learning architectures,\
    \ we must standardise and structure it.\n      Today, we master the completeNLP\
    \ Preprocessing Pipeline. We will examine the mechanics ofTokenisation (Word,\
    \ Sentence, Subword), clean noise usingRegular Expressions (Regex), and compareStemming\
    \ (Porter) against Lemmatisation (spaCy)."
  time_estimate: 5 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Differentiate between word-level, character-level, and subword-level tokenisation
    strategies.
  - Formulate and execute complex regular expressions for text cleaning and URL/handle
    stripping.
  - Compare Stemming algorithms (Porter/Snowball) against dictionary-backed Lemmatisation
    (spaCy).
  - Build a robust, multi-threaded text preprocessing pipeline processing 10,000 tweets.
  - Formulate and calculate the mathematical Levenshtein Distance for spell-checking
    and normalisation.
  checklist:
  - id: chk_87_1
    text: Study the core mathematical and architectural principles of NLP Preprocessing
      Pipeline
  - id: chk_87_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_87_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_87_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - spaCy Pipelines
  - POS Tagging
  - Named Entity Recognition
  - Dependency Parsing
  - TF-IDF Vectors
  - Word2Vec Embeddings
  hinglish: 'Byte-Pair Encoding (BPE) frequency-based merging karta hai: sabse common
    character pairs ek token mein merge hote hain, jab tak vocabulary size target
    tak nahi pohonchti!'
  analogy: Raw NLP preprocessing bilkul ek gehu ki fasal ko saaf karne ki tarah hai.
    Jab gehu kheto se aata hai, usme mitti, kachra aur patthar (URLs, hashtags, HTML
    tags) hote hain. Tokenisation aur cleaning unhe saaf karti hai, aur lemmatisation
    har daane ko uske sabse shuddh form (lemma) me convert karti hai taaki aage chalkar
    hum uska behtareen aata (word vectors) bana sakein. Levenshtein distance spell
    check bilkul usi gehu ke size aur shape ko standard grains se compare karke defective
    pieces ko drop ya filter karne ke samaan hai.
  theory_html: "<h3 class=\"sh3\">\n       1. Tokenisation Taxonomies\n      </h3>\n\
    <p>\n       Tokenisation breaks continuous text strings into individual semantic\
    \ units called\n       <strong>\n        tokens\n       </strong>\n       .\n\
    \    There are three main levels of granularity:\n      </p>\n<ul class=\"prose-list\"\
    >\n<li>\n<strong>\n         Word Tokenisation:\n        </strong>\n        Splits\
    \ text by whitespace and punctuation. Simple but prone to massive vocabularies\
    \ and Out-of-Vocabulary (OOV) issues.\n       </li>\n<li>\n<strong>\n        \
    \ Character Tokenisation:\n        </strong>\n        Breaks text into individual\
    \ letters. Vocabulary is tiny, but sequences become extremely long, losing semantic\
    \ context.\n       </li>\n<li>\n<strong>\n         Subword Tokenisation:\n   \
    \     </strong>\n        (WordPiece, Byte-Pair Encoding) Breaks rare words into\
    \ meaningful sub-units (e.g.\n        \n         \"embeddings\"\n        \n  \
    \      $\\rightarrow$\n        \n         [\"embed\", \"##dings\"]\n        \n\
    \        ). This is the standard in modern LLMs.\n       </li>\n</ul>\n<h3 class=\"\
    sh3\">\n       2. Stemming vs. Lemmatisation\n      </h3>\n<p>\n       To reduce\
    \ vocabulary size, we map different inflectional forms of a word back to a common\
    \ base:\n      </p>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin:\
    \ 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<thead>\n<tr>\n<th>\n\
    \          Feature\n         </th>\n<th>\n          Stemming (e.g. Porter Stemmer)\n\
    \         </th>\n<th>\n          Lemmatisation (e.g. spaCy)\n         </th>\n\
    </tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<strong>\n           Mechanism\n       \
    \   </strong>\n</td>\n<td>\n          Heuristic-based suffix chopping using regular\
    \ patterns.\n         </td>\n<td>\n          Morphological analysis backed by\
    \ lexical databases (WordNet).\n         </td>\n</tr>\n<tr>\n<td>\n<strong>\n\
    \           Output\n          </strong>\n</td>\n<td>\n          Often non-dictionary\
    \ words (e.g.\n          \n           \"studying\"\n          \n          $\\\
    rightarrow$\n          \n           \"studi\"\n          \n          ).\n    \
    \     </td>\n<td>\n          Valid dictionary base words (e.g.\n          \n \
    \          \"better\"\n          \n          $\\rightarrow$\n          \n    \
    \       \"good\"\n          \n          ).\n         </td>\n</tr>\n<tr>\n<td>\n\
    <strong>\n           Speed\n          </strong>\n</td>\n<td>\n          Extremely\
    \ fast (simple regex-like rules).\n         </td>\n<td>\n          Slower (requires\
    \ POS tagging &amp; lookup).\n         </td>\n</tr>\n<tr>\n<td>\n<strong>\n  \
    \         Accuracy\n          </strong>\n</td>\n<td>\n          Low (over-stemming/under-stemming\
    \ issues).\n         </td>\n<td>\n          High (preserves semantic context).\n\
    \         </td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"sh3\">\n       3.\
    \ Porter Stemming Rule Formulation\n      </h3>\n<p>\n       The Porter stemmer\
    \ operates in 5 consecutive phases of replacement rules. For example, Phase 1a\
    \ defines:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n\
    \        $$\\begin{aligned}\n      \\text{SSES} &amp;\\rightarrow \\text{SS} \\\
    quad (\\text{e.g. caresses} \\rightarrow \\text{caress}) \\\\\n      \\text{IES}\
    \ &amp;\\rightarrow \\text{I} \\quad (\\text{e.g. ponies} \\rightarrow \\text{poni})\
    \ \\\\\n      \\text{SS} &amp;\\rightarrow \\text{SS} \\quad (\\text{e.g. caress}\
    \ \\rightarrow \\text{caress}) \\\\\n      \\text{S} &amp;\\rightarrow \\emptyset\
    \ \\quad (\\text{e.g. cats} \\rightarrow \\text{cat})\n    \\end{aligned}$$\n\
    \       </span>\n<span class=\"desc\">\n        Deterministic suffix chopping\
    \ rules.\n       </span>\n</div>\n<h3 class=\"sh3\">\n       4. Levenshtein (Edit)\
    \ Distance Formulation\n      </h3>\n<p>\n       During spell-checking and text\
    \ normalisation, we measure the similarity of two strings $a$ and $b$ using the\n\
    \       <strong>\n        Levenshtein Distance\n       </strong>\n       . The\
    \ distance between $a$ (of length $i$) and $b$ (of length $j$) is calculated using\
    \ the recurrence relation:\n      </p>\n<div class=\"math-block\">\n<span class=\"\
    formula\">\n        $$\\text{lev}_{a,b}(i, j) = \\begin{cases}\n      \\max(i,\
    \ j) &amp; \\text{if } \\min(i, j) = 0, \\\\\n      \\min \\begin{cases}\n   \
    \     \\text{lev}_{a,b}(i-1, j) + 1 \\\\\n        \\text{lev}_{a,b}(i, j-1) +\
    \ 1 \\\\\n        \\text{lev}_{a,b}(i-1, j-1) + [a_i \\neq b_j]\n      \\end{cases}\
    \ &amp; \\text{otherwise.}\n    \\end{cases}$$\n       </span>\n<span class=\"\
    desc\">\n        Where $[a_i \\neq b_j]$ is 0 if characters match, and 1 if they\
    \ differ. This covers insertion, deletion, and substitution operations.\n    \
    \   </span>\n</div>\n<h3 class=\"sh3\">\n       5. Production Python Preprocessing\
    \ Pipeline\n      </h3>\n<p>\n       Let's write a complete, multi-threaded text\
    \ cleaning script using\n       \n        spaCy\n       \n       and\n       \n\
    \        re\n       \n       (regular expressions) to preprocess messy tweets:\n\
    \      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — preprocess_tweets.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> re\n<span class=\"kw\">import</span> spacy\n<span\
    \ class=\"kw\">from</span> concurrent.futures <span class=\"kw\">import</span>\
    \ ThreadPoolExecutor\n\n<span class=\"cm\"># Load efficient small spaCy model,\
    \ disabling heavy parser and NER components</span>\nnlp = spacy.<span class=\"\
    fn\">load</span>(<span class=\"str\">\"en_core_web_sm\", disable=[\"parser\",\
    \ \"ner\"</span>])\n\n<span class=\"kw\">def</span> <span class=\"fn\">clean_raw_text</span>(text):\n\
    \    <span class=\"cm\"># 1. Strip URLs</span>\n    text = re.<span class=\"fn\"\
    >sub</span>(r<span class=\"str\">\"https?://\\S+|www\\.\\S+\", \"\"</span>, text)\n\
    \    <span class=\"cm\"># 2. Strip Twitter handles (@username)</span>\n    text\
    \ = re.<span class=\"fn\">sub</span>(r<span class=\"str\">\"@\\w+\", \"\"</span>,\
    \ text)\n    <span class=\"cm\"># 3. Strip HTML tags</span>\n    text = re.<span\
    \ class=\"fn\">sub</span>(r<span class=\"str\">\"&lt;.*?&gt;\", \"\"</span>, text)\n\
    \    <span class=\"cm\"># 4. Remove extra whitespaces</span>\n    text = re.<span\
    \ class=\"fn\">sub</span>(r<span class=\"str\">\"\\s+\", \" \"</span>, text).<span\
    \ class=\"fn\">strip</span>()\n    <span class=\"kw\">return</span> text.<span\
    \ class=\"fn\">lower</span>()\n\n<span class=\"kw\">def</span> <span class=\"\
    fn\">spacy_preprocess_pipeline</span>(texts):\n    cleaned_corpus = []\n    <span\
    \ class=\"cm\"># Use nlp.pipe for highly optimized batch preprocessing</span>\n\
    \    docs = nlp.<span class=\"fn\">pipe</span>(texts, batch_size=<span class=\"\
    num\">1000</span>, n_process=-<span class=\"num\">1</span>)\n    <span class=\"\
    kw\">for</span> doc <span class=\"kw\">in</span> docs:\n        tokens = [\n \
    \           token.lemma_ <span class=\"kw\">for</span> token <span class=\"kw\"\
    >in</span> doc \n            <span class=\"kw\">if</span> <span class=\"kw\">not</span>\
    \ token.is_stop \n            <span class=\"kw\">and</span> <span class=\"kw\"\
    >not</span> token.is_punct \n            <span class=\"kw\">and</span> token.text.<span\
    \ class=\"fn\">strip</span>() != <span class=\"str\">\"\"</span>\n        ]\n\
    \        cleaned_corpus.<span class=\"fn\">append</span>(<span class=\"str\">\"\
    \ \"</span>.<span class=\"fn\">join</span>(tokens))\n    <span class=\"kw\">return</span>\
    \ cleaned_corpus\n\n<span class=\"cm\"># Validate pipeline</span>\nraw_tweets\
    \ = [\n    <span class=\"str\">\"Check out this amazing NLP tutorial! https://example.com\
    \ @nlp_expert &lt;p&gt;Awesome&lt;/p&gt;\"</span>,\n    <span class=\"str\">\"\
    I am studying advanced embeddings for sequence representations.\"</span>\n]\n\
    cleaned_step = [<span class=\"fn\">clean_raw_text</span>(t) <span class=\"kw\"\
    >for</span> t <span class=\"kw\">in</span> raw_tweets]\nfinal_corpus = <span class=\"\
    fn\">spacy_preprocess_pipeline</span>(cleaned_step)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Final Preprocessed Corpus:\"</span>, final_corpus)</pre>\n</div>\n\
    <h3 class=\"sh3\">\n       6. Advanced Normalisation &amp; Spell Correction via\
    \ edit-distance\n      </h3>\n<p>\n       Below is a pure-NumPy implementation\
    \ of the Levenshtein Distance matrix calculation, illustrating how the dynamic\
    \ programming grid computes optimal transformation alignments between messy inputs\
    \ and target forms:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n\
    <span class=\"cb-lang\">\n         python — levenshtein_matrix.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"cm\"># Step 1: Algorithmic Implementation &amp; Core Transformations</span>\n\
    <span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span\
    \ class=\"kw\">def</span> <span class=\"fn\">levenshtein_distance</span>(seq1,\
    \ seq2):\n    size_x = <span class=\"fn\">len</span>(seq1) + <span class=\"num\"\
    >1</span>\n    size_y = <span class=\"fn\">len</span>(seq2) + <span class=\"num\"\
    >1</span>\n    matrix = np.<span class=\"fn\">zeros</span>((size_x, size_y), dtype=np.int32)\n\
    \    \n    <span class=\"kw\">for</span> x <span class=\"kw\">in</span> <span\
    \ class=\"fn\">range</span>(size_x):\n        matrix[x, <span class=\"num\">0</span>]\
    \ = x\n    <span class=\"kw\">for</span> y <span class=\"kw\">in</span> <span\
    \ class=\"fn\">range</span>(size_y):\n        matrix[<span class=\"num\">0</span>,\
    \ y] = y\n        \n    <span class=\"kw\">for</span> x <span class=\"kw\">in</span>\
    \ <span class=\"fn\">range</span>(<span class=\"num\">1</span>, size_x):\n   \
    \     <span class=\"kw\">for</span> y <span class=\"kw\">in</span> <span class=\"\
    fn\">range</span>(<span class=\"num\">1</span>, size_y):\n            <span class=\"\
    kw\">if</span> seq1[x-<span class=\"num\">1</span>] == seq2[y-<span class=\"num\"\
    >1</span>]:\n                matrix[x, y] = matrix[x-<span class=\"num\">1</span>,\
    \ y-<span class=\"num\">1</span>]\n            <span class=\"kw\">else</span>:\n\
    \                matrix[x, y] = <span class=\"fn\">min</span>(\n             \
    \       matrix[x-<span class=\"num\">1</span>, y] + <span class=\"num\">1</span>,\
    \    <span class=\"cm\"># Deletion</span>\n                    matrix[x, y-<span\
    \ class=\"num\">1</span>] + <span class=\"num\">1</span>,    <span class=\"cm\"\
    ># Insertion</span>\n                    matrix[x-<span class=\"num\">1</span>,\
    \ y-<span class=\"num\">1</span>] + <span class=\"num\">1</span>   <span class=\"\
    cm\"># Substitution</span>\n                )\n    <span class=\"kw\">return</span>\
    \ matrix[size_x-<span class=\"num\">1</span>, size_y-<span class=\"num\">1</span>]\n\
    \n<span class=\"fn\">print</span>(<span class=\"str\">\"Distance between '</span>kitten<span\
    \ class=\"str\">' and '</span>sitting<span class=\"str\">':\", levenshtein_distance(\"\
    kitten\", \"sitting\"</span>))\n<span class=\"fn\">print</span>(<span class=\"\
    str\">\"Distance between '</span>studying<span class=\"str\">' and '</span>studi<span\
    \ class=\"str\">':\", levenshtein_distance(\"studying\", \"studi\"</span>))</pre>\n\
    </div>\n\n<h2 class=\"sh2\">\n       \U0001F6E0 Tasks\n      </h2>\n<div style=\"\
    font-family:var(--font-mono);font-size: 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\"\
    >\n       \U0001F50D\n       <strong>\n        Search terms:\n       </strong>\n\
    \n        spacy custom pipeline components tokenization, nlp.select_pipes disable\
    \ components speed\n       \n</div>"
