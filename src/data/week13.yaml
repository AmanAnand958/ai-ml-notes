    badge: Medium · 2 hrs
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n           Configure an embeddings analytics script:\n    \
      \       <br/>\n           1. Download a pre-trained word vector set (e.g. glove-wiki-gigaword-100).\n\
      \           <br/>\n           2. Set up evaluation queries for countries-capitals,\
