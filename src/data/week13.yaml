  tasks:
  - title: Build Word2Vec Skip-Gram model in PyTorch
    badge: Hard · 4 hrs
    badge_class: tb-hard
    time: 90 min
    prompt_html: "<p>\n          Build a pure PyTorch Skip-Gram network:\n       \
      \   <br/>\n          1. Define an input Embedding layer (Vocab $\\rightarrow$\
      \ Hidden) and an output Linear layer (Hidden $\\rightarrow$ Vocab).\n      \
      \    <br/>\n          2. Accept center word tokens, project to hidden dimension\
      \ vectors, and predict adjacent context word tokens.\n          <br/>\n    \
      \      3. Train the network using standard cross-entropy loss, and extract target\
      \ weights vectors as trained embeddings.\n         </p>"
    done_when: Your PyTorch model trains successfully, and dot products of related
      output embeddings show increasing values over training epochs.
    git_cmd: 'git add . &amp;&amp; git commit -m "day89: complete day 89 tasks and
      coding exercises"'
    sol_id: sol-w13t5
    solution_title: ✅ COMPLETE SOLUTION — build_word2vec_skip_gram_model_in_pytorc.py
    solution_code: "<span class=\"cm\"># build_word2vec_skip_gram_model_in_pytorc.py\
      \ — Solution</span>\n<span class=\"cm\"># Complete solution for: Build Word2Vec\
      \ Skip-Gram model in PyTorch</span>\n\n<span class=\"kw\">import</span> torch\n\
      <span class=\"kw\">import</span> torch.nn <span class=\"kw\">as</span> nn\n\
      <span class=\"kw\">import</span> torch.nn.functional <span class=\"kw\">as</span>\
      \ F\n<span class=\"kw\">from</span> collections <span class=\"kw\">import</span>\
      \ Counter\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
      \ np\n\n<span class=\"kw\">class</span> <span class=\"cls\">SkipGram</span>(nn.Module):\n\
      \    <span class=\"str\">\"\"\"Word2Vec Skip-Gram with Negative Sampling.\"\"\
      \"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span\
      \ class=\"kw\">self</span>, vocab_size, embedding_dim):\n        <span class=\"\
      fn\">super</span>().<span class=\"fn\">__init__</span>()\n        <span class=\"\
      kw\">self</span>.center_embeddings = nn.<span class=\"fn\">Embedding</span>(vocab_size,\
      \ embedding_dim)\n        <span class=\"kw\">self</span>.context_embeddings\
      \ = nn.<span class=\"fn\">Embedding</span>(vocab_size, embedding_dim)\n    \
      \    nn.init.<span class=\"fn\">xavier_uniform_</span>(<span class=\"kw\">self</span>.center_embeddings.weight)\n\
      \        nn.init.<span class=\"fn\">zeros_</span>(<span class=\"kw\">self</span>.context_embeddings.weight)\n\
      \    \n    <span class=\"kw\">def</span> <span class=\"fn\">forward</span>(<span\
      \ class=\"kw\">self</span>, center, context, negatives):\n        <span class=\"\
      str\">\"\"\"</span>\n        center: (batch,) - center word indices\n      \
      \  context: (batch,) - positive context word indices\n        negatives: (batch,\
      \ num_neg) - negative sample indices\n        <span class=\"str\">\"\"\"</span>\n\
      \        center_emb = <span class=\"kw\">self</span>.<span class=\"fn\">center_embeddings</span>(center)\
      \      <span class=\"cm\"># (batch, dim)</span>\n        context_emb = <span\
      \ class=\"kw\">self</span>.<span class=\"fn\">context_embeddings</span>(context)\
      \    <span class=\"cm\"># (batch, dim)</span>\n        neg_emb = <span class=\"\
      kw\">self</span>.<span class=\"fn\">context_embeddings</span>(negatives)   \
      \   <span class=\"cm\"># (batch, num_neg, dim)</span>\n        \n        <span\
      \ class=\"cm\"># Positive score</span>\n        pos_score = torch.<span class=\"\
      fn\">sum</span>(center_emb * context_emb, dim=<span class=\"num\">1</span>)\n\
      \        pos_loss = -F.<span class=\"fn\">logsigmoid</span>(pos_score)\n   \
      \     \n        <span class=\"cm\"># Negative score</span>\n        neg_score\
      \ = torch.<span class=\"fn\">bmm</span>(neg_emb, center_emb.<span class=\"fn\"\
      >unsqueeze</span>(<span class=\"num\">2</span>)).<span class=\"fn\">squeeze</span>(<span\
      \ class=\"num\">2</span>)\n        neg_loss = -F.<span class=\"fn\">logsigmoid</span>(-neg_score).<span\
      \ class=\"fn\">sum</span>(dim=<span class=\"num\">1</span>)\n        \n    \
      \    <span class=\"kw\">return</span> (pos_loss + neg_loss).<span class=\"fn\"\
      >mean</span>()\n\n<span class=\"cm\"># Simple training example</span>\ncorpus\
      \ = <span class=\"str\">\"the quick brown fox jumps over the lazy dog the fox\
      \ is quick\"</span>.<span class=\"fn\">split</span>()\nvocab = <span class=\"\
      fn\">list</span>(<span class=\"fn\">set</span>(corpus))\nword2idx = {w: i <span\
      \ class=\"kw\">for</span> i, w <span class=\"kw\">in</span> <span class=\"fn\"\
      >enumerate</span>(vocab)}\nidx2word = {i: w <span class=\"kw\">for</span> w,\
      \ i <span class=\"kw\">in</span> word2idx.<span class=\"fn\">items</span>()}\n\
      \nmodel = <span class=\"fn\">SkipGram</span>(<span class=\"fn\">len</span>(vocab),\
      \ embedding_dim=<span class=\"num\">32</span>)\noptimizer = torch.optim.<span\
      \ class=\"fn\">Adam</span>(model.<span class=\"fn\">parameters</span>(), lr=<span\
      \ class=\"num\">0.01</span>)\n\n<span class=\"cm\"># Generate skip-gram pairs\
      \ (window=2)</span>\nwindow = <span class=\"num\">2</span>\npairs = []\n<span\
      \ class=\"kw\">for</span> i, word <span class=\"kw\">in</span> <span class=\"\
      fn\">enumerate</span>(corpus):\n    <span class=\"kw\">for</span> j <span class=\"\
      kw\">in</span> <span class=\"fn\">range</span>(<span class=\"fn\">max</span>(<span\
      \ class=\"num\">0</span>, i-window), <span class=\"fn\">min</span>(<span class=\"\
      fn\">len</span>(corpus), i+window+<span class=\"num\">1</span>)):\n        <span\
      \ class=\"kw\">if</span> i != j:\n            pairs.<span class=\"fn\">append</span>((word2idx[corpus[i]],\
      \ word2idx[corpus[j]]))\n\n<span class=\"cm\"># Train</span>\n<span class=\"\
      kw\">for</span> epoch <span class=\"kw\">in</span> <span class=\"fn\">range</span>(<span\
      \ class=\"num\">100</span>):\n    np.random.<span class=\"fn\">shuffle</span>(pairs)\n\
      \    centers = torch.<span class=\"fn\">tensor</span>([p[<span class=\"num\"\
      >0</span>] <span class=\"kw\">for</span> p <span class=\"kw\">in</span> pairs])\n\
      \    contexts = torch.<span class=\"fn\">tensor</span>([p[<span class=\"num\"\
      >1</span>] <span class=\"kw\">for</span> p <span class=\"kw\">in</span> pairs])\n\
      \    negatives = torch.<span class=\"fn\">randint</span>(<span class=\"num\"\
      >0</span>, <span class=\"fn\">len</span>(vocab), (<span class=\"fn\">len</span>(pairs),\
      \ <span class=\"num\">5</span>))\n    \n    loss = <span class=\"fn\">model</span>(centers,\
      \ contexts, negatives)\n    optimizer.<span class=\"fn\">zero_grad</span>()\n\
      \    loss.<span class=\"fn\">backward</span>()\n    optimizer.<span class=\"\
      fn\">step</span>()\n    <span class=\"kw\">if</span> epoch % <span class=\"\
      num\">20</span> == <span class=\"num\">0</span>:\n        <span class=\"fn\"\
      >print</span>(<span class=\"str\">f\"Epoch {epoch}: loss={loss.item():.4f}\"\
      </span>)\n\n<span class=\"cm\"># Get embeddings</span>\nembeddings = model.center_embeddings.weight.<span\
      \ class=\"fn\">detach</span>().<span class=\"fn\">numpy</span>()\n<span class=\"\
      fn\">print</span>(<span class=\"str\">f\"Embedding shape: {embeddings.shape}\"\
      </span>)\n\n<span class=\"kw\">if</span> __name__ == <span class=\"str\">'__main__'</span>:\n\
      \    <span class=\"fn\">solve</span>()"
    solution_lang: python
