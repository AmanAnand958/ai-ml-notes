  quizzes:
  - num_str: Q1 OF 5
    question: What is the core difference between Extractive and Abstractive text
      summarisation?
    qid: q92_1
    options:
    - letter: A
      text: Extractive summarisation requires heavy GPU sequence decoders.
      is_correct: false
    - letter: B
      text: Extractive summarisation ranks and selects existing sentences directly
        from the source text, while Abstractive summarisation generates completely
        new sentences using sequence-to-sequence networks.
      is_correct: true
    - letter: C
      text: Abstractive summarisation only operates on vocabulary counts.
      is_correct: false
    - letter: D
      text: Extractive summarisation runs slower.
      is_correct: false
    correct_fb: ✅ Correct! Extractive methods score and pull out original text blocks,
      ensuring factual accuracy, while abstractive methods paraphrase concepts, mirroring
      human summary styles.
    wrong_fb: ❌ Think about the generation process. If a model generates words that
      were never present in the input document (like a human writing a review), which
      summarization category does it belong to?
  - num_str: Q2 OF 5
    question: What does the damping factor (d=0.85) mathematically represent in the
      PageRank and TextRank equations?
    qid: q92_2
    options:
    - letter: A
      text: The learning rate decay factor.
      is_correct: false
    - letter: B
      text: The probability that a user/reader will continue traversing linked elements
        in the graph instead of randomly jumping to a completely new element.
      is_correct: true
    - letter: C
      text: The token padding mask.
      is_correct: false
    - letter: D
      text: The cosine similarity offset.
      is_correct: false
    correct_fb: ✅ Correct! The damping factor balances network traversal with random
      restarts, ensuring the graph matrix reaches a stable stationary distribution.
    wrong_fb: ❌ Think about the "Random Surfer" model. If a surfer clicks on web links,
      85% of the time they follow a link, and 15% of the time they type a new URL.
      How does this apply to transitions between sentences?
  - num_str: Q3 OF 5
    question: Why does standard word overlap similarity scale poorly for sentences
      with rich vocabularies?
    qid: q92_3
    options:
    - letter: A
      text: It fails to recognize synonyms, scoring sentences with identical meanings
        but different words (e.g. "automobile" vs "car") as completely unrelated.
      is_correct: true
    - letter: B
      text: It only operates on GPUs.
      is_correct: false
    - letter: C
      text: It requires regularised matrix projections.
      is_correct: false
    - letter: D
      text: It drops sentence length normalisation parameters.
      is_correct: false
    correct_fb: ✅ Correct! Simple overlap checks look for exact character match tokens.
      Dense sentence embeddings solve this by mapping synonyms to nearby continuous
      vector coordinates.
    wrong_fb: ❌ Imagine sentence A says "I bought a vehicle" and sentence B says "I
      purchased an automobile". Do they share any exact word tokens other than "I"
      and "a/an"? How does this skew similarity scores?
  - num_str: Q4 OF 5
    question: What mathematical process guarantees that the power iteration loop in
      TextRank converges to a stable stationary distribution?
    qid: q92_4
    options:
    - letter: A
      text: Gradient descent learning steps.
      is_correct: false
    - letter: B
      text: Normalising the transition matrix rows to sum to 1, ensuring the graph
        forms a column-stochastic Markov transition model.
      is_correct: true
    - letter: C
      text: Applying tanh activations to vectors.
      is_correct: false
    - letter: D
      text: Stripping negative emission values.
      is_correct: false
    correct_fb: ✅ Correct! By normalizing rows, we turn our adjacency weights into
      a stochastic probability transition matrix, satisfying the Perron-Frobenius
      theorem for eigenvalue convergence.
    wrong_fb: ❌ Think about standard Markov chains. If state probabilities sum to
      1.5 instead of 1.0, what happens to values as we multiply the matrix repeatedly
      over time? Do they converge, or blow up?
  - num_str: Q5 OF 5
    question: In a standard PageRank graph, what is a "sink"?
    qid: q92_5
    options:
    - letter: A
      text: A node with no outgoing edges, which traps the surfer and breaks stochastic
        probability assumptions unless resolved with random restart terms.
      is_correct: true
    - letter: B
      text: An empty database table.
      is_correct: false
    - letter: C
      text: A dense hidden neural node.
      is_correct: false
    - letter: D
      text: A tokenizer delimiter token.
      is_correct: false
    correct_fb: ✅ Correct! Sinks accumulate all probability mass, leading to convergence
      failure. Damping factors and stochastic correction matrices resolve this issue.
    wrong_fb: ❌ Think about fluid dynamics. Where does water gather when there are
      no outlets? Sinks have inbound paths but no outbound paths. How does this affect
      probability flow?
  flashcards:
  - front: Neural architecture relying entirely on multi-head self-attention and positional
      encodings, eliminating sequential recurrence.
    back: Sequence transduction model based entirely on attention mechanisms, eliminating
      recurrent steps for full parallelization.
  - front: Self-Attention?
    back: Calculates dynamic correlation weights between all positions in a sequence
      to capture direct context dependencies.
  - front: Multi-Head Attention?
    back: Computes self-attention multiple times in parallel with different weight
      projections to capture diverse relationships.
  - front: Positional Encoding?
    back: Injects sinusoidal or learned position vectors into inputs to preserve sequence
      order information.
  - front: Layer Normalization?
    back: Normalizes activations across features within a single training example,
      stabilizing network training.
