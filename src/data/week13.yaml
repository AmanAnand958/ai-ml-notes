  hinglish: Word2Vec CBOW aur Skip-gram dono variants hain. CBOW context se center
    word predict karta hai, Skip-gram center word se context predict karta hai. Skip-gram
    rare words ke liye better!
  analogy: TF-IDF bilkul ek library indexer ki tarah kaam karta hai. Agar aap library
    me "science" shabd dhundhenge, to lagbhag har book me ye milega aur iska index
    weight (IDF) bahut low ho jayega. Par agar aap "quantum" ya "photosynthesis" dhundhenge,
    to ye sirf specific books me milega, isliye library indexer isko bada specific
    aur unique signal (high TF-IDF weight) banata hai taaki relevant books turant
    mil sakein. LSA SVD bilkul is directory me se overlap topics ko classify karke
    multiple books ke clusters (topics) create karne ke samaan hai.
  theory_html: "<h3 class=\"sh3\">\n       1. Bag of Words (BoW) &amp; Sparsity Constraints\n\
    \      </h3>\n<p>\n       The\n       <strong>\n        Bag of Words (BoW)\n \
    \      </strong>\n       representation maps a document to a vector of token occurrences.\n\
    \    If the training corpus has a vocabulary size of $V = 50,000$ unique words,\
    \ every single document is converted into a $50,000$-dimensional vector.\n   \
    \ Since most documents contain only 50-100 unique words, $99.9\\%$ of the vector\
    \ elements are zeros.\n    This creates severe\n       <strong>\n        sparsity\
    \ constraints\n       </strong>\n       , bloating RAM usage and making computational\
    \ weights highly fragile.\n      </p>\n<h3 class=\"sh3\">\n       2. TF-IDF Mathematical\
    \ Formulations\n      </h3>\n<p>\n       To prevent extremely common words (like\n\
    \       \n        \"the\"\n       \n       ,\n       \n        \"is\"\n      \
    \ \n       ,\n       \n        \"and\"\n       \n       ) from dominating representations,\n\
    \       <strong>\n        TF-IDF\n       </strong>\n       scales occurrences\
    \ down if they appear across many documents.\n    The exact equations are formulated\
    \ as follows:\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\"\
    >\n        $$\\text{TF}(t, d) = \\frac{f_{t,d}}{\\sum_{t' \\in d} f_{t',d}}$$\n\
    \       </span>\n<span class=\"desc\">\n        Term Frequency: occurrence of\
    \ term $t$ in document $d$ relative to document size.\n       </span>\n</div>\n\
    <div class=\"math-block\">\n<span class=\"formula\">\n        $$\\text{IDF}(t,\
    \ D) = \\log\\left( \\frac{1 + N}{1 + \\text{DF}(t)} \\right) + 1$$\n       </span>\n\
    <span class=\"desc\">\n        $Inverse Document Frequency: where $N$ is total\
    \ documents, and $\\text{DF}(t)$ is number of documents containing term $t$. Adding\
    \ 1 avoids division-by-zero.$\n       </span>\n</div>\n<div class=\"math-block\"\
    >\n<span class=\"formula\">\n        $$\\text{TF-IDF}(t, d, D) = \\text{TF}(t,\
    \ d) \\times \\text{IDF}(t, D)$$\n       </span>\n<span class=\"desc\">\n    \
    \    Final TF-IDF weight balances term specificity and local occurrence.\n   \
    \    </span>\n</div>\n<h3 class=\"sh3\">\n       3. Dimensionality Reduction:\
    \ Latent Semantic Analysis (LSA)\n      </h3>\n<p>\n       To resolve BoW sparsity\
    \ and synonymy issues, we apply\n       <strong>\n        Latent Semantic Analysis\
    \ (LSA)\n       </strong>\n       . LSA takes our sparse term-document matrix\
    \ $X$ of size $V \\times N$ and decomposes it into three matrices using\n    \
    \   <strong>\n        Singular Value Decomposition (SVD)\n       </strong>\n \
    \      :\n      </p>\n<div class=\"math-block\">\n<span class=\"formula\">\n \
    \       $$X = U \\Sigma V^T$$\n       </span>\n<span class=\"desc\">\n       \
    \ Where $U$ ($V \\times k$) represents term concepts, $\\Sigma$ ($k \\times k$)\
    \ contains concept strengths, and $V^T$ ($k \\times N$) holds document concepts,\
    \ reducing variables to $k \\ll V$ dense features.\n       </span>\n</div>\n<h3\
    \ class=\"sh3\">\n       4. N-grams Context Extraction\n      </h3>\n<p>\n   \
    \    Traditional BoW models treat words independently, losing all structural sequence.\n\
    \       <strong>\n        N-grams\n       </strong>\n       capture immediate\
    \ local context by grouping adjacent words:\n      </p>\n<ul class=\"prose-list\"\
    >\n<li>\n\n         Unigrams (1-grams):\n        \n        [\"the\", \"quick\"\
    , \"brown\"]\n       </li>\n<li>\n\n         Bigrams (2-grams):\n        \n  \
    \      [\"the quick\", \"quick brown\"]\n       </li>\n<li>\n\n         Trigrams\
    \ (3-grams):\n        \n        [\"the quick brown\"]\n       </li>\n</ul>\n<p>\n\
    \       While N-grams preserve simple structural dependencies (e.g. mapping\n\
    \       \n        \"not good\"\n       \n       differently from\n       \n  \
    \      \"good\"\n       \n       ), they explode vocabulary size exponentially,\
    \ scaling sparsity constraints.\n      </p>\n<h3 class=\"sh3\">\n       5. Industrial\
    \ Text News Classifier\n      </h3>\n<p>\n       Let's write a complete, high-fidelity\
    \ classification script using Scikit-Learn's\n       \n        TfidfVectorizer\n\
    \       \n       paired with\n       \n        LogisticRegression\n       \n \
    \      to classify text data:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — tfidf_classifier.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">from</span> sklearn.feature_extraction.text <span class=\"\
    kw\">import</span> TfidfVectorizer\n<span class=\"kw\">from</span> sklearn.linear_model\
    \ <span class=\"kw\">import</span> LogisticRegression\n<span class=\"kw\">from</span>\
    \ sklearn.model_selection <span class=\"kw\">import</span> train_test_split\n\
    <span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span>\
    \ classification_report\n<span class=\"kw\">import</span> pandas <span class=\"\
    kw\">as</span> pd\n\n<span class=\"cm\"># 1. Load mock financial news corpus</span>\n\
    data = {\n    <span class=\"str\">\"text\"</span>: [\n        <span class=\"str\"\
    >\"The stock market experienced a huge surge in major tech shares.\"</span>,\n\
    \        <span class=\"str\">\"The Federal Reserve decided to hike interest rates\
    \ by 25 basis points.\"</span>,\n        <span class=\"str\">\"Local startups\
    \ are struggling to raise seed round capital this quarter.\"</span>,\n       \
    \ <span class=\"str\">\"Tech earnings beat all Wall Street projections, stock\
    \ climbs.\"</span>,\n        <span class=\"str\">\"Central banks are planning\
    \ to implement stricter fiscal controls.\"</span>,\n        <span class=\"str\"\
    >\"Investment firms are shifting funds towards commodity assets.\"</span>\n  \
    \  ],\n    <span class=\"str\">\"label\": [\"market\", \"policy\", \"market\"\
    , \"market\", \"policy\", \"policy\"</span>]\n}\ndf = pd.<span class=\"fn\">DataFrame</span>(data)\n\
    \n<span class=\"cm\"># 2. Vectorise text using TF-IDF incorporating Bigrams and\
    \ sublinear term frequency scaling</span>\nvectorizer = <span class=\"fn\">TfidfVectorizer</span>(\n\
    \    ngram_range=(<span class=\"num\">1</span>, <span class=\"num\">2</span>),\
    \     <span class=\"cm\"># Capture unigrams and bigrams</span>\n    sublinear_tf=<span\
    \ class=\"kw\">True</span>,      <span class=\"cm\"># Replace TF with 1 + log(TF)\
    \ to scale extreme outliers</span>\n    max_features=<span class=\"num\">1000</span>\
    \       <span class=\"cm\"># Cap vocabulary dimension for resource safety</span>\n\
    )\n\nX = vectorizer.<span class=\"fn\">fit_transform</span>(df[<span class=\"\
    str\">\"text\"</span>])\ny = df[<span class=\"str\">\"label\"</span>]\n\n<span\
    \ class=\"cm\"># 3. Fit L2-regularised Logistic Regression Classifier</span>\n\
    classifier = <span class=\"fn\">LogisticRegression</span>(C=<span class=\"num\"\
    >1.0</span>, penalty=<span class=\"str\">\"l2\"</span>)\nclassifier.<span class=\"\
    fn\">fit</span>(X, y)\n\n<span class=\"cm\"># 4. Infer and generate evaluation\
    \ reports</span>\npredictions = classifier.<span class=\"fn\">predict</span>(X)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">\"Classification Report:\\\
    \\n\"</span>, <span class=\"fn\">classification_report</span>(y, predictions))\n\
    <span class=\"fn\">print</span>(<span class=\"str\">\"Vocabulary mapping shape:\"\
    </span>, X.shape)</pre>\n</div>\n<h3 class=\"sh3\">\n       6. Latent Semantic\
    \ Analysis (LSA) in NumPy\n      </h3>\n<p>\n       Below is a NumPy demonstration\
    \ showing how SVD maps a small term-document occurrences grid to a dense latent\
    \ semantic projection:\n      </p>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — lsa_svd.py\n        </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n\
    <span class=\"cm\"># Terms: [stock, rate, interest, chip]</span>\n<span class=\"\
    cm\"># Docs: Doc1 (financial), Doc2 (policy), Doc3 (tech)</span>\nX = np.<span\
    \ class=\"fn\">array</span>([\n    [<span class=\"num\">3</span>, <span class=\"\
    num\">0</span>, <span class=\"num\">0</span>],  <span class=\"cm\"># stock</span>\n\
    \    [<span class=\"num\">0</span>, <span class=\"num\">4</span>, <span class=\"\
    num\">0</span>],  <span class=\"cm\"># rate</span>\n    [<span class=\"num\">0</span>,\
    \ <span class=\"num\">3</span>, <span class=\"num\">0</span>],  <span class=\"\
    cm\"># interest</span>\n    [<span class=\"num\">1</span>, <span class=\"num\"\
    >0</span>, <span class=\"num\">5</span>]   <span class=\"cm\"># chip</span>\n\
    ], dtype=np.float32)\n\n<span class=\"cm\"># Apply Singular Value Decomposition</span>\n\
    U, S, VT = np.linalg.<span class=\"fn\">svd</span>(X, full_matrices=<span class=\"\
    kw\">False</span>)\n\n<span class=\"fn\">print</span>(<span class=\"str\">\"Decomposed\
    \ U (Term Concepts) shape:\"</span>, U.shape)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Singular values Sigma:\"</span>, S)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">\"Decomposed VT (Doc Concepts) shape:\"</span>, VT.shape)\n\n\
    <span class=\"cm\"># Truncate to top-2 principal semantic concepts</span>\nk =\
    \ <span class=\"num\">2</span>\nU_k = U[:, :k]\nS_k = np.<span class=\"fn\">diag</span>(S[:k])\n\
    VT_k = VT[:k, :]\n\n<span class=\"cm\"># Reconstruct dense approximation</span>\n\
    X_dense = U_k.<span class=\"fn\">dot</span>(S_k).<span class=\"fn\">dot</span>(VT_k)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">\"\\\\nReconstructed Dense\
    \ Concept Grid:\\\\n\"</span>, X_dense)</pre>\n</div>\n\n<h2 class=\"sh2\">\n\
    \       \U0001F6E0 Tasks\n      </h2>\n<div style=\"font-family:var(--font-mono);font-size:\
    \ 12.5px;color:var(--muted);margin-top:0.5rem;margin-bottom:1rem;\">\n       \U0001F50D\
    \n       <strong>\n        Search terms:\n       </strong>\n\n        spacy pos\
    \ tagging adjectives extraction nltk, part of speech syntax tags parser\n    \
    \   \n</div>"
