  theory_html: |-
    <p><h3 class="sh3">
           1. ElasticNet — Best of Both Worlds
          </h3>
    <div class="math-block">
    <span class="formula">
            $$ElasticNet Loss = Σ(yᵢ − ŷᵢ)² + α × [l1_ratio × Σ|βⱼ| + (1−l1_ratio) × Σβⱼ²]$$
           </span>
    <span class="desc">
            l1_ratio=0 → Ridge only. l1_ratio=1 → Lasso only. 0 &lt; l1_ratio &lt; 1 → mix.
           </span>
    <span class="desc">
            Typical range: l1_ratio ∈ [0.1, 0.9]. Default in sklearn: 0.5.
           </span>
    </div>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — elasticnet_gridsearch.py
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> ElasticNet
    <span class="kw">from</span> sklearn.model_selection <span class="kw">import</span> GridSearchCV, RandomizedSearchCV
    <span class="kw">from</span> sklearn.pipeline <span class="kw">import</span> Pipeline
    <span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span> StandardScaler
    <span class="kw">from</span> sklearn.datasets <span class="kw">import</span> fetch_california_housing
    <span class="kw">from</span> sklearn.model_selection <span class="kw">import</span> train_test_split

    data = <span class="fn">fetch_california_housing</span>()
    X_tr, X_te, y_tr, y_te = <span class="fn">train_test_split</span>(
        data.data, data.target, test_size=<span class="num">0.2</span>, random_state=<span class="num">42</span>)

    pipe = <span class="fn">Pipeline</span>([
        (<span class="str">'scaler'</span>, <span class="fn">StandardScaler</span>()),
        (<span class="str">'model'</span>,  <span class="fn">ElasticNet</span>(max_iter=<span class="num">5000</span>))
    ])

    <span class="cm"># Grid search over alpha AND l1_ratio simultaneously</span>
    param_grid = {
        <span class="str">'model__alpha'</span>:     [<span class="num">0.001</span>, <span class="num">0.01</span>, <span class="num">0.1</span>, <span class="num">1.0</span>, <span class="num">10.0</span>],
        <span class="str">'model__l1_ratio'</span>:  [<span class="num">0.1</span>, <span class="num">0.3</span>, <span class="num">0.5</span>, <span class="num">0.7</span>, <span class="num">0.9</span>]
    }
    <span class="cm"># 5×5 = 25 combinations × 5 folds = 125 fits — manageable</span>
    grid = <span class="fn">GridSearchCV</span>(pipe, param_grid, cv=<span class="num">5</span>,
                        scoring=<span class="str">'neg_mean_squared_error'</span>, n_jobs=-<span class="num">1</span>)
    grid.<span class="fn">fit</span>(X_tr, y_tr)

    <span class="fn">print</span>(<span class="str">f"Best params  : {grid.best_params_}"</span>)
    <span class="fn">print</span>(<span class="str">f"CV MSE (best): {-grid.best_score_:.4f}"</span>)
    <span class="fn">print</span>(<span class="str">f"Test MSE     : {np.mean((y_te - grid.predict(X_te))**2):.4f}"</span>)

    best = grid.best_estimator_.named_steps[<span class="str">'model'</span>]
    <span class="fn">print</span>(<span class="str">f"\nNon-zero coefs: {np.sum(best.coef_ != 0)}/{data.data.shape[1]}"</span>)
    <span class="fn">print</span>(<span class="str">f"l1_ratio → {best.l1_ratio} (closer to 1 = more Lasso-like, more sparse)"</span>)

    <span class="cm"># For large hyperparameter spaces, use RandomizedSearchCV</span>
    <span class="kw">from</span> scipy.stats <span class="kw">import</span> loguniform, uniform

    param_dist = {
        <span class="str">'model__alpha'</span>:     <span class="fn">loguniform</span>(<span class="num">1e-4</span>, <span class="num">1e2</span>),  <span class="cm"># log-uniform: better for scales</span>
        <span class="str">'model__l1_ratio'</span>:  <span class="fn">uniform</span>(<span class="num">0.0</span>, <span class="num">1.0</span>)        <span class="cm"># uniform over [0, 1]</span>
    }
    rnd = <span class="fn">RandomizedSearchCV</span>(pipe, param_dist, n_iter=<span class="num">40</span>, cv=<span class="num">5</span>,
                              scoring=<span class="str">'neg_mean_squared_error'</span>,
                              random_state=<span class="num">42</span>, n_jobs=-<span class="num">1</span>)
    rnd.<span class="fn">fit</span>(X_tr, y_tr)
    <span class="fn">print</span>(<span class="str">f"\nRandomized best: {rnd.best_params_}"</span>)</code></pre>
