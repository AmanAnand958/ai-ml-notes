    bullets:
    - |-
      <strong>
                 Ridge (L2):
                </strong>
                Shrinks all coefficients toward zero but never exactly. Best when all features have small, real effects. Closed form: (XᵀX + αI)⁻¹Xᵀy.
    - |-
      <strong>
                 Lasso (L1):
                </strong>
                Sets some coefficients EXACTLY to zero — built-in feature selection. Best for sparse problems. No closed form — needs iterative solver.
    - |-
      <strong>
                 Geometry:
                </strong>
                L2 constraint = circle (smooth, no corners → never zero). L1 constraint = diamond (corners at axes → zero coefficients).
    - |-
      <strong>
                 ALWAYS scale before Ridge/Lasso:
                </strong>
                The penalty is scale-dependent. Unscaled = unfair penalty by measurement unit, not importance.
    - |-
      <strong>
                 Use RidgeCV/LassoCV:
                </strong>
                Auto-tune alpha via cross-validation. Access the optimal alpha via .alpha_ attribute after fitting.
