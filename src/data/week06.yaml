  - title: Ridge from Scratch — Gradient Descent with L2
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p>\n           Implement Ridge Regression using gradient descent\
      \ from scratch. The gradient update is:\n           \n            θ = θ - lr\
      \ × (2/n × Xᵀ(Xθ - y) + 2α × θ)\n           \n           . Implement for 500\
      \ epochs with lr=0.01 and alpha=1.0. Compare your scratch implementation's coefficients\
      \ and test MSE against sklearn's Ridge(alpha=1.0). Also implement the closed-form\
      \ Ridge solution β = (XᵀX + αI)⁻¹Xᵀy and compare all three.\n          </p>"
    done_when: All three Ridge implementations produce coefficients within 0.05 of
      each other. MSE comparison table printed.
    git_cmd: 'git add ridge_from_scratch.py &amp;&amp; git commit -m "day44: Ridge
      regression GD and closed-form from scratch" &amp;&amp; git push'
    sol_id: sol-d38t2
    solution_title: RIDGE GRADIENT UPDATE
    solution_code: "<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
      \ np\n\n<span class=\"cm\"># Ridge gradient descent implementation key loop</span>\n\
      n, p = Xtr_b.shape\ntheta = np.<span class=\"fn\">zeros</span>(p)\nlr = <span\
      \ class=\"num\">0.01</span>; alpha_val = <span class=\"num\">1.0</span>\n\n\
      <span class=\"kw\">for</span> epoch <span class=\"kw\">in</span> <span class=\"\
      fn\">range</span>(<span class=\"num\">500</span>):\n    y_hat = Xtr_b @ theta\n\
      \    error = y_hat - y_tr\n    <span class=\"cm\"># L2 gradient: data gradient\
      \ + L2 penalty gradient (2α·θ)</span>\n    <span class=\"cm\"># IMPORTANT: do\
      \ NOT regularise the intercept (theta[0])</span>\n    l2_grad = <span class=\"\
      num\">2</span> * alpha_val * theta\n    l2_grad[<span class=\"num\">0</span>]\
      \ = <span class=\"num\">0</span>  <span class=\"cm\"># intercept not regularised</span>\n\
      \    grad = (<span class=\"num\">2</span>/n) * Xtr_b.T @ error + l2_grad\n \
      \   theta -= lr * grad\n\n<span class=\"cm\"># Closed form</span>\nI_reg = np.<span\
      \ class=\"fn\">eye</span>(p); I_reg[<span class=\"num\">0</span>, <span class=\"\
      num\">0</span>] = <span class=\"num\">0</span>  <span class=\"cm\"># don't regularise\
      \ intercept</span>\nbeta_cf = np.linalg.<span class=\"fn\">inv</span>(Xtr_b.T\
      \ @ Xtr_b + alpha_val * I_reg) @ Xtr_b.T @ y_tr"
    solution_lang: python
