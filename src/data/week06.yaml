    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">import</span> pandas <span class="kw">as</span> pd
    <span class="kw">from</span> sklearn.tree <span class="kw">import</span> DecisionTreeRegressor
    <span class="kw">from</span> sklearn.ensemble <span class="kw">import</span> RandomForestRegressor, GradientBoostingRegressor
    <span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> Ridge
    <span class="kw">from</span> sklearn.model_selection <span class="kw">import</span> cross_val_score, train_test_split
    <span class="kw">from</span> sklearn.datasets <span class="kw">import</span> fetch_california_housing
    <span class="kw">from</span> sklearn.metrics <span class="kw">import</span> mean_squared_error, r2_score
    <span class="kw">import</span> warnings; warnings.<span class="fn">filterwarnings</span>(<span class="str">'ignore'</span>)

    data = <span class="fn">fetch_california_housing</span>()
    X_tr, X_te, y_tr, y_te = <span class="fn">train_test_split</span>(
        data.data, data.target, test_size=<span class="num">0.2</span>, random_state=<span class="num">42</span>)

    models = {
        <span class="str">'Ridge'</span>:       <span class="fn">Ridge</span>(alpha=<span class="num">1.0</span>),
        <span class="str">'Decision Tree'</span>: <span class="fn">DecisionTreeRegressor</span>(max_depth=<span class="num">6</span>, random_state=<span class="num">42</span>),
        <span class="str">'Random Forest'</span>: <span class="fn">RandomForestRegressor</span>(n_estimators=<span class="num">100</span>, random_state=<span class="num">42</span>, n_jobs=-<span class="num">1</span>),
        <span class="str">'Grad. Boosting'</span>: <span class="fn">GradientBoostingRegressor</span>(n_estimators=<span class="num">200</span>, learning_rate=<span class="num">0.1</span>,
                                                      max_depth=<span class="num">4</span>, random_state=<span class="num">42</span>)
    }

    results = []
    <span class="kw">for</span> name, model <span class="kw">in</span> models.<span class="fn">items</span>():
        model.<span class="fn">fit</span>(X_tr, y_tr)
        y_pred = model.<span class="fn">predict</span>(X_te)
        rmse = np.<span class="fn">sqrt</span>(<span class="fn">mean_squared_error</span>(y_te, y_pred))
        r2   = <span class="fn">r2_score</span>(y_te, y_pred)
        cv_rmse = np.<span class="fn">sqrt</span>(-<span class="fn">cross_val_score</span>(model, data.data, data.target,
                          cv=<span class="num">5</span>, scoring=<span class="str">'neg_mean_squared_error'</span>).<span class="fn">mean</span>())
        results.<span class="fn">append</span>({<span class="str">'Model'</span>: name, <span class="str">'Test RMSE'</span>: rmse,
                        <span class="str">'Test R²'</span>: r2, <span class="str">'CV RMSE'</span>: cv_rmse})

    df_results = pd.<span class="fn">DataFrame</span>(results).<span class="fn">sort_values</span>(<span class="str">'Test RMSE'</span>)
    <span class="fn">print</span>(df_results.<span class="fn">to_string</span>(index=<span class="kw">False</span>, float_format=<span class="str">'%.4f'</span>))

    <span class="cm"># Feature importance from Random Forest and Gradient Boosting</span>
    rf = models[<span class="str">'Random Forest'</span>]
    fi = pd.<span class="fn">Series</span>(rf.feature_importances_,               index=data.feature_names).<span class="fn">sort_values</span>(ascending=<span class="kw">False</span>)
    <span class="fn">print</span>(<span class="str">"\nRandom Forest Feature Importances:"</span>)
    <span class="fn">print</span>(fi)</code></pre>
