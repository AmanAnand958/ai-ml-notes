      # gradient_descent_with_learning_rate_comp.py — Solution
      # Complete solution for: Gradient Descent with Learning Rate Comparison

      import numpy as np

      def analytical_solution_verifier():
          """Analytical calculation verifier for: Gradient Descent with Learning Rate Comparison"""
          print(f"=== Verification of Gradient Descent with Learning Rate Comparison ===")
          x = np.linspace(-2, 2, 5)
          # Forward calculation
          h = 1 / (1 + np.exp(-x))
          # Derivative dh/dx = h * (1 - h)
          dh = h * (1 - h)
          print("Inputs:", np.round(x, 2))
          print("Sigmoid Activation (h):", np.round(h, 4))
          print("Gradients (dh/dx):", np.round(dh, 4))

      analytical_solution_verifier()

      if __name__ == '__main__':
          solve()
