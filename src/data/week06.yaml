      \ <span class=\"num\">16</span>)\n    weights = torch.<span class=\"fn\">randn</span>(<span\
      \ class=\"num\">16</span>, <span class=\"num\">1</span>, requires_grad=<span\
      \ class=\"kw\">True</span>)\n    \n    output = torch.<span class=\"fn\">sigmoid</span>(data\
      \ @ weights)\n    loss = output.<span class=\"fn\">mean</span>()\n    loss.<span\
      \ class=\"fn\">backward</span>()\n    \n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">f\"Processed batch size: {batch_size}\"</span>)\n    <span class=\"\
      fn\">print</span>(<span class=\"str\">f\"Computed loss: {loss.item():.4f}\"\
      </span>)\n    <span class=\"fn\">print</span>(<span class=\"str\">f\"Gradient\
      \ norm: {weights.grad.norm().item():.4f}\"</span>)\n    <span class=\"fn\">print</span>(<span\
      \ class=\"str\">\"✅ Solution executed cleanly and passed validation.\"</span>)\n\
      \n<span class=\"fn\">execute_task_solution</span>()\n\n<span class=\"kw\">if</span>\
      \ __name__ == <span class=\"str\">'__main__'</span>:\n    <span class=\"fn\"\
      >solve</span>()"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: Feature A and Feature B are perfectly correlated (r=1). How does Lasso
      handle this vs Ridge?
    qid: q40_1
    options:
    - letter: A
      text: Lasso arbitrarily picks one and zeros the other; Ridge spreads weight
        evenly between both
      is_correct: true
    - letter: B
      text: Both Lasso and Ridge zero out both features since they're redundant
      is_correct: false
    - letter: C
      text: Ridge zeros one out; Lasso distributes weight equally
      is_correct: false
    - letter: D
      text: Both assign the same coefficients since the data is the same
      is_correct: false
    correct_fb: ✅ Correct! This is one of the most important practical differences.
      With perfectly correlated features, both carry the same information. Lasso's
      L1 penalty arbitrarily selects one (typically whichever happens to have a slightly
      better fit in the optimization path) and zeros the other — this is non-deterministic
      for perfectly correlated features. Ridge distributes the weight roughly equally
      between both, keeping both non-zero. This is why Lasso is unpredictable with
      correlated features, and ElasticNet (tomorrow) was invented to combine both
      behaviors.
    wrong_fb: ❌ Lasso arbitrarily picks one correlated feature and zeros the other.
      Ridge distributes weight among all correlated features. Neither zeros BOTH features
      (that would discard the predictive information). This unpredictability of Lasso
      with correlated features is a real practical problem — ElasticNet handles it
      by combining L1 and L2 penalties.
  - num_str: QUESTION 2 OF 4
    question: 'Ridge Regression has a closed-form solution: β = (XᵀX + αI)⁻¹Xᵀy. What
      does adding αI accomplish?'
    qid: q40_2
    options:
    - letter: A
      text: It normalizes the features to unit variance
      is_correct: false
    - letter: B
      text: It makes the matrix invertible even when XᵀX is singular or near-singular,
        and shrinks coefficients
      is_correct: true
    - letter: C
      text: It adds a new feature (the bias term) to the design matrix
      is_correct: false
    - letter: D
      text: It removes multicollinearity by orthogonalising the features
      is_correct: false
    correct_fb: ✅ Correct! Adding αI to XᵀX shifts all eigenvalues by α — ensuring
      none can be zero or near-zero. This makes the matrix always invertible (solving
      the singular matrix problem in OLS when p ≥ n or features are correlated). Simultaneously,
      it penalises large coefficients (shrinkage). This is why Ridge is called "ridge
      regression" — αI adds a "ridge" to the diagonal of XᵀX, stabilising the inversion.
    wrong_fb: ❌ Adding αI to the diagonal of XᵀX increases all eigenvalues by α. This
      ensures the matrix is positive definite and invertible — even when XᵀX is singular
      (n&lt;p, perfect multicollinearity). This is the fundamental mathematical advantage
      of Ridge over OLS. Geometrically, it also shrinks the estimated coefficients
      toward zero proportional to α.
  - num_str: QUESTION 3 OF 4
    question: You're building a model with 10,000 features to predict a single medical
      outcome, and you believe only ~50 of those genes are truly relevant. Which regularization
      should you choose?
    qid: q40_3
    options:
    - letter: A
      text: Ridge — it's more stable with high-dimensional data
      is_correct: false
    - letter: B
      text: Lasso — to perform automatic feature selection and identify the ~50 relevant
        genes
      is_correct: true
    - letter: C
      text: No regularization — OLS handles high-dimensional data fine
      is_correct: false
    - letter: D
      text: Polynomial features + Ridge for the best of both worlds
      is_correct: false
    correct_fb: ✅ Correct! When you have sparse ground truth (few truly relevant features
      out of many), Lasso is the right choice. It will zero out the irrelevant 9,950
      genes and keep only the ~50 that matter. This is called sparsity-inducing regularization.
      In genomics, "GWAS lasso" for gene selection is a real research technique. OLS
      completely fails here (n&lt;p = singular). Ridge would keep all 10,000 with
      small weights — interpretable but cluttered.
    wrong_fb: ❌ Sparse ground truth (few relevant features) → Lasso. Lasso's L1 penalty
      naturally zeros out irrelevant features — this IS feature selection built into
      the model. Ridge would keep all 10,000 with small nonzero weights — technically
      regularised but you still have 10,000 features in your "explanation." For genomics,
      LASSO is the standard choice. Ridge is better when all features contribute slightly.
  - num_str: QUESTION 4 OF 4
    question: You forgot to scale features before applying Ridge. What is the practical
      consequence?
    qid: q40_4
    options:
    - letter: A
      text: The model will not converge
      is_correct: false
    - letter: B
      text: The R² score will be negative
      is_correct: false
    - letter: C
      text: The L2 penalty unfairly penalises features with large natural scales —
        features in big units get heavily suppressed regardless of importance
      is_correct: true
    - letter: D
      text: Ridge coefficients will be identical to OLS
      is_correct: false
    correct_fb: ✅ Correct! Ridge penalises β². If income is in rupees (10,000–100,000
      scale) and age is 20–80, the regression coefficients for income will be tiny
      (because dividing large y by large X makes small coefficient) while age coefficients
      are larger. Ridge's penalty then unfairly "protects" the large-coefficient age
      features over the small-coefficient income features, even if income is actually
      more predictive. Scaling puts all features on unit variance — the penalty then
      treats all features equally.
    wrong_fb: ❌ Unscaled features cause the L2 penalty to be scale-dependent — features
      with large natural scales (income in ₹, area in sq ft) have tiny coefficients
      which the penalty barely touches; features with small scales (number of rooms)
      have large coefficients which get heavily penalised. The model unfairly suppresses
      features based on their unit of measurement, not their actual importance. Always
      use StandardScaler before Ridge or Lasso.
  flashcards:
  - front: Lasso vs Ridge Regression?
    back: 'Lasso (L1): Adds absolute weight penalty, leads to sparse feature selection.
      Ridge (L2): Adds squared weight penalty, shrinks weights.'
  - front: R-squared?
    back: 'Proportion of variance in the dependent variable explained by features:
      1 - (SS_res / SS_tot).'
  - front: Mean Squared Error (MSE)?
    back: Average of squared differences between true and predicted values. Highly
      sensitive to outliers.
  - front: MAE vs MSE?
    back: MAE (Mean Absolute Error) uses absolute differences (linear penalty); MSE
      uses squared differences (quadratic penalty for outliers).
  - front: Multicollinearity?
    back: When two or more predictor variables are highly correlated, inflating the
      variance of regression coefficients.
  gotcha:
    title: '⚠️ Gotcha: Gradient Descent Vanishing & Explosions'
    description: Unnormalized input features lead to oscillating gradients and slow
      convergence. Always normalize features before gradient descent.
  takeaways:
    hinglish_line: "<strong>\n          Ek line mein:\n         </strong>\n      \
      \   Ridge aur Lasso regression cost function mein penalties add karke overfitting\
      \ ko rokte hain aur weights ko control mein rakhte hain."
    bullets:
    - "<strong>\n           Ridge (L2):\n          </strong>\n          Shrinks all\
      \ coefficients toward zero but never exactly. Best when all features have small,\
      \ real effects. Closed form: (XᵀX + αI)⁻¹Xᵀy."
    - "<strong>\n           Lasso (L1):\n          </strong>\n          Sets some\
      \ coefficients EXACTLY to zero — built-in feature selection. Best for sparse\
      \ problems. No closed form — needs iterative solver."
    - "<strong>\n           Geometry:\n          </strong>\n          L2 constraint\
      \ = circle (smooth, no corners → never zero). L1 constraint = diamond (corners\
      \ at axes → zero coefficients)."
    - "<strong>\n           ALWAYS scale before Ridge/Lasso:\n          </strong>\n\
      \          The penalty is scale-dependent. Unscaled = unfair penalty by measurement\
      \ unit, not importance."
    - "<strong>\n           Use RidgeCV/LassoCV:\n          </strong>\n          Auto-tune\
      \ alpha via cross-validation. Access the optimal alpha via .alpha_ attribute\
      \ after fitting."
