    wrong_fb: '❌ R² NEVER decreases when you add features (even noise features accidentally explain a tiny bit more variance). Adjusted R² penalises the additional parameter count: as p increases, the formula''s correction factor grows. If a feature doesn''t improve fit enough to offset its "cost", Adjusted R² falls — correctly identifying the feature as not worth including. Use Adjusted R² for feature selection, not plain R².'
