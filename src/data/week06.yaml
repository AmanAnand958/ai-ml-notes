    >import</span> PolynomialFeatures, StandardScaler\n<span class=\"kw\">from</span>\
    \ sklearn.linear_model <span class=\"kw\">import</span> LinearRegression\n<span\
    \ class=\"kw\">from</span> sklearn.pipeline <span class=\"kw\">import</span> Pipeline\n\
    <span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span>\
    \ mean_squared_error\n\nnp.random.<span class=\"fn\">seed</span>(<span class=\"\
    num\">42</span>)\n\n<span class=\"cm\"># True relationship: y = 0.5x² - 2x + 3\
    \ + noise (quadratic)</span>\nX = np.<span class=\"fn\">linspace</span>(-<span\
    \ class=\"num\">3</span>, <span class=\"num\">3</span>, <span class=\"num\">80</span>).<span\
    \ class=\"fn\">reshape</span>(-<span class=\"num\">1</span>, <span class=\"num\"\
    >1</span>)\ny = <span class=\"num\">0.5</span>*X.<span class=\"fn\">ravel</span>()**<span\
    \ class=\"num\">2</span> - <span class=\"num\">2</span>*X.<span class=\"fn\">ravel</span>()\
    \ + <span class=\"num\">3</span> + np.random.<span class=\"fn\">randn</span>(<span\
    \ class=\"num\">80</span>)*<span class=\"num\">0.5</span>\n\n<span class=\"cm\"\
    ># What PolynomialFeatures(degree=2) creates for a single feature x:</span>\n\
    pf = <span class=\"fn\">PolynomialFeatures</span>(degree=<span class=\"num\">2</span>,\
    \ include_bias=<span class=\"kw\">False</span>)\nX_poly = pf.<span class=\"fn\"\
    >fit_transform</span>(X[:<span class=\"num\">3</span>])  <span class=\"cm\">#\
    \ show first 3 rows</span>\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >\"Original X:\"</span>, X[:<span class=\"num\">3</span>].<span class=\"fn\">ravel</span>().<span\
    \ class=\"fn\">round</span>(<span class=\"num\">2</span>))\n<span class=\"fn\"\
    >print</span>(<span class=\"str\">\"After degree=2:\"</span>, X_poly.<span class=\"\
    fn\">round</span>(<span class=\"num\">2</span>))  <span class=\"cm\"># [x, x²]</span>\n\
    <span class=\"fn\">print</span>(<span class=\"str\">\"Feature names:\"</span>,\
    \ pf.<span class=\"fn\">get_feature_names_out</span>())\n\n<span class=\"cm\"\
    ># For 2 features x1, x2 and degree=2, PolynomialFeatures creates:</span>\n<span\
    \ class=\"cm\"># [x1, x2, x1², x1·x2, x2²] — interaction terms too!</span>\n\n\
    <span class=\"cm\"># Compare degree 1, 2, 10 using Pipeline</span>\nX_plot = np.<span\
    \ class=\"fn\">linspace</span>(-<span class=\"num\">3.5</span>, <span class=\"\
    num\">3.5</span>, <span class=\"num\">300</span>).<span class=\"fn\">reshape</span>(-<span\
    \ class=\"num\">1</span>, <span class=\"num\">1</span>)\nfig, axes = plt.<span\
    \ class=\"fn\">subplots</span>(<span class=\"num\">1</span>, <span class=\"num\"\
    >3</span>, figsize=(<span class=\"num\">14</span>, <span class=\"num\">4</span>),\
    \ sharey=<span class=\"kw\">True</span>)\n\n<span class=\"kw\">for</span> i, degree\
    \ <span class=\"kw\">in</span> <span class=\"fn\">enumerate</span>([<span class=\"\
    num\">1</span>, <span class=\"num\">2</span>, <span class=\"num\">10</span>]):\n\
    \    pipe = <span class=\"fn\">Pipeline</span>([\n        (<span class=\"str\"\
    >'poly'</span>,   <span class=\"fn\">PolynomialFeatures</span>(degree=degree,\
    \ include_bias=<span class=\"kw\">False</span>)),\n        (<span class=\"str\"\
    >'scaler'</span>, <span class=\"fn\">StandardScaler</span>()),\n        (<span\
    \ class=\"str\">'model'</span>,  <span class=\"fn\">LinearRegression</span>())\n\
    \    ])\n    pipe.<span class=\"fn\">fit</span>(X, y)\n    y_fit = pipe.<span\
    \ class=\"fn\">predict</span>(X_plot)\n    train_mse = <span class=\"fn\">mean_squared_error</span>(y,\
    \ pipe.<span class=\"fn\">predict</span>(X))\n\n    axes[i].<span class=\"fn\"\
    >scatter</span>(X, y, s=<span class=\"num\">15</span>, alpha=<span class=\"num\"\
    >0.6</span>, color=<span class=\"str\">'#6c8cff'</span>, label=<span class=\"\
    str\">'Data'</span>)\n    axes[i].<span class=\"fn\">plot</span>(X_plot, y_fit,\
    \ color=<span class=\"str\">'#e56b8c'</span>, lw=<span class=\"num\">2</span>,\
    \ label=<span class=\"str\">f'Degree {degree}'</span>)\n    axes[i].<span class=\"\
    fn\">set_title</span>(<span class=\"str\">f'Degree {degree}  (Train MSE: {train_mse:.3f})'</span>)\n\
    \    axes[i].<span class=\"fn\">legend</span>(fontsize=<span class=\"num\">9</span>);\
    \ axes[i].<span class=\"fn\">set_ylim</span>(-<span class=\"num\">2</span>, <span\
    \ class=\"num\">12</span>)\n\n<span class=\"cm\"># Degree 1: high bias (underfits\
    \ — straight line misses the curve)</span>\n<span class=\"cm\"># Degree 2: balanced\
    \ (correctly captures the true quadratic pattern)</span>\n<span class=\"cm\">#\
    \ Degree 10: low bias but HIGH variance (wiggles through noise — overfits)</span>\n\
    \nplt.<span class=\"fn\">suptitle</span>(<span class=\"str\">'Polynomial Regression\
    \ — Degree Comparison'</span>)\nplt.<span class=\"fn\">tight_layout</span>()\n\
    plt.<span class=\"fn\">savefig</span>(<span class=\"str\">'poly_degrees.png'</span>,\
    \ dpi=<span class=\"num\">150</span>)</pre>\n</div>\n<h3 class=\"sh3\">\n    \
    \   2. Bias-Variance Tradeoff — The Central Tension of ML\n      </h3>\n<div class=\"\
    math-block\">\n<span class=\"formula\">\n        $$Expected Test Error = Bias²\
    \ + Variance + Irreducible Noise$$\n       </span>\n<span class=\"desc\">\n  \
    \      Three separate sources of error. Only bias and variance are controllable.\n\
    \       </span>\n<span class=\"formula\">\n        $$Bias: error from wrong assumptions\
    \ (e.g., fitting a line to a curve)$$\n       </span>\n<span class=\"formula\"\
    >\n        $$Variance: sensitivity to small fluctuations in training data$$\n\
    \       </span>\n</div>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin:\
    \ 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n     \
    \    MODEL STATE\n        </th>\n<th>\n         TRAIN ERROR\n        </th>\n<th>\n\
    \         TEST ERROR\n        </th>\n<th>\n         BIAS\n        </th>\n<th>\n\
    \         VARIANCE\n        </th>\n<th>\n         FIX\n        </th>\n</tr>\n\
    <tr>\n<td>\n<strong>\n          Underfitting\n         </strong>\n</td>\n<td>\n\
    \         High\n        </td>\n<td>\n         High\n        </td>\n<td>\n    \
    \     High\n        </td>\n<td>\n         Low\n        </td>\n<td>\n         More\
    \ features, higher degree, more complex model\n        </td>\n</tr>\n<tr>\n<td>\n\
    <strong>\n          Just Right\n         </strong>\n</td>\n<td>\n         Low\n\
    \        </td>\n<td>\n         Low\n        </td>\n<td>\n         Moderate\n \
    \       </td>\n<td>\n         Moderate\n        </td>\n<td>\n         Keep this!\n\
    \        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          Overfitting\n         </strong>\n\
    </td>\n<td>\n         Very Low\n        </td>\n<td>\n         High\n        </td>\n\
    <td>\n         Low\n        </td>\n<td>\n         High\n        </td>\n<td>\n\
    \         Regularization, reduce degree, more training data\n        </td>\n</tr>\n\
    </table></div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — bias_variance_curves.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"\
    kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"\
    kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> PolynomialFeatures,\
    \ StandardScaler\n<span class=\"kw\">from</span> sklearn.linear_model <span class=\"\
    kw\">import</span> LinearRegression\n<span class=\"kw\">from</span> sklearn.model_selection\
    \ <span class=\"kw\">import</span> cross_val_score\n<span class=\"kw\">from</span>\
    \ sklearn.pipeline <span class=\"kw\">import</span> Pipeline\n<span class=\"kw\"\
    >import</span> warnings; warnings.<span class=\"fn\">filterwarnings</span>(<span\
    \ class=\"str\">'ignore'</span>)\n\nnp.random.<span class=\"fn\">seed</span>(<span\
    \ class=\"num\">42</span>)\nX = np.<span class=\"fn\">linspace</span>(-<span class=\"\
    num\">3</span>, <span class=\"num\">3</span>, <span class=\"num\">120</span>).<span\
    \ class=\"fn\">reshape</span>(-<span class=\"num\">1</span>, <span class=\"num\"\
    >1</span>)\ny = <span class=\"num\">0.5</span>*X.<span class=\"fn\">ravel</span>()**<span\
    \ class=\"num\">2</span> - <span class=\"num\">2</span>*X.<span class=\"fn\">ravel</span>()\
    \ + <span class=\"num\">3</span> + np.random.<span class=\"fn\">randn</span>(<span\
    \ class=\"num\">120</span>)*<span class=\"num\">0.7</span>\n\ndegrees = <span\
    \ class=\"fn\">range</span>(<span class=\"num\">1</span>, <span class=\"num\"\
    >13</span>)\ntrain_mses, val_mses = [], []\n\n<span class=\"kw\">for</span> deg\
    \ <span class=\"kw\">in</span> degrees:\n    pipe = <span class=\"fn\">Pipeline</span>([\n\
    \        (<span class=\"str\">'poly'</span>, <span class=\"fn\">PolynomialFeatures</span>(degree=deg,\
    \ include_bias=<span class=\"kw\">False</span>)),\n        (<span class=\"str\"\
    >'sc'</span>,   <span class=\"fn\">StandardScaler</span>()),\n        (<span class=\"\
    str\">'lr'</span>,   <span class=\"fn\">LinearRegression</span>())\n    ])\n \
    \   <span class=\"cm\"># Training MSE — always decreases as degree increases</span>\n\
    \    pipe.<span class=\"fn\">fit</span>(X, y)\n    train_mses.<span class=\"fn\"\
    >append</span>(np.<span class=\"fn\">mean</span>((y - pipe.predict(X))**2))\n\n\
    \    <span class=\"cm\"># Validation MSE via cross-validation (5 folds) — the\
    \ honest estimate</span>\n    cv_scores = <span class=\"fn\">cross_val_score</span>(pipe,\
    \ X, y, cv=<span class=\"num\">5</span>,\n                                scoring=<span\
    \ class=\"str\">'neg_mean_squared_error'</span>)\n    val_mses.<span class=\"\
    fn\">append</span>(-cv_scores.<span class=\"fn\">mean</span>())\n\noptimal_deg\
    \ = degrees[np.<span class=\"fn\">argmin</span>(val_mses)]\n<span class=\"fn\"\
    >print</span>(<span class=\"str\">f\"Optimal polynomial degree: {optimal_deg}\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Best CV MSE:\
    \ {min(val_mses):.4f}\"</span>)\n\n<span class=\"cm\"># Plot the bias-variance\
    \ tradeoff curve</span>\nplt.<span class=\"fn\">figure</span>(figsize=(<span class=\"\
    num\">9</span>, <span class=\"num\">4</span>))\nplt.<span class=\"fn\">plot</span>(degrees,\
    \ train_mses, <span class=\"str\">'o-'</span>, color=<span class=\"str\">'#4fd1a5'</span>,\
    \ label=<span class=\"str\">'Training MSE'</span>)\nplt.<span class=\"fn\">plot</span>(degrees,\
    \ val_mses,   <span class=\"str\">'o-'</span>, color=<span class=\"str\">'#e56b8c'</span>,\
    \ label=<span class=\"str\">'Validation MSE (CV)'</span>)\nplt.<span class=\"\
    fn\">axvline</span>(optimal_deg, color=<span class=\"str\">'#f7a94b'</span>, linestyle=<span\
    \ class=\"str\">'--'</span>, label=<span class=\"str\">f'Optimal = {optimal_deg}'</span>)\n\
    plt.<span class=\"fn\">xlabel</span>(<span class=\"str\">'Polynomial Degree'</span>)\n\
    plt.<span class=\"fn\">ylabel</span>(<span class=\"str\">'MSE'</span>)\nplt.<span\
    \ class=\"fn\">title</span>(<span class=\"str\">'Bias-Variance Tradeoff — Training\
    \ vs Validation Error'</span>)\nplt.<span class=\"fn\">legend</span>()\nplt.<span\
    \ class=\"fn\">tight_layout</span>()\nplt.savefig('bias_variance.png', dpi=150)</pre>\n\
    </div>\n<div class=\"ml-connect\">\n       The bias-variance tradeoff is why regularization\
    \ (Ridge, Lasso) exists. Both reduce variance at the cost of a small increase\
    \ in bias — the net effect is lower test error. Deep learning models are extremely\
    \ high-variance (millions of parameters) and use dropout, batch norm, weight decay,\
    \ and data augmentation to control variance. The tradeoff never disappears — managing\
    \ it is the core skill of ML engineering.\n      </div>\n<div class=\"hinglish\"\
    >\n       \U0001F4A1 Training error hamesha neche jaata hai degree ke saath —\
    \ yeh useless metric hai model selection ke liye. Sirf CV validation error dekhna.\
    \ Jab validation curve neeche aane ke baad upar jaane lage — wahan degree bahut\
    \ zyada ho gayi (overfit). Wahi optimal degree hai jahan validation error minimum\
    \ ho.\n      </div>\n<h2 class=\"sh2\">\n       \U0001F52E Predict the Output\n\
    \      </h2>\n<h2 class=\"sh2\">\n       \U0001F41B Find the Bug\n      </h2>\n\
    <div class=\"debug-block\">\n<div class=\"debug-label\">\n        DEBUG CHALLENGE\
    \ — Selecting degree using training error\n       </div>\n<div class=\"cb\">\n\
    <div class=\"cb-head\">\n<span class=\"cb-lang\">\n          python — buggy logic\n\
    \         </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n           copy\n          </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n           Run\n   \
    \       </button>\n</div>\n</div>\n<pre><span class=\"cm\"># Step 1: Model Training\
    \ &amp; Evaluation Workflow</span>\n<span class=\"kw\">from</span> sklearn.preprocessing\
    \ <span class=\"kw\">import</span> PolynomialFeatures\n<span class=\"kw\">from</span>\
    \ sklearn.linear_model <span class=\"kw\">import</span> LinearRegression\n<span\
    \ class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> mean_squared_error\n\
    \nbest_deg, best_mse = <span class=\"num\">0</span>, <span class=\"fn\">float</span>(<span\
    \ class=\"str\">'inf'</span>)\n<span class=\"kw\">for</span> deg <span class=\"\
    kw\">in</span> <span class=\"fn\">range</span>(<span class=\"num\">1</span>, <span\
    \ class=\"num\">15</span>):\n    pf = <span class=\"fn\">PolynomialFeatures</span>(degree=deg)\n\
    \    X_tr_p = pf.<span class=\"fn\">fit_transform</span>(X_train)\n    X_te_p\
    \ = pf.<span class=\"fn\">transform</span>(X_test)\n    lr = <span class=\"fn\"\
    >LinearRegression</span>().<span class=\"fn\">fit</span>(X_tr_p, y_train)\n  \
    \  mse = <span class=\"fn\">mean_squared_error</span>(y_train, lr.<span class=\"\
    fn\">predict</span>(X_tr_p))  <span class=\"cm\"># Bug!</span>\n    <span class=\"\
    kw\">if</span> mse &lt; best_mse:\n        best_mse, best_deg = mse, deg\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"Best degree: {best_deg}\"</span>)\
    \  <span class=\"cm\"># Will always be 14 (highest) — wrong!</span></pre>\n</div>\n\
    <button class=\"solution-toggle\" onclick=\"toggleSolution('debug39-sol')\">\n\
