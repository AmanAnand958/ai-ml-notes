    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np
    y_true = np.<span class="fn">array</span>([<span class="num">10</span>, <span class="num">0</span>, <span class="num">20</span>, <span class="num">15</span>, <span class="num">0</span>])  <span class="cm"># contains zeros!</span>
    y_pred = np.<span class="fn">array</span>([<span class="num">12</span>, <span class="num">2</span>, <span class="num">18</span>, <span class="num">14</span>, <span class="num">1</span>])
    mape = np.<span class="fn">mean</span>(np.<span class="fn">abs</span>((y_true - y_pred) / y_true)) * <span class="num">100</span>  <span class="cm"># Bug!</span>
    <span class="fn">print</span>(<span class="str">f"MAPE: {mape:.2f}%"</span>)</code></pre>
