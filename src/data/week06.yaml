  quizzes:
  - num_str: QUESTION 1 OF 4
    question: PolynomialFeatures(degree=2, include_bias=False) is applied to features
      [x₁, x₂]. How many features result?
    qid: q39_1
    options:
    - letter: A
      text: 4 — [x₁, x₂, x₁², x₂²]
      is_correct: false
    - letter: B
      text: 5 — [x₁, x₂, x₁², x₁x₂, x₂²]
      is_correct: true
    - letter: C
      text: 6 — [1, x₁, x₂, x₁², x₁x₂, x₂²]
      is_correct: false
    - letter: D
      text: 3 — [x₁², x₁x₂, x₂²]
      is_correct: false
    correct_fb: '✅ Correct! With 2 features and degree=2 (no bias), you get all terms
      up to degree 2: x₁, x₂, x₁², x₁x₂, x₂² = 5 features. The interaction term x₁x₂
      is included automatically — this is powerful for capturing feature interactions
      without manual engineering. With bias=True, you''d get 6 (adds the constant
      1). General formula: C(p+d, d) − 1 without bias.'
    wrong_fb: '❌ PolynomialFeatures includes ALL terms up to the specified degree
      INCLUDING interaction terms. For 2 features and degree 2: x₁, x₂ (degree 1)
      + x₁², x₁x₂, x₂² (degree 2) = 5 features. Without include_bias=False, you''d
      also get the constant term (6 total). The interaction term x₁x₂ is what makes
      polynomial features useful for capturing feature interactions.'
  - num_str: QUESTION 2 OF 4
    question: A model has very low training error but very high test error. Which
      best describes it?
    qid: q39_2
    options:
    - letter: A
      text: High bias, low variance — the model is too simple
      is_correct: false
    - letter: B
      text: Low bias, high variance — the model overfits the training data
      is_correct: true
    - letter: C
      text: High bias, high variance — the model is broken
      is_correct: false
    - letter: D
      text: Low bias, low variance — the model is optimal
      is_correct: false
    correct_fb: '✅ Correct! Low training error = the model fits training data well
      = low bias. High test error = the model doesn''t generalize = high variance.
      This is the definition of overfitting: memorizing training patterns including
      noise, so performance collapses on unseen data. Fix: regularize (Ridge/Lasso),
      reduce model complexity, get more training data, or use dropout in neural networks.'
    wrong_fb: '❌ Low train error + high test error = overfitting = low bias + high
      variance. High bias would mean BOTH training and test errors are high (the model
      can''t even learn the training data). Memorize: train≈test≈high → underfitting;
      train≈low, test≈high → overfitting; train≈test≈low → ideal.'
  - num_str: QUESTION 3 OF 4
    question: Why is it important to fit PolynomialFeatures on training data only,
      then transform both train and test?
    qid: q39_3
    options:
    - letter: A
      text: Because polynomial transformation is slow and doing it twice wastes time
      is_correct: false
    - letter: B
      text: Because fit_transform changes the polynomial degree based on data statistics
      is_correct: false
    - letter: C
      text: Consistency — both sets must go through the same transformation so the
        column structure is identical for the model to use
      is_correct: true
    - letter: D
      text: To prevent data leakage — test data statistics might change the feature
        names
      is_correct: false
    correct_fb: '✅ Correct (with nuance)! PolynomialFeatures doesn''t compute statistics
      from data — it just creates powers and interactions. The real reason is consistency:
      fit() learns the output feature names/structure (needed for pipeline consistency),
      so both train and test go through the same column structure. This matters more
      for StandardScaler (which DOES learn mean/std from train). In a Pipeline, this
      is all handled automatically — one more reason to always use Pipeline.'
    wrong_fb: ❌ For PolynomialFeatures specifically, fit() doesn't compute data statistics
      — it just defines the output structure. The key reason is pipeline consistency.
      But this matters CRITICALLY for preprocessing steps like StandardScaler or imputers,
      which DO learn statistics from training data. Always use Pipeline to ensure
      train statistics are applied consistently to test data — that's the real lesson
      here.
  - num_str: QUESTION 4 OF 4
    question: 'Adding more training data to an overfitting model: what happens to
      the bias-variance decomposition?'
    qid: q39_4
    options:
    - letter: A
      text: Bias decreases, variance stays the same
      is_correct: false
    - letter: B
      text: Variance decreases — more data forces the model to generalize; bias stays
        approximately the same
      is_correct: true
    - letter: C
      text: Both bias and variance decrease equally
      is_correct: false
    - letter: D
      text: The model complexity automatically adjusts so both increase
      is_correct: false
    correct_fb: '✅ Correct! More data primarily reduces variance. Why? A high-variance
      model is sensitive to which specific training examples it sees. With more diverse
      data, the model can''t just memorize — it must learn genuine patterns. Bias
      (the model''s inherent assumptions) doesn''t change from adding data — a linear
      model on curved data stays biased no matter how much data you add. This is why
      in deep learning, the rule "more data, more compute" works: more data tames
      the variance of overparameterized models.'
    wrong_fb: ❌ More data → variance decreases, bias stays approximately the same.
      Variance comes from sensitivity to training data fluctuations — more data smooths
      these out. Bias comes from the model's structural assumptions — a degree-1 polynomial
      on curved data stays biased with any amount of data. This is why underfitting
      can't be fixed with more data, but overfitting usually can.
  flashcards:
  - front: Lasso vs Ridge Regression?
    back: 'Lasso (L1): Adds absolute weight penalty, leads to sparse feature selection.
      Ridge (L2): Adds squared weight penalty, shrinks weights.'
  - front: R-squared?
    back: 'Proportion of variance in the dependent variable explained by features:
      1 - (SS_res / SS_tot).'
  - front: Mean Squared Error (MSE)?
    back: Average of squared differences between true and predicted values. Highly
      sensitive to outliers.
  - front: MAE vs MSE?
    back: MAE (Mean Absolute Error) uses absolute differences (linear penalty); MSE
      uses squared differences (quadratic penalty for outliers).
  - front: Multicollinearity?
    back: When two or more predictor variables are highly correlated, inflating the
      variance of regression coefficients.
  gotcha:
    title: '⚠️ Gotcha: Gradient Descent Vanishing & Explosions'
    description: Unnormalized input features lead to oscillating gradients and slow
      convergence. Always normalize features before gradient descent.
  takeaways:
    hinglish_line: ''
    bullets:
    - "<strong>\n           PolynomialFeatures adds interaction terms:\n         \
      \ </strong>\n          degree=2 with 2 features → 5 features [x₁, x₂, x₁², x₁x₂,\
      \ x₂²]. Feature count grows combinatorially with degree."
    - "<strong>\n           Bias-Variance decomposition:\n          </strong>\n  \
      \        Error = Bias² + Variance + Noise. Reduce bias with complexity; reduce\
      \ variance with regularization or more data."
    - "<strong>\n           Diagnosis from error curves:\n          </strong>\n  \
      \        train≈test≈high → underfitting; train&lt;&lt;test → overfitting."
    - "<strong>\n           Hyperparameter selection rule:\n          </strong>\n\
      \          Always use cross-validation. Never select model complexity by minimising\
      \ training error — that always picks the most overfit model."
    - "<strong>\n           More data fixes variance:\n          </strong>\n     \
      \     Adding training data reduces overfitting. It cannot fix underfitting —\
      \ only a more flexible model can do that."
