- id: '42'
  day_num: 42
  title: Regression Metrics — Which One When?
  subtitle: MSE, MAE, RMSE, R², Adjusted R², MAPE, Huber Loss — sabka use case alag
    hai. Wrong metric choose karo aur aap ek model optimize karoge jo real problem
