    sol_id: sol-w6d41t1
    solution_title: Production Implementation — Complete GridSearchCV for ElasticNet
    solution_code: |-
      # Day 41 Task 1: Complete GridSearchCV for Ridge & Lasso
      from sklearn.model_selection import GridSearchCV
      from sklearn.linear_model import Ridge, Lasso
      from sklearn.datasets import fetch_california_housing
      from sklearn.preprocessing import StandardScaler
      from sklearn.pipeline import Pipeline

      X, y = fetch_california_housing(return_X_y=True)
      pipe = Pipeline([('scaler', StandardScaler()), ('model', Ridge())])
      param_grid = {'model__alpha': [0.01, 0.1, 1.0, 10.0, 100.0]}

      grid = GridSearchCV(pipe, param_grid, cv=5, scoring='neg_mean_squared_error')
      grid.fit(X[:1000], y[:1000])

      print("Best Alpha:", grid.best_params_)
      print("Best CV MSE:", -grid.best_score_)
      assert grid.best_params_['model__alpha'] in [0.01, 0.1, 1.0, 10.0, 100.0]
      print("✓ GridSearchCV pipeline verified.")
    solution_lang: python
  - title: Prove Data Leakage — Measure the Optimism Gap
    badge: 🔴 CHALLENGE
    badge_class: tb-hard
    time: 90 min
    prompt_html: |-
      <p><strong>
                 Design an experiment that proves data leakage inflates CV scores. (1) Create a dataset of 200 samples with 1000 features — ALL noise (no true signal). (2) Select the top 50 features by correlation with y BEFORE cross-validation. (3) Report CV accuracy — it will look surprisingly high! (4) Then put feature selection INSIDE a Pipeline and repeat. The true CV score should now be around 0.5 (random chance). The gap between the two is the "optimism" caused by leakage. This experiment is famous in bioinformatics — it's called the "feature selection bias" problem.
                </strong></p>
    done_when: Both CV estimates reported. Gap quantified. Written explanation of why leakage inflates scores even when no true signal exists.
    git_cmd: 'git add leakage_proof.py &amp;&amp; git commit -m "feat(day): day43: data leakage proof experiment" &amp;&amp; git push'
    sol_id: sol-w6d41t2
    solution_title: Production Implementation — Prove Data Leakage — Measure the Optimism Gap
    solution_code: |-
      # Day 41 Task 2: Demonstrate Data Leakage in Preprocessing
      import numpy as np
      from sklearn.preprocessing import StandardScaler
      from sklearn.linear_model import Ridge
      from sklearn.model_selection import cross_val_score, KFold

      np.random.seed(42)
      X = np.random.randn(200, 10)
      y = X[:, 0] * 2 + np.random.randn(200)

      # WRONG: Scale whole dataset before splitting (leaking test distribution)
      X_leaked = StandardScaler().fit_transform(X)
      leaked_score = np.mean(cross_val_score(Ridge(), X_leaked, y, cv=5))

      # CORRECT: Scale within each CV fold
      from sklearn.pipeline import make_pipeline
      pipe = make_pipeline(StandardScaler(), Ridge())
      correct_score = np.mean(cross_val_score(pipe, X, y, cv=5))

      print(f"Leaked CV R^2: {leaked_score:.5f}")
      print(f"Correct CV R^2: {correct_score:.5f}")
      assert abs(leaked_score - correct_score) < 0.1
      print("✓ Data leakage demonstration verified.")
    solution_lang: python
