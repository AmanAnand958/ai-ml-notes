    <div class="interview">
    <strong>
            Interview classic: "When would you choose Lasso over Ridge?"
           </strong>
    <br/>
    <br/>
    <strong>
            Answer:
           </strong>
           When you suspect only a few features are truly predictive (sparse signal), or when you want automatic feature selection as part of the model. If all features are relevant with small individual effects (like genomics with 20,000 genes all affecting disease risk slightly), use Ridge. If you're working in economics and 3 variables explain most of the variance — Lasso. Always scale features before both.
