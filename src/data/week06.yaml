    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np

    <span class="cm"># Data with 5 samples and 3 features (more features than samples)</span>
    X = np.random.<span class="fn">randn</span>(<span class="num">3</span>, <span class="num">5</span>)   <span class="cm"># Bug in shape!</span>
    y = np.random.<span class="fn">randn</span>(<span class="num">3</span>)
    X_b = np.<span class="fn">column_stack</span>([np.<span class="fn">ones</span>(<span class="num">3</span>), X])
    beta = np.linalg.<span class="fn">inv</span>(X_b.T @ X_b) @ X_b.T @ y  <span class="cm"># will fail or give garbage</span>
    <span class="fn">print</span>(beta)</code></pre>
    </div>
    <button class="solution-toggle" onclick="toggleSolution('debug38-sol')">
            👁 Show Fix
           </button>
    <div class="solution-box" id="debug38-sol">
    <div class="sol-header">
             BUG EXPLAINED
            </div>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
               python — fixed
              </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">copy</button><button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">Run</button></div>
    </div>
    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np

    <span class="cm"># BUG 1: X shape is (3, 5) meaning 3 samples, 5 features.</span>
    <span class="cm"># With only 3 samples and 5 features (p &gt; n), XᵀX is (6×6) but SINGULAR —</span>
    <span class="cm"># the system is underdetermined (infinite solutions). np.linalg.inv will</span>
    <span class="cm"># either raise LinAlgError or return meaningless values.</span>
    <span class="cm">#</span>
    <span class="cm"># FIX OPTIONS:</span>
    <span class="cm"># 1. Use np.linalg.pinv (Moore-Penrose pseudoinverse) — safe always</span>
    <span class="cm"># 2. Add more samples (need n &gt; p for standard OLS)</span>
    <span class="cm"># 3. Use Ridge Regression which handles p >= n gracefully</span>

    <span class="cm"># Standard fix: transpose to get correct shape (5 samples, 3 features)</span>
    X = np.random.<span class="fn">randn</span>(<span class="num">5</span>, <span class="num">3</span>)   <span class="cm"># 5 samples, 3 features — shape must be (n, p)</span>
    y = np.random.<span class="fn">randn</span>(<span class="num">5</span>)
    X_b = np.<span class="fn">column_stack</span>([np.<span class="fn">ones</span>(<span class="num">5</span>), X])
    beta = np.linalg.<span class="fn">pinv</span>(X_b.T @ X_b) @ X_b.T @ y  <span class="cm"># pinv is safer than inv</span>
    <span class="fn">print</span>(beta.shape)   <span class="cm"># (4,) = intercept + 3 features ✅</span>

    <span class="cm"># Rule: X.shape must be (n_samples, n_features). n_samples &gt; n_features for OLS.</span></code></pre>
