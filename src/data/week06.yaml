  theory_html: |-
    <p><h3 class="sh3">
           1. Why Regularise? The Shrinkage Intuition
          </h3>

    <div class="math-block">
    <span class="formula">
            $$OLS Loss = Σ(yᵢ − ŷᵢ)²$$
           </span>
    <span class="formula">
            $$Ridge Loss = Σ(yᵢ − ŷᵢ)² + α × Σβⱼ²          [L2 penalty — squared coefficients]$$
           </span>
    <span class="formula">
            $$Lasso Loss = Σ(yᵢ − ŷᵢ)² + α × Σ|βⱼ|         [L1 penalty — absolute coefficients]$$
           </span>
    <span class="desc">
            α (alpha) = regularization strength. α=0 → pure OLS. α→∞ → all coefficients → 0.
           </span>
    </div>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — ridge_lasso_compare.py
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt
    <span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> Ridge, Lasso, LinearRegression, RidgeCV, LassoCV
    <span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span> StandardScaler
    <span class="kw">from</span> sklearn.datasets <span class="kw">import</span> fetch_california_housing
    <span class="kw">from</span> sklearn.model_selection <span class="kw">import</span> train_test_split

    data = <span class="fn">fetch_california_housing</span>()
    X = data.data; y = data.target
    X_tr, X_te, y_tr, y_te = <span class="fn">train_test_split</span>(X, y, test_size=<span class="num">0.2</span>, random_state=<span class="num">42</span>)
    sc = <span class="fn">StandardScaler</span>()
    Xtr = sc.<span class="fn">fit_transform</span>(X_tr); Xte = sc.<span class="fn">transform</span>(X_te)

    alphas = [<span class="num">0.001</span>, <span class="num">0.01</span>, <span class="num">0.1</span>, <span class="num">1</span>, <span class="num">10</span>, <span class="num">100</span>, <span class="num">1000</span>]

    <span class="cm"># Collect coefficients for each alpha to plot the regularization path</span>
    ridge_coefs = [<span class="fn">Ridge</span>(alpha=a).<span class="fn">fit</span>(Xtr, y_tr).coef_ <span class="kw">for</span> a <span class="kw">in</span> alphas]
    lasso_coefs = [<span class="fn">Lasso</span>(alpha=a, max_iter=<span class="num">5000</span>).<span class="fn">fit</span>(Xtr, y_tr).coef_ <span class="kw">for</span> a <span class="kw">in</span> alphas]

    <span class="cm"># === KEY DIFFERENCE: sparsity ===</span>
    ridge_zeros = [np.<span class="fn">sum</span>(c == <span class="num">0</span>) <span class="kw">for</span> c <span class="kw">in</span> ridge_coefs]
    lasso_zeros = [np.<span class="fn">sum</span>(c == <span class="num">0</span>) <span class="kw">for</span> c <span class="kw">in</span> lasso_coefs]
    <span class="fn">print</span>(<span class="str">f"Ridge zero coefficients: {ridge_zeros}"</span>)  <span class="cm"># almost always 0 — Ridge never zeroes out</span>
    <span class="fn">print</span>(<span class="str">f"Lasso zero coefficients: {lasso_zeros}"</span>)  <span class="cm"># grows with alpha — feature selection!</span>

    <span class="cm"># === Auto-tune alpha with cross-validation ===</span>
    ridge_cv = <span class="fn">RidgeCV</span>(alphas=np.<span class="fn">logspace</span>(-<span class="num">3</span>, <span class="num">3</span>, <span class="num">50</span>), cv=<span class="num">5</span>)
    ridge_cv.<span class="fn">fit</span>(Xtr, y_tr)
    <span class="fn">print</span>(<span class="str">f"\nRidgeCV best alpha : {ridge_cv.alpha_:.4f}"</span>)
    <span class="fn">print</span>(<span class="str">f"RidgeCV test MSE   : {np.mean((y_te - ridge_cv.predict(Xte))**2):.4f}"</span>)

    lasso_cv = <span class="fn">LassoCV</span>(alphas=np.<span class="fn">logspace</span>(-<span class="num">3</span>, <span class="num">1</span>, <span class="num">50</span>), cv=<span class="num">5</span>, max_iter=<span class="num">5000</span>)
    lasso_cv.<span class="fn">fit</span>(Xtr, y_tr)
    <span class="fn">print</span>(<span class="str">f"\nLassoCV best alpha : {lasso_cv.alpha_:.4f}"</span>)
    <span class="fn">print</span>(<span class="str">f"LassoCV test MSE   : {np.mean((y_te - lasso_cv.predict(Xte))**2):.4f}"</span>)
    <span class="fn">print</span>(<span class="str">f"Features eliminated: {np.sum(lasso_cv.coef_ == 0)}/{X.shape[1]}"</span>)</code></pre>
