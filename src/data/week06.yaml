    </div>\n<pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span>\
    \ pd\n<span class=\"kw\">from</span> sklearn.linear_model <span class=\"kw\">import</span>\
    \ LinearRegression\ndf = pd.<span class=\"fn\">DataFrame</span>({<span class=\"\
    str\">'color'</span>: [<span class=\"str\">'red'</span>, <span class=\"str\">'blue'</span>,\
    \ <span class=\"str\">'green'</span>], <span class=\"str\">'price'</span>: [<span\
    \ class=\"num\">100</span>, <span class=\"num\">150</span>, <span class=\"num\"\
    >120</span>]})\n<span class=\"cm\"># One-hot encode without dropping categories</span>\n\
    X = pd.<span class=\"fn\">get_dummies</span>(df[<span class=\"str\">'color'</span>])\n\
    model = <span class=\"fn\">LinearRegression</span>().<span class=\"fn\">fit</span>(X,\
    \ df[<span class=\"str\">'price'</span>])</pre>\n</div>\n<button class=\"solution-toggle\"\
    \ onclick=\"toggleSolution('debug-sol-6')\">\n<span>\n          \U0001F50D Reveal\
    \ Bug &amp; Fix\n         </span>\n</button>\n<div class=\"solution-box\" id=\"\
    debug-sol-6\">\n<div class=\"sol-header\">\n          SOLUTION &amp; EXPLANATION\n\
    \         </div>\n<div style=\"padding:1rem; background:rgba(0,0,0,0.2); font-size:13px;\
    \ line-height:1.6;\">\n<strong>\n           The Bug:\n          </strong>\n  \
    \        If you one-hot encode all categories, the columns become perfectly collinear\
    \ because their sum is always a vector of ones (which matches the intercept column).\
    \ This multicollinearity destabilizes linear regressions. You must drop one category\
    \ to serve as the baseline.\n          <br/>\n<br/>\n<strong>\n           The\
    \ Fix:\n          </strong>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n             python\n            </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n         \
    \     copy\n             </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    >\n              Run\n             </button>\n</div>\n</div>\n<pre><span class=\"\
    kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\"\
    >from</span> sklearn.linear_model <span class=\"kw\">import</span> LinearRegression\n\
    df = pd.<span class=\"fn\">DataFrame</span>({<span class=\"str\">'color'</span>:\
    \ [<span class=\"str\">'red'</span>, <span class=\"str\">'blue'</span>, <span\
    \ class=\"str\">'green'</span>], <span class=\"str\">'price'</span>: [<span class=\"\
    num\">100</span>, <span class=\"num\">150</span>, <span class=\"num\">120</span>]})\n\
    <span class=\"cm\"># Drop the first category to avoid multicollinearity</span>\n\
    X = pd.<span class=\"fn\">get_dummies</span>(df[<span class=\"str\">'color'</span>],\
    \ drop_first=<span class=\"kw\">True</span>)\nmodel = <span class=\"fn\">LinearRegression</span>().<span\
    \ class=\"fn\">fit</span>(X, df[<span class=\"str\">'price'</span>])</pre>\n</div>\n\
    </div>\n</div>\n</div><div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n           python — End-to-End Regression Capstone Pipeline\n\
    \          </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n            copy\n           </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"\
    kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\"\
    >from</span> sklearn.model_selection <span class=\"kw\">import</span> train_test_split,\
    \ GridSearchCV\n<span class=\"kw\">from</span> sklearn.preprocessing <span class=\"\
    kw\">import</span> StandardScaler, PolynomialFeatures\n<span class=\"kw\">from</span>\
    \ sklearn.linear_model <span class=\"kw\">import</span> Ridge, Lasso\n<span class=\"\
    kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> mean_squared_error,\
    \ r2_score\n\n<span class=\"cm\"># 1. Generate Synthetic Housing Regression Data</span>\n\
    np.random.<span class=\"fn\">seed</span>(<span class=\"num\">42</span>)\nX = np.random.<span\
    \ class=\"fn\">rand</span>(<span class=\"num\">500</span>, <span class=\"num\"\
    >5</span>) * <span class=\"num\">100</span>\ny = <span class=\"num\">3.5</span>\
    \ * X[:, <span class=\"num\">0</span>] + <span class=\"num\">1.2</span> * X[:,\
    \ <span class=\"num\">1</span>]**<span class=\"num\">1.5</span> - <span class=\"\
    num\">2.0</span> * X[:, <span class=\"num\">2</span>] + np.random.<span class=\"\
    fn\">normal</span>(<span class=\"num\">0</span>, <span class=\"num\">15</span>,\
    \ <span class=\"num\">500</span>)\n\n<span class=\"cm\"># 2. Train/Test Split\
    \ &amp; Feature Scaling</span>\nX_train, X_test, y_train, y_test = <span class=\"\
    fn\">train_test_split</span>(X, y, test_size=<span class=\"num\">0.2</span>, random_state=<span\
    \ class=\"num\">42</span>)\nscaler = <span class=\"fn\">StandardScaler</span>()\n\
    X_train_scaled = scaler.<span class=\"fn\">fit_transform</span>(X_train)\nX_test_scaled\
    \ = scaler.<span class=\"fn\">transform</span>(X_test)\n\n<span class=\"cm\">#\
    \ 3. Ridge Regression with Grid Search Hyperparameter Tuning</span>\nparam_grid\
    \ = {<span class=\"str\">'alpha'</span>: [<span class=\"num\">0.01</span>, <span\
    \ class=\"num\">0.1</span>, <span class=\"num\">1.0</span>, <span class=\"num\"\
    >10.0</span>, <span class=\"num\">100.0</span>]}\ngrid = <span class=\"fn\">GridSearchCV</span>(<span\
    \ class=\"fn\">Ridge</span>(), param_grid, cv=<span class=\"num\">5</span>, scoring=<span\
    \ class=\"str\">'r2'</span>)\ngrid.<span class=\"fn\">fit</span>(X_train_scaled,\
    \ y_train)\n\nbest_model = grid.best_estimator_\ny_pred = best_model.<span class=\"\
    fn\">predict</span>(X_test_scaled)\n\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"Best Ridge Alpha: {grid.best_params_['</span>alpha<span class=\"str\"\
    >']}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Test RMSE:\
    \ {np.sqrt(mean_squared_error(y_test, y_pred)):.4f}\"</span>)\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"Test R2 Score: {r2_score(y_test, y_pred):.4f}\"\
    </span>)</pre>\n</div>\n<!-- /day-44 -->\n<!-- /day-section -->\n</div>"
