    <pre><code><span class="cm"># BUG: size_sqft is on scale 1000-5000; num_rooms is 1-10.</span>
    <span class="cm"># The L1 penalty penalises COEFFICIENTS, not their contribution.</span>
    <span class="cm"># To predict 200k from size=1200, coefficient ≈ 167 (200k/1200).</span>
    <span class="cm"># To predict 200k from rooms=2, coefficient ≈ 100,000 (200k/2).</span>
    <span class="cm"># Lasso penalises |coef| → it heavily penalises the large num_rooms</span>
    <span class="cm"># coefficient and zeroes it out — even though num_rooms IS predictive!</span>
    <span class="cm"># This is COMPLETELY WRONG — the penalty reflects scale, not importance.</span>
    <span class="cm"># FIX: ALWAYS StandardScale features before Ridge or Lasso.</span>

