  - 'Capstone: End-to-End Hous'
  hinglish: XGBoost kaggle competitions jeetne ka secret weapon tha kuch saal pehle.
    Aaj bhi tabular data par ye best performance deta hai. Learning rate 0.01-0.1
    aur 100-1000 trees try karo!
  analogy: Socho ek pipe se guzarna. SVR ek "tube" banata hai data ke around — tube
    ki width ε (epsilon) hai. Jo points tube ke andar hain unhe model ignore karta
    hai (zero loss). Sirf jo points tube ke bahar hain unhe penalise karta hai. Yahi
    SVR ka magic hai — small errors ko bilkul tolerate karna, sirf large errors pe
    dhyan dena.
  theory_html: "<h3 class=\"sh3\">\n       1. Support Vector Regression (SVR)\n  \
    \    </h3>\n\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$SVR\
    \ minimizes: ||w||²/2 + C × Σ(ξᵢ + ξᵢ*)$$\n       </span>\n<span class=\"desc\"\
    >\n        Subject to: |yᵢ − ŷᵢ| ≤ ε + slack (ξ ≥ 0)\n       </span>\n<span class=\"\
    desc\">\n        ε = tube width (tolerance), C = regularization (smaller C = more\
    \ tolerance), kernel = non-linear transformation\n       </span>\n</div>\n<div\
    \ class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python\
    \ — svr_comparison.py\n        </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">\n          copy\n         </button>\n<button\
    \ class=\"run-btn\" onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n \
    \         Run\n         </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span>\
    \ numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span> matplotlib.pyplot\
    \ <span class=\"kw\">as</span> plt\n<span class=\"kw\">from</span> sklearn.svm\
    \ <span class=\"kw\">import</span> SVR\n<span class=\"kw\">from</span> sklearn.preprocessing\
    \ <span class=\"kw\">import</span> StandardScaler\n<span class=\"kw\">from</span>\
    \ sklearn.pipeline <span class=\"kw\">import</span> Pipeline\n<span class=\"kw\"\
    >from</span> sklearn.model_selection <span class=\"kw\">import</span> GridSearchCV\n\
    \nnp.random.<span class=\"fn\">seed</span>(<span class=\"num\">42</span>)\n<span\
    \ class=\"cm\"># Highly non-linear data: y = sin(x) + 0.5*cos(3x) + noise</span>\n\
    X = np.<span class=\"fn\">sort</span>(<span class=\"num\">6</span> * np.random.<span\
    \ class=\"fn\">rand</span>(<span class=\"num\">150</span>, <span class=\"num\"\
    >1</span>) - <span class=\"num\">3</span>, axis=<span class=\"num\">0</span>)\n\
    y = np.<span class=\"fn\">sin</span>(X).<span class=\"fn\">ravel</span>() + <span\
    \ class=\"num\">0.5</span> * np.<span class=\"fn\">cos</span>(<span class=\"num\"\
    >3</span>*X).<span class=\"fn\">ravel</span>() + np.random.<span class=\"fn\"\
    >randn</span>(<span class=\"num\">150</span>) * <span class=\"num\">0.15</span>\n\
    \n<span class=\"cm\"># SVR with RBF kernel — requires scaling!</span>\nsvr_pipe\
    \ = <span class=\"fn\">Pipeline</span>([\n    (<span class=\"str\">'scaler'</span>,\
    \ <span class=\"fn\">StandardScaler</span>()),\n    (<span class=\"str\">'svr'</span>,\
    \ <span class=\"fn\">SVR</span>(kernel=<span class=\"str\">'rbf'</span>))\n])\n\
    \n<span class=\"cm\"># Tune C, gamma, epsilon</span>\nparam_grid = {\n    <span\
    \ class=\"str\">'svr__C'</span>:       [<span class=\"num\">0.1</span>, <span\
    \ class=\"num\">1</span>, <span class=\"num\">10</span>, <span class=\"num\">100</span>],\n\
    \    <span class=\"str\">'svr__gamma'</span>:   [<span class=\"str\">'scale'</span>,\
    \ <span class=\"str\">'auto'</span>, <span class=\"num\">0.1</span>, <span class=\"\
    num\">1</span>],\n    <span class=\"str\">'svr__epsilon'</span>: [<span class=\"\
    num\">0.01</span>, <span class=\"num\">0.1</span>, <span class=\"num\">0.5</span>]\n\
    }\ngrid = <span class=\"fn\">GridSearchCV</span>(svr_pipe, param_grid, cv=<span\
    \ class=\"num\">5</span>, scoring=<span class=\"str\">'neg_mean_squared_error'</span>,\n\
    \                    n_jobs=-<span class=\"num\">1</span>)\ngrid.<span class=\"\
    fn\">fit</span>(X, y)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
    Best SVR params: {grid.best_params_}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Best CV MSE:     {-grid.best_score_:.4f}\"</span>)\n\n<span\
    \ class=\"cm\"># Key SVR parameters:</span>\n<span class=\"cm\"># C (regularization):\
    \ larger C → fit training data more strictly (less tolerance)</span>\n<span class=\"\
    cm\"># epsilon: width of the ε-tube — errors within ε get 0 penalty</span>\n<span\
    \ class=\"cm\"># gamma (RBF): controls \"reach\" of each training point</span>\n\
    <span class=\"cm\">#   gamma='scale' → 1/(n_features × X.var()) — good default</span>\n\
    <span class=\"cm\">#   high gamma → tight fit (potential overfit); low gamma →\
    \ smooth curve</span>\n\n<span class=\"cm\"># Plot result</span>\nX_plot = np.<span\
    \ class=\"fn\">linspace</span>(-<span class=\"num\">3</span>, <span class=\"num\"\
    >3</span>, <span class=\"num\">300</span>).<span class=\"fn\">reshape</span>(-<span\
    \ class=\"num\">1</span>, <span class=\"num\">1</span>)\ny_svr = grid.<span class=\"\
    fn\">predict</span>(X_plot)\nplt.<span class=\"fn\">figure</span>(figsize=(<span\
    \ class=\"num\">9</span>, <span class=\"num\">4</span>))\nplt.<span class=\"fn\"\
    >scatter</span>(X, y, s=<span class=\"num\">15</span>, alpha=<span class=\"num\"\
    >0.5</span>, color=<span class=\"str\">'#6c8cff'</span>, label=<span class=\"\
    str\">'Data'</span>)\nplt.<span class=\"fn\">plot</span>(X_plot, y_svr, <span\
    \ class=\"str\">'#e56b8c'</span>, lw=<span class=\"num\">2</span>, label=<span\
    \ class=\"str\">'SVR (RBF)'</span>)\nplt.<span class=\"fn\">plot</span>(X_plot,\
    \ np.<span class=\"fn\">sin</span>(X_plot.<span class=\"fn\">ravel</span>()) +\
    \ <span class=\"num\">0.5</span>*np.<span class=\"fn\">cos</span>(<span class=\"\
    num\">3</span>*X_plot.<span class=\"fn\">ravel</span>()),\n         <span class=\"\
    str\">'#4fd1a5'</span>, lw=<span class=\"num\">1</span>, linestyle=<span class=\"\
    str\">'--'</span>, label=<span class=\"str\">'True function'</span>)\nplt.<span\
    \ class=\"fn\">legend</span>(); plt.<span class=\"fn\">title</span>(<span class=\"\
    str\">'SVR with RBF Kernel — Non-linear Regression'</span>)\nplt.<span class=\"\
    fn\">tight_layout</span>(); plt.<span class=\"fn\">savefig</span>(<span class=\"\
    str\">'svr_fit.png'</span>, dpi=<span class=\"num\">150</span>)</pre>\n</div>\n\
    <h3 class=\"sh3\">\n       2. Tree-Based Regression Models\n      </h3>\n<figure\
