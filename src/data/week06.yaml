      <p><strong>
                 For each of these 4 real scenarios, create a synthetic dataset, train a LinearRegression, and report ALL metrics. Then write 2 sentences justifying which metric you would report to stakeholders: (1) Predicting hospital patient stay duration (heavily right-skewed, some very long stays), (2) Predicting daily electricity consumption for a power grid operator, (3) Predicting e-commerce product prices across categories (₹50 to ₹50,000), (4) Predicting number of product units sold daily (many zero-sale days).
