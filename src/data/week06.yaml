      \ class=\"num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\"\
      >1</span>, <span class=\"num\">1</span>, <span class=\"num\">0</span>, <span\
      \ class=\"num\">1</span>, <span class=\"num\">0</span>, <span class=\"num\"\
      >0</span>])\ny_probs = np.<span class=\"fn\">array</span>([<span class=\"num\"\
      >0.9</span>, <span class=\"num\">0.1</span>, <span class=\"num\">0.8</span>,\
      \ <span class=\"num\">0.4</span>, <span class=\"num\">0.2</span>, <span class=\"\
      num\">0.7</span>, <span class=\"num\">0.6</span>, <span class=\"num\">0.3</span>])\n\
      metrics = <span class=\"fn\">compute_classification_metrics</span>(y_true, y_probs)\n\
      <span class=\"fn\">print</span>(<span class=\"str\">f\"Evaluation for {task_title}:\"\
      </span>)\n<span class=\"kw\">for</span> k, v <span class=\"kw\">in</span> metrics.<span\
      \ class=\"fn\">items</span>():\n    <span class=\"fn\">print</span>(<span class=\"\
      str\">f\"  {k}: {v:.4f}\"</span>)\n\n<span class=\"kw\">if</span> __name__ ==\
      \ <span class=\"str\">'__main__'</span>:\n    <span class=\"fn\">solve</span>()"
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: A model predicts 5 house prices. One prediction is wildly wrong (₹1
      lakh predicted vs ₹50 lakh actual). Which metric is MOST affected?
    qid: q42_1
    options:
    - letter: A
      text: MAE — because it measures absolute errors
      is_correct: false
    - letter: B
      text: MSE — because it squares the error, making the outlier error ₹49 lakh
        → ₹2401 lakh² in the sum
      is_correct: true
    - letter: C
      text: R² — because R² captures total variance
      is_correct: false
    - letter: D
      text: MAPE — because it's percentage-based
      is_correct: false
    correct_fb: ✅ Correct! MSE squares errors — a ₹49 lakh error contributes 49² =
      2401 to the MSE, versus 49 for MAE. One huge outlier can dominate MSE completely.
      This is WHY MSE is used when large errors are especially catastrophic (you want
      the model to really avoid them). For house prices where big errors are equally
      bad as many small ones, MAE or Huber loss is often more appropriate.
    wrong_fb: ❌ MSE is most sensitive to outliers because it squares errors. Error
      of 49 → contributes 49²=2401 to MSE sum, but only 49 to MAE sum. One outlier
      can make MSE 100× worse while MAE stays proportional. This is by design when
      you want to penalise large errors heavily — but it's a liability when your data
      has natural outliers that you don't want to over-penalise.
  - num_str: QUESTION 2 OF 4
    question: A model has R²=0.82 with 3 features. You add 5 random noise features
      and R² increases to 0.84. What does Adjusted R² do?
    qid: q42_2
    options:
    - letter: A
      text: Adjusted R² DECREASES — it penalises adding features that don't genuinely
        improve the model
      is_correct: true
    - letter: B
      text: Adjusted R² stays the same — it's unaffected by the number of features
      is_correct: false
    - letter: C
      text: Adjusted R² also increases — confirming the new features are useful
      is_correct: false
    - letter: D
      text: Adjusted R² is undefined when R² &gt; 0.8
      is_correct: false
    correct_fb: ✅ Correct! R² can only increase (or stay constant) when you add features
      — even noise features contribute marginally to fitting. This makes R² useless
      for feature selection. Adjusted R² = 1 − (1−R²)(n−1)/(n−p−1). As p increases
      with the same n, the (n−1)/(n−p−1) fraction grows, increasing the penalty. If
      new features don't improve SS_res enough to offset this, Adjusted R² falls —
      correctly signalling the features aren't worth adding.
    wrong_fb: '❌ R² NEVER decreases when you add features (even noise features accidentally
      explain a tiny bit more variance). Adjusted R² penalises the additional parameter
      count: as p increases, the formula''s correction factor grows. If a feature
      doesn''t improve fit enough to offset its "cost", Adjusted R² falls — correctly
      identifying the feature as not worth including. Use Adjusted R² for feature
      selection, not plain R².'
  - num_str: QUESTION 3 OF 4
    question: You're building a demand forecasting model for a supermarket chain.
      Managers want to understand model performance. Which metric is best to report?
    qid: q42_3
    options:
    - letter: A
      text: MSE — most common in research papers
      is_correct: false
    - letter: B
      text: R² — shows how much variance is explained
      is_correct: false
    - letter: C
      text: MAPE — percentage error is intuitive and comparable across products with
        different scales
      is_correct: true
    - letter: D
      text: Adjusted R² — it accounts for the number of features used
      is_correct: false
    correct_fb: '✅ Correct! Managers understand "we''re off by 8% on average" far
      better than "our MSE is 1432.7 units²." MAPE is scale-independent — a model
      predicting 100 items with 10 error and predicting 10,000 items with 1000 error
      both have 10% MAPE. This comparability across products with different sales
      volumes makes MAPE the standard in supply chain and retail forecasting. Caveat:
      fails when actual demand is zero (use sMAPE then).'
    wrong_fb: ❌ For business stakeholders, always prefer interpretable metrics. MAPE
      gives "we're off by X% on average" — anyone understands this. MSE is in squared
      units (units²) which no manager can interpret. R² is between -∞ and 1 — not
      intuitive for non-technical stakeholders. MAPE is the industry standard for
      forecasting performance reporting because percentage errors make sense regardless
      of the product's sales volume.
  - num_str: QUESTION 4 OF 4
    question: R² = −0.45 on a test set. What does this mean?
    qid: q42_4
    options:
    - letter: A
      text: There's a bug — R² cannot be negative
      is_correct: false
    - letter: B
      text: The model explains 45% of the variance in the wrong direction
      is_correct: false
    - letter: C
      text: The model performs WORSE than simply predicting the mean — something is
        fundamentally wrong
      is_correct: true
    - letter: D
      text: The model has negative correlation with the target
      is_correct: false
    correct_fb: '✅ Correct! R² = 1 − SS_res/SS_tot. When SS_res &gt; SS_tot, R² &lt;
      0. This happens when your model''s predictions are FURTHER from the true values
      than simply always predicting the mean. A mean predictor has R²=0. Negative
      R² means the model actively makes things worse — suggesting: severe overfitting
      on train, wrong feature scaling, data leakage, or applying a training-set model
      to a completely different distribution of test data.'
    wrong_fb: ❌ R² can absolutely be negative — there's no lower bound. R²=0 means
      "as good as predicting the mean." R²&lt;0 means "WORSE than predicting the mean."
      This indicates the model is making systematically bad predictions — possibly
      trained on very different data than the test set, or severe data leakage making
      training artificially easy. This is a red flag requiring investigation, not
      just "bad performance" — the model is actively harmful.
  flashcards:
  - front: Lasso vs Ridge Regression?
    back: 'Lasso (L1): Adds absolute weight penalty, leads to sparse feature selection.
      Ridge (L2): Adds squared weight penalty, shrinks weights.'
  - front: R-squared?
    back: 'Proportion of variance in the dependent variable explained by features:
      1 - (SS_res / SS_tot).'
  - front: Mean Squared Error (MSE)?
    back: Average of squared differences between true and predicted values. Highly
      sensitive to outliers.
  - front: MAE vs MSE?
    back: MAE (Mean Absolute Error) uses absolute differences (linear penalty); MSE
      uses squared differences (quadratic penalty for outliers).
  - front: Multicollinearity?
    back: When two or more predictor variables are highly correlated, inflating the
      variance of regression coefficients.
  gotcha:
    title: '⚠️ Gotcha: Gradient Descent Vanishing & Explosions'
    description: Unnormalized input features lead to oscillating gradients and slow
      convergence. Always normalize features before gradient descent.
  takeaways:
    hinglish_line: "<strong>\n          Ek line mein:\n         </strong>\n      \
      \   Data scaling hamesha train_test_split ke baad shuru karni chahiye taaki\
      \ test set ki information train set mein leak na ho."
    bullets:
    - "<strong>\n           MSE vs MAE:\n          </strong>\n          MSE punishes\
      \ large errors heavily (squares them). MAE is robust. Use MSE when big errors\
      \ are catastrophic; MAE when outliers are natural and acceptable."
    - "<strong>\n           R² = 0:\n          </strong>\n          As good as the\
      \ mean predictor. R² &lt; 0: WORSE than the mean — something is fundamentally\
      \ wrong. R² = 1: perfect."
    - "<strong>\n           Adjusted R²:\n          </strong>\n          Penalises\
      \ unnecessary features. Use for feature selection. Plain R² never decreases\
      \ with more features."
    - "<strong>\n           MAPE for business:\n          </strong>\n          % error\
      \ is universally understood. Fails when actual=0 — use sMAPE or filter zeros."
    - "<strong>\n           Huber Loss:\n          </strong>\n          MSE behavior\
      \ for small errors (smooth gradient), MAE behavior for large errors (doesn't\
      \ blow up). Use when you have outliers but need a differentiable loss."
