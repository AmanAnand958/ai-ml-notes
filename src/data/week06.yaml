    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span> StandardScaler
    <span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> Ridge
    <span class="kw">from</span> sklearn.model_selection <span class="kw">import</span> cross_val_score, KFold
    <span class="kw">from</span> sklearn.pipeline <span class="kw">import</span> Pipeline
    <span class="kw">from</span> sklearn.datasets <span class="kw">import</span> fetch_california_housing

    data = <span class="fn">fetch_california_housing</span>()
    X, y = data.data, data.target

    <span class="cm"># ❌ WRONG: Scaling BEFORE cross-validation = DATA LEAKAGE</span>
    <span class="cm"># StandardScaler learns mean/std from ALL data including test folds!</span>
    sc_wrong = <span class="fn">StandardScaler</span>()
    X_wrong  = sc_wrong.<span class="fn">fit_transform</span>(X)   <span class="cm"># leaks test fold stats into training!</span>
    scores_wrong = <span class="fn">cross_val_score</span>(<span class="fn">Ridge</span>(), X_wrong, y, cv=<span class="num">5</span>,
                                   scoring=<span class="str">'neg_mean_squared_error'</span>)
    <span class="fn">print</span>(<span class="str">f"Leaky MSE (optimistic):  {-scores_wrong.mean():.4f}"</span>)

    <span class="cm"># ✅ CORRECT: Scaling INSIDE Pipeline — scaler fits on each training fold</span>
    pipe_correct = <span class="fn">Pipeline</span>([
        (<span class="str">'scaler'</span>, <span class="fn">StandardScaler</span>()),
        (<span class="str">'ridge'</span>,  <span class="fn">Ridge</span>(alpha=<span class="num">1.0</span>))
    ])
    scores_correct = <span class="fn">cross_val_score</span>(pipe_correct, X, y, cv=<span class="num">5</span>,
                                     scoring=<span class="str">'neg_mean_squared_error'</span>)
    <span class="fn">print</span>(<span class="str">f"Correct MSE (honest):    {-scores_correct.mean():.4f}"</span>)
    <span class="cm"># The difference might look small here but on high-variance preprocessing</span>
    <span class="cm"># steps (like imputation, encoding) leakage gives MASSIVELY optimistic estimates.</span>

    <span class="cm"># === Nested Cross-Validation — truly unbiased evaluation ===</span>
    <span class="kw">from</span> sklearn.model_selection <span class="kw">import</span> cross_val_score, GridSearchCV
    inner_cv = <span class="fn">KFold</span>(n_splits=<span class="num">5</span>, shuffle=<span class="kw">True</span>, random_state=<span class="num">1</span>)
    outer_cv = <span class="fn">KFold</span>(n_splits=<span class="num">5</span>, shuffle=<span class="kw">True</span>, random_state=<span class="num">2</span>)

    param_grid = {<span class="str">'ridge__alpha'</span>: [<span class="num">0.1</span>, <span class="num">1.0</span>, <span class="num">10.0</span>]}
    search = <span class="fn">GridSearchCV</span>(pipe_correct, param_grid, cv=inner_cv,
                          scoring=<span class="str">'neg_mean_squared_error'</span>)
    nested_scores = <span class="fn">cross_val_score</span>(search, X, y, cv=outer_cv,
                                    scoring=<span class="str">'neg_mean_squared_error'</span>)
    <span class="fn">print</span>(<span class="str">f"\nNested CV MSE: {-nested_scores.mean():.4f} ± {nested_scores.std():.4f}"</span>)
    <span class="cm"># This is the gold standard: inner CV tunes alpha, outer CV evaluates performance.</span></code></pre>
    </div>
