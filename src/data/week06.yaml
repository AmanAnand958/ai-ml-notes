    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np

    <span class="cm"># BUG: Division by zero when y_true contains zeros.</span>
    <span class="cm"># (y_true - y_pred) / y_true → 0/0 or x/0 → NaN or Inf.</span>
    <span class="cm"># MAPE is not defined when actual value is zero — you can't compute %</span>
    <span class="cm"># error relative to zero. np.mean([...inf, ...]) = inf.</span>
    <span class="cm"># </span>
    <span class="cm"># FIXES depending on context:</span>
    <span class="cm"># 1. Filter out zero-true values (if 0 means "no demand" — skip it)</span>
    <span class="cm"># 2. Use sMAPE (symmetric MAPE) — denominator = (|y| + |ŷ|)/2</span>
    <span class="cm"># 3. Add a small epsilon to denominator</span>
    <span class="cm"># 4. Use MAE or RMSE instead when data contains zeros</span>

    <span class="cm"># Fix 1: Filter zeros</span>
    mask = y_true != <span class="num">0</span>
    mape_filtered = np.<span class="fn">mean</span>(np.<span class="fn">abs</span>((y_true[mask] - y_pred[mask]) / y_true[mask])) * <span class="num">100</span>
    <span class="fn">print</span>(<span class="str">f"MAPE (filtered): {mape_filtered:.2f}%"</span>)

    <span class="cm"># Fix 2: sMAPE (denominator never zero)</span>
    smape = np.<span class="fn">mean</span>(<span class="num">2</span> * np.<span class="fn">abs</span>(y_true - y_pred) / (np.<span class="fn">abs</span>(y_true) + np.<span class="fn">abs</span>(y_pred) + <span class="num">1e-8</span>)) * <span class="num">100</span>
    <span class="fn">print</span>(<span class="str">f"sMAPE: {smape:.2f}%"</span>)  <span class="cm"># safe — denominator always &gt; 0</span></code></pre>
