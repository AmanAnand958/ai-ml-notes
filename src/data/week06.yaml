    correct_fb: ✅ Correct! Leakage happens when test fold statistics (mean, std) are used in training-fold preprocessing. StandardScaler.fit_transform(X_all) computes global mean/std including all test folds — the scaler then has "seen" the test data. This gives optimistic CV scores that won't generalise..
    wrong_fb: '❌ Data leakage in CV: fitting ANY statistic-learning preprocessor (scaler, imputer, feature selector) on ALL data before cross-validation. The test fold''s statistics then influence training-fold preprocessing. This is prevented by Pipeline, which automatically fits preprocessors only on each training fold. Real impact: inflated CV scores that make models look better than they actually are on truly unseen data.'
