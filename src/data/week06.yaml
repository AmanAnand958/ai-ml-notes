- id: '41'
  day_num: 41
  title: ElasticNet + Cross-Validation Strategies
  subtitle: ElasticNet combines Ridge aur Lasso — dono ke best qualities ek saath.
    Aur cross-validation sirf model comparison ke liye nahi hai — yeh the backbone
    of trustworthy ML evaluation hai. Aaj hum CV ke har variant ko deeply understand
    karenge.
  time_estimate: 4.5 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Explain ElasticNet's l1_ratio parameter and know when to use it over pure Ridge
    or Lasso
  - Implement and compare KFold, StratifiedKFold, ShuffleSplit, and TimeSeriesSplit
  - Build a complete nested cross-validation pipeline for unbiased hyperparameter
    tuning and evaluation
  - Use GridSearchCV and RandomizedSearchCV to tune alpha and l1_ratio simultaneously
  - Detect and avoid data leakage in cross-validation pipelines
  checklist:
  - id: chk_41_1
    text: Study the core mathematical and architectural principles of ElasticNet +
      Cross-Validation Strategies
  - id: chk_41_2
    text: Implement the hands-on code exercises and verify unit tests
  - id: chk_41_3
    text: Complete the interactive prediction challenge and quiz
  - id: chk_41_4
    text: Review flashcards and commit completed code to GitHub
  concept_flow:
  - Linear Regression — Deep
  - Polynomial Regression + T
  - Ridge & Lasso Regularisat
  - ElasticNet + Cross-Valida
  - Regression Metrics — Whic
  - SVR + Tree-Based Regressi
  - 'Capstone: End-to-End Hous'
  hinglish: RBF kernel SVM practically har non-linear boundary bana sakta hai. Hyperparameters
    C aur gamma tune karne padenge — GridSearchCV se karo with cross-validation!
  analogy: Gradient descent is like hiking down a foggy mountain (loss landscape)
    with zero visibility. You check the slope under your feet (gradient), take a step
    downhill (learning rate), and repeat.
  theory_html: "<h3 class=\"sh3\">\n       1. ElasticNet — Best of Both Worlds\n \
    \     </h3>\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$ElasticNet\
    \ Loss = Σ(yᵢ − ŷᵢ)² + α × [l1_ratio × Σ|βⱼ| + (1−l1_ratio) × Σβⱼ²]$$\n      \
    \ </span>\n<span class=\"desc\">\n        l1_ratio=0 → Ridge only. l1_ratio=1\
    \ → Lasso only. 0 &lt; l1_ratio &lt; 1 → mix.\n       </span>\n<span class=\"\
    desc\">\n        Typical range: l1_ratio ∈ [0.1, 0.9]. Default in sklearn: 0.5.\n\
    \       </span>\n</div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         python — elasticnet_gridsearch.py\n        </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">from</span> sklearn.linear_model <span class=\"kw\">import</span>\
    \ ElasticNet\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"\
    kw\">import</span> GridSearchCV, RandomizedSearchCV\n<span class=\"kw\">from</span>\
    \ sklearn.pipeline <span class=\"kw\">import</span> Pipeline\n<span class=\"kw\"\
    >from</span> sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler\n\
    <span class=\"kw\">from</span> sklearn.datasets <span class=\"kw\">import</span>\
    \ fetch_california_housing\n<span class=\"kw\">from</span> sklearn.model_selection\
    \ <span class=\"kw\">import</span> train_test_split\n\ndata = <span class=\"fn\"\
    >fetch_california_housing</span>()\nX_tr, X_te, y_tr, y_te = <span class=\"fn\"\
    >train_test_split</span>(\n    data.data, data.target, test_size=<span class=\"\
    num\">0.2</span>, random_state=<span class=\"num\">42</span>)\n\npipe = <span\
    \ class=\"fn\">Pipeline</span>([\n    (<span class=\"str\">'scaler'</span>, <span\
    \ class=\"fn\">StandardScaler</span>()),\n    (<span class=\"str\">'model'</span>,\
    \  <span class=\"fn\">ElasticNet</span>(max_iter=<span class=\"num\">5000</span>))\n\
    ])\n\n<span class=\"cm\"># Grid search over alpha AND l1_ratio simultaneously</span>\n\
    param_grid = {\n    <span class=\"str\">'model__alpha'</span>:     [<span class=\"\
    num\">0.001</span>, <span class=\"num\">0.01</span>, <span class=\"num\">0.1</span>,\
    \ <span class=\"num\">1.0</span>, <span class=\"num\">10.0</span>],\n    <span\
    \ class=\"str\">'model__l1_ratio'</span>:  [<span class=\"num\">0.1</span>, <span\
    \ class=\"num\">0.3</span>, <span class=\"num\">0.5</span>, <span class=\"num\"\
    >0.7</span>, <span class=\"num\">0.9</span>]\n}\n<span class=\"cm\"># 5×5 = 25\
    \ combinations × 5 folds = 125 fits — manageable</span>\ngrid = <span class=\"\
    fn\">GridSearchCV</span>(pipe, param_grid, cv=<span class=\"num\">5</span>,\n\
    \                    scoring=<span class=\"str\">'neg_mean_squared_error'</span>,\
    \ n_jobs=-<span class=\"num\">1</span>)\ngrid.<span class=\"fn\">fit</span>(X_tr,\
    \ y_tr)\n\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Best params\
    \  : {grid.best_params_}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"CV MSE (best): {-grid.best_score_:.4f}\"</span>)\n<span class=\"fn\"\
    >print</span>(<span class=\"str\">f\"Test MSE     : {np.mean((y_te - grid.predict(X_te))**2):.4f}\"\
    </span>)\n\nbest = grid.best_estimator_.named_steps[<span class=\"str\">'model'</span>]\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"\\nNon-zero coefs: {np.sum(best.coef_\
    \ != 0)}/{data.data.shape[1]}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"l1_ratio → {best.l1_ratio} (closer to 1 = more Lasso-like,\
    \ more sparse)\"</span>)\n\n<span class=\"cm\"># For large hyperparameter spaces,\
    \ use RandomizedSearchCV</span>\n<span class=\"kw\">from</span> scipy.stats <span\
    \ class=\"kw\">import</span> loguniform, uniform\n\nparam_dist = {\n    <span\
    \ class=\"str\">'model__alpha'</span>:     <span class=\"fn\">loguniform</span>(<span\
    \ class=\"num\">1e-4</span>, <span class=\"num\">1e2</span>),  <span class=\"\
    cm\"># log-uniform: better for scales</span>\n    <span class=\"str\">'model__l1_ratio'</span>:\
    \  <span class=\"fn\">uniform</span>(<span class=\"num\">0.0</span>, <span class=\"\
    num\">1.0</span>)        <span class=\"cm\"># uniform over [0, 1]</span>\n}\n\
    rnd = <span class=\"fn\">RandomizedSearchCV</span>(pipe, param_dist, n_iter=<span\
    \ class=\"num\">40</span>, cv=<span class=\"num\">5</span>,\n                \
    \          scoring=<span class=\"str\">'neg_mean_squared_error'</span>,\n    \
    \                      random_state=<span class=\"num\">42</span>, n_jobs=-<span\
    \ class=\"num\">1</span>)\nrnd.<span class=\"fn\">fit</span>(X_tr, y_tr)\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"\\nRandomized best: {rnd.best_params_}\"\
    </span>)</pre>\n</div>\n<h3 class=\"sh3\">\n       2. Cross-Validation Strategies\n\
    \      </h3>\n<div class=\"table-wrap\" style=\"overflow-x: auto; margin: 1.2rem\
    \ 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n<th>\n         CV TYPE\n\
    \        </th>\n<th>\n         WHEN TO USE\n        </th>\n<th>\n         KEY\
    \ PROPERTY\n        </th>\n<th>\n         sklearn CLASS\n        </th>\n</tr>\n\
    <tr>\n<td>\n<strong>\n          KFold\n         </strong>\n</td>\n<td>\n     \
    \    Regression (continuous target)\n        </td>\n<td>\n         Splits randomly\
    \ into k equal folds\n        </td>\n<td>\n         KFold(n_splits=5)\n      \
    \  </td>\n</tr>\n<tr>\n<td>\n<strong>\n          StratifiedKFold\n         </strong>\n\
    </td>\n<td>\n         Classification (imbalanced classes)\n        </td>\n<td>\n\
    \         Preserves class proportions in each fold\n        </td>\n<td>\n    \
    \     StratifiedKFold(n_splits=5)\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n\
    \          RepeatedKFold\n         </strong>\n</td>\n<td>\n         Small datasets\
    \ (need more estimates)\n        </td>\n<td>\n         Runs KFold multiple times\
    \ with different splits\n        </td>\n<td>\n         RepeatedKFold(n_splits=5,\
    \ n_repeats=10)\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          TimeSeriesSplit\n\
    \         </strong>\n</td>\n<td>\n         Time-series data\n        </td>\n<td>\n\
    \         Train always precedes test in time\n        </td>\n<td>\n         TimeSeriesSplit(n_splits=5)\n\
    \        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          ShuffleSplit\n        \
    \ </strong>\n</td>\n<td>\n         Very large datasets\n        </td>\n<td>\n\
    \         Random train/test subsets (not mutually exclusive)\n        </td>\n\
    <td>\n         ShuffleSplit(n_splits=10, test_size=0.2)\n        </td>\n</tr>\n\
    <tr>\n<td>\n<strong>\n          LeaveOneOut\n         </strong>\n</td>\n<td>\n\
    \         Tiny datasets (&lt;50 samples)\n        </td>\n<td>\n         n folds\
    \ — most expensive, lowest bias\n        </td>\n<td>\n         LeaveOneOut()\n\
    \        </td>\n</tr>\n</table></div>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — cv_data_leakage.py\n        </span>\n\
    <div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span>\
    \ StandardScaler\n<span class=\"kw\">from</span> sklearn.linear_model <span class=\"\
    kw\">import</span> Ridge\n<span class=\"kw\">from</span> sklearn.model_selection\
    \ <span class=\"kw\">import</span> cross_val_score, KFold\n<span class=\"kw\"\
    >from</span> sklearn.pipeline <span class=\"kw\">import</span> Pipeline\n<span\
    \ class=\"kw\">from</span> sklearn.datasets <span class=\"kw\">import</span> fetch_california_housing\n\
    \ndata = <span class=\"fn\">fetch_california_housing</span>()\nX, y = data.data,\
    \ data.target\n\n<span class=\"cm\"># ❌ WRONG: Scaling BEFORE cross-validation\
    \ = DATA LEAKAGE</span>\n<span class=\"cm\"># StandardScaler learns mean/std from\
    \ ALL data including test folds!</span>\nsc_wrong = <span class=\"fn\">StandardScaler</span>()\n\
    X_wrong  = sc_wrong.<span class=\"fn\">fit_transform</span>(X)   <span class=\"\
    cm\"># leaks test fold stats into training!</span>\nscores_wrong = <span class=\"\
    fn\">cross_val_score</span>(<span class=\"fn\">Ridge</span>(), X_wrong, y, cv=<span\
    \ class=\"num\">5</span>,\n                               scoring=<span class=\"\
    str\">'neg_mean_squared_error'</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Leaky MSE (optimistic):  {-scores_wrong.mean():.4f}\"</span>)\n\
    \n<span class=\"cm\"># ✅ CORRECT: Scaling INSIDE Pipeline — scaler fits on each\
    \ training fold</span>\npipe_correct = <span class=\"fn\">Pipeline</span>([\n\
    \    (<span class=\"str\">'scaler'</span>, <span class=\"fn\">StandardScaler</span>()),\n\
    \    (<span class=\"str\">'ridge'</span>,  <span class=\"fn\">Ridge</span>(alpha=<span\
    \ class=\"num\">1.0</span>))\n])\nscores_correct = <span class=\"fn\">cross_val_score</span>(pipe_correct,\
    \ X, y, cv=<span class=\"num\">5</span>,\n                                 scoring=<span\
    \ class=\"str\">'neg_mean_squared_error'</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Correct MSE (honest):    {-scores_correct.mean():.4f}\"</span>)\n\
    <span class=\"cm\"># The difference might look small here but on high-variance\
    \ preprocessing</span>\n<span class=\"cm\"># steps (like imputation, encoding)\
    \ leakage gives MASSIVELY optimistic estimates.</span>\n\n<span class=\"cm\">#\
    \ === Nested Cross-Validation — truly unbiased evaluation ===</span>\n<span class=\"\
    kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> cross_val_score,\
    \ GridSearchCV\ninner_cv = <span class=\"fn\">KFold</span>(n_splits=<span class=\"\
    num\">5</span>, shuffle=<span class=\"kw\">True</span>, random_state=<span class=\"\
    num\">1</span>)\nouter_cv = <span class=\"fn\">KFold</span>(n_splits=<span class=\"\
    num\">5</span>, shuffle=<span class=\"kw\">True</span>, random_state=<span class=\"\
    num\">2</span>)\n\nparam_grid = {<span class=\"str\">'ridge__alpha'</span>: [<span\
    \ class=\"num\">0.1</span>, <span class=\"num\">1.0</span>, <span class=\"num\"\
    >10.0</span>]}\nsearch = <span class=\"fn\">GridSearchCV</span>(pipe_correct,\
    \ param_grid, cv=inner_cv,\n                      scoring=<span class=\"str\"\
    >'neg_mean_squared_error'</span>)\nnested_scores = <span class=\"fn\">cross_val_score</span>(search,\
    \ X, y, cv=outer_cv,\n                                scoring=<span class=\"str\"\
    >'neg_mean_squared_error'</span>)\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"\\nNested CV MSE: {-nested_scores.mean():.4f} ± {nested_scores.std():.4f}\"\
    </span>)\n<span class=\"cm\"># This is the gold standard: inner CV tunes alpha,\
    \ outer CV evaluates performance.</span></pre>\n</div>\n<div class=\"hinglish\"\
    >\n       \U0001F4A1 ElasticNet = Ridge + Lasso ka hybrid. l1_ratio=0.5 dono ko\
    \ equal weight deta hai. GridSearchCV dono alpha aur l1_ratio ek saath tune kar\
    \ sakta hai. Nested CV: inner loop = hyperparameter tuning; outer loop = performance\
    \ estimation. Pipeline use karna = leakage se bachna.\n      </div>\n<h2 class=\"\
    sh2\">\n       \U0001F52E Predict the Output\n      </h2>\n<h2 class=\"sh2\">\n\
    \       \U0001F41B Find the Bug\n      </h2>\n<div class=\"debug-block\">\n<div\
