- id: '40'
  day_num: 40
  title: Ridge & Lasso Regularization
  subtitle: Overfitting ka best solution hai regularization. Ridge aur Lasso dono
    linear regression mein ek "penalty term" add karte hain jo large coefficients
    ko discourage karta hai — lekin alag tarike se, aur completely alag results ke
    saath. Yeh distinction bahut important hai.
  time_estimate: 5 hours
  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Explain intuitively and mathematically why L1 produces sparse solutions and L2
    does not
  - Implement Ridge and Lasso from scratch (gradient update form) to understand the
    math
  - Use RidgeCV and LassoCV to select the optimal regularization strength alpha automatically
  - Read and interpret coefficient paths (regularization paths) for both Ridge and
    Lasso
