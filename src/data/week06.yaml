  quizzes:
  - num_str: QUESTION 1 OF 4
    question: ElasticNet with l1_ratio=0.0 is equivalent to which model?
    qid: q41_1
    options:
    - letter: A
      text: Lasso Regression
      is_correct: false
    - letter: B
      text: Ridge Regression
      is_correct: true
    - letter: C
      text: Ordinary Least Squares
      is_correct: false
    - letter: D
      text: Polynomial Regression
      is_correct: false
    correct_fb: '✅ Correct! l1_ratio controls the mix: l1_ratio=0 → only L2 penalty
      (Ridge). l1_ratio=1 → only L1 penalty (Lasso). The interpolation formula: α
      × [l1_ratio × L1 + (1−l1_ratio) × L2]. At l1_ratio=0: penalty = α × L2 = Ridge.
      At l1_ratio=1: penalty = α × L1 = Lasso. This is what makes ElasticNet the general
      case encompassing both.'
    wrong_fb: ❌ l1_ratio=0 → only L2 penalty → Ridge. l1_ratio=1 → only L1 penalty
      → Lasso. Think of l1_ratio as "how much Lasso?" — 0 means no Lasso = pure Ridge.
      1 means all Lasso = pure Lasso. Between 0 and 1 gives a mix. This is why ElasticNet
      with the right l1_ratio can handle both dense and sparse coefficient patterns.
  - num_str: QUESTION 2 OF 4
    question: Why should you use StratifiedKFold for classification but KFold for
      regression?
    qid: q41_2
    options:
    - letter: A
      text: Classification can have imbalanced classes — stratification ensures each
        fold has similar class proportions, giving a fair estimate
      is_correct: true
    - letter: B
      text: StratifiedKFold is faster to compute for classification problems
      is_correct: false
    - letter: C
      text: KFold cannot handle continuous targets in regression
      is_correct: false
    - letter: D
      text: StratifiedKFold automatically balances the dataset by oversampling
      is_correct: false
    correct_fb: ✅ Correct! With imbalanced classes (e.g., 5% fraud, 95% legit), random
      KFold might put ALL fraud cases in fold 1 and none in fold 2. The model would
      train on folds without fraud examples and give meaningless CV scores. StratifiedKFold
      preserves class proportions — every fold has ~5% fraud. For regression, the
      continuous target doesn't have "classes" to stratify by, so KFold is appropriate.
    wrong_fb: ❌ The key issue is class imbalance in classification. Random splits
      might produce folds with very few (or zero) minority class examples. StratifiedKFold
      guarantees proportional class representation in each fold — critical for imbalanced
      data. For regression there are no "classes" — KFold random splitting is fine
      because continuous targets are usually distributed throughout the dataset.
  - num_str: QUESTION 3 OF 4
    question: What is "data leakage" in the context of cross-validation preprocessing?
    qid: q41_3
    options:
    - letter: A
      text: When training data is too similar to test data
      is_correct: false
    - letter: B
      text: When preprocessing (e.g., StandardScaler) is fit on the full dataset including
        test folds, letting test information influence the training process
      is_correct: true
    - letter: C
      text: When the same data point appears in both train and test
      is_correct: false
    - letter: D
      text: When the model memorizes training labels
      is_correct: false
    correct_fb: '✅ Correct! Leakage happens when test fold statistics (mean, std)
      are used in training-fold preprocessing. StandardScaler.fit_transform(X_all)
      computes global mean/std including all test folds — the scaler then has "seen"
      the test data. This gives optimistic CV scores that won''t generalise. Fix:
      always use Pipeline, which refits the scaler on each training fold separately.
      The performance improvement from this fix can be dramatic on datasets with unusual
      distributions.'
    wrong_fb: '❌ Data leakage in CV: fitting ANY statistic-learning preprocessor (scaler,
      imputer, feature selector) on ALL data before cross-validation. The test fold''s
      statistics then influence training-fold preprocessing. This is prevented by
      Pipeline, which automatically fits preprocessors only on each training fold.
      Real impact: inflated CV scores that make models look better than they actually
      are on truly unseen data.'
  - num_str: QUESTION 4 OF 4
    question: You have stock price data from 2015–2023 and want to evaluate a predictive
      model. Which CV strategy is correct?
    qid: q41_4
    options:
    - letter: A
      text: KFold with shuffle=True
      is_correct: false
    - letter: B
      text: StratifiedKFold with n_splits=5
      is_correct: false
    - letter: C
      text: TimeSeriesSplit — training data must always come BEFORE test data in time
      is_correct: true
    - letter: D
      text: LeaveOneOut for the most accurate estimate
      is_correct: false
    correct_fb: '✅ Correct! With time-series data, shuffling violates temporal ordering
      — you''d train on 2022 data and test on 2018, which is "look-ahead bias" (the
      worst form of leakage). TimeSeriesSplit ensures training always precedes testing:
      Fold 1 trains on 2015, tests on 2016; Fold 2 trains on 2015-2016, tests on 2017,
      etc. This mirrors real deployment: you always predict the future from the past,
      never vice versa.'
    wrong_fb: '❌ Time-series data has temporal order — training on future data to
      predict the past is "look-ahead bias." KFold with shuffle=True would randomly
      mix 2015 and 2022 data — the model would "see" 2022 patterns while predicting
      2015, which is impossible in production. TimeSeriesSplit is the only correct
      choice: each fold trains on earlier dates and tests on later dates, mirroring
      real deployment.'
  flashcards:
  - front: Lasso vs Ridge Regression?
    back: 'Lasso (L1): Adds absolute weight penalty, leads to sparse feature selection.
      Ridge (L2): Adds squared weight penalty, shrinks weights.'
  - front: R-squared?
    back: 'Proportion of variance in the dependent variable explained by features:
      1 - (SS_res / SS_tot).'
  - front: Mean Squared Error (MSE)?
    back: Average of squared differences between true and predicted values. Highly
      sensitive to outliers.
  - front: MAE vs MSE?
    back: MAE (Mean Absolute Error) uses absolute differences (linear penalty); MSE
      uses squared differences (quadratic penalty for outliers).
  - front: Multicollinearity?
    back: When two or more predictor variables are highly correlated, inflating the
      variance of regression coefficients.
  gotcha:
    title: '⚠️ Gotcha: Gradient Descent Vanishing & Explosions'
    description: Unnormalized input features lead to oscillating gradients and slow
      convergence. Always normalize features before gradient descent.
  takeaways:
    hinglish_line: ''
    bullets:
    - "<strong>\n           ElasticNet:\n          </strong>\n          l1_ratio=0→Ridge,\
      \ l1_ratio=1→Lasso. Tune both alpha and l1_ratio via GridSearchCV with parameter\
      \ names like 'model__alpha'."
    - "<strong>\n           GridSearchCV parameter naming:\n          </strong>\n\
      \          Always 'stepname__paramname' for Pipeline parameters. Double underscore\
      \ is mandatory."
    - "<strong>\n           Choose CV strategy by data type:\n          </strong>\n\
      \          Regression→KFold; Classification with imbalance→StratifiedKFold;\
      \ Time-series→TimeSeriesSplit; Tiny data→LeaveOneOut."
    - "<strong>\n           Data leakage in CV:\n          </strong>\n          Fit\
      \ ALL preprocessing steps inside a Pipeline. Never fit_transform before cross_val_score.\
      \ This is the most common mistake in both industry and research."
    - "<strong>\n           Nested CV:\n          </strong>\n          Inner loop\
      \ tunes hyperparameters; outer loop estimates generalisation. This is the only\
      \ unbiased way to evaluate a model that required hyperparameter tuning."
