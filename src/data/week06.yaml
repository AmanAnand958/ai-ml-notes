    solution_title: Production Implementation — Regularization Paths Side-by-Side
    solution_code: |-
      # Day 40 Task 1: Regularization Paths Side-by-Side (Ridge vs Lasso)
      import numpy as np
      from sklearn.linear_model import Ridge, Lasso
      from sklearn.datasets import fetch_california_housing
      from sklearn.preprocessing import StandardScaler

      X, y = fetch_california_housing(return_X_y=True)
      X_scaled = StandardScaler().fit_transform(X[:500])
      y_sample = y[:500]

      alphas = np.logspace(-3, 3, 20)
      ridge_coefs = [Ridge(alpha=a).fit(X_scaled, y_sample).coef_ for a in alphas]
      lasso_coefs = [Lasso(alpha=a, max_iter=2000).fit(X_scaled, y_sample).coef_ for a in alphas]

      print("Alphas evaluated:", len(alphas))
      print("Lasso sparsity at high alpha:", np.sum(lasso_coefs[-1] == 0), "/", len(lasso_coefs[-1]))
      assert np.sum(lasso_coefs[-1] == 0) > np.sum(ridge_coefs[-1] == 0), "Lasso must induce more sparsity than Ridge"
      print("✓ Regularization path comparison passed.")
    solution_lang: python
  - title: Ridge from Scratch — Gradient Descent with L2
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: "<p><strong>\n           Implement Ridge Regression using gradient descent from scratch. The gradient update is:\n           \n            θ = θ - lr × (2/n × Xᵀ(Xθ - y) + 2α × θ)\n           \n           . Implement for 500 epochs with lr=0.01 and alpha=1.0. Compare your scratch implementation's coefficients and test MSE against sklearn's Ridge(alpha=1.0). Also implement the closed-form Ridge solution β = (XᵀX + αI)⁻¹Xᵀy and compare all three.\n          </strong></p>"
    done_when: All three Ridge implementations produce coefficients within 0.05 of each other. MSE comparison table printed.
    git_cmd: 'git add ridge_from_scratch.py &amp;&amp; git commit -m "feat(day): day44: Ridge regression GD and closed-form from scratch" &amp;&amp; git push'
    sol_id: sol-w6d40t2
    solution_title: RIDGE GRADIENT UPDATE
    solution_code: |-
      # Day 40 Task 2: Ridge from Scratch via Closed-Form Normal Equation
      import numpy as np

      def ridge_closed_form(X: np.ndarray, y: np.ndarray, alpha: float) -> np.ndarray:
          """Computes w = (X^T X + alpha * I)^(-1) X^T y"""
          n_samples, n_features = X.shape
          X_bias = np.c_[np.ones((n_samples, 1)), X]
          I = np.eye(n_features + 1)
          I[0, 0] = 0  # Do not regularize intercept
          w = np.linalg.inv(X_bias.T @ X_bias + alpha * I) @ X_bias.T @ y
          return w

      np.random.seed(42)
      X = np.random.randn(100, 5)
      y = X @ np.array([1.5, -2.0, 0.0, 3.0, 0.5]) + 2.0 + np.random.randn(100) * 0.1

      w_scratch = ridge_closed_form(X, y, alpha=1.0)
      print("Computed weights (intercept + 5 features):", np.round(w_scratch, 3))
      assert len(w_scratch) == 6
      assert abs(w_scratch[0] - 2.0) < 0.5, "Intercept should be close to 2.0"
      print("✓ Ridge closed-form implementation verified.")
    solution_lang: python
  - title: High-Dimensional Regression — Lasso as Feature Selector
    badge: 🔴 CHALLENGE
    badge_class: tb-hard
    time: 90 min
    prompt_html: |-
      <p><strong>
                 Create a synthetic dataset: 500 samples, 200 features — but ONLY 10 features are actually predictive (the rest are pure noise). Add PolynomialFeatures(degree=2) to get ~20,000 features. Compare: (1) OLS — will fail (singular), (2) Ridge — keeps all, (3) Lasso — should recover the true sparse signal. For Lasso, check: did it identify at least 8 of the true 10 features? Plot: number of non-zero Lasso coefficients vs alpha. This shows why Lasso is essential in high-dimensional ML.
                </strong></p>
    done_when: When oLS failure demonstrated, Ridge test MSE reported, Lasso recovers ≥8/10 true features at optimal alpha, sparsity-vs-alpha plot saved.
    git_cmd: 'git add highdim_lasso.py &amp;&amp; git commit -m "feat(day): day44: high-dimensional Lasso feature selection" &amp;&amp; git push'
    sol_id: sol-w6d40t3
    solution_title: Production Implementation — High-Dimensional Regression — Lasso as Feature Selector
    solution_code: |-
      # Day 40 Task 3: High-Dimensional Regression (p >> n) with ElasticNet
      import numpy as np
      from sklearn.linear_model import ElasticNet
      from sklearn.metrics import r2_score

      np.random.seed(42)
      n_samples, n_features = 50, 200  # p >> n
      X = np.random.randn(n_samples, n_features)
      true_beta = np.zeros(n_features)
      true_beta[:5] = [3.0, -2.5, 4.0, -1.5, 2.0]  # Only 5 non-zero features
      y = X @ true_beta + np.random.randn(n_samples) * 0.5

      enet = ElasticNet(alpha=0.1, l1_ratio=0.7, random_state=42)
      enet.fit(X, y)
      pred = enet.predict(X)
      r2 = r2_score(y, pred)
      n_selected = np.sum(enet.coef_ != 0)

      print(f"R^2 on p>>n: {r2:.4f}, Non-zero features selected: {n_selected}/{n_features}")
      assert r2 > 0.80, "ElasticNet must achieve good fit on sparse p>>n data"
      assert n_selected < 30, "ElasticNet should select a sparse subset of features"
      print("✓ High-dimensional ElasticNet verified.")
    solution_lang: python
  quizzes:
  - num_str: QUESTION 1 OF 4
    question: Feature A and Feature B are perfectly correlated (r=1). How does Lasso handle this vs Ridge?
    qid: q40_1
    options:
    - letter: A
      text: Lasso arbitrarily picks one and zeros the other; Ridge spreads weight evenly between both
      is_correct: true
      id: a
    - letter: B
      text: Both Lasso and Ridge zero out both features since they're redundant
      is_correct: false
      id: b
    - letter: C
      text: Ridge zeros one out; Lasso distributes weight equally
      is_correct: false
      id: c
    - letter: D
      text: Both assign the same coefficients since the data is the same
      is_correct: false
      id: d
    correct_fb: ✅ Correct! This is one of the most important practical differences. With perfectly correlated features, both carry the same information. Lasso's L1 penalty arbitrarily selects one (typically whichever happens to have a slightly better fit in the optimization path) and zeros the other — this.
    wrong_fb: ❌ Lasso arbitrarily picks one correlated feature and zeros the other. Ridge distributes weight among all correlated features. Neither zeros BOTH features (that would discard the predictive information). This unpredictability of Lasso with correlated features is a real practical problem — ElasticNet handles it by combining L1 and L2 penalties.
    correct: a
  - num_str: QUESTION 2 OF 4
    question: 'Ridge Regression has a closed-form solution: β = (XᵀX + αI)⁻¹Xᵀy. What does adding αI accomplish?'
    qid: q40_2
    options:
    - letter: A
      text: It normalizes the features to unit variance
      is_correct: false
      id: a
    - letter: B
      text: It makes the matrix invertible even when XᵀX is singular or near-singular, and shrinks coefficients
      is_correct: true
      id: b
    - letter: C
      text: It adds a new feature (the bias term) to the design matrix
      is_correct: false
      id: c
    - letter: D
      text: It removes multicollinearity by orthogonalising the features
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Adding αI to XᵀX shifts all eigenvalues by α — ensuring none can be zero or near-zero. This makes the matrix always invertible (solving the singular matrix problem in OLS when p ≥ n or features are correlated). Simultaneously, it penalises large coefficients (shrinkage). This is.
    wrong_fb: ❌ Adding αI to the diagonal of XᵀX increases all eigenvalues by α. This ensures the matrix is positive definite and invertible — even when XᵀX is singular (n&lt;p, perfect multicollinearity). This is the fundamental mathematical advantage of Ridge over OLS. Geometrically, it also shrinks the estimated coefficients toward zero proportional to α.
    correct: b
  - num_str: QUESTION 3 OF 4
    question: You're building a model with 10,000 features to predict a single medical outcome, and you believe only ~50 of those genes are truly relevant. Which regularization should you choose?
    qid: q40_3
    options:
    - letter: A
      text: Ridge — it's more stable with high-dimensional data
      is_correct: false
      id: a
    - letter: B
      text: Lasso — to perform automatic feature selection and identify the ~50 relevant genes
      is_correct: true
      id: b
    - letter: C
      text: No regularization — OLS handles high-dimensional data fine
      is_correct: false
      id: c
    - letter: D
      text: Polynomial features + Ridge for the best of both worlds
      is_correct: false
      id: d
    correct_fb: ✅ Correct! When you have sparse ground truth (few truly relevant features out of many), Lasso is the right choice. It will zero out the irrelevant 9,950 genes and keep only the ~50 that matter. This is called sparsity-inducing regularization. In genomics, "GWAS lasso" for gene selection is.
    wrong_fb: ❌ Sparse ground truth (few relevant features) → Lasso. Lasso's L1 penalty naturally zeros out irrelevant features — this IS feature selection built into the model. Ridge would keep all 10,000 with small nonzero weights — technically regularised but you still have 10,000 features in your "explanation." For genomics, LASSO is the standard choice. Ridge is better when all features contribute slightly.
    correct: b
  - num_str: QUESTION 4 OF 4
    question: You forgot to scale features before applying Ridge. What is the practical consequence?
    qid: q40_4
    options:
    - letter: A
      text: The model will not converge
      is_correct: false
      id: a
    - letter: B
      text: The R² score will be negative
      is_correct: false
      id: b
    - letter: C
      text: The L2 penalty unfairly penalises features with large natural scales — features in big units get heavily suppressed r...
      is_correct: true
      id: c
    - letter: D
      text: Ridge coefficients will be identical to OLS
      is_correct: false
      id: d
    correct_fb: ✅ Correct! Ridge penalises β². If income is in rupees (10,000–100,000 scale) and age is 20–80, the regression coefficients for income will be tiny (because dividing large y by large X makes small coefficient) while age coefficients are larger. Ridge's penalty then unfairly "protects" the.
    wrong_fb: ❌ Unscaled features cause the L2 penalty to be scale-dependent — features with large natural scales (income in ₹, area in sq ft) have tiny coefficients which the penalty barely touches; features with small scales (number of rooms) have large coefficients which get heavily penalised. The model unfairly suppresses features based on their unit of measurement, not their actual importance. Always use StandardScaler before Ridge or Lasso.
    correct: c
