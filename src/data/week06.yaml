  - Gradient Descent
  - Multiple Regression
  - L2 Ridge
  - L1 Lasso
  hinglish: 'Regularization: L1 (Lasso) sparse models banata hai features eliminate
    karke, L2 (Ridge) coefficients shrink karta hai. Zyada features hain? Lasso try
    karo pehle!'
  analogy: 'Ghar ka rent predict karna: Size (sq ft) ≥ Area ≥ Floor se. Agar hum ek
    line draw karein jo saare observed rents ke "as close as possible" ho, woh line
    Linear Regression hai. "As close as possible" = minimize the sum of squared vertical
    distances between actual and predicted — yahi Ordinary Least Squares (OLS) hai.'
  theory_html: "<h3 class=\"sh3\">\n       1. The Full Linear Regression Story\n \
    \     </h3>\n\n<div class=\"math-block\">\n<span class=\"formula\">\n        $$ŷ\
    \ = β₀ + β₁x₁ + β₂x₂ + ... + βₙxₙ = Xβ$$\n       </span>\n<span class=\"desc\"\
    >\n        Matrix form: X is (n×p) design matrix (with 1s column for intercept),\
    \ β is (p×1) weight vector\n       </span>\n<span class=\"formula\">\n       \
    \ $$Loss (MSE) = (1/n) Σ(yᵢ − ŷᵢ)² = (1/n)||y − Xβ||²$$\n       </span>\n<span\
    \ class=\"desc\">\n        We minimize this. Set derivative to zero → closed-form\
    \ OLS solution:\n       </span>\n<span class=\"formula\">\n        $$β* = (XᵀX)⁻¹\
    \ Xᵀy$$\n       </span>\n<span class=\"desc\">\n        The Normal Equation. Direct,\
    \ exact, no iteration needed — but expensive for large n.\n       </span>\n</div>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \   python — linear_regression_ols.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"run-btn\" onclick=\"openRepl()\">\n          ▶ try online\n\
    \         </button>\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span\
    \ class=\"kw\">from</span> sklearn.datasets <span class=\"kw\">import</span> fetch_california_housing\n\
    <span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span>\
    \ train_test_split\n<span class=\"kw\">from</span> sklearn.preprocessing <span\
    \ class=\"kw\">import</span> StandardScaler\n\n<span class=\"cm\"># Load California\
    \ Housing dataset (classic regression benchmark)</span>\ndata = <span class=\"\
    fn\">fetch_california_housing</span>()\nX_df = pd.<span class=\"fn\">DataFrame</span>(data.data,\
    \ columns=data.feature_names)\ny    = data.target   <span class=\"cm\"># median\
    \ house value in $100k</span>\n\n<span class=\"cm\"># Use just 2 features for\
    \ visualization clarity</span>\nX_raw = X_df[[<span class=\"str\">'MedInc'</span>,\
    \ <span class=\"str\">'AveRooms'</span>]].values\n\nX_train, X_test, y_train,\
    \ y_test = <span class=\"fn\">train_test_split</span>(\n    X_raw, y, test_size=<span\
    \ class=\"num\">0.2</span>, random_state=<span class=\"num\">42</span>)\n\n<span\
    \ class=\"cm\"># Scale features — critical before OLS with multiple features</span>\n\
    sc = <span class=\"fn\">StandardScaler</span>()\nX_tr = sc.<span class=\"fn\"\
    >fit_transform</span>(X_train)\nX_te = sc.<span class=\"fn\">transform</span>(X_test)\n\
    \n<span class=\"cm\"># ── OLS from scratch using Normal Equation ──────────────────</span>\n\
    <span class=\"cm\"># Add bias column (column of 1s)</span>\nX_tr_b = np.<span\
    \ class=\"fn\">column_stack</span>([np.<span class=\"fn\">ones</span>(<span class=\"\
    fn\">len</span>(X_tr)), X_tr])   <span class=\"cm\"># (n, 3)</span>\nX_te_b =\
    \ np.<span class=\"fn\">column_stack</span>([np.<span class=\"fn\">ones</span>(<span\
    \ class=\"fn\">len</span>(X_te)), X_te])\n\n<span class=\"cm\"># β* = (XᵀX)⁻¹\
    \ Xᵀy</span>\nbeta = np.linalg.<span class=\"fn\">inv</span>(X_tr_b.T @ X_tr_b)\
    \ @ X_tr_b.T @ y_train\n\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >\"OLS Coefficients (scratch):\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"  Intercept : {beta[0]:.4f}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"  MedInc    : {beta[1]:.4f}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"  AveRooms  : {beta[2]:.4f}\"</span>)\n\n<span class=\"cm\"\
    ># Predictions and MSE</span>\ny_pred_scratch = X_te_b @ beta\nmse_scratch = np.<span\
    \ class=\"fn\">mean</span>((y_test - y_pred_scratch)**2)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"\\nTest MSE (scratch OLS): {mse_scratch:.4f}\"</span>)\n\n\
    <span class=\"cm\"># ── Verify against sklearn ───────────────────────────────────</span>\n\
    <span class=\"kw\">from</span> sklearn.linear_model <span class=\"kw\">import</span>\
    \ LinearRegression\nlr = <span class=\"fn\">LinearRegression</span>()\nlr.<span\
    \ class=\"fn\">fit</span>(X_tr, y_train)\ny_pred_sk = lr.<span class=\"fn\">predict</span>(X_te)\n\
    mse_sk = np.<span class=\"fn\">mean</span>((y_test - y_pred_sk)**2)\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"Test MSE (sklearn)     : {mse_sk:.4f}\"\
    </span>)  <span class=\"cm\"># should match!</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"sklearn coef_: {lr.coef_}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"sklearn intercept_: {lr.intercept_:.4f}\"</span>)</pre>\n</div>\n\
    <h3 class=\"sh3\">\n       2. The 5 Assumptions of Linear Regression (LINE + H)\n\
    \      </h3>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\"\
    >\n         python — assumption_checks.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"\
    kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"\
    kw\">from</span> scipy <span class=\"kw\">import</span> stats\n<span class=\"\
    kw\">from</span> sklearn.linear_model <span class=\"kw\">import</span> LinearRegression\n\
    \n<span class=\"cm\"># After fitting a model, always check these 4 plots:</span>\n\
    \n<span class=\"kw\">def</span> <span class=\"fn\">regression_diagnostics</span>(model,\
    \ X_train, y_train, X_test, y_test):\n    y_pred  = model.<span class=\"fn\">predict</span>(X_test)\n\
    \    residuals = y_test - y_pred\n\n    fig, axes = plt.<span class=\"fn\">subplots</span>(<span\
    \ class=\"num\">2</span>, <span class=\"num\">2</span>, figsize=(<span class=\"\
    num\">12</span>, <span class=\"num\">8</span>))\n    fig.<span class=\"fn\">suptitle</span>(<span\
    \ class=\"str\">'Regression Diagnostic Plots'</span>, fontsize=<span class=\"\
    num\">14</span>)\n\n    <span class=\"cm\"># 1. Residuals vs Fitted — check Linearity\
    \ + Homoscedasticity</span>\n    axes[<span class=\"num\">0</span>,<span class=\"\
    num\">0</span>].<span class=\"fn\">scatter</span>(y_pred, residuals, alpha=<span\
    \ class=\"num\">0.4</span>, color=<span class=\"str\">'#6c8cff'</span>, s=<span\
    \ class=\"num\">20</span>)\n    axes[<span class=\"num\">0</span>,<span class=\"\
    num\">0</span>].<span class=\"fn\">axhline</span>(<span class=\"num\">0</span>,\
    \ color=<span class=\"str\">'#e56b8c'</span>, linestyle=<span class=\"str\">'--'</span>)\n\
    \    axes[<span class=\"num\">0</span>,<span class=\"num\">0</span>].<span class=\"\
    fn\">set_xlabel</span>(<span class=\"str\">'Fitted values'</span>); axes[<span\
    \ class=\"num\">0</span>,<span class=\"num\">0</span>].<span class=\"fn\">set_ylabel</span>(<span\
    \ class=\"str\">'Residuals'</span>)\n    axes[<span class=\"num\">0</span>,<span\
    \ class=\"num\">0</span>].<span class=\"fn\">set_title</span>(<span class=\"str\"\
    >'Residuals vs Fitted'</span>)\n    <span class=\"cm\"># WANT: random scatter\
    \ around zero. Red flag: cone shape or curve.</span>\n\n    <span class=\"cm\"\
    ># 2. Q-Q Plot — check Normality of residuals</span>\n    stats.<span class=\"\
    fn\">probplot</span>(residuals, dist=<span class=\"str\">\"norm\"</span>, plot=axes[<span\
    \ class=\"num\">0</span>,<span class=\"num\">1</span>])\n    axes[<span class=\"\
    num\">0</span>,<span class=\"num\">1</span>].<span class=\"fn\">set_title</span>(<span\
    \ class=\"str\">'Q-Q Plot (Normality Check)'</span>)\n    <span class=\"cm\">#\
    \ WANT: points on the diagonal line. Curves mean non-normal residuals.</span>\n\
    \n    <span class=\"cm\"># 3. Scale-Location — check Homoscedasticity</span>\n\
    \    axes[<span class=\"num\">1</span>,<span class=\"num\">0</span>].<span class=\"\
    fn\">scatter</span>(y_pred, np.<span class=\"fn\">sqrt</span>(np.<span class=\"\
    fn\">abs</span>(residuals)), alpha=<span class=\"num\">0.4</span>,\n         \
    \             color=<span class=\"str\">'#4fd1a5'</span>, s=<span class=\"num\"\
    >20</span>)\n    axes[<span class=\"num\">1</span>,<span class=\"num\">0</span>].<span\
    \ class=\"fn\">set_xlabel</span>(<span class=\"str\">'Fitted values'</span>);\
    \ axes[<span class=\"num\">1</span>,<span class=\"num\">0</span>].<span class=\"\
    fn\">set_ylabel</span>(<span class=\"str\">'√|Residuals|'</span>)\n    axes[<span\
    \ class=\"num\">1</span>,<span class=\"num\">0</span>].<span class=\"fn\">set_title</span>(<span\
    \ class=\"str\">'Scale-Location (Homoscedasticity)'</span>)\n    <span class=\"\
    cm\"># WANT: horizontal band. Upward funnel = heteroscedasticity (use WLS or log-transform\
    \ y).</span>\n\n    <span class=\"cm\"># 4. Residual distribution histogram</span>\n\
    \    axes[<span class=\"num\">1</span>,<span class=\"num\">1</span>].<span class=\"\
    fn\">hist</span>(residuals, bins=<span class=\"num\">40</span>, color=<span class=\"\
    str\">'#b47cfc'</span>, alpha=<span class=\"num\">0.8</span>, edgecolor=<span\
    \ class=\"str\">'black'</span>)\n    axes[<span class=\"num\">1</span>,<span class=\"\
    num\">1</span>].<span class=\"fn\">set_xlabel</span>(<span class=\"str\">'Residual\
    \ value'</span>); axes[<span class=\"num\">1</span>,<span class=\"num\">1</span>].<span\
    \ class=\"fn\">set_title</span>(<span class=\"str\">'Residual Distribution'</span>)\n\
    \    <span class=\"cm\"># WANT: bell curve centred at zero.</span>\n\n    plt.<span\
    \ class=\"fn\">tight_layout</span>()\n    plt.<span class=\"fn\">savefig</span>(<span\
    \ class=\"str\">'regression_diagnostics.png'</span>, dpi=<span class=\"num\">150</span>)\n\
    \    plt.<span class=\"fn\">show</span>()\n\n    <span class=\"cm\"># Normality\
    \ test</span>\n    stat, p = stats.<span class=\"fn\">shapiro</span>(residuals[:<span\
    \ class=\"num\">5000</span>])  <span class=\"cm\"># Shapiro-Wilk (max 5000)</span>\n\
    \    <span class=\"fn\">print</span>(<span class=\"str\">f\"\\nShapiro-Wilk normality\
    \ test: p={p:.4f}\"</span>)\n    <span class=\"fn\">print</span>(<span class=\"\
    str\">\"Residuals normal\" if p &gt; 0.05 else \"Residuals NOT normal — consider\
    \ transforming y\"</span>)</pre>\n</div>\n<h3 class=\"sh3\">\n       3. When OLS\
    \ Fails — And What To Do\n      </h3>\n<div class=\"table-wrap\" style=\"overflow-x:\
    \ auto; margin: 1.2rem 0; width: 100%;\"><table class=\"concept-table\">\n<tr>\n\
    <th>\n         PROBLEM\n        </th>\n<th>\n         SYMPTOM\n        </th>\n\
    <th>\n         DIAGNOSTIC\n        </th>\n<th>\n         FIX\n        </th>\n\
    </tr>\n<tr>\n<td>\n<strong>\n          Non-linearity\n         </strong>\n</td>\n\
    <td>\n         Curved pattern in residuals vs fitted plot\n        </td>\n<td>\n\
    \         Plot residuals\n        </td>\n<td>\n         Add polynomial features,\
    \ use tree models\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          Heteroscedasticity\n\
    \         </strong>\n</td>\n<td>\n         Funnel shape in residuals (variance\
    \ grows)\n        </td>\n<td>\n         Scale-location plot\n        </td>\n<td>\n\
    \         log-transform y, use Weighted Least Squares\n        </td>\n</tr>\n\
    <tr>\n<td>\n<strong>\n          Non-normal residuals\n         </strong>\n</td>\n\
    <td>\n         Curves in Q-Q plot; skewed histogram\n        </td>\n<td>\n   \
    \      Shapiro-Wilk test; Q-Q plot\n        </td>\n<td>\n         log/sqrt transform;\
    \ robust regression\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          Multicollinearity\n\
    \         </strong>\n</td>\n<td>\n         Unstable coefficients; high VIF\n \
    \       </td>\n<td>\n         Correlation matrix; VIF &gt; 10\n        </td>\n\
    <td>\n         Remove one correlated feature; use Ridge\n        </td>\n</tr>\n\
    <tr>\n<td>\n<strong>\n          Outliers / High Leverage\n         </strong>\n\
    </td>\n<td>\n         Cook's Distance &gt; 4/n\n        </td>\n<td>\n        \
    \ Cook's Distance plot\n        </td>\n<td>\n         Investigate and remove or\
    \ use robust regression\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n        \
    \  XᵀX not invertible\n         </strong>\n</td>\n<td>\n         Singular matrix\
    \ error from np.linalg.inv\n        </td>\n<td>\n         Rank of X &lt; p\n \
    \       </td>\n<td>\n         Use np.linalg.pinv (pseudoinverse) or Ridge\n  \
    \      </td>\n</tr>\n</table></div>\n<div class=\"cb\">\n<div class=\"cb-head\"\
    >\n<span class=\"cb-lang\">\n         python — multicollinearity_vif.py\n    \
    \    </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\"\
    >\n          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\
    <span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span\
    \ class=\"kw\">from</span> sklearn.datasets <span class=\"kw\">import</span> fetch_california_housing\n\
    <span class=\"kw\">from</span> sklearn.linear_model <span class=\"kw\">import</span>\
    \ LinearRegression\n\n<span class=\"cm\"># Variance Inflation Factor (VIF) — quantifies\
    \ multicollinearity</span>\n<span class=\"cm\"># VIF = 1: no multicollinearity</span>\n\
    <span class=\"cm\"># VIF 1-5: moderate (acceptable)</span>\n<span class=\"cm\"\
    ># VIF &gt; 10: HIGH — problematic, remove this feature</span>\n\n<span class=\"\
    kw\">def</span> <span class=\"fn\">calc_vif</span>(X_df):\n    vif_data = {}\n\
    \    <span class=\"kw\">for</span> col <span class=\"kw\">in</span> X_df.columns:\n\
    \        <span class=\"cm\"># Regress col on all other columns → R²</span>\n \
    \       others = X_df.<span class=\"fn\">drop</span>(columns=[col])\n        model\
    \  = <span class=\"fn\">LinearRegression</span>().<span class=\"fn\">fit</span>(others,\
    \ X_df[col])\n        r2     = model.<span class=\"fn\">score</span>(others, X_df[col])\n\
    \        vif_data[col] = <span class=\"num\">1</span> / (<span class=\"num\">1</span>\
    \ - r2) <span class=\"kw\">if</span> r2 &lt; <span class=\"num\">1</span> <span\
    \ class=\"kw\">else</span> <span class=\"fn\">float</span>(<span class=\"str\"\
    >'inf'</span>)\n    <span class=\"kw\">return</span> pd.<span class=\"fn\">Series</span>(vif_data,\
    \ name=<span class=\"str\">'VIF'</span>).<span class=\"fn\">sort_values</span>(ascending=<span\
    \ class=\"kw\">False</span>)\n\ndata = <span class=\"fn\">fetch_california_housing</span>()\n\
    X_df = pd.<span class=\"fn\">DataFrame</span>(data.data, columns=data.feature_names)\n\
    vif = <span class=\"fn\">calc_vif</span>(X_df)\n<span class=\"fn\">print</span>(vif)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"\\nFeatures with VIF &gt;\
    \ 5 (potential multicollinearity):\"</span>)\n<span class=\"fn\">print</span>(vif[vif\
    \ &gt; <span class=\"num\">5</span>])</pre>\n</div>\n<div class=\"interview\"\
    >\n       Interviewers ask: \"What are the assumptions of linear regression?\"\
    \ — the correct answer lists all 5 (LINE + H) and includes what happens when each\
    \ is violated. Never just say \"it assumes normality\" — be specific: it's the\
    \ RESIDUALS that must be normal, not the features or the target.\n      </div>\n\
    <div class=\"hinglish\">\n       \U0001F4A1 OLS formula yaad karo: β = (XᵀX)⁻¹Xᵀy.\
    \ Diagnosis plot hamesha banao — ek achi model ke residuals random hote hain.\
    \ Agar residuals mein pattern hai, model mein kuch miss ho raha hai. VIF &gt;\
    \ 10 matlab ek feature dusra predict kar sakta hai — woh redundant hai.\n    \
    \  </div>\n<h2 class=\"sh2\">\n       \U0001F52E Predict the Output\n      </h2>\n\
    <h2 class=\"sh2\">\n       \U0001F41B Find the Bug\n      </h2>\n<div class=\"\
    debug-block\">\n<div class=\"debug-label\">\n        DEBUG CHALLENGE — OLS matrix\
    \ inversion error\n       </div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n\
    <span class=\"cb-lang\">\n          python — buggy code\n         </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \           copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n           Run\n          </button>\n</div>\n\
    </div>\n<pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
    \ np\n\n<span class=\"cm\"># Data with 5 samples and 3 features (more features\
    \ than samples)</span>\nX = np.random.<span class=\"fn\">randn</span>(<span class=\"\
    num\">3</span>, <span class=\"num\">5</span>)   <span class=\"cm\"># Bug in shape!</span>\n\
    y = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">3</span>)\n\
    X_b = np.<span class=\"fn\">column_stack</span>([np.<span class=\"fn\">ones</span>(<span\
    \ class=\"num\">3</span>), X])\nbeta = np.linalg.<span class=\"fn\">inv</span>(X_b.T\
    \ @ X_b) @ X_b.T @ y  <span class=\"cm\"># will fail or give garbage</span>\n\
    <span class=\"fn\">print</span>(beta)</pre>\n</div>\n<button class=\"solution-toggle\"\
    \ onclick=\"toggleSolution('debug38-sol')\">\n        \U0001F441 Show Fix\n  \
    \     </button>\n<div class=\"solution-box\" id=\"debug38-sol\">\n<div class=\"\
    sol-header\">\n         BUG EXPLAINED\n        </div>\n<div class=\"cb\">\n<div\
    \ class=\"cb-head\">\n<span class=\"cb-lang\">\n           python — fixed\n  \
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">copy</button><button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">Run</button></div>\n</div>\n<pre><span class=\"\
    kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"\
    ># BUG 1: X shape is (3, 5) meaning 3 samples, 5 features.</span>\n<span class=\"\
    cm\"># With only 3 samples and 5 features (p &gt; n), XᵀX is (6×6) but SINGULAR\
    \ —</span>\n<span class=\"cm\"># the system is underdetermined (infinite solutions).\
    \ np.linalg.inv will</span>\n<span class=\"cm\"># either raise LinAlgError or\
    \ return meaningless values.</span>\n<span class=\"cm\">#</span>\n<span class=\"\
    cm\"># FIX OPTIONS:</span>\n<span class=\"cm\"># 1. Use np.linalg.pinv (Moore-Penrose\
    \ pseudoinverse) — safe always</span>\n<span class=\"cm\"># 2. Add more samples\
    \ (need n &gt; p for standard OLS)</span>\n<span class=\"cm\"># 3. Use Ridge Regression\
    \ which handles p &gt;= n gracefully</span>\n\n<span class=\"cm\"># Standard fix:\
    \ transpose to get correct shape (5 samples, 3 features)</span>\nX = np.random.<span\
    \ class=\"fn\">randn</span>(<span class=\"num\">5</span>, <span class=\"num\"\
