    sol_id: sol-w6t1
    solution_title: ✅ COMPLETE SOLUTION — linear_regression_from_scratch_both_meth.py
    solution_code: "<span class=\"cm\"># linear_regression_from_scratch_both_meth.py\
      \ — Solution</span>\n<span class=\"cm\"># Complete solution for: Linear Regression\
      \ from Scratch — Both Methods</span>\n\n<span class=\"kw\">import</span> numpy\
      \ <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span> matplotlib.pyplot\
      \ <span class=\"kw\">as</span> plt\n\n<span class=\"kw\">class</span> <span\
      \ class=\"cls\">LinearRegressionScratch</span>:\n    <span class=\"str\">\"\"\
      \"Linear Regression using Normal Equation: w = (X^T X)^(-1) X^T y\"\"\"</span>\n\
      \    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(<span\
      \ class=\"kw\">self</span>):\n        <span class=\"kw\">self</span>.weights\
      \ = <span class=\"kw\">None</span>\n        <span class=\"kw\">self</span>.bias\
      \ = <span class=\"kw\">None</span>\n    \n    <span class=\"kw\">def</span>\
      \ <span class=\"fn\">fit</span>(<span class=\"kw\">self</span>, X, y):\n   \
      \     X = np.<span class=\"fn\">array</span>(X, dtype=np.float64)\n        y\
      \ = np.<span class=\"fn\">array</span>(y, dtype=np.float64)\n        \n    \
      \    <span class=\"cm\"># Add bias column</span>\n        X_b = np.c_[np.<span\
      \ class=\"fn\">ones</span>(X.shape[<span class=\"num\">0</span>]), X]\n    \
      \    \n        <span class=\"cm\"># Normal equation</span>\n        <span class=\"\
      kw\">self</span>.theta = np.linalg.<span class=\"fn\">pinv</span>(X_b.T @ X_b)\
      \ @ X_b.T @ y\n        <span class=\"kw\">self</span>.bias = <span class=\"\
      kw\">self</span>.theta[<span class=\"num\">0</span>]\n        <span class=\"\
      kw\">self</span>.weights = <span class=\"kw\">self</span>.theta[<span class=\"\
      num\">1</span>:]\n        <span class=\"kw\">return</span> <span class=\"kw\"\
      >self</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">predict</span>(<span\
      \ class=\"kw\">self</span>, X):\n        X = np.<span class=\"fn\">array</span>(X,\
      \ dtype=np.float64)\n        <span class=\"kw\">return</span> X @ <span class=\"\
      kw\">self</span>.weights + <span class=\"kw\">self</span>.bias\n    \n    <span\
      \ class=\"kw\">def</span> <span class=\"fn\">r2_score</span>(<span class=\"\
      kw\">self</span>, X, y):\n        y_pred = <span class=\"kw\">self</span>.<span\
      \ class=\"fn\">predict</span>(X)\n        ss_res = np.<span class=\"fn\">sum</span>((y\
      \ - y_pred) ** <span class=\"num\">2</span>)\n        ss_tot = np.<span class=\"\
      fn\">sum</span>((y - y.<span class=\"fn\">mean</span>()) ** <span class=\"num\"\
      >2</span>)\n        <span class=\"kw\">return</span> <span class=\"num\">1</span>\
      \ - (ss_res / ss_tot)\n\n<span class=\"cm\"># Generate sample data</span>\n\
      np.random.<span class=\"fn\">seed</span>(<span class=\"num\">42</span>)\nX =\
      \ <span class=\"num\">2</span> * np.random.<span class=\"fn\">rand</span>(<span\
      \ class=\"num\">100</span>, <span class=\"num\">1</span>)\ny = <span class=\"\
      num\">4</span> + <span class=\"num\">3</span> * X.<span class=\"fn\">squeeze</span>()\
      \ + np.random.<span class=\"fn\">randn</span>(<span class=\"num\">100</span>)\
      \ * <span class=\"num\">0.5</span>\n\n<span class=\"cm\"># Train</span>\nmodel\
      \ = <span class=\"fn\">LinearRegressionScratch</span>()\nmodel.<span class=\"\
      fn\">fit</span>(X, y)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\
      Weights: {model.weights}, Bias: {model.bias:.4f}\"</span>)\n<span class=\"fn\"\
      >print</span>(<span class=\"str\">f\"R² Score: {model.r2_score(X, y):.4f}\"\
      </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Expected: w≈3.0,\
      \ b≈4.0\"</span>)\n\n<span class=\"kw\">if</span> __name__ == <span class=\"\
      str\">'__main__'</span>:\n    <span class=\"fn\">solve</span>()"
