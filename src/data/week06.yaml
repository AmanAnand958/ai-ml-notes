  - title: Complete GridSearchCV for ElasticNet
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: |-
      <p><strong>
                 On California Housing, build a complete GridSearchCV pipeline for ElasticNet: (1) Scale, (2) Grid search over 5 alphas × 5 l1_ratios = 25 combinations × 5-fold CV = 125 fits. Plot a heatmap of CV MSE for each (alpha, l1_ratio) combination using seaborn. Identify the optimal corner: does the optimal l1_ratio lean toward Ridge or Lasso territory? Compare the best ElasticNet against standalone Ridge and Lasso on the test set.
