  concept_flow:
  - Linear Regression — Deep
  - Polynomial Regression + T
  - Ridge & Lasso Regularisat
  - ElasticNet + Cross-Valida
  - Regression Metrics — Whic
  - SVR + Tree-Based Regressi
  - 'Capstone: End-to-End Hous'
  hinglish: KNN classification mein k nearest neighbors majority vote karte hain.
    k=1 → overfitting, k bahut large → underfitting. Odd k use karo ties avoid karne
    ke liye!
  analogy: Data leakage is like a student getting a copy of the final exam questions
    (test set) during homework study (training). Their study score looks amazing,
    but their true knowledge is unchecked.
  theory_html: "<h3 class=\"sh3\">\n       1. The Complete Regression Metric Toolkit\n\
    \      </h3><p style=\"margin: 0.8rem 0; font-size: 13.5px; line-height: 1.6;\"\
    >Evaluating continuous regression models requires quantifying both absolute prediction\
    \ deviations (Mean Absolute Error, MAE) and quadratically penalized outlier errors\
    \ (Root Mean Squared Error, RMSE), benchmarked against the variance explained\
    \ ratio ($R^2$ score).</p>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n         python — all_metrics.py\n        </span>\n<div\
    \ class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n\
    \          copy\n         </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n\
    <pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\
    <span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span>\
    \ (mean_squared_error, mean_absolute_error,\n                              r2_score,\
    \ mean_absolute_percentage_error)\n\n<span class=\"cm\"># House price prediction\
    \ (in lakhs ₹)</span>\ny_true = np.<span class=\"fn\">array</span>([<span class=\"\
    num\">50</span>, <span class=\"num\">80</span>, <span class=\"num\">120</span>,\
    \ <span class=\"num\">200</span>, <span class=\"num\">350</span>])\ny_pred = np.<span\
    \ class=\"fn\">array</span>([<span class=\"num\">55</span>, <span class=\"num\"\
    >75</span>, <span class=\"num\">130</span>, <span class=\"num\">190</span>, <span\
    \ class=\"num\">280</span>])   <span class=\"cm\"># reasonable predictions</span>\n\
    y_pred_outlier = np.<span class=\"fn\">array</span>([<span class=\"num\">55</span>,\
    \ <span class=\"num\">75</span>, <span class=\"num\">130</span>, <span class=\"\
    num\">190</span>, <span class=\"num\">50</span>])  <span class=\"cm\"># 1 terrible\
    \ prediction (350 vs 50)</span>\n\n<span class=\"cm\"># ── Core metrics ──────────────────────────────────────────────────</span>\n\
    mse   = np.<span class=\"fn\">mean</span>((y_true - y_pred)<span class=\"num\"\
    >2</span>)          <span class=\"cm\"># Mean Squared Error</span>\nrmse  = np.<span\
    \ class=\"fn\">sqrt</span>(mse)                             <span class=\"cm\"\
    ># Root MSE — same unit as y</span>\nmae   = np.<span class=\"fn\">mean</span>(np.<span\
    \ class=\"fn\">abs</span>(y_true - y_pred))         <span class=\"cm\"># Mean\
    \ Absolute Error</span>\nmape  = np.<span class=\"fn\">mean</span>(np.<span class=\"\
    fn\">abs</span>((y_true - y_pred) / y_true)) * <span class=\"num\">100</span>\
    \  <span class=\"cm\"># % error</span>\nr2    = <span class=\"fn\">r2_score</span>(y_true,\
    \ y_pred)                 <span class=\"cm\"># R-squared</span>\n\n<span class=\"\
    fn\">print</span>(<span class=\"str\">\"=== Normal Predictions ===\"</span>)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"  MSE  : {mse:.2f}    ←\
    \ penalises large errors more\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"  RMSE : {rmse:.2f}   ← same unit as y (lakhs)\"</span>)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"  MAE  : {mae:.2f}    ←\
    \ robust to outliers\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"  MAPE : {mape:.2f}%  ← percentage error (businesspeople love this)\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"  R²   : {r2:.4f}\
    \    ← fraction of variance explained\"</span>)\n\n<span class=\"cm\"># MSE vs\
    \ MAE — outlier sensitivity</span>\nmse_out  = np.<span class=\"fn\">mean</span>((y_true\
    \ - y_pred_outlier)**<span class=\"num\">2</span>)\nmae_out  = np.<span class=\"\
    fn\">mean</span>(np.<span class=\"fn\">abs</span>(y_true - y_pred_outlier))\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"\\n=== With 1 Outlier Prediction\
    \ (350 → 50) ===\"</span>)\n<span class=\"fn\">print</span>(<span class=\"str\"\
    >f\"  MSE change : {mse:.2f} → {mse_out:.2f}  ({(mse_out-mse)/mse*100:.0f}% increase!)\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"  MAE change\
    \ : {mae:.2f} → {mae_out:.2f}  ({(mae_out-mae)/mae*100:.0f}% increase — much less)\"\
    </span>)\n<span class=\"cm\"># MSE squares the outlier error (300²=90000) — gets\
    \ dominated</span>\n<span class=\"cm\"># MAE just takes |error|=300 — stays proportional</span>\n\
    \n<span class=\"cm\"># Adjusted R² — penalises unnecessary features</span>\nn,\
    \ p = <span class=\"num\">100</span>, <span class=\"num\">5</span>  <span class=\"\
    cm\"># 100 samples, 5 features</span>\nr2_adj = <span class=\"num\">1</span> -\
    \ (<span class=\"num\">1</span> - r2) * (n - <span class=\"num\">1</span>) / (n\
    \ - p - <span class=\"num\">1</span>)\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"\\nAdjusted R² (5 features, 100 samples): {r2_adj:.4f}\"</span>)\n<span\
    \ class=\"cm\"># Adjusted R² DECREASES when you add irrelevant features — R² never\
    \ decreases</span></pre>\n</div>\n<h3 class=\"sh3\">\n       2. R² — The Most\
    \ Misunderstood Metric\n      </h3>\n<div class=\"math-block\">\n<span class=\"\
    formula\">\n        $$R² = 1 − SS_res / SS_tot$$\n       </span>\n<span class=\"\
    desc\">\n        SS_res = Σ(yᵢ − ŷᵢ)² (residual sum of squares — model error)\n\
    \       </span>\n<span class=\"desc\">\n        SS_tot = Σ(yᵢ − ȳ)² (total sum\
    \ of squares — variance in data)\n       </span>\n<span class=\"formula\">\n \
    \       $$R² = 0: model no better than predicting the mean$$\n       </span>\n\
    <span class=\"formula\">\n        $$R² &lt; 0: model WORSE than predicting the\
    \ mean! (always possible with wrong model)$$\n       </span>\n<span class=\"formula\"\
    >\n        $$R² = 1: perfect predictions$$\n       </span>\n</div>\n<div class=\"\
    table-wrap\" style=\"overflow-x: auto; margin: 1.2rem 0; width: 100%;\"><table\
    \ class=\"concept-table\">\n<tr>\n<th>\n         METRIC\n        </th>\n<th>\n\
    \         FORMULA\n        </th>\n<th>\n         UNIT\n        </th>\n<th>\n \
    \        OUTLIER SENSITIVITY\n        </th>\n<th>\n         BEST FOR\n       \
    \ </th>\n</tr>\n<tr>\n<td>\n<strong>\n          MSE\n         </strong>\n</td>\n\
    <td>\n         Σ(y−ŷ)²/n\n        </td>\n<td>\n         y² (confusing!)\n    \
    \    </td>\n<td>\n         Very High (squares errors)\n        </td>\n<td>\n \
    \        When large errors are very costly (structural engineering)\n        </td>\n\
    </tr>\n<tr>\n<td>\n<strong>\n          RMSE\n         </strong>\n</td>\n<td>\n\
    \         √MSE\n        </td>\n<td>\n         Same as y\n        </td>\n<td>\n\
    \         High\n        </td>\n<td>\n         Same as MSE but interpretable —\
    \ most common\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          MAE\n   \
    \      </strong>\n</td>\n<td>\n         Σ|y−ŷ|/n\n        </td>\n<td>\n      \
    \   Same as y\n        </td>\n<td>\n         Low (robust)\n        </td>\n<td>\n\
    \         When outliers exist and large errors aren't catastrophic\n        </td>\n\
    </tr>\n<tr>\n<td>\n<strong>\n          MAPE\n         </strong>\n</td>\n<td>\n\
    \         Σ|y−ŷ|/(y)/n × 100%\n        </td>\n<td>\n         %\n        </td>\n\
    <td>\n         Medium (fails if y≈0)\n        </td>\n<td>\n         Business reporting,\
    \ demand forecasting (% error is intuitive)\n        </td>\n</tr>\n<tr>\n<td>\n\
    <strong>\n          R²\n         </strong>\n</td>\n<td>\n         1 − SS_res/SS_tot\n\
    \        </td>\n<td>\n         Unitless [−∞, 1]\n        </td>\n<td>\n       \
    \  High\n        </td>\n<td>\n         Comparing models on same dataset. NOT across\
    \ datasets.\n        </td>\n</tr>\n<tr>\n<td>\n<strong>\n          Adjusted R²\n\
    \         </strong>\n</td>\n<td>\n         1 − (1−R²)(n−1)/(n−p−1)\n        </td>\n\
    <td>\n         Unitless\n        </td>\n<td>\n         High\n        </td>\n<td>\n\
    \         Feature selection — penalises adding irrelevant features\n        </td>\n\
    </tr>\n<tr>\n<td>\n<strong>\n          Huber Loss\n         </strong>\n</td>\n\
    <td>\n         MSE if |e|≤δ, else MAE\n        </td>\n<td>\n         Same as y²\n\
    \        </td>\n<td>\n         Low (controlled)\n        </td>\n<td>\n       \
    \  When outliers exist but you still want MSE's differentiability\n        </td>\n\
    </tr>\n</table></div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"\
    cb-lang\">\n         python — huber_loss.py\n        </span>\n<div class=\"cb-btns\"\
    >\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n          copy\n  \
    \       </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\" style=\"\
    margin-left: 4px;\">\n          Run\n         </button>\n</div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"\
    kw\">from</span> sklearn.linear_model <span class=\"kw\">import</span> HuberRegressor\n\
    \n<span class=\"cm\"># Huber Loss — combines MSE (smooth) and MAE (outlier-robust)</span>\n\
    <span class=\"cm\"># δ (delta) is the threshold:</span>\n<span class=\"cm\">#\
    \ |error| ≤ δ → use MSE (quadratic, differentiable, fast gradient)</span>\n<span\
    \ class=\"cm\"># |error| &gt; δ → use MAE (linear, doesn't explode for huge errors)</span>\n\
    \n<span class=\"kw\">def</span> <span class=\"fn\">huber_loss</span>(y_true, y_pred,\
    \ delta=<span class=\"num\">1.35</span>):\n    errors = y_true - y_pred\n    is_small\
    \ = np.<span class=\"fn\">abs</span>(errors) &lt;= delta\n    huber = np.<span\
    \ class=\"fn\">where</span>(is_small,\n                     <span class=\"num\"\
    >0.5</span> * errors**<span class=\"num\">2</span>,\n                     delta\
    \ * (np.<span class=\"fn\">abs</span>(errors) - <span class=\"num\">0.5</span>\
    \ * delta))\n    <span class=\"kw\">return</span> np.<span class=\"fn\">mean</span>(huber)\n\
    \ny_true = np.<span class=\"fn\">array</span>([<span class=\"num\">10</span>,\
    \ <span class=\"num\">20</span>, <span class=\"num\">30</span>, <span class=\"\
    num\">40</span>, <span class=\"num\">500</span>])  <span class=\"cm\"># 500 is\
    \ an outlier</span>\ny_pred = np.<span class=\"fn\">array</span>([<span class=\"\
    num\">12</span>, <span class=\"num\">19</span>, <span class=\"num\">31</span>,\
    \ <span class=\"num\">42</span>, <span class=\"num\">100</span>])\n\nmse_loss\
    \   = np.<span class=\"fn\">mean</span>((y_true - y_pred)**<span class=\"num\"\
    >2</span>)\nmae_loss   = np.<span class=\"fn\">mean</span>(np.<span class=\"fn\"\
    >abs</span>(y_true - y_pred))\nhuber_val  = <span class=\"fn\">huber_loss</span>(y_true,\
    \ y_pred, delta=<span class=\"num\">10</span>)\n\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"MSE loss   : {mse_loss:.1f}  ← dominated by the 500 outlier\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"MAE loss   :\
    \ {mae_loss:.1f}  ← balanced\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Huber loss : {huber_val:.1f}  ← in between\"</span>)\n\n<span\
    \ class=\"cm\"># sklearn's HuberRegressor — use when you have outliers in y</span>\n\
    <span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\nX_train\
    \ = np.random.<span class=\"fn\">randn</span>(<span class=\"num\">100</span>,\
    \ <span class=\"num\">3</span>)\ny_train = X_train[:, <span class=\"num\">0</span>]\
    \ * <span class=\"num\">2</span> + np.random.<span class=\"fn\">randn</span>(<span\
    \ class=\"num\">100</span>) * <span class=\"num\">0.5</span>\ny_train[<span class=\"\
    num\">0</span>] = <span class=\"num\">100</span>  <span class=\"cm\"># outlier</span>\n\
    \nhuber_reg = <span class=\"fn\">HuberRegressor</span>(epsilon=<span class=\"\
    num\">1.35</span>)  <span class=\"cm\"># epsilon ≈ delta</span>\nhuber_reg.<span\
    \ class=\"fn\">fit</span>(X_train, y_train)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"\\nHuber coef (robust):   {huber_reg.coef_[0]:.3f}\"</span>)\
    \  <span class=\"cm\"># ≈ 2.0 despite outlier</span></pre>\n</div>\n<div class=\"\
    interview\">\n<strong>\n        Classic interview scenario: \"Your model has R²=0.95\
    \ on training data but R²=0.40 on test data. What happened and how do you fix\
    \ it?\"\n       </strong>\n<br/>\n<br/>\n<strong>\n        Answer:\n       </strong>\n\
    \       Severe overfitting. Fix: regularization, more training data, reduce model\
    \ complexity, add cross-validation for hyperparameter tuning. Never report training\
    \ R² as model performance — always report test R² or cross-validated R².\n   \
    \   </div>\n<h2 class=\"sh2\">\n       \U0001F52E Predict the Output\n      </h2>\n\
    <h2 class=\"sh2\">\n       \U0001F41B Find the Bug\n      </h2>\n<div class=\"\
    debug-block\">\n<div class=\"debug-label\">\n        DEBUG CHALLENGE — MAPE with\
    \ zero values\n       </div>\n<div class=\"cb\">\n<div class=\"cb-head\">\n<span\
    \ class=\"cb-lang\">\n          python — buggy code\n         </span>\n<div class=\"\
    cb-btns\">\n<button class=\"copy-btn\" onclick=\"copyCode(this)\">\n         \
    \  copy\n          </button>\n<button class=\"run-btn\" onclick=\"runCode(this)\"\
    \ style=\"margin-left: 4px;\">\n           Run\n          </button>\n</div>\n\
    </div>\n<pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span>\
    \ np\ny_true = np.<span class=\"fn\">array</span>([<span class=\"num\">10</span>,\
    \ <span class=\"num\">0</span>, <span class=\"num\">20</span>, <span class=\"\
    num\">15</span>, <span class=\"num\">0</span>])  <span class=\"cm\"># contains\
    \ zeros!</span>\ny_pred = np.<span class=\"fn\">array</span>([<span class=\"num\"\
    >12</span>, <span class=\"num\">2</span>, <span class=\"num\">18</span>, <span\
    \ class=\"num\">14</span>, <span class=\"num\">1</span>])\nmape = np.<span class=\"\
    fn\">mean</span>(np.<span class=\"fn\">abs</span>((y_true - y_pred) / y_true))\
    \ * <span class=\"num\">100</span>  <span class=\"cm\"># Bug!</span>\n<span class=\"\
    fn\">print</span>(<span class=\"str\">f\"MAPE: {mape:.2f}%\"</span>)</pre>\n</div>\n\
    <button class=\"solution-toggle\" onclick=\"toggleSolution('debug42-sol')\">\n\
    \        \U0001F441 Show Fix\n       </button>\n<div class=\"solution-box\" id=\"\
    debug42-sol\">\n<div class=\"sol-header\">\n         BUG EXPLAINED\n        </div>\n\
    <div class=\"cb\">\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n      \
    \     python — fixed\n          </span>\n<div class=\"cb-btns\">\n<button class=\"\
    copy-btn\" onclick=\"copyCode(this)\">copy</button><button class=\"run-btn\" onclick=\"\
    runCode(this)\" style=\"margin-left: 4px;\">Run</button></div>\n</div>\n<pre><span\
    \ class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"\
    cm\"># BUG: Division by zero when y_true contains zeros.</span>\n<span class=\"\
    cm\"># (y_true - y_pred) / y_true → 0/0 or x/0 → NaN or Inf.</span>\n<span class=\"\
    cm\"># MAPE is undefined when actual value is zero — you can't compute %</span>\n\
    <span class=\"cm\"># error relative to zero. np.mean([...inf, ...]) = inf.</span>\n\
    <span class=\"cm\"># </span>\n<span class=\"cm\"># FIXES depending on context:</span>\n\
    <span class=\"cm\"># 1. Filter out zero-true values (if 0 means \"no demand\"\
    \ — skip it)</span>\n<span class=\"cm\"># 2. Use sMAPE (symmetric MAPE) — denominator\
    \ = (|y| + |ŷ|)/2</span>\n<span class=\"cm\"># 3. Add a small epsilon to denominator</span>\n\
    <span class=\"cm\"># 4. Use MAE or RMSE instead when data contains zeros</span>\n\
    \n<span class=\"cm\"># Fix 1: Filter zeros</span>\nmask = y_true != <span class=\"\
    num\">0</span>\nmape_filtered = np.<span class=\"fn\">mean</span>(np.<span class=\"\
    fn\">abs</span>((y_true[mask] - y_pred[mask]) / y_true[mask])) * <span class=\"\
    num\">100</span>\n<span class=\"fn\">print</span>(<span class=\"str\">f\"MAPE\
    \ (filtered): {mape_filtered:.2f}%\"</span>)\n\n<span class=\"cm\"># Fix 2: sMAPE\
    \ (denominator never zero)</span>\nsmape = np.<span class=\"fn\">mean</span>(<span\
    \ class=\"num\">2</span> * np.<span class=\"fn\">abs</span>(y_true - y_pred) /\
    \ (np.<span class=\"fn\">abs</span>(y_true) + np.<span class=\"fn\">abs</span>(y_pred)\
    \ + <span class=\"num\">1e-8</span>)) * <span class=\"num\">100</span>\n<span\
    \ class=\"fn\">print</span>(<span class=\"str\">f\"sMAPE: {smape:.2f}%\"</span>)\
    \  <span class=\"cm\"># safe — denominator always &gt; 0</span></pre>\n</div>\n\
    </div>\n</div>\n<!-- /day-42-theory -->\n<!-- /day-42-quiz-section -->\n<!-- /day-42-tasks-section\
    \ -->\n<!-- /day-42-resources-section -->"
