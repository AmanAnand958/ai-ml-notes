      is_correct: true
      id: c
    - letter: D
      text: The model has negative correlation with the target
      is_correct: false
      id: d
    correct_fb: '✅ Correct! R² = 1 − SS_res/SS_tot. When SS_res &gt; SS_tot, R² &lt; 0. This happens when your model''s predictions are FURTHER from the true values than simply always predicting the mean. A mean predictor has R²=0. Negative R² means the model actively makes things worse — suggesting: severe.'
    wrong_fb: ❌ R² can absolutely be negative — there's no lower bound. R²=0 means "as good as predicting the mean." R²&lt;0 means "WORSE than predicting the mean." This indicates the model is making systematically bad predictions — possibly trained on very different data than the test set, or severe data leakage making training artificially easy. This is a red flag requiring investigation, not just "bad performance" — the model is actively harmful.
    correct: c
  flashcards:
  - front: Lasso vs Ridge Regression (D42)?
    back: 'Lasso (L1): Adds absolute weight penalty, leads to sparse feature selection. Ridge (L2): Adds squared weight penalty, shrinks weights.'
  - front: 'Core concept: What is the significance of R-squared? in Regression Metrics — Which One When??'
    back: 'Proportion of variance in the dependent variable explained by features: 1 - (SS_res / SS_tot).'
  - front: Mean Squared Error (MSE) (D42)?
    back: Average of squared differences between true and predicted values. Highly sensitive to outliers.
  - front: 'Core concept: What is the significance of MAE vs MSE? in Regression Metrics — Which One When??'
    back: MAE (Mean Absolute Error) uses absolute differences (linear penalty); MSE uses squared differences (quadratic penalty for outliers).
  - front: Multicollinearity (D42)?
    back: When two or more predictor variables are highly correlated, inflating the variance of regression coefficients.
  gotcha:
    title: '⚠️ Gotcha: Gradient Descent Vanishing & Explosions'
    description: Unnormalized input features lead to oscillating gradients and slow convergence. Always normalize features before gradient descent.
  takeaways:
    hinglish_line: |-
      <strong>
                Ek line mein:
               </strong>
               Data scaling hamesha train_test_split ke baad shuru karni chahiye taaki test set ki information train set mein leak na ho.
    bullets:
    - |-
      <strong>
                 MSE vs MAE:
                </strong>
                MSE punishes large errors heavily (squares them). MAE is robust. Use MSE when big errors are catastrophic; MAE when outliers are.
    - |-
      <strong>
                 R² = 0:
                </strong>
                As good as the mean predictor. R² &lt; 0: WORSE than the mean — something is fundamentally wrong. R² = 1: perfect.
    - |-
      <strong>
                 Adjusted R²:
                </strong>
                Penalises unnecessary features. Use for feature selection. Plain R² never decreases with more features.
    - |-
      <strong>
                 MAPE for business:
                </strong>
                % error is universally understood. Fails when actual=0 — use sMAPE or filter zeros.
    - |-
      <strong>
                 Huber Loss:
                </strong>
                MSE behavior for small errors (smooth gradient), MAE behavior for large errors (doesn't blow up). Use when you have outliers but.
