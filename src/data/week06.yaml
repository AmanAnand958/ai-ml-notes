  theory_html: |-
    <p><h3 class="sh3">
           1. The Full Linear Regression Story
          </h3>

    <div class="math-block">
    <span class="formula">
            $$ŷ = β₀ + β₁x₁ + β₂x₂ + ... + βₙxₙ = Xβ$$
           </span>
    <span class="desc">
            Matrix form: X is (n×p) design matrix (with 1s column for intercept), β is (p×1) weight vector
           </span>
    <span class="formula">
            $$Loss (MSE) = (1/n) Σ(yᵢ − ŷᵢ)² = (1/n)||y − Xβ||²$$
           </span>
    <span class="desc">
            We minimize this. Set derivative to zero → closed-form OLS solution:
           </span>
    <span class="formula">
            $$β* = (XᵀX)⁻¹ Xᵀy$$
           </span>
    <span class="desc">
            The Normal Equation. Direct, exact, no iteration needed — but expensive for large n.
           </span>
    </div>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — linear_regression_ols.py
            </span>
    <div class="cb-btns">
    <button class="run-btn" onclick="openRepl()">
              ▶ try online
             </button>
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">import</span> pandas <span class="kw">as</span> pd
    <span class="kw">from</span> sklearn.datasets <span class="kw">import</span> fetch_california_housing
    <span class="kw">from</span> sklearn.model_selection <span class="kw">import</span> train_test_split
    <span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span> StandardScaler

    <span class="cm"># Load California Housing dataset (classic regression benchmark)</span>
    data = <span class="fn">fetch_california_housing</span>()
    X_df = pd.<span class="fn">DataFrame</span>(data.data, columns=data.feature_names)
    y    = data.target   <span class="cm"># median house value in $100k</span>

    <span class="cm"># Use just 2 features for visualization clarity</span>
    X_raw = X_df[[<span class="str">'MedInc'</span>, <span class="str">'AveRooms'</span>]].values

    X_train, X_test, y_train, y_test = <span class="fn">train_test_split</span>(
        X_raw, y, test_size=<span class="num">0.2</span>, random_state=<span class="num">42</span>)

    <span class="cm"># Scale features — critical before OLS with multiple features</span>
    sc = <span class="fn">StandardScaler</span>()
    X_tr = sc.<span class="fn">fit_transform</span>(X_train)
    X_te = sc.<span class="fn">transform</span>(X_test)

    <span class="cm"># ── OLS from scratch using Normal Equation ──────────────────</span>
    <span class="cm"># Add bias column (column of 1s)</span>
    X_tr_b = np.<span class="fn">column_stack</span>([np.<span class="fn">ones</span>(<span class="fn">len</span>(X_tr)), X_tr])   <span class="cm"># (n, 3)</span>
    X_te_b = np.<span class="fn">column_stack</span>([np.<span class="fn">ones</span>(<span class="fn">len</span>(X_te)), X_te])

    <span class="cm"># β* = (XᵀX)⁻¹ Xᵀy</span>
    beta = np.linalg.<span class="fn">inv</span>(X_tr_b.T @ X_tr_b) @ X_tr_b.T @ y_train

    <span class="fn">print</span>(<span class="str">"OLS Coefficients (scratch):"</span>)
    <span class="fn">print</span>(<span class="str">f"  Intercept : {beta[0]:.4f}"</span>)
    <span class="fn">print</span>(<span class="str">f"  MedInc    : {beta[1]:.4f}"</span>)
    <span class="fn">print</span>(<span class="str">f"  AveRooms  : {beta[2]:.4f}"</span>)

    <span class="cm"># Predictions and MSE</span>
    y_pred_scratch = X_te_b @ beta
    mse_scratch = np.<span class="fn">mean</span>((y_test - y_pred_scratch)**2)
    <span class="fn">print</span>(<span class="str">f"\nTest MSE (scratch OLS): {mse_scratch:.4f}"</span>)

    <span class="cm"># ── Verify against sklearn ───────────────────────────────────</span>
    <span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> LinearRegression
    lr = <span class="fn">LinearRegression</span>()
    lr.<span class="fn">fit</span>(X_tr, y_train)
    y_pred_sk = lr.<span class="fn">predict</span>(X_te)
    mse_sk = np.<span class="fn">mean</span>((y_test - y_pred_sk)**2)
    <span class="fn">print</span>(<span class="str">f"Test MSE (sklearn)     : {mse_sk:.4f}"</span>)  <span class="cm"># should match!</span>
    <span class="fn">print</span>(<span class="str">f"sklearn coef_: {lr.coef_}"</span>)
    <span class="fn">print</span>(<span class="str">f"sklearn intercept_: {lr.intercept_:.4f}"</span>)</code></pre>
    </div>
    <h3 class="sh3">
           2. The 5 Assumptions of Linear Regression (LINE + H)
          </h3>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — assumption_checks.py
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt
    <span class="kw">from</span> scipy <span class="kw">import</span> stats
    <span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> LinearRegression

    <span class="cm"># After fitting a model, always check these 4 plots:</span>

    <span class="kw">def</span> <span class="fn">regression_diagnostics</span>(model, X_train, y_train, X_test, y_test):
        y_pred  = model.<span class="fn">predict</span>(X_test)
        residuals = y_test - y_pred

        fig, axes = plt.<span class="fn">subplots</span>(<span class="num">2</span>, <span class="num">2</span>, figsize=(<span class="num">12</span>, <span class="num">8</span>))
        fig.<span class="fn">suptitle</span>(<span class="str">'Regression Diagnostic Plots'</span>, fontsize=<span class="num">14</span>)

        <span class="cm"># 1. Residuals vs Fitted — check Linearity + Homoscedasticity</span>
        axes[<span class="num">0</span>,<span class="num">0</span>].<span class="fn">scatter</span>(y_pred, residuals, alpha=<span class="num">0.4</span>, color=<span class="str">'#6c8cff'</span>, s=<span class="num">20</span>)
        axes[<span class="num">0</span>,<span class="num">0</span>].<span class="fn">axhline</span>(<span class="num">0</span>, color=<span class="str">'#e56b8c'</span>, linestyle=<span class="str">'--'</span>)
        axes[<span class="num">0</span>,<span class="num">0</span>].<span class="fn">set_xlabel</span>(<span class="str">'Fitted values'</span>); axes[<span class="num">0</span>,<span class="num">0</span>].<span class="fn">set_ylabel</span>(<span class="str">'Residuals'</span>)
        axes[<span class="num">0</span>,<span class="num">0</span>].<span class="fn">set_title</span>(<span class="str">'Residuals vs Fitted'</span>)
        <span class="cm"># WANT: random scatter around zero. Red flag: cone shape or curve.</span>

        <span class="cm"># 2. Q-Q Plot — check Normality of residuals</span>
        stats.<span class="fn">probplot</span>(residuals, dist=<span class="str">"norm"</span>, plot=axes[<span class="num">0</span>,<span class="num">1</span>])
        axes[<span class="num">0</span>,<span class="num">1</span>].<span class="fn">set_title</span>(<span class="str">'Q-Q Plot (Normality Check)'</span>)
        <span class="cm"># WANT: points on the diagonal line. Curves mean non-normal residuals.</span>

        <span class="cm"># 3. Scale-Location — check Homoscedasticity</span>
        axes[<span class="num">1</span>,<span class="num">0</span>].<span class="fn">scatter</span>(y_pred, np.<span class="fn">sqrt</span>(np.<span class="fn">abs</span>(residuals)), alpha=<span class="num">0.4</span>,
                          color=<span class="str">'#4fd1a5'</span>, s=<span class="num">20</span>)
        axes[<span class="num">1</span>,<span class="num">0</span>].<span class="fn">set_xlabel</span>(<span class="str">'Fitted values'</span>); axes[<span class="num">1</span>,<span class="num">0</span>].<span class="fn">set_ylabel</span>(<span class="str">'√|Residuals|'</span>)
        axes[<span class="num">1</span>,<span class="num">0</span>].<span class="fn">set_title</span>(<span class="str">'Scale-Location (Homoscedasticity)'</span>)
        <span class="cm"># WANT: horizontal band. Upward funnel = heteroscedasticity (use WLS or log-transform y).</span>

        <span class="cm"># 4. Residual distribution histogram</span>
        axes[<span class="num">1</span>,<span class="num">1</span>].<span class="fn">hist</span>(residuals, bins=<span class="num">40</span>, color=<span class="str">'#b47cfc'</span>, alpha=<span class="num">0.8</span>, edgecolor=<span class="str">'black'</span>)
        axes[<span class="num">1</span>,<span class="num">1</span>].<span class="fn">set_xlabel</span>(<span class="str">'Residual value'</span>); axes[<span class="num">1</span>,<span class="num">1</span>].<span class="fn">set_title</span>(<span class="str">'Residual Distribution'</span>)
        <span class="cm"># WANT: bell curve centred at zero.</span>

        plt.<span class="fn">tight_layout</span>()
        plt.<span class="fn">savefig</span>(<span class="str">'regression_diagnostics.png'</span>, dpi=<span class="num">150</span>)
        plt.<span class="fn">show</span>()

        <span class="cm"># Normality test</span>
        stat, p = stats.<span class="fn">shapiro</span>(residuals[:<span class="num">5000</span>])  <span class="cm"># Shapiro-Wilk (max 5000)</span>
        <span class="fn">print</span>(<span class="str">f"\nShapiro-Wilk normality test: p={p:.4f}"</span>)
        <span class="fn">print</span>(<span class="str">"Residuals normal" if p &gt; 0.05 else "Residuals NOT normal — consider transforming y"</span>)</code></pre>
    </div>
    <h3 class="sh3">
           3. When OLS Fails — And What To Do
          </h3>
    <div class="table-wrap" style="overflow-x: auto; margin: 1.2rem 0; width: 100%;"><table class="concept-table">
    <tr>
    <th>
             PROBLEM
            </th>
    <th>
             SYMPTOM
            </th>
    <th>
             DIAGNOSTIC
            </th>
    <th>
             FIX
            </th>
    </tr>
    <tr>
    <td>
    <strong>
              Non-linearity
             </strong>
    </td>
    <td>
             Curved pattern in residuals vs fitted plot
            </td>
    <td>
             Plot residuals
            </td>
    <td>
             Add polynomial features, use tree models
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              Heteroscedasticity
             </strong>
    </td>
    <td>
             Funnel shape in residuals (variance grows)
            </td>
    <td>
             Scale-location plot
            </td>
    <td>
             log-transform y, use Weighted Least Squares
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              Non-normal residuals
             </strong>
    </td>
    <td>
             Curves in Q-Q plot; skewed histogram
            </td>
    <td>
             Shapiro-Wilk test; Q-Q plot
            </td>
    <td>
             log/sqrt transform; robust regression
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              Multicollinearity
             </strong>
    </td>
    <td>
             Unstable coefficients; high VIF
            </td>
    <td>
             Correlation matrix; VIF &gt; 10
            </td>
    <td>
             Remove one correlated feature; use Ridge
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              Outliers / High Leverage
             </strong>
    </td>
    <td>
             Cook's Distance &gt; 4/n
            </td>
    <td>
             Cook's Distance plot
            </td>
    <td>
             Investigate and remove or use robust regression
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              XᵀX not invertible
             </strong>
    </td>
    <td>
             Singular matrix error from np.linalg.inv
            </td>
    <td>
             Rank of X &lt; p
            </td>
    <td>
             Use np.linalg.pinv (pseudoinverse) or Ridge
            </td>
    </tr>
    </table></div>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — multicollinearity_vif.py
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">import</span> pandas <span class="kw">as</span> pd
    <span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">from</span> sklearn.datasets <span class="kw">import</span> fetch_california_housing
    <span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> LinearRegression

    <span class="cm"># Variance Inflation Factor (VIF) — quantifies multicollinearity</span>
    <span class="cm"># VIF = 1: no multicollinearity</span>
    <span class="cm"># VIF 1-5: moderate (acceptable)</span>
    <span class="cm"># VIF &gt; 10: HIGH — problematic, remove this feature</span>

    <span class="kw">def</span> <span class="fn">calc_vif</span>(X_df):
        vif_data = {}
        <span class="kw">for</span> col <span class="kw">in</span> X_df.columns:
            <span class="cm"># Regress col on all other columns → R²</span>
            others = X_df.<span class="fn">drop</span>(columns=[col])
            model  = <span class="fn">LinearRegression</span>().<span class="fn">fit</span>(others, X_df[col])
            r2     = model.<span class="fn">score</span>(others, X_df[col])
            vif_data[col] = <span class="num">1</span> / (<span class="num">1</span> - r2) <span class="kw">if</span> r2 &lt; <span class="num">1</span> <span class="kw">else</span> <span class="fn">float</span>(<span class="str">'inf'</span>)
        <span class="kw">return</span> pd.<span class="fn">Series</span>(vif_data, name=<span class="str">'VIF'</span>).<span class="fn">sort_values</span>(ascending=<span class="kw">False</span>)

    data = <span class="fn">fetch_california_housing</span>()
    X_df = pd.<span class="fn">DataFrame</span>(data.data, columns=data.feature_names)
    vif = <span class="fn">calc_vif</span>(X_df)
    <span class="fn">print</span>(vif)
    <span class="fn">print</span>(<span class="str">f"\nFeatures with VIF &gt; 5 (potential multicollinearity):"</span>)
    <span class="fn">print</span>(vif[vif &gt; <span class="num">5</span>])</code></pre>
    </div>
    <div class="interview">
           Interviewers ask: "What are the assumptions of linear regression?" — the correct answer lists all 5 (LINE + H) and includes what happens when each is violated. Never just say "it assumes normality" — be specific: it's the RESIDUALS that must be normal, not the features or the target.
          </div>
    <div class="hinglish">
           💡 OLS formula yaad karo: β = (XᵀX)⁻¹Xᵀy. Diagnosis plot hamesha banao — ek achi model ke residuals random hote hain. Agar residuals mein pattern hai, model mein kuch miss ho raha hai. VIF &gt; 10 matlab ek feature dusra predict kar sakta hai — woh redundant hai.
