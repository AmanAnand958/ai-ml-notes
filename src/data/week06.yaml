  quizzes:
  - num_str: QUESTION 1 OF 3
    question: What does the "epsilon" parameter do in Support Vector Regression?
    qid: q43_1
    options:
    - letter: A
      text: It acts as the regularization strength (like alpha in Ridge)
      is_correct: false
    - letter: B
      text: It defines a tube around the regression line where errors are ignored
        (no penalty)
      is_correct: true
    - letter: C
      text: It controls the width of the RBF kernel
      is_correct: false
    - letter: D
      text: It sets the maximum depth of the model
      is_correct: false
    correct_fb: ✅ Correct! The epsilon-tube is SVR's unique feature. Errors within
      this tube are completely ignored, making the model robust to small noise in
      the training data.
    wrong_fb: ❌ Epsilon defines the "tube" of tolerance around the prediction. Inside
      this tube, error is considered zero.
  - num_str: QUESTION 2 OF 3
    question: Which regression model requires feature scaling the MOST?
    qid: q43_2
    options:
    - letter: A
      text: SVR with RBF kernel
      is_correct: true
    - letter: B
      text: Random Forest Regressor
      is_correct: false
    - letter: C
      text: Decision Tree Regressor
      is_correct: false
    - letter: D
      text: Ordinary Least Squares (OLS) Linear Regression
      is_correct: false
    correct_fb: ✅ Correct! SVR relies on distance metrics (especially with the RBF
      kernel). Unscaled features will completely ruin an SVR model. Trees don't care
      about scale, and pure OLS coefficients just adjust to the scale.
    wrong_fb: ❌ SVR relies on distance calculations (RBF kernel). If one feature is
      1-10 and another is 1000-5000, the larger one will dominate the distance metric.
      Tree-based models do NOT require scaling.
  - num_str: QUESTION 3 OF 3
    question: Why is Gradient Boosting usually better than Random Forest for regression?
    qid: q43_3
    options:
    - letter: A
      text: It is much faster to train
      is_correct: false
    - letter: B
      text: It optimizes residuals iteratively, reducing bias step-by-step, whereas
        RF just averages independent trees
      is_correct: true
    - letter: C
      text: It doesn't overfit, whereas Random Forest overfits easily
      is_correct: false
    - letter: D
      text: It requires fewer hyperparameters to tune
      is_correct: false
    correct_fb: ✅ Correct! Boosting builds trees sequentially, where each new tree
      tries to fix the errors (residuals) of the previous ones. This leads to much
      lower bias and typically better predictive performance.
    wrong_fb: ❌ Gradient boosting reduces bias iteratively by fitting new trees to
      the residuals of the old trees. It is slower to train than RF and has MORE hyperparameters
      to tune, but usually wins in performance.
  flashcards:
  - front: Support Vector Regression (SVR)?
    back: Uses an epsilon-insensitive tube where errors within distance epsilon incur
      zero loss, with kernel tricks mapping data to higher dimensions for non-linear
      regression.
