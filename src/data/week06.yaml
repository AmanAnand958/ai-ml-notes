    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> HuberRegressor

    <span class="cm"># Huber Loss — combines MSE (smooth) and MAE (outlier-robust)</span>
    <span class="cm"># δ (delta) is the threshold:</span>
    <span class="cm"># |error| ≤ δ → use MSE (quadratic, differentiable, fast gradient)</span>
    <span class="cm"># |error| &gt; δ → use MAE (linear, doesn't explode for huge errors)</span>

    <span class="kw">def</span> <span class="fn">huber_loss</span>(y_true, y_pred, delta=<span class="num">1.35</span>):
        errors = y_true - y_pred
        is_small = np.<span class="fn">abs</span>(errors) <= delta
        huber = np.<span class="fn">where</span>(is_small,
                         <span class="num">0.5</span> * errors**<span class="num">2</span>,
                         delta * (np.<span class="fn">abs</span>(errors) - <span class="num">0.5</span> * delta))
        <span class="kw">return</span> np.<span class="fn">mean</span>(huber)

    y_true = np.<span class="fn">array</span>([<span class="num">10</span>, <span class="num">20</span>, <span class="num">30</span>, <span class="num">40</span>, <span class="num">500</span>])  <span class="cm"># 500 is an outlier</span>
    y_pred = np.<span class="fn">array</span>([<span class="num">12</span>, <span class="num">19</span>, <span class="num">31</span>, <span class="num">42</span>, <span class="num">100</span>])

    mse_loss   = np.<span class="fn">mean</span>((y_true - y_pred)**<span class="num">2</span>)
    mae_loss   = np.<span class="fn">mean</span>(np.<span class="fn">abs</span>(y_true - y_pred))
    huber_val  = <span class="fn">huber_loss</span>(y_true, y_pred, delta=<span class="num">10</span>)

    <span class="fn">print</span>(<span class="str">f"MSE loss   : {mse_loss:.1f}  ← dominated by the 500 outlier"</span>)
    <span class="fn">print</span>(<span class="str">f"MAE loss   : {mae_loss:.1f}  ← balanced"</span>)
    <span class="fn">print</span>(<span class="str">f"Huber loss : {huber_val:.1f}  ← in between"</span>)

    <span class="cm"># sklearn's HuberRegressor — use when you have outliers in y</span>
    <span class="kw">import</span> numpy <span class="kw">as</span> np
    X_train = np.random.<span class="fn">randn</span>(<span class="num">100</span>, <span class="num">3</span>)
    y_train = X_train[:, <span class="num">0</span>] * <span class="num">2</span> + np.random.<span class="fn">randn</span>(<span class="num">100</span>) * <span class="num">0.5</span>
    y_train[<span class="num">0</span>] = <span class="num">100</span>  <span class="cm"># outlier</span>

    huber_reg = <span class="fn">HuberRegressor</span>(epsilon=<span class="num">1.35</span>)  <span class="cm"># epsilon ≈ delta</span>
    huber_reg.<span class="fn">fit</span>(X_train, y_train)
    <span class="fn">print</span>(<span class="str">f"\nHuber coef (robust):   {huber_reg.coef_[0]:.3f}"</span>)  <span class="cm"># ≈ 2.0 despite outlier</span></code></pre>
