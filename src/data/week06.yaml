  quizzes:
  - num_str: QUESTION 1 OF 4
    question: The Normal Equation β* = (XᵀX)⁻¹Xᵀy gives the exact OLS solution. Why
      might you still prefer gradient descent for large datasets?
    qid: q38_1
    options:
    - letter: A
      text: Gradient descent always finds a better solution than the Normal Equation
      is_correct: false
    - letter: B
      text: Inverting (XᵀX) is O(p³) — with many features or samples it becomes prohibitively
        slow and memory-intensive
      is_correct: true
    - letter: C
      text: The Normal Equation requires the data to be normally distributed
      is_correct: false
    - letter: D
      text: Gradient descent can handle non-linear data but the Normal Equation cannot
      is_correct: false
    correct_fb: ✅ Correct! Matrix inversion of an (p×p) matrix is O(p³). With 10,000
      features (common in NLP/genomics), that's 10¹² operations — computationally
      infeasible. Gradient descent updates are O(np) per step — much cheaper. sklearn
      uses SVD-based solver (not direct inversion) which is O(np²), faster and more
      numerically stable. For large n with small p, scipy.linalg.lstsq is even better.
    wrong_fb: '❌ Normal Equation finds the globally optimal solution. The issue is
      computational cost: matrix inversion is O(p³). For 10k features, this is intractable.
      Gradient descent is iterative but scales to millions of features and samples.
      sklearn uses SVD instead of direct inversion — faster and more numerically stable
      than the pure Normal Equation.'
  - num_str: QUESTION 2 OF 4
    question: A residual plot shows a clear "fan" shape — residuals are small at low
      fitted values and large at high fitted values. Which assumption is violated?
    qid: q38_2
    options:
    - letter: A
      text: Linearity — the relationship isn't linear
      is_correct: false
    - letter: B
      text: Homoscedasticity — residual variance increases with fitted values (heteroscedasticity)
      is_correct: true
    - letter: C
      text: Normality — residuals aren't normally distributed
      is_correct: false
    - letter: D
      text: Independence — observations are correlated
      is_correct: false
    correct_fb: '✅ Correct! A "fan" or "cone" shape in residuals vs fitted values
      is the classic signature of heteroscedasticity — the assumption of equal variance
      (homoscedasticity) is violated. Common with prices, incomes, counts. Fix: apply
      log(y) or sqrt(y) transformation to compress the scale. After transformation,
      recheck the plot — the fan should disappear.'
    wrong_fb: ❌ Fan shape = heteroscedasticity = violation of homoscedasticity. Linearity
      violation shows as a CURVE in the residuals. Normality violation shows as S-curves
      in the Q-Q plot or a skewed histogram. The fan pattern specifically means variance
      grows with the predicted value — log-transforming y usually fixes this.
  - num_str: QUESTION 3 OF 4
    question: Feature A and Feature B have Pearson r = 0.97. You include both in a
      Linear Regression. What problem occurs?
    qid: q38_3
    options:
    - letter: A
      text: The model will overfit the training data
      is_correct: false
    - letter: B
      text: Multicollinearity — coefficients become unstable, have large standard
        errors, and are uninterpretable
      is_correct: true
    - letter: C
      text: The model will run significantly slower
      is_correct: false
    - letter: D
      text: The predictions will be systematically biased
      is_correct: false
    correct_fb: '✅ Correct! Multicollinearity doesn''t harm predictions much (predictions
      stay stable) but destroys coefficient interpretability. With r=0.97, XᵀX is
      nearly singular, making (XᵀX)⁻¹ numerically unstable — tiny changes in data
      cause huge swings in coefficients. The VIF for both features will be very high
      (&gt;10). Fix: drop one of the two features, or use Ridge Regression which handles
      multicollinearity gracefully.'
    wrong_fb: '❌ Multicollinearity''s main harm is to coefficient stability and interpretability,
      not predictions. With two highly correlated features, the model can''t tell
      which one is responsible for the variation in y — so it assigns arbitrary, unstable
      weights to each. VIF quantifies this: VIF &gt; 10 is the red flag. Ridge Regression
      is the standard fix because its L2 penalty regularizes the unstable coefficients.'
  - num_str: QUESTION 4 OF 4
    question: In linear regression, WHICH values must be normally distributed for
      valid statistical inference?
    qid: q38_4
    options:
    - letter: A
      text: The input features X
      is_correct: false
    - letter: B
      text: The target variable y
      is_correct: false
    - letter: C
      text: The residuals (y − ŷ) — not the features or target
      is_correct: true
    - letter: D
      text: The predicted values ŷ
      is_correct: false
    correct_fb: ✅ Correct! This is one of the most common interview misconceptions.
      It's the RESIDUALS that must be approximately normal — not X, not y. Why? Because
      the t-tests on coefficients and confidence intervals assume the error term ε
      ~ N(0, σ²). If you're only using linear regression for prediction (not inference),
      this assumption matters less. But always check the Q-Q plot of residuals.
    wrong_fb: '❌ Common misconception! Normality applies to RESIDUALS (y − ŷ), not
      to features or the target. You can have a skewed y and it''s fine as long as
      the errors around the regression line are approximately normal. Check with:
      plt.hist(residuals) and scipy.stats.probplot(residuals). If residuals are non-normal,
      consider transforming y (log, sqrt) or switching to a GLM.'
  flashcards:
  - front: Lasso vs Ridge Regression?
    back: 'Lasso (L1): Adds absolute weight penalty, leads to sparse feature selection.
      Ridge (L2): Adds squared weight penalty, shrinks weights.'
  - front: R-squared?
    back: 'Proportion of variance in the dependent variable explained by features:
      1 - (SS_res / SS_tot).'
  - front: Mean Squared Error (MSE)?
    back: Average of squared differences between true and predicted values. Highly
      sensitive to outliers.
  - front: MAE vs MSE?
    back: MAE (Mean Absolute Error) uses absolute differences (linear penalty); MSE
      uses squared differences (quadratic penalty for outliers).
  - front: Multicollinearity?
    back: When two or more predictor variables are highly correlated, inflating the
      variance of regression coefficients.
  gotcha:
    title: '⚠️ Gotcha: Gradient Descent Vanishing & Explosions'
    description: Unnormalized input features lead to oscillating gradients and slow
      convergence. Always normalize features before gradient descent.
  takeaways:
