  difficulty: Easy
  badges:
  - label: ⚡ Easy
    variant: b
  xp: 150
  objectives:
  - Derive the OLS (Ordinary Least Squares) closed-form solution using matrix algebra
  - Implement linear regression from scratch using both OLS and gradient descent
  - List and check all 5 assumptions of linear regression (LINE + homoscedasticity)
  - Diagnose model problems using residual plots and Q-Q plots
  - Explain why and when the OLS solution fails — and what to do about it
  checklist:
  - id: chk_38_1
    text: Study the core mathematical and architectural principles of Linear Regression
