    prompt_html: |-
      <p><strong>
                 Implement linear regression on the Boston-equivalent California Housing dataset using: (1) Normal Equation from scratch using NumPy matrix ops, (2) Gradient Descent from scratch (1000 epochs, lr=0.01), (3) sklearn's LinearRegression. Compare all three: print coefficients, training MSE, and test MSE. All three should give nearly identical MSE values.
                </strong></p>
    done_when: All three implementations produce test MSE within 0.01 of each other. Coefficient comparison table printed.
    git_cmd: 'git add linreg_three_ways.py &amp;&amp; git commit -m "feat(day): day44: linear regression OLS vs GD vs sklearn" &amp;&amp; git push'
    sol_id: sol-w6d38t1
    solution_title: ✅ COMPLETE SOLUTION — linear_regression_from_scratch_both_meth.py
    solution_code: "# linear_regression_from_scratch_both_meth.py — Solution\n# Complete solution for: Linear Regression from Scratch — Both Methods\n\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nclass LinearRegressionScratch:\n    \"\"\"Linear Regression using Normal Equation: w = (X^T X)^(-1) X^T y\"\"\"\n    def __init__(self):\n        self.weights = None\n        self.bias = None\n    \n    def fit(self, X, y):\n        X = np.array(X, dtype=np.float64)\n        y = np.array(y, dtype=np.float64)\n        \n        # Add bias column\n        X_b = np.c_[np.ones(X.shape[0]), X]\n        \n        # Normal equation\n        self.theta = np.linalg.pinv(X_b.T @ X_b) @ X_b.T @ y\n        self.bias = self.theta[0]\n        self.weights = self.theta[1:]\n        return self\n    \n    def predict(self, X):\n        X = np.array(X, dtype=np.float64)\n        return X @ self.weights + self.bias\n    \n    def r2_score(self, X, y):\n        y_pred = self.predict(X)\n        ss_res =\
      \ np.sum((y - y_pred) ** 2)\n        ss_tot = np.sum((y - y.mean()) ** 2)\n        return 1 - (ss_res / ss_tot)\n\n# Generate sample data\nnp.random.seed(42)\nX = 2 * np.random.rand(100, 1)\ny = 4 + 3 * X.squeeze() + np.random.randn(100) * 0.5\n\n# Train\nmodel = LinearRegressionScratch()\nmodel.fit(X, y)\nprint(f\"Weights: {model.weights}, Bias: {model.bias:.4f}\")\nprint(f\"R² Score: {model.r2_score(X, y):.4f}\")\nprint(f\"Expected: w≈3.0, b≈4.0\")\n\nif __name__ == '__main__':\n    solve()"
    solution_lang: python
  - title: Full Diagnostic Report
