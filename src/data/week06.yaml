                 Bias-Variance decomposition:
                </strong>
                Error = Bias² + Variance + Noise. Reduce bias with complexity; reduce variance with regularization or more data.
    - |-
      <strong>
                 Diagnosis from error curves:
                </strong>
                train≈test≈high → underfitting; train&lt;&lt;test → overfitting.
    - |-
      <strong>
                 Hyperparameter selection rule:
                </strong>
                Always use cross-validation. Never select model complexity by minimising training error — that always picks the.
    - |-
      <strong>
                 More data fixes variance:
                </strong>
                Adding training data reduces overfitting. It cannot fix underfitting — only a more flexible model can do that.
