  concept_flow:
  - Linear Regression — Deep
  - Polynomial Regression + T
  - Ridge & Lasso Regularisat
  - ElasticNet + Cross-Valida
  - Regression Metrics — Whic
  - SVR + Tree-Based Regressi
  - 'Capstone: End-to-End Hous'
  hinglish: "\U0001F4E2\n         <strong>\n          Ek line mein:\n         </strong>\n\
    \         Ridge aur Lasso regression cost function mein penalties add karke overfitting\
    \ ko rokte hain aur weights ko control mein rakhte hain."
  analogy: 'Ek student exam mein sab kuch ratta maar leta hai (overfitting). Regularization
    aise hai jaise teacher bol de: "Short answer mein explain karo, 10 point baad
    marks kat jayenge" — student ko forced kiya jaata hai ki sirf important cheezein
    likhein, saari details nahi. Ridge bolti hai: "Long answers penalty mein hain."
    Lasso bolti hai: "Kuch points bilkul mat likho — ek hi best concept pe focus karo."'
  theory_html: "<h3 class=\"sh3\">\n       1. Why Regularise? The Shrinkage Intuition\n\
    \      </h3>\n\n<div class=\"math-block\">\n<span class=\"formula\">\n       \
    \ $$OLS Loss = Σ(yᵢ − ŷᵢ)²$$\n       </span>\n<span class=\"formula\">\n     \
    \   $$Ridge Loss = Σ(yᵢ − ŷᵢ)² + α × Σβⱼ²          [L2 penalty — squared coefficients]$$\n\
    \       </span>\n<span class=\"formula\">\n        $$Lasso Loss = Σ(yᵢ − ŷᵢ)²\
    \ + α × Σ|βⱼ|         [L1 penalty — absolute coefficients]$$\n       </span>\n\
    <span class=\"desc\">\n        α (alpha) = regularization strength. α=0 → pure\
    \ OLS. α→∞ → all coefficients → 0.\n       </span>\n</div>\n<div class=\"cb\"\
    >\n<div class=\"cb-head\">\n<span class=\"cb-lang\">\n         python — ridge_lasso_compare.py\n\
    \        </span>\n<div class=\"cb-btns\">\n<button class=\"copy-btn\" onclick=\"\
    copyCode(this)\">\n          copy\n         </button>\n<button class=\"run-btn\"\
    \ onclick=\"runCode(this)\" style=\"margin-left: 4px;\">\n          Run\n    \
    \     </button>\n</div>\n</div>\n<pre><span class=\"kw\">import</span> numpy <span\
    \ class=\"kw\">as</span> np\n<span class=\"kw\">import</span> matplotlib.pyplot\
    \ <span class=\"kw\">as</span> plt\n<span class=\"kw\">from</span> sklearn.linear_model\
    \ <span class=\"kw\">import</span> Ridge, Lasso, LinearRegression, RidgeCV, LassoCV\n\
    <span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span>\
    \ StandardScaler\n<span class=\"kw\">from</span> sklearn.datasets <span class=\"\
    kw\">import</span> fetch_california_housing\n<span class=\"kw\">from</span> sklearn.model_selection\
    \ <span class=\"kw\">import</span> train_test_split\n\ndata = <span class=\"fn\"\
    >fetch_california_housing</span>()\nX = data.data; y = data.target\nX_tr, X_te,\
    \ y_tr, y_te = <span class=\"fn\">train_test_split</span>(X, y, test_size=<span\
    \ class=\"num\">0.2</span>, random_state=<span class=\"num\">42</span>)\nsc =\
    \ <span class=\"fn\">StandardScaler</span>()\nXtr = sc.<span class=\"fn\">fit_transform</span>(X_tr);\
    \ Xte = sc.<span class=\"fn\">transform</span>(X_te)\n\nalphas = [<span class=\"\
    num\">0.001</span>, <span class=\"num\">0.01</span>, <span class=\"num\">0.1</span>,\
    \ <span class=\"num\">1</span>, <span class=\"num\">10</span>, <span class=\"\
    num\">100</span>, <span class=\"num\">1000</span>]\n\n<span class=\"cm\"># Collect\
    \ coefficients for each alpha to plot the regularization path</span>\nridge_coefs\
    \ = [<span class=\"fn\">Ridge</span>(alpha=a).<span class=\"fn\">fit</span>(Xtr,\
    \ y_tr).coef_ <span class=\"kw\">for</span> a <span class=\"kw\">in</span> alphas]\n\
    lasso_coefs = [<span class=\"fn\">Lasso</span>(alpha=a, max_iter=<span class=\"\
    num\">5000</span>).<span class=\"fn\">fit</span>(Xtr, y_tr).coef_ <span class=\"\
    kw\">for</span> a <span class=\"kw\">in</span> alphas]\n\n<span class=\"cm\">#\
    \ === KEY DIFFERENCE: sparsity ===</span>\nridge_zeros = [np.<span class=\"fn\"\
    >sum</span>(c == <span class=\"num\">0</span>) <span class=\"kw\">for</span> c\
    \ <span class=\"kw\">in</span> ridge_coefs]\nlasso_zeros = [np.<span class=\"\
    fn\">sum</span>(c == <span class=\"num\">0</span>) <span class=\"kw\">for</span>\
    \ c <span class=\"kw\">in</span> lasso_coefs]\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Ridge zero coefficients: {ridge_zeros}\"</span>)  <span class=\"\
    cm\"># almost always 0 — Ridge never zeroes out</span>\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"Lasso zero coefficients: {lasso_zeros}\"</span>)  <span class=\"\
    cm\"># grows with alpha — feature selection!</span>\n\n<span class=\"cm\"># ===\
    \ Auto-tune alpha with cross-validation ===</span>\nridge_cv = <span class=\"\
    fn\">RidgeCV</span>(alphas=np.<span class=\"fn\">logspace</span>(-<span class=\"\
    num\">3</span>, <span class=\"num\">3</span>, <span class=\"num\">50</span>),\
    \ cv=<span class=\"num\">5</span>)\nridge_cv.<span class=\"fn\">fit</span>(Xtr,\
    \ y_tr)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"\\nRidgeCV best\
    \ alpha : {ridge_cv.alpha_:.4f}\"</span>)\n<span class=\"fn\">print</span>(<span\
    \ class=\"str\">f\"RidgeCV test MSE   : {np.mean((y_te - ridge_cv.predict(Xte))**2):.4f}\"\
    </span>)\n\nlasso_cv = <span class=\"fn\">LassoCV</span>(alphas=np.<span class=\"\
    fn\">logspace</span>(-<span class=\"num\">3</span>, <span class=\"num\">1</span>,\
    \ <span class=\"num\">50</span>), cv=<span class=\"num\">5</span>, max_iter=<span\
    \ class=\"num\">5000</span>)\nlasso_cv.<span class=\"fn\">fit</span>(Xtr, y_tr)\n\
    <span class=\"fn\">print</span>(<span class=\"str\">f\"\\nLassoCV best alpha :\
    \ {lasso_cv.alpha_:.4f}\"</span>)\n<span class=\"fn\">print</span>(<span class=\"\
    str\">f\"LassoCV test MSE   : {np.mean((y_te - lasso_cv.predict(Xte))**2):.4f}\"\
    </span>)\n<span class=\"fn\">print</span>(<span class=\"str\">f\"Features eliminated:\
    \ {np.sum(lasso_cv.coef_ == 0)}/{X.shape[1]}\"</span>)</pre>\n</div>\n<h3 class=\"\
    sh3\">\n       2. WHY L1 Creates Zeros and L2 Doesn't — The Geometry\n      </h3>\n\
