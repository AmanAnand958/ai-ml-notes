  title: Linear Regression — Deep Dive
  subtitle: Week 4 mein tumne linear regression use kiya. Aaj hum iske andar jaayenge
    — OLS derivation, gradient descent implementation, assumptions check, and residual
    analysis. Ek model use karna alag hai, ek modelsamajhnaalag hai.
