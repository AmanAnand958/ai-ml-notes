  analogy: Data leakage is like a student getting a copy of the final exam questions (test set) during homework study (training). Their study score looks amazing, but their true knowledge is unchecked. (This mirrors how Regression fundamentally operates.)
  theory_html: |-
    <h3 class="sh3">
           1. The Complete Regression Metric Toolkit
          </h3><p style="margin: 0.8rem 0; font-size: 13.5px; line-height: 1.6;">Evaluating continuous regression models requires quantifying both absolute prediction deviations (Mean Absolute Error, MAE) and quadratically penalized outlier errors (Root Mean Squared Error, RMSE), benchmarked against the variance explained ratio ($R^2$ score).</p>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — all_metrics.py
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">from</span> sklearn.metrics <span class="kw">import</span> (mean_squared_error, mean_absolute_error,
                                  r2_score, mean_absolute_percentage_error)

    <span class="cm"># House price prediction (in lakhs ₹)</span>
    y_true = np.<span class="fn">array</span>([<span class="num">50</span>, <span class="num">80</span>, <span class="num">120</span>, <span class="num">200</span>, <span class="num">350</span>])
    y_pred = np.<span class="fn">array</span>([<span class="num">55</span>, <span class="num">75</span>, <span class="num">130</span>, <span class="num">190</span>, <span class="num">280</span>])   <span class="cm"># reasonable predictions</span>
    y_pred_outlier = np.<span class="fn">array</span>([<span class="num">55</span>, <span class="num">75</span>, <span class="num">130</span>, <span class="num">190</span>, <span class="num">50</span>])  <span class="cm"># 1 terrible prediction (350 vs 50)</span>

    <span class="cm"># ── Core metrics ──────────────────────────────────────────────────</span>
    mse   = np.<span class="fn">mean</span>((y_true - y_pred)**2)          <span class="cm"># Mean Squared Error</span>
    rmse  = np.<span class="fn">sqrt</span>(mse)                             <span class="cm"># Root MSE — same unit as y</span>
    mae   = np.<span class="fn">mean</span>(np.<span class="fn">abs</span>(y_true - y_pred))         <span class="cm"># Mean Absolute Error</span>
    mape  = np.<span class="fn">mean</span>(np.<span class="fn">abs</span>((y_true - y_pred) / y_true)) * <span class="num">100</span>  <span class="cm"># % error</span>
    r2    = <span class="fn">r2_score</span>(y_true, y_pred)                 <span class="cm"># R-squared</span>

    <span class="fn">print</span>(<span class="str">"=== Normal Predictions ==="</span>)
    <span class="fn">print</span>(<span class="str">f"  MSE  : {mse:.2f}    ← penalises large errors more"</span>)
    <span class="fn">print</span>(<span class="str">f"  RMSE : {rmse:.2f}   ← same unit as y (lakhs)"</span>)
    <span class="fn">print</span>(<span class="str">f"  MAE  : {mae:.2f}    ← robust to outliers"</span>)
    <span class="fn">print</span>(<span class="str">f"  MAPE : {mape:.2f}%  ← percentage error (businesspeople love this)"</span>)
    <span class="fn">print</span>(<span class="str">f"  R²   : {r2:.4f}    ← fraction of variance explained"</span>)

    <span class="cm"># MSE vs MAE — outlier sensitivity</span>
    mse_out  = np.<span class="fn">mean</span>((y_true - y_pred_outlier)**<span class="num">2</span>)
    mae_out  = np.<span class="fn">mean</span>(np.<span class="fn">abs</span>(y_true - y_pred_outlier))
    <span class="fn">print</span>(<span class="str">f"\n=== With 1 Outlier Prediction (350 → 50) ==="</span>)
    <span class="fn">print</span>(<span class="str">f"  MSE change : {mse:.2f} → {mse_out:.2f}  ({(mse_out-mse)/mse*100:.0f}% increase!)"</span>)
    <span class="fn">print</span>(<span class="str">f"  MAE change : {mae:.2f} → {mae_out:.2f}  ({(mae_out-mae)/mae*100:.0f}% increase — much less)"</span>)
    <span class="cm"># MSE squares the outlier error (300²=90000) — gets dominated</span>
    <span class="cm"># MAE just takes |error|=300 — stays proportional</span>

    <span class="cm"># Adjusted R² — penalises unnecessary features</span>
    n, p = <span class="num">100</span>, <span class="num">5</span>  <span class="cm"># 100 samples, 5 features</span>
    r2_adj = <span class="num">1</span> - (<span class="num">1</span> - r2) * (n - <span class="num">1</span>) / (n - p - <span class="num">1</span>)
    <span class="fn">print</span>(<span class="str">f"\nAdjusted R² (5 features, 100 samples): {r2_adj:.4f}"</span>)
    <span class="cm"># Adjusted R² DECREASES when you add irrelevant features — R² never decreases</span></code></pre>
    </div>
    <h3 class="sh3">
           2. R² — The Most Misunderstood Metric
          </h3>
    <div class="math-block">
    <span class="formula">
            $$R² = 1 − SS_res / SS_tot$$
           </span>
    <span class="desc">
            SS_res = Σ(yᵢ − ŷᵢ)² (residual sum of squares — model error)
           </span>
    <span class="desc">
            SS_tot = Σ(yᵢ − ȳ)² (total sum of squares — variance in data)
           </span>
    <span class="formula">
            $$R² = 0: model no better than predicting the mean$$
           </span>
    <span class="formula">
            $$R² < 0: model WORSE than predicting the mean! (always possible with wrong model)$$
           </span>
    <span class="formula">
            $$R² = 1: perfect predictions$$
           </span>
    </div>
    <div class="table-wrap" style="overflow-x: auto; margin: 1.2rem 0; width: 100%;"><table class="concept-table">
    <tr>
    <th>
             METRIC
            </th>
    <th>
             FORMULA
            </th>
    <th>
             UNIT
            </th>
    <th>
             OUTLIER SENSITIVITY
            </th>
    <th>
             BEST FOR
            </th>
    </tr>
    <tr>
    <td>
    <strong>
              MSE
             </strong>
    </td>
    <td>
             Σ(y−ŷ)²/n
            </td>
    <td>
             y² (confusing!)
            </td>
    <td>
             Very High (squares errors)
            </td>
    <td>
             When large errors are very costly (structural engineering)
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              RMSE
             </strong>
    </td>
    <td>
             √MSE
            </td>
    <td>
             Same as y
            </td>
    <td>
             High
            </td>
    <td>
             Same as MSE but interpretable — most common
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              MAE
             </strong>
    </td>
    <td>
             Σ|y−ŷ|/n
            </td>
    <td>
             Same as y
            </td>
    <td>
             Low (robust)
            </td>
    <td>
             When outliers exist and large errors aren't catastrophic
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              MAPE
             </strong>
    </td>
    <td>
             Σ|y−ŷ|/(y)/n × 100%
            </td>
    <td>
             %
            </td>
    <td>
             Medium (fails if y≈0)
            </td>
    <td>
             Business reporting, demand forecasting (% error is intuitive)
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              R²
             </strong>
    </td>
    <td>
             1 − SS_res/SS_tot
            </td>
    <td>
             Unitless [−∞, 1]
            </td>
    <td>
             High
            </td>
    <td>
             Comparing models on same dataset. NOT across datasets.
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              Adjusted R²
             </strong>
    </td>
    <td>
             1 − (1−R²)(n−1)/(n−p−1)
            </td>
    <td>
             Unitless
            </td>
    <td>
             High
            </td>
    <td>
             Feature selection — penalises adding irrelevant features
            </td>
    </tr>
    <tr>
    <td>
    <strong>
              Huber Loss
             </strong>
    </td>
    <td>
             MSE if |e|≤δ, else MAE
            </td>
    <td>
             Same as y²
            </td>
    <td>
             Low (controlled)
            </td>
    <td>
             When outliers exist but you still want MSE's differentiability
            </td>
    </tr>
    </table></div>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — huber_loss.py
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
