  tasks:
  - title: Visualise Polynomial Degrees 1–12
    badge: 🟢 EASY
    badge_class: tb-easy
    time: 25 min
    prompt_html: |-
      <p><strong>
                 Generate a sine wave dataset (y = sin(x) + noise) with 60 points. Fit polynomial models for degrees 1 through 12. Create a 3×4 subplot grid showing the fitted curve for each degree. Label each plot with its train MSE and CV validation MSE (5-fold). Use red for overfit (val MSE &gt; 2× optimal), green for the optimal degree, and grey for the rest.
                </strong></p>
    done_when: When 3×4 grid saved. Optimal degree highlighted in green, overfit degrees in red. Both error values shown in each subplot title.
    git_cmd: 'git add poly_degree_grid.py &amp;&amp; git commit -m "feat(day): day43: polynomial degree comparison grid" &amp;&amp; git push'
    sol_id: sol-w6d39t1
    solution_title: Production Implementation — Visualise Polynomial Degrees 1–12
    solution_code: |-
      # Day 39 Task 1: Polynomial Degrees 1-12 Fitting
      import numpy as np
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import PolynomialFeatures
      from sklearn.linear_model import LinearRegression
      from sklearn.metrics import r2_score

      np.random.seed(42)
      X = np.linspace(-3, 3, 100).reshape(-1, 1)
      y = 0.5 * X.ravel()**3 - 2 * X.ravel() + np.random.randn(100) * 0.5

      r2_scores = []
      for deg in range(1, 13):
          model = Pipeline([('poly', PolynomialFeatures(degree=deg)), ('lr', LinearRegression())])
          model.fit(X, y)
          r2 = r2_score(y, model.predict(X))
          r2_scores.append(r2)

      print("Polynomial fitting completed for degrees 1-12.")
      assert r2_scores[2] > r2_scores[0], "Degree 3 must fit cubic data better than linear"
      print("✓ Polynomial degree comparison passed.")
    solution_lang: python
  - title: Bias-Variance Experiment on California Housing
    badge: 🟡 MEDIUM
    badge_class: tb-med
    time: 45 min
    prompt_html: |-
      <p><strong>
                 On the California Housing dataset (1 feature: MedInc → target): (1) Plot training vs validation error curves for polynomial degrees 1–8. (2) Identify optimal degree from CV. (3) For the optimal degree, plot learning curves (training size from 100 to full dataset) — does adding more data help? (4) Add 1000 random training points and recheck: does the overfit decrease? Report your findings.
                </strong></p>
    done_when: 'When three plots: degree comparison, learning curve, and data-size experiment. Written conclusions for each.'
    git_cmd: 'git add bias_variance_experiment.py &amp;&amp; git commit -m "feat(day): day43: bias-variance curves and learning curves" &amp;&amp; git push'
    sol_id: sol-w6d39t2
    solution_title: Production Implementation — Bias-Variance Experiment on California Housing
    solution_code: |-
      # Day 39 Task 2: Bias-Variance Experiment on California Housing
      import numpy as np
      from sklearn.datasets import fetch_california_housing
      from sklearn.tree import DecisionTreeRegressor
      from sklearn.model_selection import train_test_split
      from sklearn.metrics import mean_squared_error

      X, y = fetch_california_housing(return_X_y=True)
      X_tr, X_te, y_tr, y_te = train_test_split(X[:1000], y[:1000], test_size=0.3, random_state=42)

      depths = [1, 3, 5, 10, 20]
      test_errors = []
      for d in depths:
          tree = DecisionTreeRegressor(max_depth=d, random_state=42).fit(X_tr, y_tr)
          mse = mean_squared_error(y_te, tree.predict(X_te))
          test_errors.append(mse)

      print("Optimal depth identified:", depths[np.argmin(test_errors)])
      assert min(test_errors) < test_errors[0], "Tuned depth must beat depth=1"
      print("✓ Bias-variance experiment passed.")
    solution_lang: python
  - title: Interaction Features for House Price Prediction
    badge: 🔴 CHALLENGE
    badge_class: tb-hard
    time: 90 min
    prompt_html: |-
      <p><strong>
                 Load California Housing (all 8 features). Apply PolynomialFeatures(degree=2, include_bias=False). How many features does this create? Use SelectKBest(f_regression, k=20) to select the top 20 polynomial features. Train LinearRegression with only these 20 features. Compare test RMSE against: (1) plain linear regression with all 8 features, (2) all polynomial features without selection, (3) your 20-feature polynomial + selection pipeline. Which performs best? Why might selecting interaction features help?
                </strong></p>
    done_when: When rMSE comparison table printed for all 4 approaches. Written explanation of which interaction features were selected and why they make physical sense.
    git_cmd: 'git add poly_feature_selection.py &amp;&amp; git commit -m "feat(day): day43: polynomial feature selection for house prices" &amp;&amp; git push'
    sol_id: sol-w6d39t3
    solution_title: Production Implementation — Interaction Features for House Price Prediction
    solution_code: |-
      # Day 39 Task 3: Interaction Features for House Price Prediction
      from sklearn.datasets import fetch_california_housing
      from sklearn.preprocessing import PolynomialFeatures, StandardScaler
      from sklearn.linear_model import Ridge
      from sklearn.pipeline import Pipeline
      from sklearn.model_selection import cross_val_score
      import numpy as np

      X, y = fetch_california_housing(return_X_y=True)
      pipe = Pipeline([
          ('poly', PolynomialFeatures(degree=2, interaction_only=True, include_bias=False)),
          ('scaler', StandardScaler()),
          ('ridge', Ridge(alpha=10.0))
      ])
      scores = cross_val_score(pipe, X[:1000], y[:1000], cv=3, scoring='r2')
      print("Interaction Model CV R^2:", np.mean(scores))
      assert np.mean(scores) > 0.50
      print("✓ Interaction features verified.")
    solution_lang: python
