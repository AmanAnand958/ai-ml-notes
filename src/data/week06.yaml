- id: '43'
  day_num: 43
  title: SVR + Tree-Based Regression
  subtitle: Linear models assume linearity. Real-world relationships often aren't.
    Support Vector Regression, Decision Tree Regression, Random Forest Regression,
    and Gradient Boosting are powerful non-linear alternatives — aur kabhi kabhi they
    dramatically outperform even well-tuned linear models.
  time_estimate: 5 hours
  difficulty: Medium
  badges:
  - label: ⚡ Medium
    variant: o
  xp: 150
  objectives:
  - Explain SVR's "epsilon tube" concept and why it's different from standard regression
  - Implement and tune SVR with RBF kernel on a non-linear dataset
  - Explain how Decision Tree Regression makes predictions (leaf node means)
  - Compare Random Forest and Gradient Boosting Regression — when to use each
  - Build a model comparison pipeline that fairly evaluates all 5 regression approaches
    on the same dataset
  checklist:
