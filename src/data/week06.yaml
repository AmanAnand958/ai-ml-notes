  analogy: 'Think of it like this: Socho ek pipe se guzarna. SVR ek "tube" banata hai data ke around — tube ki width ε (epsilon) hai. Jo points tube ke andar hain unhe model ignore karta hai (zero loss). Sirf jo points tube ke bahar hain unhe penalise karta hai. Yahi SVR ka magic hai — small errors ko bilkul tolerate karna, sirf large errors pe dhyan dena. (This mirrors how Tree fundamentally operates.)'
  theory_html: |-
    <p><h3 class="sh3">
           1. Support Vector Regression (SVR)
          </h3>

    <div class="math-block">
    <span class="formula">
            $$SVR minimizes: ||w||²/2 + C × Σ(ξᵢ + ξᵢ*)$$
           </span>
    <span class="desc">
            Subject to: |yᵢ − ŷᵢ| ≤ ε + slack (ξ ≥ 0)
           </span>
    <span class="desc">
            ε = tube width (tolerance), C = regularization (smaller C = more tolerance), kernel = non-linear transformation
           </span>
    </div>
    <div class="cb">
    <div class="cb-head">
    <span class="cb-lang">
             python — svr_comparison.py
            </span>
    <div class="cb-btns">
    <button class="copy-btn" onclick="copyCode(this)">
              copy
             </button>
    <button class="run-btn" onclick="runCode(this)" style="margin-left: 4px;">
              Run
             </button>
    </div>
    </div>
    <pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np
    <span class="kw">import</span> matplotlib.pyplot <span class="kw">as</span> plt
    <span class="kw">from</span> sklearn.svm <span class="kw">import</span> SVR
    <span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span> StandardScaler
    <span class="kw">from</span> sklearn.pipeline <span class="kw">import</span> Pipeline
    <span class="kw">from</span> sklearn.model_selection <span class="kw">import</span> GridSearchCV

    np.random.<span class="fn">seed</span>(<span class="num">42</span>)
    <span class="cm"># Highly non-linear data: y = sin(x) + 0.5*cos(3x) + noise</span>
    X = np.<span class="fn">sort</span>(<span class="num">6</span> * np.random.<span class="fn">rand</span>(<span class="num">150</span>, <span class="num">1</span>) - <span class="num">3</span>, axis=<span class="num">0</span>)
    y = np.<span class="fn">sin</span>(X).<span class="fn">ravel</span>() + <span class="num">0.5</span> * np.<span class="fn">cos</span>(<span class="num">3</span>*X).<span class="fn">ravel</span>() + np.random.<span class="fn">randn</span>(<span class="num">150</span>) * <span class="num">0.15</span>

    <span class="cm"># SVR with RBF kernel — requires scaling!</span>
    svr_pipe = <span class="fn">Pipeline</span>([
        (<span class="str">'scaler'</span>, <span class="fn">StandardScaler</span>()),
        (<span class="str">'svr'</span>, <span class="fn">SVR</span>(kernel=<span class="str">'rbf'</span>))
    ])

    <span class="cm"># Tune C, gamma, epsilon</span>
    param_grid = {
        <span class="str">'svr__C'</span>:       [<span class="num">0.1</span>, <span class="num">1</span>, <span class="num">10</span>, <span class="num">100</span>],
        <span class="str">'svr__gamma'</span>:   [<span class="str">'scale'</span>, <span class="str">'auto'</span>, <span class="num">0.1</span>, <span class="num">1</span>],
        <span class="str">'svr__epsilon'</span>: [<span class="num">0.01</span>, <span class="num">0.1</span>, <span class="num">0.5</span>]
    }
    grid = <span class="fn">GridSearchCV</span>(svr_pipe, param_grid, cv=<span class="num">5</span>, scoring=<span class="str">'neg_mean_squared_error'</span>,
                        n_jobs=-<span class="num">1</span>)
    grid.<span class="fn">fit</span>(X, y)
    <span class="fn">print</span>(<span class="str">f"Best SVR params: {grid.best_params_}"</span>)
    <span class="fn">print</span>(<span class="str">f"Best CV MSE:     {-grid.best_score_:.4f}"</span>)

    <span class="cm"># Key SVR parameters:</span>
    <span class="cm"># C (regularization): larger C → fit training data more strictly (less tolerance)</span>
    <span class="cm"># epsilon: width of the ε-tube — errors within ε get 0 penalty</span>
    <span class="cm"># gamma (RBF): controls "reach" of each training point</span>
    <span class="cm">#   gamma='scale' → 1/(n_features × X.var()) — good default</span>
    <span class="cm">#   high gamma → tight fit (potential overfit); low gamma → smooth curve</span>

    <span class="cm"># Plot result</span>
    X_plot = np.<span class="fn">linspace</span>(-<span class="num">3</span>, <span class="num">3</span>, <span class="num">300</span>).<span class="fn">reshape</span>(-<span class="num">1</span>, <span class="num">1</span>)
    y_svr = grid.<span class="fn">predict</span>(X_plot)
    plt.<span class="fn">figure</span>(figsize=(<span class="num">9</span>, <span class="num">4</span>))
    plt.<span class="fn">scatter</span>(X, y, s=<span class="num">15</span>, alpha=<span class="num">0.5</span>, color=<span class="str">'#6c8cff'</span>, label=<span class="str">'Data'</span>)
    plt.<span class="fn">plot</span>(X_plot, y_svr, <span class="str">'#e56b8c'</span>, lw=<span class="num">2</span>, label=<span class="str">'SVR (RBF)'</span>)
    plt.<span class="fn">plot</span>(X_plot, np.<span class="fn">sin</span>(X_plot.<span class="fn">ravel</span>()) + <span class="num">0.5</span>*np.<span class="fn">cos</span>(<span class="num">3</span>*X_plot.<span class="fn">ravel</span>()),
             <span class="str">'#4fd1a5'</span>, lw=<span class="num">1</span>, linestyle=<span class="str">'--'</span>, label=<span class="str">'True function'</span>)
    plt.<span class="fn">legend</span>(); plt.<span class="fn">title</span>(<span class="str">'SVR with RBF Kernel — Non-linear Regression'</span>)
    plt.<span class="fn">tight_layout</span>(); plt.<span class="fn">savefig</span>(<span class="str">'svr_fit.png'</span>, dpi=<span class="num">150</span>)</code></pre>
